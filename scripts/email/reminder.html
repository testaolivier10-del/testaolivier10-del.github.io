<!-- The study reminder email.

     Deliberately the plainest thing in scripts/email/. The other four are
     transactional and have to look like they came from a real service; this
     one arrives uninvited-ish in somebody's evening, and the more it looks
     like marketing the faster it gets filtered. One sentence, one link, one
     way out.

     {{TITLE}} {{BODY}} {{URL}} {{UNSUB}} are filled in by worker/src/email.js.
     The title and body are written by the student's own browser — see
     assets/reminders.js — so this template never composes a sentence itself
     and can never quote a number the browser did not just verify. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background:#F3F6F4;">
  <!-- Preheader: the grey line a mail client shows after the subject. Left to
       chance it shows "View this email in your browser" or the unsubscribe
       text, which is a poor summary of a message this short. -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{BODY}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F6F4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFFFFF;border-radius:16px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <tr>
            <td style="font-size:13px;font-weight:700;color:#127264;letter-spacing:.04em;text-transform:uppercase;padding-bottom:14px;">
              LevlPrep
            </td>
          </tr>
          <tr>
            <td style="font-size:21px;font-weight:800;color:#17241F;line-height:1.3;padding-bottom:8px;">
              {{TITLE}}
            </td>
          </tr>
          <tr>
            <td style="font-size:15px;font-weight:400;color:#526C66;line-height:1.55;padding-bottom:24px;">
              {{BODY}}
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:26px;">
              <a href="{{URL}}" style="display:inline-block;background:#127264;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none;padding:13px 24px;border-radius:12px;">Pick up where you left off</a>
            </td>
          </tr>
          <tr>
            <td style="font-size:12px;font-weight:400;color:#8A9A95;line-height:1.6;border-top:1px solid #E4ECE8;padding-top:18px;">
              You turned these on in your LevlPrep settings. They only arrive when
              you actually have work waiting, and they stop by themselves if you
              stop studying.<br><br>
              <a href="{{UNSUB}}" style="color:#526C66;">Stop sending these</a> &mdash; one click, no sign-in.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
