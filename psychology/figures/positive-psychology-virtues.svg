ness,</text><text x="645" y="152.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">social intelligence</text><rect x="30" y="214" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#084F78" stroke-width="2.5"/><rect x="30" y="214" width="230" height="40" rx="10" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="30" y="240" width="230" height="14" rx="0" fill="#084F78" stroke="none" stroke-width="1.5"/><text x="145" y="241" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Justice</text><text x="145" y="286" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">teamwork, fairness,</text><text x="145" y="302.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">leadership</text><rect x="280" y="214" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/><rect x="280" y="214" width="230" height="40" rx="10" fill="#D55E00" stroke="none" stroke-width="1.5"/><rect x="280" y="240" width="230" height="14" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="395" y="241" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Temperance</text><text x="395" y="286" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">forgiveness, humility,</text><text x="395" y="302.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">prudence, self-regulation</text><rect x="530" y="214" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/><rect x="530" y="214" width="230" height="40" rx="10" fill="#009E73" stroke="none" stroke-width="1.5"/><rect x="530" y="240" width="230" height="14" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="645" y="241" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Transcendence</text><text x="645" y="286" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">gratitude, hope, humor,</tex