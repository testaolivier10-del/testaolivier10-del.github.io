<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="820" height="510" role="img" aria-labelledby="explaining-disorders-diathesis-t explaining-disorders-diathesis-d" font-family="Arial, Helvetica, sans-serif">
<title id="explaining-disorders-diathesis-t">The diathesis-stress model</title>
<desc id="explaining-disorders-diathesis-d">Three stacked bars against a dashed threshold line. Each bar is vulnerability (cerulean, bottom) plus stress (vermillion, top). Person 1 has high vulnerability and small stress and passes the threshold, so a disorder is more likely. Person 2 has low vulnerability and the same small stress and stays below it. Person 3 has low vulnerability but large stress and passes the threshold. A conceptual model, not data.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="820" height="510" fill="#FFFFFF"/>
<text x="410" y="34" font-size="20" font-weight="bold" fill="#1F2A28" text-anchor="middle">The diathesis-stress model</text><text x="410" y="58" font-size="14" font-weight="normal" fill="#6B7472" text-anchor="middle">A disorder appears when vulnerability and stress together pass a threshold (a model, not data).</text><line x1="60" y1="136" x2="780" y2="136" stroke="#1F2A28" stroke-width="2" stroke-dasharray="8 6"/><rect x="232" y="92" width="106" height="40" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="285" y="108" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Threshold</text><text x="285" y="125" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">for a disorder</text><line x1="60" y1="370" x2="780" y2="370" stroke="#1F2A28" stroke-width="1.5"/><rect x="105" y="188" width="90" height="182" rx="0" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="105" y="110" width="90" height="78" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="150" y="284" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Vulnerability</text><text x="150" y="154" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stress</text><text x="150" y="394" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Person 1</text><text x="150" y="414" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">high vulnerability,</text><text x="150" y="431" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">small stress</text><text x="150" y="456" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="middle">Above the threshold:</text><text x="150" y="473" font-size="13" font-weight="normal" fill="#D55E00" text-anchor="middle">a disorder is more likely</text><rect x="355" y="318" width="90" height="52" rx="0" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="355" y="240" width="90" height="78" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="400" y="349" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Vulnerability</text><text x="400" y="284" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stress</text><text x="400" y="394" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Person 2</text><text x="400" y="414" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">low vulnerability,</text><text x="400" y="431" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">the same small stress</text><text x="400" y="456" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">Below the threshold:</text><text x="400" y="473" font-size="13" font-weight="normal" fill="#009E73" text-anchor="middle">a disorder is less likely</text><rect x="605" y="318" width="90" height="52" rx="0" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="605" y="110" width="90" height="208" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="650" y="349" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Vulnerability</text><text x="650" y="219" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stress</text><text x="650" y="394" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Person 3</text><text x="650" y="414" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">low vulnerability,</text><text x="650" y="431" font-size="13" font-weight="normal" fill="#6B7472" text-anchor="middle">large stress</text><text x="650" y="456" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="middle">Above the threshold:</text><text x="650" y="473" font-size="13" font-weight="normal" fill="#D55E00" text-anchor="middle">a disorder is more likely</text>
</svg>
