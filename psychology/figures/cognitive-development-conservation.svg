<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The liquid conservation task and Piaget’s stages</title>
<desc id="d">Top: two equal glasses of water; one is poured into a tall, thin glass and the child is asked which has more. A typical 4-year-old says the tall one has more, focusing on height alone. A typical 8-year-old says they are the same because the water was only poured. Bottom: Piaget’s four stages with typical ages: sensorimotor, birth to about 2 (object permanence); preoperational, about 2 to 7 (make-believe, egocentrism); concrete operational, about 7 to 11 (conservation, logic about real things); formal operational, about 12 and up (abstract, hypothetical thinking). Later research finds the skills often appear earlier.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">The liquid conservation task</text><text x="110" y="70" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">1. Two equal glasses</text><rect x="50" y="160" width="50" height="60" rx="2" fill="#9CCBE6" stroke="none" stroke-width="1.5"/><path d="M 50 130 L 50 220 L 100 220 L 100 130" fill="none" stroke="#1F2A28" stroke-width="2.5"/><rect x="120" y="160" width="50" height="60" rx="2" fill="#9CCBE6" stroke="none" stroke-width="1.5"/><path d="M 120 130 L 120 220 L 170 220 L 170 130" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="110" y="246" font-size="13" fill="#1F2A28" text-anchor="middle">Child agrees: same amount</text><line x1="196" y1="160" x2="290" y2="160" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#arr)"/><text x="243" y="145" font-size="13" fill="#1F2A28" text-anchor="middle">pour one</text><text x="390" y="70" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">2. Poured into a tall, thin glass</text><rect x="330" y="160" width="50" height="60" rx="2" fill="#9CCBE6" stroke="none" stroke-width="1.5"/><path d="M 330 130 L 330 220 L 380 220 L 380 130" fill="none" stroke="#1F2A28" stroke-width="2.5"/><rect x="410" y="100" width="25" height="120" rx="2" fill="#9CCBE6" stroke="none" stroke-width="1.5"/><path d="M 410 80 L 410 220 L 435 220 L 435 80" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="390" y="246" font-size="13" fill="#1F2A28" text-anchor="middle">&quot;Which has more?&quot;</text><rect x="500" y="70" width="284" height="78" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/><text x="514" y="94" font-size="14" fill="#D55E00" font-weight="700">Typical 4-year-old</text><text x="514" y="116" font-size="13" fill="#1F2A28">&quot;The tall one has more!&quot; Focuses on</text><text x="514" y="134" font-size="13" fill="#1F2A28">height alone; does not reverse the pour.</text><rect x="500" y="162" width="284" height="78" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="514" y="186" font-size="14" fill="#00704F" font-weight="700">Typical 8-year-old</text><text x="514" y="208" font-size="13" fill="#1F2A28">&quot;The same. You only poured it.&quot; Sees</text><text x="514" y="226" font-size="13" fill="#1F2A28">that taller is also thinner.</text><text x="24" y="292" font-size="14" fill="#1F2A28" font-weight="700">Piaget’s four stages (typical ages; later research finds the skills often appear earlier)</text><rect x="16" y="306" width="188" height="140" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><text x="110" y="334" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Sensorimotor</text><text x="110" y="358" font-size="13" fill="#1F2A28" text-anchor="middle">birth to about 2</text><text x="110" y="390" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">object permanence</text><rect x="209.3" y="306" width="188" height="140" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><text x="303.3" y="334" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Preoperational</text><text x="303.3" y="358" font-size="13" fill="#1F2A28" text-anchor="middle">about 2 to 7</text><text x="303.3" y="390" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">make-believe,</text><text x="303.3" y="408" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">egocentrism</text><rect x="402.6" y="306" width="188" height="140" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="496.6" y="334" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Concrete operational</text><text x="496.6" y="358" font-size="13" fill="#1F2A28" text-anchor="middle">about 7 to 11</text><text x="496.6" y="390" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">conservation, logic</text><text x="496.6" y="408" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">about real things</text><rect x="595.9" y="306" width="188" height="140" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><text x="689.9" y="334" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Formal operational</text><text x="689.9" y="358" font-size="13" fill="#1F2A28" text-anchor="middle">about 12 and up</text><text x="689.9" y="390" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">abstract, hypothetical</text><text x="689.9" y="408" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">thinking</text>
</svg>
