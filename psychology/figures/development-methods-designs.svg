<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cross-sectional and longitudinal designs</title>
<desc id="d">Top panel: a cross-sectional study tests four different groups, aged 20, 40, 60 and 80, all in the same year, 2025; it is fast but mixes up age with birth year. Bottom panel: a longitudinal study tests one group in 2025 at age 20, then again in 2045, 2065 and 2085; the group shrinks as people drop out. It shows change within the same people but is slow. Neither design alone shows cause and effect.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">Two ways to study how people change with age</text><rect x="16" y="52" width="768" height="168" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="32" y="80" font-size="16" fill="#084F78" font-weight="700">Cross-sectional study: different people, tested once</text><circle cx="94" cy="108.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 79.9 144 Q 79.9 121.1 94 121.1 Q 108.1 121.1 108.1 144 Z" fill="#084F78"/><circle cx="120" cy="108.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 105.9 144 Q 105.9 121.1 120 121.1 Q 134.1 121.1 134.1 144 Z" fill="#084F78"/><circle cx="146" cy="108.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 131.9 144 Q 131.9 121.1 146 121.1 Q 160.1 121.1 160.1 144 Z" fill="#084F78"/><text x="120" y="168" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Age 20 group</text><circle cx="244" cy="108.8" r="8.8" fill="#D55E00" stroke="none" stroke-width="1.5"/><path d="M 229.9 144 Q 229.9 121.1 244 121.1 Q 258.1 121.1 258.1 144 Z" fill="#D55E00"/><circle cx="270" cy="108.8" r="8.8" fill="#D55E00" stroke="none" stroke-width="1.5"/><path d="M 255.9 144 Q 255.9 121.1 270 121.1 Q 284.1 121.1 284.1 144 Z" fill="#D55E00"/><circle cx="296" cy="108.8" r="8.8" fill="#D55E00" stroke="none" stroke-width="1.5"/><path d="M 281.9 144 Q 281.9 121.1 296 121.1 Q 310.1 121.1 310.1 144 Z" fill="#D55E00"/><text x="270" y="168" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Age 40 group</text><circle cx="394" cy="108.8" r="8.8" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M 379.9 144 Q 379.9 121.1 394 121.1 Q 408.1 121.1 408.1 144 Z" fill="#009E73"/><circle cx="420" cy="108.8" r="8.8" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M 405.9 144 Q 405.9 121.1 420 121.1 Q 434.1 121.1 434.1 144 Z" fill="#009E73"/><circle cx="446" cy="108.8" r="8.8" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M 431.9 144 Q 431.9 121.1 446 121.1 Q 460.1 121.1 460.1 144 Z" fill="#009E73"/><text x="420" y="168" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Age 60 group</text><circle cx="544" cy="108.8" r="8.8" fill="#CC79A7" stroke="none" stroke-width="1.5"/><path d="M 529.9 144 Q 529.9 121.1 544 121.1 Q 558.1 121.1 558.1 144 Z" fill="#CC79A7"/><circle cx="570" cy="108.8" r="8.8" fill="#CC79A7" stroke="none" stroke-width="1.5"/><path d="M 555.9 144 Q 555.9 121.1 570 121.1 Q 584.1 121.1 584.1 144 Z" fill="#CC79A7"/><circle cx="596" cy="108.8" r="8.8" fill="#CC79A7" stroke="none" stroke-width="1.5"/><path d="M 581.9 144 Q 581.9 121.1 596 121.1 Q 610.1 121.1 610.1 144 Z" fill="#CC79A7"/><text x="570" y="168" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Age 80 group</text><text x="768" y="198" font-size="13" fill="#1F2A28" text-anchor="end">All four groups tested in the same year (2025)</text><text x="32" y="198" font-size="13" fill="#1F2A28" font-style="italic">Fast and cheap; age is mixed up with birth year</text><rect x="16" y="236" width="768" height="188" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="32" y="264" font-size="16" fill="#084F78" font-weight="700">Longitudinal study: the same people, tested again and again</text><circle cx="94" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 79.9 328 Q 79.9 305.1 94 305.1 Q 108.1 305.1 108.1 328 Z" fill="#084F78"/><circle cx="120" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 105.9 328 Q 105.9 305.1 120 305.1 Q 134.1 305.1 134.1 328 Z" fill="#084F78"/><circle cx="146" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 131.9 328 Q 131.9 305.1 146 305.1 Q 160.1 305.1 160.1 328 Z" fill="#084F78"/><text x="120" y="352" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">2025: age 20</text><line x1="172" y1="306" x2="218" y2="306" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><circle cx="244" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 229.9 328 Q 229.9 305.1 244 305.1 Q 258.1 305.1 258.1 328 Z" fill="#084F78"/><circle cx="270" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 255.9 328 Q 255.9 305.1 270 305.1 Q 284.1 305.1 284.1 328 Z" fill="#084F78"/><circle cx="296" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 281.9 328 Q 281.9 305.1 296 305.1 Q 310.1 305.1 310.1 328 Z" fill="#084F78"/><text x="270" y="352" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">2045: age 40</text><line x1="322" y1="306" x2="368" y2="306" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><circle cx="407" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 392.9 328 Q 392.9 305.1 407 305.1 Q 421.1 305.1 421.1 328 Z" fill="#084F78"/><circle cx="433" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 418.9 328 Q 418.9 305.1 433 305.1 Q 447.1 305.1 447.1 328 Z" fill="#084F78"/><text x="420" y="352" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">2065: age 60</text><line x1="472" y1="306" x2="518" y2="306" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><circle cx="557" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 542.9 328 Q 542.9 305.1 557 305.1 Q 571.1 305.1 571.1 328 Z" fill="#084F78"/><circle cx="583" cy="292.8" r="8.8" fill="#084F78" stroke="none" stroke-width="1.5"/><path d="M 568.9 328 Q 568.9 305.1 583 305.1 Q 597.1 305.1 597.1 328 Z" fill="#084F78"/><text x="570" y="352" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">2085: age 80</text><text x="32" y="384" font-size="13" fill="#1F2A28" font-style="italic">Shows change within the same people; slow, costly, and some people drop out</text><text x="32" y="406" font-size="13" fill="#1F2A28">Both designs measure people as they are, so neither one by itself shows cause and effect.</text>
</svg>
