<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="psychodynamic-humanistic-views-t psychodynamic-humanistic-views-d" font-family="Arial, Helvetica, sans-serif">
<title id="psychodynamic-humanistic-views-t">Two views of personality</title>
<desc id="psychodynamic-humanistic-views-d">Two panels. Left, the psychodynamic view: an iceberg with a small conscious tip above the awareness line and a large unconscious part below, holding wishes, fears and memories that still shape behavior; defense mechanisms push threatening material below the line; assessed with projective tests such as the Rorschach and TAT. Right, the humanistic view: unconditional positive regard leads to an honest view of yourself, which frees the self-actualizing tendency to grow toward your potential.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="800" height="430" fill="#FFFFFF"/>
<text x="200" y="34" font-size="18" font-weight="bold" fill="#084F78" text-anchor="middle">Psychodynamic view</text><rect x="30" y="150" width="340" height="250" rx="0" fill="#D7E9F4" stroke="none" stroke-width="1.5"/><line x1="30" y1="150" x2="370" y2="150" stroke="#084F78" stroke-width="2"/><text x="36" y="143" font-size="11" font-weight="normal" fill="#084F78" text-anchor="start">awareness line</text><path d="M150,150 L185,82 L215,96 L245,150 Z" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><path d="M150,150 L95,250 L120,330 L200,388 L290,340 L320,250 L245,150 Z" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2" stroke-dasharray="6 4"/><text x="198" y="136" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">conscious</text><text x="205" y="240" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">unconscious</text><text x="205" y="262" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">wishes, fears and memories</text><text x="205" y="277.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">outside awareness that</text><text x="205" y="293.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">still shape behavior</text><rect x="30" y="50" width="112" height="56" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="86" y="74.4" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">defense</text><text x="86" y="90" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">mechanisms</text><line x1="86" y1="106" x2="150" y2="150" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="200" y="418" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">Assessed with projective tests (Rorschach, TAT)</text><line x1="400" y1="24" x2="400" y2="410" stroke="#C9D1CE" stroke-width="1.5"/><text x="600" y="34" font-size="18" font-weight="bold" fill="#084F78" text-anchor="middle">Humanistic view</text><rect x="450" y="70" width="300" height="70" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.5"/><text x="600" y="93.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">unconditional positive regard</text><text x="600" y="109.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">accepted as a person,</text><text x="600" y="124.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">even when behavior is judged</text><line x1="600" y1="140" x2="600" y2="200" stroke="#084F78" stroke-width="2.5" marker-end="url(#ar-cer)"/><rect x="450" y="205" width="300" height="64" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="600" y="225.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">honest view of yourself</text><text x="600" y="241.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">no need to hide or distort</text><text x="600" y="256.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">experience to stay accepted</text><line x1="600" y1="269" x2="600" y2="318" stroke="#009E73" stroke-width="2.5" marker-end="url(#ar-green)"/><rect x="450" y="322" width="300" height="64" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="600" y="342.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">self-actualizing tendency</text><text x="600" y="358.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">free to grow toward</text><text x="600" y="373.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">your potential</text><text x="600" y="418" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">Conditional acceptance blocks growth</text>
</svg>
