<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="thinking-strategies-t thinking-strategies-d" font-family="Arial, Helvetica, sans-serif">
<title id="thinking-strategies-t">Algorithms and heuristics</title>
<desc id="thinking-strategies-d">A problem branches into two strategies. Left: an algorithm, a step-by-step procedure that is slow and effortful but guarantees a solution if followed, for example trying every four-digit code from 0000 to 9999 on a lock. Right: a heuristic, a mental shortcut that is fast and easy and usually works but can mislead, for example trying the owner's birthday as the code first. A note under the heuristic defines the representativeness heuristic (judging by how well something matches a prototype) and the availability heuristic (judging by how easily examples come to mind). A note under the algorithm says both can be blocked by mental set (sticking with a method that worked before) and functional fixedness (seeing an object only in its usual use).</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="880" height="420" fill="#FFFFFF"/>
<text x="440" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Two ways to solve a problem</text><rect x="330" y="48" width="220" height="46" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.8"/><text x="440" y="76" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">A problem to solve</text><line x1="400" y1="94" x2="230" y2="128" stroke="#084F78" stroke-width="2" marker-end="url(#ar-cer)"/><line x1="480" y1="94" x2="650" y2="128" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="60" y="130" width="340" height="66" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="230" y="158.7" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Algorithm</text><text x="230" y="178.2" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">a step-by-step procedure</text><rect x="480" y="130" width="340" height="66" rx="8" fill="#FBE6D9" stroke="#D55E00" stroke-width="1.8"/><text x="650" y="158.7" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Heuristic</text><text x="650" y="178.2" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">a mental shortcut</text><text x="76" y="228" font-size="13.5" fill="#1F2A28">Slow and effortful</text><text x="76" y="249" font-size="13.5" fill="#1F2A28">Guarantees a solution if followed</text><text x="76" y="270" font-size="13.5" fill="#1F2A28">Example: trying every 4-digit code</text><text x="76" y="291" font-size="13.5" fill="#1F2A28">from 0000 to 9999 on a lock</text><text x="496" y="228" font-size="13.5" fill="#1F2A28">Fast and easy</text><text x="496" y="249" font-size="13.5" fill="#1F2A28">Usually works, but can mislead</text><text x="496" y="270" font-size="13.5" fill="#1F2A28">Example: trying the owner's birthday</text><text x="496" y="291" font-size="13.5" fill="#1F2A28">as the code first</text><rect x="480" y="322" width="340" height="84" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="5 4"/><text x="494" y="344" font-size="12.5" fill="#1F2A28">Representativeness: judging by how well</text><text x="494" y="362" font-size="12.5" fill="#1F2A28">something matches a prototype.</text><text x="494" y="380" font-size="12.5" fill="#1F2A28">Availability: judging by how easily</text><text x="494" y="398" font-size="12.5" fill="#1F2A28">examples come to mind.</text><rect x="60" y="322" width="340" height="84" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6" stroke-dasharray="5 4"/><text x="74" y="344" font-size="12.5" fill="#1F2A28">Both can be blocked by mental set</text><text x="74" y="362" font-size="12.5" fill="#1F2A28">(sticking with a method that worked</text><text x="74" y="380" font-size="12.5" fill="#1F2A28">before) and functional fixedness</text><text x="74" y="398" font-size="12.5" fill="#1F2A28">(seeing an object only in its usual use).</text>
</svg>
