<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="brain-lobes-t brain-lobes-d" font-family="Arial, Helvetica, sans-serif">
<title id="brain-lobes-t">The left hemisphere of the brain seen from the side</title>
<desc id="brain-lobes-d">A side view of the left hemisphere, front of the head on the left. The frontal lobe fills the front, with the motor cortex as a strip at its back edge. Behind the central sulcus are the somatosensory cortex and the parietal lobe. The occipital lobe is at the back. The temporal lobe lies below the lateral fissure. Broca's area is in the lower frontal lobe and Wernicke's area in the upper back of the temporal lobe. The cerebellum sits under the back of the brain and the brainstem runs down from the middle of its underside.</desc>
