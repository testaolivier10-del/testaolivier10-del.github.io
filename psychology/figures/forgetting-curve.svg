<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="forgetting-curve-t forgetting-curve-d" font-family="Arial, Helvetica, sans-serif">
<title id="forgetting-curve-t">The forgetting curve</title>
<desc id="forgetting-curve-d">A line graph of Ebbinghaus's 1885 results. The vertical axis is savings, the percent of the original learning time saved when he relearned a list of nonsense syllables. Savings were 58.2% after 20 minutes, 44.2% after 1 hour, 35.8% after about 9 hours, 33.7% after 1 day, 27.8% after 2 days, 25.4% after 6 days and 21.1% after 31 days. The curve drops steeply in the first hours and then levels into a slow tail. Time is on a square-root scale so both parts show.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="840" height="440" fill="#FFFFFF"/>
<text x="420" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">The forgetting curve (Ebbinghaus, 1885)</text><line x1="100" y1="340" x2="780" y2="340" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="344" font-size="12" fill="#1F2A28" text-anchor="end">0%</text><line x1="100" y1="284" x2="780" y2="284" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="288" font-size="12" fill="#1F2A28" text-anchor="end">20%</text><line x1="100" y1="228" x2="780" y2="228" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="232" font-size="12" fill="#1F2A28" text-anchor="end">40%</text><line x1="100" y1="172" x2="780" y2="172" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="176" font-size="12" fill="#1F2A28" text-anchor="end">60%</text><line x1="100" y1="116" x2="780" y2="116" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="120" font-size="12" fill="#1F2A28" text-anchor="end">80%</text><line x1="100" y1="60" x2="780" y2="60" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="64" font-size="12" fill="#1F2A28" text-anchor="end">100%</text><line x1="100" y1="340" x2="780" y2="340" stroke="#1F2A28" stroke-width="1.6"/><line x1="100" y1="60" x2="100" y2="340" stroke="#1F2A28" stroke-width="1.6"/><text x="440" y="398" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Time since learning (square-root scale)</text><text x="52" y="200" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700" transform="rotate(-90 52 200)">Savings: % of relearning time saved</text><line x1="114.4" y1="340" x2="114.4" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="106.4" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">20 min</text><line x1="124.9" y1="340" x2="124.9" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="134.9" y="374" font-size="11.5" fill="#1F2A28" text-anchor="middle">1 h</text><line x1="174" y1="340" x2="174" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="174" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">9 h</text><line x1="222.1" y1="340" x2="222.1" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="222.1" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">1 day</text><line x1="272.7" y1="340" x2="272.7" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="272.7" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">2 days</text><line x1="399.2" y1="340" x2="399.2" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="399.2" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">6 days</text><line x1="780" y1="340" x2="780" y2="345" stroke="#1F2A28" stroke-width="1.2"/><text x="780" y="360" font-size="11.5" fill="#1F2A28" text-anchor="middle">31 days</text><circle cx="100" cy="60" r="4.5" fill="#6B7370" stroke="none" stroke-width="1.4"/><text x="110" y="64" font-size="12" fill="#6B7370">just learned (100%)</text><path d="M100 60 L114.4 177 L124.9 216.2 L174 239.8 L222.1 245.6 L272.7 262.2 L399.2 268.9 L780 280.9" fill="none" stroke="#084F78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="114.4" cy="177" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="118.4" y="167" font-size="12" fill="#084F78" font-weight="700">58.2%</text><circle cx="124.9" cy="216.2" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="128.9" y="206.2" font-size="12" fill="#084F78" font-weight="700">44.2%</text><circle cx="174" cy="239.8" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="178" y="229.8" font-size="12" fill="#084F78" font-weight="700">35.8%</text><circle cx="222.1" cy="245.6" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="226.1" y="235.6" font-size="12" fill="#084F78" font-weight="700">33.7%</text><circle cx="272.7" cy="262.2" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="276.7" y="252.2" font-size="12" fill="#084F78" font-weight="700">27.8%</text><circle cx="399.2" cy="268.9" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="403.2" y="258.9" font-size="12" fill="#084F78" font-weight="700">25.4%</text><circle cx="780" cy="280.9" r="5" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="784" y="270.9" font-size="12" fill="#084F78" font-weight="700">21.1%</text><text x="486.2" y="144" font-size="13" fill="#1F2A28" text-anchor="middle">Steep drop in the first hours,</text><text x="486.2" y="166.4" font-size="13" fill="#1F2A28" text-anchor="middle">then a slow, level tail</text><text x="420" y="422" font-size="12" fill="#6B7370" text-anchor="middle">Ebbinghaus (1885) learned lists of nonsense syllables and measured how much faster he relearned them.</text>
</svg>
