<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="neural-firing-neuron-t neural-firing-neuron-d" font-family="Arial, Helvetica, sans-serif">
<title id="neural-firing-neuron-t">A neuron and a synapse</title>
<desc id="neural-firing-neuron-d">A neuron drawn left to right. Branching dendrites lead into the cell body, which holds the nucleus. The axon leaves the cell body and is wrapped in segments of myelin sheath. It ends in axon terminals. A green arrow shows the signal traveling from the cell body toward the terminals. An enlarged panel shows one synapse: the sending axon terminal holds vesicles of neurotransmitter, some vesicles release molecules into the synaptic gap, the molecules bind to receptor sites on the receiving dendrite, and a purple arrow shows reuptake back into the sending terminal.</desc>
