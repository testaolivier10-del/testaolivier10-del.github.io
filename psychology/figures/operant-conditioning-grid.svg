<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="operant-conditioning-grid-t operant-conditioning-grid-d" font-family="Arial, Helvetica, sans-serif">
<title id="operant-conditioning-grid-t">Reinforcement and punishment, positive and negative</title>
<desc id="operant-conditioning-grid-d">A two by two grid. Columns: add a stimulus (positive) or remove a stimulus (negative). Rows: the behavior increases (reinforcement) or decreases (punishment). Positive reinforcement: praise after homework, homework happens more. Negative reinforcement: buckling up stops the beeping, buckling up happens more. Positive punishment: extra chores after lying, lying happens less. Negative punishment: phone taken after curfew, late nights happen less.</desc>
<defs><marker id="operant-conditioning-grid-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="operant-conditioning-grid-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="operant-conditioning-grid-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="operant-conditioning-grid-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="470" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Four consequences: add or remove, increase or decrease</text><text x="300" y="92" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Add a stimulus (positive)</text><text x="580" y="92" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Remove a stimulus (negative)</text><text x="85" y="220" font-size="15" font-weight="bold" fill="#009E73" text-anchor="middle">Behavior</text><text x="85" y="240" font-size="15" font-weight="bold" fill="#009E73" text-anchor="middle">increases</text><text x="85" y="390" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">Behavior</text><text x="85" y="410" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">decreases</text><rect x="165" y="105" width="270" height="150" rx="8" fill="#E1F3EC" stroke="#009E73" stroke-width="2"/><text x="300" y="138" font-size="17" font-weight="bold" fill="#009E73" text-anchor="middle">Positive reinforcement</text><text x="300" y="168" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Add something wanted.</text><text x="300" y="186.2" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Praise after homework;</text><text x="300" y="204.4" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">homework happens more.</text><rect x="445" y="105" width="270" height="150" rx="8" fill="#E1F3EC" stroke="#009E73" stroke-width="2"/><text x="580" y="138" font-size="17" font-weight="bold" fill="#009E73" text-anchor="middle">Negative reinforcement</text><text x="580" y="168" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Remove something unpleasant.</text><text x="580" y="186.2" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Buckling up stops the beeping;</text><text x="580" y="204.4" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">buckling up happens more.</text><rect x="165" y="275" width="270" height="150" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="300" y="308" font-size="17" font-weight="bold" fill="#D55E00" text-anchor="middle">Positive punishment</text><text x="300" y="338" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Add something unpleasant.</text><text x="300" y="356.2" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Extra chores after lying;</text><text x="300" y="374.4" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">lying happens less.</text><rect x="445" y="275" width="270" height="150" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="580" y="308" font-size="17" font-weight="bold" fill="#D55E00" text-anchor="middle">Negative punishment</text><text x="580" y="338" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Remove something wanted.</text><text x="580" y="356.2" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Phone taken after curfew;</text><text x="580" y="374.4" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">late nights happen less.</text>
</svg>
