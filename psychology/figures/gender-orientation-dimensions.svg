<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sex, gender identity, gender roles and sexual orientation</title>
<desc id="d">Four separate bars. Biological sex (what body?): chromosomes, hormones and anatomy, and some people have intersex traits. Gender identity (who am I?): a person’s inner sense of being a woman, a man, both or neither. Gender roles (what is expected?): a culture’s expectations for how women and men act, dress and work. Sexual orientation (attracted to whom?): a lasting pattern of romantic or sexual attraction. Knowing one answer does not tell you the others.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">Four different questions about a person</text><rect x="16" y="56" width="768" height="66" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="2"/><rect x="16" y="56" width="196" height="66" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="114" y="86" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Biological sex</text><text x="114" y="107" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">What body?</text><text x="228" y="95" font-size="14" fill="#1F2A28">Chromosomes, hormones and anatomy (some people have intersex traits).</text><rect x="16" y="134" width="768" height="66" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><rect x="16" y="134" width="196" height="66" rx="8" fill="#084F78" stroke="none" stroke-width="1.5"/><text x="114" y="164" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gender identity</text><text x="114" y="185" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">Who am I?</text><text x="228" y="173" font-size="14" fill="#1F2A28">A person’s inner sense of being a woman, a man, both or neither.</text><rect x="16" y="212" width="768" height="66" rx="8" fill="#F4F7F9" stroke="#009E73" stroke-width="2"/><rect x="16" y="212" width="196" height="66" rx="8" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="114" y="242" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gender roles</text><text x="114" y="263" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">What is expected?</text><text x="228" y="251" font-size="14" fill="#1F2A28">A culture’s expectations for how women and men act, dress and work.</text><rect x="16" y="290" width="768" height="66" rx="8" fill="#F4F7F9" stroke="#CC79A7" stroke-width="2"/><rect x="16" y="290" width="196" height="66" rx="8" fill="#CC79A7" stroke="none" stroke-width="1.5"/><text x="114" y="320" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Sexual orientation</text><text x="114" y="341" font-size="13" fill="#FFFFFF" text-anchor="middle" font-style="italic">Attracted to whom?</text><text x="228" y="329" font-size="14" fill="#1F2A28">A lasting pattern of romantic or sexual attraction to others.</text><text x="24" y="384" font-size="14" fill="#1F2A28" font-style="italic">Knowing a person’s answer to one question does not tell you their answers to the others.</text>
</svg>
