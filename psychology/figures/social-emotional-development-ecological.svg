<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ecological systems theory</title>
<desc id="d">Nested ovals around a child. Microsystem, closest: family, classroom, friends. Mesosystem: the links between them, such as parents talking with teachers. Exosystem: settings the child is not in that still matter, such as a parent’s workplace, the school board and media. Macrosystem, outermost: culture, values, laws and the economy. An arrow along the bottom shows the chronosystem: every layer changes over time, through life changes and historical events.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">Ecological systems: layers of influence around a child</text><ellipse cx="300" cy="270" rx="250" ry="205" fill="#F3E6EF" stroke="#CC79A7" stroke-width="2.5"/><ellipse cx="300" cy="270" rx="195" ry="158" fill="#FBE9DF" stroke="#D55E00" stroke-width="2.5"/><ellipse cx="300" cy="270" rx="140" ry="112" fill="#DDF2EA" stroke="#009E73" stroke-width="2.5"/><ellipse cx="300" cy="270" rx="86" ry="68" fill="#E3F0F8" stroke="#084F78" stroke-width="2.5"/><circle cx="300" cy="270" r="30" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="300" y="275" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Child</text><text x="300" y="93.5" font-size="14" fill="#8E3F72" text-anchor="middle" font-weight="700">Macrosystem</text><text x="300" y="140" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="700">Exosystem</text><text x="300" y="185" font-size="14" fill="#00704F" text-anchor="middle" font-weight="700">Mesosystem</text><text x="300" y="226" font-size="14" fill="#084F78" text-anchor="middle" font-weight="700">Microsystem</text><rect x="574" y="70" width="210" height="68" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="584" y="92" font-size="14" fill="#1F2A28" font-weight="700">Microsystem</text><text x="584" y="111" font-size="12" fill="#1F2A28">family, classroom, friends</text><rect x="574" y="148" width="210" height="68" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="584" y="170" font-size="14" fill="#1F2A28" font-weight="700">Mesosystem</text><text x="584" y="189" font-size="12" fill="#1F2A28">links: parents talk with</text><text x="584" y="204" font-size="12" fill="#1F2A28">teachers</text><rect x="574" y="226" width="210" height="68" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="2"/><text x="584" y="248" font-size="14" fill="#1F2A28" font-weight="700">Exosystem</text><text x="584" y="267" font-size="12" fill="#1F2A28">parent’s workplace, school</text><text x="584" y="282" font-size="12" fill="#1F2A28">board, media</text><rect x="574" y="304" width="210" height="68" rx="8" fill="#F3E6EF" stroke="#CC79A7" stroke-width="2"/><text x="584" y="326" font-size="14" fill="#1F2A28" font-weight="700">Macrosystem</text><text x="584" y="345" font-size="12" fill="#1F2A28">culture, values, laws, the</text><text x="584" y="360" font-size="12" fill="#1F2A28">economy</text><rect x="574" y="382" width="210" height="68" rx="8" fill="#F4F7F9" stroke="#1F2A28" stroke-width="1.5"/><text x="584" y="404" font-size="14" fill="#1F2A28" font-weight="700">Chronosystem</text><text x="584" y="423" font-size="12" fill="#1F2A28">time: life changes and</text><text x="584" y="438" font-size="12" fill="#1F2A28">historical events</text><line x1="40" y1="498" x2="560" y2="498" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="488" font-size="13" fill="#1F2A28" font-style="italic">Chronosystem: every layer changes over time</text>
</svg>
