<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="forgetting-interference-t forgetting-interference-d" font-family="Arial, Helvetica, sans-serif">
<title id="forgetting-interference-t">Proactive and retroactive interference</title>
<desc id="forgetting-interference-d">Two rows on a timeline from old learning on the left to new learning on the right. Top row, proactive interference: an arrow points forward from the old learning (last year's locker code) to the new learning (this year's locker code); the old code keeps coming out, so old learning blocks new. Bottom row, retroactive interference: an arrow points backward from the new learning (French words this year) to the old learning (Spanish words from 9th grade); the new French words crowd out the Spanish, so new learning blocks old.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="860" height="340" fill="#FFFFFF"/>
<text x="430" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Interference: which way does it point?</text><text x="40" y="70" font-size="15" fill="#084F78" font-weight="700">Proactive interference: OLD blocks NEW (pro = forward)</text><rect x="40" y="84" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.8"/><text x="155" y="108.2" font-size="13" fill="#1F2A28" text-anchor="middle">Old learning</text><text x="155" y="125.1" font-size="13" fill="#1F2A28" text-anchor="middle">last year's locker code</text><rect x="590" y="84" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.8"/><text x="705" y="108.2" font-size="13" fill="#1F2A28" text-anchor="middle">New learning</text><text x="705" y="125.1" font-size="13" fill="#1F2A28" text-anchor="middle">this year's locker code</text><text x="430" y="100" font-size="12" fill="#6B7370" text-anchor="middle">time</text><line x1="278" y1="112" x2="582" y2="112" stroke="#084F78" stroke-width="3.2" marker-end="url(#ar-cer)"/><text x="430" y="134" font-size="13" fill="#084F78" text-anchor="middle" font-weight="700">the old code keeps coming out</text><text x="40" y="200" font-size="15" fill="#D55E00" font-weight="700">Retroactive interference: NEW blocks OLD (retro = backward)</text><rect x="40" y="214" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.8"/><text x="155" y="238.2" font-size="13" fill="#1F2A28" text-anchor="middle">Old learning</text><text x="155" y="255.1" font-size="13" fill="#1F2A28" text-anchor="middle">Spanish words from 9th grade</text><rect x="590" y="214" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.8"/><text x="705" y="238.2" font-size="13" fill="#1F2A28" text-anchor="middle">New learning</text><text x="705" y="255.1" font-size="13" fill="#1F2A28" text-anchor="middle">French words this year</text><text x="430" y="230" font-size="12" fill="#6B7370" text-anchor="middle">time</text><line x1="582" y1="242" x2="278" y2="242" stroke="#D55E00" stroke-width="3.2" marker-end="url(#ar-verm)"/><text x="430" y="264" font-size="13" fill="#D55E00" text-anchor="middle" font-weight="700">the new French words crowd out the Spanish</text>
</svg>
