<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="brain-inner-t brain-inner-d" font-family="Arial, Helvetica, sans-serif">
<title id="brain-inner-t">Structures inside the brain, seen from the middle</title>
<desc id="brain-inner-d">The brain cut down the middle, front of the head on the left. The corpus callosum is an arched band joining the two hemispheres. Below it sits the thalamus, and below and in front of the thalamus the small hypothalamus, with the pituitary gland hanging beneath it. The amygdala and hippocampus lie deeper, inside the temporal lobe (drawn dashed). The brainstem runs down to the spinal cord, with the medulla at its base and the reticular activating system running through its core. The cerebellum sits behind the brainstem. The prefrontal cortex is at the front and the reward center (nucleus accumbens) lies deep below the front of the corpus callosum.</desc>
