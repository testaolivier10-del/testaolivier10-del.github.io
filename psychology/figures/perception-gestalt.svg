<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="perception-gestalt-t perception-gestalt-d" font-family="Arial, Helvetica, sans-serif">
<title id="perception-gestalt-t">Four Gestalt principles</title>
<desc id="perception-gestalt-d">Four panels. Proximity: dots set close together in pairs are seen as three columns of pairs. Similarity: an evenly spaced grid of dots in alternating blue and orange rows is seen as rows of the same color. Closure: a broken circle and a square drawn with gaps are seen as a whole circle and a whole square. Figure-ground: a white vase shape on a black background can be seen as a vase (the figure) or as two black faces in profile looking at each other; what counts as figure and ground flips.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="860" height="380" fill="#FFFFFF"/>
<text x="430" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Gestalt principles: the brain groups parts into wholes</text><rect x="20" y="50" width="190" height="250" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="115" y="76" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Proximity</text><text x="115" y="324" font-size="12.5" fill="#1F2A28" text-anchor="middle">Dots close together</text><text x="115" y="341" font-size="12.5" fill="#1F2A28" text-anchor="middle">form 3 columns of pairs</text><rect x="230" y="50" width="190" height="250" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="325" y="76" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Similarity</text><text x="325" y="324" font-size="12.5" fill="#1F2A28" text-anchor="middle">Same color forms rows,</text><text x="325" y="341" font-size="12.5" fill="#1F2A28" text-anchor="middle">though spacing is equal</text><rect x="440" y="50" width="190" height="250" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="535" y="76" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Closure</text><text x="535" y="324" font-size="12.5" fill="#1F2A28" text-anchor="middle">Gaps are filled in:</text><text x="535" y="341" font-size="12.5" fill="#1F2A28" text-anchor="middle">you see a circle and a square</text><rect x="650" y="50" width="190" height="250" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="745" y="76" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Figure-ground</text><text x="745" y="324" font-size="12.5" fill="#1F2A28" text-anchor="middle">A vase (figure) or two</text><text x="745" y="341" font-size="12.5" fill="#1F2A28" text-anchor="middle">faces: the ground flips</text><circle cx="58" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="58" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="58" cy="184" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="58" cy="220" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="58" cy="256" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="76" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="76" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="76" cy="184" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="76" cy="220" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="76" cy="256" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="108" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="108" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="108" cy="184" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="108" cy="220" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="108" cy="256" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="126" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="126" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="126" cy="184" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="126" cy="220" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="126" cy="256" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="158" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="158" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="158" cy="184" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="158" cy="220" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="158" cy="256" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="176" cy="112" r="6" fill="#1F2A28" stroke="none" stroke-width="1.4"/><circle cx="176" cy="148" r="6" fill="#1F2A28" stroke="none" stroke-wid