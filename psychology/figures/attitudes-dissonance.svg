<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="attitudes-dissonance-t attitudes-dissonance-d" font-family="Arial, Helvetica, sans-serif">
<title id="attitudes-dissonance-t">Cognitive dissonance and three ways to reduce it</title>
<desc id="attitudes-dissonance-d">An attitude (vaping is harmful) and an action (I vape every day) clash, producing discomfort called dissonance. Three arrows lead to ways of reducing it: change the attitude (it is not that harmful), change the action (I am quitting), or add a justification (it helps my stress). A note says dissonance is strongest when the action was freely chosen and has no outside excuse.</desc>
<defs><marker id="attitudes-dissonance-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="attitudes-dissonance-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="attitudes-dissonance-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="attitudes-dissonance-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="440" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Cognitive dissonance: when actions and attitudes clash</text><rect x="40" y="80" width="230" height="110" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="155" y="115" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Attitude</text><text x="155" y="140" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">"Vaping is harmful."</text><rect x="40" y="240" width="230" height="110" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="155" y="275" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Action</text><text x="155" y="300" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">"I vape every day."</text><line x1="275" y1="135" x2="335" y2="195" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#attitudes-dissonance-ar)"/><line x1="275" y1="295" x2="335" y2="235" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#attitudes-dissonance-ar)"/><rect x="340" y="160" width="180" height="110" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="430" y="198" font-size="16" font-weight="bold" fill="#D55E00" text-anchor="middle">Discomfort</text><text x="430" y="222" font-size="14" font-weight="normal" fill="#D55E00" text-anchor="middle">(dissonance)</text><text x="430" y="244" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">wants to be reduced</text><line x1="525" y1="190" x2="575" y2="110" stroke="#084F78" stroke-width="2.5" marker-end="url(#attitudes-dissonance-arC)"/><rect x="580" y="70" width="210" height="76" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="685" y="101" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">Change the attitude</text><text x="685" y="123" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">"It is not that harmful."</text><line x1="525" y1="215" x2="575" y2="215" stroke="#084F78" stroke-width="2.5" marker-end="url(#attitudes-dissonance-arC)"/><rect x="580" y="177" width="210" height="76" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="685" y="208" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">Change the action</text><text x="685" y="230" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">"I am quitting."</text><line x1="525" y1="240" x2="575" y2="318" stroke="#084F78" stroke-width="2.5" marker-end="url(#attitudes-dissonance-arC)"/><rect x="580" y="284" width="210" height="76" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="685" y="315" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">Add a justification</text><text x="685" y="337" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">"It helps my stress."</text><text x="410" y="412" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">Dissonance is strongest when the action was freely chosen and has no outside excuse.</text>
</svg>
