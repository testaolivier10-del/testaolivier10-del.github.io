<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="attribution-biases-t attribution-biases-d" font-family="Arial, Helvetica, sans-serif">
<title id="attribution-biases-t">Dispositional and situational attributions and three biases</title>
<desc id="attribution-biases-d">Two boxes: a dispositional attribution explains behavior by the person (she failed because she is lazy); a situational attribution explains it by the circumstances (she failed because the test was unfair). Below, three biases: the fundamental attribution error, over-crediting the person when judging others; the actor-observer bias, pointing to the situation for my actions and to the person for yours; the self-serving bias, crediting myself for success and the situation for failure.</desc>
<defs><marker id="attribution-biases-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="attribution-biases-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="attribution-biases-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="attribution-biases-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="500" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Explaining behavior: the person or the situation?</text><rect x="60" y="60" width="330" height="92" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="225" y="92" font-size="16" font-weight="bold" fill="#084F78" text-anchor="middle">Dispositional attribution</text><text x="225" y="118" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">"She failed because she is lazy."</text><text x="225" y="138" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="middle">(traits, effort, ability)</text><rect x="430" y="60" width="330" height="92" rx="8" fill="#E1F3EC" stroke="#009E73" stroke-width="2"/><text x="595" y="92" font-size="16" font-weight="bold" fill="#009E73" text-anchor="middle">Situational attribution</text><text x="595" y="118" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">"She failed because the test was unfair."</text><text x="595" y="138" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="middle">(circumstances, luck, other people)</text><rect x="60" y="175" width="700" height="92" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="80" y="207" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Fundamental attribution error (judging others)</text><text x="80" y="233" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="start">We over-credit the person and under-credit the situation when we explain</text><text x="80" y="251.2" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="start">someone else's behavior.</text><rect x="60" y="285" width="700" height="92" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="80" y="317" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Actor-observer bias (me versus you)</text><text x="80" y="343" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="start">For my own actions I point to the situation; for yours I point to you.</text><rect x="60" y="395" width="700" height="92" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="80" y="427" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Self-serving bias (my wins and my losses)</text><text x="80" y="453" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="start">My success is my doing (person); my failure is bad luck (situation).</text><line x1="225" y1="152" x2="225" y2="172" stroke="#084F78" stroke-width="2"/><line x1="595" y1="152" x2="595" y2="172" stroke="#009E73" stroke-width="2"/>
</svg>
