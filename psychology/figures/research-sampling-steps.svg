h="2.4"/><circle cx="140.1" cy="262.1" r="8" fill="#D55E00" stroke="none" stroke-width="2.4"/><circle cx="169.3" cy="258.6" r="8" fill="#084F78" stroke="none" stroke-width="2.4"/><circle cx="198.8" cy="257.6" r="8" fill="#084F78" stroke="none" stroke-width="2.4"/><circle cx="233" cy="257.6" r="8" fill="#084F78" stroke="none" stroke-width="2.4"/><circle cx="261.4" cy="261.6" r="8" fill="#084F78" stroke="#1F2A28" stroke-width="2.4"/><text x="165" y="316" font-size="13" fill="#1F2A28" text-anchor="middle">Step 1. RANDOM SAMPLING</text><text x="165" y="334" font-size="13" fill="#1F2A28" text-anchor="middle">Every member has the same chance</text><text x="165" y="352" font-size="13" fill="#1F2A28" text-anchor="middle">of being chosen (outlined dots).</text><text x="165" y="370" font-size="13" fill="#1F2A28" text-anchor="middle">It decides WHO is studied.</text><text x="165" y="396" font-size="13" fill="#084F78" text-anchor="middle" font-weight="700">It lets results generalize to the population.</text><line x1="310" y1="180" x2="370" y2="180" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="380" y="120" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="455" y="112" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Sample (12 people)</text><circle cx="405" cy="145" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="438" cy="145" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="471" cy="145" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="504" cy="145" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="405" cy="180" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="438" cy="180" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="471" cy="180" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="504" cy="180" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="405" cy="215" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="438" cy="215" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="471" cy="215" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="504" cy="215" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><line x1="530" y1="160" x2="590" y2="120" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><line x1="530" y1="200" x2="590" y2="240" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="600" y="70" width="220" height="90" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.6"/><text x="710" y="62" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Group 1 (treatment)</text><rect x="600" y="200" width="220" height="90" rx="8" fill="#FBE6D9" stroke="#D55E00" stroke-width="1.6"/><text x="710" y="192" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Group 2 (control)</text><circle cx="640" cy="95" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="710" cy="95" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="780" cy="95" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="640" cy="135" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="710" cy="135" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="780" cy="135" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="640" cy="225" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="710" cy="225" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="780" cy="225" r="8" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="640" cy="265" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><circle cx="710" cy="265" r="8" fill="#D55E00" stroke="none" stroke-width="1.4"/><circle cx="780" cy="265" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="710" y="316" font-size="13" fill="#1F2A28" text-anchor="middle">Step 2. RANDOM ASSIGNMENT</text><text x="710" y="334" font-size="13" fill="#1F2A28" text-anchor="middle">Chance decides which condition</text><text x="710" y="352" font-size="13" fill="#1F2A28" text-anchor="middle">each person in the sample gets.</text><text x="710" y="370" font-size="13" fill="#1F2A28" text-anchor="middle">It decides WHICH GROUP.</text><text x="710" y="396" font-size="13" fill="#084F78" text-anchor="middle" font-weight="700">It lets an experiment claim cause and effect.</text><text x="430" y="422" font-size="12" fill="#6B7370" text-anchor="middle">A study can use either step, both, or neither. Colors stand for kinds of people (for example, age groups).</text>
</svg>
