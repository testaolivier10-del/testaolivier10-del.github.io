<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="emotion-sequences-t emotion-sequences-d" font-family="Arial, Helvetica, sans-serif">
<title id="emotion-sequences-t">Three sequences for emotion</title>
<desc id="emotion-sequences-d">Three rows, each starting from the same event, a dog running at you. Row 1, arousal first, then the feeling: the body becomes aroused (heart pounds, you tremble), you notice the arousal and feel fear. Row 2, arousal and feeling at the same time: the brain signals body arousal and the feeling of fear at once, and neither causes the other. Row 3, arousal plus a cognitive appraisal, then the feeling: the body is aroused, you label the arousal as "this dog is dangerous", and then you feel fear.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="800" height="470" fill="#FFFFFF"/>
<text x="20" y="40" font-size="14" font-weight="bold" fill="#084F78" text-anchor="start">1. Arousal first, then the feeling</text><rect x="20" y="52" width="120" height="64" rx="8" fill="#EEF1F0" stroke="#1F2A28" stroke-width="1.5"/><text x="80" y="72.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Event</text><text x="80" y="88.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a dog runs</text><text x="80" y="103.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">at you</text><line x1="144" y1="84" x2="176" y2="84" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="180" y="52" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="255" y="72.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Body arousal</text><text x="255" y="88.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">heart pounds,</text><text x="255" y="103.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">you tremble</text><line x1="334" y1="84" x2="366" y2="84" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="370" y="52" width="200" height="64" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.5"/><text x="470" y="72.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Emotion</text><text x="470" y="88.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">you notice the arousal</text><text x="470" y="103.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">and feel fear</text><text x="20" y="180" font-size="14" font-weight="bold" fill="#084F78" text-anchor="start">2. Arousal and feeling at the same time</text><rect x="20" y="192" width="120" height="64" rx="8" fill="#EEF1F0" stroke="#1F2A28" stroke-width="1.5"/><text x="80" y="212.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Event</text><text x="80" y="228.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a dog runs</text><text x="80" y="243.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">at you</text><line x1="144" y1="224" x2="176" y2="224" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="180" y="192" width="330" height="64" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.5"/><text x="345" y="212.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Brain signals both at once</text><text x="345" y="228.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">body arousal and the feeling of fear,</text><text x="345" y="243.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">neither causes the other</text><text x="20" y="320" font-size="14" font-weight="bold" fill="#084F78" text-anchor="start">3. Arousal plus a cognitive appraisal, then the feeling</text><rect x="20" y="332" width="120" height="64" rx="8" fill="#EEF1F0" stroke="#1F2A28" stroke-width="1.5"/><text x="80" y="352.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Event</text><text x="80" y="368.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a dog runs</text><text x="80" y="383.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">at you</text><line x1="144" y1="364" x2="176" y2="364" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="180" y="332" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="245" y="360.4" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Body arousal</text><text x="245" y="376" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">heart pounds</text><line x1="314" y1="364" x2="346" y2="364" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="350" y="332" width="190" height="64" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="445" y="352.6" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Cognitive appraisal</text><text x="445" y="368.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">you label the arousal:</text><text x="445" y="383.8" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">"this dog is dangerous"</text><line x1="544" y1="364" x2="576" y2="364" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="580" y="332" width="120" height="64" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.5"/><text x="640" y="360.4" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Emotion</text><text x="640" y="376" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">fear</text><text x="20" y="452" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start" font-style="italic">Tests ask you to match a scenario to a sequence, not to a theory name.</text>
</svg>
