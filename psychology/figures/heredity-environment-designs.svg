<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Twin studies and adoption studies</title>
<desc id="d">Left panel, twin study: identical twins share all their genes; fraternal twins share about half, like other siblings. Both kinds grow up in the same home at the same time. If identical twins are more alike on a trait than fraternal twins, genes contribute to differences in that trait. Right panel, adoption study: an adopted child shares genes with the biological parents and a home with the adoptive parents. Being more like the biological parents is evidence for heredity; being more like the adoptive parents is evidence for environment. A note says most traits show both.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="860" height="420" fill="#FFFFFF"/>
<text x="430" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Separating heredity and environment</text><rect x="30" y="50" width="390" height="340" rx="8" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.6"/><text x="225" y="76" font-size="16" fill="#084F78" text-anchor="middle" font-weight="700">Twin study</text><circle cx="95" cy="118" r="11" fill="#084F78" stroke="none" stroke-width="1.4"/><path d="M79 156 Q95 126 111 156 Z" fill="#084F78" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><circle cx="140" cy="118" r="11" fill="#084F78" stroke="none" stroke-width="1.4"/><path d="M124 156 Q140 126 156 156 Z" fill="#084F78" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><text x="118" y="180" font-size="13" fill="#1F2A28" text-anchor="middle">Identical twins</text><text x="118" y="197" font-size="13" fill="#1F2A28" text-anchor="middle">share all</text><text x="118" y="214" font-size="13" fill="#1F2A28" text-anchor="middle">their genes</text><circle cx="300" cy="118" r="11" fill="#D55E00" stroke="none" stroke-width="1.4"/><path d="M284 156 Q300 126 316 156 Z" fill="#D55E00" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><circle cx="345" cy="118" r="11" fill="#009E73" stroke="none" stroke-width="1.4"/><path d="M329 156 Q345 126 361 156 Z" fill="#009E73" stroke="none" stroke-width="1.6" stroke-linejoin="round"/><text x="322" y="180" font-size="13" fill="#1F2A28" text-anchor="middle">Fraternal twins</text><text x="322" y="197" font-size="13" fill="#1F2A28" text-anchor="middle">share about half,</text><text x="322" y="214" font-size="13" fill="#1F2A28" text-anchor="middle">like other siblings</text><rect x="55" y="240" width="340" height="46" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6"/><text x="225" y="259" font-size="13" fill="#1F2A28" text-anchor="middle">Both kinds of twins grow up in the same home</text><text x="225" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">at the same time.</text><text x="225" y="318" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">If identical twins are more alike on a trait</text><text x="225" y="336" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">than fraternal twins, genes contribute</text><text x="225" y="354" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">to differences in that trait.</text><rect x="440" y="50" width="390" height="340" rx="8" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.6"/><text x="635" y="76" font-size="16" fill="#084F78" text-anchor="middle" font-weight="700">Adoption study</text><rect x="460" y="100" width="160" height="56" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="1.8"/><text x="540" y="124.2" font-size="13" fill="#1F2A28" text-anchor="middle">Biological parents</text><text x="540" y="141.1" font-size="13" fill="#1F2A28" text-anchor="middle">(share genes)</text><rect x="650" y="100" width="160" height="56" rx="8" fill="#F4F7F9" stroke="#009E73" stroke-width="1.8"/><text x="730" y="124.2" font-size="13" fill="#1F2A28" text-anchor="middle">Adoptive parents</text><text x="730" y="141.1" font-size="13" fill="#1F2A28" text-anchor="middle">(share the home)</text><rect x="555" y="210" width="160" height="46" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="635" y="238" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Adopted child</text><line x1="540" y1="156" x2="600" y2="208" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><line x1="730" y1="156" x2="670" y2="208" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><text x="635" y="296" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">More like the biological parents:</text><text x="635" y="314" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">evidence for heredity.</text><text x="635" y="332" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">More like the adoptive parents:</text><text x="635" y="350" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">evidence for environment.</text><text x="430" y="410" font-size="13" fill="#6B7370" text-anchor="middle">Most traits show both: genes and experience work together.</text>
</svg>
