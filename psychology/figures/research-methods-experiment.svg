<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The steps of an experiment</title>
<desc id="d">Sixty volunteers are randomly assigned, by a coin flip, to two groups. The experimental group gets the real treatment, one level of the independent variable; the control group gets a placebo, a look-alike with no active ingredient. Both groups are then measured on the dependent variable as it is operationally defined, and the groups are compared: because only the treatment differed, a difference points to cause and effect. A side note explains double-blind: neither the participants nor the researchers who measure them know who is in which group.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="820" height="440" fill="#FFFFFF"/>
<text x="410" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">An experiment, step by step</text><rect x="300" y="50" width="220" height="52" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="410" y="71.9" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Participants</text><text x="410" y="90.1" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">(60 volunteers)</text><line x1="410" y1="102" x2="410" y2="128" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="250" y="130" width="320" height="52" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.8"/><text x="410" y="152.2" font-size="13" fill="#1F2A28" text-anchor="middle">Random assignment</text><text x="410" y="169.1" font-size="13" fill="#1F2A28" text-anchor="middle">(a coin flip decides each person's group)</text><line x1="360" y1="182" x2="210" y2="222" stroke="#084F78" stroke-width="1.6" marker-end="url(#ar-cer)"/><line x1="460" y1="182" x2="610" y2="222" stroke="#D55E00" stroke-width="1.6" marker-end="url(#ar-verm)"/><rect x="60" y="224" width="300" height="70" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="210" y="246.8" font-size="13" fill="#1F2A28" text-anchor="middle">Experimental group</text><text x="210" y="263.7" font-size="13" fill="#1F2A28" text-anchor="middle">gets the real treatment</text><text x="210" y="280.6" font-size="13" fill="#1F2A28" text-anchor="middle">(one level of the independent variable)</text><rect x="460" y="224" width="300" height="70" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="1.8"/><text x="610" y="246.8" font-size="13" fill="#1F2A28" text-anchor="middle">Control group</text><text x="610" y="263.7" font-size="13" fill="#1F2A28" text-anchor="middle">gets a placebo: a look-alike</text><text x="610" y="280.6" font-size="13" fill="#1F2A28" text-anchor="middle">with no active ingredient</text><line x1="210" y1="294" x2="360" y2="330" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><line x1="610" y1="294" x2="460" y2="330" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="230" y="332" width="360" height="52" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="410" y="354.2" font-size="13" fill="#1F2A28" text-anchor="middle">Measure the dependent variable</text><text x="410" y="371.1" font-size="13" fill="#1F2A28" text-anchor="middle">exactly as operationally defined</text><line x1="410" y1="384" x2="410" y2="398" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><text x="410" y="420" font-size="13" fill="#084F78" text-anchor="middle" font-weight="700">Compare the groups: because only the treatment differed, a difference points to cause and effect.</text><rect x="600" y="46" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.6" stroke-dasharray="5 4"/><text x="612" y="68" font-size="12" fill="#1F2A28">Double-blind:</text><text x="612" y="86" font-size="12" fill="#1F2A28">neither the participants</text><text x="612" y="104" font-size="12" fill="#1F2A28">nor the researchers who</text><text x="612" y="122" font-size="12" fill="#1F2A28">measure them know who</text><text x="612" y="140" font-size="12" fill="#1F2A28">is in which group.</text>
</svg>
