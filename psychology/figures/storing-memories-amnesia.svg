<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="storing-memories-amnesia-t storing-memories-amnesia-d" font-family="Arial, Helvetica, sans-serif">
<title id="storing-memories-amnesia-t">Retrograde and anterograde amnesia</title>
<desc id="storing-memories-amnesia-d">A timeline with a brain injury or illness marked in the middle. An orange arrow points back in time from the injury: retrograde amnesia, where memories from before the injury are lost, for example a person who cannot recall the weeks before a car crash. A blue arrow points forward in time from the injury: anterograde amnesia, where new long-term memories cannot be formed after it, for example a person who can chat for a minute but cannot remember the talk an hour later. A note says that in anterograde amnesia, skills (procedural memory) can often still be learned.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="880" height="380" fill="#FFFFFF"/>
<text x="440" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Two kinds of amnesia, on a timeline</text><line x1="60" y1="170" x2="820" y2="170" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar-ink)"/><text x="816" y="196" font-size="13" fill="#6B7370" text-anchor="end">time</text><path d="M428 132 L446 156 L434 160 L452 184" fill="none" stroke="#D55E00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="440" y="122" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="700">Brain injury or illness</text><rect x="150" y="200" width="290" height="52" rx="6" fill="#FBE6D9" stroke="#D55E00" stroke-width="1.6"/><text x="295" y="222" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">RETROGRADE amnesia: memories from</text><text x="295" y="238.9" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">BEFORE the injury are lost</text><rect x="440" y="266" width="360" height="52" rx="6" fill="#E3F0F8" stroke="#084F78" stroke-width="1.6"/><text x="620" y="288" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">ANTEROGRADE amnesia: new long-term</text><text x="620" y="304.9" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">memories cannot be formed AFTER it</text><line x1="434" y1="192" x2="154" y2="192" stroke="#D55E00" stroke-width="2.4" marker-end="url(#ar-verm)"/><line x1="446" y1="258" x2="796" y2="258" stroke="#084F78" stroke-width="2.4" marker-end="url(#ar-cer)"/><text x="60" y="70" font-size="12.5" fill="#1F2A28">Retrograde: a person cannot recall the</text><text x="60" y="88" font-size="12.5" fill="#1F2A28">weeks before a car crash.</text><text x="560" y="70" font-size="12.5" fill="#1F2A28">Anterograde: a person can chat for a minute</text><text x="560" y="88" font-size="12.5" fill="#1F2A28">but cannot remember the talk an hour later.</text><text x="440" y="352" font-size="13" fill="#6B7370" text-anchor="middle">In anterograde amnesia, skills (procedural memory) can often still be learned.</text>
</svg>
