<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" role="img" aria-labelledby="disorders-categories-t disorders-categories-d" font-family="Arial, Helvetica, sans-serif">
<title id="disorders-categories-t">Categories of psychological disorders in the course</title>
<desc id="disorders-categories-d">Ten boxes, one per DSM-5-TR category, each listing its representative disorders: neurodevelopmental (ADHD, autism spectrum disorder); schizophrenia spectrum (schizophrenia, with positive and negative symptoms); depressive (major depressive disorder, persistent depressive disorder); bipolar (bipolar I with mania, bipolar II with hypomania); anxiety (specific phobia, agoraphobia, panic, social anxiety, generalized anxiety); obsessive-compulsive and related (obsessive-compulsive disorder, hoarding disorder); dissociative (dissociative amnesia with or without fugue, dissociative identity disorder); trauma- and stressor-related (posttraumatic stress disorder); feeding and eating (anorexia nervosa, bulimia nervosa); personality (Clusters A, B and C).</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="860" height="610" fill="#FFFFFF"/>
<text x="430" y="34" font-size="20" font-weight="bold" fill="#1F2A28" text-anchor="middle">Categories of psychological disorders in the course</text><text x="430" y="58" font-size="14" font-weight="normal" fill="#6B7472" text-anchor="middle">DSM-5-TR category names, each with the representative disorders you need</text><rect x="20" y="78" width="395" height="92" rx="10" fill="#DCEBF4" stroke="#084F78" stroke-width="2"/><text x="34" y="104" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Neurodevelopmental</text><text x="34" y="124" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">ADHD; autism spectrum disorder</text><rect x="445" y="78" width="395" height="92" rx="10" fill="#DCEBF4" stroke="#084F78" stroke-width="2"/><text x="459" y="104" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Schizophrenia spectrum</text><text x="459" y="124" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">schizophrenia: positive and</text><text x="459" y="140" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">negative symptoms</text><rect x="20" y="182" width="395" height="92" rx="10" fill="#FBE3D4" stroke="#D55E00" stroke-width="2"/><text x="34" y="208" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Depressive</text><text x="34" y="228" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">major depressive disorder;</text><text x="34" y="244" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">persistent depressive disorder</text><rect x="445" y="182" width="395" height="92" rx="10" fill="#FBE3D4" stroke="#D55E00" stroke-width="2"/><text x="459" y="208" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Bipolar</text><text x="459" y="228" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">bipolar I (mania);</text><text x="459" y="244" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">bipolar II (hypomania)</text><rect x="20" y="286" width="395" height="92" rx="10" fill="#D6F0E7" stroke="#009E73" stroke-width="2"/><text x="34" y="312" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Anxiety</text><text x="34" y="332" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">specific phobia, agoraphobia, panic,</text><text x="34" y="348" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">social anxiety, generalized anxiety</text><rect x="445" y="286" width="395" height="92" rx="10" fill="#D6F0E7" stroke="#009E73" stroke-width="2"/><text x="459" y="312" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Obsessive-compulsive</text><text x="459" y="330" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">and related</text><text x="459" y="350" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">obsessive-compulsive disorder;</text><text x="459" y="366" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">hoarding disorder</text><rect x="20" y="390" width="395" height="92" rx="10" fill="#F5E3EE" stroke="#CC79A7" stroke-width="2"/><text x="34" y="416" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Dissociative</text><text x="34" y="436" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">dissociative amnesia (with or</text><text x="34" y="452" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">without fugue); dissociative identity</text><rect x="445" y="390" width="395" height="92" rx="10" fill="#F5E3EE" stroke="#CC79A7" stroke-width="2"/><text x="459" y="416" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Trauma- and stressor-</text><text x="459" y="434" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">related</text><text x="459" y="454" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">posttraumatic stress disorder</text><rect x="20" y="494" width="395" height="92" rx="10" fill="#E3E7E6" stroke="#6B7472" stroke-width="2"/><text x="34" y="520" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Feeding and eating</text><text x="34" y="540" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">anorexia nervosa;</text><text x="34" y="556" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">bulimia nervosa</text><rect x="445" y="494" width="395" height="92" rx="10" fill="#E3E7E6" stroke="#6B7472" stroke-width="2"/><text x="459" y="520" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Personality</text><text x="459" y="540" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Cluster A (odd), Cluster B (dramatic),</text><text x="459" y="556" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Cluster C (anxious)</text>
</svg>
