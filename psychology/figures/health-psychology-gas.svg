<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="health-psychology-gas-t health-psychology-gas-d" font-family="Arial, Helvetica, sans-serif">
<title id="health-psychology-gas-t">The general adaptation syndrome</title>
<desc id="health-psychology-gas-d">A curve of resistance to stress over time while a stressor continues, against a dashed line at the normal level. 1, Alarm: resistance briefly dips below normal at the shock, then sympathetic arousal begins. 2, Resistance: resistance rises well above normal and stays high while the body copes at a cost, with hormones and arousal kept up. 3, Exhaustion: reserves run down, resistance falls below normal and the person becomes more vulnerable to illness. A model curve, not data from one study.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<rect x="80" y="40" width="140" height="320" rx="0" fill="#FBEDE3" stroke="none" stroke-width="1.5"/><rect x="220" y="40" width="330" height="320" rx="0" fill="#E3F0F8" stroke="none" stroke-width="1.5"/><rect x="550" y="40" width="210" height="320" rx="0" fill="#EEF1F0" stroke="none" stroke-width="1.5"/><text x="150" y="66" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">1. Alarm</text><text x="385" y="66" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">2. Resistance</text><text x="655" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">3. Exhaustion</text><line x1="80" y1="240" x2="760" y2="240" stroke="#6B7370" stroke-width="1.5" stroke-dasharray="6 5"/><text x="756" y="232" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="end">normal level of resistance</text><path d="M80,240 L110,240 C140,240 150,290 175,290 C200,290 210,120 255,115 L520,115 C580,120 600,280 660,320 L750,340" fill="none" stroke="#084F78" stroke-width="3.5"/><line x1="80" y1="360" x2="760" y2="360" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><line x1="80" y1="360" x2="80" y2="30" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="420" y="392" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Time under a stressor that continues</text><text transform="translate(36 200) rotate(-90)" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Resistance to stress</text><text x="150" y="318" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">shock, then</text><text x="150" y="333.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">sympathetic</text><text x="150" y="349.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">arousal</text><text x="385" y="148" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">body copes at a high cost:</text><text x="385" y="163.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">hormones and arousal stay up</text><text x="655" y="144" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">reserves run down:</text><text x="655" y="159.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">more vulnerable to illness</text><text x="760" y="432" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="end" font-style="italic">A model curve to show the stages, not data from one study.</text>
</svg>
