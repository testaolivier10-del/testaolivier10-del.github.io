="263.1" y="171.4" width="52.3" height="148.6" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="289.2" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">4</text><rect x="315.4" y="208.6" width="52.3" height="111.4" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="341.5" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">5</text><rect x="367.7" y="245.7" width="52.3" height="74.3" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="393.8" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">6</text><rect x="420" y="282.9" width="52.3" height="37.1" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="446.2" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">7</text><rect x="472.3" y="282.9" width="52.3" height="37.1" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="498.5" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">8</text><text x="550.8" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">9</text><rect x="576.9" y="282.9" width="52.3" height="37.1" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="603.1" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">10</text><text x="655.4" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">11</text><rect x="681.5" y="282.9" width="52.3" height="37.1" rx="0" fill="#E3F0F8" stroke="#084F78" stroke-width="1.4"/><text x="707.7" y="340" font-size="12" fill="#1F2A28" text-anchor="middle">12</text><line x1="80" y1="320" x2="760" y2="320" stroke="#1F2A28" stroke-width="1.4"/><line x1="80" y1="60" x2="80" y2="320" stroke="#1F2A28" stroke-width="1.4"/><text x="420" y="364" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Hours of sleep lost per week (invented data, 25 students)</text><text transform="rotate(-90 28 190)" x="28" y="190" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Number of students</text><line x1="236.9" y