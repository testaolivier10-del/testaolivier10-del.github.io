<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="encoding-memories-serial-t encoding-memories-serial-d" font-family="Arial, Helvetica, sans-serif">
<title id="encoding-memories-serial-t">The serial position curve</title>
<desc id="encoding-memories-serial-d">A line graph of the percent of people who recalled each word, by its position in a 15-word list heard once and recalled right away in any order (invented data for practice). Recall starts high for the first words (72% for word 1), falls to about 30% for the middle words (29% at its lowest), then rises for the last words (88% for word 15). The high start is labeled the primacy effect and the high end the recency effect.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="820" height="430" fill="#FFFFFF"/>
<text x="410" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">The serial position curve</text><line x1="100" y1="330" x2="750" y2="330" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="334" font-size="12" fill="#1F2A28" text-anchor="end">0%</text><line x1="100" y1="276" x2="750" y2="276" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="280" font-size="12" fill="#1F2A28" text-anchor="end">20%</text><line x1="100" y1="222" x2="750" y2="222" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="226" font-size="12" fill="#1F2A28" text-anchor="end">40%</text><line x1="100" y1="168" x2="750" y2="168" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="172" font-size="12" fill="#1F2A28" text-anchor="end">60%</text><line x1="100" y1="114" x2="750" y2="114" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="118" font-size="12" fill="#1F2A28" text-anchor="end">80%</text><line x1="100" y1="60" x2="750" y2="60" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="64" font-size="12" fill="#1F2A28" text-anchor="end">100%</text><line x1="121.7" y1="330" x2="121.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="121.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">1</text><line x1="208.3" y1="330" x2="208.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="208.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">3</text><line x1="295" y1="330" x2="295" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="295" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">5</text><line x1="381.7" y1="330" x2="381.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="381.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">7</text><line x1="468.3" y1="330" x2="468.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="468.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">9</text><line x1="555" y1="330" x2="555" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="555" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">11</text><line x1="641.7" y1="330" x2="641.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="641.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">13</text><line x1="728.3" y1="330" x2="728.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="728.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">15</text><line x1="100" y1="330" x2="750" y2="330" stroke="#1F2A28" stroke-width="1.6"/><line x1="100" y1="60" x2="100" y2="330" stroke="#1F2A28" stroke-width="1.6"/><text x="425" y="374" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Position of the word in the list (1 = heard first)</text><text x="52" y="195" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700" transform="rotate(-90 52 195)">Percent who recalled it</text><rect x="104.3" y="60" width="121.3" height="270" rx="0" fill="#E3F0F8" stroke="none" stroke-width="1.6"/><rect x="624.3" y="60" width="121.3" height="270" rx="0" fill="#DDF2EA" stroke="none" stroke-width="1.6"/><line x1="100" y1="330" x2="750" y2="330" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="334" font-size="12" fill="#1F2A28" text-anchor="end">0%</text><line x1="100" y1="276" x2="750" y2="276" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="280" font-size="12" fill="#1F2A28" text-anchor="end">20%</text><line x1="100" y1="222" x2="750" y2="222" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="226" font-size="12" fill="#1F2A28" text-anchor="end">40%</text><line x1="100" y1="168" x2="750" y2="168" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="172" font-size="12" fill="#1F2A28" text-anchor="end">60%</text><line x1="100" y1="114" x2="750" y2="114" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="118" font-size="12" fill="#1F2A28" text-anchor="end">80%</text><line x1="100" y1="60" x2="750" y2="60" stroke="#D6DEE3" stroke-width="1"/><text x="92" y="64" font-size="12" fill="#1F2A28" text-anchor="end">100%</text><line x1="121.7" y1="330" x2="121.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="121.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">1</text><line x1="208.3" y1="330" x2="208.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="208.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">3</text><line x1="295" y1="330" x2="295" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="295" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">5</text><line x1="381.7" y1="330" x2="381.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="381.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">7</text><line x1="468.3" y1="330" x2="468.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="468.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">9</text><line x1="555" y1="330" x2="555" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="555" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">11</text><line x1="641.7" y1="330" x2="641.7" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="641.7" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">13</text><line x1="728.3" y1="330" x2="728.3" y2="335" stroke="#1F2A28" stroke-width="1.2"/><text x="728.3" y="350" font-size="12" fill="#1F2A28" text-anchor="middle">15</text><line x1="100" y1="330" x2="750" y2="330" stroke="#1F2A28" stroke-width="1.6"/><line x1="100" y1="60" x2="100" y2="330" stroke="#1F2A28" stroke-width="1.6"/><text x="425" y="374" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Position of the word in the list (1 = heard first)</text><text x="52" y="195" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700" transform="rotate(-90 52 195)">Percent who recalled it</text><path d="M121.7 135.6 L165 168 L208.3 200.4 L251.7 222 L295 238.2 L338.3 246.3 L381.7 249 L425 251.7 L468.3 249 L511.7 240.9 L555 227.4 L598.3 195 L641.7 151.8 L685 114 L728.3 92.4" fill="none" stroke="#084F78" stroke-width="3" stroke-linejoin="round