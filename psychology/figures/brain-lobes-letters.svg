<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="brain-lobes-letters-t brain-lobes-letters-d" font-family="Arial, Helvetica, sans-serif">
<title id="brain-lobes-letters-t">The left hemisphere from the side, regions marked A to F</title>
<desc id="brain-lobes-letters-d">The side view of the left hemisphere with six regions marked by letters. A marks the front of the frontal lobe (the prefrontal area). B marks the motor cortex strip. C marks the occipital lobe. D marks Broca's area. E marks Wernicke's area. F marks the cerebellum.</desc>
