<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="neural-firing-neuron-letters-t neural-firing-neuron-letters-d" font-family="Arial, Helvetica, sans-serif">
<title id="neural-firing-neuron-letters-t">A neuron and a synapse, parts marked A to F</title>
<desc id="neural-firing-neuron-letters-d">The same neuron and synapse with six parts marked by letters instead of names. A marks a dendrite at the far left. B marks the cell body. C marks a segment of the myelin sheath on the axon. D marks an axon terminal knob. E marks the synaptic gap between the sending terminal and the receiving dendrite in the enlarged panel. F marks a receptor site on the receiving dendrite.</desc>
