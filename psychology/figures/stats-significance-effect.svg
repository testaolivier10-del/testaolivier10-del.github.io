<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A small and a large effect size</title>
<desc id="d">Two panels, each with two overlapping bell curves: a control group and a treatment group. Left, a small effect: the means are 0.2 standard deviations apart and the curves overlap almost completely. Right, a large effect: the means are 0.8 standard deviations apart and the curves overlap less. A note says that with a large enough sample even the small effect can be statistically significant, because significance is not size.</desc>
