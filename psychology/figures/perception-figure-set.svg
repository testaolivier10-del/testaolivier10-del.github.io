<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="perception-figure-set-t perception-figure-set-d" font-family="Arial, Helvetica, sans-serif">
<title id="perception-figure-set-t">Three perception figures: grouping, a road scene and an illusion</title>
<desc id="perception-figure-set-d">Figure A: an evenly spaced grid of six columns and six rows of black shapes; the columns alternate circles and squares, so each column holds one kind of shape. Figure B: a road narrows toward the horizon; fence posts shrink and crowd together toward the horizon; a large blue person stands in the foreground, a small blue person of the same shape stands far down the road, and an orange person stands partly hidden behind a box. Figure C: two lines converge toward the top like railroad tracks, with evenly spaced cross lines; two orange bars of exactly equal length sit between them, one high and one low, and the upper bar looks longer.</desc>
