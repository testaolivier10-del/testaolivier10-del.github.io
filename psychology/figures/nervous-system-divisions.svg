<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Divisions of the nervous system</title>
<desc id="d">A tree diagram. The nervous system divides into the central nervous system, the brain and spinal cord, which takes in information, decides and sends commands, and the peripheral nervous system, the nerves linking the central nervous system to the body. The peripheral system divides into the somatic system, voluntary, which moves skeletal muscles (kicking a ball, typing, feeling a tap), and the autonomic system, automatic, which runs the heart, lungs, glands and gut. The autonomic system divides into the sympathetic division, which arouses (heart speeds, pupils widen, digestion slows, sweating rises), and the parasympathetic division, which calms (heart slows, digestion resumes). An example: a car horn blares; the sympathetic division makes the heart pound, the jump back is somatic, and the parasympathetic division later brings the heart rate down.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="900" height="480" fill="#FFFFFF"/>
<text x="450" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Divisions of the nervous system</text><rect x="340" y="46" width="220" height="44" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.8"/><text x="450" y="73.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Nervous system</text><line x1="400" y1="90" x2="220" y2="126" stroke="#1F2A28" stroke-width="2"/><line x1="500" y1="90" x2="655" y2="126" stroke="#1F2A28" stroke-width="2"/><rect x="90" y="126" width="260" height="56" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="220" y="149.9" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Central nervous system (CNS)</text><text x="220" y="168.1" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">brain and spinal cord</text><rect x="520" y="126" width="270" height="56" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="1.8"/><text x="655" y="150.1" font-size="13.5" fill="#1F2A28" text-anchor="middle" font-weight="700">Peripheral nervous system (PNS)</text><text x="655" y="167.6" font-size="13.5" fill="#1F2A28" text-anchor="middle" font-weight="700">nerves linking the CNS to the body</text><text x="220" y="212" font-size="13" fill="#1F2A28" text-anchor="middle">Takes in information, decides,</text><text x="220" y="230" font-size="13" fill="#1F2A28" text-anchor="middle">sends out commands. The spinal</text><text x="220" y="248" font-size="13" fill="#1F2A28" text-anchor="middle">cord carries messages between</text><text x="220" y="266" font-size="13" fill="#1F2A28" text-anchor="middle">the brain and the body.</text><line x1="610" y1="182" x2="485" y2="224" stroke="#1F2A28" stroke-width="2"/><line x1="700" y1="182" x2="765" y2="224" stroke="#1F2A28" stroke-width="2"/><rect x="380" y="224" width="210" height="64" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="1.8"/><text x="485" y="243.8" font-size="13" fill="#1F2A28" text-anchor="middle">Somatic</text><text x="485" y="260.7" font-size="13" fill="#1F2A28" text-anchor="middle">voluntary: moves</text><text x="485" y="277.6" font-size="13" fill="#1F2A28" text-anchor="middle">skeletal muscles</text><rect x="660" y="224" width="210" height="64" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="1.8"/><text x="765" y="243.8" font-size="13" fill="#1F2A28" text-anchor="middle">Autonomic</text><text x="765" y="260.7" font-size="13" fill="#1F2A28" text-anchor="middle">automatic: heart,</text><text x="765" y="277.6" font-size="13" fill="#1F2A28" text-anchor="middle">lungs, glands, gut</text><text x="485" y="310" font-size="12.5" fill="#6B7370" text-anchor="middle">Kicking a ball, typing,</text><text x="485" y="327" font-size="12.5" fill="#6B7370" text-anchor="middle">feeling a tap on the arm</text><line x1="720" y1="288" x2="640" y2="340" stroke="#1F2A28" stroke-width="2"/><line x1="810" y1="288" x2="815" y2="340" stroke="#1F2A28" stroke-width="2"/><rect x="560" y="340" width="165" height="124" rx="8" fill="#FBE6D9" stroke="#D55E00" stroke-width="1.8"/><text x="642.5" y="372.9" font-size="13" fill="#1F2A28" text-anchor="middle">Sympathetic</text><text x="642.5" y="389.8" font-size="13" fill="#1F2A28" text-anchor="middle">arouses: heart</text><text x="642.5" y="406.7" font-size="13" fill="#1F2A28" text-anchor="middle">speeds, pupils</text><text x="642.5" y="423.6" font-size="13" fill="#1F2A28" text-anchor="middle">widen, digestion</text><text x="642.5" y="440.5" font-size="13" fill="#1F2A28" text-anchor="middle">slows, sweating</text><rect x="735" y="340" width="155" height="124" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="812.5" y="381.3" font-size="13" fill="#1F2A28" text-anchor="middle">Parasympathetic</text><text x="812.5" y="398.2" font-size="13" fill="#1F2A28" text-anchor="middle">calms: heart</text><text x="812.5" y="415.1" font-size="13" fill="#1F2A28" text-anchor="middle">slows, digestion</text><text x="812.5" y="432" font-size="13" fill="#1F2A28" text-anchor="middle">resumes</text><rect x="30" y="352" width="500" height="100" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.6" stroke-dasharray="5 4"/><text x="46" y="376" font-size="13" fill="#1F2A28">Example: a car horn blares as you step off the curb.</text><text x="46" y="395" font-size="13" fill="#1F2A28">Sympathetic: your heart pounds and you jump back</text><text x="46" y="414" font-size="13" fill="#1F2A28">(the jump itself is somatic). A minute later the</text><text x="46" y="433" font-size="13" fill="#1F2A28">parasympathetic division brings your heart rate back down.</text>
</svg>
