<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="classical-conditioning-pairing-t classical-conditioning-pairing-d" font-family="Arial, Helvetica, sans-serif">
<title id="classical-conditioning-pairing-t">Classical conditioning: before, during and after</title>
<desc id="classical-conditioning-pairing-d">Three rows. Before: a tone, the neutral stimulus, produces no salivation, while food, the unconditioned stimulus, produces salivation, the unconditioned response, without learning. During: the tone and food are paired many times and the food produces salivation. After: the tone alone, now the conditioned stimulus, produces salivation, the conditioned response.</desc>
<defs><marker id="classical-conditioning-pairing-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="classical-conditioning-pairing-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="classical-conditioning-pairing-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="classical-conditioning-pairing-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="520" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Classical conditioning: a tone comes to trigger salivation</text><text x="20" y="100" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Before</text><text x="20" y="122" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="start">two separate links</text><rect x="170" y="70" width="170" height="46" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="255" y="99" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Tone (NS)</text><line x1="345" y1="93" x2="455" y2="93" stroke="#5B6664" stroke-width="2.5" marker-end="url(#classical-conditioning-pairing-ar)"/><rect x="460" y="70" width="300" height="46" rx="8" fill="#FFFFFF" stroke="#5B6664" stroke-width="2"/><text x="610" y="99" font-size="14" font-weight="normal" fill="#5B6664" text-anchor="middle">no salivation (perhaps a glance)</text><rect x="170" y="130" width="170" height="46" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="255" y="159" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">Food (UCS)</text><line x1="345" y1="153" x2="455" y2="153" stroke="#D55E00" stroke-width="2.5" marker-end="url(#classical-conditioning-pairing-arV)"/><rect x="460" y="130" width="300" height="46" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="610" y="159" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">salivation (UCR), unlearned</text><text x="20" y="260" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">During</text><text x="20" y="282" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="start">acquisition: paired</text><rect x="170" y="250" width="260" height="70" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="300" y="280" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">Tone (NS) + Food (UCS)</text><text x="300" y="302" font-size="13" font-weight="normal" fill="#084F78" text-anchor="middle">paired many times</text><line x1="435" y1="285" x2="535" y2="285" stroke="#D55E00" stroke-width="2.5" marker-end="url(#classical-conditioning-pairing-arV)"/><rect x="540" y="262" width="220" height="46" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="650" y="291" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">salivation (UCR)</text><text x="20" y="420" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">After</text><text x="20" y="442" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="start">a learned link</text><rect x="170" y="410" width="260" height="70" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="3"/><text x="300" y="440" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">Tone alone (now the CS)</text><text x="300" y="462" font-size="13" font-weight="normal" fill="#084F78" text-anchor="middle">no food given</text><line x1="435" y1="445" x2="535" y2="445" stroke="#084F78" stroke-width="3" marker-end="url(#classical-conditioning-pairing-arC)"/><rect x="540" y="422" width="220" height="46" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="3"/><text x="650" y="451" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">salivation (CR), learned</text><line x1="20" y1="205" x2="800" y2="205" stroke="#D5DBD9" stroke-width="1.5"/><line x1="20" y1="365" x2="800" y2="365" stroke="#D5DBD9" stroke-width="1.5"/>
</svg>
