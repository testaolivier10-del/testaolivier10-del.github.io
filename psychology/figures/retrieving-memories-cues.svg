<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="retrieving-memories-cues-t retrieving-memories-cues-d" font-family="Arial, Helvetica, sans-serif">
<title id="retrieving-memories-cues-t">Recall, recognition and matching cues</title>
<desc id="retrieving-memories-cues-d">Left panel: recall means producing the answer with few cues, as in &quot;Name the part of the brain that forms new memories.&quot; Recognition means picking it from options, as in a four-option question listing the cerebellum, hippocampus, amygdala and thalamus. Recognition is usually easier because the options are retrieval cues. Right panel: three ways retrieval improves when the cues at test match learning. Context-dependent memory: the same place, for example words learned underwater are recalled better underwater. State-dependent memory: the same body state, for example learning while calm and recalling better when calm again. Mood-congruent memory: the same mood, for example sad memories come to mind more easily when a person is sad.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="880" height="420" fill="#FFFFFF"/>
<text x="440" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Retrieval depends on cues</text><rect x="30" y="52" width="400" height="340" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="230" y="78" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">Recall versus recognition</text><rect x="50" y="96" width="360" height="70" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.8"/><text x="230" y="118.8" font-size="13" fill="#1F2A28" text-anchor="middle">Recall: produce it with few cues</text><text x="230" y="135.7" font-size="13" fill="#1F2A28" text-anchor="middle">&quot;Name the part of the brain that</text><text x="230" y="152.6" font-size="13" fill="#1F2A28" text-anchor="middle">forms new memories.&quot;</text><rect x="50" y="182" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="230" y="209.3" font-size="13" fill="#1F2A28" text-anchor="middle">Recognition: pick it from options</text><text x="230" y="226.2" font-size="13" fill="#1F2A28" text-anchor="middle">&quot;Which forms new memories?</text><text x="230" y="243.1" font-size="13" fill="#1F2A28" text-anchor="middle">(a) cerebellum  (b) hippocampus</text><text x="230" y="260" font-size="13" fill="#1F2A28" text-anchor="middle">(c) amygdala  (d) thalamus&quot;</text><text x="230" y="306" font-size="12.5" fill="#1F2A28" text-anchor="middle">Recognition is usually easier: the</text><text x="230" y="324" font-size="12.5" fill="#1F2A28" text-anchor="middle">options themselves are retrieval cues.</text><text x="230" y="342" font-size="12.5" fill="#1F2A28" text-anchor="middle">That is why multiple choice can feel</text><text x="230" y="360" font-size="12.5" fill="#1F2A28" text-anchor="middle">easier than a blank page.</text><rect x="450" y="52" width="400" height="340" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.6"/><text x="650" y="78" font-size="15" fill="#084F78" text-anchor="middle" font-weight="700">When the cues at test match learning</text><rect x="466" y="98" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6"/><text x="480" y="122" font-size="13.5" fill="#084F78" font-weight="700">Context-dependent memory</text><text x="480" y="142" font-size="12.5" fill="#6B7370">cue: the same place</text><text x="480" y="160" font-size="12.5" fill="#1F2A28">Learn words underwater, recall</text><text x="480" y="176" font-size="12.5" fill="#1F2A28">them better underwater</text><rect x="466" y="194" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6"/><text x="480" y="218" font-size="13.5" fill="#084F78" font-weight="700">State-dependent memory</text><text x="480" y="238" font-size="12.5" fill="#6B7370">cue: the same body state</text><text x="480" y="256" font-size="12.5" fill="#1F2A28">Learn while calm, recall better</text><text x="480" y="272" font-size="12.5" fill="#1F2A28">when calm again</text><rect x="466" y="290" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6"/><text x="480" y="314" font-size="13.5" fill="#084F78" font-weight="700">Mood-congruent memory</text><text x="480" y="334" font-size="12.5" fill="#6B7370">cue: the same mood</text><text x="480" y="352" font-size="12.5" fill="#1F2A28">When sad, sad memories</text><text x="480" y="368" font-size="12.5" fill="#1F2A28">come to mind more easily</text>
</svg>
