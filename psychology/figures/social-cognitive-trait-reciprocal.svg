tice more</text><text x="612" y="200" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a supportive coach</text><text x="612" y="215.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">raises your</text><text x="612" y="231.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">expectations</text><text x="380" y="358" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">joining a team changes the</text><text x="380" y="373.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">people you spend time with</text><text x="380" y="408" font-size="13" font-weight="bold" fill="#084F78" text-anchor="middle">Reciprocal determinism: each factor influences the other two.</text>
