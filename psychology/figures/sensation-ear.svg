<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="sensation-ear-t sensation-ear-d" font-family="Arial, Helvetica, sans-serif">
<title id="sensation-ear-t">The ear, and where pitch is sensed along the cochlea</title>
<desc id="sensation-ear-d">The outer ear funnels sound down the ear canal to the eardrum. Three tiny middle-ear bones carry the vibration to the cochlea, a fluid-filled coil in the inner ear, where hair cells turn the vibration into neural signals that travel along the auditory nerve. A bracket over the ear canal, eardrum and middle-ear bones says damage there causes conduction deafness; a bracket over the cochlea and auditory nerve says damage there causes sensorineural deafness. Below, the cochlea is drawn uncoiled: high pitches make the base, near the middle ear, vibrate most, and low pitches the far tip.</desc>
