<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="memory-intro-stores-t memory-intro-stores-d" font-family="Arial, Helvetica, sans-serif">
<title id="memory-intro-stores-t">The multi-store model and working memory</title>
<desc id="memory-intro-stores-d">Sights, sounds and touch enter sensory memory, which holds them for about half a second for sights and a few seconds for sounds; unattended input fades. Attention moves some of it into short-term memory, which holds a few items for about 20 to 30 seconds unless it is rehearsed; rehearsal keeps it active. Encoding moves information from short-term memory into long-term memory, which has a very large capacity and lasts from days to a lifetime; retrieval brings it back into short-term memory. A box below shows the working memory model of the short-term store: a central executive that directs attention, a phonological loop for words and sounds, and a visuospatial sketchpad for images and places.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="900" height="440" fill="#FFFFFF"/>
<text x="450" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">How information moves through memory</text><rect x="20" y="150" width="130" height="64" rx="8" fill="#FFFFFF" stroke="#6B7370" stroke-width="1.8"/><text x="85" y="178.2" font-size="13" fill="#1F2A28" text-anchor="middle">Sights,</text><text x="85" y="195.1" font-size="13" fill="#1F2A28" text-anchor="middle">sounds, touch</text><line x1="150" y1="182" x2="182" y2="182" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="184" y="140" width="170" height="84" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="269" y="170.3" font-size="12.5" fill="#1F2A28" text-anchor="middle">Sensory memory</text><text x="269" y="186.5" font-size="12.5" fill="#1F2A28" text-anchor="middle">about 1/2 second (sights)</text><text x="269" y="202.8" font-size="12.5" fill="#1F2A28" text-anchor="middle">to a few seconds (sounds)</text><line x1="354" y1="182" x2="410" y2="182" stroke="#084F78" stroke-width="2.4" marker-end="url(#ar-cer)"/><text x="382" y="170" font-size="12" fill="#084F78" text-anchor="middle" font-weight="700">attention</text><rect x="412" y="120" width="200" height="124" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.8"/><text x="512" y="154" font-size="12.5" fill="#1F2A28" text-anchor="middle">Short-term memory</text><text x="512" y="170.3" font-size="12.5" fill="#1F2A28" text-anchor="middle">few items, about 20 to</text><text x="512" y="186.5" font-size="12.5" fill="#1F2A28" text-anchor="middle">30 seconds without</text><text x="512" y="202.8" font-size="12.5" fill="#1F2A28" text-anchor="middle">rehearsal; working</text><text x="512" y="219" font-size="12.5" fill="#1F2A28" text-anchor="middle">memory is its active part</text><path d="M612 160 L690 160" fill="none" stroke="#084F78" stroke-width="2.4" marker-end="url(#ar-cer)" stroke-linejoin="round" stroke-linecap="round"/><text x="651" y="150" font-size="12" fill="#084F78" text-anchor="middle" font-weight="700">encoding</text><path d="M690 205 L612 205" fill="none" stroke="#009E73" stroke-width="2.4" marker-end="url(#ar-green)" stroke-linejoin="round" stroke-linecap="round"/><text x="651" y="224" font-size="12" fill="#009E73" text-anchor="middle" font-weight="700">retrieval</text><rect x="692" y="120" width="188" height="124" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="786" y="170.3" font-size="12.5" fill="#1F2A28" text-anchor="middle">Long-term memory</text><text x="786" y="186.5" font-size="12.5" fill="#1F2A28" text-anchor="middle">very large capacity,</text><text x="786" y="202.8" font-size="12.5" fill="#1F2A28" text-anchor="middle">lasts days to a lifetime</text><path d="M200 140 Q 210 96 260 96" fill="none" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><text x="268" y="100" font-size="12" fill="#6B7370">unattended input fades</text><path d="M470 120 Q 512 70 556 120" fill="none" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)" stroke-linejoin="round" stroke-linecap="round"/><text x="512" y="72" font-size="12" fill="#1F2A28" text-anchor="middle">rehearsal keeps it active</text><rect x="330" y="282" width="360" height="140" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.6" stroke-dasharray="6 4"/><text x="510" y="304" font-size="14" fill="#084F78" text-anchor="middle" font-weight="700">Working memory: three parts</text><rect x="410" y="316" width="200" height="40" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="1.8"/><text x="510" y="332.5" font-size="12" fill="#1F2A28" text-anchor="middle">Central executive</text><text x="510" y="348.1" font-size="12" fill="#1F2A28" text-anchor="middle">directs attention</text><rect x="345" y="368" width="160" height="44" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="425" y="386.5" font-size="12" fill="#1F2A28" text-anchor="middle">Phonological loop</text><text x="425" y="402.1" font-size="12" fill="#1F2A28" text-anchor="middle">words and sounds</text><rect x="515" y="368" width="160" height="44" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="595" y="386.5" font-size="12" fill="#1F2A28" text-anchor="middle">Visuospatial sketchpad</text><text x="595" y="402.1" font-size="12" fill="#1F2A28" text-anchor="middle">images and places</text><line x1="512" y1="244" x2="512" y2="280" stroke="#084F78" stroke-width="1.4" stroke-dasharray="4 4"/><text x="30" y="300" font-size="12.5" fill="#6B7370">The multi-store</text><text x="30" y="318" font-size="12.5" fill="#6B7370">(Atkinson-Shiffrin)</text><text x="30" y="336" font-size="12.5" fill="#6B7370">model: three stores.</text><text x="30" y="354" font-size="12.5" fill="#6B7370">The working memory</text><text x="30" y="372" font-size="12.5" fill="#6B7370">model zooms in on</text><text x="30" y="390" font-size="12.5" fill="#6B7370">the middle one.</text>
</svg>
