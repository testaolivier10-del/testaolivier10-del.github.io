<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ethical safeguards across a study</title>
<desc id="d">A timeline with four stages. Before: an institutional review board, or an animal care committee for animal research, reviews and approves the plan. At the start: informed consent, where participants learn what will happen and agree; minors give assent and a parent consents. During: the right to withdraw at any time, protection from harm with risks kept minimal, and confidentiality. After: debriefing, where the true purpose is explained, including any deception. A note says that on the exam you name a safeguard the summary describes and say how the researchers applied it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="860" height="400" fill="#FFFFFF"/>
<text x="430" y="30" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Ethical safeguards across a study</text><line x1="40" y1="80" x2="820" y2="80" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar-ink)"/><circle cx="130" cy="80" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="130" y="64" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Before</text><circle cx="330" cy="80" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="330" y="64" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">At the start</text><circle cx="530" cy="80" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="530" y="64" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">During</text><circle cx="730" cy="80" r="8" fill="#084F78" stroke="none" stroke-width="1.4"/><text x="730" y="64" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">After</text><rect x="40" y="110" width="180" height="150" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="130" y="139" font-size="13" fill="#1F2A28" text-anchor="middle">Review board</text><text x="130" y="155.9" font-size="13" fill="#1F2A28" text-anchor="middle">approval:</text><text x="130" y="172.8" font-size="13" fill="#1F2A28" text-anchor="middle">an institutional</text><text x="130" y="189.7" font-size="13" fill="#1F2A28" text-anchor="middle">review board (IRB),</text><text x="130" y="206.6" font-size="13" fill="#1F2A28" text-anchor="middle">or an animal care</text><text x="130" y="223.5" font-size="13" fill="#1F2A28" text-anchor="middle">committee, checks</text><text x="130" y="240.4" font-size="13" fill="#1F2A28" text-anchor="middle">the plan</text><rect x="240" y="110" width="180" height="150" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="330" y="147.4" font-size="13" fill="#1F2A28" text-anchor="middle">Informed consent:</text><text x="330" y="164.3" font-size="13" fill="#1F2A28" text-anchor="middle">participants learn</text><text x="330" y="181.2" font-size="13" fill="#1F2A28" text-anchor="middle">what will happen</text><text x="330" y="198.1" font-size="13" fill="#1F2A28" text-anchor="middle">and agree. Minors</text><text x="330" y="215" font-size="13" fill="#1F2A28" text-anchor="middle">give assent, and a</text><text x="330" y="231.9" font-size="13" fill="#1F2A28" text-anchor="middle">parent consents.</text><rect x="440" y="110" width="180" height="150" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="530" y="147.4" font-size="13" fill="#1F2A28" text-anchor="middle">Right to withdraw</text><text x="530" y="164.3" font-size="13" fill="#1F2A28" text-anchor="middle">at any time.</text><text x="530" y="181.2" font-size="13" fill="#1F2A28" text-anchor="middle">Protection from</text><text x="530" y="198.1" font-size="13" fill="#1F2A28" text-anchor="middle">harm: risks kept</text><text x="530" y="215" font-size="13" fill="#1F2A28" text-anchor="middle">minimal.</text><text x="530" y="231.9" font-size="13" fill="#1F2A28" text-anchor="middle">Confidentiality.</text><rect x="640" y="110" width="180" height="150" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="1.8"/><text x="730" y="147.4" font-size="13" fill="#1F2A28" text-anchor="middle">Debriefing:</text><text x="730" y="164.3" font-size="13" fill="#1F2A28" text-anchor="middle">the true purpose</text><text x="730" y="181.2" font-size="13" fill="#1F2A28" text-anchor="middle">is explained,</text><text x="730" y="198.1" font-size="13" fill="#1F2A28" text-anchor="middle">including any</text><text x="730" y="215" font-size="13" fill="#1F2A28" text-anchor="middle">deception, and</text><text x="730" y="231.9" font-size="13" fill="#1F2A28" text-anchor="middle">questions answered.</text><rect x="40" y="290" width="780" height="80" rx="8" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.6" stroke-dasharray="5 4"/><text x="430" y="318" font-size="13" fill="#1F2A28" text-anchor="middle">On the exam, name a safeguard the summary actually describes, and say how the researchers applied it</text><text x="430" y="340" font-size="13" fill="#1F2A28" text-anchor="middle">(for example, &quot;parents signed consent forms and each student agreed before the first session&quot;).</text>
</svg>
