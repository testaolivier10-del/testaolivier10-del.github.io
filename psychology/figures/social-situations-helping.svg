<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="social-situations-helping-t social-situations-helping-d" font-family="Arial, Helvetica, sans-serif">
<title id="social-situations-helping-t">Four decisions before a bystander helps</title>
<desc id="social-situations-helping-d">Four boxes in a row: notice the event, interpret it as an emergency, take responsibility, decide how and act. Below each, how other people can interfere: in busy places people notice less; others look calm so it seems not serious; diffusion of responsibility, someone else will act; unsure what to do or worried about looking foolish. A note says a crowd can block any step, yet in real recorded conflicts someone usually helps.</desc>
<defs><marker id="social-situations-helping-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="social-situations-helping-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="social-situations-helping-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="social-situations-helping-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="420" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Before a bystander helps: four decisions</text><rect x="30" y="80" width="165" height="92" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="112" y="118" font-size="16" font-weight="bold" fill="#084F78" text-anchor="middle">Notice</text><text x="112" y="142" font-size="15" font-weight="normal" fill="#084F78" text-anchor="middle">the event</text><line x1="198" y1="126" x2="224" y2="126" stroke="#084F78" stroke-width="2.5" marker-end="url(#social-situations-helping-arC)"/><rect x="228" y="80" width="165" height="92" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="310" y="118" font-size="16" font-weight="bold" fill="#084F78" text-anchor="middle">Interpret it</text><text x="310" y="142" font-size="15" font-weight="normal" fill="#084F78" text-anchor="middle">as an emergency</text><line x1="396" y1="126" x2="422" y2="126" stroke="#084F78" stroke-width="2.5" marker-end="url(#social-situations-helping-arC)"/><rect x="426" y="80" width="165" height="92" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="508" y="118" font-size="16" font-weight="bold" fill="#084F78" text-anchor="middle">Take</text><text x="508" y="142" font-size="15" font-weight="normal" fill="#084F78" text-anchor="middle">responsibility</text><line x1="594" y1="126" x2="620" y2="126" stroke="#084F78" stroke-width="2.5" marker-end="url(#social-situations-helping-arC)"/><rect x="624" y="80" width="165" height="92" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="706" y="118" font-size="16" font-weight="bold" fill="#084F78" text-anchor="middle">Decide how</text><text x="706" y="142" font-size="15" font-weight="normal" fill="#084F78" text-anchor="middle">and act</text><line x1="112" y1="176" x2="112" y2="222" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 4"/><rect x="25" y="226" width="175" height="118" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="112" y="254" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Busy, crowded</text><text x="112" y="271.55" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">places: people</text><text x="112" y="289.1" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">notice less</text><line x1="310" y1="176" x2="310" y2="222" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 4"/><rect x="223" y="226" width="175" height="118" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="310" y="254" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Others look calm,</text><text x="310" y="271.55" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">so it seems</text><text x="310" y="289.1" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">not serious</text><line x1="508" y1="176" x2="508" y2="222" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 4"/><rect x="421" y="226" width="175" height="118" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="508" y="254" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Diffusion of</text><text x="508" y="271.55" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">responsibility:</text><text x="508" y="289.1" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">"someone else</text><text x="508" y="306.65" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">will act"</text><line x1="706" y1="176" x2="706" y2="222" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 4"/><rect x="619" y="226" width="175" height="118" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="706" y="254" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Unsure what to do,</text><text x="706" y="271.55" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">or worried about</text><text x="706" y="289.1" font-size="13.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">looking foolish</text><text x="410" y="382" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">A crowd can block any step, yet in real recorded conflicts someone usually helps.</text>
</svg>
