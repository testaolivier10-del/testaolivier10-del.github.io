<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Physical development from before birth to late adulthood</title>
<desc id="d">Four columns along a lifespan arrow. Before birth: teratogens such as alcohol, nicotine, some drugs and infections can cross the placenta and harm the baby. Infancy and childhood: reflexes at birth (rooting, sucking, grasping) and motor milestones in a set order (sit, crawl, stand, walk at about 12 months, with a wide range). Adolescence: puberty, with primary and secondary sex characteristics, menarche and spermarche; the brain keeps maturing. Adulthood: strength and speed peak in the mid-20s then slowly decline, vision and hearing fade, and menopause often comes around age 50. Maturation sets the order; experience and health shape the timing.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="430" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">Physical development across the lifespan</text><rect x="16" y="56" width="188" height="300" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="2"/><rect x="16" y="56" width="188" height="40" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="110" y="82" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Before birth</text><text x="28" y="124" font-size="14" fill="#1F2A28">Teratogens (alcohol,</text><text x="28" y="148" font-size="14" fill="#1F2A28">nicotine, some drugs</text><text x="28" y="172" font-size="14" fill="#1F2A28">and infections) can</text><text x="28" y="196" font-size="14" fill="#1F2A28">cross the placenta</text><text x="28" y="220" font-size="14" fill="#1F2A28">and harm the baby.</text><rect x="209.3" y="56" width="188" height="300" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><rect x="209.3" y="56" width="188" height="40" rx="8" fill="#084F78" stroke="none" stroke-width="1.5"/><text x="303.3" y="82" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Infancy and childhood</text><text x="221.3" y="124" font-size="14" fill="#1F2A28">Reflexes at birth:</text><text x="221.3" y="148" font-size="14" fill="#1F2A28">rooting, sucking,</text><text x="221.3" y="172" font-size="14" fill="#1F2A28">grasping.</text><text x="221.3" y="196" font-size="14" fill="#1F2A28">Motor milestones in a</text><text x="221.3" y="220" font-size="14" fill="#1F2A28">similar order: sit,</text><text x="221.3" y="244" font-size="14" fill="#1F2A28">stand, walk (about</text><text x="221.3" y="268" font-size="14" fill="#1F2A28">12 months, wide range).</text><text x="221.3" y="292" font-size="14" fill="#1F2A28">Many babies crawl</text><text x="221.3" y="316" font-size="14" fill="#1F2A28">first; some skip it.</text><rect x="402.6" y="56" width="188" height="300" rx="8" fill="#F4F7F9" stroke="#009E73" stroke-width="2"/><rect x="402.6" y="56" width="188" height="40" rx="8" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="496.6" y="82" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Adolescence</text><text x="414.6" y="124" font-size="14" fill="#1F2A28">Puberty: hormones</text><text x="414.6" y="148" font-size="14" fill="#1F2A28">bring primary and</text><text x="414.6" y="172" font-size="14" fill="#1F2A28">secondary sex</text><text x="414.6" y="196" font-size="14" fill="#1F2A28">characteristics,</text><text x="414.6" y="220" font-size="14" fill="#1F2A28">menarche and</text><text x="414.6" y="244" font-size="14" fill="#1F2A28">spermarche. The</text><text x="414.6" y="268" font-size="14" fill="#1F2A28">brain keeps maturing.</text><rect x="595.9" y="56" width="188" height="300" rx="8" fill="#F4F7F9" stroke="#CC79A7" stroke-width="2"/><rect x="595.9" y="56" width="188" height="40" rx="8" fill="#CC79A7" stroke="none" stroke-width="1.5"/><text x="689.9" y="82" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Adulthood</text><text x="607.9" y="124" font-size="14" fill="#1F2A28">Strength and speed</text><text x="607.9" y="148" font-size="14" fill="#1F2A28">peak in the mid-20s,</text><text x="607.9" y="172" font-size="14" fill="#1F2A28">then slowly decline.</text><text x="607.9" y="196" font-size="14" fill="#1F2A28">Vision and hearing</text><text x="607.9" y="220" font-size="14" fill="#1F2A28">fade with age.</text><text x="607.9" y="244" font-size="14" fill="#1F2A28">Menopause, often</text><text x="607.9" y="268" font-size="14" fill="#1F2A28">around age 50.</text><line x1="24" y1="384" x2="776" y2="384" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#arr)"/><text x="24" y="410" font-size="13" fill="#1F2A28">Conception</text><text x="776" y="410" font-size="13" fill="#1F2A28" text-anchor="end">Older adulthood</text><text x="400" y="410" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">Maturation sets the order; experience and health shape the timing.</text>
</svg>
