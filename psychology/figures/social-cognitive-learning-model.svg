<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="social-cognitive-learning-model-t social-cognitive-learning-model-d" font-family="Arial, Helvetica, sans-serif">
<title id="social-cognitive-learning-model-t">Observational learning and vicarious conditioning</title>
<desc id="social-cognitive-learning-model-d">An observer watches a model act. If the model is rewarded (vicarious reinforcement), the observer imitates more often. If the model is punished (vicarious punishment), the observer imitates less often. A note says the behavior is learned either way: an observer who saw a punished model can still perform it when it pays.</desc>
<defs><marker id="social-cognitive-learning-model-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="social-cognitive-learning-model-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="social-cognitive-learning-model-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="social-cognitive-learning-model-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect width="820" height="430" fill="#FFFFFF"/>
<text x="410" y="34" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Learning by watching: what the model gets matters</text><rect x="30" y="150" width="200" height="110" rx="8" fill="#E3F0F8" stroke="#084F78" stroke-width="2"/><text x="130" y="190" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">An observer watches</text><text x="130" y="214" font-size="15" font-weight="bold" fill="#084F78" text-anchor="middle">a model act</text><text x="130" y="238" font-size="13" font-weight="normal" fill="#5B6664" text-anchor="middle">(attention, memory)</text><line x1="235" y1="180" x2="315" y2="110" stroke="#009E73" stroke-width="2.5" marker-end="url(#social-cognitive-learning-model-arG)"/><line x1="235" y1="230" x2="315" y2="300" stroke="#D55E00" stroke-width="2.5" marker-end="url(#social-cognitive-learning-model-arV)"/><rect x="320" y="60" width="230" height="100" rx="8" fill="#E1F3EC" stroke="#009E73" stroke-width="2"/><text x="435" y="96" font-size="16" font-weight="bold" fill="#009E73" text-anchor="middle">Model is rewarded</text><text x="435" y="122" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">vicarious reinforcement</text><rect x="320" y="250" width="230" height="100" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="435" y="286" font-size="16" font-weight="bold" fill="#D55E00" text-anchor="middle">Model is punished</text><text x="435" y="312" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">vicarious punishment</text><line x1="555" y1="110" x2="615" y2="110" stroke="#009E73" stroke-width="2.5" marker-end="url(#social-cognitive-learning-model-arG)"/><line x1="555" y1="300" x2="615" y2="300" stroke="#D55E00" stroke-width="2.5" marker-end="url(#social-cognitive-learning-model-arV)"/><rect x="620" y="60" width="175" height="100" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="707" y="98" font-size="14" font-weight="bold" fill="#009E73" text-anchor="middle">Observer imitates</text><text x="707" y="122" font-size="14" font-weight="bold" fill="#009E73" text-anchor="middle">more often</text><rect x="620" y="250" width="175" height="100" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/><text x="707" y="288" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">Observer imitates</text><text x="707" y="312" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">less often</text><text x="410" y="395" font-size="14" font-weight="bold" fill="#084F78" text-anchor="middle">Either way the behavior is learned: an observer who saw a punished model can still do it when it pays.</text>
</svg>
