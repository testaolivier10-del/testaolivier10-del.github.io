<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Milestones of early language</title>
<desc id="d">A timeline from birth to 30 months. Cooing at about 2 months (&quot;ooh&quot;, &quot;aah&quot;); babbling at about 6 months (&quot;ba-ba-ba&quot;); the one-word stage at about 12 months (&quot;Doggy!&quot;); telegraphic speech at about 18 to 24 months (&quot;Want juice.&quot;); sentences by about 27 months, often with overgeneralized rules (&quot;I goed outside.&quot;). Ages are typical; children vary by several months.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="800" height="330" fill="#FFFFFF"/>
<text x="24" y="34" font-size="19" fill="#1F2A28" font-weight="700">How speech develops in the first years</text><line x1="50" y1="250" x2="760" y2="250" stroke="#1F2A28" stroke-width="2.5"/><line x1="50" y1="250" x2="50" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="50" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">0</text><line x1="192" y1="250" x2="192" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="192" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">6</text><line x1="334" y1="250" x2="334" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="334" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">12</text><line x1="476" y1="250" x2="476" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="476" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">18</text><line x1="618" y1="250" x2="618" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="618" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">24</text><line x1="760" y1="250" x2="760" y2="258" stroke="#1F2A28" stroke-width="2"/><text x="760" y="276" font-size="13" fill="#1F2A28" text-anchor="middle">30</text><text x="405" y="302" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="700">Age in months (typical; children vary by several months)</text><line x1="97.3" y1="202" x2="97.3" y2="246" stroke="#084F78" stroke-width="2" stroke-dasharray="4 3"/><circle cx="97.3" cy="250" r="6" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="22.3" y="150" width="150" height="52" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><text x="97.3" y="171" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Cooing</text><text x="97.3" y="191" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">&quot;ooh&quot;, &quot;aah&quot;</text><line x1="192" y1="122" x2="192" y2="246" stroke="#009E73" stroke-width="2" stroke-dasharray="4 3"/><circle cx="192" cy="250" r="6" fill="#009E73" stroke="none" stroke-width="1.5"/><rect x="117" y="70" width="150" height="52" rx="8" fill="#F4F7F9" stroke="#009E73" stroke-width="2"/><text x="192" y="91" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Babbling</text><text x="192" y="111" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">&quot;ba-ba-ba&quot;</text><line x1="334" y1="202" x2="334" y2="246" stroke="#D55E00" stroke-width="2" stroke-dasharray="4 3"/><circle cx="334" cy="250" r="6" fill="#D55E00" stroke="none" stroke-width="1.5"/><rect x="259" y="150" width="150" height="52" rx="8" fill="#F4F7F9" stroke="#D55E00" stroke-width="2"/><text x="334" y="171" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">One-word stage</text><text x="334" y="191" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">&quot;Doggy!&quot;</text><line x1="547" y1="122" x2="547" y2="246" stroke="#CC79A7" stroke-width="2" stroke-dasharray="4 3"/><circle cx="547" cy="250" r="6" fill="#CC79A7" stroke="none" stroke-width="1.5"/><rect x="472" y="70" width="150" height="52" rx="8" fill="#F4F7F9" stroke="#CC79A7" stroke-width="2"/><text x="547" y="91" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Telegraphic speech</text><text x="547" y="111" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">&quot;Want juice.&quot;</text><line x1="689" y1="202" x2="689" y2="246" stroke="#084F78" stroke-width="2" stroke-dasharray="4 3"/><circle cx="689" cy="250" r="6" fill="#084F78" stroke="none" stroke-width="1.5"/><rect x="614" y="150" width="150" height="52" rx="8" fill="#F4F7F9" stroke="#084F78" stroke-width="2"/><text x="689" y="171" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Sentences</text><text x="689" y="191" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">&quot;I goed outside.&quot;</text>
</svg>
