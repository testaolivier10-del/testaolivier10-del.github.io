<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="treatment-approaches-t treatment-approaches-d" font-family="Arial, Helvetica, sans-serif">
<title id="treatment-approaches-t">Approaches to treatment</title>
<desc id="treatment-approaches-d">Six rows, each an approach, what it targets and example techniques. Psychodynamic: unconscious conflicts; free association and dream interpretation. Humanistic: blocked growth; person-centered therapy with active listening and unconditional positive regard. Behavioral: learned behaviors and fears; exposure, systematic desensitization, aversion therapy, token economy. Cognitive: distorted negative thoughts; cognitive restructuring and REBT. Cognitive-behavioral: thoughts and behaviors together; CBT and DBT. Biomedical: brain chemistry and activity; medication, TMS, ECT and, rarely, psychosurgery.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-cer" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="880" height="520" fill="#FFFFFF"/>
<text x="440" y="34" font-size="20" font-weight="bold" fill="#1F2A28" text-anchor="middle">Approaches to treatment</text><text x="440" y="58" font-size="14" font-weight="normal" fill="#6B7472" text-anchor="middle">Psychotherapies (cerulean and vermillion) and biomedical therapy (green)</text><text x="42" y="94" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Approach</text><text x="272" y="94" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">What it targets</text><text x="572" y="94" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Example techniques</text><rect x="30" y="106" width="210" height="60" rx="8" fill="#084F78" stroke="none" stroke-width="1.5"/><text x="135" y="141" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Psychodynamic</text><line x1="242" y1="136" x2="256" y2="136" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="106" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.5"/><text x="272" y="130" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">unconscious conflicts from</text><text x="272" y="147" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">earlier experience</text><line x1="542" y1="136" x2="556" y2="136" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="106" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.5"/><text x="572" y="130" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">free association;</text><text x="572" y="147" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">dream interpretation</text><rect x="30" y="176" width="210" height="60" rx="8" fill="#084F78" stroke="none" stroke-width="1.5"/><text x="135" y="211" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Humanistic</text><line x1="242" y1="206" x2="256" y2="206" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="176" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.5"/><text x="272" y="200" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">blocked growth; a gap between</text><text x="272" y="217" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">self-concept and experience</text><line x1="542" y1="206" x2="556" y2="206" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="176" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#084F78" stroke-width="1.5"/><text x="572" y="200" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">person-centered therapy:</text><text x="572" y="217" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">active listening, UPR</text><rect x="30" y="246" width="210" height="60" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="135" y="281" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Behavioral</text><line x1="242" y1="276" x2="256" y2="276" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="246" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="272" y="270" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">learned behaviors and</text><text x="272" y="287" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">learned fears</text><line x1="542" y1="276" x2="556" y2="276" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="246" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="572" y="270" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">exposure; systematic desensitization;</text><text x="572" y="287" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">aversion therapy; token economy</text><rect x="30" y="316" width="210" height="60" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="135" y="351" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cognitive</text><line x1="242" y1="346" x2="256" y2="346" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="316" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="272" y="340" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">distorted, negative</text><text x="272" y="357" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">thoughts</text><line x1="542" y1="346" x2="556" y2="346" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="316" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="572" y="340" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">cognitive restructuring;</text><text x="572" y="357" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">REBT disputes irrational beliefs</text><rect x="30" y="386" width="210" height="60" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="135" y="421" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cognitive-behavioral</text><line x1="242" y1="416" x2="256" y2="416" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="386" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="272" y="410" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">thoughts and behaviors</text><text x="272" y="427" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">together</text><line x1="542" y1="416" x2="556" y2="416" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="386" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="572" y="410" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">CBT; DBT (skills for strong</text><text x="572" y="427" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">emotions)</text><rect x="30" y="456" width="210" height="60" rx="8" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="135" y="491" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Biomedical</text><line x1="242" y1="486" x2="256" y2="486" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="260" y="456" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="272" y="480" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">brain chemistry and</text><text x="272" y="497" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">brain activity</text><line x1="542" y1="486" x2="556" y2="486" stroke="#6B7472" stroke-width="1.5" marker-end="url(#ar-grey)"/><rect x="560" y="456" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="572" y="480" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">medication; TMS; ECT;</text><text x="572" y="497" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">rarely, psychosurgery</text>
</svg>
