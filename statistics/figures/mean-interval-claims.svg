<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Confidence intervals and a claimed value</title>
<desc id="d">Three horizontal confidence intervals for the true mean fill weight of cereal boxes, each centered at the sample mean 495.9 grams: 90% from 493.57 to 498.23, 95% from 493.10 to 498.70 and 99% from 492.13 to 499.67 grams. A dashed vertical line at 500 grams, the label value, lies to the right of all three intervals.</desc>
