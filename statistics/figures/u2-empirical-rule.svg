<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The empirical rule on a normal curve</title>
<desc id="d">Normal density curve for egg weights with mean 58 grams and standard deviation 4 grams, axis marked from 46 to 70 grams. Brackets show that about 68% of weights fall within 1 standard deviation (54 to 62 g), about 95% within 2 (50 to 66 g) and about 99.7% within 3 (46 to 70 g).</desc>
