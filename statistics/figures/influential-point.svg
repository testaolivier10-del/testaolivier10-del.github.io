<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An influential point changes the least-squares line</title>
<desc id="d">Ten players' practice hours (2 to 8) and free throw percentages (52 to 70) rise together. An eleventh player practices 16 hours and makes 58%. Without that player the least-squares slope is 2.92 percentage points per hour (solid line); with the player it drops to 0.49 (dashed line), so the point is influential.</desc>
