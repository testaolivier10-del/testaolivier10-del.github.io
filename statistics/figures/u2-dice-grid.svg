<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The 36 outcomes of rolling two dice</title>
<desc id="d">A 6 by 6 grid of the 36 equally likely outcomes when a red die and a blue die are rolled. The 5 outcomes with a sum of 8 are shaded: (2, 6), (3, 5), (4, 4), (5, 3) and (6, 2). So P(sum is 8) = 5/36.</desc>
