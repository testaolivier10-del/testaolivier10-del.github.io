<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="question-to-plan-t question-to-plan-d" font-family="Arial, Helvetica, sans-serif">
<title id="question-to-plan-t">From an investigative question to a data collection plan</title>
<desc id="question-to-plan-d">A flowchart. It starts at the investigative question, which names the variable, the population and the kind of answer wanted. First decision: data on every member of the population? If yes, a census. If no, a sample, and a second decision: does the researcher impose a condition? If yes, an experiment, where conditions decided by chance allow a cause-and-effect conclusion. If no, an observational study or sample survey, which shows how variables relate, but confounding blocks a cause-and-effect conclusion.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<rect x="230" y="14" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#6E2470" stroke-width="2"/><text x="360" y="36" font-size="14" font-weight="bold" fill="#6E2470" text-anchor="middle">Investigative question</text><text x="360" y="56" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">variable, population, the kind</text><text x="360" y="72" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">of answer you want</text><line x1="360" y1="76" x2="360" y2="104" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><rect x="200" y="106" width="320" height="52" rx="10" fill="#F7F8F8" stroke="#1F2A28" stroke-width="1.5"/><text x="360" y="128" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Data on every member of the population?</text><line x1="200" y1="132" x2="110" y2="132" stroke="#1F2A28" stroke-width="1.5"/><line x1="110" y1="132" x2="110" y2="206" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><text x="150" y="124" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">yes</text><rect x="20" y="208" width="180" height="62" rx="10" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="110" y="230" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Census</text><text x="110" y="250" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">the population itself,</text><text x="110" y="266" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">no sample needed</text><line x1="360" y1="158" x2="360" y2="186" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><text x="372" y="177" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">no, a sample</text><rect x="200" y="188" width="320" height="52" rx="10" fill="#F7F8F8" stroke="#1F2A28" stroke-width="1.5"/><text x="360" y="210" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Does the researcher impose a condition?</text><line x1="520" y1="214" x2="600" y2="214" stroke="#1F2A28" stroke-width="1.5"/><line x1="600" y1="214" x2="600" y2="262" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><text x="560" y="206" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">yes</text><rect x="500" y="264" width="200" height="82" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="600" y="286" font-size="14" font-weight="bold" fill="#00704F" text-anchor="middle">Experiment</text><text x="600" y="306" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">conditions decided by chance</text><text x="600" y="322" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">allow a cause-and-effect</text><text x="600" y="338" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">conclusion</text><line x1="360" y1="240" x2="360" y2="262" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><text x="372" y="256" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">no</text><rect x="220" y="264" width="270" height="82" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/><text x="355" y="286" font-size="13" font-weight="bold" fill="#005A8C" text-anchor="middle">Observational study or sample survey</text><text x="355" y="306" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">shows how variables relate;</text><text x="355" y="322" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">confounding blocks a</text><text x="355" y="338" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">cause-and-effect conclusion</text>
</svg>
