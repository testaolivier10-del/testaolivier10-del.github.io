<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="compare-and-z-t compare-and-z-d" font-family="Arial, Helvetica, sans-serif">
<title id="compare-and-z-t">Comparing two groups, and a z-score</title>
<desc id="compare-and-z-d">Top: parallel boxplots of delivery times in minutes for two restaurants, 15 orders each. Restaurant A has median 32 and a narrow box from 28 to 36. Restaurant B has a lower median, 27, a wider box from 23 to 37, a long right whisker and one high outlier at 60. Bottom: a z-score number line from minus 3 to plus 3 with the mean at 0; a value with z = 1.5 sits 1.5 standard deviations above the mean.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="412" fill="#FFFFFF"/>
<text x="20" y="26" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="start">Two restaurants, 15 orders each</text><line x1="140" y1="180" x2="690" y2="180" stroke="#1F2A28" stroke-width="1.5"/><line x1="140" y1="180" x2="140" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="140" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">15</text><line x1="195" y1="180" x2="195" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="195" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">20</text><line x1="250" y1="180" x2="250" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="250" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">25</text><line x1="305" y1="180" x2="305" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="305" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">30</text><line x1="360" y1="180" x2="360" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="360" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">35</text><line x1="415" y1="180" x2="415" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="415" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">40</text><line x1="470" y1="180" x2="470" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="470" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">45</text><line x1="525" y1="180" x2="525" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="525" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">50</text><line x1="580" y1="180" x2="580" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="580" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">55</text><line x1="635" y1="180" x2="635" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="635" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">60</text><line x1="690" y1="180" x2="690" y2="185" stroke="#1F2A28" stroke-width="1.5"/><text x="690" y="199" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">65</text><text x="415" y="220" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Delivery time (minutes)</text><text x="120" y="80" font-size="13" font-weight="bold" fill="#0072B2" text-anchor="end">Restaurant A</text><rect x="283" y="60" width="88" height="32" rx="0" fill="#E5F1F8" stroke="#0072B2" stroke-width="2"/><line x1="327" y1="60" x2="327" y2="92" stroke="#0072B2" stroke-width="3"/><line x1="217" y1="76" x2="283" y2="76" stroke="#0072B2" stroke-width="2"/><line x1="371" y1="76" x2="459" y2="76" stroke="#0072B2" stroke-width="2"/><line x1="217" y1="68" x2="217" y2="84" stroke="#0072B2" stroke-width="2"/><line x1="459" y1="68" x2="459" y2="84" stroke="#0072B2" stroke-width="2"/><text x="120" y="140" font-size="13" font-weight="bold" fill="#009E73" text-anchor="end">Restaurant B</text><rect x="228" y="120" width="154" height="32" rx="0" fill="#E3F4EE" stroke="#009E73" stroke-width="2"/><line x1="272" y1="120" x2="272" y2="152" stroke="#009E73" stroke-width="3"/><line x1="173" y1="136" x2="228" y2="136" stroke="#009E73" stroke-width="2"/><line x1="382" y1="136" x2="503" y2="136" stroke="#009E73" stroke-width="2"/><line x1="173" y1="128" x2="173" y2="144" stroke="#009E73" stroke-width="2"/><line x1="503" y1="128" x2="503" y2="144" stroke="#009E73" stroke-width="2"/><circle cx="635" cy="136" r="5" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="20" y="278" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="start">A z-score counts standard deviations from the mean</text><line x1="60" y1="360" x2="680" y2="360" stroke="#1F2A28" stroke-width="1.5"/><line x1="60" y1="360" x2="60" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="60" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">-3</text><line x1="163.33" y1="360" x2="163.33" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="163.33" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">-2</text><line x1="266.67" y1="360" x2="266.67" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="266.67" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">-1</text><line x1="370" y1="360" x2="370" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="370" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="473.33" y1="360" x2="473.33" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="473.33" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">+1</text><line x1="576.67" y1="360" x2="576.67" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="576.67" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">+2</text><line x1="680" y1="360" x2="680" y2="365" stroke="#1F2A28" stroke-width="1.5"/><text x="680" y="379" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">+3</text><text x="370" y="400" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">z-score</text><line x1="370" y1="300" x2="370" y2="360" stroke="#8A9290" stroke-width="1.5" stroke-dasharray="4 4"/><text x="370" y="296" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">the mean</text><circle cx="525" cy="352" r="7" fill="#6E2470" stroke="none" stroke-width="1.5"/><line x1="370" y1="330" x2="523" y2="330" stroke="#6E2470" stroke-width="2" marker-end="url(#ar-plum)"/><text x="447.5" y="322" font-size="12" font-weight="bold" fill="#6E2470" text-anchor="middle">1.5 SDs above</text><text x="537" y="314" font-size="12" font-weight="bold" fill="#6E2470" text-anchor="start">value with z = 1.5</text>
</svg>
