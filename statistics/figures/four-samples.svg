<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="four-samples-t four-samples-d" font-family="Arial, Helvetica, sans-serif">
<title id="four-samples-t">Four random sampling methods on one population</title>
<desc id="four-samples-d">Four copies of the same population of 48 students in 6 homerooms of 8, with selected students in plum. Simple random sample: any 8 of the 48, scattered. Stratified random sample: the grades are strata, two homerooms each, and 3 students are chosen at random from each grade. Cluster sample: 2 whole homerooms chosen at random. Systematic random sample: a random start at the 3rd student, then every 6th student in order.</desc>
