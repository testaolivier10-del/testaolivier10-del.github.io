<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="study-path-t study-path-d" font-family="Arial, Helvetica, sans-serif">
<title id="study-path-t">From a population to a conclusion</title>
<desc id="study-path-d">A study of a school. On the left, a population of 2,400 students drawn as gray dots, a few in plum. An arrow labeled choose leads to a sample of 120 students. An arrow labeled ask leads to the data: each answer is yes or no, and 78 of 120 say yes. A curved arrow returns to the population with the conclusion, in context: about 65% of the school's students say yes.</desc>
