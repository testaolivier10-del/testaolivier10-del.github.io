<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sampling distribution of the sample mean</title>
<desc id="d">Three histograms on the same axis from 0 to 14 minutes. Top: 20,000 simulated drive-through wait times, strongly skewed right, mean 4.19 and standard deviation 2.78. Middle: 5,000 means of samples of 4 cars, still skewed right, standard deviation 1.41. Bottom: 5,000 means of samples of 40 cars, bell shaped and narrow, standard deviation 0.439, close to 2.8 divided by the square root of 40. A dashed line marks the population mean 4.2 in every panel.</desc>
