opacity="0.14" rx="8"/><text x="298" y="115" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">d₂ = A − B</text><circle cx="40" cy="150" r="13" fill="#5A6662"/><text x="40" y="155" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><rect x="64" y="136" width="70" height="28" fill="#0072B2" stroke="#0072B2" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="99" y="155" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe A</text><rect x="142" y="136" width="70" height="28" fill="#D55E00" stroke="#D55E00" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="177" y="155" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe B</text><line x1="218" y1="150" x2="248" y2="150" stroke="#1F2A28" stroke-width="2"/><path d="M250,150L241.9,153.91L241.9,146.09Z" fill="#1F2A28"/><rect x="256" y="136" width="84" height="28" fill="#6E2470" stroke="#6E2470" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="298" y="155" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">d₃ = A − B</text><circle cx="40" cy="190" r="13" fill="#5A6662"/><text x="40" y="195" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><rect x="64" y="176" width="70" height="28" fill="#0072B2" stroke="#0072B2" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="99" y="195" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe A</text><rect x="142" y="176" width="70" height="28" fill="#D55E00" stroke="#D55E00" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="177" y="195" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe B</text><line x1="218" y1="190" x2="248" y2="190" stroke="#1F2A28" stroke-width="2"/><path d="M250,190L241.9,193.91L241.9,186.09Z" fill="#1F2A28"/><rect x="256" y="176" width="84" height="28" fill="#6E2470" stroke="#6E2470" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="298" y="195" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">d₄ = A − B</text><circle cx="40" cy="230" r="13" fill="#5A6662"/><text x="40" y="235" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><rect x="64" y="216" width="70" height="28" fill="#0072B2" stroke="#0072B2" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="99" y="235" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe A</text><rect x="142" y="216" width="70" height="28" fill="#D55E00" stroke="#D55E00" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="177" y="235" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">shoe B</text><line x1="218" y1="230" x2="248" y2="230" stroke="#1F2A28" stroke-width="2"/><path d="M250,230L241.9,233.91L241.9,226.09Z" fill="#1F2A28"/><rect x="256" y="216" width="84" height="28" fill="#6E2470" stroke="#6E2470" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="298" y="235" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">d₅ = A − B</text><text x="180" y="270" font-size="14" fill="#5A6662" text-anchor="middle">⋮  one difference per runner</text><line x1="298" y1="290" x2="298" y2="320" stroke="#6E2470" stroke-width="2"/><path d="M298,322L294.09,313.9L301.91,313.9Z" fill="#6E2470"/><rect x="40" y="330" width="300" height="46" fill="#6E2470" stroke="#6E2470" stroke-width="2" fill-opacity="0.14" rx="8"/><text x="190" y="358" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="bold">one sample of differences</text><text x="190" y="404" font-size="15" fill="#6E2470" text-anchor="middle" font-weight="bold">paired t test on μd, df = pairs − 1</text><text x="190" y="430" font-size="14" fill="#5A6662" text-anchor="middle">runner-to-runner variation cancels</text><text x="540" y="30" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">Two groups: runners split at random</text><rect x="395" y="50" width="135" height="34" fill="#0072B2" stroke="#0072B2" stroke-wid