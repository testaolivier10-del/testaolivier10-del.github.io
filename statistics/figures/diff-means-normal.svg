<title id="t">Sampling distribution of a difference in sample means</title>
<desc id="d">Top: two normal curves for the sample mean apple weight, orchard A centered at 180 grams with standard deviation 3.16 and orchard B centered at 170 grams with standard deviation 3.54. Bottom: a wider normal curve for the difference of the two sample means, centered at 10 grams with standard deviation 4.74; the area below 0, shaded, is 0.0175.</desc>
