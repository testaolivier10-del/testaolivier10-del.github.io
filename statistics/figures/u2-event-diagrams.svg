<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Events that cannot happen together, and events that can</title>
<desc id="d">Two diagrams of events inside a rectangle of all outcomes. Left: events A and B as separate circles that do not touch, so A and B cannot happen together and P(A and B) = 0. Right: circles that overlap; the shaded overlap is the joint event A and B.</desc>
<rect width="680" height="300" fill="#FFFFFF"/>
<rect x="20" y="40" width="300" height="200" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.4"/>
<text x="170" y="28" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Mutually exclusive</text>
<rect x="360" y="40" width="300" height="200" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.4"/>
<text x="510" y="28" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Not mutually exclusive</text>
<circle cx="105" cy="140" r="62" fill="#6E2470" fill-opacity="0.18" stroke="#6E2470" stroke-width="2.4"/>
<circle cx="235" cy="140" r="56" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="2.4"/>
<text x="105" y="146" font-size="20" text-anchor="middle" font-weight="bold" fill="#6E2470">A</text>
<text x="235" y="146" font-size="20" text-anchor="middle" font-weight="bold" fill="#0072B2">B</text>
<text x="170" y="262" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">P(A and B) = 0</text>
<clipPath id="cA"><circle cx="480" cy="140" r="70"/></clipPath>
<circle cx="560" cy="140" r="66" fill="#D55E00" fill-opacity="0.45" clip-path="url(#cA)"/>
<circle cx="480" cy="140" r="70" fill="none" stroke="#6E2470" stroke-width="2.4"/>
<circle cx="560" cy="140" r="66" fill="none" stroke="#0072B2" stroke-width="2.4"/>
<text x="450" y="146" font-size="20" text-anchor="middle" font-weight="bold" fill="#6E2470">A</text>
<text x="595" y="146" font-size="20" text-anchor="middle" font-weight="bold" fill="#0072B2">B</text>
<text x="521" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#1F2A28" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">A and B</text>
<text x="510" y="262" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">P(A and B) &gt; 0</text>
</svg>
