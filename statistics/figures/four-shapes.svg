<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="four-shapes-t four-shapes-d" font-family="Arial, Helvetica, sans-serif">
<title id="four-shapes-t">Four common shapes of a distribution</title>
<desc id="four-shapes-d">Four histograms. Top left, roughly symmetric: one peak in the middle with matching sides. Top right, skewed right: most values on the left and a long tail to the right. Bottom left, skewed left: most values on the right and a long tail to the left. Bottom right, bimodal: two separate peaks.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="400" fill="#FFFFFF"/>
