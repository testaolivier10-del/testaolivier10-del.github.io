<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="frame-and-response-t frame-and-response-d" font-family="Arial, Helvetica, sans-serif">
<title id="frame-and-response-t">Where a random sample can still go wrong</title>
<desc id="frame-and-response-d">Nested ovals. The largest is the population, all adults in the town. Inside it, the sampling frame, a list of landline numbers, which leaves part of the population out: undercoverage, people not on the list can never be chosen. Inside the frame, the sample chosen at random, and inside that the people who responded. Chosen people who do not answer are nonresponse. Answers that are not true, from wording or pressure, are response bias.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="330" fill="#FFFFFF"/>
<ellipse cx="250" cy="165" rx="240" ry="140" fill="#F7F8F8" stroke="#1F2A28" stroke-width="1.5"/><text x="70" y="62" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Population</text><text x="70" y="80" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">all adults in the town</text><ellipse cx="320" cy="175" rx="165" ry="105" fill="#E5F1F8" stroke="#0072B2" stroke-width="2"/><text x="320" y="98" font-size="14" font-weight="bold" fill="#005A8C" text-anchor="middle">Sampling frame</text><text x="320" y="115" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">the list: landline numbers</text><ellipse cx="340" cy="200" rx="80" ry="55" fill="#F5E6F4" stroke="#6E2470" stroke-width="2"/><text x="340" y="185" font-size="14" font-weight="bold" fill="#6E2470" text-anchor="middle">Sample</text><text x="340" y="202" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">chosen at random</text><path d="M 290 222 A 52 30 0 0 0 390 222 z" fill="#6E2470" opacity="0.85"/><text x="340" y="238" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">responded</text><text x="28" y="140" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">Undercoverage:</text><text x="28" y="155" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">people not on</text><text x="28" y="170" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">the list can</text><text x="28" y="185" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">never be chosen</text><line x1="420" y1="190" x2="535" y2="140" stroke="#8A9290" stroke-width="1.5"/><text x="540" y="112" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">Nonresponse:</text><text x="540" y="127" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">chosen people who</text><text x="540" y="142" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">do not answer</text><line x1="390" y1="232" x2="535" y2="262" stroke="#8A9290" stroke-width="1.5"/><text x="540" y="258" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">Response bias:</text><text x="540" y="273" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">answers that are not</text><text x="540" y="288" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="start">true (wording, pressure)</text>
</svg>
