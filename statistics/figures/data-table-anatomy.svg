<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" role="img" aria-labelledby="data-table-anatomy-t data-table-anatomy-d" font-family="Arial, Helvetica, sans-serif">
<title id="data-table-anatomy-t">Rows, columns and types of variables</title>
<desc id="data-table-anatomy-d">A data table about shelter dogs with columns Dog, Size group, Vaccinated?, Times adopted and Weight in kilograms, and four dogs as rows. Size group and Vaccinated? are tagged categorical. Times adopted is tagged quantitative, discrete. Weight is tagged quantitative, continuous. One row is outlined and labelled: a row is one observational unit, one dog. The weight column is outlined and labelled: a column is one variable, a characteristic recorded for every dog.</desc>
