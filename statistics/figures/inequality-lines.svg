t-anchor="middle">8</text><text x="20" y="269" font-size="14" font-weight="bold" fill="#6E2470" text-anchor="start">fewer than 3</text><text x="20" y="287" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">X &lt; 3, so X ≤ 2</text><line x1="200" y1="264" x2="690" y2="264" stroke="#B8BFBD" stroke-width="1.5"/><circle cx="215" cy="264" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="215" y="268.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text><circle cx="273" cy="264" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="273" y="268.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="331" cy="264" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="331" y="268.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="389" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="389" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">3</text><circle cx="447" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="447" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">4</text><circle cx="505" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="505" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">5</text><circle cx="563" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="563" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">6</text><circle cx="621" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="621" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">7</text><circle cx="679" cy="264" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="679" y="268.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">8</