<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="inequality-lines-t inequality-lines-d" font-family="Arial, Helvetica, sans-serif">
<title id="inequality-lines-t">Inequality words on a number line</title>
<desc id="inequality-lines-d">Four number lines for a count from 0 to 8, with the included counts filled in plum. At least 3, X ≥ 3: 3 through 8. More than 3, X &gt; 3: 4 through 8. At most 3, X ≤ 3: 0 through 3. Fewer than 3, X &lt; 3, so X ≤ 2: 0, 1 and 2.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="330" fill="#FFFFFF"/>
<text x="20" y="24" font-size="13.5" font-weight="bold" fill="#1F2A28" text-anchor="start">A count X can be 0, 1, 2, ... , 8. Which counts does each phrase include?</text><text x="20" y="71" font-size="14" font-weight="bold" fill="#6E2470" text-anchor="start">at least 3</text><text x="20" y="89" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">X ≥ 3</text><line x1="200" y1="66" x2="690" y2="66" stroke="#B8BFBD" stroke-width="1.5"/><circle cx="215" cy="66" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="215" y="70.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">0</text><circle cx="273" cy="66" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="273" y="70.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">1</text><circle cx="331" cy="66" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="331" y="70.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">2</text><circle cx="389" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="389" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="447" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="447" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="505" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="505" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="563" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="563" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="621" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="621" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><circle cx="679" cy="66" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="679" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text><text x="20" y="137" font-size="14" font-weight="bold" fill="#6E2470" text-anchor="start">more than 3</text><text x="20" y="155" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">X &gt; 3</text><line x1="200" y1="132" x2="690" y2="132" stroke="#B8BFBD" stroke-width="1.5"/><circle cx="215" cy="132" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="215" y="136.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">0</text><circle cx="273" cy="132" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="273" y="136.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">1</text><circle cx="331" cy="132" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="331" y="136.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">2</text><circle cx="389" cy="132" r="11" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="389" y="136.5" font-size="12" font-weight="bold" fill="#8A9290" text-anchor="middle">3</text><circle cx="447" cy="132" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="447" y="136.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="505" cy="132" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="505" y="136.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="563" cy="132" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="563" y="136.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="621" cy="132" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="621" y="136.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><circle cx="679" cy="132" r="11" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="679" y="136.5" font-size="1