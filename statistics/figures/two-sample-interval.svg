<title id="t">Two groups and an interval for the difference in means</title>
<desc id="d">Top: side-by-side boxplots of words recalled. Spaced practice: min 25, Q1 29, median 35, Q3 39, max 44. Massed practice: min 16, Q1 25, median 29, Q3 34, max 39. Neither has outliers. Bottom: the 95% confidence interval for the true difference in mean recall, spaced minus massed, from 0.61 to 10.81 words, centered at 5.71, entirely to the right of a dashed line at 0.</desc>
