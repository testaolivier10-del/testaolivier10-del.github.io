<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Library cards by age group</title>
<desc id="d">Segmented bar chart of library card ownership by age group for 500 adults: 50% of the 180 adults aged 18 to 34 have a card, 60% of the 200 aged 35 to 54, and 70% of the 120 aged 55 and over.</desc>
<rect width="640" height="380" fill="#FFFFFF"/>
<line x1="82" y1="290" x2="442" y2="290" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="238" x2="442" y2="238" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="186" x2="442" y2="186" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="134" x2="442" y2="134" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="82" x2="442" y2="82" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="30" x2="442" y2="30" stroke="#E4E7E6" stroke-width="1"/>
<line x1="82" y1="290" x2="442" y2="290" stroke="#1F2A28" stroke-width="1.4"/>
<line x1="82" y1="30" x2="82" y2="290" stroke="#1F2A28" stroke-width="1.4"/>
<line x1="77" y1="290" x2="82" y2="290" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="294.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">0%</text>
<line x1="77" y1="238" x2="82" y2="238" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="242.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">20%</text>
<line x1="77" y1="186" x2="82" y2="186" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="190.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">40%</text>
<line x1="77" y1="134" x2="82" y2="134" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="138.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">60%</text>
<line x1="77" y1="82" x2="82" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="86.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">80%</text>
<line x1="77" y1="30" x2="82" y2="30" stroke="#1F2A28" stroke-width="1.2"/>
<text x="73" y="34.5" font-size="13" text-anchor="end" font-weight="normal" fill="#1F2A28">100%</text>
<text x="36" y="160" font-size="14" text-anchor="middle" fill="#1F2A28" transform="rotate(-90 36 160)">Percent of group</text>
<rect x="103.6" y="160" width="76.8" height="130" fill="#6E2470" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="142" y="230" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF">50%</text>
<rect x="103.6" y="30" width="76.8" height="130" fill="#E9D3E8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="142" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28">50%</text>
<text x="142" y="310" font-size="13" text-anchor="middle" font-weight="normal" fill="#1F2A28">18 to 34</text>
<text x="142" y="327" font-size="12" text-anchor="middle" font-weight="normal" fill="#5A6563">(n = 180)</text>
<rect x="223.6" y="134" width="76.8" height="156" fill="#6E2470" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="262" y="217" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF">60%</text>
<rect x="223.6" y="30" width="76.8" height="104" fill="#E9D3E8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="262" y="87" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28">40%</text>
<text x="262" y="310" font-size="13" text-anchor="middle" font-weight="normal" fill="#1F2A28">35 to 54</text>
<text x="262" y="327" font-size="12" text-anchor="middle" font-weight="normal" fill="#5A6563">(n = 200)</text>
<rect x="343.6" y="108" width="76.8" height="182" fill="#6E2470" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="382" y="204" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF">70%</text>
<rect x="343.6" y="30" width="76.8" height="78" fill="#E9D3E8" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="382" y="74" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28">30%</text>
<text x="382" y="310" font-size="13" text-anchor="middle" font-weight="normal" fill="#1F2A28">55 and over</text>
<text x="382" y="327" font-size="12" text-anchor="middle" font-weight="normal" fill="#5A6563">(n = 120)</text>
<text x="262" y="352" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Age group (years)</text>
<text x="478" y="38" font-size="14" text-anchor="start" font-weight="bold" fill="#1F2A28">Library card</text>
<rect x="478" y="56" width="18" height="18" fill="#E9D3E8" stroke="#1F2A28" stroke-width="0.6"/>
<text x="504" y="70" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">No card</text>
<rect x="478" y="84" width="18" height="18" fill="#6E2470" stroke="#1F2A28" stroke-width="0.6"/>
<text x="504" y="98" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Has a card</text>
</svg>
