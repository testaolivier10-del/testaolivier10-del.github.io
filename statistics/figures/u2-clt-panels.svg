<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sample means from a skewed population</title>
<desc id="d">Three panels. Top: the population of wait times, a strongly right-skewed curve with mean 5 minutes and standard deviation 5 minutes. Middle: histogram of 2000 simulated sample means for samples of 2, still skewed right. Bottom: histogram of 2000 sample means for samples of 30, close to a symmetric bell shape centered at 5 with a much smaller spread, about 0.91 minutes.</desc>
