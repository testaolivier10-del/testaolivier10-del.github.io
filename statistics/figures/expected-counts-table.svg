<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Observed and expected counts in a two-way table</title>
<desc id="d">Two-way table of 400 adults by age group (18 to 34, 35 to 54, 55 and older) and main news source (social media, TV, news websites). Each cell shows the observed count and, in parentheses, the expected count if there were no association: 18 to 34: 62 (39), 18 (39), 40 (42); 35 to 54: 45 (45.5), 40 (45.5), 55 (49); 55 and older: 23 (45.5), 72 (45.5), 45 (49). The 55 and older, TV cell is highlighted: expected = 140 times 130 divided by 400 = 45.5.</desc>
<rect width="700" height="330" fill="#ffffff"/>
<text x="375" y="26" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Main news source</text><text x="225" y="80" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Social media</text><text x="375" y="80" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">TV</text><text x="525" y="80" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">News websites</text><text x="640" y="80" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Total</text><text x="24" y="80" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">Age group</text><rect x="20" y="92" width="660" height="52" fill="#ffffff" stroke="#E6E9E8"/><text x="26" y="123" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">18 to 34</text><text x="217" y="124" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">62</text><text x="223" y="124" font-size="14" fill="#0072B2" text-anchor="start">(39)</text><text x="367" y="124" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">18</text><text x="373" y="124" font-size="14" fill="#0072B2" text-anchor="start">(39)</text><text x="517" y="124" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">40</text><text x="523" y="124" font-size="14" fill="#0072B2" text-anchor="start">(42)</text><text x="640" y="124" font-size="13" fill="#1F2A28" text-anchor="middle">120</text><rect x="20" y="144" width="660" height="52" fill="#FAFBFA" stroke="#E6E9E8"/><text x="26" y="175" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">35 to 54</text><text x="217" y="176" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">45</text><text x="223" y="176" font-size="14" fill="#0072B2" text-anchor="start">(45.5)</text><text x="367" y="176" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">40</text><text x="373" y="176" font-size="14" fill="#0072B2" text-anchor="start">(45.5)</text><text x="517" y="176" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">55</text><text x="523" y="176" font-size="14" fill="#0072B2" text-anchor="start">(49)</text><text x="640" y="176" font-size="13" fill="#1F2A28" text-anchor="middle">140</text><rect x="20" y="196" width="660" height="52" fill="#ffffff" stroke="#E6E9E8"/><text x="26" y="227" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">55 and older</text><text x="217" y="228" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">23</text><text x="223" y="228" font-size="14" fill="#0072B2" text-anchor="start">(45.5)</text><rect x="306" y="201" width="138" height="42" rx="6" fill="#F5E6F4" stroke="#6E2470" stroke-width="1.6"/><text x="367" y="228" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">72</text><text x="373" y="228" font-size="14" fill="#0072B2" text-anchor="start">(45.5)</text><text x="517" y="228" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">45</text><text x="523" y="228" font-size="14" fill="#0072B2" text-anchor="start">(49)</text><text x="640" y="228" font-size="13" fill="#1F2A28" text-anchor="middle">140</text><line x1="20" y1="248" x2="680" y2="248" stroke="#1F2A28" stroke-width="1.4"/><text x="26" y="272" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">Total</text><text x="225" y="272" font-size="13" fill="#1F2A28" text-anchor="middle">130</text><text x="375" y="272" font-size="13" fill="#1F2A28" text-anchor="middle">130</text><text x="525" y="272" font-size="13" fill="#1F2A28" text-anchor="middle">140</text><text x="640" y="272" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">400</text><text x="26" y="306" font-size="13" fill="#6E2470" text-anchor="start" font-weight="bold">Observed count in black, (expected count) in blue. Highlighted: expected = 140 × 130 / 400 = 45.5</text>
</svg>
