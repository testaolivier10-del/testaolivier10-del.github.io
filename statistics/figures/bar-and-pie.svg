<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="bar-and-pie-t bar-and-pie-d" font-family="Arial, Helvetica, sans-serif">
<title id="bar-and-pie-t">The same data as a bar chart and a pie chart</title>
<desc id="bar-and-pie-d">Left: a bar chart of how 250 students get to school, with relative frequency on the vertical axis from 0 to 0.4: Bus 0.38, Car 0.32, Walk 0.18, Bike 0.08, Other 0.04. Right: a pie chart of the same data, with slices Bus 38%, Car 32%, Walk 18%, Bike 8%, Other 4%.</desc>
