<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">t distributions and the standard normal</title>
<desc id="d">Three bell-shaped density curves centered at 0 on an axis from -4.5 to 4.5: the standard normal (solid black), the t distribution with 15 degrees of freedom (dashed blue) and the t distribution with 3 degrees of freedom (orange), which is lowest in the middle and highest in the tails. Dashed marks show the 95% critical values: z* = 1.96, t* = 2.131 for 15 df and t* = 3.182 for 3 df. The outer 5% of the 3 df curve is shaded.</desc>
