<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="block-design-t block-design-d" font-family="Arial, Helvetica, sans-serif">
<title id="block-design-t">A randomized block design</title>
<desc id="block-design-d">Forty tomato plants, the experimental units, are split into two blocks by location: 24 plants on a sunny bench and 16 on a shady bench. Within each block, random assignment puts half the plants on fertilizer A and half on fertilizer B (12 and 12 on the sunny bench, 8 and 8 on the shady bench). The response, tomato weight, is compared within each block. Each block is a small completely randomized experiment.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<rect x="10" y="140" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="75" y="162" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">40 plants</text><text x="75" y="182" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">experimental</text><text x="75" y="198" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">units</text><line x1="140" y1="175" x2="172" y2="80" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><rect x="175" y="30" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/><text x="250" y="52" font-size="14" font-weight="bold" fill="#A84300" text-anchor="middle">Block 1</text><text x="250" y="72" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">sunny bench</text><text x="250" y="88" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">24 plants</text><line x1="325" y1="80" x2="333" y2="80" stroke="#6E2470" stroke-width="1.5"/><text x="364" y="76" font-size="11.5" font-weight="bold" fill="#6E2470" text-anchor="middle">random</text><text x="364" y="90" font-size="11.5" font-weight="bold" fill="#6E2470" text-anchor="middle">assignment</text><line x1="398" y1="80" x2="438" y2="52" stroke="#6E2470" stroke-width="1.5" marker-end="url(#ar-plum)"/><line x1="398" y1="80" x2="438" y2="110" stroke="#6E2470" stroke-width="1.5" marker-end="url(#ar-plum)"/><rect x="440" y="32" width="134" height="38" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="507" y="54" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fertilizer A (12)</text><rect x="440" y="90" width="134" height="38" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="507" y="112" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fertilizer B (12)</text><line x1="574" y1="51" x2="598" y2="74" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><line x1="574" y1="109" x2="598" y2="86" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><rect x="600" y="48" width="112" height="64" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="656" y="70" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Compare</text><text x="656" y="90" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">tomato weight</text><text x="656" y="106" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">within the block</text><line x1="140" y1="175" x2="172" y2="250" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><rect x="175" y="200" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/><text x="250" y="222" font-size="14" font-weight="bold" fill="#005A8C" text-anchor="middle">Block 2</text><text x="250" y="242" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">shady bench</text><text x="250" y="258" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">16 plants</text><line x1="325" y1="250" x2="333" y2="250" stroke="#6E2470" stroke-width="1.5"/><text x="364" y="246" font-size="11.5" font-weight="bold" fill="#6E2470" text-anchor="middle">random</text><text x="364" y="260" font-size="11.5" font-weight="bold" fill="#6E2470" text-anchor="middle">assignment</text><line x1="398" y1="250" x2="438" y2="222" stroke="#6E2470" stroke-width="1.5" marker-end="url(#ar-plum)"/><line x1="398" y1="250" x2="438" y2="280" stroke="#6E2470" stroke-width="1.5" marker-end="url(#ar-plum)"/><rect x="440" y="202" width="134" height="38" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="507" y="224" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fertilizer A (8)</text><rect x="440" y="260" width="134" height="38" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="1.5"/><text x="507" y="282" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fertilizer B (8)</text><line x1="574" y1="221" x2="598" y2="244" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><line x1="574" y1="279" x2="598" y2="256" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><rect x="600" y="218" width="112" height="64" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="656" y="240" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Compare</text><text x="656" y="260" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">tomato weight</text><text x="656" y="276" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">within the block</text><text x="360" y="352" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Each block is a small completely randomized experiment; results are compared within blocks.</text>
</svg>
