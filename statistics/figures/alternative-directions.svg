<circle cx="320" cy="280" r="7" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.4"/>
<text x="40" y="372" font-size="15" fill="#5A6563">The open dot is the null value p₀ = 0.70; the plum part is what Hₐ claims.</text>
