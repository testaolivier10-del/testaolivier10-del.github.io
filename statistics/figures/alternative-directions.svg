<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The three directions of an alternative hypothesis</title>
<desc id="d">Three number lines for a proportion from 0.55 to 0.85, each with the null value 0.70 marked by a dot. First, alternative "p &lt; 0.70": the values below 0.70 are highlighted. Second, alternative "p &gt; 0.70": the values above 0.70 are highlighted. Third, alternative "p is not 0.70": the values on both sides of 0.70 are highlighted. The direction comes from the research question, before any data are seen.</desc>
<rect width="640" height="392" fill="#FFFFFF"/>
<text x="40" y="40" font-size="16" font-weight="bold" fill="#1F2A28">Hₐ: p &lt; 0.70   (the claim is "less than")</text>
<line x1="60" y1="70" x2="579.9999999999999" y2="70" stroke="#1F2A28" stroke-width="1.6"/>
<line x1="311" y1="70" x2="68.67" y2="70" stroke="#6E2470" stroke-width="9" stroke-linecap="round" stroke-opacity="0.85"/>
<path d="M58 70 l12 -9 v18 z" fill="#6E2470"/>
<line x1="60" y1="76" x2="60" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="60" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.55</text>
<line x1="146.67" y1="76" x2="146.67" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="146.67" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.6</text>
<line x1="233.33" y1="76" x2="233.33" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="233.33" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.65</text>
<line x1="320" y1="76" x2="320" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="320" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.7</text>
<line x1="406.67" y1="76" x2="406.67" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="406.67" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.75</text>
<line x1="493.33" y1="76" x2="493.33" y2="82" stroke="#1F2A28" stroke-width="1.2"/>
<text x="493.33" y="100" font-size="15" text-anchor="middle" fill="#1F2A28">0.8</text>
