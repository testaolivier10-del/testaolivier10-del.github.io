<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Joint, marginal and conditional relative frequencies in one table</title>
<desc id="d">The two-way table of 250 park visitors by visit type and activity, with three cells marked. The joint cell, first visit and hiking, holds 45 of all 250 visitors (0.18). The marginal total for hiking is 105 of 250 (0.42). The conditional share of hikers among first visits is 45 of the 100 first visits (0.45).</desc>
<rect width="680" height="330" fill="#FFFFFF"/>
<rect x="174" y="68" width="368" height="46" fill="#CFE3F1" stroke="none" stroke-width="1"/>
<rect x="174" y="160" width="92" height="46" fill="#E9D3E8" stroke="none" stroke-width="1"/>
<text x="99" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28"></text>
<text x="220" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Hiking</text>
<text x="312" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Fishing</text>
<text x="404" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Picnic</text>
<text x="496" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Total</text>
<text x="34" y="97" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2A28">First visit</text>
<text x="220" y="97" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">45</text>
<text x="312" y="97" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">15</text>
<text x="404" y="97" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">40</text>
<text x="496" y="97" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">100</text>
<text x="34" y="143" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2A28">Returning</text>
<text x="220" y="143" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">60</text>
<text x="312" y="143" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">54</text>
<text x="404" y="143" font-size="15" text-anchor="middle" font-weight="normal" fill="#1F2A28">36</text>
<text x="496" y="143" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">150</text>
<text x="34" y="189" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2A28">Total</text>
<text x="220" y="189" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">105</text>
<text x="312" y="189" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">69</text>
<text x="404" y="189" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">76</text>
<text x="496" y="189" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">250</text>
<line x1="24" y1="22" x2="542" y2="22" stroke="#E4E7E6" stroke-width="1"/>
<line x1="24" y1="68" x2="542" y2="68" stroke="#1F2A28" stroke-width="1.4"/>
<line x1="24" y1="114" x2="542" y2="114" stroke="#E4E7E6" stroke-width="1"/>
<line x1="24" y1="160" x2="542" y2="160" stroke="#1F2A28" stroke-width="1.4"/>
<line x1="24" y1="206" x2="542" y2="206" stroke="#E4E7E6" stroke-width="1"/>
<line x1="450" y1="22" x2="450" y2="206" stroke="#1F2A28" stroke-width="1.4"/>
<circle cx="220" cy="92" r="19" fill="none" stroke="#D55E00" stroke-width="2.6"/>
<circle cx="34" cy="236" r="8" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="50" y="241" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Joint: first visit and hiking, 45 / 250 = 0.18 of all visitors</text>
<rect x="26" y="254" width="16" height="16" fill="#E9D3E8" stroke="none" stroke-width="1"/>
<text x="50" y="267" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Marginal: hiking, 105 / 250 = 0.42 of all visitors</text>
<rect x="26" y="280" width="16" height="16" fill="#CFE3F1" stroke="none" stroke-width="1"/>
<text x="50" y="293" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Conditional: hiking among first visits, 45 / 100 = 0.45</text>
</svg>
