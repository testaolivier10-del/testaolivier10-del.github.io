<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How a 95% confidence interval is built</title>
<desc id="d">Top: the normal sampling distribution of the sample proportion, centered at the unknown true proportion p, with the middle 95% shaded between p minus 1.96 standard deviations and p plus 1.96 standard deviations. Below it, three sample proportions are drawn with their intervals, each the sample proportion plus or minus 1.96 standard deviations. The two sample proportions that land inside the shaded middle 95% give intervals that reach across p; the one that lands in the tail gives an interval that misses p.</desc>
