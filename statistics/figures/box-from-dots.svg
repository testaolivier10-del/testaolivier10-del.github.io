<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="box-from-dots-t box-from-dots-d" font-family="Arial, Helvetica, sans-serif">
<title id="box-from-dots-t">A dotplot and the boxplot of the same data</title>
<desc id="box-from-dots-d">Commute times of 20 workers in minutes. Top: a dotplot from 8 to 62. Bottom: the boxplot of the same data on the same scale. The box runs from Q1 = 14.5 to Q3 = 28.5 with the median at 20.5. The upper fence is at 49.5, so 62 is an outlier, drawn as an open circle, and the right whisker stops at 38, the largest value inside the fence. The left whisker reaches the minimum, 8.</desc>
