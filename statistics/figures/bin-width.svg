<title id="bin-width-t">One data set, three displays</title>
<desc id="bin-width-d">Minutes 30 students spent on homework, from 12 to 75, shown three ways on the same scale from 10 to 80 minutes. Top: a dotplot with one dot per student. Middle: a histogram with bins 5 minutes wide, which shows more detail. Bottom: a histogram with bins 10 minutes wide, which is smoother; the tallest bin, 30 to 40 minutes, holds 9 students.</desc>
