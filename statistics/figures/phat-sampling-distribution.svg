<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sampling distribution of a sample proportion</title>
<desc id="d">Two probability histograms of the sample proportion of seeds that sprout when the true proportion is p = 0.85. Top, samples of 200: the bars form a symmetric mound centered at 0.85 that matches the normal curve with mean 0.85 and standard deviation 0.025 drawn over it; large counts hold because 200(0.85) = 170 and 200(0.15) = 30 are both at least 10. Bottom, samples of 20: the bars are skewed left, piled up near 0.85 to 1 with a long tail toward lower values, and the normal curve does not fit; 20(0.15) = 3 is less than 10.</desc>
