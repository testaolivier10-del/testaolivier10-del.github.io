<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="mean-median-pull-t mean-median-pull-d" font-family="Arial, Helvetica, sans-serif">
<title id="mean-median-pull-t">One large value pulls the mean but not the median</title>
<desc id="mean-median-pull-d">Two dotplots of battery life in hours on a scale from 7 to 15. Top: eleven phones from 7.2 to 10.6 hours, with median 9.30 and mean 9.21 close together. Bottom: the same phones plus one that lasts 14.9 hours; the median moves only to 9.40 while the mean moves to 9.68, pulled toward the large value.</desc>
