<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="choose-two-of-four-t choose-two-of-four-d" font-family="Arial, Helvetica, sans-serif">
<title id="choose-two-of-four-t">Six ways to choose 2 of 4</title>
<desc id="choose-two-of-four-d">All six teams of 2 that can be chosen from Ana, Ben, Cal and Dee: Ana and Ben, Ana and Cal, Ana and Dee, Ben and Cal, Ben and Dee, Cal and Dee. Below: 4C2 = 4! / (2! × 2!) = 24 / 4 = 6 teams.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="250" fill="#FFFFFF"/>
<text x="20" y="26" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="start">Choose 2 of 4 people for a team: order does not matter</text><rect x="28" y="52" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="78" cy="82" r="20" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="78" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ana</text><circle cx="188" cy="82" r="20" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="188" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ben</text><rect x="258" y="52" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="308" cy="82" r="20" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="308" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ana</text><circle cx="418" cy="82" r="20" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="418" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cal</text><rect x="488" y="52" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="538" cy="82" r="20" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="538" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ana</text><circle cx="648" cy="82" r="20" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="648" y="87" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dee</text><rect x="28" y="130" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="78" cy="160" r="20" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="78" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ben</text><circle cx="188" cy="160" r="20" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="188" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cal</text><rect x="258" y="130" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="308" cy="160" r="20" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="308" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ben</text><circle cx="418" cy="160" r="20" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="418" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dee</text><rect x="488" y="130" width="210" height="60" rx="10" fill="#F7F8F8" stroke="#C9CFCD" stroke-width="1"/><circle cx="538" cy="160" r="20" fill="#6E2470" stroke="none" stroke-width="1.5"/><text x="538" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cal</text><circle cx="648" cy="160" r="20" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="648" y="165" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dee</text><text x="360" y="232" font-size="16" font-weight="bold" fill="#6E2470" text-anchor="middle">4C2 = 4! / (2! × 2!) = 24 / 4 = 6 teams</text>
</svg>
