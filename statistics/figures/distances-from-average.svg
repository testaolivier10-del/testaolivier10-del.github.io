<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="distances-from-average-t distances-from-average-d" font-family="Arial, Helvetica, sans-serif">
<title id="distances-from-average-t">Distances from the average</title>
<desc id="distances-from-average-d">Three values, 2, 4 and 9, as dots on a number line from 0 to 10. A plum line marks their average, (2 + 4 + 9) / 3 = 5. Arrows from the average to each value show the distances 2 − 5 = −3, 4 − 5 = −1 and 9 − 5 = 4.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="240" fill="#FFFFFF"/>
<line x1="60" y1="170" x2="680" y2="170" stroke="#1F2A28" stroke-width="1.5"/><line x1="60" y1="170" x2="60" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="60" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="122" y1="170" x2="122" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="122" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text><line x1="184" y1="170" x2="184" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="184" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2</text><line x1="246" y1="170" x2="246" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="246" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">3</text><line x1="308" y1="170" x2="308" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="308" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text><line x1="370" y1="170" x2="370" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="370" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">5</text><line x1="432" y1="170" x2="432" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="432" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">6</text><line x1="494" y1="170" x2="494" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="494" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7</text><line x1="556" y1="170" x2="556" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="556" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8</text><line x1="618" y1="170" x2="618" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="618" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">9</text><line x1="680" y1="170" x2="680" y2="175" stroke="#1F2A28" stroke-width="1.5"/><text x="680" y="189" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">10</text><text x="370" y="210" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Value</text><line x1="370" y1="50" x2="370" y2="170" stroke="#6E2470" stroke-width="2.5"/><text x="370" y="42" font-size="13" font-weight="bold" fill="#6E2470" text-anchor="middle">average = (2 + 4 + 9) / 3 = 5</text><line x1="370" y1="84" x2="184" y2="84" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar-ink)"/><text x="362" y="77" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">2 − 5 = −3</text><circle cx="184" cy="162" r="7" fill="#0072B2" stroke="none" stroke-width="1.5"/><line x1="370" y1="114" x2="308" y2="114" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar-ink)"/><text x="362" y="107" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">4 − 5 = −1</text><circle cx="308" cy="162" r="7" fill="#0072B2" stroke="none" stroke-width="1.5"/><line x1="370" y1="144" x2="618" y2="144" stroke="#009E73" stroke-width="2.5" marker-end="url(#ar-ink)"/><text x="378" y="137" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">9 − 5 = 4</text><circle cx="618" cy="162" r="7" fill="#0072B2" stroke="none" stroke-width="1.5"/>
</svg>
