" x2="90" y2="63.75" stroke="#1F2A28" stroke-width="1.5"/><text x="82" y="67.75" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">35</text><line x1="85" y1="30" x2="90" y2="30" stroke="#1F2A28" stroke-width="1.5"/><text x="82" y="34" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40</text><text x="52" y="165" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 52 165)">Cost (dollars)</text><line x1="90" y1="300" x2="680" y2="300" stroke="#1F2A28" stroke-width="1.5"/><line x1="90" y1="300" x2="90" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="90" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="163.75" y1="300" x2="163.75" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="163.75" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text><line x1="237.5" y1="300" x2="237.5" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="237.5" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2</text><line x1="311.25" y1="300" x2="311.25" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="311.25" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">3</text><line x1="385" y1="300" x2="385" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="385" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text><line x1="458.75" y1="300" x2="458.75" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="458.75" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">5</text><line x1="532.5" y1="300" x2="532.5" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="532.5" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">6</text><line x1="606.25" y1="300" x2="606.25" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="606.25" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7</text><line x1="680" y1="300" x2="680" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="680" y="319" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8</text><text x="385" y="340" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Hours of bike rental</text><line x1="90" y1="219" x2="680" y2="57" stroke="#6E2470" stroke-width="3"/><circle cx="90" cy="219" r="6" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="102" y="241" font-size="12.5" font-weight="bold" fill="#A84300" text-anchor="start">intercept 12: the cost at 0 hours</text><line x1="311.25" y1="158.25" x2="385" y2="158.25" stroke="#0072B2" stroke-width="2.5"/><line x1="385" y1="158.25" x2="385" y2="138" stroke="#0072B2" stroke-width="2.5"/><text x="348.13" y="176.25" font-size="12" font-weight="bold" fill="#005A8C" text-anchor="middle">run 1 hour</text><text x="393" y="152.13" font-size="12" font-weight="bold" fill="#005A8C" text-anchor="start">rise 3 dollars</text><text x="503" y="89.6" font-size="16" font-weight="bold" fill="#6E2470" text-anchor="end">y = 12 + 3x</text><text x="539.88" y="121.48" font-size="12.5" font-weight="bold" fill="#6E2470" text-anchor="start">slope: 3 dollars per hour</text>
