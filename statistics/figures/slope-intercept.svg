<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="slope-intercept-t slope-intercept-d" font-family="Arial, Helvetica, sans-serif">
<title id="slope-intercept-t">Slope and intercept of a line</title>
<desc id="slope-intercept-d">The line y = 12 + 3x for the cost in dollars of renting a bike for x hours, on axes from 0 to 8 hours and 0 to 40 dollars. The line starts at the intercept, 12 dollars at 0 hours. A step of 1 hour to the right (the run) goes with a rise of 3 dollars: the slope is 3 dollars per hour.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-plum" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E2470"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
