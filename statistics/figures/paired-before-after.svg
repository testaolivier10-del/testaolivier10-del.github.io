<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Paired data: before, after and the differences</title>
<desc id="d">Left: a slope chart of resting heart rate for 12 gym members, before and after a breathing class, on a scale from 60 to 90 beats per minute; 11 lines slope down and one slopes up. Right: a dotplot of the 12 differences, before minus after: -1, 1, 1, 1, 2, 3, 3, 3, 5, 5, 5, 6, with mean 2.83 and standard deviation 2.12. All but one difference is above 0.</desc>
