<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="trade-policy-tariff-t trade-policy-tariff-d" font-family="Arial, Helvetica, sans-serif">
<title id="trade-policy-tariff-t">A small country at the world price, then a tariff</title>
<desc id="trade-policy-tariff-d">The rice market in Dornia, an invented small country. Without trade the price is $5 and 50 tons are traded. At the world price of $3, Dornians buy 70 tons, farmers grow 30, and 40 tons are imported. A $1 tariff raises the domestic price to $4: buyers want 60 tons, farmers grow 40, and imports fall to 20. The tariff revenue is $1 times 20 tons, $20. The two triangles from 30 to 40 tons and from 60 to 70 tons, $5 each, are the deadweight loss of the tariff. Invented data for practice.</desc>
<defs><marker id="trade-policy-tariff-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="trade-policy-tariff-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="trade-policy-tariff-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="trade-policy-tariff-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="720" height="490" fill="#FFFFFF"/>
<path d="M80 44V370H486" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="480" y="406" font-size="13" text-anchor="end" fill="#1F2A28" font-weight="bold"><tspan x="480" dy="0">Tons of rice</tspan></text>
<text transform="translate(40 50) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price</text>
<path d="M120 370v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="120" y="387" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="120" dy="0">10</tspan></text>
<path d="M160 370v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="160" y="387" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="160" dy="0">20</tspan></text>
<path d="M280 370v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="280" y="387" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="280" dy="0">50</tspan></text>
<path d="M400 370v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="400" y="387" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="400" dy="0">80</tspan></text>
<path d="M440 370v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="440" y="387" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="440" dy="0">90</tspan></text>
<path d="M80 278.6h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="282.6" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$3</tspan></text>
<path d="M80 248.1h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="252.1" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$4</tspan></text>
<path d="M80 217.6h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="221.6" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$5</tspan></text>
<path d="M240 248.1L320 248.1L320 278.6L240 278.6Z" fill="#FCEBC8"/>
<path d="M200 278.6L240 248.1L240 278.6Z" fill="#FBD9C6" stroke="#D55E00" stroke-width="1.4"/>
<path d="M320 248.1L360 278.6L320 278.6Z" fill="#FBD9C6" stroke="#D55E00" stroke-width="1.4"/>
<path d="M80 65.2L460 354.8" fill="none" stroke="#084F78" stroke-width="2.8" stroke-linecap="round"/>
<text x="465" y="358.8" font-size="13" text-anchor="start" fill="#084F78" font-weight="bold"><tspan x="465" dy="0">D</tspan></text>
<path d="M80 370L460 80.5" fill="none" stroke="#7E1A5E" stroke-width="2.8" stroke-linecap="round"/>
<text x="446" y="74.5" font-size="13" text-anchor="start" fill="#7E1A5E" font-weight="bold"><tspan x="446" dy="0">S</tspan></text>
<path d="M80 278.6L472 278.6" fill="none" stroke="#355A0A" stroke-width="2.4" stroke-linecap="round"/>
<text x="472" y="294.6" font-size="13" text-anchor="end" fill="#355A0A" font-weight="bold"><tspan x="472" dy="0">PW</tspan></text>
<path d="M80 248.1L472 248.1" fill="none" stroke="#8A5A00" stroke-width="2.4" stroke-linecap="round"/>
<text x="472" y="241.1" font-size="13" text-anchor="end" fill="#8A5A00" font-weight="bold"><tspan x="472" dy="0">PW + t</tspan></text>
<path d="M80 217.6H280" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<circle cx="280" cy="217.6" r="4.5" fill="#1F2A28"/>
<text x="290" y="222.6" font-size="12" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan x="290" dy="0">No trade</tspan></text>
<path d="M200 278.6V370" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="200" y="387" font-size="12" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="200" dy="0">30</tspan></text>
<path d="M240 248.1V370" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="240" y="387" font-size="12" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="240" dy="0">40</tspan></text>
<path d="M320 248.1V370" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="320" y="387" font-size="12" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="320" dy="0">60</tspan></text>
<path d="M360 278.6V370" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="360" y="387" font-size="12" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="360" dy="0">70</tspan></text>
<text x="280" y="267.3" font-size="11" text-anchor="middle" fill="#8A5A00" font-weight="bold"><tspan x="280" dy="0">Revenue $20</tspan></text>
<path d="M200 398V404H360V398" fill="none" stroke="#355A0A" stroke-width="1.6"/>
<text x="280" y="419" font-size="12" text-anchor="middle" fill="#355A0A" font-weight="bold"><tspan x="280" dy="0">Imports at $3: 40 tons</tspan></text>
<path d="M240 426V432H320V426" fill="none" stroke="#8A5A00" stroke-width="1.6"/>
<text x="280" y="447" font-size="12" text-anchor="middle" fill="#8A5A00" font-weight="bold"><tspan x="280" dy="0">Imports at $4: 20 tons</tspan></text>
<text x="510" y="110" font-size="13" text-anchor="start" fill="#355A0A" font-weight="bold"><tspan x="510" dy="0">Free trade at $3:</tspan><tspan x="510" dy="16.25">Qd 70, Qs 30, imports 40</tspan></text>
<text x="510" y="170" font-size="13" text-anchor="start" fill="#8A5A00" font-weight="bold"><tspan x="510" dy="0">With a $1 tariff ($4):</tspan><tspan x="510" dy="16.25">Qd 60, Qs 40, imports 20</tspan><tspan x="510" dy="16.25">Revenue = $1 × 20 = $20</tspan></text>
<text x="510" y="245" font-size="13" text-anchor="start" fill="#D55E00" font-weight="bold"><tspan x="510" dy="0">DWL = two triangles</tspan><tspan x="510" dy="16.25">½ × 10 × $1 + ½ × 10 × $1</tspan><tspan x="510" dy="16.25">= $10</tspan></text>
<text x="360" y="482" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="360" dy="0">Invented country and data for practice.</tspan></text>
</svg>
