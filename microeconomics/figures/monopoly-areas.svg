<title id="t">A profit-maximizing monopoly</title>
<desc id="d">A monopoly graph: demand D, marginal revenue MR below it, marginal cost MC and average total cost ATC, with MC crossing ATC at its minimum. The monopolist produces QM where MR = MC and charges PM read up on the demand curve. Consumer surplus is the triangle under D above PM; profit is the rectangle between PM and ATC out to QM; deadweight loss is the triangle between D and MC from QM to QE, where D meets MC.</desc>
