<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="perfect-competition-side-by-side-t perfect-competition-side-by-side-d" font-family="Arial, Helvetica, sans-serif">
<title id="perfect-competition-side-by-side-t">A perfectly competitive market and a typical firm in long-run equilibrium</title>
<desc id="perfect-competition-side-by-side-d">Left, the market: demand D and supply S cross at the market price PM and quantity QM. Right, a typical firm: the market price carried across with a dashed line is the firm's horizontal demand curve, d = MR = AR = P, at PF. The firm produces qF, where MR = MC, which in long-run equilibrium is at the lowest point of ATC, so price equals ATC and economic profit is zero. Market quantity is in capital Q, the firm's in lower-case q.</desc>
