<title id="factor-demand-supply-shifts-t">Shifts in a labor market</title>
<desc id="factor-demand-supply-shifts-d">Two labor market graphs with Wage on the vertical axis and Quantity of labor on the horizontal axis. Left: labor demand shifts right from DL1 to DL2, so the wage rises from W1 to W2 and employment rises from Q1 to Q2. Right: labor supply shifts left from SL1 to SL2, so the wage rises from W1 to W2 and employment falls from Q1 to Q2.</desc>
