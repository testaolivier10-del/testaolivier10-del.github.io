<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="externalities-negative-t externalities-negative-d" font-family="Arial, Helvetica, sans-serif">
<title id="externalities-negative-t">A negative production externality: the market makes too much</title>
<desc id="externalities-negative-d">An externality graph with Price on the vertical axis and Quantity on the horizontal axis. D = MPB = MSB slopes down. S = MPC slopes up, and MSC lies above it by the external cost per unit. The market produces QM at price PM, where MPB = MPC. The efficient quantity QE, where MSB = MSC, is smaller and its price PE higher. The deadweight loss is the shaded triangle between MSC and MSB from QE to QM, pointing toward QE.</desc>
