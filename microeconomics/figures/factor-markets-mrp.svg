<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="factor-markets-mrp-t factor-markets-mrp-d" font-family="Arial, Helvetica, sans-serif">
<title id="factor-markets-mrp-t">Marginal revenue product falls as workers are added</title>
<desc id="factor-markets-mrp-d">A table for an invented bakery: 1 to 5 workers make 20, 36, 48, 56 and 60 loaves, so the marginal product falls from 20 to 16, 12, 8 and 4 loaves. At $3 a loaf the marginal revenue product is $60, $48, $36, $24 and $12. A bar graph beside it shows MRP falling with each worker; the MRP curve is the firm's demand curve for labor.</desc>
<defs><marker id="factor-markets-mrp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="factor-markets-mrp-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="factor-markets-mrp-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="factor-markets-mrp-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<text x="190" y="34" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Juniper Bakery (invented data)</text>
<rect x="22" y="52" width="340" height="34" fill="#F8E6F1"/>
<text x="70" y="74" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Workers</text>
<text x="160" y="74" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Loaves (TP)</text>
<text x="240" y="74" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">MP</text>
<text x="320" y="74" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">MRP at $3</text>
<text x="70" y="112" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text>
<text x="160" y="112" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">20</text>
<text x="240" y="112" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">20</text>
<text x="320" y="112" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">$60</text>
<rect x="22" y="127" width="340" height="40" fill="#F2F4F3"/>
<text x="70" y="152" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">2</text>
<text x="160" y="152" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">36</text>
<text x="240" y="152" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">16</text>
<text x="320" y="152" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">$48</text>
<text x="70" y="192" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">3</text>
<text x="160" y="192" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">48</text>
<text x="240" y="192" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">12</text>
<text x="320" y="192" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">$36</text>
<rect x="22" y="207" width="340" height="40" fill="#F2F4F3"/>
<text x="70" y="232" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text>
<text x="160" y="232" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">56</text>
<text x="240" y="232" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">8</text>
<text x="320" y="232" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">$24</text>
<text x="70" y="272" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">5</text>
<text x="160" y="272" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">60</text>
<text x="240" y="272" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text>
<text x="320" y="272" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">$12</text>
<text x="192" y="330" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">MP = change in loaves from one more worker</text>
<text x="192" y="350" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">MRP = MP × MR = MP × $3 (each loaf sells for $3)</text>
<path d="M470 50V320H760" fill="none" stroke="#1F2A28" stroke-width="2"/>
<text x="760" y="360" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Quantity of labor (workers)</text>
<text transform="translate(430 50) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Dollars</text>
<rect x="504.3" y="88.6" width="28" height="231.4" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<rect x="552.7" y="134.9" width="28" height="185.1" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<rect x="601" y="181.1" width="28" height="138.9" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<rect x="649.3" y="227.4" width="28" height="92.6" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<rect x="697.7" y="273.7" width="28" height="46.3" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<path d="M494.2 65.4L498.3 69.4L502.4 73.3L506.5 77.2L510.6 81.2L514.7 85.1L518.8 89L522.9 93L527 96.9L531.1 100.8L535.3 104.8L539.4 108.7L543.5 112.6L547.6 116.6L551.7 120.5L555.8 124.4L559.9 128.4L564 132.3L568.1 136.2L572.2 140.2L576.3 144.1L580.4 148L584.6 152L588.7 155.9L592.8 159.9L596.9 163.8L601 167.7L605.1 171.7L609.2 175.6L613.3 179.5L617.4 183.5L621.5 187.4L625.6 191.3L629.7 195.3L633.9 199.2L638 203.1L642.1 207.1L646.2 211L650.3 214.9L654.4 218.9L658.5 222.8L662.6 226.7L666.7 230.7L670.8 234.6L674.9 238.5L679 242.5L683.2 246.4L687.3 250.3L691.4 254.3L695.5 258.2L699.6 262.1L703.7 266.1L707.8 270L711.9 273.9L716 277.9L720.1 281.8L724.2 285.7L728.3 289.7L732.4 293.6L736.6 297.6L740.7 301.5" fill="none" stroke="#7E1A5E" stroke-width="3"/>
<circle cx="518.3" cy="88.6" r="4.5" fill="#7E1A5E"/>
<circle cx="566.7" cy="134.9" r="4.5" fill="#7E1A5E"/>
<circle cx="615" cy="181.1" r="4.5" fill="#7E1A5E"/>
<circle cx="663.3" cy="227.4" r="4.5" fill="#7E1A5E"/>
<circle cx="711.7" cy="273.7" r="4.5" fill="#7E1A5E"/>
<text x="518.3" y="347" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text>
<text x="566.7" y="347" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2</text>
<text x="615" y="347" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">3</text>
<text x="663.3" y="347" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text>
<text x="711.7" y="347" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">5</text>
<text x="462.8" y="250.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">$20</text>
<text x="462.8" y="173.4" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">$40</text>
<text x="462.8" y="96.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">$60</text>
<text x="677.8" y="165.7" font-size="14" font-weight="bold" fill="#7E1A5E" text-anchor="start">MRP</text>
<text x="677.8" y="188.9" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">(the firm's demand</text>
<text x="677.8" y="208.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">curve for labor)</text>
</svg>
