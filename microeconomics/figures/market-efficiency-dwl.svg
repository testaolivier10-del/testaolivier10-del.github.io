<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="market-efficiency-dwl-t market-efficiency-dwl-d" font-family="Arial, Helvetica, sans-serif">
<title id="market-efficiency-dwl-t">Deadweight loss on either side of the efficient quantity</title>
<desc id="market-efficiency-dwl-d">Two graphs with Price on the vertical axis and Quantity on the horizontal axis, each with D = MSB sloping down and S = MSC sloping up, crossing at the efficient quantity Q* and price P*. Left: only Q1, less than Q*, is made, and the triangle between MSB and MSC from Q1 to Q* is deadweight loss. Right: Q2, more than Q*, is made, and the triangle between MSC and MSB from Q* to Q2 is deadweight loss. Both triangles point toward Q*.</desc>
