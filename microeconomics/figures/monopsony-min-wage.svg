<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="monopsony-min-wage-t monopsony-min-wage-d" font-family="Arial, Helvetica, sans-serif">
<title id="monopsony-min-wage-t">A minimum wage set between the monopsony wage and the competitive wage</title>
<desc id="monopsony-min-wage-d">The same monopsony graph with a minimum wage Wmin set above the monopsony wage WM and below the competitive wage. Up to the labor supply curve, each extra worker now costs exactly Wmin, so the firm's MFC is flat at Wmin. The firm hires Qmin workers, where the flat MFC reaches labor supply, which is more than QM, and every worker earns the higher wage Wmin.</desc>
