<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A price taker and a price maker</title>
<desc id="d">Left: a perfectly competitive firm faces a horizontal demand curve, d = MR = AR = P. Right: a firm with market power faces a downward-sloping demand curve D, and its marginal revenue curve MR lies below D, so at quantity Q1 marginal revenue is less than the price P1.</desc>
