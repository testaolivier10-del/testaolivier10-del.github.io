<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390" role="img" aria-labelledby="axes-points-pairs-t axes-points-pairs-d" font-family="Arial, Helvetica, sans-serif">
<title id="axes-points-pairs-t">Plotting ordered pairs from a table</title>
<desc id="axes-points-pairs-d">A graph with Tacos sold per day on the horizontal axis (0 to 140) and Price per taco in dollars on the vertical axis (0 to 6). Three points with dashed lines to both axes: J at 40 tacos and $5, K at 80 tacos and $3, L at 120 tacos and $1. As the price falls the number sold rises, an inverse relationship. Invented data for practice.</desc>
<defs><marker id="axes-points-pairs-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="axes-points-pairs-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="axes-points-pairs-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="axes-points-pairs-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="axes-points-pairs-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="780" height="390" fill="#FFFFFF"/>
<line x1="100" y1="24" x2="100" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="100" y1="330" x2="546" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="540" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Tacos sold per day</text>
<text x="66" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 66 30)">Price per taco ($)</text>
<line x1="162.9" y1="330" x2="162.9" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="162.9" y="349" font-size="12" fill="#6B7370" text-anchor="middle">20</text><line x1="225.7" y1="330" x2="225.7" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="225.7" y="349" font-size="12" fill="#6B7370" text-anchor="middle">40</text><line x1="288.6" y1="330" x2="288.6" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="288.6" y="349" font-size="12" fill="#6B7370" text-anchor="middle">60</text><line x1="351.4" y1="330" x2="351.4" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="351.4" y="349" font-size="12" fill="#6B7370" text-anchor="middle">80</text><line x1="414.3" y1="330" x2="414.3" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="414.3" y="349" font-size="12" fill="#6B7370" text-anchor="middle">100</text><line x1="477.1" y1="330" x2="477.1" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="477.1" y="349" font-size="12" fill="#6B7370" text-anchor="middle">120</text><line x1="95" y1="280" x2="100" y2="280" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="284" font-size="12" fill="#6B7370" text-anchor="end">1</text><line x1="95" y1="230" x2="100" y2="230" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="234" font-size="12" fill="#6B7370" text-anchor="end">2</text><line x1="95" y1="180" x2="100" y2="180" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="184" font-size="12" fill="#6B7370" text-anchor="end">3</text><line x1="95" y1="130" x2="100" y2="130" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="134" font-size="12" fill="#6B7370" text-anchor="end">4</text><line x1="95" y1="80" x2="100" y2="80" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="84" font-size="12" fill="#6B7370" text-anchor="end">5</text>
<line x1="100" y1="80" x2="225.7" y2="80" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="225.7" y1="80" x2="225.7" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="225.7" cy="80" r="5" fill="#7E1A5E"/>
<text x="235.7" y="71" font-size="14" fill="#7E1A5E" font-weight="700">J (40, 5)</text>
<line x1="100" y1="180" x2="351.4" y2="180" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="351.4" y1="180" x2="351.4" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="351.4" cy="180" r="5" fill="#7E1A5E"/>
<text x="361.4" y="171" font-size="14" fill="#7E1A5E" font-weight="700">K (80, 3)</text>
<line x1="100" y1="280" x2="477.1" y2="280" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="477.1" y1="280" x2="477.1" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="477.1" cy="280" r="5" fill="#7E1A5E"/>
<text x="487.1" y="271" font-size="14" fill="#7E1A5E" font-weight="700">L (120, 1)</text>
<text x="580" y="80" font-size="13" fill="#1F2A28">Read each point as</text>
<text x="580" y="98" font-size="13" fill="#1F2A28">(horizontal, vertical):</text>
<text x="580" y="124" font-size="13" fill="#7E1A5E">J: 40 tacos at $5</text>
<text x="580" y="144" font-size="13" fill="#7E1A5E">K: 80 tacos at $3</text>
<text x="580" y="164" font-size="13" fill="#7E1A5E">L: 120 tacos at $1</text>
<text x="580" y="204" font-size="13" fill="#6B7370">As the price falls,</text>
<text x="580" y="222" font-size="13" fill="#6B7370">more tacos are sold:</text>
<text x="580" y="240" font-size="13" fill="#6B7370">an inverse relationship.</text>
</svg>
