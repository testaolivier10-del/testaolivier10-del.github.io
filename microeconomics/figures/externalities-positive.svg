<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="externalities-positive-t externalities-positive-d" font-family="Arial, Helvetica, sans-serif">
<title id="externalities-positive-t">A positive consumption externality: the market makes too little</title>
<desc id="externalities-positive-d">An externality graph with Price on the vertical axis and Quantity on the horizontal axis. D = MPB slopes down, and MSB lies above it by the external benefit per unit. S = MPC = MSC slopes up. The market produces QM at PM, where MPB = MPC; the efficient quantity QE, where MSB = MSC, is larger. The deadweight loss is the shaded triangle between MSB and MSC from QM to QE.</desc>
