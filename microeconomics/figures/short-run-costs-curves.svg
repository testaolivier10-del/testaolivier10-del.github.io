<text x="297" y="378" font-size="13" fill="#084F78" text-anchor="middle" font-weight="700">q<tspan font-size="9" dy="4">1</tspan></text>
<text x="347.6" y="378" font-size="13" fill="#D55E00" text-anchor="middle" font-weight="700">q<tspan font-size="9" dy="4">2</tspan></text>
<text x="645" y="80" font-size="13" fill="#084F78" font-weight="700">MC crosses AVC at</text>
<text x="645" y="98" font-size="13" fill="#084F78">the lowest point of AVC (q1)</text>
<text x="645" y="136" font-size="13" fill="#D55E00" font-weight="700">MC crosses ATC at</text>
<text x="645" y="154" font-size="13" fill="#D55E00">the lowest point of ATC (q2)</text>
<text x="645" y="196" font-size="13" fill="#1F2A28">MC below an average</text>
<text x="645" y="214" font-size="13" fill="#1F2A28">pulls it down; MC above</text>
<text x="645" y="232" font-size="13" fill="#1F2A28">an average pulls it up.</text>
<text x="645" y="274" font-size="13" fill="#6B7370">ATC minus AVC = AFC,</text>
<text x="645" y="292" font-size="13" fill="#6B7370">which shrinks as output</text>
<text x="645" y="310" font-size="13" fill="#6B7370">grows.</text>
</svg>
