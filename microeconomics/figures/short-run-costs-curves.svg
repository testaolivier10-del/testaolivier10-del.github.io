<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="short-run-costs-curves-t short-run-costs-curves-d" font-family="Arial, Helvetica, sans-serif">
<title id="short-run-costs-curves-t">Short-run cost curves: MC through the lowest points of AVC and ATC</title>
<desc id="short-run-costs-curves-d">Cost on the vertical axis and quantity of output on the horizontal axis. Marginal cost (MC) dips, then rises steeply; it crosses average variable cost (AVC) at the lowest point of AVC, at output q1, and average total cost (ATC) at the lowest point of ATC, at the larger output q2. Average fixed cost (AFC, dashed) falls as output grows, and the vertical gap between ATC and AVC equals AFC.</desc>
<defs><marker id="short-run-costs-curves-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="short-run-costs-curves-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="short-run-costs-curves-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="short-run-costs-curves-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="860" height="400" fill="#FFFFFF"/>
