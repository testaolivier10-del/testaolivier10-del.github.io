<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="supply-movement-shift-t supply-movement-shift-d" font-family="Arial, Helvetica, sans-serif">
<title id="supply-movement-shift-t">A movement along supply and a shift of supply</title>
<desc id="supply-movement-shift-d">Two panels for boxes of strawberries, price on the vertical axis and quantity on the horizontal axis. Left: a rise in price from $3 to $5 moves sellers along supply S from 30 to 50 boxes: a change in quantity supplied. Right: a rise in the price of fertilizer, an input, shifts supply left from S1 to S2, so at $5 sellers offer 30 boxes instead of 50: a decrease in supply. Invented data for practice.</desc>
<defs><marker id="supply-movement-shift-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="supply-movement-shift-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="supply-movement-shift-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="supply-movement-shift-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
