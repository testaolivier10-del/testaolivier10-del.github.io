<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">One price compared with perfect price discrimination</title>
<desc id="d">Left: a single-price monopolist produces QM where MR = MC and charges PM from demand, leaving consumer surplus, profit and a deadweight loss triangle between D and MC from QM to QE. Right: a perfectly price-discriminating monopolist charges each buyer the most that buyer will pay, so its marginal revenue curve is the demand curve; it produces QE where D = MC, all surplus becomes profit, consumer surplus is zero and there is no deadweight loss.</desc>
