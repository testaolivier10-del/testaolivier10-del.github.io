<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="price-elasticity-supply-curves-t price-elasticity-supply-curves-d" font-family="Arial, Helvetica, sans-serif">
<title id="price-elasticity-supply-curves-t">Three supplies through the same point</title>
<desc id="price-elasticity-supply-curves-d">Three supply curves pass through the same starting point at a price of $4 and 40 units. A vertical supply is perfectly inelastic: the quantity stays at 40 whatever the price. A steep supply is inelastic: a rise to $6 adds only a few units. A flat supply is elastic: the same price rise adds many units. Because the three curves start from the same point, the flatter one is the more elastic. Invented data for practice.</desc>
<defs><marker id="price-elasticity-supply-curves-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="price-elasticity-supply-curves-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="price-elasticity-supply-curves-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="price-elasticity-supply-curves-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<path d="M80 44V330H446" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="440" y="366" font-size="13" text-anchor="end" fill="#1F2A28" font-weight="bold"><tspan x="440" dy="0">Quantity supplied</tspan></text>
<text transform="translate(40 50) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price</text>
<path d="M120 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="120" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="120" dy="0">10</tspan></text>
<path d="M160 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="160" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="160" dy="0">20</tspan></text>
<path d="M200 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="200" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="200" dy="0">30</tspan></text>
<path d="M240 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="240" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="240" dy="0">40</tspan></text>
<path d="M280 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="280" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="280" dy="0">50</tspan></text>
<path d="M320 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="320" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="320" dy="0">60</tspan></text>
<path d="M360 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="360" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="360" dy="0">70</tspan></text>
<path d="M400 330v5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="400" y="347" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="400" dy="0">80</tspan></text>
<path d="M80 295h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="299" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$1</tspan></text>
<path d="M80 260h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="264" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$2</tspan></text>
<path d="M80 225h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="229" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$3</tspan></text>
<path d="M80 190h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="194" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$4</tspan></text>
<path d="M80 155h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="159" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$5</tspan></text>
<path d="M80 120h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="124" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$6</tspan></text>
<path d="M80 85h-5" stroke="#1F2A28" stroke-width="1.2"/>
<text x="72" y="89" font-size="11" text-anchor="end" fill="#5B6664"><tspan x="72" dy="0">$7</tspan></text>
<path d="M240 309L240 64" fill="none" stroke="#5B6664" stroke-width="2.6" stroke-linecap="round"/>
<text x="234" y="58" font-size="13" text-anchor="end" fill="#5B6664" font-weight="bold"><tspan x="234" dy="0">Perfectly inelastic</tspan></text>
<path d="M216 316L264 64" fill="none" stroke="#7E1A5E" stroke-width="2.8" stroke-linecap="round"/>
<text x="270" y="68" font-size="13" text-anchor="start" fill="#7E1A5E" font-weight="bold"><tspan x="270" dy="0">Inelastic</tspan></text>
<path d="M120 242.5L432 106" fill="none" stroke="#B8467F" stroke-width="2.8" stroke-linecap="round"/>
<text x="428" y="94" font-size="13" text-anchor="end" fill="#B8467F" font-weight="bold"><tspan x="428" dy="0">Elastic</tspan></text>
<path d="M80 120H400" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<path d="M80 190H240" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<path d="M240 190V330" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<circle cx="240" cy="190" r="4.5" fill="#1F2A28"/>
<text x="232" y="182" font-size="12" text-anchor="end" fill="#1F2A28" font-weight="bold"><tspan x="232" dy="0">Start</tspan></text>
<circle cx="253.3" cy="120" r="4.5" fill="#1F2A28"/>
<circle cx="400" cy="120" r="4.5" fill="#1F2A28"/>
<text x="470" y="90" font-size="13" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan x="470" dy="0">Price rises from $4 to $6 (+50%):</tspan></text>
<text x="470" y="120" font-size="13" text-anchor="start" fill="#5B6664"><tspan x="470" dy="0">Perfectly inelastic: 40 units, +0%</tspan><tspan x="470" dy="16.25">E = 0</tspan></text>
<text x="470" y="170" font-size="13" text-anchor="start" fill="#7E1A5E"><tspan x="470" dy="0">Inelastic: 40 to about 43, +8%</tspan><tspan x="470" dy="16.25">E is about 0.17, less than 1</tspan></text>
<text x="470" y="220" font-size="13" text-anchor="start" fill="#B8467F"><tspan x="470" dy="0">Elastic: 40 to 80, +100%</tspan><tspan x="470" dy="16.25">E = 2, greater than 1</tspan></text>
<text x="470" y="280" font-size="12" text-anchor="start" fill="#1F2A28"><tspan x="470" dy="0">Supply is more elastic when sellers</tspan><tspan x="470" dy="15">can add output easily: spare</tspan><tspan x="470" dy="15">capacity, inputs that are easy to</tspan><tspan x="470" dy="15">buy, goods that can be stored, and</tspan><tspan x="470" dy="15">more time to adjust.</tspan></text>
<text x="380" y="390" font-size="11" text-anchor="middle" fill="#5B6664"><tspan x="380" dy="0">Invented data for practice.</tspan></text>
</svg>
