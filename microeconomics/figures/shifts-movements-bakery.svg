<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-labelledby="shifts-movements-bakery-t shifts-movements-bakery-d" font-family="Arial, Helvetica, sans-serif">
<title id="shifts-movements-bakery-t">A movement along a curve and a shift of the curve</title>
<desc id="shifts-movements-bakery-d">Left: one downward curve D for a bakery's croissants, with an arrow from point J ($4) down to point K ($3): a lower price, more croissants sold, the same curve. Right: the curve D1 dashed and a new curve D2 to its right, with an arrow pointing right: an office opened next door, so more croissants are bought at every price. Invented example.</desc>
<defs><marker id="shifts-movements-bakery-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="shifts-movements-bakery-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="shifts-movements-bakery-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="shifts-movements-bakery-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="shifts-movements-bakery-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="740" height="360" fill="#FFFFFF"/>
<text x="200" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Movement along the curve</text>
<line x1="80" y1="44" x2="80" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="80" y1="270" x2="326" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="320" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Croissants sold per day</text>
<text x="46" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 46 50)">Price</text>
<line x1="104" y1="72" x2="296" y2="248" stroke="#7E1A5E" stroke-width="3"/><text x="302" y="252" font-size="15" fill="#7E1A5E" font-weight="700">D</text>
<circle cx="152" cy="116" r="5" fill="#D55E00"/>
<text x="161" y="108" font-size="14" fill="#D55E00" font-weight="700">J</text>
<circle cx="200" cy="160" r="5" fill="#D55E00"/>
<text x="209" y="152" font-size="14" fill="#D55E00" font-weight="700">K</text>
<line x1="159.2" y1="131.4" x2="190.4" y2="160" stroke="#D55E00" stroke-width="2" marker-end="url(#shifts-movements-bakery-arV)"/>
<text x="72" y="120" font-size="12" fill="#6B7370" text-anchor="end">$4</text>
<text x="72" y="164" font-size="12" fill="#6B7370" text-anchor="end">$3</text>
<text x="200" y="330" font-size="12" fill="#6B7370" text-anchor="middle">The price falls from $4 to $3: the same</text>
<text x="200" y="346" font-size="12" fill="#6B7370" text-anchor="middle">curve, a new point (J to K).</text>
<text x="560" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Shift of the curve</text>
<line x1="440" y1="44" x2="440" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="440" y1="270" x2="686" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="680" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Croissants sold per day</text>
<text x="406" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 406 50)">Price</text>
<line x1="452" y1="83" x2="620" y2="237" stroke="#6B7370" stroke-width="2.5" stroke-dasharray="7 5"/><text x="626" y="241" font-size="15" fill="#6B7370" font-weight="700">D<tspan font-size="11" dy="4">1</tspan></text>
<line x1="500" y1="83" x2="668" y2="237" stroke="#7E1A5E" stroke-width="3"/><text x="674" y="241" font-size="15" fill="#7E1A5E" font-weight="700">D<tspan font-size="11" dy="4">2</tspan></text>
<line x1="540.8" y1="160" x2="581.6" y2="160" stroke="#7E1A5E" stroke-width="2.2" marker-end="url(#shifts-movements-bakery-arA)"/>
<text x="560" y="330" font-size="12" fill="#6B7370" text-anchor="middle">An office opens next door: more</text>
<text x="560" y="346" font-size="12" fill="#6B7370" text-anchor="middle">croissants are bought at every price.</text>
</svg>
