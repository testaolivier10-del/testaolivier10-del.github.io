<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="demand-movement-shift-t demand-movement-shift-d" font-family="Arial, Helvetica, sans-serif">
<title id="demand-movement-shift-t">A movement along demand and a shift of demand</title>
<desc id="demand-movement-shift-d">Two panels for veggie wraps, price on the vertical axis and quantity per day on the horizontal axis. Left: one demand curve D; a fall in price from $5 to $3 moves buyers along the curve from point A (30 wraps) to point B (50 wraps): a change in quantity demanded. Right: a rise in buyers' incomes shifts the whole curve right from D1 to D2, so at $4 buyers want 60 wraps instead of 40: a change in demand. Invented data for practice.</desc>
<defs><marker id="demand-movement-shift-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="demand-movement-shift-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="demand-movement-shift-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="demand-movement-shift-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
