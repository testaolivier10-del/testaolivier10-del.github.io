<text x="586.2" y="174.9" font-size="12" fill="#7E1A5E" text-anchor="middle" font-weight="700">profit</text>
<text x="430" y="384" font-size="13" fill="#6B7370" text-anchor="middle">1. Demand rises (D1 to D2): the price rises to P2 and firms earn economic profit at q2.</text>
<text x="430" y="402" font-size="13" fill="#6B7370" text-anchor="middle">2. Profit draws new firms in: market supply shifts right (S1 to S2) until the price is back at P1, the lowest point of ATC.</text>
