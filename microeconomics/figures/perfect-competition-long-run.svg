<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="perfect-competition-long-run-t perfect-competition-long-run-d" font-family="Arial, Helvetica, sans-serif">
<title id="perfect-competition-long-run-t">From short-run profit to the new long-run equilibrium in a constant-cost industry</title>
<desc id="perfect-competition-long-run-d">Left, the market: demand rises from D1 to D2, so the price rises from P1 to P2 and quantity from Q1 to Q2. Right, the firm: at P2 it produces q2, where MR2 = MC, and earns the shaded economic profit. The profit draws new firms in, market supply shifts right from S1 to S2, and the price falls back to P1, the lowest point of ATC, at the larger market quantity Q3. In a constant-cost industry the long-run supply curve is horizontal at P1.</desc>
