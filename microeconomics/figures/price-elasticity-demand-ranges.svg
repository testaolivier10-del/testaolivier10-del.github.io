<path d="M460 320L467 298.1L474 277.3L481 257.6L488 239L495 221.6L502 205.3L509 190.1L516 176L523 163.1L530 151.3L537 140.6L544 131L551 122.6L558 115.3L565 109.1L572 104L579 100.1L586 97.3L593 95.6L600 95L607 95.6L614 97.3L621 100.1L628 104L635 109.1L642 115.3L649 122.6L656 131L663 140.6L670 151.3L677 163.1L684 176L691 190.1L698 205.3L705 221.6L712 239L719 257.6L726 277.3L733 298.1L740 320" fill="none" stroke="#355A0A" stroke-width="2.8"/>
<text x="720.4" y="212" font-size="13" text-anchor="start" fill="#355A0A" font-weight="bold"><tspan x="720.4" dy="0">TR</tspan></text>
