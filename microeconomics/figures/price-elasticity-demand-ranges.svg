<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="price-elasticity-demand-ranges-t price-elasticity-demand-ranges-d" font-family="Arial, Helvetica, sans-serif">
<title id="price-elasticity-demand-ranges-t">Elasticity changes along a straight-line demand curve</title>
<desc id="price-elasticity-demand-ranges-d">Left: a straight-line demand curve for phone cases from $10 at zero cases to 100 cases at $0. Above the midpoint ($5, 50 cases) demand is elastic; at the midpoint it is unit elastic; below it demand is inelastic, even though the slope is the same everywhere. Right: total revenue (price times quantity) at each quantity. It rises from $0 to its largest value, $250, at the midpoint and then falls back to $0: cutting the price raises revenue in the elastic range and lowers it in the inelastic range. Invented data for practice.</desc>
<defs><marker id="price-elasticity-demand-ranges-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="price-elasticity-demand-ranges-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="price-elasticity-demand-ranges-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="price-elasticity-demand-ranges-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
