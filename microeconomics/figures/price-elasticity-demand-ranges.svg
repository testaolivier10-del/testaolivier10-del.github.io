<text x="266" y="222.8" font-size="13" text-anchor="start" fill="#4B8DB8" font-weight="bold"><tspan x="266" dy="0">Inelastic</tspan><tspan x="266" dy="16.25">(|E| &lt; 1)</tspan></text>
<text x="327.6" y="260.6" font-size="13" text-anchor="start" fill="#084F78" font-weight="bold"><tspan x="327.6" dy="0">D</tspan></text>
