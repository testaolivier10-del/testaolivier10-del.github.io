<text x="645" y="90" font-size="13" fill="#1F2A28">Each dashed curve is</text>
<text x="645" y="108" font-size="13" fill="#1F2A28">one plant size in the</text>
<text x="645" y="126" font-size="13" fill="#1F2A28">short run.</text>
<text x="645" y="170" font-size="13" fill="#1F2A28">LRATC traces the lowest</text>
<text x="645" y="188" font-size="13" fill="#1F2A28">cost of each output when</text>
