<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="long-run-costs-lratc-t long-run-costs-lratc-d" font-family="Arial, Helvetica, sans-serif">
<title id="long-run-costs-lratc-t">Long-run average total cost: economies of scale, constant returns and diseconomies of scale</title>
<desc id="long-run-costs-lratc-d">Average total cost on the vertical axis and quantity of output on the horizontal axis. Three dashed short-run ATC curves, one for each plant size, sit on or above the long-run average total cost curve (LRATC). LRATC falls over the range of economies of scale, is flat over the range of constant returns to scale and rises over the range of diseconomies of scale. Minimum efficient scale (MES) is the smallest output at which LRATC reaches its lowest level.</desc>
