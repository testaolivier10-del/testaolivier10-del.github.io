<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="competitive-factor-markets-side-t competitive-factor-markets-side-d" font-family="Arial, Helvetica, sans-serif">
<title id="competitive-factor-markets-side-t">A competitive labor market and one firm</title>
<desc id="competitive-factor-markets-side-d">Side-by-side graphs with Wage on the vertical axis and Quantity of labor on the horizontal axis. In the labor market, DL and SL cross at the market wage WM and quantity QM. The wage is carried across to the firm, where it is a horizontal line labeled S = MFC = W. The firm hires qF workers, where its downward-sloping MRP curve meets that line.</desc>
