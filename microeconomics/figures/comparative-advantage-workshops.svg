<line x1="100" y1="72.9" x2="442.9" y2="330" stroke="#7E1A5E" stroke-width="3"/>
<text x="260" y="175.7" font-size="15" fill="#7E1A5E" font-weight="700">Fenwick</text>
<line x1="100" y1="244.3" x2="328.6" y2="330" stroke="#084F78" stroke-width="3"/>
<text x="134.3" y="287.1" font-size="15" fill="#084F78" font-weight="700">Garnet</text>
<text x="540" y="64" font-size="14" fill="#1F2A28" font-weight="700">Opportunity cost of 1 table:</text>
<text x="540" y="88" font-size="13" fill="#7E1A5E">Fenwick 2 chairs</text>
<text x="540" y="108" font-size="13" fill="#084F78">Garnet 4 chairs</text>
<text x="540" y="148" font-size="14" fill="#1F2A28" font-weight="700">Opportunity cost of 1 chair:</text>
<text x="540" y="172" font-size="13" fill="#7E1A5E">Fenwick 0.5 table</text>
<text x="540" y="192" font-size="13" fill="#084F78">Garnet 0.25 table</text>
<text x="540" y="232" font-size="13" fill="#1F2A28" font-weight="700">Lower cost of tables: Fenwick</text>
<text x="540" y="252" font-size="13" fill="#1F2A28" font-weight="700">Lower cost of chairs: Garnet</text>
<text x="540" y="290" font-size="13" fill="#6B7370">A price between 2 and 4 chairs</text>
<text x="540" y="308" font-size="13" fill="#6B7370">per table helps both workshops.</text>
</svg>
