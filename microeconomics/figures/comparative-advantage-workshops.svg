<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="comparative-advantage-workshops-t comparative-advantage-workshops-d" font-family="Arial, Helvetica, sans-serif">
<title id="comparative-advantage-workshops-t">Two workshops, two straight PPCs, two opportunity costs</title>
<desc id="comparative-advantage-workshops-d">Production possibilities for one day. Fenwick Workshop can make 12 chairs or 6 tables; Garnet Workshop can make 8 chairs or 2 tables. One table costs Fenwick 2 chairs and Garnet 4, so Fenwick has the comparative advantage in tables; one chair costs Fenwick 0.5 table and Garnet 0.25, so Garnet has the comparative advantage in chairs, even though Fenwick makes more of both. A price between 2 and 4 chairs per table helps both. Invented data for practice.</desc>
<defs><marker id="comparative-advantage-workshops-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="comparative-advantage-workshops-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="comparative-advantage-workshops-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="comparative-advantage-workshops-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="comparative-advantage-workshops-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="800" height="390" fill="#FFFFFF"/>
<line x1="100" y1="24" x2="100" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="100" y1="330" x2="506" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="500" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Chairs per day</text>
<text x="66" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 66 30)">Tables per day</text>
<line x1="157.1" y1="330" x2="157.1" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="157.1" y="349" font-size="12" fill="#6B7370" text-anchor="middle">2</text><line x1="214.3" y1="330" x2="214.3" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="214.3" y="349" font-size="12" fill="#6B7370" text-anchor="middle">4</text><line x1="271.4" y1="330" x2="271.4" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="271.4" y="349" font-size="12" fill="#6B7370" text-anchor="middle">6</text><line x1="328.6" y1="330" x2="328.6" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="328.6" y="349" font-size="12" fill="#6B7370" text-anchor="middle">8</text><line x1="385.7" y1="330" x2="385.7" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="385.7" y="349" font-size="12" fill="#6B7370" text-anchor="middle">10</text><line x1="442.9" y1="330" x2="442.9" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="442.9" y="349" font-size="12" fill="#6B7370" text-anchor="middle">12</text><line x1="500" y1="330" x2="500" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="500" y="349" font-size="12" fill="#6B7370" text-anchor="middle">14</text><line x1="95" y1="287.1" x2="100" y2="287.1" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="291.1" font-size="12" fill="#6B7370" text-anchor="end">1</text><line x1="95" y1="244.3" x2="100" y2="244.3" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="248.3" font-size="12" fill="#6B7370" text-anchor="end">2</text><line x1="95" y1="201.4" x2="100" y2="201.4" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="205.4" font-size="12" fill="#6B7370" text-anchor="end">3</text><line x1="95" y1="158.6" x2="100" y2="158.6" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="162.6" font-size="12" fill="#6B7370" text-anchor="end">4</text><line x1="95" y1="115.7" x2="100" y2="115.7" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="119.7" font-size="12" fill="#6B7370" text-anchor="end">5</text><line x1="95" y1="72.9" x2="100" y2=