<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="monopsony-graph-t monopsony-graph-d" font-family="Arial, Helvetica, sans-serif">
<title id="monopsony-graph-t">A monopsony hires where MRP = MFC and pays the wage on labor supply</title>
<desc id="monopsony-graph-d">A monopsony graph with Wage on the vertical axis and Quantity of labor on the horizontal axis. MFC rises twice as steeply as the labor supply curve SL from the same starting wage. The firm hires QM workers, where MRP crosses MFC, and pays the wage WM read down from that quantity to SL. The wage bill, WM times QM, is the shaded rectangle. Under competition the quantity would be QC and the wage WC, where MRP meets SL; the triangle between MRP and SL from QM to QC is the deadweight loss.</desc>
<defs><marker id="monopsony-graph-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="monopsony-graph-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="monopsony-graph-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="monopsony-graph-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
