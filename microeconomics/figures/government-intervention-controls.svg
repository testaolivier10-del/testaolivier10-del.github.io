<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="government-intervention-controls-t government-intervention-controls-d" font-family="Arial, Helvetica, sans-serif">
<title id="government-intervention-controls-t">A binding price ceiling and a binding price floor</title>
<desc id="government-intervention-controls-d">Two panels for the same ferry ride market, equilibrium $5 and 50 rides. Left: a price ceiling at $3, below equilibrium, is binding: buyers want 70 rides but sellers offer only 30, a shortage of 40, and only 30 rides are traded. Right: a price floor at $7, above equilibrium, is binding: sellers offer 70 rides but buyers want only 30, a surplus of 40, and only 30 rides are traded. In both, the triangle between the curves from 30 to 50 rides is deadweight loss. Invented data for practice.</desc>
<defs><marker id="government-intervention-controls-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="government-intervention-controls-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="government-intervention-controls-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="government-intervention-controls-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
