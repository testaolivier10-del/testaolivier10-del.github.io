<path d="M653 140V320" stroke="#1F2A28" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
<text x="653" y="337" font-size="12" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="653" dy="0">70</tspan></text>
