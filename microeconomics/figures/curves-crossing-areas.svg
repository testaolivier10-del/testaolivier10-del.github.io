<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="curves-crossing-areas-t curves-crossing-areas-d" font-family="Arial, Helvetica, sans-serif">
<title id="curves-crossing-areas-t">Where two curves cross, and the areas a triangle and a rectangle make</title>
<desc id="curves-crossing-areas-d">A downward curve D from $10 at zero to zero at 100 boxes, and an upward curve S from zero to $10 at 100 boxes, cross at E: a price of $5 and a quantity of 50 boxes. Triangle A lies under D and above $5, from 0 to 50 boxes: area ½ × 50 × 5 = 125. Rectangle B lies under $5 from 0 to 50 boxes: area 50 × 5 = 250. Invented data for practice.</desc>
<defs><marker id="curves-crossing-areas-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="curves-crossing-areas-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="curves-crossing-areas-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="curves-crossing-areas-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="curves-crossing-areas-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="800" height="390" fill="#FFFFFF"/>
<line x1="100" y1="24" x2="100" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="100" y1="330" x2="506" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="500" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity (boxes per week)</text>
<text x="66" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 66 30)">Price ($)</text>
<polygon points="100,30 300,180 100,180" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="1.5"/>
<rect x="100" y="180" width="200" height="150" fill="#E3EEF6" fill-opacity="0.75" stroke="#084F78" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="200" y1="330" x2="200" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="200" y="349" font-size="12" fill="#6B7370" text-anchor="middle">25</text><line x1="300" y1="330" x2="300" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="300" y="349" font-size="12" fill="#6B7370" text-anchor="middle">50</text><line x1="400" y1="330" x2="400" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="400" y="349" font-size="12" fill="#6B7370" text-anchor="middle">75</text><line x1="500" y1="330" x2="500" y2="335" stroke="#6B7370" stroke-width="1.2"/><text x="500" y="349" font-size="12" fill="#6B7370" text-anchor="middle">100</text><line x1="95" y1="270" x2="100" y2="270" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="274" font-size="12" fill="#6B7370" text-anchor="end">2</text><line x1="95" y1="210" x2="100" y2="210" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="214" font-size="12" fill="#6B7370" text-anchor="end">4</text><line x1="95" y1="150" x2="100" y2="150" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="154" font-size="12" fill="#6B7370" text-anchor="end">6</text><line x1="95" y1="90" x2="100" y2="90" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="94" font-size="12" fill="#6B7370" text-anchor="end">8</text><line x1="95" y1="30" x2="100" y2="30" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="34" font-size="12" fill="#6B7370" text-anchor="end">10</text>
<line x1="100" y1="30" x2="500" y2="330" stroke="#7E1A5E" stroke-width="3"/><text x="506" y="324" font-size="15" fill="#7E1A5E" font-weight="700">D</text>
<line x1="100" y1="330" x2="500" y2="30" stroke="#D55E00" stroke-width="3"/><text x="506" y="44" font-size="15" fill="#D55E00" font-weight="700">S</text>
<line x1="100" y1="180" x2="300" y2="180" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="300" y1="180" x2="300" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="300" cy="180" r="5" fill="#1F2A28"/>
<text x="310" y="184" font-size="14" fill="#1F2A28" font-weight="700">E (50, $5)</text>
<text x="156" y="138" font-size="18" fill="#7E1A5E" font-weight="700">A</text>
<text x="188" y="258" font-size="18" fill="#084F78" font-weight="700">B</text>
<text x="540" y="70" font-size="13" fill="#1F2A28">Where D and S cross: E,</text>
<text x="540" y="88" font-size="13" fill="#1F2A28">a price of $5 and 50 boxes.</text>
<text x="540" y="130" font-size="13" fill="#7E1A5E" font-weight="700">Triangle A (under D, above $5):</text>
<text x="540" y="150" font-size="13" fill="#7E1A5E">½ × base × height</text>
<text x="540" y="170" font-size="13" fill="#7E1A5E">= ½ × 50 × 5 = 125</text>
<text x="540" y="212" font-size="13" fill="#084F78" font-weight="700">Rectangle B (under $5, out to 50):</text>
<text x="540" y="232" font-size="13" fill="#084F78">base × height</text>
<text x="540" y="252" font-size="13" fill="#084F78">= 50 × 5 = 250</text>
<text x="540" y="294" font-size="12" fill="#6B7370">Read the base on the horizontal</text>
<text x="540" y="310" font-size="12" fill="#6B7370">axis and the height on the vertical.</text>
</svg>
