<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A payoff matrix with best responses underlined</title>
<desc id="d">A two-by-two payoff matrix for Firm A (rows) and Firm B (columns), each choosing Advertise or Do not, payoffs in thousands of dollars with Firm A first: both advertise 50, 50; A advertises and B does not 90, 20; A does not and B advertises 20, 90; neither advertises 70, 70. Each firm's best response is underlined. Advertise is a dominant strategy for both, so both advertising is the Nash equilibrium, although both not advertising gives each firm more.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<text x="370" y="40" font-size="16" fill="#0072B2" text-anchor="middle" font-weight="700">Firm B</text><text x="60" y="176" font-size="16" fill="#7E1A5E" text-anchor="middle" font-weight="700">Firm A</text><text x="285" y="76" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="700">Advertise</text><text x="455" y="76" font-size="14" fill="#0072B2" text-anchor="middle" font-weight="700">Do not</text><text x="188" y="135" font-size="14" fill="#7E1A5E" text-anchor="end" font-weight="700">Advertise</text><text x="188" y="215" font-size="14" fill="#7E1A5E" text-anchor="end" font-weight="700">Do not</text><rect x="200" y="90" width="170" height="80" fill="#F8E6F1" stroke="#1F2A28" stroke-width="1.5"/><text x="255" y="136" font-size="18" fill="#7E1A5E" text-anchor="middle" font-weight="700">$50</text><text x="285" y="136" font-size="18" fill="#1F2A28" text-anchor="middle">,</text><text x="315" y="136" font-size="18" fill="#0072B2" text-anchor="middle" font-weight="700">$50</text><line x1="237" y1="142" x2="273" y2="142" stroke="#7E1A5E" stroke-width="2.4"/><line x1="297" y1="142" x2="333" y2="142" stroke="#0072B2" stroke-width="2.4"/><text x="208" y="108" font-size="12" fill="#7E1A5E" font-weight="700">Nash equilibrium</text><rect x="370" y="90" width="170" height="80" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="425" y="136" font-size="18" fill="#7E1A5E" text-anchor="middle" font-weight="700">$90</text><text x="455" y="136" font-size="18" fill="#1F2A28" text-anchor="middle">,</text><text x="485" y="136" font-size="18" fill="#0072B2" text-anchor="middle" font-weight="700">$20</text><line x1="407" y1="142" x2="443" y2="142" stroke="#7E1A5E" stroke-width="2.4"/><rect x="200" y="170" width="170" height="80" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="255" y="216" font-size="18" fill="#7E1A5E" text-anchor="middle" font-weight="700">$20</text><text x="285" y="216" font-size="18" fill="#1F2A28" text-anchor="middle">,</text><text x="315" y="216" font-size="18" fill="#0072B2" text-anchor="middle" font-weight="700">$90</text><line x1="297" y1="222" x2="333" y2="222" stroke="#0072B2" stroke-width="2.4"/><rect x="370" y="170" width="170" height="80" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="425" y="216" font-size="18" fill="#7E1A5E" text-anchor="middle" font-weight="700">$70</text><text x="455" y="216" font-size="18" fill="#1F2A28" text-anchor="middle">,</text><text x="485" y="216" font-size="18" fill="#0072B2" text-anchor="middle" font-weight="700">$70</text><text x="560" y="110" font-size="12" fill="#5B6662">Payoffs in thousands</text><text x="560" y="126" font-size="12" fill="#5B6662">of dollars, Firm A first.</text><text x="560" y="160" font-size="12" fill="#5B6662">Underlined: the best</text><text x="560" y="176" font-size="12" fill="#5B6662">response to the other</text><text x="560" y="192" font-size="12" fill="#5B6662">firm's choice.</text><text x="200" y="290" font-size="13" fill="#1F2A28">Firm A: 50 &gt; 20 if B advertises, and 90 &gt; 70 if B does not, so Advertise is dominant.</text><text x="70" y="318" font-size="13" fill="#1F2A28">Both advertise ($50 each), though both not advertising ($70 each) would pay more: a prisoner's dilemma.</text>
</svg>
