<text x="351.6" y="217" font-size="14" fill="#D55E00" font-weight="700">B</text>
<text x="645" y="70" font-size="13" fill="#1F2A28" font-weight="700">P1, above min ATC:</text>
<text x="645" y="88" font-size="13" fill="#1F2A28">economic profit.</text>
<text x="645" y="128" font-size="13" fill="#1F2A28" font-weight="700">P2, between min AVC</text>
<text x="645" y="146" font-size="13" fill="#1F2A28">and min ATC: a loss, but</text>
<text x="645" y="164" font-size="13" fill="#1F2A28">price covers AVC, so keep</text>
<text x="645" y="182" font-size="13" fill="#1F2A28">producing in the short run.</text>
<text x="645" y="222" font-size="13" fill="#1F2A28" font-weight="700">P3, below min AVC:</text>
<text x="645" y="240" font-size="13" fill="#1F2A28">shut down; the loss is</text>
<text x="645" y="258" font-size="13" fill="#1F2A28">then the fixed cost alone.</text>
<text x="645" y="372" font-size="13" fill="#084F78" font-weight="700">S: shutdown point</text>
<text x="645" y="390" font-size="13" fill="#D55E00" font-weight="700">B: break-even point</text>
<text x="645" y="300" font-size="13" fill="#7E1A5E">Above the shutdown point,</text>
<text x="645" y="318" font-size="13" fill="#7E1A5E">the MC curve is the firm's</text>
<text x="645" y="336" font-size="13" fill="#7E1A5E">short-run supply curve.</text>
