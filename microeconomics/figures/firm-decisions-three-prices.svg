<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="firm-decisions-three-prices-t firm-decisions-three-prices-d" font-family="Arial, Helvetica, sans-serif">
<title id="firm-decisions-three-prices-t">Three prices and the short-run decision: profit, loss but produce, shut down</title>
<desc id="firm-decisions-three-prices-d">A firm's MC, ATC and AVC curves with three price lines. P1 is above the lowest point of ATC, so the firm earns an economic profit. P2 is between the lowest points of AVC and ATC: the firm makes a loss but covers its variable costs, so it keeps producing in the short run. P3 is below the lowest point of AVC: the firm shuts down. The shutdown point is the lowest point of AVC and the break-even point the lowest point of ATC; above the shutdown point, the MC curve is the firm's short-run supply curve.</desc>
