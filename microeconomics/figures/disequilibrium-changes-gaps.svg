<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="disequilibrium-changes-gaps-t disequilibrium-changes-gaps-d" font-family="Arial, Helvetica, sans-serif">
<title id="disequilibrium-changes-gaps-t">A shortage below equilibrium, a surplus above it</title>
<desc id="disequilibrium-changes-gaps-d">Demand and supply for bike helmets cross at E: $40 and 60 helmets. At $30, quantity demanded is 70 and quantity supplied is 40: a shortage of 30 helmets, which pushes the price up. At $50, quantity supplied is 80 and quantity demanded is 50: a surplus of 30 helmets, which pushes the price down. Invented data for practice.</desc>
<defs><marker id="disequilibrium-changes-gaps-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="disequilibrium-changes-gaps-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="disequilibrium-changes-gaps-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="disequilibrium-changes-gaps-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="640" height="420" fill="#FFFFFF"/>
