<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="intervention-structures-ceiling-t intervention-structures-ceiling-d" font-family="Arial, Helvetica, sans-serif">
<title id="intervention-structures-ceiling-t">A price ceiling at P = MC on a monopoly raises output</title>
<desc id="intervention-structures-ceiling-d">A monopoly graph with Price and cost on the vertical axis and Quantity on the horizontal axis, showing D, MR below it, MC passing through the minimum of ATC, and ATC. Unregulated, the monopoly produces QM where MR = MC and charges PM from demand. A price ceiling PC set where demand meets MC makes the ceiling the firm's marginal revenue up to demand, so it produces QC, more than QM, at the lower price PC.</desc>
