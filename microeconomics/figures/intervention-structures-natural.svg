<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="intervention-structures-natural-t intervention-structures-natural-d" font-family="Arial, Helvetica, sans-serif">
<title id="intervention-structures-natural-t">Three prices for a natural monopoly</title>
<desc id="intervention-structures-natural-d">A natural monopoly graph with Price and cost on the vertical axis and Quantity on the horizontal axis. ATC falls over the whole range of demand and stays above the flat MC curve. Unregulated, the firm produces QM where MR = MC and charges PM from the demand curve. The fair-return price PF, where demand meets ATC, gives a larger quantity QF and zero economic profit. The socially optimal price PS, where demand meets MC, gives the largest quantity QS, but there price is below ATC, so the firm makes a loss.</desc>
