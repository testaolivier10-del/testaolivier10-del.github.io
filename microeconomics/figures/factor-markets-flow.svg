<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="factor-markets-flow-t factor-markets-flow-d" font-family="Arial, Helvetica, sans-serif">
<title id="factor-markets-flow-t">Product markets and factor markets</title>
<desc id="factor-markets-flow-d">Households buy goods and services from firms in the product market and sell labor, land and capital to firms in the factor market. Money flows the other way: spending becomes firms' revenue, and wages, rent and interest become households' income.</desc>
<defs><marker id="factor-markets-flow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="factor-markets-flow-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="factor-markets-flow-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="factor-markets-flow-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="780" height="380" fill="#FFFFFF"/>
<rect x="40" y="150" width="170" height="80" rx="8" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="2"/>
<text x="125" y="186" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Households</text>
<text x="125" y="208" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">buy goods, sell factors</text>
<rect x="570" y="150" width="170" height="80" rx="8" fill="#F8E6F1" stroke="#7E1A5E" stroke-width="2"/>
<text x="655" y="186" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">Firms</text>
<text x="655" y="208" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">sell goods, buy factors</text>
<rect x="300" y="28" width="180" height="70" rx="8" fill="#DDEBF7" stroke="#0072B2" stroke-width="2"/>
<text x="390" y="60" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Product market</text>
<text x="390" y="80" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">bread, haircuts, bikes</text>
<rect x="300" y="282" width="180" height="70" rx="8" fill="#FBE3D2" stroke="#D55E00" stroke-width="2"/>
<text x="390" y="314" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Factor market</text>
<text x="390" y="334" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">labor, land, capital</text>
<line x1="600" y1="145" x2="485" y2="75" stroke="#0072B2" stroke-width="2.2" marker-end="url(#factor-markets-flow-arB)"/>
<text x="555" y="102" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="start">goods and services</text>
<line x1="300" y1="75" x2="185" y2="145" stroke="#0072B2" stroke-width="2.2" marker-end="url(#factor-markets-flow-arB)"/>
<text x="236" y="96" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="end">goods and services</text>
<line x1="185" y1="235" x2="300" y2="310" stroke="#D55E00" stroke-width="2.2" marker-end="url(#factor-markets-flow-arV)"/>
<text x="236" y="304" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="end">labor, land, capital</text>
<line x1="485" y1="310" x2="600" y2="235" stroke="#D55E00" stroke-width="2.2" marker-end="url(#factor-markets-flow-arV)"/>
<text x="548" y="304" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">labor, land, capital</text>
<line x1="215" y1="160" x2="320" y2="100" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#factor-markets-flow-ar)"/>
<text x="275" y="152" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">spending</text>
<line x1="460" y1="100" x2="565" y2="160" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#factor-markets-flow-ar)"/>
<text x="505" y="152" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">revenue</text>
<line x1="565" y1="222" x2="460" y2="282" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#factor-markets-flow-ar)"/>
<text x="505" y="236" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">wages, rent, interest</text>
<line x1="320" y1="282" x2="215" y2="222" stroke="#1F2A28" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#factor-markets-flow-ar)"/>
<text x="275" y="236" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">income</text>
<text x="390" y="190" font-size="12" font-weight="normal" fill="#6B7672" text-anchor="middle">Solid: goods and factors</text>
<text x="390" y="208" font-size="12" font-weight="normal" fill="#6B7672" text-anchor="middle">Dashed: money</text>
</svg>
