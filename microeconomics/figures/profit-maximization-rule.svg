<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="profit-maximization-rule-t profit-maximization-rule-d" font-family="Arial, Helvetica, sans-serif">
<title id="profit-maximization-rule-t">The profit-maximizing output where marginal revenue equals marginal cost</title>
<desc id="profit-maximization-rule-d">Price and cost on the vertical axis and quantity of output on the horizontal axis. A firm sells every unit at the price P, so its demand and marginal revenue are one horizontal line, d = MR = P. MC rises through it at q*, the profit-maximizing output. Price is above ATC at q*, and the shaded profit rectangle runs from the price down to ATC and from zero out to q*.</desc>
<defs><marker id="profit-maximization-rule-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="profit-maximization-rule-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="profit-maximization-rule-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="profit-maximization-rule-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="860" height="400" fill="#FFFFFF"/>
