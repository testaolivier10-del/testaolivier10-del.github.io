<text x="384.6" y="378" font-size="13" fill="#7E1A5E" text-anchor="middle" font-weight="700">q*</text>
<text x="84" y="150.5" font-size="13" fill="#084F78" text-anchor="end" font-weight="700">P</text>
<text x="84" y="197" font-size="12" fill="#D55E00" text-anchor="end">ATC at q*</text>
<text x="645" y="80" font-size="13" fill="#7E1A5E" font-weight="700">Produce where MR = MC:</text>
<text x="645" y="98" font-size="13" fill="#1F2A28">output q*.</text>
<text x="645" y="140" font-size="13" fill="#1F2A28" font-weight="700">Profit = (P - ATC) x q*,</text>
<text x="645" y="158" font-size="13" fill="#1F2A28">the rectangle from the</text>
<text x="645" y="176" font-size="13" fill="#1F2A28">price down to ATC, from</text>
<text x="645" y="194" font-size="13" fill="#1F2A28">zero out to q*.</text>
<text x="645" y="236" font-size="13" fill="#1F2A28">Left of q*, each unit adds</text>
<text x="645" y="254" font-size="13" fill="#1F2A28">more to revenue than to</text>
<text x="645" y="272" font-size="13" fill="#1F2A28">cost; right of q*, less.</text>
