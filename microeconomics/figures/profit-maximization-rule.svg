<text x="556" y="149.5" font-size="14" fill="#084F78" font-weight="700">d = MR = P</text>
<text x="447.9" y="46.7" font-size="15" fill="#7E1A5E" font-weight="700">MC</text>
<text x="556" y="118.3" font-size="15" fill="#D55E00" font-weight="700">ATC</text>
<circle cx="384.6" cy="145.5" r="6" fill="#7E1A5E"/>
