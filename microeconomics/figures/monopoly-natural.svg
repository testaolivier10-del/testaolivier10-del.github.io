<title id="t">A natural monopoly and two regulated prices</title>
<desc id="d">A natural monopoly: average total cost ATC falls over the whole range of demand and lies above a flat marginal cost MC. Unregulated, the firm produces QM where MR = MC and charges PM from demand. At the fair-return price PF, where demand meets ATC, it earns zero economic profit at QF. At the socially optimal price PS, where demand meets MC, output is the efficient QS but price is below ATC, so the firm makes a loss.</desc>
