<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="production-possibilities-shapes-t production-possibilities-shapes-d" font-family="Arial, Helvetica, sans-serif">
<title id="production-possibilities-shapes-t">Three PPC shapes and the opportunity cost each shows</title>
<desc id="production-possibilities-shapes-d">Three production possibilities curves for Good A and Good B. Bowed out: increasing opportunity cost, because resources suit one good more than the other; the usual case. A straight line: constant opportunity cost, because resources are equally good at both goods. Bowed in, dashed and labeled as a contrast: decreasing opportunity cost, each extra unit costs less of the other good.</desc>
