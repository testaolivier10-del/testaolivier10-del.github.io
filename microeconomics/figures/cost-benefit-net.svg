<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="cost-benefit-net-t cost-benefit-net-d" font-family="Arial, Helvetica, sans-serif">
<title id="cost-benefit-net-t">Total benefit, cost and net benefit</title>
<desc id="cost-benefit-net-d">Paired bars for 0 to 5 guitar lessons a month: total benefit $0, $50, $90, $120, $140 and $150, and the cost at $25 a lesson, $0 to $125. Net benefit, total benefit minus cost, is 0, 25, 40, 45, 40 and 25 dollars, largest at 3 lessons ($45). Invented data for practice.</desc>
<defs><marker id="cost-benefit-net-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="cost-benefit-net-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="cost-benefit-net-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="cost-benefit-net-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="cost-benefit-net-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="800" height="380" fill="#FFFFFF"/>
<line x1="100" y1="24" x2="100" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="100" y1="330" x2="526" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="520" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Guitar lessons per month</text>
<text x="66" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 66 30)">Dollars</text>
<line x1="95" y1="292.5" x2="100" y2="292.5" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="296.5" font-size="12" fill="#6B7370" text-anchor="end">20</text><line x1="95" y1="255" x2="100" y2="255" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="259" font-size="12" fill="#6B7370" text-anchor="end">40</text><line x1="95" y1="217.5" x2="100" y2="217.5" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="221.5" font-size="12" fill="#6B7370" text-anchor="end">60</text><line x1="95" y1="180" x2="100" y2="180" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="184" font-size="12" fill="#6B7370" text-anchor="end">80</text><line x1="95" y1="142.5" x2="100" y2="142.5" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="146.5" font-size="12" fill="#6B7370" text-anchor="end">100</text><line x1="95" y1="105" x2="100" y2="105" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="109" font-size="12" fill="#6B7370" text-anchor="end">120</text><line x1="95" y1="67.5" x2="100" y2="67.5" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="71.5" font-size="12" fill="#6B7370" text-anchor="end">140</text><line x1="95" y1="30" x2="100" y2="30" stroke="#6B7370" stroke-width="1.2"/><text x="92" y="34" font-size="12" fill="#6B7370" text-anchor="end">160</text>
<rect x="116.8" y="330" width="16.8" height="0" fill="#7E1A5E"/>
<rect x="136.4" y="330" width="16.8" height="0" fill="#084F78"/>
<text x="135" y="349" font-size="12" fill="#6B7370" text-anchor="middle">0</text>
<text x="135" y="322" font-size="11" fill="#6B7370" text-anchor="middle">net 0</text>
<rect x="186.8" y="236.3" width="16.8" height="93.8" fill="#7E1A5E"/>
<rect x="206.4" y="283.1" width="16.8" height="46.9" fill="#084F78"/>
<text x="205" y="349" font-size="12" fill="#6B7370" text-anchor="middle">1</text>
<text x="205" y="228.3" font-size="11" fill="#6B7370" text-anchor="middle">net 25</text>
<rect x="256.8" y="161.3" width="16.8" height="168.8" fill="#7E1A5E"/>
<rect x="276.4" y="236.3" width="16.8" height="93.8" fill="#084F78"/>
<text x="275" y="349" font-size="12" fill="#6B7370" text-anchor="middle">2</text>
<text x="275" y="153.3" font-size="11" fill="#6B7370" text-anchor="middle">net 40</text>
<rect x="326.8" y="105" width="16.8" height="225" fill="#7E1A5E"/>
<rect x="346.4" y="189.4" width="16.8" height="140.6" fill="#084F78"/>
<text x="345" y="349" font-size="12" fill="#6B7370" text-anchor="middle">3</text>
<text x="345" y="97" font-size="11" fill="#D55E00" text-anchor="middle" font-weight="700">net 45</text>
<rect x="396.8" y="67.5" width="16.8" height="262.5" fill="#7E1A5E"/>
<rect x="416.4" y="142.5" width="16.8" height="187.5" fill="#084F78"/>
<text x="415" y="349" font-size="12" fill="#6B7370" text-anchor="middle">4</text>
<text x="415" y="59.5" font-size="11" fill="#6B7370" text-anchor="middle">net 40</text>
<rect x="466.8" y="48.8" width="16.8" height="281.3" fill="#7E1A5E"/>
<rect x="486.4" y="95.6" width="16.8" height="234.4" fill="#084F78"/>
<text x="485" y="349" font-size="12" fill="#6B7370" text-anchor="middle">5</text>
<text x="485" y="40.8" font-size="11" fill="#6B7370" text-anchor="middle">net 25</text>
<rect x="560" y="60" width="16" height="16" rx="2" fill="#7E1A5E" stroke="none" stroke-width="1.6"/>
<text x="584" y="74" font-size="13" fill="#1F2A28">Total benefit</text>
<rect x="560" y="88" width="16" height="16" rx="2" fill="#084F78" stroke="none" stroke-width="1.6"/>
<text x="584" y="102" font-size="13" fill="#1F2A28">Cost ($25 a lesson)</text>
<text x="560" y="144" font-size="13" fill="#1F2A28">Net benefit = total benefit</text>
<text x="560" y="162" font-size="13" fill="#1F2A28">minus the full cost.</text>
<text x="560" y="196" font-size="13" fill="#D55E00" font-weight="700">It is largest at 3 lessons:</text>
<text x="560" y="214" font-size="13" fill="#D55E00" font-weight="700">$120 - $75 = $45.</text>
<text x="560" y="252" font-size="12" fill="#6B7370">More lessons still add benefit,</text>
<text x="560" y="268" font-size="12" fill="#6B7370">but they add more cost than</text>
<text x="560" y="284" font-size="12" fill="#6B7370">benefit after the third.</text>
</svg>
