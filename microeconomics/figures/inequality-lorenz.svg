<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="inequality-lorenz-t inequality-lorenz-d" font-family="Arial, Helvetica, sans-serif">
<title id="inequality-lorenz-t">Lorenz curves for two invented countries</title>
<desc id="inequality-lorenz-d">A Lorenz curve graph with Cumulative percentage of households on the horizontal axis and Cumulative percentage of income on the vertical axis, both from 0 to 100 percent. The diagonal is the line of equality. Country A's curve passes through 8, 22, 40 and 62 percent of income at 20, 40, 60 and 80 percent of households. Country B's curve lies below it, through 4, 12, 26 and 50 percent, so income in Country B is less equally shared. The shaded area between the line of equality and Country B's curve is the area the Gini coefficient compares with the whole triangle under the line. Invented data for practice.</desc>
<defs><marker id="inequality-lorenz-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="inequality-lorenz-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E1A5E"/></marker><marker id="inequality-lorenz-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="inequality-lorenz-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
