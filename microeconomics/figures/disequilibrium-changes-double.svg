<text x="694.4" y="84" font-size="13" text-anchor="start" fill="#5B6664" font-weight="bold"><tspan x="694.4" dy="0">S1</tspan></text>
<path d="M461.6 235L639.8 70" fill="none" stroke="#7E1A5E" stroke-width="2.8" stroke-linecap="round"/>
<text x="644.8" y="74" font-size="13" text-anchor="start" fill="#7E1A5E" font-weight="bold"><tspan x="644.8" dy="0">S2</tspan></text>
<circle cx="575" cy="175" r="4.5" fill="#5B6664"/>
<text x="575" y="197" font-size="12" text-anchor="middle" fill="#5B6664" font-weight="bold"><tspan x="575" dy="0">E1</tspan></text>
<circle cx="575" cy="130" r="4.5" fill="#1F2A28"/>
<text x="585" y="135" font-size="12" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan x="585" dy="0">E2</tspan></text>
<text x="575" y="378" font-size="13" text-anchor="middle" fill="#D55E00" font-weight="bold"><tspan x="575" dy="0">Price rises; quantity indeterminate</tspan></text>
</svg>
