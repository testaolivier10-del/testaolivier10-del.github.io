name = "levlprep-ask"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Variables set in the dashboard (POLAR_PRODUCTS, FOUNDING_DISCOUNT_ID, ...)
# survive a `wrangler deploy`. Without this, deploying with the [vars]
# block below replaced every dashboard variable with just these, and Premium
# checkout would have answered 503 until someone noticed.
keep_vars = true

# Where the Worker answers. api.levlprep.com is the address the site uses
# (worker/src/config.js, API_URL_DEFAULT). The workers.dev address stays on
# so tabs opened before the switch, whose scripts and CSP still name it, keep
# working; turn it off (workers_dev = false) on or after 2026-10-09.
workers_dev = true
routes = [
  { pattern = "api.levlprep.com", custom_domain = true },
]

# The Premium vault (src/vault.js, docs/premium-vault.md): the Premium lesson
# pages the deploy keeps off the public site. run_worker_first so no request
# can read them except through vaultRoute(), which checks the session and the
# pass. html_handling none so env.VAULT.fetch returns x.html as it is, with no
# redirect. Built by scripts/build-deploy.mjs before every deploy.
[assets]
directory = "../.deploy/vault"
binding = "VAULT"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Workers AI. Free accounts get a daily allowance; past it, requests fail and
# the site falls back to its own answers. No card, no overage.
[ai]
binding = "AI"

# Per-IP throttle: 12 questions a minute is plenty for a human studying and
# useless to anyone trying to burn through the daily allowance.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

# The reminder cron. Every fifteen minutes rather than once a day, because a
# student picks their own hour and there are as many local times as there are
# time zones — a daily cron would deliver everybody's reminder at whatever hour
# UTC happened to be chosen. Each tick only reads rows whose time has actually
# come, so an idle tick costs one indexed query.
[triggers]
crons = ["*/15 * * * *"]

# Reminders need the site's own database, since push_subscriptions is locked
# the same way every other table is (RLS on, no policies) and the browser can
# only reach it through a security-definer function.
[vars]
SUPABASE_URL = "https://bsfcqrczehbcctwhxmrj.supabase.co"
# The public half of the VAPID pair. Public on purpose — the same value is in
# assets/reminders.js, because the browser has to send it when subscribing.
# Generate both halves with: node scripts/vapid-keys.mjs
VAPID_PUBLIC_KEY = "BJQrCo49iKi_sn7czvlq2nNFI1G_uy9IJSo_0KruVHaz3Iu9h7Nug8ay2JXbzlaiqFJuULZ1d1Y2Qqbzp_2Psfk"
VAPID_SUBJECT = "mailto:hello@levlprep.com"
# The AI FRQ grader: "owner" = the owner's account only, while he tries it
# (docs/frq-grader.md). "on" at launch, "off" to stop.
FRQ_GRADER = "owner"
# Teacher classes: Google Classroom for every teacher (docs/teacher-classes.md). Every scope it asks for is
# non-sensitive (no classroom.profile.emails), so Google needs no app verification. Needs GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET and CLASS_SECRET; without them it stays off on its own. "off" to stop.
CLASS_GOOGLE = "on"
# The new site host's test address (worker/site, docs/premium-vault.md), so the Premium vault answers
# pages served there while levlprep.com still points at GitHub Pages. Remove after the cutover.
SITE_PREVIEW_ORIGIN = "https://levlprep-site.testaolivier10.workers.dev"

# Premium passes (src/premium.js; setup in README.md, "Premium"). Left
# commented so nothing changes until Polar is set up: with no product ids,
# /premium/checkout answers 503 and the site's LAUNCHED switch stays off.
#
#   POLAR_PRODUCTS        JSON, pass id -> Polar product id, e.g.
#                         '{"nremt-90":"<uuid>","ochem-semester":"<uuid>","ochem-year":"<uuid>","anp-semester":"<uuid>","anp-year":"<uuid>"}'
#   POLAR_API             https://api.polar.sh (the default) or, for testing,
#                         https://sandbox-api.polar.sh. Products, tokens and
#                         webhook secrets do not cross between the two.
#   FOUNDING_DISCOUNT_ID  a Polar discount id applied to every checkout while
#                         set; unset it when the founding offer ends
#
# POLAR_PRODUCTS = ''
# POLAR_API = "https://api.polar.sh"
# FOUNDING_DISCOUNT_ID = ""

#   FRQ_GRADER            the AI free-response grader (src/frq-grade.js,
#                         docs/frq-grader.md): "on", "owner" (the owner's
#                         account only, for testing) or unset/"off" (default)
#   FRQ_GRADER_MODEL      Claude model id for it; default claude-haiku-5-5
#
#   CLASS_GOOGLE          Google Classroom for teacher classes (src/class-google.js,
#                         docs/teacher-classes.md): "on" (set above), "owner"
#                         (owner only, for trying a change) or unset/"off"
#   CLASS_LTI             Canvas / Schoology through LTI 1.3 (src/class-lti.js):
#                         "on", "owner" or unset/"off"
#   CLASS_SALES_TO        where Class Premium quote requests go; default
#                         hello@levlprep.com
#
#   ALLOW_LOCALHOST       "true" on a development Worker only: lets a copy of
#                         the site on localhost:8000 call it. Never in
#                         production.
#   API_URL               where this Worker answers, if not the default in
#                         src/config.js (the unsubscribe link uses it)

# Secrets, NOT set here. `wrangler secret put NAME`, or Settings -> Variables
# -> add as Secret in the dashboard:
#
#   VAPID_PRIVATE_KEY      the private half of the pair above
#   SUPABASE_SERVICE_KEY   service role key; bypasses RLS, so it never goes
#                          near a browser
#   POLAR_ACCESS_TOKEN     Polar organization access token (checkouts:write)
#   POLAR_WEBHOOK_SECRET   the secret Polar shows for the webhook endpoint
#   CLASS_SECRET           teacher-class integrations: 32+ random characters
#                          (signs OAuth/LTI state and the stop link, encrypts
#                          the stored Google token). `openssl rand -base64 48`
#   GOOGLE_CLIENT_ID       Google Classroom OAuth client (Google Cloud console)
#   GOOGLE_CLIENT_SECRET
#   LTI_PRIVATE_KEY        the LTI tool key, from node scripts/lti-keygen.mjs
#   ANTHROPIC_API_KEY      the FRQ grader's Claude key, from a Console account
#                          with NO card and auto-reload off (prepaid credits:
#                          when they run out it errors, it never bills)
