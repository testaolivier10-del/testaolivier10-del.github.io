# The public site (docs/premium-vault.md). Static files from .deploy/site
# (scripts/build-deploy.mjs), served free and without a request limit; the
# small script below runs only when no file matches, to give the same URLs
# GitHub Pages gave: /bio -> /bio/, /bio/ -> /bio/index.html, /about -> /about.html,
# and 404.html for anything else.
name = "levlprep-site"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# levlprep.com is served here (cutover 2026-11-08, docs/premium-vault.md). A route, not a custom
# domain, so the zone's DNS records stay as they are: the route takes effect once levlprep.com's
# records are proxied (orange cloud), and turning the proxy off is the instant way back.
routes = [
  { pattern = "levlprep.com/*", zone_name = "levlprep.com" },
]

[assets]
directory = "../../.deploy/site"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
