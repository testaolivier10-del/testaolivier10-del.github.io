<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#101735}</style></head><body>
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="bg" cx="0.4" cy="0.4" r="0.8"><stop offset="0" stop-color="#26346b"/><stop offset="1" stop-color="#0f1534"/></radialGradient></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><g id="b"></g><g id="g"></g><g id="ui"></g></svg>
<script src="../common.js"></script><script src="../livegraph.js"></script>
<script>
const S = LPSci, ui = document.getElementById('ui');
const B = new LPGalton(document.getElementById('b'), { x: 560, y: 190, rows: 12, spacing: 54, rowH: 38, balls: 300, interval: 0.017, start: 0.2, hop: 0.08, binH: 370 });
let last = { counts: new Array(13).fill(0), landed: 0 };
const n = 12, edges = []; for (let i = 0; i <= 13; i++) edges.push(i - 0.5);
const Gr = new LPGraph(document.getElementById('g'), { x: 1130, y: 300, w: 660, h: 480, xr: [-0.5, 12.5], yr: [0, 0.3], xTicks: 2, yTicks: 0.1,
  xLabel: 'number of right bounces', yLabel: 'fraction of balls', fmtY: (v) => v.toFixed(1), fmtX: (v) => v.toFixed(0), in: [0, 0.8] });
Gr.bars({ edges, counts: () => last.counts.map((c) => (last.landed ? c / last.landed : 0)), color: '#f0a33c' });
const mu = n / 2, sd = Math.sqrt(n) / 2;
Gr.curve({ fn: (x) => Math.exp(-((x - mu) ** 2) / (2 * sd * sd)) / (sd * Math.sqrt(2 * Math.PI)), sweep: (t) => -0.5 + 13 * Math.min(1, Math.max(0, (t - 0.8) / 1.5)), color: '#fff1d6', width: 5, dot: false });
const L = [S.label(ui, { size: 34 }), S.label(ui, { size: 26, bg: '#2a3a72' }), S.label(ui, { size: 24, bg: '#3a3420', fg: '#fff1d6' })];
window.__seek = (t) => {
  last = B.draw(t); Gr.draw(t);
  L[0].set('Galton board: random bounces build a normal curve', 1460, 120);
  L[1].set(`${last.landed} balls landed`, 1460, 910, 1);
  L[2].set('normal curve  μ = 6, σ = 1.73', 1640, 340, Math.min(1, Math.max(0, (t - 1) / 0.5)));
};
</script></body></html>
