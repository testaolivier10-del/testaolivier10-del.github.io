<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Secant slopes closing in on the instantaneous rate</title>
<desc id="d">The parabola f(x) = x squared over 4, plus 1, with the point P at x = 1. Four secant lines join P to points Q at x = 4, 3, 2 and 1.4; their slopes are 1.25, 1, 0.75 and 0.6. A table adds h = 0.01, slope 0.5025. As Q moves toward P the secant slopes approach 0.5, the instantaneous rate of change of f at x = 1.</desc>
