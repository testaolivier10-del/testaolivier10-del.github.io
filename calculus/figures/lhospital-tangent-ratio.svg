<line x1="510" y1="75" x2="540" y2="75" stroke="#8C1036" stroke-width="3"/><text x="548" y="80" font-size="14" text-anchor="start" fill="#1F2A28"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) = <tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="70%"><tspan font-style="italic">x</tspan></tspan> − 1</text><line x1="510" y1="103" x2="540" y2="103" stroke="#0072B2" stroke-width="3"/><text x="548" y="108" font-size="14" text-anchor="start" fill="#1F2A28"><tspan font-style="italic">g</tspan>(<tspan font-style="italic">x</tspan>) = sin(2<tspan font-style="italic">x</tspan>)</text><text x="510" y="156" font-size="14" text-anchor="start" fill="#1F2A28" font-weight="bold">Both are 0 at <tspan font-style="italic">x</tspan> = 0: the form 0/0.</text><text x="510" y="190" font-size="13" text-anchor="start" fill="#5A6563">Near 0 each looks like its</text><text x="510" y="208" font-size="13" text-anchor="start" fill="#5A6563">tangent line: <tspan font-style="italic">f</tspan> ≈ 1·<tspan font-style="italic">x</tspan> and <tspan font-style="italic">g</tspan> ≈ 2<tspan font-style="italic">x</tspan>.</text><text x="510" y="248" font-size="14" text-anchor="start" fill="#1F2A28">So <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>)/<tspan font-style="italic">g</tspan>(<tspan font-style="italic">x</tspan>) ≈ <tspan font-style="italic">x</tspan>/(2<tspan font-style="italic">x</tspan>) = 1/2.</text><text x="510" y="290" font-size="14" text-anchor="start" fill="#8C1036" font-weight="bold">L'Hospital's rule:</text><text x="510" y="314" font-size="14" text-anchor="start" fill="#8C1036">lim <tspan font-style="italic">f</tspan>/<tspan font-style="italic">g</tspan> = lim <tspan font-style="italic">f</tspan>′/<tspan font-style="italic">g</tspan>′ = <tspan font-style="italic">f</tspan>′(0)/<tspan font-style="italic">g</tspan>′(0) = 1/2</text>
</svg>
