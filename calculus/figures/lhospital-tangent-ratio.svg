<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Why L'Hospital's rule works: near the point, each function is its tangent line</title>
<desc id="d">Graphs of f(x) = e to the x minus 1 (crimson) and g(x) = sin(2x) (blue) for x from minus 0.9 to 0.9, both through the origin, with their dashed tangent lines y = x (slope 1) and y = 2x (slope 2). Since f(0) = g(0) = 0 the quotient f/g has the form 0/0 at 0. Near 0 each function is close to its tangent line, so f(x)/g(x) is close to x/(2x) = 1/2, which is f prime of 0 over g prime of 0.</desc>
