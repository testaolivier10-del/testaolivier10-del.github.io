<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="average-value-rectangle-t average-value-rectangle-d" font-family="Arial, Helvetica, sans-serif">
<title id="average-value-rectangle-t">The average value is the height of the equal-area rectangle</title>
<desc id="average-value-rectangle-d">The parabola f(x) = 6x − x² on 0 ≤ x ≤ 6 with the area under it shaded in crimson, 36 square units. A dashed blue rectangle of width 6 and height 6 has the same area, so the average value of f on [0, 6] is 6. The curve meets the line y = 6 at x = 3 − √3 and x = 3 + √3, marked with blue points.</desc>
