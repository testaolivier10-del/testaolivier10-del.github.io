<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From secant line to tangent line</title>
<desc id="d">The curve y = f(x) with a point at x = a and a second point at x = a + h. A dashed blue secant line joins them; a dashed run of length h and a rise of f(a + h) minus f(a) are marked. A solid dark tangent line touches the curve at x = a. The secant slope is the average rate of change on [a, a + h]; as h shrinks to 0 it approaches the tangent slope f prime of a.</desc>
