<text x="411" y="215" font-size="14" text-anchor="start" fill="#5A6563">+3</text>
<text x="91" y="178.2" font-size="15" text-anchor="start" fill="#8C1036"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>)</text>
<text x="366.67" y="88" font-size="15" text-anchor="end" fill="#0072B2"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) + 3</text>
<text x="540" y="100" font-size="15" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) = 0.5<tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> − <tspan font-style="italic">x</tspan></text><text x="540" y="140" font-size="14" text-anchor="start" fill="#1F2A28">At x = 2.5 both tangent</text><text x="540" y="160" font-size="14" text-anchor="start" fill="#1F2A28">lines have slope 1.5.</text><text x="540" y="200" font-size="14" text-anchor="start" fill="#1F2A28">A constant moves the</text><text x="540" y="220" font-size="14" text-anchor="start" fill="#1F2A28">graph up; it does not</text><text x="540" y="240" font-size="14" text-anchor="start" fill="#1F2A28">tilt it. So</text><text x="540" y="268" font-size="15" text-anchor="start" fill="#1F2A28" font-weight="bold">(<tspan font-style="italic">f</tspan> + 3)′ = <tspan font-style="italic">f</tspan> ′</text>
