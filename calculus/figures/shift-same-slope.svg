<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A constant shifts a graph without changing its slopes</title>
<desc id="d">The parabola y = f(x) = 0.5x squared minus x, and the same curve shifted up 3 units, y = f(x) + 3. At x = 2.5 each curve has a dashed tangent line; the two tangent lines are parallel, both with slope 1.5. Adding a constant changes heights but no slopes, so the derivative of f + 3 is f prime.</desc>
