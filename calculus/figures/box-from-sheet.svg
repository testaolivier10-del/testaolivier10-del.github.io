<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="box-from-sheet-t box-from-sheet-d" font-family="Arial, Helvetica, sans-serif">
<title id="box-from-sheet-t">An open box folded from a square sheet, and its volume function</title>
<desc id="box-from-sheet-d">Left: a 12-inch by 12-inch sheet with a square of side x shaded at each corner and dashed fold lines; folding up the sides gives an open box of height x and base 12 - 2x by 12 - 2x. Right: the graph of V(x) = x(12 - 2x) squared for 0 ≤ x ≤ 6, zero at both ends, highest at (2, 128): the largest box holds 128 cubic inches.</desc>
