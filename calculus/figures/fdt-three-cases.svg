<title id="fdt-three-cases-t">The First Derivative Test: what the sign of f′ does at a critical point decides</title>
<desc id="fdt-three-cases-d">Three graphs, each with a critical point at x = c where f'(c) = 0. Left: f' changes from positive to negative, the graph rises then falls, a relative maximum. Middle: f' changes from negative to positive, the graph falls then rises, a relative minimum. Right: f' is positive on both sides, the graph rises through a flat point, no relative extremum.</desc>
