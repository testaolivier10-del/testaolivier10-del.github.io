<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An implicitly defined curve and its tangent line at (1, 2)</title>
<desc id="d">The tilted ellipse x squared plus x y plus y squared equals 7, drawn in crimson on axes from minus 4 to 4. A dashed vertical line x = 1 meets the curve at (1, 2) and at (1, minus 3), so y is not a function of x. The blue tangent line at (1, 2) has slope minus 4/5, found by implicit differentiation: dy/dx = minus (2x + y) divided by (x + 2y).</desc>
