<text x="490" y="70" font-size="17" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> + <tspan font-style="italic">xy</tspan> + <tspan font-style="italic">y</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> = 7</text><text x="490" y="100" font-size="13" text-anchor="start" fill="#5A6563">The line <tspan font-style="italic">x</tspan> = 1 meets the curve</text><text x="490" y="118" font-size="13" text-anchor="start" fill="#5A6563">twice, so <tspan font-style="italic">y</tspan> is not a function of <tspan font-style="italic">x</tspan>.</text><text x="490" y="160" font-size="14" text-anchor="start" fill="#1F2A28" font-weight="bold">Differentiate both sides:</text><text x="490" y="184" font-size="14" text-anchor="start" fill="#1F2A28">2<tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan> + <tspan font-style="italic">x</tspan><tspan font-style="italic">y</tspan>′ + 2<tspan font-style="italic">y</tspan><tspan font-style="italic">y</tspan>′ = 0</text><text x="490" y="214" font-size="14" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">y</tspan>′ = −(2<tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan>) / (<tspan font-style="italic">x</tspan> + 2<tspan font-style="italic">y</tspan>)</text><text x="490" y="256" font-size="14" text-anchor="start" fill="#1F2A28" font-weight="bold">At (1, 2):</text><text x="490" y="280" font-size="14" text-anchor="start" fill="#0072B2"><tspan font-style="italic">y</tspan>′ = −4/5, the slope of the</text><text x="490" y="298" font-size="14" text-anchor="start" fill="#0072B2">blue tangent line</text>
