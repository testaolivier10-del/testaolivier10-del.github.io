<title id="t">Estimating a derivative from a table</title>
<desc id="d">Five measured temperatures B(t) of a cooling loaf of bread, in degrees Fahrenheit, at t = 0, 4, 10, 14 and 20 minutes: 180, 152, 121, 105 and 88. A dashed secant line joins the points at t = 10 and t = 14, which sit on either side of t = 12. Its slope, (105 minus 121) over (14 minus 10), equals minus 4 degrees Fahrenheit per minute, the estimate of B prime of 12.</desc>
