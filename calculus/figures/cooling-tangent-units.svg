<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The derivative of temperature has units of degrees per minute</title>
<desc id="d">The temperature T(t) = 20 + 60 e to the minus t/20 of a cooling drink, in degrees Celsius, for t from 0 to 60 minutes (crimson curve). A blue tangent line touches the curve at (10, 56.4). A slope triangle on the line runs 10 minutes and drops 18.2 degrees, so the slope T prime of 10 is about minus 1.82 degrees Celsius per minute: units of the output per unit of the input.</desc>
