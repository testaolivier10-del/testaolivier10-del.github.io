<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An inverted cone tank: similar triangles relate r and h</title>
<desc id="d">An inverted cone tank 6 feet deep with a top radius of 3 feet, point down, with water poured in from above. The water is a smaller cone of depth h and surface radius r, shaded blue. Similar triangles give r/h = 3/6, so r = h/2, and the volume of water is V = one third pi r squared h = pi h cubed over 12. Differentiating with respect to time gives dV/dt = (pi h squared over 4) times dh/dt.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<ellipse cx="220" cy="60" rx="120" ry="18" fill="none" stroke="#1F2A28" stroke-width="2"/><path d="M 180 273.3333333333333 L 220 380 L 260 273.3333333333333 Z" fill="#CFE3F2"/><ellipse cx="220" cy="273.3333333333333" rx="40" ry="6" fill="#B5D3EA" stroke="#0072B2" stroke-width="2"/><line x1="100" y1="60" x2="220" y2="380" stroke="#1F2A28" stroke-width="2.4"/><line x1="340" y1="60" x2="220" y2="380" stroke="#1F2A28" stroke-width="2.4"/><line x1="220" y1="60" x2="340" y2="60" stroke="#5A6563" stroke-width="1.4" stroke-dasharray="4 3"/><text x="280" y="36" font-size="14" text-anchor="middle" fill="#1F2A28" font-weight="bold">3 ft</text><line x1="220" y1="60" x2="220" y2="380" stroke="#5A6563" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="70" y1="60" x2="70" y2="380" stroke="#1F2A28" stroke-width="1.3"/><text x="62" y="220" font-size="14" text-anchor="end" fill="#1F2A28" font-weight="bold">6 ft</text><line x1="220" y1="273.3333333333333" x2="260" y2="273.3333333333333" stroke="#8C1036" stroke-width="2"/><text x="240" y="265.3333333333333" font-size="16" text-anchor="middle" fill="#8C1036" font-weight="bold"><tspan font-style="italic">r</tspan></text><line x1="234" y1="273.3333333333333" x2="234" y2="380" stroke="#8C1036" stroke-width="2"/><text x="240" y="336.66666666666663" font-size="16" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">h</tspan></text><line x1="180" y1="10" x2="206.86" y2="48.61" stroke="#0072B2" stroke-width="2.4"/><polygon points="212,56 203.54,50.92 210.19,46.3" fill="#0072B2"/><text x="176" y="18" font-size="13" text-anchor="end" fill="#0072B2">water poured in</text><text x="420" y="80" font-size="14" text-anchor="start" fill="#5A6563">Similar triangles:</text><text x="420" y="106" font-size="16" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">r</tspan>/<tspan font-style="italic">h</tspan> = 3/6, so <tspan font-style="italic">r</tspan> = <tspan font-style="italic">h</tspan>/2</text><text x="420" y="146" font-size="14" text-anchor="start" fill="#5A6563">Volume of water:</text><text x="420" y="172" font-size="16" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">V</tspan> = (1/3)π<tspan font-style="italic">r</tspan><tspan baseline-shift="super" font-size="70%">2</tspan><tspan font-style="italic">h</tspan> = π<tspan font-style="italic">h</tspan><tspan baseline-shift="super" font-size="70%">3</tspan>/12</text><text x="420" y="212" font-size="15" text-anchor="start" fill="#8C1036" font-weight="bold">Then <tspan font-style="italic">dV</tspan>/<tspan font-style="italic">dt</tspan> = (π<tspan font-style="italic">h</tspan><tspan baseline-shift="super" font-size="70%">2</tspan>/4) · <tspan font-style="italic">dh</tspan>/<tspan font-style="italic">dt</tspan></text><text x="420" y="252" font-size="13" text-anchor="start" fill="#1F2A28">Replace <tspan font-style="italic">r</tspan> before differentiating, so</text><text x="420" y="270" font-size="13" text-anchor="start" fill="#1F2A28">only one changing length is left.</text>
</svg>
