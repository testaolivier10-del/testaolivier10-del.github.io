<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="implicit-tangents-t implicit-tangents-d" font-family="Arial, Helvetica, sans-serif">
<title id="implicit-tangents-t">Horizontal and vertical tangent lines on an implicitly defined curve</title>
<desc id="implicit-tangents-d">The tilted oval x squared plus xy plus y squared = 3. Implicit differentiation gives dy/dx = -(2x + y)/(x + 2y). Blue horizontal tangent lines touch the curve at (-1, 2) and (1, -2), where the numerator 2x + y is zero. Green vertical tangent lines touch it at (-2, 1) and (2, -1), where the denominator x + 2y is zero and the numerator is not.</desc>
