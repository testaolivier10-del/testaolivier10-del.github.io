<text x="530" y="70" font-size="16" fill="#8C1036" font-weight="bold"><tspan font-style="italic">x</tspan>² + <tspan font-style="italic">xy</tspan> + <tspan font-style="italic">y</tspan>² = 3</text>
<text x="530" y="110" font-size="13.5" fill="#1F2A28">Differentiate both sides with respect to x:</text>
<text x="530" y="132" font-size="14" fill="#1F2A28">2<tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan> + <tspan font-style="italic">x</tspan><tspan font-style="italic">y</tspan>′ + 2<tspan font-style="italic">y</tspan><tspan font-style="italic">y</tspan>′ = 0</text>
<text x="530" y="160" font-size="14" fill="#1F2A28"><tspan font-style="italic">dy</tspan>/<tspan font-style="italic">dx</tspan> = −(2<tspan font-style="italic">x</tspan> + <tspan font-style="italic">y</tspan>) / (<tspan font-style="italic">x</tspan> + 2<tspan font-style="italic">y</tspan>)</text>
<line x1="530" y1="190" x2="560" y2="190" stroke="#0072B2" stroke-width="2.4" stroke-linecap="round"/>
<text x="568" y="195" font-size="13.5" fill="#0072B2" font-weight="bold">numerator 2x + y = 0 (and on the curve):</text>
<text x="568" y="214" font-size="13.5" fill="#0072B2">the tangent line is horizontal</text>
<line x1="545" y1="240" x2="545" y2="270" stroke="#009E73" stroke-width="2.4" stroke-linecap="round"/>
<text x="568" y="252" font-size="13.5" fill="#009E73" font-weight="bold">denominator x + 2y = 0, numerator not 0</text>
<text x="568" y="271" font-size="13.5" fill="#009E73">(and on the curve): the tangent line is vertical</text>
<text x="530" y="310" font-size="13.5" fill="#5A6268">Each condition gives a line through the origin;</text>
<text x="530" y="328" font-size="13.5" fill="#5A6268">substitute it into the curve to find the points.</text>
