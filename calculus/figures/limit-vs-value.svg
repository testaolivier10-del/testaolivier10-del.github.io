<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="limit-vs-value-t limit-vs-value-d" font-family="Arial, Helvetica, sans-serif">
<title id="limit-vs-value-t">A limit is not the same as a value</title>
<desc id="limit-vs-value-d">A crimson curve y = g(x) rises toward an open circle at (2, 4) from both sides, with arrows showing the outputs heading to 4. The function value at x = 2 is a separate filled dot at (2, 1). So the limit of g(x) as x approaches 2 is 4, while g(2) = 1.</desc>
