<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-labelledby="limit-three-views-t limit-three-views-d" font-family="Arial, Helvetica, sans-serif">
<title id="limit-three-views-t">One limit read from a graph, a table and a formula</title>
<desc id="limit-three-views-d">Three panels for f(x) = (x² − x − 2)/(x − 2). The graph is the line y = x + 1 with an open circle at (2, 3) because f(2) is undefined. The table shows x = 1.9, 1.99, 1.999 giving 2.9, 2.99, 2.999 and x = 2.001, 2.01, 2.1 giving 3.001, 3.01, 3.1. The formula factors as (x − 2)(x + 1)/(x − 2) = x + 1 for x not 2. All three give a limit of 3 as x approaches 2.</desc>
