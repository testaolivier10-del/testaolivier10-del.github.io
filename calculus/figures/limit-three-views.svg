<text x="650" y="174" font-size="13.5" fill="#1F2A28" text-anchor="middle">= <tspan font-style="italic">x</tspan> + 1, for <tspan font-style="italic">x</tspan> ≠ 2</text>
<text x="650" y="216" font-size="13.5" fill="#1F2A28" text-anchor="middle">Substitute 2 into <tspan font-style="italic">x</tspan> + 1:</text>
<text x="650" y="246" font-size="15" fill="#8C1036" text-anchor="middle" font-weight="bold">lim = 2 + 1 = 3</text>
<line x1="520" y1="44" x2="520" y2="320" stroke="#C9CFCC" stroke-width="1"/>
<line x1="268" y1="44" x2="268" y2="320" stroke="#C9CFCC" stroke-width="1"/>
<text x="390" y="346" font-size="13.5" fill="#1F2A28" text-anchor="middle" font-weight="bold">Every representation gives the same answer: the limit of <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) as <tspan font-style="italic">x</tspan> approaches 2 is 3.</text>
