<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An expanding ripple: the rates of r and A are related</title>
<desc id="d">A circular ripple on water seen from above: two earlier, smaller ripples dashed and the current ripple solid, with its radius r drawn and an arrow showing dr/dt, the rate at which the radius grows. Beside it: the relation A = pi r squared, differentiated with respect to time t to give dA/dt = 2 pi r times dr/dt. Example: with r = 5 cm and dr/dt = 3 cm per second, dA/dt = 30 pi square centimeters per second.</desc>
<rect width="800" height="460" fill="#FFFFFF"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="#E3EEF7"/><circle cx="230" cy="230" r="40" fill="none" stroke="#0072B2" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 5"/><circle cx="230" cy="230" r="80" fill="none" stroke="#0072B2" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 5"/><circle cx="230" cy="230" r="130" fill="none" stroke="#8C1036" stroke-width="3.2" stroke-opacity="1"/><circle cx="230" cy="230" r="4" fill="#1F2A28"/><line x1="230" y1="230" x2="344.08573304574844" y2="167.6746799814536" stroke="#1F2A28" stroke-width="2"/><text x="282" y="192" font-size="18" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">r</tspan></text><line x1="344.09" y1="167.67" x2="376.56" y2="149.94" stroke="#8C1036" stroke-width="2.6"/><polygon points="384.45,145.62 378.5,153.49 374.61,146.38" fill="#8C1036"/><text x="396.08573304574844" y="141.6746799814536" font-size="16" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">dr</tspan>/<tspan font-style="italic">dt</tspan></text><text x="230" y="410" font-size="13" text-anchor="middle" fill="#5A6563">earlier ripples (dashed) and now (solid)</text><text x="470" y="70" font-size="15" text-anchor="start" fill="#1F2A28" font-weight="bold">Both <tspan font-style="italic">r</tspan> and <tspan font-style="italic">A</tspan> depend on time <tspan font-style="italic">t</tspan>.</text><text x="470" y="110" font-size="14" text-anchor="start" fill="#5A6563">The relation:</text><text x="470" y="134" font-size="17" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">A</tspan> = π<tspan font-style="italic">r</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="470" y="180" font-size="14" text-anchor="start" fill="#5A6563">Differentiate with respect to <tspan font-style="italic">t</tspan>:</text><text x="470" y="206" font-size="17" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">dA</tspan>/<tspan font-style="italic">dt</tspan> = 2π<tspan font-style="italic">r</tspan> · <tspan font-style="italic">dr</tspan>/<tspan font-style="italic">dt</tspan></text><text x="470" y="248" font-size="13" text-anchor="start" fill="#1F2A28">The chain rule puts in <tspan font-style="italic">dr</tspan>/<tspan font-style="italic">dt</tspan>,</text><text x="470" y="266" font-size="13" text-anchor="start" fill="#1F2A28">because <tspan font-style="italic">r</tspan> is a function of <tspan font-style="italic">t</tspan>.</text><text x="470" y="310" font-size="13" text-anchor="start" fill="#1F2A28">Example: <tspan font-style="italic">r</tspan> = 5 cm, <tspan font-style="italic">dr</tspan>/<tspan font-style="italic">dt</tspan> = 3 cm/s</text><text x="470" y="332" font-size="14" text-anchor="start" fill="#8C1036" font-weight="bold"><tspan font-style="italic">dA</tspan>/<tspan font-style="italic">dt</tspan> = 2π(5)(3) = 30π cm<tspan baseline-shift="super" font-size="70%">2</tspan>/s</text><text x="470" y="374" font-size="13" text-anchor="start" fill="#5A6563">The area grows faster as the</text><text x="470" y="392" font-size="13" text-anchor="start" fill="#5A6563">ripple gets bigger, even at a</text><text x="470" y="410" font-size="13" text-anchor="start" fill="#5A6563">steady <tspan font-style="italic">dr</tspan>/<tspan font-style="italic">dt</tspan>.</text>
</svg>
