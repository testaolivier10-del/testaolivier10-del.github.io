<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="integration-flowchart-t integration-flowchart-d">
<title id="integration-flowchart-t">A decision path for choosing an antidifferentiation technique</title>
<desc id="integration-flowchart-d">A flowchart of four questions asked in order, each with a yes arrow to a technique. 1: Is it a basic form, or a sum of basic forms after rewriting powers? Yes: basic rules (power, ln absolute x, e to the x, sine, cosine, secant squared, 1 over 1 + x squared). No: 2: Is there an inside function u whose derivative is also a factor? Yes: substitution, with du and new limits. No: 3: Is it rational with the top degree at least the bottom degree? Yes: long division first. No: 4: Is there a quadratic on the bottom with no real zeros? Yes: complete the square, then arctan. If none fits, rewrite the integrand and start again.</desc>
<rect width="760" height="560" fill="#fff"/>
<text x="380" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold"><tspan >Choosing a technique: ask the questions in order</tspan></text>
<rect x="40" y="60" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="91.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >1. Is it a basic form, or a sum of</tspan></text><text x="205" y="110.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >basic forms after rewriting powers?</tspan></text>
<rect x="450" y="60" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="91.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Basic rules: power, ln|x|, eˣ,</tspan></text><text x="590" y="110.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >sin, cos, sec², 1/(1 + x²)</tspan></text>
<line x1="370" y1="96" x2="441" y2="96" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,96 441,100.5 441,91.5" fill="#1F2A28"/><text x="410" y="89" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="132" x2="205" y2="171" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,180 200.5,171 209.5,171" fill="#1F2A28"/><text x="213" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="180" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="211.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >2. Is there an inside function u</tspan></text><text x="205" y="230.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >whose derivative is also a factor?</tspan></text>
<rect x="450" y="180" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="211.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Substitution: let u = inside,</tspan></text><text x="590" y="230.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >du = u′ dx; change the limits</tspan></text>
<line x1="370" y1="216" x2="441" y2="216" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,216 441,220.5 441,211.5" fill="#1F2A28"/><text x="410" y="209" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="252" x2="205" y2="291" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,300 200.5,291 209.5,291" fill="#1F2A28"/><text x="213" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="300" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="331.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >3. Rational, and the top has degree</tspan></text><text x="205" y="350.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >≥ the bottom’s degree?</tspan></text>
<rect x="450" y="300" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="331.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Long division first, then</tspan></text><text x="590" y="350.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >basic rules or substitution</tspan></text>
<line x1="370" y1="336" x2="441" y2="336" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,336 441,340.5 441,331.5" fill="#1F2A28"/><text x="410" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="372" x2="205" y2="411" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,420 200.5,411 209.5,411" fill="#1F2A28"/><text x="213" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="420" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="451.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >4. A quadratic on the bottom</tspan></text><text x="205" y="470.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >with no real zeros?</tspan></text>
<rect x="450" y="420" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="451.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Complete the square, then</tspan></text><text x="590" y="470.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >arctan (with substitution)</tspan></text>
<line x1="370" y1="456" x2="441" y2="456" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,456 441,460.5 441,451.5" fill="#1F2A28"/><text x="410" y="449" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<text x="205" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >If none fits, rewrite the integrand (expand, split a fraction, use an identity) and start again.</tspan></text>
</svg>
