<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-labelledby="pen-river-diagram-t pen-river-diagram-d" font-family="Arial, Helvetica, sans-serif">
<title id="pen-river-diagram-t">A two-part pen against a river</title>
<desc id="pen-river-diagram-d">A rectangular pen against a straight river, divided into two parts by a middle fence parallel to the ends. The two ends and the divider each have length x; the side opposite the river has length y. No fence is needed along the river.</desc>
<rect width="420" height="330" fill="#FFFFFF"/>
<rect x="60" y="34" width="300" height="40" rx="0" fill="#D6EAF5"/><path d="M70 54 q 12 -8 24 0 t 24 0" fill="none" stroke="#0072B2" stroke-width="1.6"/><path d="M126 54 q 12 -8 24 0 t 24 0" fill="none" stroke="#0072B2" stroke-width="1.6"/><path d="M182 54 q 12 -8 24 0 t 24 0" fill="none" stroke="#0072B2" stroke-width="1.6"/><path d="M238 54 q 12 -8 24 0 t 24 0" fill="none" stroke="#0072B2" stroke-width="1.6"/><path d="M294 54 q 12 -8 24 0 t 24 0" fill="none" stroke="#0072B2" stroke-width="1.6"/><text x="210" y="28" font-size="14" fill="#0072B2" text-anchor="middle">river (no fence)</text><rect x="80" y="80" width="260" height="150" rx="0" fill="#F3EEDF"/><line x1="80" y1="80" x2="80" y2="230" stroke="#8C1036" stroke-width="4" stroke-linecap="round"/><line x1="340" y1="80" x2="340" y2="230" stroke="#8C1036" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="230" x2="340" y2="230" stroke="#8C1036" stroke-width="4" stroke-linecap="round"/><line x1="210" y1="80" x2="210" y2="230" stroke="#8C1036" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="80" x2="340" y2="80" stroke="#5A6268" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/><text x="70" y="160" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan font-style="italic">x</tspan></text><text x="220" y="160" font-size="17" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">x</tspan></text><text x="350" y="160" font-size="17" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">x</tspan></text><text x="210" y="254" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold"><tspan font-style="italic">y</tspan></text><text x="210" y="300" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="bold">Total fence: 600 feet</text>
</svg>
