<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A ladder sliding down a wall: a related rates problem</title>
<desc id="d">A 10-foot ladder (crimson) leans against a vertical wall. Its foot is x = 6 feet from the wall and its top is y = 8 feet up. The foot slides away at dx/dt = 2 feet per second (blue arrow) and the top slides down at an unknown rate dy/dt (vermillion arrow). The angle theta between the ladder and the floor is marked. A faint grey ladder shows a later position, farther out and lower. Beside it: x squared + y squared = 100, differentiated to 2x dx/dt + 2y dy/dt = 0; substituting x = 6, y = 8 and dx/dt = 2 gives dy/dt = minus 3/2 feet per second.</desc>
<rect width="820" height="460" fill="#FFFFFF"/>
<rect x="80" y="40" width="30" height="340" fill="#D9D4CA" stroke="#1F2A28" stroke-width="1.5"/><line x1="80" y1="380" x2="446" y2="380" stroke="#1F2A28" stroke-width="2.4"/><line x1="86" y1="381" x2="77" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="102" y1="381" x2="93" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="118" y1="381" x2="109" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="134" y1="381" x2="125" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="150" y1="381" x2="141" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="166" y1="381" x2="157" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="182" y1="381" x2="173" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="198" y1="381" x2="189" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="214" y1="381" x2="205" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="230" y1="381" x2="221" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="246" y1="381" x2="237" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="262" y1="381" x2="253" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="278" y1="381" x2="269" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="294" y1="381" x2="285" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="310" y1="381" x2="301" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="326" y1="381" x2="317" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="342" y1="381" x2="333" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="358" y1="381" x2="349" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="374" y1="381" x2="365" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="390" y1="381" x2="381" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="406" y1="381" x2="397" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="422" y1="381" x2="413" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="438" y1="381" x2="429" y2="391" stroke="#8A8F8C" stroke-width="1.3"/><line x1="110" y1="151.4742902866288" x2="334" y2="380" stroke="#5A6563" stroke-width="6" stroke-opacity="0.35" stroke-linecap="round"/><line x1="110" y1="124" x2="302" y2="380" stroke="#8C1036" stroke-width="7" stroke-linecap="round"/><text x="222" y="246" font-size="16" text-anchor="start" fill="#8C1036" font-weight="bold">10 ft</text><line x1="110" y1="414" x2="302" y2="414" stroke="#1F2A28" stroke-width="1.4"/><line x1="110" y1="408" x2="110" y2="420" stroke="#1F2A28"/><line x1="302" y1="408" x2="302" y2="420" stroke="#1F2A28"/><text x="206" y="438" font-size="15" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">x</tspan> = 6 ft</text><line x1="60" y1="380" x2="60" y2="124" stroke="#1F2A28" stroke-width="1.4"/><line x1="54" y1="380" x2="66" y2="380" stroke="#1F2A28"/><line x1="54" y1="124" x2="66" y2="124" stroke="#1F2A28"/><text x="52" y="257" font-size="15" text-anchor="end" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">y</tspan> = 8 ft</text><line x1="308" y1="362" x2="359" y2="362" stroke="#0072B2" stroke-width="2.6"/><polygon points="368,362 359,366.05 359,357.95" fill="#0072B2"/><text x="374" y="367" font-size="15" text-anchor="start" fill="#0072B2" font-weight="bold"><tspan font-style="italic">dx</tspan>/<tspan font-style="italic">dt</tspan> = 2 ft/s</text><line x1="128" y1="120" x2="128" y2="171" stroke="#D55E00" stroke-width="2.6"/><polygon points="128,180 123.95,171 132.05,171" fill="#D55E00"/><text x="156" y="158" font-size="15" text-anchor="start" fill="#D55E00" font-weight="bold"><tspan font-style="italic">dy</tspan>/<tspan font-style="italic">dt</tspan> = ?</text><path d="M 268 380 A 34 34 0 0 1 281.6 352.8" fill="none" stroke="#1F2A28" stroke-width="1.5"/><text x="256" y="370" font-size="16" text-anchor="start" fill="#1F2A28" font-style="italic">θ</text><text x="520" y="70" font-size="14" text-anchor="start" fill="#5A6563">The relation (Pythagoras):</text><text x="520" y="96" font-size="17" text-anchor="start" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> + <tspan font-style="italic">y</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> = 100</text><text x="520" y="136" font-size="14" text-anchor="start" fill="#5A6563">Differentiate with respect to <tspan font-style="italic">t</tspan>:</text><text x="520" y="162" font-size="16" text-anchor="start" fill="#1F2A28" font-weight="bold">2<tspan font-style="italic">x</tspan> <tspan font-style="italic">dx</tspan>/<tspan font-style="italic">dt</tspan> + 2<tspan font-style="italic">y</tspan> <tspan font-style="italic">dy</tspan>/<tspan font-style="italic">dt</tspan> = 0</text><text x="520" y="202" font-size="14" text-anchor="start" fill="#5A6563">Only now substitute the moment:</text><text x="520" y="228" font-size="15" text-anchor="start" fill="#1F2A28">2(6)(2) + 2(8) <tspan font-style="italic">dy</tspan>/<tspan font-style="italic">dt</tspan> = 0</text><text x="520" y="256" font-size="17" text-anchor="start" fill="#D55E00" font-weight="bold"><tspan font-style="italic">dy</tspan>/<tspan font-style="italic">dt</tspan> = −3/2 ft/s</text><text x="520" y="296" font-size="13" text-anchor="start" fill="#1F2A28">The top slides down at 1.5 ft/s.</text><text x="520" y="330" font-size="13" text-anchor="start" fill="#5A6563">Grey: the ladder a moment later.</text>
</svg>
