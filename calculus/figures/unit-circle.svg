<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-labelledby="unit-circle-t unit-circle-d" font-family="Arial, Helvetica, sans-serif">
<title id="unit-circle-t">The unit circle</title>
<desc id="unit-circle-d">A circle of radius 1 centered at the origin. Points on it are marked at the angles 0, pi/6, pi/4, pi/3 and pi/2 radians with coordinates (1, 0), (square root 3 over 2, 1/2), (square root 2 over 2, square root 2 over 2), (1/2, square root 3 over 2) and (0, 1), and at pi and 3 pi/2 with coordinates (-1, 0) and (0, -1). The other quadrants are labelled with the signs of sine and cosine: second quadrant sine positive, cosine negative; third both negative; fourth sine negative, cosine positive. A panel says the point at angle theta is (cos theta, sin theta), and that pi radians is 180 degrees.</desc>
<defs></defs>
<rect width="840" height="560" fill="#FFFFFF"/>
<line x1="43.8" y1="285" x2="562.5" y2="285" stroke="#1F2A28" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="541.2" x2="300" y2="28.8" stroke="#1F2A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="300" cy="285" r="210" fill="none" stroke="#1F2A28" stroke-width="2.4"/><text x="562.5" y="275" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan font-style="italic">x</tspan></text><text x="308" y="33" font-size="16" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">y</tspan></text><circle cx="510" cy="285" r="5.5" fill="#8C1036"/><text x="522" y="309" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(1, 0)</tspan></text><line x1="300" y1="285" x2="481.9" y2="180" stroke="#9AA4A1" stroke-width="1.3" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="481.9" cy="180" r="5.5" fill="#8C1036"/><text x="493.9" y="176" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(√3/2, 1/2)</tspan></text><text x="451.5" y="205" font-size="14" fill="#0072B2" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >π/6</tspan></text><line x1="300" y1="285" x2="448.5" y2="136.5" stroke="#9AA4A1" stroke-width="1.3" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="448.5" cy="136.5" r="5.5" fill="#8C1036"/><text x="460.5" y="132.5" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(√2/2, √2/2)</tspan></text><text x="424.8" y="170.2" font-size="14" fill="#0072B2" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >π/4</tspan></text><line x1="300" y1="285" x2="405" y2="103.1" stroke="#9AA4A1" stroke-width="1.3" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="405" cy="103.1" r="5.5" fill="#8C1036"/><text x="417" y="99.1" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(1/2, √3/2)</tspan></text><text x="390" y="143.5" font-size="14" fill="#0072B2" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >π/3</tspan></text><circle cx="300" cy="75" r="5.5" fill="#8C1036"/><text x="310" y="65" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(0, 1)</tspan></text><circle cx="90" cy="285" r="5.5" fill="#8C1036"/><text x="82" y="275" font-size="14.5" fill="#8C1036" text-anchor="end" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(−1, 0)  π</tspan></text><circle cx="300" cy="495" r="5.5" fill="#8C1036"/><text x="310" y="517" font-size="14.5" fill="#8C1036" font-weight="bold" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"><tspan >(0, −1)  3π/2</tspan></text><text x="290" y="65" font-size="14" fill="#0072B2" text-anchor="end" font-weight="bold"><tspan >π/2</tspan></text><text x="522" y="329" font-size="14" fill="#0072B2" font-weight="bold"><tspan >0 or 2π</tspan></text><text x="379.8" y="274.5" font-size="14" fill="#5B6663"><tspan >sin +, cos +</tspan></text><text x="184.5" y="180" font-size="14" fill="#5B6663" text-anchor="middle"><tspan >sin +, cos −</tspan></text><text x="184.5" y="390" font-size="14" fill="#5B6663" text-anchor="middle"><tspan >sin −, cos −</tspan></text><text x="415.5" y="390" font-size="14" fill="#5B6663" text-anchor="middle"><tspan >sin −, cos +</tspan></text><rect x="620" y="40" width="206" height="230" rx="6" fill="#F5F7F6" stroke="#E4E8E6" stroke-width="1.2"/><text x="634" y="70" font-size="15" fill="#8C1036"><tspan font-weight="bold">On the unit circle</tspan></text><text x="634" y="100" font-size="14" fill="#1F2A28"><tspan >The point at angle θ is</tspan></text><text x="634" y="124" font-size="15" fill="#1F2A28" font-weight="bold"><tspan >(cos θ, sin θ).</tspan></text><text x="634" y="158" font-size="14" fill="#1F2A28"><tspan >cos θ = the </tspan><tspan font-style="italic">x</tspan><tspan >-coordinate</tspan></text><text x="634" y="182" font-size="14" fill="#1F2A28"><tspan >sin θ = the </tspan><tspan font-style="italic">y</tspan><tspan >-coordinate</tspan></text><text x="634" y="214" font-size="14" fill="#1F2A28"><tspan >tan θ = sin θ / cos θ</tspan></text><text x="634" y="246" font-size="13" fill="#5B6663"><tspan >radius 1, angles in radians</tspan></text><rect x="620" y="300" width="206" height="120" rx="6" fill="#E3F0F8" stroke="#E4E8E6" stroke-width="1.2"/><text x="634" y="328" font-size="14" fill="#1F2A28"><tspan font-weight="bold">Half the circle</tspan><tspan > is π radians</tspan></text><text x="634" y="352" font-size="14" fill="#1F2A28"><tspan >(180°). A full turn is 2π.</tspan></text><text x="634" y="384" font-size="14" fill="#1F2A28"><tspan >Degrees to radians:</tspan></text><text x="634" y="406" font-size="14" fill="#1F2A28" font-weight="bold"><tspan >multiply by π/180.</tspan></text>
</svg>
