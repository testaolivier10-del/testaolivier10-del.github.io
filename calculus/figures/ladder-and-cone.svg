<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 440" width="830" height="440" role="img" aria-labelledby="ladder-and-cone-t ladder-and-cone-d" font-family="Arial, Helvetica, sans-serif">
<title id="ladder-and-cone-t">A ladder and a cone tank</title>
<desc id="ladder-and-cone-d">Left: a 10-foot ladder leans against a wall, its foot x = 6 feet from the wall and its top y = 8 feet up, a right triangle with x squared + y squared = 10 squared. Right: a cone-shaped tank, point down, 10 feet tall with top radius 4 feet, holds water to depth h with surface radius r. The small triangle of water and the whole cone are similar, so r over h = 4 over 10 and r = 0.4h.</desc>
<defs></defs>
<rect width="830" height="440" fill="#FFFFFF"/>
