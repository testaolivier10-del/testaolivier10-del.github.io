48" y2="380" stroke="#9AA4A1" stroke-width="1" stroke-linecap="round"/><line x1="270" y1="371" x2="262" y2="380" stroke="#9AA4A1" stroke-width="1" stroke-linecap="round"/><line x1="284" y1="371" x2="276" y2="380" stroke="#9AA4A1" stroke-width="1" stroke-linecap="round"/><line x1="298" y1="371" x2="290" y2="380" stroke="#9AA4A1" stroke-width="1" stroke-linecap="round"/><line x1="120" y1="370" x2="300" y2="130" stroke="#D55E00" stroke-width="7" stroke-linecap="round"/><line x1="120" y1="370" x2="300" y2="130" stroke="#F2B48A" stroke-width="2" stroke-linecap="round"/><rect x="286" y="356" width="14" height="14" fill="none" stroke="#1F2A28" stroke-width="1.5"/><line x1="120" y1="396" x2="290" y2="396" stroke="#0072B2" stroke-width="2"/><polygon points="300,396 290,401 290,391" fill="#0072B2"/><line x1="300" y1="396" x2="130" y2="396" stroke="#0072B2" stroke-width="2"/><polygon points="120,396 130,391 130,401" fill="#0072B2"/><text x="210" y="420" font-size="15" fill="#0072B2" text-anchor="middle" font-weight="bold"><tspan font-style="italic">x</tspan><tspan > = 6 ft</tspan></text><line x1="334" y1="370" x2="334" y2="140" stroke="#0072B2" stroke-width="2"/><polygon points="334,130 339,140 329,140" fill="#0072B2"/><line x1="334" y1="130" x2="334" y2="360" stroke="#0072B2" stroke-width="2"/><polygon points="334,370 329,360 339,360" fill="#0072B2"/><text x="342" y="250" font-size="15" fill="#0072B2" font-weight="bold"><tspan font-style="italic">y</tspan><tspan > = 8 ft</tspan></text><text x="188" y="242" font-size="16" fill="#D55E00" text-anchor="end" font-weight="bold"><tspan >10 ft</tspan></text><text x="60" y="110" font-size="17" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">x</tspan><tspan dy="-7.1" font-size="12.2">2</tspan><tspan dy="7.1"> + </tspan><tspan font-style="italic">y</tspan><tspan dy="-7.1" font-size="12.2">2</tspan><tspan dy="7.1"> = 10</tspan><tspan dy="-7.1" font-size="12.2">2</tspan><tspan dy="7.1">​</tspan></text><text x="60" y="136" fon