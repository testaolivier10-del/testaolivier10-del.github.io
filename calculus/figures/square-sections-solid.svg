stroke"><tspan font-style="italic">s</tspan></text><text x="576" y="174" font-size="15" fill="#1F2A28" text-anchor="end" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">s</tspan></text><text x="534" y="262" font-size="13.5" fill="#1F2A28" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">side = height of the base</text><text x="534" y="284" font-size="14" fill="#0072B2" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">s</tspan>(<tspan font-style="italic">x</tspan>) = 4 − <tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="534" y="310" font-size="14" fill="#1F2A28" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">A</tspan>(<tspan font-style="italic">x</tspan>) = <tspan font-style="italic">s</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> = (4 − <tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="534" y="340" font-size="13.5" fill="#1F2A28" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">V</tspan> = ∫ from −2 to 2 of <tspan font-style="italic">A</tspan>(<tspan font-style="italic">x</tspan>) d<tspan font-style="italic">x</tspan></text><text x="534" y="366" font-size="16" fill="#1F2A28" font-weight="bold" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">= 512/15 ≈ 34.13</text><text x="534" y="394" font-size="12.5" fill="#5A6268" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">Square the side, then integrate.</text></svg>
