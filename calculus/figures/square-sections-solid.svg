<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif"><title id="t">A solid with square cross sections on the region under y = 4 − x²</title><desc id="d">In 3D, the base region under the parabola y = 4 − x² from x = −2 to 2 lies flat on the floor. Square slices stand on it, each perpendicular to the x-axis with one side across the base, so a slice at x has side s = 4 − x²; the squares are tallest at x = 0 and shrink to nothing at x = ±2. One slice of small thickness is highlighted in blue with its side s labeled. A side panel shows the flat square of side s, its area A(x) = s² = (4 − x²)², and the volume, the integral from −2 to 2 of A(x) dx = 512/15, about 34.13.</desc><rect width="760" height="460" fill="#FFFFFF"/><line x1="301.2" y1="191.3" x2="27.2" y2="388.5" stroke="#1F2A28" stroke-width="1.5" stroke-linecap="round"/><polygon points="23.3,391.3 26.8,384 31.3,390.3" fill="#1F2A28"/><text x="29.3" y="395.3" font-size="15" fill="#1F2A28" text-anchor="start" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">x</tspan></text><line x1="146.2" y1="265.1" x2="470.5" y2="417.2" stroke="#1F2A28" stroke-width="1.5" stroke-linecap="round"/><polygon points="474.8,419.2 466.8,419.8 470.1,412.8" fill="#1F2A28"/><text x="480.8" y="417.2" font-size="15" fill="#1F2A28" text-anchor="start" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">y</tspan></text><polygon points="261.4,220 267,224 272.5,228.1 278,232.1 283.3,236.1 288.6,240 293.7,243.9 298.8,247.8 303.7,251.6 308.6,255.4 313.3,259.2 318,262.9 322.5,266.5 327,270.2 331.3,273.8 335.5,277.3 339.7,280.8 343.7,284.3 347.6,287.7 351.4,291 355,294.4 358.6,297.6 362.1,300.9 365.4,304.1 368.6,307.2 371.7,310.3 374.7,313.3 377.6,316.3 380.4,319.3 383,322.2 385.5,325 387.9,327.8 390.2,330.6 392.4,333.3 394.4,335