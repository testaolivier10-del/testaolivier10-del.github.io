<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The chain rule: the inside function 2x doubles every slope</title>
<desc id="d">Graphs of y = sin x (blue, dashed) and y = sin(2x) (crimson) for x from minus pi to pi. Both pass through the origin. The tangent line to sin x at the origin has slope 1; the tangent line to sin(2x) there has slope 2, because the inside function 2x squeezes the graph sideways by a factor of 2. The derivative of sin(2x) is cos(2x) times 2.</desc>
