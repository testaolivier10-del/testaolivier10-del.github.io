<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Choosing a differentiation rule from the last operation</title>
<desc id="d">A decision diagram. At the top: what is the last operation? Four branches: a sum or difference (differentiate each term, as in x cubed minus 4 cos x), a product (product rule u prime v plus u v prime, as in x squared sin 3x), a quotient (quotient rule or rewrite with a power, as in e to the 2x over x + 1), and a function of a function (chain rule f prime of g of x times g prime of x, as in (x e to the x) cubed). Below: repeat inside each piece; use implicit differentiation for equations in x and y, and the inverse rule for inverses; rewrite first when it helps.</desc>
<rect width="800" height="430" fill="#FFFFFF"/>
<rect x="250" y="24" width="300" height="70" rx="12" fill="#F6E3E9" stroke="#8C1036" stroke-width="2.4"/><text x="400" y="52" font-size="17" text-anchor="middle" fill="#8C1036" font-weight="bold">What is the last operation?</text><text x="400" y="76" font-size="13" text-anchor="middle" fill="#5A6563">(the one you would do last to evaluate it)</text><line x1="400" y1="96" x2="120.86" y2="146.4" stroke="#5A6563" stroke-width="1.8"/><polygon points="112,148 120.14,142.42 121.58,150.39" fill="#5A6563"/><rect x="20" y="152" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.4"/><text x="112" y="178" font-size="15" text-anchor="middle" fill="#1F2A28" font-weight="bold">Sum or difference</text><text x="112" y="202" font-size="13" text-anchor="middle" fill="#1F2A28">Differentiate each</text><text x="112" y="222" font-size="13" text-anchor="middle" fill="#1F2A28">term separately</text><text x="112" y="242" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">3</tspan> − 4 cos <tspan font-style="italic">x</tspan></text><line x1="400" y1="96" x2="311.91" y2="143.71" stroke="#5A6563" stroke-width="1.8"/><polygon points="304,148 309.98,140.15 313.84,147.27" fill="#5A6563"/><rect x="212" y="152" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.4"/><text x="304" y="178" font-size="15" text-anchor="middle" fill="#0072B2" font-weight="bold">Product</text><text x="304" y="202" font-size="13" text-anchor="middle" fill="#1F2A28">Product rule:</text><text x="304" y="222" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">u</tspan>′<tspan font-style="italic">v</tspan> + <tspan font-style="italic">u</tspan><tspan font-style="italic">v</tspan>′</text><text x="304" y="242" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> sin(3<tspan font-style="italic">x</tspan>)</text><line x1="400" y1="96" x2="488.09" y2="143.71" stroke="#5A6563" stroke-width="1.8"/><polygon points="496,148 486.16,147.27 490.02,140.15" fill="#5A6563"/><rect x="404" y="152" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.4"/><text x="496" y="178" font-size="15" text-anchor="middle" fill="#009E73" font-weight="bold">Quotient</text><text x="496" y="202" font-size="13" text-anchor="middle" fill="#1F2A28">Quotient rule, or</text><text x="496" y="222" font-size="13" text-anchor="middle" fill="#1F2A28">rewrite with a power</text><text x="496" y="242" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="70%">2<tspan font-style="italic">x</tspan></tspan> / (<tspan font-style="italic">x</tspan> + 1)</text><line x1="400" y1="96" x2="679.14" y2="146.4" stroke="#5A6563" stroke-width="1.8"/><polygon points="688,148 678.42,150.39 679.86,142.42" fill="#5A6563"/><rect x="596" y="152" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#8C1036" stroke-width="2.4"/><text x="688" y="178" font-size="15" text-anchor="middle" fill="#8C1036" font-weight="bold">Function of a function</text><text x="688" y="202" font-size="13" text-anchor="middle" fill="#1F2A28">Chain rule:</text><text x="688" y="222" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">f</tspan>′(<tspan font-style="italic">g</tspan>(<tspan font-style="italic">x</tspan>)) · <tspan font-style="italic">g</tspan>′(<tspan font-style="italic">x</tspan>)</text><text x="688" y="242" font-size="13" text-anchor="middle" fill="#1F2A28">(<tspan font-style="italic">x</tspan><tspan font-style="italic">e</tspan><tspan baseline-shift="super" font-size="70%"><tspan font-style="italic">x</tspan></tspan>)<tspan baseline-shift="super" font-size="70%">3</tspan></text><rect x="20" y="300" width="760" height="112" rx="12" fill="#F7F7F5" stroke="#E4E7E6" stroke-width="1.5"/><text x="40" y="328" font-size="15" text-anchor="start" fill="#1F2A28" font-weight="bold">Then repeat inside each piece.</text><text x="40" y="352" font-size="13" text-anchor="start" fill="#1F2A28">Example: <tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> sin(3<tspan font-style="italic">x</tspan>) is a product, so start with the product rule; the factor sin(3<tspan font-style="italic">x</tspan>) then needs the chain rule.</text><text x="40" y="376" font-size="13" text-anchor="start" fill="#1F2A28">Equations in <tspan font-style="italic">x</tspan> and <tspan font-style="italic">y</tspan> together: implicit differentiation. An inverse of a known function: 1/<tspan font-style="italic">f</tspan>′(<tspan font-style="italic">g</tspan>(<tspan font-style="italic">a</tspan>)).</text><text x="40" y="400" font-size="13" text-anchor="start" fill="#5A6563">Rewrite first when it helps: 5/<tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">3</tspan> = 5<tspan font-style="italic">x</tspan><tspan baseline-shift="super" font-size="70%">−3</tspan> needs only the power rule.</text>
</svg>
