<g font-family="Arial, Helvetica, sans-serif"><rect x="163.6" y="356" width="24.8" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="177" y="371" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">−2</text><rect x="193.6" y="240" width="24.8" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="207" y="255" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">−1</text><rect x="197.8" y="180" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="207" y="195" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">0</text><rect x="251.6" y="356" width="24.8" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="265" y="371" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">−1</text><rect x="285.8" y="240" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="295" y="255" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">0</text><rect x="285.8" y="180" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="295" y="195" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">1</text><rect x="373.8" y="356" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="383" y="371" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">0</text><rect x="343.8" y="240" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="353" y="255" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">1</text><rect x="373.8" y="180" width="16.4" height="21" fill="#fff" fill-opacity="0.92" rx="3"/><text x="383" y="195" font-size="14" text-anchor="middle" fill="#8C1036" font-weight="bold">2</text></g><text x="536" y="70" font-size="18" text-anchor="start" fill="#8C1036" font-weight="bold">dy/dx = x + y</text><text x="536" y="100" font-size="13" text-anchor="start" fill="#1F2A28">At each point, compute x + y</text><text x="536" y="118" font-size="13" text-anchor="start" fill="#1F2A28">and draw a short segment</text><text x="536" y="136" font-size="13" text-anchor="start" fill="#1F2A28">with that slope.</text><text x="536" y="170" font-size="13" text-anchor="start" fill="#8C1036">Crimson numbers: the slope</text><text x="536" y="188" font-size="13" text-anchor="start" fill="#8C1036">at the nine boxed points.</text><text x="536" y="222" font-size="13" text-anchor="start" fill="#1F2A28">Slope 0 on the line y = −x</text><text x="536" y="240" font-size="13" text-anchor="start" fill="#1F2A28">(horizontal segments).</text><text x="536" y="274" font-size="13" text-anchor="start" fill="#1F2A28">Same x + y, same slope:</text><text x="536" y="292" font-size="13" text-anchor="start" fill="#1F2A28">segments are parallel along</text><text x="536" y="310" font-size="13" text-anchor="start" fill="#1F2A28">each line x + y = constant.</text>
