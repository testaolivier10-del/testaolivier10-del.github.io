<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="candidates-check-t candidates-check-d" font-family="Arial, Helvetica, sans-serif">
<title id="candidates-check-t">The Candidates Test on a closed interval</title>
<desc id="candidates-check-d">The graph of f(x) = 2x cubed minus 9x squared plus 12x on the closed interval from 0 to 3, with four candidates marked: the endpoints (0, 0) and (3, 9) and the critical points (1, 5) and (2, 4). A table lists the four values. The largest, 9 at x = 3, is the absolute maximum; the smallest, 0 at x = 0, is the absolute minimum. The relative maximum at (1, 5) and relative minimum at (2, 4) are not absolute.</desc>
