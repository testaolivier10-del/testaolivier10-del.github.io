<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The product rule as a growing rectangle</title>
<desc id="d">A rectangle with width f and height g has area f times g. When x changes a little, the width grows by delta f and the height by delta g. The new area adds a strip g delta f on the right, a strip f delta g along the bottom, and a tiny corner delta f delta g. Dividing by delta x and letting delta x go to 0 makes the corner vanish, which gives (fg) prime = f prime g + f g prime.</desc>
<rect width="800" height="340" fill="#FFFFFF"/>
<rect x="70" y="60" width="300" height="200" fill="#F3F5F4" stroke="#1F2A28" stroke-width="2"/><rect x="370" y="60" width="70" height="200" fill="#FBE3EA" stroke="#8C1036" stroke-width="2"/><rect x="70" y="260" width="300" height="50" fill="#DCEBF6" stroke="#0072B2" stroke-width="2"/><rect x="370" y="260" width="70" height="50" fill="#E9ECEB" stroke="#5A6563" stroke-width="1.5" stroke-dasharray="4 3"/><text x="220" y="166" font-size="22" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">f</tspan> · <tspan font-style="italic">g</tspan></text><text x="220" y="190" font-size="14" text-anchor="middle" fill="#5A6563">old area</text><text x="405" y="166" font-size="16" text-anchor="middle" fill="#8C1036" font-weight="bold"><tspan font-style="italic">g</tspan>Δ<tspan font-style="italic">f</tspan></text><text x="220" y="291" font-size="16" text-anchor="middle" fill="#0072B2" font-weight="bold"><tspan font-style="italic">f</tspan>Δ<tspan font-style="italic">g</tspan></text><text x="405" y="290" font-size="12" text-anchor="middle" fill="#5A6563">Δ<tspan font-style="italic">f</tspan>Δ<tspan font-style="italic">g</tspan></text><line x1="70" y1="42" x2="370" y2="42" stroke="#1F2A28" stroke-width="1.3"/><text x="220" y="35" font-size="15" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">f</tspan></text><line x1="370" y1="42" x2="440" y2="42" stroke="#8C1036" stroke-width="1.3"/><text x="405" y="35" font-size="15" text-anchor="middle" fill="#8C1036">Δ<tspan font-style="italic">f</tspan></text><line x1="52" y1="60" x2="52" y2="260" stroke="#1F2A28" stroke-width="1.3"/><text x="0" y="0" font-size="15" text-anchor="middle" fill="#1F2A28"></text><text x="44" y="165" font-size="15" text-anchor="end" fill="#1F2A28"><tspan font-style="italic">g</tspan></text><line x1="52" y1="260" x2="52" y2="310" stroke="#0072B2" stroke-width="1.3"/><text x="0" y="0" font-size="15" text-anchor="middle" fill="#0072B2"></text><text x="44" y="290" font-size="15" text-anchor="end" fill="#0072B2">Δ<tspan font-style="italic">g</tspan></text><text x="500" y="90" font-size="15" text-anchor="start" fill="#1F2A28" font-weight="bold">Change in area:</text><text x="500" y="118" font-size="14" text-anchor="start" fill="#1F2A28">Δ(<tspan font-style="italic">fg</tspan>) = <tspan font-style="italic">g</tspan>Δ<tspan font-style="italic">f</tspan> + <tspan font-style="italic">f</tspan>Δ<tspan font-style="italic">g</tspan> + Δ<tspan font-style="italic">f</tspan>Δ<tspan font-style="italic">g</tspan></text><text x="500" y="156" font-size="14" text-anchor="start" fill="#1F2A28">Divide by Δ<tspan font-style="italic">x</tspan> and let Δ<tspan font-style="italic">x</tspan> → 0.</text><text x="500" y="178" font-size="14" text-anchor="start" fill="#1F2A28">The tiny corner piece vanishes:</text><text x="500" y="216" font-size="18" text-anchor="start" fill="#1F2A28" font-weight="bold">(<tspan font-style="italic">fg</tspan>)′ = <tspan font-style="italic">f</tspan> ′<tspan font-style="italic">g</tspan> + <tspan font-style="italic">f</tspan><tspan font-style="italic">g</tspan> ′</text><text x="500" y="256" font-size="13" text-anchor="start" fill="#5A6563">Two strips, not one corner: the</text><text x="500" y="274" font-size="13" text-anchor="start" fill="#5A6563">rule is not <tspan font-style="italic">f</tspan> ′ · <tspan font-style="italic">g</tspan> ′.</text>
</svg>
