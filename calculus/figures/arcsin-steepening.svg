<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The slope of arcsin x grows near the ends of its domain</title>
<desc id="d">The graph of y = arcsin x for x from minus 1 to 1, rising from (minus 1, minus pi/2) to (1, pi/2), with closed endpoints. The tangent line at the origin has slope 1; the tangent line at x = 0.8 has slope 1 over 0.6, which is 5/3. The derivative 1 over the square root of 1 minus x squared grows without bound as x approaches 1 or minus 1.</desc>
