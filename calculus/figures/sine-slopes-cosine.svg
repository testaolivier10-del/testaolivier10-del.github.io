<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The slopes of sine are the values of cosine</title>
<desc id="d">Top: y = sin x from 0 to 2 pi with short tangent segments at 0, pi/2, pi, 3pi/2 and 2pi, whose slopes are 1, 0, minus 1, 0 and 1. Bottom, on the same scale: y = cos x, whose heights at those x values are 1, 0, minus 1, 0 and 1. The derivative of sin x is cos x.</desc>
