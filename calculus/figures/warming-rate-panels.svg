<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A quantity and its rate of change, each with its units</title>
<desc id="d">Top: the temperature H(t) = 70 minus 50 e to the minus 0.1 t of a drink, in degrees Fahrenheit, for t from 0 to 40 minutes; at t = 10 it is about 51.6 degrees, with a dashed tangent line. Bottom: its rate of change H prime of t = 5 e to the minus 0.1 t, in degrees Fahrenheit per minute; at t = 10 it is about 1.84 degrees per minute, equal to the slope of the tangent line above. The rate is positive but shrinking.</desc>
