<text x="540" y="70" font-size="16" text-anchor="start" fill="#1F2A28" font-weight="bold">A cold drink warming up</text><text x="540" y="100" font-size="14" text-anchor="start" fill="#8C1036"><tspan font-style="italic">H</tspan>(<tspan font-style="italic">t</tspan>): temperature, °F</text><text x="540" y="120" font-size="14" text-anchor="start" fill="#5A6563"><tspan font-style="italic">t</tspan>: minutes</text><text x="540" y="160" font-size="13" text-anchor="start" fill="#1F2A28">At 10 minutes it is 51.6 °F</text><text x="540" y="310" font-size="14" text-anchor="start" fill="#0072B2"><tspan font-style="italic">H</tspan>′(<tspan font-style="italic">t</tspan>): rate of change,</text><text x="540" y="330" font-size="14" text-anchor="start" fill="#0072B2" font-weight="bold">°F per minute</text><text x="540" y="370" font-size="13" text-anchor="start" fill="#1F2A28">At 10 minutes it is warming</text><text x="540" y="388" font-size="13" text-anchor="start" fill="#1F2A28">at 1.84 °F per minute; the</text><text x="540" y="406" font-size="13" text-anchor="start" fill="#1F2A28">rate itself is shrinking.</text>
