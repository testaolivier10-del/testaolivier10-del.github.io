<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-labelledby="box-sheet-16x10-t box-sheet-16x10-d" font-family="Arial, Helvetica, sans-serif">
<title id="box-sheet-16x10-t">A 16-inch by 10-inch sheet with corner squares cut out</title>
<desc id="box-sheet-16x10-d">A rectangular sheet 16 inches wide and 10 inches tall. A square of side x is cut from each corner and the sides are folded up along the dashed lines to make an open box of height x with a base 16 - 2x by 10 - 2x inches.</desc>
<rect width="420" height="330" fill="#FFFFFF"/>
<polygon points="120,60 300,60 300,90 330,90 330,180 300,180 300,210 120,210 120,180 90,180 90,90 120,90" fill="#F3EEDF" stroke="#1F2A28" stroke-width="2"/><rect x="90" y="60" width="30" height="30" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="300" y="60" width="30" height="30" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="90" y="180" width="30" height="30" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="300" y="180" width="30" height="30" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="120" y="90" width="180" height="90" rx="0" fill="none" stroke="#5A6268" stroke-width="1.4" stroke-dasharray="7 5"/><text x="105" y="81" font-size="16" fill="#D55E00" text-anchor="middle" font-weight="bold"><tspan font-style="italic">x</tspan></text><text x="210" y="50" font-size="14.5" fill="#1F2A28" text-anchor="middle">16 in</text><text x="80" y="140" font-size="14.5" fill="#1F2A28" text-anchor="end">10 in</text><text x="210" y="131" font-size="14" fill="#5A6268" text-anchor="middle">base: (16 − 2<tspan font-style="italic">x</tspan>)</text><text x="210" y="151" font-size="14" fill="#5A6268" text-anchor="middle">by (10 − 2<tspan font-style="italic">x</tspan>)</text><text x="210" y="250" font-size="14" fill="#1F2A28" text-anchor="middle">Fold up the sides to a height of <tspan font-style="italic">x</tspan>.</text>
</svg>
