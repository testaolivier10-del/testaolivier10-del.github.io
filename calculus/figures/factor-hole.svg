<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="factor-hole-t factor-hole-d" font-family="Arial, Helvetica, sans-serif">
<title id="factor-hole-t">A rational function that is a line with a hole</title>
<desc id="factor-hole-d">The graph of y = (x squared minus 9) divided by (x minus 3) is the straight line y = x + 3 with an open circle at (3, 6), because the function is undefined at x = 3. A panel shows the algebra: factor x squared minus 9 as (x - 3)(x + 3), cancel x - 3 for x not equal to 3, and get x + 3, so the limit at x = 3 is 6.</desc>
