<text x="650" y="233" font-size="13.5" fill="#1F2A28"><tspan font-style="italic">f</tspan>′(<tspan font-style="italic">c</tspan>) = [<tspan font-style="italic">f</tspan>(4) − <tspan font-style="italic">f</tspan>(0)] / (4 − 0)</text>
