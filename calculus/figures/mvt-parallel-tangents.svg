<title id="mvt-parallel-tangents-t">The Mean Value Theorem: tangent lines parallel to the secant line</title>
<desc id="mvt-parallel-tangents-d">The graph of f(x) = x cubed minus 6x squared plus 9x plus 1 on the closed interval from 0 to 4, from (0, 1) to (4, 5). A dashed secant line joins the endpoints with slope 1. Two blue tangent lines, at x = c1 ≈ 0.85 and x = c2 ≈ 3.15, are parallel to the secant: at both points the derivative equals the average rate of change, 1.</desc>
