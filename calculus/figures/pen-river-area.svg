<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="pen-river-area-t pen-river-area-d" font-family="Arial, Helvetica, sans-serif">
<title id="pen-river-area-t">Turning a fencing problem into a function to maximize</title>
<desc id="pen-river-area-d">Left: a rectangular pen against a straight river, split in two by a middle fence. The three fences perpendicular to the river each have length x; the side parallel to the river has length y; the river side needs no fence, so 3x + y = 600 feet and the area is A = xy. Right: the graph of A(x) = x(600 - 3x) for 0 ≤ x ≤ 200, zero at both ends, with its highest point at (100, 30000): the largest area is 30,000 square feet.</desc>
