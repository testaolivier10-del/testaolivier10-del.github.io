der="stroke">= ½ · <tspan font-style="italic">s</tspan> · (√3/2)<tspan font-style="italic">s</tspan> = (√3/4)<tspan font-style="italic">s</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text><text x="514" y="310" font-size="13.5" fill="#1F2A28" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">V</tspan> = ∫ from 0 to 4 of (√3/4)(√<tspan font-style="italic">x</tspan>)<tspan baseline-shift="super" font-size="70%">2</tspan> d<tspan font-style="italic">x</tspan></text><text x="514" y="336" font-size="16" fill="#1F2A28" font-weight="bold" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">= (√3/4) · 8 = 2√3 ≈ 3.46</text><text x="514" y="370" font-size="12.5" fill="#5A6268" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">Squares on the same base: 8.</text><text x="514" y="388" font-size="12.5" fill="#5A6268" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">Triangles keep √3/4 ≈ 0.433 of that.</text></svg>
