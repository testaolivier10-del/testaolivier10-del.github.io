<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="rationalize-hole-t rationalize-hole-d" font-family="Arial, Helvetica, sans-serif">
<title id="rationalize-hole-t">Rationalizing reveals the hidden value</title>
<desc id="rationalize-hole-d">The graph of y = (square root of x minus 2) divided by (x minus 4), for x from 0 to 12, starts at the filled point (0, 0.5) and falls slowly, with an open circle at (4, 1/4) where the function is undefined. A panel shows the algebra: multiply top and bottom by the conjugate, square root of x plus 2; the top becomes x minus 4, which cancels, leaving 1 over (square root of x plus 2), whose value at x = 4 is 1/4.</desc>
