<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" width="400" height="404" role="img" aria-labelledby="exponent-ladder-t exponent-ladder-d" font-family="Arial, Helvetica, sans-serif">
<title id="exponent-ladder-t">Powers of 2 from 2 cubed down to 2 to the negative 3</title>
<desc id="exponent-ladder-d">A column of seven boxes: 2 to the 3 = 8, 2 to the 2 = 4, 2 to the 1 = 2, 2 to the 0 = 1, 2 to the negative 1 = 1/2, 2 to the negative 2 = 1/4, 2 to the negative 3 = 1/8. An arrow marked divide by 2 leads from each box to the next one down: lowering the exponent by 1 divides the value by 2. The pattern passes through 2 to the 0 = 1 and continues into fractions, which are all positive.</desc>
<defs></defs>
<rect width="400" height="404" fill="#FFFFFF"/>
<text x="200" y="26" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="bold"><tspan >Down one step: exponent − 1, value ÷ 2</tspan></text><rect x="24" y="45" width="236" height="34" rx="6" fill="#F5F7F6" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="68" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">3</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="68" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="68" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >8</tspan></text><line x1="290" y1="66" x2="290" y2="93" stroke="#0072B2" stroke-width="2"/><polygon points="290,102 285.5,93 294.5,93" fill="#0072B2"/><text x="304" y="90" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="91" width="236" height="34" rx="6" fill="#F5F7F6" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="114" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">2</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="114" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="114" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >4</tspan></text><line x1="290" y1="112" x2="290" y2="139" stroke="#0072B2" stroke-width="2"/><polygon points="290,148 285.5,139 294.5,139" fill="#0072B2"/><text x="304" y="136" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="137" width="236" height="34" rx="6" fill="#F5F7F6" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="160" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">1</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="160" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="160" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >2</tspan></text><line x1="290" y1="158" x2="290" y2="185" stroke="#0072B2" stroke-width="2"/><polygon points="290,194 285.5,185 294.5,185" fill="#0072B2"/><text x="304" y="182" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="183" width="236" height="34" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.8"/><text x="88" y="206" font-size="17" fill="#8C1036" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">0</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="206" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="206" font-size="17" fill="#8C1036" font-weight="bold"><tspan >1</tspan></text><line x1="290" y1="204" x2="290" y2="231" stroke="#0072B2" stroke-width="2"/><polygon points="290,240 285.5,231 294.5,231" fill="#0072B2"/><text x="304" y="228" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="229" width="236" height="34" rx="6" fill="#E3F0F8" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="252" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">−1</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="252" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="252" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >1/2</tspan></text><line x1="290" y1="250" x2="290" y2="277" stroke="#0072B2" stroke-width="2"/><polygon points="290,286 285.5,277 294.5,277" fill="#0072B2"/><text x="304" y="274" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="275" width="236" height="34" rx="6" fill="#E3F0F8" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="298" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">−2</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="298" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="298" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >1/4 = 1/2</tspan><tspan dy="-7.1" font-size="12.2">2</tspan><tspan dy="7.1">​</tspan></text><line x1="290" y1="296" x2="290" y2="323" stroke="#0072B2" stroke-width="2"/><polygon points="290,332 285.5,323 294.5,323" fill="#0072B2"/><text x="304" y="320" font-size="15" fill="#0072B2" font-weight="bold"><tspan >÷ 2</tspan></text><rect x="24" y="321" width="236" height="34" rx="6" fill="#E3F0F8" stroke="#9AA4A1" stroke-width="1.2"/><text x="88" y="344" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="bold"><tspan >2</tspan><tspan dy="-7.1" font-size="12.2">−3</tspan><tspan dy="7.1">​</tspan></text><text x="104" y="344" font-size="17" fill="#1F2A28" text-anchor="middle"><tspan >=</tspan></text><text x="122" y="344" font-size="17" fill="#1F2A28" font-weight="bold"><tspan >1/8 = 1/2</tspan><tspan dy="-7.1" font-size="12.2">3</tspan><tspan dy="7.1">​</tspan></text><text x="24" y="390" font-size="14" fill="#5B6663" font-weight="bold"><tspan >Negative exponents give small positive numbers.</tspan></text>
</svg>
