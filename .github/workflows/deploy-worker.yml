# Deploys the Cloudflare Worker (worker/) with wrangler, so the rate-limit
# binding, the cron and keep_vars in worker/wrangler.toml are what actually
# runs. A dashboard paste has none of the bindings, which is how the
# assistant ended up with no per-IP throttle.
#
# Since the Premium vault (docs/premium-vault.md) it also builds and deploys
# the site itself: scripts/build-deploy.mjs splits the repo into dist/site (the
# public site, Premium lessons replaced by stubs) and dist/vault (the Premium
# lessons). The vault goes up with the API Worker as its private assets; the
# site goes to the levlprep-site Worker. So it runs on every push to main,
# since any lesson change changes the vault.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page
# Worker secrets (SUPABASE_SERVICE_KEY, POLAR_*, RESEND_API_KEY, VAPID_PRIVATE_KEY)
# stay in Cloudflare and are not touched by a deploy.
name: Deploy Worker and site

on:
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: Tell Bing about every page in the sitemap (first run), not only the changed ones
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/build-worker.mjs --check
      - run: node --test scripts/test/worker-*.test.mjs
      - name: Build the public site and the vault
        run: node scripts/build-deploy.mjs
      # The API Worker first, with the vault, so a new stub never asks for a page the vault lacks.
      - name: wrangler deploy (API Worker and vault)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy
      - name: wrangler deploy (site)
        working-directory: worker/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy
      # Bing and the other IndexNow engines hear which pages changed (scripts/indexnow.mjs).
      # Never fails the deploy: the site is already live at this point.
      - name: IndexNow (changed pages)
        continue-on-error: true
        run: node scripts/indexnow.mjs ${{ inputs.indexnow_all && '--all' || '' }}
