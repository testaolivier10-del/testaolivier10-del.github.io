# Weekly check of the nightly database backup (docs/backups.md). The backup itself runs in the
# Cloudflare Worker (worker/src/backup.js), which already holds the database key, so no database
# password is stored anywhere. This job downloads the newest complete backup from the private KV
# namespace and proves it is whole (scripts/backup/check.mjs). GitHub emails the owner if it fails.
# Uses only the Cloudflare secrets the Worker deploy already has.
name: Backup check

on:
  schedule:
    - cron: '43 16 * * 1'   # Mondays, 08:43 Pacific (09:43 in summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the newest backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup/check.mjs
