name: Site checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing here writes to the repository (site audit 2026-10).
# Actions are pinned to a commit SHA, so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  check-links-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-site.mjs

  metadata:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because build-sitemap.mjs reads each page's last commit
      # date out of git history; a shallow clone has none.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Both of these are generated from the pages themselves, so the failure
      # they catch is the same one: a page was added and the derived files
      # were not rebuilt. Neither can drift silently now.
      - name: Open Graph tags are present on every page
        run: node scripts/build-og-tags.mjs --check
      - name: sitemap.xml lists every page
        run: node scripts/build-sitemap.mjs --check
      # The Worker address and every page's CSP come from one place,
      # scripts/lib/site-config.mjs.
      - name: Worker address and CSP match scripts/lib/site-config.mjs
        run: node scripts/build-site-config.mjs --check
      # The course list lives in assets/courses.js. The browser scripts carry
      # generated copies of it; the Worker, the SQL and the per-course content
      # tables cannot, so they are compared with it instead. Adding a course
      # to the registry fails here, naming every place still to do.
      - name: course lists match the registry (assets/courses.js)
        run: |
          node scripts/build-courses.mjs --check
          node scripts/check-courses.mjs --check
      # Prices, the free/Premium wording, bank counts in the purchase dialog,
      # the manifests and premium.html come from assets/premium.js and the data.
      - name: prices, counts and free/Premium copy match premium.js and the data
        run: node scripts/build-pricing.mjs --check
      # The ochem prose is one file per section, and each of those files is
      # both the source learn.html fetches AND a page you can open. The shell
      # around the prose, and learn.html's static contents, are generated from
      # the curriculum — so an added or renamed topic that was not rebuilt
      # would leave a section with the wrong title, or missing from the only
      # contents list a reader without JavaScript can see.
      - name: the ochem section pages match the curriculum
        run: node scripts/build-notes-pages.mjs --check
      # The ochem glossary page and the JSON behind its popups are generated
      # from ochem/data/glossary.json; the check also rejects a term filed under
      # a topic that does not exist, a spelling claimed by two terms, and a
      # "see also" that points at nothing.
      - name: the ochem glossary matches its source
        run: node scripts/build-ochem-glossary.mjs --check
      # Same for NREMT: nremt/data/glossary.json is the source of the glossary
      # page and the JSON the popups, search and tutor read; the check also
      # rejects a link to a study-notes section that does not exist and a term
      # with no NREMT domain.
      - name: the NREMT glossary matches its source
        run: node scripts/build-nremt-glossary.mjs --check
      # The course map's two silent failure modes: a topic that is a dead link,
      # and a mastery percentage that overstates how much of the course has
      # actually been measured. Neither breaks a page, so nothing else here
      # would catch either one — they just mislead a student.
      - name: no dead topics, and mastery cannot overstate coverage
        run: node scripts/check-curriculum.mjs --check
      # The A&P course's one rule: nothing is used before it is taught. The
      # dependency map is checked for concepts that lean on later topics, and
      # every A&P page for tagged terms whose topic comes after it, outside a
      # marked preview box. Neither mistake breaks a page; both lose a student
      # who entered mid-course.
      - name: the A&P course uses no concept before it is taught
        run: node scripts/check-anp-map.mjs --check
      # Every A&P page, the question bank and the glossary are generated from
      # anatomy-physiology/data by build-anp.mjs; a data edit without a rebuild
      # would ship a page that disagrees with its source.
      - name: the A&P pages match their data
        run: node scripts/build-anp.mjs --check
      # The authored A&P data against its formats and rules: question counts and
      # types, explanations for every option, figure licenses, the "receptor"
      # rule, links that route, and each tool's content against its validator.
      # (The OpenStax figure catalog lives outside the repo, so CI checks the
      # license fields; the catalog cross-check runs where authors work.)
      - name: the A&P content follows its rules
        run: node scripts/check-anp-content.mjs --check
      # The AP Biology course keeps the A&P rule: nothing is used before it is
      # taught. Units follow the CED order; each skills topic sits after the
      # topic it is anchored to (docs/apbio-dependency-map.json).
      - name: the AP Biology course uses no concept before it is taught
        run: node scripts/check-apbio-map.mjs --check
      # The AP Biology course is generated from bio/data and its course map by
      # build-apbio.mjs, like A&P; a data edit without a rebuild would ship a
      # page that disagrees with its source.
      - name: the AP Biology pages match their data
        run: node scripts/build-apbio.mjs --check
      # The authored AP Biology data against its formats: unit, topic and
      # science practice on every item, an explanation per option, stimulus
      # sets of 4-5, the apply/analyze share, length tells, the test-wise
      # balance, numeric answers, FRQ rubrics, figure licenses and the AP®
      # trademark wording. Only published units fail the build; the rest print.
      - name: the AP Biology content follows its rules
        run: node scripts/check-apbio-content.mjs --check
      # The ochem homepage lists the chapters twice (the path of nodes and the
      # JSON-LD syllabus). Both are generated from curriculum.js; a stale copy
      # would show a reader, and a search engine, the wrong course.
      - name: the ochem homepage's chapter list matches the curriculum
        run: node scripts/build-ochem-home.mjs --check
      # A lesson's title is its topic's name and its chapter's name, both of
      # which live in curriculum.js — so it is generated, not retyped. Retyped,
      # it drifted twice: 121 lessons shipped the same title as their notes
      # page, and the two disagreed with the rail about how a topic is
      # capitalised.
      - name: the ochem lesson titles match the curriculum
        run: node scripts/build-lesson-meta.mjs --check
      # The "Builds on" / "Leads to" rows under each lesson and mechanism are
      # the curriculum's dependsOn graph, read forwards and backwards. Typed
      # by hand they drifted into listing prerequisites as things a topic
      # leads to, which sends a student backwards through the course.
      - name: the ochem lessons' related-topic rows match the curriculum
        run: node scripts/build-leads-to.mjs --check
      # The visible breadcrumb row on NREMT and ochem pages is written from each
      # page's own BreadcrumbList JSON-LD, so the two never disagree.
      - name: NREMT and ochem breadcrumbs match their BreadcrumbList
        run: node scripts/build-crumbs.mjs --check
      # The seven tool pages are three empty divs until their scripts run. The
      # first screen is written into them from tools-registry.js so the page
      # has a heading and a body before that happens; stale, it would show a
      # renamed tool under its old name until the script landed.
      - name: the static shell on each ochem tool page matches the registry
        run: node scripts/build-tool-pages.mjs --check
      # Same fix, same reason, for the NREMT notes: 40 chapters that arrive
      # over the network, and a table of contents in the page so the URL is
      # not empty before they do.
      - name: the static contents in the NREMT notes match their data file
        run: node scripts/build-nremt-notes-toc.mjs --check
      # The generated textbook figures. These are drawn from coordinates, so a
      # stale one is not a broken build — it is a diagram that quietly says
      # something the prose next to it no longer says.
      - name: the generated ochem figures are up to date
        run: node scripts/build-ochem-figures.mjs --check
      # And the NREMT ones, which only became possible once the study notes
      # moved out of their page into a JSON file. Same failure mode: a stale
      # figure is a diagram quietly saying something the prose beside it no
      # longer says.
      - name: the generated notes figures are up to date
        run: node scripts/build-notes-figures.mjs --check
      # The flashcard deck is read out of the tables in the ochem notes. A
      # value corrected in a table and not rebuilt would leave the card
      # teaching the old number, which is the drift the deck was generated
      # to avoid; a table restructured under a rule fails the build outright.
      - name: the ochem flashcard deck matches the notes it is read from
        run: node scripts/build-flashcards.mjs --check
      # The NREMT deck is read out of the glossary, mnemonics and reference
      # cards, plus authored key facts tied to study-notes sections. A
      # definition corrected on the glossary and not rebuilt would leave its
      # card teaching the old one; a term added without a domain fails.
      - name: the NREMT flashcard deck matches the pages it is read from
        run: node scripts/build-nremt-flashcards.mjs --check
      # The two files practice.html actually fetches are generated from
      # questions.json. Editing a question without rebuilding them would ship
      # the edit to nobody, silently.
      - name: the split question bank matches questions.json
        run: node scripts/build-question-bank.mjs --check
      # The ochem bank ships as a core plus its explanations, so the two pages
      # that wait on it block only on what they need to ask a question. Editing
      # practice-bank.json without rebuilding would ship the edit to nobody.
      - name: the split ochem bank matches practice-bank.json
        run: node scripts/build-ochem-bank.mjs --check
      # And the assistant's teaching index, generated from the same source.
      - name: the tutor banks are in step with their sources
        run: |
          node scripts/build-tutor-bank.mjs
          git diff --exit-code -- nremt/assets/tutor-bank.json ochem/assets/tutor-bank.json
      # The single-file Worker, flattened from worker/src/ so it can be pasted
      # into Cloudflare's dashboard with nothing installed. Of everything
      # generated here this is the one where going stale means the WRONG CODE
      # RUNS IN PRODUCTION, rather than a missing tag or a broken link.
      - name: the pasteable Worker matches its source
        run: node scripts/build-worker.mjs --check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # The scoring engines: XP, levels, streaks, concept strength, decay and
      # the spaced-repetition schedule. No dependencies — node:test and a VM
      # context standing in for a browser (scripts/test/harness.mjs).
      - run: node --test scripts/test/*.test.mjs

  # Weight lives with the fast checks because it needs nothing to run: it reads
  # the files off disk and gzips them. No browser, no install, no network.
  page-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # What a page costs on arrival, against a number written down. The bank
      # split took the first question from 4467 ms to 2394 ms and the fonts
      # were pulled off a third-party CDN; nothing defended either afterwards.
      - run: node scripts/check-weight.mjs --check

  # Its own job because these are the only things here that need a browser.
  # Bolting them onto check-links-and-json would make the check people actually
  # wait for take a minute instead of seconds. Both browser checks share the
  # job so Chromium is installed once rather than twice.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # package.json and package-lock.json pin the two CI tools (playwright,
      # axe-core) exactly; the site itself still has no build step and no
      # runtime dependency, and nothing in node_modules is published.
      - name: install the checker
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      # axe-core over one page of every SHAPE the site has, plus the three
      # things axe cannot check because they are this site's own decisions:
      # the skip link actually landing somewhere focusable, and the main and
      # nav landmarks surviving the runtime-rendered header.
      - name: axe-core, and the site's own accessibility rules
        run: node scripts/check-a11y.mjs --check
      # Every other check here reads the files. This one runs them: a page that
      # parses, resolves and renders can still throw on load and be dead in
      # front of a student. errors.js already reports this class of bug — from
      # production, after somebody hit it. This asks before the commit lands.
      - name: every page loads without a runtime error
        run: node scripts/check-console.mjs --check
