name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-links-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-site.mjs

  metadata:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because build-sitemap.mjs reads each page's last commit
      # date out of git history; a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Both of these are generated from the pages themselves, so the failure
      # they catch is the same one: a page was added and the derived files
      # were not rebuilt. Neither can drift silently now.
      - name: Open Graph tags are present on every page
        run: node scripts/build-og-tags.mjs --check
      - name: sitemap.xml lists every page
        run: node scripts/build-sitemap.mjs --check
      # The ochem prose is one file per section, and each of those files is
      # both the source learn.html fetches AND a page you can open. The shell
      # around the prose, and learn.html's static contents, are generated from
      # the curriculum — so an added or renamed topic that was not rebuilt
      # would leave a section with the wrong title, or missing from the only
      # contents list a reader without JavaScript can see.
      - name: the ochem section pages match the curriculum
        run: node scripts/build-notes-pages.mjs --check
      # The two files practice.html actually fetches are generated from
      # questions.json. Editing a question without rebuilding them would ship
      # the edit to nobody, silently.
      - name: the split question bank matches questions.json
        run: node scripts/build-question-bank.mjs --check
      # And the assistant's teaching index, generated from the same source.
      - name: the tutor banks are in step with their sources
        run: |
          node scripts/build-tutor-bank.mjs
          git diff --exit-code -- nremt/assets/tutor-bank.json ochem/assets/tutor-bank.json
      # The single-file Worker, flattened from worker/src/ so it can be pasted
      # into Cloudflare's dashboard with nothing installed. Of everything
      # generated here this is the one where going stale means the WRONG CODE
      # RUNS IN PRODUCTION, rather than a missing tag or a broken link.
      - name: the pasteable Worker matches its source
        run: node scripts/build-worker.mjs --check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The scoring engines: XP, levels, streaks, concept strength, decay and
      # the spaced-repetition schedule. No dependencies — node:test and a VM
      # context standing in for a browser (scripts/test/harness.mjs).
      - run: node --test scripts/test/*.test.mjs

  # Weight lives with the fast checks because it needs nothing to run: it reads
  # the files off disk and gzips them. No browser, no install, no network.
  page-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # What a page costs on arrival, against a number written down. The bank
      # split took the first question from 4467 ms to 2394 ms and the fonts
      # were pulled off a third-party CDN; nothing defended either afterwards.
      - run: node scripts/check-weight.mjs --check

  # Its own job because these are the only things here that need a browser.
  # Bolting them onto check-links-and-json would make the check people actually
  # wait for take a minute instead of seconds. Both browser checks share the
  # job so Chromium is installed once rather than twice.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --no-save, so nothing is committed and the repo keeps having no
      # package.json — the no-build-step stack is the point, and this is a CI
      # tool rather than a dependency of the site.
      - name: install the checker
        run: |
          npm i --no-save playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      # axe-core over one page of every SHAPE the site has, plus the three
      # things axe cannot check because they are this site's own decisions:
      # the skip link actually landing somewhere focusable, and the main and
      # nav landmarks surviving the runtime-rendered header.
      - name: axe-core, and the site's own accessibility rules
        run: node scripts/check-a11y.mjs --check
      # Every other check here reads the files. This one runs them: a page that
      # parses, resolves and renders can still throw on load and be dead in
      # front of a student. errors.js already reports this class of bug — from
      # production, after somebody hit it. This asks before the commit lands.
      - name: every page loads without a runtime error
        run: node scripts/check-console.mjs --check
