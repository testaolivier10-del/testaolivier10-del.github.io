<style>
  .section-head{
    font:900 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px;
  }
  /* `.section-head` is centred, which suits the marketing home pages it was
     built for. On a dashboard it put a centred label above left-aligned cards,
     so the eye kept switching axis. Left-align it here only. */
  .xshell .section-head{text-align:left;}
  /* Concept map on the left; level, quests and badges stacked on the right. */
  .mastery-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0 36px;align-items:start;}
  .mastery-main,.mastery-side{min-width:0;}
  .mastery-side .game-grid{grid-template-columns:1fr;}
  .mastery-lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;align-items:start;}
  .mastery-lists .section-head{margin-top:26px;}
  .mastery-lists > div:has(> [hidden]){display:none;}
  .mastery-side .badge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  @media (max-width:900px){
    .mastery-grid,.mastery-lists{grid-template-columns:1fr;}
    .mastery-side{margin-top:26px;}
  }

  /* Width is the shell's job now — this page used to cap itself at 760px
     while Home and Tools ran the full shell, so the course changed width
     as you moved through it. */
  .overall-card{
    background:var(--navy);color:#fff;border-radius:22px;padding:28px clamp(20px,4vw,34px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;
  }
  .overall-card .big{font:900 44px var(--font-ui);}
  .overall-card .k{opacity:.75;font:800 12px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;}
  .rec-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px;}
  .rec-card{
    flex:1 1 220px;background:var(--white);border:var(--bw) solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--lift-sm);
  }
  .rec-card .k{font:900 11px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .rec-card .v{font:900 15px var(--font-ui);}
  .rec-card a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="xshell narrow">
  <div class="hero">
    <div class="eyebrow">Organic Chemistry I</div>
    <h1 style="margin-bottom:4px;">Mastery, not a readiness score.</h1>
    <p class="lede" style="margin-top:0;">Built from every question you've answered, not from lessons opened.</p>
  </div>

  <div class="xsection mastery-grid" style="padding-top:0;">
    <div class="mastery-main">
      <div class="section-head" style="margin-top:0;">Where you actually stand</div>
      <noscript><div class="site-nav-fallback"><p>Mastery is computed in your browser from every question you have answered, so this page has nothing to show without JavaScript. The course itself is in the <a href="learn.html">textbook</a> and the <a href="index.html">lessons</a>.</p></div></noscript>
      <div class="overall-card" id="overallCard"></div>
      <div id="masterySnapshot"></div>
      <div id="leechAlerts"></div>
      <div id="dependencyAlerts"></div>
      <div class="rec-row" id="recRow"></div>
      <div class="section-head" id="weakHead">Weakest concepts</div>
      <div id="weakConcepts"></div>
    </div>
    <aside class="mastery-side">
      <div id="gameLevel"></div>
      <div class="game-grid">
        <div id="gameRounds"></div>
        <div id="gameDebt"></div>
      </div>
      <div id="gameConcepts"></div>
      <div class="section-head">Achievements</div>
      <div class="badge-grid" id="gameAchievements"></div>
    </aside>
  </div>

  <!-- The two long lists sit side by side under both columns, so neither
       column runs on alone with empty space beside it. -->
  <div class="xsection mastery-lists" style="padding-top:0;">
    <div>
      <div class="section-head" id="moduleHead">By module</div>
      <div id="moduleStats"></div>
    </div>
    <div>
      <div class="section-head" id="familyHead">By concept family</div>
      <div id="familyStats"></div>
    </div>
  </div>
</div>
