<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("nremt_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<meta name="theme-color" content="#16332E">
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Your Organic Chemistry mastery by module, based on performance across every question you've answered.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  .mastery-shell{max-width:760px;margin:0 auto;}
  .overall-card{
    background:var(--navy);color:#fff;border-radius:22px;padding:28px clamp(20px,4vw,34px);
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;
  }
  .overall-card .big{font:900 44px var(--font-ui);}
  .overall-card .k{opacity:.75;font:800 12px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;}
  .rec-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px;}
  .rec-card{
    flex:1 1 220px;background:var(--white);border:var(--bw) solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--lift-sm);
  }
  .rec-card .k{font:900 11px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .rec-card .v{font:900 15px var(--font-ui);}
  .rec-card a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="../index.html">
      <span class="brand-mark" aria-hidden="true">+</span> Study Hub
    </a>
    <a href="index.html" style="font:800 14px var(--font-ui);color:var(--muted);text-decoration:none;">Organic Chemistry</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
  </div>
</div>
<div id="ochem-subnav" class="ochem-subnav"></div>

<div class="xshell mastery-shell">
  <div class="hero" style="padding-bottom:0;">
    <div class="eyebrow">Organic Chemistry I</div>
    <h1 style="margin-bottom:4px;">Mastery, not a readiness score.</h1>
    <p class="lede" style="margin-top:0;">Built from your performance across every question you've answered in each concept — not just whether you opened the lesson.</p>
  </div>

  <div class="xsection" style="padding-top:0;">
    <div class="overall-card" id="overallCard"></div>
    <div class="rec-row" id="recRow"></div>
    <div id="moduleStats"></div>
  </div>
</div>

<script src="assets/curriculum.js"></script>
<script>
  window.OCHEM_SECTION = 'mastery';
  window.OCHEM_BASE = '';
</script>
<script src="assets/ochem-nav.js"></script>
<script src="assets/mastery-page.js"></script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
</body>
</html>
