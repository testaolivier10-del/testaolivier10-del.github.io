<script>
  /* The exam-date card (../assets/exam-date.js). Per day: the concepts not
     yet solid, spread over the days left. */
  document.addEventListener('DOMContentLoaded', function(){
    var M = window.OchemMastery;
    if(!window.LevlExamDate) return;
    window.LevlExamDate.mount(document.getElementById('examDateCard'), {
      subject: 'ochem',
      links: { review: 'review.html', exams: 'exams.html' },
      target: function(days){
        if(!M) return null;
        var c = M.counts();
        var total = (c.unseen || 0) + (c.shaky || 0) + (c.developing || 0) + (c.solid || 0) + (c.mastered || 0);
        var left = total - (c.solid || 0) - (c.mastered || 0);
        if(!left) return { done: 'Every concept is solid or mastered. Keep the review queue clear and take a timed exam.' };
        return { n: Math.ceil(left / days), unit: left === 1 ? 'concept' : 'concepts', why: 'to solid covers the ' + left + ' that are not there yet' };
      }
    });
  });
</script>
