<body>
<div id="site-header"></div>

<div class="xshell stub-shell">
  <div class="hero" id="reviewHero" style="padding-bottom:0;">
    <div class="eyebrow">Organic Chemistry I</div>
    <h1 style="margin-bottom:4px;">Review.</h1>
    <p class="lede" style="margin-top:0;">A queue that ends. Concepts you've already learned come back when they're closest to being forgotten — inside a fresh problem on a different topic, not as the same card again.</p>
  </div>
  <div class="xsection" style="padding-top:0;">
    <!-- The queue: what's due today, what's held back, what's coming. -->
    <div id="reviewBody"></div>

    <!-- A running review session; the loop itself is session-runner.js. -->
    <div id="reviewSession" class="practice-view" hidden>
      <div class="session-head">
        <span class="mode" id="reviewMode"></span>
        <button type="button" class="quit" id="reviewQuit">End session</button>
      </div>
      <div class="progress-bar">
        <div class="track"><div class="fill" id="reviewProgFill" style="width:0%"></div></div>
        <div class="label" id="reviewProgLabel"></div>
      </div>
      <div class="lesson-card" id="reviewCard"></div>
    </div>

    <!-- Queue cleared. -->
    <div id="reviewDone" class="practice-view" hidden></div>
  </div>
</div>
