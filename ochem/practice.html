<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("nremt_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<meta name="theme-color" content="#16332E">
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice — Organic Chemistry</title>
<meta name="description" content="Adaptive Organic Chemistry practice: the engine reads your concept-level mastery, picks the question that teaches you the most right now, diagnoses why a wrong answer was wrong, and schedules what you learn to come back later.">
<link rel="canonical" href="https://testaolivier10-del.github.io/ochem/practice.html">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="assets/ochem.css">
<link rel="stylesheet" href="assets/periodic-table.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  .practice-shell{max-width:760px;margin:0 auto;}
  .section-head{
    font:900 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px;
  }
  .section-head:first-child{margin-top:0;}
</style>
</head>
<body>
<div id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="../index.html">
      <span class="brand-mark" aria-hidden="true">+</span> Study Hub
    </a>
    <a href="index.html" style="font:800 14px var(--font-ui);color:var(--muted);text-decoration:none;">Organic Chemistry</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
  </div>
</div>
<div id="ochem-subnav" class="ochem-subnav"></div>

<div class="xshell practice-shell">
  <div class="hero" id="practiceHero" style="padding-bottom:0;">
    <div class="eyebrow">Organic Chemistry I</div>
    <h1 style="margin-bottom:4px;">Practice.</h1>
    <p class="lede" style="margin-top:0;">Not "here are ten questions" — here's the question that will teach you the most right now, based on everything you've answered so far.</p>
  </div>

  <div class="xsection" style="padding-top:0;">
    <!-- Landing: recommendations, mastery snapshot, modes, weak concepts. -->
    <div id="practiceHome"></div>

    <!-- A running session: progress chrome + the question card. -->
    <div id="practiceSession" class="practice-view" hidden>
      <div class="session-head">
        <span class="mode" id="sessionMode"></span>
        <button type="button" class="quit" id="sessionQuit">End session</button>
      </div>
      <div class="progress-bar">
        <div class="track"><div class="fill" id="practiceProgFill" style="width:0%"></div></div>
        <div class="label" id="practiceProgLabel"></div>
      </div>
      <div class="lesson-card" id="practiceCard"></div>
    </div>

    <!-- End-of-session: score, what moved, what's next. -->
    <div id="practiceSummary" class="practice-view" hidden></div>
  </div>
</div>

<script src="assets/curriculum.js"></script>
<script src="assets/concepts.js"></script>
<script src="assets/molecules.js"></script>
<script src="assets/mastery-engine.js"></script>
<script src="assets/practice-bank.js"></script>
<script src="assets/interactive-bank.js"></script>
<script src="assets/diagnostic-engine.js"></script>
<script src="assets/question-engine.js"></script>
<script src="assets/session-runner.js"></script>
<script>
  window.OCHEM_SECTION = 'practice';
  window.OCHEM_BASE = '';
</script>
<script src="assets/ochem-nav.js"></script>
<script src="assets/periodic-table.js"></script>
<script src="assets/practice-page.js"></script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
</body>
</html>
