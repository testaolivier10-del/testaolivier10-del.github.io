  /* Width is the shell's job now — this page used to cap itself at 760px
     while Home and Tools ran the full shell, so the course changed width
     as you moved through it. */
  .section-head{
    font:900 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px;
  }
  .section-head:first-child{margin-top:0;}
  .xshell .section-head{text-align:left;}
  .practice-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0 36px;align-items:start;margin-top:24px;}
  .practice-main,.practice-side{min-width:0;}
  .practice-side .section-head:first-child{margin-top:0;}
  .practice-main .mode-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .practice-side .snapshot{grid-template-columns:1fr 1fr;}
  .practice-side .snapshot .cell .v{font-size:26px;}
  /* A running session and its summary are one column of reading width. */
  .practice-view{max-width:820px;margin-left:auto;margin-right:auto;}
  @media (max-width:900px){
    .practice-grid{grid-template-columns:1fr;}
    .practice-side .section-head:first-child{margin-top:26px;}
    .practice-main .mode-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  }
</style>

    <!-- A running session: progress chrome + the question card. -->

      <div class="session-head">
        <span class="mode" id="sessionMode"></span>

        <div class="label" id="practiceProgLabel"></div>
      </div>
      <div class="lesson-card" id="practiceCard"></div>
    </div>

    <!-- End-of-session: score, what moved, what's next. -->
    <div id="practiceSummary" class="practice-view" hidden></div>
  </div>
