<style>
.rp-setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .rp-setup .tfield{margin-bottom:0;}
  .rp-equation{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;
    margin-top:18px;padding:16px 12px;background:var(--paper);
    border:var(--bw) solid var(--line-soft);border-radius:var(--radius);
  }
  .rp-term{font:900 16px var(--font-mono);color:var(--ink);}
  .rp-term--product{color:var(--accent);}
  .rp-op{font:900 16px var(--font-mono);color:var(--muted);}
  .rp-arrow{display:flex;flex-direction:column;align-items:center;min-width:110px;}
  .rp-over,.rp-under{font:800 10.5px var(--font-ui);color:var(--muted);}
  .rp-line{font:900 20px var(--font-mono);color:var(--ink);line-height:1;}
</style>
</head>
<body>
<div id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="../../index.html">
      <span class="brand-mark" aria-hidden="true">+</span> Study Hub
    </a>
    <a href="../index.html" style="font:800 14px var(--font-ui);color:var(--muted);text-decoration:none;">Organic Chemistry</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
  </div>
</div>
<div id="ochem-subnav" class="ochem-subnav"></div>

<div class="xshell">
  <div class="tool-top" id="tool-top"></div>
  <div id="rpRoot"></div>

  <div id="tool-foot"></div>
</div>

<script>
  window.OCHEM_SECTION = 'tools';
  window.OCHEM_BASE = '../';
  window.OCHEM_TOOL = 'reaction-predictor';
</script>
<script src="../assets/ochem-nav.js"></script>
<script src="../assets/tools-registry.js"></script>

<script src="../assets/chem-core.js"></script>

<script src="../assets/builder-ui.js"></script>
<script src="../assets/tools/reaction-predictor.js"></script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
