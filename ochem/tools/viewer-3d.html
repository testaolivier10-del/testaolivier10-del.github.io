<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("nremt_theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>

<link rel="apple-touch-icon" href="../../assets/icon.svg">

<meta charset="UTF-8">

<meta name="description" content="Rotate molecules in 3D with real VSEPR geometry. Click any atom for its electron groups, hybridization, shape and measured bond angles — including the compression a lone pair causes.">

     streak. Loaded blocking and ahead of this page's own scripts because
     they read window.HubProgress as the page parses. -->
<script src="../../assets/account.js"></script>
<script src="../../assets/hub-progress.js"></script>
<script src="../assets/ochem-xp.js"></script>
<link rel="stylesheet" href="../assets/ochem.css">
<link rel="stylesheet" href="../assets/tools.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
.ap-group{margin-bottom:14px;}
  .ap-group:last-child{margin-bottom:0;}
  .ap-group__label{
    font:900 10.5px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px;
  }
  .v3-stage{
    background:var(--paper);border:var(--bw) solid var(--line-soft);border-radius:var(--radius);
    touch-action:none;cursor:grab;user-select:none;
  }
  .v3-stage.is-dragging{cursor:grabbing;}
  .v3-stage:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .v3-stage svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
  .m3d-atom{cursor:pointer;}
  .m3d-atom:focus{outline:none;}
  .m3d-atom:focus circle{stroke:var(--accent);stroke-width:3.5;}
</style>
</head>
<body>
<div id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="../../index.html">
      <span class="brand-mark" aria-hidden="true">+</span> Study Hub
    </a>
    <a href="../index.html" style="font:800 14px var(--font-ui);color:var(--muted);text-decoration:none;">Organic Chemistry</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
  </div>
</div>
<div id="ochem-subnav" class="ochem-subnav"></div>

<div class="xshell">
  <div class="tool-top" id="tool-top"></div>
  <div id="v3Root"></div>

  <div id="tool-foot"></div>
</div>

<script>
  window.OCHEM_SECTION = 'tools';
  window.OCHEM_BASE = '../';
  window.OCHEM_TOOL = 'viewer-3d';
</script>
<script src="../assets/ochem-nav.js"></script>
<script src="../assets/tools-registry.js"></script>
<script src="../assets/tool-state.js"></script>
<script src="../assets/tool-shell.js"></script>
<script src="../assets/mol3d.js"></script>
<script src="../assets/mol3d-library.js"></script>
<script src="../assets/molecules.js"></script>
<script src="../assets/chem-core.js"></script>
<script src="../assets/mol-builder.js"></script>
<script src="../assets/builder-ui.js"></script>
<script src="../assets/tools/viewer-3d.js"></script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
</body>
</html>
