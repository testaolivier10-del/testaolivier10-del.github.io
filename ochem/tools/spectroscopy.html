<style>
.sp-chart{
    background:var(--paper);border:var(--bw) solid var(--line-soft);border-radius:var(--radius);
    padding:10px 6px;margin-bottom:14px;overflow-x:auto;
  }
  .sp-chart svg{width:100%;height:auto;display:block;min-width:460px;}
  .sp-axis{font:700 9.5px var(--font-mono);fill:var(--muted);}
  .sp-int{font:800 10px var(--font-mono);fill:var(--muted);}
  .sp-peak,.sp-sig{cursor:pointer;}
  .sp-peak:focus,.sp-sig:focus{outline:none;}
  .sp-peak:focus circle{stroke-width:3.5;}
  .sp-sig.is-on .sp-int,.sp-sig:focus .sp-int{fill:var(--accent);}
  .sp-row-on td{background:var(--tint-accent);}
  .sp-bands{position:relative;margin-bottom:4px;}
  /* The bar is positioned honestly by wavenumber; the label is allowed to
     spill out to the right of it, because several of these regions are only
     a few percent of the axis wide and clipping the text to fit made the
     chart unreadable. Rows are packed in JS so two labels never collide. */
  .sp-band{
    position:absolute;height:22px;background:none;border:0;padding:0;cursor:pointer;
  }
  .sp-band__bar{
    position:absolute;inset:0;border:var(--bw) solid var(--line);background:var(--white);
    border-radius:var(--radius-sm);
  }
  .sp-band__label{
    position:absolute;left:0;top:0;height:22px;display:flex;align-items:center;
    padding:0 6px;font:800 10px var(--font-ui);color:var(--muted);white-space:nowrap;
  }
  .sp-band:hover .sp-band__bar{border-color:var(--accent);}
  .sp-band.on .sp-band__bar{background:var(--accent);border-color:var(--accent);}
  .sp-band.on .sp-band__label{color:var(--ink);}
  .sp-band--variable .sp-band__bar{border-style:dashed;}
  .sp-scale{position:relative;height:18px;border-top:var(--bw) solid var(--line);}
  .sp-scale span{
    position:absolute;top:3px;transform:translateX(-50%);
    font:700 10px var(--font-mono);color:var(--muted);
  }
  .sp-opt--right{background:var(--good)!important;border-color:var(--good)!important;color:var(--on-accent)!important;opacity:1!important;}
  .sp-opt--wrong{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--on-accent)!important;opacity:1!important;}
</style>
