<style>
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .res-card{
    border:var(--bw) solid var(--line);border-radius:var(--radius);padding:8px;background:var(--paper);
  }
  .res-card--major{border-color:var(--good);background:var(--tint-good);}
  .res-card .tstage{border:0;background:transparent;padding:0;}
  .res-card .scene svg{max-width:100%;}
  .res-card__rank{
    font:900 10.5px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-top:4px;
  }
  .res-card--major .res-card__rank{color:var(--good);}
  .res-card__tag{
    font:900 9px var(--font-ui);background:var(--track);color:var(--muted);
    padding:2px 6px;border-radius:var(--radius-pill);letter-spacing:.03em;
  }
  .res-card__why{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.45;margin-top:3px;}
  .res-bar{
    height:8px;border-radius:var(--radius-pill);background:var(--track);overflow:hidden;
  }
  .res-bar span{display:block;height:100%;background:var(--accent);transition:width .2s ease;}
  .res-card--blank{
    display:flex;align-items:center;justify-content:center;min-height:120px;
    border-style:dashed;color:var(--muted);font:900 26px var(--font-mono);opacity:.6;
  }
</style>
</head>
<body>
<div id="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="../../index.html">
      <span class="brand-mark" aria-hidden="true">+</span> Study Hub
    </a>
    <a href="../index.html" style="font:800 14px var(--font-ui);color:var(--muted);text-decoration:none;">Organic Chemistry</a>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◑</button>
  </div>
</div>
<div id="ochem-subnav" class="ochem-subnav"></div>

<div class="xshell">
  <div class="tool-top" id="tool-top"></div>
  <div id="resRoot"></div>

  <div id="tool-foot"></div>
</div>

<script>
  window.OCHEM_SECTION = 'tools';
  window.OCHEM_BASE = '../';
  window.OCHEM_TOOL = 'resonance';
</script>
<script src="../assets/ochem-nav.js"></script>
<script src="../assets/tools-registry.js"></script>
<script src="../assets/tool-state.js"></script>
<script src="../assets/tool-shell.js"></script>
<script src="../assets/molecules.js"></script>
<script src="../assets/tool-molecules.js"></script>
<script src="../assets/molecule-editor.js"></script>
<script src="../assets/chem-core.js"></script>
<script src="../assets/resonance-engine.js"></script>
<script src="../assets/mol3d.js"></script>
<script src="../assets/mol-builder.js"></script>
<script src="../assets/builder-ui.js"></script>
<script src="../assets/tools/resonance.js"></script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
</body>
</html>
