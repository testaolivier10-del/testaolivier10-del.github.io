<style>
.ab-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;}
  .ab-vs .tfield{margin-bottom:0;}
  .ab-vs__mid{font:900 13px var(--font-ui);color:var(--muted);padding-bottom:10px;}
  .ab-cards{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:18px;}
  .ab-cards__vs{display:flex;align-items:center;font:900 13px var(--font-ui);color:var(--muted);}
  .ab-card{
    background:var(--paper);border:var(--bw) solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;
  }
  .ab-card--win{border-color:var(--good);background:var(--tint-good);}
  .ab-card__name{font:900 14.5px var(--font-ui);}
  .ab-card__formula{font:800 16px var(--font-mono);color:var(--accent);margin:4px 0 10px;}
  .ab-card__row{
    display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:4px 0;border-top:1px solid var(--line-soft);
  }
  .ab-card__row b{color:var(--ink);font-family:var(--font-mono);}
  .ab-order{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
  .ab-slot{
    display:flex;align-items:center;gap:12px;padding:10px 14px;font-weight:800;font-size:13.5px;
    background:var(--paper);border:var(--bw) solid var(--line-soft);border-radius:var(--radius);
  }
  .ab-slot--ok{border-color:var(--good);background:var(--tint-good);}
  .ab-slot--no{border-color:var(--bad);background:var(--tint-bad);}
  .ab-slot__n{
    width:24px;height:24px;border-radius:50%;background:var(--track);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font:900 12px var(--font-mono);flex:none;
  }
  .ab-slot__pka{margin-left:auto;font-family:var(--font-mono);color:var(--muted);}
  .ab-site__formula{
    font:900 22px var(--font-mono);color:var(--accent);margin:10px 0 6px;
    word-break:break-word;
  }
  @media(max-width:760px){
    .ab-vs,.ab-cards{grid-template-columns:1fr;}
    .ab-vs__mid,.ab-cards__vs{justify-content:center;padding:0;}
  }
</style>
