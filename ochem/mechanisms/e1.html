    cursor:pointer;box-shadow:var(--lift-sm);transition:border-color .1s ease,transform .06s ease;
  }
  .choice-btn:hover{border-color:var(--accent);}
  .choice-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line);}
  .choice-btn.correct{border-color:var(--good);background:var(--tint-good);}
  .choice-btn.wrong{border-color:var(--bad);background:var(--tint-bad);}

  .feedback{border-radius:var(--radius);padding:14px 16px;font-size:14.5px;font-weight:700;line-height:1.55;margin-bottom:16px;display:none;}

<div class="xshell lesson-shell">
  <div class="hero" style="padding-bottom:0;">
    <div class="eyebrow">Module 6 &middot; Substitution &amp; Elimination</div>
    <h1 style="margin-bottom:4px;">E1: the same cation, a different fate.</h1>
    <p class="lede" style="margin-top:0;">Same ionization step as SN1 — but this time, a base pulls off a hydrogen instead of a nucleophile attacking carbon.</p>
  </div>

  <div class="progress-bar">
    <div class="track"><div class="fill" id="progFill" style="width:0%"></div></div>
    <div class="label" id="progLabel">Step 1 / 6</div>
  </div>

  <div class="lesson-card" id="card"></div>

  window.OCHEM_SECTION = 'learn';
  window.OCHEM_BASE = '../';

<script>
(function(){
  var TOPIC_ID = 'e1';
  // 0 explain, 1 ionize, 2 visualize cation, 3 remove beta-H, 4 predict (Zaitsev), 5 rate/competition, 6 challenge
  var TOTAL = 6;
  var begin = window.OchemCurriculum.beginLessonRun(TOPIC_ID, TOTAL+1);
  var step = begin.step;
  var card = document.getElementById('card');
  var progFill = document.getElementById('progFill');
  var progLabel = document.getElementById('progLabel');

  // Mirrors into the concept model too, so this mechanism counts toward the
  // same mastery Practice and Review read. Shared recorder, not a local copy:
  // the tier/share/first-attempt rules must not drift from the lesson engine.
  /* Which concept each step of this mechanism actually tests. Authored
     rather than inferred: inference over the step's rendered text reads the
     whole card, which on a mechanism page is dense with every term at once,
     and it reliably picked one concept for the entire walkthrough. */
  var STEP_CONCEPTS = {
    1: ['leaving-group-ability', 'curved-arrow-direction'],   // ionize
    2: ['carbocation-stability'],                             // visualize the cation
    3: ['curved-arrow-direction', 'zaitsev-hofmann'],         // remove a beta hydrogen
    4: ['zaitsev-hofmann'],                                   // which alkene dominates
    5: ['rate-law-kinetics', 'mechanism-selection'],          // E1 vs SN1 competition
    6: ['mechanism-selection', 'zaitsev-hofmann']             // challenge
  };
  var M = window.OchemMastery;
  var conceptRec = M ? M.lessonRecorder(TOPIC_ID) : null;
  function record(correct){
    /* A step reached by going back is a re-read, not new evidence — see
       step-back.js. */
    if(SB && SB.isReplay()) return;
    window.OchemCurriculum.recordAttempt(TOPIC_ID, correct);
    if(conceptRec) conceptRec(correct, step, { concepts: STEP_CONCEPTS[step] });
  }
  function updateProgress(){
    progFill.style.width = Math.round((step/TOTAL)*100) + '%';
    progLabel.textContent = 'Step ' + (step+1) + ' / ' + (TOTAL+1);
    window.OchemCurriculum.saveStep(TOPIC_ID, step);
  }
  function feedbackHtml(id){ return '<div class="feedback" id="' + id + '"></div>'; }
  /* Every verdict this page shows goes through here, so it is also where the
     reward chime is sounded. The wrong case is reported too, to reset the
     rising run the chime walks up on a streak. See /assets/chime.js. */
  function showFeedback(el, good, text){
    el.className = 'feedback show ' + (good?'good':'bad');
    el.textContent = text;
    if(window.LevlSound) window.LevlSound.answer(good);
  }
  function nextButton(label, enabled){ return '<div class="actions"><button class="btn-press" id="nextBtn"' + (enabled?'':' disabled') + '>' + label + '</button></div>'; }

  var SB = window.OchemStepBack;
  function goBack(){ if(step > 0){ step--; render(); } }
  if(SB) SB.mount(card, goBack);

  function render(){
    updateProgress();
    if(SB) SB.sync(step);
    if(step===0) renderExplain();
    else if(step===1) renderIonize();
    else if(step===2) renderVisualizeCation();
    else if(step===3) renderRemoveBetaH();
    else if(step===4) renderZaitsev();
    else if(step===5) renderRateCompetition();
    else renderChallenge();
  }

  // ---- Step 0: Explain ----
  function renderExplain(){
    card.innerHTML =
      '<div class="step-eyebrow">Explain</div>' +
      '<h2 class="step-title">E1 starts exactly like SN1.</h2>' +
      '<p class="step-body">Just like SN1, <b>E1</b> begins with the leaving group departing <b>on its own</b>, before anything else gets involved. That slow, rate-determining ionization step leaves behind the same kind of intermediate: a flat, sp² <b>carbocation</b>.</p>' +
      '<p class="step-body" style="margin-bottom:0;">What happens next is where E1 and SN1 diverge: instead of a nucleophile attacking the cationic carbon, a weak base grabs a hydrogen from a <b>neighboring (beta) carbon</b>, and the electrons from that C–H bond flow in to form a new pi bond. We\'ll ionize 2-bromo-2-methylbutane, (CH₃)₂CBr–CH₂CH₃, and watch this play out.</p>' +
      nextButton('Continue', true);
    card.querySelector('#nextBtn').addEventListener('click', function(){ step=1; render(); });
  }

  // ---- Step 1: Ionize ----
  function renderIonize(){
    card.innerHTML =
      '<div class="step-eyebrow">Step 1 · Ionize</div>' +
      '<h2 class="step-title">Push the C–Br bond\'s electrons onto bromine.</h2>' +
      '<p class="step-body">Click the central carbon, then click bromine, to show the bond breaking heterolytically — bromine leaves with both electrons, exactly like the first step of SN1.</p>' +
      '<div class="scene"><svg viewBox="0 0 260 200">' +
        '<line x1="120" y1="100" x2="120" y2="40" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="120" y1="100" x2="70" y2="130" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="120" y1="100" x2="185" y2="120" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="120" y1="100" x2="190" y2="70" stroke="var(--line)" stroke-width="2.5"/>' +
        '<circle cx="120" cy="100" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="120" y="106" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">C</text>' +
        '<circle cx="120" cy="30" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="120" y="35" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12">CH₃</text>' +
        '<circle cx="55" cy="138" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="55" y="143" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12">CH₃</text>' +
        '<circle cx="200" cy="128" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="200" y="133" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CH₂CH₃</text>' +
        '<g class="atom" data-key="carbon"><circle cx="120" cy="100" r="17" fill="transparent" stroke="none"/></g>' +
        '<g class="atom" data-key="br"><circle cx="210" cy="58" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="210" y="63" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14">Br</text></g>' +
      '</svg></div>' +
      feedbackHtml('fb') +
      nextButton('See the intermediate', false);

    var fb = card.querySelector('#fb');
    var next = card.querySelector('#nextBtn');
    var from = null, done = false;
    card.querySelectorAll('.atom').forEach(function(g){
      g.addEventListener('click', function(){
        if(done) return;
        var key = g.getAttribute('data-key');
        if(from === null){
          if(key !== 'carbon'){
            showFeedback(fb, false, 'Start at the bond that\'s breaking — click the central carbon first.');
            return;
          }
          from = key;
          showFeedback(fb, true, 'Good. Now click bromine to send the electrons with it.');
        } else {
          var isCorrect = key === 'br';
          record(isCorrect);
          if(isCorrect){
            done = true;
            g.querySelector('circle').setAttribute('stroke', 'var(--coral)');
            g.querySelector('circle').setAttribute('stroke-width', '3.5');
            var arrowSvg = '<path d="M 128 90 Q 165 60 198 65" stroke="var(--coral)" stroke-width="2.5" fill="none" marker-end="url(#ahI)"/>' +
              '<defs><marker id="ahI" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--coral)"/></marker></defs>';
            card.querySelector('.scene svg').insertAdjacentHTML('beforeend', arrowSvg);
            showFeedback(fb, true, 'Correct — bromide leaves on its own, taking the bonding electrons with it. This is exactly the same ionization step SN1 uses.');
            next.disabled = false;
          } else {
            showFeedback(fb, false, 'The electrons need to land on bromine.');
          }
        }
      });
    });
    next.addEventListener('click', function(){ step=2; render(); });
  }

  // ---- Step 2: Visualize the planar carbocation ----
  function renderVisualizeCation(){
    card.innerHTML =
      '<div class="step-eyebrow">Visualize</div>' +
      '<h2 class="step-title">A tertiary carbocation, with beta-hydrogens on two different sides.</h2>' +
      '<p class="step-body">The cationic carbon is sp² and trigonal planar, just like in SN1. But now look one bond further out: the carbons directly attached to it — the <b>beta carbons</b> — each carry hydrogens of their own. This cation has beta-hydrogens on <b>two different kinds</b> of neighboring carbon: a methyl group, and a CH₂ of the ethyl group.</p>' +
      '<div class="scene"><svg viewBox="0 0 260 160">' +
        '<line x1="130" y1="90" x2="130" y2="30" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="130" y1="90" x2="75" y2="122" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="130" y1="90" x2="195" y2="112" stroke="var(--line)" stroke-width="2.5"/>' +
        '<circle cx="130" cy="90" r="17" fill="var(--white)" stroke="var(--coral)" stroke-width="2.5"/><text x="130" y="96" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">C</text>' +
        '<text x="150" y="80" font-family="Nunito" font-weight="900" font-size="14" fill="var(--coral)">+</text>' +
        '<circle cx="130" cy="20" r="16" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="130" y="25" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CH₃(β)</text>' +
        '<circle cx="60" cy="130" r="16" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="60" y="135" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CH₃(β)</text>' +
        '<circle cx="210" cy="120" r="20" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="210" y="118" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">CH₂(β)</text><text x="210" y="130" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">–CH₃</text>' +
      '</svg></div>' +
      nextButton('Continue', true);
    card.querySelector('#nextBtn').addEventListener('click', function(){ step=3; render(); });
  }

  // ---- Step 3: Remove a beta-hydrogen ----
  function renderRemoveBetaH(){
    card.innerHTML =
      '<div class="step-eyebrow">Interact</div>' +
      '<h2 class="step-title">Click a beta carbon to have a base remove one of its hydrogens.</h2>' +
      '<p class="step-body">When a base removes a beta-hydrogen, its bonding electrons swing in to form a new pi bond between the alpha and beta carbons — that\'s the alkene double bond forming. Try clicking the CH₂ (ethyl) side.</p>' +
      '<div class="scene"><svg viewBox="0 0 260 160">' +
        '<line x1="130" y1="90" x2="130" y2="30" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="130" y1="90" x2="75" y2="122" stroke="var(--line)" stroke-width="2.5"/>' +
        '<line x1="130" y1="90" x2="195" y2="112" stroke="var(--line)" stroke-width="2.5"/>' +
        '<circle cx="130" cy="90" r="17" fill="var(--white)" stroke="var(--coral)" stroke-width="2.5"/><text x="130" y="96" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">C</text>' +
        '<text x="150" y="80" font-family="Nunito" font-weight="900" font-size="14" fill="var(--coral)">+</text>' +
        '<g class="atom" data-key="methyl1"><circle cx="130" cy="20" r="16" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="130" y="25" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CH₃(β)</text></g>' +
        '<g class="atom" data-key="methyl2"><circle cx="60" cy="130" r="16" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="60" y="135" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CH₃(β)</text></g>' +
        '<g class="atom" data-key="ethylCH2"><circle cx="210" cy="120" r="20" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="210" y="118" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">CH₂(β)</text><text x="210" y="130" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">–CH₃</text></g>' +
      '</svg></div>' +
      feedbackHtml('fb') +
      nextButton('Continue', false);

    var fb = card.querySelector('#fb');
    var next = card.querySelector('#nextBtn');
    var chosen = false;
    card.querySelectorAll('.atom').forEach(function(g){
      g.addEventListener('click', function(){
        if(chosen) return;
        chosen = true;
        g.classList.add('chosen');
        var key = g.getAttribute('data-key');
        record(true);
        if(key === 'ethylCH2'){
          showFeedback(fb, true, 'Removing a hydrogen from the CH₂ gives 2-methyl-2-butene — a trisubstituted alkene (three carbon groups on the double bond).');
        } else {
          showFeedback(fb, true, 'Removing a hydrogen from this CH₃ gives 2-methyl-1-butene — a disubstituted alkene (only two carbon groups on the double bond).');
        }
        next.disabled = false;
      });
    });
    next.addEventListener('click', function(){ step=4; render(); });
  }

  // ---- Step 4: Zaitsev's rule ----
  function renderZaitsev(){
    card.innerHTML =
      '<div class="step-eyebrow">Predict</div>' +
      '<h2 class="step-title">Two different alkenes are possible. Which one dominates?</h2>' +
      '<p class="step-body">Removing a hydrogen from the ethyl CH₂ gives 2-methyl-2-butene (trisubstituted). Removing one from either methyl group gives 2-methyl-1-butene (disubstituted).</p>' +
      '<div class="choice-row">' +
        window.OchemShuffle.list(['The more substituted alkene (2-methyl-2-butene) — it\'s the major product', 'The less substituted alkene (2-methyl-1-butene) — it\'s the major product', 'Both form in exactly equal amounts, always'], 'e1:zaitsev').map(function(o){ return '<button class="choice-btn" data-v="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>'; }).join('') +
      '</div>' +
      feedbackHtml('fb') +
      nextButton('Continue', false);

    var fb = card.querySelector('#fb');
    var next = card.querySelector('#nextBtn');
    card.querySelectorAll('.choice-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var isCorrect = btn.getAttribute('data-v').indexOf('The more substituted') === 0;
        card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
        btn.classList.add(isCorrect ? 'correct' : 'wrong');
        record(isCorrect);
        if(isCorrect){
          showFeedback(fb, true, 'Correct — this is <b>Zaitsev\'s rule</b>: the more substituted (more stable) alkene is the major product. More substituted double bonds are lower in energy for the same hyperconjugation reason more substituted carbocations are more stable.');
          next.disabled = false;
        } else {
          showFeedback(fb, false, 'Compare the stability of the two possible alkenes — more alkyl substitution on a double bond makes it more stable, the same logic as carbocation stability.');
          card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = false; b.classList.remove('wrong'); });
        }
      });
    });
    next.addEventListener('click', function(){ step=5; render(); });
  }

  // ---- Step 5: rate law and competition with SN1 ----
  function renderRateCompetition(){
    card.innerHTML =
      '<div class="step-eyebrow">Explain</div>' +
      '<h2 class="step-title">E1 and SN1 are constant competitors, not separate reactions.</h2>' +
      '<p class="step-body">Like SN1, E1 is <b>unimolecular</b>: only the substrate is involved in the slow, rate-determining ionization step, giving the rate law <b>rate = k[substrate]</b> — the base/nucleophile\'s concentration doesn\'t appear.</p>' +
      '<p class="step-body" style="margin-bottom:0;">Because E1 and SN1 share the exact same carbocation intermediate, they happen under the <b>same conditions</b> — a weak nucleophile/base and a polar protic solvent — and almost always occur <b>together</b>, as a mixture of substitution and elimination products, rather than one to the complete exclusion of the other. Which one wins more of the time depends on factors like temperature (higher temperature favors elimination, since E1 has a greater entropy increase from forming two smaller product molecules from one) and steric bulk around the cation (more crowding favors elimination, since a nucleophile has a harder time approaching a crowded carbon than a base has removing a peripheral hydrogen).</p>' +
      nextButton('Continue', true);
    card.querySelector('#nextBtn').addEventListener('click', function(){ step=6; render(); });
  }

  // ---- Step 6: Why it matters + Challenge ----
  function renderChallenge(){
    card.innerHTML =
      '<div class="step-eyebrow">Why it matters &middot; Challenge</div>' +
      '<h2 class="step-title">Same substrate, same conditions — SN1 and E1 both start the same way.</h2>' +
      '<div class="explain-box">Whenever you see a substrate that ionizes easily (tertiary, or stabilized by resonance) reacting with a weak, poor nucleophile/base in a polar protic solvent, expect a <b>mixture</b> of SN1 and E1 products — not a single clean answer. This is exactly why substrate and solvent effects (next lesson) matter so much for predicting real outcomes.</div>' +
      '<p class="step-body">A tertiary alkyl bromide is heated in ethanol (a weak nucleophile and weak base, polar protic solvent). What should you expect?</p>' +
      '<div class="choice-row">' +
        window.OchemShuffle.list(['A mixture of SN1 substitution and E1 elimination products, with elimination favored by the heat', 'Only SN2 substitution, cleanly', 'No reaction occurs at all'], 'e1:challenge').map(function(o){ return '<button class="choice-btn" data-v="' + o.replace(/"/g,'&quot;') + '">' + o + '</button>'; }).join('') +
      '</div>' +
      feedbackHtml('fb') +
      '<div id="doneBox"></div>';

    var fb = card.querySelector('#fb');
    card.querySelectorAll('.choice-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var isCorrect = btn.getAttribute('data-v').indexOf('A mixture') === 0;
        card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
        btn.classList.add(isCorrect ? 'correct' : 'wrong');
        record(isCorrect);
        if(isCorrect){
          showFeedback(fb, true, 'Correct — a tertiary substrate ionizes easily, ethanol is a weak nucleophile/base and polar protic (favoring the ionization pathway for both SN1 and E1), and heat specifically favors E1 over SN1. Expect a real mixture of an ether/alcohol (from SN1) and the Zaitsev alkene (from E1), not one single clean product.');
          window.OchemCurriculum.completeLessonRun(TOPIC_ID);
          if(M) M.noteLesson(TOPIC_ID);
          card.querySelector('#doneBox').innerHTML = '<div class="actions" style="margin-top:8px;"><a href="../learn.html" class="btn-press">Back to the textbook</a></div>';
        } else {
          showFeedback(fb, false, 'A tertiary carbon can\'t do SN2 (too crowded), but it ionizes readily — think about which unimolecular pathways become available once that carbocation forms.');
          card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = false; b.classList.remove('wrong'); });
        }
      });
    });
  }


  var notesMode = /(^|[?&])notes=1(&|$)/.test(location.search);
  var NOTES_HREF = '../learn.html#e1';
  (function(){
    var shell = card.parentNode;
    var progressBarEl = shell.querySelector('.progress-bar');
    var toggleBar = document.createElement('div');
    toggleBar.className = 'lesson-mode-toggle';
    shell.insertBefore(toggleBar, progressBarEl || card);
    // Old ?notes=1 links now resolve to this topic's section of the textbook.
    if(notesMode){ location.replace(NOTES_HREF); return; }
    toggleBar.innerHTML = '<a href="../learn.html" class="link-quiet lesson-back-link">&larr; Back to the textbook</a><a href="' + NOTES_HREF + '" class="link-quiet">&#128221; Read this section</a>';
    if(begin.resumed){
      var resumeNote = document.createElement('div');
      resumeNote.className = 'lesson-resume-note';
      resumeNote.innerHTML = 'Resumed from where you left off (step ' + (step+1) + ' of ' + (TOTAL+1) + '). <a href="#" class="link-quiet" id="lessonStartOverLink">Start over instead</a>';
      shell.insertBefore(resumeNote, progressBarEl || card);
      resumeNote.querySelector('#lessonStartOverLink').addEventListener('click', function(e){
        e.preventDefault();
        window.OchemCurriculum.resetRun(TOPIC_ID);
        location.reload();
      });
    }
  })();

  if(!notesMode) render();
})();
</script>
</body>
