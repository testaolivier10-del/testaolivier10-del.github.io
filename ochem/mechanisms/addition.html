    <h1 style="margin-bottom:4px;">Addition: the alkene attacks first.</h1>
    <p class="lede" style="margin-top:0;">An alkene is electron-rich. Everything about this mechanism follows from taking that seriously — including which carbon ends up with the halogen.</p>
  </div>

<script>
  window.OCHEM_SECTION = 'learn';
  window.OCHEM_BASE = '../';
  window.OCHEM_MECHANISM = {
  "topicId": "addition-reactions",
  "steps": [
    {
      "type": "explain",
      "eyebrow": "Setup",
      "title": "The pi bond is the nucleophile.",
      "bodyHtml": "<p class=\"step-body\">In substitution and elimination the alkyl halide was the electrophile and something else attacked it. Here it is the other way round: the <b>alkene</b> is the electron-rich species, and it goes looking for something to attack.</p><p class=\"step-body\">Propene and H–Br. The pi bond sits above and below the C=C, loosely held and available; H–Br is polarized with hydrogen at the δ+ end.</p>",
      "molecule": "propene-hbr"
    },
    {
      "type": "draw",
      "eyebrow": "Step 1 · Attack",
      "title": "Push the pi bond at the proton.",
      "bodyHtml": "<p class=\"step-body\">Two arrows. The alkene attacks, and because hydrogen cannot take a fifth bond, something has to break at the same moment.</p>",
      "molecule": "propene-hbr",
      "concepts": [
        "alkene-pi-nucleophile",
        "curved-arrow-direction"
      ],
      "arrows": [
        {
          "from": "bond:c1-c2",
          "to": "hbrH"
        },
        {
          "from": "bond:hbrH-hbrBr",
          "to": "hbrBr"
        }
      ],
      "why": "The pi electrons become a new C–H sigma bond, and the H–Br bond breaks so bromide leaves with the pair. What is left behind is a carbocation on the carbon that did NOT get the hydrogen.",
      "wrong": {
        "bond:c1-c2>hbrBr": "You attacked the bromine. In H–Br the bromine is the electronegative end — it is already electron-rich, and two electron-rich species repel. The δ+ hydrogen is the electrophile here.",
        "hbrH>bond:c1-c2": "That arrow runs backwards. The electrons live in the pi bond, so the pi bond is the tail; a hydrogen with one bond has no pair to give away.",
        "hbrBr>bond:c1-c2": "Bromide is not the attacker. It only arrives after the carbocation forms — at this stage it is still attached to the hydrogen, and it leaves rather than attacks."
      },
      "nextLabel": "Where did the charge land?"
    },
    {
      "type": "mcq",
      "eyebrow": "Step 2 · The intermediate",
      "title": "Which carbocation actually forms?",
      "bodyHtml": "<p class=\"step-body\">The proton could in principle have gone to either alkene carbon, giving two different carbocations. Only one of them matters.</p>",
      "options": [
        "The secondary cation — the proton adds to the terminal CH₂, leaving the charge on the middle carbon",
        "The primary cation — the proton adds to the middle carbon, leaving the charge on the terminal CH₂",
        "Both form in equal amounts, since both are possible"
      ],
      "correctIndex": 0,
      "concepts": [
        "carbocation-stability",
        "markovnikov-regiochem"
      ],
      "why": "Secondary beats primary by a wide margin — two alkyl groups donate electron density into the empty p orbital instead of one. The transition state leading to it is lower, so that is the path taken.",
      "wrong": {
        "1": "That would put the positive charge on a primary carbon, which is far less stable. The two alkyl groups on the middle carbon are exactly what stabilize the charge there.",
        "2": "They are not equally accessible. The difference between a secondary and a primary carbocation is worth tens of kJ/mol, which is more than enough to make one pathway dominate completely."
      },
      "nextLabel": "Finish the mechanism"
    },
    {
      "type": "explain",
      "eyebrow": "Step 3 · Capture",
      "title": "Bromide comes back in.",
      "bodyHtml": "<p class=\"step-body\">The carbocation is planar and desperately electron-poor. Bromide — which left in step 1 and is sitting right there — attacks it, and the reaction is over.</p><p class=\"step-body\">So the bromine ends up on the <b>more substituted</b> carbon. That is Markovnikov's rule, and notice that we never needed the rule: it fell out of asking which carbocation was more stable.</p>"
    },
    {
      "type": "mcq",
      "eyebrow": "Step 4 · Stereochemistry",
      "title": "The starting alkene was flat. What about the product?",
      "bodyHtml": "<p class=\"step-body\">Suppose the carbocation carbon ends up bonded to four different groups.</p>",
      "options": [
        "A racemic mixture — the planar cation can be attacked from either face",
        "A single enantiomer — bromide returns to the face it left from",
        "A single enantiomer — the alkene's geometry is preserved"
      ],
      "correctIndex": 0,
      "concepts": [
        "stereochemical-outcome",
        "carbocation-stability"
      ],
      "why": "The carbocation is sp² and planar, so bromide can approach from above or below at essentially equal rates. Any stereochemical information the alkene carried is destroyed the moment the cation forms.",
      "wrong": {
        "1": "Bromide is a free ion in solution by then — it has no memory of which side it came from, and nothing holds it to that face.",
        "2": "The alkene's geometry is lost when the pi bond is consumed. Preserved geometry is the signature of a CONCERTED addition, like bromination through a bridged bromonium ion."
      },
      "nextLabel": "One more"
    },
    {
      "type": "final",
      "eyebrow": "Challenge",
      "title": "HBr is added to 3-methyl-1-butene. The major product has the bromine on C2 — but a significant amount has it on C3 instead. Why?",
      "bodyHtml": "<p class=\"step-body\">No hints. Think about what the first-formed cation could do before bromide reaches it.</p>",
      "options": [
        "The secondary cation at C2 undergoes a hydride shift to the neighbouring tertiary position, and bromide captures whichever cation it meets",
        "Bromide attacks C3 directly because it is less hindered",
        "The reaction switched to an anti-Markovnikov radical pathway partway through"
      ],
      "correctIndex": 0,
      "concepts": [
        "carbocation-rearrangement",
        "carbocation-stability"
      ],
      "why": "A hydride on the adjacent carbon migrates with its bonding pair, converting the secondary cation into a more stable tertiary one. Rearrangement is the classic tell that a mechanism goes through a free carbocation — it is impossible in a concerted reaction, which is exactly why hydroboration never shows it.",
      "wrong": {
        "1": "Sterics do not override carbocation stability here, and in any case bromide attacks the carbon carrying the positive charge — it does not get to choose.",
        "2": "Radical (anti-Markovnikov) addition needs peroxides present, and it would put the bromine on the LESS substituted carbon, not on a more substituted one."
      }
    }
  ]
};
