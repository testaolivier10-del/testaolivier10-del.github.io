    <h1 style="margin-bottom:4px;">EAS: break aromaticity, then get it back.</h1>
    <p class="lede" style="margin-top:0;">Benzene is a nucleophile like any alkene — it is just an unusually reluctant one, and the whole mechanism is about what it will do to become aromatic again.</p>

      "bodyHtml": "<p class=\"step-body\">An ordinary alkene attacks an electrophile readily. Benzene's pi electrons are delocalized around all six carbons, and attacking costs it the aromatic stabilization that delocalization buys — roughly 36 kcal/mol. So it needs a much stronger electrophile, usually one generated by a Lewis acid.</p>",

    {

      "molecule": "benzene",
      "concepts": [
        "eas-mechanism",
        "alkene-pi-nucleophile",
        "curved-arrow-direction"
      ],
      "arrows": [

          "from": "bond:c1-c2",

      "why": "The pi electrons form a bond to the electrophile at C1. The ring is no longer aromatic: one carbon is now sp³, the loop of conjugation is broken, and a positive charge is spread over the remaining five carbons. This is the arenium ion (sigma complex), and it is the high-energy step.",

      "eyebrow": "Step 2 · The fork",
      "title": "The arenium ion could be captured by a nucleophile, or it could lose a proton. Which happens, and why?",
      "bodyHtml": "<p class=\"step-body\">An ordinary alkene would be captured — that is addition. Benzene does something else.</p>",
      "options": [
        "It loses a proton from the sp³ carbon, restoring aromaticity — worth far more than the new bond capture would gain",
        "It is captured by bromide, giving an addition product",
        "It stays as the arenium ion, which is the isolated product"

      "correctIndex": 0,
      "concepts": [

      "wrong": {
        "1": "That is what an alkene does. For benzene it would mean giving up aromatic stabilization permanently, which the small gain from one new sigma bond cannot pay for.",
