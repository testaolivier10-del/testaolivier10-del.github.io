    <h1 style="margin-bottom:4px;">Claisen: the aldol’s substitution cousin.</h1>
    <p class="lede" style="margin-top:0;">Same opening move as an aldol. The difference is that an ester has a leaving group — so the tetrahedral intermediate collapses instead of stopping.</p>

  window.OCHEM_SECTION = 'learn';
  window.OCHEM_BASE = '../';
  window.OCHEM_MECHANISM = {
  "topicId": "claisen",
  "steps": [
    {
      "type": "explain",
      "eyebrow": "Setup",
      "title": "One difference from the aldol.",
      "bodyHtml": "<p class=\"step-body\">An aldol attacks a ketone or aldehyde, where the tetrahedral intermediate has nothing to expel and simply gets protonated. An ester carries an <b>OR group</b>, so the intermediate can collapse — and addition becomes substitution.</p><p class=\"step-body\">Methyl acetate, with ethoxide about to remove an alpha hydrogen.</p>",
      "molecule": "methyl-acetate"
    },
    {
      "type": "draw",
      "eyebrow": "Step 1 · Enolate",
      "title": "Base removes an alpha hydrogen. Show where the electrons go.",
      "bodyHtml": "<p class=\"step-body\">Two arrows — exactly the enolate formation you drew in the aldol.</p>",
      "molecule": "methyl-acetate",
      "concepts": [
        "alpha-acidity",
        "enolate-formation"
      ],
      "arrows": [
        {
          "from": "bond:ca-h1",
          "to": "bond:c-ca"
        },
        {
          "from": "bond:c-o1",
          "to": "o1"
        }
      ],
      "hint": "The C–H electrons become a pi bond toward the carbonyl carbon, and the C=O gives way onto oxygen.",
      "why": "The ester enolate. An ester's alpha hydrogen is less acidic than a ketone's — around pKa 25 rather than 20, because the carbonyl is already partly satisfied by the alkoxy oxygen's donation — which is why Claisen conditions need an alkoxide base rather than hydroxide.",
      "wrong": {
        "bond:ca-h1>ca": "A bare carbanion is far too unstable. The electrons continue into a pi bond toward the carbonyl, which is what the resonance stabilization actually is.",
        "bond:c-o1>c": "Backwards — the pi electrons go to the electronegative oxygen."
      },
      "nextLabel": "Attack the second ester"
    },
    {
      "type": "draw",
      "eyebrow": "Step 2 · Add, then eliminate",
      "title": "The enolate attacks a second ester. Draw the addition and the collapse.",
      "bodyHtml": "<p class=\"step-body\">Three arrows on the molecule being attacked: the C=O opens, then reforms and pushes out the leaving group.</p>",
      "molecule": "methyl-acetate",
      "concepts": [
        "tetrahedral-intermediate",
        "claisen-connectivity",
        "leaving-group-ability"
      ],
      "arrows": [
        {
          "from": "bond:c-o1",
          "to": "o1"
        },
        {
          "from": "o1",
          "to": "bond:c-o1"
        },
        {
          "from": "bond:c-o2",
          "to": "o2"
        }
      ],
      "hint": "Open the C=O, bring it back down, and send the alkoxy group away with its electrons.",
      "why": "Addition then elimination — the same two-part move as any acyl substitution. The alkoxide leaves, and what you have made is a beta-ketoester: a ketone and an ester two carbons apart.",
      "wrong": {
        "bond:c-ca>ca": "The alkyl group would have to leave as a carbanion. The alkoxy group is the leaving group here.",
        "o1>c": "Reforming the C=O means aiming at the C–O bond. Pointing at the carbon would give it five bonds.",
        "c>o2": "The tail belongs on the C–O bond that breaks — carbon has no lone pair to donate."
      },
      "nextLabel": "What drives it?"
    },
    {
      "type": "mcq",
      "eyebrow": "Step 3 · The driving force",
      "title": "Each step so far is reversible. What makes the Claisen go to completion?",
      "bodyHtml": "<p class=\"step-body\">Look at the product you just made and ask what the base does to it.</p>",
      "options": [
        "The alkoxide leaving group escapes as a gas",
        "The beta-ketoester's alpha hydrogen sits between two carbonyls at about pKa 11, so the base deprotonates it irreversibly and pulls the equilibrium across",
        "The product precipitates out of solution"
      ],
      "correctIndex": 1,
      "concepts": [
        "claisen-connectivity",
        "alpha-acidity"
      ],
      "why": "That doubly-stabilized enolate is the thermodynamic sink. It is also why a full equivalent of base is needed rather than a catalytic amount, and why an acidic workup is required at the end to protonate the product back.",
      "wrong": {
        "0": "Alkoxides stay in solution — nothing escapes. Compare this with SOCl₂ reactions, where gases genuinely do drive things forward.",
        "2": "Solubility is not the driver. The reaction is pulled by an acid–base step, not by a phase change."
      },
      "nextLabel": "Last one"
    },
    {
      "type": "final",
      "eyebrow": "Challenge",
      "title": "An ester with only ONE alpha hydrogen fails to give a Claisen product in decent yield. Why?",
      "bodyHtml": "<p class=\"step-body\">Follow the driving force you just identified through to that case.</p>",
      "options": [
        "One alpha hydrogen is not acidic enough to be removed at all",
        "The product is too crowded to form",
        "After the condensation there is no alpha hydrogen left between the two carbonyls, so the deprotonation that drives the reaction cannot happen and everything stays reversible"
      ],
      "correctIndex": 2,
      "concepts": [
        "claisen-connectivity",
        "alpha-acidity"
      ],
      "why": "The single alpha hydrogen is used up making the enolate, so the beta-ketoester product has none left in that position. Without the final irreversible deprotonation there is nothing to pull the equilibrium over, and the reaction sits back at starting material.",
      "wrong": {
        "0": "One alpha hydrogen is just as acidic as any other — the enolate forms fine. The problem appears later, at the driving-force step.",
        "1": "Sterics are not the obstacle. The mechanism runs; it simply does not stay run without the final deprotonation."
      }
    }
  ]
