    <h1 style="margin-bottom:4px;">Substitution, by way of addition.</h1>
    <p class="lede" style="margin-top:0;">Carboxylic acid derivatives do not substitute the way an alkyl halide does. They add first, then eliminate — and which one leaves decides everything.</p>

      "title": "No backside attack here.",
      "bodyHtml": "<p class=\"step-body\">An SN2 replaces a leaving group in one concerted motion. A carbonyl cannot do that — there is no room behind an sp² carbon and no need, because the pi bond gives the incoming electrons somewhere to go.</p><p class=\"step-body\">So the sequence is <b>addition first, elimination second</b>. Methyl acetate, with a nucleophile on the way in.</p>",

      },
      "nextLabel": "Now collapse it"
    },
    {
      "type": "draw",
      "eyebrow": "Step 2 · Eliminate",
      "title": "Collapse the intermediate and push out the leaving group.",
      "bodyHtml": "<p class=\"step-body\">Two arrows. This is the step a ketone cannot do, and it is what turns addition into substitution.</p>",
      "molecule": "methyl-acetate",
      "concepts": [
        "tetrahedral-intermediate",
        "leaving-group-ability",
        "curved-arrow-direction"

      "arrows": [
