<script>
/* Search across the whole Organic Chemistry course.

   learn.html's rail already searches the textbook, but only the textbook, and
   only the sections that happen to have been fetched already. That leaves the
   58 lessons, the 10 mechanism walkthroughs, the 7 tools and 1,860 questions in the practice bank with no way in at all: someone who cannot remember whether
   anti-periplanar is explained in a lesson, in a mechanism walkthrough or in
   the textbook had to guess. NREMT has had this page for a long time; this is
   the same page for the other course.

   Five sources, all of them derived rather than listed:

     curriculum.js   is the single source of truth for what exists, so the
                     lessons and mechanisms come from it rather than a second
                     list here that could disagree with it — the same rule the
                     textbook, the mastery dashboard and check-site all follow.
     notes/<id>.html the written course, one fragment per topic.
     tools-registry  the seven tools, same registry tools.html renders from.
     practice-bank   1,860 questions, stems and explanations.

   Everything is fetched in parallel and every source is allowed to fail on its
   own: offline, a reader should get whatever is in the cache rather than an
   empty page. The status line says what actually made it in. */
document.addEventListener('DOMContentLoaded', function(){
  var S = window.LevlSearch;
  var CU = window.OchemCurriculum;
  var statusEl = document.getElementById('searchStatus');
  var resultsEl = document.getElementById('results');
  var filtersEl = document.getElementById('searchFilters');
  var searchBox = document.getElementById('searchBox');

  var INDEX = [];
  var activeKind = 'all';

  // Ordered as the filter row renders them, most specific first. 'Textbook'
  // leads because prose is what a question-shaped query usually wants.
  var KINDS = ['Textbook', 'Lessons', 'Mechanisms', 'Tools', 'Practice questions'];

  function topics(){
    if(!CU || !CU.MODULES) return [];
    var out = [];
    CU.MODULES.forEach(function(m){
      (m.topics || []).forEach(function(t){ out.push({ topic: t, module: m }); });
    });
    return out;
  }

  /* The lessons and mechanisms, from the curriculum rather than from disk.
     A topic with no href is one the course says is coming and has no page, so
     it is not a result — a search hit that leads to "coming soon" is worse
     than no hit.

     Weighted above prose on purpose: someone searching "aldol" wants the aldol
     lesson at the top, not the ninetieth practice question that mentions it. */
  function structureChunks(){
    var out = [];
    topics().forEach(function(e){
      var t = e.topic;
      if(!t.href) return;
      var isMech = t.href.indexOf('mechanisms/') === 0;
      out.push({
        page: isMech ? 'Mechanisms' : 'Lessons',
        file: t.href,
        heading: t.title,
        text: t.title + ' — ' + e.module.title + '. ' +
              (isMech ? 'Click-through mechanism walkthrough: identify the nucleophile and electrophile, push the arrows, predict the product.'
                      : 'Interactive lesson: explain, visualize, interact, guided and independent practice, then a challenge.'),
        weight: 3,
      });
      // A topic can have a lesson AND a separate mechanism walkthrough.
      if(t.mechanism){
        out.push({
          page: 'Mechanisms',
          file: t.mechanism,
          heading: t.title + ' — mechanism',
          text: 'The ' + t.title.toLowerCase() + ' mechanism, step by step: ' + e.module.title + '.',
          weight: 3,
        });
      }
    });
    return out;
  }

  function toolChunks(){
    if(!window.OchemTools || !window.OchemTools.ALL) return [];
    return window.OchemTools.ALL.map(function(t){
      return {
        page: 'Tools',
        file: 'tools/' + t.slug + '.html',
        heading: t.name,
        text: t.tagline + ' ' + t.blurb + ' Teaches: ' + t.teaches,
        weight: 3,
      };
    });
  }

  /* One chunk per top-level block of a note fragment, so a hit points at the
     paragraph rather than the chapter. The fragments are plain HTML with no
     <head>, which DOMParser handles by wrapping them in a document — the
     blocks are then just the body's descendants. */
  function noteChunks(id, title, moduleTitle, html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style').forEach(function(n){ n.remove(); });
    var out = [];
    var heading = title;
    doc.body.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,td,figcaption').forEach(function(el){
      var tag = el.tagName.toLowerCase();
      var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if(!text) return;
      if(/^h[1-4]$/.test(tag)){ heading = text; return; }
      // Short fragments are labels and table cells, not prose worth a result.
      if(text.length < 25) return;
      out.push({
        page: 'Textbook',
        // The textbook opens the right chapter from a topic hash, so this
        // lands on the section; the text fragment added at render time scrolls
        // to the paragraph within it.
        file: 'learn.html#' + id,
        heading: title === heading ? title : title + ' — ' + heading,
        text: text,
        moduleTitle: moduleTitle,
      });
    });
    return out;
  }

  function fetchNotes(){
    var list = topics();
    return Promise.all(list.map(function(e){
      return fetch('notes/' + e.topic.id + '.html', { credentials: 'omit' })
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function(html){ return noteChunks(e.topic.id, e.topic.title, e.module.title, html); })
        // A topic with no written notes yet is not an error; nor is one that
        // failed to fetch. Either way it contributes nothing and the rest of
        // the index is unaffected.
        .catch(function(){ return []; });
    })).then(function(all){
      return all.reduce(function(a, b){ return a.concat(b); }, []);
    });
  }

  /* The practice bank. Both the stem and the explanation are indexed: the
     explanations are where most of the prose is, and a student searching
     "why is the axial position worse" is searching an explanation.

     There is no per-question deep link in this course the way there is in
     NREMT's practice.html, so a question result opens the textbook section for
     its topic — which is the thing a person who searched for the idea actually
     wanted. The result says so rather than pretending to open the question. */
  function fetchQuestions(){
    return fetch('assets/practice-bank.json', { credentials: 'omit' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(bank){
        var byId = {};
        topics().forEach(function(e){ byId[e.topic.id] = e; });
        var out = [];
        Object.keys(bank).forEach(function(topicId){
          var meta = byId[topicId];
          var title = meta ? meta.topic.title : topicId;
          (bank[topicId] || []).forEach(function(q){
            out.push({
              page: 'Practice questions',
              file: 'learn.html#' + topicId,
              heading: title,
              text: (q.q || '') + ' ' + (q.why || ''),
              isQuestion: true,
              // Below prose and structure: a question that mentions a term is
              // weaker evidence than a section that explains it.
              weight: 0.8,
            });
          });
        });
        return out;
      })
      .catch(function(){ return []; });
  }

  function countsByPage(){
    var c = {};
    INDEX.forEach(function(x){ c[x.page] = (c[x.page] || 0) + 1; });
    return c;
  }

  function renderFilters(){
    var counts = countsByPage();
    var buttons = [['all', 'Everything', INDEX.length]];
    KINDS.forEach(function(k){ if(counts[k]) buttons.push([k, k, counts[k]]); });
    filtersEl.innerHTML = buttons.map(function(b){
      return '<button type="button" data-kind="' + S.escapeHtml(b[0]) + '" aria-pressed="' +
        (b[0] === activeKind ? 'true' : 'false') + '">' + S.escapeHtml(b[1]) +
        ' <span>' + b[2].toLocaleString() + '</span></button>';
    }).join('');
    filtersEl.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        activeKind = btn.dataset.kind;
        renderFilters();
        runSearch(searchBox.value.trim());
      });
    });
  }

  function buildIndex(){
    if(!CU || !CU.MODULES){
      statusEl.textContent = 'The course outline didn’t load, so there is nothing to search yet. Reload the page.';
      return;
    }
    // Structure first and synchronously, so a query typed immediately finds
    // the lessons while the megabyte of prose is still arriving.
    INDEX = structureChunks().concat(toolChunks());
    renderFilters();
    if(searchBox.value.trim()) runSearch(searchBox.value.trim());

    Promise.all([fetchNotes(), fetchQuestions()]).then(function(parts){
      INDEX = INDEX.concat(parts[0]).concat(parts[1]);
      var counts = countsByPage();
      var bits = [];
      if(counts['Lessons'] || counts['Mechanisms']) {
        bits.push(((counts['Lessons'] || 0) + (counts['Mechanisms'] || 0)) + ' lessons and mechanisms');
      }
      if(counts['Textbook']) bits.push(counts['Textbook'].toLocaleString() + ' textbook passages');
      if(counts['Practice questions']) bits.push(counts['Practice questions'].toLocaleString() + ' practice questions');
      if(counts['Tools']) bits.push(counts['Tools'] + ' tools');

      // Name what is MISSING rather than only what is present: offline, the
      // difference between "the bank isn't here" and "your search found
      // nothing" is the whole difference between a working page and a broken
      // one, and the reader cannot tell them apart from an empty result list.
      var missing = [];
      if(!counts['Textbook']) missing.push('the textbook');
      if(!counts['Practice questions']) missing.push('the practice bank');
      statusEl.textContent = 'Searching ' + bits.join(', ') + '. Type to search.' +
        (missing.length ? ' ' + missing.join(' and ') + ' couldn’t be loaded — reconnect once and they’ll be included next time.' : '');
      renderFilters();
      if(searchBox.value.trim()) runSearch(searchBox.value.trim());
    });
  }

  function runSearch(q){
    if(!q){ resultsEl.innerHTML = ''; return; }
    var pool = activeKind === 'all' ? INDEX : INDEX.filter(function(c){ return c.page === activeKind; });
    var hits = S.rank(pool, q, { limit: 40, maxPerSource: 2 });
    var terms = S.tokenize(q);

    if(!hits.length){
      resultsEl.innerHTML = '<p class="empty-note">No results for &ldquo;' + S.escapeHtml(q) + '&rdquo;' +
        (activeKind === 'all' ? '.' : ' in ' + S.escapeHtml(activeKind) + ' — try Everything.') + '</p>';
      return;
    }

    resultsEl.innerHTML = hits.map(function(c){
      // A textbook hit already carries the section hash; adding a text fragment
      // to it scrolls to the paragraph inside that section. A lesson, mechanism
      // or tool is a whole page about the thing, so there is nothing to scroll
      // to and a fragment would only risk landing mid-page.
      var href = c.page === 'Textbook' ? S.textFragment(c.file, terms) : c.file;
      var label = c.isQuestion ? 'Practice question — opens the section it covers' : c.page;
      return '<a class="result" href="' + S.escapeHtml(href) + '">' +
        '<div class="result-page">' + S.escapeHtml(label) + '</div>' +
        '<div class="result-heading">' + S.escapeHtml(c.heading) + '</div>' +
        '<div class="result-snippet">' + c.snippet + '</div>' +
      '</a>';
    }).join('');
  }

  var debounceTimer;
  searchBox.addEventListener('input', function(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){ runSearch(searchBox.value.trim()); }, 120);
  });

  var params = new URLSearchParams(location.search);
  if(params.get('q')) searchBox.value = params.get('q');

  buildIndex();
});
</script>
<script src="assets/ochem-nav.js" defer></script>
