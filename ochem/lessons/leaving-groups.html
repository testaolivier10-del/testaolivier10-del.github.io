<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'leaving-groups',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('sn2-bromoethane', { caption: 'Bromide is a good leaving group because it is a weak base — it is stable holding the electron pair it walks away with.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A good leaving group is a weak base.',
        bodyHtml: '<div class="term-primer"><span class="term-primer-head">First: acid, base, strong, weak, conjugate</span><p>This lesson leans on acid/base words, and Module 3 is where they get built properly — so here are the one-line versions you need right now.</p><p>An <b>acid</b> gives away an H⁺ (a bare proton). A <b>base</b> takes an H⁺, using a lone pair of electrons to grab it.</p><p><b>Strong</b> and <b>weak</b> just say how eagerly: a <b>strong acid</b> (HCl, HBr, HI) hands its proton over completely, a <b>weak acid</b> (water, an alcohol) mostly holds on to it. Same for bases — a <b>strong base</b> grabs protons hard, a <b>weak base</b> barely bothers.</p><p>Whatever is left after an acid loses its H⁺ is its <b>conjugate base</b>: HCl → Cl⁻, H₂O → OH⁻. The two are a see-saw — an acid gives its proton up easily exactly when what&rsquo;s left behind is stable and doesn&rsquo;t want it back. So <b>strong acid ⇒ weak conjugate base</b>, and weak acid ⇒ strong conjugate base.</p><p>That see-saw is the only reason a leaving-group lesson talks about bases at all: <b>&ldquo;weak base&rdquo; is shorthand for &ldquo;perfectly content sitting alone with an extra electron pair&rdquo;</b> — which is exactly what a group has to be to walk away.</p></div><p class="step-body">When a leaving group departs, it takes a bonding pair of electrons with it. A <b>good</b> leaving group is one that\'s <b>stable on its own</b> once it has those electrons — in other words, a <b>weak base</b> (the conjugate base of a strong acid).</p><div class="term-primer"><span class="term-primer-head">Also: substitution, elimination</span><p>Two reaction names used below. Module 6 teaches them properly — they turn up this early only because both of them need a leaving group, which is the whole point of this lesson.</p><p><b>Substitution</b> swaps one group on a carbon for another: something new attaches to the carbon, and the old group departs. <b>Elimination</b> instead strips the group off one carbon and an H off the carbon next door, and the two leftover electrons become a <b>C=C double bond</b>.</p><p>Different outcomes, same requirement: in both, a group has to break off the carbon and take the bonding electrons with it.</p></div><p class="step-body">Poor leaving groups — OH⁻, NH₂⁻, CH₃⁻ — are strong bases that don\'t want the negative charge, so they resist leaving at all. The reason is <b>where that charge ends up</b>. Oxygen in HO⁻ is a small atom, so the charge stays crammed onto it; nitrogen in H₂N⁻ is less electronegative and holds it even worse; carbon in H₃C⁻ isn\'t electronegative at all and has no business carrying a lone pair. Contrast I⁻, where the charge sits on a big, polarizable atom and is spread thin across a large electron cloud.</p><div class="explain-box"><b>Why spreading charge out matters — the one idea under this whole lesson.</b> A negative charge is a pile of electrons, and like charges repel. Squeeze that charge into a small space and the electrons are crowded, pushing against each other: that repulsion is stored energy, and <b>high energy means unstable</b>. Give the same charge more room — a bigger atom, or several atoms sharing it — and the repulsion eases. <b>Lower energy = more stable = more willing to exist on its own = better leaving group.</b> Everything that follows (why I⁻ beats Cl⁻, why tosylate is excellent, why HO⁻ is hopeless) is this one principle applied to different structures.</div><p class="step-body" style="margin-bottom:0;">Which is why an alcohol won\'t do a substitution or elimination as it stands — its OH has to be <b>activated</b> first. That\'s the next step.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Activating an alcohol = swapping the bad leaving group for a good one.',
        bodyHtml: '<p class="step-body">You never talk hydroxide into leaving. <b>Activation</b> means chemically converting that OH into something else — something whose anion is stable — <i>before</i> you run the reaction. Two standard routes:</p>' +
          '<p class="step-body"><b>1. Protonate it (acid).</b> Add strong acid and the oxygen\'s lone pair grabs an H⁺: R–OH becomes R–OH₂⁺. The group that leaves is now <b>water</b> — neutral, and the conjugate base of H₃O⁺ (pKa ≈ −1.7) instead of the conjugate base of water (15.7). That\'s a swing of roughly 17 pKa units, from hopeless to workable. It\'s why dehydrating an alcohol to an alkene calls for H₂SO₄ and heat, and why you make an alkyl bromide with HBr rather than NaBr.</p>' +
          '<p class="step-body"><b>2. Make a tosylate (TsCl).</b> R–OH becomes R–OTs. The leaving group is now TsO⁻, whose charge is spread by resonance across three oxygens — very stable, very weak base, excellent leaving group. This route is mild and neutral, and the C–O bond is never broken while you do it, so a stereocenter on that carbon keeps its configuration.</p>' +
          '<div class="explain-box">Either way the logic is identical: <b>don\'t fight the leaving group — replace it.</b> If you ever write a mechanism that kicks out HO⁻, it\'s wrong.</div>'
      },
      {
        render: function(api){
          var halides = [
            { key: 'f', label: 'F⁻' },
            { key: 'cl', label: 'Cl⁻' },
            { key: 'br', label: 'Br⁻' },
            { key: 'i', label: 'I⁻' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the best leaving group among the halides.</h2>' +
            '<p class="step-body">All four are decent leaving groups compared to OH⁻, but they\'re not equal to each other.</p>' +
            '<div class="choice-row">' + halides.map(function(h){
              return '<button class="choice-btn" data-v="' + h.key + '" style="text-align:center;font:900 18px var(--font-mono);">' + h.label + '</button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'i';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'I⁻ is the best leaving group of the halides. It\'s the weakest base of the four (largest, most polarizable, and the anion is the most stable), even though it\'s also the weakest conjugate base you\'d normally expect to trade off against nucleophilicity.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A good leaving group is generally...',
        options: ['A strong base — it needs to hold the electrons tightly', 'A weak base — stable on its own once it leaves', 'A strong nucleophile'],
        correctIndex: 1,
        correctFeedback: 'Correct — stability after leaving is the whole story.',
        wrongFeedback: 'A strong base doesn\'t want extra negative charge — it fights leaving rather than accepting it.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Which is the better leaving group: Cl⁻ or OH⁻?',
        options: ['OH⁻ — it\'s smaller and lighter', 'They\'re about equal', 'Cl⁻ — a much weaker base and a more stable anion on its own'],
        correctIndex: 2,
        correctFeedback: 'Correct. Cl⁻ is the conjugate base of a strong acid (HCl) and is very stable as an anion; OH⁻ is the conjugate base of water, a much weaker acid, so OH⁻ is a much stronger (and more reluctant) base.',
        wrongFeedback: 'Compare their conjugate acids: HCl is a strong acid, water is not. The weaker the conjugate acid, the stronger (and worse-leaving) the base.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'You can put an actual number on "weak base": pKaH.',
        bodyHtml: '<div class="term-primer"><span class="term-primer-head">First: what pKa is</span><p><b>pKa</b> is a single number for how tightly a molecule holds on to its H⁺. <b>Lower pKa = stronger acid = gives the proton away more easily.</b> It is a log scale, so each unit is a factor of 10, and it can go negative (HCl at ≈ −7 gives up its proton ferociously). Treat it as an acidity thermometer for now; Module 3 builds the full framework.</p></div><p class="step-body">"Weak base" isn\'t just a qualitative label — you can rank leaving groups precisely using the pKa of the leaving group\'s <b>conjugate acid</b> (sometimes written pKaH, for "pKa of the protonated/H form"). <b>Lower pKaH means a weaker base, means a better leaving group</b> — you\'ll get the full pKa framework in Module 3, but the numbers already make the trend concrete: HI (pKa ≈ −10), HBr (≈ −9), HCl (≈ −7) are all strong acids, so I⁻, Br⁻, Cl⁻ are all weak bases and good leaving groups, in exactly that order (I⁻ best, from the lowest pKaH). Water (pKa ≈ 15.7) is a much weaker acid, so OH⁻ is a much stronger base and a poor leaving group — matching everything you just saw.</p><p class="step-body" style="margin-bottom:0;">This single number — the pKa of what\'s left behind after the leaving group grabs a proton — is the actual quantitative tool chemists use to rank leaving group ability, not just "does it feel like a strong or weak base."</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'No leaving group, no reaction.',
        bodyHtml: '<div class="term-primer"><span class="term-primer-head">First: what SN1, SN2, E1 and E2 are</span><p>Four reaction names you\'ll meet constantly. Module 6 gives each its own lesson — but the labels are descriptive, not arbitrary, so you can read them right now.</p><p><b>The letter says which reaction it is.</b> <b>S</b> = substitution, <b>E</b> = elimination — the two you met in step 1. The <b>N</b> in S<sub>N</sub> stands for <i>nucleophilic</i>: the group coming in is a <b>nucleophile</b>, an electron-rich species that attacks the carbon.</p><p><b>The number says how many species take part in the slowest step</b> — the bottleneck that sets the reaction\'s speed. <b>1</b> means one: the molecule ionizes by itself first, the leaving group departing unassisted, and only then does the nucleophile or base move in. <b>2</b> means two: the leaving group departs at the same moment the nucleophile or base attacks, all in one motion.</p><p>So SN1 is a substitution where the leaving group goes first; SN2 is a substitution where it goes as the nucleophile arrives; E1 and E2 are those same two timings for an elimination. <b>All four are just different choreography around the same event — a leaving group departing.</b></p></div>' +
          '<div class="explain-box">Which is why all four require a leaving group to depart at some point in the mechanism. If the leaving group is poor (like OH⁻ on an unactivated alcohol), the reaction simply won\'t proceed — no matter how good the nucleophile or base is. You\'ll see this constantly once you get to Module 6.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Tosylate (OTs⁻) is an excellent leaving group because its negative charge is...',
        options: ['Delocalized (resonance-stabilized) across the sulfonate group, making it a very weak base', 'Localized entirely on one oxygen, making it easy to find', 'Nonexistent — tosylate is a neutral leaving group'],
        correctIndex: 0,
        correctFeedback: 'Correct. <b>Delocalized</b> just means the charge is not stuck on one atom — in tosylate it is shared across three oxygens via resonance (the same idea from the Resonance lesson). That is the principle from step 1 doing its work: the same one unit of negative charge spread over three atoms instead of crammed onto one means far less electron–electron repulsion, so far lower energy. Low energy = stable = a very weak base = an excellent leaving group, which is exactly why chemists convert poor leaving groups like OH⁻ into tosylates before a substitution.'
      }
    ]
  });
})();
</script>
