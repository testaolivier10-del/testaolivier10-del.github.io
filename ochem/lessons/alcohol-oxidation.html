<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Reagent -> product for a PRIMARY alcohol. The whole section reduces to
     this one table, and the split is anhydrous vs aqueous rather than weak vs
     strong, which is the thing students get backwards. */
  var CASES = [
    { id:'o1', r:'PCC, anhydrous CH₂Cl₂', right:'ald',
      why:'Cr(VI) with no water present. The aldehyde cannot form its hydrate, so there is no second alcohol for the reagent to oxidize, and it stops.' },
    { id:'o2', r:'CrO₃, H₂SO₄, H₂O (Jones)', right:'acid',
      why:'Cr(VI) WITH water. The aldehyde hydrates to a gem-diol, which is an alcohol again, so it gets oxidized a second time — through to the carboxylic acid.' },
    { id:'o3', r:'Swern: (COCl)₂, DMSO, −78&nbsp;°C, then Et₃N', right:'ald',
      why:'No metal and no water. Mild enough for sensitive substrates, and it stops cleanly at the aldehyde.' },
    { id:'o4', r:'Dess–Martin periodinane, room temperature', right:'ald',
      why:'Hypervalent iodine, also metal-free and anhydrous. Same stopping point as the Swern without needing a cryogenic step.' }
  ];
  var OUT = [{k:'ald',l:'Aldehyde'},{k:'acid',l:'Carboxylic acid'},{k:'none',l:'No reaction'}];

  window.OchemLessonEngine.start({
    topicId: 'alcohol-oxidation',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'What each class of alcohol can become.',
        bodyHtml: '<ul class="step-body">' +
          '<li><b>Primary</b> — two hydrogens on the carbinol carbon, so two rungs available: aldehyde, then carboxylic acid.</li>' +
          '<li><b>Secondary</b> — one hydrogen, so one rung: ketone, and it stops there whatever reagent you use.</li>' +
          '<li><b>Tertiary</b> — no hydrogen on that carbon, so no reaction at all under ordinary oxidizing conditions.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">The secondary case is the reassuring one: a ketone has no hydrogen left on its carbonyl carbon, so it cannot go further and every reagent gives the same product. <b>The choice of reagent only matters for primary alcohols</b> — which is what the rest of this lesson is about.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Water decides where a chromium oxidation stops.',
        bodyHtml: '<p class="step-body">Chromium(VI) oxidizes an alcohol via a chromate ester, which then loses the carbinol C–H to give the carbonyl. For a primary alcohol that gives an aldehyde — and an aldehyde <b>in water</b> is in equilibrium with its <b>hydrate</b>, the gem-diol formed by water adding across the C=O.</p>' +
          '<p class="step-body">That hydrate is structurally an alcohol again: OH and H on the same carbon. So the chromium reagent oxidizes it a second time, and you get the carboxylic acid. Take the water away and the hydrate never forms, so the oxidation has nothing left to grip.</p>' +
          '<div class="explain-box"><b>Anhydrous chromium reagent &rarr; aldehyde. Aqueous chromium reagent &rarr; carboxylic acid.</b><br><br>It is not about strength. Using less oxidant or a shorter reaction time does not reliably stop an aqueous oxidation at the aldehyde, because the aldehyde is consumed as fast as it appears.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Each reagent acts on the same primary alcohol. Where does it stop?</h2>' +
            '<p class="step-body">Ask one question of each: is there water in the flask?</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq">' + c.r + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Product from ' + c.r.replace(/<[^>]+>/g,'') + '">' +
                OUT.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Not that one. The substrate is a primary alcohol in every row, so the only variable is the reagent — and for the chromium ones, whether water is present.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Group them by outcome and the list is short: PCC, Swern and DMP give aldehydes; aqueous Cr(VI) gives acids.'
                  : 'All four, first time. PCC, Swern and DMP give aldehydes; aqueous Cr(VI) gives acids; all of them give ketones from secondary alcohols.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'What does Jones reagent give from a secondary alcohol?',
        options: ['A carboxylic acid','A ketone','An aldehyde','No reaction'],
        correctIndex: 1,
        correctFeedback: 'Correct. A ketone has no hydrogen left on its carbonyl carbon, so there is nothing further for the oxidant to remove. The aqueous-versus-anhydrous distinction only changes the answer for primary alcohols.',
        wrongFeedback: 'Draw the ketone that forms first and ask what the oxidant would have to remove to go further. Is there a hydrogen on that carbon?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'You need an aldehyde from a primary alcohol and the substrate is acid-sensitive. Best reagent?',
        options: ['Jones reagent','PCC','Dess–Martin periodinane','KMnO₄, hot'],
        correctIndex: 2,
        correctFeedback: 'Correct. DMP stops at the aldehyde, runs at room temperature, is metal-free and is not strongly acidic. PCC would also stop at the aldehyde but is mildly acidic, and the Swern is the other good answer if you can run it at −78 °C.',
        wrongFeedback: 'Two of these overshoot to the carboxylic acid. Of the two that stop at the aldehyde, ask which is gentler on an acid-sensitive molecule.'
      },
      {
        type: 'explain',
        eyebrow: 'In practice',
        title: 'When reagent choice cannot solve it.',
        bodyHtml: '<p class="step-body">None of these reagents distinguishes a primary alcohol from a secondary one — they oxidize whichever they find. So a molecule containing both, where you want to touch only one, cannot be solved by picking a cleverer oxidant.</p>' +
          '<p class="step-body">The answer is a <b>protecting group</b>: mask the alcohol you want to keep, oxidize, then remove the mask. For an alcohol the standard mask is a silyl ether — TBSCl with imidazole to put it on, TBAF to take it off — which you will meet properly in <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-synthesis\">Synthesis &amp; Retrosynthesis</a>. Recognizing that a selectivity problem needs protection rather than a different reagent is the actual skill, and it is what separates a reagent list from being able to plan a synthesis.</p>' +
          '<p class="step-body" style="margin-bottom:0;">One more practical note. Chromium reagents are toxic and environmentally nasty, which is why the Swern and DMP exist and why modern papers usually avoid chromium. Exams still ask about PCC and Jones constantly, so you need both — but the metal-free options are not merely alternatives, they are what a working lab reaches for first.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'Why does adding less Jones reagent not reliably stop the reaction at the aldehyde?',
        options: [
          'The reagent is consumed by the solvent first',
          'The aldehyde hydrates and is oxidized as fast as it forms',
          'Jones reagent only works in excess',
          'The aldehyde evaporates'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. The aldehyde never accumulates — in water it is in equilibrium with its gem-diol, which is an alcohol and is oxidized immediately. Stoichiometry cannot fix a problem caused by the intermediate being more reactive than the starting material; only removing the water can.',
        wrongFeedback: 'Ask what happens to the aldehyde the moment it forms, in a flask that contains water.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A molecule has a primary alcohol and a tertiary alcohol. It is treated with excess Jones reagent. What comes out?',
        options: [
          'Both are oxidized to carboxylic acids',
          'The primary becomes a carboxylic acid; the tertiary is untouched',
          'Both become ketones',
          'The primary becomes an aldehyde; the tertiary becomes a ketone'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and both halves follow from the same rule. The primary alcohol has two hydrogens on its carbinol carbon and the reagent is aqueous, so it climbs both rungs to the acid. The tertiary alcohol has no hydrogen on its carbinol carbon at all, so there is nothing to remove and excess reagent changes nothing. Counting hydrogens on the carbon bearing the OH answers both parts of the question at once.'
      }
    ]
  });

})();
});
</script>
