<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'pka',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('acetic-acid', { caption: 'Acetic acid, pKa 4.76. Two oxygens, but only the O–H proton is acidic — the alpha C–H sits far above pKa 20.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Ka measures how much an acid actually falls apart.',
        bodyHtml: '<p class="step-body">For an acid HA dissociating in solution, HA ⇌ H⁺ + A⁻, chemists define an equilibrium constant <b>Ka = [H⁺][A⁻] / [HA]</b>. A large Ka means the equilibrium sits far toward the ionized (dissociated) side — most of the acid has given up its proton — which is exactly what "strong acid" means.</p><p class="step-body" style="margin-bottom:0;">Ka values for real acids range from around 10⁷ (very strong) down to 10⁻⁵⁰ (essentially non-acidic), which is an awkward range of numbers to work with directly. So chemists take <b>pKa = −log₁₀(Ka)</b> instead — the same logarithm trick used to turn [H⁺] into pH. Because of the negative sign, this flips the direction: <b>a lower pKa means a stronger acid.</b></p>'
      },
      {
        render: function(api){
          var acids = [
            { key: 'hcl', label: 'HCl', pka: '−7' },
            { key: 'acetic', label: 'CH₃COOH', pka: '4.76' },
            { key: 'water', label: 'H₂O', pka: '15.7' },
            { key: 'ethane', label: 'CH₃CH₃', pka: '50' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the strongest acid of these four.</h2>' +
            '<p class="step-body">Each button shows the substance and its approximate pKa.</p>' +
            '<div class="choice-row">' + acids.map(function(a){
              return '<button class="choice-btn" data-v="' + a.key + '" style="text-align:center;font:900 15px var(--font-mono);">' + a.label + '<br><span style="font-weight:700;font-size:11px;color:var(--muted);">pKa ' + a.pka + '</span></button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'hcl';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'HCl has by far the lowest pKa (≈ −7) of the four, making it the strongest acid — it\'s essentially 100% dissociated in water. Ethane\'s C–H at pKa 50 is barely acidic at all — that gap of 57 pKa units is a factor of roughly 10⁵⁷ in acid strength.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A lower pKa means...',
        options: ['A weaker acid', 'A stronger acid', 'A stronger base'],
        correctIndex: 1,
        correctFeedback: 'Correct — the negative sign in pKa = −log(Ka) flips the direction, so lower pKa always means stronger acid.',
        wrongFeedback: 'Remember the negative sign: pKa = −log(Ka). A bigger Ka (stronger acid) produces a smaller (or more negative) pKa.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Acetic acid (pKa 4.76) compared to phenol (pKa 10) is...',
        options: ['A much weaker acid', 'About equally acidic', 'A much stronger acid — over 5 pKa units lower'],
        correctIndex: 2,
        correctFeedback: 'Correct. Every 1 pKa unit is a 10x change in acid strength, so a gap of about 5.24 units means acetic acid is roughly 10⁵ times more acidic than phenol.',
        wrongFeedback: 'Compare the numbers directly: lower pKa = stronger acid, and acetic acid\'s pKa (4.76) is much lower than phenol\'s (10).'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Using pKa to predict which side of a reaction wins.',
        bodyHtml: '<p class="step-body">Recall from the Brønsted lesson: a proton transfer favors the side with the <b>weaker acid</b>. Now you can make that precise — it favors the side where the acid has the <b>higher pKa</b>.</p><p class="step-body" style="margin-bottom:0;">Example: acetic acid (pKa 4.76) reacts with hydroxide (OH⁻) to form acetate and water (pKa of water ≈ 15.7). Comparing the two acids in the equation — acetic acid (4.76) on the left, water (15.7) on the right — the equilibrium overwhelmingly favors the right side, because water is the much weaker acid (higher pKa). This single comparison is how you\'ll predict the outcome of every acid-base step you draw from here on.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'pKa is the backbone of the rest of this module — and much of the course.',
        bodyHtml: '<div class="explain-box">Everything in Acidity Factors (next lesson), leaving-group ability (Module 2), nucleophile vs. base strength, and enolate chemistry (Module 11) ultimately traces back to comparing pKa values. Get comfortable with the shape of the pKa scale now — carboxylic acids around 5, alcohols around 16, alkynes around 25, amines around 38, alkanes around 50 — and huge amounts of later material becomes pattern-matching instead of memorization.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'An amine (pKaH of its conjugate acid ≈ 38 for the N–H) is deprotonated by hydroxide (conjugate acid water, pKa 15.7). Which side does this equilibrium favor?',
        options: ['The left side (the amine and hydroxide) — water is the much stronger acid here', 'The right side — the products are more stable', 'It\'s a 50/50 equilibrium'],
        correctIndex: 0,
        correctFeedback: 'Correct — comparing the two acids, water (pKa 15.7) is far more acidic than the amine\'s conjugate acid (pKa ≈ 38), so the equilibrium favors the side with the weaker acid: the reactants. Hydroxide is actually too weak a base to deprotonate a typical amine to any significant extent.'
      }
    ]
  });
})();
</script>
