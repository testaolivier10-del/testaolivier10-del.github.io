<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'hybridization',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'First, solve the paradox from last lesson.',
        bodyHtml: '<p class="step-body">Ground-state carbon is 1s² 2s² 2p² — only <b>2</b> unpaired electrons, which would predict only 2 bonds. But carbon almost always forms <b>4</b>. Here\'s the resolution: it takes a small amount of energy to <b>promote</b> one of the paired 2s electrons up into the empty third 2p orbital. That gives 2s¹ 2p³ — <b>4</b> unpaired electrons, one in each of 4 orbitals. That energy cost is easily paid back by getting to form 2 extra bonds, so it happens essentially every time carbon bonds.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Mixing unequal orbitals into equal ones.',
        bodyHtml: '<p class="step-body">Carbon now has 4 orbitals to bond with \u2014 but they are not identical (one s-shaped, three dumbbell-shaped p\'s), which would make 4 unequal, oddly-angled bonds. Methane\'s four C\u2013H bonds are measurably identical, so that cannot be what happens.</p><p class="step-body" style="margin-bottom:0;">Instead the atom <b>mixes</b> (hybridizes) those 4 orbitals together mathematically into <b>4 new orbitals</b> that are all identical to each other and point as far apart as possible \u2014 109.5\u00b0, toward the corners of a tetrahedron. These new orbitals are called <b>sp\u00b3</b>, "s-p-three", for the one s and three p orbitals that went into them. Note what mixing does and does not do: four orbitals in, four orbitals out. Hybridization redistributes the shapes, it never changes the count.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three recipes, and the shortcut that gets you to them.',
        bodyHtml: '<p class="step-body">The same idea scales down. Mixing 1 s orbital with only <b>2</b> of the p orbitals gives <b>3</b> equivalent <b>sp\u00b2</b> orbitals (flat, 120\u00b0 apart), leaving <b>1</b> p orbital completely unmixed. Mixing 1 s with just <b>1</b> p gives <b>2</b> equivalent <b>sp</b> orbitals (180\u00b0 apart, a straight line), leaving <b>2</b> p orbitals unmixed. Those leftover, unhybridized p orbitals are exactly what forms <b>pi bonds</b> \u2014 you will meet them by name in the very next lesson. A double bond needs one leftover p orbital (sp\u00b2 carbon); a triple bond needs two (sp carbon).</p>' +
          '<div class="formula">4 groups = sp\u00b3 (0 leftover p) &nbsp;&middot;&nbsp; 3 groups = sp\u00b2 (1 leftover p) &nbsp;&middot;&nbsp; 2 groups = sp (2 leftover p)</div>' +
          '<p class="step-body">You do not have to work out the promotion-and-mixing every time. In practice there is a shortcut: count an atom\'s <b>electron groups</b> \u2014 sigma bonds plus lone pairs, with a double or triple bond counting as <b>one</b> group since it goes to one neighboring atom \u2014 and the hybridization falls straight out of the table above. It works on nitrogen and oxygen too: 3 bonds + 1 lone pair on the nitrogen of ammonia is 4 groups, so sp\u00b3.</p>' +
          '<p class="step-body" style="margin-bottom:0;"><b>A labeled preview \u2014 the one place the shortcut fails.</b> Count groups on the nitrogen of an amide (R\u2013CO\u2013NH\u2082) and you get 4, so sp\u00b3 and pyramidal. That nitrogen is measurably <b>flat</b>, and it is sp\u00b2. The reason is what leftover p orbitals are for: a lone pair sitting next to a \u03c0 bond does better by moving into a p orbital and overlapping sideways with it than by staying in a hybrid orbital of its own, and an atom that keeps a lone pair in a p orbital has only three hybrids left. The same thing happens to the nitrogen of aniline and to one oxygen of an ester. You will meet it properly in <a class=\\"chapter-ref\\" href=\\"/ochem/learn.html#m-electron-movement\\">Drawing Molecules &amp; Moving Electrons</a>; for now, just know the shortcut has one exception and it is always a lone pair beside a \u03c0 bond.</p>'
      },
      {
        render: function(api){
          var clicked = {}, count = 0, done = false;
          var bonds = [[130,90,80,60],[130,90,180,60],[130,90,80,120],[130,90,180,120]];
          function scene(){
            return '<div class="scene"><svg viewBox="0 0 260 160">' +
              bonds.map(function(b,i){
                var isChosen = clicked[i];
                return '<g class="atom' + (isChosen?' chosen':'') + '" data-key="b' + i + '">' +
                  '<line x1="' + b[0] + '" y1="' + b[1] + '" x2="' + b[2] + '" y2="' + b[3] + '" stroke="' + (isChosen?'var(--accent)':'var(--line)') + '" stroke-width="' + (isChosen?3.5:2.5) + '"/>' +
                  '<circle cx="' + b[2] + '" cy="' + b[3] + '" r="14" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="' + b[2] + '" y="' + (b[3]+4) + '" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11" pointer-events="none">H</text>' +
                '</g>';
              }).join('') +
              '<circle cx="130" cy="90" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="96" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">C</text>' +
            '</svg></div>';
          }
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
              '<h2 class="step-title">Count carbon’s electron groups in methane, CH₄.</h2>' +
              '<p class="step-body">Click each bond around the central carbon.</p>' +
              scene() +
              '<p class="step-body" style="text-align:center;font-family:var(--font-mono);font-weight:900;color:var(--accent);">Groups counted: ' + count + ' / 4</p>' +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', done);
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(done) return;
                var idx = parseInt(g.getAttribute('data-key').slice(1), 10);
                if(clicked[idx]) return;
                clicked[idx] = true;
                count++;
                if(count === 4){
                  done = true;
                  api.record(true);
                  paint();
                  api.showFeedback(api.card.querySelector('#fb'), true, 'Correct — 4 sigma bonds, 0 lone pairs, 4 groups. That’s sp³.');
                } else {
                  paint();
                }
              });
            });
            api.card.querySelector('#nextBtn').addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Formaldehyde’s carbon has 3 sigma-bond groups (2 to H, 1 to O — the double bond still counts once) and no lone pairs. Hybridization?',
        options: ['sp²', 'sp³', 'sp'],
        correctIndex: 0,
        correctFeedback: 'Correct — 3 groups means sp², and a trigonal planar shape.',
        wrongFeedback: 'Count the groups again: how many neighboring atoms/lone pairs does this carbon have?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'The carbon in CO₂ has 2 groups — a double bond to each oxygen. Hybridization?',
        options: ['sp³', 'sp', 'sp²'],
        correctIndex: 1,
        correctFeedback: 'Correct — only 2 groups means sp, and a linear shape.',
        wrongFeedback: 'Each double bond to oxygen is still just one group.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Hybridization predicts shape.',
        bodyHtml: '<div class="explain-box">sp³ is tetrahedral, sp² is trigonal planar, sp is linear — that’s the whole idea behind molecular geometry, a few lessons from now. It also predicts bond strength and length: more s-character (sp &gt; sp² &gt; sp³) means shorter, stronger bonds.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Beyond 4 groups: what about sulfur and phosphorus?',
        bodyHtml: '<p class="step-body">Carbon, nitrogen and oxygen never exceed 4 groups, for the reason the Orbitals lesson counted out: the n = 2 shell holds four orbitals, so there is no fifth hybrid to make. Period 3 elements like sulfur and phosphorus sometimes do go further — 5 groups gives a trigonal bipyramidal shape (PCl₅), 6 groups an octahedral one (SF₆).</p><p class="step-body" style="margin-bottom:0;">You will see those labeled “sp³d” and “sp³d²” in older books. That label has been retired, and the Lewis Structures lesson sets out why once, under the octet-rule exceptions. While you are assigning hybridization the practical rule is all you need: <b>count groups, and if the count is above four you are not looking at a carbon, nitrogen or oxygen.</b></p>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Nitrogen in ammonia (NH₃) has 3 bonds to H plus 1 lone pair — 4 groups total. What’s its hybridization?',
        options: ['sp² — only bonds count', 'sp — nitrogen is always sp', 'sp³ — lone pairs count as groups too'],
        correctIndex: 2,
        correctFeedback: 'Correct — lone pairs take up orbital space just like bonds do. Ammonia’s nitrogen is sp³, even though the visible shape (ignoring the lone pair) looks pyramidal, not tetrahedral.'
      }
    ]
  });
})();
});
</script>
