<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'hybridization',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>Resolving the carbon paradox</h3><p class="step-body">Ground-state carbon (1s² 2s² 2p²) has only 2 unpaired electrons. It takes a small amount of energy to <b>promote</b> one paired 2s electron up into the empty third 2p orbital, giving 2s¹ 2p³ — <b>4</b> unpaired electrons, one per orbital. That energy cost is paid back by forming 2 extra bonds, so it happens essentially every time carbon bonds.</p>' +
      '<h3>What "hybridizing" actually means</h3><p class="step-body">Carbon now has 4 orbitals to bond with, but they\'re not identical (1 s-shaped, 3 dumbbell p\'s) — that would make lopsided, unequal bonds. Instead the atom mathematically <b>mixes</b> them into 4 new, identical orbitals pointing as far apart as possible (109.5°, toward a tetrahedron\'s corners): <b>sp³</b> orbitals (1 s + 3 p).</p><p class="step-body">The same scales down: 1 s + 2 p mixed together gives 3 equivalent <b>sp²</b> orbitals (120° apart, flat) with <b>1 p orbital left over, unmixed</b>. 1 s + 1 p gives 2 equivalent <b>sp</b> orbitals (180°, linear) with <b>2 p orbitals left over</b>. Those leftover, unhybridized p orbitals are what go on to form pi bonds (next lesson) — a double bond needs 1 leftover p (sp² carbon), a triple bond needs 2 (sp carbon).</p>' +
      '<div class="formula">4 groups = sp³ (0 leftover p) &nbsp;&middot;&nbsp; 3 groups = sp² (1 leftover p) &nbsp;&middot;&nbsp; 2 groups = sp (2 leftover p)</div>' +
      '<h3>The shortcut</h3><p class="step-body">You don\'t redo the promotion-and-mixing every time — just count an atom\'s <b>electron groups</b> (sigma bonds + lone pairs; a double/triple bond still counts as <b>one</b> group since it goes to one neighbor) and hybridization follows from the table above. Example: methane\'s carbon has 4 sigma bonds, 0 lone pairs → 4 groups → sp³. CO₂\'s carbon has 2 double bonds → 2 groups → sp. Ammonia\'s nitrogen has 3 bonds + 1 lone pair → 4 groups → sp³ (lone pairs count as groups too).</p>' +
      '<div class="notes-fact">More s-character means shorter, stronger bonds: sp &gt; sp² &gt; sp³.</div>' +
      '<h3>Beyond 4 groups</h3><p class="step-body">Carbon, nitrogen, and oxygen never exceed 4 groups — period 2 is simply too small. Period 3+ elements like sulfur and phosphorus sometimes do go further: 5 groups gives the trigonal bipyramidal shape seen in PCl₅, and 6 groups gives the octahedral shape seen in SF₆. Textbooks have long labeled these "sp³d" and "sp³d²" hybridization, as if empty d orbitals mixed in the same way p orbitals do for sp³ — but modern computational studies show real d-orbital involvement here is minimal; the geometry is better explained by the central atom\'s larger size (more room for extra neighbors) and by real ionic character in the extra bonds (so the central atom isn\'t truly sharing a full covalent octet\'s worth of electrons with each one). Either way, the resulting shapes and the "S/P can exceed an octet, C/N/O never can" rule both still hold.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'First, solve the paradox from last lesson.',
        bodyHtml: '<p class="step-body">Ground-state carbon is 1s² 2s² 2p² — only <b>2</b> unpaired electrons, which would predict only 2 bonds. But carbon almost always forms <b>4</b>. Here\'s the resolution: it takes a small amount of energy to <b>promote</b> one of the paired 2s electrons up into the empty third 2p orbital. That gives 2s¹ 2p³ — <b>4</b> unpaired electrons, one in each of 4 orbitals. That energy cost is easily paid back by getting to form 2 extra bonds, so it happens essentially every time carbon bonds.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Mixing unequal orbitals into equal ones.',
        bodyHtml: '<p class="step-body">Carbon now has 4 orbitals to bond with — but they\'re not identical (one s-shaped, three dumbbell-shaped p\'s), which would make 4 unequal, oddly-angled bonds. Instead, the atom <b>mixes</b> (hybridizes) those 4 orbitals together mathematically into <b>4 new orbitals</b> that are all identical to each other and point as far apart as possible (109.5°, toward the corners of a tetrahedron). These new orbitals are called <b>sp³</b> — "s-p-three" for the one s and three p orbitals that went into them.</p><p class="step-body">The same idea scales down: mixing 1 s orbital with only <b>2</b> of the p orbitals gives <b>3</b> equivalent <b>sp²</b> orbitals (flat, 120° apart), leaving <b>1</b> p orbital completely unmixed. Mixing 1 s with just <b>1</b> p gives <b>2</b> equivalent <b>sp</b> orbitals (180° apart, a straight line), leaving <b>2</b> p orbitals unmixed. Those leftover, unhybridized p orbitals are exactly what forms <b>pi bonds</b> — you\'ll meet those by name in the very next lesson. A double bond needs one leftover p orbital (sp² carbon); a triple bond needs two (sp carbon).</p>' +
          '<div class="formula">4 groups = sp³ (0 leftover p) &nbsp;&middot;&nbsp; 3 groups = sp² (1 leftover p) &nbsp;&middot;&nbsp; 2 groups = sp (2 leftover p)</div>' +
          '<p class="step-body" style="margin-bottom:0;">You don\'t have to work out the promotion-and-mixing every time — in practice, there\'s a shortcut: just count an atom\'s <b>electron groups</b> (sigma bonds plus lone pairs; a double or triple bond still counts as <b>one</b> group, since it goes to one neighboring atom) and the hybridization falls right out of the table above.</p>'
      },
      {
        render: function(api){
          var clicked = {}, count = 0, done = false;
          var bonds = [[130,90,80,60],[130,90,180,60],[130,90,80,120],[130,90,180,120]];
          function scene(){
            return '<div class="scene"><svg viewBox="0 0 260 160">' +
              bonds.map(function(b,i){
                var isChosen = clicked[i];
                return '<g class="atom' + (isChosen?' chosen':'') + '" data-key="b' + i + '">' +
                  '<line x1="' + b[0] + '" y1="' + b[1] + '" x2="' + b[2] + '" y2="' + b[3] + '" stroke="' + (isChosen?'var(--accent)':'var(--line)') + '" stroke-width="' + (isChosen?3.5:2.5) + '"/>' +
                  '<circle cx="' + b[2] + '" cy="' + b[3] + '" r="14" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="' + b[2] + '" y="' + (b[3]+4) + '" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11" pointer-events="none">H</text>' +
                '</g>';
              }).join('') +
              '<circle cx="130" cy="90" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="96" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">C</text>' +
            '</svg></div>';
          }
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
              '<h2 class="step-title">Count carbon’s electron groups in methane, CH₄.</h2>' +
              '<p class="step-body">Click each bond around the central carbon.</p>' +
              scene() +
              '<p class="step-body" style="text-align:center;font-family:var(--font-mono);font-weight:900;color:var(--accent);">Groups counted: ' + count + ' / 4</p>' +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', done);
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(done) return;
                var idx = parseInt(g.getAttribute('data-key').slice(1), 10);
                if(clicked[idx]) return;
                clicked[idx] = true;
                count++;
                if(count === 4){
                  done = true;
                  api.record(true);
                  paint();
                  api.showFeedback(api.card.querySelector('#fb'), true, 'Correct — 4 sigma bonds, 0 lone pairs, 4 groups. That’s sp³.');
                } else {
                  paint();
                }
              });
            });
            api.card.querySelector('#nextBtn').addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Formaldehyde’s carbon has 3 sigma-bond groups (2 to H, 1 to O — the double bond still counts once) and no lone pairs. Hybridization?',
        options: ['sp²', 'sp³', 'sp'],
        correctIndex: 0,
        correctFeedback: 'Correct — 3 groups means sp², and a trigonal planar shape.',
        wrongFeedback: 'Count the groups again: how many neighboring atoms/lone pairs does this carbon have?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'The carbon in CO₂ has 2 groups — a double bond to each oxygen. Hybridization?',
        options: ['sp³', 'sp', 'sp²'],
        correctIndex: 1,
        correctFeedback: 'Correct — only 2 groups means sp, and a linear shape.',
        wrongFeedback: 'Each double bond to oxygen is still just one group.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Hybridization predicts shape.',
        bodyHtml: '<div class="explain-box">sp³ is tetrahedral, sp² is trigonal planar, sp is linear — that’s the whole idea behind molecular geometry, a few lessons from now. It also predicts bond strength and length: more s-character (sp &gt; sp² &gt; sp³) means shorter, stronger bonds.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Beyond 4 groups: what about sulfur and phosphorus?',
        bodyHtml: '<p class="step-body">Carbon, nitrogen, and oxygen never exceed 4 groups — period 2 has no d orbitals at all, and no other mechanism to make room for a fifth or sixth neighbor. Period 3+ elements like sulfur and phosphorus sometimes do go further: 5 groups gives a trigonal bipyramidal shape (seen in PCl₅); 6 groups gives an octahedral shape (seen in SF₆).</p><p class="step-body" style="margin-bottom:0;">For decades, chemistry courses explained this by claiming empty 3d orbitals mix in — "sp³d" and "sp³d²" hybridization — the same way p orbitals mix in for sp³. Modern computational chemistry doesn\'t support that: those 3d orbitals turn out to be too high in energy and too diffuse to meaningfully participate in bonding. The better explanation combines two things that have nothing to do with d orbitals — sulfur and phosphorus are simply bigger atoms with more room around them, and the extra bonds carry real ionic character, so the central atom isn\'t truly sharing a full covalent octet\'s worth of electrons with every single neighbor. The resulting shapes (and the rule that only period 3+ elements can pull this off) are unaffected by which explanation you use — only the underlying "why" has been revised.</p>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Nitrogen in ammonia (NH₃) has 3 bonds to H plus 1 lone pair — 4 groups total. What’s its hybridization?',
        options: ['sp² — only bonds count', 'sp — nitrogen is always sp', 'sp³ — lone pairs count as groups too'],
        correctIndex: 2,
        correctFeedback: 'Correct — lone pairs take up orbital space just like bonds do. Ammonia’s nitrogen is sp³, even though the visible shape (ignoring the lone pair) looks pyramidal, not tetrahedral.'
      }
    ]
  });
})();
</script>
