<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'conformational-analysis',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One substituent: always draw the equatorial chair as dominant.',
        bodyHtml: '<p class="step-body">Now that you know both A-values (how strongly a group prefers equatorial) and ring flips (how a molecule accesses both chairs), you can predict which conformation actually dominates a real sample.</p><p class="step-body" style="margin-bottom:0;">For a monosubstituted cyclohexane, the rule is simple: the dominant chair is whichever one puts the substituent <b>equatorial</b>. The size of that preference is exactly the substituent\'s A-value — methylcyclohexane (A-value 1.7 kcal/mol) sits at roughly 95:5 equatorial:axial, while tert-butylcyclohexane (A-value 4.9 kcal/mol) is essentially locked equatorial, over 99.9% of the time.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">cis-1-Isopropyl-3-methylcyclohexane. Which chair wins, and by how much?</h2>' +
            '<p class="step-body">Cis on carbons 1 and 3 means both groups are on the same face, and on a 1,3 pair that puts them both equatorial in one chair and both axial in the other. A-values: isopropyl 2.2, methyl 1.7. Add the axial penalties in each chair and compare.</p>' +
            '<div class="choice-row">' +
            '<button class="choice-btn" data-v="ee" style="text-align:center;">Both equatorial, by about 3.9 kcal/mol</button>' +
            '<button class="choice-btn" data-v="split" style="text-align:center;">Isopropyl equatorial and methyl axial, by 0.5 kcal/mol</button>' +
            '<button class="choice-btn" data-v="aa" style="text-align:center;">Both axial, by about 3.9 kcal/mol</button>' +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'ee';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Right. The diequatorial chair carries no axial penalty at all; the diaxial chair carries 2.2 + 1.7 = 3.9, and on top of that the two axial groups are 1,3 on the same face and clash with each other directly. The diequatorial chair is the answer and it is not close. Note the trap: on a 1,3 pair it is <b>cis</b> that gets both groups equatorial — the opposite of the 1,2 and 1,4 cases — because the axial directions alternate round the ring.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why does the equatorial position dominate for a bulky substituent?',
        options: ['Equatorial bonds are covalently stronger', 'It avoids the 1,3-diaxial steric clashes that the axial position would create', 'The molecule can\'t physically reach the axial position'],
        correctIndex: 1,
        correctFeedback: 'Correct — it\'s purely a steric/energy preference, not a bonding or accessibility issue. The molecule can and does sample the axial chair briefly; it just spends far less time there.',
        wrongFeedback: 'Both bonds are ordinary sigma bonds of equal strength, and the molecule can reach either chair — the equatorial preference is about avoiding steric strain, not bond strength or reachability.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'With two substituents on a ring, how do you predict the dominant chair?',
        options: ['Only the first-numbered substituent matters', 'Two substituents always cancel out to a 50/50 mixture', 'Compare total axial "penalty" (roughly, sum of A-values) in each chair and pick the lower one'],
        correctIndex: 2,
        correctFeedback: 'Correct. Add up which substituents would be axial in each of the two possible chairs, and the chair with less total axial strain (lower summed A-value penalty) dominates.',
        wrongFeedback: 'Every substituent contributes its own A-value penalty when axial — you need to compare both chairs\' total penalty, not just look at one substituent.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Cis or trans decides whether both groups can be equatorial \u2014 and the pattern reverses on a 1,3 ring.',
        bodyHtml: '<p class="step-body">Before any arithmetic, settle the geometry: whether two substituents <i>can</i> both be equatorial is fixed by their cis/trans relationship and by how far apart they sit. On <b>1,2 and 1,4</b> rings it is <b>trans</b> that allows both equatorial; on <b>1,3</b> rings it is <b>cis</b>. The reversal is not a rule to memorize \u2014 it falls out of the drawing, because the axial direction alternates from carbon to carbon, so 1 and 3 point the same way while 1 and 2 point opposite ways.</p><p class="step-body" style="margin-bottom:0;">Two corrections sit on top of plain A-value addition, because an A-value only measures a group against hydrogens. Two equatorial methyls on <b>adjacent</b> carbons are gauche to each other and cost about <b>0.9 kcal/mol</b>; two axial methyls on the same face of a <b>1,3</b> pair stare straight at each other and cost about <b>3.7</b>, well above the 1.7 each would be charged alone. So for <i>trans</i>-1,2-dimethylcyclohexane the diequatorial chair is not free \u2014 it wins by 3.4 \u2212 0.9 = 2.5 kcal/mol, against a measured 2.7.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Which chair a molecule sits in decides what it can do.',
        bodyHtml: '<div class="explain-box">This is not bookkeeping about shape. &beta;-Glucose adopts the one chair that places every bulky hydroxyl and its hydroxymethyl group equatorial \u2014 the only common hexose that can manage it, and a large part of why life settled on that sugar. The same chair-and-A-value analysis is what chemists run on a steroid nucleus. And because a reaction can only happen if the molecule can physically adopt the geometry the mechanism needs, the chair you have just learned to pick also decides reactivity: <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-substitution-elimination\">Substitution &amp; Elimination</a> will show that elimination on a ring demands an axial leaving group, and it puts this whole procedure to work on that problem.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'cis-1-tert-Butyl-2-methylcyclohexane. Which chair does it prefer, and why? (A-values: tert-butyl 4.9, methyl 1.7)',
        options: [
          'Neither \u2014 cis groups on adjacent carbons lock the ring, so it cannot flip between chairs at all',
          'The chair with tert-butyl equatorial and methyl axial, because cis on adjacent carbons forces one group axial and the cheaper one to axialise is the methyl',
          'The chair with both groups equatorial, because a cis relationship on adjacent carbons always allows a diequatorial chair'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Cis on adjacent carbons means one group up and one down, and since the axial direction alternates, that pair is always one axial and one equatorial \u2014 no chair gets both equatorial. So the only question is which group pays. Axialising tert-butyl costs 4.9; axialising the methyl costs 1.7, so the chair that keeps tert-butyl equatorial wins by about 3.2 kcal/mol. The general rule falls straight out of the arithmetic: when not everything can be equatorial, the bulkier group takes equatorial.'
      }
    ]
  });
})();
});
</script>
