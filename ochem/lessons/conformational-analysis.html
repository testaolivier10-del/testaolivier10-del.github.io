<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'conformational-analysis',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('newman-butane-anti'),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One substituent: always draw the equatorial chair as dominant.',
        bodyHtml: '<p class="step-body">Now that you know both A-values (how strongly a group prefers equatorial) and ring flips (how a molecule accesses both chairs), you can predict which conformation actually dominates a real sample.</p><p class="step-body" style="margin-bottom:0;">For a monosubstituted cyclohexane, the rule is simple: the dominant chair is whichever one puts the substituent <b>equatorial</b>. The size of that preference is exactly the substituent\'s A-value — methylcyclohexane (A-value 1.7 kcal/mol) sits at roughly 95:5 equatorial:axial, while tert-butylcyclohexane (A-value ~4.7-5+ kcal/mol) is essentially locked equatorial, over 99.9% of the time.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">tert-Butylcyclohexane can ring-flip into two chairs. Which one dominates?</h2>' +
            '<p class="step-body">tert-Butyl has an A-value of about 4.7-5+ kcal/mol — one of the largest of any common substituent.</p>' +
            '<div class="choice-row">' +
            '<button class="choice-btn" data-v="eq" style="text-align:center;">Chair with tert-butyl equatorial</button>' +
            '<button class="choice-btn" data-v="ax" style="text-align:center;">Chair with tert-butyl axial</button>' +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'eq';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Right — with such a large A-value, tert-butylcyclohexane exists in the equatorial chair over 99.9% of the time. The axial chair is so disfavored it\'s essentially never observed.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why does the equatorial position dominate for a bulky substituent?',
        options: ['Equatorial bonds are covalently stronger', 'It avoids the 1,3-diaxial steric clashes that the axial position would create', 'The molecule can\'t physically reach the axial position'],
        correctIndex: 1,
        correctFeedback: 'Correct — it\'s purely a steric/energy preference, not a bonding or accessibility issue. The molecule can and does sample the axial chair briefly; it just spends far less time there.',
        wrongFeedback: 'Both bonds are ordinary sigma bonds of equal strength, and the molecule can reach either chair — the equatorial preference is about avoiding steric strain, not bond strength or reachability.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'With two substituents on a ring, how do you predict the dominant chair?',
        options: ['Only the first-numbered substituent matters', 'Two substituents always cancel out to a 50/50 mixture', 'Compare total axial "penalty" (roughly, sum of A-values) in each chair and pick the lower one'],
        correctIndex: 2,
        correctFeedback: 'Correct. Add up which substituents would be axial in each of the two possible chairs, and the chair with less total axial strain (lower summed A-value penalty) dominates.',
        wrongFeedback: 'Every substituent contributes its own A-value penalty when axial — you need to compare both chairs\' total penalty, not just look at one substituent.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'E2 elimination needs anti-periplanar geometry — and on a ring, that means axial-axial.',
        bodyHtml: '<p class="step-body">E2 elimination requires the leaving group and the beta-hydrogen being removed to be <b>anti-periplanar</b>: 180° apart, viewed as a Newman projection down the C–C bond between them. On an open chain this is easy to achieve by simple bond rotation, but on a cyclohexane ring, the geometry is fixed by the chair — and the only pair of substituents on adjacent ring carbons that are ever 180° apart is <b>axial-axial</b>. Equatorial substituents are never anti-periplanar to anything.</p><p class="step-body" style="margin-bottom:0;">This means an E2 reaction on a cyclohexane ring can only proceed through whichever chair conformation happens to have the leaving group axial — even if that\'s the minority conformation the molecule barely visits. If the leaving group can never become axial (for example, if it\'s attached to a ring locked by a huge A-value substituent elsewhere), E2 simply can\'t happen on that ring at all, no matter how good the leaving group or how strong the base.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is the exact dependency the course structure already assumes.',
        bodyHtml: '<div class="explain-box">The E2 mechanism lesson (Module 6) builds directly on everything in this module: chair conformations, axial/equatorial positions, ring flips, and now the anti-periplanar requirement. Predicting the product of an E2 reaction on a cyclohexane substrate is a direct application of conformational analysis, not a separate topic — you\'re finding which ring-flipped conformation makes the reaction geometrically possible, then reading off which hydrogen gets removed.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A cyclohexane has a leaving group that is equatorial in its dominant chair conformation. Can E2 elimination proceed directly from that dominant conformation?',
        options: ['No — the leaving group must be axial for anti-periplanar geometry, so the molecule must first ring-flip to its minority conformation', 'Yes — equatorial leaving groups are always anti-periplanar to an adjacent hydrogen', 'No — E2 is impossible on any cyclohexane ring'],
        correctIndex: 0,
        correctFeedback: 'Correct — since only axial-axial pairs are anti-periplanar on a chair, the molecule has to ring-flip into the conformation where the leaving group is axial before E2 can occur, even though that may be the higher-energy, minority chair.'
      }
    ]
  });
})();
});
</script>
