<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Reading the substrate is the whole skill: which of the two mechanisms a
     given aryl halide can run, and whether it can run either. */
  var CASES = [
    { id:'n1', t:'<b>1-chloro-2,4-dinitrobenzene</b> + CH₃O⁻, warm', right:'snar',
      why:'SNAr. Two nitro groups, one ortho and one para to the chlorine, so the negative charge of the Meisenheimer complex reaches both by resonance. One product, methoxide exactly where the chlorine was.' },
    { id:'n2', t:'<b>Chlorobenzene</b> + NaNH₂ in liquid NH₃', right:'benzyne',
      why:'Benzyne. Nothing activates this ring, so SNAr is impossible — but NaNH₂ is strong enough to remove an ortho hydrogen and force the elimination. Two products, at adjacent positions.' },
    { id:'n3', t:'<b>1-chloro-3-nitrobenzene</b> + CH₃O⁻, warm', right:'neither',
      why:'Neither, in practice. The nitro group is META to the chlorine, so it cannot reach the negative charge by resonance — only inductively, which does speed the reaction up measurably and nowhere near enough to run it. This is the case that catches people who check for a nitro group and not for where it is.' },
    { id:'n4', t:'<b>2-bromo-1,3-dimethylbenzene</b> + NaNH₂', right:'neither',
      why:'Neither. The ring is not activated, so no SNAr — and both positions ortho to the bromine carry methyl groups rather than hydrogens, so there is nothing to eliminate and no benzyne either.' }
  ];
  var OPTS = [ { k:'benzyne', l:'Benzyne' }, { k:'neither', l:'Neither' }, { k:'snar', l:'SₙAr' } ];

  window.OchemLessonEngine.start({
    topicId: 'nucleophilic-aromatic',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The ring has only ever been the nucleophile.',
        bodyHtml: '<p class="step-body">Everything in the aromatic chapter so far runs one way. Benzene is electron-rich, so it attacks an electrophile, and a leaving group departs from the carbon that was attacked. That is electrophilic aromatic substitution.</p>' +
          '<p class="step-body">Reverse it &mdash; a nucleophile displacing a halide <i>on</i> the ring &mdash; and for a plain aryl halide nothing happens. <b>S<sub>N</sub>2 is impossible</b>, because the backside of that carbon is behind the ring and the carbon is sp&sup2;. <b>S<sub>N</sub>1 is impossible</b>, because an aryl cation would put a positive charge in an sp&sup2; orbital in the ring plane, which is badly unstable.</p>' +
          '<div class="explain-box">There are two ways round it, and they are <b>opposites</b>. One adds before it eliminates and needs the ring made electron-poor; the other eliminates before it adds and needs no activation at all. Merging them is the standard mistake, so it is worth holding on to which is which from the start.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'S_NAr: add first, then eliminate.',
        bodyHtml: '<p class="step-body">Put strong withdrawing groups on the ring and the nucleophile can simply add to the carbon carrying the halide. What forms is a negatively charged, non-aromatic intermediate &mdash; the <b>Meisenheimer complex</b> &mdash; and then the halide leaves and aromaticity comes back.</p>' +
          '<p class="step-body">Aromaticity is lost in the middle, which is the cost, and the nitro groups are what pay for it by taking the negative charge onto their own oxygens.</p>' +
          '<ul class="step-body">' +
          '<li><b>Ortho or para only.</b> Only from those positions can a withdrawing group reach the charge by resonance. A meta nitro group helps only inductively, which is measurable and nowhere near enough.</li>' +
          '<li><b>Fluorine is the best leaving group</b> &mdash; F &gt; Cl &gt; Br &gt; I, the reverse of every other substitution you know.</li>' +
          '<li><b>One product</b>, at exactly the position the halide occupied.</li>' +
          '</ul>' +
          '<div class="explain-box">That fluorine result is worth pausing on. Everywhere else, a better leaving group means a weaker C&ndash;X bond. Here the C&ndash;X bond is not breaking in the rate-determining step &mdash; the nucleophile&rsquo;s attack is &mdash; so what matters is which halogen makes that carbon most electrophilic, and fluorine wins on electronegativity.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which mechanism, if either, can each substrate run?</h2>' +
            '<p class="step-body">Two checks per row. For S<sub>N</sub>Ar: is there a withdrawing group <b>ortho or para</b> to the halide? For benzyne: is the base strong enough, and is there a <b>hydrogen ortho</b> to the halide to remove?</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:13.5px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Which mechanism">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Check the POSITION of the withdrawing group, not just its presence — and for benzyne, check that an ortho hydrogen exists to be removed.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Two of them run nothing at all, which is the answer people skip past.'
                  : 'All four, first time, including both of the substrates where neither mechanism is available.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why is fluorine the best leaving group in an S_NAr reaction?',
        options: [
          'The C–F bond is the weakest of the carbon–halogen bonds',
          'Fluorine makes that carbon the most electrophilic, and attack is rate-determining',
          'Fluoride is the most stable halide ion',
          'Fluorine is the smallest, so it leaves fastest'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and it is worth seeing why the usual reasoning does not apply. In S<sub>N</sub>1 and S<sub>N</sub>2 the C–X bond breaks in the rate-determining step, so a weak bond and a stable anion win — and C–F is the <i>strongest</i> C–X bond, which is why fluorides are the worst substrates there. Here the slow step is the nucleophile adding, so the only question is which halogen pulls the most electron density off that carbon.',
        wrongFeedback: 'Ask which step is rate-determining in S_NAr. If the C–X bond is not breaking in it, does bond strength matter?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Why does a meta nitro group fail to activate a ring toward S_NAr?',
        options: [
          'It cannot reach the negative charge by resonance',
          'It is too far away to withdraw inductively',
          'It donates electrons from the meta position',
          'It blocks the nucleophile sterically'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. Draw the Meisenheimer complex and push the negative charge around: it lands on the carbons ortho and para to the point of attack, and never on the meta ones. A meta nitro group still withdraws inductively, which is a small effect, but it cannot take the charge onto its own oxygens — and that delocalization is the whole reason the intermediate is stable enough to form.',
        wrongFeedback: 'Draw the anionic intermediate and work out which ring carbons actually carry the negative charge. Is meta one of them?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Benzyne: eliminate first, then add.',
        bodyHtml: '<p class="step-body">Give chlorobenzene no activating groups and a brutal base &mdash; NaNH<sub>2</sub> in liquid ammonia &mdash; and the other route opens. The base removes a hydrogen <b>ortho</b> to the chlorine, chloride leaves, and what is left is <b>benzyne</b>.</p>' +
          '<p class="step-body">That extra bond is made from two sp&sup2; orbitals lying <i>in the plane of the ring</i>, pointing away from each other rather than overlapping properly. It is a poor bond and the molecule is strained, reactive, and gone as soon as a nucleophile finds it.</p>' +
          '<div class="explain-box">Because the new bond is <b>symmetric</b>, the nucleophile can attack either of its two carbons. That gives the reaction its fingerprint: <b>two products</b>, one with the nucleophile where the halide was and one with it on the neighboring carbon. Labeling the halide-bearing carbon with ¹⁴C and finding the label split between two positions is how benzyne was proved to exist.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'What prevents 2-bromo-1,3-dimethylbenzene from reacting through benzyne?',
        options: [
          'Both positions ortho to the bromine carry methyl groups, not hydrogens',
          'The methyl groups deactivate the ring',
          'Bromide is too poor a leaving group',
          'The ring is too hindered for NaNH₂ to approach'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. The first step of the benzyne route is removing an <i>ortho</i> hydrogen, and here there is none to remove — both neighbors are substituted. The base has nothing to do, so no elimination occurs and no benzyne forms. Methyl groups are weak activators rather than deactivators, and bromide is a perfectly good leaving group; the blocked positions are the whole reason.',
        wrongFeedback: 'Write out the first step of the benzyne mechanism. What does NaNH₂ have to take, and is there one available here?'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'para-Chlorotoluene is treated with NaNH₂. What comes out, and what does the answer prove?',
        options: [
          'Only para-toluidine, since the amine arrives where the chloride was',
          'para- and meta-toluidine, because the nucleophile can attack either carbon of the benzyne',
          'Only meta-toluidine',
          'No reaction, since toluene is activated'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and the mixture is the evidence. Removing a hydrogen ortho to the chlorine and losing chloride gives a benzyne with its extra bond between C3 and C4, counting the methyl as C1. Amide can attack either end of that bond: attacking C4 gives <i>para</i>-toluidine, attacking C3 gives <i>meta</i>-toluidine. No direct displacement could ever put the nucleophile on a carbon that never carried the leaving group, so a rearranged product is proof that something symmetric existed in between. That is exactly the argument the ¹⁴C labeling experiment made, and it is why "two adjacent products" is the fingerprint you look for.'
      }
    ]
  });

})();
});
</script>
