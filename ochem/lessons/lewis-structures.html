<script>

// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'lewis-structures',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A recipe, not guesswork.',
        bodyHtml: '<p class="step-body">A quick reminder from the Atomic Structure lesson: the <b>octet rule</b> says most atoms are most stable with 8 electrons in their outer shell (2 for hydrogen). A Lewis structure is just a map of how a molecule\'s valence electrons are arranged to get every atom as close to that as possible — some as bonding pairs shared between atoms, some as lone pairs sitting on one atom alone.</p><p class="step-body">The recipe: count total valence electrons, connect atoms with single bonds, give outer atoms full octets with lone pairs, then put any leftovers on the central atom. If the central atom is still short an octet, turn a lone pair on a neighbor into a <b>double bond</b> — that lone pair becomes a second shared bonding pair, giving the central atom the extra electrons it needs without changing the total electron count.</p>' +
          '<p class="step-body" style="margin-bottom:0;">When more than one structure seems possible, <b>formal charge</b> (from the last lesson) tells you which one is realistic — minimizing formal charges usually wins.</p>'
      },
      {
        render: function(api){
          var doubled = { left: false, right: false }, done = false;
          function scene(){
            function bond(key, x1, y1, x2, y2){
              var isDouble = doubled[key];
              var offset = isDouble ? 4 : 0;
              var lines = '<line x1="' + x1 + '" y1="' + (y1-offset) + '" x2="' + x2 + '" y2="' + (y2-offset) + '" stroke="' + (isDouble?'var(--accent)':'var(--line)') + '" stroke-width="2.5"/>';
              if(isDouble) lines += '<line x1="' + x1 + '" y1="' + (y1+offset) + '" x2="' + x2 + '" y2="' + (y2+offset) + '" stroke="var(--accent)" stroke-width="2.5"/>';
              return '<g class="atom' + (isDouble?' chosen':'') + '" data-key="' + key + '">' + lines + '</g>';
            }
            return '<div class="scene"><svg viewBox="0 0 260 100">' +
              bond('left', 90, 50, 130, 50) +
              bond('right', 170, 50, 130, 50) +
              '<circle cx="70" cy="50" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="70" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">O</text>' +
              '<circle cx="130" cy="50" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">C</text>' +
              '<circle cx="190" cy="50" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="190" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">O</text>' +
            '</svg></div>';
          }
          function paint(){
            var count = (doubled.left?1:0) + (doubled.right?1:0);
            api.card.innerHTML =
              '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
              '<h2 class="step-title">Complete CO₂’s octets.</h2>' +
              '<p class="step-body">Both bonds start as single bonds — that leaves carbon two electrons short of an octet on each side. Click each bond to upgrade it to a double bond until carbon has a full octet.</p>' +
              scene() +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', done);
            var fb = api.card.querySelector('#fb');
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(done) return;
                var key = g.getAttribute('data-key');
                if(doubled[key]) return;
                doubled[key] = true;
                if(doubled.left && doubled.right){
                  done = true;
                  api.record(true);
                  paint();
                  api.showFeedback(api.card.querySelector('#fb'), true, 'Correct — with two double bonds, carbon has 4 bonds (an octet) and every atom’s formal charge is 0. That’s the realistic structure.');
                } else {
                  paint();
                }
              });
            });
            api.card.querySelector('#nextBtn').addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Guided Practice',
        title: 'How many total valence electrons does CO₂ have (C: 4, each O: 6)?',
        options: ['14', '16', '18'],
        correctIndex: 1,
        correctFeedback: 'Correct — 4 + 6 + 6 = 16.',
        wrongFeedback: 'Add: carbon’s 4, plus 6 for each of the two oxygens.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Independent Practice',
        title: 'Which is the better structure for CO₂: two C=O double bonds (all formal charges 0), or one single and one triple bond with charges of −1 and +1?',
        options: ['Two double bonds — formal charges all zero', 'One single, one triple — nonzero charges'],
        correctIndex: 0,
        correctFeedback: 'Correct — minimizing formal charge is the tiebreaker, and all-zero beats a structure with separated charges.',
        wrongFeedback: 'Which structure keeps formal charges closest to zero?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The octet rule has real exceptions.',
        bodyHtml: '<p class="step-body">"Most atoms want 8" isn\'t a law without exceptions — three real cases come up often enough to know by name:</p><p class="step-body"><b>Incomplete octets.</b> Boron and beryllium are small enough, and don\'t have enough valence electrons, to reach 8. BF₃ gives boron only <b>6</b> electrons (3 bonds, 0 lone pairs) and stops there — it\'s a stable, correct structure despite the "incomplete" octet. This is exactly why BF₃ is such a strong electrophile — or, in the acid/base vocabulary of <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-acids-bases\">Acids &amp; Bases</a>, a <b>Lewis acid</b>, meaning simply an electron-pair acceptor: boron has room for 2 more electrons and readily accepts a lone pair from anything electron-rich.</p><p class="step-body"><b>Expanded octets.</b> Start with why period 2 <i>cannot</i>: the n = 2 shell holds exactly four orbitals, one 2s and three 2p, and four orbitals hold eight electrons. A ninth electron on carbon, nitrogen, oxygen or fluorine would have nowhere to sit, so a five-bonded carbon is impossible, full stop. Sulfur, phosphorus and the rest of period 3 and below do legitimately go past 8 — sulfuric acid, sulfoxides, sulfones and PCl₅ all have a central atom exceeding an octet. The old explanation, that empty d orbitals mix into the bonding, has not held up under modern computation; what does the explaining is that those atoms are physically larger and that the extra bonds carry substantial ionic character.</p><p class="step-body" style="margin-bottom:0;"><b>Odd-electron species.</b> Species with an unpaired electron (an odd total electron count) can\'t possibly give every atom a full octet — these are <b>free radicals</b>, and you\'ll meet them properly later in the course when radical mechanisms come up.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is the tool you’ll use for the rest of the course.',
        bodyHtml: '<div class="explain-box">Every mechanism you’ll draw — the substitutions and eliminations of <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-substitution-elimination\">Substitution &amp; Elimination</a> and everything after — starts from a correct Lewis structure. Getting the octets and formal charges right up front is what lets you correctly spot the nucleophile, the electrophile, and the leaving group later.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Formaldehyde’s carbon is bonded to 2 H atoms (single bonds) and 1 O. To complete carbon’s octet with only 3 sigma bonds, what has to happen?',
        options: ['A C=O double bond must form', 'A lone pair goes on carbon instead', 'Nothing — 3 bonds is already an octet'],
        correctIndex: 0,
        correctFeedback: 'Correct — 3 single bonds only give carbon 6 electrons around it. A double bond to oxygen adds the 2 more it needs for a full octet.'
      }
    ]
  });
})();
});
</script>
