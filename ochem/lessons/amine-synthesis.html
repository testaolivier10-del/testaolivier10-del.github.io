<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){

  var CASES = [
    { id:'m1', t:'Butanamide + <b>Br<sub>2</sub>/NaOH</b>', right:'minus',
      why:'Hofmann rearrangement, and the carbon count is the point: four carbons in, three out. The alkyl group migrates from the carbonyl carbon to nitrogen, and that carbon leaves as CO<sub>2</sub>. Product: propylamine.' },
    { id:'m2', t:'1-Bromopropane + <b>NaCN</b>, then LiAlH<sub>4</sub>', right:'plus',
      why:'Three carbons in, four out. Cyanide brings the extra carbon and LiAlH<sub>4</sub> turns the nitrile carbon into the CH<sub>2</sub>. Product: butan-1-amine.' },
    { id:'m3', t:'1-Bromopropane + <b>potassium phthalimide</b>, then hydrazine', right:'same',
      why:'Gabriel. Three carbons in, three out, and a clean primary amine because the alkylated imide has no N&ndash;H and no available lone pair, so it cannot alkylate twice. Azide displacement (NaN<sub>3</sub>, then LiAlH<sub>4</sub> or H<sub>2</sub>/Pd) is the same escape in fewer steps and the same bookkeeping: skeleton in, skeleton out.' },
    { id:'m4', t:'Butanal + <b>CH<sub>3</sub>NH<sub>2</sub>/NaBH<sub>3</sub>CN</b>', right:'plus',
      why:'Reductive amination, and the carbon count goes up because the <i>amine</i> brought one: four from the aldehyde plus one from methylamine gives a five-carbon secondary amine. The bond is made by reducing a C=N, not by displacement, so nothing over-alkylates.' },
    { id:'m5', t:'Butanamide + <b>LiAlH<sub>4</sub></b>', right:'same',
      why:'Amide reduction. Four carbons in, four out — the C=O simply becomes CH<sub>2</sub>. Contrast the top row, which is the same starting material under different reagents and loses a carbon.' },
    { id:'m6', t:'Pentanamide + <b>Br<sub>2</sub>/NaOH</b>', right:'minus',
      why:'Hofmann rearrangement again, on a different amide: five carbons in, four out. Product: butan-1-amine — the same amine the cyanide route reached from three carbons, which is the point of putting the two rows side by side. Azide displacement, not in this list, behaves exactly like Gabriel: the skeleton you put in is the skeleton you get back.' }
  ];
  var OPTS = [ { k:'plus', l:'One more carbon' }, { k:'same', l:'Same carbon count' }, { k:'minus', l:'One fewer carbon' } ];

  window.OchemLessonEngine.start({
    topicId: 'amine-synthesis',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The obvious route does not work.',
        bodyHtml: '<p class="step-body">Treat ammonia with an alkyl halide and nitrogen does the S<sub>N</sub>2 you expect. The trouble starts immediately after.</p>' +
          '<p class="step-body">The primary amine you just made is a <b>better nucleophile than the ammonia was</b>, because the new alkyl group donates electron density to nitrogen. So it attacks the next halide faster than the remaining ammonia does — and the secondary amine is faster again. (Not forever: a tertiary amine is <i>poorer</i> than the secondary one that made it, because three alkyl groups crowd the transition state. It is the early steps that outrun ammonia.)</p>' +
          '<p class="step-body">Out comes a mixture of primary, secondary and tertiary amine plus quaternary ammonium salt, in proportions set by <b>relative rates rather than by how much halide you add</b>. Adding less halide does not fix it. A large excess of <i>ammonia</i> does help, which is how simple primary amines are made industrially — but that is biasing a mixture, not controlling a reaction.</p>' +
          '<div class="explain-box">Every method in this section is a way around that one failure, and they divide by how they escape it: alkylate something that <i>cannot</i> react twice, use a nucleophile that is not an amine at all, or stop using displacement to make the C&ndash;N bond. The one time the runaway is welcome is when a <b>quaternary ammonium salt</b> is what you want — excess CH<sub>3</sub>I run to completion gives a single product, because there is nowhere further to go.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three escapes, and what each costs.',
        bodyHtml: '<ul class="step-body">' +
          '<li><b>Gabriel.</b> Phthalimide’s N&ndash;H is acidic (pK<sub>a</sub> about 8.3, flanked by two carbonyls). Deprotonate, alkylate once — the product is an imide with no N&ndash;H and its lone pair delocalized, so it cannot go again — then hydrolyze or use hydrazine to release the <b>primary</b> amine.</li>' +
          '<li><b>Azide.</b> N<sub>3</sub><sup>&minus;</sup> is small and an excellent nucleophile, and its product is an azide, not an amine. Reduce with LiAlH<sub>4</sub> or H<sub>2</sub>/Pd. Same idea, fewer steps.</li>' +
          '<li><b>Reductive amination.</b> Condense a carbonyl with the amine to an imine or iminium, then reduce it in the same flask.</li>' +
          '</ul>' +
          '<p class="step-body">The first two are still S<sub>N</sub>2 reactions, so they need a <b>primary, unhindered</b> halide and they give only a <b>primary</b> amine. Reductive amination has neither limit — but it has two of its own. The nitrogen lands on the <b>old carbonyl carbon</b>, so <i>tert</i>-butylamine and aryl amines are out of reach; and making a primary amine from ammonia is the one case that still over-alkylates, since the product competes with ammonia for the next carbonyl.</p>' +
          '<div class="explain-box">The reagent is what makes reductive amination work. <b>NaBH<sub>3</sub>CN</b> and <b>NaBH(OAc)<sub>3</sub></b> are attenuated hydride sources: they survive the mildly acidic pH (around 4&ndash;5) that imine formation wants, and they reduce the protonated imine far faster than the carbonyl — so the ketone survives long enough to condense. Plain NaBH<sub>4</sub> would just give you the alcohol.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Does the carbon count change?</h2>' +
            '<p class="step-body">This is the first question to ask of any amine synthesis, because it cuts most of the options at once. Measure the product against the <b>substrate named first</b> in each row — the halide, the amide or the carbonyl compound — and ask what the reagent adds or takes away.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Carbon count">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Count the carbons in everything you put in, not just the main substrate — cyanide brings one, and in a reductive amination the amine brings its own. Then ask whether any carbon leaves.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All six. Two rows start from butanamide and go opposite ways, which is the pair worth remembering — and two amides lose a carbon, so it is the reagent, not the substrate, that decides.'
                  : 'All six, first time — including the two butanamide rows, where the same starting material loses a carbon or keeps it depending entirely on the reagent.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why does direct alkylation of ammonia give a mixture?',
        options: [
          'Each product is a better nucleophile than what made it',
          'Ammonia is too weak a nucleophile to react once',
          'The halide eliminates instead of substituting',
          'Ammonia is a gas and escapes the flask'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and notice what this rules out. The problem is not that the reaction is slow or unselective in some vague way — it is that every alkylation makes the <i>next</i> one faster, because each added alkyl group donates electron density to nitrogen. The composition is therefore set by relative rates, not by how much halide you add, which is why limiting the stoichiometry does not help. It is the same runaway shape as base-promoted &alpha;-halogenation: a product more reactive than its own starting material.',
        wrongFeedback: 'Compare the nucleophilicity of ammonia with that of the primary amine it becomes. Which of the two reacts with the next halide faster?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Why can the Gabriel synthesis only give a primary amine?',
        options: [
          'The imide nitrogen can be alkylated only once',
          'Phthalimide is too bulky for a second alkylation',
          'Hydrazine removes any extra alkyl groups',
          'Secondary amines hydrolyze under the conditions'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. After the single alkylation the nitrogen has no N&ndash;H left to deprotonate and its lone pair is delocalized into both carbonyls, so there is nothing to attack a second halide with. That is the whole trick: the nitrogen is protected from itself until the moment it is released. The same escape, reached differently, is azide — whose product is not an amine at all until the reduction step, by which point no halide remains.',
        wrongFeedback: 'Look at the nitrogen right after the alkylation. What would it need to react again, and does it still have either of those things?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two more, and what they are for.',
        bodyHtml: '<p class="step-body"><b>Amide reduction</b> is the clean route to a <b>secondary or tertiary</b> amine. Acylation is self-limiting — an amide nitrogen has its lone pair tied up in the carbonyl and is not nucleophilic — so one acylation gives one product. LiAlH<sub>4</sub> then turns the C=O into a CH<sub>2</sub> with <b>no carbon lost</b>.</p>' +
          '<p class="step-body">The <b>Hofmann rearrangement</b> goes the other way. A primary amide with Br<sub>2</sub> and NaOH gives a primary amine with <b>one fewer carbon</b>: the alkyl group migrates from the carbonyl carbon to nitrogen, and that carbon leaves as CO<sub>2</sub>. Butanamide gives propylamine.</p>' +
          '<div class="explain-box">Which makes butanamide the most instructive starting material in the section. With LiAlH<sub>4</sub> it gives butylamine, four carbons. With Br<sub>2</sub>/NaOH it gives propylamine, three. Same substrate, same functional group in the product, and a carbon’s difference decided entirely by the reagent — which is why counting carbons is the first question and not the last.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'You need a secondary amine, R–CH<sub>2</sub>–NH–CH<sub>3</sub>, cleanly. Which route?',
        options: [
          'Reductive amination of R–CHO with CH<sub>3</sub>NH<sub>2</sub>',
          'Gabriel synthesis on R–Br',
          'Azide displacement, then reduction',
          'R–CH<sub>2</sub>–Br with excess CH<sub>3</sub>NH<sub>2</sub>'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and three of these fail for two different reasons. Gabriel and azide are both structurally incapable of it: each releases a nitrogen carrying nothing but hydrogens, so they give primary amines only. Direct alkylation would in principle give the right connectivity, and it is the route this whole section exists to avoid — excess methylamine biases the mixture but does not produce a single product. Reductive amination builds the C&ndash;N bond by reducing a C=N, so what you put in is what you get. Note where the nitrogen lands: on the old carbonyl carbon, so the aldehyde’s C=O carbon becomes the CH<sub>2</sub> next to nitrogen.',
        wrongFeedback: 'Two of these can only ever give a primary amine. Of the remaining two, one is the exact failure this section opened with.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'You need butylamine from butanoic acid. Three of these reach a four-carbon amine and one does not. Which fails?',
        options: [
          'SOCl<sub>2</sub>, then NH<sub>3</sub>, then Br<sub>2</sub>/NaOH',
          'SOCl<sub>2</sub>, then NH<sub>3</sub>, then LiAlH<sub>4</sub>',
          'Reduce to the alcohol, convert to the bromide, then Gabriel',
          'Reduce to the alcohol, convert to the bromide, then azide and H<sub>2</sub>/Pd'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and it fails on arithmetic rather than on chemistry — every step in it works. Butanoic acid has four carbons, so the amide has four, and the Hofmann rearrangement loses one: you get propylamine, not butylamine. The other three all preserve the count. Route two makes the same amide and reduces it, so the C=O becomes CH<sub>2</sub> and four stays four. Routes three and four go out through a primary bromide, which is exactly what Gabriel and azide both require, and neither adds or removes anything. The habit worth taking from this: read every proposed synthesis for its carbon count before you read it for its mechanism, because a route can be flawless step by step and still arrive one carbon short.'
      }
    ]
  });

})();
});
</script>
