    { id:'m1', t:'Butanamide + <b>Br<sub>2</sub>/NaOH</b>', right:'minus',

      why:'Three carbons in, four out. Cyanide brings the extra carbon, and LiAlH<sub>4</sub> turns the nitrile carbon into the CH<sub>2</sub> next to nitrogen. Product: butan-1-amine.' },

    { id:'m4', t:'Butanal + <b>CH<sub>3</sub>NH<sub>2</sub>/NaBH<sub>3</sub>CN</b>', right:'plus',
      why:'Reductive amination. The count goes up because the <i>amine</i> brings a carbon: four from the aldehyde plus one from methylamine gives a five-carbon secondary amine.' },

  window.OchemLessonEngine.start({
    topicId: 'amine-synthesis',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The obvious route does not work.',
        bodyHtml: '<p class="step-body">Warm bromoethane with ammonia. Ammonia&rsquo;s lone pair does the S<sub>N</sub>2 you expect, and ethylamine forms. The trouble starts right after that.</p>' +
          '<p class="step-body">Ethylamine is a <b>better nucleophile than ammonia</b>, because its ethyl group pushes electron density onto the nitrogen. So it attacks the next bromoethane faster than the remaining ammonia does, and the secondary amine it makes is faster again. A tertiary amine is slower, because its three alkyl groups crowd the transition state. It is the early steps that outrun ammonia.</p>' +
          '<!-- fig:alkylation-runaway:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 376" role="img" aria-label="A ladder of five boxes joined by arrows labeled plus R–Br, where R is CH3CH2 from bromoethane. Ammonia, the first nucleophile, gives the primary amine RNH2, which reacts faster than ammonia. It gives the secondary amine R2NH, faster again. That gives the tertiary amine R3N, slower because it is more crowded. That gives the quaternary ammonium salt R4N+ Br−, which has no lone pair left and stops. All five end up in the same flask."><text class="fg-tag" x="170" y="20" text-anchor="middle" font-size="11">BROMOETHANE ON AMMONIA · R = CH₃CH₂</text><rect class="fg-panel" x="20" y="39" width="104" height="34" rx="10"></rect><text class="fg-lbl" x="72" y="61" text-anchor="middle" font-size="12.5">NH₃</text><text class="fg-lbl" x="140" y="54" text-anchor="start" font-size="12.5">ammonia</text><text class="fg-tag" x="140" y="71" text-anchor="start" font-size="11">the first nucleophile</text><line class="fg-arrow" x1="72" y1="75" x2="72" y2="95"></line><path class="fg-head" d="M72 103 L67.84 95 L76.16 95 Z"></path><text class="fg-tag" x="84" y="93" text-anchor="start" font-size="11">+ R–Br</text><rect class="fg-panel-hi" x="20" y="105" width="104" height="34" rx="10"></rect><text class="fg-lbl" x="72" y="127" text-anchor="middle" font-size="12.5">RNH₂</text><text class="fg-lbl" x="140" y="120" text-anchor="start" font-size="12.5">primary amine</text><text class="fg-tag-warn" x="140" y="137" text-anchor="start" font-size="10">reacts faster than NH₃</text><line class="fg-arrow" x1="72" y1="141" x2="72" y2="161"></line><path class="fg-head" d="M72 169 L67.84 161 L76.16 161 Z"></path><text class="fg-tag" x="84" y="159" text-anchor="start" font-size="11">+ R–Br</text><rect class="fg-panel-hi" x="20" y="171" width="104" height="34" rx="10"></rect><text class="fg-lbl" x="72" y="193" text-anchor="middle" font-size="12.5">R₂NH</text><text class="fg-lbl" x="140" y="186" text-anchor="start" font-size="12.5">secondary amine</text><text class="fg-tag-warn" x="140" y="203" text-anchor="start" font-size="10">faster again</text><line class="fg-arrow" x1="72" y1="207" x2="72" y2="227"></line><path class="fg-head" d="M72 235 L67.84 227 L76.16 227 Z"></path><text class="fg-tag" x="84" y="225" text-anchor="start" font-size="11">+ R–Br</text><rect class="fg-panel-hi" x="20" y="237" width="104" height="34" rx="10"></rect><text class="fg-lbl" x="72" y="259" text-anchor="middle" font-size="12.5">R₃N</text><text class="fg-lbl" x="140" y="252" text-anchor="start" font-size="12.5">tertiary amine</text><text class="fg-tag" x="140" y="269" text-anchor="start" font-size="11">slower: more crowded</text><line class="fg-arrow" x1="72" y1="273" x2="72" y2="293"></line><path class="fg-head" d="M72 301 L67.84 293 L76.16 293 Z"></path><text class="fg-tag" x="84" y="291" text-anchor="start" font-size="11">+ R–Br</text><rect class="fg-panel-hi" x="20" y="303" width="104" height="34" rx="10"></rect><text class="fg-lbl" x="72" y="325" text-anchor="middle" font-size="12.5">R₄N⁺ Br⁻</text><text class="fg-lbl" x="140" y="318" text-anchor="start" font-size="12.5">quaternary ammonium salt</text><text class="fg-tag" x="140" y="335" text-anchor="start" font-size="11">no lone pair left: stops</text><text class="fg-tag-warn" x="170" y="364" text-anchor="middle" font-size="10">all five end up in the same flask</text></svg><figcaption>Each arrow is one more S<sub>N</sub>2 on bromoethane. The two orange notes mark the steps that outrun ammonia.</figcaption></figure><!-- fig:alkylation-runaway:end -->' +
          '<p class="step-body">So the flask ends up with primary, secondary and tertiary amine plus the quaternary ammonium salt. The <b>relative rates</b> set the proportions, so adding less halide does not fix it. A large excess of <i>ammonia</i> does help. It tilts the mixture toward the primary amine, though it never gives a single product.</p>' +
          '<div class="explain-box">The runaway is useful in one case: when a <b>quaternary ammonium salt</b> is the target. Excess CH<sub>3</sub>I left to react to completion then gives a single product, because the nitrogen has nowhere further to go.</div>'

          '<!-- fig:l-hofmann-rearrangement:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 520" role="img" aria-label="Three stacked panels from the Hofmann rearrangement of butanamide, with an orange dot on the carbonyl carbon. Panel 1: the N-bromoamide anion; the C–C bond to the propyl group shifts to nitrogen, the nitrogen lone pair forms a C=N bond, and bromide leaves. Panel 2: the isocyanate, propyl–N=C=O, with N=C=O in a straight line; water adds to its carbon. Panel 3: propan-1-amine, three carbons, plus CO2 carrying the old carbonyl carbon."><rect class="fg-panel-warn" x="8" y="8" width="324" height="196" rx="10"></rect><text class="fg-tag" x="170" y="30" text-anchor="middle" font-size="11">THE PROPYL GROUP MOVES TO N</text><line class="fg-bond" x1="41" y1="119.4" x2="80" y2="96"></line><line class="fg-bond" x1="80" y1="96" x2="119" y2="119.4"></line><line class="fg-bond-hi" x1="119" y1="119.4" x2="158" y2="96"></line><line class="fg-bond" x1="154" y1="96" x2="154" y2="63.2"></line><line class="fg-bond" x1="162" y1="96" x2="162" y2="63.2"></line><line class="fg-bond" x1="158" y1="96" x2="187.4" y2="112.54"></line><circle class="fg-atom" cx="158" cy="49.2" r="14"></circle><text class="fg-lbl" x="158" y="53.64" text-anchor="middle" font-size="12">O</text><circle class="fg-atom-warn" cx="199.6" cy="119.4" r="14"></circle><text class="fg-lbl" x="199.6" y="123.84" text-anchor="middle" font-size="12">N</text><circle class="fg-atom-warn" cx="158" cy="96" r="5"></circle><line class="fg-bond" x1="211.35" y1="127.01" x2="230.37" y2="139.31"></line><circle class="fg-atom" cx="243.8" cy="148" r="16"></circle><text class="fg-lbl" x="243.8" y="151.89" text-anchor="middle" font-size="10.5">Br</text><text class="fg-warn" x="201.6" y="151.4" text-anchor="middle" font-size="15">−</text><circle class="fg-lp" cx="209.38" cy="100.28" r="2.3"></circle><circle class="fg-lp" cx="200.69" cy="97.95" r="2.3"></circle><path class="fg-arrow" d="M140.5 113.7 Q157.8 135.83 177.92 129.5"></path><path class="fg-head" d="M184.6 127.4 L179.01 132.97 L176.83 126.03 Z"></path><path class="fg-arrow" d="M198.6 91.4 Q184.69 87.89 182.7 94.96"></path><path class="fg-head" d="M180.8 101.7 L179.2 93.97 L186.2 95.95 Z"></path><path class="fg-arrow" d="M226.7 128.7 Q240.94 120.99 247.1 127.81"></path><path class="fg-head" d="M251.8 133 L244.4 130.25 L249.8 125.37 Z"></path><text class="fg-tag-warn" x="170" y="192" text-anchor="middle" font-size="11">as Br⁻ leaves, in one step</text><rect class="fg-panel" x="8" y="212" width="324" height="170" rx="10"></rect><text class="fg-tag" x="170" y="234" text-anchor="middle" font-size="11">AN ISOCYANATE; WATER ADDS</text><line class="fg-bond" x1="68" y1="342" x2="98" y2="324"></line><line class="fg-bond" x1="98" y1="324" x2="128" y2="342"></line><line class="fg-bond" x1="128" y1="342" x2="146" y2="331.2"></line><line class="fg-bond" x1="172" y1="320" x2="192" y2="320"></line><line class="fg-bond" x1="172" y1="328" x2="192" y2="328"></line><line class="fg-bond" x1="204" y1="320" x2="224" y2="320"></line><line class="fg-bond" x1="204" y1="328" x2="224" y2="328"></line><circle class="fg-atom" cx="158" cy="324" r="14"></circle><text class="fg-lbl" x="158" y="328.44" text-anchor="middle" font-size="12">N</text><circle class="fg-atom" cx="238" cy="324" r="14"></circle><text class="fg-lbl" x="238" y="328.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom-warn" cx="198" cy="324" r="5"></circle><circle class="fg-atom" cx="198" cy="268" r="19"></circle><text class="fg-lbl" x="198" y="271.52" text-anchor="middle" font-size="9.5">H₂O</text><path class="fg-arrow" d="M194 287 Q187.02 301.57 192.11 309.18"></path><path class="fg-head" d="M196 315 L189.08 311.2 L195.14 307.16 Z"></path><path class="fg-arrow" d="M180 330 Q168.08 327.53 166.34 332.4"></path><path class="fg-head" d="M164 339 L162.91 331.19 L169.77 333.62 Z"></path><text class="fg-tag" x="170" y="368" text-anchor="middle" font-size="11">then the carbamic acid loses CO₂</text><rect class="fg-panel-good" x="8" y="390" width="324" height="122" rx="10"></rect><text class="fg-tag" x="170" y="412" text-anchor="middle" font-size="11">PROPAN-1-AMINE + CO₂</text><line class="fg-bond" x1="38" y1="466" x2="68" y2="448"></line><line class="fg-bond" x1="68" y1="448" x2="98" y2="466"></line><line class="fg-bond" x1="98" y1="466" x2="113.44" y2="457.31"></line><circle class="fg-atom-hi" cx="130" cy="448" r="19"></circle><text class="fg-lbl" x="130" y="451.52" text-anchor="middle" font-size="9.5">NH₂</text><line class="fg-bond" x1="238" y1="452" x2="252" y2="452"></line><line class="fg-bond" x1="238" y1="460" x2="252" y2="460"></line><line class="fg-bond" x1="264" y1="452" x2="278" y2="452"></line><line class="fg-bond" x1="264" y1="460" x2="278" y2="460"></line><circle class="fg-atom" cx="224" cy="456" r="14"></circle><text class="fg-lbl" x="224" y="460.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="292" cy="456" r="14"></circle><text class="fg-lbl" x="292" y="460.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom-warn" cx="258" cy="456" r="5"></circle><text class="fg-tag-good" x="84" y="496" text-anchor="middle" font-size="11">three carbons</text><text class="fg-tag-warn" x="258" y="490" text-anchor="middle" font-size="11">the old C=O carbon</text></svg><figcaption>The orange dot is the carbon that started as the amide C=O. In the top panel only the nitrogen lone pair that reacts is drawn.</figcaption></figure><!-- fig:l-hofmann-rearrangement:end -->' +
          '<div class="explain-box">So butanamide gives butan-1-amine with LiAlH<sub>4</sub> and propan-1-amine with Br<sub>2</sub>/NaOH. The same starting material gives the same kind of product, a carbon apart, and only the reagent decides which. Count the carbons first.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Independent Practice</div>' +
            '<h2 class="step-title">Does the carbon count change?</h2>' +
            '<p class="step-body">Ask this first of any amine synthesis, because it rules out most of the options at once. Compare the product with the <b>substrate named first</b> in each row (the halide, the amide or the carbonyl compound), and ask what the reagents add or take away.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Carbon count">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Count the carbons that end up in the product. Cyanide brings one, and in a reductive amination the amine brings its own. Then ask whether any carbon leaves.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All six. The two butanamide rows go opposite ways, and that is the pair to remember: the reagent, not the substrate, decides the count.'
                  : 'All six on the first try, including the two butanamide rows, where the same amide keeps its carbons or loses one depending only on the reagent.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'You need butan-1-amine from butanoic acid. Three of these routes reach a four-carbon amine and one does not. Which one fails?',
        options: [
          'SOCl<sub>2</sub>, then NH<sub>3</sub>, then Br<sub>2</sub>/NaOH',
          'SOCl<sub>2</sub>, then NH<sub>3</sub>, then LiAlH<sub>4</sub>',
          'Reduce to the alcohol, convert to the bromide, then Gabriel',
          'Reduce to the alcohol, convert to the bromide, then azide and H<sub>2</sub>/Pd'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and it fails on arithmetic, not on chemistry: every step in it works. Butanoic acid has four carbons, so its amide has four, and the Hofmann rearrangement removes one. You get propan-1-amine, not butan-1-amine. The other three keep the count. The second route makes the same amide and reduces it, so the C=O becomes CH<sub>2</sub> and four stays four. The last two go through a primary bromide, which is what Gabriel and azide both need, and neither adds nor removes a carbon. The habit to keep: check a proposed synthesis for its carbon count before you check its mechanism, because a route can work at every step and still end up one carbon short.'
      }
    ]
  });

})();
});
