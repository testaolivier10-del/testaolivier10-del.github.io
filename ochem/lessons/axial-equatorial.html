<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  // A real chair, with the same geometry as the twelve-position figure in the
  // written section: three pairs of parallel bonds, closed. Axial bonds are
  // vertical and alternate; equatorial bonds angle outward and tilt the
  // opposite way from their own carbon's axial. The drawing that used to be
  // here was a polyline that visited one vertex twice and never closed, so it
  // was not a six-membered ring at all.
  var RING = [[256.2,80.5],[208.1,83.0],[111.9,52.1],[63.8,111.5],[111.9,109.0],[208.1,140.0]];
  function chairSvg(){
    var ring = RING.map(function(p){ return p.join(','); }).join(' ');
    var spot = function(key, from, to){
      return '<line x1="' + from[0] + '" y1="' + from[1] + '" x2="' + to[0] + '" y2="' + to[1] + '" stroke="var(--muted)" stroke-width="2.5"/>' +
        '<g class="atom" data-key="' + key + '"><circle cx="' + to[0] + '" cy="' + to[1] + '" r="9" fill="var(--white)" stroke="var(--line)" stroke-width="2"/></g>';
    };
    return '<div class="scene"><svg viewBox="0 0 320 186">' +
      '<polygon points="' + ring + '" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>' +
      spot('ax1', RING[2], [111.9, 22.1]) +
      spot('ax2', RING[5], [208.1, 170.0]) +
      spot('eq1', RING[3], [35.5, 101.6]) +
      spot('eq2', RING[0], [284.5, 90.4]) +
    '</svg></div>';
  }


  window.OchemLessonEngine.start({
    topicId: 'axial-equatorial',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Axial points up and down; equatorial points outward.',
        bodyHtml: '<p class="step-body">Every carbon on a cyclohexane chair carries two substituent positions. <b>Axial</b> substituents point straight up or straight down, roughly parallel to an imaginary axis running through the center of the ring. <b>Equatorial</b> substituents point outward, roughly in the plane of the ring itself (like the equator of a globe).</p><p class="step-body" style="margin-bottom:0;">Going around the ring, axial positions alternate: up on carbon 1, down on carbon 2, up on carbon 3, and so on. Every single carbon has exactly one axial and one equatorial position, never two of the same kind.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the two equatorial positions on this chair.</h2>' +
            '<p class="step-body">Four of the twelve positions are drawn, and none of them is labeled. Two are axial and two are equatorial — decide which is which from the direction each bond points, then click the two equatorial ones.</p>' +
            chairSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Equatorial found: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0;
          var mistake = false;
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              if(g.classList.contains('chosen')) return;
              var key = g.getAttribute('data-key');
              g.classList.add('chosen');
              if(key.indexOf('eq') === 0){
                found++;
                hint.textContent = 'Equatorial found: ' + found + ' / 2';
              } else {
                mistake = true;
                api.showFeedback(fb, false, 'That bond runs straight up or straight down the page, so it is axial. An equatorial bond angles outward from the ring instead — look for the two that point away from the ring rather than along its axis.');
              }
              if(found === 2 && !mistake){
                api.record(true);
                api.showFeedback(fb, true, 'Right. The two you clicked angle outward from the ring — each one is parallel to the ring bond two carbons away, which is the rule for drawing them. The other two run straight up and down the page, which is what axial looks like. On a full chair there are six of each.');
                next.disabled = false;
              } else if(found === 2 && mistake){
                api.record(false);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A 1,3-diaxial interaction is...',
        options: ['A bond that forms between carbons 1 and 3', 'An attraction between two equatorial substituents', 'Steric clash between two axial substituents on the same face, at positions 1 and 3'],
        correctIndex: 2,
        correctFeedback: 'Correct — axial substituents at 1 and 3 (or equivalently 1 and 5) point toward each other on the same face and can bump into each other sterically.',
        wrongFeedback: 'No new bond forms — this is a through-space steric clash between two axial groups pointing toward each other, not a bonding interaction.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'A large A-value (like tert-butyl\'s 4.9 kcal/mol) means a substituent...',
        options: ['Strongly prefers the equatorial position, avoiding 1,3-diaxial clashes', 'Strongly prefers the axial position', 'Has no positional preference at all'],
        correctIndex: 0,
        correctFeedback: 'Correct. A-value is defined as the equatorial preference in kcal/mol — a bigger substituent has more to lose from 1,3-diaxial clashes, so it prefers equatorial even more strongly.',
        wrongFeedback: 'A-value specifically measures how much a group prefers equatorial over axial — a larger number means a stronger equatorial preference, not axial.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Real numbers: methyl vs. tert-butyl.',
        bodyHtml: '<p class="step-body">Methylcyclohexane has an A-value of about 1.7 kcal/mol for the methyl group. An energy preference translates into an actual population split — the bigger the gap, the more lopsided the mixture — and for 1.7 kcal/mol at room temperature the split works out to roughly 95:5, equatorial-methyl to axial-methyl. (The equation behind that conversion is ΔG = −RT ln K; you will not need to run it in this course, only to know that a couple of kcal/mol is already enough to make one conformation dominate.) Methylcyclohexane is mostly, but not exclusively, in the equatorial form.</p><p class="step-body" style="margin-bottom:0;">tert-Butylcyclohexane has an A-value of 4.9 kcal/mol — so much larger that the axial form is present in under three parts in ten thousand. In practice, chemists treat a tert-butyl group as permanently locking the ring into whichever chair puts it equatorial, which is a genuinely useful trick for controlling the outcome of reactions elsewhere on the ring.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Axial vs. equatorial identity isn\'t fixed — it depends which chair you\'re in.',
        bodyHtml: '<div class="explain-box">A substituent that\'s axial in one chair conformation becomes equatorial in the other — you\'ll see exactly how in the next lesson on ring flips. A-values only tell you which chair the molecule prefers overall; they don\'t mean a given atom is permanently "the axial one." Keeping this straight is essential for predicting reactivity, since some reactions (like E2 elimination) specifically require a leaving group to be axial.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Why do bulky substituents like tert-butyl strongly prefer the equatorial position?',
        options: ['Equatorial bonds are chemically stronger than axial bonds', 'Equatorial substituents point outward and avoid 1,3-diaxial steric clashes that axial substituents experience', 'Axial positions don\'t exist for large substituents'],
        correctIndex: 1,
        correctFeedback: 'Correct — the equatorial position keeps a bulky group pointing away from the ring, avoiding the steric clashes with other axial substituents that would occur at the axial position.'
      }
    ]
  });
})();
});
</script>
