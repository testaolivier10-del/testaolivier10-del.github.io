document.addEventListener('DOMContentLoaded', function(){
(function(){
  // A real chair, with the same geometry as the twelve-position figure in the
  // written section: three pairs of parallel bonds, closed. Axial bonds are
  // vertical and alternate; equatorial bonds angle outward and tilt the
  // opposite way from their own carbon's axial. The drawing that used to be
  // here was a polyline that visited one vertex twice and never closed, so it
  // was not a six-membered ring at all.
  var RING = [[256.2,80.5],[208.1,83.0],[111.9,52.1],[63.8,111.5],[111.9,109.0],[208.1,140.0]];
  function chairSvg(){
    var ring = RING.map(function(p){ return p.join(','); }).join(' ');
    var spot = function(key, from, to){
      return '<line x1="' + from[0] + '" y1="' + from[1] + '" x2="' + to[0] + '" y2="' + to[1] + '" stroke="var(--muted)" stroke-width="2.5"/>' +
        '<g class="atom" data-key="' + key + '"><circle cx="' + to[0] + '" cy="' + to[1] + '" r="9" fill="var(--white)" stroke="var(--line)" stroke-width="2"/></g>';
    };
    return '<div class="scene"><svg viewBox="0 0 320 186">' +
      '<polygon points="' + ring + '" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
      spot('ax1', RING[2], [111.9, 22.1]) +
      spot('ax2', RING[5], [208.1, 170.0]) +
      spot('eq1', RING[3], [35.5, 101.6]) +
      spot('eq2', RING[0], [284.5, 90.4]) +
    '</svg></div>';
  }


  window.OchemLessonEngine.start({
    topicId: 'axial-equatorial',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every ring carbon has an axial and an equatorial position.',
        bodyHtml: '<p class="step-body">In a cyclohexane chair, each carbon bonds to two ring carbons and has two more positions for hydrogens or other groups. An <b>axial</b> position points straight up or straight down, parallel to the axis through the middle of the ring. An <b>equatorial</b> position points outward around the rim, the ring\'s "equator."</p><p class="step-body">The axial positions alternate: up on C1, down on C2, up on C3, and so on round the ring. So C1, C3 and C5 have their axial positions on the top face.</p><p class="step-body" style="margin-bottom:0;">Each carbon\'s equatorial bond tilts slightly the opposite way from its own axial bond.</p>',
        diagramHtml: '<!-- fig:l-chair-positions:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 250" role="img" aria-label="A cyclohexane chair numbered C1 to C6. Bold vertical axial bonds point up on C1, C3 and C5 and down on C2, C4 and C6. Thin equatorial bonds point outward."><line class="fg-bond" x1="285.15" y1="105.79" x2="228.57" y2="108.69"></line><line class="fg-bond" x1="228.57" y1="108.69" x2="115.43" y2="72.28"></line><line class="fg-bond" x1="115.43" y1="72.28" x2="58.85" y2="142.21"></line><line class="fg-bond" x1="58.85" y1="142.21" x2="115.42" y2="139.31"></line><line class="fg-bond" x1="115.42" y1="139.31" x2="228.57" y2="175.72"></line><line class="fg-bond" x1="228.57" y1="175.72" x2="285.15" y2="105.79"></line><line class="fg-bond-hi" x1="285.15" y1="105.79" x2="285.15" y2="69.79"></line><line class="fg-bond-soft" x1="285.15" y1="105.79" x2="317.25" y2="116.98"></line><text class="fg-tag" x="285.15" y="63.79" text-anchor="middle" font-size="11">up</text><text class="fg-tag" x="301.71" y="105.97" text-anchor="middle" font-size="11">C1</text><line class="fg-bond-hi" x1="228.57" y1="108.69" x2="228.57" y2="144.69"></line><line class="fg-bond-soft" x1="228.57" y1="108.69" x2="249.41" y2="81.83"></line><text class="fg-tag" x="222.57" y="146.69" text-anchor="end" font-size="11">down</text><text class="fg-tag" x="211.98" y="116.4" text-anchor="middle" font-size="11">C2</text><line class="fg-bond-hi" x1="115.43" y1="72.28" x2="115.43" y2="36.28"></line><line class="fg-bond-soft" x1="115.43" y1="72.28" x2="81.63" y2="75.82"></line><text class="fg-tag" x="115.43" y="30.28" text-anchor="middle" font-size="11">up</text><text class="fg-tag" x="131.8" y="71.7" text-anchor="middle" font-size="11">C3</text><line class="fg-bond-hi" x1="58.85" y1="142.21" x2="58.85" y2="178.21"></line><line class="fg-bond-soft" x1="58.85" y1="142.21" x2="26.75" y2="131.02"></line><text class="fg-tag" x="52.85" y="180.21" text-anchor="end" font-size="11">down</text><text class="fg-tag" x="42.29" y="150.03" text-anchor="middle" font-size="11">C4</text><line class="fg-bond-hi" x1="115.42" y1="139.31" x2="115.42" y2="103.31"></line><line class="fg-bond-soft" x1="115.42" y1="139.31" x2="94.58" y2="166.17"></line><text class="fg-tag" x="115.42" y="97.31" text-anchor="middle" font-size="11">up</text><text class="fg-tag" x="132.01" y="139.6" text-anchor="middle" font-size="11">C5</text><line class="fg-bond-hi" x1="228.57" y1="175.72" x2="228.57" y2="211.72"></line><line class="fg-bond-soft" x1="228.57" y1="175.72" x2="262.37" y2="172.18"></line><text class="fg-tag" x="222.57" y="213.72" text-anchor="end" font-size="11">down</text><text class="fg-tag" x="212.2" y="184.3" text-anchor="middle" font-size="11">C6</text><text class="fg-tag-mut" x="170" y="244" text-anchor="middle" font-size="10">bold: axial. thin: equatorial.</text></svg><figcaption>One chair, with the carbons numbered C1 to C6.</figcaption></figure><!-- fig:l-chair-positions:end -->'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the two equatorial positions on this chair.</h2>' +
            '<p class="step-body">Four of the twelve positions are drawn, and none of them is labeled. Two are axial and two are equatorial. Decide which is which from the direction each bond points, then click the two equatorial ones.</p>' +
            chairSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Equatorial found: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0;
          var mistake = false;
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              if(g.classList.contains('chosen')) return;
              var key = g.getAttribute('data-key');
              g.classList.add('chosen');
              if(key.indexOf('eq') === 0){
                found++;
                hint.textContent = 'Equatorial found: ' + found + ' / 2';
              } else {
                mistake = true;
                api.showFeedback(fb, false, 'That bond runs straight up or straight down the page, so it is axial. An equatorial bond angles outward from the ring instead. Look for the two bonds that point away from the ring rather than along its axis.');
              }
              if(found === 2 && !mistake){
                api.record(true);
                api.showFeedback(fb, true, 'Right. Those two angle outward from the ring, which is what equatorial bonds do. The other two run straight up and down the page, so they are axial. A full chair has six of each.');
                next.disabled = false;
              } else if(found === 2 && mistake){
                api.record(false);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'An axial group crowds the axial hydrogens two carbons away.',
        bodyHtml: '<p class="step-body">Put a methyl group on C1 in the axial position, pointing up. The axial bonds on C3 and C5 point up too, and each carries a hydrogen. All three axial groups crowd the same face of the ring.</p><p class="step-body">This crowding is a <b>1,3-diaxial interaction</b>: steric strain between two axial groups on the same face, two carbons apart. An axial methyl has two of them, one with the axial hydrogen on C3 and one with the axial hydrogen on C5. Each costs about 0.9 kcal/mol, the same as a gauche interaction in butane.</p><p class="step-body" style="margin-bottom:0;">An equatorial methyl points out, away from the ring, and has no 1,3-diaxial interactions.</p>',
        diagramHtml: '<!-- fig:l-diaxial-clash:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 470" role="img" aria-label="Two chairs of methylcyclohexane, stacked. Top: the methyl on C1 is axial, next to the axial hydrogens on C3 and C5, with dashed lines marking the two contacts. Bottom: the methyl on C1 is equatorial and points outward."><rect class="fg-panel-warn" x="6" y="6" width="328" height="222" rx="10"></rect><rect class="fg-panel-good" x="6" y="240" width="328" height="222" rx="10"></rect><text class="fg-tag-warn" x="170" y="30" text-anchor="middle" font-size="11">METHYL AXIAL: 2 CONTACTS THROUGH SPACE</text><line class="fg-bond" x1="283.15" y1="117.79" x2="226.57" y2="120.69"></line><line class="fg-bond" x1="226.57" y1="120.69" x2="113.43" y2="84.28"></line><line class="fg-bond" x1="113.43" y1="84.28" x2="56.85" y2="154.21"></line><line class="fg-bond" x1="56.85" y1="154.21" x2="113.42" y2="151.31"></line><line class="fg-bond" x1="113.42" y1="151.31" x2="226.57" y2="187.72"></line><line class="fg-bond" x1="226.57" y1="187.72" x2="283.15" y2="117.79"></line><line class="fg-bond" x1="113.43" y1="84.28" x2="113.43" y2="62.28"></line><circle class="fg-atom" cx="113.43" cy="52.28" r="10"></circle><text class="fg-lbl" x="113.43" y="56.72" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="113.42" y1="151.31" x2="113.42" y2="131.31"></line><circle class="fg-atom" cx="113.42" cy="121.31" r="10"></circle><text class="fg-lbl" x="113.42" y="125.75" text-anchor="middle" font-size="12">H</text><line class="fg-dash-hi" x1="268.34" y1="77.39" x2="123.30" y2="53.88"></line><line class="fg-dash-hi" x1="268.58" y1="83.35" x2="123.13" y2="118.93"></line><line class="fg-bond" x1="283.15" y1="117.79" x2="283.15" y2="95.79"></line><circle class="fg-atom-warn" cx="283.15" cy="79.79" r="16"></circle><text class="fg-lbl" x="283.15" y="83.31" text-anchor="middle" font-size="9.5">CH₃</text><line class="fg-bond" x1="283.15" y1="117.79" x2="309.58" y2="127"></line><circle class="fg-atom" cx="319.02" cy="130.29" r="10"></circle><text class="fg-lbl" x="319.02" y="134.73" text-anchor="middle" font-size="12">H</text><text class="fg-tag" x="287.15" y="143.79" text-anchor="middle" font-size="11">C1</text><text class="fg-tag" x="130.77" y="83.43" text-anchor="middle" font-size="11">C3</text><text class="fg-tag" x="130.99" y="151.38" text-anchor="middle" font-size="11">C5</text><text class="fg-tag-good" x="170" y="264" text-anchor="middle" font-size="11">METHYL EQUATORIAL: NONE</text><line class="fg-bond" x1="283.15" y1="351.79" x2="226.57" y2="354.69"></line><line class="fg-bond" x1="226.57" y1="354.69" x2="113.43" y2="318.28"></line><line class="fg-bond" x1="113.43" y1="318.28" x2="56.85" y2="388.21"></line><line class="fg-bond" x1="56.85" y1="388.21" x2="113.42" y2="385.31"></line><line class="fg-bond" x1="113.42" y1="385.31" x2="226.57" y2="421.72"></line><line class="fg-bond" x1="226.57" y1="421.72" x2="283.15" y2="351.79"></line><line class="fg-bond" x1="113.43" y1="318.28" x2="113.43" y2="296.28"></line><circle class="fg-atom" cx="113.43" cy="286.28" r="10"></circle><text class="fg-lbl" x="113.43" y="290.72" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="113.42" y1="385.31" x2="113.42" y2="365.31"></line><circle class="fg-atom" cx="113.42" cy="355.31" r="10"></circle><text class="fg-lbl" x="113.42" y="359.75" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="283.15" y1="351.79" x2="283.15" y2="323.79"></line><circle class="fg-atom" cx="283.15" cy="313.79" r="10"></circle><text class="fg-lbl" x="283.15" y="318.23" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="283.15" y1="351.79" x2="303.91" y2="359.03"></line><circle class="fg-atom-hi" cx="319.02" cy="364.29" r="16"></circle><text class="fg-lbl" x="319.02" y="367.81" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-tag" x="287.15" y="377.79" text-anchor="middle" font-size="11">C1</text><text class="fg-tag" x="130.77" y="317.43" text-anchor="middle" font-size="11">C3</text><text class="fg-tag" x="130.99" y="385.38" text-anchor="middle" font-size="11">C5</text></svg><figcaption>Methylcyclohexane in two chair shapes. Dashed lines mark the 1,3-diaxial contacts.</figcaption></figure><!-- fig:l-diaxial-clash:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'A methyl group sits axial on C1, pointing up. Which hydrogens does it have 1,3-diaxial interactions with?',
        options: ['The axial hydrogens on C3 and C5', 'The axial hydrogens on C2 and C6', 'The equatorial hydrogens on C3 and C5'],
        correctIndex: 0,
        correctFeedback: 'Right. C3 and C5 are each two carbons from C1, and their axial bonds point up like C1\'s. All three axial groups share the top face.',
        wrongFeedback: 'Axial directions alternate, so the axial bonds on C2 and C6 point down, to the other face. Equatorial bonds point out, away from the ring. Only the axial hydrogens on C3 and C5 share the top face with the methyl.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The A-value measures how strongly a group prefers equatorial.',
        bodyHtml: '<p class="step-body">Methylcyclohexane can take a chair with the methyl axial or a chair with the methyl equatorial. The ring turns from one chair to the other without breaking any bond, so the two chairs are two conformations, like the anti and gauche forms of butane. Both are present at once, and the lower-energy one is the more common.</p><p class="step-body">The <b>A-value</b> of a group is the energy gap between those two chairs: how much lower in energy, in kcal/mol, the chair with the group equatorial is. For a methyl group it is 1.7 kcal/mol, which puts about 95% of methylcyclohexane in the equatorial chair at room temperature.</p><p class="step-body">For <i>tert</i>-butyl the A-value is 4.9 kcal/mol, and fewer than three molecules in ten thousand have it axial. A <i>tert</i>-butyl group therefore holds a ring in the chair that puts it equatorial.</p><p class="step-body" style="margin-bottom:0;">The notes show how to turn an A-value into this ratio.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Independent Practice',
        title: 'The A-value of isopropyl is 2.2 kcal/mol, and the A-value of chlorine is 0.5 kcal/mol. What do these numbers tell you?',
        options: ['Isopropyl prefers equatorial more strongly than chlorine', 'Chlorine prefers equatorial more strongly than isopropyl', 'Both groups prefer the axial position'],
        correctIndex: 0,
        correctFeedback: 'Right. Both A-values are positive, so both groups prefer equatorial. A larger A-value means a larger energy gap between the two chairs, so the isopropyl group\'s preference is the stronger one.',
        wrongFeedback: 'An A-value is how much lower in energy the chair with the group equatorial is. Any positive value means equatorial is preferred, and a larger value means a stronger preference: 2.2 for isopropyl beats 0.5 for chlorine.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Placing two groups on one chair.',
        bodyHtml: '<p class="step-body">Two groups on a ring are <b>cis</b> when they sit on the same face and <b>trans</b> when they sit on opposite faces. Whether two groups share a face is fixed for the compound, because moving one group to the other face would mean breaking a bond.</p><p class="step-body">To place a group on a chair, pick its face, then use whichever of that carbon\'s two bonds points to that face. Take a chair where C1\'s axial bond points up. A group on C1\'s top face sits on the axial bond. C2\'s axial bond points down, so a group on C2\'s top face sits on the equatorial bond, and a group on C2\'s bottom face sits on the axial bond.</p><p class="step-body" style="margin-bottom:0;">So up is not the same as axial. In the drawing, both methyls point up, which makes the pair <i>cis</i>, yet one is axial and the other equatorial.</p>',
