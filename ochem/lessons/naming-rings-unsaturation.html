// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred

document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* 1,3-Dimethylcyclohexane. The student picks which ring carbon to call C1.

     A ring has no ends, so nothing about the drawing settles where numbering
     starts — you choose, subject to the lowest-locant rule. Either methyl-
     bearing carbon is a correct C1 (both give {1,3}); every other choice
     gives a higher set. Two right answers rather than one is the point: the
     step is testing the rule, not a memorized position. After the click the
     ring is numbered, so the {1,3} the feedback talks about is on screen. */
  var R = 52, CX = 100, CY = 96;
  var RING = [];
  for(var i = 0; i < 6; i++){
    var th = (Math.PI / 180) * (90 + i * 60);
    RING.push({ key:'v' + i, x: +(CX + R * Math.cos(th)).toFixed(1), y: +(CY - R * Math.sin(th)).toFixed(1) });
  }
  var METHYLS = ['v0', 'v2'];   // two apart: a 1,3 relationship

  function ringSvg(){
    var lines = RING.map(function(p, i){
      var q = RING[(i + 1) % 6];
      return '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y +
             '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
    }).join('');
    // Each methyl is drawn as a stub pointing away from the ring center.
    var subs = METHYLS.map(function(k){
      var p = RING.filter(function(v){ return v.key === k; })[0];
      var dx = (p.x - CX) / R, dy = (p.y - CY) / R;
      return '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + (p.x + dx * 26).toFixed(1) +
             '" y2="' + (p.y + dy * 26).toFixed(1) + '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
    }).join('');
    var hits = RING.map(function(p){
      return '<g class="atom" data-key="' + p.key + '" role="button" tabindex="0" ' +
        'aria-label="ring carbon' + (METHYLS.indexOf(p.key) !== -1 ? ', bearing a methyl' : '') + '">' +
        '<circle cx="' + p.x + '" cy="' + p.y + '" r="10" fill="transparent" stroke="transparent" stroke-width="2"/></g>';
    }).join('');
    return '<div class="scene"><svg viewBox="0 0 200 190" role="group" ' +
      'aria-label="A six-membered ring with methyl groups on two carbons separated by one unsubstituted carbon.">' +
      lines + hits + '<g pointer-events="none">' + subs + '<g id="ringNums"></g></g></svg></div>';
  }

  /* Writes 1 to 6 inside the ring, starting at vertex `start` and stepping
     `dir` (+1 or -1) round the ring. */
  function numberRing(svg, start, dir){
    var g = svg.querySelector('#ringNums');
    if(!g) return;
    var out = '';
    for(var n = 0; n < 6; n++){
      var p = RING[((start + dir * n) % 6 + 6) % 6];
      var x = (CX + (p.x - CX) * 0.5).toFixed(1), y = (CY + (p.y - CY) * 0.5 + 5).toFixed(1);
      out += '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">' + (n + 1) + '</text>';
    }
    g.innerHTML = out;
  }

  window.OchemLessonEngine.start({
    topicId: 'naming-rings-unsaturation',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A ring parent gets cyclo-, and it has no ends to start from.',
        bodyHtml: '<p class="step-body">Six carbons in a ring make <b>cyclohexane</b>: the six-carbon root with <b>cyclo-</b> in front. Five make <b>cyclopentane</b>, and three make <b>cyclopropane</b>. As a substituent on something else, the ring takes <i>-yl</i>: <b>cyclohexyl</b>, <b>cyclopentyl</b>, <b>cyclopropyl</b>.</p>' +
          '<p class="step-body">A ring has no ends, so you choose which carbon is C1 and which way to count. With one substituent there is nothing to choose. The name is <b>methylcyclohexane</b>, with no number, because every ring carbon is equivalent.</p>' +
          '<p class="step-body" style="margin-bottom:0;">With two substituents, start on one of them and count the short way to the other. Below, an ethyl and a methyl give {1,3} whichever one you start on. When the sets tie like this, the group that comes first in the alphabet takes the lower number: <b>1-ethyl-3-methylcyclohexane</b>.</p>',
        diagramHtml: '<!-- fig:ring-two-substituents:start --><figure class="notes-figure notes-figure--wide" style="--vb:360"><svg viewBox="0 0 360 628" role="img" aria-label="Three cyclohexane rings, stacked. Top: methylcyclohexane, with no numbers. Middle: an ethyl and a methyl with one ring carbon between them, numbered from the ethyl carbon, giving 1-ethyl-3-methylcyclohexane. Bottom: the same molecule numbered from the methyl carbon, which also gives the set 1,3 but loses on alphabetical order: 3-ethyl-1-methylcyclohexane."><rect class="fg-panel" x="8" y="8" width="344" height="176" rx="10"></rect><text class="fg-tag" x="180" y="28" text-anchor="middle" font-size="11">one substituent</text><line class="fg-bond" x1="180" y1="48" x2="214.64" y2="68"></line><line class="fg-bond" x1="214.64" y1="68" x2="214.64" y2="108"></line><line class="fg-bond" x1="214.64" y1="108" x2="180" y2="128"></line><line class="fg-bond" x1="180" y1="128" x2="145.36" y2="108"></line><line class="fg-bond" x1="145.36" y1="108" x2="145.36" y2="68"></line><line class="fg-bond" x1="145.36" y1="68" x2="180" y2="48"></line><line class="fg-bond" x1="214.64" y1="108" x2="238.89" y2="122"></line><text class="fg-sm" x="245.95" y="129.5" text-anchor="start" font-size="10">methyl</text><text class="fg-tag-good" x="180" y="154" text-anchor="middle" font-size="11.5">methylcyclohexane</text><text class="fg-sm" x="180" y="170" text-anchor="middle" font-size="10">no number: every ring carbon is equivalent</text><rect class="fg-panel-hi" x="8" y="194" width="344" height="204" rx="10"></rect><text class="fg-tag" x="180" y="214" text-anchor="middle" font-size="11">start at the ethyl</text><line class="fg-bond" x1="180" y1="234" x2="214.64" y2="254"></line><line class="fg-bond" x1="214.64" y1="254" x2="214.64" y2="294"></line><line class="fg-bond" x1="214.64" y1="294" x2="180" y2="314"></line><line class="fg-bond" x1="180" y1="314" x2="145.36" y2="294"></line><line class="fg-bond" x1="145.36" y1="294" x2="145.36" y2="254"></line><line class="fg-bond" x1="145.36" y1="254" x2="180" y2="234"></line><line class="fg-bond" x1="214.64" y1="294" x2="238.89" y2="308"></line><text class="fg-sm" x="245.95" y="315.5" text-anchor="start" font-size="10">methyl</text><line class="fg-bond" x1="145.36" y1="294" x2="121.11" y2="308"></line><line class="fg-bond" x1="121.11" y1="308" x2="121.11" y2="336"></line><text class="fg-sm" x="121.11" y="354" text-anchor="middle" font-size="10">ethyl</text><text class="fg-lbl" x="180" y="254" text-anchor="middle" font-size="11">5</text><text class="fg-lbl" x="200.78" y="266" text-anchor="middle" font-size="11">4</text><text class="fg-lbl" x="200.78" y="290" text-anchor="middle" font-size="11">3</text><text class="fg-lbl" x="180" y="302" text-anchor="middle" font-size="11">2</text><text class="fg-lbl" x="159.22" y="290" text-anchor="middle" font-size="11">1</text><text class="fg-lbl" x="159.22" y="266" text-anchor="middle" font-size="11">6</text><text class="fg-tag-good" x="180" y="368" text-anchor="middle" font-size="11.5">1-ethyl-3-methylcyclohexane</text><text class="fg-sm" x="180" y="384" text-anchor="middle" font-size="10">set {1,3}, and ethyl is first in the alphabet</text><rect class="fg-panel-warn" x="8" y="408" width="344" height="204" rx="10"></rect><text class="fg-tag" x="180" y="428" text-anchor="middle" font-size="11">start at the methyl</text><line class="fg-bond" x1="180" y1="448" x2="214.64" y2="468"></line><line class="fg-bond" x1="214.64" y1="468" x2="214.64" y2="508"></line><line class="fg-bond" x1="214.64" y1="508" x2="180" y2="528"></line><line class="fg-bond" x1="180" y1="528" x2="145.36" y2="508"></line><line class="fg-bond" x1="145.36" y1="508" x2="145.36" y2="468"></line><line class="fg-bond" x1="145.36" y1="468" x2="180" y2="448"></line><line class="fg-bond" x1="214.64" y1="508" x2="238.89" y2="522"></line><text class="fg-sm" x="245.95" y="529.5" text-anchor="start" font-size="10">methyl</text><line class="fg-bond" x1="145.36" y1="508" x2="121.11" y2="522"></line><line class="fg-bond" x1="121.11" y1="522" x2="121.11" y2="550"></line><text class="fg-sm" x="121.11" y="568" text-anchor="middle" font-size="10">ethyl</text><text class="fg-lbl" x="180" y="468" text-anchor="middle" font-size="11">5</text><text class="fg-lbl" x="200.78" y="480" text-anchor="middle" font-size="11">6</text><text class="fg-lbl" x="200.78" y="504" text-anchor="middle" font-size="11">1</text><text class="fg-lbl" x="180" y="516" text-anchor="middle" font-size="11">2</text><text class="fg-lbl" x="159.22" y="504" text-anchor="middle" font-size="11">3</text><text class="fg-lbl" x="159.22" y="480" text-anchor="middle" font-size="11">4</text><text class="fg-tag-warn" x="180" y="582" text-anchor="middle" font-size="11.5">3-ethyl-1-methylcyclohexane</text><text class="fg-sm" x="180" y="598" text-anchor="middle" font-size="10">also {1,3}: a tie, lost on the alphabet</text></svg><figcaption>Follow the numbers round each ring. Both numberings of the ethyl–methyl ring start on a substituted carbon and take the short way to the other one, and both land on 1 and 3.</figcaption></figure><!-- fig:ring-two-substituents:end -->'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which carbon should be numbered C1?</h2>' +
            '<p class="step-body">Two methyl groups on a cyclohexane ring. Nothing in the drawing says where to start counting. You choose, and the lowest-locant rule decides whether you chose well. Click the carbon you would call C1.</p>' +
            ringSvg() +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var svg = api.card.querySelector('.scene svg');
          var settled = false;

          function take(g){
            if(settled) return;
            var key = g.getAttribute('data-key');
            var right = METHYLS.indexOf(key) !== -1;
            if(!right){
              g.classList.add('atom--wrong');
              // Show the numbering that does work, from the top methyl.
              numberRing(svg, 0, 1);
              api.showFeedback(fb, false, 'That carbon has nothing on it. Starting there pushes both methyls to higher numbers, a set like {2,4} or {2,6} instead of {1,3}. The ring now shows a numbering that starts on a methyl carbon and reaches the other methyl at C3.');
              api.record(false);
              settled = true;
              next.disabled = false;
              return;
            }
            g.classList.add('atom--correct');
            // Count from the clicked methyl the short way to the other one.
            numberRing(svg, key === 'v0' ? 0 : 2, key === 'v0' ? 1 : -1);
            api.showFeedback(fb, true, 'Right. The ring is now numbered from your carbon, and the other methyl lands on C3. Either methyl carbon works: both give the set {1,3}, and the two methyls are the same group, so the name is 1,3-dimethylcyclohexane either way.');
            api.record(true);
            settled = true;
            next.disabled = false;
          }

          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){ take(g); });
            g.addEventListener('keydown', function(e){
              if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); take(g); }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'With three substituents, the locant set decides before the alphabet.',
        bodyHtml: '<p class="step-body">Below, a ring carries a methyl, an ethyl on the next carbon, and a second methyl two carbons further round. If the ethyl takes C1, the best set is {1,2,5}. If the neighboring methyl takes C1, the set is {1,2,4}.</p>' +
