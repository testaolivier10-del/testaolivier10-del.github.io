(function(){
  window.OchemLessonEngine.start({
    topicId: 'amine-structure',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('ethylamine', { caption: 'Ethylamine. That available nitrogen lone pair is exactly what makes an amine basic — and exactly what an amide gives away to resonance.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A nitrogen lone pair makes amines the most reliable organic base.',
        bodyHtml: '<p class="step-body">An amine nitrogen is sp³ hybridized, with three bonds and one lone pair pointing away from them — a lone pair that\'s available to grab a proton, making every simple amine both a Brønsted-Lowry base (Bronsted lesson) and a Lewis base (Lewis Acids lesson). A typical alkylamine\'s conjugate acid (an ammonium ion, R–NH₃⁺) has a pKa around 10-11 — meaning the neutral amine itself is a genuinely strong base, readily protonated by almost anything more acidic than water.</p><p class="step-body" style="margin-bottom:0;">This makes amines the single most dependable basic (and nucleophilic) functional group across the whole course — but as this lesson shows, that lone pair\'s availability can be dramatically reduced depending on what else, structurally, it\'s needed for.</p>'
      },
      {
        render: function(api){
          var items = [
            { key: 'alkyl', label: 'Cyclohexylamine (alkylamine), pKaH ≈ 10.7', rank: 1 },
            { key: 'ammonia', label: 'Ammonia, pKaH ≈ 9.2', rank: 2 },
            { key: 'aniline', label: 'Aniline (lone pair conjugated into a ring), pKaH ≈ 4.6', rank: 3 },
            { key: 'amide', label: 'Acetamide (lone pair conjugated into a carbonyl), pKaH ≈ −1', rank: 4 }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click these four nitrogen bases from most basic to least basic.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + items.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 4</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['alkyl', 'ammonia', 'aniline', 'amide'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var key = btn.getAttribute('data-v');
              if(key === order[idx]){
                btn.disabled = true;
                btn.classList.add('correct');
                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 4';
                if(idx === 4){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. The pattern: the more the lone pair is tied up in resonance elsewhere, the less basic the nitrogen.' : 'Exactly right — alkylamine > ammonia > arylamine > amide, tracking exactly how available the nitrogen lone pair is to accept a proton.');
                  next.disabled = false;
                }
              } else {
                mistake = true;
                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why is aniline (pKaH ≈ 4.6) roughly a million times less basic than cyclohexylamine (pKaH ≈ 10.7)?',
        options: ['Aniline\'s nitrogen lone pair is delocalized into the aromatic ring by resonance, making it far less available to accept a proton', 'Aniline\'s nitrogen is a different element than cyclohexylamine\'s', 'Aromatic rings always make every attached group less reactive, with no specific mechanism'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is the Resonance factor from the ARIO framework, applied to basicity instead of acidity: a delocalized lone pair is a less available lone pair.',
        wrongFeedback: 'Both nitrogens are the same element — the difference is entirely about how available the lone pair is, and resonance delocalization into the ring is what ties it up in aniline.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Amides take resonance delocalization to the extreme — barely basic at all.',
        bodyHtml: '<p class="step-body">Recall from the Esters &amp; Amides lesson that an amide nitrogen is an exceptionally strong resonance donor into the adjacent carbonyl — the best donor of any carboxylic acid derivative, which is exactly why amides sit at the bottom of the acyl-substitution reactivity ladder. That same heavy delocalization, viewed from the basicity angle, means the amide nitrogen\'s lone pair is mostly tied up conjugating with the carbonyl rather than sitting free to accept a proton.</p><p class="step-body" style="margin-bottom:0;">The result: an amide\'s conjugate acid has a pKa around −1 — meaning the neutral amide is barely basic at all under ordinary aqueous conditions, and definitely not comparable to an ordinary alkylamine\'s clearly basic character. (If protonation does occur under strongly acidic conditions, it actually happens on the carbonyl oxygen, not nitrogen — a detail that itself confirms how little basic character is left on nitrogen.)</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why is an amide such a poor nucleophile and such a poor base at the same time?',
        options: ['Nucleophilicity and basicity are unrelated properties with no common cause here', 'Both properties trace back to the same cause — the nitrogen lone pair is heavily delocalized by resonance into the carbonyl, leaving little electron density available for either role', 'Amide nitrogen simply has no lone pair at all'],
        correctIndex: 1,
        correctFeedback: 'Correct — nucleophilicity and basicity both fundamentally depend on lone-pair availability, so anything (like resonance delocalization) that reduces one tends to reduce the other as well.',
        wrongFeedback: 'These two properties are closely related here — both come down to how available the nitrogen lone pair actually is, and resonance into the carbonyl reduces that availability for both roles at once.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Alkyl substitution\'s effect on basicity is real but small — and solvent matters.',
        bodyHtml: '<p class="step-body">More alkyl groups on nitrogen donate more electron density by induction (the same effect behind carbocation and alkene stability trends), which in the gas phase makes a more substituted amine measurably more basic. But basicity is normally measured in water, and water solvates (hydrogen-bonds with and stabilizes) a protonated ammonium ion through its N–H bonds — a more substituted ammonium ion has fewer N–H bonds left to do this.</p><p class="step-body" style="margin-bottom:0;">These two effects (inductive donation favoring more substitution, solvation favoring less) partially cancel, so in aqueous solution primary, secondary, and tertiary alkylamines all cluster in a fairly narrow pKaH range (roughly 9-11) instead of showing a large, clean trend — a useful reminder that a real reaction environment (solvent) can complicate a purely electronic prediction.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'Pyridine (an aromatic ring with a nitrogen whose lone pair sits in an sp² orbital not conjugated into the ring) has pKaH ≈ 5.2 — much more basic than aniline (pKaH ≈ 4.6) despite pyridine also being aromatic. What does this suggest?',
        options: ['The pKaH values must be measurement errors, since all aromatic amines should behave identically', 'Pyridine isn\'t really aromatic', 'Being part of an aromatic system doesn\'t automatically kill basicity — what matters specifically is whether the lone pair itself is delocalized into the ring or held in a separate, non-conjugated orbital'],
        correctIndex: 2,
        correctFeedback: 'Correct — pyridine\'s nitrogen lone pair sits in an sp² orbital in the ring plane, not conjugated with the aromatic pi system, so it remains available to accept a proton, unlike aniline\'s lone pair which is directly part of the conjugated system.',
        wrongFeedback: 'Pyridine is genuinely aromatic — the key distinction is exactly where its nitrogen lone pair sits (not conjugated into the ring), which is different from aniline\'s conjugated lone pair.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Rank these three nitrogen compounds from most to least basic: (1) an ordinary alkylamine, (2) an amide, (3) aniline.',
        options: ['Alkylamine > aniline > amide', 'Amide > aniline > alkylamine', 'Aniline > alkylamine > amide'],
        correctIndex: 0,
        correctFeedback: 'Correct — this ranking follows directly from how tied up each lone pair is: fully available (alkylamine), partially delocalized into an aromatic ring (aniline), and almost fully delocalized into a carbonyl (amide).'
      }
    ]
  });
