    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The alpha carbon: right next to the carbonyl, and dramatically more acidic there.',
        bodyHtml: '<p class="step-body">The carbon bonded directly to a carbonyl carbon is the <b>alpha carbon</b>; hydrogens on it are <b>alpha hydrogens</b>. Removing one with a strong enough base gives a carbanion sitting immediately next to the carbonyl — and that carbanion isn\'t stuck being a plain, high-energy carbanion. Its lone pair can delocalize into the adjacent carbonyl pi system by resonance, spreading the negative charge onto the far more electronegative oxygen instead of leaving it localized on carbon.</p><p class="step-body" style="margin-bottom:0;">This resonance-stabilized anion is called an <b>enolate</b>, and the effect is enormous: a ketone\'s alpha C–H (pKa ≈ 20) is roughly 10³⁰ times more acidic than an ordinary alkane C–H (pKa ≈ 50) with no adjacent carbonyl to delocalize into.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Acetone\'s enolate: click the atom that carries most of the negative charge in the dominant resonance form.</h2>' +
            '<div style="display:flex;justify-content:center;padding:20px 0;">' +
            '<svg width="260" height="140" viewBox="0 0 260 140">' +
              '<line x1="60" y1="100" x2="120" y2="70" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="120" y1="70" x2="120" y2="25" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="120" y1="70" x2="180" y2="100" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="180" y1="100" x2="230" y2="70" stroke="var(--ink)" stroke-width="2"/>' +
              '<circle cx="120" cy="70" r="13" fill="var(--card-bg)" stroke="var(--border)" stroke-width="2"/>' +
              '<text x="120" y="75" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">C</text>' +
              '<circle class="atom" data-v="o" cx="120" cy="15" r="16" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" style="cursor:pointer;"/>' +
              '<text x="120" y="20" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)" style="pointer-events:none;">O</text>' +
              '<circle class="atom" data-v="cAlpha" cx="180" cy="100" r="14" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" style="cursor:pointer;"/>' +
              '<text x="180" y="105" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)" style="pointer-events:none;">Cα</text>' +
            '</svg></div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.atom').forEach(function(el){
            el.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = el.getAttribute('data-v') === 'o';
              el.setAttribute('stroke', isCorrect ? '#2e9e5b' : '#c0392b');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Correct — the dominant resonance form places the negative charge on oxygen (the more electronegative atom), not on the alpha carbon. The carbon-centered form is a real but minor contributor.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why is an alpha C–H (pKa ≈ 20) so much more acidic than a plain alkane C–H (pKa ≈ 50)?',
        options: ['Alpha carbons simply have fewer hydrogens attached', 'The resulting carbanion is resonance-stabilized as an enolate, delocalizing the negative charge onto the adjacent carbonyl oxygen', 'Carbonyls make every nearby bond weaker'],
        correctIndex: 1,
        correctFeedback: 'Correct — this is the Resonance factor from the ARIO framework producing the largest acidifying effect you\'ve seen in the course.',
        wrongFeedback: 'Hydrogen count and bond strength aren\'t the deciding factors — it\'s specifically about resonance stabilization of the resulting anion (the enolate).'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Enol and keto are tautomers — not resonance structures.',
        bodyHtml: '<p class="step-body">Because the enolate\'s negative charge is shared between carbon and oxygen, protonating it can happen at either site. Protonating the carbon regenerates the ordinary ketone (or aldehyde). Protonating the oxygen instead gives the <b>enol</b> — a C=C bearing an OH group, structurally identical to the fleeting intermediate from acid-catalyzed alkyne hydration (Alkynes lesson).</p><p class="step-body" style="margin-bottom:0;">Enol and keto forms are <b>tautomers</b>: real, distinct constitutional isomers (their atoms are bonded differently — the double bond and the mobile proton are in different places) that rapidly interconvert through the enolate (or via direct proton transfer under acid catalysis). This is fundamentally different from resonance structures, which describe the same molecule\'s electron distribution without moving any atoms.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'What is the key structural difference between resonance structures and tautomers?',
        options: ['They are two names for exactly the same phenomenon', 'Tautomers only exist for aromatic molecules', 'Resonance structures describe the same molecule (only electrons move); tautomers are genuinely different constitutional isomers (atoms, including a proton, actually move)'],
        correctIndex: 2,
        correctFeedback: 'Correct — this distinction matters throughout this module: keto and enol forms are two real, isolable-in-principle molecules interconverting, not two drawings of one unchanging molecule.',
        wrongFeedback: 'These are genuinely different concepts — resonance is about electron delocalization within one fixed set of atomic positions, while tautomers involve an actual atom (a proton) moving to a different location.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The keto form wins the equilibrium by a huge margin — but the enol still matters.',
        bodyHtml: '<div class="explain-box">For acetone, the keto-enol equilibrium favors the keto form by roughly 10⁶:1 — the strong, resonance-supported C=O bond is simply lower in energy than the corresponding C=C–OH. This is why you always draw and isolate "the" structure as the keto form. But that small, ever-present, dynamically-interconverting enol population (and the resonance-stabilized enolate that connects the two forms) is exactly the reactive species that makes every reaction in the rest of this module — aldol and Claisen chemistry — possible. Alpha-carbon reactivity essentially never proceeds through the keto form directly; it always goes through the enol or enolate.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'A ketone is treated with a strong base like LDA (lithium diisopropylamide, a very strong, bulky, non-nucleophilic base). What is the most likely first thing to happen?',
        options: ['LDA deprotonates the acidic alpha hydrogen, forming the resonance-stabilized enolate', 'LDA attacks the carbonyl carbon as a nucleophile, forming a tetrahedral intermediate', 'Nothing happens — ketones don\'t react with strong bases'],
        correctIndex: 0,
        correctFeedback: 'Correct — LDA is specifically chosen in synthesis because its bulk prevents it from acting as a nucleophile toward the carbonyl carbon, so it reliably removes the much more accessible, much more acidic alpha proton instead.',
        wrongFeedback: 'LDA is deliberately designed to be too sterically hindered to attack the carbonyl carbon as a nucleophile — its role is almost always as a base, removing the acidic alpha hydrogen.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Comparing a ketone\'s alpha C–H (pKa ≈ 20) to a carboxylic acid\'s O–H (pKa ≈ 4-5) — both are stabilized by resonance into an adjacent oxygen system. Why is the carboxylic acid so much more acidic despite both effects being "resonance stabilization"?',
        options: ['The acidities are actually identical once you account for resonance', 'The carboxylate\'s negative charge is delocalized over two equivalent, highly electronegative oxygens; the enolate\'s charge is shared between one oxygen and one (less electronegative) carbon', 'Carboxylic acids simply have more total atoms'],
        correctIndex: 1,
        correctFeedback: 'Correct — both anions benefit from resonance delocalization, but carboxylate spreads charge over two electronegative oxygens equally, while the enolate\'s second resonance contributor still puts real electron density on a less electronegative carbon — a meaningfully smaller stabilization, which is exactly why the acidity gap is so large (about 15 pKa units, or roughly 10¹⁵).'
      }
    ]
  });
