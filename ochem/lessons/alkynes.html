<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'alkynes',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('propyne'),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A triple bond is one sigma bond plus two pi bonds — and it forces a straight line.',
        bodyHtml: '<p class="step-body">Alkyne carbons are <b>sp hybridized</b>: each forms two sigma bonds using sp orbitals oriented exactly 180° apart, with two leftover, perpendicular p orbitals forming <b>two pi bonds</b> at once (compare: sp² alkene carbons have one leftover p orbital and one pi bond). A C≡C triple bond is therefore one sigma bond plus two pi bonds — more bonding electron density packed into the same two atoms than any other common carbon-carbon bond.</p><p class="step-body" style="margin-bottom:0;">The 180° angle between the two sp orbitals means the triple-bond carbon and both atoms attached to it are forced into a perfectly straight line. This is why terminal and internal alkynes are drawn (and are) linear at the triple bond, unlike the bent, trigonal-planar geometry around an alkene.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the correct approximate bond angle at each type of carbon.</h2>' +
            '<p class="step-body">Match sp, sp², and sp³ carbons to their characteristic bond angle.</p>' +
            '<div class="choice-row" style="flex-direction:column;">' +
              '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;"><span style="font:800 13px var(--font-mono);width:130px;">sp (alkyne)</span>' +
                '<button class="choice-btn opt" data-g="sp" data-v="180">180°</button><button class="choice-btn opt" data-g="sp" data-v="120">120°</button><button class="choice-btn opt" data-g="sp" data-v="109">109.5°</button></div>' +
              '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;"><span style="font:800 13px var(--font-mono);width:130px;">sp² (alkene)</span>' +
                '<button class="choice-btn opt" data-g="sp2" data-v="180">180°</button><button class="choice-btn opt" data-g="sp2" data-v="120">120°</button><button class="choice-btn opt" data-g="sp2" data-v="109">109.5°</button></div>' +
              '<div style="display:flex;gap:10px;align-items:center;"><span style="font:800 13px var(--font-mono);width:130px;">sp³ (alkane)</span>' +
                '<button class="choice-btn opt" data-g="sp3" data-v="180">180°</button><button class="choice-btn opt" data-g="sp3" data-v="120">120°</button><button class="choice-btn opt" data-g="sp3" data-v="109">109.5°</button></div>' +
            '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin:10px 0 16px;">Correct: 0 / 3</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var answers = { sp: '180', sp2: '120', sp3: '109' };
          var correctCount = 0, mistake = false, groupsDone = {};
          api.card.querySelectorAll('.opt').forEach(function(btn){
            btn.addEventListener('click', function(){
              var g = btn.getAttribute('data-g');
              if(groupsDone[g]) return;
              groupsDone[g] = true;
              api.card.querySelectorAll('.opt[data-g="' + g + '"]').forEach(function(b){ b.disabled = true; });
              var isCorrect = btn.getAttribute('data-v') === answers[g];
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              if(isCorrect) correctCount++; else mistake = true;
              hint.textContent = 'Correct: ' + correctCount + ' / 3';
              if(Object.keys(groupsDone).length === 3){
                api.record(!mistake);
                api.showFeedback(fb, !mistake, mistake ? 'Close — the pattern is sp=180° (linear), sp²=120° (trigonal planar), sp³=109.5° (tetrahedral). More pi bonds means fewer sigma-bond directions to space out, and a wider angle between them.' : 'Exactly right — sp (alkyne, linear, 180°), sp² (alkene, trigonal planar, 120°), sp³ (alkane, tetrahedral, 109.5°). Fewer sigma bonds around a carbon means they can spread out wider.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why is a terminal alkyne C–H (pKa ≈ 25) so much more acidic than an alkane C–H (pKa ≈ 50)?',
        options: ['The conjugate base\'s lone pair sits in an sp orbital (50% s-character), which is far more stabilizing than an sp³ carbanion (25% s-character)', 'Triple bonds are simply weaker than single bonds', 'Alkynes have more hydrogen atoms overall'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is the Orbital factor from the ARIO framework: more s-character holds the anion\'s electron density closer to the nucleus, stabilizing the conjugate base and raising acidity.',
        wrongFeedback: 'It comes down to orbital hybridization of the resulting carbanion, not bond strength or hydrogen count — recall the Orbital factor from the ARIO acidity framework.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Which base could realistically deprotonate a terminal alkyne (pKa ≈ 25) to a useful extent?',
        options: ['NaOH (conjugate acid H₂O, pKa ≈ 15.7)', 'NaNH₂ (conjugate acid NH₃, pKa ≈ 38)', 'Neither — terminal alkynes cannot be deprotonated'],
        correctIndex: 1,
        correctFeedback: 'Correct — the equilibrium favors the side with the weaker acid (higher pKa). NH₃ (pKa 38) is a far weaker acid than the alkyne (pKa 25), so amide strongly favors deprotonation. Water (pKa 15.7) is already a stronger acid than the alkyne, so hydroxide can\'t deprotonate it usefully.',
        wrongFeedback: 'Apply the pKa comparison rule from the pKa lesson: the equilibrium favors the side with the weaker acid (higher pKa). Compare 25 (alkyne) against each base\'s conjugate acid.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Acetylide anions: alkynes\' one reliable path to a new C–C bond.',
        bodyHtml: '<p class="step-body">Once deprotonated by a strong enough base like NaNH₂, a terminal alkyne becomes an <b>acetylide anion</b> — a small, localized, highly reactive carbanion. Acetylides act as excellent nucleophiles in SN2 reactions (Module 6): attacking an unhindered primary alkyl halide displaces the leaving group and forges a brand-new carbon-carbon bond, extending the carbon skeleton by however many carbons the alkyl halide contributed.</p><p class="step-body" style="margin-bottom:0;">This sequence — deprotonate, then SN2 with an alkyl halide — is one of the few dependable ways early in the course to actually build a longer carbon chain from two smaller pieces, rather than just transforming a functional group already in place.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two pi bonds mean addition can stop halfway, or go all the way.',
        bodyHtml: '<p class="step-body">An alkyne\'s two pi bonds mean it can accept an electrophilic addition (H₂, X₂, HX) once, landing on an alkene, or twice, landing on a fully saturated alkane. Which one happens depends entirely on the reagent: H₂ with a normal Pd or Pt catalyst reduces all the way to the alkane, but H₂ with a specially poisoned <b>Lindlar catalyst</b> stops cleanly at the alkene and delivers <b>syn</b> (same-face) addition — producing the <b>cis</b> alkene specifically.</p><p class="step-body" style="margin-bottom:0;">Acid-catalyzed hydration (H₃O⁺, Hg²⁺ catalyst) adds water Markovnikov-style across one pi bond, but the immediate product — an <b>enol</b> (a carbon-carbon double bond with an OH on one of the two carbons) — is unstable and rapidly rearranges (tautomerizes) into a ketone (or an aldehyde, for a terminal alkyne). You\'ll see this same enol-to-carbonyl tautomerization become a central mechanism in Enolate Chemistry (Module 11).</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Check Understanding',
        title: 'You need to convert an internal alkyne into a cis alkene, stopping cleanly before full reduction to the alkane. What should you use?',
        options: ['H₂ with a normal Pd/C catalyst', 'NaNH₂', 'H₂ with a Lindlar catalyst'],
        correctIndex: 2,
        correctFeedback: 'Correct — Lindlar\'s poisoned, less active catalyst is specifically chosen to stop the reduction at the alkene stage and deliver syn (cis) addition.',
        wrongFeedback: 'A normal Pd/C catalyst won\'t stop at the alkene — it reduces all the way to the alkane. NaNH₂ is a base for deprotonation, not a reducing agent.'
      },
      {
        /* Acetylide formation. The lesson explains the pKa 25 figure at
           length; this makes the student draw the step that figure is
           about. */
        render: function(api){
          window.OchemArrowStep.mount(api, {
            eyebrow: 'Draw it',
            title: 'Sodium amide removes the terminal alkyne proton. Draw the arrow.',
            bodyHtml: '<p class="step-body">One arrow. Only one hydrogen in this molecule is acidic enough for amide to take — and once it is gone, the electrons left behind are the acetylide nucleophile.</p>',
            molecule: 'propyne',
            concepts: ['alkyne-acidity', 'curved-arrow-direction'],
            arrows: [{ from: 'bond:c2-h', to: 'c2' }],
            hint: 'Click the bond to the acidic hydrogen, then click where its electrons stay behind.',
            why: 'The C\u2013H bonding pair is left on the sp carbon, giving an acetylide anion. That anion is stable enough to form because an sp orbital is 50% s character and holds the pair close to the nucleus — the whole reason this C\u2013H is pKa 25 while the methyl hydrogens at the other end of the same molecule are around 50.',
            wrong: {
              'bond:ch3-c1>ch3': 'That is a C\u2013C bond, not a C\u2013H, and amide is removing a proton here. Find the hydrogen.',
              'bond:c2-h>h': 'The electrons stay behind rather than leaving with the hydrogen — a proton departs bare. If they left with it you would have made a hydride, not an acetylide.',
              'c2>bond:c2-h': 'Backwards. That arrow forms the bond you are being asked to break.',
              'bond:c1-c2>c1': 'The triple bond is not what breaks. Deprotonation touches only the C\u2013H; the triple bond is what makes that C\u2013H acidic in the first place.'
            }
          });
        }
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A terminal alkyne is treated with H₃O⁺/Hg²⁺ (acid-catalyzed hydration). What is the final, isolated product?',
        options: ['A ketone (the unstable enol intermediate tautomerizes to the more stable carbonyl)', 'The enol itself, isolated as the final stable product', 'A carboxylic acid'],
        correctIndex: 0,
        correctFeedback: 'Correct — Markovnikov addition of water gives an enol first, but enols are unstable and rapidly tautomerize to the corresponding ketone, which is what you actually isolate.'
      }
    ]
  });
})();
</script>
