    <h1 style="margin-bottom:4px;">Ether chemistry.</h1>
    <p class="lede" style="margin-top:0;">No O–H bond, no acidic proton, no easy leaving group — ethers are chemically boring by design, which is exactly why they're useful.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'ether-chemistry',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>Why ethers are so unreactive</h3><p class="step-body">An ether (R–O–R\') has no O–H bond (so no acidic proton to remove) and no good leaving group directly attached under neutral or basic conditions (RO⁻ is just as bad a leaving group as OH⁻ — both are strong bases, conjugate bases of weak acids). This makes ethers chemically inert to bases, nucleophiles, and mild oxidants — which is exactly why they\'re the default solvent choice (diethyl ether, THF) for reactions involving highly reactive species like Grignard reagents or LiAlH₄ that would destroy almost any other functional group present. (Both are reagents you meet properly in Module 9: a <b>Grignard</b>, RMgX, is a carbon nucleophile made from an alkyl halide and magnesium metal, and <b>LiAlH₄</b> is a powerful source of hydride, H⁻. All you need here is that both are ferociously reactive and have to be run in something that will not react back.)</p>' +
      '<h3>Williamson ether synthesis</h3><p class="step-body">The standard way to build an ether: deprotonate an alcohol with a strong base (NaH is common — its byproduct, H₂ gas, is easy to remove) to form an alkoxide (RO⁻), then let that alkoxide perform an SN2 attack on a primary (or methyl) alkyl halide or tosylate. Because this is a clean SN2 step, it works best when the electrophile is unhindered — a bulky, hindered, or secondary/tertiary electrophile invites E2 elimination instead, competing with (or beating) the substitution.</p>' +
      '<div class="notes-fact">The Williamson synthesis is really just Module 6\'s SN2 mechanism with an alkoxide standing in as the nucleophile — you already know exactly how to predict when it will and won\'t work well.</div>' +
      '<h3>Ether cleavage: only strong acid gets through</h3><p class="step-body">Even though ethers resist bases and mild reagents, concentrated strong acid (HI or HBr, hot and concentrated) can still cleave the C–O bond, because the ether oxygen can be protonated first (just like an alcohol), converting a bad leaving group (RO⁻) into a good one — a neutral alcohol, ROH, which is the conjugate base of the protonated alcohol ROH₂⁺ (pKa ≈ −2), a strong acid. After protonation, a halide ion (I⁻ or Br⁻, an excellent, highly nucleophilic and non-basic nucleophile) attacks: at a primary carbon this is SN2 (backside attack, inversion), while at a secondary or tertiary carbon it proceeds SN1 (through a carbocation). Either mechanism ultimately breaks the ether into an alcohol (or a second alkyl halide, if excess acid is present) and an alkyl halide.</p>' +
      '<h3>Epoxides: the reactive exception</h3><p class="step-body">Ordinary ethers are nearly inert, but a three-membered cyclic ether — an <b>epoxide</b> — is a dramatic exception, reactive enough to merit its own lesson next: the same ring strain that destabilizes small cycloalkanes (Cyclohexanes lesson) applies here too, and that strain is released by ring-opening, making epoxides far more reactive than any acyclic ether.</p>',
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('methyl-propyl-ether'),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'No O–H, no easy leaving group: ethers are built to be unreactive.',
        bodyHtml: '<p class="step-body">An ether has the general structure R–O–R\'. Compare it to an alcohol: there\'s no O–H bond, so there\'s no acidic proton to remove the way you could deprotonate an alcohol or a terminal alkyne. And under neutral or basic conditions, the only way to break a C–O bond would require RO⁻ to leave as a leaving group — but RO⁻ is a strong base (the conjugate base of a weak acid, an alcohol, pKa ≈ 16), exactly as poor a leaving group as the plain OH⁻ from the previous lesson.</p><p class="step-body" style="margin-bottom:0;">The result: ethers simply sit there, chemically speaking, under almost any condition that doesn\'t involve strong acid. That "boring" stability is a feature, not a bug — it\'s exactly why diethyl ether and THF are the standard solvents for reactions using extremely reactive reagents (Grignards, LiAlH₄) that would tear apart nearly any other functional group.</p>'
      },
      {
        render: function(api){
          var scenarios = [
            { key: 'grignard', label: 'Running a Grignard reagent reaction', ether: true },
            { key: 'acidic', label: 'Refluxing with concentrated HI', ether: false },
            { key: 'base', label: 'Adding NaOH to the flask', ether: true },
            { key: 'nucleophile', label: 'Adding a strong nucleophile like CN⁻', ether: true }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click every condition below where an ordinary ether would survive completely untouched.</h2>' +
            '<p class="step-body">Three of these four conditions leave an ether unreacted. One will actually cleave it.</p>' +
            '<div class="choice-row">' + scenarios.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Safe conditions found: 0 / 3</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var s = scenarios.filter(function(x){ return x.key === btn.getAttribute('data-v'); })[0];
              btn.disabled = true;
              if(s.ether){
                btn.classList.add('correct');
                found++;
                hint.textContent = 'Safe conditions found: ' + found + ' / 3';
              } else {
                btn.classList.add('wrong');
                mistake = true;
              }
              if(found === 3){
                api.record(!mistake);
                api.showFeedback(fb, !mistake, mistake ? 'You found the three safe conditions, but also flagged concentrated HI as safe — hot, concentrated strong acid is exactly the one thing that does cleave an ether.' : 'Exactly right — Grignard chemistry, base, and strong nucleophiles all leave an ordinary ether completely untouched. Only hot, concentrated strong acid (HI/HBr) can cleave the C–O bond, by protonating the oxygen first.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'The Williamson ether synthesis builds an ether by...',
        options: ['Directly reacting two alcohols with no other reagents', 'Oxidizing an alkane', 'Deprotonating an alcohol to form an alkoxide, then letting it perform an SN2 attack on an alkyl halide'],
        correctIndex: 2,
        correctFeedback: 'Correct — an alkoxide (RO⁻) is a strong, effective nucleophile that displaces a leaving group from an alkyl halide via SN2, forming the new C–O bond.',
        wrongFeedback: 'Two alcohols won\'t react directly with each other — you need to first deprotonate one to an alkoxide, which can then act as a nucleophile in an SN2 reaction.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'The Williamson synthesis works best with which kind of electrophile?',
        options: ['An unhindered primary (or methyl) alkyl halide, favoring clean SN2', 'A bulky tertiary alkyl halide', 'It doesn\'t matter — any electrophile works equally well'],
        correctIndex: 0,
        correctFeedback: 'Correct — since alkoxide is a strong base as well as a nucleophile, a hindered secondary or tertiary electrophile invites E2 elimination instead of SN2 substitution.',
        wrongFeedback: 'Recall the SN2-vs-E2 competition from Module 6: alkoxide is a strong base, so a bulky substrate favors elimination over the desired substitution.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Only strong acid can pry an ether apart.',
        bodyHtml: '<p class="step-body">Concentrated HI or HBr, especially with heat, is one of the very few things that will cleave an ordinary ether. The mechanism starts exactly like acid-catalyzed alcohol chemistry: the ether oxygen is protonated first, which converts the terrible leaving group RO⁻ into a much better one: a neutral alcohol, ROH. Apply the leaving-group rule from Module 2 and you can see why that helps — ROH is the conjugate base of ROH₂⁺ (pKa ≈ −2, a strong acid), while RO⁻ is the conjugate base of ROH itself (pKa ≈ 16, a weak acid). Protonation turned a strong base into a weak one.</p><p class="step-body" style="margin-bottom:0;">Once protonated, a halide ion (I⁻ or Br⁻ — an excellent, weakly basic, highly nucleophilic species) attacks one of the two carbons attached to oxygen. At a primary carbon this runs by SN2 (backside attack); at a secondary or tertiary carbon, it runs by SN1 through a carbocation. The C–O bond breaks, giving an alcohol (or, with excess HX, a second equivalent of alkyl halide) plus the first alkyl halide.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Ether inertness is the whole reason it\'s the go-to reaction solvent.',
        bodyHtml: '<div class="explain-box">Grignard reagents (RMgX — carbon nucleophiles made from an alkyl halide and magnesium metal) and hydride reducing agents like LiAlH₄ (a source of H⁻) are the two reagents you will meet in Module 9 for building C–C bonds and for reduction. Both are so reactive that they would immediately destroy an alcohol\'s O–H bond, react with water, or attack almost any other polar functional group. Because ethers have no acidic proton and no accessible leaving group under normal conditions, they can dissolve these reagents and host the reaction without getting involved themselves — a direct, practical payoff of the unreactivity you just learned the mechanistic reason for.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'An unsymmetrical ether, CH₃–O–CH₂CH₂CH₃ (methyl propyl ether), is refluxed with excess concentrated HI. Which bond breaks, and by what mechanism?',
        options: ['The C–O bond to the propyl group breaks by SN1', 'The C–O bond to the methyl group breaks by SN2 (methyl is the least hindered, most accessible carbon for backside attack)', 'Neither bond breaks — ethers never react with acid'],
        correctIndex: 1,
        correctFeedback: 'Correct — with a primary/methyl carbon available, iodide performs a clean SN2 backside attack on the least hindered carbon (methyl), which is faster than going through the propyl group.'
      }
    ]
  });
})();
</script>
