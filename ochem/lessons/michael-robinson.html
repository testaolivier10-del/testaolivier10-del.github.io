<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Product spacing is the transferable skill here: four products, and the
     reaction that made each names itself once you count the gap. */
  var CASES = [
    { id:'s1', t:'A <b>β-hydroxy carbonyl</b> — an OH two carbons from a C=O', right:'aldol',
      why:'Aldol. An enolate attacked a carbonyl directly, so the new bond is between an alpha carbon and a carbonyl carbon and the oxygen stays as an alcohol.' },
    { id:'s2', t:'A <b>1,3-dicarbonyl</b>', right:'claisen',
      why:'Claisen. An ester enolate attacked another ester and the alkoxide left, so the two carbonyls end up one carbon apart.' },
    { id:'s3', t:'A <b>1,5-dicarbonyl</b>', right:'michael',
      why:'Michael. Conjugate addition joins the donor alpha carbon to the acceptor beta carbon, and counting from one carbonyl to the other across that bond gives five.' },
    { id:'s4', t:'A <b>cyclohexenone</b>', right:'robinson',
      why:'Robinson annulation. A Michael gives the 1,5-dicarbonyl, an intramolecular aldol closes it to a six-membered ring, and dehydration conjugates the result.' }
  ];
  var OPTS = [ { k:'claisen', l:'Claisen' }, { k:'aldol', l:'Aldol' }, { k:'robinson', l:'Robinson' }, { k:'michael', l:'Michael' } ];

  window.OchemLessonEngine.start({
    topicId: 'michael-robinson',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Conjugate addition, with an enolate as the nucleophile.',
        bodyHtml: '<p class="step-body">You have seen that an &alpha;,&beta;-unsaturated carbonyl has two electrophilic carbons, and that a soft nucleophile takes the &beta; one. A <b>Michael addition</b> is that reaction with an <b>enolate</b> as the nucleophile, and it has its own vocabulary:</p>' +
          '<ul class="step-body">' +
          '<li>The <b>donor</b> is the nucleophile &mdash; the thing that gets deprotonated.</li>' +
          '<li>The <b>acceptor</b> is the enone, also called a Michael acceptor.</li>' +
          '</ul>' +
          '<p class="step-body">The donor is nearly always a compound whose &alpha; hydrogen sits between <b>two</b> electron-withdrawing groups: a 1,3-diketone, a &beta;-keto ester, a malonate. Those have pKa values around 9&ndash;13, not 20.</p>' +
          '<div class="explain-box">Two things follow from that low pKa, and both matter. A <b>catalytic alkoxide</b> deprotonates the donor completely, so no strong base is ever in the flask to attack the acceptor&rsquo;s carbonyl. And the charge is spread over two carbonyls, which makes the enolate <b>soft</b> &mdash; which is what sends it 1,4 instead of 1,2.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every condensation leaves a fingerprint, and it is the spacing.',
        bodyHtml: '<p class="step-body">This is the single most useful pattern in enolate chemistry, and it turns three reactions you had to memorize separately into one thing you can read off a structure.</p>' +
          '<ul class="step-body">' +
          '<li><b>Aldol</b> &rarr; a <b>&beta;-hydroxy carbonyl</b>. The nucleophile hit a carbonyl carbon and the oxygen stayed.</li>' +
          '<li><b>Claisen</b> &rarr; a <b>1,3-dicarbonyl</b>. The nucleophile hit an ester and the alkoxide left.</li>' +
          '<li><b>Michael</b> &rarr; a <b>1,5-dicarbonyl</b>. The nucleophile hit a &beta; carbon, two positions further along.</li>' +
          '</ul>' +
          '<p class="step-body">Count the carbons between the two oxygen-bearing carbons and the reaction names itself. That works forwards, to predict a product, and backwards, to disconnect one.</p>' +
          '<div class="explain-box">A <b>1,5-dicarbonyl is the Michael retron.</b> See one and disconnect the bond &beta; to a carbonyl: what comes back is an enolate donor and an enone acceptor. This is the fastest single recognition in the chapter.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which reaction made each of these?</h2>' +
            '<p class="step-body">You are reading spacing, not conditions. Find the two oxygen-bearing carbons and count the gap between them.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Which reaction">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Count the gap. 1,3 means the nucleophile hit a carbonyl carbon and something left; 1,5 means it hit a beta carbon two positions further along.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Spacing is the fingerprint, and it survives every change of conditions.'
                  : 'All four, first time. Three reactions and three spacings, plus the ring that comes from doing two of them in a row.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why is a Michael donor almost always a doubly stabilized compound?',
        options: [
          'It is soft enough to add 1,4, and a catalytic alkoxide deprotonates it fully',
          'It is the only kind of compound with an α hydrogen',
          'Double stabilization makes the enolate more reactive',
          'It prevents the acceptor from polymerizing'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and both halves matter. Spreading the charge over two carbonyls makes the enolate soft, which is what sends it to the β carbon rather than the carbonyl carbon; and a pKa near 11 means sodium ethoxide deprotonates it completely, so no strong base is ever sitting in the flask next to the acceptor. Note that double stabilization makes the enolate <i>less</i> reactive, not more — that is the point of it.',
        wrongFeedback: 'Two separate advantages come from the same feature. Think about what spreading the negative charge does to hardness, and what it does to the pKa.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Diethyl malonate is treated with NaOEt, then with methyl vinyl ketone. What is the product?',
        options: [
          'A 1,5-dicarbonyl from conjugate addition',
          'A β-hydroxy ester from 1,2-addition',
          'A 1,3-dicarbonyl from a Claisen',
          'An epoxide'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. The malonate enolate is soft, so it adds 1,4 to the enone and joins its α carbon to the β carbon of methyl vinyl ketone. Count from the ketone carbonyl to the nearer ester carbonyl across that new bond and you get five — the Michael fingerprint. Nothing about the conditions had to be recalled to predict that.',
        wrongFeedback: 'Methyl vinyl ketone is a Michael acceptor and a malonate enolate is the standard donor. Which carbon does a soft nucleophile attack, and what spacing does that leave?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Do it twice in a row and you have built a ring.',
        bodyHtml: '<p class="step-body">The <b>Robinson annulation</b> is a Michael addition followed by an intramolecular aldol condensation, and it is the standard way to build a new six-membered ring bearing an enone.</p>' +
          '<ul class="step-body">' +
          '<li><b>Michael.</b> The donor adds 1,4 to the acceptor, giving a 1,5-dicarbonyl.</li>' +
          '<li><b>Intramolecular aldol.</b> An enolate on one side reaches the carbonyl on the other. From a 1,5-dicarbonyl the closure that reaches without strain is <b>six-membered</b>.</li>' +
          '<li><b>Dehydration.</b> The &beta;-hydroxy ketone loses water to give a conjugated enone, which is what makes the whole thing irreversible.</li>' +
          '</ul>' +
          '<p class="step-body">The product is a <b>cyclohexenone</b> in every case you will meet. Methyl vinyl ketone is the classic acceptor, because it is cheap and the ring it gives is the one steroid synthesis needed.</p>' +
          '<div class="explain-box">Why six and not some other size? Count it. An aldol joins an <b>&alpha; carbon to a carbonyl carbon</b>, never two carbonyl carbons to each other &mdash; so from a 1,5-dicarbonyl the closure that works runs from the &alpha;&prime; carbon just past one carbonyl round to the far carbonyl carbon, and that path encloses six atoms. The only alternative a 1,5-dicarbonyl could try runs from an inner &alpha; carbon to the carbonyl two positions away, and that closes a four-membered ring, which never competes. The reaction is not choosing a ring size; the spacing chose it first.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'What makes a Robinson annulation irreversible?',
        options: [
          'The final dehydration to a conjugated enone',
          'The Michael addition step',
          'Formation of the six-membered ring',
          'Loss of the alkoxide catalyst'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. The Michael addition and the aldol are both reversible, and so is the ring closure — nothing is committed until the β-hydroxy ketone loses water. That elimination puts the new C=C in conjugation with the carbonyl, and the stabilization of the conjugated system is what the reaction cannot climb back out of.',
        wrongFeedback: 'Three steps, and two of them are equilibria that can run backwards. Which one produces something conjugated and therefore stabilized?'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A cyclohexenone came from a Robinson annulation. In what order do you undo it?',
        options: [
          'Disconnect the Michael first, then open the ring',
          'Rehydrate, break the aldol bond to a 1,5-dicarbonyl, then disconnect the Michael',
          'Open the ring at a carbonyl, then add water',
          'Break the aldol bond first, then rehydrate'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and the order is the whole skill here — you undo the steps in reverse, last one first. Put the water back across the C=C to recover the β-hydroxy ketone. Break the aldol bond, which is the one between the α carbon and the carbinol carbon, and the ring opens to a <b>1,5-dicarbonyl</b>. Then disconnect that at the bond β to one carbonyl, and the two pieces fall out: an enolate donor and an enone acceptor. Try it in any other order and you are working on a bond that has not been exposed yet. The canonical case to have in mind is 2-methylcyclohexane-1,3-dione with methyl vinyl ketone, which gives the Wieland–Miescher ketone — a doubly stabilized 1,3-diketone donor, exactly as the rule above says, and the starting point for a great deal of steroid synthesis.'
      }
    ]
  });

})();
});
</script>
