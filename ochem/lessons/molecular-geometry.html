    <h1 style="margin-bottom:4px;">Molecular geometry.</h1>
    <p class="lede" style="margin-top:0;">Electron groups spread out to get as far apart as possible. That's the entire idea behind VSEPR.</p>
  </div>

<script>
(function(){
  function molSvg(bondsN, lonePairsN){
    var total = bondsN + lonePairsN;
    var angleStep = 360/total;
    var cx=130, cy=70, r=55;
    var parts = '';
    for(var i=0;i<total;i++){
      var a = (angleStep*i - 90) * Math.PI/180;
      var x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
      if(i < bondsN){
        parts += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="var(--line)" stroke-width="2.5"/>';
        parts += '<circle cx="' + x + '" cy="' + y + '" r="13" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="' + x + '" y="' + (y+4) + '" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11" pointer-events="none">X</text>';
      } else {
        parts += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="var(--muted)"/><circle cx="' + (x+7) + '" cy="' + y + '" r="4" fill="var(--muted)"/>';
      }
    }
    return '<div class="scene"><svg viewBox="0 0 260 140">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="' + cx + '" y="' + (cy+5) + '" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">A</text>' +
      parts +
    '</svg></div>';
  }
  window.OchemLessonEngine.start({
    topicId: 'molecular-geometry',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The idea</h3><p class="step-body"><b>VSEPR</b> (valence shell electron pair repulsion) says electron groups — bonds <b>and</b> lone pairs — push each other as far apart as possible, since electrons repel each other. This is the same electron-group count from Hybridization, answering a different question: hybridization tells you which orbitals the central atom uses (sp³/sp²/sp), and VSEPR tells you the actual 3D shape those orbitals settle into.</p><p class="step-body">The catch: the <b>name</b> of the shape only counts atoms, not lone pairs — lone pairs are invisible in the name even though they\'re still there, pushing.</p>' +
      '<div class="formula">4 groups (sp³) → tetrahedral base &nbsp;&middot;&nbsp; 3 (sp²) → trigonal planar &nbsp;&middot;&nbsp; 2 (sp) → linear</div>' +
      '<h3>Worked examples</h3><p class="step-body">Methane (4 bonds, 0 lone pairs): all 4 groups are visible atoms → <b>tetrahedral</b>. Ammonia (3 bonds + 1 lone pair, 4 groups total): the lone pair is invisible in the name, so the 3 visible N–H bonds form a <b>trigonal pyramidal</b> shape. Water (2 bonds + 2 lone pairs): only the 2 O–H bonds are visible → <b>bent</b>. CO₂/BeF₂ (2 groups, 0 lone pairs): spread 180° apart → <b>linear</b>.</p>' +
      '<div class="notes-fact">A lone pair, not shared between two nuclei, spreads out more than a bond does — pushing bonds closer together than the ideal angle. That\'s why NH₃\'s H–N–H angle is 107° and H₂O\'s H–O–H angle is 104.5°, both less than a perfect tetrahedron\'s 109.5°.</div>' +
      '<h3>Beyond 4 groups</h3><p class="step-body">5 groups, 0 lone pairs → <b>trigonal bipyramidal</b> (3 equatorial + 2 axial, e.g. PCl₅). 6 groups, 0 lone pairs → <b>octahedral</b> (4 equatorial + 2 axial, e.g. SF₆). Rare in day-to-day organic molecules, but good to recognize for S/P compounds. (The Hybridization lesson\'s note applies here too: these shapes are real and well-confirmed experimentally, but the old "sp³d/sp³d²" explanation for why period 3+ atoms can do this has been superseded by atomic-size and ionic-character arguments, not genuine d-orbital mixing.)</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Groups repel, so they spread out.',
        bodyHtml: '<p class="step-body">VSEPR (valence shell electron pair repulsion) says electron groups — bonds <b>and</b> lone pairs — push each other as far apart as possible, since electrons repel each other. The <b>name</b> of the shape only counts the atoms, though — lone pairs are invisible in the name, even though they’re still there pushing.</p><p class="step-body">This is the same electron-group count from Hybridization, just answering a different question: hybridization tells you which orbitals the central atom uses (sp³/sp²/sp), and VSEPR tells you the actual 3D arrangement those orbitals settle into. 4 groups (sp³) spread toward the corners of a tetrahedron; 3 groups (sp²) spread flat, 120° apart; 2 groups (sp) spread into a straight line.</p>' +
          '<div class="formula">4 groups (sp³) → tetrahedral base &nbsp;&middot;&nbsp; 3 (sp²) → trigonal planar &nbsp;&middot;&nbsp; 2 (sp) → linear</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Identify',
        title: 'Methane, CH₄: 4 bonds, 0 lone pairs. What shape?',
        diagramHtml: molSvg(4,0),
        options: ['Trigonal pyramidal', 'Bent', 'Tetrahedral', 'Linear'],
        correctIndex: 2,
        correctFeedback: 'Correct — 4 groups, all bonds, no lone pairs to hide: a clean tetrahedron.',
        wrongFeedback: 'With no lone pairs, the shape matches the electron-group arrangement exactly.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Ammonia, NH₃: 3 bonds + 1 lone pair (4 groups). What shape?',
        diagramHtml: molSvg(3,1),
        options: ['Tetrahedral', 'Bent', 'Linear', 'Trigonal pyramidal'],
        correctIndex: 3,
        correctFeedback: 'Correct — 4 groups total, but with one lone pair hidden from the name, the 3 visible bonds form a trigonal pyramid.',
        wrongFeedback: 'The lone pair still takes up space and pushes the 3 N–H bonds into a pyramid — it just doesn’t appear in the shape’s name.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Water, H₂O: 2 bonds + 2 lone pairs (4 groups). What shape?',
        diagramHtml: molSvg(2,2),
        options: ['Bent', 'Tetrahedral', 'Trigonal pyramidal', 'Linear'],
        correctIndex: 0,
        correctFeedback: 'Correct — with 2 of the 4 groups being invisible lone pairs, the 2 O–H bonds form a bent shape, not a straight line.',
        wrongFeedback: 'Two of water’s four groups are lone pairs. What does that do to the two remaining bonds?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Beyond 4 groups: shapes for expanded octets.',
        bodyHtml: '<p class="step-body">Central atoms with more than 4 electron groups (period 3+ elements like S and P — see the Hybridization lesson\'s note on why period 2 elements never do this) settle into their own named shapes. <b>5 groups, 0 lone pairs</b> gives <b>trigonal bipyramidal</b>: 3 groups in a flat triangle around the center (equatorial), plus 2 more directly above and below (axial) — seen in PCl₅. <b>6 groups, 0 lone pairs</b> gives <b>octahedral</b>: 4 groups in a flat square around the center, plus 1 above and 1 below — seen in SF₆.</p><p class="step-body" style="margin-bottom:0;">Same lone-pair logic applies here too: swap a group for a lone pair and the name changes even though the underlying electron arrangement doesn\'t (e.g. 5 groups with 1 lone pair is called "seesaw," not trigonal bipyramidal). You won\'t need these day to day in organic chemistry — they exist mainly so you recognize them if a sulfur or phosphorus compound comes up.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Lone pairs push harder than bonds.',
        bodyHtml: '<div class="explain-box">A lone pair, not shared between two nuclei, spreads out more than a bond does — which is why NH₃’s H–N–H angle (107°) and H₂O’s H–O–H angle (104.5°) are both a bit less than the ideal 109.5° of a perfect tetrahedron.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A molecule has 2 electron groups and no lone pairs (like CO₂ or BeF₂). What shape is it?',
        diagramHtml: molSvg(2,0),
        options: ['Bent', 'Trigonal planar', 'Linear'],
        correctIndex: 2,
        correctFeedback: 'Correct — with only 2 groups and nothing hidden, they spread as far apart as possible: 180° apart, linear.'
      }
    ]
  });
})();
</script>
