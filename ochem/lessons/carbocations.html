    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three bonds, no lone pair, six electrons.',
        bodyHtml: '<div class="explain-box"><b>A carbocation is a carbon with three bonds, no lone pair and a positive charge.</b> Take the <i>tert</i>-butyl cation, (CH₃)₃C⁺. Carbon brings four valence electrons. In the cation it owns no lone-pair electrons and one electron from each of its three bonds, so its formal charge is 4 − (0 + 3) = <b>+1</b>.</div>' +
          '<p class="step-body">Those three bonds hold six electrons, two short of an octet. That shortfall is what makes a carbocation so reactive: anything with a pair of electrons to offer is drawn to it.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Never draw a lone pair on the positive carbon. Three bonds plus a lone pair give the carbon five electrons of its own and a charge of −1. That is a <b>carbanion</b>, a negatively charged carbon, which is the opposite species.</p>',
        diagramHtml: '<!-- fig:cation-or-anion:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 222" role="img" aria-label="Two carbons side by side, each with three hydrogens. The left one, CH3 plus, has no lone pair: formal charge 4 minus 3 equals plus 1, a carbocation. The right one, CH3 minus, has one lone pair: formal charge 4 minus 5 equals minus 1, a carbanion."><line class="fg-bond" x1="72.14" y1="80" x2="56.56" y2="71"></line><circle class="fg-atom" cx="46.16" cy="65" r="12"></circle><text class="fg-lbl" x="46.16" y="69.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="99.86" y1="80" x2="115.44" y2="71"></line><circle class="fg-atom" cx="125.84" cy="65" r="12"></circle><text class="fg-lbl" x="125.84" y="69.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="86" y1="104" x2="86" y2="122"></line><circle class="fg-atom" cx="86" cy="134" r="12"></circle><text class="fg-lbl" x="86" y="138.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="86" cy="88" r="16"></circle><circle class="fg-atom-warn" cx="86" cy="88" r="16"></circle><text class="fg-lbl" x="86" y="92.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="86" y="66" text-anchor="middle" font-size="16">+</text><text class="fg-tag" x="86" y="164" text-anchor="middle" font-size="11">CH₃⁺ · CARBOCATION</text><text class="fg-lbl" x="86" y="186" text-anchor="middle" font-size="13">no lone pair</text><text class="fg-lbl" x="86" y="208" text-anchor="middle" font-size="13">4 − (0 + 3) = +1</text><line class="fg-rule" x1="170" y1="24" x2="170" y2="212"></line><line class="fg-bond" x1="240.14" y1="80" x2="224.56" y2="71"></line><circle class="fg-atom" cx="214.16" cy="65" r="12"></circle><text class="fg-lbl" x="214.16" y="69.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="267.86" y1="80" x2="283.44" y2="71"></line><circle class="fg-atom" cx="293.84" cy="65" r="12"></circle><text class="fg-lbl" x="293.84" y="69.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="254" y1="104" x2="254" y2="122"></line><circle class="fg-atom" cx="254" cy="134" r="12"></circle><text class="fg-lbl" x="254" y="138.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="258.5" cy="65" r="2.4"></circle><circle class="fg-lp" cx="249.5" cy="65" r="2.4"></circle><circle class="fg-atom" cx="254" cy="88" r="16"></circle><circle class="fg-atom-hi" cx="254" cy="88" r="16"></circle><text class="fg-lbl" x="254" y="92.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="273.08" y="62.47" text-anchor="middle" font-size="16">−</text><text class="fg-tag" x="254" y="164" text-anchor="middle" font-size="11">CH₃⁻ · CARBANION</text><text class="fg-lbl" x="254" y="186" text-anchor="middle" font-size="13">one lone pair</text><text class="fg-lbl" x="254" y="208" text-anchor="middle" font-size="13">4 − (2 + 3) = −1</text></svg><figcaption>The only difference is the pair of dots. The formal-charge sum counts lone-pair electrons plus one electron per bond.</figcaption></figure><!-- fig:cation-or-anion:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Visualize',
        title: 'Flat, with an empty p orbital.',
        bodyHtml: '<p class="step-body">Three groups and no lone pair make three electron domains, and they spread as far apart as they can. So the cation is <b>trigonal planar</b>, with angles near 120°, and its carbon is <b>sp²-hybridized</b>. The three sp² orbitals make the three bonds. The fourth orbital, an unhybridized <b>p orbital</b>, is empty. It stands at right angles to the plane, with one lobe above it and one below.</p>' +
          '<p class="step-body" style="margin-bottom:0;">The carbon it came from was tetrahedral and sp³, so forming the cation flattens it. Both faces of a flat cation are open, so a <b>nucleophile</b> (an electron-pair donor) can bond from above or from below equally well. If that carbon was a stereocenter, its handedness, the <a class="chapter-ref" href="/ochem/learn.html#m-stereochemistry">Stereochemistry</a> kind, is lost the moment the cation forms, and the product is a 50:50 mixture of mirror images.</p>',
        diagramHtml: '<!-- fig:l-carbocation-anatomy:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 424" role="img" aria-label="The tert-butyl cation drawn twice. Top: seen from above, three methyl groups 120 degrees apart around the positive carbon. Bottom: seen edge-on, the bonds in one plane and an empty p orbital with a lobe above and a lobe below the plane."><text class="fg-tag" x="170" y="22" text-anchor="middle" font-size="11">SEEN FROM ABOVE</text><line class="fg-bond" x1="170" y1="92" x2="170" y2="70"></line><circle class="fg-atom" cx="170" cy="52" r="18"></circle><text class="fg-lbl" x="170" y="55.52" text-anchor="middle" font-size="9.5">CH₃</text><line class="fg-bond" x1="156.14" y1="116" x2="137.09" y2="127"></line><circle class="fg-atom" cx="121.5" cy="136" r="18"></circle><text class="fg-lbl" x="121.5" y="139.51" text-anchor="middle" font-size="9.5">H₃C</text><line class="fg-bond" x1="183.86" y1="116" x2="202.91" y2="127"></line><circle class="fg-atom" cx="218.5" cy="136" r="18"></circle><text class="fg-lbl" x="218.5" y="139.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom" cx="170" cy="108" r="16"></circle><circle class="fg-atom-warn" cx="170" cy="108" r="16"></circle><text class="fg-lbl" x="170" y="112.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="195.98" y="98" text-anchor="middle" font-size="16">+</text><text class="fg-tag" x="170" y="144" text-anchor="middle" font-size="11">120°</text><text class="fg-lbl" x="170" y="196" text-anchor="middle" font-size="13">three bonds, 120° apart</text><line class="fg-rule" x1="20" y1="212" x2="320" y2="212"></line><text class="fg-tag" x="170" y="236" text-anchor="middle" font-size="11">SEEN EDGE-ON</text><ellipse class="fg-orb" cx="170" cy="288" rx="20" ry="30" fill-opacity="0.18"></ellipse><ellipse class="fg-orb" cx="170" cy="368" rx="20" ry="30" fill-opacity="0.18"></ellipse><line class="fg-dash" x1="78" y1="328" x2="262" y2="328"></line><line class="fg-bond" x1="154" y1="328" x2="126" y2="328"></line><circle class="fg-atom" cx="108" cy="328" r="18"></circle><text class="fg-lbl" x="108" y="331.52" text-anchor="middle" font-size="9.5">H₃C</text><line class="fg-bond" x1="186" y1="328" x2="214" y2="328"></line><circle class="fg-atom" cx="232" cy="328" r="18"></circle><text class="fg-lbl" x="232" y="331.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom" cx="170" cy="328" r="16"></circle><circle class="fg-atom-warn" cx="170" cy="328" r="16"></circle><text class="fg-lbl" x="170" y="332.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="197.85" y="313.5" text-anchor="middle" font-size="16">+</text><text class="fg-tag" x="196" y="272" text-anchor="start" font-size="11">empty p orbital</text><text class="fg-lbl" x="170" y="410" text-anchor="middle" font-size="13">third CH₃ points at you</text></svg><figcaption>The same flat cation from two directions. Edge-on, nothing sits above or below the plane except the empty orbital.</figcaption></figure><!-- fig:l-carbocation-anatomy:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two ways one appears.',
        bodyHtml: '<p class="step-body"><b>1. A leaving group departs with its bonding pair.</b> This is the event from the Leaving groups lesson. In <i>tert</i>-butyl bromide the C–Br bond breaks, the bromine takes both electrons and leaves as Br⁻, and the carbon keeps three bonds and the charge. How easily this happens depends on two things together: how stable the leaving group is once it has gone, and how stable the cation is once it has formed.</p>' +
          '<p class="step-body" style="margin-bottom:0;"><b>2. A π bond takes a proton.</b> The π electrons of a C=C are exposed above and below the bond, so they can attack the H of H₃O⁺. In 2-methylpropene, (CH₃)₂C=CH₂, the H adds to the CH₂ end and the other alkene carbon becomes the cation. Adding the H the other way round would give a primary cation, and the next steps show why that is much worse. The full reactions come in <a class="chapter-ref" href="/ochem/learn.html#m-alkenes-alkynes">Alkenes &amp; Alkynes</a>.</p>',

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Alkyl groups help: 3° > 2° > 1° > methyl.',
        bodyHtml: '<p class="step-body">The <i>tert</i>-butyl cation, (CH₃)₃C⁺, is far more stable than the methyl cation, CH₃⁺, because of the three carbon groups on its charged carbon. The number of carbons bonded to the charged carbon is the cation’s <b>degree</b>: one makes it primary (1°), two secondary (2°), three tertiary (3°), and methyl has none. Count only at the charged carbon. The pentyl cation, CH₃CH₂CH₂CH₂CH₂⁺, has five carbons but is still primary.</p>' +
          '<p class="step-body"><b>Hyperconjugation</b> is the main reason for the order. In the ethyl cation, a C–H bond on the neighboring CH₃ can line up parallel to the empty p orbital, and its electron pair then spreads a little into that orbital. No bond breaks or forms; the pair just spends part of its time nearer the positive carbon, which spreads the charge out. More alkyl groups mean more C–H bonds next door: <b>0</b> for methyl, <b>3</b> for ethyl, <b>6</b> for isopropyl and <b>9</b> for <i>tert</i>-butyl. C–C bonds next door help in the same way.</p>' +
          '<p class="step-body"><b>Induction</b> adds a smaller push. An alkyl group has a bigger, looser electron cloud than an H, so it pushes electron density toward the positive charge more readily. Both effects spread the charge out; neither moves it fully onto another atom.</p>' +
          '<div class="explain-box">The effect is large. In <b>solvolysis</b>, where the solvent itself is the nucleophile, a tertiary bromide ionizes a million or more times faster than methyl bromide. Methyl and primary bromides hardly ionize at all, so what the ratio really says is that tertiary ionizes and methyl does not.</div>',

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Resonance moves the charge onto other atoms.',
        bodyHtml: '<p class="step-body">The allyl cation, CH₂=CH–CH₂⁺, is primary, yet it is far more stable than the ethyl cation. Its empty p orbital sits beside the π bond, so the π electrons can move toward it, and the two end carbons share the charge, as in the Resonance lesson.</p>' +
          '<p class="step-body" style="margin-bottom:0;">A cation next to a C=C is <b>allylic</b>. One next to a benzene ring is <b>benzylic</b>, and its charge spreads over four carbons: the outside one, the two ring carbons beside the attachment point and the one across the ring. Hyperconjugation only lends a little of the charge to neighboring bonds, while resonance moves it onto other atoms outright. Learn the result as a ranking: <b>a primary benzylic cation is about as stable as a tertiary alkyl one</b>, and a primary allylic cation is about as stable as a secondary one.</p>',
        diagramHtml: '<!-- fig:l-delocalized:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 380" role="img" aria-label="Top: the allyl cation as a hybrid, half a positive charge on each end carbon. Bottom: the benzyl cation as a hybrid, a partial positive charge on the outside carbon and on three ring carbons."><text class="fg-tag" x="170" y="22" text-anchor="middle" font-size="11">ALLYLIC: TWO CARBONS SHARE IT</text><line class="fg-bond" x1="116" y1="110" x2="170" y2="80"></line><line class="fg-bond" x1="170" y1="80" x2="224" y2="110"></line><line class="fg-dash-hi" x1="120.37" y1="97.28" x2="156.89" y2="76.99"></line><line class="fg-dash-hi" x1="183.11" y1="76.99" x2="219.63" y2="97.28"></line><text class="fg-warn" x="104" y="115" text-anchor="end" font-size="13">½+</text><text class="fg-warn" x="236" y="115" text-anchor="start" font-size="13">½+</text><text class="fg-lbl" x="170" y="150" text-anchor="middle" font-size="13">1° allylic ≈ 2° alkyl</text><line class="fg-rule" x1="20" y1="170" x2="320" y2="170"></line><text class="fg-tag" x="170" y="194" text-anchor="middle" font-size="11">BENZYLIC: FOUR CARBONS SHARE IT</text><line class="fg-bond" x1="150" y1="234" x2="113.63" y2="255"></line><line class="fg-bond" x1="113.63" y1="255" x2="113.63" y2="297"></line><line class="fg-bond" x1="113.63" y1="297" x2="150" y2="318"></line><line class="fg-bond" x1="150" y1="318" x2="186.37" y2="297"></line><line class="fg-bond" x1="186.37" y1="297" x2="186.37" y2="255"></line><line class="fg-bond" x1="186.37" y1="255" x2="150" y2="234"></line><circle class="fg-dash-hi" cx="150" cy="276" r="24"></circle><line class="fg-bond" x1="186.37" y1="255" x2="226.37" y2="231"></line><line class="fg-dash-hi" x1="190.32" y1="242.14" x2="213.17" y2="228.43"></line><text class="fg-warn" x="238.37" y="235" text-anchor="start" font-size="13">δ+</text><text class="fg-warn" x="150" y="224" text-anchor="middle" font-size="13">δ+</text><text class="fg-warn" x="194.37" y="317" text-anchor="middle" font-size="13">δ+</text><text class="fg-warn" x="103.63" y="301" text-anchor="end" font-size="13">δ+</text><text class="fg-lbl" x="170" y="366" text-anchor="middle" font-size="13">1° benzylic ≈ 3° alkyl</text></svg><figcaption>Dashed lines are partial bonds. Every carbon marked with a charge carries part of it.</figcaption></figure><!-- fig:l-delocalized:end -->'

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A lone pair next door does better still.',
        bodyHtml: '<p class="step-body">In CH₃O–CH₂⁺, a lone pair on oxygen can move in to form a C=O π bond. The second resonance structure has <b>an octet on every atom</b>, with the positive charge on oxygen. Oxygen is electronegative and carries the charge reluctantly, but full octets everywhere beat a six-electron carbon, so this cation is more stable than even a tertiary alkyl cation.</p>' +
          '<p class="step-body" style="margin-bottom:0;">A cation with oxygen on the charged carbon is an <b>oxocarbenium</b> ion, the intermediate in acetal formation in <a class="chapter-ref" href="/ochem/learn.html#m-carbonyl-chemistry">Carbonyl Chemistry</a>. The nitrogen version is an <b>iminium</b> ion. It is more stable again, because nitrogen is less electronegative and shares its lone pair more readily.</p>',
        diagramHtml: '<!-- fig:l-oxocarbenium:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 262" role="img" aria-label="The methoxymethyl cation, CH3-O-CH2 plus, and a curved arrow from an oxygen lone pair to the C-O bond. The second resonance structure has a C=O double bond, a positive charge on oxygen, and an octet on every atom."><line class="fg-bond" x1="80" y1="58" x2="109" y2="58"></line><line class="fg-bond" x1="139" y1="58" x2="170" y2="58"></line><circle class="fg-atom" cx="62" cy="58" r="18"></circle><text class="fg-lbl" x="62" y="61.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-lp" cx="128.5" cy="36" r="2.4"></circle><circle class="fg-lp" cx="119.5" cy="36" r="2.4"></circle><circle class="fg-lp" cx="119.5" cy="80" r="2.4"></circle><circle class="fg-lp" cx="128.5" cy="80" r="2.4"></circle><circle class="fg-atom" cx="124" cy="58" r="15"></circle><text class="fg-lbl" x="124" y="62.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="188" cy="58" r="18"></circle><circle class="fg-atom-warn" cx="188" cy="58" r="18"></circle><text class="fg-lbl" x="188" y="61.52" text-anchor="middle" font-size="9.5">CH₂</text><text class="fg-warn" x="212" y="45" text-anchor="middle" font-size="16">+</text><path class="fg-arrow" d="M124 87 Q149.05 88.59 156.95 72.3"></path><path class="fg-head" d="M160 66 L160.22 73.89 L153.67 70.71 Z"></path><line class="fg-arrow-mut" x1="124" y1="102" x2="124" y2="122"></line><path class="fg-head-mut" d="M124 130 L119.84 122 L128.16 122 Z"></path><line class="fg-arrow-mut" x1="124" y1="130" x2="124" y2="110"></line><path class="fg-head-mut" d="M124 102 L128.16 110 L119.84 110 Z"></path><line class="fg-bond" x1="80" y1="170" x2="109" y2="170"></line><line class="fg-bond" x1="139" y1="166" x2="170" y2="166"></line><line class="fg-bond" x1="139" y1="174" x2="170" y2="174"></line><circle class="fg-atom" cx="62" cy="170" r="18"></circle><text class="fg-lbl" x="62" y="173.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-lp" cx="128.5" cy="148" r="2.4"></circle><circle class="fg-lp" cx="119.5" cy="148" r="2.4"></circle><circle class="fg-atom" cx="124" cy="170" r="16"></circle><circle class="fg-atom-warn" cx="124" cy="170" r="16"></circle><text class="fg-lbl" x="124" y="174.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="188" cy="170" r="18"></circle><text class="fg-lbl" x="188" y="173.52" text-anchor="middle" font-size="9.5">CH₂</text><text class="fg-warn" x="144" y="153" text-anchor="middle" font-size="16">+</text><text class="fg-tag-warn" x="216" y="62" text-anchor="start" font-size="11">C has 6 electrons</text><text class="fg-tag-good" x="216" y="174" text-anchor="start" font-size="11">all octets</text><text class="fg-lbl" x="170" y="244" text-anchor="middle" font-size="13">an oxocarbenium ion</text></svg><figcaption>The oxygen lone pair becomes a C=O &pi; bond, and the charge moves onto oxygen.</figcaption></figure><!-- fig:l-oxocarbenium:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two cations the π bond cannot help.',
        bodyHtml: '<p class="step-body">A <b>vinyl cation</b> has its charge on a carbon of a C=C, as in CH₂=C⁺–CH₃. That carbon has only two groups, so it is linear and sp-hybridized, which is a poor place for a positive charge. Its empty orbital is its second p orbital, at right angles to the one in the π bond, so the π electrons cannot reach it.</p>' +
          '<p class="step-body">An <b>aryl cation</b> has its charge on a ring carbon of benzene. The ring holds that carbon at sp², so its empty orbital is an sp² hybrid lying <i>in</i> the ring plane, while the π cloud sits above and below the plane. Again the two are at right angles and never overlap.</p>' +
          '<p class="step-body" style="margin-bottom:0;">So an ordinary vinyl or aryl halide does not ionize, and any mechanism that needs one of these cations is the wrong mechanism.</p>',
        diagramHtml: '<!-- fig:l-vinyl-aryl:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 414" role="img" aria-label="Top: a vinyl cation; the pi cloud of the C=C lies above and below the double bond, while the empty p orbital on the linear positive carbon points at the reader, at right angles to it. Bottom: a benzene ring seen edge-on; its pi cloud lies above and below the ring plane, while the empty sp2 orbital of the positive ring carbon points sideways in the plane."><text class="fg-tag" x="170" y="22" text-anchor="middle" font-size="11">VINYL CATION</text><ellipse class="fg-orb" cx="106" cy="84" rx="44" ry="16" fill-opacity="0.18"></ellipse><ellipse class="fg-orb" cx="106" cy="152" rx="44" ry="16" fill-opacity="0.18"></ellipse><line class="fg-bond" x1="71" y1="113" x2="141" y2="113"></line><line class="fg-bond" x1="71" y1="123" x2="141" y2="123"></line><line class="fg-bond" x1="171" y1="118" x2="230" y2="118"></line><circle class="fg-atom" cx="248" cy="118" r="18"></circle><text class="fg-lbl" x="248" y="121.52" text-anchor="middle" font-size="9.5">CH₃</text><line class="fg-bond" x1="42.14" y1="110" x2="26.56" y2="101"></line><circle class="fg-atom" cx="16.16" cy="95" r="12"></circle><text class="fg-lbl" x="16.16" y="99.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond" x1="42.14" y1="126" x2="26.56" y2="135"></line><circle class="fg-atom" cx="16.16" cy="141" r="12"></circle><text class="fg-lbl" x="16.16" y="145.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="56" cy="118" r="15"></circle><text class="fg-lbl" x="56" y="122.44" text-anchor="middle" font-size="12">C</text><circle class="fg-orb" cx="156" cy="118" r="27" fill-opacity="0.18"></circle><circle class="fg-atom" cx="156" cy="118" r="16"></circle><circle class="fg-atom-warn" cx="156" cy="118" r="16"></circle><text class="fg-lbl" x="156" y="122.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="182.87" y="149.87" text-anchor="middle" font-size="16">+</text><text class="fg-tag" x="106" y="46" text-anchor="middle" font-size="11">π cloud</text><text class="fg-lbl" x="170" y="190" text-anchor="middle" font-size="13">empty p points at you</text><line class="fg-rule" x1="20" y1="210" x2="320" y2="210"></line><text class="fg-tag" x="170" y="234" text-anchor="middle" font-size="11">ARYL CATION, RING EDGE-ON</text><ellipse class="fg-orb" cx="100" cy="296" rx="72" ry="17" fill-opacity="0.18"></ellipse><ellipse class="fg-orb" cx="100" cy="364" rx="72" ry="17" fill-opacity="0.18"></ellipse><line class="fg-bond" x1="30" y1="330" x2="170" y2="330"></line><ellipse class="fg-orb" cx="242" cy="330" rx="26" ry="14" fill-opacity="0.18"></ellipse><circle class="fg-atom" cx="194" cy="330" r="16"></circle><circle class="fg-atom-warn" cx="194" cy="330" r="16"></circle><text class="fg-lbl" x="194" y="334.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="194" y="307" text-anchor="middle" font-size="16">+</text><text class="fg-tag" x="100" y="268" text-anchor="middle" font-size="11">π cloud</text><text class="fg-tag" x="242" y="306" text-anchor="middle" font-size="11">empty sp²</text><text class="fg-lbl" x="170" y="400" text-anchor="middle" font-size="13">empty sp² lies in the plane</text></svg><figcaption>In both, the empty orbital sits at right angles to the &pi; electrons, so they cannot reach it.</figcaption></figure><!-- fig:l-vinyl-aryl:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Independent practice',
        title: 'Chlorobenzene will not ionize to a phenyl cation, even though its benzene ring has plenty of π electrons nearby. Why not?',
        options: ['The ring’s π electrons are all used up holding the six carbons together', 'The empty orbital would lie in the ring plane, at 90° to the π cloud', 'Chloride is too poor a leaving group to leave from any carbon'],
        correctIndex: 1,
        correctFeedback: 'Correct: the reason is direction. The ring will not let that carbon rehybridize, so the vacancy is one of the in-plane sp² hybrids pointing outward, while the six π electrons sit in p orbitals standing above and below that plane. Overlap needs orbitals that point the same way. Compare a benzylic cation, where the empty p orbital is on a carbon <i>outside</i> the ring and lines up with the π system.',
        wrongFeedback: 'Chloride leaves alkyl carbons readily, and a benzylic cation borrows the same ring π electrons without trouble. What differs here is direction: the vacancy on a ring carbon is an in-plane sp² hybrid, and the π cloud stands at right angles to that plane, so they cannot overlap.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'If a better cation is one shift away, it goes there.',
        bodyHtml: '<p class="step-body">The 3-methylbutan-2-yl cation is secondary, and the carbon next to it carries an H. If that H moves across to the positive carbon, taking its bonding pair along, the charge ends up on the carbon the H left, which is tertiary. The cation does exactly this, usually before a nucleophile can reach it.</p>' +
          '<p class="step-body">This move is a <b>1,2-shift</b>: a group on the carbon <i>next to</i> the charge moves over to it, and the charge moves back to the carbon the group left. A <b>1,2-hydride shift</b> moves an H, which travels as hydride, H⁻, because it takes both electrons. A <b>1,2-methyl shift</b> moves a CH₃ the same way, and other alkyl groups can move too.</p>' +
          '<p class="step-body">The curved arrow’s tail goes on the <b>bond that moves</b>, the C–H or C–CH₃ bond, and its head goes on the positive carbon. What moves is a bond and its two electrons, so the tail belongs on the bond, not on the H itself.</p>' +
          '<div class="explain-box" style="margin-bottom:0;"><b>The rule.</b> A cation shifts when one shift gives a more stable cation. It never shifts to a less stable one, and it stops at the most stable cation on offer. Only a group on the immediate neighbor can move.</div>',
        diagramHtml: '<!-- fig:l-hydride-shift:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 392" role="img" aria-label="The 3-methylbutan-2-yl cation, a secondary cation. A curved arrow starts on the C-H bond of the next carbon and ends at the positive carbon. Below, after the shift: the hydrogen sits on the old cation carbon, and the positive charge is on the carbon the hydrogen left, now tertiary."><text class="fg-tag" x="170" y="22" text-anchor="middle" font-size="11">BEFORE: 2°</text><line class="fg-bond" x1="95" y1="124" x2="145" y2="96"></line><line class="fg-bond" x1="145" y1="96" x2="195" y2="124"></line><line class="fg-bond" x1="195" y1="124" x2="245" y2="96"></line><line class="fg-bond" x1="195" y1="124" x2="195" y2="168"></line><line class="fg-bond-hi" x1="195" y1="124" x2="195" y2="84"></line><circle class="fg-atom" cx="195" cy="72" r="12"></circle><circle class="fg-atom-hi" cx="195" cy="72" r="12"></circle><text class="fg-lbl" x="195" y="76.44" text-anchor="middle" font-size="12">H</text><text class="fg-warn" x="131" y="83" text-anchor="middle" font-size="16">+</text><path class="fg-arrow" d="M190 98 Q172.5 79.83 155.52 86.45"></path><path class="fg-head" d="M149 89 L154.2 83.06 L156.84 89.85 Z"></path><line class="fg-arrow-mut" x1="170" y1="176" x2="170" y2="200"></line><path class="fg-head-mut" d="M170 208 L165.84 200 L174.16 200 Z"></path><text class="fg-tag-good" x="170" y="234" text-anchor="middle" font-size="11">AFTER: 3°</text><line class="fg-bond" x1="95" y1="340" x2="145" y2="312"></line><line class="fg-bond" x1="145" y1="312" x2="195" y2="340"></line><line class="fg-bond" x1="195" y1="340" x2="245" y2="312"></line><line class="fg-bond" x1="195" y1="340" x2="195" y2="384"></line><line class="fg-bond-hi" x1="145" y1="312" x2="145" y2="274"></line><circle class="fg-atom" cx="145" cy="262" r="12"></circle><circle class="fg-atom-hi" cx="145" cy="262" r="12"></circle><text class="fg-lbl" x="145" y="266.44" text-anchor="middle" font-size="12">H</text><text class="fg-warn" x="195" y="325" text-anchor="middle" font-size="16">+</text></svg><figcaption>The arrow starts on the C&ndash;H bond. The H moves with both electrons; the charge moves back one carbon.</figcaption></figure><!-- fig:l-hydride-shift:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided practice',
        title: 'In a 1,2-hydride shift, where does the tail of the curved arrow start?',
        options: ['On the C–H bond of the neighboring carbon', 'On the hydrogen atom itself, since the hydrogen is what moves', 'On the positive carbon, since the arrow shows where the charge goes'],
        correctIndex: 0,
        correctFeedback: 'Correct. A curved arrow always starts on electrons, and the electrons that move are the pair in the C–H bond. The tail goes on that bond and the head on the positive carbon, where the H and its pair end up.',
        wrongFeedback: 'A curved arrow starts on electrons. An H atom on its own has no pair to give, and the positive carbon has an empty orbital, not a pair. The pair that moves is the one in the C–H bond, so the tail goes on that bond.'
      },
      {
        type: 'explain',
        eyebrow: 'Explanation',
        title: 'Why a more stable cation also forms faster.',
        bodyHtml: '<p class="step-body">Forming a carbocation is strongly uphill: a bond breaks and two charged pieces appear. By the Hammond postulate from the Energy diagrams lesson, the transition state for such a step comes late and looks much like the cation itself. So anything that lowers the cation’s energy lowers the barrier to it by nearly as much.</p>' +
          '<p class="step-body" style="margin-bottom:0;">That is why carbocation stability predicts rates as well as lifetimes. It tells you which of two possible cations forms, which reaction goes faster, and therefore which product you isolate.</p>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'The neopentyl cation, (CH₃)₃C–CH₂⁺, has no hydrogen on the carbon next to the charge. What happens to it?',
        diagramHtml: '<!-- fig:l-neopentyl-cation:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 170" role="img" aria-label="The neopentyl cation drawn skeletally: a positive CH2 carbon bonded to a quaternary carbon that carries three methyl groups, one of them written out as CH3 pointing up. The quaternary carbon has no hydrogen."><line class="fg-bond" x1="120" y1="80" x2="170" y2="108"></line><line class="fg-bond" x1="170" y1="108" x2="220" y2="80"></line><line class="fg-bond" x1="170" y1="108" x2="170" y2="152"></line><line class="fg-bond" x1="170" y1="108" x2="170" y2="74"></line><circle class="fg-atom" cx="170" cy="56" r="18"></circle><text class="fg-lbl" x="170" y="59.52" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-warn" x="106" y="67" text-anchor="middle" font-size="16">+</text><text class="fg-tag-warn" x="98" y="100" text-anchor="end" font-size="11">the CH₂⁺</text><text class="fg-tag" x="194" y="134" text-anchor="start" font-size="11">no H here</text></svg><figcaption>The neopentyl cation, (CH₃)₃C&ndash;CH₂⁺.</figcaption></figure><!-- fig:l-neopentyl-cation:end -->',
        options: ['A methyl group shifts over, giving the tertiary cation (CH₃)₂C⁺–CH₂CH₃', 'Nothing: with no hydrogen on the next carbon, no shift is possible, so it stays primary', 'A hydrogen shifts from two carbons away, giving a secondary cation'],
        correctIndex: 0,
        correctFeedback: 'Correct, and this is why neopentyl substrates are an exam favorite. A student who looks only for a hydride shift finds none and gives the unrearranged product. But the rule is about groups, not just hydrogens. The neighboring carbon carries three methyls, and moving one of them across with its bonding pair leaves the charge on that carbon, which still holds two methyls and the new ethyl group: a <b>tertiary</b> cation from a primary one. The arrow runs from the C–CH₃ bond to the CH₂⁺ carbon.' +
          '<!-- fig:l-neopentyl-shift:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 392" role="img" aria-label="The neopentyl cation with a curved arrow from the bond to one methyl group on the quaternary carbon to the positive CH2 carbon. Below, after the shift: that methyl sits on the old CH2, and the positive charge is on the former quaternary carbon, now tertiary."><text class="fg-tag-warn" x="170" y="22" text-anchor="middle" font-size="11">BEFORE: 1°</text><line class="fg-bond" x1="120" y1="96" x2="170" y2="124"></line><line class="fg-bond" x1="170" y1="124" x2="220" y2="96"></line><line class="fg-bond" x1="170" y1="124" x2="170" y2="168"></line><line class="fg-bond-hi" x1="170" y1="124" x2="170" y2="90"></line><circle class="fg-atom" cx="170" cy="72" r="18"></circle><circle class="fg-atom-hi" cx="170" cy="72" r="18"></circle><text class="fg-lbl" x="170" y="75.52" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-warn" x="106" y="83" text-anchor="middle" font-size="16">+</text><path class="fg-arrow" d="M165 98 Q147.5 79.83 130.52 86.45"></path><path class="fg-head" d="M124 89 L129.2 83.06 L131.84 89.85 Z"></path><line class="fg-arrow-mut" x1="170" y1="176" x2="170" y2="200"></line><path class="fg-head-mut" d="M170 208 L165.84 200 L174.16 200 Z"></path><text class="fg-tag-good" x="170" y="234" text-anchor="middle" font-size="11">AFTER: 3°</text><line class="fg-bond" x1="120" y1="312" x2="170" y2="340"></line><line class="fg-bond" x1="170" y1="340" x2="220" y2="312"></line><line class="fg-bond" x1="170" y1="340" x2="170" y2="384"></line><line class="fg-bond-hi" x1="120" y1="312" x2="120" y2="280"></line><circle class="fg-atom" cx="120" cy="262" r="18"></circle><circle class="fg-atom-hi" cx="120" cy="262" r="18"></circle><text class="fg-lbl" x="120" y="265.52" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-warn" x="170" y="325" text-anchor="middle" font-size="16">+</text></svg><figcaption>The arrow starts on the C&ndash;CH₃ bond and ends at the CH₂⁺ carbon.</figcaption></figure><!-- fig:l-neopentyl-shift:end -->',
        wrongFeedback: 'Two things to fix. A shift is not limited to hydrogen: an alkyl group moves the same way, and here the neighboring carbon has three methyls to offer. And only the <i>immediate</i> neighbor can reach, so a hydrogen two carbons away is out of range.'
      }
    ]
  });
