    <p class="lede" style="margin-top:0;">The exposed pi bond makes alkenes electron-rich targets — electrophiles add across the double bond instead of substituting or eliminating.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'addition-reactions',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The alkene is the nucleophile now</h3><p class="step-body">This is a genuine role reversal from Module 6: the pi bond\'s electron density, exposed above and below the sigma framework, makes the alkene itself act as a <b>nucleophile</b> (from the Nucleophiles lesson) — it attacks an electrophile rather than being attacked. The general pattern is called <b>electrophilic addition</b>: an electrophile adds to one carbon of the double bond, generating a carbocation at the other carbon, which a nucleophile then captures.</p>' +
      '<h3>Hydrohalogenation (HX addition)</h3><p class="step-body">With HBr: the pi bond attacks the H of H–Br (curved arrow from the pi bond to H, and the H–Br bond breaks heterolytically, both electrons going to Br⁻). This forms a carbocation at the more substituted carbon (Markovnikov selectivity — see next lesson) and releases Br⁻. Br⁻ then acts as the nucleophile, attacking the carbocation to form the C–Br bond. Net result: H and Br end up on adjacent carbons, with H on the carbon that had more H\'s already and Br on the more substituted carbon.</p>' +
      '<div class="notes-fact">This carbocation intermediate is the exact same species from the SN1/E1 lessons — it can rearrange via hydride or alkyl shifts if a more stable carbocation is reachable, exactly as in SN1/E1, giving "unexpected" addition products at a nearby carbon.</div>' +
      '<h3>Halogenation (X₂ addition) — no carbocation, no rearrangement</h3><p class="step-body">With Br₂ or Cl₂, the mechanism is subtly different: the pi bond attacks one Br of Br–Br, but instead of forming a free carbocation, the departing Br⁻ bridges back to form a three-membered <b>bromonium ion</b> (a cyclic, positively-charged intermediate) that shields one face of the molecule. A separate Br⁻ then attacks from the opposite face (backside, SN2-like) in an anti (backside) fashion. Because the second attack is forced to the opposite face, halogenation adds the two halogens with <b>anti stereochemistry</b> — a directly testable, predictable spatial outcome, unlike hydrohalogenation\'s carbocation which can be attacked from either face.</p>' +
      '<h3>Acid-catalyzed hydration</h3><p class="step-body">Water adds across the double bond using H₃O⁺ (or H₂SO₄/H₂O) as catalyst: the pi bond attacks a proton from H₃O⁺, forming a carbocation (Markovnikov selectivity again); water then attacks the carbocation as the nucleophile; a final deprotonation (by another water molecule) regenerates the catalyst and gives the neutral alcohol. This is the classic bridge to Module 8 — it\'s the most direct lab synthesis of an alcohol from an alkene, and its carbocation intermediate means it shares hydrohalogenation\'s rearrangement risk.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Electrophilic addition: the alkene attacks first.',
        bodyHtml: '<p class="step-body">Every reaction in this lesson follows the same three-part skeleton, called <b>electrophilic addition</b>: (1) the alkene\'s pi bond, acting as the nucleophile, attacks an electrophile; (2) this generates a carbocation (or a related bridged cation) at the other alkene carbon; (3) a nucleophile then captures that cation, forming the second new bond. The name describes it from the electrophile\'s point of view — an electrophile is "added" across what used to be the double bond.</p><p class="step-body" style="margin-bottom:0;">This is a genuine reversal of the role alkenes play compared to everything in Module 6: there, the substrate was the electrophile being attacked by a nucleophile. Here, the alkene\'s exposed pi electrons make it the electron-rich nucleophile instead.</p>'
      },
      {
        render: function(api){
          var steps = [
            { key: 'attack', label: 'Step 1: pi bond attacks H of H–Br', done: false },
            { key: 'cation', label: 'Step 2: carbocation forms, Br⁻ released', done: false },
            { key: 'capture', label: 'Step 3: Br⁻ attacks the carbocation', done: false }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the three mechanism stages of HBr addition in the correct order.</h2>' +
            '<p class="step-body">Every electrophilic addition follows this same three-part sequence.</p>' +
            '<div class="choice-row" style="flex-direction:column;">' + steps.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 3</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['attack', 'cation', 'capture'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var key = btn.getAttribute('data-v');
              if(key === order[idx]){
                btn.disabled = true;
                btn.classList.add('correct');
                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 3';
                if(idx === 3){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. The sequence always runs: nucleophilic attack by the pi bond, then cation formation, then nucleophilic capture.' : 'Exactly right — attack, then cation, then capture. This three-step pattern is the backbone of every electrophilic addition in this lesson.');
                  next.disabled = false;
                }
              } else {
                mistake = true;
                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'In hydrohalogenation (HX addition), what does the alkene\'s pi bond attack first?',
        options: ['The halogen of H–X', 'Nothing — the halide ion attacks first', 'The hydrogen of H–X'],
        correctIndex: 2,
        correctFeedback: 'Correct — the pi bond attacks the electrophilic H, breaking the H–X bond heterolytically and forming a carbocation while releasing X⁻.',
        wrongFeedback: 'The hydrogen is the electrophilic end of H–X (it\'s the atom that can accept the pi bond\'s electrons and leave as part of a departing X⁻).'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Halogenation (X₂) skips the free carbocation — and that changes the stereochemistry.',
        bodyHtml: '<p class="step-body">Adding Br₂ or Cl₂ looks similar at first (pi bond attacks one halogen of X–X, the X–X bond breaks, X⁻ leaves) but the departing halide doesn\'t fully leave — it swings around and bridges back to both alkene carbons, forming a three-membered ring called a <b>halonium ion</b> (bromonium with Br₂). This bridged ion physically blocks one entire face of the molecule.</p><p class="step-body" style="margin-bottom:0;">A second halide ion is then forced to attack from the open, opposite face — a backside attack much like SN2\'s inversion. The result: the two halogens always end up added to <b>opposite faces</b> of the original double bond (<b>anti addition</b>), a directly observable, predictable stereochemical outcome that hydrohalogenation\'s free (non-bridged) carbocation doesn\'t guarantee.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why does Br₂ addition give anti (opposite-face) stereochemistry, while HBr addition doesn\'t reliably?',
        options: ['Br₂ forms a bridged bromonium ion that blocks one face, forcing backside attack; HBr forms a free (unbridged) carbocation attackable from either face', 'Br₂ reacts faster, giving it no time to rotate', 'HBr is a stronger acid than Br₂'],
        correctIndex: 0,
        correctFeedback: 'Correct — the bridging bromonium ion is the entire reason halogenation is stereospecifically anti, unlike hydrohalogenation\'s open carbocation.',
        wrongFeedback: 'Reaction speed and relative acid strength aren\'t the deciding factors here — it comes down to whether the intermediate is a bridged ion (blocking one face) or a free, planar carbocation (open to attack from either face).'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Acid-catalyzed hydration adds water — and shares hydrohalogenation\'s carbocation risk.',
        bodyHtml: '<p class="step-body">Treating an alkene with aqueous acid (H₃O⁺, typically from dilute H₂SO₄) adds water across the double bond in three steps: the pi bond attacks a proton to form a carbocation (exactly like hydrohalogenation, and subject to the same Markovnikov selectivity you\'ll formalize next lesson); water attacks the carbocation as the nucleophile; a final proton transfer to another water molecule removes the extra positive charge and regenerates the H₃O⁺ catalyst.</p><p class="step-body" style="margin-bottom:0;">Because this pathway runs through a free carbocation — the same reactive, rearrangement-prone species from SN1/E1 — it carries the same risk of hydride or alkyl shifts to a more stable carbocation before water ever attacks, sometimes giving an alcohol at an unexpected carbon.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This mechanism skeleton reappears constantly in Module 8 and beyond.',
        bodyHtml: '<div class="explain-box">Acid-catalyzed hydration is your first direct synthetic route from an alkene to an alcohol — the literal bridge into Module 8. And the "electrophile adds, cation forms, nucleophile captures" skeleton you just practiced ordering will reappear nearly unchanged for epoxide-opening reactions and even parts of carbonyl chemistry. Recognizing this three-part shape is worth more than memorizing any single reagent.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'An alkene is treated with Br₂. A chemist isolates the product and finds the two bromines were added to exactly opposite faces of the original double bond, with no exceptions. What does this tell you about the mechanism?',
        options: ['It went through a free, planar carbocation, same as HBr addition', 'It went through a bridged halonium ion that blocked one face, forcing anti addition', 'Br₂ additions are always random and this result is a coincidence'],
        correctIndex: 1,
        correctFeedback: 'Correct — perfectly consistent anti addition, with no exceptions, is the signature of a bridged intermediate blocking one face. A free carbocation (as in HBr addition) would allow attack from both faces and a mix of products.'
      }
    ]
  });
})();
</script>
