<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Three of these four follow from the one resonance structure; the fourth
     is the inversion students reach for, because "there is a lone pair on
     nitrogen" feels like it should predict basicity. Including it is the
     point of the exercise. */
  var CASES = [
    { id:'p1', t:'The C–N bond is <b>shorter</b> than an ordinary C–N single bond', right:'yes',
      why:'Follows. The second structure puts a full double bond between C and N, so the real bond is somewhere between the two: about 1.33 Å against 1.47 Å for a plain C–N single bond.' },
    { id:'p2', t:'The six atoms of the amide unit lie in <b>one plane</b>', right:'yes',
      why:'Follows. Partial double-bond character means the nitrogen is effectively sp² and rotation about C–N costs real energy, so Cα, C, O, N, H and the next Cα are held coplanar. The backbone is a chain of rigid plates hinged at the α carbons.' },
    { id:'p3', t:'The peptide nitrogen is a <b>stronger base</b> than an ordinary alkylamine', right:'no',
      why:'Does not follow — it is the opposite. Delocalization is exactly what makes that lone pair unavailable, so an amide nitrogen is a far weaker base than an amine. Protonation happens on the oxygen instead, and only in strong acid.' },
    { id:'p4', t:'Cutting the bond needs <b>hot acid or an enzyme</b>', right:'yes',
      why:'Follows. The same donation that stabilizes the nitrogen stabilizes the carbonyl, leaving the amide the least reactive acyl derivative. Proteins would not last long enough to be useful otherwise.' }
  ];
  var OPTS = [ { k:'yes', l:'Follows' }, { k:'no', l:'Does not follow' } ];

  window.OchemLessonEngine.start({
    topicId: 'peptides-proteins',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A peptide bond is an amide, and nothing more.',
        bodyHtml: '<p class="step-body">Join the carboxyl of one amino acid to the amino group of the next, lose water, and what you have made is an <b>amide</b>. The chemistry of proteins is the chemistry of amides, applied a few hundred times in a row. Two residues make a dipeptide, a few dozen a polypeptide, and a polypeptide that folds into a working shape is a protein.</p>' +
          '<p class="step-body">Because the two ends are different, the chain has a direction. One end keeps a free amino group, the <b>N-terminus</b>, and the other a free carboxyl, the <b>C-terminus</b>. Sequences are always written and numbered <b>N to C</b>, and names follow: in glycylalanine, glycine is the residue whose carboxyl was used up, so it is at the N-terminus and alanine is at the C-terminus.</p>' +
          '<div class="explain-box">Gly-Ala and Ala-Gly are <b>different compounds</b>, not two ways of writing one. Same atoms, same formula, opposite order — so the direction is not a convention you can quietly ignore. Twenty choices at each of n positions gives 20ⁿ sequences, which is why a protein of even modest length is effectively unique.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One resonance structure explains everything odd about it.',
        bodyHtml: '<p class="step-body">Draw the amide and push the nitrogen lone pair into the carbonyl: the C=O becomes C–O⁻ and the C–N becomes C=N⁺. That second structure is a substantial contributor, and the real bond is the hybrid of the two.</p>' +
          '<p class="step-body">Three consequences come out of it at once, and they are the three questions people are asked about the peptide bond:</p>' +
          '<ul class="step-body" style="margin-bottom:0;">' +
          '<li><b>It is planar and does not rotate freely.</b> A partial π bond has to be held flat, so the amide unit is rigid. Conformational freedom lives at the α carbons instead, and that restriction is what makes a finite set of folds possible.</li>' +
          '<li><b>The nitrogen is not basic.</b> Its lone pair is already committed to the carbonyl. Amide nitrogens are spectators, not nucleophiles.</li>' +
          '<li><b>It is the least reactive acyl derivative.</b> An acyl chloride hydrolyzes in water; an amide needs hours of hot aqueous acid, or an enzyme that has evolved to do it at body temperature.</li>' +
          '</ul>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which of these follow from amide resonance?</h2>' +
            '<p class="step-body">One of the four does not. Push the lone pair into the carbonyl, look at what that costs the nitrogen, and decide each one from the picture rather than from memory.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Does this follow from resonance">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Ask what the nitrogen gives up when it donates. A lone pair spent on a neighboring carbonyl is a lone pair that cannot also grab a proton.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Short bond, flat unit, dead nitrogen, sluggish hydrolysis — one structure, four observations.'
                  : 'All four, first time, including the trap. Delocalizing a lone pair makes nitrogen <i>less</i> basic, not more.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why is the nitrogen of a peptide bond a far weaker base than the nitrogen of an alkylamine?',
        options: [
          'It is bonded to three carbons rather than one',
          'Its lone pair is delocalized into the adjacent carbonyl',
          'The neighboring oxygen withdraws through the σ bonds only',
          'Nitrogen is sp³ hybridized in an amide'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Basicity asks whether a lone pair is available, and this one is spent. Inductive withdrawal contributes a little, but delocalization is the large effect — and the nitrogen is closer to sp², not sp³, which is a symptom of the same cause.',
        wrongFeedback: 'A base donates a lone pair. Look at where this nitrogen&rsquo;s lone pair already is in the second resonance structure.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'In the dipeptide Ala-Ser, which residue carries the free carboxyl group?',
        options: [
          'Alanine, because it is written first',
          'Serine, because sequences run N-terminus to C-terminus',
          'Both, since each residue keeps its own carboxyl',
          'Neither — both carboxyls are consumed by the peptide bond'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Alanine gave up its carboxyl to form the amide, so it sits at the N-terminus with a free amino group; serine is last, so its carboxyl was never used. Reading the name left to right is reading the chain N to C.',
        wrongFeedback: 'One carboxyl and one amino group were consumed making the bond. Which end of the written sequence is the N-terminus?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Four levels, and only one of them is built from covalent bonds.',
        bodyHtml: '<p class="step-body">A folded protein is described at four levels, and it is worth noticing how little of it is held together by bonds in the usual sense.</p>' +
          '<ul class="step-body">' +
          '<li><b>Primary</b> — the sequence of residues. A chain of covalent amides, and the only level whose structure <i>is</i> its bonds.</li>' +
          '<li><b>Secondary</b> — local patterns, the α helix and the β pleated sheet, held by hydrogen bonds between backbone N–H and C=O. The side chains are not involved.</li>' +
          '<li><b>Tertiary</b> — the full three-dimensional shape of one chain, held by the hydrophobic effect, side-chain hydrogen bonds, salt bridges between charged side chains, and disulfides.</li>' +
          '<li><b>Quaternary</b> — how several finished chains assemble, as the four subunits of hemoglobin do.</li>' +
          '</ul>' +
          '<div class="explain-box">The largest contributor to tertiary structure is the <b>hydrophobic effect</b>: nonpolar side chains are driven inward because burying them frees the water that would otherwise be ordered around them. The one covalent contribution is the <b>disulfide</b>, R–S–S–R, made by oxidizing two cysteines and undone by reducing it.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'What holds an α helix in shape?',
        options: [
          'Disulfide bonds between cysteine side chains',
          'Hydrogen bonds between backbone N–H and C=O groups',
          'Ionic attraction between the N- and C-termini',
          'Covalent bonds between adjacent side chains'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and the detail that matters is that they are <i>backbone</i> hydrogen bonds. Because every residue supplies an N–H and a C=O regardless of what its side chain is, any sequence can form a helix — which is why secondary structure is a property of the backbone rather than of particular residues.',
        wrongFeedback: 'Secondary structure is defined as the part that involves only the backbone. Which groups does every residue&rsquo;s backbone provide?'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Boiling an egg white makes it solid and irreversibly so, yet hydrolyzing the same protein to free amino acids needs hours in 6 M HCl at 110 °C. Why the difference?',
        options: [
          'Heat breaks peptide bonds; acid only unfolds the chain',
          'Denaturation undoes weak noncovalent forces; hydrolysis has to break amides',
          'Egg white protein has no peptide bonds, only hydrogen bonds',
          'Boiling water is not hot enough to affect the protein at all'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and it is the four levels doing exactly what they should. Boiling supplies enough energy to overwhelm hydrogen bonds, salt bridges and the hydrophobic effect, so secondary and tertiary structure collapse and the exposed chains tangle — the protein is <b>denatured</b> and its shape is gone. Primary structure is untouched, because amides are the least reactive acyl derivative and shrug off 100 °C water. Getting through them is a separate, much harsher job, which is why the body uses enzymes rather than heat. Irreversible is about the tangle, not about broken bonds: the covalent chain is intact in a boiled egg, it simply cannot find its way back.'
      }
    ]
  });

})();
});
</script>
