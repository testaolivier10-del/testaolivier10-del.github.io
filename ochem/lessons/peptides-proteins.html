        bodyHtml: '<p class="step-body">In a folded protein in water, leucine, valine and phenylalanine side chains are usually buried inside. Aspartate, lysine and serine side chains sit on the surface, next to the water.</p>' +
          '<p class="step-body">The main reason is the water. Water next to a nonpolar surface is forced into a more ordered arrangement. Burying the nonpolar side chains frees that water, and the gain in its disorder (its <b>entropy</b>) drives the fold. This is the <b>hydrophobic effect</b>, the largest single force in tertiary structure.</p>',
        diagramHtml: '<!-- fig:hydrophobic-core:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 332" role="img" aria-label="A folded protein drawn as an oval. Inside it, the nonpolar side chains Leu, Val, Phe and Ile are packed together. Around its edge, the polar and charged side chains Asp minus, Lys plus, Ser, Glu minus, Arg plus and Thr point outward, and H2O molecules sit outside next to them."><ellipse class="fg-panel" cx="170" cy="144" rx="112" ry="90"></ellipse><ellipse class="fg-fill-warn" opacity="0.25" cx="172" cy="144" rx="62" ry="46"></ellipse><circle class="fg-atom" cx="138" cy="122" r="18"></circle><text class="fg-lbl" x="138" y="125.52" text-anchor="middle" font-size="9.5">Leu</text><circle class="fg-atom" cx="202" cy="118" r="18"></circle><text class="fg-lbl" x="202" y="121.52" text-anchor="middle" font-size="9.5">Val</text><circle class="fg-atom" cx="142" cy="168" r="18"></circle><text class="fg-lbl" x="142" y="171.52" text-anchor="middle" font-size="9.5">Phe</text><circle class="fg-atom" cx="204" cy="166" r="18"></circle><text class="fg-lbl" x="204" y="169.52" text-anchor="middle" font-size="9.5">Ile</text><circle class="fg-atom" cx="263.53" cy="101" r="20"></circle><circle class="fg-atom-hi" cx="263.53" cy="101" r="20"></circle><text class="fg-lbl" x="263.53" y="104.52" text-anchor="middle" font-size="9.5">Asp⁻</text><text class="fg-tag-mut" x="296.44" y="88" text-anchor="middle" font-size="11">H₂O</text><circle class="fg-atom" cx="151.25" cy="59.31" r="20"></circle><circle class="fg-atom-hi" cx="151.25" cy="59.31" r="20"></circle><text class="fg-lbl" x="151.25" y="62.82" text-anchor="middle" font-size="9.5">Lys⁺</text><text class="fg-tag-mut" x="144.65" y="29.82" text-anchor="middle" font-size="11">H₂O</text><circle class="fg-atom" cx="69.86" cy="111.78" r="20"></circle><circle class="fg-atom-hi" cx="69.86" cy="111.78" r="20"></circle><text class="fg-lbl" x="69.86" y="115.3" text-anchor="middle" font-size="9.5">Ser</text><text class="fg-tag-mut" x="34.63" y="103.05" text-anchor="middle" font-size="11">H₂O</text><circle class="fg-atom" cx="78.41" cy="189.57" r="20"></circle><circle class="fg-atom-hi" cx="78.41" cy="189.57" r="20"></circle><text class="fg-lbl" x="78.41" y="193.09" text-anchor="middle" font-size="9.5">Glu⁻</text><text class="fg-tag-mut" x="46.18" y="211.59" text-anchor="middle" font-size="11">H₂O</text><circle class="fg-atom" cx="170" cy="230" r="20"></circle><circle class="fg-atom-hi" cx="170" cy="230" r="20"></circle><text class="fg-lbl" x="170" y="233.52" text-anchor="middle" font-size="9.5">Arg⁺</text><text class="fg-tag-mut" x="170" y="268" text-anchor="middle" font-size="11">H₂O</text><circle class="fg-atom" cx="263.53" cy="187" r="20"></circle><circle class="fg-atom-hi" cx="263.53" cy="187" r="20"></circle><text class="fg-lbl" x="263.53" y="190.52" text-anchor="middle" font-size="9.5">Thr</text><text class="fg-tag-mut" x="296.44" y="208" text-anchor="middle" font-size="11">H₂O</text><text class="fg-tag" x="170" y="300" text-anchor="middle" font-size="11">inside: nonpolar side chains</text><text class="fg-tag" x="170" y="320" text-anchor="middle" font-size="11">surface: polar and charged, facing water</text></svg><figcaption>The nonpolar side chains (plain discs, coral patch) pack together inside. The polar and charged ones (teal) sit on the surface, next to the water.</figcaption></figure><!-- fig:hydrophobic-core:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Only one cross-link is covalent.',
        bodyHtml: '<p class="step-body">Side chains also hold the fold with hydrogen bonds and <b>salt bridges</b>. A salt bridge is the attraction between a negative side chain, such as aspartate’s COO⁻, and a positive one, such as lysine’s NH₃⁺.</p>' +
          '<p class="step-body">The one covalent cross-link is the <b>disulfide</b>, R–S–S–R. Oxidizing two cysteine thiols makes it, and reduction breaks it again.</p>' +
          '<div class="explain-box">Heat breaks the hydrogen bonds, salt bridges and hydrophobic packing, so the chain unfolds. The protein is <b>denatured</b>. The peptide bonds survive, and so do the disulfides.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Boiling an egg white makes it solid and irreversibly so, yet hydrolyzing the same protein to free amino acids needs hours in 6 M HCl at 110 °C. Why the difference?',
        options: [
          'Heat breaks the peptide bonds, while acid only unfolds the chain',
          'Boiling breaks only weak forces; hydrolysis must break amides',
          'Egg white protein has no peptide bonds, only hydrogen bonds',
          'Boiling water is not hot enough to change the protein at all'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and the four levels explain it. Boiling supplies enough energy to overcome hydrogen bonds, salt bridges and the hydrophobic effect, so secondary and tertiary structure collapse and the exposed chains tangle. The protein is <b>denatured</b>. Primary structure is untouched, because amides are the least reactive acyl derivative and survive 100 °C water. Breaking them is a separate and much harsher job, which is why the body uses enzymes rather than heat. The change is irreversible because of the tangle, not because bonds broke: the covalent chains in a boiled egg are intact, and they simply cannot find their way back.'
      }
    ]
