<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){

  var CASES = [
    { id:'n1', t:'CH<sub>3</sub>CH<sub>2</sub>CN + <b>H<sub>3</sub>O<sup>+</sup>, heat</b>', right:'acid',
      why:'Propanoic acid, through the amide. Substitution along the same rung, so no oxidant is needed &mdash; and milder conditions stop at the amide, which is how you catch it.' },
    { id:'n2', t:'CH<sub>3</sub>CH<sub>2</sub>CN + <b>LiAlH<sub>4</sub></b>, then H<sub>2</sub>O', right:'amine',
      why:'Propan-1-amine. Two hydrides go on, and the nitrile carbon is the one that becomes the CH<sub>2</sub> &mdash; three carbons in, three carbons out.' },
    { id:'n3', t:'CH<sub>3</sub>CH<sub>2</sub>CN + <b>DIBAL-H</b>, 1 equiv, &minus;78 &deg;C', right:'ald',
      why:'Propanal. One hydride adds and stops, because the metalated imine anion it makes is not an electrophile. Water on workup hydrolyzes it to the aldehyde.' },
    { id:'n4', t:'CH<sub>3</sub>CH<sub>2</sub>CN + <b>CH<sub>3</sub>MgBr</b>, then H<sub>3</sub>O<sup>+</sup>', right:'ket',
      why:'Butan-2-one. The Grignard adds once and cannot add twice, because the intermediate is an imine salt rather than a carbonyl. Three carbons plus one is four.' },
    { id:'n5', t:'CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>Br + <b>NaCN</b>', right:'nitrile',
      why:'Butanenitrile &mdash; an S<sub>N</sub>2, and the chain is now one carbon longer. Cyanide is a strong nucleophile and a weak base, which is the exact combination S<sub>N</sub>2 wants.' },
    { id:'n6', t:'(CH<sub>3</sub>)<sub>3</sub>CBr + <b>NaCN</b>', right:'alkene',
      why:'Isobutylene, and no nitrile at all. A tertiary substrate cannot do S<sub>N</sub>2, so the only thing left is elimination. This is the row that decides whether the cyanide route is available to you.' }
  ];
  var OPTS = [ { k:'amine', l:'Primary amine' }, { k:'acid', l:'Carboxylic acid' }, { k:'ket', l:'Ketone' }, { k:'ald', l:'Aldehyde' }, { k:'alkene', l:'Alkene' }, { k:'nitrile', l:'Nitrile' } ];

  window.OchemLessonEngine.start({
    topicId: 'nitriles',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'No carbonyl, and it belongs here anyway.',
        bodyHtml: '<p class="step-body">A nitrile has no C=O and no leaving group, so nothing about it looks like the RCO&ndash;X skeleton this chapter is built on. Count bonds to heteroatoms and it fits exactly.</p>' +
          '<p class="step-body">The nitrile carbon has <b>three</b> bonds to nitrogen. A carboxylic acid carbon has three to oxygen. Same rung of the oxidation ladder, shared with the ester, the amide and the acid chloride.</p>' +
          '<div class="explain-box">Which tells you what to expect before you see a single reaction. Turning a nitrile into an acid, an ester or an amide is <b>substitution</b> and needs no oxidant. Getting down to an aldehyde or an amine needs a <b>reducing agent</b>, exactly as it does for every other member of the rung.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The carbon count is the whole point.',
        bodyHtml: '<p class="step-body">Cyanide does S<sub>N</sub>2 on a primary halide, and the carbon it brings stays. That makes <b>RX &rarr; RCN &rarr; RCOOH</b> the standard way to lengthen a chain by one and finish with an acid.</p>' +
          '<ul class="step-body">' +
          '<li><b>Primary</b> substrate: clean S<sub>N</sub>2.</li>' +
          '<li><b>Secondary</b>: sluggish, with elimination alongside.</li>' +
          '<li><b>Tertiary</b>: alkene only, and no nitrile at all.</li>' +
          '</ul>' +
          '<div class="explain-box">The Grignard route &mdash; RX, then Mg, then CO<sub>2</sub> &mdash; reaches the same product with the same one added carbon, and the two are complements rather than duplicates. Cyanide demands a primary, unhindered substrate but is untroubled by acidic protons — an O–H or N–H does not touch it. A Grignard tolerates a hindered substrate but is destroyed by any O&ndash;H, N&ndash;H or carbonyl in the molecule. <b>Look at the substrate, not at the target.</b></div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">What comes out?</h2>' +
            '<p class="step-body">Two questions per row. <b>Is this a substitution along the rung, or a step down off it?</b> Then count the carbons, because two of these rows change the count and the rest do not.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Product">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'For the reductions, ask how many hydrides the reagent can deliver and whether the intermediate is still an electrophile. For the two substitution rows, ask what the substrate will actually allow.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All six. Four things a nitrile becomes, and two rows about whether you can make one in the first place.'
                  : 'All six, first time — including the tertiary halide, which is the row that decides whether this route is open to you at all.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why does a Grignard add only once to a nitrile, when it adds twice to an ester?',
        options: [
          'The intermediate is an imine salt, not a carbonyl',
          'The nitrile is less electrophilic than an ester',
          'Magnesium is consumed in the first addition',
          'A nitrile is less electrophilic after the first addition'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and the contrast is worth holding onto. An ester expels alkoxide partway through, releasing a ketone <i>while the Grignard is still in the flask</i> — and that ketone is hungrier than the ester was, so it is attacked immediately. A nitrile expels nothing: the first addition gives a magnesium imine salt, which is an anion and no electrophile at all, and it simply sits there until water is added on workup. The ketone appears only after the Grignard is gone.',
        wrongFeedback: 'The question is not how reactive each one is — it is what exists in the flask after the first addition. Draw that intermediate in each case and ask whether a second Grignard could attack it.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Butanenitrile is treated with LiAlH<sub>4</sub>. How many carbons does the product have?',
        options: [
          'Four',
          'Three',
          'Five',
          'Eight'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. Butanenitrile is CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>CN — four carbons, with the nitrile carbon counted as C1. LiAlH<sub>4</sub> delivers two hydrides to that carbon and it becomes a CH<sub>2</sub>, so the product is butan-1-amine: still four carbons, nothing gained or lost. Reduction changes the oxidation level, not the skeleton. The carbon you added was added back at the cyanide step, not here.',
        wrongFeedback: 'Draw butanenitrile out and count every carbon, including the one triple-bonded to nitrogen. Then ask whether a reduction adds or removes carbons.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Crippled, not rationed.',
        bodyHtml: '<p class="step-body">LiAlH<sub>4</sub> and DIBAL-H both reduce a nitrile, and they stop in different places for a reason worth stating precisely.</p>' +
          '<ul class="step-body">' +
          '<li><b>LiAlH<sub>4</sub></b> &rarr; the primary amine. Two hydrides, all the way down.</li>' +
          '<li><b>DIBAL-H</b>, one equivalent at &minus;78 &deg;C &rarr; the aldehyde, after workup.</li>' +
          '</ul>' +
          '<p class="step-body">DIBAL stops because the product of its single addition is a <b>metalated imine anion</b> &mdash; an anion is not an electrophile, so nothing further can happen to it until water arrives.</p>' +
          '<div class="explain-box">Notice that this is not about using less reagent. Adding one equivalent of LiAlH<sub>4</sub> would not give you an aldehyde; it would give you a mixture, because whatever it reduces, it reduces completely. The reagent is <b>crippled</b>, not rationed, and the same distinction is what the reduction chapter draws for esters.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'You need to lengthen a chain by one carbon and finish with an acid. The substrate is a primary bromide that also carries a free OH. Which route?',
        options: [
          'NaCN, then aqueous acid and heat',
          'Mg, then CO<sub>2</sub>, then aqueous acid',
          'SOCl<sub>2</sub>, then aqueous acid',
          'LiAlH<sub>4</sub>, then CO<sub>2</sub>'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and the O&ndash;H is what decides it. Both of the first two routes add exactly one carbon and finish at a carboxylic acid, so the target cannot choose between them — the substrate has to. A Grignard would be destroyed by that hydroxyl before it ever reached CO<sub>2</sub>; cyanide does not care, because it is a nucleophile rather than a base. Had the substrate been tertiary or badly hindered instead, the answer would have flipped the other way.',
        wrongFeedback: 'Two of these genuinely add one carbon and end at an acid. Look at what else is in the molecule, and ask which reagent cannot survive it.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Propanenitrile is treated with one equivalent of DIBAL-H at &minus;78 &deg;C. The flask is then warmed and stirred for an hour before water is added. What is isolated?',
        options: [
          'Propan-1-amine, from a second reduction',
          'Propanal, unchanged by the delay',
          'Propanoic acid',
          'Propanenitrile, recovered'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and the delay is the trap. The intermediate is a metalated imine <i>anion</i>, and an anion is not an electrophile — so there is nothing for a second hydride to attack no matter how long you wait or how warm the flask gets. The aldehyde does not exist until water hydrolyzes that anion, and by then the reducing agent has been destroyed by the same water. This is why the low temperature is often described as what makes DIBAL selective, which is not quite right: the temperature helps with side reactions, but the selectivity is structural. Contrast LiAlH<sub>4</sub>, where the intermediate really can be attacked again, and no amount of care with temperature or stoichiometry will let you stop at the aldehyde.'
      }
    ]
  });

})();
});
</script>
