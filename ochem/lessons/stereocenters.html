<script>
(function(){
  function stereocenterSvg(){
    return '<div class="scene"><svg viewBox="0 0 260 160">' +
      '<line x1="130" y1="90" x2="130" y2="30" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="130" y1="90" x2="75" y2="122" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="130" y1="90" x2="195" y2="112" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="130" y1="90" x2="130" y2="140" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>' +
      '<g class="atom" data-key="c"><circle cx="130" cy="90" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="96" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">C</text></g>' +
      '<circle cx="130" cy="20" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="25" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">OH</text>' +
      '<circle cx="60" cy="132" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="60" y="137" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">CH₃</text>' +
      '<circle cx="205" cy="120" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="205" y="125" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">CH₂CH₃</text>' +
      '<circle cx="130" cy="148" r="12" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="152" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">H</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'stereocenters',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A stereocenter is a carbon with four different groups.',
        bodyHtml: '<p class="step-body">The most common cause of chirality in organic molecules is a <b>stereocenter</b>: an sp³ carbon bonded to <b>four different groups</b>. Because every substituent is distinct, that carbon has a genuine "handedness" — swap any two groups and you get a different three-dimensional arrangement (a different stereoisomer), not the same molecule redrawn.</p><p class="step-body" style="margin-bottom:0;">If even two of the four groups are identical, the carbon is <i>not</i> a stereocenter — with a repeated group, swapping two substituents just gives back the same molecule.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the carbon\'s four attached groups. Are they all different?</h2>' +
            '<p class="step-body">This carbon (from 2-butanol) is bonded to OH, H, CH₃, and CH₂CH₃. Click each group to confirm they\'re all distinct.</p>' +
            stereocenterSvg() +
            '<p class="step-body" style="font-size:12.5px;color:var(--muted);">(This step has no wrong answer — click Continue once you\'ve looked it over.)</p>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', true);
          api.card.querySelector('#nextBtn').addEventListener('click', function(){ api.record(true); api.advance(); });
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which carbon in 2-propanol, CH₃–CH(OH)–CH₃, is a stereocenter?',
        options: ['The central carbon — it has an OH group', 'None — the central carbon has two identical CH₃ groups', 'Both terminal CH₃ carbons'],
        correctIndex: 1,
        correctFeedback: 'Correct — with two identical CH₃ groups attached, the central carbon only has three distinct substituents (OH, H, and CH₃ counted once), not four. 2-propanol is achiral.',
        wrongFeedback: 'Look closely at the two groups on either side of the central carbon — they\'re both CH₃, which means they\'re identical, not different.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'A molecule has 3 stereocenters. What is the maximum number of possible stereoisomers?',
        options: ['3² = 9', '3 × 2 = 6', '2³ = 8'],
        correctIndex: 2,
        correctFeedback: 'Correct — each stereocenter independently doubles the possibilities, giving 2ⁿ total, so 2³ = 8 for three stereocenters.',
        wrongFeedback: 'Each stereocenter contributes a factor of 2 (one of two possible configurations), so the total is 2 raised to the number of stereocenters, not multiplied by it.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two quick ways to rule a carbon out.',
        bodyHtml: '<p class="step-body">Scanning a large molecule for stereocenters gets faster once you know what instantly rules a carbon <i>out</i>: <b>(1)</b> any carbon attached to two identical groups (two H atoms, two CH₃ groups, etc.) can\'t be a stereocenter — you need four distinct substituents, and a repeat means at most three. <b>(2)</b> any carbon that isn\'t sp³ (a carbon in a double bond, or with only three total substituents) doesn\'t have four groups to compare at all.</p><p class="step-body" style="margin-bottom:0;">Ring carbons can absolutely still be stereocenters — you just have to trace both directions around the ring as if they were two different substituents, and compare what you find with what\'s attached outside the ring.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Finding every stereocenter is the first step in nearly every stereochemistry problem.',
        bodyHtml: '<div class="explain-box">Before you can name a molecule\'s configuration (R/S, coming up in a later lesson), draw its enantiomer, or figure out if it\'s meso, you first have to correctly locate every stereocenter in the structure. Missing one, or incorrectly flagging a non-stereocenter, cascades into every subsequent step being wrong — this is worth practicing until it\'s fast and automatic.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A carbon is bonded to: H, OH, CH₂CH₃, and CH₂CH₂CH₃ (propyl). Is this carbon a stereocenter?',
        options: ['Yes — all four groups (H, OH, ethyl, propyl) are genuinely different', 'No — ethyl and propyl are both just "alkyl groups," so they count as identical', 'It depends on the solvent'],
        correctIndex: 0,
        correctFeedback: 'Correct — even though ethyl (CH₂CH₃) and propyl (CH₂CH₂CH₃) are both simple alkyl chains, they are chemically distinct groups (different chain lengths), so this carbon has four genuinely different substituents and is a stereocenter. "Similar-looking" is not the same as "identical."'
      }
    ]
  });
})();
</script>
