(function(){
  window.OchemLessonEngine.start({
    topicId: 'substrate-effects',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every substitution or elimination problem is three questions, asked in order.',
        bodyHtml: '<p class="step-body">Take 2-bromobutane. Heated with sodium ethoxide in ethanol, it gives mostly but-2-ene. Stirred with sodium azide in acetone, it gives 2-azidobutane. The substrate is the same; the reagent and solvent picked a different mechanism.</p><p class="step-body">You have built SN2, SN1, E2 and E1 one at a time. To predict which one actually happens, answer three questions in order:</p><ul class="step-body" style="margin-top:0;"><li><b>1. What class is the substrate?</b> Methyl, primary, secondary or tertiary.</li><li><b>2. Is the reagent strong or weak, and is it bulky?</b></li><li><b>3. Is the solvent polar protic or polar aprotic, and is the reaction heated?</b></li></ul><p class="step-body" style="margin-bottom:0;">Every &ldquo;predict the major product&rdquo; question on an alkyl halide is really asking you to run these checks. Taken in order, they give the mechanism, or the mixture of mechanisms, almost every time.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Substrate class rules mechanisms in or out before anything else matters.',
        bodyHtml: '<p class="step-body">The carbon that carries the leaving group is the <b>α carbon</b>. A carbon bonded to it is a <b>β carbon</b>, and E2 always takes its hydrogen from a β carbon. The substrate&rsquo;s class is the number of carbons bonded to the α carbon.</p><p class="step-body">SN2 needs room to reach the back of the α carbon, so crowding decides it. SN1 and E1 need a stable carbocation, so cation stability decides them.</p><p class="step-body"><b>Methyl and primary</b> substrates react by SN2. Nothing much crowds the back of the carbon, and their cations are too unstable to form, so SN1 and E1 are out. A strong bulky base, such as potassium <i>tert</i>-butoxide, is the one exception on a primary substrate: it gives E2. A methyl substrate has no β carbon, so it can never eliminate.</p><p class="step-body"><b>Tertiary</b> substrates cannot do SN2, because three groups block the back of the carbon. What remains is SN1 and E1 with a weak reagent, or E2 with a strong base.</p><p class="step-body" style="margin-bottom:0;"><b>Secondary</b> substrates can do all four. The substrate rules nothing out, so the reagent and solvent decide.</p>',
        diagramHtml: '<!-- fig:se-classes:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 424" role="img" aria-label="Four stacked rows, one per substrate class, each with the carbon that carries bromine highlighted. Methyl: bromomethane, CH3–Br, with no carbon on that carbon; SN2 only, and no beta carbon, so no E2. Primary: bromoethane, CH3–CH2–Br, one carbon attached; SN2, or E2 with a bulky base. Secondary: 2-bromopropane, two CH3 groups on the CH that carries Br; all four mechanisms compete and the reagent decides. Tertiary: 2-bromo-2-methylpropane, three CH3 groups on the carbon that carries Br; SN1 and E1, or E2, but no SN2 because the back of the carbon is blocked."><rect class="fg-panel" x="4" y="8" width="332" height="76" rx="10"></rect><text class="fg-tag" x="258" y="30" text-anchor="middle" font-size="11">METHYL</text><text class="fg-tag-mut" x="258" y="48" text-anchor="middle" font-size="11">0 C attached</text><text class="fg-tag-good" x="258" y="66" text-anchor="middle" font-size="11">SN2 only</text><line class="fg-bond" x1="90" y1="46" x2="124" y2="46"></line><circle class="fg-atom-hi" cx="72" cy="46" r="18"></circle><text class="fg-lbl" x="72" y="50.81" text-anchor="middle" font-size="13">CH₃</text><circle class="fg-atom" cx="140" cy="46" r="16"></circle><text class="fg-lbl" x="140" y="50.81" text-anchor="middle" font-size="13">Br</text><circle class="fg-lp" cx="144.5" cy="25" r="2.3"></circle><circle class="fg-lp" cx="135.5" cy="25" r="2.3"></circle><circle class="fg-lp" cx="135.5" cy="67" r="2.3"></circle><circle class="fg-lp" cx="144.5" cy="67" r="2.3"></circle><circle class="fg-lp" cx="161" cy="50.5" r="2.3"></circle><circle class="fg-lp" cx="161" cy="41.5" r="2.3"></circle><rect class="fg-panel" x="4" y="92" width="332" height="76" rx="10"></rect><text class="fg-tag" x="258" y="114" text-anchor="middle" font-size="11">PRIMARY (1°)</text><text class="fg-tag-mut" x="258" y="132" text-anchor="middle" font-size="11">1 C attached</text><text class="fg-tag-good" x="258" y="150" text-anchor="middle" font-size="11">SN2 (E2: bulky base)</text><line class="fg-bond" x1="58" y1="130" x2="82" y2="130"></line><line class="fg-bond" x1="118" y1="130" x2="144" y2="130"></line><circle class="fg-atom" cx="40" cy="130" r="18"></circle><text class="fg-lbl" x="40" y="134.81" text-anchor="middle" font-size="13">CH₃</text><circle class="fg-atom-hi" cx="100" cy="130" r="18"></circle><text class="fg-lbl" x="100" y="134.81" text-anchor="middle" font-size="13">CH₂</text><circle class="fg-atom" cx="160" cy="130" r="16"></circle><text class="fg-lbl" x="160" y="134.81" text-anchor="middle" font-size="13">Br</text><circle class="fg-lp" cx="164.5" cy="109" r="2.3"></circle><circle class="fg-lp" cx="155.5" cy="109" r="2.3"></circle><circle class="fg-lp" cx="155.5" cy="151" r="2.3"></circle><circle class="fg-lp" cx="164.5" cy="151" r="2.3"></circle><circle class="fg-lp" cx="181" cy="134.5" r="2.3"></circle><circle class="fg-lp" cx="181" cy="125.5" r="2.3"></circle><rect class="fg-panel" x="4" y="176" width="332" height="96" rx="10"></rect><text class="fg-tag" x="258" y="208" text-anchor="middle" font-size="11">SECONDARY (2°)</text><text class="fg-tag-mut" x="258" y="226" text-anchor="middle" font-size="11">2 C attached</text><text class="fg-tag-good" x="258" y="244" text-anchor="middle" font-size="11">all four compete</text><line class="fg-bond" x1="96.14" y1="216" x2="77.09" y2="205"></line><circle class="fg-atom" cx="61.5" cy="196" r="18"></circle><text class="fg-lbl" x="61.5" y="200.81" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="96.14" y1="232" x2="77.09" y2="243"></line><circle class="fg-atom" cx="61.5" cy="252" r="18"></circle><text class="fg-lbl" x="61.5" y="256.81" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="126" y1="224" x2="156" y2="224"></line><circle class="fg-atom-hi" cx="110" cy="224" r="16"></circle><text class="fg-lbl" x="110" y="228.81" text-anchor="middle" font-size="13">CH</text><circle class="fg-atom" cx="172" cy="224" r="16"></circle><text class="fg-lbl" x="172" y="228.81" text-anchor="middle" font-size="13">Br</text><circle class="fg-lp" cx="176.5" cy="203" r="2.3"></circle><circle class="fg-lp" cx="167.5" cy="203" r="2.3"></circle><circle class="fg-lp" cx="167.5" cy="245" r="2.3"></circle><circle class="fg-lp" cx="176.5" cy="245" r="2.3"></circle><circle class="fg-lp" cx="193" cy="228.5" r="2.3"></circle><circle class="fg-lp" cx="193" cy="219.5" r="2.3"></circle><rect class="fg-panel" x="4" y="280" width="332" height="136" rx="10"></rect><text class="fg-tag" x="258" y="332" text-anchor="middle" font-size="11">TERTIARY (3°)</text><text class="fg-tag-mut" x="258" y="350" text-anchor="middle" font-size="11">3 C attached</text><text class="fg-tag-warn" x="258" y="368" text-anchor="middle" font-size="11">no SN2: back blocked</text><line class="fg-bond" x1="110" y1="334" x2="110" y2="320"></line><circle class="fg-atom" cx="110" cy="302" r="18"></circle><text class="fg-lbl" x="110" y="306.81" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="96" y1="348" x2="70" y2="348"></line><circle class="fg-atom" cx="52" cy="348" r="18"></circle><text class="fg-lbl" x="52" y="352.81" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="110" y1="362" x2="110" y2="376"></line><circle class="fg-atom" cx="110" cy="394" r="18"></circle><text class="fg-lbl" x="110" y="398.81" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="124" y1="348" x2="156" y2="348"></line><circle class="fg-atom-hi" cx="110" cy="348" r="14"></circle><text class="fg-lbl" x="110" y="352.81" text-anchor="middle" font-size="13">C</text><circle class="fg-atom" cx="172" cy="348" r="16"></circle><text class="fg-lbl" x="172" y="352.81" text-anchor="middle" font-size="13">Br</text><circle class="fg-lp" cx="176.5" cy="327" r="2.3"></circle><circle class="fg-lp" cx="167.5" cy="327" r="2.3"></circle><circle class="fg-lp" cx="167.5" cy="369" r="2.3"></circle><circle class="fg-lp" cx="176.5" cy="369" r="2.3"></circle><circle class="fg-lp" cx="193" cy="352.5" r="2.3"></circle><circle class="fg-lp" cx="193" cy="343.5" r="2.3"></circle></svg><figcaption>The highlighted atom is the carbon that carries the bromine. Its class is the number of carbons bonded to it.</figcaption></figure><!-- fig:se-classes:end -->'
      },
      {
        render: function(api){
          var subs = [
            { key: 'methyl', label: 'CH₃Br' },
            { key: 'tert', label: '(CH₃)₃CBr' },
            { key: 'sec', label: 'CH₃CH₂CHBrCH₃' }
          ];
          var WRONG = {
            methyl: 'Not CH₃Br (bromomethane). It is the other end of the scale: nothing crowds that carbon, so its back is wide open and SN2 runs faster there than anywhere else.',
            sec: 'Not CH₃CH₂CHBrCH₃ (2-bromobutane). Its two carbon groups crowd the back of the carbon and slow SN2 down, but they do not close it. A secondary substrate is the ambiguous case, not the impossible one.'
          };
          var order = (window.OchemShuffle && window.OchemShuffle.apply)
            ? (function(){ var sh = window.OchemShuffle.apply(subs.map(function(x){ return x.key; }), 'substrate-effects:step3');
                           return sh.options.map(function(k){ return subs.filter(function(x){ return x.key === k; })[0]; }); })()
            : subs;
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the substrate on which SN2 cannot happen at all.</h2>' +
            '<p class="step-body">Think about how much room there is at the back of the carbon that carries the bromine.</p>' +
            '<div class="choice-row">' + order.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'tert';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, isCorrect
                ? 'Right. (CH₃)₃CBr is 2-bromo-2-methylpropane. Its tertiary carbon carries three methyl groups, and they block the path to its back completely, so SN2 is out. What is left is SN1 and E1 with a weak reagent, or E2 with a strong base.'
                : (WRONG[btn.getAttribute('data-v')] || 'Not that one. Look for the carbon whose back is completely enclosed.'));
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A strong reagent forces a one-step pathway; a weak one waits for the substrate to ionize.',
        bodyHtml: '<p class="step-body">A <b>strong</b> nucleophile or base forces a bimolecular pathway, SN2 or E2, whenever the substrate allows one. Strong reagents usually carry a negative charge: hydroxide, alkoxides, cyanide, azide, thiolates.</p><p class="step-body">A <b>weak</b> nucleophile or base is usually neutral: water, alcohols, carboxylic acids. It cannot force a bimolecular step at a useful rate, so the reaction waits for the substrate to ionize. A weak reagent and a substrate that can ionize give SN1 and E1 together.</p><p class="step-body">Once the pathway is bimolecular, ask whether the reagent is better as a nucleophile or as a base:</p><ul class="step-body" style="margin-bottom:0;"><li><b>Strong nucleophile, weak base</b> (I⁻, RS⁻, N₃⁻, ⁻CN): SN2.</li><li><b>Strong nucleophile and strong base</b> (HO⁻, CH₃O⁻, EtO⁻): SN2 on primary, E2 on secondary and tertiary.</li><li><b>Weak nucleophile and weak base</b> (H₂O, ROH): SN1 and E1.</li></ul>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The solvent tips a close call: aprotic helps SN2 and E2, protic helps SN1 and E1.',
        bodyHtml: '<p class="step-body">A <b>protic</b> solvent has an O–H or N–H bond, so it can donate hydrogen bonds. An <b>aprotic</b> solvent has neither. All the solvents in this step are <b>polar</b>: each has a strong dipole and dissolves ionic reagents.</p><p class="step-body"><b>Polar aprotic</b> solvents include DMSO, DMF, acetone and acetonitrile. They cannot hydrogen-bond to an anion, so a strong nucleophile stays bare and reactive. That favors SN2 and E2.</p><p class="step-body" style="margin-bottom:0;"><b>Polar protic</b> solvents include water, alcohols and acetic acid. They hydrogen-bond to anions and cluster around cations, so they stabilize both pieces an ionization makes: the carbocation and the departing anion. That favors SN1 and E1. The same hydrogen bonds wrap around a strong nucleophile and slow it down.</p>',
        diagramHtml: '<!-- fig:se-solvent:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 528" role="img" aria-label="Two stacked panels. Top, in acetone: a bare azide ion, drawn as N=N=N with a minus charge on each end nitrogen and a plus on the middle one, attacks (R)-2-bromobutane from the side opposite the bromine; curved arrows run from an end-nitrogen lone pair to the carbon and from the C–Br bond onto bromine. The product, (S)-2-azidobutane, has its other three groups flipped to the other side: inversion. Bottom, in water: the same azide ion with water molecules hydrogen-bonded to both end nitrogens by dashed lines, so it attacks more slowly. The products listed are inverted 2-azidobutane from SN2, racemic 2-azidobutane and butan-2-ol from SN1, and a little but-2-ene from E1."><rect class="fg-panel-good" x="4" y="8" width="332" height="290" rx="10"></rect><text class="fg-tag" x="170" y="30" text-anchor="middle" font-size="11">IN ACETONE: AZIDE IS BARE</text><line class="fg-bond" x1="31" y1="93" x2="43" y2="93"></line><line class="fg-bond" x1="31" y1="99" x2="43" y2="99"></line><line class="fg-bond" x1="61" y1="93" x2="73" y2="93"></line><line class="fg-bond" x1="61" y1="99" x2="73" y2="99"></line><circle class="fg-atom" cx="22" cy="96" r="9"></circle><text class="fg-lbl" x="22" y="100.81" text-anchor="middle" font-size="13">N</text><circle class="fg-atom" cx="52" cy="96" r="9"></circle><text class="fg-lbl" x="52" y="100.81" text-anchor="middle" font-size="13">N</text><circle class="fg-atom-hi" cx="82" cy="96" r="9"></circle><text class="fg-lbl" x="82" y="100.81" text-anchor="middle" font-size="13">N</text><circle class="fg-lp" cx="15.28" cy="82.92" r="2.3"></circle><circle class="fg-lp" cx="8.92" cy="89.28" r="2.3"></circle><circle class="fg-lp" cx="8.92" cy="102.72" r="2.3"></circle><circle class="fg-lp" cx="15.28" cy="109.08" r="2.3"></circle><circle class="fg-lp" cx="95.08" cy="89.28" r="2.3"></circle><circle         title: 'A secondary alkyl bromide reacts with sodium ethoxide, a strong nucleophile and strong base, in DMSO. Which pathways are favored?',

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Bulky bases and heat both push toward elimination.',
        bodyHtml: '<p class="step-body">Potassium <i>tert</i>-butoxide is a strong base, but its three methyl groups keep its oxygen away from a crowded carbon, so SN2 fails. A β hydrogen sits on the outside of the molecule, so the oxygen can still reach it, and E2 goes ahead. With 2-bromopropane, <i>tert</i>-butoxide gives propene and almost no ether. A bulky base also favors the less substituted alkene, the Hofmann product.</p><p class="step-body"><b>Heat</b> favors elimination too: E2 over SN2, and E1 over SN1. Ethoxide and 2-bromopropane are two particles. SN2 turns them into two (the ether and Br⁻), but E2 turns them into three (propene, ethanol and Br⁻). Elimination makes one more particle than the matching substitution.</p><p class="step-body" style="margin-bottom:0;"><a class="chapter-ref" href="/ochem/notes/e2.html">E2</a> explained that more free particles means more entropy, and <a class="chapter-ref" href="/ochem/notes/e1.html">E1</a> showed that entropy enters the free energy through ΔG = ΔH − TΔS. So the extra particle counts for more as the flask gets hotter. That is why &ldquo;heat&rdquo; on a reaction arrow usually signals elimination.</p>',
