<script>
// Runs after the deferred scripts above it: every external script on this

document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'bond-polarity',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Bond dipoles can cancel.',
        bodyHtml: '<p class="step-body">A bond is polar when its two atoms have different electronegativities — the shared electrons sit closer to one side, creating a small <b>dipole</b> pointing toward the more electronegative atom.</p><p class="step-body" style="margin-bottom:0;">But a whole <b>molecule’s</b> polarity depends on both bond polarity <b>and</b> geometry: if the bond dipoles point in ways that cancel out by symmetry, the molecule can be nonpolar even with polar bonds.</p>'
      },
      {
        render: function(api){
          var answered = false;
          function scene(){
            return '<div class="scene"><svg viewBox="0 0 220 100">' +
              '<line x1="90" y1="50" x2="130" y2="50" stroke="var(--line)" stroke-width="2.5"/>' +
              '<circle cx="70" cy="50" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="70" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">C</text>' +
              '<circle cx="150" cy="50" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="150" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" pointer-events="none">O</text>' +
              '<g class="atom" data-key="toC"><path d="M 105 30 L 90 30" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah3)"/><rect x="78" y="18" width="25" height="16" fill="transparent"/></g>' +
              '<g class="atom" data-key="toO"><path d="M 105 30 L 120 30" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah4)"/><rect x="107" y="18" width="25" height="16" fill="transparent"/></g>' +
              '<defs><marker id="ah3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker>' +
              '<marker id="ah4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--muted)"/></marker></defs>' +
            '</svg></div>';
          }
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Interact</div>' +
              '<h2 class="step-title">Click the arrow that correctly points the C–O dipole.</h2>' +
              '<p class="step-body">A dipole arrow points toward the more electronegative atom.</p>' +
              scene() +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', false);
            var fb = api.card.querySelector('#fb');
            var next = api.card.querySelector('#nextBtn');
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(answered) return;
                var isCorrect = g.getAttribute('data-key') === 'toO';
                answered = true;
                api.record(isCorrect);
                if(isCorrect){
                  g.querySelector('path').setAttribute('stroke', 'var(--accent)');
                  api.showFeedback(fb, true, 'Correct — oxygen is more electronegative than carbon, so the dipole points toward it.');
                } else {
                  api.showFeedback(fb, false, 'Oxygen is more electronegative than carbon — the dipole should point the other way.');
                }
                next.disabled = false;
              });
            });
            next.addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'CO₂ is linear with two polar C=O bonds pointing in opposite directions. Is the molecule polar overall?',
        options: ['No — the two bond dipoles cancel by symmetry', 'Yes — any polar bond makes the molecule polar'],
        correctIndex: 0,
        correctFeedback: 'Correct — pointing in exactly opposite directions, the two dipoles cancel to zero net dipole. CO₂ is nonpolar.',
        wrongFeedback: 'Think about the two dipole arrows pointing in opposite directions along a straight line.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Water is bent, with two polar O–H bonds. Do their dipoles cancel?',
        options: ['Yes — same as CO₂', 'No — the bent shape means they don’t cancel, so water is polar'],
        correctIndex: 1,
        correctFeedback: 'Correct — unlike CO₂’s straight line, water’s bent shape means the two dipoles add up instead of canceling, giving water a real net dipole.',
        wrongFeedback: 'Water isn’t linear like CO₂ — does that change whether the dipoles cancel?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Polarity is actually measurable: the dipole moment.',
        bodyHtml: '<p class="step-body">A bond or molecule\'s dipole isn\'t just a qualitative arrow — it\'s a real, measurable vector quantity called the <b>dipole moment</b> (symbol μ), measured in <b>debyes (D)</b>. Bigger electronegativity difference and longer bond distance both increase it. Water, with its bent shape and two O–H dipoles adding together, has μ ≈ 1.85 D. CO₂, despite having two individually polar C=O bonds, measures μ = 0 D exactly, because the two bond dipoles are equal-magnitude vectors pointing in exactly opposite directions and cancel completely.</p><p class="step-body" style="margin-bottom:0;">Recall from Electronegativity: a bond\'s polarity as a rule of thumb follows its ΔEN — under 0.5 is essentially nonpolar, 0.5–1.7 is polar covalent. A molecule\'s overall dipole moment is what you get after adding up every individual bond dipole as a vector, accounting for the geometry from Molecular Geometry.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'What polarity is for: it decides how molecules stick to each other.',
        bodyHtml: '<p class="step-body">A dipole is not only a label on a drawing. It is an attraction between one molecule and the next, and that attraction is what you have to overcome to boil a liquid. Three tiers, weakest first.</p><p class="step-body"><b>Dispersion forces</b> act between every pair of molecules, polar or not: electrons slosh about, a momentary uneven patch on one molecule induces the opposite patch on its neighbor, and they attract. Weak per contact, but they scale with surface area, which is why boiling point climbs steadily along a series of alkanes.</p><p class="step-body"><b>Dipole\u2013dipole forces</b> act between molecules that have a permanent net dipole \u2014 the \u03b4+ end of one lines up with the \u03b4\u2212 end of the next. Stronger than dispersion at the same size.</p><p class="step-body" style="margin-bottom:0;"><b>Hydrogen bonding</b> is the strong special case, and it needs <i>both</i> halves: a hydrogen sitting directly on N, O or F (so it is stripped of density and nearly a bare proton), and a lone pair on an N, O or F to receive it. An O\u2013H or N\u2013H donates; an oxygen or nitrogen anywhere in the molecule accepts. Ethanol has both and boils at 78\u00b0C; dimethyl ether has the same formula, can only accept, and boils at \u221224\u00b0C.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Independent Practice',
        title: 'Butane, acetone and propan-1-ol all weigh about the same. Which boils highest, and why?',
        options: ['Butane \u2014 it has the most carbons', 'Acetone \u2014 its C=O is the most polar bond of the three', 'Propan-1-ol \u2014 its O\u2013H lets it hydrogen bond', 'All three boil within a few degrees, since their weights match'],
        correctIndex: 2,
        correctFeedback: 'Correct \u2014 propan-1-ol (97\u00b0C) beats acetone (56\u00b0C) beats butane (\u22121\u00b0C). Weight is matched on purpose, so the only thing left is the tier of force: hydrogen bonding, then dipole\u2013dipole, then dispersion alone. Weight only breaks ties <i>within</i> a tier.',
        wrongFeedback: 'Rank by the strongest attraction each one can make, not by weight. Which of the three has a hydrogen sitting directly on an oxygen?'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is why "like dissolves like."',
        bodyHtml: '<div class="explain-box">Polar water mixes with polar substances but not with nonpolar ones like CO₂ or oil — that’s the whole basis of solubility rules you’ll use constantly, especially once alcohols and ethers show up later in the course.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'CCl₄ is tetrahedral with four identical, symmetric C–Cl bonds, each one polar. Is the molecule polar overall?',
        options: ['Nonpolar — the four dipoles cancel by symmetry', 'Polar — chlorine is very electronegative'],
        correctIndex: 0,
        correctFeedback: 'Correct — even though every C–Cl bond is polar, the perfectly symmetric tetrahedral arrangement makes all four dipoles cancel out. Overall, CCl₄ is nonpolar.'
      }
    ]
  });
})();
});
</script>
