(function(){

    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A polar bond has a direction.',
        bodyHtml: '<p class="step-body">Take a C–O bond. Oxygen (3.44) pulls harder than carbon (2.55), so the shared electrons sit nearer the oxygen. The oxygen is δ− and the carbon δ+.</p><p class="step-body">Two opposite charges a distance apart make a <b>dipole</b>. The dipole of one bond is its <b>bond dipole</b>. It has a size and a direction, so it is a <b>vector</b>: a quantity drawn as an arrow, whose length is its size.</p><p class="step-body">The arrow points at the δ− atom. A short cross bar marks the tail, at the δ+ atom. In C–Li the arrow reverses, because lithium (0.98) pulls far less than carbon: carbon is the δ− end.</p><p class="step-body" style="margin-bottom:0;">C–C and C–H bonds get no arrow. The course treats both as nonpolar.</p>',
        diagramHtml: '<!-- fig:l-bond-dipoles:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 316" role="img" aria-label="Two bonds. C–O: carbon delta plus, oxygen delta minus, the arrow points at oxygen with its cross bar at carbon. C–Li: the arrow is reversed and points at carbon, which is delta minus, with lithium delta plus."><rect class="fg-panel" x="4" y="4" width="332" height="150" rx="10"></rect><rect class="fg-panel" x="4" y="162" width="332" height="150" rx="10"></rect><text class="fg-lbl" x="170" y="28" text-anchor="middle" font-size="13">C–O: EN 2.55 vs 3.44</text><line class="fg-bond" x1="134" y1="94" x2="206" y2="94"></line><line class="fg-arrow" x1="124" y1="64" x2="208" y2="64"></line><path class="fg-head" d="M216 64 L208 68.16 L208 59.84 Z"></path><line class="fg-arrow" x1="129" y1="69" x2="129" y2="59"></line><text class="fg-tag-warn" x="120" y="130" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="220" y="130" text-anchor="middle" font-size="11">δ−</text><circle class="fg-atom" cx="120" cy="94" r="14"></circle><text class="fg-lbl" x="120" y="98.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom-hi" cx="220" cy="94" r="14"></circle><text class="fg-lbl" x="220" y="98.44" text-anchor="middle" font-size="12">O</text><text class="fg-tag" x="170" y="146" text-anchor="middle" font-size="11">arrow points at O, the δ− end</text><text class="fg-lbl" x="170" y="186" text-anchor="middle" font-size="13">C–Li: EN 2.55 vs 0.98</text><line class="fg-bond" x1="134" y1="252" x2="205" y2="252"></line><line class="fg-arrow" x1="216" y1="222" x2="132" y2="222"></line><path class="fg-head" d="M124 222 L132 217.84 L132 226.16 Z"></path><line class="fg-arrow" x1="211" y1="217" x2="211" y2="227"></line><text class="fg-tag-warn" x="220" y="288" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="120" y="288" text-anchor="middle" font-size="11">δ−</text><circle class="fg-atom" cx="120" cy="252" r="14"></circle><text class="fg-lbl" x="120" y="256.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="220" cy="252" r="15"></circle><text class="fg-lbl" x="220" y="255.89" text-anchor="middle" font-size="10.5">Li</text><text class="fg-tag" x="170" y="304" text-anchor="middle" font-size="11">reversed: carbon is the δ− end</text></svg><figcaption>Cross bar at the δ+ end, arrowhead at the δ− end.</figcaption></figure><!-- fig:l-bond-dipoles:end -->'
      },
      {
        render: function(api){
          var answered = false;
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Interact</div>' +
              '<h2 class="step-title">Tap the arrow that shows the O–H bond dipole.</h2>' +
              '<p class="step-body">Compare the two electronegativity values first.</p>' +
              '<!-- fig:l-click-dipole:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 196" role="img" aria-label="An O–H bond drawn horizontally, hydrogen on the left with electronegativity 2.20 and oxygen on the right with 3.44. Above the bond, arrow A points right at the oxygen with a cross bar at the hydrogen end. Below the bond, arrow B points left at the hydrogen with a cross bar at the oxygen end."><rect class="fg-panel" x="4" y="4" width="332" height="188" rx="10"></rect><line class="fg-bond" x1="132" y1="98" x2="206" y2="98"></line><circle class="fg-atom" cx="120" cy="98" r="12"></circle><text class="fg-lbl" x="120" y="102.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="220" cy="98" r="14"></circle><text class="fg-lbl" x="220" y="102.44" text-anchor="middle" font-size="12">O</text><text class="fg-tag" x="120" y="136" text-anchor="middle" font-size="11">EN 2.20</text><text class="fg-tag" x="220" y="136" text-anchor="middle" font-size="11">EN 3.44</text><g class="hit" data-key="toO" style="cursor:pointer"><rect x="96" y="36" width="148" height="34" style="fill:transparent"></rect><line class="fg-arrow" x1="116" y1="54" x2="216" y2="54"></line><path class="fg-head" d="M224 54 L216 58.16 L216 49.84 Z"></path><line class="fg-arrow" x1="121" y1="59" x2="121" y2="49"></line><text class="fg-lbl" x="80" y="58" text-anchor="middle" font-size="13">A</text></g><g class="hit" data-key="toH" style="cursor:pointer"><rect x="96" y="150" width="148" height="34" style="fill:transparent"></rect><line class="fg-arrow" x1="224" y1="166" x2="124" y2="166"></line><path class="fg-head" d="M116 166 L124 161.84 L124 170.16 Z"></path><line class="fg-arrow" x1="219" y1="161" x2="219" y2="171"></line><text class="fg-lbl" x="80" y="171" text-anchor="middle" font-size="13">B</text></g></svg><figcaption>Tap A or B.</figcaption></figure><!-- fig:l-click-dipole:end -->' +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', false);
            var fb = api.card.querySelector('#fb');

            var parts = api.card.querySelectorAll('.hit');
            parts.forEach(function(g){
              g.addEventListener('click', function(){

                api.record(isCorrect);

                  g.querySelectorAll('line').forEach(function(l){ l.style.strokeWidth = '3.4'; });
                  api.showFeedback(fb, true, 'Right. Oxygen (3.44) pulls harder than hydrogen (2.20), so oxygen is δ− and the arrow points at it, with the cross bar at the δ+ hydrogen.');
                  next.disabled = false;
                } else {
                  api.showFeedback(fb, false, 'B points at hydrogen, the atom that pulls less. The arrowhead goes on the δ− end. Which atom is that?');
                }
              });
            });
            next.addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A molecule’s dipole is its bond arrows added up.',
        bodyHtml: '<p class="step-body">Carbon dioxide, O=C=O, has two polar C=O bonds, each with an arrow pointing out to an oxygen. The molecule is linear, so the two arrows point exactly opposite ways. They are the same size, so they cancel. The molecule as a whole has no dipole.</p><p class="step-body" style="margin-bottom:0;">In general, a molecule’s overall dipole is the <b>vector sum</b> of its bond dipoles. To add arrows, slide them without turning them so each starts where the one before it ended: tip to tail. The arrow from the first tail to the last tip is the sum. For CO₂, the second arrow ends back at the start, so the sum is zero.</p>',
        diagramHtml: '<!-- fig:l-co2-sum:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 318" role="img" aria-label="Carbon dioxide, O=C=O in a straight line, carbon delta plus and both oxygens delta minus, with a dipole arrow pointing outward to each oxygen. Below, the two arrows placed tip to tail: the second ends where the first began, so the sum is zero."><rect class="fg-panel" x="4" y="4" width="332" height="160" rx="10"></rect><rect class="fg-panel" x="4" y="172" width="332" height="142" rx="10"></rect><text class="fg-lbl" x="170" y="28" text-anchor="middle" font-size="13">CO₂: linear</text><line class="fg-bond" x1="156" y1="108" x2="122" y2="108"></line><line class="fg-bond" x1="156" y1="100" x2="122" y2="100"></line><line class="fg-bond" x1="184" y1="100" x2="218" y2="100"></line><line class="fg-bond" x1="184" y1="108" x2="218" y2="108"></line><line class="fg-arrow" x1="164" y1="78" x2="120" y2="78"></line><path class="fg-head" d="M112 78 L120 73.84 L120 82.16 Z"></path><line class="fg-arrow" x1="159" y1="73" x2="159" y2="83"></line><line class="fg-arrow" x1="176" y1="78" x2="220" y2="78"></line><path class="fg-head" d="M228 78 L220 82.16 L220 73.84 Z"></path><line class="fg-arrow" x1="181" y1="83" x2="181" y2="73"></line><circle class="fg-atom" cx="170" cy="104" r="14"></circle><text class="fg-lbl" x="170" y="108.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="108" cy="104" r="14"></circle><text class="fg-lbl" x="108" y="108.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="232" cy="104" r="14"></circle><text class="fg-lbl" x="232" y="108.44" text-anchor="middle" font-size="12">O</text><text class="fg-tag-warn" x="170" y="140" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="108" y="140" text-anchor="middle" font-size="11">δ−</text><text class="fg-tag" x="232" y="140" text-anchor="middle" font-size="11">δ−</text><text class="fg-lbl" x="170" y="196" text-anchor="middle" font-size="13">the same two arrows, tip to tail</text><line class="fg-arrow" x1="135" y1="236" x2="207" y2="236"></line><path class="fg-head" d="M215 236 L207 240.2 L207 231.8 Z"></path><line class="fg-dash" x1="215" y1="236" x2="215" y2="252"></line><line class="fg-arrow" x1="215" y1="252" x2="143" y2="252"></line><path class="fg-head" d="M135 252 L143 247.8 L143 256.2 Z"></path><circle class="fg-lp" cx="127" cy="252" r="3"></circle><text class="fg-tag" x="170" y="294" text-anchor="middle" font-size="11">back to the start: sum = 0</text></svg><figcaption>Follow the second arrow: where does it end?</figcaption></figure><!-- fig:l-co2-sum:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided practice',
        title: 'Water is bent, and both O–H arrows point toward the oxygen. Do the two arrows cancel, and why?',
        diagramHtml: '<!-- fig:l-water-arrows:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 186" role="img" aria-label="Water: a bent oxygen with two hydrogens below it and two lone pairs above it. Oxygen is delta minus, each hydrogen delta plus, and an arrow along each O–H bond points at the oxygen."><rect class="fg-panel" x="4" y="4" width="332" height="178" rx="10"></rect><text class="fg-lbl" x="170" y="28" text-anchor="middle" font-size="13">H₂O: bent, 104.5°</text><line class="fg-bond" x1="158.93" y1="100.57" x2="133.63" y2="120.16"></line><line class="fg-bond" x1="181.07" y1="100.57" x2="206.37" y2="120.16"></line><circle class="fg-lp" cx="158.77" cy="70.32" r="2.3"></circle><circle class="fg-lp" cx="151.68" cy="75.86" r="2.3"></circle><circle class="fg-lp" cx="188.32" cy="75.86" r="2.3"></circle><circle class="fg-lp" cx="181.23" cy="70.32" r="2.3"></circle><line class="fg-arrow" x1="120.31" y1="112.77" x2="147.2" y2="91.95"></line><path class="fg-head" d="M153.52 87.05 L149.74 95.24 L144.65 88.66 Z"></path><line class="fg-arrow" x1="127.3" y1="113.7" x2="121.2" y2="105.8"></line><line class="fg-arrow" x1="219.69" y1="112.77" x2="192.8" y2="91.95"></line><path class="fg-head" d="M186.48 87.05 L195.35 88.66 L190.26 95.24 Z"></path><line class="fg-arrow" x1="218.8" y1="105.8" x2="212.7" y2="113.7"></line><circle class="fg-atom-hi" cx="170" cy="92" r="14"></circle><text class="fg-lbl" x="170" y="96.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="124.14" cy="127.51" r="12"></circle><text class="fg-lbl" x="124.14" y="131.95" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="215.86" cy="127.51" r="12"></circle><text class="fg-lbl" x="215.86" y="131.95" text-anchor="middle" font-size="12">H</text><text class="fg-tag" x="170" y="52" text-anchor="middle" font-size="11">δ−</text><text class="fg-tag-warn" x="124.14" y="159.51" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag-warn" x="215.86" y="159.51" text-anchor="middle" font-size="11">δ+</text></svg><figcaption>Both arrows point up toward the oxygen, from two different sides.</figcaption></figure><!-- fig:l-water-arrows:end -->',
        options: ['No — the bent shape leaves a pull toward O', 'Yes — equal arrows on one atom cancel out', 'Yes — the lone pairs cancel both O–H arrows', 'No — O–H bonds are too polar to cancel'],
        correctIndex: 0,
        correctFeedback: 'Correct — the arrows are not opposite, as CO₂’s are. Their sideways parts cancel, but both point partly upward, toward the oxygen, and those parts add. Water is polar.',
        wrongFeedback: 'Canceling needs two equal arrows pointing exactly opposite ways, as in straight CO₂. Do water’s two arrows point opposite ways, or partly the same way?'
      },
      {
        type: 'explain',
        eyebrow: 'Visualize',
        title: 'Water’s arrows add toward the oxygen.',
        bodyHtml: '<p class="step-body">Put water’s two O–H arrows tip to tail. Their sideways parts point opposite ways and cancel. Their upward parts add. The sum points from between the hydrogens toward the oxygen, so water is polar.</p><p class="step-body" style="margin-bottom:0;">Water’s two lone pairs push the same way. They sit on the far side of the oxygen from the hydrogens, and add electron density on that side.</p>',
        diagramHtml: '<!-- fig:l-water-sum:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 176" role="img" aria-label="The two O–H dipole arrows of water placed tip to tail. Their sum is a thick arrow pointing straight up, toward the oxygen side of the molecule."><rect class="fg-panel" x="4" y="4" width="332" height="168" rx="10"></rect><text class="fg-lbl" x="170" y="28" text-anchor="middle" font-size="13">water’s two arrows, tip to tail</text><line class="fg-arrow" x1="170" y1="148" x2="211.1" y2="116.2"></line><path class="fg-head" d="M217.4 111.3 L213.7 119.5 L208.6 112.9 Z"></path><line class="fg-arrow" x1="217.4" y1="111.3" x2="176.3" y2="79.4"></line><path class="fg-head" d="M170 74.5 L178.9 76.1 L173.8 82.7 Z"></path><line class="fg-bond-hi" x1="170" y1="148" x2="170" y2="85.5"></line><path class="fg-head" d="M170 74.5 L175.7 85.5 L164.3 85.5 Z"></path><text class="fg-tag" x="214" y="96" text-anchor="start" font-size="11">sum</text></svg><figcaption>The sideways parts cancel; the upward parts add.</figcaption></figure><!-- fig:l-water-sum:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'In three dimensions: CCl₄.',
        bodyHtml: '<p class="step-body">Carbon tetrachloride, CCl₄, has four polar C–Cl bonds pointing to the corners of a tetrahedron. Draw it with one chlorine straight up. The other three point down and outward, evenly spaced.</p><p class="step-body">The three lower arrows add to one arrow pointing straight down, exactly as long as one C–Cl arrow. The top arrow points straight up with the same length. They cancel, and CCl₄ is nonpolar.</p><p class="step-body" style="margin-bottom:0;">The cancellation needs every corner to be the same. Polar bonds cancel only when the central atom has no lone pairs and every atom around it is identical.</p>',
        diagramHtml: '<!-- fig:l-ccl4-sum:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 356" role="img" aria-label="Carbon tetrachloride: carbon with one chlorine straight up, one down-left in the plane, one down-right on a solid wedge and one to the right on a dashed wedge; carbon delta plus, every chlorine delta minus, an arrow along each C–Cl bond toward chlorine. Below: the three lower arrows add to one arrow straight down, the same length as the top arrow pointing up, so the sum is zero."><rect class="fg-panel" x="4" y="4" width="332" height="222" rx="10"></rect><rect class="fg-panel" x="4" y="234" width="332" height="118" rx="10"></rect><text class="fg-lbl" x="170" y="28" text-anchor="middle" font-size="13">CCl₄: tetrahedral</text><line class="fg-bond" x1="160" y1="110" x2="160" y2="73"></line><line class="fg-bond" x1="146.84" y1="128.79" x2="112.08" y2="141.44"></line><path class="fg-wedge" d="M167.42 135.87 L182.79 169.9 L191.27 164.6 Z"></path><line class="fg-hash" x1="178.9" y1="131.1" x2="179.46" y2="129.36"></line><line class="fg-hash" x1="184.48" y1="133.88" x2="185.61" y2="130.39"></line><line class="fg-hash" x1="190.06" y1="136.66" x2="191.76" y2="131.43"></line><line class="fg-hash" x1="195.64" y1="139.44" x2="197.91" y2="132.46"></line><line class="fg-hash" x1="201.22" y1="142.21" x2="204.06" y2="133.5"></line><line class="fg-arrow" x1="175" y1="100" x2="175" y2="76"></line><path class="fg-head" d="M175 68 L179.16 76 L170.84 76 Z"></path><line class="fg-arrow" x1="180" y1="95" x2="170" y2="95"></line><line class="fg-arrow" x1="142.58" y1="146.3" x2="120.03" y2="154.51"></line><path class="fg-head" d="M112.51 157.25 L118.6 150.6 L121.45 158.42 Z"></path><line class="fg-arrow" x1="136.2" y1="143.3" x2="139.6" y2="152.7"></line><line class="fg-arrow" x1="160" y1="152.3" x2="172.72" y2="172.66"></line><path class="fg-head" d="M176.95 179.44 L169.19 174.86 L176.24 170.45 Z"></path><line class="fg-arrow" x         eyebrow: 'Explain',
        title: 'The size of the net arrow is measured.',
        bodyHtml: '<p class="step-body">The size of a dipole is its <b>dipole moment</b>, μ, measured in <b>debyes</b> (D). It is charge times distance: how big the partial charges are, multiplied by how far apart they sit.</p><p class="step-body">Some values: CO₂ 0 D and CCl₄ 0 D, since their arrows cancel. Chloroform 1.04 D, water 1.85 D, acetone 2.88 D. Acetone ranks high because of its strongly polar C=O bond, which nothing in the molecule cancels.</p><p class="step-body" style="margin-bottom:0;">Distance matters as well as the electronegativity difference. C–F has the bigger difference, but it is much shorter than C–Cl, and CH₃F (1.85 D) and CH₃Cl (1.87 D) end up nearly equal.</p>'
      },

        title: 'Polarity decides how molecules hold on to each other.',
        bodyHtml: '<p class="step-body">Boiling a liquid breaks no covalent bonds. It pulls whole molecules apart from their neighbors. The attractions between molecules are <b>intermolecular forces</b>, and stronger ones mean a higher boiling point.</p><p class="step-body"><b>Dispersion forces</b> act between all molecules. Electrons move, so one side of a molecule can briefly carry more electron density, and that induces the opposite in a neighbor. Each contact is weak, but the total grows with surface area.</p><p class="step-body" style="margin-bottom:0;"><b>Dipole–dipole forces</b> act between molecules with a permanent dipole. The δ− end of one lines up with the δ+ end of the next. Acetone and butane both weigh 58, but acetone boils at 56 °C and butane, with no dipole, at −1 °C.</p>',

iddle" font-size="9.5">CH₃</text><text class="fg-tag-warn" x="98" y="118" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="184" y="88" text-anchor="middle" font-size="11">δ−</text><line class="fg-bond" x1="240" y1="134" x2="268" y2="134"></line><line class="fg-bond" x1="240" y1="142" x2="268" y2="142"></line><line class="fg-bond" x1="213.88" y1="131" x2="193.96" y2="119.5"></line><line class="fg-bond" x1="213.88" y1="145" x2="193.96" y2="156.5"></line><circle class="fg-atom" cx="226" cy="138" r="14"></circle><text class="fg-lbl" x="226" y="142.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom-hi" cx="282" cy="138" r="14"></circle><text class="fg-lbl" x="282" y="142.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="177.5" cy="110" r="19"></circle><text class="fg-lbl" x="177.5" y="113.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom" cx="177.5" cy="166" r="19"></circle><text class="fg-lbl" x="177.5" y="169.52" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-tag-warn" x="230" y="114" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="312" y="142" text-anchor="middle" font-size="11">δ−</text></svg><figcaption>The δ− oxygen of one molecule sits by the δ+ carbon of the next.</figcaption></figure><!-- fig:l-dipole-dipole:end -->'

        eyebrow: 'Explain',
        title: 'Hydrogen bonds: the strong special case.',
        bodyHtml: '<p class="step-body">A <b>hydrogen bond</b> is an unusually strong dipole–dipole attraction. It needs two partners. The <b>donor</b> is a hydrogen bonded to N, O or F, stripped of so much electron density that it is nearly a bare proton. The <b>acceptor</b> is a lone pair on an N, O or F of another molecule.</p><p class="step-body" style="margin-bottom:0;">Ethanol, CH₃CH₂OH, has both, and boils at 78 °C. Dimethyl ether, CH₃OCH₃, has the same formula and lone pairs to accept with, but every hydrogen sits on a carbon. It cannot donate, and boils at −24 °C.</p>',

"middle" font-size="12">O</text><circle class="fg-atom-hi" cx="170" cy="106.64" r="12"></circle><text class="fg-lbl" x="170" y="111.08" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="101.7" cy="171.54" r="19"></circle><text class="fg-lbl" x="101.7" y="175.06" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom" cx="151.7" cy="171.54" r="19"></circle><text class="fg-lbl" x="151.7" y="175.06" text-anchor="middle" font-size="9.5">CH₂</text><circle class="fg-atom-hi" cx="200" cy="158.6" r="14"></circle><text class="fg-lbl" x="200" y="163.04" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="210.35" cy="197.24" r="12"></circle><text class="fg-lbl" x="210.35" y="201.68" text-anchor="middle" font-size="12">H</text><text class="fg-tag-warn" x="144.39" y="115.16" text-anchor="middle" font-size="11">δ+</text><text class="fg-tag" x="210.6" y="133.47" text-anchor="middle" font-size="11">δ−</text><text class="fg-tag" x="192" y="110" text-anchor="start" font-size="11">donor: H on O</text><text class="fg-tag" x="164" y="146" text-anchor="end" font-size="11">H bond</text><text class="fg-tag" x="240" y="168" text-anchor="start" font-size="11">acceptor:</text><text class="fg-tag" x="240" y="183" text-anchor="start" font-size="11">lone pair</text></svg><figcaption>The dashed line runs from a hydrogen on oxygen to a lone pair on the next oxygen.</figcaption></figure><!-- fig:l-hbond:end -->'

        title: 'This is why "like dissolves like."',
        bodyHtml: '<p class="step-body">Water molecules hold each other by hydrogen bonds. To dissolve, a solute has to push in between them, which breaks some of those bonds. A solute dissolves only if it forms new attractions to water that repay the cost.</p><p class="step-body">Ethanol repays it: its O–H makes new hydrogen bonds with water, and the two mix in any proportion. Hexane, C₆H₁₄, has no polar bond and nothing to offer, so it separates into its own layer, as oil does.</p><div class="explain-box">Polar dissolves polar, and nonpolar dissolves nonpolar. A longer hydrocarbon part lowers water solubility: diethyl ether, CH₃CH₂OCH₂CH₃, can only accept a hydrogen bond and carries four carbons, so only about 6 g dissolves in 100 mL of water.</div>'
