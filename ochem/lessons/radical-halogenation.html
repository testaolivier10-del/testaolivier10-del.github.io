<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* The three steps the student sorts, in the order they are shown.

     Two of them produce CH₃Br. That is deliberate and is the whole point of
     the exercise: the stage is decided by what happens to the RADICAL COUNT,
     not by whether a product appears. Sorting by "this one makes the product,
     so it must be the end" is the slip the written section calls out, and it
     is the one this step is built to catch. */
  var STEPS = [
    { id:'s1', eq:'Br–Br &nbsp;<span class="radical-cond">h&nu;</span>&rarr;&nbsp; Br• + Br•', before:0, after:2, stage:'initiation',
      why:'Radicals go from none to two. That is initiation — it is slow, expensive, and only has to happen once for the chain to run.' },
    { id:'s2', eq:'•CH₃ + Br–Br  &rarr;  CH₃Br + Br•', before:1, after:1, stage:'propagation',
      why:'This one makes the product, which is exactly why it is worth checking the count instead of trusting your eye. One radical in, one radical out — the chain is unchanged, so it can go round again. That is propagation.' },
    { id:'s3', eq:'•CH₃ + Br•  &rarr;  CH₃Br', before:2, after:0, stage:'termination',
      why:'Two radicals meet and pair up, leaving none. The chain stops here. Note it makes the same product as the step above — the product is not what tells the stages apart.' }
  ];
  var STAGES = [
    { key:'initiation',  label:'Initiation' },
    { key:'propagation', label:'Propagation' },
    { key:'termination', label:'Termination' }
  ];

  window.OchemLessonEngine.start({
    topicId: 'radical-halogenation',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Alkanes are defined by what they will not do — and then there is one reaction.',
        bodyHtml: '<p class="step-body">Every bond in an alkane is C–C or C–H, both close to nonpolar. There is no lone pair to donate, no empty orbital to accept, no partial charge for a nucleophile or an electrophile to aim at. Nothing in the first eight chapters attacks an alkane, and that is the point of them: they are the inert skeleton everything else hangs off.</p>' +
          '<p class="step-body">Given a halogen and either <b>heat or ultraviolet light</b>, though, an alkane will swap a hydrogen for a halogen. The condition is not decoration. Br₂ and an alkane in a dark flask at room temperature do nothing at all. The light is what starts the chain, and without it there is no reaction to have. (Looking ahead: a molecule with a double bond decolorizes bromine water in the dark, which is why that is the classic test for one — the reaction behind it is taught in <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-alkenes-alkynes\">Alkenes &amp; Alkynes</a>.)</p>' +
          '<p class="step-body" style="margin-bottom:0;">The mechanism is unlike anything else in this course: no charges, no nucleophiles, no arrows pushing pairs of electrons. Every bond you have broken so far broke <b>heterolytically</b> — both electrons leaving with one atom, giving a cation and an anion. A halogen under UV light breaks <b>homolytically</b>: one electron to each atom, giving two neutral species each with an unpaired electron. Those are <b>radicals</b>. Because the arrow now carries one electron instead of two it is drawn with a single barb, and is called a <b>fishhook arrow</b>. If a step you have drawn produces a charge, it was not a radical step.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three stages, and the radical count names them for you.',
        bodyHtml: '<p class="step-body">Sort the steps by what each one does to the number of radicals in the flask and the three stages name themselves. Up from zero is <b>initiation</b>, unchanged is <b>propagation</b>, down to zero is <b>termination</b>.</p>' +
          '<ul class="step-body">' +
          '<li><b>Initiation</b> makes radicals out of a molecule that had none: light or heat splits X–X into two X•. Rare, slow, and it does not need to happen often.</li>' +
          '<li><b>Propagation</b> is two steps, and together they <i>are</i> the reaction. A halogen radical abstracts a hydrogen from the alkane, giving H–X and a carbon radical; that carbon radical attacks X₂, taking one halogen and releasing the other as a fresh X•. Add them together and the radicals cancel: R–H + X₂ &rarr; R–X + H–X.</li>' +
          '<li><b>Termination</b> is any step where two radicals find each other and pair up. These consume two and make none, which is what ends the chain.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">Because each propagation step consumes one radical and produces one, the pair runs as a loop: a single initiation event can turn over thousands of molecules before two radicals happen to collide and stop it. Termination is rare while the reaction runs, precisely because the radical concentration is always tiny.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Sort each step by what it does to the radical count.</h2>' +
            '<p class="step-body">Count the radicals on the left, then on the right. Two of these three produce CH₃Br, so the product will not tell you the answer — the count will.</p>' +
            '<div class="radical-sort">' +
            STEPS.map(function(s){
              return '<div class="radical-row" data-step="' + s.id + '">' +
                '<div class="radical-eq">' + s.eq + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Stage for ' + s.eq.replace(/<[^>]+>/g, '') + '">' +
                STAGES.map(function(st){
                  return '<button type="button" class="choice-btn sm" data-step="' + s.id + '" data-stage="' + st.key + '">' + st.label + '</button>';
                }).join('') +
                '</div>' +
                '<div class="radical-why" data-why="' + s.id + '"></div>' +
              '</div>';
            }).join('') +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);

          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var settled = {};
          var missed = false;

          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-step');
              if(settled[id]) return;
              var cfg = STEPS.filter(function(s){ return s.id === id; })[0];
              var right = btn.getAttribute('data-stage') === cfg.stage;
              if(!right){
                missed = true;
                btn.classList.add('wrong');
                btn.disabled = true;
                api.showFeedback(fb, false, 'Not that one. Count the radicals on each side of that step: ' +
                  cfg.before + ' before, ' + cfg.after + ' after. Up from zero is initiation, unchanged is propagation, down to zero is termination.');
                return;
              }
              settled[id] = true;
              btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-step="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML =
                '<b>' + cfg.before + ' &rarr; ' + cfg.after + ' radicals.</b> ' + cfg.why;
              if(Object.keys(settled).length === STEPS.length){
                api.showFeedback(fb, true, missed
                  ? 'All three sorted. The rule to carry out of this: the stage is the radical count, never the product.'
                  : 'All three, first time — including the propagation step that makes the product. That is the one most people call termination.');
                api.record(!missed);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'An alkane has several kinds of hydrogen. What decides which one is abstracted?',
        options: [
          'The one furthest from any branch, since it is easiest to reach',
          'The stability of the carbon radical left behind — 3° &gt; 2° &gt; 1° &gt; methyl',
          'Whichever hydrogen there are most of',
          'The one on the most electronegative carbon'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Abstraction is easiest where it leaves the most stable radical, and a radical is stabilized by <b>hyperconjugation</b> — the same donation from a filled neighboring C–H orbital that made staggered ethane comfortable, now feeding a half-empty orbital instead. More alkyl groups means more C–H bonds in a position to donate.',
        wrongFeedback: 'It is decided by what is left behind, not by what is easiest to reach. Ask which carbon radical would be most stable — and the answer is the one with the most alkyl groups around it, because each one brings C–H bonds that can donate into the half-filled orbital.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'You need one clean product from a substrate with a single tertiary C–H. Bromine or chlorine?',
        options: [
          'Chlorine — it is more reactive, so it works faster and more cleanly',
          'Either; the halogen does not affect which position reacts',
          'Bromine — it is far more selective for the tertiary position',
          'Neither: radical halogenation always gives a mixture'
        ],
        correctIndex: 2,
        correctFeedback: 'Correct. Per hydrogen, bromine prefers 3° over 1° by roughly 1600 to 1; chlorine by only about 5 to 1. On 2-methylpropane — nine primary hydrogens against one tertiary — bromine still gives about 99% of the tertiary bromide, while chlorine gives more of the primary product than the tertiary one.',
        wrongFeedback: 'More reactive is not the same as more useful here. One of these two barely distinguishes a 3° hydrogen from a 1° one; the other distinguishes them by a factor of over a thousand.'
      },
      {
        type: 'explain',
        eyebrow: 'Step 6 · Why it works that way',
        title: 'The sluggish reagent is the selective one.',
        bodyHtml: '<p class="step-body">This looks backwards until you think about the transition state. Abstraction by the very reactive chlorine radical is <b>exothermic</b>, so by the Hammond postulate you already have, its transition state comes <b>early</b> and looks like the reactants — at which point the radical has barely formed and its stability hardly matters. Abstraction by the much less reactive bromine radical is <b>endothermic</b>, so its transition state comes <b>late</b> and looks like the radical itself, and every bit of that radical\'s stability shows up in the rate.</p>' +
          '<p class="step-body">Two corrections to the arithmetic before you predict any ratio. First, those rates are <b>per hydrogen</b>, so you multiply by how many equivalent hydrogens there are: propane has six primary hydrogens and only two secondary ones, so even with the secondary position about four times more reactive toward chlorine, the two products come out close to even. The statistics nearly cancel the selectivity.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Second, the carbon radical is essentially <b>planar</b>, with its unpaired electron in a p orbital, so a halogen can arrive on either face with equal ease. If the reaction creates a new stereocenter, the product is <b>racemic</b>. That is a structural fact about the intermediate, not a limitation of the conditions — no choice of solvent or temperature makes a radical mechanism enantioselective here.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'To brominate the allylic position of an alkene you use NBS rather than Br₂. Why?',
        options: [
          'NBS is a stronger brominating agent, so it reaches the harder position',
          'NBS keeps the Br₂ concentration permanently low, and addition across the double bond needs a reasonable concentration while the radical chain does not',
          'NBS attacks only carbons next to a pi system and cannot touch a double bond',
          'Br₂ would abstract the wrong hydrogen and give the 3° product instead'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. The allylic hydrogen is genuinely easy to abstract — the radical it leaves is resonance-delocalized over the pi system. The problem is competition: adding Br₂ to an alkene gives addition across the double bond, which is faster. Starve the reaction of bromine and substitution wins.',
        wrongFeedback: 'The difficulty is not strength or targeting — it is that a competing reaction is faster. Ask which of the two reactions needs a decent concentration of Br₂ to proceed, and what happens if you deny it one.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'HBr adds to propene the Markovnikov way, but adding peroxides flips it to anti-Markovnikov. What does that tell you about the mechanism?',
        options: [
          'The peroxide makes HBr a stronger acid, so the proton adds to the other carbon',
          'The peroxide initiates a radical chain: a bromine radical adds first, not a proton, and it adds where it leaves the more stable carbon radical',
          'The peroxide oxidizes the alkene before HBr can reach it',
          'Nothing about the mechanism changes — only the product ratio shifts'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and it is the same chain logic you just sorted: initiation, two propagation steps, termination. The regiochemistry flips because the first thing to add is no longer H⁺ seeking the more stable carbocation, but Br• seeking the more stable carbon radical — which puts the bromine on the other carbon. Radical chemistry returns once more in this course, in mass spectrometry, where the molecular ion is itself a radical cation breaking apart to leave the most stable radical it can.'
      }
    ]
  });
})();
});
</script>
