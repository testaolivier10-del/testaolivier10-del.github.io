<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'curved-arrows',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The two rules</h3><p class="step-body">A curved arrow represents <b>two electrons</b> moving together. The <b>tail</b> starts wherever those electrons currently are — a lone pair, or an existing bond. The <b>head</b> points to wherever they end up — a new bond, or a new lone pair. The tail can never start on a bare atom or a positive charge, because there\'s nothing there to give away — it must start on an actual pair of electrons.</p>' +
      '<h3>Worked example: ammonia + H⁺</h3><p class="step-body">Tail on nitrogen\'s lone pair (the electron source), head on H⁺ (where the new N–H bond forms). Order matters: the arrow always starts at the electrons and points to where they\'re going, never the reverse.</p>' +
      '<h3>Spotting invalid arrows</h3><p class="step-body">An arrow drawn starting from a positive charge is always wrong — a positively charged atom is electron-<b>deficient</b>, so it can only ever be a destination (a head), never a source (a tail).</p>' +
      '<div class="notes-fact">Every SN1, SN2, E1, E2, addition, and carbonyl mechanism for the rest of the course is built from these same two rules: tail on the electrons, head on the destination.</div>' +
      '<h3>Fishhook arrows</h3><p class="step-body">A full curved arrow (double-barbed head) moves 2 electrons — that\'s everything in this course. A <b>fishhook</b> arrow (single-barbed head) moves just 1 electron, used for radical mechanisms. Just recognize the visual difference; you won\'t need to draw these for SN1/SN2/E1/E2.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A curved arrow always tracks an electron pair.',
        bodyHtml: '<p class="step-body">A full curved arrow represents <b>two electrons</b> moving together. The <b>tail</b> starts at wherever those electrons currently are — a lone pair, or an existing bond. The <b>head</b> points to wherever they end up — a new bond, or a new lone pair.</p><p class="step-body" style="margin-bottom:0;">The tail can never start on a bare atom or a positive charge, because there\'s nothing there to give away. It has to start on an actual pair of electrons.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Ammonia grabs a proton. Click the tail, then the head.</h2>' +
            '<p class="step-body">First click the lone pair on nitrogen (the <b>tail</b> — where the electrons start). Then click the H⁺ (the <b>head</b> — where they end up).</p>' +
            '<div class="scene"><svg viewBox="0 0 260 130">' +
              '<circle cx="90" cy="70" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="90" y="76" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">N</text>' +
              '<line x1="90" y1="52" x2="90" y2="20" stroke="var(--line)" stroke-width="2.2"/><circle cx="90" cy="14" r="11" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="90" y="18" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">H</text>' +
              '<line x1="105" y1="82" x2="130" y2="100" stroke="var(--line)" stroke-width="2.2"/><circle cx="140" cy="108" r="11" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="140" y="112" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">H</text>' +
              '<line x1="75" y1="82" x2="50" y2="100" stroke="var(--line)" stroke-width="2.2"/><circle cx="40" cy="108" r="11" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="40" y="112" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">H</text>' +
              '<g class="atom" data-key="tail"><circle cx="65" cy="48" r="3" fill="var(--muted)"/><circle cx="72" cy="42" r="3" fill="var(--muted)"/><circle cx="60" cy="52" r="14" fill="transparent"/></g>' +
              '<g class="atom" data-key="head"><circle cx="220" cy="70" r="14" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="220" y="75" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">H</text><text x="234" y="58" font-family="IBM Plex Mono" font-weight="700" font-size="12" fill="var(--coral)">⁺</text></g>' +
            '</svg></div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Click the lone pair (tail) first.</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var gotTail = false, gotHead = false;
          var tailEl = api.card.querySelector('[data-key="tail"]');
          var headEl = api.card.querySelector('[data-key="head"]');
          tailEl.addEventListener('click', function(){
            if(gotTail || gotHead) return;
            gotTail = true;
            tailEl.classList.add('chosen');
            hint.textContent = 'Tail placed on the lone pair. Now click H⁺ for the head.';
          });
          headEl.addEventListener('click', function(){
            if(gotHead) return;
            if(!gotTail){ api.showFeedback(fb, false, 'Start at the electron source, not the destination — click the lone pair first.'); return; }
            gotHead = true;
            headEl.classList.add('chosen');
            hint.textContent = 'Arrow drawn: lone pair → H⁺.';
            api.showFeedback(fb, true, 'Exactly right — tail on the lone pair (the electron source), head on H⁺ (where the new N–H bond forms). Order matters: the arrow always starts at the electrons.');
            next.disabled = false;
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A curved arrow\'s tail must start from...',
        options: ['Any atom in the molecule, electrons or not', 'A lone pair or a bond — a real source of electrons', 'A positive charge, since that\'s what needs electrons'],
        correctIndex: 1,
        correctFeedback: 'Correct — no electrons there, no valid tail there.',
        wrongFeedback: 'Ask yourself: are there actually electrons sitting at that spot? If not, the tail can\'t start there.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'You see an arrow drawn starting from a positive charge and pointing into a nearby bond. What\'s wrong with it?',
        options: ['The head should point away from the bond instead', 'Nothing — this is a normal, valid arrow', 'Positive charges have no electrons to give — the tail can never start there'],
        correctIndex: 2,
        correctFeedback: 'Correct. A positively charged atom is electron-deficient — it\'s a destination for arrows (a head), never a source (a tail).',
        wrongFeedback: 'Think about what a positive charge actually means: a deficiency of electrons, not a supply of them.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A different arrow for a different situation: fishhooks.',
        bodyHtml: '<p class="step-body">Everything so far has been a full curved arrow moving <b>two electrons</b> at once — that covers essentially every mechanism in this course, since almost all organic reactions move electrons in pairs. But some reactions (radical mechanisms — not covered in depth until later, if at all in an intro course) move electrons <b>one at a time</b>. Those use a <b>fishhook arrow</b>: a curved arrow with only a single barb on the head instead of two, representing <b>one</b> electron moving instead of a pair.</p><p class="step-body" style="margin-bottom:0;">You won\'t need to draw fishhook arrows for SN1, SN2, E1, E2, or any of the mechanisms coming up — just recognize the visual difference (full double-barbed head = 2 electrons; single-barbed head = 1 electron) if you see one in a textbook or another source.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is the language of every mechanism from here forward.',
        bodyHtml: '<div class="explain-box">Every SN1, SN2, E1, E2, addition, and carbonyl mechanism you\'ll draw for the rest of the course is built from these same two rules: <b>tail on the electrons, head on the destination</b>. Get comfortable with it now and every later mechanism gets easier, not harder.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A carbanion (CH₃⁻) attacks a carbonyl carbon (C=O). Where should the arrow\'s tail start?',
        options: ['On the carbanion\'s lone pair', 'On the carbonyl oxygen', 'On the carbonyl carbon'],
        correctIndex: 0,
        correctFeedback: 'Correct — the carbanion\'s lone pair is the electron source attacking the electrophilic carbonyl carbon. (A second arrow, from the C=O π bond to oxygen, completes the mechanism — you\'ll draw full sequences like this in Module 9.)'
      }
    ]
  });
})();
</script>

    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
