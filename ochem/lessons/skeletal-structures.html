document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Pentane as a skeletal structure: four line segments, five carbons.

     The point of the drawing is what is NOT in it. There are no atom labels,
     because in this notation there are none — the carbons are the corners and
     the two ends, and finding them is the whole exercise. So the hit targets
     are circles drawn with no stroke and no fill; the CSS reveals one on
     hover and fills it once chosen, which turns "where are the carbons" into
     something you answer with the pointer instead of being told.

     The two ends are listed first deliberately: they are the ones people miss,
     and the feedback below names that. */
  var CHAIN = [
    { key:'c1', x:40,  y:82, end:true  },
    { key:'c2', x:85,  y:52, end:false },
    { key:'c3', x:130, y:82, end:false },
    { key:'c4', x:175, y:52, end:false },
    { key:'c5', x:220, y:82, end:true  }
  ];

  function bond(a, b){
    return '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y +
           '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
  }

  /* opts.labels draws the worked-out hydrogen count under each carbon, used
     once the student has found them. */
  function pentaneSvg(opts){
    opts = opts || {};
    var lines = '';
    for(var i = 0; i < CHAIN.length - 1; i++) lines += bond(CHAIN[i], CHAIN[i + 1]);
    var hits = CHAIN.map(function(c){
      return '<g class="atom hit" data-key="' + c.key + '" role="button" tabindex="0" ' +
             'aria-label="carbon at position ' + c.key.slice(1) + '">' +
             '<circle cx="' + c.x + '" cy="' + c.y + '" r="15" fill="transparent" ' +
             'stroke="transparent" stroke-width="2"/></g>';
    }).join('');
    var labels = !opts.labels ? '' : CHAIN.map(function(c){
      var text = c.end ? 'CH₃' : 'CH₂';
      return '<text x="' + c.x + '" y="' + (c.y + (c.y > 70 ? 32 : -24)) + '" text-anchor="middle" ' +
             'font-family="IBM Plex Mono, monospace" font-weight="700" font-size="12" ' +
             'fill="var(--muted)">' + text + '</text>';
    }).join('');
    /* role="group", not role="img". The carbons inside are focusable buttons,
       and role="img" declares the whole SVG a single graphic — which makes
       nested interactive controls invalid and hides them from a screen
       reader. The group carries the description instead, and each carbon
       carries its own label. */
    return '<div class="scene"><svg viewBox="0 0 260 120" role="group" ' +
      'aria-label="Pentane as a skeletal structure: a zigzag of four line segments. ' +
      'Each corner and each end is a carbon you can select.">' +
      lines + labels + hits + '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'skeletal-structures',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One molecule, three drawings.',
        bodyHtml: '<p class="step-body">Here is CH₃CH₂CH₂CH₂OH drawn three ways. The Lewis structure shows every atom and every bond. The condensed formula is shorter, but it shows no bonds at all. The third drawing is a <b>skeletal structure</b>, also called a line-angle structure.</p>' +
          '<p class="step-body" style="margin-bottom:0;">A skeletal structure shows the <b>carbon skeleton</b>, the chain of carbons that holds the molecule together, along with the functional groups on it. It leaves out every carbon symbol and every hydrogen on carbon, and four rules let you put them back. Every drawing in the rest of the course uses this notation.</p>',
        diagramHtml: '<!-- fig:l-notation:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 440" role="img" aria-label="CH3CH2CH2CH2OH drawn three ways, stacked: the full Lewis structure with every H and the two lone pairs on O; the condensed formula; and the skeletal structure, a zigzag ending in OH, with CH3 and CH2 labels at the end and corners."><rect class="fg-panel" x="10" y="10" width="320" height="170" rx="10"></rect><text class="fg-lbl" x="170" y="32" text-anchor="middle" font-size="13">full Lewis structure</text><line class="fg-bond" x1="84" y1="100" x2="106" y2="100"></line><line class="fg-bond" x1="134" y1="100" x2="156" y2="100"></line><line class="fg-bond" x1="184" y1="100" x2="206" y2="100"></line><line class="fg-bond" x1="56" y1="100" x2="43" y2="100"></line><line class="fg-bond" x1="70" y1="86" x2="70" y2="73"></line><line class="fg-bond" x1="70" y1="114" x2="70" y2="127"></line><line class="fg-bond" x1="120" y1="86" x2="120" y2="73"></line><line class="fg-bond" x1="120" y1="114" x2="120" y2="127"></line><line class="fg-bond" x1="170" y1="86" x2="170" y2="73"></line><line class="fg-bond" x1="170" y1="114" x2="170" y2="127"></line><line class="fg-bond" x1="220" y1="86" x2="220" y2="73"></line><line class="fg-bond" x1="220" y1="114" x2="220" y2="127"></line><line class="fg-bond" x1="234" y1="100" x2="252" y2="100"></line><line class="fg-bond" x1="266" y1="86" x2="266" y2="73"></line><circle class="fg-lp" cx="288" cy="104.5" r="2.3"></circle><circle class="fg-lp" cx="288" cy="95.5" r="2.3"></circle><circle class="fg-lp" cx="261.5" cy="122" r="2.3"></circle><circle class="fg-lp" cx="270.5" cy="122" r="2.3"></circle><circle class="fg-atom" cx="70" cy="100" r="14"></circle><text class="fg-lbl" x="70" y="104.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="120" cy="100" r="14"></circle><text class="fg-lbl" x="120" y="104.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="170" cy="100" r="14"></circle><text class="fg-lbl" x="170" y="104.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="220" cy="100" r="14"></circle><text class="fg-lbl" x="220" y="104.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="32" cy="100" r="11"></circle><text class="fg-lbl" x="32" y="104.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="70" cy="62" r="11"></circle><text class="fg-lbl" x="70" y="66.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="70" cy="138" r="11"></circle><text class="fg-lbl" x="70" y="142.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="120" cy="62" r="11"></circle><text class="fg-lbl" x="120" y="66.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="120" cy="138" r="11"></circle><text class="fg-lbl" x="120" y="142.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="170" cy="62" r="11"></circle><text class="fg-lbl" x="170" y="66.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="170" cy="138" r="11"></circle><text class="fg-lbl" x="170" y="142.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="220" cy="62" r="11"></circle><text class="fg-lbl" x="220" y="66.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="220" cy="138" r="11"></circle><text class="fg-lbl" x="220" y="142.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="266" cy="100" r="14"></circle><text class="fg-lbl" x="266" y="104.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="266" cy="62" r="11"></circle><text class="fg-lbl" x="266" y="66.44" text-anchor="middle" font-size="12">H</text><text class="fg-tag" x="170" y="172" text-anchor="middle" font-size="11">15 atom symbols, every bond drawn</text><rect class="fg-panel" x="10" y="190" width="320" height="80" rx="10"></rect><text class="fg-lbl" x="170" y="214" text-anchor="middle" font-size="13">condensed formula</text><text class="fg-lbl" x="170" y="250" text-anchor="middle" font-size="15">CH₃CH₂CH₂CH₂OH</text><rect class="fg-panel-hi" x="10" y="280" width="320" height="150" rx="10"></rect><text class="fg-lbl" x="170" y="302" text-anchor="middle" font-size="13">skeletal structure</text><line class="fg-bond" x1="90" y1="365" x2="130" y2="343"></line><line class="fg-bond" x1="130" y1="343" x2="170" y2="365"></line><line class="fg-bond" x1="170" y1="365" x2="210" y2="343"></line><line class="fg-bond" x1="210" y1="343" x2="236.86" y2="357.77"></line><circle class="fg-atom" cx="250" cy="365" r="15"></circle><text class="fg-lbl" x="250" y="368.89" text-anchor="middle" font-size="10.5">OH</text><text class="fg-tag-good" x="90" y="393" text-anchor="middle" font-size="11">CH₃</text><text class="fg-tag-good" x="130" y="329" text-anchor="middle" font-size="11">CH₂</text><text class="fg-tag-good" x="170" y="393" text-anchor="middle" font-size="11">CH₂</text><text class="fg-tag-good" x="210" y="329" text-anchor="middle" font-size="11">CH₂</text><text class="fg-tag" x="170" y="418" text-anchor="middle" font-size="11">every corner and end is a carbon</text></svg><figcaption>One molecule, three drawings. The green labels show what the skeletal drawing leaves out.</figcaption></figure><!-- fig:l-notation:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every corner and every end is a carbon.',
        bodyHtml: '<p class="step-body">In a skeletal structure, each line is a bond. A carbon sits at every corner and at both ends of the chain, and no C is written at any of them.</p>' +
          '<p class="step-body" style="margin-bottom:0;">The chain below has five lines and six carbons: four corners plus two ends. Forgetting the ends is the easiest miscount to make.</p>',
        diagramHtml: '<!-- fig:l-count-ends:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 150" role="img" aria-label="A zigzag of five lines. Its six carbons are numbered 1 to 6: carbons 1 and 6 are the two ends, and 2 to 5 are the corners."><line class="fg-bond" x1="60" y1="88" x2="104" y2="62"></line><line class="fg-bond" x1="104" y1="62" x2="148" y2="88"></line><line class="fg-bond" x1="148" y1="88" x2="192" y2="62"></line><line class="fg-bond" x1="192" y1="62" x2="236" y2="88"></line><line class="fg-bond" x1="236" y1="88" x2="280" y2="62"></line><circle class="fg-atom-hi" cx="60" cy="88" r="7"></circle><text class="fg-lbl" x="60" y="116" text-anchor="middle" font-size="13">1</text><circle class="fg-atom-hi" cx="104" cy="62" r="5"></circle><text class="fg-lbl" x="104" y="50" text-anchor="middle" font-size="13">2</text><circle class="fg-atom-hi" cx="148" cy="88" r="5"></circle><text class="fg-lbl" x="148" y="116" text-anchor="middle" font-size="13">3</text><circle class="fg-atom-hi" cx="192" cy="62" r="5"></circle><text class="fg-lbl" x="192" y="50" text-anchor="middle" font-size="13">4</text><circle class="fg-atom-hi" cx="236" cy="88" r="5"></circle><text class="fg-lbl" x="236" y="116" text-anchor="middle" font-size="13">5</text><circle class="fg-atom-hi" cx="280" cy="62" r="7"></circle><text class="fg-lbl" x="280" y="50" text-anchor="middle" font-size="13">6</text><text class="fg-tag-good" x="60" y="136" text-anchor="middle" font-size="11">end</text><text class="fg-tag-good" x="280" y="136" text-anchor="middle" font-size="11">end</text><text class="fg-tag" x="170" y="136" text-anchor="middle" font-size="11">5 lines, 6 carbons</text></svg><figcaption>Four corners plus two ends: six carbons.</figcaption></figure><!-- fig:l-count-ends:end -->'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Find every carbon in this structure.</h2>' +
            '<p class="step-body">No atom is labeled, because in this notation carbons never are. Click each carbon you can find; hovering shows where you are aiming.</p>' +
            pentaneSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Carbons found: 0 / 5</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var found = {};
          var count = 0;
          /* Graded on whether the ends were found without help. Someone who
             clicks the three corners, stalls, and only then finds the ends has
             made exactly the mistake this step exists to catch, so the nudge
             appears and the step does not score as correct. */
          var nudged = false;
          function take(g){
            var key = g.getAttribute('data-key');
            if(found[key]) return;
            found[key] = true;
            count++;
            g.classList.add('chosen');
            hint.textContent = 'Carbons found: ' + count + ' / 5';
            var endsLeft = CHAIN.filter(function(c){ return c.end && !found[c.key]; }).length;
            if(count === 3 && endsLeft === 2 && !nudged){
              nudged = true;
              api.showFeedback(fb, false, 'Three corners, and the structure is not finished. Look at the two ends of the line: a line has to stop somewhere, and what it stops at is a carbon too.');
            }
            if(count === 5){
              api.showFeedback(fb, true, nudged
                ? 'Five carbons: three corners and two ends. This is pentane. The ends are the ones worth remembering: a zigzag of four lines has five carbons, not three.'
                : 'Five carbons: three corners and two ends, and you counted the ends without being told. This is pentane: four lines, five carbons.');
              api.record(!nudged);
              next.disabled = false;
            }
          }
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){ take(g); });
            // The pointer is not the only way in. Every other control on the
            // page is reachable by keyboard and the Continue button is gated
            // on finishing this step, so the atoms have to be reachable too.
            g.addEventListener('keydown', function(e){
              if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
                e.preventDefault();
                take(g);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Hydrogens on carbon are worked out, not drawn.',
        bodyHtml: '<p class="step-body">Carbon makes four bonds. Count the bonds at a carbon (so far, each line is one bond), subtract from four, and the rest are hydrogens. In pentane, each end has one line, so it is a CH₃. Each corner has two lines, so it is a CH₂.</p>' +
