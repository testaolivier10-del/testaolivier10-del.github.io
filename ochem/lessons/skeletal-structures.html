<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Pentane as a skeletal structure: four line segments, five carbons.

     The point of the drawing is what is NOT in it. There are no atom labels,
     because in this notation there are none — the carbons are the corners and
     the two ends, and finding them is the whole exercise. So the hit targets
     are circles drawn with no stroke and no fill; the CSS reveals one on
     hover and fills it once chosen, which turns "where are the carbons" into
     something you answer with the pointer instead of being told.

     The two ends are listed first deliberately: they are the ones people miss,
     and the feedback below names that. */
  var CHAIN = [
    { key:'c1', x:40,  y:82, end:true  },
    { key:'c2', x:85,  y:52, end:false },
    { key:'c3', x:130, y:82, end:false },
    { key:'c4', x:175, y:52, end:false },
    { key:'c5', x:220, y:82, end:true  }
  ];

  function bond(a, b){
    return '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y +
           '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
  }

  /* opts.labels draws the worked-out hydrogen count under each carbon, used
     once the student has found them. */
  function pentaneSvg(opts){
    opts = opts || {};
    var lines = '';
    for(var i = 0; i < CHAIN.length - 1; i++) lines += bond(CHAIN[i], CHAIN[i + 1]);
    var hits = CHAIN.map(function(c){
      return '<g class="atom" data-key="' + c.key + '" role="button" tabindex="0" ' +
             'aria-label="carbon at position ' + c.key.slice(1) + '">' +
             '<circle cx="' + c.x + '" cy="' + c.y + '" r="15" fill="transparent" ' +
             'stroke="transparent" stroke-width="2"/></g>';
    }).join('');
    var labels = !opts.labels ? '' : CHAIN.map(function(c){
      var text = c.end ? 'CH₃' : 'CH₂';
      return '<text x="' + c.x + '" y="' + (c.y + (c.y > 70 ? 32 : -24)) + '" text-anchor="middle" ' +
             'font-family="IBM Plex Mono, monospace" font-weight="700" font-size="12" ' +
             'fill="var(--muted)">' + text + '</text>';
    }).join('');
    /* role="group", not role="img". The carbons inside are focusable buttons,
       and role="img" declares the whole SVG a single graphic — which makes
       nested interactive controls invalid and hides them from a screen
       reader. The group carries the description instead, and each carbon
       carries its own label. */
    return '<div class="scene"><svg viewBox="0 0 260 120" role="group" ' +
      'aria-label="Pentane as a skeletal structure: a zigzag of four line segments. ' +
      'Each corner and each end is a carbon you can select.">' +
      lines + labels + hits + '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'skeletal-structures',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Almost everything from here on is drawn in a notation nobody has explained yet.',
        bodyHtml: '<p class="step-body">Lewis structures, where every atom and every bond is written out, are honest and unreadable past about six carbons. Cholesterol as a Lewis structure is a page of Cs and Hs that no chemist could scan. So organic chemists draw <b>skeletal structures</b> instead — also called line-angle structures — and they are the language the rest of this course is written in.</p>' +
          '<p class="step-body">This is not a shorthand for experts. It is a deliberate decision about what a chemist needs to see, and it keeps exactly the thing that matters: the <b>carbon skeleton</b> and the <b>functional groups</b> hanging off it, with the uninformative hydrogens hidden.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Butan-1-ol written three ways — CH₃CH₂CH₂CH₂OH condensed, a page of symbols as a Lewis structure, or three lines and an OH as a skeletal structure — is the same molecule each time. The skeletal drawing has not lost the hydrogens. It has moved them into a rule you apply rather than symbols you read.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Four rules, and the third is the one people get wrong.',
        bodyHtml: '<ul class="step-body">' +
          '<li><b>A line is a bond, and every vertex or end of a line is a carbon.</b> No C is written. A zigzag of five line segments is a six-carbon chain, because the two ends count too — forgetting the ends is the commonest miscount in the first week.</li>' +
          '<li><b>Hydrogens on carbon are not drawn.</b> They are inferred: carbon makes four bonds, so whatever is left over after the lines you can see is hydrogen. A vertex with two lines meeting it has two hydrogens; a chain end with one line has three.</li>' +
          '<li><b>Every atom that is not carbon IS drawn, and so are the hydrogens attached to it.</b> O, N, S, Cl and the rest are always written, and an O–H is written OH rather than left implied.</li>' +
          '<li><b>Lone pairs are usually left off</b>, and you are expected to supply them. An oxygen drawn with two bonds has two lone pairs whether or not anyone drew them, and when you start pushing arrows you will need them.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">The third rule is the asymmetry that trips people: hydrogen on carbon is invisible, hydrogen on anything else is visible. It is not inconsistency. An O–H hydrogen is acidic, hydrogen bonds, and gets removed by base, so it is part of the chemistry; a C–H hydrogen along a chain almost never is. The notation hides what does not matter and keeps what does.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Find every carbon in this structure.</h2>' +
            '<p class="step-body">Not one atom is labeled, because in this notation none of them is. Click each carbon you can find — hover will show you where you are aiming.</p>' +
            pentaneSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Carbons found: 0 / 5</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var found = {};
          var count = 0;
          /* Graded on whether the ends were found without help. Someone who
             clicks the three corners, stalls, and only then finds the ends has
             made exactly the mistake this step exists to catch, so the nudge
             appears and the step does not score as correct. */
          var nudged = false;

          function take(g){
            var key = g.getAttribute('data-key');
            if(found[key]) return;
            found[key] = true;
            count++;
            g.classList.add('chosen');
            hint.textContent = 'Carbons found: ' + count + ' / 5';

            var endsLeft = CHAIN.filter(function(c){ return c.end && !found[c.key]; }).length;
            if(count === 3 && endsLeft === 2 && !nudged){
              nudged = true;
              api.showFeedback(fb, false, 'Three corners, and the structure is not finished. Look at the two ends of the line — a line has to stop somewhere, and what it stops at is a carbon too.');
            }
            if(count === 5){
              api.showFeedback(fb, true, nudged
                ? 'Five carbons: three corners and two ends. This is pentane. The ends are the ones worth remembering — a zigzag of four segments is five carbons, not three.'
                : 'Five carbons: three corners and two ends, and you counted the ends without being told. This is pentane — four line segments, five carbons.');
              api.record(!nudged);
              next.disabled = false;
            }
          }

          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){ take(g); });
            // The pointer is not the only way in. Every other control on the
            // page is reachable by keyboard and the Continue button is gated
            // on finishing this step, so the atoms have to be reachable too.
            g.addEventListener('keydown', function(e){
              if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
                e.preventDefault();
                take(g);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'In that pentane chain, how many hydrogens are on the middle carbon — the third one along?',
        options: ['Three, the same as the ends', 'Two', 'One', 'None — hydrogens are not part of the molecule'],
        correctIndex: 1,
        correctFeedback: 'Right. Two lines meet at that vertex, so two of carbon\'s four bonds are used and the remaining two are hydrogens: CH₂. You did not read that anywhere — you subtracted it.',
        wrongFeedback: 'Count the lines meeting that vertex, then subtract from four. Two bonds are drawn, so two hydrogens are implied. The three-hydrogen answer belongs to the chain ends, where only one line arrives.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Butan-1-ol is drawn as three line segments ending in OH. Why is that hydrogen written out when nine others are not?',
        options: [
          'Because oxygen cannot be drawn without showing its hydrogen',
          'Because it is the only hydrogen left in the molecule',
          'Because hydrogens on atoms other than carbon are drawn — and an O–H hydrogen is one that does chemistry',
          'Because the molecule would be a different compound otherwise'
        ],
        correctIndex: 2,
        correctFeedback: 'Correct. That is rule three. An O–H hydrogen is acidic, hydrogen bonds, and gets removed by base, so hiding it would hide the reactive part of the molecule. The nine C–H hydrogens along the chain do none of those things.',
        wrongFeedback: 'The molecule has ten hydrogens; nine of them are on carbon and invisible. What makes this one different is the atom it is attached to — and what that lets it do.'
      },
      {
        type: 'explain',
        eyebrow: 'Worked example',
        title: 'Reading one back, in a fixed order.',
        bodyHtml: '<p class="step-body">Going from a skeletal structure to a name is the direction that feels harder at first. Work it in the same order every time and it stops being hard. Take a five-vertex zigzag with an OH on the second vertex from the left:</p>' +
          '<ul class="step-body">' +
          '<li><b>Count the vertices and ends.</b> Five carbons.</li>' +
          '<li><b>Read the heteroatoms.</b> One oxygen, drawn, with its hydrogen drawn.</li>' +
          '<li><b>Fill in the hydrogens by counting lines.</b> The left end has one line, so CH₃. The second vertex has two lines plus the OH, so one hydrogen: CH. The third and fourth have two lines each: CH₂. The right end has one line: CH₃.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">Put it together and you have CH₃–CH(OH)–CH₂–CH₂–CH₃, pentan-2-ol. One pass, and the hydrogens were never guessed — they were subtracted. The common slip is counting a vertex as a carbon and then <i>also</i> writing in its hydrogens when you redraw, which gives carbon five bonds.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'A hexagon with nothing drawn inside or outside it. What is it, and what is its formula?',
        options: [
          'Benzene, C₆H₆ — a hexagon means an aromatic ring',
          'Cyclohexane, C₆H₁₂ — six corners, each a carbon with two hydrogens',
          'Six carbons in a chain, C₆H₁₄ — bent round for convenience',
          'It is incomplete — a ring cannot be drawn without labeling its atoms'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Six corners, so six carbons; each corner has two lines meeting it, so two hydrogens each. Benzene would need three alternating double bonds drawn in, or a circle inside the ring — a bare hexagon is the saturated ring.',
        wrongFeedback: 'Apply the two rules in order. Six corners means six carbons. Each corner has exactly two lines meeting it, so each carries two hydrogens. Nothing in a bare hexagon says anything about double bonds.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A student redraws a skeletal vertex where two lines meet, writing it as a carbon with two hydrogens AND keeping both bonds. Their next step gives that carbon five bonds. What went wrong?',
        options: [
          'Nothing — a carbon at a vertex really does have two bonds and two hydrogens, which is four',
          'They should have written three hydrogens, since vertices are like chain ends',
          'They counted an extra bond somewhere: a vertex carbon has two bonds and two hydrogens, so five means one bond was double-counted',
          'Skeletal structures cannot be redrawn as Lewis structures without losing information'
        ],
        correctIndex: 2,
        correctFeedback: 'Correct. Two lines plus two hydrogens is four, which is right — so a fifth bond means something was counted twice, usually the vertex being treated as an atom in its own right on top of the bonds already drawn. Count the lines meeting the vertex first, subtract from four, and what is left is the hydrogen count.'
      }
    ]
  });
})();
});
</script>
