.92" y2="125.83"></line><line class="fg-hash" x1="253.17" y1="128.67" x2="256.83" y2="128.67"></line><line class="fg-hash" x1="252.25" y1="131.5" x2="257.75" y2="131.5"></line><line class="fg-hash" x1="251.33" y1="134.33" x2="258.67" y2="134.33"></line><line class="fg-hash" x1="250.42" y1="137.17" x2="259.58" y2="137.17"></line><path class="fg-wedge" d="M242 110 L223 105 L223 115 Z"></path><path class="fg-wedge" d="M268 110 L286 115 L286 105 Z"></path><rect class="fg-atom" x="238" y="54" width="34" height="24" rx="12"></rect><text class="fg-lbl" x="255" y="70.6" text-anchor="middle" font-size="13">CHO</text><rect class="fg-atom" x="230" y="142" width="50" height="24" rx="12"></rect><text class="fg-lbl" x="255" y="158.6" text-anchor="middle" font-size="13">CH₂OH</text><rect class="fg-atom-hi" x="197" y="98" width="24" height="24" rx="12"></rect><text class="fg-lbl" x="209" y="114.6" text-anchor="middle" font-size="13">H</text><rect class="fg-atom-hi" x="288" y="98" width="26" height="24" rx="12"></rect><text class="fg-lbl" x="301" y="114.6" text-anchor="middle" font-size="13">OH</text><circle class="fg-atom" cx="255" cy="110" r="13"></circle><text class="fg-lbl" x="255" y="114.81" text-anchor="middle" font-size="13">C</text><text class="fg-tag-good" x="170" y="194" text-anchor="middle" font-size="10">H and OH on wedges: toward you</text><text class="fg-tag-mut" x="170" y="212" text-anchor="middle" font-size="10">CHO and CH₂OH on hashes: away</text><line class="fg-rule" x1="10" y1="230" x2="330" y2="230"></line><text class="fg-tag" x="170" y="256" text-anchor="middle" font-size="11">Seen from the side</text><line class="fg-dash" x1="216" y1="274" x2="216" y2="430"></line><text class="fg-tag-mut" x="220" y="444" text-anchor="middle" font-size="10">page</text><line class="fg-bond" x1="223.5" y1="342.63" x2="245.15" y2="315.56"></line><line class="fg-bond" x1="223.5" y1="361.37" x2="245.15" y2="388.44"></line><line class="fg-bond-hi" x1="204" y1="352" x2="173" y2="352"></line><rect class="fg-atom" x="239" y="290" width="34" height="24" rx="12"></rect><text class="fg-lbl" x="256" y="306.6" text-anchor="middle" font-size="13">CHO</text><rect class="fg-atom" x="231" y="390" width="50" height="24" rx="12"></rect><text class="fg-lbl" x="256" y="406.6" text-anchor="middle" font-size="13">CH₂OH</text><rect class="fg-atom-hi" x="145" y="340" width="26" height="24" rx="12"></rect><text class="fg-lbl" x="158" y="356.6" text-anchor="middle" font-size="13">OH</text><circle class="fg-atom" cx="216" cy="352" r="12"></circle><text class="fg-lbl" x="216" y="356.81" text-anchor="middle" font-size="13">C</text><text class="fg-tag-mut" x="158" y="330" text-anchor="middle" font-size="10">H is behind OH</text><path class="fg-bond" d="M51 352 Q66 334 81 352 Q66 370 51 352 Z"></path><circle class="fg-lp" cx="71" cy="352" r="5"></circle><text class="fg-tag" x="66" y="382" text-anchor="middle" font-size="11">you</text></svg><figcaption>One molecule, (R)-glyceraldehyde, drawn three ways. In the side view, H sits directly behind OH.</figcaption></figure><!-- fig:l-fischer-convention:end -->'

          next.addEventListener('click', api.advance);

        correctFeedback: 'Correct. Vertical lines stand for bonds going into the page, away from you; horizontal lines come toward you.',

      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Where the cross comes from.',
        bodyHtml: '<p class="step-body">Take erythrose, a four-carbon sugar with stereocenters at C2 and C3. Hold a model of it so that the chain arches toward you and both ends curl back into the page.</p><p class="step-body">In that pose, the bonds from C2 up to C1 and from C3 down to C4 curve back into the page, and each H and OH sticks out toward you. At each carbon, both chain bonds lean away from you. Flatten the front view onto the page and you get the Fischer projection.</p><p class="step-body" style="margin-bottom:0;">Each carbon&rsquo;s groups now sit directly in front of the next carbon&rsquo;s groups: the bonds are <b>eclipsed</b>. A Fischer projection always shows that conformation. It does no harm, because turning about a single bond never changes a stereocenter.</p>',

        eyebrow: 'Explain',
        title: 'Reading R or S from the cross.',
        bodyHtml: '<p class="step-body">Rank glyceraldehyde&rsquo;s groups by CIP priority. OH is 1. CHO is 2, because its C=O counts as (O,O,H). CH₂OH is 3, with (O,H,H). H is 4.</p><p class="step-body">Trace 1 &rarr; 2 &rarr; 3 on the cross: from OH on the right, up to CHO, then round to CH₂OH at the bottom. That runs counterclockwise, which reads as S. But H is on the horizontal line, pointing at you, so the answer flips. This is <b>(R)</b>-glyceraldehyde.</p><p class="step-body" style="margin-bottom:0;">If priority 4 sits on the vertical line instead, it already points away, and you read the turn with no flip.</p>',
        diagramHtml: '<!-- fig:fischer-rs:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 262" role="img" aria-label="Left: D-glyceraldehyde as a Fischer projection with priorities marked, OH 1, CHO 2, CH2OH 3, H 4, and a curved arrow turning counterclockwise from OH through CHO to CH2OH. Right: the same center with wedges and hashes, the H highlighted on its wedge, pointing at the viewer. Below: counterclockwise reads S, but H points toward you, so the answer flips to R."><text class="fg-tag" x="88" y="22" text-anchor="middle" font-size="11">Trace 1 → 2 → 3</text><line class="fg-bond" x1="88" y1="118" x2="88" y2="84"></line><line class="fg-bond" x1="88" y1="118" x2="88" y2="152"></line><line class="fg-bond" x1="88" y1="118" x2="54" y2="118"></line><line class="fg-bond" x1="88" y1="118" x2="121" y2="118"></line><rect class="fg-atom" x="71" y="58" width="34" height="24" rx="12"></rect><text class="fg-lbl" x="88" y="74.6" text-anchor="middle" font-size="13">CHO</text><rect class="fg-atom" x="63" y="154" width="50" height="24" rx="12"></rect><text class="fg-lbl" x="88" y="170.6" text-anchor="middle" font-size="13">CH₂OH</text><rect class="fg-atom-warn" x="28" y="106" width="24" height="24" rx="12"></rect><text class="fg-lbl" x="40" y="122.6" text-anchor="middle" font-size="13">H</text><rect class="fg-atom" x="123" y="106" width="26" height="24" rx="12"></rect><text class="fg-lbl" x="136" y="122.6" text-anchor="middle" font-size="13">OH</text><path class="fg-arrow" d="M109.67 114.18 A22 22 0 1 0 79.76 138.4"></path><path class="fg-head" d="M84.94 139.79 L75.03 141.98 L77.46 132.94 Z"></path><text class="fg-tag-good" x="136" y="98" text-anchor="middle" font-size="10">1</text><text class="fg-tag-good" x="118" y="62" text-anchor="middle" font-size="10">2</text><text class="fg-tag-good" x="126" y="178" text-anchor="middle" font-size="10">3</text><text class="fg-tag-good" x="40" y="98" text-anchor="middle" font-size="10">4</tex         title: 'D and L compare one stereocenter with glyceraldehyde.',
        bodyHtml: '<p class="step-body">Draw glyceraldehyde with CHO at the top. With its OH on the <b>right</b> it is <b>D-glyceraldehyde</b>, which is (R)-glyceraldehyde. With its OH on the left it is L-glyceraldehyde.</p><p class="step-body">A sugar is labeled at the stereocenter <b>furthest from the carbonyl</b>. With the carbonyl at the top, that is the lowest stereocenter, C5 in glucose. OH on the right means D.</p><p class="step-body">An amino acid is labeled at its <b>α carbon</b>, the carbon that carries NH₂, COOH, H and the side chain. With the <b>COOH at the top and the side chain at the bottom</b>, NH₂ on the left means L.</p><p class="step-body" style="margin-bottom:0;">D and L do not tell you R or S, or the direction of optical rotation. L-alanine is (S), but L-cysteine is (R), because its CH₂SH outranks COOH under the CIP rules.</p>',

        title: 'Count swaps at each stereocenter.',
        bodyHtml: '<p class="step-body">A second swap at the same center undoes the first. So an <b>even</b> number of swaps returns the molecule you started with, and an <b>odd</b> number gives its enantiomer. The safe cycle of three groups is two swaps in disguise.</p><p class="step-body" style="margin-bottom:0;">With more than one stereocenter, count at each center separately. Start from D-erythrose. One swap at C2 inverts C2 and leaves C3 alone, which gives D-threose, a diastereomer. One swap at each center inverts both, which gives the enantiomer, L-erythrose.</p>',
