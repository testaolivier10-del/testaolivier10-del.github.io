<script>
(function(){
  function fischerSvg(){
    return '<div class="scene"><svg viewBox="0 0 220 220">' +
      '<line x1="110" y1="30" x2="110" y2="190" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="30" y1="110" x2="190" y2="110" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="110" cy="110" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="110" y="115" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">C</text>' +
      '<g class="atom" data-key="top"><circle cx="110" cy="22" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="110" y="27" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">CHO</text></g>' +
      '<g class="atom" data-key="bottom"><circle cx="110" cy="198" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="110" y="203" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">CH₂OH</text></g>' +
      '<g class="atom" data-key="left"><circle cx="22" cy="110" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="22" y="115" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">H</text></g>' +
      '<g class="atom" data-key="right"><circle cx="198" cy="110" r="15" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="198" y="115" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">OH</text></g>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'fischer',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The drawing convention</h3><p class="step-body">A <b>Fischer projection</b> draws a stereocenter as a simple cross: a horizontal line and a vertical line crossing at the carbon (the carbon itself is usually left off, implied at the intersection). The convention that makes this work in 3D: <b>horizontal</b> lines represent bonds pointing <b>toward the viewer</b> (out of the page, like a wedge), and <b>vertical</b> lines represent bonds pointing <b>away from the viewer</b> (into the page, like a dash).</p>' +
      '<h3>Why this convention exists</h3><p class="step-body">This convention comes from drawing the molecule\'s carbon backbone in a specific curved, "C-shape" orientation — vertical bonds naturally point back and away, horizontal bonds naturally point forward. Chemists (originally Emil Fischer, working out carbohydrate structures) adopted this as a fast shorthand instead of drawing full 3D wedge-dash structures every time.</p>' +
      '<div class="notes-fact">Because the vertical bonds point away from you by convention, a Fischer projection\'s vertical-chain carbon (usually the highest-priority chain direction, like toward the CHO group in a sugar) is already oriented correctly for the R/S "lowest priority away from you" rule — as long as the lowest-priority group happens to be on a vertical position. If the lowest-priority group is on a horizontal position instead, use the flip-the-answer trick from the R/S lesson.</div>' +
      '<h3>Rules for manipulating a Fischer projection safely</h3><p class="step-body">Two operations preserve the actual stereochemistry (don\'t change what molecule you\'re looking at): <b>(1)</b> rotating the entire projection 180° in the plane of the page, and <b>(2)</b> holding one group fixed and rotating the other three amongst themselves. One operation that <b>breaks</b> it (silently converts the molecule into its enantiomer): swapping any two groups a single time, or rotating the whole projection 90°. Swapping two groups twice, however, gets you back to the original — an even number of swaps preserves the molecule, an odd number inverts it.</p>' +
      '<h3>Why Fischer projections are still used today</h3><p class="step-body">Fischer projections remain the standard way to draw sugars (carbohydrates) specifically because sugars often have many stereocenters in a single chain (glucose has four), and the vertical stacked-cross format makes comparing multiple stereocenters at a glance far easier than drawing repeated wedge-dash structures. You\'ll see this format used constantly if you continue into biochemistry.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Horizontal means toward you; vertical means away.',
        bodyHtml: '<p class="step-body">A <b>Fischer projection</b> draws a stereocenter as a simple cross — a vertical line and a horizontal line intersecting where the carbon sits (the carbon symbol itself is usually omitted). The convention that gives this flat cross real 3D meaning: <b>horizontal</b> bonds point <b>toward the viewer</b> (like a wedge, coming out of the page), and <b>vertical</b> bonds point <b>away from the viewer</b> (like a dash, going into the page).</p><p class="step-body" style="margin-bottom:0;">This isn\'t an arbitrary rule — it comes from the specific curved backbone orientation the original structure is drawn in before flattening it into the cross shape. You don\'t need to derive it each time; just remember horizontal = toward you, vertical = away.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the two groups on this Fischer projection that point toward you.</h2>' +
            '<p class="step-body">This is glyceraldehyde: CHO on top, CH₂OH on bottom, H and OH on the sides.</p>' +
            fischerSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Found: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0, mistake = false;
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              if(g.classList.contains('chosen')) return;
              g.classList.add('chosen');
              var key = g.getAttribute('data-key');
              if(key === 'left' || key === 'right'){
                found++;
                hint.textContent = 'Found: ' + found + ' / 2';
              } else {
                mistake = true;
                api.showFeedback(fb, false, 'That one is on the vertical line, which points away from you, not toward you. Keep looking at the horizontal (left/right) positions.');
              }
              if(found === 2){
                api.record(!mistake);
                if(!mistake) api.showFeedback(fb, true, 'Right — H and OH sit on the horizontal line, so both point toward you. CHO and CH₂OH sit on the vertical line, pointing away.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'In a Fischer projection, which bonds point away from the viewer?',
        options: ['Vertical bonds', 'Horizontal bonds', 'Neither — all bonds are in the plane of the page'],
        correctIndex: 0,
        correctFeedback: 'Correct — vertical lines represent bonds going into the page, away from you; horizontal lines come toward you.',
        wrongFeedback: 'It\'s the opposite — horizontal bonds point toward the viewer; vertical bonds point away.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Which manipulation of a Fischer projection secretly converts it into its enantiomer?',
        options: ['Swapping any two groups a single time', 'Rotating the whole projection 180° in the plane of the page', 'Holding one group fixed and rotating the other three'],
        correctIndex: 0,
        correctFeedback: 'Correct — a single swap of two groups inverts the actual stereochemistry, silently turning the molecule into its enantiomer. A 180° in-plane rotation, or rotating three groups around a fixed one, both preserve the original molecule.',
        wrongFeedback: 'A single swap is the dangerous operation — it inverts stereochemistry. In-plane 180° rotation and rotating three groups around a fixed one are both safe and preserve the molecule.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'An even number of swaps always gets you back to the original.',
        bodyHtml: '<p class="step-body">Since one swap of two groups inverts a Fischer projection\'s stereochemistry, it follows that <b>two</b> swaps restore it — the second swap undoes the inversion from the first. More generally: an <b>odd</b> number of single swaps inverts the molecule into its enantiomer, and an <b>even</b> number of swaps returns you to the original stereochemistry, no matter which specific groups you swapped each time.</p><p class="step-body" style="margin-bottom:0;">This is a genuinely useful trick when you\'re handed an unfamiliar-looking Fischer projection and need to check whether it matches a known structure — count the swaps needed to convert one into the other, and the parity (odd/even) tells you immediately whether they\'re the same compound or enantiomers.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is the format sugars are almost always drawn in.',
        bodyHtml: '<div class="explain-box">Glucose has four stereocenters in a single chain. Drawing all four as full 3D wedge-dash structures is cumbersome and hard to compare at a glance — stacking them as a single vertical Fischer projection, with each stereocenter\'s horizontal groups showing left/right at each level, is dramatically easier to read and compare. This is exactly why Fischer projections, despite being a flattened 2D shorthand, remain the standard notation for carbohydrate stereochemistry in biochemistry.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'You need to compare two Fischer projections and determine if they represent the same molecule or enantiomers. You find it takes exactly 3 single-group swaps to convert one into the other. What\'s the relationship?',
        options: ['Enantiomers — an odd number of swaps inverts the stereochemistry', 'The same molecule — any number of swaps eventually returns the original', 'Diastereomers — 3 swaps always means partial inversion'],
        correctIndex: 0,
        correctFeedback: 'Correct — 3 is odd, and each individual swap inverts the configuration, so an odd total number of swaps leaves the molecule as the enantiomer of where it started.'
      }
    ]
  });
})();
</script>
