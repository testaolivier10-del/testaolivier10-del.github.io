    <h1 style="margin-bottom:4px;">Acetals &amp; hemiacetals.</h1>
    <p class="lede" style="margin-top:0;">Two additions of an alcohol, one resonance-stabilized cation in between — and a way to make a carbonyl temporarily disappear.</p>
  </div>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'acetals',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>Step one: hemiacetal formation</h3><p class="step-body">Under acid catalysis, the carbonyl oxygen is protonated first, making the carbonyl carbon an even stronger electrophile (the same activation strategy as protonating an alcohol\'s OH, Module 8). An alcohol then attacks as the nucleophile — ordinary nucleophilic addition, exactly as in the previous lesson — forming a tetrahedral intermediate that, after losing the proton from oxygen, is called a <b>hemiacetal</b>: a carbon bonded to both an OH and an OR group.</p>' +
      '<h3>Step two: loss of water forms an oxocarbenium ion</h3><p class="step-body">Under continued acid catalysis, the hemiacetal\'s OH is protonated and leaves as water (exactly like alcohol dehydration, Module 8) — but the resulting carbocation is special: it\'s directly stabilized by resonance donation from the adjacent oxygen\'s lone pair, forming an <b>oxocarbenium ion</b> (a resonance hybrid between a carbocation and an oxygen-stabilized C=O⁺ form). This resonance stabilization (parallel to the allylic/benzylic stabilization you\'ll see formalized in Aromatic Chemistry) is why this normally-unfavorable ionization proceeds readily under mild acid catalysis.</p>' +
      '<div class="notes-fact">The oxocarbenium ion is dramatically more stable than an ordinary alkyl carbocation because the adjacent oxygen lone pair can fully delocalize into the empty p orbital — the positive charge is really shared between carbon and oxygen, not localized on carbon alone.</div>' +
      '<h3>Step three: a second alcohol completes the acetal</h3><p class="step-body">A second equivalent of alcohol then attacks the oxocarbenium ion (nucleophilic addition to this cation, not to a neutral carbonyl), and losing the final proton gives the <b>acetal</b>: a carbon bonded to two OR groups (no OH remaining). Every step in this sequence is reversible — running the whole process in reverse (acetal + water + acid catalyst) regenerates the original carbonyl plus two equivalents of alcohol.</p>' +
      '<h3>Why acetals matter: protecting groups</h3><p class="step-body">A carbonyl is reactive toward nucleophiles (Nucleophilic Addition lesson), strong reducing agents (LiAlH₄), Grignards, and many other reagents you\'ll want to use elsewhere in a molecule during a multi-step synthesis. Converting it to an acetal temporarily removes that reactivity entirely — acetals are stable to base, to nucleophiles, and to reducing agents, reacting only under aqueous acid. This lets a chemist "protect" a carbonyl, perform unrelated chemistry elsewhere in the molecule, and then "deprotect" (hydrolyze the acetal back to the carbonyl) with dilute aqueous acid once that other chemistry is done — an essential practical strategy anywhere a molecule has more than one reactive functional group.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A hemiacetal is one alcohol addition away from a carbonyl.',
        bodyHtml: '<p class="step-body">Under acid catalysis, a carbonyl\'s oxygen is protonated first — this pumps up the carbonyl carbon\'s electrophilicity even further (the same protonation-as-activation strategy from alcohol and ether chemistry, Module 8). An alcohol then attacks as the nucleophile in an ordinary nucleophilic addition (previous lesson), forming a tetrahedral intermediate.</p><p class="step-body" style="margin-bottom:0;">Once that intermediate loses its extra proton, you have a <b>hemiacetal</b>: a single carbon bonded to both an <b>OH</b> and an <b>OR</b> group. "Hemi" (half) signals that this is only halfway to the fully substituted product — one more alcohol addition still needs to happen.</p>'
      },
      {
        render: function(api){
          var stages = [
            { key: 'protonate', label: 'Carbonyl oxygen is protonated by acid' },
            { key: 'attack1', label: 'First alcohol attacks the carbon, forming a hemiacetal' },
            { key: 'oxo', label: 'The hemiacetal OH leaves as water, forming a resonance-stabilized oxocarbenium ion' },
            { key: 'attack2', label: 'A second alcohol attacks the oxocarbenium ion, forming the acetal' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the four stages of acetal formation in the correct order.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + stages.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 4</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['protonate', 'attack1', 'oxo', 'attack2'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var key = btn.getAttribute('data-v');
              if(key === order[idx]){
                btn.disabled = true;
                btn.classList.add('correct');
                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 4';
                if(idx === 4){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. Protonate, first addition (hemiacetal), ionize to the oxocarbenium ion, then a second addition (acetal).' : 'Exactly right — this four-stage sequence, run twice through essentially the same nucleophilic-addition idea, is the complete acetal-formation mechanism.');
                  next.disabled = false;
                }
              } else {
                mistake = true;
                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A hemiacetal carbon is bonded to which two oxygen-containing groups?',
        options: ['One OH and one OR group', 'Two OR groups', 'Two OH groups'],
        correctIndex: 0,
        correctFeedback: 'Correct — "hemi" (half) reflects that only one of the two alcohol additions has happened so far.',
        wrongFeedback: 'Two OR groups describes the full acetal; two OH groups describes the hydrate from the Aldehydes & Ketones lesson. A hemiacetal has one of each.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The oxocarbenium ion is a carbocation stabilized by an adjacent oxygen lone pair.',
        bodyHtml: '<p class="step-body">Losing water from the protonated hemiacetal would ordinarily just give a plain, high-energy alkyl carbocation. But here, the oxygen still attached to that carbon has a lone pair perfectly positioned to donate into the empty p orbital — exactly the kind of resonance donation from the Resonance lesson. The result, called an <b>oxocarbenium ion</b>, is a genuine resonance hybrid: part carbocation, part C=O⁺ with the positive charge shared onto oxygen.</p><p class="step-body" style="margin-bottom:0;">This resonance stabilization is dramatic — it\'s the reason this ionization step, which would otherwise be highly unfavorable for a simple alkyl system, proceeds smoothly under mild acid catalysis. It\'s the same "adjacent lone pair stabilizes a cation" logic you\'ll see generalized when aromaticity and conjugation are covered later in the course.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why is the oxocarbenium ion so much more stable than an ordinary alkyl carbocation?',
        options: ['The adjacent oxygen\'s lone pair donates into the empty p orbital by resonance, delocalizing the positive charge onto oxygen', 'Oxygen is negatively charged, which automatically stabilizes anything nearby', 'It isn\'t more stable — it just forms faster'],
        correctIndex: 0,
        correctFeedback: 'Correct — resonance donation from the adjacent oxygen lone pair spreads the positive charge over two atoms instead of concentrating it on carbon alone.',
        wrongFeedback: 'The oxygen here is neutral (not negatively charged) — the stabilization comes specifically from resonance donation of its lone pair into the cation\'s empty p orbital.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Acetals are protecting groups — a reversible way to "turn off" a reactive carbonyl.',
        bodyHtml: '<div class="explain-box">A carbonyl reacts with nucleophiles, Grignards, and strong reducing agents — exactly the reagents a chemist often needs to use elsewhere in a complex molecule during a multi-step synthesis. Converting the carbonyl to an acetal removes that reactivity almost completely: acetals are stable to base, to nucleophiles, and to reducing agents, and only react under aqueous acid. A chemist can protect a carbonyl as its acetal, run other reactions safely elsewhere in the molecule, then simply add dilute aqueous acid at the end to hydrolyze the acetal straight back to the original carbonyl — every step in acetal formation being reversible is exactly what makes this "protect, then deprotect" strategy work.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'An acetal-protected ketone is treated with LiAlH₄, a strong reducing agent, then with dilute aqueous acid. What happens?',
        options: ['LiAlH₄ leaves the acetal untouched; the aqueous acid step afterward hydrolyzes it back to the original ketone, unreduced', 'LiAlH₄ reduces the acetal directly to an alcohol', 'The acetal is destroyed immediately on contact with any reducing agent'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is exactly the protecting-group strategy in action: the acetal shields the carbonyl from LiAlH₄, and only the final aqueous acid step reveals the (unreduced) ketone again.',
        wrongFeedback: 'The entire point of an acetal protecting group is that it resists reducing agents like LiAlH₄ — it only reacts back to the carbonyl under aqueous acid.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A synthesis requires reducing an ester elsewhere in a molecule with LiAlH₄ without touching a ketone also present. What strategy should the chemist use?',
        options: ['Protect the ketone as an acetal first, run the LiAlH₄ reduction, then hydrolyze the acetal back to the ketone with aqueous acid', 'Use NaBH₄ instead, since it never reduces ketones', 'There is no way to selectively reduce only the ester in the presence of a ketone'],
        correctIndex: 0,
        correctFeedback: 'Correct — acetal protection is exactly this kind of selective-reactivity problem: shield the more reactive carbonyl (the ketone) with an acetal, do the reduction that would otherwise also touch it, then deprotect afterward. (NaBH₄ would actually reduce the ketone, not spare it.)'
      }
    ]
  });
})();
</script>
