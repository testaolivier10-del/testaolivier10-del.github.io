    <h1 style="margin-bottom:4px;">Aromaticity.</h1>
    <p class="lede" style="margin-top:0;">Four simple structural rules separate a molecule with extraordinary, unique stability from an ordinary alkene — or from something actively destabilized.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'aromaticity',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('benzene', { caption: 'Six sp² carbons, six p orbitals, six electrons in one continuous ring — the 4n+2 count that makes benzene aromatic rather than merely conjugated.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Four requirements, all at once: cyclic, conjugated, planar, and 4n+2.',
        bodyHtml: '<p class="step-body">A molecule is aromatic only if it satisfies all four structural requirements simultaneously. It must be a closed ring — cyclic. Every ring atom must contribute a p orbital to an unbroken pi system — fully conjugated, which one sp³ carbon anywhere in the ring is enough to break. The ring must be planar enough for all those p orbitals to line up and overlap. And it must contain exactly 4n+2 pi electrons for some whole number n — that is 2, 6, 10, 14, and so on.</p><p class="step-body" style="margin-bottom:0;">Benzene is the textbook example: a six-membered ring, fully conjugated (all six carbons sp²), planar, with 6 pi electrons (n=1, so 4(1)+2=6). Meeting all four conditions at once produces a molecule with dramatically more stability than its Lewis structure alone would suggest.</p>'
      },
      {
        render: function(api){
          var items = [
            { key: 'benzene', label: 'Benzene: cyclic, 6 sp² carbons, planar, 6 pi electrons', v: 'aromatic' },
            { key: 'cot', label: 'Planar cyclooctatetraene: cyclic, 8 sp² carbons, planar, 8 pi electrons', v: 'antiaromatic' },
            { key: 'cyclohexadiene', label: '1,3-cyclohexadiene: cyclic, but 2 of 6 carbons are sp³ (breaking conjugation)', v: 'nonaromatic' },
            { key: 'cyclopentadienyl', label: 'Cyclopentadienyl anion: cyclic, 5 sp² carbons, planar, 6 pi electrons', v: 'aromatic' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Classify each ring: aromatic, antiaromatic, or nonaromatic.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + items.map(function(it, i){
              return '<div style="margin-bottom:10px;"><div style="font:700 13px var(--font-ui);margin-bottom:6px;">' + it.label + '</div>' +
                '<div style="display:flex;gap:8px;">' +
                  '<button class="choice-btn opt" data-g="g' + i + '" data-v="aromatic">Aromatic</button>' +
                  '<button class="choice-btn opt" data-g="g' + i + '" data-v="antiaromatic">Antiaromatic</button>' +
                  '<button class="choice-btn opt" data-g="g' + i + '" data-v="nonaromatic">Nonaromatic</button>' +
                '</div></div>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin:10px 0 16px;">Correct: 0 / 4</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var correctCount = 0, mistake = false, groupsDone = {};
          api.card.querySelectorAll('.opt').forEach(function(btn){
            btn.addEventListener('click', function(){
              var g = btn.getAttribute('data-g');
              if(groupsDone[g]) return;
              groupsDone[g] = true;
              var gi = parseInt(g.replace('g',''), 10);
              api.card.querySelectorAll('.opt[data-g="' + g + '"]').forEach(function(b){ b.disabled = true; });
              var isCorrect = btn.getAttribute('data-v') === items[gi].v;
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              if(isCorrect) correctCount++; else mistake = true;
              hint.textContent = 'Correct: ' + correctCount + ' / 4';
              if(Object.keys(groupsDone).length === 4){
                api.record(!mistake);
                api.showFeedback(fb, !mistake, mistake ? 'Close — remember: 4n+2 pi electrons in a cyclic, conjugated, planar ring is aromatic; 4n electrons under the same conditions is antiaromatic; breaking any of cyclic/conjugated/planar makes it simply nonaromatic.' : 'Exactly right — this covers all three categories: benzene and the cyclopentadienyl anion are both aromatic (6 pi electrons each, satisfying 4n+2 with n=1), planar cyclooctatetraene would be antiaromatic (8 pi electrons, 4n with n=2), and 1,3-cyclohexadiene is simply nonaromatic since its ring isn\'t fully conjugated.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why does the cyclopentadienyl anion (5 carbons, 6 pi electrons after gaining a negative charge) count as aromatic, even though it isn\'t a 6-membered ring like benzene?',
        options: ['It isn\'t actually aromatic — only 6-membered rings can be aromatic', 'Hückel\'s rule only cares about the pi electron count (4n+2) and the other three structural requirements — ring size itself isn\'t part of the rule', 'Any ring with an odd number of carbons is automatically aromatic'],
        correctIndex: 1,
        correctFeedback: 'Correct — aromaticity is defined by electron count and structure (cyclic, conjugated, planar, 4n+2), not by any specific ring size; 5-, 6-, and 7-membered aromatic rings all exist.',
        wrongFeedback: 'Ring size and parity aren\'t what Hückel\'s rule tests — what matters is the pi electron count (4n+2) together with the cyclic/conjugated/planar requirements.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Benzene\'s real structure: six identical bonds, not alternating double and single.',
        bodyHtml: '<p class="step-body">If benzene\'s pi electrons were genuinely localized into three separate C=C double bonds alternating with three C–C single bonds (as one Kekulé structure suggests), you\'d expect to measure two distinct bond lengths around the ring. Instead, X-ray measurements show all six C–C bonds are exactly equal, at 1.39 Å — precisely between a typical single bond (~1.54 Å) and double bond (~1.34 Å).</p><p class="step-body" style="margin-bottom:0;">This is the same resonance-delocalization signature from the Resonance lesson, just extended around an entire six-membered ring instead of between two adjacent atoms. The true structure is a genuine average — a resonance hybrid — of the two equivalent Kekulé structures, and this complete delocalization is precisely what heats of hydrogenation quantify as benzene\'s roughly 36 kcal/mol of extra stability (resonance/aromatic stabilization energy) compared to a hypothetical non-delocalized "cyclohexatriene."</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'What direct physical evidence supports benzene\'s fully delocalized structure rather than three localized alternating double bonds?',
        options: ['Benzene is colorless', 'Benzene has a lower molecular weight than expected', 'All six C–C bond lengths are experimentally identical (1.39 Å), rather than showing two distinct short/long bond lengths'],
        correctIndex: 2,
        correctFeedback: 'Correct — uniform bond lengths around the ring is exactly the observable signature of complete pi-electron delocalization, not localized alternating double bonds.',
        wrongFeedback: 'Color and molecular weight aren\'t the relevant evidence here — bond-length measurement is the direct structural test for delocalization.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Antiaromaticity: same shape requirements, but actively destabilizing.',
        bodyHtml: '<p class="step-body">A ring that is cyclic, fully conjugated, and planar, but has exactly 4n pi electrons (4, 8, 12...) instead of 4n+2, is <b>antiaromatic</b>. The molecular-orbital filling pattern for a ring always has one lowest orbital followed by degenerate pairs; with a 4n electron count, one of those degenerate pairs ends up only half-filled (two electrons, two equal-energy orbitals to put them in), an unstable, high-energy, radical-like arrangement.</p><p class="step-body" style="margin-bottom:0;">This destabilization is severe enough that real molecules often distort out of planarity specifically to escape it — cyclooctatetraene (which would be antiaromatic with 8 pi electrons if perfectly flat) instead adopts a non-planar, "tub" shape, sacrificing full conjugation and planarity (two of the four aromaticity requirements) rather than pay the antiaromatic destabilization penalty.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'Why does cyclooctatetraene adopt a non-planar "tub" shape instead of staying flat?',
        options: ['Staying planar with 8 pi electrons (a 4n count) would make it antiaromatic and severely destabilized, so puckering out of planarity avoids that penalty', 'Carbon rings larger than six atoms are physically incapable of being planar', 'It has too few hydrogens to stay flat'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is a direct, real-world consequence of how severe antiaromatic destabilization actually is: the molecule "chooses" to break planarity/conjugation rather than exist as an antiaromatic system.',
        wrongFeedback: 'Ring size alone doesn\'t prevent planarity — larger aromatic rings do exist and stay planar. The specific reason here is avoiding antiaromatic destabilization.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Cyclopropenyl cation (a 3-membered ring, all three carbons sp², 2 pi electrons total) — is it aromatic, antiaromatic, or nonaromatic?',
        options: ['Antiaromatic — any ring smaller than benzene is automatically antiaromatic', 'Aromatic — cyclic, fully conjugated, planar, and 2 pi electrons satisfies 4n+2 with n=0', 'Nonaromatic — three-membered rings can never be aromatic'],
        correctIndex: 1,
        correctFeedback: 'Correct — n=0 is a perfectly valid integer in 4n+2 (giving exactly 2), so this small, unusual-looking ring genuinely satisfies Hückel\'s rule and is aromatic, despite its small size and positive charge.'
      }
    ]
  });
})();
</script>
