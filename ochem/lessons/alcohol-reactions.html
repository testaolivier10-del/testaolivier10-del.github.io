<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'alcohol-reactions',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('ethanol', { caption: 'Ethanol. As drawn, OH is a terrible leaving group — hydroxide is far too strong a base to leave. Every substitution reaction of an alcohol begins by fixing that, usually by protonating the oxygen first.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Hydroxide is a bad leaving group — so alcohols need activation first.',
        bodyHtml: '<p class="step-body">Recall the leaving-group rule from Module 2: a good leaving group is the conjugate base of a <b>strong</b> acid. OH⁻ is the conjugate base of water, and water (pKa ≈ 15.7) is a weak acid — which makes hydroxide a strong, reactive base and a poor leaving group. Left alone, an alcohol\'s C–O bond simply will not break the way a C–Br bond does in the SN2/SN1/E1/E2 mechanisms from Module 6.</p><p class="step-body" style="margin-bottom:0;">That doesn\'t mean alcohols are unreactive — it means every useful alcohol reaction begins with converting OH into a much better leaving group first, by one of two routes: protonation, or conversion to a sulfonate ester.</p>'
      },
      {
        render: function(api){
          var options = [
            { key: 'oh2', label: 'OH₂⁺ (protonated water)', good: true },
            { key: 'ots', label: 'OTs (tosylate)', good: true },
            { key: 'oh', label: 'OH⁻ (hydroxide, unmodified)', good: false },
            { key: 'nh2', label: 'NH₂⁻ (amide ion)', good: false }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the two groups below that are good leaving groups.</h2>' +
            '<p class="step-body">A good leaving group is the conjugate base of a strong acid — stable once it takes the electrons and departs.</p>' +
            '<div class="choice-row">' + options.map(function(o){
              return '<button class="choice-btn" data-v="' + o.key + '">' + o.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Good leaving groups found: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var o = options.filter(function(x){ return x.key === btn.getAttribute('data-v'); })[0];
              btn.disabled = true;
              if(o.good){
                btn.classList.add('correct');
                found++;
                hint.textContent = 'Good leaving groups found: ' + found + ' / 2';
              } else {
                btn.classList.add('wrong');
                mistake = true;
              }
              if(found === 2){
                api.record(!mistake);
                api.showFeedback(fb, !mistake, mistake ? 'You found both real leaving groups, but also picked something that isn\'t one — OH⁻ and NH₂⁻ are both strong bases (conjugate bases of weak acids), which makes them poor leaving groups.' : 'Exactly right — OH₂⁺ (conjugate base of H₃O⁺, pKa ≈ −1.7) and OTs (conjugate base of a strong sulfonic acid) are both excellent leaving groups. Plain OH⁻ and NH₂⁻ are strong bases, not good leaving groups.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Protonating an alcohol\'s OH under acidic conditions converts it into a good leaving group because...',
        options: ['Protonation makes the C–O bond physically longer', 'Acid always makes any bond easier to break', 'It becomes neutral water, the conjugate base of H₃O⁺ (pKa ≈ −1.7), an excellent leaving group'],
        correctIndex: 2,
        correctFeedback: 'Correct — OH₂⁺ leaves as neutral water, and water is the conjugate base of the very strong acid H₃O⁺, making it an excellent leaving group.',
        wrongFeedback: 'It\'s specifically about what leaves and what its conjugate-acid relationship is — protonation turns OH into OH₂⁺, whose departure product (water) is the conjugate base of a strong acid.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Tosylation: a mild alternative that preserves stereochemistry.',
        bodyHtml: '<p class="step-body">Reacting an alcohol with tosyl chloride (TsCl, or mesyl chloride MsCl) swaps the O–H hydrogen for a sulfonate group, forming a <b>tosylate (OTs)</b> or mesylate (OMs). This reaction only touches the O–H bond, never the C–O bond, so whatever stereochemistry existed at the carbinol carbon is completely preserved through this step — any inversion of configuration happens later, during the actual substitution reaction at that carbon.</p><p class="step-body" style="margin-bottom:0;">OTs and OMs are excellent leaving groups (conjugate bases of strong sulfonic acids, similar in leaving-group ability to a halide), and because tosylation runs under mild, non-acidic, non-carbocation-forming conditions, it\'s the standard way to set up a clean, predictable SN2 reaction (with full inversion, as in the SN2 lesson) at a known stereocenter.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why is tosylation often preferred over simple protonation/acid conditions when a stereocenter is involved?',
        options: ['Tosylation only modifies the O–H bond (preserving the stereocenter\'s configuration going in), setting up a clean, predictable SN2 at that carbon', 'Tosylate is a worse leaving group, which slows the reaction down for safety', 'Acidic conditions always racemize every molecule they touch'],
        correctIndex: 0,
        correctFeedback: 'Correct — tosylation doesn\'t touch the C–O bond, so it doesn\'t disturb the stereocenter itself, letting you cleanly control the subsequent substitution step.',
        wrongFeedback: 'Tosylate is actually an excellent leaving group, not a worse one — the real advantage is that tosylation leaves the stereocenter\'s starting configuration completely undisturbed.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Oxidation is a ladder — and where you stop depends on the alcohol\'s class.',
        bodyHtml: '<p class="step-body">Oxidizing an alcohol removes a C–H bond from the carbinol carbon (the carbon bearing OH) and forms a C=O. A <b>primary alcohol</b> has two C–H bonds available there, so it can climb two rungs: first to an <b>aldehyde</b>, then further to a <b>carboxylic acid</b>. A milder, selective reagent like PCC stops cleanly at the aldehyde; a strong oxidant (Jones reagent CrO₃/H₂SO₄, KMnO₄, Na₂Cr₂O₇) pushes all the way to the acid.</p><p class="step-body" style="margin-bottom:0;">A <b>secondary alcohol</b> has only one C–H at the carbinol carbon, so it can climb exactly one rung — to a <b>ketone</b> — and stops there; a ketone has no further C–H at that carbon to remove. A <b>tertiary alcohol</b> has zero C–H bonds at the carbinol carbon (all three other bonds go to carbon), so it simply <b>cannot be oxidized</b> by these reagents at all.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Check Understanding',
        title: 'A tertiary alcohol is treated with Jones reagent (CrO₃/H₂SO₄). What happens?',
        options: ['It oxidizes cleanly to a ketone', 'Nothing — there\'s no C–H bond on the carbinol carbon to remove', 'It oxidizes all the way to a carboxylic acid'],
        correctIndex: 1,
        correctFeedback: 'Correct — with all three other substituents on the carbinol carbon being carbon groups, there\'s no hydrogen left to remove, so no oxidation can occur there.',
        wrongFeedback: 'Oxidation of an alcohol at that carbon requires removing a C–H bond from the carbinol carbon — a tertiary alcohol simply doesn\'t have one to give up.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A secondary alcohol is treated with PCC. What product forms, and can it be oxidized further by more PCC?',
        options: ['A carboxylic acid forms directly', 'An aldehyde forms, which further oxidizes to a carboxylic acid', 'A ketone forms, and it cannot be oxidized further — there\'s no remaining C–H at that carbon'],
        correctIndex: 2,
        correctFeedback: 'Correct — a secondary alcohol has exactly one C–H at the carbinol carbon, so it oxidizes once to a ketone and stops there permanently; ketones have no further C–H to remove.'
      }
    ]
  });
})();
</script>
