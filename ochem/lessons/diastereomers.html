<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'diastereomers',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('chair-dimethylcyclohexane', { caption: 'Two stereocenters, and this is the trans isomer. The cis isomer differs at exactly one of them — same connectivity, not mirror images: diastereomers.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Diastereomers need at least two stereocenters to exist.',
        bodyHtml: '<p class="step-body">With only one stereocenter, a molecule has exactly two stereoisomers — a pair of enantiomers, mirror images of each other. Once a molecule has <b>two or more</b> stereocenters, a new relationship becomes possible: <b>diastereomers</b> — stereoisomers that are <i>not</i> mirror images of each other.</p><p class="step-body" style="margin-bottom:0;">The rule that distinguishes the two relationships: inverting <b>every</b> stereocenter in a molecule gives its <b>enantiomer</b> (the complete mirror image). Inverting <b>some, but not all</b>, of the stereocenters gives a <b>diastereomer</b> — same configuration at some centers, opposite at others.</p>'
      },
      {
        render: function(api){
          var options = [
            { key: 'both', label: 'Flip both stereocenter 1 and stereocenter 2', correct: 'enantiomer' },
            { key: 'one', label: 'Flip only stereocenter 1, leave stereocenter 2 unchanged', correct: 'diastereomer' },
            { key: 'neither', label: 'Flip neither — leave the molecule unchanged', correct: 'same' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">A molecule has two stereocenters. Click the operation that produces a diastereomer.</h2>' +
            '<p class="step-body">Think about how many stereocenters you\'re inverting relative to the total.</p>' +
            '<div class="choice-row">' + options.map(function(o){
              return '<button class="choice-btn" data-v="' + o.key + '">' + o.label + '</button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var o = options.filter(function(x){ return x.key === btn.getAttribute('data-v'); })[0];
              var isCorrect = o.correct === 'diastereomer';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Right — inverting only one of the two stereocenters (not both) gives a diastereomer. Inverting both would give the full enantiomer, and inverting neither gives back the identical starting molecule.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A molecule with 3 stereocenters is compared to a version with only stereocenter #2 inverted. What\'s the relationship?',
        options: ['Enantiomer — any inversion counts as the mirror image', 'Diastereomer — one of three centers is inverted, not all three', 'They are the same molecule'],
        correctIndex: 1,
        correctFeedback: 'Correct. Only a full inversion of every stereocenter produces the enantiomer — inverting any smaller subset (here, just one of three) produces a diastereomer.',
        wrongFeedback: 'The enantiomer requires inverting every single stereocenter — inverting just one out of three is a partial inversion, which defines a diastereomer instead.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Why do diastereomers have different melting points, unlike enantiomers?',
        options: ['They have different molecular formulas', 'Diastereomers actually do have identical melting points — this is a common myth', 'They aren\'t mirror images of each other, so there\'s no symmetry reason for their properties to match'],
        correctIndex: 2,
        correctFeedback: 'Correct. Enantiomers share properties specifically because mirror symmetry preserves them; diastereomers lack that mirror relationship, so they behave as genuinely different compounds.',
        wrongFeedback: 'Diastereomers share the same molecular formula (same atoms, same connectivity) — what differs is their 3D arrangement, and because they aren\'t mirror images, that different arrangement translates into different physical properties.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Cis/trans isomers are diastereomers wearing a familiar name.',
        bodyHtml: '<p class="step-body">You may already be familiar with cis and trans isomers of alkenes or disubstituted rings from earlier chemistry courses. These are actually a specific, common example of the diastereomer relationship: cis and trans isomers are stereoisomers of each other, and they are not mirror images. Consistent with the general rule, they have measurably different physical properties — cis-2-butene boils at 3.7°C, while trans-2-butene boils at 0.9°C, and the two have noticeably different dipole moments as well (cis has a net dipole; trans, being more symmetric, has little to none).</p><p class="step-body" style="margin-bottom:0;">Recognizing this connection means you don\'t need to learn "cis/trans" and "diastereomers" as two separate topics — cis/trans is diastereomerism applied to a double bond or ring, rather than to two independent sp³ stereocenters.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Diastereomers are separable by ordinary lab techniques — enantiomers aren\'t.',
        bodyHtml: '<div class="explain-box">Because diastereomers have genuinely different physical properties, chemists can separate a mixture of diastereomers using standard techniques — distillation (different boiling points), recrystallization (different solubilities), or column chromatography (different polarities). Separating a mixture of enantiomers, by contrast, requires a chiral resolving agent or a chiral chromatography column, since ordinary techniques can\'t distinguish molecules with identical physical properties. This distinction matters directly in pharmaceutical manufacturing, where isolating a single active enantiomer is often far more difficult and expensive than isolating a single diastereomer.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A chemist has a mixture of two diastereomers and needs to separate them. Which technique is most appropriate?',
        options: ['Ordinary recrystallization or chromatography — their different physical properties make separation straightforward', 'A specialized chiral resolving agent — required for any stereoisomer separation', 'Separation is impossible without breaking bonds'],
        correctIndex: 0,
        correctFeedback: 'Correct — since diastereomers have genuinely different physical properties (unlike enantiomers), they can be separated with standard, non-chiral laboratory techniques.'
      }
    ]
  });
})();
</script>
