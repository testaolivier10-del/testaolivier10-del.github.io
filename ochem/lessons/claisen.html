<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'claisen',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('methyl-acetate', { caption: 'Methyl acetate. Two of these condense in a Claisen — one supplies the enolate, the other supplies the carbonyl — and the methoxide that leaves at the end is what makes this a substitution rather than an aldol.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Same enolate nucleophile, but now the electrophile is an ester.',
        bodyHtml: '<p class="step-body">The Claisen condensation starts identically to the aldol reaction: base removes an alpha hydrogen, forming a resonance-stabilized enolate. The difference is what that enolate attacks — instead of a ketone or aldehyde undergoing simple addition, it attacks a <b>second ester molecule</b>, whose carbonyl carbon reacts by nucleophilic acyl substitution instead (the addition-elimination mechanism from the Acyl Substitution lesson).</p><p class="step-body" style="margin-bottom:0;">That means the tetrahedral intermediate here doesn\'t just get protonated — it collapses, expelling the ester\'s alkoxy group (RO⁻) and reforming a carbonyl. The product retains both original carbonyls (one as a ketone, one as an ester), now connected by a brand-new C–C bond: a <b>beta-ketoester</b>.</p>'
      },
      {
        render: function(api){
          var stages = [
            { key: 'deprot', label: 'Alkoxide base removes an ester alpha hydrogen, forming the ester enolate' },
            { key: 'attack', label: 'The enolate\'s carbon attacks a second ester\'s carbonyl carbon' },
            { key: 'collapse', label: 'The tetrahedral intermediate collapses, expelling RO⁻ and reforming a carbonyl' },
            { key: 'deprot2', label: 'The doubly-stabilized beta-ketoester product is deprotonated, driving the reaction to completion' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the four stages of the Claisen condensation in order.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + stages.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 4</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['deprot', 'attack', 'collapse', 'deprot2'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var key = btn.getAttribute('data-v');
              if(key === order[idx]){
                btn.disabled = true;
                btn.classList.add('correct');
                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 4';
                if(idx === 4){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. Deprotonate, attack, collapse (acyl substitution), then the final acidic deprotonation that pulls the whole equilibrium forward.' : 'Exactly right — this four-stage sequence combines enolate formation with acyl substitution, finished off by the driving-force deprotonation that makes the Claisen condensation go to completion.');
                  next.disabled = false;
                }
              } else {
                mistake = true;
                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why does the enolate\'s attack on a second ester molecule proceed by substitution rather than simple addition?',
        options: ['The ester carbonyl carbon has a leaving group (RO⁻) attached, so the tetrahedral intermediate collapses and expels it, exactly as in the Acyl Substitution lesson', 'Esters cannot undergo nucleophilic addition at all', 'The enolate is too weak a nucleophile to form a stable intermediate'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is the same addition-elimination logic from the Acyl Substitution lesson, just with a carbon nucleophile (the enolate) instead of an amine or water.',
        wrongFeedback: 'The determining factor is the leaving group attached to the ester carbonyl carbon — its presence is exactly what turns this into a substitution rather than a permanent addition.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A doubly-acidic proton is the driving force that pulls the whole reaction to completion.',
        bodyHtml: '<p class="step-body">Every step up through the tetrahedral-intermediate collapse is, on its own, an equilibrium — reversible in both directions, just like ordinary ester chemistry. What makes the Claisen condensation actually go to completion is what happens next: the beta-ketoester product has an alpha hydrogen flanked by <b>two</b> carbonyls (the ketone and the ester) at once, so its enolate is doubly resonance-stabilized, delocalizing into both carbonyl systems rather than just one.</p><p class="step-body" style="margin-bottom:0;">That extra stabilization drops the pKa to around 11 — acidic enough that the mild alkoxide base already present (pKa of its conjugate acid, an alcohol, ≈16) deprotonates it essentially completely. Once deprotonated, the anionic product can\'t reverse back through any of the earlier equilibrium steps, so it accumulates — pulling the entire sequence forward. A final aqueous acid workup simply protonates this stable anion to reveal the neutral product.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why is the beta-ketoester\'s alpha hydrogen (pKa ≈ 11) so much more acidic than an ordinary ketone\'s alpha hydrogen (pKa ≈ 20)?',
        options: ['Esters are inherently more acidic than ketones at every position', 'Its enolate is stabilized by resonance into two carbonyls simultaneously, instead of just one', 'The extra oxygen simply adds mass, which increases acidity'],
        correctIndex: 1,
        correctFeedback: 'Correct — doubling the number of carbonyls the enolate can delocalize into roughly doubles the resonance stabilization, which is exactly why this proton is so much more acidic.',
        wrongFeedback: 'It isn\'t a general property of esters or simply about mass — it\'s specifically about how many carbonyls the resulting enolate can delocalize its negative charge into.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Intramolecular Claisen (Dieckmann) reactions build rings.',
        bodyHtml: '<div class="explain-box">When both ester groups belong to the same molecule (a diester), the same mechanism can close a ring instead of joining two separate molecules — called a Dieckmann condensation. Just as the Cyclohexanes lesson showed that five- and six-membered rings are the least strained and most readily formed, Dieckmann condensations that produce five- or six-membered rings proceed far more readily than those that would form a very small or very large ring — ring-size preferences aren\'t unique to cyclohexane chemistry; they show up again here, in a completely different reaction context.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'A crossed Claisen condensation is attempted between two different esters, both bearing alpha hydrogens, with no special precautions taken. What outcome is most likely?',
        options: ['A single, perfectly clean product every time', 'No reaction occurs, since crossed Claisen reactions are impossible', 'A statistical mixture of multiple beta-ketoester products, since either ester could form the enolate and either could act as the electrophile'],
        correctIndex: 2,
        correctFeedback: 'Correct — exactly like the crossed aldol reaction, having two components both capable of forming an enolate (and both able to act as electrophile) leads to an unselective mixture unless a control strategy (no alpha hydrogens on one partner, or careful base/temperature control) is used.',
        wrongFeedback: 'Crossed Claisen reactions do occur, but without a selectivity strategy they give a mixture of products, not one single clean outcome.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Ethyl acetate is treated with NaOEt (sodium ethoxide), then the reaction is worked up with aqueous acid. Predict the general class of product.',
        options: ['A beta-ketoester — ethyl acetoacetate, formed by Claisen condensation of ethyl acetate\'s enolate with a second ethyl acetate molecule', 'A simple alcohol from ester reduction', 'The starting ester, unreacted, since NaOEt is too weak a base to deprotonate it'],
        correctIndex: 0,
        correctFeedback: 'Correct — this is the classic Claisen condensation of ethyl acetate with itself, giving ethyl acetoacetate: NaOEt is exactly matched to this ester\'s conjugate base, letting the reaction proceed and driving to completion via the doubly-acidic beta-ketoester deprotonation.'
      }
    ]
  });
})();
</script>
