document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'c-nmr',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Ethanol has two carbons, and its ¹³C spectrum shows two lines.',
        bodyHtml: '<p class="step-body">A ¹³C NMR spectrum works like a ¹H spectrum but records a molecule&rsquo;s carbons. Only 1.1% of natural carbon is ¹³C, the isotope NMR can detect, so the signal is weak.</p><p class="step-body">If the spectrum is recorded with nothing done to the hydrogens, each carbon is split by the hydrogens bonded to it, following the n + 1 rule. Ethanol&rsquo;s CH₃ carbon gives four lines, and its CH₂ carbon gives three. A routine spectrum uses <b>proton decoupling</b> to remove this. While recording the carbons, the instrument also sends in radio waves at the hydrogen frequency, which flip the hydrogens so quickly that each carbon feels only their average.</p><p class="step-body" style="margin-bottom:0;">Carbons almost never split each other, because two ¹³C atoms side by side turn up in only about one molecule in ten thousand. So a routine spectrum shows <b>one unsplit line for each distinct carbon environment</b>.</p>',
        diagramHtml: '<!-- fig:l-c-nmr-ethanol-decoupling:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 384" role="img" aria-label="Ethanol, CH3–CH2–OH, above two carbon-13 spectra on one shift axis. Without decoupling, the CH2 carbon at 58 ppm is a group of three lines and the CH3 carbon at 18 ppm is a group of four. With proton decoupling, each carbon is a single line at the same position."><line class="fg-bond" x1="117" y1="40" x2="153" y2="40"></line><line class="fg-bond" x1="187" y1="40" x2="224" y2="40"></line><circle class="fg-atom-hi" cx="100" cy="40" r="17"></circle><text class="fg-lbl" x="100" y="43.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom-hi" cx="170" cy="40" r="17"></circle><text class="fg-lbl" x="170" y="43.52" text-anchor="middle" font-size="9.5">CH₂</text><circle class="fg-atom" cx="240" cy="40" r="15"></circle><text class="fg-lbl" x="240" y="43.89" text-anchor="middle" font-size="10.5">OH</text><text class="fg-tag" x="12" y="96" text-anchor="start" font-size="11">Without decoupling</text><line class="fg-bond" x1="66.7" y1="200" x2="66.7" y2="172" stroke-width="2.6"></line><line class="fg-bond" x1="76.7" y1="200" x2="76.7" y2="144" stroke-width="2.6"></line><line class="fg-bond" x1="86.7" y1="200" x2="86.7" y2="172" stroke-width="2.6"></line><line class="fg-bond" x1="224" y1="200" x2="224" y2="179" stroke-width="2.6"></line><line class="fg-bond" x1="234" y1="200" x2="234" y2="137" stroke-width="2.6"></line><line class="fg-bond" x1="244" y1="200" x2="244" y2="137" stroke-width="2.6"></line><line class="fg-bond" x1="254" y1="200" x2="254" y2="179" stroke-width="2.6"></line><text class="fg-tag" x="76.69" y="128" text-anchor="middle" font-size="11">CH₂: 3 lines</text><text class="fg-tag" x="238.97" y="124" text-anchor="middle" font-size="11">CH₃: 4 lines</text><line class="fg-rule" x1="18" y1="200" x2="322" y2="200"></line><line class="fg-dash" x1="18" y1="216" x2="322" y2="216"></line><text class="fg-tag" x="12" y="236" text-anchor="start" font-size="11">With proton decoupling</text><line class="fg-bond" x1="76.7" y1="330" x2="76.7" y2="268" stroke-width="3"></line><line class="fg-bond" x1="239" y1="330" x2="239" y2="268" stroke-width="3"></line><text class="fg-tag" x="76.69" y="258" text-anchor="middle" font-size="11">CH₂, 58</text><text class="fg-tag" x="238.97" y="258" text-anchor="middle" font-size="11">CH₃, 18</text><line class="fg-rule" x1="18" y1="330" x2="322" y2="330"></line><line class="fg-rule" x1="68.57" y1="330" x2="68.57" y2="336"></line><text class="fg-tag" x="68.57" y="350" text-anchor="middle" font-size="11">60</text><line class="fg-rule" x1="149.71" y1="330" x2="149.71" y2="336"></line><text class="fg-tag" x="149.71" y="350" text-anchor="middle" font-size="11">40</text><line class="fg-rule" x1="230.86" y1="330" x2="230.86" y2="336"></line><text class="fg-tag" x="230.86" y="350" text-anchor="middle" font-size="11">20</text><line class="fg-rule" x1="312" y1="330" x2="312" y2="336"></line><text class="fg-tag" x="312" y="350" text-anchor="middle" font-size="11">0</text><text class="fg-tag-mut" x="170" y="372" text-anchor="middle" font-size="11">chemical shift (ppm)</text></svg><figcaption>On top, each carbon is split by its own hydrogens. Below, decoupling leaves one line per carbon.</figcaption></figure><!-- fig:l-c-nmr-ethanol-decoupling:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided practice',
        title: 'Recorded without decoupling, how many lines would a CH carbon give?',
        options: ['2 lines, split by its one hydrogen', '1 line, since a carbon is never split', '4 lines, like a CH₃ carbon'],
        correctIndex: 0,
        correctFeedback: 'Correct. One hydrogen on the carbon means n = 1, so the n + 1 rule gives two lines. Decoupling would merge them into one.',
        wrongFeedback: 'Without decoupling, the n + 1 rule applies with n counting the hydrogens on the carbon itself. A CH carbon has one, so it gives two lines. Four lines needs three hydrogens, as on a CH₃.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Line heights do not count carbons.',
        bodyHtml: '<p class="step-body">In a ¹H spectrum, the area under a signal counts hydrogens. A routine ¹³C spectrum has no such integration, because two effects distort the heights. Decoupling boosts each carbon&rsquo;s signal by an amount that depends on the hydrogens near it. And a carbon with no hydrogens recovers slowly between the instrument&rsquo;s rapid radio pulses, so its line comes out small.</p><p class="step-body" style="margin-bottom:0;">So count lines, not heights. Three lines do not come from your compound at all: the solvent, CDCl₃, gives three equal lines at 77 ppm. Its deuterium splits the carbon three ways, and the decoupler removes only hydrogen splitting. Cross these three lines off before you count.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Carbon shifts run from 0 to about 220 ppm.',
        bodyHtml: '<p class="step-body">Ethanol&rsquo;s CH₃ carbon sits at 18 ppm and its CH₂ carbon at 58. The CH₂ carbon is bonded to the oxygen, which pulls electron density away, so it is deshielded and sits further downfield. That is the same logic as in ¹H NMR, spread over a much wider scale.</p><p class="step-body">Above about 165 ppm, almost every line is a carbonyl carbon: 190&ndash;220 for a ketone or aldehyde, 165&ndash;185 for an ester, acid or amide. Plain sp³ carbons sit at 0&ndash;50, and alkene and aromatic carbons at 100&ndash;160.</p><p class="step-body" style="margin-bottom:0;">Alkyne carbons, at 65&ndash;90, sit between those two groups. The circulating pi electrons of the triple bond shield them, as the notes show.</p>',
        diagramHtml: '<!-- fig:l-c-nmr-ranges:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 440" role="img" aria-label="Carbon-13 shift ranges on an axis from 220 to 0 ppm: ketone or aldehyde C=O 190 to 220; ester, acid or amide C=O 165 to 185; aromatic 110 to 160; alkene 100 to 150; nitrile 115 to 125; alkyne 65 to 90; C next to O 50 to 90; C next to N 30 to 65; alkyl 0 to 50."><text class="fg-tag" x="113" y="24" text-anchor="middle" font-size="11">ketone / aldehyde C=O: 190–220</text><rect class="fg-fill-warn" x="20" y="32" width="40.9" height="14" rx="5"></rect><text class="fg-tag" x="122.9" y="66" text-anchor="middle" font-size="11">ester / acid / amide C=O: 165–185</text><rect class="fg-fill-warn" x="67.7" y="74" width="27.3" height="14" rx="5"></rect><text class="fg-tag" x="135.91" y="108" text-anchor="middle" font-size="11">aromatic C: 110–160</text><rect class="fg-fill-hi" x="101.8" y="116" width="68.2" height="14" rx="5"></rect><text class="fg-tag" x="149.55" y="150" text-anchor="middle" font-size="11">alkene C: 100–150</text><rect class="fg-fill-hi" x="115.5" y="158" width="68.2" height="14" rx="5"></rect><text class="fg-tag" x="156.36" y="192" text-anchor="middle" font-size="11">nitrile C≡N: 115–125</text><rect class="fg-fill-hi" x="149.5" y="200" width="13.6" height="14" rx="5"></rect><text class="fg-tag" x="214.32" y="234" text-anchor="middle" font-size="11">alkyne C: 65–90</text><rect class="fg-fill-good" x="197.3" y="242" width="34.1" height="14" rx="5"></rect><text class="fg-tag" x="224.55" y="276" text-anchor="middle" font-size="11">C next to O: 50–90</text><rect class="fg-fill-mut" x="197.3" y="284" width="54.5" height="14" rx="5"></rect><text class="fg-tag" x="255.23" y="318" text-anchor="middle" font-size="11">C next to N: 30–65</text><rect class="fg-fill-mut" x="231.4" y="326" width="47.7" height="14" rx="5"></rect><text class="fg-tag" x="283.1" y="360" text-anchor="middle" font-size="11">alkyl C: 0–50</text><rect class="fg-fill-mut" x="251.8" y="368" width="68.2" height="14" rx="5"></rect><line class="fg-rule" x1="20" y1="404" x2="320" y2="404"></line><line class="fg-rule" x1="47.27" y1="404" x2="47.27" y2="410"></line><text class="fg-tag" x="47.27" y="424" text-anchor="middle" font-size="11">200</text><line class="fg-rule" x1="115.45" y1="404" x2="115.45" y2="410"></line><text class="fg-tag" x="115.45" y="424" text-anchor="middle" font-size="11">150</text><line class="fg-rule" x1="183.64" y1="404" x2="183.64" y2="410"></line><text class="fg-tag" x="183.64" y="424" text-anchor="middle" font-size="11">100</text><line class="fg-rule" x1="251.82" y1="404" x2="251.82" y2="410"></line><text class="fg-tag" x="251.82" y="424" text-anchor="middle" font-size="11">50</text><line class="fg-rule" x1="320" y1="404" x2="320" y2="410"></line><text class="fg-tag" x="320" y="424" text-anchor="middle" font-size="11">0</text></svg><figcaption>Left is downfield. The two carbonyl rows sit on their own at the far left.</figcaption></figure><!-- fig:l-c-nmr-ranges:end -->'
      },
      {
        render: function(api){
          var items = [
            // Listed out of answer order: custom steps are not shuffled.
            { key: 'ketone', label: 'A ketone C=O carbon' },
            { key: 'alkyl', label: 'A plain sp³ carbon, as in an alkane' },
            { key: 'aromatic', label: 'An aromatic ring carbon' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Rank these three carbons from lowest to highest ¹³C chemical shift.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + items.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 3</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['alkyl', 'aromatic', 'ketone'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;

              if(key === order[idx]){

                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 3';
                if(idx === 3){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. Plain sp³ carbons sit furthest upfield (0&ndash;50 ppm), aromatic carbons in the middle (110&ndash;160 ppm), and a ketone C=O far downfield (190&ndash;220 ppm).' : 'Exactly right. The ketone C=O sits so far downfield, at 190&ndash;220 ppm, that a line there is the quickest sign of a carbonyl.');

              } else {

                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Guided practice',
        title: 'A ¹³C spectrum has a line at 205 ppm. Which kind of carbon most likely gives it?',
        options: ['An aromatic ring carbon', 'An sp³ carbon bonded to oxygen, as in an alcohol', 'A ketone or aldehyde C=O carbon'],
        correctIndex: 2,
        correctFeedback: 'Correct. 205 ppm falls in the 190&ndash;220 ppm range of ketone and aldehyde C=O carbons, well clear of everything else.',
        wrongFeedback: 'Aromatic carbons stop at about 160 ppm, and an sp³ carbon bonded to oxygen sits at 50&ndash;90. A line at 205 is in the ketone and aldehyde C=O range, 190&ndash;220 ppm.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Symmetry sets how many lines you see.',
        bodyHtml: '<p class="step-body">Acetone, CH₃COCH₃, has three carbons but gives only two lines. Its two methyls are <b>equivalent</b>: swapping them gives back the same molecule, so they share one line. This is the symmetry test from ¹H NMR, applied to carbons.</p><p class="step-body">To count on a ring, look for mirror planes. A <b>mirror plane</b> reflects one half of the molecule onto the other; here each one stands at right angles to the ring, so it is drawn edge-on as a dashed line. Carbons that a mirror swaps are equivalent.</p><p class="step-body" style="margin-bottom:0;">In <i>p</i>-xylene, number the ring with the methyls at C1 and C4. Mirror 1 runs through C1 and C4 and swaps C2 with C6 and C3 with C5. Mirror 2, at right angles to it, swaps C1 with C4 and C2 with C3. So all four ring CH carbons are equivalent, C1 and C4 are equivalent, and the two methyls are equivalent: <b>3 lines</b> for 8 carbons.</p>',
        diagramHtml: '<!-- fig:l-c-nmr-p-xylene:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 360" role="img" aria-label="p-Xylene with the ring numbered C1 to C6 and methyls on C1 and C4. Mirror 1 runs vertically through C1 and C4; mirror 2 runs horizontally, at right angles to it. Below: the two methyls give 1 line, C1 and C4 give 1 line, and C2, C3, C5 and C6 give 1 line, so 3 lines from 8 carbons."><line class="fg-dash-hi" x1="170" y1="270" x2="170" y2="30"></line><line class="fg-dash-hi" x1="60" y1="150" x2="280" y2="150"></line><line class="fg-bond" x1="170" y1="100" x2="213.3" y2="125"></line><line class="fg-bond" x1="173.76" y1="107.48" x2="204.94" y2="125.48"></line><line class="fg-bond" x1="213.3" y1="125" x2="213.3" y2="175"></line><line class="fg-bond" x1="213.3" y1="175" x2="170" y2="200"></line><line class="fg-bond" x1="204.94" y1="174.52" x2="173.76" y2="192.52"></line><line class="fg-bond" x1="170" y1="200" x2="126.7" y2="175"></line><line class="fg-bond" x1="126.7" y1="175" x2="126.7" y2="125"></line><line class="fg-bond" x1="131.3" y1="168" x2="131.3" y2="132"></line><line class="fg-bond" x1="126.7" y1="125" x2="170" y2="100"></line><line class="fg-bond" x1="170" y1="100" x2="170" y2="80"></line><circle class="fg-atom-hi" cx="170" cy="64" r="16"></circle><text class="fg-lbl" x="170" y="67.52" text-anchor="middle" font-size="9.5">CH₃</text><line class="fg-bond" x1="170" y1="200" x2="170" y2="220"></line><circle class="fg-atom-hi" cx="170" cy="236" r="16"></circle><text class="fg-lbl" x="170" y="239.52" text-anchor="middle" font-size="9.5">CH₃</text><text class="fg-tag" x="161.38" y="92.97" text-anchor="middle" font-size="11">1</text><text class="fg-tag" x="225.43" y="122" text-anchor="middle" font-size="11">2</text><text class="fg-tag" x="225.43" y="186" text-anchor="middle" font-size="11">3</text><text class="fg-tag" x="161.38" y="215.03" text-anchor="middle" font-size="11">4</text><text class="fg-tag" x="114.57" y="186" text-anchor="middle" font-size="11">5</text><text class="fg-tag" x="114.57" y="122" text-anchor="middle" font-size="11">6</text><text class="fg-tag" x="196" y="36" text-anchor="start" font-size="11">mirror 1</text><text class="fg-tag" x="22" y="142" text-anchor="start" font-size="11">mirror 2</text><text class="fg-tag" x="170" y="284" text-anchor="middle" font-size="11">both CH₃ carbons: 1 line</text><text class="fg-tag" x="170" y="304" text-anchor="middle" font-size="11">C1 and C4: 1 line</text><text class="fg-tag" x="170" y="324" text-anchor="middle" font-size="11">C2, C3, C5 and C6: 1 line</text><text class="fg-tag-warn" x="170" y="350" text-anchor="middle" font-size="11">3 lines from 8 carbons</text></svg><figcaption>Follow each dashed mirror and check which numbered carbons it swaps.</figcaption></figure><!-- fig:l-c-nmr-p-xylene:end -->'

      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'DEPT tells you how many hydrogens each carbon carries.',
        bodyHtml: '<p class="step-body">Decoupling throws away how many hydrogens sit on each carbon. <b>DEPT</b> (Distortionless Enhancement by Polarization Transfer) gets that back without bringing back splitting. It excites the hydrogens first and passes their signal on to the carbons they are bonded to.</p><p class="step-body">In <b>DEPT-135</b>, CH and CH₃ lines point <b>up</b>, and CH₂ lines point <b>down</b>. A carbon with no hydrogens receives no signal, so it is missing. NMR usage calls any such carbon &ldquo;quaternary&rdquo;, even a C=O carbon. <b>DEPT-90</b> shows only CH carbons, which separates CH from CH₃.</p><p class="step-body" style="margin-bottom:0;">Butan-2-one shows all three outcomes. Its C=O line at 209 ppm is in the routine spectrum but missing from both DEPT spectra.</p>',
        diagramHtml: '<!-- fig:l-c-nmr-dept:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 620" role="img" aria-label="Three spectra of butan-2-one on a broken shift axis, 220 to 190 then 50 to 0 ppm. Routine: lines at 209, 37, 29 and 8. DEPT-135: up at 29 and 8 (CH3), down at 37 (CH2), missing at 209 (C=O, no H). DEPT-90: no lines. Below, the molecule with each carbon labeled by its shift."><text class="fg-tag" x="12" y="30" text-anchor="start" font-size="11">Routine ¹³C: four lines</text><line class="fg-bond" x1="53.5" y1="130" x2="53.5" y2="64" stroke-width="3"></line><text class="fg-tag" x="53.47" y="56" text-anchor="middle" font-size="11">209</text><line class="fg-bond" x1="177.4" y1="130" x2="177.4" y2="64" stroke-width="3"></line><text class="fg-tag" x="177.4" y="56" text-anchor="middle" font-size="11">37</text><line class="fg-bond" x1="207.8" y1="130" x2="207.8" y2="64" stroke-width="3"></line><text class="fg-tag" x="207.8" y="56" text-anchor="middle" font-size="11">29</text><line class="fg-bond" x1="287.6" y1="130" x2="287.6" y2="64" stroke-width="3"></line><text class="fg-tag" x="287.6" y="56" text-anchor="middle" font-size="11">8</text><text class="fg-tag-warn" x="63.47" y="100" text-anchor="start" font-size="11">C=O</text><line class="fg-rule" x1="20" y1="130" x2="324" y2="130"></line><line class="fg-dash" x1="20" y1="156" x2="324" y2="156"></line><text class="fg-tag" x="12" y="182" text-anchor="start" font-size="11">DEPT-135</text><line class="fg-bond" x1="207.8" y1="262" x2="207.8" y2="208" stroke-width="3"></line><line class="fg-bond" x1="287.6" y1="262" x2="287.6" y2="208" stroke-width="3"></line><text class="fg-tag" x="207.8" y="200" text-anchor="middle" font-size="11">CH₃</text><text class="fg-tag" x="287.6" y="200" text-anchor="middle" font-size="11">CH₃</text><line class="fg-bond" x1="177.4" y1="262" x2="177.4" y2="308" stroke-width="3"></line><text class="fg-tag" x="177.4" y="324" text-anchor="middle" font-size="11">CH₂</text><line class="fg-dash" x1="53.5" y1="262" x2="53.5" y2="216"></line><text class="fg-tag-mut" x="61.47" y="232" text-anchor="start" font-size="11">missing</text><text class="fg-tag-mut" x="61.47" y="246" text-anchor="start" font-size="11">C=O: no H</text><line class="fg-rule" x1="20" y1="262" x2="324" y2="262"></line><line class="fg-dash" x1="20" y1="338" x2="324" y2="338"></line><text class="fg-tag" x="12" y="362" text-anchor="start" font-size="11">DEPT-90: only CH carbons</text><text class="fg-tag-mut" x="172" y="396" text-anchor="middle" font-size="11">no lines: there is no CH</text><line class="fg-rule" x1="20" y1="416" x2="324" y2="416"></line><line class="fg-rule" x1="20" y1="442" x2="100" y2="442"></line><line class="fg-rule" x1="122" y1="442" x2="324" y2="442"></line><line class="fg-bond-soft" x1="100" y1="448" x2="108" y2="436"></line><line class="fg-bond-soft" x1="114" y1="448" x2="122" y2="436"></line><line class="fg-rule" x1="30" y1="442" x2="30" y2="448"></line><text class="fg-tag" x="30" y="462" text-anchor="middle" font-size="11">220</text><line class="fg-rule" x1="72.67" y1="442" x2="72.67" y2="448"></line><text class="fg-tag" x="72.67" y="462" text-anchor="middle" font-size="11">200</text><line class="fg-rule" x1="128" y1="442" x2="128" y2="448"></line><text class="fg-tag" x="128" y="462" text-anchor="middle" font-size="11">50</text><line class="fg-rule" x1="223" y1="442" x2="223" y2="448"></line><text class="fg-tag" x="223" y="462" text-anchor="middle" font-size="11">25</text><line class="fg-rule" x1="318" y1="442" x2="318" y2="448"></line><text class="fg-tag" x="318" y="462" text-anchor="middle" font-size="11">0</text><text class="fg-tag-mut" x="170" y="482" text-anchor="middle" font-size="11">chemical shift (ppm), axis broken</text><line class="fg-bond" x1="88" y1="562" x2="122" y2="562"></line><line class="fg-bond" x1="152" y1="562" x2="186" y2="562"></line><line class="fg-bond" x1="220" y1="562" x2="252" y2="562"></line><line class="fg-bond" x1="133" y1="547" x2="133" y2="531"></line><line class="fg-bond" x1="141" y1="547" x2="141" y2="531"></line><circle class="fg-atom" cx="71" cy="562" r="17"></circle><text class="fg-lbl" x="71" y="565.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom-warn" cx="137" cy="562" r="16"></circle><text class="fg-lbl" x="137" y="566.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="203" cy="562" r="17"></circle><text class="fg-lbl" x="203" y="565.52" text-anchor="middle" font-size="9.5">CH₂</text><circle class="fg-atom" cx="269" cy="562" r="17"></circle><text class="fg-lbl" x="269" y="565.52" text-anchor="middle" font-size="9.5">CH₃</text><circle class="fg-atom" cx="137" cy="516" r="15"></circle><text class="fg-lbl" x="137" y="520.44" text-anchor="middle" font-size="12">O</text><text class="fg-tag" x="71" y="598" text-anchor="middle" font-size="11">29 ppm</text><text class="fg-tag" x="137" y="598" text-anchor="middle" font-size="11">209 ppm</text><text class="fg-tag" x="203" y="598" text-anchor="middle" font-size="11">37 ppm</text><text class="fg-tag" x="269" y="598" text-anchor="middle" font-size="11">8 ppm</text></svg><figcaption>Lines point up for CH₃ or CH and down for CH₂. A carbon with no H is missing, and DEPT-90 keeps only CH.</figcaption></figure><!-- fig:l-c-nmr-dept:end -->'
