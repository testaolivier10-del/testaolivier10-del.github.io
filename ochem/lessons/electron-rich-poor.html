<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred

document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'electron-rich-poor',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'It all comes down to where the electron density is.',
        bodyHtml: '<p class="step-body">An <b>electron-rich</b> atom has extra electron density available — a lone pair, a negative charge, or a π bond — and tends to act as a <b>nucleophile</b>. An <b>electron-poor</b> atom has a deficit of electron density — a positive charge, a partial positive from a nearby electronegative atom, or an empty orbital — and tends to act as an <b>electrophile</b>.</p><p class="step-body" style="margin-bottom:0;">This is the same idea as electronegativity and bond polarity from <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-foundations\">Foundations</a>, just applied to predict how a molecule will react.</p>'
      },
      {
        render: function(api){
          var scenes = [
            {
              label: 'CH₃–Cl', correctIsRich: false, prompt: 'Click the electron-poor atom.',
              html: '<div class="scene"><svg viewBox="0 0 200 90"><text x="20" y="55" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="16">CH₃</text><line x1="66" y1="45" x2="120" y2="45" stroke="var(--line)" stroke-width="2.5"/><g class="atom" data-key="c"><circle cx="60" cy="45" r="16" fill="transparent" stroke="none"/></g><g class="atom" data-key="cl"><circle cx="150" cy="45" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="150" y="51" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">Cl</text></g></svg></div>',
              key: 'c', wrongKey: 'cl',
              feedback: 'Correct — chlorine\'s electronegativity pulls density away from carbon, leaving carbon δ+ and electron-poor.'
            },
            {
              label: ':NH₃', correctIsRich: true, prompt: 'Click the electron-rich atom.',
              html: '<div class="scene"><svg viewBox="0 0 160 100"><g class="atom" data-key="n"><circle cx="80" cy="55" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="80" y="61" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="15">N</text></g><circle cx="65" cy="30" r="2.5" fill="var(--muted)"/><circle cx="72" cy="24" r="2.5" fill="var(--muted)"/><line x1="80" y1="73" x2="50" y2="90" stroke="var(--line)" stroke-width="2.2"/><line x1="80" y1="73" x2="110" y2="90" stroke="var(--line)" stroke-width="2.2"/><line x1="80" y1="55" x2="80" y2="15" stroke="var(--line)" stroke-width="0"/><g class="atom" data-key="h"><circle cx="40" cy="96" r="10" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="40" y="100" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="10">H</text></g></svg></div>',
              key: 'n', wrongKey: 'h',
              feedback: 'Correct — the lone pair on nitrogen is exactly what makes ammonia a nucleophile.'
            }
          ];
          var idx = 0;
          function paint(){
            var s = scenes[idx];
            api.card.innerHTML =
              '<div class="step-eyebrow">Interact &middot; ' + (idx+1) + ' / ' + scenes.length + '</div>' +
              '<h2 class="step-title">' + s.label + ' — ' + s.prompt + '</h2>' +
              s.html +
              api.feedbackHtml('fb') +
              api.nextButtonHtml(idx < scenes.length-1 ? 'Next' : 'Continue', false);
            var fb = api.card.querySelector('#fb');
            var next = api.card.querySelector('#nextBtn');
            var answered = false;
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.style.cursor = 'pointer';
              g.addEventListener('click', function(){
                if(answered) return;
                var key = g.getAttribute('data-key');
                if(key !== s.key && key !== s.wrongKey) return;
                answered = true;
                var isCorrect = key === s.key;
                if(isCorrect){
                  api.record(true);
                  api.showFeedback(fb, true, s.feedback);
                  next.disabled = false;
                } else {
                  api.record(false);
                  api.showFeedback(fb, false, 'Not that one — think about which atom has the extra electron density here.');
                  answered = false;
                }
              });
            });
            next.addEventListener('click', function(){
              idx++;
              if(idx < scenes.length) paint();
              else api.advance();
            });
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'An electron-rich atom is most likely to act as a(n)...',
        options: ['Nucleophile', 'Electrophile', 'Leaving group'],
        correctIndex: 0,
        correctFeedback: 'Correct — extra electron density is exactly what a nucleophile donates.',
        wrongFeedback: 'Electrophiles are electron-poor, the opposite of what\'s being described here.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two different ways electron density moves: induction and resonance.',
        bodyHtml: '<p class="step-body"><b>Induction</b> is electron density shifting through <b>sigma bonds</b>, driven by electronegativity — it\'s a direct pull with no delocalization or curved arrows involved, and it weakens quickly with distance (each additional sigma bond passed through cuts the effect down further). This is the C–Cl example: chlorine\'s pull is felt strongest on the carbon it\'s bonded to, weaker one bond further away, and negligible two or three bonds away.</p><p class="step-body" style="margin-bottom:0;"><b>Resonance</b> (also called conjugation) is electron density moving through overlapping <b>p orbitals</b> — an actual delocalization you can draw with curved arrows through a conjugated system, and it doesn\'t fade with distance the same way; it can reach all the way across a conjugated system with very little loss, which is exactly how the carbonyl in the next question reaches all the way to the β-carbon.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'In H₂C=CH–CHO (an α,β-unsaturated aldehyde), resonance and induction from the carbonyl make the β-carbon (the far end of the double bond)...',
        options: ['Electron-rich (nucleophilic)', 'Electron-poor (electrophilic)', 'Completely unaffected by the carbonyl'],
        correctIndex: 1,
        correctFeedback: 'Correct — the carbonyl pulls electron density through the π system all the way to the β-carbon, making it electrophilic. This is exactly why nucleophiles can attack there (conjugate addition), which you\'ll see again in <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-enolate-chemistry\">Enolate Chemistry</a>.',
        wrongFeedback: 'Trace the resonance: the carbonyl oxygen pulling electrons pulls density from the whole conjugated system, including the far carbon.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'One lens for predicting reactivity anywhere.',
        bodyHtml: '<div class="explain-box">Electronegativity, polarity, resonance, nucleophiles, and electrophiles are really all the same underlying idea: <b>where is the electron density, and where isn\'t it?</b> Whenever you meet a new molecule, ask that question first — it tells you where a reaction will start.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'In CH₃–CH₂–O–CH₂–CH₂–Cl, which atom is most electron-poor?',
        options: ['The ether oxygen', 'A methyl carbon far from both Cl and O', 'The carbon attached to Cl'],
        correctIndex: 2,
        correctFeedback: 'Correct — chlorine\'s electronegativity pulls density directly off the carbon it\'s attached to, making that carbon the most electron-poor atom in the molecule (and the one a nucleophile would attack).'
      }
    ]
  });
})();
});
</script>
