<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'chirality',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('bromochlorofluoromethane', { caption: 'Four different groups on one carbon. Its mirror image cannot be rotated onto it, which is the whole definition of chiral.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Chiral means "not superimposable on its own mirror image."',
        bodyHtml: '<p class="step-body">Hold your two hands up, palms facing each other. They\'re mirror images of one another. Now try to rotate your left hand in space so that it looks exactly like your right hand, thumb and all. You can\'t — no matter how you rotate it, the thumb ends up on the wrong side.</p><p class="step-body" style="margin-bottom:0;">That\'s the entire definition of <b>chirality</b>: an object (or molecule) is <b>chiral</b> if it cannot be superimposed on its mirror image. If it <i>can</i> be superimposed — meaning the mirror image is really just the same object, rotated — it\'s <b>achiral</b>. This is exactly where the word comes from: Greek <i>cheir</i>, meaning "hand."</p>'
      },
      {
        render: function(api){
          var objs = [
            { key: 'mug', label: 'A plain coffee mug (no logo)', achiral: true },
            { key: 'shoe', label: 'A left shoe', achiral: false },
            { key: 'ball', label: 'A perfectly round ball', achiral: true },
            { key: 'screw', label: 'A screw (helical threads)', achiral: false }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click every object below that is chiral.</h2>' +
            '<p class="step-body">Ask yourself: does this object\'s mirror image look identical to the original (just rotated), or genuinely different?</p>' +
            '<div class="choice-row">' + objs.map(function(o){
              return '<button class="choice-btn" data-v="' + o.key + '">' + o.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Chiral objects found: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var found = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var o = objs.filter(function(x){ return x.key === btn.getAttribute('data-v'); })[0];
              btn.disabled = true;
              if(!o.achiral){
                btn.classList.add('correct');
                found++;
                hint.textContent = 'Chiral objects found: ' + found + ' / 2';
              } else {
                btn.classList.add('wrong');
                mistake = true;
              }
              if(found === 2){
                api.record(!mistake);
                api.showFeedback(fb, !mistake, mistake ? 'You found both chiral objects (the shoe and the screw), but also picked something achiral — a mug and a ball both have mirror images identical to the original, just rotated.' : 'Exactly right. A left shoe\'s mirror image is a right shoe — genuinely different, not just rotated. A screw\'s helical threads make its mirror image spiral the opposite way — also genuinely different. The mug and the ball both have mirror images identical to themselves.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'An achiral object is one whose mirror image is...',
        options: ['Superimposable on the original — really the same object, just rotated', 'Always identical in color to the original', 'Impossible to create'],
        correctIndex: 0,
        correctFeedback: 'Correct — "achiral" means the mirror image and the original can be rotated to match up perfectly.',
        wrongFeedback: 'Chirality has nothing to do with color — it\'s entirely about whether the mirror image can be rotated to match the original exactly.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'A quick way to check whether a molecule is achiral is to look for...',
        options: ['An even number of carbon atoms', 'An internal plane of symmetry that divides it into mirror-image halves', 'A double bond anywhere in the structure'],
        correctIndex: 1,
        correctFeedback: 'Correct. If a molecule has an internal mirror plane, it\'s achiral. Careful with the converse, though: a mirror plane is the commonest way to be achiral, not the only one — a center of symmetry does the same job — so what chirality really requires is that no improper symmetry element be present at all.',
        wrongFeedback: 'Carbon count and double bonds don\'t determine chirality by themselves — the plane-of-symmetry test is the reliable shortcut.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Chirality is a property of the whole molecule\'s shape.',
        bodyHtml: '<p class="step-body">It\'s tempting to think chirality lives at one specific atom, but that\'s not quite right — chirality describes the three-dimensional shape of the <b>entire molecule</b>. The next lesson introduces <b>stereocenters</b>: specific atoms (almost always carbons with four different groups attached) that are the most common cause of a molecule being chiral. But it\'s the overall molecular shape — whether the whole thing has an internal mirror plane or not — that ultimately determines chirality, and as you\'ll see in the Meso Compounds lesson, a molecule can even contain stereocenters and still be achiral overall.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Chirality is why one drug enantiomer can heal and its mirror image can harm.',
        bodyHtml: '<div class="explain-box">Nearly everything biological — amino acids, sugars, enzymes, receptors — is chiral. A chiral receptor can tell two mirror-image molecules apart the same way your hand can tell a left glove from a right one, even though both gloves are chemically identical otherwise. This is why one enantiomer of a drug can be therapeutic while its mirror image does nothing, or in rare tragic cases (thalidomide, historically), causes serious harm. You\'ll examine exactly how enantiomers differ, and why, in the enantiomers and diastereomers lessons later in this chapter.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A molecule has an internal plane of symmetry splitting it into two identical mirror-image halves. Is it chiral?',
        options: ['Yes — any molecule with two identical halves is automatically chiral', 'It depends on the number of carbon atoms', 'No — a plane of symmetry means the molecule is superimposable on its own mirror image (achiral)'],
        correctIndex: 2,
        correctFeedback: 'Correct — an internal plane of symmetry is the fast, reliable signal that a molecule is achiral: it can be superimposed on its own mirror image.'
      }
    ]
  });
})();
});
</script>
