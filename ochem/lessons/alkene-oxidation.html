ircle><text class="fg-lbl" x="135.76" y="497.56" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="224.64" cy="446.97" r="15"></circle><text class="fg-lbl" x="224.64" y="450.86" text-anchor="middle" font-size="10.5">Ar</text><text class="fg-tag" x="62" y="520" text-anchor="middle" font-size="11">two C–O bonds</text><text class="fg-tag" x="62" y="536" text-anchor="middle" font-size="11">half formed</text><text class="fg-tag" x="272" y="502" text-anchor="middle" font-size="11">O–O half</text><text class="fg-tag" x="272" y="518" text-anchor="middle" font-size="11">broken</text><text class="fg-tag" x="90" y="598" text-anchor="middle" font-size="11">near C</text><text class="fg-tag" x="270" y="574" text-anchor="middle" font-size="11">far C</text><text class="fg-tag" x="170" y="640" text-anchor="middle" font-size="11">the C=C runs into the page, at right</text><text class="fg-tag" x="170" y="656" text-anchor="middle" font-size="11">angles to the peroxyacid ring</text></svg><figcaption>Follow the arrows round in order, 1 to 4. The oxygen that ends up in the epoxide is the outer O, and it forms both of its C–O bonds in this one step. The bottom panel is the same moment in three dimensions, with the alkene seen end-on.</figcaption></figure><!-- fig:epoxidation-arrows:end -->'
