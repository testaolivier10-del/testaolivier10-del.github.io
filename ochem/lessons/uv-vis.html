<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Four compounds, ordered by conjugation length. The student puts them in
     order of lambda-max, which is the chapter's central claim made
     quantitative: more conjugation, smaller gap, longer wavelength. */
  var SERIES = [
    { id:'s1', name:'Ethene', n:1,  lam:171 },
    { id:'s2', name:'Buta-1,3-diene', n:2, lam:217 },
    { id:'s3', name:'Hexa-1,3,5-triene', n:3, lam:258 },
    { id:'s4', name:'β-Carotene', n:11, lam:450 }
  ];

  window.OchemLessonEngine.start({
    topicId: 'uv-vis',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The one thing UV-Vis measures well.',
        bodyHtml: '<p class="step-body">Every other spectroscopy in this course reports on individual bonds or individual nuclei. UV-Vis reports on something narrower and, in this chapter, more useful: <b>how far a conjugated π system extends</b>.</p>' +
          '<p class="step-body">Ultraviolet and visible light carry enough energy to promote an electron from an occupied molecular orbital to an empty one. In a π system the cheapest jump is from the <b>HOMO</b>, the top filled orbital, to the <b>LUMO</b>, the lowest empty one. For a polyene the LUMO is an <b>antibonding</b> π orbital, written <b>π*</b>, so the transition is written <b>π &rarr; π*</b>. A molecule absorbs the wavelength whose photon energy matches that gap.</p>' +
          '<div class="explain-box"><b>Bigger HOMO–LUMO gap &rarr; higher energy photon needed &rarr; shorter wavelength absorbed.</b><br>Smaller gap &rarr; lower energy &rarr; <b>longer</b> wavelength absorbed.<br><br>Learn it in that direction. Almost every UV-Vis question is asking you to run it one way or the other.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'More conjugation, smaller gap, longer wavelength.',
        bodyHtml: '<p class="step-body">Extending a conjugated system adds more p orbitals to the combination, producing more molecular orbitals spread over a similar total energy range. The highest occupied one rises and the lowest empty one falls, so the gap <b>narrows</b> with every double bond added to the conjugation.</p>' +
          '<p class="step-body">The group responsible for the absorption is a <b>chromophore</b>. An isolated C=C absorbs below about 200 nm — inconveniently far into the ultraviolet for ordinary instruments — so a simple alkene is effectively invisible. Conjugate two and the absorption moves into the accessible range, which is exactly why this technique is a conjugation detector rather than a general-purpose one.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Keep extending and λ<sub>max</sub> eventually crosses about 400 nm into the visible. At that point the compound absorbs visible light and your eye sees <b>what was not absorbed</b> — the complementary color. Organic compounds are colorless unless they carry extensive conjugation, so a strongly colored organic compound is a strong hint to look for it.</p>'
      },
      {
        render: function(api){
          var shuffled = SERIES.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Put these in order of increasing λ<sub>max</sub>.</h2>' +
            '<p class="step-body">Click them from the <b>shortest</b> wavelength absorbed to the <b>longest</b>. The only thing you need is how many double bonds are in conjugation.</p>' +
            '<div class="radical-sort" id="pool">' +
            shuffled.map(function(s){
              return '<button type="button" class="choice-btn uv-pick" data-id="' + s.id + '" data-n="' + s.n + '">' +
                s.name + ' <span style="color:var(--muted);font-weight:700;">— ' + s.n + ' conjugated C=C</span></button>';
            }).join('') +
            '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin:14px 0 16px;">Placed: 0 / 4</div>' +
            api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var wanted = SERIES.slice().sort(function(a,b){ return a.n - b.n; });
          var at = 0, missed = false;
          api.card.querySelectorAll('.uv-pick').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var id = btn.getAttribute('data-id');
              if(id !== wanted[at].id){
                missed = true;
                btn.classList.add('wrong');
                api.showFeedback(fb, false, 'Not next. Order by how many double bonds are in conjugation: more conjugation means a smaller HOMO–LUMO gap and therefore a LONGER wavelength, so the least conjugated compound comes first.');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 700);
                return;
              }
              var s = wanted[at];
              btn.classList.add('correct');
              btn.disabled = true;
              btn.innerHTML = '<b>' + (at+1) + '.</b> ' + s.name + ' <span style="color:var(--muted);font-weight:700;">— ' + s.n + ' C=C, λ<sub>max</sub> ≈ ' + s.lam + ' nm</span>';
              at++;
              hint.textContent = 'Placed: ' + at + ' / 4';
              if(at === wanted.length){
                api.showFeedback(fb, true, (missed ? '' : 'All four in order, first time. ') +
                  'From 171 nm for a single double bond to about 450 nm for β-carotene\'s eleven. That last one is past 400 nm and therefore in the visible — it absorbs blue light and looks orange, which is the color of carrots.');
                api.record(!missed);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Two isomeric dienes, C₆H₁₀. One absorbs at 227 nm, the other below 200 nm. Which is conjugated?',
        options: ['The one below 200 nm','The one at 227 nm','Both equally','Neither is conjugated'],
        correctIndex: 1,
        correctFeedback: 'Correct. The conjugated diene has the smaller HOMO–LUMO gap, so it absorbs the lower-energy, longer-wavelength light. The isolated diene behaves as two separate alkenes, each absorbing below 200 nm where a plain C=C does.',
        wrongFeedback: 'Conjugation narrows the gap between the orbitals involved. A narrower gap needs a lower-energy photon — and lower energy means longer wavelength.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'β-Carotene absorbs around 450 nm. Why does that make it orange rather than blue?',
        options: [
          'It emits orange light after absorbing',
          'You see the light it does NOT absorb — the complementary color',
          'Orange and blue are the same wavelength',
          'The absorption is too weak to affect color'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. 450 nm is blue light, and that is what the compound removes. What reaches your eye is everything else, which reads as orange. This is the general rule for absorbing pigments and is why the absorbed and perceived colors are always complementary.',
        wrongFeedback: 'A pigment does not glow. Ask what happens to the rest of the visible spectrum when one part of it is removed.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Beer–Lambert: wavelength says what, absorbance says how much.',
        bodyHtml: '<p class="step-body" style="text-align:center;font-family:var(--font-mono);font-weight:900;font-size:18px;">A = εcl</p>' +
          '<ul class="step-body">' +
          '<li><b>A</b> — absorbance, a unitless number read off the instrument.</li>' +
          '<li><b>ε</b> — molar absorptivity, a constant for that compound at that wavelength, measuring how strongly it absorbs. Conjugated systems have large ε, often 10,000 or more. Since A is unitless and c and l are not, ε must carry <b>L·mol⁻¹·cm⁻¹</b>.</li>' +
          '<li><b>c</b> — concentration; <b>l</b> — path length through the sample, conventionally 1 cm.</li>' +
          '</ul>' +
          '<p class="step-body">Because absorbance is directly proportional to concentration, UV-Vis is genuinely quantitative in a way NMR and IR usually are not in a teaching lab. Rearrange before you substitute: c = A / εl. An absorbance of 0.63 with ε = 21,000 in a 1.00 cm cell gives c = 0.63 / 21,000 = 3.0 × 10⁻⁵ M — a few milligrams in a litre, which is why the technique can follow a reaction at concentrations NMR cannot see.</p>' +
          '<div class="explain-box">Watch for the exception to "long wavelength means long conjugation". A carbonyl\'s lone pair sits in a non-bonding orbital above the π one, so promoting it into the same π* costs less: acetone absorbs near <b>280 nm</b> from one C=O. The giveaway is ε, which for such an <b>n → π*</b> band is only 10–100 because the lone pair barely overlaps the π*. Long λ with a huge ε is a long chromophore; long λ with a tiny ε is a lone pair.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'What does a UV-Vis spectrum NOT tell you?',
        options: [
          'Whether a conjugated system is present',
          'Roughly how extended that conjugation is',
          'Where in the molecule the double bonds are',
          'How concentrated the sample is, given ε'
        ],
        correctIndex: 2,
        correctFeedback: 'Correct. It reports that conjugation exists and roughly how far it runs, and via Beer–Lambert how much material is there — but it says nothing about position or connectivity. Pair it with NMR to place the double bonds. UV-Vis answers one question sharply and very little else.',
        wrongFeedback: 'Three of these follow from λmax or from absorbance. One would need you to know which carbons are involved, and nothing in a single broad absorption band carries that.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Why is UV-Vis in the conjugation chapter rather than with IR, NMR and mass spectrometry?',
        options: [
          'It is historically older than the others',
          'It measures conjugation specifically, so it is the experimental half of this chapter',
          'It requires no instrument',
          'It is not really a spectroscopic technique'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. It turns this chapter\'s central abstract claim — that a longer π system is a lower-gap system — into a number you read off an instrument, and it is close to useless for anything else. That is also the habit to carry into the Spectroscopy chapter: each technique answers a different question. IR names functional groups, mass spectrometry gives mass and fragments, NMR builds the carbon skeleton, and UV-Vis reports conjugation.'
      }
    ]
  });

})();
});
</script>
