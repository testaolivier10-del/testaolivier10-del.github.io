></line><line class="fg-bond" x1="498" y1="136" x2="498" y2="111"></line><circle class="fg-atom-hi" cx="494" cy="96" r="16"></circle><text class="fg-lbl" x="494" y="100.44" text-anchor="middle" font-size="12">O</text><line class="fg-bond" x1="574" y1="136" x2="601.14" y2="152.28"></line><circle class="fg-atom" cx="614" cy="160" r="15"></circle><text class="fg-lbl" x="614" y="163.89" text-anchor="middle" font-size="10.5">OH</text><text class="fg-sm" x="614" y="196" text-anchor="middle" font-size="10">hydroxy-</text><text class="fg-lbl" x="454" y="181" text-anchor="middle" font-size="11">1</text><text class="fg-lbl" x="494" y="157" text-anchor="middle" font-size="11">2</text><text class="fg-lbl" x="534" y="181" text-anchor="middle" font-size="11">3</text><text class="fg-lbl" x="574" y="127" text-anchor="middle" font-size="11">4</text><text class="fg-tag-good" x="538" y="248" text-anchor="middle" font-size="11.5">4-hydroxybutan-2-one</text><text class="fg-sm" x="538" y="268" text-anchor="middle" font-size="10">the C=O is the suffix -one; the OH is a prefix</text></svg><figcaption>Look at the OH in each drawing. On the left it is the only group, so the name ends in <b>-ol</b>. On the right a ketone outranks it, so the name ends in <b>-one</b> and the OH moves to the front as <b>hydroxy-</b>.</figcaption></figure><!-- fig:suffix-or-prefix:end -->' +
