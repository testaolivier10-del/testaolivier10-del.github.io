<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Rank-the-group drill. Each row gives a molecule containing two functional
     groups and asks which one takes the suffix. The rows walk down the
     priority list rather than sampling it randomly, so a student who gets all
     three has actually used the order rather than guessed one comparison. */
  var CASES = [
    { id:'r1', mol:'A molecule containing both a <b>ketone</b> and an <b>alcohol</b>',
      opts:['ketone','alcohol'], right:'ketone',
      why:'Ketone outranks alcohol, so the suffix is <b>-one</b> and the alcohol is demoted to the prefix <b>hydroxy-</b>.' },
    { id:'r2', mol:'A molecule containing both a <b>carboxylic acid</b> and a <b>ketone</b>',
      opts:['carboxylic acid','ketone'], right:'carboxylic acid',
      why:'The acid is top of the list, so the suffix is <b>-oic acid</b> and the ketone becomes the prefix <b>oxo-</b>. A compound chemists would call "a keto acid" contains no mention of a ketone in its systematic name.' },
    { id:'r3', mol:'A molecule containing both an <b>amine</b> and an <b>ether</b>',
      opts:['amine','ether'], right:'amine',
      why:'An ether can never be a suffix under any circumstances — it is always the prefix <b>alkoxy-</b>. So the amine takes <b>-amine</b> even though it is near the bottom of the list.' }
  ];

  window.OchemLessonEngine.start({
    topicId: 'naming-functional-groups',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One group gets the suffix. Everything else becomes a prefix.',
        bodyHtml: '<p class="step-body">A molecule with one functional group is easy to name. A molecule with three has to decide which of them the name is <i>about</i>, and that decision is the most important rule in nomenclature: it sets the suffix, it can change which chain is the parent, and it overrides the numbering rule from the last two lessons.</p>' +
          '<p class="step-body">Exactly one group is the <b>principal characteristic group</b>. It is named as the suffix, and it is chosen by a fixed priority order — not by which one is drawn first and not by which seems more interesting. Every other functional group is demoted and cited as a prefix, alongside the alkyls and halogens.</p>' +
          '<p class="step-body" style="margin-bottom:0;">This is why one group has two names depending on the company it keeps. An –OH is the suffix <b>-ol</b> when it is the highest-priority group present, and the prefix <b>hydroxy-</b> when something outranks it. Nothing about the oxygen changed. Its rank did.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The priority order, in three blocks.',
        bodyHtml: '<div class="explain-box"><b>carboxylic acid &gt; ester &gt; amide &gt; nitrile &gt; aldehyde &gt; ketone &gt; alcohol &gt; amine &gt; alkene / alkyne &gt; alkane</b><br><br>Below the line, and never a suffix under any circumstances: <b>ethers, halides, nitro groups.</b></div>' +
          '<p class="step-body">Ten items is hard; three blocks is not. The <b>acid derivatives</b> come first — acid, ester, amide, nitrile. Then the <b>carbonyls that are not derivatives</b>, aldehyde before ketone. Then <b>the ones that are just a heteroatom carrying a hydrogen</b>: alcohol, then amine. Multiple bonds rank below all of them.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Be clear about what this order is not: it is not an oxidation ranking. Count the bonds from the functional carbon to oxygen or nitrogen. Acid, ester, amide and nitrile carbons each have three, so the four sit at the same oxidation level and the sequence within that block is a convention. Aldehyde and ketone carbons each have two, so that pair is a convention as well. What makes the convention useful is that within the derivative block it runs in the same direction as reactivity: an acid converts to an ester, an ester to an amide, and neither step runs backwards directly — the way back is hydrolysis to the acid.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which group takes the suffix?</h2>' +
            '<p class="step-body">For each molecule, pick the principal characteristic group — the one the name will be about. The other becomes a prefix.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.mol + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Which group takes the suffix">' +
                c.opts.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-opt="' + o + '">' + o + '</button>';
                }).join('') +
                '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);

          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var done = {};
          var missed = false;

          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-opt') !== cfg.right){
                missed = true;
                btn.classList.add('wrong');
                btn.disabled = true;
                api.showFeedback(fb, false, 'Not that one. Find both groups on the priority list and take the one further up — and remember that ethers, halides and nitro groups are not on it at all.');
                return;
              }
              done[id] = true;
              btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All three. The third is the one worth remembering: an amine is near the bottom of the list and still wins, because an ether is not on the list at all.'
                  : 'All three, first time — including the case where a low-ranking amine wins because an ether can never be a suffix at all.');
                api.record(!missed);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'A six-carbon chain has an OH that can be reached at C2 from one end, and a methyl that would be at C2 from the other. What is the name?',
        options: ['2-methylhexan-5-ol', '5-methylhexan-2-ol', '2-methylhexan-2-ol', '5-methylhexan-5-ol'],
        correctIndex: 1,
        correctFeedback: 'Correct. Once a principal characteristic group is present it claims the lowest locant before any substituent is considered, so the alcohol takes the 2 and the methyl is left with the 5. Giving the low number to the substituent out of habit is the commonest error on this material.',
        wrongFeedback: 'Both ends give something a 2. Ask which of the two — the alcohol or the methyl — has the right to claim it, and remember the order changed the moment a functional group appeared.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'The longest chain in a molecule is eight carbons, but it does not pass through the carbon bearing the –OH. A seven-carbon chain does. Which is the parent?',
        options: [
          'The eight-carbon chain — the parent is always the longest chain',
          'The seven-carbon chain — the parent must contain the principal characteristic group',
          'Either, as long as the OH is named as a hydroxy prefix',
          'Neither; the molecule would be named as two separate fragments'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Priority beats length. "Longest chain" was only ever the rule for a molecule with nothing to outrank it — once a principal characteristic group exists, the parent is the longest chain that contains it, even when a longer one is available.',
        wrongFeedback: 'The longest-chain rule was written for alkanes, which have no functional group to accommodate. Ask what the suffix is going to attach to if the parent does not include the group it names.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Some locants are not written, and some names cannot be taken apart.',
        bodyHtml: '<p class="step-body">For a carboxylic acid, an aldehyde, a nitrile or an ester, the functional carbon is necessarily at the <b>end</b> of a chain, so it is always C1 and the locant is not written. Ethanoic acid needs no number; butanal needs no number. Writing "butan-1-al" is not so much wrong as redundant, and it reads as though you have not noticed why.</p>' +
          '<p class="step-body">Spelling follows a small rule too: when the suffix begins with a vowel the parent\'s final <i>e</i> is dropped, and when it begins with a consonant it stays. Propane becomes <b>propanol</b>, not propaneol — but it becomes <b>propanenitrile</b> with the e intact.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Finally, a set of older names is retained because it is too entrenched to dislodge, and you will meet these far more often than their systematic equivalents: <b>formic acid</b> (methanoic), <b>acetic acid</b> (ethanoic), <b>formaldehyde</b> (methanal), <b>acetaldehyde</b> (ethanal), <b>acetone</b> (propan-2-one), plus <b>benzoic acid</b>, <b>phenol</b> and <b>aniline</b>, which have no systematic name in common use at all, and <b>toluene</b> and <b>styrene</b>, whose systematic names (methylbenzene, ethenylbenzene) you will see but rarely hear.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'A five-carbon chain has a carboxylic acid at one end, a ketone at C3 and a bromine at C4. What is the name?',
        options: [
          '4-bromo-3-oxopentanoic acid',
          '4-bromo-3-ketopentanoic acid',
          '2-bromo-3-oxopentanoic acid',
          '4-bromo-3-oxopentan-1-oic acid'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. The acid outranks the ketone and takes the suffix, which also fixes its carbon as C1 with nothing left to decide. The ketone is demoted to <b>oxo-</b> — not "keto-", which is not an IUPAC prefix — and the prefixes are cited alphabetically, bromo before oxo. No locant on the acid, because there is nowhere else it could be.',
        wrongFeedback: 'Three things to check: the prefix a demoted ketone takes, whether the acid needs a locant, and which end of the chain is C1 once the acid has claimed it.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Acetone is a ketone and is the highest-priority group in its own molecule — yet its name contains no suffix at all. What does that tell you?',
        options: [
          'That acetone is not really a ketone',
          'That a retained common name is a word, not a derivation, and cannot be taken apart the way a systematic name can',
          'That ketones lose their suffix when they are the only functional group',
          'That the suffix is implied by the "-one" ending of acetone'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Its systematic name is propan-2-one, and that one can be read backwards into a structure. "Acetone" cannot — the resemblance between its ending and the ketone suffix is a coincidence of history, not a derivation. This is the real distinction between the two kinds of name: a systematic name is a set of instructions, and a retained name is a label you either know or look up.'
      }
    ]
  });

})();
});
</script>
