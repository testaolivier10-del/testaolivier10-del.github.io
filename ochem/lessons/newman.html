<script>
(function(){
  function newmanSvg(kind){
    var cx = 150, cy = 60, rFront = 46, rBack = 30;
    function frontLine(angle){
      var rad = angle * Math.PI / 180;
      var x2 = cx + rFront * Math.sin(rad), y2 = cy - rFront * Math.cos(rad);
      return '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--ink)" stroke-width="3"/>';
    }
    function backLine(angle){
      var rad = angle * Math.PI / 180;
      var x1 = cx + rBack * Math.sin(rad), y1 = cy - rBack * Math.cos(rad);
      var x2 = cx + rFront * Math.sin(rad), y2 = cy - rFront * Math.cos(rad);
      return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--muted)" stroke-width="3"/>';
    }
    var frontAngles = [0, 120, 240];
    var backAngles = kind === 'staggered' ? [60, 180, 300] : [0, 120, 240];
    var svg = '<div class="scene"><svg viewBox="0 0 300 120">';
    backAngles.forEach(function(a){ svg += backLine(a); });
    frontAngles.forEach(function(a){ svg += frontLine(a); });
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rBack + '" fill="none" stroke="var(--line)" stroke-width="2.5"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="var(--ink)"/>';
    svg += '</svg></div>';
    return svg;
  }

  window.OchemLessonEngine.start({
    topicId: 'newman',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>How to draw one</h3><p class="step-body">A <b>Newman projection</b> is a view straight down a specific C–C bond. The <b>front</b> carbon is drawn as a dot with three lines radiating out at 120° (its three other substituents). The <b>back</b> carbon is drawn as a circle, with three lines starting at the circle\'s edge (its three other substituents) — the bond connecting front and back carbons is the dot/circle itself, pointing straight at you, so it isn\'t drawn as a line.</p>' +
      '<h3>Staggered vs. eclipsed</h3><p class="step-body">The angle between a front substituent and the nearest back substituent is the <b>dihedral (torsion) angle</b>. In the <b>staggered</b> conformation, front and back substituents are offset by 60° — as far apart as possible. In the <b>eclipsed</b> conformation, they line up directly (0° apart), overlapping in the drawing.</p>' +
      '<div class="notes-fact">Eclipsed conformations are higher in energy than staggered ones — this is <b>torsional strain</b>, caused by repulsion between the electron clouds of eclipsing bonds. For ethane, rotating from staggered to eclipsed costs about 2.9 kcal/mol (roughly 1 kcal/mol per eclipsing H–H interaction, and there are three). This small barrier is why ethane\'s C–C bond rotates extremely fast at room temperature — staggered and eclipsed aren\'t different, isolable molecules, just different snapshots along one continuous rotation.</div>' +
      '<h3>Butane: four named conformations</h3><p class="step-body">For butane (CH₃CH₂CH₂CH₃), look down the central C2–C3 bond with a methyl group front and back. As you rotate through 360°, you pass through: <b>anti</b> (methyls 180° apart, staggered, lowest energy, defined as 0 kcal/mol), <b>gauche</b> (methyls 60° apart, staggered, but the two methyls are close enough to clash sterically, costing about +0.9 kcal/mol), <b>eclipsed</b> (methyl eclipsing a hydrogen, about +3.6 kcal/mol), and <b>totally eclipsed / syn</b> (the two methyls directly eclipsing each other, the highest point, about +4.5 to +6 kcal/mol). There are two energetically-equal gauche conformations and two equal (methyl-H) eclipsed conformations by symmetry.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A Newman projection is what you see looking straight down a bond.',
        bodyHtml: '<p class="step-body">Take any C–C single bond and imagine looking directly along it, front atom right in front of your eye, back atom hidden behind it. A <b>Newman projection</b> draws exactly that view: the <b>front</b> carbon becomes a dot with three lines radiating out at 120° to its other three substituents, and the <b>back</b> carbon becomes a circle, with three lines starting from the circle\'s edge for its own three substituents.</p><p class="step-body" style="margin-bottom:0;">The bond you\'re sighting down (front carbon to back carbon) isn\'t drawn as a line at all — it\'s pointing straight at you, represented by the dot-and-circle themselves. Newman projections exist specifically to make rotation around that one bond easy to see and compare.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the staggered conformation of ethane.</h2>' +
            '<p class="step-body">One of these has front and back lines offset by 60°; the other has them lined up directly on top of each other.</p>' +
            '<div class="choice-row" style="justify-content:center;">' +
            '<button class="choice-btn" data-v="a" style="padding:6px;">' + newmanSvg('staggered') + '<div style="text-align:center;font-weight:800;">A</div></button>' +
            '<button class="choice-btn" data-v="b" style="padding:6px;">' + newmanSvg('eclipsed') + '<div style="text-align:center;font-weight:800;">B</div></button>' +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'a';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'A is staggered — the back (gray) lines sit exactly between the front (black) lines, 60° away from each. B is eclipsed, with each back line hidden directly behind a front line.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which conformation of ethane is lower in energy?',
        options: ['Staggered — substituents are as far apart as possible', 'Eclipsed — substituents reinforce each other', 'They\'re exactly equal in energy'],
        correctIndex: 0,
        correctFeedback: 'Correct — staggered minimizes torsional strain from eclipsing bond electron clouds, making it the lower-energy, preferred conformation.',
        wrongFeedback: 'Eclipsing bonds means their electron clouds repel each other (torsional strain) — that\'s higher energy, not lower.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Ethane\'s staggered-to-eclipsed rotational barrier (~2.9 kcal/mol) is small enough that at room temperature...',
        options: ['The molecule is permanently locked in the staggered form', 'The C–C bond rotates extremely fast — staggered and eclipsed are not isolable, separate molecules', 'Rotation requires breaking the C–C bond'],
        correctIndex: 1,
        correctFeedback: 'Correct. A barrier this small is crossed constantly by ordinary thermal motion — conformations are different snapshots of one continuously rotating molecule, not different compounds.',
        wrongFeedback: 'A 2.9 kcal/mol barrier is very low — thermal energy at room temperature easily crosses it billions of times per second. No bond breaking is involved in rotation around a single bond.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Butane has four named conformations with real, different energies.',
        bodyHtml: '<p class="step-body">Sight down butane\'s central C2–C3 bond, with a methyl group front and a methyl group back. Rotating through a full 360° turn passes through four named points: <b>anti</b> (methyls 180° apart, staggered — the global minimum, defined as 0 kcal/mol), <b>gauche</b> (methyls 60° apart, still staggered, but close enough to clash sterically — about +0.9 kcal/mol), a methyl-eclipsing-hydrogen <b>eclipsed</b> conformation (about +3.6 kcal/mol), and <b>totally eclipsed</b> (the two methyls directly on top of each other — the highest-energy point along the whole rotation, roughly +4.5 to +6 kcal/mol).</p><p class="step-body" style="margin-bottom:0;">Notice that gauche is higher energy than anti even though both are staggered — torsional strain isn\'t the only factor. The two methyl groups in gauche are close enough in space to experience <b>steric strain</b> (van der Waals repulsion from their electron clouds bumping into each other), the same effect you\'ll see determine chair conformation preferences in the next few lessons.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Molecules spend most of their time in low-energy conformations.',
        bodyHtml: '<div class="explain-box">A real sample of butane isn\'t evenly split across all four conformations — because energy differences translate directly into population differences (via a Boltzmann distribution), butane spends the overwhelming majority of its time in the anti conformation, with a smaller but real population in the two gauche conformations, and almost none in either eclipsed form. This same anti-preference, extended to a ring, is exactly why cyclohexane chairs prefer to put bulky groups equatorial rather than axial — coming up in the next few lessons.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Of butane\'s four named conformations, which is the global energy minimum?',
        options: ['Gauche — methyls 60° apart', 'Totally eclipsed — methyls directly overlapping', 'Anti — methyls 180° apart, staggered, no steric clash'],
        correctIndex: 2,
        correctFeedback: 'Correct — anti has both the torsional-strain advantage of being staggered and no steric clash between the two bulky methyl groups, making it the single lowest-energy conformation of butane.'
      }
    ]
  });
})();
</script>
