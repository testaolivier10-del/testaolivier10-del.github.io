        title: 'A Newman projection is the view straight down one bond.',
        bodyHtml: '<p class="step-body">Hold ethane so that its C–C bond points straight at your eye. The nearer carbon now hides the one behind it. A <b>Newman projection</b> draws that view.</p><p class="step-body">The nearer carbon is the <b>front</b> carbon. It is drawn as a dot, and its three other bonds meet at the dot. The farther carbon is the <b>back</b> carbon. It is drawn as a circle, and its three other bonds start at the edge of the circle. Seen end-on, each carbon\'s three bonds look evenly spread, so they are drawn 120° apart.</p><p class="step-body" style="margin-bottom:0;">The C–C bond itself points at your eye, so it gets no line of its own: the dot and the circle are its two ends. That makes a turn about this one bond easy to see.</p>',
        diagramHtml: '<!-- fig:l-eye-on-axis:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 490" role="img" aria-label="Ethane drawn side-on with an eye on the left looking along the C–C bond, the nearer carbon labeled front and the farther one back, and beside it the Newman projection of the same view: the front carbon as a dot with three H, the back carbon as a circle with three H"><text class="fg-tag" x="170" y="24" text-anchor="middle" font-size="11">SIDE-ON: THE BOND YOU LOOK DOWN</text><path class="fg-bond" d="M21 120 Q36 107 51 120 Q36 133 21 120 Z"></path><circle class="fg-lp" cx="40" cy="120" r="5"></circle><line class="fg-arrow-mut" x1="56" y1="120" x2="84" y2="120"></line><path class="fg-head-mut" d="M92 120 L84 124.16 L84 115.84 Z"></path><text class="fg-lbl" x="36" y="158" text-anchor="middle" font-size="12.5">eye</text><line class="fg-bond-hi" x1="176" y1="120" x2="255" y2="120"></line><line class="fg-bond" x1="160" y1="104" x2="160" y2="77"></line><path class="fg-wedge" d="M148.41 131.03 L124.31 147.78 L130.52 154.29 Z"></path><line class="fg-hash" x1="155.97" y1="141.16" x2="157.95" y2="141.44"></line><line class="fg-hash" x1="154.2" y1="146.47" x2="158.16" y2="147.04"></line><line class="fg-hash" x1="152.43" y1="151.79" x2="158.37" y2="152.64"></line><line class="fg-hash" x1="150.66" y1="157.11" x2="158.58" y2="158.24"></line><line class="fg-bond" x1="270" y1="135" x2="270" y2="163"></line><path class="fg-wedge" d="M280.86 109.66 L305.69 92.22 L299.48 85.71 Z"></path><line class="fg-hash" x1="273.92" y1="99.64" x2="271.94" y2="99.35"></line><line class="fg-hash" x1="275.72" y1="94.12" x2="271.76" y2="93.56"></line><line class="fg-hash" x1="277.52" y1="88.61" x2="271.58" y2="87.76"></line><line class="fg-hash" x1="279.31" y1="83.09" x2="271.39" y2="81.96"></line><circle class="fg-atom" cx="160" cy="64" r="13"></circle><text class="fg-lbl" x="160" y="68.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="118" cy="160" r="13"></circle><text class="fg-lbl" x="118" y="164.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="152" cy="176" r="13"></circle><text class="fg-lbl" x="152" y="180.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="270" cy="176" r="13"></circle><text class="fg-lbl" x="270" y="180.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="312" cy="80" r="13"></circle><text class="fg-lbl" x="312" y="84.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="278" cy="64" r="13"></circle><text class="fg-lbl" x="278" y="68.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom-warn" cx="160" cy="120" r="16"></circle><text class="fg-lbl" x="160" y="124.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="270" cy="120" r="15"></circle><text class="fg-lbl" x="270" y="124.44" text-anchor="middle" font-size="12">C</text><text class="fg-tag-warn" x="160" y="216" text-anchor="middle" font-size="10">FRONT carbon</text><text class="fg-tag" x="270" y="216" text-anchor="middle" font-size="11">BACK carbon</text><line class="fg-rule" x1="20" y1="236" x2="320" y2="236"></line><text class="fg-tag" x="170" y="262" text-anchor="middle" font-size="11">END-ON: THE NEWMAN PROJECTION</text><line class="fg-bond-soft" x1="206.37" y1="339" x2="228.89" y2="326"></line><text class="fg-lbl" x="237.34" y="325.72" text-anchor="middle" font-size="13">H</text><line class="fg-bond-soft" x1="170" y1="402" x2="170" y2="428"></line><text class="fg-lbl" x="170" y="442.1" text-anchor="middle" font-size="13">H</text><line class="fg-bond-soft" x1="133.63" y1="339" x2="111.11" y2="326"></line><text class="fg-lbl" x="102.66" y="325.72" text-anchor="middle" font-size="13">H</text><circle class="fg-atom" cx="170" cy="360" r="42"></circle><line class="fg-bond" x1="170" y1="360" x2="170" y2="318"></line><text class="fg-lbl" x="170" y="312.1" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="170" y1="360" x2="206.37" y2="381"></line><text class="fg-lbl" x="215.69" y="390.98" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="170" y1="360" x2="133.63" y2="381"></line><text class="fg-lbl" x="124.31" y="390.98" text-anchor="middle" font-size="13">H</text><circle class="fg-lp-mut" cx="170" cy="360" r="4.5"></circle><text class="fg-tag-warn" x="170" y="456" text-anchor="middle" font-size="10">front carbon = the dot</text><text class="fg-tag" x="170" y="474" text-anchor="middle" font-size="11">back carbon = the circle</text></svg><figcaption>Top: ethane side-on, with the eye looking along the highlighted C–C bond. Bottom: what the eye sees.</figcaption></figure><!-- fig:l-eye-on-axis:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Staggered and eclipsed are two conformations of one molecule.',
        bodyHtml: '<p class="step-body">Each arrangement that ethane reaches by turning about its C–C bond is a <b>conformation</b>. No bond breaks along the way, so the conformations of one molecule are not different compounds. At room temperature they turn into one another so fast that no one can separate them.</p><p class="step-body">Pick one front H and the back H nearest to it. The angle between their bonds, as the projection shows it, is the <b>dihedral angle</b>. At 60°, every back bond sits in the middle of the gap between two front bonds. That is the <b>staggered</b> conformation. At 0°, each back bond lies directly behind a front bond. That is the <b>eclipsed</b> conformation.</p><p class="step-body" style="margin-bottom:0;">An exact eclipse would hide the back bonds, so drawings turn them a few degrees to keep them visible. Read that small offset as 0°, not as "almost staggered".</p>'

8" x2="105.1" y2="356.22"></line><text class="fg-lbl" x="96.58" y="364.27" text-anchor="middle" font-size="13">H</text><circle class="fg-atom" cx="170" cy="330" r="44"></circle><line class="fg-bond" x1="170" y1="330" x2="170" y2="286"></line><text class="fg-lbl" x="156.62" y="280.96" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="170" y1="330" x2="208.11" y2="352"></line><text class="fg-lbl" x="221.61" y="349.4" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="170" y1="330" x2="131.89" y2="352"></line><text class="fg-lbl" x="130.13" y="373.1" text-anchor="middle" font-size="13">H</text><circle class="fg-lp-mut" cx="170" cy="330" r="4.5"></circle><text class="fg-tag" x="170" y="430" text-anchor="middle" font-size="11">front H meet at the dot; back H start at the rim</text></svg><figcaption>Two conformations of ethane, seen down the C–C bond.</figcaption></figure><!-- fig:l-ethane-choice:end -->' +

      {

        eyebrow: 'Explain',
        title: 'Eclipsing costs energy, and the cost is called torsional strain.',
        bodyHtml: '<p class="step-body">Eclipsed ethane is about 2.9 kcal/mol higher in energy than staggered ethane. This extra energy is <b>torsional strain</b>, the cost of lining up bonds on neighboring carbons. Eclipsed ethane has three H/H pairs lined up, so each pair costs about 1 kcal/mol.</p><p class="step-body">Textbooks give two explanations. The traditional one is that the electrons in two eclipsed bonds repel each other. The one many chemists now favor is <b>hyperconjugation</b>.</p><p class="step-body">Every C–H bond has an empty antibonding partner, written <b>σ*</b>, made from the same two orbitals combined in opposite phase. In staggered ethane, each C–H bond points the opposite way from one C–H bond on the other carbon. The filled bond lines up with that bond\'s empty σ*, and a little electron density spreads into it, which lowers the energy. This spreading is hyperconjugation. Eclipsing turns the bonds out of line and loses most of that stabilization.</p><p class="step-body" style="margin-bottom:0;">This 2.9 kcal/mol is ethane\'s <b>rotational barrier</b>, the energy it must gain to turn from staggered through eclipsed. It is small: at room temperature ethane crosses it some tens of billions of times a second.</p>',

        bodyHtml: '<p class="step-body">Nothing is eclipsed in gauche butane, so its extra energy cannot be torsional strain. At 60° apart, the two methyl groups are simply close enough to bump into each other.</p><p class="step-body">That cost is <b>steric strain</b>: the energy of groups whose electron clouds crowd into the same space. Gauche butane has steric strain with no torsional strain mixed in, so it is the cleanest place to see the difference between the two.</p><p class="step-body" style="margin-bottom:0;">When a methyl eclipses another group, that conformation carries steric strain on top of its torsional strain. Two methyls lined up clash hardest of all, which is why syn is the highest point of the rotation and not just one more eclipse.</p>'

        bodyHtml: '<p class="step-body">Look down the C2–C3 bond of 2-methylbutane, CH₃–CH(CH₃)–CH₂–CH₃, with C2 in front. C2 carries two CH₃ groups and one H. C3 carries one CH₃ and two H.</p><p class="step-body">Skip the eclipsed forms: each carries torsional strain as well as any steric strain, so the best conformer is a staggered one. That leaves three staggered conformers, and the only cost in each is its gauche CH₃/CH₃ pairs. In A the back CH₃ sits between the two front methyls, 60° from both: two pairs, 1.8 kcal/mol. In B and C it sits between one front methyl and the front H: one pair, 0.9 each.</p><p class="step-body" style="margin-bottom:0;">So B and C tie as the best conformers. Unlike butane, 2-methylbutane has no conformer that escapes gauche strain entirely.</p>',
