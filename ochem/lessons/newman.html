<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  function newmanSvg(kind){
    var cx = 150, cy = 60, rFront = 46, rBack = 30;
    function frontLine(angle){
      var rad = angle * Math.PI / 180;
      var x2 = cx + rFront * Math.sin(rad), y2 = cy - rFront * Math.cos(rad);
      return '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--ink)" stroke-width="3"/>';
    }
    function backLine(angle){
      var rad = angle * Math.PI / 180;
      var x1 = cx + rBack * Math.sin(rad), y1 = cy - rBack * Math.cos(rad);
      var x2 = cx + rFront * Math.sin(rad), y2 = cy - rFront * Math.cos(rad);
      return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="var(--muted)" stroke-width="3"/>';
    }
    var frontAngles = [0, 120, 240];
    // Eclipsed is conventionally drawn a few degrees off 0 so the back bonds
    // are visible behind the front ones. Drawn at exactly the front angles the
    // back bonds vanish underneath them and the button shows a bare Y.
    var backAngles = kind === 'staggered' ? [60, 180, 300] : [8, 128, 248];
    var svg = '<div class="scene"><svg viewBox="0 0 300 120">';
    backAngles.forEach(function(a){ svg += backLine(a); });
    frontAngles.forEach(function(a){ svg += frontLine(a); });
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rBack + '" fill="none" stroke="var(--line)" stroke-width="2.5"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="var(--ink)"/>';
    svg += '</svg></div>';
    return svg;
  }

  window.OchemLessonEngine.start({
    topicId: 'newman',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A Newman projection is what you see looking straight down a bond.',
        bodyHtml: '<p class="step-body">Take any C–C single bond and imagine looking directly along it, front atom right in front of your eye, back atom hidden behind it. A <b>Newman projection</b> draws exactly that view: the <b>front</b> carbon becomes a dot with three lines radiating out at 120° to its other three substituents, and the <b>back</b> carbon becomes a circle, with three lines starting from the circle\'s edge for its own three substituents.</p><p class="step-body" style="margin-bottom:0;">The bond you\'re sighting down (front carbon to back carbon) isn\'t drawn as a line at all — it\'s pointing straight at you, represented by the dot-and-circle themselves. Newman projections exist specifically to make rotation around that one bond easy to see and compare.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the staggered conformation of ethane.</h2>' +
            '<p class="step-body">One of these has front and back lines offset by 60°; the other has them lined up directly on top of each other.</p>' +
            '<div class="choice-row" style="justify-content:center;">' +
            '<button class="choice-btn" data-v="a" style="padding:6px;">' + newmanSvg('staggered') + '<div style="text-align:center;font-weight:800;">A</div></button>' +
            '<button class="choice-btn" data-v="b" style="padding:6px;">' + newmanSvg('eclipsed') + '<div style="text-align:center;font-weight:800;">B</div></button>' +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'a';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'A is staggered — each back (gray) line sits squarely in the gap between two front (black) lines, 60° from each. In B the back lines peek out from just behind the front ones: that few degrees is a drawing convention so you can see both, and it means 0°, not “almost staggered”.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which conformation of ethane is lower in energy?',
        options: ['Staggered — substituents are as far apart as possible', 'Eclipsed — substituents reinforce each other', 'They\'re exactly equal in energy'],
        correctIndex: 0,
        correctFeedback: 'Correct. Staggering is what avoids <b>torsional strain</b>, and the reason it is worth avoiding is hyperconjugation: only when the bonds are staggered does each filled C–H orbital line up with an empty C–H antibonding (sigma*) orbital on the neighbor, and that stabilizing overlap is lost the moment they eclipse.',
        wrongFeedback: 'Eclipsing costs energy rather than saving it. Staggering lets each filled C–H orbital overlap an empty antibonding orbital on the next carbon — worth about 1 kcal/mol per pair — and eclipsing throws that away.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Ethane\'s staggered-to-eclipsed rotational barrier (~2.9 kcal/mol) is small enough that at room temperature...',
        options: ['The molecule is permanently locked in the staggered form', 'The C–C bond rotates extremely fast — staggered and eclipsed are not isolable, separate molecules', 'Rotation requires breaking the C–C bond'],
        correctIndex: 1,
        correctFeedback: 'Correct. A barrier this small is crossed constantly by ordinary thermal motion — conformations are different snapshots of one continuously rotating molecule, not different compounds.',
        wrongFeedback: 'A 2.9 kcal/mol barrier is very low — thermal energy at room temperature crosses it some tens of billions of times per second. No bond breaking is involved in rotation around a single bond.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Butane has four named conformations with real, different energies.',
        bodyHtml: '<p class="step-body">Sight down butane\'s central C2–C3 bond, with a methyl group front and a methyl group back. Rotating through a full 360° turn passes through four named points:</p><ul class="step-body"><li><b>anti</b> — methyls 180° apart, staggered. The global minimum, defined as 0 kcal/mol.</li><li><b>gauche</b> — methyls 60° apart, still staggered, but close enough to clash sterically. About +0.9 kcal/mol.</li><li><b>eclipsed</b> — a methyl eclipsing a hydrogen. About +3.6 kcal/mol.</li><li><b>totally eclipsed</b> — the two methyls directly on top of each other. The highest point on the whole rotation, roughly +4.5 to +6 kcal/mol.</li></ul><p class="step-body" style="margin-bottom:0;">Notice that gauche is higher energy than anti even though both are staggered — torsional strain isn\'t the only factor. The two methyl groups in gauche are close enough in space to experience <b>steric strain</b> (van der Waals repulsion from their electron clouds bumping into each other), the same effect you\'ll see determine chair conformation preferences in the next few lessons.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Molecules spend most of their time in low-energy conformations.',
        bodyHtml: '<div class="explain-box">A real sample of butane isn\'t evenly split across all four conformations — because energy differences translate directly into population differences — molecules are constantly exchanging energy by collision, and at any instant far more of them sit in a low-energy arrangement than a high-energy one, with the imbalance growing sharply as the energy gap widens (this is what a Boltzmann distribution describes) — butane spends about 70% of its time in the anti conformation, with a smaller but real population — the remaining 30% or so — in the two gauche conformations, and almost none in either eclipsed form. This same anti-preference, extended to a ring, is exactly why cyclohexane chairs prefer to put bulky groups equatorial rather than axial — coming up in the next few lessons.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Sight down the C2–C3 bond of 2,3-dimethylbutane. Each carbon carries two methyls and one H. How many gauche CH₃/CH₃ interactions does its best (lowest-energy) conformation have, and what do they cost?',
        options: [
          'None — a staggered conformation always escapes gauche strain entirely',
          'Two, at 0.9 kcal/mol each: about 1.8 kcal/mol above a strain-free reference',
          'Three, at 0.9 kcal/mol each, because every front methyl has a back methyl 60° away',
          'One, at 0.9 kcal/mol, the same as butane\'s gauche conformation'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. With two methyls on each carbon there is no way to arrange them so that none is 60° from another: the best staggered conformer still has two gauche CH₃/CH₃ pairs, about 1.8 kcal/mol. That is the point of the per-interaction values — they let you price a conformer you have never seen, instead of remembering four numbers for butane.'
      }
    ]
  });
})();
});
</script>
