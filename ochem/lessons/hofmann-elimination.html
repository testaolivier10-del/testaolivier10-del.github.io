    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'An amine cannot eliminate until you change the nitrogen.',
        bodyHtml: '<p class="step-body">In an E2, the leaving group takes the electron pair of its bond to carbon with it. For butan-2-amine, that group would be H<sub>2</sub>N<sup>&minus;</sup>, the <b>amide ion</b>: the conjugate base of ammonia, not a carbonyl amide. Ammonia&rsquo;s N&ndash;H has a pK<sub>a</sub> near 38, so the amide ion is one of the strongest bases in the course. A strong base is a poor leaving group, and heating an amine with base gives no alkene.</p>' +
          '<p class="step-body"><b>Exhaustive methylation</b> fixes this. Excess CH<sub>3</sub>I adds methyl groups to the nitrogen, one S<sub>N</sub>2 step at a time, until it carries four carbon groups and a positive charge. The product is a <b>quaternary ammonium</b> salt.</p>' +
          '<p class="step-body">What leaves now is trimethylamine, N(CH<sub>3</sub>)<sub>3</sub>. The nitrogen is positive before it leaves and neutral afterward, so it carries no negative charge away. Trimethylamine is a far weaker base than the amide ion, and that makes it a workable leaving group.</p>' +
          '<div class="explain-box">Count the CH<sub>3</sub>I as the number of N&ndash;H hydrogens plus one. After each methylation a base, usually K<sub>2</sub>CO<sub>3</sub>, removes one N&ndash;H hydrogen as a proton so the amine can react again. The last CH<sub>3</sub>I makes the quaternary salt. Butan-2-amine has two N&ndash;H hydrogens, so it takes three.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Then silver oxide, heat and an ordinary E2.',
        bodyHtml: '<p class="step-body">Silver oxide, Ag<sub>2</sub>O, in water swaps the iodide for hydroxide. Silver iodide falls out as a solid, so no iodide is left to compete as a nucleophile.</p>' +
          '<p class="step-body">Heat then drives an E2. Hydroxide takes a hydrogen from a &beta; carbon, one bonded to the carbon that carries the nitrogen. The C&ndash;H bonding pair becomes the new &pi; bond, and the C&ndash;N bond breaks, all in one step.</p>' +
          '<div class="explain-box">The three methyl groups have no &beta; carbon, so they have no &beta; hydrogens. The only C&ndash;N bond that can break is the one to the original chain.</div>',
        diagramHtml: '<!-- fig:hofmann-mechanism:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 470" role="img" aria-label="The E2 step of a Hofmann elimination. Hydroxide uses a lone pair to take a hydrogen from C1 of the sec-butyltrimethylammonium ion, the C–H bonding pair becomes the C1=C2 pi bond, and the C2–N bond breaks with its pair going to nitrogen. The products are but-1-ene, water and neutral trimethylamine."><rect class="fg-panel" x="0" y="0" width="340" height="300" rx="10"></rect><text class="fg-tag" x="170" y="22" text-anchor="middle" font-size="11">1 · one step, three curved arrows</text><line class="fg-bond" x1="104" y1="186" x2="166" y2="152"></line><line class="fg-bond" x1="166" y1="152" x2="228" y2="186"></line><line class="fg-bond" x1="228" y1="186" x2="290" y2="152"></line><line class="fg-bond" x1="166" y1="152" x2="166" y2="108"></line><line class="fg-bond" x1="152.58" y1="85.29" x2="130" y2="74"></line><line class="fg-bond" x1="179.42" y1="85.29" x2="202" y2="74"></line><line class="fg-bond" x1="166" y1="77" x2="166" y2="54"></line><circle class="fg-atom-warn" cx="166" cy="92" r="16"></circle><text class="fg-lbl" x="166" y="96.44" text-anchor="middle" font-size="12">N</text><text class="fg-lbl" x="146" y="120" text-anchor="middle" font-size="13">+</text><line class="fg-bond" x1="104" y1="186" x2="83.24" y2="224.33"></line><circle class="fg-atom" cx="78" cy="234" r="11"></circle><text class="fg-lbl" x="78" y="238.44" text-anchor="middle" font-size="12">H</text><text class="fg-tag" x="90" y="170" text-anchor="middle" font-size="11">β</text><text class="fg-tag" x="166" y="180" text-anchor="middle" font-size="11">α</text><text class="fg-lbl" x="40" y="296" text-anchor="middle" font-size="13">HO⁻</text><circle class="fg-lp" cx="44.5" cy="274" r="2.3"></circle><circle class="fg-lp" cx="35.5" cy="274" r="2.3"></circle><path class="fg-arrow" d="M46 270 Q66.16 264.75 67.29 251.97"></path><path class="fg-head" d="M68 244 L71.44 252.34 L63.15 251.6 Z"></path><path class="fg-arrow" d="M91 210 Q128 205.6 133.5 176.86"></path><path class="fg-head" d="M135 169 L137.58 177.64 L129.41 176.08 Z"></path><path class="fg-arrow" d="M172 140 Q185.7 126.43 182.36 115.64"></path><path class="fg-head" d="M180 108 L186.34 114.41 L178.39 116.87 Z"></path><text class="fg-tag-warn" x="262" y="222" text-anchor="middle" font-size="11">all three arrows</text><text class="fg-tag-warn" x="262" y="238" text-anchor="middle" font-size="11">move at once</text><line class="fg-arrow" x1="170" y1="304" x2="170" y2="330"></line><path class="fg-head" d="M170 338 L165.84 330 L174.16 330 Z"></path><rect class="fg-panel-good" x="0" y="342" width="340" height="128" rx="10"></rect><text class="fg-tag" x="170" y="364" text-anchor="middle" font-size="11">2 · the products</text><line class="fg-bond" x1="32" y1="416.54" x2="70" y2="394.54"></line><line class="fg-bond" x1="36" y1="423.46" x2="74" y2="401.46"></line><line class="fg-bond" x1="72" y1="398" x2="110" y2="420"></line><line class="fg-bond" x1="110" y1="420" x2="148" y2="398"></line><text class="fg-tag-good" x="91" y="452" text-anchor="middle" font-size="11">but-1-ene</text><text class="fg-lbl" x="208" y="414" text-anchor="middle" font-size="13">+ H₂O</text><text class="fg-lbl" x="284" y="414" text-anchor="middle" font-size="13">+ N(CH₃)₃</text><text class="fg-tag-good" x="288" y="436" text-anchor="middle" font-size="11">neutral</text></svg><figcaption>Hydroxide pulls the hydrogen off C1, and the nitrogen leaves C2 as a neutral molecule.</figcaption></figure><!-- fig:hofmann-mechanism:end -->'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">How many equivalents of CH<sub>3</sub>I does each amine take to reach the quaternary salt?</h2>' +

                api.showFeedback(fb, false, 'Count the hydrogens on nitrogen, then add one for the step that makes the quaternary salt.');

              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. A primary amine takes three, a secondary amine two and a tertiary amine one.'
                  : 'All four, first time. A primary amine takes three, a secondary amine two and a tertiary amine one.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'Why must the amine be methylated before it will eliminate?',
        options: [
          'The group that would leave, H<sub>2</sub>N<sup>&minus;</sup>, is too strong a base to go',
          'The methyl groups supply the &beta; hydrogens that the base removes',
          'The nitrogen has to become flat before an E2 can start',
          'An amine is too weak a nucleophile to react with hydroxide'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. A good leaving group is a weak base, and the amide ion is one of the strongest bases there is. After methylation, what leaves is neutral trimethylamine, a far weaker base. The methyl groups have no &beta; hydrogens at all, and the E2 needs a base, not a nucleophile.',
        wrongFeedback: 'Ask what would have to leave, with the electron pair, if the amine eliminated as it is. How strong a base is that?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The product is the less substituted alkene.',
        bodyHtml: '<p class="step-body">In the salt from butan-2-amine, the nitrogen sits on C2, so the &beta; carbons are C1 and C3. A hydrogen from C1 gives but-1-ene. A hydrogen from C3 gives but-2-ene, which is disubstituted and more stable.</p>' +
          '<p class="step-body">Zaitsev&rsquo;s rule would predict but-2-ene. The Hofmann elimination gives mainly but-1-ene.</p>' +
          '<div class="explain-box">This is the <b>Hofmann rule</b>: a Hofmann elimination gives mainly the less substituted alkene. An E2 cannot run backward, so the alkene that forms faster is the one you get. But-1-ene is the kinetic product, as in <a href="../lessons/kinetic-thermodynamic.html">Kinetic vs thermodynamic control</a>.</div>',
        diagramHtml: '<!-- fig:hofmann-picks-the-open-side:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 392" role="img" aria-label="The sec-butyltrimethylammonium ion with its two beta carbons labeled: C1, a CH3 with three hydrogens, and C3, a CH2 with two. Losing a hydrogen from C1 gives but-1-ene, the major product. Losing one from C3 gives but-2-ene, the minor product, although it is the more stable alkene."><rect class="fg-panel" x="0" y="0" width="340" height="196" rx="10"></rect><text class="fg-tag" x="170" y="20" text-anchor="middle" font-size="11">the salt from butan-2-amine</text><line class="fg-bond" x1="80" y1="146" x2="140" y2="116"></line><line class="fg-bond" x1="140" y1="116" x2="200" y2="146"></line><line class="fg-bond" x1="200" y1="146" x2="260" y2="116"></line><line class="fg-bond" x1="140" y1="116" x2="140" y2="82"></line><line class="fg-bond" x1="126.43" y1="59.61" x2="106" y2="50"></line><line class="fg-bond" x1="153.57" y1="59.61" x2="174" y2="50"></line><circle class="fg-atom-warn" cx="140" cy="66" r="16"></circle><text class="fg-lbl" x="140" y="70.44" text-anchor="middle" font-size="12">N</text><text class="fg-lbl" x="158" y="90" text-anchor="middle" font-size="13">+</text><line class="fg-bond" x1="140" y1="50" x2="140" y2="34"></line><text class="fg-tag-good" x="80" y="172" text-anchor="middle" font-size="11">β · C1 · 3 H</text><text class="fg-tag" x="200" y="172" text-anchor="middle" font-size="11">β · C3 · 2 H</text><text class="fg-tag" x="272" y="102" text-anchor="middle" font-size="11">C4</text><text class="fg-tag" x="140" y="140" text-anchor="middle" font-size="11">C2</text><line class="fg-arrow" x1="120" y1="200" x2="97.66" y2="222.34"></line><path class="fg-head" d="M92 228 L94.72 219.4 L100.6 225.28 Z"></path><line class="fg-arrow" x1="220" y1="200" x2="242.34" y2="222.34"></line><path class="fg-head" d="M248 228 L239.4 225.28 L245.28 219.4 Z"></path><text class="fg-tag" x="56" y="214" text-anchor="middle" font-size="11">H from C1</text><text class="fg-tag" x="290" y="214" text-anchor="middle" font-size="11">H from C3</text><rect class="fg-panel-good" x="0" y="234" width="164" height="158" rx="10"></rect><line class="fg-bond" x1="23.91" y1="312.59" x2="59.91" y2="290.59"></line><line class="fg-bond" x1="28.09" y1="319.41" x2="64.09" y2="297.41"></line><line class="fg-bond" x1="62" y1="294" x2="98" y2="316"></line><line class="fg-bond" x1="98" y1="316" x2="134" y2="294"></line><text class="fg-tag-good" x="82" y="348" text-anchor="middle" font-size="11">but-1-ene</text><text class="fg-tag-good" x="82" y="366" text-anchor="middle" font-size="11">major</text><rect class="fg-panel" x="176" y="234" width="164" height="158" rx="10"></rect><line class="fg-bond" x1="200" y1="316" x2="236" y2="294"></line><line class="fg-bond" x1="236" y1="294" x2="272" y2="316"></line><line class="fg-bond" x1="239.57" y1="301.58" x2="263.63" y2="316.27"></line><line class="fg-bond" x1="272" y1="316" x2="308" y2="294"></line><text class="fg-tag" x="258" y="348" text-anchor="middle" font-size="11">but-2-ene</text><text class="fg-tag" x="258" y="366" text-anchor="middle" font-size="11">minor, more stable</text></svg><figcaption>C1 and C3 both sit next to C2, the carbon that carries the nitrogen.</figcaption></figure><!-- fig:hofmann-picks-the-open-side:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Why: the big leaving group gets in the way.',
        bodyHtml: '<p class="step-body">The C&ndash;H and C&ndash;N bonds that break must be anti-periplanar, 180&deg; apart. To use a C3 hydrogen, the molecule has to turn so that hydrogen is anti to the nitrogen. That puts C4, a methyl group, gauche to N<sup>+</sup>(CH<sub>3</sub>)<sub>3</sub>, only 60&deg; away. C1 carries only hydrogens, so nothing gets squeezed. Hydroxide also reaches the exposed C1 hydrogens more easily.</p>' +

="170" y="232" text-anchor="middle" font-size="11">C1 holds only H: nothing is squeezed</text><rect class="fg-panel-warn" x="0" y="256" width="340" height="244" rx="10"></rect><text class="fg-tag" x="170" y="276" text-anchor="middle" font-size="11">2 · down the C3–C2 bond (C3 in front)</text><line class="fg-bond-hi" x1="150" y1="420" x2="150" y2="440"></line><text class="fg-lbl" x="150" y="458.5" text-anchor="middle" font-size="13">N⁺(CH₃)₃</text><line class="fg-bond" x1="186.37" y1="357" x2="203.69" y2="347"></line><text class="fg-lbl" x="215.82" y="344.5" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="113.63" y1="357" x2="96.31" y2="347"></line><text class="fg-lbl" x="84.18" y="344.5" text-anchor="middle" font-size="13">CH₃</text><circle class="fg-atom" cx="150" cy="378" r="42"></circle><line class="fg-bond-hi" x1="150" y1="378" x2="150" y2="338"></line><text class="fg-lbl" x="150" y="325.5" text-anchor="middle" font-size="13">H</text><line class="fg-bond" x1="150" y1="378" x2="184.64" y2="398"></line><text class="fg-lbl" x="199.36" y="411" text-anchor="middle" font-size="13">CH₃</text><line class="fg-bond" x1="150" y1="378" x2="115.36" y2="398"></line><text class="fg-lbl" x="100.64" y="411" text-anchor="middle" font-size="13">H</text><circle class="fg-lp-mut" cx="150" cy="378" r="3.5"></circle><text class="fg-tag-warn" x="274" y="420" text-anchor="middle" font-size="11">CH₃ gauche</text><text class="fg-tag-warn" x="274" y="436" text-anchor="middle" font-size="11">to N, 60°</text><text class="fg-tag-warn" x="170" y="488" text-anchor="middle" font-size="11">the front CH₃ (C4) is squeezed</text></svg><figcaption>In both views the hydrogen that leaves (top, front carbon) points opposite the nitrogen (bottom, back carbon).</figcaption></figure><!-- fig:hofmann-two-newmans:end -->'

        diagramHtml: '<!-- fig:cyclic-amine-degradation:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 540" role="img" aria-label="Piperidine, a six-membered ring containing an NH, takes two CH3I to become the N,N-dimethylpiperidinium ion. In round 1, Ag2O, water and heat break one ring C–N bond, giving N,N-dimethylpent-4-en-1-amine: the ring is open but the nitrogen is still attached. In round 2, one more CH3I, then Ag2O and heat, break the second C–N bond, giving penta-1,4-diene and trimethylamine."><rect class="fg-panel" x="0" y="0" width="340" height="176" rx="10"></rect><text class="fg-tag" x="170" y="20" text-anchor="middle" font-size="11">methylate: two CH₃I, K₂CO₃</text><line class="fg-bond" x1="48.14" y1="82" x2="32.56" y2="91"></line><line class="fg-bond" x1="32.56" y1="91" x2="32.56" y2="125"></line><line class="fg-bond" x1="32.56" y1="125" x2="62" y2="142"></line><line class="fg-bond" x1="62" y1="142" x2="91.44" y2="125"></line><line class="fg-bond" x1="91.44" y1="125" x2="91.44" y2="91"></line><line class="fg-bond" x1="91.44" y1="91" x2="75.86" y2="82"></line><circle class="fg-atom-hi" cx="62" cy="74" r="16"></circle><text class="fg-lbl" x="62" y="77.89" text-anchor="middle" font-size="10.5">NH</text><text class="fg-tag" x="62" y="166" text-anchor="middle" font-size="11">piperidine</text><line class="fg-arrow" x1="106" y1="108" x2="152" y2="108"></line><path class="fg-head" d="M160 108 L152 112.16 L152 103.84 Z"></path><line class="fg-bond" x1="222.14" y1="94" x2="208.29" y2="102"></line><line class="fg-bond" x1="208.29" y1="102" x2="208.29" y2="134"></line><line class="fg-bond" x1="208.29" y1="134" x2="236" y2="150"></line><line class="fg-bond" x1="236" y1="150" x2="263.71" y2="134"></line><line class="fg-bond" x1="263.71" y1="134" x2="263.71" y2="102"></line><line style="stroke-width:6" class="fg-bond-hi" x1="263.71" y1="102" x2="249.86" y2="94"></line><line class="fg-bond" x1="226.89" y1="74.08" x2="21
