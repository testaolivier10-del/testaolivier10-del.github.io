    <p class="lede" style="margin-top:0;">Not all bonds are the same — and the difference explains why some parts of a molecule can rotate and others can't.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'bonding',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>Sigma bonds</h3><p class="step-body">A <b>sigma (σ) bond</b> forms from head-on orbital overlap, directly on the axis between the two nuclei. Every single bond is a sigma bond. Because the overlap is symmetric all the way around that axis, the atoms can freely rotate around it without disturbing anything.</p>' +
      '<h3>Pi bonds</h3><p class="step-body">A <b>pi (π) bond</b> comes from the unhybridized p orbitals left over after hybridization (sp² carbon has 1 leftover p; sp has 2). These stick out above/below or side-to-side rather than along the bond axis, and two neighboring ones overlap <b>sideways</b>. That sideways overlap only works while the two p orbitals stay parallel — twisting one atom rotates its p orbital out of alignment and breaks the overlap. That\'s why a pi bond <b>blocks rotation</b> while a sigma bond doesn\'t.</p>' +
      '<div class="formula">single bond = 1σ &nbsp;&middot;&nbsp; double bond = 1σ + 1π &nbsp;&middot;&nbsp; triple bond = 1σ + 2π</div>' +
      '<div class="notes-fact">Restricted rotation around a double bond\'s pi bond is the entire reason cis/trans (E/Z) isomers exist — groups on either side of the double bond stay fixed relative to each other. More on this in the Stereochemistry module.</div>' +
      '<h3>Bond length and strength</h3><p class="step-body">More bonds between the same two atoms means shorter and stronger. C–C: ~154 pm, ~347 kJ/mol. C=C: ~134 pm, ~614 kJ/mol. C≡C: ~120 pm, ~839 kJ/mol. The jump from 1→2 bonds roughly doubles the energy; the second pi bond (2→3) adds less, since sideways p-orbital overlap is inherently weaker than the sigma bond\'s head-on overlap.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Sigma bonds hold; pi bonds lock.',
        bodyHtml: '<p class="step-body">A <b>sigma (σ) bond</b> forms from head-on orbital overlap, directly on the axis between the two nuclei — every single bond is one, and because the orbital overlap is symmetric all the way around that axis, the atoms can freely rotate around it without disturbing the overlap.</p><p class="step-body">A <b>pi (π) bond</b> is different: it comes from the unhybridized p orbitals left over after hybridization (the sp² carbon from the last lesson has 1 leftover p orbital; sp has 2). Those leftover p orbitals stick out above and below (or side-to-side) rather than along the bond axis, and two neighboring ones overlap <b>sideways</b> to form the pi bond. That sideways overlap only works while the two p orbitals stay parallel — twisting one atom relative to the other would rotate its p orbital out of alignment and break the overlap entirely. That\'s why a pi bond <b>blocks rotation</b>, while a sigma bond doesn\'t.</p>' +
          '<div class="formula">single bond = 1σ &nbsp;&middot;&nbsp; double bond = 1σ + 1π &nbsp;&middot;&nbsp; triple bond = 1σ + 2π</div>'
      },
      {
        render: function(api){
          var answered = false;
          function scene(){
            return '<div class="scene"><svg viewBox="0 0 260 120">' +
              '<circle cx="90" cy="60" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="90" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">C</text>' +
              '<circle cx="170" cy="60" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="170" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">C</text>' +
              '<g class="atom" data-key="sigma"><line x1="107" y1="60" x2="153" y2="60" stroke="var(--line)" stroke-width="3"/></g>' +
              '<g class="atom" data-key="pi"><line x1="107" y1="46" x2="153" y2="46" stroke="var(--line)" stroke-width="3"/></g>' +
            '</svg></div>';
          }
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Interact</div>' +
              '<h2 class="step-title">This is a C=C double bond. Click the line that blocks rotation.</h2>' +
              '<p class="step-body">One line is the sigma bond (head-on, between the nuclei). The other is the pi bond (off to the side).</p>' +
              scene() +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', false);
            var fb = api.card.querySelector('#fb');
            var next = api.card.querySelector('#nextBtn');
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(answered) return;
                var isCorrect = g.getAttribute('data-key') === 'pi';
                api.record(isCorrect);
                if(isCorrect){
                  answered = true;
                  g.querySelector('line').setAttribute('stroke', 'var(--accent)');
                  g.querySelector('line').setAttribute('stroke-width', '3.5');
                  api.showFeedback(fb, true, 'Correct — the off-axis pi bond is the one whose side-by-side overlap breaks if you try to twist the molecule.');
                  next.disabled = false;
                } else {
                  api.showFeedback(fb, false, 'That’s the sigma bond, directly between the two nuclei — rotating around it doesn’t break any overlap.');
                }
              });
            });
            next.addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'How many total bonds (σ + π) does a triple bond like N≡N have?',
        options: ['1', '2', '3'],
        correctIndex: 2,
        correctFeedback: 'Correct — 1 sigma bond plus 2 pi bonds.',
        wrongFeedback: 'A triple bond is 1 sigma bond plus how many pi bonds?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Which bond type allows free rotation around it?',
        options: ['Sigma', 'Pi'],
        correctIndex: 0,
        correctFeedback: 'Correct — sigma bonds are symmetric around the bond axis, so rotating around them doesn’t disturb the overlap.',
        wrongFeedback: 'Think about which overlap breaks when you twist.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Restricted rotation is why cis/trans exists.',
        bodyHtml: '<div class="explain-box">Because a pi bond locks the two carbons of a double bond flat and unrotatable, groups on either side stay fixed relative to each other — that’s the entire reason cis/trans (E/Z) isomers exist. You’ll see this again in the Stereochemistry module.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'More bonds between the same two atoms means shorter and stronger.',
        bodyHtml: '<p class="step-body">Adding pi bonds pulls the two nuclei closer together and takes more energy to break, since there are more overlapping orbitals holding them together. For a carbon-carbon bond: a single bond (C–C, sp³–sp³) is about 154 pm long and 347 kJ/mol to break; a double bond (C=C, sp²–sp²) is about 134 pm and 614 kJ/mol; a triple bond (C≡C, sp–sp) is about 120 pm and 839 kJ/mol.</p><p class="step-body" style="margin-bottom:0;">Notice the bond doesn\'t simply double or triple in strength — going from 1 to 2 bonds roughly doubles the energy, but the pi bond added going from a double to a triple bond is weaker than the first one, since sideways p-orbital overlap is inherently less effective than the sigma bond\'s head-on overlap.</p>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A molecule has one triple bond and one double bond. How many pi bonds total?',
        options: ['1', '3', '2'],
        correctIndex: 1,
        correctFeedback: 'Correct — 2 pi bonds from the triple bond, plus 1 from the double bond, for 3 total.'
      }
    ]
  });
})();
</script>
