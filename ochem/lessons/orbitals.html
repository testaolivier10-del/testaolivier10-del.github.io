where an electron is likely to be found. Hydrogen\'s is called <b>1s</b>. The 1 is the shell number, <b>n</b> (the K shell is n = 1, the L shell n = 2). The s names the shape.</p>'

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two electrons per orbital, with opposite spins.',
        bodyHtml: '<p class="step-body">Helium has two electrons, and both sit in 1s. They differ in <b>spin</b>: each electron behaves like a tiny magnet that points one of two ways, spin up or spin down, drawn ↑ and ↓. Helium\'s pair is ↑↓.</p><p class="step-body" style="margin-bottom:0;">Lithium\'s third electron cannot join them, so it goes into the next shell. The rule is the <b>Pauli exclusion principle</b>: no two electrons in one atom can have both the same orbital and the same spin. So an orbital holds at most <b>2</b> electrons, with opposite spins.</p>'

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 's orbitals are spheres.',

ttom:0;">Between the lobes is a flat <b>nodal plane</b> through the nucleus, where the electron is never found. The two lobes are one orbital, and it still holds at most 2 electrons.</p>'

nt-size="11">2px</text><text class="fg-tag" x="196" y="40" text-anchor="middle" font-size="11">2py</text><text class="fg-tag" x="170" y="284" text-anchor="middle" font-size="11">each at 90° to the other two</text></svg><figcaption>z points out of the page toward you, so its lobes look shorter.</figcaption></figure><!-- fig:l-p-three-axes:end --><p class="step-body" style="margin-bottom:0;">They have the same shape and the same energy, and differ only in direction. Orbitals with exactly equal energy are called <b>degenerate</b>. Every shell from n = 2 on has one set of three p orbitals.</p>'

        eyebrow: 'Explain',
        title: 'd and f orbitals, and what a shell holds.',
        bodyHtml: '<p class="step-body"><b>d</b> orbitals are mostly four-lobed cloverleaves, five per shell from n = 3 on. <b>f</b> orbitals have still more lobes, seven per shell from n = 4 on. Organic chemistry uses s and p; you only need to recognize d and f.</p><!-- fig:orbital-shapes:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 360" role="img" aria-label="Four panels. s: a sphere, one per shell, from n = 1. p: two lobes, three per shell, from n = 2. d: a four-lobed cloverleaf with the lobes alternating in shade, five per shell, from n = 3. f: a six-lobed flower with alternating shades, seven per shell, from n = 4. A dot marks the nucleus in each."><rect class="fg-panel" x="6" y="6" width="160" height="170" rx="10"></rect><text class="fg-lbl" x="86" y="28" text-anchor="middle" font-size="13">s</text><text class="fg-tag" x="86" y="152" text-anchor="middle" font-size="11">1 per shell</text><text class="fg-tag" x="86" y="166" text-anchor="middle" font-size="11">from n = 1</text><circle class="fg-orb" cx="86" cy="88" r="44"></circle><circle class="fg-fill-mut" cx="86" cy="88" r="2.8"></circle><rect class="fg-panel" x="174" y="6" width="160" height="170" rx="10"></rect><text class="fg-lbl" x="254" y="28" text-anchor="middle" font-size="13">p</text><text class="fg-tag" x="254" y="152" text-anchor="middle" font-size="11">3 per shell</text><text class="fg-tag" x="254" y="166" text-anchor="middle" font-size="11">from n = 2</text><path class="fg-orb-alt" d="M254 88 C240.36 104.64 233.1 140 254 140 C274.9 140 267.64 104.64 254 88 Z"></path><path class="fg-orb" d="M254 88 C267.64 71.36 274.9 36 254 36 C233.1 36 240.36 71.36 254 88 Z"></path><circle class="fg-fill-mut" cx="254" cy="88" r="2.8"></circle><rect class="fg-panel" x="6" y="184" width="160" height="170" rx="10"></rect><text class="fg-lbl" x="86" y="206" text-anchor="middle" font-size="13">d</text><text class="fg-tag" x="86" y="330" text-anchor="middle" font-size="11">5 per shell</text><text class="fg-tag" x="86" y="344" text-anchor="middle" font-size="11">from n = 3</text><path class="fg-orb" d="M86 266 C106.08 263.45 134.79 244.08 121.36 230.64 C107.92 217.21 88.55 245.92 86 266 Z"></path><path class="fg-orb" d="M86 266 C65.92 268.55 37.21 287.92 50.64 301.36 C64.08 314.79 83.45 286.08 86 266 Z"></path><path class="fg-orb-alt" d="M86 266 C83.45 245.92 64.08 217.21 50.64 230.64 C37.21 244.08 65.92 263.45 86 266 Z"></path><path class="fg-orb-alt" d="M86 266 C88.55 286.08 107.92 314.79 121.36 301.36 C134.79 287.92 106.08 268.55 86 266 Z"></path><circle class="fg-fill-mut" cx="86" cy="266" r="2.8"></circle><rect class="fg-panel" x="174" y="184" width="160" height="170" rx="10"></rect><text class="fg-lbl" x="254" y="206" text-anchor="middle" font-size="13">f</text><text class="fg-tag" x="254" y="330" text-anchor="middle" font-size="11">7 per shell</text><text class="fg-tag" x="254" y="344" text-anchor="middle" font-size="11">from n = 4</text><path class="fg-orb" d="M254 266 C263.3 250 268.25 216 254 216 C239.75 216 244.7 250 254 266 Z"></path><path class="fg-orb" d="M254 266 C235.49 265.95 203.57 278.66 210.7 291 C217.82 303.34 244.79 282.05 254 266 Z"></path><path class="fg-orb" d="M254 266 C263.21 282.05 290.18 303.34 297.3 291 C304.43 278.66 272.51 265.95 254 266 Z"></path><path class="fg-orb-alt" d="M254 266 C272.51 266.05 304.43 253.34 297.3 241 C290.18 228.66 263.21 249.95 254 266 Z"></path><path class="fg-orb-alt" d="M254 266 C244.79 249.95 217.82 228.66 210.7 241 C203.57 253.34 235.49 266.05 254 266 Z"></path><path class="fg-orb-alt" d="M254 266 C244.7 282 239.75 316 254 316 C268.25 316 263.3 282 254 266 Z"></path><circle class="fg-fill-mut" cx="254" cy="266" r="2.8"></circle></svg><figcaption>One example of each type. The dot is the nucleus.</figcaption></figure><!-- fig:orbital-shapes:end --><p class="step-body" style="margin-bottom:0;">At 2 electrons per orbital, the shells fill up like this. n = 1 has one orbital (1s): 2 electrons. n = 2 has four (2s and three 2p): 8. n = 3 adds five 3d to its 3s and 3p: nine orbitals, 18 electrons.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Lowest energy first: why 2s fills before 2p.',
        bodyHtml: '<p class="step-body">Lithium\'s third electron goes into 2s, not 2p. Electrons fill the lowest-energy orbitals first: the <b>Aufbau principle</b>. Within a shell, s &lt; p &lt; d &lt; f.</p><p class="step-body">A <b>subshell</b> is all the orbitals of one type in one shell, such as the three 2p orbitals. An atom\'s <b>electron configuration</b> lists its subshells with a superscript for the electrons in each: boron (5 electrons) is 1s² 2s² 2p¹.</p><p class="step-body">Why? Inner electrons repel an outer one and cancel part of the nucleus\'s pull: <b>shielding</b>. A 2s electron spends a little time inside the 1s electrons, right by the nucleus. A 2p electron gets inside less, and its chance of being found drops to zero at the nucleus, which sits on its nodal plane. Getting in close like that is <b>penetration</b>.</p><!-- fig:penetration:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 250" role="img" aria-label="A graph of how likely an electron is to be found at each distance from the nucleus. A shaded hump close to the nucleus is the 1s core electrons. The 2s curve has a small inner bump inside that core region, then dips to zero at its node and rises to a large outer hump. The 2p curve starts at zero at the nucleus and has only one hump, farther out, with nothing inside the core."><path class="fg-fill-mut" d="M34 196 L35.22 194.83 L36.43 191.77 L37.65 187.38 L38.87 182.13 L40.08 176.39 L41.3 170.45 L42.52 164.54 L43.73 158.81 L44.95 153.42 L46.17 148.43 L47.38 143.92 L48.6 139.92 L49.82 136.44 L51.03 133.5 L52.25 131.08 L53.47 129.17 L54.68 127.73 L55.9 126.75 L57.12 126.18 L58.33 126 L59.55 126.17 L60.77 126.65 L61.98 127.42 L63.2 128.43 L64.42 129.66 L65.63 131.08 L66.85 132.65 L68.07 134.35 L69.28 136.16 L70.5 138.06 L71.72 140.02 L72.93 142.03 L74.15 144.06 L75.37 146.11 L76.58 148.17 L77.8 150.21 L79.02 152.23 L80.23 154.23 L81.45 156.19 L82.67 158.11 L83.88 159.98 L85.1 161.8 L86.32 163.56 L nel-warn" x="102.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="119.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="136.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="153.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="170.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="187.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-panel-warn" x="204.5" y="106.5" width="16" height="23" rx="3"></rect><rect class="fg-orb-alt" x="221.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><rect class="fg-orb-alt" x="238.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><rect class="fg-orb-alt" x="255.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><rect class="fg-orb-alt" x="272.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><rect class="fg-orb-alt" x="289.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><rect class="fg-orb-alt" x="306.5" y="106.5" width="16" height="23" rx="3" stroke="none" fill-opacity="0.4"></rect><text class="fg-tag" x="34" y="24" text-anchor="middle" font-size="11">s-block</text><text class="fg-tag" x="136" y="78" text-anchor="middle" font-size="11">d-block</text><text class="fg-tag" x="272" y="24" text-anchor="middle" font-size="11">p-block</text><rect class="fg-panel" x="51.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="68.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="85.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="102.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="119.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="136.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="153.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="170.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="187.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="204.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="221.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="238.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="255.5" y="148.5" width="16" height="23" rx="3"></rect><rect class="fg-panel" x="272.5" y="148.5" width="16" height="23" rx="3"></rect><text class="fg-tag" x="47" y="164" text-anchor="end" font-size="11">f-block</text><text class="fg-tag" x="170" y="212" text-anchor="middle" font-size="11">organic chemistry lives in the p-block</text></svg><figcaption>Rows 1 to 4, with the f-block row below. C, N, O and F are outlined.</figcaption></figure><!-- fig:l-periodic-blocks:end --><p class="step-body" style="margin-bottom:0;">Groups 1 and 2 are the <b>s-block</b>. Groups 13 to 18 are the <b>p-block</b>, home to C, N, O, F, S, P, Cl, Br and I. The ten middle columns, groups 3 to 12, are the <b>d-block</b>: the transition metals (strictly, IUPAC counts group 12 separately). The 4s-before-3d order is why the d-block starts in row 4. The two rows pulled out below are the <b>f-block</b>. The periodic table tool (the ⚛ button) colors its categories along these same blocks.</p>'

        title: 'Hund\'s rule: spread out, then pair.',
        bodyHtml: '<p class="step-body">Nitrogen has 7 electrons. Four fill 1s and 2s, leaving three for the three 2p orbitals. They go one to each orbital, all with the same spin.</p><!-- fig:l-hund-nitrogen:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 200" role="img" aria-label="Nitrogen’s three 2p electrons placed two ways. Top, marked right: one up arrow in each of the three 2p boxes. Bottom, marked wrong: two arrows paired in the first box, one in the second, and the third box empty."><rect class="fg-panel-good" x="6" y="6" width="328" height="88" rx="10"></rect><text class="fg-tag-good" x="20" y="28" text-anchor="start" font-size="11">Hund’s rule: right</text><text class="fg-lbl" x="44" y="63" text-anchor="middle" font-size="12">2p</text><rect class="fg-panel" x="78" y="46" width="28" height="24" rx="5"></rect><line class="fg-arrow" x1="92" y1="66" x2="92" y2="55"></line><path class="fg-head" d="M92 50 L94.6 55 L89.4 55 Z"></path><rect class="fg-panel" x="114" y="46" width="28" height="24" rx="5"></rect><line class="fg-arrow" x1="128" y1="66" x2="128" y2="55"></line><path class="fg-head" d="M128 50 L130.6 55 L125.4 55 Z"></path><rect class="fg-panel" x="150" y="46" width="28" height="24" rx="5"></rect><line class="fg-arrow" x1="164" y1="66" x2="164" y2="55"></line><path class="fg-head" d="M164 50 L166.6 55 L161.4 55 Z"></path><text class="fg-tag" x="186" y="54" text-anchor="start" font-size="11">one per box,</text><text class="fg-tag" x="186" y="70" text-anchor="start" font-size="11">same spin</text><rect class="fg-panel-warn" x="6" y="104" width="328" height="88" rx="10"></rect><text class="fg-tag-warn" x="20" y="126" text-anchor="start" font-size="11">wrong</text><text class="fg-lbl" x="44" y="161" text-anchor="middle" font-size="12">2p</text><rect class="fg-panel" x="78" y="144" width="28" height="24" rx="5"></rect><line class="fg-arrow" x1="87" y1="164" x2="87" y2="153"></line><path class="fg-head" d="M87 148 L89.6 153 L84.4 153 Z"></path><line class="fg-arrow" x1="97" y1="148" x2="97" y2="159"></line><path class="fg-head" d="M97 164 L94.4 159 L99.6 159 Z"></path><rect class="fg-panel" x="114" y="144" width="28" height="24" rx="5"></rect><line class="fg-arrow" x1="128" y1="164" x2="128" y2="153"></line><path class="fg-head" d="M128 148 L130.6 153 L125.4 153 Z"></path><rect class="fg-panel" x="150" y="144" width="28" height="24" rx="5"></rect><text class="fg-tag" x="186" y="152" text-anchor="start" font-size="11">a pair while a</text><text class="fg-tag" x="186" y="168" text-anchor="start" font-size="11">box sits empty</text></svg><figcaption>Nitrogen’s three 2p electrons. The three boxes have equal energy.</figcaption></figure><!-- fig:l-hund-nitrogen:end --><p class="step-body" style="margin-bottom:0;">That is <b>Hund\'s rule</b>: in a set of degenerate orbitals (the three 2p, or the five 3d), each orbital takes one electron, all with the same spin, before any takes a second. An electron alone in its orbital is <b>unpaired</b>. Two electrons in one orbital share one region of space and repel each other, so an empty orbital of equal energy is taken first.</p>'
      },
      {
        render: function(api){
          var boxes = ['1s','2s','2px','2py','2pz'];
          // Each entry is one electron, in the order it's actually added for
          // carbon (1s² 2s² 2p²): pair up 1s, pair up 2s, then place one
          // electron each in two of the three (degenerate) 2p orbitals per
          // Hund's rule. 2pz is never reached — carbon only has 2 electrons
          // to spread across three empty, equal-energy 2p orbitals.
          var slots = [0, 0, 1, 1, 2, 3];
          var counts = [0, 0, 0, 0, 0];
          var next = 0, done = false;

          function boxSvg(){
            var w = 54, gap = 10, startX = 20;
            var svgW = startX*2 + boxes.length*w + (boxes.length-1)*gap;
            return '<div class="scene"><svg viewBox="0 0 ' + svgW + ' 120">' +
              boxes.map(function(label, i){
                var x = startX + i*(w+gap);
                var n = counts[i];
                var isTarget = !done && slots[next] === i;
                var cls = 'orb-box' + (n>0?' chosen':'') + (isTarget?' target':'');
                var arrows = '';
                if(n >= 1) arrows += '<text x="' + (x+w/2-9) + '" y="55" text-anchor="middle" font-size="18" pointer-events="none">↑</text>';
                if(n >= 2) arrows += '<text x="' + (x+w/2+9) + '" y="55" text-anchor="middle" font-size="18" pointer-events="none">↓</text>';
                return '<g class="' + cls + '" data-key="o' + i + '">' +
                  (isTarget ? '<text x="' + (x+w/2) + '" y="14" text-anchor="middle" font-size="10" font-weight="800" fill="var(--accent)" pointer-events="none">CLICK</text>' : '') +
                  '<rect x="' + x + '" y="20" width="' + w + '" height="50" rx="8" fill="' + (n>0?'var(--tint-accent)':'var(--white)') + '" stroke="' + (isTarget?'var(--accent)':'var(--line)') + '" stroke-width="' + (isTarget?'3':'2') + '"/>' +
                  arrows +
                  '<text x="' + (x+w/2) + '" y="90" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12" pointer-events="none">' + label + '</text>' +
                '</g>';
              }).join('') +
            '</svg></div>';
          }
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
              '<h2 class="step-title">Fill carbon’s orbitals in order.</h2>' +
              '<p class="step-body">Carbon has 6 electrons. Click the highlighted orbital each time to add its next electron. The highlight follows the two rules: fill the lowest energy first, pairing up inside 1s and then 2s; then spread singly across the degenerate 2p set.</p>' +
              boxSvg() +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', done);
            api.card.querySelectorAll('.orb-box').forEach(function(g){
              g.addEventListener('click', function(){
                if(done) return;
                var idx = parseInt(g.getAttribute('data-key').slice(1), 10);
                var targetIdx = slots[next];
                if(idx !== targetIdx){
                  api.showFeedback(api.card.querySelector('#fb'), false, 'Not yet. Fill the lowest energy first. 1s and 2s each take a pair, because nothing else sits at their energy. The three 2p orbitals are degenerate, so each takes one electron before any takes a second.');
                  return;
                }
                counts[idx]++;
                next++;
                if(next === slots.length){
                  done = true;
                  api.record(true);
                  paint();
                  api.showFeedback(api.card.querySelector('#fb'), true, 'Correct. 1s and 2s each hold a pair, ↑↓. Carbon’s last 2 electrons went one each into 2px and 2py, same spin (Hund’s rule), and 2pz stays empty: 1s² 2s² 2p², two unpaired electrons.');
                } else {
                  paint();
                }
              });
            });
            api.card.querySelector('#nextBtn').addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'Which fills first, 2s or 2p, and why?',
        options: [
          '2s, because it gets closer to the nucleus, so it sits lower',
          '2p, because its three orbitals give the electron more room to go',
          '2p, because its lobes point straight at the nucleus along each axis',
          'Neither: 2s and 2p are in one shell, so they fill at the same time'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct. A 2s electron spends some time close to the nucleus, so it is shielded less and held harder. Lower energy fills first.',
        wrongFeedback: 'Lower-energy orbitals fill first. Which of the two gets closer to the nucleus, inside the 1s electrons?'
      },

      {

        eyebrow: 'Why it matters',
        title: 'Orbitals overlap to make bonds.',
        bodyHtml: '<p class="step-body">The two shades of an orbital show its <b>phase</b>: the plus or minus sign of the electron\'s wave. They are not charges. A 1s orbital has one sign all over, and either sign is allowed; a 2s orbital changes sign at its node. When two hydrogen atoms meet with their 1s orbitals in the same phase, the waves add up between the nuclei. The pair gathers there and holds both nuclei: a <b>bond</b>. In opposite phase the waves cancel, a node forms between the nuclei, and there is no bond.</p><!-- fig:phase-overlap:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 380" role="img" aria-label="Three rows. Row 1: one p orbital with a plus sign in one lobe and a minus sign in the other, and a dashed node between them; the signs are phase, not charge. Row 2: two hydrogen atoms, each labeled H, whose 1s spheres are both in the same shade and overlap; the overlap region between them is where the shared pair sits, a bond. Row 3: the same two hydrogens with spheres in opposite shades; the waves cancel and a dashed node runs between the two nuclei, so there is no bond."><rect class="fg-panel" x="6" y="6" width="328" height="112" rx="10"></rect><path class="fg-orb-alt" d="M110 62 C87.6 43.4 40 33.5 40 62 C40 90.5 87.6 80.6 110 62 Z"></path><path class="fg-orb" d="M110 62 C132.4 80.6 180 90.5 180 62 C180 33.5 132.4 43.4 110 62 Z"></path><line class="fg-orb-node" x1="110" y1="22" x2="110" y2="102"></line><circle class="fg-fill-mut" cx="110" cy="62" r="3.2"></circle><text class="fg-lbl" x="152" y="67" text-anchor="middle" font-size="13">+</text><text class="fg-lbl" x="68" y="67" text-anchor="middle" font-size="13">−</text><text class="fg-tag" x="256" y="56" text-anchor="middle" font-size="11">signs of the wave,</text><text class="fg-tag" x="256" y="72" text-anchor="middle" font-size="11">not charges</text><rect class="fg-panel-good" x="6" y="128" width="328" height="118" rx="10"></rect><circle class="fg-orb" cx="88" cy="180" r="40"></circle><circle class="fg-orb" cx="148" cy="180" r="40"></circle><text class="fg-lbl" x="88" y="185" text-anchor="middle" font-size="13">H</text><text class="fg-lbl" x="148" y="185" text-anchor="middle" font-size="13">H</text><text class="fg-tag" x="250" y="170" text-anchor="middle" font-size="11">same phase:</text><text class="fg-tag" x="250" y="186" text-anchor="middle" font-size="11">waves add up</text><text class="fg-tag-good" x="250" y="202" text-anchor="middle" font-size="11">→ a bond</text><text class="fg-tag" x="118" y="238" text-anchor="middle" font-size="11">shared pair between the nuclei</text><rect class="fg-panel" x="6" y="256" width="328" height="118" rx="10"></rect><circle class="fg-orb" cx="88" cy="308" r="40"></circle><circle class="fg-orb-alt" cx="148" cy="308" r="40"></circle><line class="fg-orb-node" x1="118" y1="262" x2="118" y2="354"></line><text class="fg-lbl" x="88" y="313" text-anchor="middle" font-size="13">H</text><text class="fg-lbl" x="148" y="313" text-anchor="middle" font-size="13">H</text><text class="fg-tag" x="250" y="298" text-anchor="middle" font-size="11">opposite phase:</text><text class="fg-tag" x="250" y="314" text-anchor="middle" font-size="11">waves cancel</text><text class="fg-tag-warn" x="250" y="330" text-anchor="middle" font-size="11">→ no bond</text><text class="fg-tag" x="118" y="368" text-anchor="middle" font-size="11">node between the nuclei</text></svg><figcaption>Row 1 shows what the two shades mean. Rows 2 and 3 bring the same two hydrogen atoms together with their 1s orbitals in matching and in opposite phase.</figcaption></figure><!-- fig:phase-overlap:end --><div class="explain-box">Keep two things apart. A bond is overlap between orbitals on two different atoms. <b>Hybridization</b>, the next lesson, happens on one atom: it mixes its own orbitals into new shapes before it bonds. Hybrid orbitals are not shared between atoms; they are the shapes each atom brings to the overlap.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Oxygen is 1s² 2s² 2p⁴. By Hund\'s rule, how many unpaired electrons does it have?',

      }
