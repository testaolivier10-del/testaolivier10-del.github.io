<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'cyclohexanes',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('chair-bromocyclohexane'),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three separate kinds of strain add up in a ring.',
        bodyHtml: '<p class="step-body">Rings can be destabilized by three distinct, additive effects. <b>Angle strain</b> is the cost of forcing bond angles away from their ideal geometry — for an sp³ carbon, that ideal is the tetrahedral 109.5°. <b>Torsional strain</b> is the cost of eclipsing bonds, the same effect from the Newman Projections lesson, now applied around a ring instead of a single rotating bond. <b>Steric strain</b> is the cost of non-bonded atoms simply being too close together in space.</p><p class="step-body" style="margin-bottom:0;">A flat, planar ring is forced into specific bond angles by its geometry and has every adjacent C–H bond eclipsing its neighbor — so small, flat rings tend to accumulate both angle strain and torsional strain at once.</p>'
      },
      {
        render: function(api){
          var rings = [
            { key: 'cp3', label: 'Cyclopropane', strain: '27.5' },
            { key: 'cp4', label: 'Cyclobutane', strain: '26.3' },
            { key: 'cp5', label: 'Cyclopentane', strain: '6.2' },
            { key: 'cp6', label: 'Cyclohexane', strain: '~0' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the most strained of these four rings.</h2>' +
            '<p class="step-body">Each button shows the ring and its approximate total ring strain in kcal/mol.</p>' +
            '<div class="choice-row">' + rings.map(function(r){
              return '<button class="choice-btn" data-v="' + r.key + '" style="text-align:center;font:900 14px var(--font-mono);">' + r.label + '<br><span style="font-weight:700;font-size:11px;color:var(--muted);">' + r.strain + ' kcal/mol</span></button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'cp3';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Cyclopropane is the most strained — its 60° bond angles are wildly forced away from the ideal 109.5°, and being completely flat means every C–H bond is eclipsed. Cyclohexane, by contrast, has essentially zero ring strain.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Torsional strain in a ring comes from...',
        options: ['Bond angles being forced away from 109.5°', 'Eclipsing bonds around the ring, the same effect seen in Newman projections', 'Atoms simply being too heavy'],
        correctIndex: 1,
        correctFeedback: 'Correct — torsional strain is specifically about eclipsing interactions between bonds, distinct from angle strain.',
        wrongFeedback: 'That description is angle strain, a separate effect. Torsional strain is about eclipsing bonds, not bond angles.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Cyclohexane has almost zero total ring strain because...',
        options: ['It has no C–H bonds to eclipse', 'Six-membered rings are simply immune to strain by definition', 'Its chair conformation achieves near-ideal bond angles and fully staggered C–H bonds simultaneously'],
        correctIndex: 2,
        correctFeedback: 'Correct. The three-dimensional chair shape is the key — it isn\'t that cyclohexane can\'t experience angle or torsional strain, it\'s that its preferred conformation avoids both at once.',
        wrongFeedback: 'Cyclohexane has C–H bonds just like any other ring — the difference is its chair conformation, which lets it avoid both angle and torsional strain simultaneously.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The chair hits two targets that a flat ring can\'t hit together.',
        bodyHtml: '<p class="step-body">In the chair conformation, every C–C–C bond angle is close to 111° — nearly the ideal tetrahedral angle, so angle strain is almost eliminated. At the same time, if you sight down any C–C bond around the ring as a Newman projection, every adjacent pair of C–H bonds is staggered, not eclipsed — so torsional strain is eliminated too.</p><p class="step-body" style="margin-bottom:0;">A flat, planar hexagon can\'t do this: it would have 120° bond angles (a little angle strain, since 109.5° is ideal) and every adjacent C–H would eclipse its neighbor (full torsional strain). The chair\'s three-dimensional puckering is precisely what breaks that flat-ring trade-off.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Cyclohexane rings are everywhere, and the chair is the shape you\'ll always draw.',
        bodyHtml: '<div class="explain-box">Cyclohexane rings appear constantly in organic and biological molecules — steroids, sugars, many drugs. Because the chair is so strongly preferred over the flat or boat forms, essentially every substituted cyclohexane problem you\'ll solve this semester (and every ring-containing reaction requiring specific geometry, like anti-periplanar E2 elimination) is really a question about chair conformations. The next three lessons build directly on this chair shape.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Why can\'t a flat (planar) cyclohexane avoid strain the way the chair does?',
        options: ['A flat ring would have 120° bond angles and fully eclipsed C–H bonds — angle strain and torsional strain both', 'A flat ring has no bond angles at all', 'Flat rings are actually lower in energy than chairs'],
        correctIndex: 0,
        correctFeedback: 'Correct — a planar hexagon forces 120° angles (some angle strain, since 109.5° is ideal for sp³ carbon) and eclipses every adjacent C–H bond (torsional strain). The chair\'s puckered geometry avoids both problems at once, which is exactly why it\'s so strongly preferred.'
      }
    ]
  });
})();
</script>
