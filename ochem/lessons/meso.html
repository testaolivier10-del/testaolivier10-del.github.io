<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'meso',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The exception to 2ⁿ</h3><p class="step-body">Recall the 2ⁿ rule from the Stereocenters lesson: n stereocenters give a <i>maximum</i> of 2ⁿ stereoisomers. A <b>meso compound</b> is the reason that number is a maximum, not a guarantee: it\'s a molecule that has stereocenters, yet is <b>achiral overall</b> because it has an internal plane of symmetry, so two of its "expected" stereoisomers turn out to be the exact same achiral molecule.</p>' +
      '<h3>Worked example: tartaric acid</h3><p class="step-body">Tartaric acid, HOOC–CH(OH)–CH(OH)–COOH, has two stereocenters, so the 2ⁿ rule predicts up to 4 stereoisomers. Two of them — (R,R) and (S,S) — are genuine, non-superimposable mirror images of each other: a real enantiomeric pair, both chiral. But the third combination, (R,S), turns out to have an internal mirror plane cutting the molecule in half, making the top stereocenter\'s local environment the exact mirror of the bottom one. This (R,S) form is superimposable on its own mirror image (which would be (S,R) — but that\'s the same molecule, just flipped end-to-end) — so it is achiral, a <b>meso compound</b>. The real count for tartaric acid is 3 stereoisomers, not 4: (R,R), (S,S), and meso.</p>' +
      '<div class="notes-fact">The signature setup for a meso compound: a molecule that is symmetric end-to-end (the same sequence of groups reading from either end), with stereocenters arranged so that one "cancels out" the other\'s contribution to the overall shape.</div>' +
      '<h3>How to test for meso</h3><p class="step-body">Draw the molecule out (a Fischer projection, covered next lesson, makes this easiest) and look for an internal mirror plane splitting it into two identical mirror-image halves. If you find one, the molecule is meso — despite having stereocenters, it is achiral, has no enantiomer of its own, and does not rotate polarized light (its specific rotation is exactly zero, since it\'s achiral).</p>' +
      '<h3>Relationship between the three tartaric acid stereoisomers</h3><p class="step-body">(R,R)- and (S,S)-tartaric acid are enantiomers of each other. Meso-tartaric acid is a <b>diastereomer</b> of both (R,R) and (S,S) — it\'s a stereoisomer, but not their mirror image (its own mirror image is itself). Meso-tartaric acid also has a different melting point from the (R,R)/(S,S) pair, exactly as you\'d expect for a diastereomer relationship.</p>',
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('meso-tartaric-acid'),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A molecule can have stereocenters and still be achiral.',
        bodyHtml: '<p class="step-body">The 2ⁿ rule from the Stereocenters lesson is a <i>maximum</i>, not a guarantee — and <b>meso compounds</b> are exactly why. A meso compound has real stereocenters, but the molecule as a whole is still <b>achiral</b>, because it contains an internal plane of symmetry that makes it superimposable on its own mirror image.</p><p class="step-body" style="margin-bottom:0;">This can only happen in molecules with a specific kind of internal symmetry — typically, a molecule that reads the same sequence of groups from either end, with stereocenters positioned so that one half exactly mirrors the other.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Tartaric acid has 2 stereocenters. Click how many distinct stereoisomers actually exist.</h2>' +
            '<p class="step-body">HOOC–CH(OH)–CH(OH)–COOH. The 2ⁿ rule would predict a maximum of 4 — but one pairing turns out to have an internal mirror plane.</p>' +
            '<div class="choice-row">' +
            '<button class="choice-btn" data-v="4">4 — the full 2ⁿ maximum</button>' +
            '<button class="choice-btn" data-v="3">3 — one combination collapses into a meso (achiral) compound</button>' +
            '<button class="choice-btn" data-v="2">2 — only the enantiomers exist</button>' +
            '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === '3';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Right — tartaric acid has only 3 real stereoisomers: (R,R) and (S,S) form a genuine enantiomeric pair, but the (R,S) combination has an internal mirror plane and is achiral (meso) — it doesn\'t have a separate mirror-image partner of its own.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why is meso-tartaric acid achiral, despite having two stereocenters?',
        options: ['It doesn\'t actually have any stereocenters', 'Achiral molecules can never have this many oxygens', 'It has an internal plane of symmetry, making it superimposable on its own mirror image'],
        correctIndex: 2,
        correctFeedback: 'Correct — the internal mirror plane is the whole story. Having stereocenters doesn\'t automatically make a molecule chiral if there\'s enough internal symmetry to cancel it out.',
        wrongFeedback: 'Meso-tartaric acid genuinely does have two stereocenters — what makes it achiral is the internal mirror plane, not an absence of stereocenters.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'What is the relationship between meso-tartaric acid and (R,R)-tartaric acid?',
        options: ['Diastereomers — they\'re stereoisomers, but not mirror images', 'Enantiomers — they\'re non-superimposable mirror images', 'They are the same compound'],
        correctIndex: 0,
        correctFeedback: 'Correct. Meso-tartaric acid is a diastereomer of both (R,R) and (S,S) — a stereoisomer, but not their mirror image (its own mirror image is itself).',
        wrongFeedback: 'Enantiomers must be non-superimposable mirror images — meso-tartaric acid is its own mirror image (achiral), so it can\'t be the enantiomer of anything. It\'s a diastereomer of (R,R) instead.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The practical test: look for an internal mirror plane.',
        bodyHtml: '<p class="step-body">To check whether a molecule with multiple stereocenters is meso, draw it out fully (a Fischer projection, which you\'ll learn next lesson, is the traditional tool for exactly this) and look for an internal plane of symmetry cutting it into two identical, mirror-image halves. If one exists, the molecule is meso: achiral overall, with no separate enantiomer, and a measured specific rotation of exactly zero.</p><p class="step-body" style="margin-bottom:0;">This test only becomes relevant for molecules with a symmetric backbone — the same sequence of groups whether you read the structure from the left end or the right end. A molecule without that underlying symmetry (like most molecules with 2+ different, unrelated stereocenters) simply can\'t be meso; there\'s no internal mirror plane to find.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Meso compounds are a genuine trap on stereoisomer-counting problems.',
        bodyHtml: '<div class="explain-box">Whenever you\'re asked to count the total number of stereoisomers for a molecule, always check for a symmetric backbone before trusting the raw 2ⁿ number. Missing a meso possibility is one of the most common stereochemistry mistakes — you\'ll get a real number that\'s too high by counting a meso compound as two separate stereoisomers instead of one achiral molecule that happens to satisfy two of your labels at once.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A symmetric molecule has 2 stereocenters, and its (R,S) combination has an internal mirror plane. What is the (R,S) form\'s specific rotation, [α]?',
        options: ['The same as (R,R)', 'Exactly zero — it\'s achiral (meso) and doesn\'t rotate polarized light', 'The opposite sign of (S,S)'],
        correctIndex: 1,
        correctFeedback: 'Correct — an achiral molecule, meso compounds included, always shows zero optical rotation. Only chiral molecules (like the genuine (R,R)/(S,S) enantiomeric pair) rotate polarized light at all.'
      }
    ]
  });
})();
</script>
