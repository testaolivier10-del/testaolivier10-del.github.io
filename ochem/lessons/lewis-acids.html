document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* The step text talks about an empty p orbital and a lone pair, so both have
     to be on the page. This used to be the equation as plain text, which named
     the evidence and drew none of it. */
  function bf3nh3Svg(){
    return '<div class="scene"><svg viewBox="0 0 340 164" role="group" aria-label="BF3 with its empty p orbital and ammonia with its lone pair, forming the F3B-NH3 adduct">' +
      '<text x="60" y="150" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="9" fill="var(--muted)">empty p orbital</text>' +
      '<ellipse cx="60" cy="60" rx="9" ry="13" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<ellipse cx="60" cy="112" rx="9" ry="13" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<g class="atom" data-key="lewisacid">' +
        '<circle cx="60" cy="86" r="19" fill="var(--white)" stroke="var(--line)" stroke-width="2"/>' +
        '<text x="60" y="91" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12">BF₃</text>' +
      '</g>' +
      '<text x="112" y="91" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="15" fill="var(--muted)">+</text>' +
      '<g class="atom" data-key="lewisbase">' +
        '<circle cx="160" cy="86" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/>' +
        '<text x="160" y="83" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">N</text>' +
        '<text x="160" y="97" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">H₃</text>' +
      '</g>' +
      '<circle cx="154" cy="62" r="2.4" fill="var(--ink)"/><circle cx="166" cy="62" r="2.4" fill="var(--ink)"/>' +
      '<path d="M150 54 Q112 30 72 56" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
      '<polygon points="72,56 76.5,48.3 80.9,54.9" fill="var(--accent)"/>' +
      '<text x="116" y="20" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="9" fill="var(--muted)">the pair fills the empty orbital</text>' +
      '<text x="206" y="93" font-family="Nunito" font-weight="900" font-size="18" fill="var(--accent)">&#8594;</text>' +
      '<circle cx="282" cy="86" r="30" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/>' +
      '<text x="282" y="84" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">F₃B–NH₃</text>' +
      '<text x="282" y="97" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="8" fill="var(--muted)">new B–N bond</text>' +
      '<text x="252" y="44" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="9" fill="var(--muted)">− on B</text>' +
      '<text x="312" y="44" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="9" fill="var(--muted)">+ on N</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'lewis-acids',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Forget protons: a Lewis acid just needs an empty orbital.',
        bodyHtml: '<p class="step-body">The Brønsted-Lowry definition is about protons. The <b>Lewis</b> definition is broader and more general: a <b>Lewis acid</b> is an electron pair <b>acceptor</b>, and a <b>Lewis base</b> is an electron pair <b>donor</b>.</p><p class="step-body" style="margin-bottom:0;">Every Brønsted base is automatically a Lewis base too — it donates a lone pair to a proton. But Lewis acids don\'t need a proton at all. BF₃, AlCl₃, ZnCl₂, and carbocations are all Lewis acids: none of them needs a proton to act as an acid, but all of them have an empty (or easily accessible) orbital that can accept an incoming electron pair.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the Lewis acid, then the Lewis base.</h2>' +
            '<p class="step-body">BF₃ has only 6 electrons around boron — an incomplete octet, with the empty p orbital drawn above and below it. NH₃ has a lone pair on nitrogen it isn\'t using in a bond. One of them accepts a pair; the other supplies it.</p>' +
            bf3nh3Svg() +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var got = { lewisacid: false, lewisbase: false };
          function checkDone(){
            if(got.lewisacid && got.lewisbase){
              api.showFeedback(fb, true, 'Right — BF₃ is the Lewis acid (empty orbital, accepts the electron pair) and NH₃ is the Lewis base (lone pair, donates it). The nitrogen lone pair forms a brand-new bond to boron without breaking any existing bond. Now do the bookkeeping, because this is the classic trap: count formal charges on the adduct and neither atom is neutral. Nitrogen has four bonds where it normally has three, so it is +1; boron has four bonds and three valence electrons, 3 − 0 − 4 = −1. The molecule as a whole is neutral, but drawing it without those two charges is wrong.');
              next.disabled = false;
            }
          }
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(got[key]) return;
              got[key] = true;
              g.classList.add('chosen');
              if(key === 'lewisacid'){ api.record(true); }
              checkDone();
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which of these three species is the Lewis acid?',
        options: ['Water', 'A carbocation', 'Ammonia'],
        correctIndex: 1,
        correctFeedback: 'Correct — a carbocation\'s carbon has six valence electrons and an empty p orbital, so it accepts a pair. Water and ammonia each have lone pairs to give away, which makes them donors: Lewis bases.',
        wrongFeedback: 'Ask one question of each: does it have a pair going spare, or somewhere for a pair to land? Water and ammonia have lone pairs to donate. Only the carbocation has the empty orbital.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Ethene, CH₂=CH₂, has no lone pair anywhere. Can it act as a Lewis base?',
        options: ['No — a Lewis base has to donate a lone pair, and ethene has none', 'Yes — its pi bond is a loosely held pair of electrons it can donate', 'No — it has a full octet on both carbons, so it cannot react at all'],
        correctIndex: 1,
        correctFeedback: 'Correct. A Lewis base donates <i>a pair of electrons</i>, and the definition never said which kind. The pi pair sits above and below the C=C axis, held loosely, and an alkene hands it to an electron-pair acceptor exactly as ammonia hands over its lone pair.',
        wrongFeedback: 'Go back to the definition: electron-pair donor. A pi bond is a pair of electrons, held more loosely than a sigma pair because the overlap is sideways. Ethene donates that pair — which is the whole of alkene reactivity later in the course.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Lewis acid-base language covers almost every mechanism arrow you\'ll draw.',
        bodyHtml: '<p class="step-body">The Lewis definition collapses an enormous amount of organic chemistry into one idea: <b>a filled orbital (lone pair or pi bond) attacks an empty or accessible orbital.</b> <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-reactivity\">How Reactions Happen</a> renames the two partners — donor becomes <b>nucleophile</b>, acceptor becomes <b>electrophile</b> — but the physics is what you have just learned. SN2 substitution, carbonyl addition, enolate alkylation, and Friedel-Crafts acylation are all, underneath the specific mechanism name, Lewis acid-base reactions.</p><p class="step-body" style="margin-bottom:0;">This is also why some Lewis acids (AlCl₃, BF₃, ZnCl₂) show up as <b>catalysts</b> rather than reactants: they accept electron density from an electrophile that\'s too weak to react on its own, making it a stronger, more reactive electrophile. You\'ll see AlCl₃ do exactly this in Friedel-Crafts reactions (<a class=\"chapter-ref\" href=\"/ochem/learn.html#m-aromatic-chemistry\">Aromatic Chemistry</a>).</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Not every acid you\'ll meet this semester has a proton.',
        bodyHtml: '<div class="explain-box">If you only think in Brønsted terms, species like BF₃, carbocations, and metal catalysts won\'t make sense as "acids." The Lewis definition is the one that actually covers everything you\'ll encounter — keep both definitions, but default to Lewis thinking (electron pair acceptor/donor) whenever a reaction doesn\'t obviously involve a proton changing hands.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'AlCl₃ is added to a reaction as a catalyst. What role is it playing?',
        options: ['Lewis acid — it accepts electron density to activate an electrophile', 'Lewis base — it donates a lone pair', 'Brønsted acid — it donates a proton'],
        correctIndex: 0,
        correctFeedback: 'Correct — aluminum in AlCl₃ has an incomplete octet and an empty orbital, just like boron in BF₃, making it a Lewis acid that activates electrophiles it\'s bound to.'
      }
    ]
  });
})();
});
</script>
