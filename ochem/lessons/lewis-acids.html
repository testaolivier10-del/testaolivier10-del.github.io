// page is deferred so the page can paint before they arrive, and deferred

document.addEventListener('DOMContentLoaded', function(){
(function(){
  function bf3nh3Svg(){
    return '<div class="scene"><svg viewBox="0 0 300 110">' +
      '<g class="atom" data-key="lewisacid"><circle cx="70" cy="55" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="70" y="60" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">BF₃</text></g>' +
      '<text x="112" y="60" font-family="Nunito" font-weight="800" font-size="16" fill="var(--muted)">+</text>' +
      '<g class="atom" data-key="lewisbase"><circle cx="155" cy="55" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="155" y="52" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">N</text><text x="155" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">H₃</text></g>' +
      '<text x="192" y="60" font-family="Nunito" font-weight="900" font-size="18" fill="var(--accent)">&#8594;</text>' +
      '<circle cx="250" cy="55" r="26" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="250" y="52" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11">F₃B–NH₃</text><text x="250" y="66" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="9">(new bond)</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'lewis-acids',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Forget protons: a Lewis acid just needs an empty orbital.',
        bodyHtml: '<p class="step-body">The Brønsted-Lowry definition is about protons. The <b>Lewis</b> definition is broader and more general: a <b>Lewis acid</b> is an electron pair <b>acceptor</b>, and a <b>Lewis base</b> is an electron pair <b>donor</b>.</p><p class="step-body" style="margin-bottom:0;">Every Brønsted base is automatically a Lewis base too — it donates a lone pair to a proton. But Lewis acids don\'t need a proton at all. BF₃, AlCl₃, ZnCl₂, and carbocations are all Lewis acids: none of them can donate a proton, but all of them have an empty (or easily accessible) orbital that can accept an incoming electron pair.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the Lewis acid, then the Lewis base.</h2>' +
            '<p class="step-body">BF₃ has only 6 electrons around boron — an incomplete octet with an empty p orbital. NH₃ has a lone pair on nitrogen it isn\'t using in a bond.</p>' +
            bf3nh3Svg() +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var got = { lewisacid: false, lewisbase: false };
          function checkDone(){
            if(got.lewisacid && got.lewisbase){
              api.showFeedback(fb, true, 'Right — BF₃ is the Lewis acid (empty orbital, accepts the electron pair) and NH₃ is the Lewis base (lone pair, donates it). The nitrogen lone pair forms a brand-new bond to boron without breaking any existing bond.');
              next.disabled = false;
            }
          }
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(got[key]) return;
              got[key] = true;
              g.classList.add('chosen');
              if(key === 'lewisacid'){ api.record(true); }
              checkDone();
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which of these can be a Lewis acid even though it has no proton to donate?',
        options: ['Water, since it has lone pairs', 'A carbocation, since it has an empty p orbital', 'Ammonia, since it has a lone pair'],
        correctIndex: 1,
        correctFeedback: 'Correct — a carbocation\'s empty p orbital can accept an electron pair, making it a Lewis acid with no proton in sight.',
        wrongFeedback: 'Water and ammonia both have lone pairs to donate, which makes them electron pair donors — Lewis bases, not Lewis acids.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'In Module 2 terms, a Lewis base is the same thing as a...',
        options: ['electrophile', 'leaving group', 'nucleophile'],
        correctIndex: 2,
        correctFeedback: 'Correct. Both are electron pair donors — "Lewis base" and "nucleophile" describe the same electron-rich role, just in different vocabularies.',
        wrongFeedback: 'An electrophile accepts electrons (that\'s the Lewis acid role) — a Lewis base donates them, which is the nucleophile role.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Lewis acid-base language covers almost every mechanism arrow you\'ll draw.',
        bodyHtml: '<p class="step-body">Once you accept that a Lewis base = nucleophile and a Lewis acid = electrophile, an enormous amount of organic chemistry collapses into one idea: <b>a filled orbital (lone pair or pi bond) attacks an empty or accessible orbital.</b> SN2 substitution, carbonyl addition, enolate alkylation, and Friedel-Crafts acylation are all, underneath the specific mechanism name, Lewis acid-base reactions.</p><p class="step-body" style="margin-bottom:0;">This is also why some Lewis acids (AlCl₃, BF₃, ZnCl₂) show up as <b>catalysts</b> rather than reactants: they accept electron density from an electrophile that\'s too weak to react on its own, making it a stronger, more reactive electrophile. You\'ll see AlCl₃ do exactly this in Friedel-Crafts reactions (Module 13).</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Not every acid you\'ll meet this semester has a proton.',
        bodyHtml: '<div class="explain-box">If you only think in Brønsted terms, species like BF₃, carbocations, and metal catalysts won\'t make sense as "acids." The Lewis definition is the one that actually covers everything you\'ll encounter — keep both definitions, but default to Lewis thinking (electron pair acceptor/donor) whenever a reaction doesn\'t obviously involve a proton changing hands.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'AlCl₃ is added to a reaction as a catalyst. What role is it playing?',
        options: ['Lewis acid — it accepts electron density to activate an electrophile', 'Lewis base — it donates a lone pair', 'Brønsted acid — it donates a proton'],
        correctIndex: 0,
        correctFeedback: 'Correct — aluminum in AlCl₃ has an incomplete octet and an empty orbital, just like boron in BF₃, making it a Lewis acid that activates electrophiles it\'s bound to.'
      }
    ]
  });
})();
});
</script>
