    <h1 style="margin-bottom:4px;">Aldol reactions.</h1>
    <p class="lede" style="margin-top:0;">An enolate is a carbon nucleophile — point it at a second carbonyl and you build a new C–C bond with a fresh OH sitting beta to the original carbonyl.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'aldol',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The enolate as a carbon nucleophile</h3><p class="step-body">The carbon-centered resonance contributor of an enolate (Alpha Hydrogens lesson) means the alpha carbon itself carries real nucleophilic character, even though most of the negative charge sits formally on oxygen. Given a second carbonyl to attack, the enolate\'s alpha carbon behaves exactly like any other carbon nucleophile from this course (an acetylide, Alkynes lesson, or a Grignard, Nucleophilic Addition lesson) — it attacks the electrophilic carbonyl carbon of a second molecule, forming a new C–C bond.</p>' +
      '<h3>The aldol reaction, step by step</h3><p class="step-body">(1) Base removes an alpha hydrogen from one carbonyl molecule, forming its enolate. (2) That enolate\'s alpha carbon attacks the carbonyl carbon of a <b>second</b> carbonyl molecule (which can be a second molecule of the same compound, or a different one), exactly as in ordinary nucleophilic addition (pi electrons move to oxygen, forming a tetrahedral alkoxide). (3) The alkoxide is protonated, giving the final product: a <b>beta-hydroxy carbonyl</b> — a molecule with a new OH group sitting exactly two carbons away from the (unreacted) carbonyl that\'s left over from the original enolate-forming molecule.</p>' +
      '<div class="notes-fact">The name "aldol" itself literally describes the product: ALD(ehyde) + (alcoh)OL — a molecule containing both a carbonyl and a hydroxyl. The same reaction with ketone starting materials is still called an aldol reaction even though no aldehyde may be present in a mixed case.</div>' +
      '<h3>Aldol condensation: heat pushes further, to an enone</h3><p class="step-body">The beta-hydroxy carbonyl aldol product has its own alpha hydrogen sitting between the new OH and the carbonyl — a setup that\'s primed for an E1cb-style elimination (an alpha deprotonation followed by loss of the beta-hydroxyl as a leaving group, conjugating the new C=C directly with the carbonyl). Under heat (or with continued acid/base catalysis and time), this dehydration proceeds spontaneously, because the product — an <b>enone</b> (a carbonyl conjugated with a C=C, i.e. an alpha,beta-unsaturated carbonyl) — is resonance-stabilized and thermodynamically more stable than the isolated aldol product. This overall two-stage sequence (aldol addition, then dehydration) is called an <b>aldol condensation</b>.</p>' +
      '<h3>Crossed aldol reactions and why they need control</h3><p class="step-body">Mixing two different carbonyl compounds, each with its own alpha hydrogens, in principle allows four different aldol products (each compound\'s enolate could attack either compound\'s carbonyl) — an unselective mess in the general case. Selectivity is achieved either by using one component with no alpha hydrogens at all (so it can only act as the electrophile, never form its own enolate — a classic strategy using aromatic aldehydes, previewed further in Module 13), or by using a strong, bulky base like LDA at low temperature to fully and irreversibly convert only one component to its enolate before the second component is even added.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'An enolate attacking a second carbonyl builds a new carbon-carbon bond.',
        bodyHtml: '<p class="step-body">The enolate\'s carbon-centered resonance form (from the previous lesson) means the alpha carbon carries genuine nucleophilic character. Give it a second carbonyl compound to react with, and it attacks that carbonyl carbon exactly like any other carbon nucleophile — Grignards and acetylides included — forming a brand-new C–C bond.</p><p class="step-body" style="margin-bottom:0;">This is called the <b>aldol reaction</b>: base deprotonates an alpha hydrogen on one carbonyl compound (forming its enolate), that enolate\'s carbon attacks the carbonyl carbon of a second molecule, and the resulting alkoxide is protonated to give a product carrying both a hydroxyl (from the electrophile\'s former carbonyl) and the original carbonyl (from the nucleophile), now two carbons apart.</p>'
      },
      {
        render: function(api){
          var stages = [
            { key: 'deprot', label: 'Base removes an alpha hydrogen, forming an enolate' },
            { key: 'attack', label: 'The enolate\'s carbon attacks a second carbonyl\'s carbon' },
            { key: 'tet', label: 'A tetrahedral alkoxide intermediate forms on the second molecule' },
            { key: 'proton', label: 'The alkoxide is protonated, giving the beta-hydroxy carbonyl product' }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the four stages of the aldol reaction in order.</h2>' +
            '<div class="choice-row" style="flex-direction:column;">' + stages.map(function(s){
              return '<button class="choice-btn" data-v="' + s.key + '">' + s.label + '</button>';
            }).join('') + '</div>' +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Correct clicks: 0 / 4</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var hint = api.card.querySelector('#hint');
          var next = api.card.querySelector('#nextBtn');
          var order = ['deprot', 'attack', 'tet', 'proton'];
          var idx = 0, mistake = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(btn.disabled) return;
              var key = btn.getAttribute('data-v');
              if(key === order[idx]){
                btn.disabled = true;
                btn.classList.add('correct');
                idx++;
                hint.textContent = 'Correct clicks: ' + idx + ' / 4';
                if(idx === 4){
                  api.record(!mistake);
                  api.showFeedback(fb, !mistake, mistake ? 'You got there, but out of order at first. Deprotonate, attack, form the tetrahedral intermediate, then protonate.' : 'Exactly right — this four-stage sequence is the complete aldol addition mechanism.');
                  next.disabled = false;
                }
              } else {
                mistake = true;
                btn.classList.add('wrong');
                setTimeout(function(){ btn.classList.remove('wrong'); }, 500);
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'The aldol product carries a new hydroxyl group how many carbons away from the carbonyl that survived the reaction?',
        options: ['Two carbons away (a "beta-hydroxy carbonyl")', 'On the same carbon as the surviving carbonyl', 'It varies randomly depending on the reagents'],
        correctIndex: 0,
        correctFeedback: 'Correct — the new C–C bond connects the alpha carbon to the electrophile\'s former carbonyl carbon, placing the new OH exactly at the beta position relative to the remaining carbonyl.',
        wrongFeedback: 'Trace the new bond: it forms between the alpha carbon (adjacent to the surviving carbonyl) and the former carbonyl carbon of the other molecule — that places the new OH two carbons, not zero, away.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Heat drives dehydration to a conjugated enone — the aldol condensation.',
        bodyHtml: '<p class="step-body">The beta-hydroxy carbonyl aldol product has an alpha hydrogen sitting right between the new hydroxyl and the surviving carbonyl — a setup practically built for elimination. Deprotonating that alpha hydrogen and losing the beta-hydroxide (an E1cb-style mechanism: deprotonation first, then loss of the leaving group, rather than concerted) forms a new C=C directly conjugated with the carbonyl.</p><p class="step-body" style="margin-bottom:0;">The product, called an <b>enone</b> (an alpha,beta-unsaturated carbonyl), is stabilized by conjugation between the C=C and C=O pi systems — extra resonance delocalization that makes it thermodynamically more stable than the isolated (non-conjugated) beta-hydroxy carbonyl. Because of that added stability, heating an aldol reaction mixture drives this dehydration forward, and the overall two-stage sequence (addition, then elimination) is called an <b>aldol condensation</b>.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Check Understanding',
        title: 'Why does heat push the aldol addition product toward dehydration (the enone)?',
        options: ['The enone\'s conjugated C=C–C=O system is resonance-stabilized and thermodynamically more stable than the isolated beta-hydroxy carbonyl', 'Heat always converts alcohols into alkenes regardless of context', 'The enone forms faster, not because it is more stable'],
        correctIndex: 0,
        correctFeedback: 'Correct — the driving force is thermodynamic stability from conjugation, and heat provides the energy needed to reach that more stable, dehydrated product.',
        wrongFeedback: 'This dehydration is specifically favorable here because of conjugation stabilizing the enone product — it\'s not a generic property of all alcohols under heat.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Crossed aldol reactions need a way to control which molecule becomes the nucleophile.',
        bodyHtml: '<div class="explain-box">Mix two different carbonyl compounds, each with alpha hydrogens, and you get an unselective mixture: either compound could form the enolate, and that enolate could attack either compound\'s carbonyl — four possible products in the worst case. Chemists solve this two ways: use an electrophile with no alpha hydrogens at all (so it can never form its own enolate — often an aromatic aldehyde, which you\'ll meet properly in Module 13), or pre-form one compound\'s enolate completely and irreversibly with a strong, bulky, non-nucleophilic base like LDA at low temperature before ever introducing the second compound. Both strategies are really just applications of controlling which species gets to act as nucleophile versus electrophile — the same conceptual question from every substitution/addition reaction so far.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 6 · Independent Practice',
        title: 'Benzaldehyde (an aromatic aldehyde with no alpha hydrogens) is mixed with acetone (which has alpha hydrogens) and base. What is the expected outcome?',
        options: ['Acetone\'s enolate forms and attacks benzaldehyde\'s carbonyl — a clean, selective crossed aldol, since benzaldehyde cannot form its own enolate', 'A random, unselective mixture of four different products', 'No reaction occurs since one component lacks alpha hydrogens'],
        correctIndex: 0,
        correctFeedback: 'Correct — with only one component capable of forming an enolate, the crossed aldol proceeds cleanly and selectively in one direction.',
        wrongFeedback: 'Having only one alpha-hydrogen-bearing partner is exactly what makes this combination selective, not unreactive or random.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Acetone is treated with dilute NaOH and gently heated. Predict the general shape of the major product.',
        options: ['An enone — the aldol addition product between two acetone molecules, dehydrated under heat to a conjugated alpha,beta-unsaturated ketone', 'Simple acetone hydrate, as seen in the Aldehydes & Ketones lesson', 'No reaction, since acetone has no acidic protons'],
        correctIndex: 0,
        correctFeedback: 'Correct — acetone has accessible alpha hydrogens, so base forms its enolate, which attacks a second acetone molecule; heat then drives the subsequent dehydration to the resonance-stabilized enone (mesityl oxide, in this specific case).'
      }
    ]
  });
})();
</script>
