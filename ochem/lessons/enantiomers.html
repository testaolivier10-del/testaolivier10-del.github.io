<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'enantiomers',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The definition</h3><p class="step-body"><b>Enantiomers</b> are a pair of stereoisomers that are non-superimposable mirror images of each other — exactly the chirality relationship from the first lesson, now applied to a specific pair of molecules. A single stereocenter has exactly two possible configurations, and a molecule with one stereocenter and its mirror image are enantiomers of each other.</p>' +
      '<h3>Identical physical properties — with one exception</h3><p class="step-body">Enantiomers have identical melting points, boiling points, density, solubility, and reactivity with achiral reagents — every ordinary physical measurement gives the same answer for both. The one exception: they rotate <b>plane-polarized light</b> in opposite directions by the same magnitude. This property is called <b>optical activity</b>, and it\'s historically how enantiomers were first discovered and told apart, long before anyone understood molecular structure.</p>' +
      '<div class="notes-fact">A molecule that rotates polarized light clockwise (viewed facing the oncoming beam) is labeled (+) or <i>d</i> (dextrorotatory); one that rotates it counterclockwise is (−) or <i>l</i> (levorotatory). This (+)/(−) label describes an experimentally measured direction of rotation and has no fixed relationship to the R/S configuration label you\'ll learn in a later lesson — you cannot predict (+) or (−) just by looking at a structure.</div>' +
      '<h3>Specific rotation: a quantitative measurement</h3><p class="step-body">The exact amount of rotation is reported as <b>specific rotation</b>, [α], measured in a polarimeter and normalized for concentration and path length: [α] = α / (l × c), where α is the observed rotation in degrees, l is the path length in decimeters, and c is concentration in g/mL. Pure (+)-enantiomer and pure (−)-enantiomer of the same compound have specific rotations that are exact opposites (equal magnitude, opposite sign).</p>' +
      '<h3>Why they behave differently in biology</h3><p class="step-body">Even though enantiomers are identical in an achiral environment, they can behave completely differently in a <b>chiral environment</b> — like the active site of an enzyme, which is itself chiral. Only one enantiomer may fit properly, the same way only one of your hands fits comfortably into a right-handed glove. This is the molecular basis for why drug enantiomers can have dramatically different biological effects, even though they\'d be indistinguishable by melting point or boiling point.</p>',
    steps: [
      {
        diagramHtml: window.OchemMolecules.svg('bromochlorofluoromethane', { caption: 'One stereocenter, so exactly two forms exist: this one and its non-superimposable mirror image. Same bonds, same energies, opposite handedness.' }),
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Enantiomers are the chirality relationship, applied to a specific pair.',
        bodyHtml: '<p class="step-body"><b>Enantiomers</b> are a pair of molecules that are non-superimposable mirror images of each other — this is exactly the definition of chirality from the first lesson, now describing the relationship between two specific molecules rather than a property of one molecule alone. A stereocenter has exactly two possible spatial arrangements; a molecule built with one arrangement and the same molecule built with the other are enantiomers.</p><p class="step-body" style="margin-bottom:0;">Every physical property you\'d normally use to characterize a compound — melting point, boiling point, density, solubility — is <b>identical</b> between a pair of enantiomers. This might seem surprising, but it follows directly from the fact that they\'re built from exactly the same atoms with exactly the same bonds, just arranged as mirror images.</p>'
      },
      {
        render: function(api){
          var props = [
            { key: 'mp', label: 'Melting point', same: true },
            { key: 'bp', label: 'Boiling point', same: true },
            { key: 'rotation', label: 'Direction of rotating polarized light', same: false },
            { key: 'density', label: 'Density', same: true }
          ];
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the one property below where a pair of enantiomers actually differ.</h2>' +
            '<p class="step-body">Three of these four properties are identical between enantiomers. One is not.</p>' +
            '<div class="choice-row">' + props.map(function(p){
              return '<button class="choice-btn" data-v="' + p.key + '">' + p.label + '</button>';
            }).join('') + '</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelectorAll('.choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              if(answered) return;
              answered = true;
              var isCorrect = btn.getAttribute('data-v') === 'rotation';
              api.card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
              btn.classList.add(isCorrect ? 'correct' : 'wrong');
              api.record(isCorrect);
              api.showFeedback(fb, isCorrect, 'Right — enantiomers rotate plane-polarized light in exactly opposite directions (by the same magnitude), while melting point, boiling point, and density are all identical between them.');
              next.disabled = false;
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'A compound labeled (+) rotates polarized light...',
        options: ['Clockwise (dextrorotatory)', 'Counterclockwise (levorotatory)', 'It doesn\'t rotate light at all'],
        correctIndex: 0,
        correctFeedback: 'Correct — (+) or d- means clockwise rotation, viewed facing the oncoming light beam.',
        wrongFeedback: '(+) specifically denotes clockwise rotation — counterclockwise would be labeled (−) or l-.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Can you predict whether a molecule is (+) or (−) just by looking at its structure?',
        options: ['Yes — R is always (+) and S is always (−)', 'No — (+)/(−) is an experimentally measured property with no fixed relationship to structure alone', 'Yes — molecules with more carbons are always (+)'],
        correctIndex: 1,
        correctFeedback: 'Correct. The direction of optical rotation must be measured in a polarimeter — it has no simple, predictable relationship to the R/S configuration label.',
        wrongFeedback: 'This is a common misconception — R/S configuration (a structural label) and (+)/(−) rotation (an experimentally measured property) are not linked by any general rule.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Specific rotation puts an exact number on optical activity.',
        bodyHtml: '<p class="step-body">The precise amount a compound rotates polarized light is reported as <b>specific rotation</b>, symbol [α], measured with an instrument called a polarimeter: [α] = α / (l × c), where α is the observed rotation in degrees, l is the sample path length in decimeters, and c is the concentration in g/mL. Normalizing by path length and concentration lets chemists compare rotation values measured under different experimental conditions.</p><p class="step-body" style="margin-bottom:0;">A pure sample of one enantiomer and a pure sample of the other enantiomer of the same compound always have specific rotations that are exact opposites — same magnitude, opposite sign. A 50:50 mixture of both enantiomers (called a <b>racemic mixture</b>, which you saw form in the SN1 mechanism lesson) shows zero net rotation, because the two equal-and-opposite contributions exactly cancel.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'A chiral environment can tell enantiomers apart, even when nothing else can.',
        bodyHtml: '<div class="explain-box">Enzymes, receptors, and most of the molecular machinery of biology are chiral. Just like your right hand fits a right-handed glove but not a left one, a chiral enzyme active site may bind one enantiomer of a drug tightly while barely interacting with its mirror image — even though the two enantiomers are indistinguishable by every ordinary physical measurement. This is why a drug\'s enantiomers can differ dramatically in potency, side effects, or even toxicity.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A racemic mixture (50:50 of both enantiomers) is placed in a polarimeter. What rotation do you expect to observe?',
        options: ['Double the rotation of either pure enantiomer', 'The same rotation as the (+) enantiomer alone', 'Zero — the equal and opposite rotations from each enantiomer cancel out'],
        correctIndex: 2,
        correctFeedback: 'Correct — since the two enantiomers rotate light by equal magnitude in opposite directions, a 50:50 mixture shows a net rotation of exactly zero. This is why a racemic mixture is sometimes labeled (±).'
      }
    ]
  });
})();
</script>
