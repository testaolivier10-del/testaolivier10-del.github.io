<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* 3-Methylhexane, drawn so the longest chain is NOT the horizontal row.

     The horizontal row A–B–C–D–E is five carbons. The longest continuous
     path turns the corner at D and runs down the branch: A–B–C–D–F–G, six.
     So the molecule is a hexane with a methyl at C3, and E — the carbon that
     looks like part of the main chain because it is in line with it — is the
     substituent. That is the whole trap, and clicking E is what the step is
     built to catch. */
  var C_ = {
    a:{x:32, y:62},  b:{x:62, y:84},  c:{x:92, y:62},
    d:{x:122,y:84},  e:{x:152,y:62},
    f:{x:122,y:120}, g:{x:152,y:142}
  };
  var BONDS = [['a','b'],['b','c'],['c','d'],['d','e'],['d','f'],['f','g']];
  var CHAIN = ['a','b','c','d','f','g'];   // the six that form the parent
  var BRANCH = 'e';                        // the one-carbon substituent

  function skeleton(){
    var lines = BONDS.map(function(p){
      var A = C_[p[0]], B = C_[p[1]];
      return '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y +
             '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
    }).join('');
    var hits = Object.keys(C_).map(function(k){
      return '<g class="atom" data-key="' + k + '" role="button" tabindex="0" aria-label="carbon ' + k.toUpperCase() + '">' +
        '<circle cx="' + C_[k].x + '" cy="' + C_[k].y + '" r="15" fill="transparent" stroke="transparent" stroke-width="2"/></g>';
    }).join('');
    return '<div class="scene"><svg viewBox="0 0 200 175" role="group" ' +
      'aria-label="A branched alkane. Five carbons run across the page and two more continue downward from the fourth of them.">' +
      lines + hits + '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'naming-parent-chain',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A name is not chosen. It is derived.',
        bodyHtml: '<p class="step-body">That is the whole point of IUPAC nomenclature: a name is a set of instructions for drawing the molecule. Two chemists who have never met describe the same structure identically, and a name you have never seen before still tells you what to draw. Learning it is not memorization — it is learning to run a procedure in a fixed order.</p>' +
          '<p class="step-body">Every name is built from three pieces, always in this order: <b>prefix</b> (what is hanging off it) + <b>root</b> (how long the parent chain is) + <b>suffix</b> (what the main functional group is). In <b>2-methylbutan-1-ol</b> the prefix is <i>2-methyl</i>, the root is <i>but</i>, and the suffix is <i>-1-ol</i>.</p>' +
          '<p class="step-body" style="margin-bottom:0;">This lesson is about the root. The root says how many carbons are in the parent chain, and ten words cover almost everything: <b>meth</b> 1, <b>eth</b> 2, <b>prop</b> 3, <b>but</b> 4, <b>pent</b> 5, <b>hex</b> 6, <b>hept</b> 7, <b>oct</b> 8, <b>non</b> 9, <b>dec</b> 10. Add <b>-ane</b> and you have named the alkanes.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Rule 1: the parent is the longest continuous chain of carbons.',
        bodyHtml: '<p class="step-body">Find the longest unbroken path of carbons through the molecule. That path is the parent; everything not on it is a substituent named in the prefix. The word doing the work is <b>continuous</b> — you may turn as many corners as you like, and you may not jump a gap or pass through the same carbon twice.</p>' +
          '<p class="step-body">The trap is that molecules are drawn for the convenience of whoever drew them, and the longest chain is very often <i>not</i> the one lying horizontally across the page. Pick the wrong parent and every number after it is wrong too, so this is the step where a name goes wrong earliest.</p>' +
          '<p class="step-body" style="margin-bottom:0;">One more thing to watch: <b>count carbons, not line segments.</b> A chain of six carbons is drawn with five bonds, so counting the lines is off by one every time. It is the same miscount as forgetting the ends of a skeletal structure, wearing different clothes.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the carbons that make up the parent chain.</h2>' +
            '<p class="step-body">Trace the longest continuous path through this molecule. You may turn corners. Whatever you leave out is a substituent.</p>' +
            skeleton() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Carbons in the chain: 0</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var picked = {};
          var count = 0;
          var missed = false;

          function take(g){
            var key = g.getAttribute('data-key');
            if(picked[key]) return;
            if(key === BRANCH){
              missed = true;
              g.classList.add('atom--wrong');
              api.showFeedback(fb, false, 'That one is the substituent. It sits in line with the row across the page, which is exactly why it looks like part of the main chain — but taking it would mean turning off the path and back onto it. Follow the longer route down instead.');
              return;
            }
            picked[key] = true;
            count++;
            g.classList.add('chosen');
            hint.textContent = 'Carbons in the chain: ' + count;
            if(count === CHAIN.length){
              api.showFeedback(fb, true, missed
                ? 'Six carbons — a hexane. The chain turns the corner and runs down the branch, and the carbon left over is a methyl (a one-carbon branch) on the third carbon: 3-methylhexane.'
                : 'Six carbons, first time, including the turn. The row across the page was only five; the longest path goes down the branch instead. The carbon left over is a methyl — a one-carbon branch — making this 3-methylhexane.');
              api.record(!missed);
              next.disabled = false;
            }
          }

          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){ take(g); });
            g.addEventListener('keydown', function(e){
              if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); take(g); }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Two different paths through a molecule are both seven carbons long. One carries a single ethyl group, the other carries two methyls. Which is the parent?',
        options: [
          'The one with the single ethyl group — fewer substituents makes a simpler name',
          'The one with two methyls — when chains tie, take the one with more substituents',
          'Either; a tie means the name is ambiguous',
          'Whichever is drawn more horizontally'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. It reads backwards — you deliberately pick the messier-looking parent — but the reason is that a name should describe as much of the molecule as possible with locants, rather than burying part of it inside a complicated branch name.',
        wrongFeedback: 'A tie is never ambiguous; there is a rule for it. Think about which choice puts more of the molecule into numbered prefixes rather than hiding it inside one big branch.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Numbered from one end the substituents fall at 2, 3 and 6; from the other end, at 2, 5 and 6. Which numbering wins?',
        options: [
          '{2, 3, 6} — compare term by term, and it wins at the first point of difference',
          '{2, 5, 6} — it has the higher last number, which breaks the tie',
          '{2, 3, 6} — because 2+3+6 is smaller than 2+5+6',
          'Neither; you would renumber from a different carbon'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and the reasoning matters as much as the answer. You compare the sets term by term and stop at the first place they differ: both start at 2, and then 3 beats 5. Adding the numbers up happens to give the same answer here and does not in general — a decane substituted at {2, 7, 8} versus {3, 4, 9} is decided the other way by the two methods.',
        wrongFeedback: 'Compare the two sets one term at a time, left to right, and stop at the first place they differ. Totals are not what the rule uses, even when they agree with it.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Punctuation is part of the name.',
        bodyHtml: '<p class="step-body">Names are written to be read unambiguously, and the punctuation carries meaning rather than decorating it. Numbers are separated from letters by <b>hyphens</b> and from each other by <b>commas</b>: 2,3-dimethylpentane — never 2 3 dimethylpentane, and never 2-3-dimethyl pentane. There is no space anywhere inside the name of a single compound, except in names like "acetic acid" where the second word names a class.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Modern IUPAC also puts a locant immediately before the part of the name it refers to, which is why this course writes <b>but-2-ene</b> and <b>butan-1-ol</b> rather than 2-butene and 1-butanol. Both styles are in wide use and older textbooks use the second, so read both and write the first.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'A six-carbon chain carries one methyl group. Counting from the left it sits on C3; from the right, on C4. What is the name?',
        options: ['4-methylhexane', '3-methylhexane', '3-methylpentane', 'methylhexane'],
        correctIndex: 1,
        correctFeedback: 'Correct. Six carbons in the parent gives <i>hex</i>, no functional group gives <i>-ane</i>, and 3 beats 4 so the chain is numbered from the left. The locant is required here because the methyl genuinely could have been somewhere else.',
        wrongFeedback: 'Two decisions: how many carbons are in the parent chain, and which of the two numbering directions gives the lower locant. One of the options gets the chain length wrong and one drops the locant entirely.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A structure is drawn as a straight row of four carbons with an ethyl group hanging off the second one. A student names it 2-ethylbutane. What went wrong?',
        options: [
          'Nothing — four carbons in the row, ethyl on the second, so 2-ethylbutane is right',
          'The longest chain runs through the ethyl group: it is a five-carbon chain, making this 3-methylpentane',
          'The ethyl should be numbered from the other end, giving 3-ethylbutane',
          'Ethyl groups are never named as substituents'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Count from every end. From the far end of the ethyl, through the carbon it hangs from and on to the far end of the row is two, plus one, plus two: a continuous path of five carbons, longer than the four-carbon row that was drawn horizontally. So the parent is pentane, and the carbon left over — the near end of the row — is a methyl on C3: 3-methylpentane. An ethyl on the second carbon of a row can never survive as an ethyl, because the route through it is always one longer than the row. (Had the row been five carbons with the ethyl on the middle one, every route would have tied at five and 3-ethylpentane would have been right; the drawing decides, and only counting tells you which case you have.)'
      }
    ]
  });

})();
});
</script>
