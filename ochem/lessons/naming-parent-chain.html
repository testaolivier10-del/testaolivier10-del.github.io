document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* 3-Methylhexane, drawn so the longest chain is NOT the horizontal row.

     The horizontal row A–B–C–D–E is five carbons. The longest continuous
     path turns the corner at D and runs down the branch: A–B–C–D–F–G, six.
     So the molecule is a hexane with a methyl at C3, and E — the carbon that
     looks like part of the main chain because it is in line with it — is the
     substituent. That is the whole trap, and clicking E is what the step is
     built to catch. */
  var C_ = {
    a:{x:32, y:62},  b:{x:62, y:84},  c:{x:92, y:62},
    d:{x:122,y:84},  e:{x:152,y:62},
    f:{x:122,y:120}, g:{x:152,y:142}
  };
  var BONDS = [['a','b'],['b','c'],['c','d'],['d','e'],['d','f'],['f','g']];
  var CHAIN = ['a','b','c','d','f','g'];   // the six that form the parent
  var BRANCH = 'e';                        // the one-carbon substituent

  function skeleton(){
    var lines = BONDS.map(function(p){
      var A = C_[p[0]], B = C_[p[1]];
      return '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y +
             '" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>';
    }).join('');
    /* The chain's numbers, shown once the parent has been traced. Counted
       from G so the methyl (E) lands on C3. Each number sits more than 20
       units from its carbon, outside the 15-unit click circle that fills in
       when the carbon is chosen, and they are drawn after the circles. */
    var NUMS = [['g',1,176,158],['f',2,98,124],['d',3,142,108],['c',4,92,40],['b',5,62,110],['a',6,32,40]];
    var numText = '<g id="chainNums" style="display:none">' + NUMS.map(function(n){
      return '<text x="' + n[2] + '" y="' + n[3] + '" text-anchor="middle" font-size="12" font-weight="900" fill="var(--accent)" style="font-family:var(--font-mono)">' + n[1] + '</text>';
    }).join('') + '<text x="152" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)" style="font-family:var(--font-mono)">methyl</text></g>';
    var hits = Object.keys(C_).map(function(k){
      return '<g class="atom" data-key="' + k + '" role="button" tabindex="0" aria-label="carbon ' + k.toUpperCase() + '">' +
        '<circle cx="' + C_[k].x + '" cy="' + C_[k].y + '" r="15" fill="transparent" stroke="transparent" stroke-width="2"/></g>';
    }).join('');
    return '<div class="scene"><svg viewBox="0 0 200 175" role="group" ' +
      'aria-label="A branched alkane. Five carbons run across the page and two more continue downward from the fourth of them.">' +
      lines + hits + numText + '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'naming-parent-chain',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A name is not chosen. It is derived.',
        bodyHtml: '<p class="step-body">Start with one name: <b>2-methylbutan-1-ol</b>. The 2 and the 1 are <b>locants</b>, numbers that say which carbon something sits on. Match each one to the drawing.</p>' +
          '<!-- fig:name-anatomy:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 385" role="img" aria-label="Skeletal structure of 2-methylbutan-1-ol with its four-carbon parent chain highlighted and numbered 1 to 4 from the carbon bearing OH, a methyl on carbon 2. Below it the name is split into four boxes: 2-methyl, the prefix, a methyl on C2; but, the root, four carbons; an, the bond type, all single; -1-ol, the suffix, OH on C1."><text class="fg-tag" x="170" y="24" text-anchor="middle" font-size="11">the molecule</text><rect class="fg-panel-hi" x="10" y="34" width="320" height="150" rx="10"></rect><line class="fg-bond" x1="138.86" y1="130" x2="170" y2="112"></line><line class="fg-bond" x1="170" y1="112" x2="201.14" y2="130"></line><line class="fg-bond" x1="201.14" y1="130" x2="232.28" y2="112"></line><line class="fg-bond" x1="138.86" y1="130" x2="117.24" y2="117.5"></line><line class="fg-bond" x1="170" y1="112" x2="170" y2="76"></line><line class="fg-bond-hi" x1="138.86" y1="130" x2="170" y2="112"></line><line class="fg-bond-hi" x1="170" y1="112" x2="201.14" y2="130"></line><line class="fg-bond-hi" x1="201.14" y1="130" x2="232.28" y2="112"></line><text class="fg-lbl" x="107.72" y="116.5" text-anchor="middle" font-size="13">HO</text><text class="fg-lbl" x="138.86" y="150.5" text-anchor="middle" font-size="13">1</text><text class="fg-lbl" x="156.14" y="108.5" text-anchor="middle" font-size="13">2</text><text class="fg-lbl" x="201.14" y="150.5" text-anchor="middle" font-size="13">3</text><text class="fg-lbl" x="246.13" y="108.49" text-anchor="middle" font-size="13">4</text><text class="fg-sm" x="178" y="80" text-anchor="start" font-size="10.5">methyl</text><text class="fg-sm" x="170" y="172" text-anchor="middle" font-size="10.5">parent chain: four carbons</text><text class="fg-tag" x="170" y="214" text-anchor="middle" font-size="11">the name, piece by piece</text><rect class="fg-panel" x="10" y="224" width="74" height="104" rx="10"></rect><text class="fg-lbl" x="47" y="250" text-anchor="middle" font-size="13">2-methyl</text><line class="fg-rule" x1="18" y1="262" x2="76" y2="262"></line><text class="fg-tag" x="47" y="280" text-anchor="middle" font-size="11">prefix</text><text class="fg-sm" x="47" y="298" text-anchor="middle" font-size="10.5">methyl</text><text class="fg-sm" x="47" y="314" text-anchor="middle" font-size="10.5">on C2</text><rect class="fg-panel-good" x="92" y="224" width="74" height="104" rx="10"></rect><text class="fg-lbl" x="129" y="250" text-anchor="middle" font-size="13">but</text><line class="fg-rule" x1="100" y1="262" x2="158" y2="262"></line><text class="fg-tag" x="129" y="280" text-anchor="middle" font-size="11">root</text><text class="fg-sm" x="129" y="298" text-anchor="middle" font-size="10.5">four</text><text class="fg-sm" x="129" y="314" text-anchor="middle" font-size="10.5">carbons</text><rect class="fg-panel" x="174" y="224" width="74" height="104" rx="10"></rect><text class="fg-lbl" x="211" y="250" text-anchor="middle" font-size="13">an</text><line class="fg-rule" x1="182" y1="262" x2="240" y2="262"></line><text class="fg-tag" x="211" y="280" text-anchor="middle" font-size="11">bond type</text><text class="fg-sm" x="211" y="298" text-anchor="middle" font-size="10.5">all</text><text class="fg-sm" x="211" y="314" text-anchor="middle" font-size="10.5">single</text><rect class="fg-panel" x="256" y="224" width="74" height="104" rx="10"></rect><text class="fg-lbl" x="293" y="250" text-anchor="middle" font-size="13">-1-ol</text><line class="fg-rule" x1="264" y1="262" x2="322" y2="262"></line><text class="fg-tag" x="293" y="280" text-anchor="middle" font-size="11">suffix</text><text class="fg-sm" x="293" y="298" text-anchor="middle" font-size="10.5">OH</text><text class="fg-sm" x="293" y="314" text-anchor="middle" font-size="10.5">on C1</text><text class="fg-tag-good" x="170" y="354" text-anchor="middle" font-size="11">2-methylbutan-1-ol</text><text class="fg-sm" x="170" y="374" text-anchor="middle" font-size="10.5">branch, chain length, bonds, group</text></svg><figcaption>Match each number in the name to a carbon in the drawing. The 2 in <i>2-methyl</i> points at C2, where the methyl hangs. The 1 in <i>-1-ol</i> points at C1, which carries the OH.</figcaption></figure><!-- fig:name-anatomy:end -->' +
          '<p class="step-body">Every name is built from three pieces, always in this order: <b>prefix</b> (what hangs off the chain) + <b>root</b> (how long the parent chain is) + <b>suffix</b> (the main functional group). The <b>parent chain</b> is the main chain of carbons the name is built on.</p>' +
          '<p class="step-body">A name is a set of instructions for drawing the molecule. Two chemists who have never met write the same name for the same structure. So learning names is not memorization: it is running one procedure in a fixed order.</p>' +
          '<p class="step-body" style="margin-bottom:0;">This lesson is about the root, which counts the carbons in the parent chain: <b>meth</b> 1, <b>eth</b> 2, <b>prop</b> 3, <b>but</b> 4, <b>pent</b> 5, <b>hex</b> 6, <b>hept</b> 7, <b>oct</b> 8, <b>non</b> 9, <b>dec</b> 10. Add <b>-ane</b> and you have named an alkane, a compound of carbon and hydrogen with only single bonds.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Rule 1: the parent is the longest continuous chain of carbons.',
        bodyHtml: '<p class="step-body">This skeleton has a five-carbon row across the page. A different path climbs the branch and runs along the row, and it has seven carbons. The seven-carbon path is the parent: <b>4-methylheptane</b>.</p>' +
          '<!-- fig:parent-chain-trace:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 580" role="img" aria-label="One eight-carbon skeleton traced twice. Top: the five-carbon row across the page is highlighted and numbered 1 to 5, leaving a three-carbon branch on carbon 2; this gives the wrong name 2-propylpentane. Bottom: the seven-carbon path that runs down the branch and along the row is highlighted and numbered 1 to 7, leaving one methyl on carbon 4; this gives the correct name 4-methylheptane."><text class="fg-tag" x="170" y="24" text-anchor="middle" font-size="11">the row across the page</text><rect class="fg-panel-warn" x="10" y="34" width="320" height="180" rx="10"></rect><line class="fg-bond" x1="107.72" y1="188" x2="138.86" y2="170"></line><line class="fg-bond" x1="138.86" y1="170" x2="170" y2="188"></line><line class="fg-bond" x1="170" y1="188" x2="201.14" y2="170"></line><line class="fg-bond" x1="201.14" y1="170" x2="232.28" y2="188"></line><line class="fg-bond" x1="138.86" y1="170" x2="138.86" y2="134"></line><line class="fg-bond" x1="138.86" y1="134" x2="107.72" y2="116"></line><line class="fg-bond" x1="107.72" y1="116" x2="107.72" y2="80"></line><line class="fg-bond-hi" x1="107.72" y1="188" x2="138.86" y2="170"></line><line class="fg-bond-hi" x1="138.86" y1="170" x2="170" y2="188"></line><line class="fg-bond-hi" x1="170" y1="188" x2="201.14" y2="170"></line><line class="fg-bond-hi" x1="201.14" y1="170" x2="232.28" y2="188"></line><text class="fg-lbl" x="93.87" y="200.51" text-anchor="middle" font-size="13">1</text><text class="fg-lbl" x="152.72" y="166.5" text-anchor="middle" font-size="13">2</text><text class="fg-lbl" x="170" y="208.5" text-anchor="middle" font-size="13">3</text><text class="fg-lbl" x="201.14" y="158.5" text-anchor="middle" font-size="13">4</text><text class="fg-lbl" x="246.13" y="200.51" text-anchor="middle" font-size="13">5</text><text class="fg-sm" x="147.72" y="120" text-anchor="start" font-size="10.5">three-carbon branch</text><text class="fg-sm" x="170" y="236" text-anchor="middle" font-size="10.5">five in the row, three left over</text><text class="fg-tag-warn" x="170" y="258" text-anchor="middle" font-size="11">2-propylpentane</text><text class="fg-sm" x="170" y="278" text-anchor="middle" font-size="10.5">wrong: a longer chain exists</text><text class="fg-tag" x="170" y="310" text-anchor="middle" font-size="11">the path that turns a corner</text><rect class="fg-panel-hi" x="10" y="320" width="320" height="180" rx="10"></rect><line class="fg-bond" x1="107.72" y1="474" x2="138.86" y2="456"></line><line class="fg-bond" x1="138.86" y1="456" x2="170" y2="474"></line><line class="fg-bond" x1="170" y1="474" x2="201.14" y2="456"></line><line class="fg-bond" x1="201.14" y1="456" x2="232.28" y2="474"></line><line class="fg-bond" x1="138.86" y1="456" x2="138.86" y2="420"></line><line class="fg-bond" x1="138.86" y1="420" x2="107.72" y2="402"></line><line class="fg-bond" x1="107.72" y1="402" x2="107.72" y2="366"></line><line class="fg-bond-hi" x1="138.86" y1="456" x2="170" y2="474"></line><line class="fg-bond-hi" x1="170" y1="474" x2="201.14" y2="456"></line><line class="fg-bond-hi" x1="201.14" y1="456" x2="232.28" y2="474"></line><line class="fg-bond-hi" x1="138.86" y1="456" x2="138.86" y2="420"></line><line class="fg-bond-hi" x1="138.86" y1="420" x2="107.72" y2="402"></line><line class="fg-bond-hi" x1="107.72" y1="402" x2="107.72" y2="366"></line><text class="fg-lbl" x="107.72" y="354.5" text-anchor="middle" font-size="13">1</text><text class="fg-lbl" x="93.86" y="414.5" text-anchor="middle" font-size="13">2</text><text class="fg-lbl" x="152.72" y="416.5" text-anchor="middle" font-size="13">3</text><text class="fg-lbl" x="152.72" y="452.5" text-anchor="middle" font-size="13">4</text><text class="fg-lbl" x="170" y="494.5" text-anchor="middle" font-size="13">5</text><text class="fg-lbl" x="201.14" y="444.5" text-anchor="middle" font-size="13">6</text><text class="fg-lbl" x="246.13" y="486.51" text-anchor="middle" font-size="13">7</text><text class="fg-sm" x="97.72" y="480" text-anchor="end" font-size="10.5">methyl</text><text class="fg-sm" x="170" y="522" text-anchor="middle" font-size="10.5">seven on the path, one left over</text><text class="fg-tag-good" x="170" y="544" text-anchor="middle" font-size="11">4-methylheptane</text><text class="fg-sm" x="170" y="564" text-anchor="middle" font-size="10.5">right: nothing longer runs through it</text></svg><figcaption>The same eight carbons in both panels. Both traces are legal chains; the question is which is longer. In the top panel the highlighted bonds stop at five; in the bottom one they climb the branch and run along the row for seven. The carbon left over at the bottom is the methyl on C4.</figcaption></figure><!-- fig:parent-chain-trace:end -->' +
          '<p class="step-body">That is Rule 1: the parent is the longest unbroken path of carbons. The key word is <b>continuous</b>. You may turn corners, but you may not jump a gap or pass through the same carbon twice. Everything off the parent is a <b>substituent</b>, a group attached in place of a hydrogen. A one-carbon branch is <b>methyl</b>, two carbons is <b>ethyl</b>, three is <b>propyl</b>.</p>' +
          '<p class="step-body">To find the longest path, list the <b>end carbons</b>, the ones bonded to only one other carbon. A chain must start and finish at an end. Count the route between each pair of ends, and take the longest.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Count carbons, not line segments. A chain of six carbons is drawn with five bonds, so counting lines is off by one every time.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the carbons that make up the parent chain.</h2>' +
            '<p class="step-body">Trace the longest continuous path through this molecule. You may turn corners. Whatever you leave out is a substituent.</p>' +
            skeleton() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Carbons in the chain: 0</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var picked = {};
          var count = 0;
          var missed = false;

          function take(g){
            var key = g.getAttribute('data-key');
            if(picked[key]) return;
            if(key === BRANCH){
              missed = true;
              g.classList.add('atom--wrong');
              api.showFeedback(fb, false, 'That one is the substituent. It sits in line with the row across the page, which is why it looks like part of the main chain. But the path through it stops at five carbons. Follow the longer route down the branch instead.');
              return;
            }
            picked[key] = true;
            count++;
            g.classList.add('chosen');
            hint.textContent = 'Carbons in the chain: ' + count;
            if(count === CHAIN.length){
              var nums = api.card.querySelector('#chainNums');
              if(nums) nums.style.display = '';

t><line class="fg-bond" x1="123.29" y1="300" x2="154.43" y2="282"></line><line class="fg-bond" x1="154.43" y1="282" x2="185.57" y2="300"></line><line class="fg-bond" x1="157.12" y1="289.33" x2="177.87" y2="301.33"></line><line class="fg-bond" x1="185.57" y1="300" x2="216.71" y2="282"></line><line class="fg-bond-hi" x1="123.29" y1="300" x2="154.43" y2="282"></line><line class="fg-bond-hi" x1="154.43" y1="282" x2="185.57" y2="300"></line><line class="fg-bond-hi" x1="157.12" y1="289.33" x2="177.87" y2="301.33"></line><line class="fg-bond-hi" x1="185.57" y1="300" x2="216.71" y2="282"></line><text class="fg-lbl" x="109.44" y="312.51" text-anchor="middle" font-size="13">1</text><text class="fg-lbl" x="154.43" y="270.5" text-anchor="middle" font-size="13">2</text><text class="fg-lbl" x="185.57" y="320.5" text-anchor="middle" font-size="13">3</text><text class="fg-lbl" x="230.56" y="278.49" text-anchor="middle" font-size="13">4</text><text class="fg-tag-good" x="170" y="360" text-anchor="middle" font-size="11">but-2-ene</text><text class="fg-sm" x="170" y="380" text-anchor="middle" font-size="10.5">the 2 sits right before -ene</text><text class="fg-sm" x="170" y="398" text-anchor="middle" font-size="10.5">older style: 2-butene</text></svg><figcaption>In each name, find the number, then look at the word part right after it. That part is what sits on the numbered carbon.</figcaption></figure><!-- fig:locant-before-its-part:end -->' +
