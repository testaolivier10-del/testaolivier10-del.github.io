    <h1 style="margin-bottom:4px;">Alkene structure.</h1>
    <p class="lede" style="margin-top:0;">A C=C double bond isn't just "one more bond" than a single bond — it's a fundamentally different, flatter, more reactive kind of connection.</p>

<script>
(function(){
  window.OchemLessonEngine.start({
    topicId: 'alkene-structure',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>sp² carbons and the pi bond</h3><p class="step-body">Each carbon of a C=C double bond is <b>sp² hybridized</b> (from the Hybridization lesson): three sp² orbitals form sigma bonds arranged in a trigonal planar shape (120° apart), and one unhybridized p orbital is left over on each carbon, oriented perpendicular to that plane. Those two p orbitals overlap <b>side-by-side</b> above and below the sigma-bond plane, forming a <b>pi (π) bond</b> — a second, weaker bond in addition to the sigma bond joining the two carbons.</p>' +
      '<h3>Why the double bond is flat and rigid</h3><p class="step-body">A sigma bond can rotate freely (the orbital overlap is a symmetric cylinder around the bond axis, from the Newman projections lesson). A pi bond cannot: rotating one carbon 90° relative to the other would break the side-by-side p-orbital overlap entirely. This is why every atom directly attached to a C=C is locked in the <b>same plane</b>, and why cis/trans (or E/Z) isomers of alkenes are stable, isolable, different compounds rather than freely interconverting conformers.</p>' +
      '<div class="notes-fact">Rotating a C=C double bond costs roughly 65 kcal/mol — the strength of the pi bond itself — compared to essentially 0 for a C–C single bond. That is why alkene geometry is configurational (a structural identity) rather than conformational (a freely-changing shape).</div>' +
      '<h3>Degrees of unsaturation</h3><p class="step-body">Each ring or pi bond in a molecule removes exactly 2 hydrogens compared to the fully saturated formula CₙH₂ₙ₊₂. This lets you calculate <b>degrees of unsaturation</b> (DoU) directly from a molecular formula: DoU = (2C + 2 + N − H) / 2 (halogens count like H). A molecule with formula C₄H₈ has DoU = (8+2−8)/2 = 1 — exactly one ring or one pi bond, consistent with it being an alkene (or a cycloalkane).</p>' +
      '<h3>Alkene stability: more substituted is more stable</h3><p class="step-body">Heats of hydrogenation (the energy released converting an alkene fully to an alkane with H₂) measure alkene stability directly: 1-butene (monosubstituted) releases about 30.3 kcal/mol, cis-2-butene (disubstituted) about 28.6, trans-2-butene (disubstituted) about 27.6, and 2-methyl-2-butene (trisubstituted) about 26.9. Less heat released means the alkene started out lower in energy — more stable. The trend: <b>more alkyl substitution on the double bond = more stable alkene</b>, and <b>trans is generally more stable than cis</b> (less steric strain between substituents on the same side).</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A C=C double bond is one sigma bond plus one pi bond.',
        bodyHtml: '<p class="step-body">Each carbon in a C=C is <b>sp² hybridized</b>: it forms three sigma bonds using sp² orbitals arranged 120° apart in a flat plane, and has one leftover, unhybridized <b>p orbital</b> standing perpendicular to that plane. The sigma bond between the two carbons forms from head-on overlap of sp² orbitals, exactly like any single bond.</p><p class="step-body" style="margin-bottom:0;">The second bond — the one that makes it a double bond — comes from the two leftover p orbitals overlapping <b>side-by-side</b>, above and below the plane of the atoms. This sideways overlap is called a <b>pi (π) bond</b>. A double bond is therefore one sigma bond plus one pi bond stacked on top of each other; a triple bond (coming up in the Alkynes lesson) adds a second pi bond.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the region of the ethylene diagram that represents the pi bond.</h2>' +
            '<p class="step-body">The sigma-bond framework (C–H and C–C sigma bonds) is drawn as solid lines. The pi bond is the side-by-side p-orbital overlap above and below the plane.</p>' +
            '<div style="display:flex;justify-content:center;padding:20px 0;">' +
            '<svg width="320" height="180" viewBox="0 0 320 180">' +
              '<line x1="120" y1="90" x2="200" y2="90" stroke="var(--ink)" stroke-width="3"/>' +
              '<line x1="120" y1="90" x2="70" y2="55" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="120" y1="90" x2="70" y2="125" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="200" y1="90" x2="250" y2="55" stroke="var(--ink)" stroke-width="2"/>' +
              '<line x1="200" y1="90" x2="250" y2="125" stroke="var(--ink)" stroke-width="2"/>' +
              '<circle cx="120" cy="90" r="5" fill="var(--ink)"/><circle cx="200" cy="90" r="5" fill="var(--ink)"/>' +
              '<g id="piLobe" class="atom" data-v="pi" style="cursor:pointer;">' +
                '<ellipse cx="160" cy="55" rx="65" ry="18" fill="var(--accent)" opacity="0.35" stroke="var(--accent)" stroke-width="2"/>' +
                '<ellipse cx="160" cy="125" rx="65" ry="18" fill="var(--accent)" opacity="0.35" stroke="var(--accent)" stroke-width="2"/>' +
              '</g>' +
              '<text x="160" y="95" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="monospace">sigma</text>' +
            '</svg></div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var answered = false;
          api.card.querySelector('#piLobe').addEventListener('click', function(){
            if(answered) return;
            answered = true;
            this.style.opacity = '1';
            api.record(true);
            api.showFeedback(fb, true, 'That\'s it — the two shaded lobes above and below the sigma-bond plane are the side-by-side overlap of the leftover p orbitals: the pi bond. Everything else drawn (the solid lines) is the sigma framework.');
            next.disabled = false;
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Why can\'t a C=C double bond rotate freely the way a C–C single bond can?',
        options: ['Rotating would break the side-by-side p-orbital overlap that makes up the pi bond', 'Double bonds are simply shorter and have no room to rotate', 'Carbon atoms physically block each other from rotating'],
        correctIndex: 0,
        correctFeedback: 'Correct — the pi bond only exists because the two p orbitals are aligned and overlapping; twisting one carbon relative to the other destroys that overlap, so rotation would mean breaking a bond.',
        wrongFeedback: 'It\'s about orbital overlap, not physical size or steric blocking — twisting the double bond would break the pi-bond overlap.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'A molecule with formula C₅H₈ has how many degrees of unsaturation?',
        options: ['2 — DoU = (2·5 + 2 − 8)/2 = 2', '1', '4'],
        correctIndex: 0,
        correctFeedback: 'Correct. DoU = (2C+2−H)/2 = (10+2−8)/2 = 2 — this molecule has two rings and/or pi bonds total (for example, one ring plus one double bond, or two double bonds).',
        wrongFeedback: 'Use DoU = (2C + 2 − H) / 2 with C = 5 and H = 8: (10 + 2 − 8)/2 = 2.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'More substituted alkenes are more stable — heats of hydrogenation prove it.',
        bodyHtml: '<p class="step-body">Adding H₂ across a C=C (hydrogenation) converts any alkene to the same alkane and releases heat. Measuring exactly how much heat is released lets you rank alkene stability directly: <b>less heat released means the starting alkene was already lower in energy</b> (more stable).</p><p class="step-body" style="margin-bottom:0;">Real data for the four butene isomers: 1-butene (monosubstituted C=C) releases ≈30.3 kcal/mol; cis-2-butene (disubstituted) ≈28.6; trans-2-butene (disubstituted) ≈27.6; 2-methyl-2-butene (trisubstituted) ≈26.9. The pattern is consistent: <b>each additional alkyl group on the double bond stabilizes it</b> (alkyl groups donate electron density into the pi system via hyperconjugation), and for a given substitution pattern, <b>trans is more stable than cis</b> because the bulky groups aren\'t crowded on the same side.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Check Understanding',
        title: 'Which alkene below is predicted to be the most stable?',
        options: ['2-methyl-2-butene (trisubstituted)', '1-butene (monosubstituted)', 'They\'re all equally stable — they\'re isomers with the same formula'],
        correctIndex: 0,
        correctFeedback: 'Correct — more alkyl substitution on the C=C means more stability, and 2-methyl-2-butene has three alkyl groups directly on its double-bond carbons versus one for 1-butene.',
        wrongFeedback: 'Being isomers (same formula) doesn\'t mean equal energy — degree of substitution on the double bond is what determines relative alkene stability.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Substitution and geometry set up everything in the next two lessons.',
        bodyHtml: '<div class="explain-box">The pi bond\'s electron density sitting exposed above and below the sigma framework is exactly what makes alkenes attractive to electrophiles — that\'s the entire basis for the addition reactions in the next lesson. And the stability ranking you just learned (more substituted = more stable) is the same logic behind Markovnikov\'s rule: the reaction pathway that funnels through the more stable, more substituted carbocation intermediate is the one that wins.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A chemist reports that isomer A releases 30.1 kcal/mol on hydrogenation and isomer B releases 27.2 kcal/mol, both converting to the same alkane. Which one was more stable before hydrogenation?',
        options: ['Isomer B — it released less heat, meaning it started at lower energy', 'Isomer A — it released more heat, meaning it started higher in energy but that makes it more stable', 'They must be equally stable since they form the same product'],
        correctIndex: 0,
        correctFeedback: 'Correct — less heat released means the starting material was already closer in energy to the common product, i.e. it was lower in energy (more stable) to begin with.'
      }
    ]
  });
})();
</script>
