<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* Four dienes; the student says which can do a Diels-Alder. The s-cis
     requirement is geometric, so the set is chosen so that electron-richness
     never decides it: the unreactive one is locked s-trans, and the most
     reactive is locked s-cis. */
  var DIENES = [
    { id:'a', text:'<b>Cyclopentadiene</b> — a five-membered ring with both double bonds inside it', ok:true,
      why:'Locked <b>s-cis</b> by the ring, so it is permanently in the reactive conformation. It is so reactive it dimerizes on standing at room temperature, one molecule acting as diene and another as dienophile — which is why it is stored as the dimer and cracked by distillation before use.' },
    { id:'b', text:'<b>Buta-1,3-diene</b> — open chain, free to rotate', ok:true,
      why:'Sits mostly <b>s-trans</b>, which is the more stable conformation, but rotation about the central single bond is free, so it can reach s-cis whenever it needs to. It reacts perfectly well.' },
    { id:'c', text:'A diene <b>locked s-trans inside a fused ring system</b>', ok:false,
      why:'Cannot reach s-cis, so the two ends can never reach the two ends of the dienophile at once. This diene does not react at all, however electron-rich you make it — the requirement is geometric, not electronic.' },
    { id:'d', text:'<b>Penta-1,4-diene</b> — CH₂=CH–CH₂–CH=CH₂', ok:false,
      why:'Not conjugated at all. An sp³ carbon separates the two double bonds, so there is no four-π-electron system to contribute. Being able to reach s-cis is irrelevant if there is nothing to rotate into conjugation.' }
  ];

  window.OchemLessonEngine.start({
    topicId: 'diels-alder',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Six electrons round a circle, and a ring appears.',
        bodyHtml: '<p class="step-body">A <b>conjugated diene</b> (four π electrons) reacts with a two-π-electron partner called the <b>dienophile</b>. With an <b>alkene</b> the product is a <b>cyclohexene</b>; with an <b>alkyne</b> it is a <b>cyclohexa-1,4-diene</b>, because the alkyne\'s second π bond survives into the ring. Joining a four-π component to a two-π one makes it a <b>[4+2] cycloaddition</b> — and a <b>pericyclic</b> reaction, meaning one whose bonds all break and form together with the electrons going round a closed loop.</p>' +
          '<p class="step-body">The bond arithmetic explains why it runs downhill without anything driving it. Three π bonds go in; out come <b>two new σ bonds and one π bond</b>. σ bonds are stronger than π bonds, so trading two of the latter for two of the former releases energy.</p>' +
          '<div class="explain-box">It is <b>concerted</b>: every bond breaks and forms in the same step, through a single cyclic transition state, with <b>no intermediate at all</b>. No carbocation, so no rearrangements and nothing whose stability you need to compare. Almost every special property of this reaction follows from that one fact.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two requirements: the right shape, and the right electronics.',
        bodyHtml: '<p class="step-body"><b>Shape.</b> For the two ends of the diene to reach the two ends of the dienophile simultaneously, they have to be on the same side — the diene must react from its <b>s-cis</b> conformation. This is the commonest reason a Diels–Alder simply does not happen, and it is geometric rather than electronic.</p>' +
          '<p class="step-body"><b>Electronics.</b> The diene supplies the electrons and the dienophile receives them, so what matters is the diene\'s <b>HOMO</b> — its highest orbital that has electrons in it — and the dienophile\'s <b>LUMO</b>, its lowest one with room for more. Electron-<b>donating</b> groups on the diene push its HOMO up; electron-<b>withdrawing</b> groups on the dienophile pull its LUMO down; the closer the two come, the faster the reaction. A <b>Lewis acid</b> binding the dienophile\'s carbonyl drops that LUMO further still, which is why one can speed a sluggish Diels–Alder up by orders of magnitude.</p>' +
          '<p class="step-body"><b>And the same electronics places the substituents.</b> Polarize each partner on paper: a donor on the diene\'s C1 puts the negative end at C4, a donor on C2 puts it at C1, and a withdrawing group on the dienophile puts the positive end on the carbon it is <i>not</i> attached to. Join negative to positive. A 1-substituted diene therefore gives the <b>"ortho"</b> product, with the two substituents on adjacent ring carbons, and a 2-substituted diene gives the <b>"para"</b> product, with them 1,4 across the ring. The 1,3 arrangement never appears.</p>' +
          '<p class="step-body" style="margin-bottom:0;">In practice a good dienophile carries a carbonyl, nitrile, nitro group or ester next to its double bond. Maleic anhydride, with two carbonyls flanking the alkene, is the classic fast one; ethene itself reacts only under forcing conditions, because it has nothing pulling its LUMO down.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which of these can act as the diene?</h2>' +
            '<p class="step-body">Mark each one. Two can, two cannot — and they fail for different reasons.</p>' +
            '<div class="radical-sort">' +
            DIENES.map(function(d){
              return '<div class="radical-row" data-case="' + d.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + d.text + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Can this act as the diene">' +
                  '<button type="button" class="choice-btn sm" data-case="' + d.id + '" data-v="yes">Can react</button>' +
                  '<button type="button" class="choice-btn sm" data-case="' + d.id + '" data-v="no">Cannot</button>' +
                '</div><div class="radical-why" data-why="' + d.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = DIENES.filter(function(d){ return d.id === id; })[0];
              var said = btn.getAttribute('data-v') === 'yes';
              if(said !== cfg.ok){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Not quite. Ask two things in order: is it actually conjugated, and can it reach s-cis? Failing either one stops the reaction.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === DIENES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Two questions, in order: conjugated at all, then able to reach s-cis.'
                  : 'All four, first time — including the two failures, which fail for different reasons: one is not conjugated, the other cannot reach s-cis.');
                api.record(!missed);
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Two ester groups are cis across the dienophile. Where are they in the product?',
        options: ['Trans on the ring','Cis on the ring','A 50:50 mixture','Impossible to predict'],
        correctIndex: 1,
        correctFeedback: 'Correct. Both new bonds form on the same face of the dienophile in a single step, so there is no point at which anything can rotate. Cis goes in, cis comes out — and running the same reaction with the trans isomer gives the trans product, cleanly. That is what stereospecific means.',
        wrongFeedback: 'The reaction is concerted, with no intermediate. If nothing is ever free to rotate, what can happen to the relationship between two substituents?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Why is cyclopentadiene unusually reactive as a diene?',
        options: [
          'It is aromatic',
          'It is locked in the s-cis conformation by its ring',
          'It carries a strong electron-withdrawing group',
          'It has three conjugated double bonds'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Most open-chain dienes spend most of their time s-trans and have to rotate into s-cis to react; cyclopentadiene is already there and pays no penalty. It is so reactive that it dimerizes on standing, which is why it is stored as the dimer and cracked by distillation immediately before use.',
        wrongFeedback: 'Compare it with an open-chain diene. What does an open chain have to do before it can react, and what has the ring already done for cyclopentadiene?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The endo rule, and running the reaction backwards.',
        bodyHtml: '<p class="step-body">When the dienophile carries a substituent, the two partners can stack two ways: <b>endo</b>, with that substituent tucked under the diene, or <b>exo</b>, with it pointing away. The endo arrangement is the more <i>crowded</i> one and is nevertheless the <b>faster</b> one, because the substituent\'s π system interacts favorably with the developing π system of the diene in the transition state — a <b>secondary orbital interaction</b>.</p>' +
          '<p class="step-body">So endo is the <b>kinetic</b> product. It is worth pausing on: this is a case where the kinetic product is the more hindered one, which is a useful corrective to the habit of reading "kinetic" as "less crowded". Kinetic only ever means "gets there faster".</p>' +
          '<p class="step-body" style="margin-bottom:0;">The reaction is also reversible. Heating a suitable cyclohexene drives the <b>retro-Diels–Alder</b>, splitting it back into a diene and a dienophile — which is exactly what cracking cyclopentadiene dimer is. In synthesis planning, spotting a cyclohexene and mentally cutting it at the retro-Diels–Alder disconnection is one of the most productive moves available.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'Which pairing reacts fastest?',
        options: [
          'Electron-poor diene with electron-poor dienophile',
          'Electron-rich diene with electron-poor dienophile',
          'Electron-rich diene with electron-rich dienophile',
          'The electronics make no difference'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Donating groups on the diene raise its HOMO and withdrawing groups on the dienophile lower its LUMO, which narrows the gap between the two interacting orbitals and speeds the reaction. Matching them the same way — both rich or both poor — widens the gap instead.',
        wrongFeedback: 'The reaction pairs the diene\'s highest occupied orbital with the dienophile\'s lowest empty one. What substitution pattern brings those two closest together in energy?'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A Diels–Alder produces no rearranged products, ever, even with substrates whose carbocations would certainly shift. Why?',
        options: [
          'The conditions are too mild for rearrangement',
          'It is concerted, so there is no carbocation intermediate to rearrange',
          'The diene sterically blocks any shift',
          'Rearranged products form but revert on workup'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and this is the payoff of "concerted" being more than a label. With no intermediate there is nothing to rearrange, nothing to lose its stereochemistry and nothing whose stability you have to compare — which is why the product can be predicted completely, including its stereochemistry, from the two starting materials alone. It is the same reasoning that makes hydroboration free of rearrangement, and it generalizes to pericyclic chemistry as a whole.'
      }
    ]
  });

})();
});
</script>
