        diagramHtml: '<!-- fig:axial-alternation:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 204" role="img" aria-label="One cyclohexane chair with three neighboring carbons labeled C1, C2 and C3, running along the top of the ring from right to left. C1, the headrest at the far right, has a vertical axial bond pointing up and an equatorial bond angling slightly down. C2 has an axial bond pointing down and an equatorial bond angling up. C3, the top-left corner, has an axial bond pointing up and an equatorial bond angling down. Each bond end is tagged up or down."><line class="fg-bond" x1="261.84" y1="107.61" x2="210.91" y2="110.22"></line><line class="fg-bond" x1="210.91" y1="110.22" x2="109.09" y2="77.45"></line><line class="fg-bond" x1="109.09" y1="77.45" x2="58.16" y2="140.39"></line><line class="fg-bond" x1="58.16" y1="140.39" x2="109.08" y2="137.78"></line><line class="fg-bond" x1="109.08" y1="137.78" x2="210.91" y2="170.55"></line><line class="fg-bond" x1="210.91" y1="170.55" x2="261.84" y2="107.61"></line><line class="fg-bond-hi" x1="261.84" y1="107.61" x2="261.84" y2="67.61"></line><text class="fg-tag-good" x="261.84" y="59.61" text-anchor="middle" font-size="10">axial up</text><line class="fg-bond" x1="261.84" y1="107.61" x2="284.49" y2="115.51"></line><text class="fg-tag-warn" x="282.49" y="131.51" text-anchor="middle" font-size="10">eq down</text><line class="fg-bond-hi" x1="210.91" y1="110.22" x2="210.91" y2="136.22"></line><text class="fg-tag-warn" x="204.91" y="136.22" text-anchor="end" font-size="10">axial down</text><line class="fg-bond" x1="210.91" y1="110.22" x2="226.85" y2="89.68"></line><text class="fg-tag-good" x="220.85" y="85.68" text-anchor="end" font-size="10">eq up</text><line class="fg-bond-hi" x1="109.09" y1="77.45" x2="109.09" y2="37.45"></line><text class="fg-tag-good" x="109.09" y="29.45" text-anchor="middle" font-size="10">axial up</text><line class="fg-bond" x1="109.09" y1="77.45" x2       {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'On the way, the ring passes through other shapes.',
        bodyHtml: '<p class="step-body">A flip is not a jump. C1, the headrest, has to travel down past its neighbors, and C4, the footrest, has to travel up. On the way the ring passes through shapes from the Cyclohexanes topic.</p><p class="step-body">C1 moves first. Partway down, C1 lies level with C2, C6 and C5, and those four carbons sit in one plane: the ring is a <b>half-chair</b>. Holding four ring carbons flat forces their angles open, away from 109.5°, and eclipses the bond in the middle of the four.</p><p class="step-body" style="margin-bottom:0;">Next the ring relaxes into a <b>twist-boat</b>, and it can pass on through a <b>boat</b>, with C1 and C4 both below the other carbons. Then C4 rises the same way, through a second twist-boat and half-chair, into the other chair.</p>',

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The barrier is small enough to cross all the time, but not zero.',
        bodyHtml: '<p class="step-body">On an energy diagram, a peak is a shape the ring passes through without stopping, and a dip is a shape it can rest in for a moment. The half-chair, about 10.8 kcal/mol above the chair, is the transition state between a chair and a twist-boat, and the tallest peak. The twist-boat is a shallow dip at about 5.5, and the boat is the small peak between the twist-boats.</p><p class="step-body" style="margin-bottom:0;">That climb is the flip barrier. It is much higher than the 2.9 kcal/mol barrier for turning the C–C bond of ethane, so a ring flips only about 10⁵ times a second: roughly a million times slower than ethane\'s bond turns, and still far too fast to watch.</p>',

lf-chair</text><text class="fg-tag" x="270" y="85.2" text-anchor="middle" font-size="11">≈10.8, the top</text><text class="fg-tag" x="182" y="140" text-anchor="middle" font-size="11">boat</text><text class="fg-tag" x="182" y="154" text-anchor="middle" font-size="11">≈6.5</text><text class="fg-tag" x="138" y="204" text-anchor="middle" font-size="11">twist-boat</text><text class="fg-tag" x="138" y="219" text-anchor="middle" font-size="11">≈5.5</text><text class="fg-tag" x="226" y="204" text-anchor="middle" font-size="11">twist-boat</text><text class="fg-tag" x="226" y="219" text-anchor="middle" font-size="11">≈5.5</text><text class="fg-tag" x="14" y="50" text-anchor="start" font-size="11">energy, kcal/mol</text></svg><figcaption>Energies in kcal/mol, measured from the chair.</figcaption></figure><!-- fig:l-profile:end -->'

      {

        correctIndex: 0,
        correctFeedback: 'Right. The twist-boat sits in a shallow dip, about 5.5 kcal/mol up, so the ring can pause there. The half-chair and the boat are peaks, which the ring passes over without stopping.',

        bodyHtml: '<p class="step-body">The two chairs of methylcyclohexane differ in energy by the methyl\'s A-value, 1.7 kcal/mol, which you met in the Axial/equatorial lesson. Because the ring flips so fast, the chairs are always in equilibrium, and about 95% of the molecules are in the chair with the methyl equatorial.</p><p class="step-body">So "the methyl is equatorial" describes the chair most molecules are in, not a fixed property. Neither chair can be bottled on its own at room temperature, because each turns into the other within microseconds.</p><p class="step-body" style="margin-bottom:0;">Recall the <i>tert</i>-butyl anchor from Axial/equatorial: its A-value of 4.9 kcal/mol keeps more than 99.9% of molecules in the chair with it equatorial. The ring still flips; at any moment only about one molecule in 4,000 is in the other chair.</p>'
