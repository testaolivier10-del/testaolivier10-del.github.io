<script>
(function(){
  function chairPair(){
    return '<div class="scene"><svg viewBox="0 0 320 150">' +
      '<polyline points="20,90 80,60 150,90 210,60 280,90 220,110 150,90" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="80" y1="60" x2="80" y2="20" stroke="var(--muted)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="before"><circle cx="80" cy="14" r="10" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="80" y="18" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">CH₃</text></g>' +
      '<text x="150" y="10" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="var(--muted)">axial here</text>' +
    '</svg></div>';
  }
  function chairFlipped(){
    return '<div class="scene"><svg viewBox="0 0 320 150">' +
      '<polyline points="20,60 80,90 150,60 210,90 280,60 220,40 150,60" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
      '<line x1="80" y1="90" x2="50" y2="105" stroke="var(--muted)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="after"><circle cx="38" cy="110" r="10" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="38" y="114" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">CH₃</text></g>' +
      '<text x="150" y="130" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="var(--muted)">equatorial now</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'ring-flips',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Flipping the chair swaps every axial position for equatorial.',
        bodyHtml: '<p class="step-body">A cyclohexane ring doesn\'t sit frozen in one chair shape. It constantly interconverts between two chair conformations through a process called a <b>ring flip</b> (or chair flip) — no bonds break during this process, the ring simply flexes.</p><p class="step-body" style="margin-bottom:0;">The key result: every position that was <b>axial</b> in one chair becomes <b>equatorial</b> in the other, and every equatorial position becomes axial. A substituent doesn\'t change which carbon it\'s attached to — only whether that carbon\'s bond to it happens to point axially or equatorially in the current chair.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click "Flip the ring" and see what happens to the methyl group.</h2>' +
            '<p class="step-body">This chair has a methyl group axial. Flip it and watch where that same methyl group ends up.</p>' +
            '<div id="chairHost">' + chairPair() + '</div>' +
            '<div class="choice-row" style="justify-content:center;"><button class="choice-btn" id="flipBtn" style="font-weight:800;">Flip the ring</button></div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var flipBtn = api.card.querySelector('#flipBtn');
          var host = api.card.querySelector('#chairHost');
          flipBtn.addEventListener('click', function(){
            host.innerHTML = chairFlipped();
            flipBtn.disabled = true;
            api.record(true);
            api.showFeedback(fb, true, 'The same methyl group, on the same carbon, is now equatorial. Nothing about the molecule\'s connectivity changed — only the three-dimensional shape of the ring did.');
            next.disabled = false;
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'During a ring flip, what happens to the covalent bonds in the ring?',
        options: ['Every C–C bond in the ring breaks and reforms', 'None of them break — the ring just flexes into a different shape', 'Only the bond to the substituent breaks'],
        correctIndex: 1,
        correctFeedback: 'Correct — a ring flip is purely a conformational change (rotation around single bonds throughout the ring), not a chemical reaction. No bonds break.',
        wrongFeedback: 'A ring flip is a conformational change, not a chemical reaction — no bonds break or form anywhere in the molecule.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'The pathway between the two chairs passes through which intermediate shape(s)?',
        options: ['Directly from one chair to the other with no intermediate', 'A flat, planar hexagon', 'Half-chair, then boat/twist-boat, then half-chair again'],
        correctIndex: 2,
        correctFeedback: 'Correct. The ring passes through higher-energy half-chair and boat/twist-boat shapes on its way between the two stable chairs.',
        wrongFeedback: 'The interconversion isn\'t direct — it passes through real, if short-lived and higher-energy, half-chair and boat/twist-boat shapes.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The barrier is small enough to cross constantly, but not zero.',
        bodyHtml: '<p class="step-body">The energy barrier for a full ring flip is about 10-11 kcal/mol for unsubstituted cyclohexane. That\'s noticeably larger than the ~2.9 kcal/mol barrier for simple rotation around a single ethane C–C bond, but still small enough that, at room temperature, a given cyclohexane molecule flips between its two chairs thousands of times per second.</p><p class="step-body" style="margin-bottom:0;">This means you can never isolate "the axial conformer" and "the equatorial conformer" of a monosubstituted cyclohexane as two separate bottles of chemical — they\'re the same molecule, constantly interconverting. What you observe experimentally is always a time-averaged mixture, weighted by A-values, of both chairs.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Reactions can only happen in the chair that has the right geometry.',
        bodyHtml: '<div class="explain-box">Since the molecule constantly ring-flips, it can always sample whichever chair a reaction needs — as long as that chair is accessible (not blocked by an enormous A-value substituent locking the ring one way). This becomes essential in the next lesson and in E2 elimination (Module 6, which already depends on this material): E2 requires the leaving group to be axial, so a molecule reacts through whichever of its two interconverting chairs happens to have that leaving group in the axial position.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'A cyclohexane ring has a bulky substituent in the axial position in one chair. After a ring flip, that substituent is now...',
        options: ['Equatorial, on the exact same carbon', 'Still axial, but on a different carbon', 'Removed from the molecule entirely'],
        correctIndex: 0,
        correctFeedback: 'Correct — a ring flip swaps every axial position for equatorial (and vice versa) on the same set of carbons. The substituent never moves to a different carbon and is never removed; only its axial/equatorial orientation changes.'
      }
    ]
  });
})();
</script>
