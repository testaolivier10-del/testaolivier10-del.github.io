        title: 'The barrier is small enough to cross all the time, but not zero.',
        bodyHtml: '<p class="step-body">On an energy diagram, a peak is a shape the ring passes through without stopping, and a dip is a shape it can rest in for a moment. The half-chair, about 10.8 kcal/mol above the chair, is the tallest peak. The twist-boat is a shallow dip at about 5.5, and the boat is the small peak between the twist-boats.</p><p class="step-body" style="margin-bottom:0;">The flip barrier, about 10–11 kcal/mol, is higher than the 2.9 kcal/mol barrier for turning the C–C bond of ethane. So a ring flips about 10⁵ times a second, roughly a million times slower than ethane\'s bond turns, and still far too fast to watch.</p>',

        bodyHtml: '<p class="step-body">The two chairs of methylcyclohexane differ in energy by the methyl\'s A-value, 1.7 kcal/mol. Because the ring flips so fast, the chairs are always in equilibrium, and about 95% of the molecules are in the chair with the methyl equatorial.</p><p class="step-body">So "the methyl is equatorial" describes the chair most molecules are in, not a fixed property. Neither chair can be bottled on its own at room temperature, because each turns into the other within microseconds.</p><p class="step-body" style="margin-bottom:0;">A <i>tert</i>-butyl group, with an A-value of about 4.9 kcal/mol, puts more than 99.9% of the molecules in one chair. The ring still flips, but it almost never stays in the other chair, so chemists use <i>tert</i>-butyl as an anchor that holds a ring in one known chair.</p>'
