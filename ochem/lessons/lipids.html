<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* All four are C18 acids, so chain length is held constant and the only
     variable left is the double bonds and their geometry. That is what makes
     the trans case land: it melts like the saturated one. */
  var CASES = [
    { id:'f1', t:'<b>Stearic acid</b> — C18, no double bonds', right:'solid',
      why:'Solid, melting near 69 °C. A straight saturated chain stacks against its neighbors along its whole length, so the London forces add up.' },
    { id:'f2', t:'<b>Oleic acid</b> — C18, one <i>cis</i> double bond', right:'liquid',
      why:'Liquid, melting near 13 °C. One cis bond puts a roughly 30° bend in the middle of the chain; the chains no longer lie flat against each other and lose most of that contact. Same carbon count, 56 degrees lower.' },
    { id:'f3', t:'<b>Elaidic acid</b> — C18, one <i>trans</i> double bond', right:'solid',
      why:'Solid, melting near 44 °C. A trans double bond leaves the chain essentially straight, so it packs almost like the saturated acid. Geometry, not degree of saturation, is what the melting point is reading.' },
    { id:'f4', t:'<b>Linoleic acid</b> — C18, two <i>cis</i> double bonds', right:'liquid',
      why:'Liquid, melting near &minus;5 °C. Two kinks pack even worse than one, which is the general rule: more cis unsaturation, lower melting point.' }
  ];
  var OPTS = [ { k:'solid', l:'Solid at 25 °C' }, { k:'liquid', l:'Liquid at 25 °C' } ];

  window.OchemLessonEngine.start({
    topicId: 'lipids',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Lipid is a solubility class, not a functional group.',
        bodyHtml: '<p class="step-body">Every other family you have met is defined by a group: alcohols have an OH, ketones a C=O. Lipids are defined by behavior — the things in a cell that dissolve in nonpolar solvents and not in water. That is why the category holds molecules as unlike as a fat, a soap and a steroid, and why the useful question is never "is this a lipid" but "what functional group is doing the work here".</p>' +
          '<p class="step-body">For most of them the answer is the <b>ester</b>. A <b>fatty acid</b> is a carboxylic acid on the end of a long unbranched chain, almost always with an even number of carbons because they are built two at a time. Esterify all three OH groups of <b>glycerol</b> with fatty acids and you have a <b>triglyceride</b> — a triester, and the molecule that fats and oils actually are.</p>' +
          '<div class="explain-box">Fat and oil are not chemical categories. They name the same compound class in two physical states: a triglyceride that is solid at room temperature is a <b>fat</b>, one that is liquid is an <b>oil</b>. So the whole difference is a melting point, and the next step is about what sets it.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The melting point is a packing problem.',
        bodyHtml: '<p class="step-body">Long hydrocarbon chains attract each other by London dispersion forces, which are weak individually and depend entirely on surface contact. Melting one of these solids means pulling those chains apart, so anything that increases contact raises the melting point.</p>' +
          '<p class="step-body">A <b>saturated</b> chain is straight and lies flat against its neighbors for its full length: strong total attraction, high melting point, solid. A <b>cis</b> double bond forces a permanent bend of about 30° into the chain. Bent chains cannot stack, contact drops sharply, and the melting point falls with it — which is why animal fats, mostly saturated, are solid and vegetable oils, mostly cis-unsaturated, are not.</p>' +
          '<p class="step-body" style="margin-bottom:0;">A <b>trans</b> double bond is the case that shows what the rule is really about. It is just as unsaturated, and it barely bends the chain at all, so the chain packs nearly as well as a saturated one and melts nearly as high. The property that matters is shape.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Four C18 acids. Which are solid at room temperature?</h2>' +
            '<p class="step-body">Every one has eighteen carbons, so chain length is ruled out and only the double bonds can be responsible. For each, draw the chain in your head and ask whether it is straight or kinked.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="State at room temperature">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Do not count double bonds — look at the shape they produce. Which of these chains can lie flat against the next one?');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Straight chains pack and melt high; kinked ones do not. The trans acid is the proof that the rule is about geometry.'
                  : 'All four, first time — including elaidic acid, which is unsaturated and still a solid because a trans bond leaves the chain straight.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Why does adding one cis double bond drop a fatty acid&rsquo;s melting point by tens of degrees?',
        options: [
          'The π bond is weaker than the σ bond it replaced',
          'The kink prevents the chains from packing, so dispersion forces fall',
          'The double bond makes the molecule polar and repels its neighbors',
          'Unsaturated chains have far lower molecular weight'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Melting breaks intermolecular attractions, not bonds within the molecule, so the strength of the π bond is beside the point. A hydrocarbon chain is nonpolar either way, and the two acids have nearly the same mass — the bend is the whole story.',
        wrongFeedback: 'Melting separates molecules from each other. What has to happen between two chains for them to attract strongly, and what does a bend do to it?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'A triglyceride is heated with aqueous NaOH. What comes out?',
        options: [
          'Glycerol and three sodium carboxylate salts',
          'Three fatty acids and glycerol, unchanged',
          'A single long-chain alcohol and sodium glycerate',
          'Glycerol and three fatty aldehydes'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct — this is saponification, and it is ordinary base-promoted ester hydrolysis run three times on one molecule. Hydroxide adds to each carbonyl, glycerol leaves as the alkoxide and is protonated, and each carboxylic acid is deprotonated by the base. That last step makes the reaction irreversible, and the salts it gives are soap.',
        wrongFeedback: 'There are three ester groups here and the medium is basic. What does base-promoted ester hydrolysis give, and what does excess base then do to a carboxylic acid?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One molecule, two personalities.',
        bodyHtml: '<p class="step-body">A soap is a carboxylate salt with a long tail: an ionic head that water loves and a C17 chain that water will not have. A molecule that is both at once is <b>amphipathic</b>, and it resolves the conflict by clustering into a <b>micelle</b> — tails turned inward away from water, charged heads facing out. Grease dissolves into the nonpolar interior and the whole assembly washes away in water, which is the entire mechanism of cleaning.</p>' +
          '<p class="step-body">Replace one of a triglyceride&rsquo;s three fatty acids with a phosphate ester and you get a <b>phospholipid</b>: two tails, one charged head. Two tails are too bulky for a micelle, so these assemble into a double sheet with the tails facing each other — the <b>lipid bilayer</b>, which is every membrane you have. Nothing directs this but the same solubility conflict.</p>' +
          '<div class="explain-box"><b>Steroids</b> are the reminder that lipid is a solubility class. Four fused rings, no ester anywhere, grouped here purely because they dissolve where fats dissolve. Cholesterol wedges between phospholipid tails and moderates their fluidity, stiffening a fluid membrane and keeping a cold one from setting. Testosterone and estradiol are close relatives: estradiol is what you get when testosterone&rsquo;s A ring is aromatized, which turns the ketone on that ring into a phenol.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'Why do phospholipids form bilayers where soaps form micelles?',
        options: [
          'Phospholipids carry a charge and soaps do not',
          'Two bulky tails will not fit into a micelle interior, but two facing sheets accommodate them',
          'Phospholipids are not amphipathic',
          'Micelles require an even number of molecules'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and it is a geometry argument rather than a chemical one. Both molecules are amphipathic and both are driven to hide their tails from water; a one-tailed molecule tapers to a wedge that fills a sphere neatly, while a two-tailed one is roughly a cylinder and tiles into a flat sheet instead.',
        wrongFeedback: 'Both are charged and both are amphipathic, so that is not the difference. Count the tails and think about the shape of the molecule.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Partial hydrogenation is meant to saturate a vegetable oil. Why does it produce trans fats, and why does that harden the oil even where no H₂ was added?',
        options: [
          'The catalyst adds hydrogen anti, which gives the trans alkene directly',
          'Addition is reversible on the catalyst, so some alkenes re-form as trans — and trans chains pack like saturated ones',
          'Heat alone isomerizes cis to trans, and trans molecules are heavier',
          'Trans fats form from the glycerol backbone rather than the chains'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct on both halves. On the metal surface the alkene picks up one hydrogen to give a bound intermediate that can either take the second — completing a <i>syn</i> addition — or lose the first and go back to an alkene. Reversing does not remember which geometry it started from, so a share of the double bonds that survive come back <b>trans</b>. Those chains are still unsaturated, but a trans bond leaves the chain straight, so they pack and melt like saturated chains and the oil hardens. Running the reaction to completion avoids it; stopping partway, which is what gives a spreadable texture, is exactly what creates them.'
      }
    ]
  });

})();
});
</script>
