<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* The point of the chapter is the reactivity/selectivity trade, and this
     step makes students commit to a reagent for four jobs where the obvious
     answer is wrong half the time. */
  var CASES = [
    { id:'r1', t:'A <b>very hindered</b> ketone that enolizes with RMgX', right:'rli',
      why:'RLi. An organolithium is smaller and more reactive, so it adds where a Grignard stalls and acts as a base instead. This is the case where turning reactivity up is the right answer.' },
    { id:'r2', t:'A <b>carboxylic acid</b> straight to a ketone', right:'rli',
      why:'RLi, two equivalents. The first deprotonates the acid; the second adds to the carboxylate, which a Grignard is not reactive enough to do.' },
    { id:'r3', t:'Deprotonate a ketone <b>without</b> adding to it', right:'lda',
      why:'LDA. Made from n-BuLi and diisopropylamine, it is strong enough to take the proton off the carbon next to the C=O completely &mdash; giving the anion called an enolate &mdash; and far too bulky to attack the carbonyl itself. That pairing is what no simple RLi can give you.' },
    { id:'r4', t:'Join a <b>terminal alkyne</b> to a primary alkyl halide', right:'acet',
      why:'An acetylide, from NaNH₂ or n-BuLi. It is a genuine carbon nucleophile that will do SN2 on a primary halide &mdash; which a Grignard does not reliably do.' }
  ];
  var OPTS = [ { k:'rli', l:'RLi' }, { k:'lda', l:'LDA' }, { k:'acet', l:'An acetylide' } ];

  window.OchemLessonEngine.start({
    topicId: 'organolithium-reagents',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A Grignard with the volume turned up.',
        bodyHtml: '<p class="step-body">An organolithium is made the same way: halide plus metal, in a dry solvent. It takes <b>two</b> equivalents of lithium rather than one of magnesium, because each lithium brings one electron and one of them departs as the salt: <b>R&ndash;Br + 2 Li &rarr; R&ndash;Li + LiBr</b>.</p>' +
          '<p class="step-body">Everything a Grignard does, RLi also does. The reason to reach for one is the electronegativity gap: lithium at 0.98 sits further below carbon than magnesium at 1.31, so the carbon carries more negative charge, and the reagent is both a stronger nucleophile and a stronger base.</p>' +
          '<div class="explain-box">The price shows up at the bench too: alkyllithiums are pyrophoric, are titrated before use because they lose strength on standing, and are normally run at &minus;78 &deg;C &mdash; partly for selectivity and partly because given warmth they deprotonate the ether they are dissolved in. A Grignard tolerates a room-temperature flask; an organolithium often does not.</div>' +
          '<div class="explain-box">Which means less selectivity, not more capability. Most of the time the extra reactivity is something to manage rather than something to use &mdash; the next section turns reactivity <i>down</i> and gets more out of it. There are two places where turning it up is exactly right, and they are worth knowing precisely.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A carboxylic acid to a ketone, which should not work.',
        bodyHtml: '<p class="step-body">Take the problem at face value and it looks impossible. A carboxylic acid has an O&ndash;H, so the first equivalent of RLi is spent deprotonating it. What is left is a <b>carboxylate</b> &mdash; a carbonyl carrying a full negative charge, which is about the worst electrophile in the course.</p>' +
          '<p class="step-body">An organolithium is reactive enough to add to it anyway. And the intermediate that results is the reason the reaction is useful: it is a <b>dianion</b>, with two negative charges on the two oxygens of one carbon, and it <b>cannot</b> collapse. Collapsing would mean expelling O²⁻, which is no leaving group at all, and pushing a third negative charge onto a center that already carries two. So it sits there until the acidic workup, and only then loses water to give the ketone.</p>' +
          '<div class="explain-box">That is why this stops at the ketone when an ester does not. With an ester, the ketone actually forms in the flask and is attacked at once. Here the ketone <b>does not exist</b> until workup, by which point every equivalent of RLi has been consumed. Two equivalents are needed: one for the proton, one for the addition.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which lithium reagent does each job?</h2>' +
            '<p class="step-body">All three are made from the same starting point, and they differ in what you did to it: used it directly, used it to deprotonate an amine, or used it to deprotonate an alkyne.</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:14px;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Reagent choice">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Ask what the job needs: raw reactivity, basicity without nucleophilicity, or a carbon nucleophile that survives an SN2.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All four. Two jobs want the reagent itself and two want what it can be turned into.'
                  : 'All four, first time. Note that half the value of n-BuLi is not what it attacks but what it deprotonates.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'What makes LDA useful in a way that n-BuLi is not?',
        options: [
          'It is a stronger base than n-BuLi',
          'It is strongly basic but too hindered to add to a carbonyl',
          'It is a weaker base, so it deprotonates selectively',
          'It contains no lithium, so it cannot attack'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and that pairing is the whole reason it exists. n-BuLi would deprotonate a ketone and then add to it; two isopropyl groups on the nitrogen block the approach to a carbonyl while leaving the basicity intact. Note that the anion it leaves behind, shared between the &alpha; carbon and the oxygen, is an <b>enolate</b>, and that <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-enolate-chemistry\">Enolate Chemistry</a> is built on it. Note also that LDA is <i>made</i> from n-BuLi, so it is weaker as a base — that is the price of the selectivity, and it is still far more than enough.',
        wrongFeedback: 'A reagent can be a strong base and a poor nucleophile at the same time. What structural feature of LDA stops it reaching a carbonyl carbon?'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Sodium acetylide is treated with 2-bromopropane. What is the major product?',
        options: [
          'The coupled internal alkyne',
          'Propene, from E2',
          'Propan-2-ol',
          'No reaction occurs'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct, and this is the limit of the acetylide alkylation. An acetylide is a carbon nucleophile, but it is also a strong base, and against a secondary halide elimination outruns substitution. The coupling is reliable on methyl and primary halides only — push it to secondary and you get an alkene, push it to tertiary and you get nothing else.',
        wrongFeedback: 'An acetylide is both nucleophilic and strongly basic. 2-Bromopropane is a secondary halide — which of those two roles wins there?'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Acetylides: a carbon nucleophile with no transition metal.',
        bodyHtml: '<p class="step-body">A terminal alkyne has a pKa of about <b>25</b>, which is startlingly acidic for a C&ndash;H. The reason is hybridization: the carbanion sits in an <b>sp</b> orbital, half s character, so the electrons are held close to the nucleus and the anion is stabilized. Compare an alkene C&ndash;H at 44 and an alkane at 50.</p>' +
          '<p class="step-body">NaNH₂ or <i>n</i>-BuLi removes that proton to give an <b>acetylide</b>, and acetylides do three things:</p>' +
          '<ul class="step-body">' +
          '<li><b>S<sub>N</sub>2 on a methyl or primary halide</b>, joining two chains. This is the one that matters, because Grignards do not do it reliably.</li>' +
          '<li><b>Addition to an aldehyde or ketone</b>, giving a propargylic alcohol.</li>' +
          '<li><b>Opening an epoxide</b> at the less hindered carbon, which adds two carbons and leaves the OH two carbons from the triple bond &mdash; the homopropargylic alcohol.</li>' +
          '</ul>' +
          '<div class="explain-box">The alkyne you build is also a handle for later. Lindlar hydrogenation gives the <i>cis</i> alkene and Na/NH₃ gives the <i>trans</i> &mdash; so an acetylide alkylation followed by a choice of reduction is the standard way to make an alkene of a specified geometry from two smaller pieces.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'Why is a terminal alkyne C–H (pKa 25) so much more acidic than an alkane C–H (pKa 50)?',
        options: [
          'The triple bond withdraws electron density inductively',
          'The carbanion sits in an sp orbital, close to the nucleus',
          'The alkyne is aromatic',
          'The triple bond is shorter, so the C–H bond is weaker'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. Acidity is about the stability of the conjugate base, and an sp orbital is half s character against a quarter for sp³, so the lone pair is held much closer to the positively charged nucleus. This is the same hybridization argument that makes an sp carbon the most electronegative of the three: it holds its bonding electrons most tightly, which is why the hydrogen attached to it is the most acidic.',
        wrongFeedback: 'Ask what is different about the orbital the lone pair occupies in the conjugate base of an alkyne, compared with that of an alkane.'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'You want cis-pent-2-ene from propyne and a two-carbon electrophile. What is the sequence, and where could it go wrong?',
        options: [
          'Alkylate the acetylide with bromoethane, then Lindlar — and the trap is using a secondary halide',
          'Alkylate with 2-bromopropane, then H₂/Pd',
          'Add the acetylide to acetaldehyde, then Na/NH₃',
          'Hydrogenate the alkyne first, then alkylate'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct on both. Deprotonate propyne with NaNH₂ to the acetylide, alkylate with bromoethane to give pent-2-yne — three carbons plus two — then reduce with H₂ over Lindlar catalyst, which delivers both hydrogens to one face and gives the <i>cis</i> alkene. Na/NH₃ at that last step would give <i>trans</i> instead — one substrate, two conditions, two geometries. The trap is the halide: bromoethane is primary and works, while anything secondary sends the strongly basic acetylide into E2 and you get an alkene you did not ask for. And hydrogenating the alkyne first fails for a different reason worth seeing — once the alkyne is reduced there is no acidic hydrogen left to deprotonate, so the order cannot be reversed.'
      }
    ]
  });

})();
});
</script>
