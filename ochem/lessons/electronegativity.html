<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  window.OchemLessonEngine.start({
    topicId: 'electronegativity',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A tug-of-war over shared electrons.',
        bodyHtml: '<p class="step-body"><b>Electronegativity</b> measures how strongly an atom pulls on the electrons in a bond. It increases as you go <b>up and to the right</b> on the periodic table (excluding noble gases) — fluorine is the most electronegative element there is.</p><p class="step-body" style="margin-bottom:0;">In any bond between two different atoms, the shared electrons sit closer to whichever one is more electronegative.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'It\'s not just "which one wins" — it\'s an actual number.',
        bodyHtml: '<p class="step-body">Electronegativity is measured on the <b>Pauling scale</b> (named for Linus Pauling, who defined it from bond energies). A few values you\'ll use constantly: F 3.98, O 3.44, N 3.04, Cl 3.16, Br 2.96, C 2.55, I 2.66, H 2.20. You can look up any element\'s value in the periodic table tool (the ⚛ button) — it shows the number for every element, not just these.</p><p class="step-body">The actual <b>difference</b> (ΔEN) between two bonded atoms tells you what kind of bond you have, as a rough rule of thumb:</p><ul class="step-body"><li><b>ΔEN below 0.5</b> — essentially nonpolar covalent, electrons shared close to evenly. C–H is 2.55−2.20 = 0.35.</li><li><b>ΔEN 0.5 to 1.7</b> — polar covalent, unevenly shared. C–O is 3.44−2.55 = 0.89; C–Cl is 3.16−2.55 = 0.61.</li><li><b>ΔEN above 1.7</b> — usually considered ionic, electrons essentially transferred rather than shared. Na–Cl is 3.16−0.93 = 2.23.</li></ul><p class="step-body" style="margin-bottom:0;">Almost every bond in organic chemistry falls in the covalent range. True ionic bonds are rare inside an organic molecule itself, though ionic species like carboxylate salts do exist.</p>'
      },
      {
        render: function(api){
          // Explicit correct side per pair (Pauling values: O 3.44, C 2.55,
          // H 2.20, Cl 3.16) — never inferred from left/right position.
          var pairs = [
            { left: 'O', right: 'H', correct: 'left' },
            { left: 'C', right: 'H', correct: 'left' },
            { left: 'C', right: 'Cl', correct: 'right' }
          ];
          var idx = 0, correctSoFar = 0;
          function scene(pair){
            return '<div class="scene"><svg viewBox="0 0 220 100">' +
              '<line x1="90" y1="50" x2="130" y2="50" stroke="var(--line)" stroke-width="2.5"/>' +
              '<g class="atom" data-key="left"><circle cx="70" cy="50" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="70" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">' + pair.left + '</text></g>' +
              '<g class="atom" data-key="right"><circle cx="150" cy="50" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="150" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14" pointer-events="none">' + pair.right + '</text></g>' +
            '</svg></div>';
          }
          function paint(){
            var pair = pairs[idx];
            var correctSymbol = pair[pair.correct];
            var wrongSymbol = pair.correct === 'left' ? pair.right : pair.left;
            api.card.innerHTML =
              '<div class="step-eyebrow">Interact &middot; ' + (idx+1) + ' / ' + pairs.length + '</div>' +
              '<h2 class="step-title">Click the more electronegative atom.</h2>' +
              scene(pair) +
              api.feedbackHtml('fb') +
              api.nextButtonHtml(idx < pairs.length-1 ? 'Next pair' : 'Continue', false);
            var fb = api.card.querySelector('#fb');
            var next = api.card.querySelector('#nextBtn');
            var answeredThis = false;
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(answeredThis) return;
                answeredThis = true;
                var isCorrect = g.getAttribute('data-key') === pair.correct;
                api.record(isCorrect);
                if(isCorrect){
                  correctSoFar++;
                  api.showFeedback(fb, true, correctSymbol + ' is more electronegative than ' + wrongSymbol + '.');
                } else {
                  api.showFeedback(fb, false, 'Actually ' + correctSymbol + ' pulls harder here — check its position on the periodic table (or look it up with the ⚛ tool).');
                }
                next.disabled = false;
              });
            });
            next.addEventListener('click', function(){
              idx++;
              if(idx < pairs.length) paint();
              else api.advance();
            });
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Guided Practice',
        title: 'Which is more electronegative: fluorine or carbon?',
        options: ['Carbon', 'Fluorine'],
        correctIndex: 1,
        correctFeedback: 'Correct — fluorine is the most electronegative element on the periodic table.',
        wrongFeedback: 'Fluorine sits at the top-right of the periodic table, where electronegativity is highest.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Independent Practice',
        title: 'In a C–Cl bond, which atom pulls electron density toward itself?',
        options: ['Chlorine', 'Carbon'],
        correctIndex: 0,
        correctFeedback: 'Correct — chlorine is more electronegative than carbon.',
        wrongFeedback: 'Compare their positions on the periodic table.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The pull carries down the chain \u2014 and a polar bond is not a weak bond.',
        bodyHtml: '<p class="step-body">Two things the numbers do not say on their own.</p><p class="step-body"><b>The pull reaches past the bond it is in.</b> An electronegative atom drags density out of the bond next door too, and the one after that, fading fast with each bond it has to cross. That is the <b>inductive effect</b>, and it adds up: each chlorine on the same carbon pulls further, though with diminishing returns, as the pKa ladder in the written section shows (drops of 1.9, then 1.6, then 0.6 units). Move the chlorine three bonds away and almost nothing is left. You will meet it measured, on the acidity scale, in <a class=\\"chapter-ref\\" href=\\"/ochem/learn.html#m-acids-bases\\">Acids &amp; Bases</a>; here it is enough to know the pull travels and that it dies with distance.</p><p class="step-body" style="margin-bottom:0;"><b>Polar does not mean weak.</b> The most common misreading of this whole section is that a big \u0394EN makes a fragile bond. C\u2013F is the most polar bond in organic chemistry and also one of the strongest \u2014 the opposite charges attract each other and <i>help</i> hold it together. Polarity tells you <b>where</b> a bond will be attacked, not <b>how easily</b> it breaks.</p>'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'In CH\u2083\u2013CHCl\u2013CH\u2082\u2013CH\u2083 (2-chlorobutane), which carbon is the most electron-poor?',
        options: ['The CH\u2083 carbon at the far end', 'The carbon bearing the Cl', 'The CH\u2082 carbon next to it', 'They are all equally electron-poor'],
        correctIndex: 1,
        correctFeedback: 'Correct \u2014 the chlorine pulls hardest on the bond it is actually in, so the carbon it sits on is the most depleted. The CH\u2082 next door feels a weaker version of the same pull, and the CH\u2083 at the far end feels essentially none. That fading with distance is the signature of induction.',
        wrongFeedback: 'Induction is strongest in the bond the electronegative atom is part of, and it fades with every bond it has to travel through. Which carbon is the chlorine attached to?'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is where "electron-poor" and "electron-rich" come from.',
        bodyHtml: '<div class="explain-box">An electronegativity difference is what makes a bond polar, and it is what leaves the carbon of a C–Br bond electron-poor — short of electron density, and therefore the place something electron-rich will come and attack. <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-reactivity\">How Reactions Happen</a> names those two halves (nucleophile and electrophile) and <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-substitution-elimination\">Substitution &amp; Elimination</a> is where a whole family of reactions runs on exactly this. It also decides which way a bond dipole points, coming up in Bond Polarity.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Which bond is more polar: C–F or C–Br?',
        options: ['C–Br — bromine is bigger', 'They’re equally polar', 'C–F — bigger electronegativity gap with carbon'],
        correctIndex: 2,
        correctFeedback: 'Correct — fluorine is far more electronegative than carbon, creating a bigger gap (and more polarity) than the smaller C–Br gap.'
      }
    ]
  });
})();
});
</script>
