<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  var TOPIC_ID = 'formal-charge';
  var step = 0; // 0 explain (what an atom owns), 1 explain (the bond term), 2 visualize+interact (NH4+), 3 guided (OH-), 4 independent (H3O+), 5 independent (HCN triple bond), 6 why-it-matters (diazomethane), 7 checksum rule, 8 challenge (nitromethane)
  var TOTAL = 8;
  var card = document.getElementById('card');
  var progFill = document.getElementById('progFill');
  var progLabel = document.getElementById('progLabel');

  // This lesson predates the shared lesson engine and owns its own step loop,
  // so its concept mapping lives here rather than in lesson-concepts.js (that
  // file's CI guard counts step objects, which this page doesn't have). Every
  // graded step here is formal-charge arithmetic; the triple-bond step and the
  // challenge also lean on reading the Lewis structure.
  var STEP_CONCEPTS = {
    2: ['formal-charge-calc'],
    3: ['formal-charge-calc'],
    4: ['formal-charge-calc'],
    5: ['formal-charge-calc', 'lewis-structures-drawing'],
    7: ['formal-charge-calc', 'lewis-structures-drawing'],
    8: ['formal-charge-calc', 'lewis-structures-drawing']
  };
  var M = window.OchemMastery;
  var conceptRec = M ? M.lessonRecorder(TOPIC_ID) : null;
  function record(correct){
    /* A step reached by going back is a re-read, not new evidence — see
       step-back.js. */
    if(SB && SB.isReplay()) return;
    window.OchemCurriculum.recordAttempt(TOPIC_ID, correct);
    if(conceptRec) conceptRec(correct, step, { concepts: STEP_CONCEPTS[step] });
  }
  function updateProgress(){
    progFill.style.width = Math.round((step/TOTAL)*100) + '%';
    progLabel.textContent = 'Step ' + (step+1) + ' / ' + (TOTAL+1);
  }
  function feedbackHtml(id){ return '<div class="feedback" id="' + id + '"></div>'; }
  /* Every verdict this page shows goes through here, so it is also where the
     reward chime is sounded. The wrong case is reported too, to reset the
     rising run the chime walks up on a streak. See /assets/chime.js. */
  function showFeedback(el, good, text){
    el.className = 'feedback show ' + (good?'good':'bad');
    el.textContent = text;
    if(window.LevlSound) window.LevlSound.answer(good);
  }
  function nextButton(label, enabled){ return '<div class="actions"><button class="btn-press" id="nextBtn"' + (enabled?'':' disabled') + '>' + label + '</button></div>'; }


  var SB = window.OchemStepBack;
  function goBack(){ if(step > 0){ step--; render(); } }
  if(SB) SB.mount(card, goBack);

  function render(){
    updateProgress();
    if(SB) SB.sync(step);
    if(step===0) renderExplain();
    else if(step===1) renderBondTerm();
    else if(step===2) renderInteractNH4();
    else if(step===3) renderGuidedOH();
    else if(step===4) renderIndependentH3O();
    else if(step===5) renderTripleBond();
    else if(step===6) renderWhyItMatters();
    else if(step===7) renderChecksum();
    // Reaching the challenge step means the lesson has been worked through.
    // This page has no completeLessonRun call of its own, but the concept
    // model still needs the "they went and read it" signal — that is what
    // releases a benched (leech) concept back into the review queue.
    else { if(M) M.noteLesson(TOPIC_ID); renderChallenge(); }
  }

  /* One multiple-choice step: the choices, the key, and the two verdicts.
     A wrong pick is marked and the buttons re-open, so the student can try
     again; the right pick enables Continue. */
  function wireChoices(key, goodText, badText, onRight){
    var fb = card.querySelector('#fb');
    card.querySelectorAll('.choice-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var v = btn.getAttribute('data-v');
        var isCorrect = v === key;
        card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
        btn.classList.add(isCorrect ? 'correct' : 'wrong');
        record(isCorrect);
        if(isCorrect){
          showFeedback(fb, true, goodText);
          onRight();
        } else {
          showFeedback(fb, false, badText);
          card.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = false; b.classList.remove('wrong'); });
        }
      });
    });
  }
  function choiceRow(opts){ return '<div class="choice-row">' + opts.map(function(o){ return '<button class="choice-btn" data-v="' + o + '">' + o + '</button>'; }).join('') + '</div>'; }

  // ---- Step 0: Explain — what an atom owns, on water ----
  function renderExplain(){
    card.innerHTML =
      '<div class="step-eyebrow">Explain</div>' +
      '<h2 class="step-title">Count what each atom owns.</h2>' +
      '<p class="step-body">Take water, H₂O. A lone oxygen atom brings 6 valence electrons (its outer-shell electrons). In water, the oxygen has two <b>lone pairs</b>, pairs of electrons it keeps to itself, and two bonds, one to each H.</p>' +
      '<p class="step-body">The rule for ownership: an atom owns both electrons of each lone pair, and <b>one</b> of the two electrons in each bond. So the oxygen owns 4 + 2 = 6. It brought 6, so it is neutral.</p>' +
      '<!-- fig:l-fc-own-water:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 250" role="img" aria-label="Water drawn with the two electrons of each O–H bond shown as dots. A dashed loop around oxygen takes in its two lone pairs and the one bond electron nearer to it on each side. Oxygen owns six electrons, the same six it brought, so its formal charge is zero."><rect class="fg-panel" x="10" y="10" width="320" height="230" rx="10"></rect><text class="fg-lbl" x="170" y="32" text-anchor="middle" font-size="13">water, H₂O</text><circle class="fg-dash-hi" cx="170" cy="114" r="32"></circle><line class="fg-bond-soft" x1="157.88" y1="121" x2="124.1" y2="140.5"></line><circle class="fg-lp" cx="148.35" cy="126.5" r="2.6"></circle><circle class="fg-lp-mut" cx="133.63" cy="135" r="2.6"></circle><circle class="fg-atom" cx="114.57" cy="146" r="11"></circle><text class="fg-lbl" x="114.57" y="150.44" text-anchor="middle" font-size="12">H</text><line class="fg-bond-soft" x1="182.12" y1="121" x2="215.9" y2="140.5"></line><circle class="fg-lp" cx="191.65" cy="126.5" r="2.6"></circle><circle class="fg-lp-mut" cx="206.37" cy="135" r="2.6"></circle><circle class="fg-atom" cx="225.43" cy="146" r="11"></circle><text class="fg-lbl" x="225.43" y="150.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="158.33" cy="95.97" r="2.3"></circle><circle class="fg-lp" cx="151.97" cy="102.33" r="2.3"></circle><circle class="fg-lp" cx="188.03" cy="102.33" r="2.3"></circle><circle class="fg-lp" cx="181.67" cy="95.97" r="2.3"></circle><circle class="fg-atom-hi" cx="170" cy="114" r="14"></circle><text class="fg-lbl" x="170" y="118.44" text-anchor="middle" font-size="12">O</text><text class="fg-tag" x="170" y="190" text-anchor="middle" font-size="11">O brings 6 valence electrons</text><text class="fg-tag" x="170" y="207" text-anchor="middle" font-size="11">owns 4 (lone pairs) + 2 (bonds) = 6</text><text class="fg-tag-good" x="170" y="224" text-anchor="middle" font-size="11">owns 6, brought 6: charge 0</text></svg><figcaption>Everything inside the dashed loop belongs to the oxygen.</figcaption></figure><!-- fig:l-fc-own-water:end -->' +
      '<p class="step-body">An atom’s <b>formal charge</b> is what it brought minus what it owns:</p>' +
      '<div class="formula">FC = (valence electrons) − (lone-pair electrons) − (number of bonds)</div>' +
      '<p class="step-body" style="margin-bottom:0;">Every structure in this lesson is a <b>Lewis structure</b>: each bond is a line and each lone pair is two dots. The next lesson shows how to draw one; here you only count.</p>' +
      nextButton('Continue', true);
    card.querySelector('#nextBtn').addEventListener('click', function(){ step=1; render(); });
  }

  // ---- Step 1: Explain — the bond term counts bonds, on acetone ----
  function renderBondTerm(){
    card.innerHTML =
      '<div class="step-eyebrow">Explain</div>' +
      '<h2 class="step-title">The last term counts bonds, the lines you draw.</h2>' +
      '<p class="step-body">Acetone’s oxygen has two lone pairs and a <b>double bond</b> to carbon. A double bond is two lines, so it counts <b>2</b>: 6 − 4 − 2 = 0. The oxygen is neutral, as it should be.</p>' +
      '<!-- fig:l-fc-bond-term:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 310" role="img" aria-label="Acetone drawn with every atom. The oxygen has two lone pairs and a double bond to the central carbon. Its count is 6 minus 4 minus 2 equals 0. Counting the double bond as one would wrongly give plus one."><rect class="fg-panel" x="10" y="10" width="320" height="290" rx="10"></rect><text class="fg-lbl" x="170" y="32" text-anchor="middle" font-size="13">acetone, (CH₃)₂C=O</text><line class="fg-bond" x1="166" y1="134" x2="166" y2="108"></line><line class="fg-bond" x1="174" y1="134" x2="174" y2="108"></line><line class="fg-bond" x1="157.88" y1="155" x2="133.63" y2="169"></line><line class="fg-bond" x1="182.12" y1="155" x2="206.37" y2="169"></line><line class="fg-bond" x1="128.5" y1="188.12" x2="134" y2="197.65"></line><line class="fg-bond" x1="109.38" y1="183" x2="99.85" y2="188.5"></line><line class="fg-bond" x1="114.5" y1="163.88" x2="109" y2="154.35"></line><line class="fg-bond" x1="211.5" y1="188.12" x2="206" y2="197.65"></line><line class="fg-bond" x1="230.62" y1="183" x2="240.15" y2="188.5"></line><line class="fg-bond" x1="225.5" y1="163.88" x2="231" y2="154.35"></line><circle class="fg-lp" cx="153.2" cy="79.1" r="2.3"></circle><circle class="fg-lp" cx="148.7" cy="86.9" r="2.3"></circle><circle class="fg-lp" cx="191.3" cy="86.9" r="2.3"></circle><circle class="fg-lp" cx="186.8" cy="79.1" r="2.3"></circle><circle class="fg-atom" cx="170" cy="148" r="14"></circle><text class="fg-lbl" x="170" y="152.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom-hi" cx="170" cy="94" r="14"></circle><text class="fg-lbl" x="170" y="98.44" text-anchor="middle" font-size="12">O</text><circle class="fg-atom" cx="121.5" cy="176" r="14"></circle><text class="fg-lbl" x="121.5" y="180.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="218.5" cy="176" r="14"></circle><text class="fg-lbl" x="218.5" y="180.44" text-anchor="middle" font-size="12">C</text><circle class="fg-atom" cx="139.5" cy="207.18" r="11"></circle><text class="fg-lbl" x="139.5" y="211.62" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="90.33" cy="194" r="11"></circle><text class="fg-lbl" x="90.33" y="198.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="103.5" cy="144.82" r="11"></circle><text class="fg-lbl" x="103.5" y="149.26" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="200.5" cy="207.18" r="11"></circle><text class="fg-lbl" x="200.5" y="211.62" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="249.67" cy="194" r="11"></circle><text class="fg-lbl" x="249.67" y="198.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="236.5" cy="144.82" r="11"></circle><text class="fg-lbl" x="236.5" y="149.26" text-anchor="middle" font-size="12">H</text><text class="fg-tag-good" x="170" y="244" text-anchor="middle" font-size="11">O: 6 − 4 − 2 = 0 (double bond = 2)</text><text class="fg-tag" x="170" y="261" text-anchor="middle" font-size="11">every C: 4 − 0 − 4 = 0 · each H: 0</text><text class="fg-tag-warn" x="170" y="278" text-anchor="middle" font-size="11">double bond as 1: 6 − 4 − 1 = +1 ✗</text></svg><figcaption>Check each count against the lines and dots in the drawing.</figcaption></figure><!-- fig:l-fc-bond-term:end -->' +
      '<p class="step-body" style="margin-bottom:0;">A single bond counts 1 and a triple bond counts 3. It is the same as taking half the bonding electrons: a double bond holds four electrons, and the atom owns two of them.</p>' +
      nextButton('Continue', true);
    card.querySelector('#nextBtn').addEventListener('click', function(){ step=2; render(); });
  }

  // ---- Step 2: Visualize + Interact — NH4+ ----
  function renderInteractNH4(){
    var countedBonds = 0;
    card.innerHTML =
      '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
      '<h2 class="step-title">Click every bond around nitrogen.</h2>' +
      '<p class="step-body">This is the ammonium ion, NH₄⁺. Nitrogen brings 5 valence electrons and has no lone pair here. Click each bond line to count its bonds.</p>' +
      '<div class="scene"><svg viewBox="0 0 220 200">' +
        '<text x="100" y="8" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="var(--muted)">NH₄⁺</text>' +

        var b = g.getAttribute('data-b');
        if(counted[b]) return;
        counted[b] = true;
        g.querySelector('.bond-line').classList.add('counted');
        countedBonds++;

      function(){ card.querySelector('#doneBox').innerHTML = '<div class="actions" style="margin-top:8px;"><a href="../learn.html" class="btn-press">Back to the textbook</a></div>'; });
  }

  (function(){
    var shell = card.parentNode;
