        title: 'A branch is an alkane minus one hydrogen.',
        bodyHtml: '<p class="step-body">Methane is CH₄. Take away one hydrogen and you have CH₃–, a piece with a free bond. That piece is a <b>methyl</b> group. Every carbon branch is named this way: the root for its length plus <b>-yl</b>. One carbon is methyl, two is <b>ethyl</b>, three <b>propyl</b>, four <b>butyl</b>. The ending -yl means "attached to something else rather than standing alone".</p>' +
          '<p class="step-body">From three carbons up, a branch can attach through different carbons, and each choice is a different group. The branch carbon bonded to the parent chain is the <b>point of attachment</b>. In the drawings it carries the dot. Propyl attaches through an end carbon and isopropyl through the middle one.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Each group has a common name and a systematic one. The systematic name says which chain, and where it attaches: <i>propan-2-yl</i> is a three-carbon chain attached through its C2. IUPAC\'s 2013 recommendations prefer the systematic names, except that they keep <i>tert</i>-butyl. Most lecturers and exams use the common names, so learn both directions.</p>',

ext-anchor="middle" font-size="11">4</text><rect class="fg-panel" x="12" y="396" width="164" height="164" rx="10"></rect><text class="fg-lbl" x="94" y="418" text-anchor="middle" font-size="12.5">isobutyl</text><text class="fg-sm" x="94" y="436" text-anchor="middle" font-size="10">2-methylpropyl</text><line class="fg-bond-hi" x1="42" y1="498" x2="73" y2="480"></line><line class="fg-bond" x1="73" y1="480" x2="104" y2="498"></line><line class="fg-bond" x1="104" y1="498" x2="135" y2="480"></line><line class="fg-bond" x1="104" y1="498" x2="104" y2="534"></line><circle class="fg-atom-hi" cx="42" cy="498" r="5"></circle><text class="fg-tag-good" x="73" y="471" text-anchor="middle" font-size="11">1</text><text class="fg-tag-good" x="117" y="514" text-anchor="middle" font-size="11">2</text><text class="fg-tag-good" x="135" y="471" text-anchor="middle" font-size="11">3</text><text class="fg-sm" x="104" y="551" text-anchor="middle" font-size="10">methyl</text><rect class="fg-panel" x="184" y="396" width="164" height="164" rx="10"></rect><text class="fg-lbl" x="266" y="418" text-anchor="middle" font-size="12.5">tert-butyl</text><text class="fg-sm" x="266" y="436" text-anchor="middle" font-size="10">2-methylpropan-2-yl</text><line class="fg-bond-hi" x1="220" y1="498" x2="258" y2="498"></line><line class="fg-bond" x1="258" y1="498" x2="258" y2="462"></line><line class="fg-bond" x1="258" y1="498" x2="258" y2="534"></line><line class="fg-bond" x1="258" y1="498" x2="296" y2="498"></line><circle class="fg-atom-hi" cx="220" cy="498" r="5"></circle><text class="fg-tag-good" x="270" y="466" text-anchor="middle" font-size="11">1</text><text class="fg-tag-good" x="269" y="514" text-anchor="middle" font-size="11">2</text><text class="fg-tag-good" x="296" y="489" text-anchor="middle" font-size="11">3</text><text class="fg-sm" x="258" y="551" text-anchor="middle" font-size="10">methyl</text><text class="fg-tag" x="180" y="582" text-anchor="middle" font-size="11">five carbons</text><rect class="fg-panel" x="98" y="590" width="164" height="164" rx="10"></rect><text class="fg-lbl" x="180" y="612" text-anchor="middle" font-size="12.5">neopentyl</text><text class="fg-sm" x="180" y="630" text-anchor="middle" font-size="10">2,2-dimethylpropyl</text><line class="fg-bond-hi" x1="128" y1="692" x2="159" y2="674"></line><line class="fg-bond" x1="159" y1="674" x2="190" y2="692"></line><line class="fg-bond" x1="190" y1="692" x2="221" y2="674"></line><line class="fg-bond" x1="190" y1="692" x2="190" y2="728"></line><line class="fg-bond" x1="190" y1="692" x2="221" y2="710"></line><circle class="fg-atom-hi" cx="128" cy="692" r="5"></circle><text class="fg-tag-good" x="159" y="665" text-anchor="middle" font-size="11">1</text><text class="fg-tag-good" x="179" y="711" text-anchor="middle" font-size="11">2</text><text class="fg-tag-good" x="221" y="665" text-anchor="middle" font-size="11">3</text><text class="fg-sm" x="190" y="745" text-anchor="middle" font-size="10">methyl</text><text class="fg-sm" x="227" y="727" text-anchor="middle" font-size="10">methyl</text><text class="fg-sm" x="180" y="770" text-anchor="middle" font-size="10">The dot marks the bond to the parent chain.</text><text class="fg-sm" x="180" y="786" text-anchor="middle" font-size="10">Green numbers are the group’s own.</text></svg><figcaption>Compare the groups that share a carbon count. The carbons are the same; only the carbon that carries the highlighted bond changes.<span class="notes-figure-note"><i>sec</i>-Butyl and isobutyl are the pair people confuse. In <i>sec</i>-butyl the highlighted bond lands on the branch point itself. In isobutyl it lands one carbon before the branch point. Cover the names, look at the highlighted bond, and say which is which.</span></figcaption></figure><!-- fig:alkyl-group-gallery:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Halogens are prefixes, and they compete with alkyl groups as equals.',
        bodyHtml: '<p class="step-body">Halogens are always named as prefixes: <b>fluoro</b>, <b>chloro</b>, <b>bromo</b>, <b>iodo</b>.</p>' +
          '<p class="step-body">The hexane below carries a methyl and a chlorine. From the left they sit at {2, 4}; from the right at {3, 5}. Compare the sets term by term: the first place they differ decides, and 2 beats 3. So C1 is the left end, and the name is <b>4-chloro-2-methylhexane</b> (prefixes go in alphabetical order, as a later step shows). The chlorine gets no priority for the low number.</p>' +
          '<div class="explain-box">That holds while the chain carries only prefixes. A <b>principal group</b> (the group named as the suffix, such as the –OH of an alcohol) or a C=C or C≡C bond takes the lowest number first. The next two lessons deal with those.</div>' +
          '<p class="step-body" style="margin-bottom:0;">Two more groups are always prefixes: <b>nitro</b> (–NO₂) and <b>alkoxy</b> (–OR, an oxygen bonded to a carbon group, so –OCH₃ is <i>methoxy</i>). An ether has no suffix of its own. It is named as an alkoxy group on something else.</p>',
        diagramHtml: '<!-- fig:halogen-equal-standing:start --><figure class="notes-figure notes-figure--wide" style="--vb:360"><svg viewBox="0 0 360 450" role="img" aria-label="The same hexane drawn twice, carrying a methyl and a chlorine. Numbered from the left, the methyl is on C2 and the chlorine on C4, set {2, 4}. Numbered from the right, the chlorine is on C3 and the methyl on C5, set {3, 5}. The left numbering wins, giving 4-chloro-2-methylhexane."><rect class="fg-panel-good" x="12" y="12" width="336" height="196" rx="10"></rect><text class="fg-tag" x="180" y="36" text-anchor="middle" font-size="11">C1 at the left end</text><line class="fg-bond-hi" x1="80" y1="128" x2="120" y2="104"></line><line class="fg-bond-hi" x1="120" y1="104" x2="160" y2="128"></line><line class="fg-bond-hi" x1="160" y1="128" x2="200" y2="104"></line><line class="fg-bond-hi" x1="200" y1="104" x2="240" y2="128"></line><line class="fg-bond-hi" x1="240" y1="128" x2="280" y2="104"></line><line class="fg-bond" x1="120" y1="104" x2="120" y2="66"></line><text class="fg-sm" x="120" y="57" text-anchor="middle" font-size="10">methyl</text><line class="fg-bond" x1="200" y1="104" x2="200" y2="76"></line><circle class="fg-atom" cx="200" cy="62" r="15"></circle><text class="fg-lbl" x="200" y="65.89" text-anchor="middle" font-size="10.5">Cl</text><text class="fg-lbl" x="80" y="150" text-anchor="middle" font-size="11">1</text><text class="fg-lbl" x="120" y="126" text-anchor="middle" font-size="11">2</text><text class="fg-lbl" x="160" y="150" text-anchor="middle" font-size="11">3</text><text class="fg-lbl" x="200" y="126" text-anchor="middle" font-size="11">4</text><text class="fg-lbl" x="240" y="150" text-anchor="middle" font-size="11">5</text><text class="fg-lbl" x="280" y="94" text-anchor="middle" font-size="11">6</text><text class="fg-lbl" x="180" y="178" text-anchor="middle" font-size="12">substituents at {2, 4}</text><text class="fg-tag-good" x="180" y="198" text-anchor="middle" font-size="11">lower at the first difference</text><rect class="fg-panel-warn" x="12" y="220" width="336" height="196" rx="10"></rect><text class="fg-tag" x="180" y="244" text-anchor="middle" font-size="11">C1 at the right end</text><line class="fg-bond-hi" x1="80" y1="336" x2="120" y2="312"></line><line class="fg-bond-hi" x1="120" y1="312" x2="160" y2="336"></line><line class="fg-bond-hi" x1="160" y1="336" x2="200" y2="312"></line><line class="fg-bond-hi" x1="200" y1="312" x2="240" y2="336"></line><line class="fg-bond-hi" x1="240" y1="336" x2="280" y2="312"></line><line class="fg-bond" x1="120" y1="312" x2="120" y2="274"></line><text class="fg-sm" x="120" y="265" text-anchor="middle" font-size="10">methyl</text><line class="fg-bond" x1="200" y1="312" x2="200" y2="284"></line><circle class="fg-atom" cx="200" cy="270" r="15"></circle><text class="fg-lbl" x="200" y="273.89" text-anchor="middle" font-size="10.5">Cl</text><text class="fg-lbl" x="80" y="358" text-anchor="middle" font-size="11">6</text><text class="fg-lbl" x="120" y="334" text-anchor="middle" font-size="11">5</text><text class="fg-lbl" x="160" y="358" text-anchor="middle" font-size="11">4</text><text class="fg-lbl" x="200" y="334" text-anchor="middle" font-size="11">3</text><text class="fg-lbl" x="240" y="358" text-anchor="middle" font-size="11">2</text><text class="fg-lbl" x="280" y="302" text-anchor="middle" font-size="11">1</text><text class="fg-lbl" x="180" y="386" text-anchor="middle" font-size="12">substituents at {3, 5}</text><text class="fg-tag-warn" x="180" y="406" text-anchor="middle" font-size="11">higher at the first difference</text><text class="fg-lbl" x="180" y="438" text-anchor="middle" font-size="13">4-chloro-2-methylhexane</text></svg><figcaption>Same molecule, two numberings. Read the two sets term by term: 2 against 3 settles it at the first term.<span class="notes-figure-note">The chlorine gets no say. It ends up with the higher of its two possible numbers, because the direction was fixed by the first term.</span></figcaption></figure><!-- fig:halogen-equal-standing:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two of the same group: one prefix, and one number for each.',
