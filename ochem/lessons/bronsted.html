<script>
(function(){
  function protonTransferSvg(){
    return '<div class="scene"><svg viewBox="0 0 300 110">' +
      '<text x="10" y="60" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="15" fill="var(--ink)">H</text>' +
      '<line x1="20" y1="55" x2="45" y2="55" stroke="var(--line)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="acid"><circle cx="62" cy="55" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="62" y="61" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">Cl</text></g>' +
      '<text x="105" y="60" font-family="Nunito" font-weight="800" font-size="16" fill="var(--muted)">+</text>' +
      '<g class="atom" data-key="base"><circle cx="150" cy="55" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="150" y="52" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">N</text><text x="150" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">H₃</text></g>' +
      '<text x="185" y="60" font-family="Nunito" font-weight="900" font-size="18" fill="var(--accent)">&#8594;</text>' +
      '<circle cx="230" cy="55" r="18" fill="var(--tint-accent)" stroke="var(--line)" stroke-width="2"/><text x="230" y="52" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12">NH₄</text><text x="230" y="65" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="10">+</text>' +
      '<text x="262" y="60" font-family="Nunito" font-weight="800" font-size="16" fill="var(--muted)">+</text>' +
      '<text x="278" y="60" font-family="IBM Plex Mono" font-weight="700" font-size="14" fill="var(--ink)">Cl⁻</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'bronsted',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The Brønsted-Lowry definition</h3><p class="step-body">A <b>Brønsted-Lowry acid</b> is a proton (H⁺) donor. A <b>Brønsted-Lowry base</b> is a proton acceptor. Every acid-base reaction is fundamentally a <b>proton transfer</b> from the acid to the base — nothing more mysterious than that. This definition is broader than the older Arrhenius definition (acid = produces H⁺ in water, base = produces OH⁻ in water), which only works in aqueous solution; Brønsted-Lowry works in any solvent, or no solvent at all, which is essential since most organic reactions don\'t happen in water.</p>' +
      '<h3>Worked example: HCl + NH₃</h3><p class="step-body">HCl donates its proton to the lone pair on nitrogen in NH₃. HCl is the acid (proton donor); NH₃ is the base (proton acceptor, using its lone pair). The products are NH₄⁺ (ammonium) and Cl⁻ (chloride).</p>' +
      '<div class="notes-fact">Curved arrows describe this exactly like Module 2 taught: one arrow from nitrogen\'s lone pair to the H, and one arrow from the H–Cl bond to Cl. The base\'s lone pair is always the nucleophile here, and the acidic proton is always the electrophile — Brønsted acid-base chemistry is just a specific, extremely common case of the nucleophile/electrophile framework from Module 2.</div>' +
      '<h3>Which side does the equilibrium favor?</h3><p class="step-body">Every proton transfer is technically an equilibrium (shown with two arrows, &#8652;), even when it looks like it goes to completion. The reaction favors the side with the <b>weaker acid and weaker base</b> — because that\'s the lower-energy, more stable side. You\'ll quantify "weaker acid" precisely with pKa in the next lesson.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Acids give up a proton. Bases take one.',
        bodyHtml: '<p class="step-body">A <b>Brønsted-Lowry acid</b> is a proton (H⁺) donor. A <b>Brønsted-Lowry base</b> is a proton acceptor. Every acid-base reaction — no matter how complicated the molecule looks — is fundamentally a single proton moving from the acid to the base.</p><p class="step-body" style="margin-bottom:0;">This is broader than the Arrhenius definition you may have seen in general chemistry (acid = produces H⁺ in water, base = produces OH⁻ in water), which only works when water is the solvent. Brønsted-Lowry works in any solvent — or no solvent at all — which matters constantly in organic chemistry, where reactions routinely happen in ether, dichloromethane, or neat (no solvent).</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the acid, then click the base.</h2>' +
            '<p class="step-body">HCl reacts with NH₃ to form NH₄⁺ and Cl⁻. One of these two starting materials donates a proton; the other accepts it.</p>' +
            protonTransferSvg() +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var got = { acid: false, base: false };
          function checkDone(){
            if(got.acid && got.base){
              api.showFeedback(fb, true, 'Right — HCl is the acid (it donates its proton to nitrogen\'s lone pair) and NH₃ is the base (it accepts that proton). The products, NH₄⁺ and Cl⁻, are their conjugate base and conjugate acid.');
              next.disabled = false;
            }
          }
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(got[key]) return;
              got[key] = true;
              g.classList.add('chosen');
              if(key === 'acid'){ api.record(true); }
              checkDone();
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'In HCl + NH₃ → NH₄⁺ + Cl⁻, which species is the Brønsted-Lowry acid?',
        options: ['HCl — it donates a proton', 'NH₃ — it has a lone pair', 'Cl⁻ — it ends up negatively charged'],
        correctIndex: 0,
        correctFeedback: 'Correct — HCl gives up its proton, which is the definition of a Brønsted-Lowry acid.',
        wrongFeedback: 'Ask which species loses a hydrogen (as H⁺) going from left to right — that one is the acid.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'NH₄⁺ is called the ___ of NH₃.',
        options: ['conjugate acid', 'conjugate base', 'Lewis acid'],
        correctIndex: 0,
        correctFeedback: 'Correct. NH₃ gained a proton to become NH₄⁺ — a base that has just accepted a proton becomes its conjugate acid.',
        wrongFeedback: 'NH₃ gained a proton, it didn\'t lose one — gaining a proton makes something a conjugate acid, not a conjugate base.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every proton transfer is an equilibrium — it has a favored side.',
        bodyHtml: '<p class="step-body">Even when a reaction looks like it goes to completion, a proton transfer is technically an equilibrium, and equilibria favor the more stable, lower-energy side. For an acid-base reaction, that\'s the side with the <b>weaker acid and weaker base</b>.</p><p class="step-body" style="margin-bottom:0;">HCl + NH₃ → NH₄⁺ + Cl⁻ overwhelmingly favors the right side, because HCl is an extremely strong acid and NH₃ is a fairly strong base, while NH₄⁺ is a much weaker acid and Cl⁻ is a much weaker base. You\'ll make this precise with actual numbers (pKa) in the next lesson — for now, the qualitative rule is: <b>the stronger acid and stronger base end up as reactants; the weaker acid and weaker base end up as products.</b></p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Acid-base steps show up inside almost every mechanism you\'ll draw.',
        bodyHtml: '<div class="explain-box">Long before you get to substitution, elimination, or carbonyl chemistry, you\'ll draw proton transfers as setup steps — protonating an alcohol\'s oxygen before it can leave as water in an SN1 reaction, or deprotonating an alpha carbon before an aldol reaction (Module 11). Recognizing "this step is just an acid-base reaction" instantly tells you which curved arrows to draw: base lone pair to H, H–X bond to X.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Water reacts with HBr: H₂O + HBr → H₃O⁺ + Br⁻. Which statement is correct?',
        options: ['Water is the base (proton acceptor); HBr is the acid (proton donor)', 'Water is the acid; HBr is the base', 'Both are acids, since both contain hydrogen'],
        correctIndex: 0,
        correctFeedback: 'Correct — water\'s lone pair accepts the proton from HBr, making water the base and HBr the acid here. (Water can also act as an acid in other reactions — it\'s amphoteric — but not in this one.)'
      }
    ]
  });
})();
</script>
