<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* The step asks the student to reason about who donates the proton, so the
     picture has to show the two things that decide it: the polarity of the
     H-Cl bond and the lone pair on nitrogen. It used to be the equation as
     plain text, which asked for reasoning and then drew none of the evidence. */
  function protonTransferSvg(){
    return '<div class="scene"><svg viewBox="0 0 340 150" role="group" aria-label="HCl and ammonia, with both curved arrows of the proton transfer drawn">' +
      // ---- the acid, clickable as one unit ----
      '<g class="atom" data-key="acid">' +
        '<text x="18" y="83" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="15" fill="var(--ink)">H</text>' +
        '<line x1="29" y1="77" x2="51" y2="77" stroke="var(--line)" stroke-width="2.5"/>' +
        '<circle cx="70" cy="77" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/>' +
        '<text x="70" y="83" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">Cl</text>' +
      '</g>' +
      '<text x="18" y="52" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="var(--warn, #b45309)">δ+</text>' +
      '<text x="96" y="83" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="var(--accent)">δ−</text>' +
      // ---- the base, clickable as one unit ----
      '<g class="atom" data-key="base">' +
        '<circle cx="160" cy="77" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/>' +
        '<text x="160" y="74" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">N</text>' +
        '<text x="160" y="88" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="9">H₃</text>' +
      '</g>' +
      '<circle cx="154" cy="52" r="2.4" fill="var(--ink)"/><circle cx="166" cy="52" r="2.4" fill="var(--ink)"/>' +
      // ---- arrow 1: the lone pair takes the proton ----
      '<path d="M158 46 Q100 14 30 60" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
      '<polygon points="30,60 34.5,52.3 38.9,58.9" fill="var(--accent)"/>' +
      '<text x="104" y="16" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="9" fill="var(--muted)">1 · the lone pair takes the proton</text>' +
      // ---- arrow 2: chloride leaves with the bonding pair ----
      '<path d="M40 86 Q46 114 64 102" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
      '<polygon points="64,102 59.5,109.7 55.1,103.1" fill="var(--accent)"/>' +
      '<text x="84" y="132" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="9" fill="var(--muted)">2 · chloride leaves with the pair</text>' +
      // ---- products ----
      '<text x="202" y="84" font-family="Nunito" font-weight="900" font-size="18" fill="var(--accent)">&#8594;</text>' +
      '<text x="252" y="83" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" fill="var(--ink)">NH₄⁺</text>' +
      '<text x="288" y="83" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="15" fill="var(--muted)">+</text>' +
      '<text x="316" y="83" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" fill="var(--ink)">Cl⁻</text>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'bronsted',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Acids give up a proton. Bases take one.',
        bodyHtml: '<p class="step-body">A <b>Brønsted-Lowry acid</b> is a proton (H⁺) donor. A <b>Brønsted-Lowry base</b> is a proton acceptor. Every acid-base reaction — no matter how complicated the molecule looks — is fundamentally a single proton moving from the acid to the base.</p><p class="step-body" style="margin-bottom:0;">This is broader than the Arrhenius definition you may have seen in general chemistry (acid = produces H⁺ in water, base = produces OH⁻ in water), which only works when water is the solvent. Brønsted-Lowry works in any solvent — or no solvent at all — which matters constantly in organic chemistry, where reactions routinely happen in ether, dichloromethane, or neat (no solvent).</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click the acid, then click the base.</h2>' +
            '<p class="step-body">HCl reacts with NH₃ to form NH₄⁺ and Cl⁻. The drawing shows the two things that decide which is which: the H–Cl bond is polarized, leaving that hydrogen δ+, and nitrogen has a lone pair doing nothing. One of these starting materials donates a proton; the other accepts it.</p>' +
            protonTransferSvg() +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var got = { acid: false, base: false };
          function checkDone(){
            if(got.acid && got.base){
              api.showFeedback(fb, true, 'Right — HCl is the acid (it donates its proton to nitrogen\'s lone pair) and NH₃ is the base (it accepts that proton). The products, NH₄⁺ and Cl⁻, are the conjugate acid of NH₃ and the conjugate base of HCl.');
              next.disabled = false;
            }
          }
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(got[key]) return;
              got[key] = true;
              g.classList.add('chosen');
              if(key === 'acid'){ api.record(true); }
              checkDone();
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'In HCl + NH₃ → NH₄⁺ + Cl⁻, which species is the Brønsted-Lowry acid?',
        options: ['NH₃ — it has a lone pair', 'Cl⁻ — it ends up negatively charged', 'HCl — it donates a proton'],
        correctIndex: 2,
        correctFeedback: 'Correct — HCl gives up its proton, which is the definition of a Brønsted-Lowry acid.',
        wrongFeedback: 'Ask which species loses a hydrogen (as H⁺) going from left to right — that one is the acid.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'NH₄⁺ is called the ___ of NH₃.',
        options: ['conjugate acid', 'conjugate base', 'Lewis acid'],
        correctIndex: 0,
        correctFeedback: 'Correct. NH₃ gained a proton to become NH₄⁺ — a base that has just accepted a proton becomes its conjugate acid.',
        wrongFeedback: 'NH₃ gained a proton, it didn\'t lose one — gaining a proton makes something a conjugate acid, not a conjugate base.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Every proton transfer is an equilibrium — it has a favored side.',
        bodyHtml: '<p class="step-body">Even when a reaction looks like it goes to completion, a proton transfer is technically an equilibrium, and equilibria favor the more stable, lower-energy side. For an acid-base reaction, that\'s the side with the <b>weaker acid and weaker base</b>.</p><p class="step-body" style="margin-bottom:0;">HCl + NH₃ → NH₄⁺ + Cl⁻ overwhelmingly favors the right side, because HCl is an extremely strong acid and NH₃ is a fairly strong base, while NH₄⁺ is a much weaker acid and Cl⁻ is a much weaker base. You\'ll make this precise with actual numbers (pKa) in the next lesson — for now, the qualitative rule is: <b>the stronger acid and stronger base end up as reactants; the weaker acid and weaker base end up as products.</b></p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Acid-base steps show up inside almost every mechanism you\'ll draw.',
        bodyHtml: '<div class="explain-box">Long before you get to substitution, elimination, or carbonyl chemistry, you\'ll draw proton transfers as setup steps — protonating an alcohol\'s oxygen before it can leave as water in an SN1 reaction, or deprotonating an alpha carbon before an aldol reaction (<a class=\"chapter-ref\" href=\"/ochem/learn.html#m-enolate-chemistry\">Enolate Chemistry</a>). Recognizing "this step is just an acid-base reaction" instantly tells you which curved arrows to draw: base lone pair to H, H–X bond to X.</div>'
      },
      {
        /* Deprotonation, drawn rather than described. The thing students
           get wrong is where the electrons go when the proton leaves. */
        render: function(api){
          window.OchemArrowStep.mount(api, {
            eyebrow: 'Draw it',
            title: 'Hydroxide removes the acidic proton from acetic acid. Draw both arrows.',
            bodyHtml: '<p class="step-body">Two arrows, and each answers its own question. Where do the electrons that make the new bond come from? And where do the electrons that were holding the proton on end up?</p>',
            molecule: 'acetic-acid-hydroxide',
            concepts: ['bronsted-identification', 'curved-arrow-direction'],
            arrows: [{ from: 'nucO', to: 'h' }, { from: 'bond:o2-h', to: 'o2' }],
            hint: 'One arrow starts on a hydroxide lone pair and ends on the acidic hydrogen. The other starts on the O\u2013H bond and ends on the oxygen it came from.',
            why: 'Arrow one: hydroxide\'s lone pair attacks the \u03b4+ hydrogen and becomes the new O\u2013H bond of water. Arrow two: the old O\u2013H bonding pair is left behind on acetic acid\'s oxygen, which is what makes the conjugate base negative. The proton itself moves bare, carrying no electrons at all \u2014 it is the nucleus alone that changes address, and the two arrows are the accounting for the two pairs of electrons that had to move around it. Drawing only the second arrow describes a molecule falling apart on its own; drawing only the first gives the hydrogen two bonds.',
            wrong: {
              'bond:o2-h>h': 'The electrons do not leave with the hydrogen. A Br\u00f8nsted acid donates a proton \u2014 the nucleus alone \u2014 and the bonding pair stays behind, which is why the conjugate base ends up with a negative charge.',
              'o2>bond:o2-h': 'Backwards: that arrow forms the O\u2013H bond rather than breaking it. Here the bond is breaking.',
              'h>nucO': 'Backwards, and in the way that matters most: an arrow always starts on the electrons that move, and the hydrogen has none to give. Start on hydroxide\'s lone pair and finish on the hydrogen.',
              'bond:ca-ha>ca': 'That is an alpha C\u2013H, around pKa 25 and not the acidic proton. The O\u2013H is the acidic one, because the anion left behind is spread over two oxygens by resonance.',
              'nucO>c': 'Hydroxide could attack the carbonyl carbon \u2014 that is a real reaction later in the course \u2014 but proton transfer is far faster, and this step is an acid-base step. Aim for the hydrogen.',
              'bond:c-o1>o1': 'The C=O pi bond is not what breaks when an acid is deprotonated. Look for the bond to the departing proton.'
            }
          });
        }
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Water reacts with HBr: H₂O + HBr → H₃O⁺ + Br⁻. Which statement is correct?',
        options: ['Water is the acid; HBr is the base', 'Water is the base (proton acceptor); HBr is the acid (proton donor)', 'Both are acids, since both contain hydrogen'],
        correctIndex: 1,
        correctFeedback: 'Correct — water\'s lone pair accepts the proton from HBr, making water the base and HBr the acid here. (Water can also act as an acid in other reactions — it\'s amphoteric — but not in this one.)'
      }
    ]
  });
})();
});
</script>
