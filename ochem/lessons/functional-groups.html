<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
(function(){

  var CASES = [
    { id:'g1', t:'CH<sub>3</sub>OCH<sub>2</sub>CH<sub>3</sub>', right:'ether',
      why:'An oxygen with a carbon on each side and no C=O anywhere near it. Ether. The moment you see an O between two carbons, check both neighbors for a carbonyl before you commit; here there is none.' },
    { id:'g2', t:'CH<sub>3</sub>COCH<sub>3</sub>', right:'ketone',
      why:'The middle carbon carries the C=O, and its two neighbors are both carbons. Ketone; this is acetone. The CO in the middle of a condensed formula, with carbon on both sides, is the ketone signature.' },
    { id:'g3', t:'CH<sub>3</sub>COOCH<sub>2</sub>CH<sub>3</sub>', right:'ester',
      why:'A C=O with CH<sub>3</sub> on one side and O&ndash;CH<sub>2</sub>CH<sub>3</sub> on the other. Carbon on one side, O&ndash;carbon on the other: ester (ethyl acetate). The two oxygens together, COO followed by a carbon, are what to look for.' },
    { id:'g4', t:'CH<sub>3</sub>CH<sub>2</sub>CONH<sub>2</sub>', right:'amide',
      why:'A C=O with a nitrogen attached. Amide. It is the N-on-the-carbonyl that decides it; the NH<sub>2</sub> alone would be an amine, but this NH<sub>2</sub> sits on a C=O.' },
    { id:'g5', t:'HCOOCH<sub>3</sub>', right:'ester',
      why:'The carbonyl carbon has H on one side, which looks like an aldehyde, and O&ndash;CH<sub>3</sub> on the other, which is what an ester has. The oxygen wins: an O&ndash;carbon on the carbonyl makes it an ester whatever else is attached. This is methyl formate. Aldehydes have H and a carbon (or a second H), never an O.' },
    { id:'g6', t:'CH<sub>3</sub>CON(CH<sub>3</sub>)<sub>2</sub>', right:'amide',
      why:'Nitrogen on a C=O, so an amide, and with two methyls on the nitrogen it is a tertiary amide. The extra carbons on N change the name, not the group.' }
  ];
  var OPTS = [ { k:'ester', l:'Ester' }, { k:'ether', l:'Ether' }, { k:'amide', l:'Amide' }, { k:'ketone', l:'Ketone' } ];

  window.OchemLessonEngine.start({
    topicId: 'functional-groups',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The group does the chemistry. The rest of the molecule watches.',
        bodyHtml: '<p class="step-body">A <b>functional group</b> is a small arrangement of atoms that behaves the same way on every molecule it sits on. An O&ndash;H on ethanol and an O&ndash;H on cholesterol do the same reactions with the same reagents. So organic chemistry is organized around a few dozen groups rather than tens of millions of compounds, and each of the chapters ahead is named after one.</p>' +
          '<p class="step-body">Why is the rest of the molecule a spectator? Because of the previous lesson. C&ndash;C joins two atoms of the same electronegativity, and C&ndash;H (2.55 against 2.20) is close enough that neither bond has a δ+ end worth attacking, and neither atom has a lone pair to attack with. A functional group is the part where that is not true: a polar bond to O, N or a halogen, a lone pair, or a π bond whose electrons sit exposed above and below the plane.</p>' +
          '<div class="explain-box">To read a structure, look for anything that is not C&ndash;C or C&ndash;H: an O, an N, a halogen, an S, or a double or triple bond. Each one you find is a functional group, and for the rest of the course those are the only parts you will be asked about.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Seven groups share a C=O. Read what is attached to it.',
        bodyHtml: '<p class="step-body">The groups most often confused are the ones built around a <b>carbonyl</b>, a carbon double-bonded to oxygen. Telling them apart is mechanical: find the C=O, then read the other two things attached to its carbon. One is usually carbon or hydrogen. The other one names the group.</p>' +
          '<ul class="step-body">' +
          '<li><b>H</b> &rarr; aldehyde, RCHO</li>' +
          '<li><b>carbon on both sides</b> &rarr; ketone, RCOR&prime;</li>' +
          '<li><b>OH</b> &rarr; carboxylic acid, RCOOH</li>' +
          '<li><b>O&ndash;carbon</b> &rarr; ester, RCOOR&prime;</li>' +
          '<li><b>N</b> &rarr; amide, RCONH<sub>2</sub>, RCONHR&prime;, RCONR&prime;<sub>2</sub></li>' +
          '<li><b>Cl</b> &rarr; acid chloride, RCOCl</li>' +
          '<li><b>O that leads to a second C=O</b> &rarr; anhydride, RCO&ndash;O&ndash;COR</li>' +
          '</ul>' +
          '<p class="step-body">Two look-alikes without a carbonyl sit beside this list and are the source of most errors. An <b>ether</b> is R&ndash;O&ndash;R&prime; with no C=O next to the oxygen; put a C=O beside that oxygen and it becomes an ester. An <b>amine</b> is a nitrogen bonded to carbons and hydrogens with no C=O; put the nitrogen on a carbonyl and it becomes an amide.</p>' +
          '<div class="explain-box">The other classification you need is <b>degree of substitution</b>. For a carbon, and for the alcohol or alkyl halide sitting on it, count the carbons bonded to that carbon: 1&deg;, 2&deg;, 3&deg;. For an amine, count the carbons bonded to the <i>nitrogen</i>. So (CH<sub>3</sub>)<sub>3</sub>C&ndash;OH is a tertiary alcohol and (CH<sub>3</sub>)<sub>3</sub>C&ndash;NH<sub>2</sub> is a primary amine, on the very same carbon.</div>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Which group is each of these?</h2>' +
            '<p class="step-body">Find the oxygen or nitrogen first. Then ask: <b>is there a C=O next to it?</b> If yes, what else is on that carbonyl carbon?</p>' +
            '<div class="radical-sort">' +
            CASES.map(function(c){
              return '<div class="radical-row" data-case="' + c.id + '">' +
                '<div class="radical-eq" style="font-family:var(--font-ui);font-size:15px;font-weight:700;">' + c.t + '</div>' +
                '<div class="radical-choices" role="group" aria-label="Which functional group">' +
                OPTS.map(function(o){
                  return '<button type="button" class="choice-btn sm" data-case="' + c.id + '" data-o="' + o.k + '">' + o.l + '</button>';
                }).join('') + '</div><div class="radical-why" data-why="' + c.id + '"></div></div>';
            }).join('') +
            '</div>' + api.feedbackHtml('fb') + api.nextButtonHtml('Continue', false);
          var fb = api.card.querySelector('#fb'), next = api.card.querySelector('#nextBtn');
          var done = {}, missed = false;
          api.card.querySelectorAll('.radical-choices .choice-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
              var id = btn.getAttribute('data-case');
              if(done[id]) return;
              var cfg = CASES.filter(function(c){ return c.id === id; })[0];
              if(btn.getAttribute('data-o') !== cfg.right){
                missed = true; btn.classList.add('wrong'); btn.disabled = true;
                api.showFeedback(fb, false, 'Is there a C=O? If not, an O between carbons is an ether. If there is, read the atom on the other side of the carbonyl: O–carbon means ester, N means amide, carbon means ketone.');
                return;
              }
              done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });
              api.card.querySelector('[data-why="' + id + '"]').innerHTML = cfg.why;
              if(Object.keys(done).length === CASES.length){
                api.showFeedback(fb, true, missed
                  ? 'All six. The ones that catch people are HCOOCH₃, which has an aldehyde-looking H but an O–carbon that makes it an ester, and the two amides, where the NH₂ or N(CH₃)₂ is on a carbonyl and so is not an amine.'
                  : 'All six, first time — including methyl formate, which most people call an aldehyde on first sight.');
                api.record(!missed); next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: '(CH<sub>3</sub>)<sub>3</sub>C&ndash;NH<sub>2</sub>, tert-butylamine. How is the amine classified?',
        options: [
          'Tertiary, because the carbon carrying the N has three carbon neighbors',
          'Quaternary, because four groups surround that carbon',
          'Primary, because the nitrogen is bonded to one carbon',
          'Secondary, because two of the methyls count'
        ],
        correctIndex: 2,
        correctFeedback: 'Correct. An amine takes its degree from the nitrogen: one carbon on N, so primary. The tert-butyl carbon is tertiary, and if this were (CH<sub>3</sub>)<sub>3</sub>C–OH it would be a tertiary alcohol, because an alcohol takes its degree from the carbon. Same carbon, two rules, and this molecule is the standard way of testing whether you know both.',
        wrongFeedback: 'Which atom do you count around for an amine? Not the carbon. Count the carbons bonded directly to the nitrogen.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Which of these molecules contains an amide?',
        options: [
          'CH<sub>3</sub>CH<sub>2</sub>NHCH<sub>3</sub>',
          'CH<sub>3</sub>CONHCH<sub>3</sub>',
          'CH<sub>3</sub>CH<sub>2</sub>C&#8801;N',
          'CH<sub>3</sub>COOCH<sub>3</sub>'
        ],
        correctIndex: 1,
        correctFeedback: 'Correct. The nitrogen in CH<sub>3</sub>CONHCH<sub>3</sub> is bonded to a C=O, which is the definition. CH<sub>3</sub>CH<sub>2</sub>NHCH<sub>3</sub> has a nitrogen with no carbonyl anywhere, so it is a secondary amine; CH<sub>3</sub>CH<sub>2</sub>C&#8801;N is a nitrile, a carbon triple-bonded to nitrogen; and CH<sub>3</sub>COOCH<sub>3</sub> has no nitrogen at all and is an ester.',
        wrongFeedback: 'Three of the four contain nitrogen. Only one of those nitrogens is attached to a C=O. Find the CO written right before the N.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Polarity already tells you where each group will react.',
        bodyHtml: '<p class="step-body">Put the electronegativity numbers from earlier in this chapter against the groups and a pattern appears. <b>C&ndash;O</b> (2.55 against 3.44) makes the carbon δ+ and the oxygen δ&minus;, with two lone pairs besides; a <b>C=O</b> doubles that pull, so the carbonyl carbon is the most electron-poor carbon in any group. <b>C&ndash;N</b> is more weakly polar, and an amine acts mostly through its lone pair. <b>C&ndash;Cl</b> and <b>C&ndash;Br</b> leave the carbon δ+ while the halogen keeps its lone pairs to itself. <b>C=C</b> is not polar at all, but its π electrons sit exposed above and below the plane, which is a different way of being available.</p>' +
          '<p class="step-body">So every group has an <b>electron-rich</b> site (a lone pair, a π bond, a δ&minus; atom), an <b>electron-poor</b> site (a δ+ carbon), or both. Alkanes have neither, which is why they are the spectators.</p>' +
          '<div class="explain-box">A labeled preview, not a lesson: <a class=\"chapter-ref\" href=\"/ochem/learn.html#m-electron-movement\">Organic Structure &amp; Electron Movement</a> will call the electron-rich sites <b>nucleophiles</b> and the electron-poor ones <b>electrophiles</b>, and nearly every reaction in the course is one finding the other. You are not being asked to know any reaction yet. You are being shown that, from electronegativity alone, you can already point at where on each group it will happen.</div>'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 7 · Independent Practice',
        title: 'Aspirin is HOOC&ndash;C<sub>6</sub>H<sub>4</sub>&ndash;O&ndash;CO&ndash;CH<sub>3</sub>. Which functional groups does it contain?',
        options: [
          'Carboxylic acid, ether and ketone',
          'Carboxylic acid, alcohol and aromatic ring',
          'Ester, ketone and alkene',
          'Carboxylic acid, ester and aromatic ring'
        ],
        correctIndex: 3,
        correctFeedback: 'Correct. HOOC– is a C=O with OH on it, a carboxylic acid. C<sub>6</sub>H<sub>4</sub> with two substituents is a benzene ring. And –O–CO–CH<sub>3</sub> has to be read slowly: the C=O has CH<sub>3</sub> on one side and O–carbon (the ring) on the other, which is an ester. It is not an ether, because that oxygen sits beside a carbonyl, and the carbonyl is not a ketone, because one of its neighbors is oxygen. Calling that oxygen an ether and that carbonyl a ketone is the classic double miss.',
        wrongFeedback: 'Take the –O–CO–CH<sub>3</sub> piece on its own. There is a C=O in it; what are the two things attached to that carbon?'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Acetaminophen is HO&ndash;C<sub>6</sub>H<sub>4</sub>&ndash;NH&ndash;CO&ndash;CH<sub>3</sub>. A student lists its groups as "alcohol, amine, ketone". What is the correct list?',
        options: [
          'Phenol and amide, on an aromatic ring',
          'Alcohol and amide, on an aromatic ring',
          'Phenol, amine and ketone',
          'Alcohol, amine and ester'
        ],
        correctIndex: 0,
        correctFeedback: 'Correct, and the student found every atom and named all three groups wrongly, which is why this molecule is an exam favorite. The OH is directly on an aromatic carbon, so it is a phenol, not an alcohol, and a million times more acidic for it. The nitrogen is bonded to a C=O, so it is an amide, not an amine. And that C=O has N on one side, so it is not a ketone; it is the amide\'s carbonyl. Two groups on a ring. Aspirin, ibuprofen and acetaminophen are all painkillers that share the ring, and what distinguishes them is the ester (aspirin), the acid (ibuprofen) and the amide (acetaminophen), which is the whole point of learning to read groups.'
      }
    ]
  });

})();
});
</script>
