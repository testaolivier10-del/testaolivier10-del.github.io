document.addEventListener('DOMContentLoaded', function(){
(function(){

  var CASES = [
    { id:'g1', t:'CH<sub>3</sub>OCH<sub>2</sub>CH<sub>3</sub>', right:'ether',
      why:'An oxygen with a carbon on each side and no C=O anywhere near it. Ether. The moment you see an O between two carbons, check both neighbors for a carbonyl before you commit; here there is none.' },
    { id:'g2', t:'CH<sub>3</sub>COCH<sub>3</sub>', right:'ketone',
      why:'The middle carbon carries the C=O, and its two neighbors are both carbons. Ketone; this is acetone. The CO in the middle of a condensed formula, with carbon on both sides, is the ketone signature.' },
    { id:'g3', t:'CH<sub>3</sub>COOCH<sub>2</sub>CH<sub>3</sub>', right:'ester',
      why:'A C=O with CH<sub>3</sub> on one side and O&ndash;CH<sub>2</sub>CH<sub>3</sub> on the other. Carbon on one side, O&ndash;carbon on the other: ester (ethyl acetate). The two oxygens together, COO followed by a carbon, are what to look for.' },
    { id:'g4', t:'CH<sub>3</sub>CH<sub>2</sub>CONH<sub>2</sub>', right:'amide',
      why:'A C=O with a nitrogen attached. Amide. It is the N-on-the-carbonyl that decides it; the NH<sub>2</sub> alone would be an amine, but this NH<sub>2</sub> sits on a C=O.' },
    { id:'g5', t:'HCOOCH<sub>3</sub>', right:'ester',
      why:'The carbonyl carbon has H on one side, which looks like an aldehyde, and O&ndash;CH<sub>3</sub> on the other, which is what an ester has. The oxygen wins: an O&ndash;carbon on the carbonyl makes it an ester whatever else is attached. This is methyl formate. Aldehydes have H and a carbon (or a second H), never an O.' },
    { id:'g6', t:'CH<sub>3</sub>CON(CH<sub>3</sub>)<sub>2</sub>', right:'amide',
      why:'Nitrogen on a C=O, so an amide, and with two methyls on the nitrogen it is a tertiary amide. The extra carbons on N change the name, not the group.' }
  ];
  var OPTS = [ { k:'ester', l:'Ester' }, { k:'ether', l:'Ether' }, { k:'amide', l:'Amide' }, { k:'ketone', l:'Ketone' } ];

  window.OchemLessonEngine.start({
    topicId: 'functional-groups',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The group does the chemistry. The rest of the molecule watches.',
        bodyHtml: '<p class="step-body">Ethanol has an O&ndash;H on a two-carbon chain. Cholesterol has an O&ndash;H on a steroid of twenty-seven carbons. Both O&ndash;H groups do the same reactions with the same reagents.</p>' +
          '<p class="step-body">That is a <b>functional group</b>: a small arrangement of atoms that behaves the same way on every molecule it sits on. So organic chemistry is organized around a few dozen groups rather than tens of millions of compounds, and each of the chapters ahead is named after one.</p>' +
          '<p class="step-body">Why is the rest of the molecule a <b>spectator</b>, present but taking no part? Because of the previous lesson. C&ndash;C joins two atoms of the same electronegativity, and C&ndash;H (2.55 against 2.20) is close enough. Neither bond has a δ+ end worth attacking, and neither atom has a lone pair to attack with. A functional group is the part where that is not true: a polar bond to O, N or a halogen, a lone pair, or a π bond whose electrons sit exposed above and below the plane.</p>' +
          '<div class="explain-box">To read a structure, look for anything that is not C&ndash;C or C&ndash;H: an O, an N, a halogen, an S, or a double or triple bond. Each one you find is a functional group, and for the rest of the course those are the only parts you will be asked about.</div>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Seven groups share a C=O. Read what is attached to it.',
        bodyHtml: '<p class="step-body">The groups most often confused are the ones built around a <b>carbonyl</b>, a carbon double-bonded to oxygen. Telling them apart is mechanical. Find the C=O, then read the other two things attached to its carbon. One is usually a carbon or a hydrogen. The other one names the group.</p>' +
          '<ul class="step-body">' +
          '<li><b>H</b> &rarr; aldehyde, RCHO</li>' +
          '<li><b>carbon on both sides</b> &rarr; ketone, RCOR&prime;</li>' +
          '<li><b>OH</b> &rarr; carboxylic acid, RCOOH</li>' +
          '<li><b>O&ndash;carbon</b> &rarr; ester, RCOOR&prime;</li>' +
          '<li><b>N</b> &rarr; amide, RCONH<sub>2</sub>, RCONHR&prime;, RCONR&prime;<sub>2</sub></li>' +
          '<li><b>Cl</b> &rarr; acid chloride, RCOCl</li>' +
          '<li><b>O that leads to a second C=O</b> &rarr; anhydride, RCO&ndash;O&ndash;COR</li>' +
          '</ul>' +

        diagramHtml: '<!-- fig:carbonyl-family-gallery:start --><figure class="notes-figure notes-figure--wide" style="--vb:760"><svg viewBox="0 0 760 500" role="img" aria-label="Seven small panels, each showing a carbon double-bonded to an oxygen with the carbon marked delta plus and the oxygen delta minus. The carbon carries an R group on the left and, highlighted on the right, the atom that names the group: H for aldehyde, a second R for ketone, OH for carboxylic acid, OR for ester, NH2 for amide, Cl for acid chloride, and an oxygen bridging to a second C=O for anhydride."><rect class="fg-panel" x="20" y="16" width="170" height="196" rx="10"></rect><text class="fg-lbl" x="105" y="40" text-anchor="middle" font-size="12.5">Aldehyde</text><line class="fg-bond" x1="101" y1="100" x2="101" y2="77"></line><line class="fg-bond" x1="109" y1="100" x2="109" y2="77"></line><line class="fg-bond" x1="91.94" y1="125.25" x2="69.24" y2="141.33"></line><line class="fg-bond" x1="118.06" y1="125.25" x2="139.94" y2="140.75"></line><circle class="fg-atom" cx="105" cy="62" r="15"></circle><text class="fg-lbl" x="105" y="66.44" text-anchor="middle" font-size="12">O</text><circle class="fg-lp" cx="88.2" cy="47.1" r="2.3"></circle><circle class="fg-lp" cx="83.7" cy="54.9" r="2.3"></circle><circle class="fg-lp" cx="126.3" cy="54.9" r="2.3"></circle><circle class="fg-lp" cx="121.8" cy="47.1" r="2.3"></circle><circle class="fg-atom" cx="57" cy="150" r="15"></circle><text class="fg-lbl" x="57" y="154.44" text-anchor="middle" font-size="12">R</text><circle class="fg-atom-warn" cx="153" cy="150" r="16"></circle><text class="fg-lbl" x="153" y="154.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom-hi" cx="105" cy="116" r="16"></circle><text class="fg-lbl" x="105" y="120.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="128" y="108" text-anchor="middle" font-size="11">δ+</text><text class="fg-hi" x="143" y="66" text-anchor="middle" font-size="11">δ−</text><text class="fg-tag-good" x="105" y="194" text-anchor="middle" font-size="10.5">attached: H</text><rect class="fg-panel" x="202" y="16" width="170" height="196" rx="10"></rect><text class="fg-lbl" x="287" y="40" text-anchor="middle" font-size="12.5">Ketone</text><line class="fg-bond" x1="283" y1="100" x2="283" y2="77"></line><line class="fg-bond" x1="291" y1="100" x2="291" y2="77"></line><line class="fg-bond" x1="273.94" y1="125.25" x2="251.24" y2="141.33"></line><line class="fg-bond" x1="300.06" y1="125.25" x2="321.94" y2="140.75"></line><circle class="fg-atom" cx="287" cy="62" r="15"></circle><text class="fg-lbl" x="287" y="66.44" text-anchor="middle" font-size="12">O</text><circle class="fg-lp" cx="270.2" cy="47.1" r="2.3"></circle><circle class="fg-lp" cx="265.7" cy="54.9" r="2.3"></circle><circle class="fg-lp" cx="308.3" cy="54.9" r="2.3"></circle><circle class="fg-lp" cx="303.8" cy="47.1" r="2.3"></circle><circle class="fg-atom" cx="239" cy="150" r="15"></circle><text class="fg-lbl" x="239" y="154.44" text-anchor="middle" font-size="12">R</text><circle class="fg-atom-warn" cx="335" cy="150" r="16"></circle><text class="fg-lbl" x="335" y="153.89" text-anchor="middle" font-size="10.5">R′</text><circle class="fg-atom-hi" cx="287" cy="116" r="16"></circle><text class="fg-lbl" x="287" y="120.44" text-anchor="middle" font-size="12">C</text><text class="fg-warn" x="310" y="108" text-anchor="middle" font-size="11">δ+</text><text class="fg-hi" x="325" y="66" text-anchor="middle" font-size="11">δ−</text><text class="fg-tag-good" x="287" y="194" text-anchor="middle" font-size="10.5">attached: a second carbon</text><rect class="fg-panel" x="384" y="16" width="170" height="196" rx="10"></rect><text class="fg-lbl" x="469" y="40" text-anchor="middle" font-size="12.5">Carboxylic acid</text><line class="fg-bond" x1="465" y1="100" x2="465" y2="77"></line><line class="fg-bond" x1="473" y1="100" x2="473" y2="77"></line><line class="fg-bond" x1="455.94" y1="125.25" x2="433.24" y               done[id] = true; btn.classList.add('correct');
              api.card.querySelectorAll('.choice-btn[data-case="' + id + '"]').forEach(function(b){ b.disabled = true; });

      {

        title: 'Polarity already tells you where each group will react.',
        bodyHtml: '<p class="step-body">Put the electronegativity numbers from earlier in this chapter against the groups and a pattern appears. <b>C&ndash;O</b> (2.55 against 3.44) makes the carbon δ+ and the oxygen δ&minus;, and the oxygen has two lone pairs besides. A <b>C=O</b> doubles that pull, so the carbonyl carbon is the most electron-poor carbon in any group.</p>' +
          '<p class="step-body"><b>C&ndash;N</b> is more weakly polar, and an amine acts mostly through its lone pair. <b>C&ndash;Cl</b> and <b>C&ndash;Br</b> leave the carbon δ+ while the halogen keeps its lone pairs to itself. <b>C=C</b> is not polar at all, but its π electrons sit exposed above and below the plane, which is a different way of being available.</p>' +
          '<p class="step-body">So every group has an <b>electron-rich</b> site (a lone pair, a π bond, a δ&minus; atom), an <b>electron-poor</b> site (a δ+ carbon), or both. Alkanes have neither, which is why they are the spectators.</p>' +
