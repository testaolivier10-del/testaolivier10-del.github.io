<script>
(function(){
  function acetateSvg(highlightLeft, highlightRight){
    return '<div class="scene"><svg viewBox="0 0 260 120">' +
      '<text x="20" y="65" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="16" fill="var(--ink)">CH₃</text>' +
      '<line x1="70" y1="60" x2="110" y2="60" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="130" cy="60" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14">C</text>' +
      '<line x1="145" y1="48" x2="175" y2="25" stroke="var(--line)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="o1"><circle cx="190" cy="18" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="190" y="23" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">O</text></g>' +
      '<line x1="145" y1="72" x2="175" y2="95" stroke="var(--line)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="o2"><circle cx="190" cy="102" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="190" y="107" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">O</text></g>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'resonance',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The real molecule isn\'t "flipping" between structures.',
        bodyHtml: '<p class="step-body">Some molecules and ions can\'t be captured by a single Lewis structure. When you can draw two or more valid structures that differ <b>only in where the electrons are</b> — never in where the atoms are — those are <b>resonance structures</b>.</p><p class="step-body" style="margin-bottom:0;">The real molecule is a single <b>hybrid</b>: a blend of all the valid resonance structures, not a molecule bouncing back and forth between them. Curved arrows are what you use to get from one resonance structure to the next — you\'ll practice those in the next lesson.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click both oxygens in the acetate ion.</h2>' +
            '<p class="step-body">Acetate (CH₃COO⁻) has two resonance structures: one with the negative charge on the top oxygen, one with it on the bottom oxygen. Because both oxygens are identical, both structures are equally valid.</p>' +
            acetateSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Oxygens clicked: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var clicked = {};
          var count = 0;
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(clicked[key]) return;
              clicked[key] = true;
              count++;
              g.classList.add('chosen');
              hint.textContent = 'Oxygens clicked: ' + count + ' / 2';
              if(count === 2){
                api.showFeedback(fb, true, 'Right — because the two oxygens are equivalent by symmetry, the real ion has the negative charge (and the extra bond order) spread evenly across both. Experimentally, both C–O bonds in acetate are the same length, in between a single and a double bond.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 2 · Guided Practice',
        title: 'Which of these is required for two structures to be true resonance structures of each other?',
        options: ['Only the electrons move — no atom changes position', 'Atoms are allowed to shift slightly between the two', 'One structure must be thrown out because the other is more stable'],
        correctIndex: 0,
        correctFeedback: 'Correct — resonance structures are the same molecule, same atom positions, different electron placement.',
        wrongFeedback: 'If an atom moved, you\'d have a different molecule (or isomer), not a resonance structure.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 3 · Independent Practice',
        title: 'Between acetate\'s two resonance structures (charge on the top O vs. the bottom O), is one the "major" contributor?',
        options: ['Yes — one is major and the other barely matters', 'No — they\'re equivalent, so both contribute equally to the hybrid', 'It depends on the solvent'],
        correctIndex: 1,
        correctFeedback: 'Correct. When resonance structures are related by symmetry like this, they contribute equally — there\'s no "major" one.',
        wrongFeedback: 'Look again at the two oxygens — they\'re chemically identical, so neither structure is more stable than the other.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Resonance is why some molecules are far more stable — or acidic — than you\'d expect.',
        bodyHtml: '<div class="explain-box">Spreading a charge out over resonance structures <b>stabilizes</b> it. That\'s the real reason carboxylic acids are so much more acidic than alcohols: the anion left behind after deprotonation is resonance-stabilized like the acetate you just saw. It\'s also why aromatic rings are unusually stable, and why enolates (coming up in Module 11) are useful nucleophiles. You\'ll use this idea constantly.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Two valid resonance structures place a negative charge on different atoms: one on carbon, one on oxygen. Which is the major contributor?',
        options: ['The one with the negative charge on carbon', 'The one with the negative charge on oxygen', 'They contribute equally either way'],
        correctIndex: 1,
        correctFeedback: 'Correct — a more electronegative atom stabilizes negative charge better, so the structure with the charge on oxygen contributes more to the real hybrid. When resonance structures aren\'t equivalent, the more stable one dominates.'
      }
    ]
  });
})();
</script>
<script>
  var toggle = document.getElementById('themeToggle');
  toggle.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); }
    else{ document.documentElement.setAttribute('data-theme', 'dark'); }
    try{ localStorage.setItem('nremt_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });
</script>
