<script>
(function(){
  function acetateSvg(highlightLeft, highlightRight){
    return '<div class="scene"><svg viewBox="0 0 260 120">' +
      '<text x="20" y="65" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="16" fill="var(--ink)">CH₃</text>' +
      '<line x1="70" y1="60" x2="110" y2="60" stroke="var(--line)" stroke-width="2.5"/>' +
      '<circle cx="130" cy="60" r="17" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="130" y="66" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="14">C</text>' +
      '<line x1="145" y1="48" x2="175" y2="25" stroke="var(--line)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="o1"><circle cx="190" cy="18" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="190" y="23" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">O</text></g>' +
      '<line x1="145" y1="72" x2="175" y2="95" stroke="var(--line)" stroke-width="2.5"/>' +
      '<g class="atom" data-key="o2"><circle cx="190" cy="102" r="16" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text x="190" y="107" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13">O</text></g>' +
    '</svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'resonance',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    notesHtml: '<h3>The problem one Lewis structure can\'t solve</h3><p class="step-body">Draw acetate (CH₃COO⁻) the ordinary way and you get one C=O double bond and one C–O⁻ single bond. That drawing makes two claims you can go and measure: the two oxygens are different from each other, and the two C–O bonds are different lengths (a C=O runs about 1.20 Å, a C–O⁻ single bond about 1.34 Å — an ångström, Å, being the unit bond lengths come in, where a bigger number means a longer bond). Both claims are false. In real acetate the two oxygens are indistinguishable, each C–O bond is the same 1.26 Å — in between the two — and each oxygen carries half the negative charge. You can draw a second structure, just as legal, with the double bond going to the <i>other</i> oxygen. Neither one is right on its own. Structures like these, differing <b>only in where the electrons sit</b> and never in where the atoms sit, are <b>resonance structures</b>.</p>' +
      '<h3>Why electrons can spread out: orbitals have to touch</h3><p class="step-body">A Lewis structure pins every pair of electrons to one place — between two atoms, or on one atom. That is a convenient fiction. An electron pair really occupies an <b>orbital</b>, a region of space, and if that region happens to stretch over three atoms instead of two, the pair is genuinely spread over all three. That spreading is <b>delocalization</b>.</p><p class="step-body">What limits it is geometry. Pi bonds and delocalizable lone pairs live in <b>p orbitals</b> — dumbbell-shaped, one lobe above the plane of the molecule and one below. Two p orbitals merge into a single continuous region only when they sit on <b>neighboring atoms</b> and point the same way, so their lobes are already touching. Orbital overlap dies off fast with distance: one atom further away it is effectively zero. Nothing reaches across a gap. That is the entire reason resonance needs adjacency — it is not a rule someone imposed, it is what overlap physically allows.</p><p class="step-body">In acetate, the negative oxygen\'s lone pair sits in a p orbital, and the atom next door is the C=O carbon, whose p orbital is already busy holding that C=O pi bond. Neighbors, parallel, touching — so the lobes merge into one cloud running the length of O–C–O. In ethoxide (CH₃CH₂O⁻) the negative oxygen\'s neighbor is an sp³ carbon, which has no leftover p orbital at all; its four orbitals are spent on single bonds. The chain dead-ends, the charge stays put on that one oxygen, and there is no second structure to draw. A run of atoms whose p orbitals do line up in a row like acetate\'s is called <b>conjugated</b>. Conjugation is the physical situation; resonance structures are the bookkeeping you draw to describe it.</p>' +
      '<h3>The hybrid</h3><p class="step-body">None of the structures you draw is the molecule. The real molecule is one single unchanging thing — the <b>hybrid</b> — and the structures are partial sketches of it that you average together. A rhinoceros is not a unicorn on Mondays and a dragon on Fridays; it is one animal, and unicorn-plus-dragon is the best you could do if those were the only two shapes you were allowed to draw. Average acetate\'s two structures and each C–O bond comes out halfway between a single and a double bond, and each oxygen carries half of the negative charge — exactly what the 1.26 Å measurement says. The double-headed arrow ↔ between structures means "two pictures of one thing." It is deliberately a different symbol from the equilibrium arrow ⇌, which really does mean two things interconverting.</p>' +
      '<h3>Why spreading electrons out lowers the energy</h3><p class="step-body">Two reasons, and they stack. <b>Like charges repel</b>, so packing a whole negative charge onto one small atom crams all that electron density against itself; spreading it over two atoms gives each one half, further apart, pushing against itself much less. And <b>confined electrons are high-energy electrons</b> — electrons behave like waves, and a wave squeezed into a small space costs more energy than the same wave with more room, the way a short guitar string plays a higher note than a long one. The second reason needs no charge at all, which is why delocalization stabilizes neutral molecules too. "Resonance-stabilized" means exactly this and nothing more.</p>' +
      '<div class="notes-fact">An acid gives up an H⁺ and keeps the bonding electrons, so what\'s left behind is negative — and how willingly the H⁺ leaves depends on how comfortable those leftovers are. Acetic acid (vinegar) leaves acetate, charge spread over two oxygens. Ethanol leaves ethoxide, charge stuck on one oxygen with no adjacent p orbital to spread into. Result: acetic acid gives up its hydrogen about a hundred billion times more readily. Module 3 puts a scale on this (pKa).</div>' +
      '<h3>"Not equal" means not an equal share of the hybrid</h3><p class="step-body">Since the hybrid is a weighted average of the structures, each structure has a <b>weight</b> — how big a share of the real electron distribution that picture accounts for. That is the thing being compared when structures are called equal or unequal. Acetate\'s two are identical apart from which oxygen you drew, so they split 50/50. When structures are <i>not</i> identical, the weights differ, and the heaviest one is the <b>major contributor</b>: the picture the real molecule most resembles.</p><p class="step-body">One rule sets the weights: <b>the lower a structure\'s energy, the bigger its share.</b> The familiar checklist is just the list of ways a structure gains or loses energy, roughly in order of how much they matter:</p><ul class="step-body" style="margin-top:0;"><li><b>Complete octets.</b> An atom short of an octet has room in its valence shell that electrons aren\'t filling — energy left on the table. Usually the most expensive flaw a structure can have.</li><li><b>Fewer, smaller formal charges.</b> Making a + and a − where there was neither means pulling opposite charges apart, and they attract, so it costs energy. All-neutral beats +1/−1, which beats +2/−2.</li><li><b>Negative charge on the more electronegative atom.</b> Electronegativity just <i>is</i> how tightly a nucleus holds onto electrons, so oxygen holds the extra electrons of a negative charge at lower energy than carbon does. Positive charge goes the other way — onto the less electronegative atom.</li><li><b>No like charges on adjacent atoms.</b> Two negatives (or two positives) side by side repel hard, at close range. Very high energy, so very small share.</li><li><b>More bonds, less charge separation</b>, when everything else is close — each extra bond is a pair of electrons being stabilized by two nuclei rather than one.</li></ul><p class="step-body">Every legal structure gets <i>some</i> share; minor contributors still pull the real distribution toward themselves, just less. An <b>illegal</b> structure is different and gets no share at all: one that moves an atom, changes the total electron count, or puts more than eight electrons on a second-row atom isn\'t a low-weight contributor, it\'s simply not a structure of this molecule.</p>',
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'One Lewis structure can make a prediction that\'s measurably wrong.',
        bodyHtml: '<p class="step-body">Draw the acetate ion (CH₃COO⁻) the ordinary way and you get one C=O double bond and one C–O⁻ single bond. That drawing quietly makes two claims you can go and check in a lab: the two oxygens are different from each other, and the two C–O bonds are different lengths — a C=O runs about 1.20 Å, a C–O⁻ single bond about 1.34 Å. (An ångström, Å, is just the unit bond lengths come in; all you need from it here is that a bigger number means a longer bond.)</p>' +
          '<p class="step-body">Both claims are false. The two oxygens in acetate are indistinguishable. Both C–O bonds measure the same <b>1.26 Å</b> — sitting in between a single and a double bond — and each oxygen carries half of the negative charge.</p>' +
          '<p class="step-body" style="margin-bottom:0;">So the drawing isn\'t slightly off; it describes a molecule that doesn\'t exist. And notice you could just as legally have drawn the double bond to the <i>other</i> oxygen. Two drawings, equally valid, differing <b>only in where the electrons sit</b> — never in where the atoms sit. Those are <b>resonance structures</b>, and the rest of this lesson is about what the real molecule is doing instead.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Why electrons can spread out at all: orbitals have to be touching.',
        bodyHtml: '<p class="step-body">A Lewis structure pins each pair of electrons to one spot — between two atoms, or parked on one atom as a lone pair. That\'s a convenient fiction. An electron pair actually occupies an <b>orbital</b>, which is a region of space, and if that region stretches over three atoms instead of two, then the pair really is spread across all three. That spreading is what <b>delocalization</b> means.</p>' +
          '<p class="step-body">What limits it is plain geometry. The orbitals that hold pi bonds and delocalizable lone pairs are <b>p orbitals</b>: dumbbell-shaped, one lobe above the plane of the molecule and one below. Two p orbitals merge into one continuous region only when they sit on <b>neighboring atoms</b> and point the same direction, so their lobes are already touching. Overlap falls off steeply with distance — one atom further away, it\'s essentially nothing. Electrons can\'t reach across a gap.</p>' +
          '<p class="step-body"><b>That is the whole reason for the adjacency requirement.</b> It isn\'t a rule someone imposed on you; it\'s the only arrangement where there\'s a shared region to spread into. Compare the two cases:</p>' +
          '<ul class="step-body" style="margin-top:0;">' +
          '<li><b>Acetate works.</b> The negative oxygen\'s lone pair is in a p orbital. Its neighbor is the C=O carbon, whose own p orbital is already holding that C=O pi bond. Neighbors, parallel, lobes touching — they merge into a single cloud running the whole length of O–C–O, and the electrons spread over all three atoms.</li>' +
          '<li><b>Ethoxide (CH₃CH₂O⁻) doesn\'t.</b> Here the negative oxygen\'s neighbor is an sp³ carbon, which has no leftover p orbital — all four of its orbitals are spent on single bonds to H and C. There is nothing adjacent for the lone pair to overlap with. The charge stays put on that one oxygen, and there is no second structure to draw.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">A run of atoms whose p orbitals line up in a row, like acetate\'s, is called <b>conjugated</b>. On paper you spot it by looking for a lone pair, negative charge, pi bond, or empty orbital <i>directly bonded</i> to another pi bond or empty p orbital, with no sp³ atom interrupting. Conjugation is the physical situation; resonance structures are the bookkeeping you draw to describe it.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The hybrid: one molecule, averaged from several sketches.',
        bodyHtml: '<p class="step-body">Here is the part that\'s easy to picture wrongly. The real molecule is <b>not</b> flipping back and forth between the structures you drew — there is no instant at which acetate has a genuine double bond to the top oxygen. The real molecule is one single unchanging thing called the <b>hybrid</b>, and your structures are partial sketches that you average together to describe it.</p>' +
          '<p class="step-body">The old analogy is a good one: a rhinoceros is not a unicorn on Mondays and a dragon on Fridays. It\'s one animal. "Unicorn plus dragon" is just the best description you could give if those were the only two shapes you were allowed to draw.</p>' +
          '<p class="step-body">The averaging is literal, and it\'s checkable. Average acetate\'s two structures — each C–O is a double bond in one sketch and a single bond in the other — and every C–O comes out <b>halfway between a single and a double bond</b>, with each oxygen carrying <b>half</b> of the negative charge. That is exactly what the measured 1.26 Å bond length says: shorter than a single bond, longer than a double.</p>' +
          '<p class="step-body" style="margin-bottom:0;">This is why resonance structures are joined by a double-headed arrow <b>↔</b>, meaning "two pictures of one thing," and deliberately never by the equilibrium arrow <b>⇌</b>, which does mean two separate things interconverting. Curved arrows are the tool for getting from one sketch to the next — you\'ll practice drawing those in the next lesson.</p>'
      },
      {
        render: function(api){
          api.card.innerHTML =
            '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
            '<h2 class="step-title">Click both oxygens in the acetate ion.</h2>' +
            '<p class="step-body">Acetate (CH₃COO⁻) has two resonance structures: one with the negative charge on the top oxygen, one with it on the bottom oxygen. The two oxygens are identical, so neither sketch has any claim to being the real one.</p>' +
            acetateSvg() +
            '<div class="count-hint" id="hint" style="font:900 13px var(--font-mono);color:var(--accent);text-align:center;margin-bottom:16px;">Oxygens clicked: 0 / 2</div>' +
            api.feedbackHtml('fb') +
            api.nextButtonHtml('Continue', false);
          var hint = api.card.querySelector('#hint');
          var fb = api.card.querySelector('#fb');
          var next = api.card.querySelector('#nextBtn');
          var clicked = {};
          var count = 0;
          api.card.querySelectorAll('.atom').forEach(function(g){
            g.addEventListener('click', function(){
              var key = g.getAttribute('data-key');
              if(clicked[key]) return;
              clicked[key] = true;
              count++;
              g.classList.add('chosen');
              hint.textContent = 'Oxygens clicked: ' + count + ' / 2';
              if(count === 2){
                api.showFeedback(fb, true, 'Right. The two oxygens are interchangeable — same element, same neighbor, same surroundings — so nothing makes either sketch the better one. Average them and each oxygen ends up carrying half of the negative charge, and each C–O bond ends up halfway between a single and a double bond. That is exactly what the measured 1.26 Å says.');
                next.disabled = false;
              }
            });
          });
          next.addEventListener('click', api.advance);
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Step 4 · Guided Practice',
        title: 'Which of these is required for two structures to be true resonance structures of each other?',
        options: ['Only the electrons move — no atom changes position', 'Atoms are allowed to shift slightly between the two', 'One structure must be thrown out because the other is more stable'],
        correctIndex: 0,
        correctFeedback: 'Correct — resonance structures are the same molecule, same atom positions, different electron placement.',
        wrongFeedback: 'If an atom moved, you\'d have a different molecule (or an isomer) — two things that could interconvert, not two sketches of one thing.'
      },
      {
        type: 'mcq',
        eyebrow: 'Step 5 · Independent Practice',
        title: 'Between acetate\'s two resonance structures (charge on the top O vs. the bottom O), is one the "major" contributor?',
        options: ['Yes — one is major and the other barely matters', 'No — they\'re equivalent, so both contribute equally to the hybrid', 'It depends on the solvent'],
        correctIndex: 1,
        correctFeedback: 'Correct. The two structures are identical apart from which oxygen you drew, so they have identical energies and split the hybrid 50/50 — no major contributor here.',
        wrongFeedback: 'Look again at the two oxygens — chemically identical, so the two sketches have the same energy, and nothing makes one a better description than the other.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: '"Not all equal" means: not an equal share of the hybrid.',
        bodyHtml: '<p class="step-body">Acetate\'s two structures were equal — but equal in <i>what</i>? Here\'s the axis. Since the hybrid is an average of the structures, each structure has a <b>weight</b>: how big a share of the real electron distribution that sketch accounts for, or equivalently, how much the real molecule looks like that picture. That weight is the thing being compared whenever structures are called equal or unequal.</p>' +
          '<p class="step-body">Acetate\'s two sketches are identical apart from which oxygen you drew, so they carry identical weight — 50/50. When structures are <i>not</i> identical, their weights differ, and the heaviest one is called the <b>major contributor</b>.</p>' +
          '<p class="step-body">One principle sets every weight: <b>the lower a structure\'s energy, the bigger its share of the hybrid.</b> ("Lower energy" and "more stable" are the same statement in chemistry — a lower-energy arrangement is one the electrons settle into and stay in, so the real molecule spends more of itself looking like that picture.) The checklist below isn\'t five separate rules to memorize — it\'s just the list of ways a sketch can gain or lose energy, ordered roughly by how much each one costs:</p>' +
          '<ul class="step-body" style="margin-top:0;">' +
          '<li><b>Complete octets.</b> An atom short of an octet has room in its valence shell that no electrons are filling — stabilization it could have had and doesn\'t. Usually the most expensive flaw, so this criterion wins over the others.</li>' +
          '<li><b>Fewer and smaller formal charges.</b> Creating a + and a − where there was neither means pulling two opposite charges apart, and opposite charges attract, so that separation costs energy. Neutral beats +1/−1, which beats +2/−2.</li>' +
          '<li><b>Negative charge on the more electronegative atom.</b> Electronegativity just <i>is</i> a measure of how tightly a nucleus holds onto electrons — so oxygen holds the extra electrons of a negative charge at lower energy than carbon does. Positive charge goes the other way, onto the less electronegative atom.</li>' +
          '<li><b>No like charges on adjacent atoms.</b> Two negatives (or two positives) sitting one bond apart repel hard at that range. Very high energy, so a very small share.</li>' +
          '<li><b>More bonds, less charge separation</b>, when the structures are otherwise close — each extra bond is a pair of electrons getting stabilized by two nuclei instead of one.</li>' +
          '</ul>' +
          '<p class="step-body" style="margin-bottom:0;">Two things worth keeping straight. Every <i>legal</i> structure gets some share, so a minor contributor still pulls the real spread of electrons toward itself — just less than the major one does. But an <i>illegal</i> structure gets no share at all: if it moves an atom, changes the total electron count, or puts more than eight electrons on a second-row atom, it isn\'t a low-weight contributor, it simply isn\'t a structure of this molecule.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Why spreading electrons out actually lowers the energy.',
        bodyHtml: '<p class="step-body">Textbooks say delocalization "stabilizes" a molecule and usually leave it there. It\'s worth knowing why, because it\'s the payoff of this whole lesson. There are two reasons, and they stack.</p>' +
          '<p class="step-body"><b>1. Like charges repel, so crowding is expensive.</b> A full negative charge means one extra electron\'s worth of negative stuff sitting somewhere — chemists call that <b>electron density</b>, meaning simply how much electron is present in a given patch of space. And electron density repels other electron density. Pack all of it onto one small oxygen and every bit of it is crammed up against every other bit. Let it sit across two oxygens instead and each one holds half, with the two halves now separated by the width of the whole group — much less pushing against itself. Same total charge, more room, lower energy.</p>' +
          '<p class="step-body"><b>2. Confined electrons are high-energy electrons.</b> Electrons behave like waves, and a wave squeezed into a small space costs more energy than the same wave given more room — the same reason a short guitar string plays a higher note than a long one. An electron pair stuck in one lone pair on one atom is a short string. The same pair delocalized across an O–C–O system has a longer space to occupy, and its energy drops. This reason doesn\'t need a charge at all, which is why delocalization also stabilizes perfectly neutral molecules.</p>' +
          '<p class="step-body" style="margin-bottom:0;">Put together: <b>the more room a set of electrons has to spread into, the lower the energy of the molecule holding them.</b> When a later lesson tells you something is "resonance-stabilized," this is the entire content of that phrase.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'This is why vinegar is an acid and rubbing alcohol basically isn\'t.',
        bodyHtml: '<p class="step-body">An acid is a molecule willing to hand off an H⁺ — a hydrogen that leaves and doesn\'t take its bonding electrons with it. Those electrons stay behind, which means whatever is left over is now negatively charged. So how willingly a molecule gives up that hydrogen depends almost entirely on one thing: <b>how comfortable the leftover negative species is.</b> Stable leftovers, strong acid.</p>' +
          '<p class="step-body">Now compare two molecules that look almost the same — both are a chunk of carbon with an O–H on the end.</p>' +
          '<ul class="step-body" style="margin-top:0;">' +
          '<li><b>Acetic acid</b> (vinegar, CH₃COOH). Take the H⁺ off and you get acetate — the exact ion you just built. Its negative charge is spread across two oxygens.</li>' +
          '<li><b>Ethanol</b> (CH₃CH₂OH). Take the H⁺ off and you get ethoxide, the dead-end case from earlier: the neighboring carbon is sp³ with no p orbital to overlap, so the charge is stuck on one oxygen with nowhere to go.</li>' +
          '</ul>' +
          '<div class="explain-box">Acetic acid gives up its hydrogen roughly <b>a hundred billion times</b> more readily than ethanol does. Not because of anything about the O–H bond itself — those are nearly identical — but purely because of where the charge ends up afterward. Module 3 will put a scale on this (pKa). For now the idea is the thing: <b>more room to spread charge means more stable, and more stable leftovers means a stronger acid.</b> This same reasoning turns up again for flat rings that are unusually hard to break apart, for the short-lived charged fragments that appear in the middle of reactions, and for predicting which end of a molecule gets attacked. It\'s one of the highest-mileage ideas in the course.</div>'
      },
      {
        type: 'final',
        eyebrow: 'Challenge',
        title: 'Two valid resonance structures place a negative charge on different atoms: one on carbon, one on oxygen. Which is the major contributor?',
        options: ['The one with the negative charge on carbon', 'The one with the negative charge on oxygen', 'They contribute equally either way'],
        correctIndex: 1,
        correctFeedback: 'Correct, and here is the chain of reasoning behind it. Electronegativity is a measure of how tightly a nucleus pulls on electrons, and oxygen pulls harder than carbon. A negative charge is just extra electrons, so oxygen holds them more comfortably — lower energy. Lower energy means bigger share of the hybrid. So the oxygen sketch is the major contributor. The carbon sketch is still legal and still contributes something; it just contributes less.'
      }
    ]
  });
})();
</script>
