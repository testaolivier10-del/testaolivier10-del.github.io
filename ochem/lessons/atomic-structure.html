// Runs after the deferred scripts above it: every external script on this

document.addEventListener('DOMContentLoaded', function(){
(function(){
  /* The slots inside a shell are drawn in a ring for legibility only: nothing
     in chemistry orders them, so a click lands in whichever slot was clicked
     and any empty one is a legal move. What IS chemistry is that the inner
     shell fills before the outer one, and that is the only ordering enforced. */
  function shellSvg(kFilled, lFilled){
    var cx = 150, cy = 95, kRadius = 42, lRadius = 75;
    var kSlots = [200, 340].map(function(a){
      var rad = a * Math.PI/180;
      return [cx + kRadius*Math.cos(rad), cy + kRadius*Math.sin(rad)];
    });
    var lAngles = [90,135,180,225,270,315,0,45];
    var lSlots = lAngles.map(function(a){
      var rad = a * Math.PI/180;
      return [cx + lRadius*Math.cos(rad), cy + lRadius*Math.sin(rad)];
    });
    function slot(pos, i, filled, key){
      var isFilled = !!filled[i];
      return '<g class="atom' + (isFilled ? ' chosen' : '') + '" data-key="' + key + i + '">' +
        '<circle cx="' + pos[0] + '" cy="' + pos[1] + '" r="10" fill="' + (isFilled ? 'var(--accent)' : 'var(--white)') + '" stroke="' + (isFilled ? 'var(--accent)' : 'var(--line)') + '" stroke-width="2"/>' +
      '</g>';
    }
    /* The notes-figure class on the group gives the labels the theme-aware
       fg- text colors, so they read in light and dark. */
    return '<div class="scene"><svg viewBox="0 0 300 205"><g class="notes-figure">' +
      '<circle cx="150" cy="95" r="' + kRadius + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<circle cx="150" cy="95" r="' + lRadius + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<text class="fg-tag-mut" x="150" y="64" text-anchor="middle" pointer-events="none">K</text>' +
      '<text class="fg-tag-mut" x="150" y="46" text-anchor="middle" pointer-events="none">L</text>' +
      '<circle cx="150" cy="95" r="18" fill="var(--white)" stroke="var(--line)" stroke-width="2"/><text class="fg-lbl" x="150" y="100" text-anchor="middle" pointer-events="none">N</text>' +
      kSlots.map(function(p,i){ return slot(p, i, kFilled, 'k'); }).join('') +
      lSlots.map(function(p,i){ return slot(p, i, lFilled, 'l'); }).join('') +
      '<text class="fg-tag-mut" x="150" y="197" text-anchor="middle" pointer-events="none">click empty slots; fill the inner shell first</text>' +
    '</g></svg></div>';
  }

  window.OchemLessonEngine.start({
    topicId: 'atomic-structure',
    card: document.getElementById('card'),
    progFill: document.getElementById('progFill'),
    progLabel: document.getElementById('progLabel'),
    steps: [
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Three particles, three roles.',
        bodyHtml: '<p class="step-body">Take a carbon atom. Its <b>nucleus</b>, the tiny, dense core at the center, holds 6 protons and 6 neutrons. Around the nucleus move 6 electrons.</p><p class="step-body"><b>Protons</b>: charge +1, in the nucleus, mass about 1 atomic mass unit (amu, a unit sized so that a proton weighs about 1). <b>Neutrons</b>: no charge, in the nucleus, mass about 1 amu. <b>Electrons</b>: charge &minus;1, around the nucleus, mass about 1/1800 amu. That is so little that an atom\'s mass is, for most purposes, just its protons and neutrons.</p><p class="step-body" style="margin-bottom:0;">The number of protons is the element\'s <b>atomic number</b> (Z), and it defines the element. Every carbon atom has 6 protons. An atom with 7 protons is nitrogen, not carbon.</p>'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Same element, different mass: isotopes.',
        bodyHtml: '<p class="step-body">Most carbon atoms have 6 neutrons. About one in a hundred has 7. Both are carbon, because both have 6 protons. Atoms of the same element with different numbers of neutrons are <b>isotopes</b>.</p><p class="step-body">The <b>mass number</b> (A) is protons plus neutrons, written as a superscript before the symbol. Carbon-12 (¹²C) has 6 protons and 6 neutrons. Carbon-13 (¹³C) has 6 protons and 7 neutrons. The extra neutron changes the mass, not the electrons, so the two form the same bonds.</p><p class="step-body" style="margin-bottom:0;">The extra neutron is still useful. ¹H and ¹³C are the two isotopes that NMR spectroscopy detects in this course (<a class="chapter-ref" href="/ochem/learn.html#m-spectroscopy">Spectroscopy</a>). Mass spectrometry weighs molecules, which helps work out a molecule\'s formula, and it tells ¹³C from ¹²C by mass.</p>',
        diagramHtml: '<!-- fig:carbon-isotopes:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 236" role="img" aria-label="Shell diagrams of carbon-12 and carbon-13 side by side. Each has a nucleus labeled C with two gray inner electrons and four teal outer electrons. Under carbon-12 the nucleus holds 6 protons and 6 neutrons, mass number 12; under carbon-13 it holds 6 protons and 7 neutrons, mass number 13."><text class="fg-tag" x="85" y="20" text-anchor="middle" font-size="11">carbon-12 (¹²C)</text><circle class="fg-orb-node" cx="85" cy="92" r="26"></circle><circle class="fg-lp-mut" cx="85" cy="66" r="3.6"></circle><circle class="fg-lp-mut" cx="85" cy="118" r="3.6"></circle><circle class="fg-orb-node" cx="85" cy="92" r="41"></circle><circle class="fg-lp" cx="85" cy="51" r="3.6"></circle><circle class="fg-lp" cx="126" cy="92" r="3.6"></circle><circle class="fg-lp" cx="85" cy="133" r="3.6"></circle><circle class="fg-lp" cx="44" cy="92" r="3.6"></circle><circle class="fg-atom-hi" cx="85" cy="92" r="15"></circle><text class="fg-lbl" x="85" y="97.18" text-anchor="middle" font-size="14">C</text><text class="fg-lbl" x="85" y="162" text-anchor="middle" font-size="13">6 p + 6 n</text><text class="fg-tag" x="85" y="182" text-anchor="middle" font-size="11">mass number 12</text><text class="fg-tag-mut" x="85" y="200" text-anchor="middle" font-size="11">98.9% of carbon</text><text class="fg-tag" x="255" y="20" text-anchor="middle" font-size="11">carbon-13 (¹³C)</text><circle class="fg-orb-node" cx="255" cy="92" r="26"></circle><circle class="fg-lp-mut" cx="255" cy="66" r="3.6"></circle><circle class="fg-lp-mut" cx="255" cy="118" r="3.6"></circle><circle class="fg-orb-node" cx="255" cy="92" r="41"></circle><circle class="fg-lp" cx="255" cy="51" r="3.6"></circle><circle class="fg-lp" cx="296" cy="92" r="3.6"></circle><circle class="fg-lp" cx="255" cy="133" r="3.6"></circle><circle class="fg-lp" cx="214" cy="92" r="3.6"></circle><circle class="fg-atom-hi" cx="255" cy="92" r="15"></circle><text class="fg-lbl" x="255" y="97.18" text-anchor="middle" font-size="14">C</text><text class="fg-lbl" x="255" y="162" text-anchor="middle" font-size="13">6 p + 7 n</text><text class="fg-tag" x="255" y="182" text-anchor="middle" font-size="11">mass number 13</text><text class="fg-tag-mut" x="255" y="200" text-anchor="middle" font-size="11">1.1% of carbon</text><line class="fg-rule" x1="170" y1="30" x2="170" y2="204"></line><text class="fg-tag-good" x="170" y="228" text-anchor="middle" font-size="11">same 6 electrons in both</text></svg><figcaption>Compare the nucleus labels under each atom: only the neutron count differs. The rings of electrons are identical, including the four outer ones in teal that form bonds.</figcaption></figure><!-- fig:carbon-isotopes:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Only the outermost electrons take part in bonding.',
        bodyHtml: '<p class="step-body">Electrons sit in <b>shells</b>, layers at increasing distance from the nucleus. The inner (K) shell holds at most <b>2</b>. The next (L) shell holds at most <b>8</b>. The inner shell fills first, so carbon\'s 6 electrons go 2 into K, then 4 into L. Chemists write that as 2, 4. Atoms in the third row of the periodic table, such as sodium and magnesium, go on to fill a third shell, M.</p><p class="step-body">A neutral atom has exactly as many electrons as protons: its atomic number.</p><p class="step-body" style="margin-bottom:0;">The electrons in the <b>outermost</b> shell are the <b>valence electrons</b>. They are the only ones that take part in bonding, and carbon has 4. The electrons in the filled inner shells are <b>core electrons</b>, held too tightly by the nucleus to react.</p>'
      },
      {
        render: function(api){
          var kSlots = [false, false];
          var lSlots = [false, false, false, false, false, false, false, false];
          var count = function(a){ var n = 0; for(var i=0;i<a.length;i++) if(a[i]) n++; return n; };
          var done = false;
          function paint(){
            api.card.innerHTML =
              '<div class="step-eyebrow">Visualize &amp; Interact</div>' +
              '<h2 class="step-title">Build a neutral nitrogen atom (atomic number 7).</h2>' +
              '<p class="step-body">Nitrogen has 7 protons, so a neutral atom has 7 electrons. Click empty slots to add them; a filled slot gets a thick teal ring. The K shell (2 slots) fills before the L shell, because the inner shell is lower in energy. <i>Within</i> a shell the slots are all equivalent, so any empty one will do.</p>' +
              shellSvg(kSlots, lSlots) +
              api.feedbackHtml('fb') +
              api.nextButtonHtml('Continue', done);
            var fb = api.card.querySelector('#fb');
            api.card.querySelectorAll('.atom').forEach(function(g){
              g.addEventListener('click', function(){
                if(done) return;
                var key = g.getAttribute('data-key');
                var isK = key.charAt(0) === 'k';
                var idx = parseInt(key.slice(1), 10);
                if(isK){
                  if(kSlots[idx]){ return; }
                  kSlots[idx] = true;
                } else {
                  if(count(kSlots) < 2){ api.showFeedback(fb, false, 'Fill the K shell (2 electrons) before adding to the L shell. The inner shell is lower in energy.'); return; }
                  if(lSlots[idx]){ return; }
                  lSlots[idx] = true;
                }
                var total = count(kSlots) + count(lSlots);
                if(total === 7){
                  done = true;
                  api.record(true);
                  paint();
                  api.showFeedback(api.card.querySelector('#fb'), true, 'Correct. The K shell is full with 2; the rest went into L.');
                } else {
                  paint();
                }
              });
            });
            api.card.querySelector('#nextBtn').addEventListener('click', api.advance);
          }
          paint();
        }
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'How many valence electrons does nitrogen have?',
        bodyHtml: '<p class="step-body">Use the atom you just built.</p>',
        options: ['3', '7', '5', '2'],
        correctIndex: 2,
        correctFeedback: 'Correct. 2 in the K shell and 5 in the L shell. The 5 in the outer shell are the valence electrons.',
        wrongFeedback: 'Count only the electrons in the outermost shell, not the core ones.'
      },
      {
        type: 'mcq',
        eyebrow: 'Independent Practice',
        title: 'A neutral atom has atomic number 8 (oxygen). How many electrons does it have in total?',
        options: ['8', '6', '10'],
        correctIndex: 0,
        correctFeedback: 'Correct. Neutral means electrons = protons = atomic number. (Six of the eight are valence electrons: 2, 6.)',
        wrongFeedback: 'The question asks for every electron, not just the valence ones. In a neutral atom the electron count equals the proton count.'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'The periodic table counts valence electrons for you.',
        bodyHtml: '<p class="step-body">The columns of the periodic table are called <b>groups</b>, numbered 1 to 18. In groups 1, 2 and 13 to 18, the <b>main groups</b>, every element in a group has the same number of valence electrons (helium, with 2, is the one exception). The transition-metal groups, 3 to 12, do not follow this rule.</p><p class="step-body">In groups 1 and 2, the group number is the count: lithium has 1. In groups 13 to 18, subtract 10. Carbon is in group 14, so it has 14 &minus; 10 = 4. Nitrogen, group 15, has 5, as you just built.</p><p class="step-body" style="margin-bottom:0;">The ten comes from the ten columns of <b>transition metals</b> (metals such as iron and copper), groups 3 to 12, which sit between group 2 and group 13 from the fourth row down.</p>',
        diagramHtml: '<!-- fig:l-valence-row:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 198" role="img" aria-label="Row 2 of the periodic table: Li, Be, then a gap for groups 3 to 12, then B, C, N, O, F, Ne. Above each element is its group number, 1, 2, 13, 14, 15, 16, 17, 18. Below each is its valence electron count, 1 to 8. C, N, O and F are shaded as the elements organic chemistry uses most."><text class="fg-tag" x="170" y="16" text-anchor="middle" font-size="11">row 2 of the periodic table</text><text class="fg-tag" x="24" y="42" text-anchor="middle" font-size="11">1</text><rect class="fg-panel" x="7" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="24" y="75" text-anchor="middle" font-size="13">Li</text><text class="fg-lbl" x="24" y="114" text-anchor="middle" font-size="13">1</text><text class="fg-tag" x="62" y="42" text-anchor="middle" font-size="11">2</text><rect class="fg-panel" x="45" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="62" y="75" text-anchor="middle" font-size="13">Be</text><text class="fg-lbl" x="62" y="114" text-anchor="middle" font-size="13">2</text><text class="fg-tag" x="112" y="42" text-anchor="middle" font-size="11">13</text><rect class="fg-panel" x="95" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="112" y="75" text-anchor="middle" font-size="13">B</text><text class="fg-lbl" x="112" y="114" text-anchor="middle" font-size="13">3</text><text class="fg-tag" x="150" y="42" text-anchor="middle" font-size="11">14</text><rect class="fg-panel-hi" x="133" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="150" y="75" text-anchor="middle" font-size="13">C</text><text class="fg-lbl" x="150" y="114" text-anchor="middle" font-size="13">4</text><text class="fg-tag" x="188" y="42" text-anchor="middle" font-size="11">15</text><rect class="fg-panel-hi" x="171" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="188" y="75" text-anchor="middle" font-size="13">N</text><text class="fg-lbl" x="188" y="114" text-anchor="middle" font-size="13">5</text><text class="fg-tag" x="226" y="42" text-anchor="middle" font-size="11">16</text><rect class="fg-panel-hi" x="209" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="226" y="75" text-anchor="middle" font-size="13">O</text><text class="fg-lbl" x="226" y="114" text-anchor="middle" font-size="13">6</text><text class="fg-tag" x="264" y="42" text-anchor="middle" font-size="11">17</text><rect class="fg-panel-hi" x="247" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="264" y="75" text-anchor="middle" font-size="13">F</text><text class="fg-lbl" x="264" y="114" text-anchor="middle" font-size="13">7</text><text class="fg-tag" x="302" y="42" text-anchor="middle" font-size="11">18</text><rect class="fg-panel" x="285" y="52" width="34" height="36" rx="6"></rect><text class="fg-lbl" x="302" y="75" text-anchor="middle" font-size="13">Ne</text><text class="fg-lbl" x="302" y="114" text-anchor="middle" font-size="13">8</text><line class="fg-dash" x1="87" y1="54" x2="87" y2="86"></line><line class="fg-rule" x1="8" y1="96" x2="332" y2="96"></line><text class="fg-tag-mut" x="170" y="142" text-anchor="middle" font-size="11">top: group number; bottom: valence electrons</text><text class="fg-tag" x="170" y="162" text-anchor="middle" font-size="11">groups 13 to 18: subtract 10</text><rect class="fg-panel-hi" x="22" y="176" width="20" height="14" rx="4"></rect><text class="fg-tag-mut" x="48" y="187" text-anchor="start" font-size="11">shaded: used most in organic chemistry</text></svg><figcaption>Groups 1 and 2 give the count directly. The ten columns of groups 3 to 12 are missing from this row, so from group 13 on, subtract ten.</figcaption></figure><!-- fig:l-valence-row:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Independent Practice',
        title: 'Chlorine is in group 17. How many valence electrons does it have?',
        options: ['17', '7', '1', '8'],
        correctIndex: 1,
        correctFeedback: 'Correct. Group 17 is past the gap, so 17 − 10 = 7 valence electrons.',
        wrongFeedback: 'For groups 13 to 18, subtract 10 from the group number.'
      },
      {
        type: 'explain',
        eyebrow: 'Why it matters',
        title: 'Count to eight: the octet rule.',
        bodyHtml: '<p class="step-body">Neon (2, 8) has a full outer shell, and it forms no compounds under ordinary conditions.</p><p class="step-body">Nitrogen has 5 valence electrons, so it is 3 short. In ammonia, NH₃, it shares one pair of electrons with each of three hydrogens, and both atoms count each shared pair. Each shared pair is one <b>bond</b>. Nitrogen also keeps a <b>lone pair</b>: a pair of its own electrons that it does not share. Around the nitrogen, 3 shared pairs + 1 lone pair = 8 electrons.</p><p class="step-body">In ethene, each carbon has only three neighbors but still 8 electrons, because the two carbons share two pairs (a <b>double bond</b>). Count electrons, not neighbors.</p><div class="explain-box" style="margin-bottom:0;">That is the <b>octet rule</b>. An atom is most stable (lowest in energy) with a full outer shell: 8 electrons (an <b>octet</b>) for carbon, nitrogen, oxygen and the <b>halogens</b> (the group 17 elements F, Cl, Br and I), and 2 for hydrogen. So when it shares, carbon forms 4 bonds, nitrogen 3, oxygen 2, a halogen 1 and hydrogen 1.</div>',
        diagramHtml: '<!-- fig:octet-count:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 416" role="img" aria-label="Electron-dot drawings of methane, ammonia and ethene. In methane a dashed ring around carbon encloses four shared pairs, 8 electrons; a smaller ring around one hydrogen encloses its single shared pair, 2 electrons. In ammonia a ring around nitrogen encloses three shared pairs and one lone pair, 8 electrons. In ethene a ring around the left carbon encloses two carbon-hydrogen pairs and the two pairs shared between the carbons, 8 electrons."><text class="fg-tag" x="85" y="20" text-anchor="middle" font-size="11">methane, CH₄</text><circle class="fg-dash-hi" cx="85" cy="96" r="38"></circle><circle class="fg-lp" cx="89.2" cy="67" r="2.6"></circle><circle class="fg-lp" cx="80.8" cy="67" r="2.6"></circle><circle class="fg-atom" cx="85" cy="38" r="13"></circle><text class="fg-lbl" x="85" y="42.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="114" cy="100.2" r="2.6"></circle><circle class="fg-lp" cx="114" cy="91.8" r="2.6"></circle><circle class="fg-atom" cx="143" cy="96" r="13"></circle><text class="fg-lbl" x="143" y="100.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="80.8" cy="125" r="2.6"></circle><circle class="fg-lp" cx="89.2" cy="125" r="2.6"></circle><circle class="fg-atom" cx="85" cy="154" r="13"></circle><text class="fg-lbl" x="85" y="158.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="56" cy="91.8" r="2.6"></circle><circle class="fg-lp" cx="56" cy="100.2" r="2.6"></circle><circle class="fg-atom" cx="27" cy="96" r="13"></circle><text class="fg-lbl" x="27" y="100.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom-hi" cx="85" cy="96" r="15"></circle><text class="fg-lbl" x="85" y="101.18" text-anchor="middle" font-size="14">C</text><circle class="fg-dash" cx="143" cy="96" r="30"></circle><text class="fg-tag" x="85" y="186" text-anchor="middle" font-size="11">4 shared pairs</text><text class="fg-lbl" x="85" y="202" text-anchor="middle" font-size="13">= 8 around C</text><text class="fg-tag-mut" x="147" y="60" text-anchor="middle" font-size="11">H: 2</text><text class="fg-tag" x="255" y="20" text-anchor="middle" font-size="11">ammonia, NH₃</text><circle class="fg-dash-hi" cx="255" cy="96" r="38"></circle><circle class="fg-lp" cx="226" cy="91.8" r="2.6"></circle><circle class="fg-lp" cx="226" cy="100.2" r="2.6"></circle><circle class="fg-atom" cx="197" cy="96" r="13"></circle><text class="fg-lbl" x="197" y="100.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="284" cy="100.2" r="2.6"></circle><circle class="fg-lp" cx="284" cy="91.8" r="2.6"></circle><circle class="fg-atom" cx="313" cy="96" r="13"></circle><text class="fg-lbl" x="313" y="100.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="250.8" cy="125" r="2.6"></circle><circle class="fg-lp" cx="259.2" cy="125" r="2.6"></circle><circle class="fg-atom" cx="255" cy="154" r="13"></circle><text class="fg-lbl" x="255" y="158.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="259.2" cy="69" r="2.6"></circle><circle class="fg-lp" cx="250.8" cy="69" r="2.6"></circle><line class="fg-rule" x1="264" y1="66" x2="279" y2="52"></line><text class="fg-tag" x="281" y="50" text-anchor="start" font-size="11">lone pair</text><circle class="fg-atom-hi" cx="255" cy="96" r="15"></circle><text class="fg-lbl" x="255" y="101.18" text-anchor="middle" font-size="14">N</text><text class="fg-tag" x="255" y="186" text-anchor="middle" font-size="11">3 shared + 1 lone pair</text><text class="fg-lbl" x="255" y="202" text-anchor="middle" font-size="13">= 8 around N</text><line class="fg-rule" x1="170" y1="30" x2="170" y2="208"></line><line class="fg-rule" x1="16" y1="226" x2="324" y2="226"></line><text class="fg-tag" x="170" y="252" text-anchor="middle" font-size="11">ethene, C₂H₄ (a double bond)</text><circle class="fg-dash-hi" cx="140" cy="316" r="40"></circle><circle class="fg-lp" cx="124.58" cy="291.09" r="2.6"></circle><circle class="fg-lp" cx="118.14" cy="296.48" r="2.6"></circle><circle class="fg-atom" cx="102.72" cy="271.57" r="13"></circle><text class="fg-lbl" x="102.72" y="276.01" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="118.14" cy="335.52" r="2.6"></circle><circle class="fg-lp" cx="124.58" cy="340.91" r="2.6"></circle><circle class="fg-atom" cx="102.72" cy="360.43" r="13"></circle><text class="fg-lbl" x="102.72" y="364.87" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="221.86" cy="296.48" r="2.6"></circle><circle class="fg-lp" cx="215.42" cy="291.09" r="2.6"></circle><circle class="fg-atom" cx="237.28" cy="271.57" r="13"></circle><text class="fg-lbl" x="237.28" y="276.01" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="215.42" cy="340.91" r="2.6"></circle><circle class="fg-lp" cx="221.86" cy="335.52" r="2.6"></circle><circle class="fg-atom" cx="237.28" cy="360.43" r="13"></circle><text class="fg-lbl" x="237.28" y="364.87" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="165.8" cy="311" r="2.6"></circle><circle class="fg-lp" cx="165.8" cy="321" r="2.6"></circle><circle class="fg-lp" cx="174.2" cy="311" r="2.6"></circle><circle class="fg-lp" cx="174.2" cy="321" r="2.6"></circle><circle class="fg-atom-hi" cx="140" cy="316" r="15"></circle><text class="fg-lbl" x="140" y="321.18" text-anchor="middle" font-size="14">C</text><circle class="fg-atom-hi" cx="200" cy="316" r="15"></circle><text class="fg-lbl" x="200" y="321.18" text-anchor="middle" font-size="14">C</text><text class="fg-tag" x="170" y="394" text-anchor="middle" font-size="11">2 C–H pairs + 2 C=C pairs</text><text class="fg-lbl" x="170" y="410" text-anchor="middle" font-size="13">= 8 around each C</text></svg><figcaption>Each pair of dots between two atoms is a shared pair, and the atoms       {

        eyebrow: 'Explain',
        title: 'Ions: what "cation" and "anion" mean.',
        bodyHtml: '<p class="step-body">Sodium (Z = 11) loses its one outer electron and is left with 2, 8, a full outer shell. It still has 11 protons but only 10 electrons, so it carries a charge of +1. An atom or group of atoms with more protons than electrons is a <b>cation</b>.</p><p class="step-body" style="margin-bottom:0;">Fluorine (Z = 9, 2, 7) gains one electron to reach 2, 8. With 9 protons and 10 electrons, it carries &minus;1. An atom or group of atoms with more electrons than protons is an <b>anion</b>.</p>',

      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'Two ways to a full shell: share or transfer.',
        bodyHtml: '<p class="step-body">Put sodium beside chlorine, which has 7 valence electrons and is one short of a full shell. Sodium\'s outer electron moves across to chlorine completely, leaving Na⁺ and Cl⁻, as in the last step. The opposite charges attract: an <b>ionic bond</b>, with nothing shared.</p><p class="step-body">Two hydrogens each need one more electron, and neither gives its electron away. So they share one pair, and both count it. A shared pair holding two atoms together is a <b>covalent bond</b>.</p><p class="step-body" style="margin-bottom:0;">An atom with one or two electrons beyond a full shell tends to hand them over. An atom one or two short tends to take them. Carbon is four from either, and losing or gaining four electrons costs far too much energy, so carbon shares.</p>',
        diagramHtml: '<!-- fig:shared-pair-counts-twice:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 372" role="img" aria-label="Top: the outer shells of sodium, with one electron, and chlorine, with seven; an arrow carries sodium&#39;s electron to the empty place in chlorine&#39;s shell, leaving Na+ and Cl−, labeled as an ionic bond. Bottom: two hydrogen atoms whose shells overlap, with one pair of electrons in the overlap, labeled as a covalent bond that both atoms count."><text class="fg-tag-warn" x="170" y="20" text-anchor="middle" font-size="11">TRANSFER: an ionic bond</text><circle class="fg-orb-node" cx="78" cy="100" r="36"></circle><circle class="fg-lp" cx="78" cy="64" r="3.6"></circle><circle class="fg-atom-warn" cx="78" cy="100" r="15"></circle><text class="fg-lbl" x="78" y="104.44" text-anchor="middle" font-size="12">Na</text><circle class="fg-orb-node" cx="262" cy="100" r="36"></circle><circle class="fg-lp" cx="254.52" cy="64.79" r="3.6"></circle><circle class="fg-lp" cx="269.48" cy="64.79" r="3.6"></circle><circle class="fg-lp" cx="297.21" cy="92.52" r="3.6"></circle><circle class="fg-lp" cx="297.21" cy="107.48" r="3.6"></circle><circle class="fg-lp" cx="269.48" cy="135.21" r="3.6"></circle><circle class="fg-lp" cx="254.52" cy="135.21" r="3.6"></circle><circle class="fg-lp" cx="226.79" cy="107.48" r="3.6"></circle><circle class="fg-dash-hi" cx="226.79" cy="92.52" r="4.6"></circle><circle class="fg-atom-warn" cx="262" cy="100" r="15"></circle><text class="fg-lbl" x="262" y="104.44" text-anchor="middle" font-size="12">Cl</text><path class="fg-arrow" d="M84 60 Q161.06 35.93 214.32 83.97"></path><path class="fg-head" d="M221 90 L217.93 79.96 L214.32 83.97 Z"></path><text class="fg-lbl" x="78" y="154" text-anchor="middle" font-size="13">Na → Na⁺</text><text class="fg-lbl" x="262" y="154" text-anchor="middle" font-size="13">Cl → Cl⁻</text><text class="fg-tag-mut" x="170" y="174" text-anchor="middle" font-size="11">arrow: Na&#39;s one outer electron moves to Cl</text><line class="fg-rule" x1="16" y1="190" x2="324" y2="190"></line><text class="fg-tag-good" x="170" y="212" text-anchor="middle" font-size="11">SHARING: a covalent bond</text><circle class="fg-orb-node" cx="130" cy="288" r="48"></circle><circle class="fg-orb-node" cx="210" cy="288" r="48"></circle><circle class="fg-atom" cx="130" cy="288" r="13"></circle><text class="fg-lbl" x="130" y="292.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom" cx="210" cy="288" r="13"></circle><text class="fg-lbl" x="210" y="292.44" text-anchor="middle" font-size="12">H</text><circle class="fg-lp" cx="170" cy="282" r="3.6"></circle><circle class="fg-lp" cx="170" cy="294" r="3.6"></circle><text class="fg-tag" x="170" y="360" text-anchor="middle" font-size="11">one shared pair; each H counts it: 2 each</text></svg><figcaption>Top: only the outer shells are drawn. Sodium&#39;s one outer electron fills the gap in chlorine&#39;s outer shell, and nothing is shared. Bottom: one pair between two hydrogens, counted by both.</figcaption></figure><!-- fig:shared-pair-counts-twice:end -->'
      },
      {
        type: 'explain',
        eyebrow: 'Explain',
        title: 'A carbocation is short in two ways.',
        bodyHtml: '<p class="step-body">Take R₃C&ndash;Cl, where R stands for any carbon-based group of atoms. Suppose the C&ndash;Cl bond breaks and the chlorine takes <b>both</b> electrons of the shared pair. The carbon is left with three bonds and a charge of +1. A carbon with a positive charge is a <b>carbocation</b>.</p><p class="step-body"><b>Around the carbon</b>, count every electron: 3 shared pairs = 6. The carbon is <b>two electrons short of an octet</b>, with an <b>empty orbital</b> where the lost pair was: a space that can hold one pair (the Orbitals lesson comes next).</p><p class="step-body"><b>The carbon\'s own electrons</b>: in a shared pair, one electron counts as each atom\'s own. A neutral carbon owns 4. This carbon now owns 3, <b>one short</b>, so its charge is +1.</p><p class="step-body" style="margin-bottom:0;">Na⁺ also lost one of its own electrons and carries +1, but it is left with a full 2, 8. The carbocation is left with 6 around its carbon, and that gap is why it reacts so readily with anything that can give it a pair.</p>',
        diagramHtml: '<!-- fig:carbocation-count:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 380" role="img" aria-label="Top: a carbon bonded to three R groups and a chlorine; the chlorine has three lone pairs, and a curved arrow moves the C–Cl bonding pair onto the chlorine. Counts: 8 electrons around carbon, 4 of them carbon&#39;s own, charge 0. Bottom: the products, a carbon with three R groups and a positive charge, and a chloride ion with four lone pairs. Counts: 6 electrons around carbon, 3 of them its own, charge +1."><text class="fg-tag" x="170" y="18" text-anchor="middle" font-size="11">before: R₃C–Cl</text><line class="fg-bond" x1="92" y1="71" x2="92" y2="48"></line><circle class="fg-atom" cx="92" cy="36" r="12"></circle><text class="fg-lbl" x="92" y="40.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="77" y1="86" x2="54" y2="86"></line><circle class="fg-atom" cx="42" cy="86" r="12"></circle><text class="fg-lbl" x="42" y="90.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="92" y1="101" x2="92" y2="124"></line><circle class="fg-atom" cx="92" cy="136" r="12"></circle><text class="fg-lbl" x="92" y="140.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond-hi" x1="107" y1="86" x2="150" y2="86"></line><circle class="fg-atom-hi" cx="92" cy="86" r="15"></circle><text class="fg-lbl" x="92" y="91.18" text-anchor="middle" font-size="14">C</text><circle class="fg-atom-warn" cx="166" cy="86" r="16"></circle><text class="fg-lbl" x="166" y="90.44" text-anchor="middle" font-size="12">Cl</text><circle class="fg-lp" cx="170.2" cy="61" r="2.6"></circle><circle class="fg-lp" cx="161.8" cy="61" r="2.6"></circle><circle class="fg-lp" cx="191" cy="90.2" r="2.6"></circle><circle class="fg-lp" cx="191" cy="81.8" r="2.6"></circle><circle class="fg-lp" cx="161.8" cy="111" r="2.6"></circle><circle class="fg-lp" cx="170.2" cy="111" r="2.6"></circle><path class="fg-arrow" d="M126 82 Q134.22 63.53 146.49 68.41"></path><path class="fg-head" d="M153 71 L145.15 71.8 L147.84 65.03 Z"></path><text class="fg-lbl" x="226" y="60" text-anchor="start" font-size="13">around C: 8</text><text class="fg-lbl" x="226" y="80" text-anchor="start" font-size="13">C owns: 4</text><text class="fg-lbl" x="226" y="100" text-anchor="start" font-size="13">charge: 0</text><text class="fg-tag" x="170" y="164" text-anchor="middle" font-size="11">the arrow: both bond electrons go to Cl</text><line class="fg-rule" x1="16" y1="182" x2="324" y2="182"></line><text class="fg-tag" x="170" y="206" text-anchor="middle" font-size="11">after: R₃C⁺ + Cl⁻</text><line class="fg-bond" x1="74" y1="267" x2="74" y2="244"></line><circle class="fg-atom" cx="74" cy="232" r="12"></circle><text class="fg-lbl" x="74" y="236.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="61.01" y1="289.5" x2="41.09" y2="301"></line><circle class="fg-atom" cx="30.7" cy="307" r="12"></circle><text class="fg-lbl" x="30.7" y="311.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="86.99" y1="289.5" x2="106.91" y2="301"></line><circle class="fg-atom" cx="117.3" cy="307" r="12"></circle><text class="fg-lbl" x="117.3" y="311.44" text-anchor="middle" font-size="12">R</text><circle class="fg-atom-hi" cx="74" cy="282" r="15"></circle><text class="fg-lbl" x="74" y="287.18" text-anchor="middle" font-size="14">C</text><text class="fg-warn" x="96" y="268" text-anchor="middle" font-size="18">+</text><circle class="fg-atom-warn" cx="164" cy="282" r="16"></circle><text class="fg-lbl" x="164" y="286.44" text-anchor="middle" font-size="12">Cl</text><circle class="fg-lp" cx="168.2" cy="257" r="2.6"></circle><circle class="fg-lp" cx="159.8" cy="257" r="2.6"></circle><circle class="fg-lp" cx="189" cy="286.2" r="2.6"></circle><circle class="fg-lp" cx="189" cy="277.8" r="2.6"></circle><circle class="fg-lp" cx="159.8" cy="307" r="2.6"></circle><circle class="fg-lp" cx="168.2" cy="307" r="2.6"></circle><circle class="fg-lp" cx="139" cy="277.8" r="2.6"></circle><circle class="fg-lp" cx="139" cy="286.2" r="2.6"></circle><text class="fg-warn" x="190" y="260" text-anchor="middle" font-size="18">−</text><text class="fg-lbl" x="226" y="262" text-anchor="start" font-size="13">around C: 6</text><text class="fg-lbl" x="226" y="282" text-anchor="start" font-size="13">C owns: 3</text><text class="fg-lbl" x="226" y="302" text-anchor="start" font-size="13">charge: +1</text><text class="fg-tag-warn" x="170" y="344" text-anchor="middle" font-size="11">around C: 2 short of an octet</text><text class="fg-tag-warn" x="170" y="364" text-anchor="middle" font-size="11">C&#39;s own count: 1 short of neutral</text></svg><figcaption>Each line is one shared pair. Follow the two electrons of the C–Cl bond: both end up on chlorine. Then compare the two counts for carbon before and after.</figcaption></figure><!-- fig:carbocation-count:end -->'
      },
      {
        type: 'mcq',
        eyebrow: 'Guided Practice',
        title: 'A carbon has three bonds to R groups and one to H. A strong base (a molecule or ion that pulls protons off) removes the H as H⁺, a bare proton with no electrons. What is left on the carbon?',
        bodyHtml: '<p class="step-body">The pair from the C&ndash;H bond stays on the carbon as a lone pair. Count both ways, as in the last step.</p>',
        options: ['8 electrons around it, charge −1', '6 electrons around it, charge +1', '8 electrons around it, charge 0', '7 electrons around it, charge −1'],
        correctIndex: 0,
        correctFeedback: 'Correct. Around the carbon: 3 shared pairs + 1 lone pair = 8, a full octet. Its own: 1 from each of 3 bonds + 2 from the lone pair = 5, one more than a neutral carbon, so −1.',
        wrongFeedback: 'The H⁺ took no electrons, so no electrons left the carbon. Count around it (3 bonds plus the lone pair), then count its own (one per bond, both lone-pair electrons).'
      },
      {
        type: 'explain',
        eyebrow: 'Explanation',
        title: 'Carbanion, neutral carbon, carbocation.',
        bodyHtml: '<p class="step-body">The carbon you just counted is a <b>carbanion</b>: a carbon with a negative charge. It has a full octet and a spare pair to give, so it seeks out anything short of electrons.</p><p class="step-body" style="margin-bottom:0;">A carbocation lost the pair, a carbanion kept it. You meet carbocations in <a class="chapter-ref" href="/ochem/learn.html#m-substitution-elimination">Substitution &amp; Elimination</a> and carbanions in <a class="chapter-ref" href="/ochem/learn.html#m-enolate-chemistry">Enolate Chemistry</a>.</p>',
        diagramHtml: '<!-- fig:carbon-three-states:start --><figure class="notes-figure notes-figure--wide" style="--vb:340"><svg viewBox="0 0 340 244" role="img" aria-label="Three carbons side by side. Left, a carbanion: three R groups and a lone pair, 8 electrons around carbon, carbon owns 5, charge −1. Middle, a neutral carbon: three R groups and an H, 8 electrons around carbon, owns 4, charge 0. Right, a carbocation: three R groups only, 6 electrons around carbon, owns 3, charge +1."><text class="fg-tag" x="57" y="20" text-anchor="middle" font-size="11">carbanion</text><line class="fg-bond" x1="57" y1="77" x2="57" y2="62"></line><circle class="fg-atom" cx="57" cy="50" r="12"></circle><text class="fg-lbl" x="57" y="54.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="42" y1="92" x2="27" y2="92"></line><circle class="fg-atom" cx="15" cy="92" r="12"></circle><text class="fg-lbl" x="15" y="96.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="72" y1="92" x2="87" y2="92"></line><circle class="fg-atom" cx="99" cy="92" r="12"></circle><text class="fg-lbl" x="99" y="96.44" text-anchor="middle" font-size="12">R</text><circle class="fg-lp" cx="52.8" cy="118" r="2.6"></circle><circle class="fg-lp" cx="61.2" cy="118" r="2.6"></circle><circle class="fg-atom-hi" cx="57" cy="92" r="15"></circle><text class="fg-lbl" x="57" y="97.18" text-anchor="middle" font-size="14">C</text><text class="fg-warn" x="79" y="76" text-anchor="middle" font-size="18">−</text><text class="fg-tag" x="57" y="172" text-anchor="middle" font-size="11">8 around C</text><text class="fg-tag-mut" x="57" y="190" text-anchor="middle" font-size="11">owns 5</text><text class="fg-lbl" x="57" y="212" text-anchor="middle" font-size="13">charge −1</text><text class="fg-tag-mut" x="170" y="20" text-anchor="middle" font-size="11">neutral</text><line class="fg-bond" x1="170" y1="77" x2="170" y2="62"></line><circle class="fg-atom" cx="170" cy="50" r="12"></circle><text class="fg-lbl" x="170" y="54.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="155" y1="92" x2="140" y2="92"></line><circle class="fg-atom" cx="128" cy="92" r="12"></circle><text class="fg-lbl" x="128" y="96.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="185" y1="92" x2="200" y2="92"></line><circle class="fg-atom" cx="212" cy="92" r="12"></circle><text class="fg-lbl" x="212" y="96.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="170" y1="107" x2="170" y2="122"></line><circle class="fg-atom" cx="170" cy="134" r="12"></circle><text class="fg-lbl" x="170" y="138.44" text-anchor="middle" font-size="12">H</text><circle class="fg-atom-hi" cx="170" cy="92" r="15"></circle><text class="fg-lbl" x="170" y="97.18" text-anchor="middle" font-size="14">C</text><text class="fg-tag" x="170" y="172" text-anchor="middle" font-size="11">8 around C</text><text class="fg-tag-mut" x="170" y="190" text-anchor="middle" font-size="11">owns 4</text><text class="fg-lbl" x="170" y="212" text-anchor="middle" font-size="13">charge 0</text><text class="fg-tag-warn" x="283" y="20" text-anchor="middle" font-size="11">carbocation</text><line class="fg-bond" x1="283" y1="77" x2="283" y2="62"></line><circle class="fg-atom" cx="283" cy="50" r="12"></circle><text class="fg-lbl" x="283" y="54.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="268" y1="92" x2="253" y2="92"></line><circle class="fg-atom" cx="241" cy="92" r="12"></circle><text class="fg-lbl" x="241" y="96.44" text-anchor="middle" font-size="12">R</text><line class="fg-bond" x1="298" y1="92" x2="313" y2="92"></line><circle class="fg-atom" cx="325" cy="92" r="12"></circle><text class="fg-lbl" x="325" y="96.44" text-anchor="middle" font-size="12">R</text><circle class="fg-atom-hi" cx="283" cy="92" r="15"></circle><text class="fg-lbl" x="283" y="97.18" text-anchor="middle" font-size="14">C</text><text class="fg-warn" x="305" y="76" text-anchor="middle" font-size="18">+</text><text class="fg-tag" x="283" y="172" text-anchor="middle" font-size="11">6 around C</text><text class="fg-tag-mut" x="283" y="190" text-anchor="middle" font-size="11">owns 3</text><text class="fg-lbl" x="283" y="212" text-anchor="middle" font-size="13">charge +1</text><line class="fg-rule" x1="113" y1="30" x2="113" y2="218"></line><line class="fg-rule" x1="226" y1="30" x2="226" y2="218"></line><text class="fg-tag-mut" x="170" y="238" text-anchor="middle" font-size="11">R = any carbon-based group</text></svg><figcaption>Only the carbocation falls short of 8. Its carbon has an empty orbital, room for one pair, and that is where an incoming pair goes.</figcaption></figure><!-- fig:carbon-three-states:end -->'
