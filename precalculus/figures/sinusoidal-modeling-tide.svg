<title id="sinusoidal-modeling-tide-t">The depth of water at a dock over one tide cycle</title>
<desc id="sinusoidal-modeling-tide-d">An unscaled graph of W(t), the depth of water at a dock, for t from 2 to 14 hours after midnight. The graph starts at a high point P, falls through Q to a low point R, rises through S and ends at the next high point T. Q and S are halfway between the high and low depths. The axes have no scale.</desc>
