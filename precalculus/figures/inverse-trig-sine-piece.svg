<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Graph of y = sin x with the piece from negative pi over 2 to pi over 2 highlighted and the line y = 1/2 crossing the curve twice"><title>Sine repeats its outputs, so one piece is kept</title><desc>The full graph of y = sin x is gray. The dashed line y = 1/2 meets it at x = π/6 and again at x = 5π/6, so two inputs share one output and sine has no inverse on its whole domain. The heavy green piece, from (−π/2, −1) to (π/2, 1), rises the whole way and takes every output from −1 to 1 exactly once.</desc><style>
