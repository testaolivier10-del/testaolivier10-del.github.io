<title id="sinusoidal-modeling-ferris-t">A Ferris wheel and the height of a seat</title>
<desc id="sinusoidal-modeling-ferris-d">Left: a Ferris wheel on a support above the ground, turning counterclockwise, with a seat S at the lowest point of the wheel, which is above the ground. Right: an unscaled graph of h(t), the height of the seat above the ground, for one turn. The graph starts at its lowest point F, rises through G to its highest point J, falls through K and ends at the lowest point M. G and K are at the height of the center of the wheel. The axes have no scale.</desc>
