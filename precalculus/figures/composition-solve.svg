<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 380 320" width="380" height="320" role="img" aria-label="Graph of a parabola g with g(-1) = g(3) = 2 and a line f with f(0) = -1 and f(2) = 3, used to solve g(f(x)) = 2"><title>Solving g(f(x)) = 2 from two graphs</title><desc>The parabola g(x) = x² − 2x − 1 reaches the height 2 at the inputs −1 and 3, the points (−1, 2) and (3, 2) on the dashed line y = 2. The line f(x) = 2x − 1 has output −1 at x = 0 and output 3 at x = 2, the points (0, −1) and (2, 3). So g(f(x)) = 2 when x = 0 or x = 2.</desc><style>
