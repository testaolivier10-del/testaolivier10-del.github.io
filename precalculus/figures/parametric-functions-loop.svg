<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 370" width="460" height="370" role="img" aria-labelledby="t d">
<title id="t">A parametric path that crosses itself</title>
<desc id="d">The path x(t) = t squared minus 4, y(t) = t cubed minus 4t for t from -2.5 to 2.5. Points are marked at t = -2 (0, 0), t = -1 (-3, 3), t = 0 (-4, 0), t = 1 (-3, -3) and t = 2 (0, 0). Arrows show the direction of travel: in from the lower right, up through the origin, around a loop on the left going counterclockwise in the order t = -1, 0, 1, back through the origin, and out to the upper right.</desc>
