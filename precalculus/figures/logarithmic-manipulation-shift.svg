<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 380 300" width="380" height="300" role="img" aria-label="Graphs of f(x) = log base 2 of x and h(x) = log base 2 of 4x, which is f moved up 2"><title>The product property as a shift</title><desc>h(x) = log₂(4x) = log₂ 4 + log₂ x = 2 + log₂ x, so the graph of h is the graph of f(x) = log₂ x moved up 2 units: (1, 0) goes to (1, 2) and (4, 2) goes to (4, 4). The same graph is also f squeezed horizontally by a factor of 4.</desc><style>
text{font:600 11px Arial,Helvetica,sans-serif;fill:#1F2A28;}
