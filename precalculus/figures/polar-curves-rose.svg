<title id="t">The polar graph of r = 3 sin(2 theta)</title>
<desc id="d">A polar grid with circles of radius 1, 2 and 3 and rays every pi/4 radians. The curve r = 3 sin(2 theta) is a rose with four petals, each reaching distance 3 from the pole, centered on the rays at pi/4, 3 pi/4, 5 pi/4 and 7 pi/4. Every petal starts and ends at the pole.</desc>
