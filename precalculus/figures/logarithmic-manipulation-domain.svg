<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 390 280" width="390" height="280" role="img" aria-label="Graphs of y = ln(x squared), which has a branch on each side of the y-axis, and y = 2 ln x, which matches only the right branch"><title>Where ln(x²) and 2 ln x agree</title><desc>The green graph of y = ln(x²) has two branches, mirror images across the y-axis, through (−1, 0) and (1, 0). The graph of y = 2 ln x, drawn as light blue dashes, lies exactly on the right branch and does not exist for x &lt; 0. The two expressions are equal only for x &gt; 0.</desc><style>
