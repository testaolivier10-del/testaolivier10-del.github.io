<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 290" width="400" height="290" role="img" aria-label="Scatter plot of words read per minute against weeks of practice, with the logarithmic model y = 52 + 18 ln x"><title>A logarithmic model through data</title><desc>Reading speed rises by the same 12.5 words per minute every time the number of weeks doubles: (1, 52), (2, 64.5), (4, 77), (8, 89.5), (16, 102). The model y = 52 + 18 ln x passes close to every point; its rate of change keeps decreasing, so the graph is concave down.</desc><style>
