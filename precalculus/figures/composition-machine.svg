<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" width="400" height="232" role="img" aria-label="A composite function as two machines in a row"><title>A composite function as two machines in a row</title><desc>Top row: an input x goes into the machine g, which sends out g(x); that output goes into the machine f, which sends out f(g(x)). Bottom row, with the numbers of worked example 1: 2 goes into g and comes out as 0; 0 goes into f and comes out as 4, so f(g(2)) = 4.</desc><style>text{font:600 11px Arial,Helvetica,sans-serif;fill:#1F2A28;}</style><rect width="400" height="232" fill="#fff"/><text x="20" y="26" style="font-weight:700;font-size:12px">Any input: g works first, then f</text><text x="22" y="75" text-anchor="middle" style="font-weight:700;font-size:15px">x</text><line x1="36" y1="70" x2="53" y2="70" stroke="#1F2A28" stroke-width="2"/><polygon points="62,70 53,74.5 53,65.5" fill="#1F2A28"/><rect x="64" y="44" width="60" height="52" rx="8" fill="#E3F0F8" stroke="#0072B2" stroke-width="2"/><text x="94" y="75" text-anchor="middle" style="font-weight:700;font-size:15px;fill:#0072B2">g</text><line x1="126" y1="70" x2="141" y2="70" stroke="#1F2A28" stroke-width="2"/><polygon points="150,70 141,74.5 141,65.5" fill="#1F2A28"/><text x="176" y="75" text-anchor="middle" style="font-weight:700;font-size:15px">g(x)</text><line x1="202" y1="70" x2="217" y2="70" stroke="#1F2A28" stroke-width="2"/><polygon points="226,70 217,74.5 217,65.5" fill="#1F2A28"/><rect x="228" y="44" width="60" height="52" rx="8" fill="#E4F1E8" stroke="#11592F" stroke-width="2"/><text x="258" y="75" text-anchor="middle" style="font-weight:700;font-size:15px;fill:#11592F">f</text><line x1="290" y1="70" x2="305" y2="70" stroke="#1F2A28" stroke-width="2"/><polygon points="314,70 305,74.5 305,65.5" fill="#1F2A28"/><text x="356" y="75" text-anchor="middle" style="font-weight:700;font-size:15px">f(g(x))</text><line x1="20" x2="380" y1="116" y2="116" stroke="#E2E6E4" stroke-width="1.5"/><text x="20" y="138" style="font-weight:700;font-size:12px">Worked example 1: g(2) = 0, then f(0) = 4</text><text x="22" y="187" text-anchor="middle" style="font-weight:700;font-size:15px">2</text><line x1="36" y1="182" x2="53" y2="182" stroke="#1F2A28" stroke-width="2"/><polygon points="62,182 53,186.5 53,177.5" fill="#1F2A28"/><rect x="64" y="156" width="60" height="52" rx="8" fill="#E3F0F8" stroke="#0072B2" stroke-width="2"/><text x="94" y="187" text-anchor="middle" style="font-weight:700;font-size:15px;fill:#0072B2">g</text><line x1="126" y1="182" x2="141" y2="182" stroke="#1F2A28" stroke-width="2"/><polygon points="150,182 141,186.5 141,177.5" fill="#1F2A28"/><text x="176" y="187" text-anchor="middle" style="font-weight:700;font-size:15px">0</text><line x1="202" y1="182" x2="217" y2="182" stroke="#1F2A28" stroke-width="2"/><polygon points="226,182 217,186.5 217,177.5" fill="#1F2A28"/><rect x="228" y="156" width="60" height="52" rx="8" fill="#E4F1E8" stroke="#11592F" stroke-width="2"/><text x="258" y="187" text-anchor="middle" style="font-weight:700;font-size:15px;fill:#11592F">f</text><line x1="290" y1="182" x2="305" y2="182" stroke="#1F2A28" stroke-width="2"/><polygon points="314,182 305,186.5 305,177.5" fill="#1F2A28"/><text x="356" y="187" text-anchor="middle" style="font-weight:700;font-size:15px">4</text></svg>