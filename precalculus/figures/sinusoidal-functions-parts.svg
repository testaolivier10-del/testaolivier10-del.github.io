<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="sinusoidal-functions-parts-t sinusoidal-functions-parts-d" font-family="Arial, Helvetica, sans-serif">
<title id="sinusoidal-functions-parts-t">Amplitude, midline and period of a sinusoidal function</title>
<desc id="sinusoidal-functions-parts-d">The graph of y = 3 sin(pi t / 4) + 5 for t from 0 to 10. The dashed midline y = 5 runs halfway between the maximum 8 and the minimum 2. A vertical arrow from the midline up to the maximum shows the amplitude, 3. A horizontal arrow from t = 0 to t = 8 shows one period, 8; the frequency is 1/8 of a cycle per unit of t.</desc>
