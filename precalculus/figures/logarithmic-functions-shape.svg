<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 390 290" width="390" height="290" role="img" aria-label="Graph of y = log base 2 of x with the points (1, 0), (2, 1), (4, 2) and (8, 3) and the vertical asymptote x = 0"><title>The basic shape of a logarithmic function</title><desc>y = log₂ x is defined only for x &gt; 0. Near the dashed vertical asymptote x = 0 the graph drops without bound. It crosses the x-axis at (1, 0), passes through (2, 1), (4, 2) and (8, 3), and keeps rising, more slowly each time: the graph is increasing and concave down.</desc><style>
