.pcalc-plot-pt.is-open{fill:#fff;}
text.s1{fill:#11592F;stroke:none;} text.s2{fill:#0072B2;stroke:none;} text.s3{fill:#D55E00;stroke:none;} text.s4{fill:#4A524F;stroke:none;}
