<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Graph of y = inverse tangent of x with dashed horizontal asymptotes at y = pi over 2 and y = negative pi over 2"><title>The inverse tangent function and its two horizontal asymptotes</title><desc>y = tan⁻¹ x is defined for every real x and always increases. It passes through (0, 0) and (1, π/4). Far to the right it levels off under the dashed line y = π/2; far to the left it levels off above the dashed line y = −π/2. Its outputs stay strictly between −π/2 and π/2.</desc><style>
