<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 380 290" width="380" height="290" role="img" aria-label="Graph of y = 2 to the x with the points (1, 2), (2, 4) and (3, 8) marked"><title>Reading a logarithm off an exponential graph</title><desc>The graph of y = 2^x passes through (1, 2), (2, 4) and (3, 8). A logarithm asks the reverse question: which input gives the output 8? The answer, 3, is log base 2 of 8.</desc><style>
