<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d">
<title id="t">A parametric curve with five marked points</title>
<desc id="d">The curve x(t) = t squared plus 1, y(t) = 4t minus t squared for t from 0 to 4, moving right the whole time, rising to a top point and falling again. Points are marked at t = 0 (1, 0), t = 1 (2, 3), t = 2 (5, 4), t = 3 (10, 3) and t = 4 (17, 0).</desc>
