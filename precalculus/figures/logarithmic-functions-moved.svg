<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 390 290" width="390" height="290" role="img" aria-label="Graphs of y = log base 2 of x and h(x) = log base 2 of (x + 4) - 1, whose vertical asymptote is x = -4"><title>A shift moves the vertical asymptote</title><desc>The blue graph is y = log₂ x, with vertical asymptote x = 0 and zero (1, 0). The green graph is h(x) = log₂(x + 4) − 1: the same shape moved 4 units left and 1 unit down. Its vertical asymptote is the dashed line x = −4, it is defined only for x &gt; −4, and it crosses the x-axis at (−2, 0).</desc><style>
