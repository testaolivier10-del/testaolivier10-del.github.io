<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" role="img" aria-labelledby="sine-cosine-curves-unroll-t sine-cosine-curves-unroll-d" font-family="Arial, Helvetica, sans-serif">
<title id="sine-cosine-curves-unroll-t">The graph of sine traced from the unit circle</title>
<desc id="sine-cosine-curves-unroll-d">Left: a circle of radius 1 with the point P at angle 2 pi over 3, whose height above the x-axis is sine of 2 pi over 3, about 0.87. Right: the graph of y = sin theta for theta from 0 to 2 pi in green, with the graph of y = cos theta dashed in blue for comparison. A dashed horizontal line carries the height of P across to the point (2 pi over 3, sin 2 pi over 3) on the sine graph. The sine graph starts at 0, rises to 1 at pi/2, returns to 0 at pi, falls to −1 at 3 pi over 2 and returns to 0 at 2 pi.</desc>
