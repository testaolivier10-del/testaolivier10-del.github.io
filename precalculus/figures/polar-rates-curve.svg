<title id="t">The polar graph of r = 1 + 2 sin theta</title>
<desc id="d">A polar grid with circles of radius 1, 2 and 3 and rays every pi/4 radians. The curve r = 1 + 2 sin theta is a limacon with an inner loop, opening upward. The large outer loop reaches highest straight above the pole and crosses the polar axis at distance 1 on each side of the pole. The curve passes through the pole twice, and a small inner loop lies above the pole, inside the outer loop.</desc>
