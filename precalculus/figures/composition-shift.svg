<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Graphs of f(x) = square root of x and of the composite f(g(x)) = square root of (x minus 2), where g(x) = x minus 2"><title>Composite as a shift</title><desc>The graph of f(x) = square root of x starts at (0, 0). The composite f(g(x)) with g(x) = x - 2 starts at (2, 0): every point of f moves 2 units right, because the inner function g subtracts 2 from each input first. The point (4, 2) on f becomes (6, 2) on f(g(x)).</desc><style>
