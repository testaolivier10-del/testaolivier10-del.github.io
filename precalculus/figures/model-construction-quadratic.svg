<title id="t">A quadratic model through three data points</title><desc id="d">Plant sales S(t), in hundreds, t months after March 1. The data points (1, 14), (3, 30) and (5, 30) lie on S(t) = -2t^2 + 16t, drawn for 0 &lt;= t &lt;= 8, the months when the model gives sales that are not negative. The highest point is (4, 32).</desc>
