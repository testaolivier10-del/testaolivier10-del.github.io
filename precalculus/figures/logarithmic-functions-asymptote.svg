<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 380 300" width="380" height="300" role="img" aria-label="Graph of g(x) = 2 log base 2 of (x minus 1), with its dashed vertical asymptote x = 1"><title>A logarithmic function near its asymptote</title><desc>g(x) = 2 log₂(x − 1) is defined only for x &gt; 1. Near the dashed asymptote x = 1 the graph drops without bound. It crosses the x-axis at (2, 0) and climbs slowly: each time x − 1 doubles, from (3, 2) to (5, 4) to (9, 6), g(x) goes up by the same 2.</desc><style>
