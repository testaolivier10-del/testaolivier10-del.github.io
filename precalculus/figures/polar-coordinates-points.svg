<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four points on a polar grid</title>
<desc id="d">A polar grid with circles of radius 1, 2, 3 and 4 around the pole and rays every pi/6 radians, labeled from 0 to 11 pi/6. Point P is on the circle of radius 3 on the ray at pi/6. Point Q is on the circle of radius 2 on the ray at 5 pi/6. Point R is on the circle of radius 4 on the ray at 3 pi/2, straight below the pole. Point S is on the circle of radius 1 on the ray at pi, to the left of the pole.</desc>
<rect width="520" height="520" fill="#FFFFFF"/>
<circle cx="260" cy="260" r="50" fill="none" stroke="#E1E6E3" stroke-width="1.2"/>
<circle cx="260" cy="260" r="100" fill="none" stroke="#E1E6E3" stroke-width="1.2"/>
<circle cx="260" cy="260" r="150" fill="none" stroke="#E1E6E3" stroke-width="1.2"/>
<circle cx="260" cy="260" r="200" fill="none" stroke="#E1E6E3" stroke-width="1.2"/>
<line x1="260" y1="260" x2="460" y2="260" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="482" y="265" font-size="14" fill="#5A6563" text-anchor="middle">0</text>
<line x1="260" y1="260" x2="433.21" y2="160" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="452.26" y="154" font-size="14" fill="#5A6563" text-anchor="middle">π/6</text>
<line x1="260" y1="260" x2="360" y2="86.79" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="371" y="72.74" font-size="14" fill="#5A6563" text-anchor="middle">π/3</text>
<line x1="260" y1="260" x2="260" y2="60" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="260" y="43" font-size="14" fill="#5A6563" text-anchor="middle">π/2</text>
<line x1="260" y1="260" x2="160" y2="86.79" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="149" y="72.74" font-size="14" fill="#5A6563" text-anchor="middle">2π/3</text>
<line x1="260" y1="260" x2="86.79" y2="160" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="67.74" y="154" font-size="14" fill="#5A6563" text-anchor="middle">5π/6</text>
<line x1="260" y1="260" x2="60" y2="260" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="38" y="265" font-size="14" fill="#5A6563" text-anchor="middle">π</text>
<line x1="260" y1="260" x2="86.79" y2="360" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="67.74" y="376" font-size="14" fill="#5A6563" text-anchor="middle">7π/6</text>
<line x1="260" y1="260" x2="160" y2="433.21" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="149" y="457.26" font-size="14" fill="#5A6563" text-anchor="middle">4π/3</text>
<line x1="260" y1="260" x2="260" y2="460" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="260" y="487" font-size="14" fill="#5A6563" text-anchor="middle">3π/2</text>
<line x1="260" y1="260" x2="360" y2="433.21" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="371" y="457.26" font-size="14" fill="#5A6563" text-anchor="middle">5π/3</text>
<line x1="260" y1="260" x2="433.21" y2="360" stroke="#E1E6E3" stroke-width="1.2"/>
<text x="452.26" y="376" font-size="14" fill="#5A6563" text-anchor="middle">11π/6</text>
<line x1="60" y1="260" x2="460" y2="260" stroke="#5A6563" stroke-width="1.4"/>
<line x1="260" y1="60" x2="260" y2="460" stroke="#5A6563" stroke-width="1.4"/>
<text x="213" y="276" font-size="13" fill="#5A6563" text-anchor="start">1</text>
<text x="163" y="276" font-size="13" fill="#5A6563" text-anchor="start">2</text>
<text x="113" y="276" font-size="13" fill="#5A6563" text-anchor="start">3</text>
<text x="63" y="276" font-size="13" fill="#5A6563" text-anchor="start">4</text>
<circle cx="260" cy="260" r="3" fill="#1F2A28"/>
<circle cx="389.9" cy="185" r="5" fill="#11592F" stroke="#11592F" stroke-width="2"/>
<text x="399.9" y="175" font-size="18" fill="#11592F" text-anchor="start" font-weight="bold">P</text>
<circle cx="173.4" cy="210" r="5" fill="#11592F" stroke="#11592F" stroke-width="2"/>
<text x="183.4" y="200" font-size="18" fill="#11592F" text-anchor="start" font-weight="bold">Q</text>
<circle cx="260" cy="460" r="5" fill="#11592F" stroke="#11592F" stroke-width="2"/>
<text x="274" y="464" font-size="18" fill="#11592F" text-anchor="start" font-weight="bold">R</text>
<circle cx="210" cy="260" r="5" fill="#11592F" stroke="#11592F" stroke-width="2"/>
<text x="204" y="248" font-size="18" fill="#11592F" text-anchor="end" font-weight="bold">S</text>
</svg>
