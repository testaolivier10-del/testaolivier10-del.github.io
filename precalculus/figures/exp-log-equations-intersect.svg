<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 380 290" width="380" height="290" role="img" aria-label="Graph of y = 2 to the x and the horizontal line y = 10, meeting where x = log base 2 of 10"><title>Solving an exponential equation</title><desc>The solution of 2^x = 10 is the input where the graph of y = 2^x meets the line y = 10. It lies between 3 (where 2^x = 8) and 4 (where 2^x = 16), at x = log₂ 10, about 3.32.</desc><style>
