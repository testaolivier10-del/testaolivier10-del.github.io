<title id="t">An exponential model from two points</title><desc id="d">The value V(t) of a phone, in dollars, t years after purchase. Two data points, (0, 800) and (2, 512), give the model V(t) = 800(0.8)^t, drawn for 0 &lt;= t &lt;= 8 and approaching the dashed asymptote V = 0. Each year the value is 80% of the year before.</desc>
