<circle cx="347.5" cy="108.45" r="5" fill="#11592F"/>
<text x="361.5" y="89.2" font-size="14" text-anchor="start" fill="#11592F" font-weight="bold">π/3</text>
<line x1="260" y1="260" x2="260" y2="85" stroke="#E4E7E6" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="260" cy="85" r="5" fill="#11592F"/>
<text x="260" y="62" font-size="14" text-anchor="middle" fill="#11592F" font-weight="bold">π/2</text>
