<text x="463" y="265" font-size="14" text-anchor="start" fill="#11592F" font-weight="bold">0</text>
<line x1="260" y1="260" x2="411.55" y2="172.5" stroke="#E4E7E6" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="411.55" cy="172.5" r="5" fill="#11592F"/>
<text x="435.8" y="163.5" font-size="14" text-anchor="start" fill="#11592F" font-weight="bold">π/6</text>
