<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="sine-cosine-values-special-t sine-cosine-values-special-d" font-family="Arial, Helvetica, sans-serif">
<title id="sine-cosine-values-special-t">Exact sine and cosine values at multiples of pi/6 and pi/4</title>
<desc id="sine-cosine-values-special-d">A circle of radius 1 centered at the origin with a dot at every multiple of pi/6 and pi/4 from 0 to 2 pi, each labeled with its angle in radians. The first-quadrant points are labeled with their coordinates: at pi/6, (square root of 3 over 2, 1/2); at pi/4, (square root of 2 over 2, square root of 2 over 2); at pi/3, (1/2, square root of 3 over 2). A table to the right lists cosine and sine at 0, pi/6, pi/4, pi/3 and pi/2: cosine 1, root 3 over 2, root 2 over 2, 1/2, 0 and sine 0, 1/2, root 2 over 2, root 3 over 2, 1. The other quadrants repeat these values with signs set by the quadrant.</desc>
<rect width="780" height="520" fill="#fff"/>
<line x1="45" y1="260" x2="475" y2="260" stroke="#1F2A28" stroke-width="1.4" stroke-linecap="round"/>
<line x1="260" y1="475" x2="260" y2="45" stroke="#1F2A28" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="260" cy="260" r="175" fill="none" stroke="#1F2A28" stroke-width="2"/>
<line x1="260" y1="260" x2="435" y2="260" stroke="#E4E7E6" stroke-width="1.2" stroke-linecap="round"/>
