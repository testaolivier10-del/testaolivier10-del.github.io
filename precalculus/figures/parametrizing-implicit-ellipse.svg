<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" width="400" height="310" role="img" aria-labelledby="t d">
<title id="t">An ellipse traced by (3 cos t, 2 sin t)</title>
<desc id="d">The ellipse x squared over 9 plus y squared over 4 = 1 traced by x(t) = 3 cos t, y(t) = 2 sin t. The trip starts at (3, 0) when t = 0 and arrows show counterclockwise travel. The point for t = pi/4 is marked at (3 cos(pi/4), 2 sin(pi/4)), about (2.12, 1.41); a dashed circle of radius 3 and the ellipse share the x-coordinate 3 cos t.</desc>
