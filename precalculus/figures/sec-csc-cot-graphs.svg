<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The secant function and the cosine it comes from</title>
<desc id="d">For x from 0 to 2 pi: the dashed cosine curve, and the graph of y = sec x = 1/cos x. Where cosine is 1 or -1, secant equals cosine. Where cosine is 0, at pi/2 and 3 pi/2, secant has dashed vertical asymptotes. Secant opens upward where cosine is positive and downward where cosine is negative, and its outputs are never between -1 and 1.</desc>
