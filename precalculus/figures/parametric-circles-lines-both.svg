<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d">
<title id="t">A parametric circle and a parametric line segment</title>
<desc id="d">Left: the circle x(t) = 2 cos t, y(t) = 2 sin t. The radius to the point at t = pi/3 makes angle t with the positive x-axis; the trip starts at (2, 0) when t = 0 and arrows show counterclockwise travel. Right: the segment x(t) = 1 + 4t, y(t) = 4 minus 3t from (1, 4) at t = 0 to (5, 1) at t = 1, with the midpoint (3, 2.5) at t = 0.5.</desc>
