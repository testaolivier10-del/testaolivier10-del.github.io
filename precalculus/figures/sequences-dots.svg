<title id="t">An arithmetic and a geometric sequence</title><desc id="d">Dots only, at whole-number inputs n = 0 to 5. The arithmetic sequence a_n = 2 + 5n (green: 2, 7, 12, 17, 22, 27) rises by 5 each step. The geometric sequence g_n = 2^n (blue squares: 1, 2, 4, 8, 16, 32) doubles each step and passes the arithmetic one at n = 5.</desc>
