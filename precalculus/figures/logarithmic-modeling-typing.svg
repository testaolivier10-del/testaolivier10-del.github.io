<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 290" width="400" height="290" role="img" aria-label="Typing speed against hours of practice: the points (1, 20), (3, 26), (9, 32), (27, 38), (81, 44) on the curve y = 20 + 6 log base 3 of x"><title>A logarithmic model through the typing data</title><desc>The five data points (1, 20), (3, 26), (9, 32), (27, 38) and (81, 44) lie on the curve y = 20 + 6 log₃ x. Each input is 3 times the one before, so the points spread out to the right, while each output is 6 more than the one before. The curve rises quickly at first and then more and more slowly.</desc><style>
