<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="sinusoidal-transformations-waterwheel-t sinusoidal-transformations-waterwheel-d" font-family="Arial, Helvetica, sans-serif">
<title id="sinusoidal-transformations-waterwheel-t">A waterwheel and the height of a point on its rim</title>
<desc id="sinusoidal-transformations-waterwheel-d">Left: a waterwheel whose center is above the water line, with the lower part of the wheel under water. A point P on the rim is at the top of the wheel. Right: an unscaled graph of h(t), the height of P above the water, for one turn of the wheel. The graph starts at its highest point F, falls through G to its lowest point J, which is below the t-axis, rises through K, and ends at the highest point M. G and K are halfway between the highest and lowest heights. The axes have no scale.</desc>
