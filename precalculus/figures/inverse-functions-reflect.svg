<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 360 340" width="360" height="340" role="img" aria-label="Graph of f(x) = x squared over 4 for x at least 0, its inverse, and the line y = x as a dashed mirror"><title>A function and its inverse</title><desc>f(x) = x²/4 for x ≥ 0 and its inverse f⁻¹(x) = 2√x are mirror images across the dashed line y = x. The point (2, 1) on f matches the point (1, 2) on the inverse: input and output trade places. The two graphs meet on the line y = x at (4, 4).</desc><style>
