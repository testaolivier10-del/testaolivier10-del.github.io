<title id="t">Residual plots for two models of the same data</title><desc id="d">Residuals (actual minus predicted followers) for a linear model (vermillion squares) and an exponential model (blue circles) of seven weekly follower counts. The linear residuals form a U: positive, then negative, then positive again. The exponential residuals stay near 0 with no pattern, so the exponential model is the better fit.</desc>
