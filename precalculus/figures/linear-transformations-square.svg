<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 310" width="370" height="310" role="img" aria-labelledby="t d">
<title id="t">The unit square and its image</title>
<desc id="d">The unit square with corners (0, 0), (1, 0), (1, 1) and (0, 1), dashed in gray, and its image under the matrix with rows (1, 1) and (0, 2), shaded green: a parallelogram with corners (0, 0), (1, 0), (2, 2) and (1, 2). The image of &lt;1, 0&gt; is &lt;1, 0&gt; (blue arrow) and the image of &lt;0, 1&gt; is &lt;1, 2&gt; (vermillion arrow), the two columns of the matrix.</desc>
