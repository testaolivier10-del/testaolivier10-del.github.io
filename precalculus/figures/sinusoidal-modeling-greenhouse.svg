<title id="sinusoidal-modeling-greenhouse-t">The temperature in a greenhouse over a day</title>
<desc id="sinusoidal-modeling-greenhouse-d">An unscaled graph of T(t), the temperature in a greenhouse, in degrees Celsius, t hours after midnight, for t from 4 to 28. The graph starts at a lowest point P, rises through Q to a highest point R, falls through S and ends at the next lowest point U. Q and S are halfway between the lowest and highest temperatures. The axes have no scale.</desc>
