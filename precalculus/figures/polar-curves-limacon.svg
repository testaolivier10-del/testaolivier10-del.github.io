<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The polar graph of r = 1 + 2 cos theta</title>
<desc id="d">A polar grid with circles of radius 1, 2 and 3 and rays every pi/4 radians. The curve r = 1 + 2 cos theta is a limacon with an inner loop. The large outer loop reaches farthest to the right along the polar axis and crosses the vertical axis at distance 1 above and below the pole. The curve passes through the pole twice, and a small inner loop lies to the right of the pole, inside the outer loop.</desc>
