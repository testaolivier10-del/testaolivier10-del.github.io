<title id="t">Data with one maximum and symmetry</title><desc id="d">Five data points (0, 2), (1, 5), (2, 6), (3, 5), (4, 2) rise to a single highest point at (2, 6) and fall back symmetrically. The quadratic model y = -x^2 + 4x + 2 passes through all five.</desc>
