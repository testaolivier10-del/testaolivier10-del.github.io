<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-labelledby="sinusoidal-transformations-shift-t sinusoidal-transformations-shift-d" font-family="Arial, Helvetica, sans-serif">
<title id="sinusoidal-transformations-shift-t">From y = sin theta to g(theta) = 2 sin(theta − pi/4) + 1</title>
<desc id="sinusoidal-transformations-shift-d">Dashed gray: the graph of y = sin theta. Green: the graph of g(theta) = 2 sin(theta − pi/4) + 1 for theta from −pi/4 to 9 pi over 4. Compared with sine, g is moved right by pi/4 (the phase shift, shown by an arrow from the origin to (pi/4, 1)), stretched vertically so its amplitude is 2, and moved up so its midline is y = 1 (dashed). Its maximum 3 is at 3 pi over 4 and its minimum −1 at 7 pi over 4; its period is still 2 pi.</desc>
