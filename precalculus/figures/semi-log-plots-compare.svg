<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 450" width="380" height="450" role="img" aria-label="The same exponential data on ordinary axes and on a semi-log plot"><title>The same exponential data on ordinary axes and on a semi-log plot</title><desc>Top: on ordinary axes from 0 to 200, the data y = 3·2^t for t = 0 to 6 hours (3, 6, 12, 24, 48, 96, 192 thousand bacteria) make a concave up curve; the first four points sit close to the horizontal axis and the last, (6, 192), is near the top. Bottom: on a vertical log scale where 1, 10, 100 and 1,000 are equally spaced, the same seven points lie on one straight line from (0, 3) to (6, 192).</desc><style>text{font:600 11px Arial,Helvetica,sans-serif;fill:#1F2A28;}</style><rect width="380" height="450" fill="#fff"/><line x1="58" x2="58" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="58" y="200" text-anchor="middle">0</text><line x1="109" x2="109" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="109" y="200" text-anchor="middle">1</text><line x1="160" x2="160" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="160" y="200" text-anchor="middle">2</text><line x1="211" x2="211" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="211" y="200" text-anchor="middle">3</text><line x1="262" x2="262" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="262" y="200" text-anchor="middle">4</text><line x1="313" x2="313" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="313" y="200" text-anchor="middle">5</text><line x1="364" x2="364" y1="34" y2="184" stroke="#E2E6E4" stroke-width="0.8"/><text x="364" y="200" text-anchor="middle">6</text><text x="58" y="22" style="font-weight:700;font-size:12px">Ordinary axis: equal steps add 50</text><text x="211" y="218" text-anchor="middle" style="font-weight:700;font-size:12px">hours, t</text><line x1="58" x2="364" y1="184" y2="184" stroke="#C9D0CD" stroke-width="1"/><text x="51" y="188" text-anchor="end">0</tex