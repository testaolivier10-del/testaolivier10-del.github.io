<title id="sinusoidal-modeling-spring-t">A weight on a spring and its height above the floor</title>
<desc id="sinusoidal-modeling-spring-d">Left: a weight hanging from a spring attached to a beam, above a floor, bobbing up and down. Right: an unscaled graph of h(t), the height of the bottom of the weight above the floor, for one cycle. The graph starts at its highest point F, falls through G to its lowest point J, rises through K and ends at the highest point M. G and K are halfway between the highest and lowest heights. The axes have no scale.</desc>
