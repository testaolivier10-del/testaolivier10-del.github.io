<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" width="460" height="350" role="img" aria-labelledby="t d">
<title id="t">A parametric curve traced as t increases</title>
<desc id="d">The curve x(t) = t squared minus 2t, y(t) = 2t minus 1 for t from -1 to 3, a parabola opening to the right. Points are marked at t = -1 (3, -3), t = 0 (0, -1), t = 1 (-1, 1), t = 2 (0, 3) and t = 3 (3, 5). Arrows show the point moves left and up until t = 1, then right and up.</desc>
