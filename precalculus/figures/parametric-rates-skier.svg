.pcalc-plot-line{stroke-width:1.8;}
.pcalc-plot-asym{stroke:#6B7470;stroke-width:1.4;stroke-dasharray:5 4;}
.pcalc-plot-pt{stroke-width:2;}
.s1{stroke:#11592F;} .s2{stroke:#0072B2;} .s3{stroke:#D55E00;} .s4{stroke:#6B7470;}
.pcalc-plot-pt.s1{fill:#11592F;} .pcalc-plot-pt.s2{fill:#0072B2;} .pcalc-plot-pt.s3{fill:#D55E00;} .pcalc-plot-pt.s4{fill:#6B7470;}
.pcalc-plot-pt.is-open{fill:#fff;}
text.s1{fill:#11592F;stroke:none;} text.s2{fill:#0072B2;stroke:none;} text.s3{fill:#D55E00;stroke:none;} text.s4{fill:#4A524F;stroke:none;}
