<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="The skier at t = 0, 2, 4 and 6 seconds, with the segment from (6, 46) to (30, 26) and its legs, change in x = 24 and change in y = -20"><title>The slope of the skier's path between t = 2 and t = 6</title><desc>Horizontal distance x and height y in meters. The skier is at (0, 50) at t = 0, (6, 46) at t = 2, (16, 38) at t = 4 and (30, 26) at t = 6. The segment from (6, 46) to (30, 26) has a horizontal leg of 24 and a vertical leg of −20, so its slope is −20/24 = −5/6.</desc><style>
