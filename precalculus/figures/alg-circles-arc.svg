<circle cx="175" cy="190" r="4" fill="#1F2A28"/>
<text x="165" y="210" font-size="16" text-anchor="start" fill="#1F2A28"><tspan font-style="italic">O</tspan></text>
<text x="235" y="212" font-size="18" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">r</tspan></text>
<text x="292.92" y="130" font-size="20" text-anchor="start" fill="#11592F" font-weight="bold"><tspan font-style="italic">s</tspan></text>
<text x="175" y="340" font-size="16" text-anchor="middle" fill="#1F2A28"><tspan font-style="italic">s</tspan> = (60/360) · 2π<tspan font-style="italic">r</tspan> = π<tspan font-style="italic">r</tspan>/3</text>
