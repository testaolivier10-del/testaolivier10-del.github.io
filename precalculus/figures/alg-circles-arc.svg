<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="alg-circles-arc-t alg-circles-arc-d" font-family="Arial, Helvetica, sans-serif">
<title id="alg-circles-arc-t">Arc length as a fraction of the circle, and the equation of a circle</title>
<desc id="alg-circles-arc-d">Left: a circle with center O and radius r. A central angle of 60 degrees cuts off an arc, drawn in green, of length s. Because 60 degrees is one sixth of 360 degrees, the arc is one sixth of the circumference 2 pi r. Right: on a coordinate grid, the circle with center (2, −1) and radius 3, whose equation is (x − 2) squared plus (y + 1) squared equals 9. The points (5, −1) and (2, 2) are marked on it, each 3 units from the center.</desc>
