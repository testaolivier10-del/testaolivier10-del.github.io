<svg xmlns="http://www.w3.org/2000/svg" class="pcalc-plot" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="Graph of y = log base 3 of x + log base 3 of (x - 8) for x greater than 8, crossing the line y = 2 at x = 9, with x = -1 marked outside the domain"><title>Why x = −1 is an extraneous solution</title><desc>The left side of the equation, y = log₃ x + log₃(x − 8), has a graph only where x &gt; 8, to the right of the dashed asymptote x = 8. That graph meets the dashed line y = 2 exactly once, at (9, 2). The other root of the quadratic, x = −1, marked with an open circle on the x-axis, is far outside the domain, so it solves nothing.</desc><style>
text{font:600 11px Arial,Helvetica,sans-serif;fill:#1F2A28;}
