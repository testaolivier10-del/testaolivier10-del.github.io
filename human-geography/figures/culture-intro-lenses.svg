<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ethnocentrism and cultural relativism</title>
<desc id="d">Diagram: one custom, eating with the right hand in many parts of India, judged two ways. Ethnocentrism judges it by the viewer's own culture and calls it bad manners. Cultural relativism understands it by its own culture and sees it as the polite way.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="470" fill="#FFFFFF"/>
<text x="320" y="34" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">One custom, two ways of judging it</text><rect x="150" y="54" width="340" height="74" rx="10" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="86" font-size="18" fill="#1F2A28" text-anchor="middle">The custom: in many parts of India,</text><text x="320" y="109" font-size="18" fill="#1F2A28" text-anchor="middle">people eat with the right hand.</text><line x1="250" y1="130" x2="160" y2="186" stroke="#C24E00" stroke-width="2.6" marker-end="url(#ar-verm)" stroke-linecap="round"/><line x1="390" y1="130" x2="480" y2="186" stroke="#009E73" stroke-width="2.6" marker-end="url(#ar-green)" stroke-linecap="round"/><rect x="20" y="192" width="290" height="70" rx="10" fill="#FBE6D9" stroke="#C24E00" stroke-width="2"/><text x="165" y="234.6" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">Ethnocentrism</text><rect x="330" y="192" width="290" height="70" rx="10" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="475" y="234.6" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">Cultural relativism</text><text x="32" y="296" font-size="17" fill="#1F2A28">Judges the custom by the</text><text x="32" y="317.8" font-size="17" fill="#1F2A28">viewer's own culture.</text><text x="342" y="296" font-size="17" fill="#1F2A28">Tries to understand the</text><text x="342" y="317.8" font-size="17" fill="#1F2A28">custom by its own culture.</text><rect x="20" y="348" width="290" height="92" rx="16" fill="#FFFFFF" stroke="#C24E00" stroke-width="2"/><text x="165" y="389" font-size="18" fill="#1F2A28" text-anchor="middle">&quot;Eating with your hands</text><text x="165" y="412" font-size="18" fill="#1F2A28" text-anchor="middle">is bad manners.&quot;</text><rect x="330" y="348" width="290" height="92" rx="16" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/><text x="475" y="389" font-size="18" fill="#1F2A28" text-anchor="middle">&quot;Here, eating with the right</text><text x="475" y="412" font-size="18" fill="#1F2A28" text-anchor="middle">hand is the polite way.&quot;</text>
</svg>
