<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Acculturation, assimilation, syncretism and multiculturalism</title>
<desc id="d">Four cards. Acculturation: a group adopts some traits of another culture and keeps its own. Assimilation: a group takes on the other culture so fully that its own traits fade away. Syncretism: traits blend into something new that neither culture had before. Multiculturalism: many cultures live side by side and each keeps its own traits.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="600" fill="#FFFFFF"/>
<text x="320" y="32" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">When two cultures meet</text><rect x="20" y="60" width="290" height="244" rx="12" fill="#F4F7F9" stroke="#094953" stroke-width="2"/><text x="165" y="96" font-size="21" fill="#094953" text-anchor="middle" font-weight="700">Acculturation</text><circle cx="110" cy="152" r="18" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="136" cy="152" r="12" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="165" y="216" font-size="17" fill="#1F2A28" text-anchor="middle">Adopts some traits of the</text><text x="165" y="237.8" font-size="17" fill="#1F2A28" text-anchor="middle">other culture and keeps</text><text x="165" y="259.5" font-size="17" fill="#1F2A28" text-anchor="middle">its own.</text><rect x="330" y="60" width="290" height="244" rx="12" fill="#F4F7F9" stroke="#094953" stroke-width="2"/><text x="475" y="96" font-size="21" fill="#094953" text-anchor="middle" font-weight="700">Assimilation</text><circle cx="420" cy="152" r="18" fill="#C24E00" stroke="#094953" stroke-width="3"/><line x1="444" y1="152" x2="468" y2="152" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)" stroke-linecap="round"/><circle cx="486" cy="152" r="18" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="475" y="216" font-size="17" fill="#1F2A28" text-anchor="middle">Takes on the other culture</text><text x="475" y="237.8" font-size="17" fill="#1F2A28" text-anchor="middle">so fully that its own traits</text><text x="475" y="259.5" font-size="17" fill="#1F2A28" text-anchor="middle">fade away.</text><rect x="20" y="322" width="290" height="244" rx="12" fill="#F4F7F9" stroke="#094953" stroke-width="2"/><text x="165" y="358" font-size="21" fill="#094953" text-anchor="middle" font-weight="700">Syncretism</text><circle cx="110" cy="414" r="16" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="132" cy="414" r="16" fill="#C24E00" stroke="none" stroke-width="1.4"/><line x1="154" y1="414" x2="172" y2="414" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)" stroke-linecap="round"/><circle cx="190" cy="414" r="18" fill="#A8508A" stroke="none" stroke-width="1.4"/><text x="165" y="478" font-size="17" fill="#1F2A28" text-anchor="middle">Traits blend into something</text><text x="165" y="499.8" font-size="17" fill="#1F2A28" text-anchor="middle">new that neither culture</text><text x="165" y="521.5" font-size="17" fill="#1F2A28" text-anchor="middle">had before.</text><rect x="330" y="322" width="290" height="244" rx="12" fill="#F4F7F9" stroke="#094953" stroke-width="2"/><text x="475" y="358" font-size="21" fill="#094953" text-anchor="middle" font-weight="700">Multiculturalism</text><circle cx="420" cy="414" r="14" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="452" cy="414" r="14" fill="#C24E00" stroke="none" stroke-width="1.4"/><circle cx="484" cy="414" r="14" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="516" cy="414" r="14" fill="#A8508A" stroke="none" stroke-width="1.4"/><text x="475" y="478" font-size="17" fill="#1F2A28" text-anchor="middle">Many cultures live side by</text><text x="475" y="499.8" font-size="17" fill="#1F2A28" text-anchor="middle">side and each keeps its</text><text x="475" y="521.5" font-size="17" fill="#1F2A28" text-anchor="middle">own traits.</text>
</svg>
