<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="economic-sectors-ladder-t economic-sectors-ladder-d" font-family="Arial, Helvetica, sans-serif">
<title id="economic-sectors-ladder-t">The five economic sectors</title>
<desc id="economic-sectors-ladder-d">Five stacked bands, from the bottom up. Primary: taking from nature, such as farming, mining and fishing. Secondary: making goods in factories and building. Tertiary: services such as shops, transport and health care. Quaternary: information and research, such as scientists, software and finance. Quinary: top decisions by the heads of big firms and governments.</desc>
<defs><marker id="economic-sectors-ladder-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="440" fill="#FFFFFF"/>
<rect x="20" y="16" width="600" height="72" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="36" y="59.4" font-size="21" font-weight="700" fill="#7A4F9E" text-anchor="start">Quinary</text><text x="220" y="46.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="start">Top decisions</text><text x="220" y="72.0" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="start">Heads of big firms and governments</text><rect x="20" y="100" width="600" height="72" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="36" y="143.3" font-size="21" font-weight="700" fill="#094953" text-anchor="start">Quaternary</text><text x="220" y="130.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="start">Information and research</text><text x="220" y="155.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="start">Scientists, software, finance</text><rect x="20" y="184" width="600" height="72" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="36" y="227.3" font-size="21" font-weight="700" fill="#007A5A" text-anchor="start">Tertiary</text><text x="220" y="214.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="start">Services</text><text x="220" y="239.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="start">Shops, transport, health care</text><rect x="20" y="268" width="600" height="72" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="36" y="311.4" font-size="21" font-weight="700" fill="#C24E00" text-anchor="start">Secondary</text><text x="220" y="298.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="start">Making goods</text><text x="220" y="323.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="start">Factories, building</text><rect x="20" y="352" width="600" height="72" rx="12" fill="#F2F2EF" stroke="#1F2A28" stroke-width="2"/><text x="36" y="395.4" font-size="21" font-weight="700" fill="#1F2A28" text-anchor="start">Primary</text><text x="220" y="382.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="start">Taking from nature</text><text x="220" y="407.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="start">Farming, mining, fishing</text>
