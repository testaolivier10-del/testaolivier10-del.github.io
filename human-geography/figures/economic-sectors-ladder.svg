<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" width="640" height="494" role="img" aria-labelledby="economic-sectors-ladder-t economic-sectors-ladder-d" font-family="Arial, Helvetica, sans-serif">
<title id="economic-sectors-ladder-t">The five economic sectors</title>
<desc id="economic-sectors-ladder-d">Five stacked bands, from the bottom up. Primary: taking from nature, such as farming, mining and fishing. Secondary: making goods in factories and building. Tertiary: services such as shops, transport and health care. Quaternary: information and research, such as science, software and finance. Quinary: top decisions by the heads of firms and governments.</desc>
<defs><marker id="economic-sectors-ladder-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="494" fill="#FFFFFF"/>
