<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="city-structure-zones-t city-structure-zones-d" font-family="Arial, Helvetica, sans-serif">
<title id="city-structure-zones-t">A city model with numbered zones</title>
<desc id="city-structure-zones-d">A city model of five rings around one center, numbered 1 at the center to 5 at the outer edge. The rings are equal bands with no wedges. A lake lies along the east side, so the rings are drawn as half circles open to the lake. A railroad enters zone 2 from the west.</desc>
<rect x="0" y="0" width="600" height="470" fill="#FFFFFF" /><rect x="470" y="20" width="110" height="430" fill="#CFE6F5" /><text x="525" y="235" font-size="15" text-anchor="middle" font-weight="bold" fill="#094953"><tspan x="525" dy="0">Lake</tspan></text><path d="M470 10 A225 225 0 0 0 470 460 Z" fill="#E8F1D2" stroke="#1F2A28" stroke-width="1.5"/><path d="M470 55 A180 180 0 0 0 470 415 Z" fill="#D4F0E6" stroke="#1F2A28" stroke-width="1.5"/><path d="M470 100 A135 135 0 0 0 470 370 Z" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1.5"/><path d="M470 145 A90 90 0 0 0 470 325 Z" fill="#F8DCC8" stroke="#1F2A28" stroke-width="1.5"/><path d="M470 190 A45 45 0 0 0 470 280 Z" fill="#D7ECEF" stroke="#1F2A28" stroke-width="1.5"/><line x1="20" y1="205" x2="405" y2="205" stroke="#6B6F6C" stroke-width="3" stroke-dasharray="10 6"/><text x="30" y="196" font-size="14" text-anchor="start" font-weight="normal" fill="#6B6F6C"><tspan x="30" dy="0">Railroad</tspan></text><circle cx="447" cy="235" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="447" y="240" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="447" dy="0">1</tspan></text><circle cx="420" cy="279" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="420" y="284" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="420" dy="0">2</tspan></text><circle cx="386" cy="309" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="386" y="314" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="386" dy="0">3</tspan></text><circle cx="352" cy="339" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="352" y="344" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="352" dy="0">4</tspan></text><circle cx="318" cy="368" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="318" y="373" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="318" dy="0">5</tspan></text>
