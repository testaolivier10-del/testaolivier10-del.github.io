<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="city-size-distribution-central-place-t city-size-distribution-central-place-d" font-family="Arial, Helvetica, sans-serif">
<title id="city-size-distribution-central-place-t">Central place theory: market areas as hexagons</title>
<desc id="city-size-distribution-central-place-d">One large city sits at the center of a big hexagon, its market area. Six towns sit around it, each at the center of a smaller hexagon. Villages sit at the corners of the small hexagons. A key explains that higher-order places are fewer, farther apart and offer goods with a larger range and threshold.</desc>
<rect x="0" y="0" width="820" height="460" fill="#FFFFFF" /><polygon points="410.6,154.6 410.6,305.4 280.0,380.8 149.4,305.4 149.4,154.6 280.0,79.2" fill="#D7ECEF" stroke="#094953" stroke-width="2.5"/><polygon points="430.6,201.0 430.6,259.0 380.3,288.0 330.1,259.0 330.1,201.0 380.3,172.0" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="380.4,287.9 380.4,345.9 330.2,374.9 279.9,345.9 279.9,287.9 330.2,258.9" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="280.1,287.9 280.1,345.9 229.8,374.9 179.6,345.9 179.6,287.9 229.8,258.9" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="229.9,201.0 229.9,259.0 179.7,288.0 129.4,259.0 129.4,201.0 179.7,172.0" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="280.1,114.1 280.1,172.1 229.8,201.1 179.6,172.1 179.6,114.1 229.8,85.1" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="380.4,114.1 380.4,172.1 330.2,201.1 279.9,172.1 279.9,114.1 330.2,85.1" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5" fill-opacity="0.85"/><polygon points="330.2,201.0 330.2,259.0 280.0,288.0 229.8,259.0 229.8,201.0 280.0,172.0" fill="#F3EEDF" stroke="#C24E00" stroke-width="1.5"/><circle cx="380.34000000000003" cy="230" r="8" fill="#C24E00" /><circle cx="330.2294734194974" cy="259" r="5" fill="#009E73" /><circle cx="330.17" cy="316.8969890157306" r="8" fill="#C24E00" /><circle cx="280" cy="288" r="5" fill="#009E73" /><circle cx="229.83" cy="316.8969890157306" r="8" fill="#C24E00" /><circle cx="229.77052658050255" cy="259" r="5" fill="#009E73" /><circle cx="179.66" cy="230" r="8" fill="#C24E00" /><circle cx="229.77052658050258" cy="201" r="5" fill="#009E73" /><circle cx="229.82999999999996" cy="143.10301098426945" r="8" fill="#C24E00" /><circle cx="280" cy="172" r="5" fill="#009E73" /><circle cx="330.17" cy="143.10301098426942" r="8" fill="#C24E00" /><circle cx="330.2294734194974" cy="200.99999999999997" r="5" fill="#009E73" /><circle cx="280" cy="230" r="13" fill="#094953" /><rect x="540" y="60" width="260" height="300" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="555" y="88" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2A28"><tspan x="555" dy="0">Key</tspan></text><circle cx="565" cy="115" r="12" fill="#094953" /><text x="588" y="120" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="588" dy="0">City: rare goods (a big</tspan></text><text x="588" y="138" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="588" dy="0">hospital, a stadium)</tspan></text><circle cx="565" cy="168" r="8" fill="#C24E00" /><text x="588" y="173" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="588" dy="0">Town: a supermarket,</tspan></text><text x="588" y="191" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="588" dy="0">a high school</tspan></text><circle cx="565" cy="220" r="5" fill="#009E73" /><text x="588" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="588" dy="0">Village: a gas station</tspan></text><text x="555" y="262" font-size="14" text-anchor="start" font-weight="bold" fill="#1F2A28"><tspan x="555" dy="0">Range: how far people will</tspan></text><text x="555" y="280" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="555" dy="0">travel for a good.</tspan></text><text x="555" y="310" font-size="14" text-anchor="start" font-weight="bold" fill="#1F2A28"><tspan x="555" dy="0">Threshold: how many buyers</tspan></text><text x="555" y="328" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="555" dy="0">a seller needs to stay open.</tspan></text><text x="410" y="440" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">Hexagons fill a plain with no gaps or overlaps, which is why the model uses them.</tspan></text>
</svg>
