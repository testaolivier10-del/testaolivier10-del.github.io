<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A four-field crop rotation</title>
<desc id="d">Four fields in a square, linked by arrows that go around in a circle: wheat (grain to sell), then turnips (winter feed for animals), then barley (grain), then clover (grazing that puts nitrogen back in the soil), then wheat again. Each year every field moves to the next crop. No field is left empty, so the farm grows more food and can feed more animals. This rotation spread from Norfolk, England, in the 1700s.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<text x="360" y="30" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">A four-field rotation (Norfolk, England, 1700s)</text><rect x="150" y="60" width="190" height="150" rx="6" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.8"/><text x="245" y="110" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Wheat</text><text x="245" y="144" font-size="15" fill="#1F2A28" text-anchor="middle">grain to sell</text><rect x="380" y="60" width="190" height="150" rx="6" fill="#E9C9B0" stroke="#1F2A28" stroke-width="1.8"/><text x="475" y="110" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Turnips</text><text x="475" y="144" font-size="15" fill="#1F2A28" text-anchor="middle">winter feed</text><text x="475" y="163.5" font-size="15" fill="#1F2A28" text-anchor="middle">for animals</text><rect x="380" y="250" width="190" height="150" rx="6" fill="#EFE2A4" stroke="#1F2A28" stroke-width="1.8"/><text x="475" y="300" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Barley</text><text x="475" y="334" font-size="15" fill="#1F2A28" text-anchor="middle">grain</text><rect x="150" y="250" width="190" height="150" rx="6" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.8"/><text x="245" y="300" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Clover</text><text x="245" y="334" font-size="15" fill="#1F2A28" text-anchor="middle">grazing; puts</text><text x="245" y="353.5" font-size="15" fill="#1F2A28" text-anchor="middle">nitrogen in soil</text><path d="M342,135 L376,135" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-teal)"/><path d="M475,212 L475,246" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-teal)"/><path d="M376,325 L342,325" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-teal)"/><path d="M245,246 L245,212" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-teal)"/><text x="16" y="120" font-size="15" fill="#094953" font-weight="700">Each year,</text><text x="16" y="139.5" font-size="15" fill="#094953" font-weight="700">every field</text><text x="16" y="159" font-size="15" fill="#094953" font-weight="700">moves to the</text><text x="16" y="178.5" font-size="15" fill="#094953" font-weight="700">next crop.</text><text x="584" y="120" font-size="15" fill="#094953" font-weight="700">No field is</text><text x="584" y="139.5" font-size="15" fill="#094953" font-weight="700">left empty,</text><text x="584" y="159" font-size="15" fill="#094953" font-weight="700">so more food</text><text x="584" y="178.5" font-size="15" fill="#094953" font-weight="700">and more</text><text x="584" y="198" font-size="15" fill="#094953" font-weight="700">animals.</text>
</svg>
