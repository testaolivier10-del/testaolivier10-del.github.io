<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 516" width="480" height="516" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A four-field crop rotation</title>
<desc id="d">Four fields in a square, linked by arrows that go around in a circle: wheat (grain to sell), then turnips (winter feed for animals), then barley (grain), then clover (grazing that adds nitrogen to the soil), then wheat again. Each year every field moves to the next crop, so no field is left empty and the farm can feed more animals. This rotation spread from Norfolk, England, in the 1700s.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="516" fill="#FFFFFF"/>
<text x="240" y="30" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">A four-field rotation</text><text x="240" y="56" font-size="17" fill="#5F6B68" text-anchor="middle">(Norfolk, England, 1700s)</text><rect x="24" y="80" width="200" height="160" rx="6" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.8"/><text x="124" y="132" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">Wheat</text><text x="124" y="170" font-size="18" fill="#1F2A28" text-anchor="middle">grain to sell</text><rect x="256" y="80" width="200" height="160" rx="6" fill="#E9C9B0" stroke="#1F2A28" stroke-width="1.8"/><text x="356" y="132" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">Turnips</text><text x="356" y="170" font-size="18" fill="#1F2A28" text-anchor="middle">winter feed</text><text x="356" y="193.4" font-size="18" fill="#1F2A28" text-anchor="middle">for animals</text><rect x="256" y="280" width="200" height="160" rx="6" fill="#EFE2A4" stroke="#1F2A28" stroke-width="1.8"/><text x="356" y="332" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">Barley</text><text x="356" y="370" font-size="18" fill="#1F2A28" text-anchor="middle">grain</text><rect x="24" y="280" width="200" height="160" rx="6" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.8"/><text x="124" y="332" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">Clover</text><text x="124" y="370" font-size="18" fill="#1F2A28" text-anchor="middle">grazing; adds</text><text x="124" y="393.4" font-size="18" fill="#1F2A28" text-anchor="middle">nitrogen to soil</text><line x1="226" y1="160" x2="252" y2="160" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><line x1="356" y1="242" x2="356" y2="276" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><line x1="254" y1="360" x2="228" y2="360" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><line x1="124" y1="278" x2="124" y2="244" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><text x="240" y="476" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">Each year every field moves to the next</text><text x="240" y="498.1" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">crop, so no field is left empty.</text>
</svg>
