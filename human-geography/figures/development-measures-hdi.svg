<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="development-measures-hdi-t development-measures-hdi-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-measures-hdi-t">The three parts of the Human Development Index</title>
<desc id="development-measures-hdi-d">Three boxes feed one. Health is measured by life expectancy, education by years of schooling, and income by income per person (GNI). Together they make the Human Development Index, one number from 0 to 1. Higher means longer, healthier, better-schooled lives and more income; it hides who gets the income.</desc>
<defs><marker id="development-measures-hdi-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="440" fill="#FFFFFF"/>
<rect x="8" y="12" width="202" height="130" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="109" y="48.4" font-size="24" font-weight="700" fill="#007A5A" text-anchor="middle">Health</text><text x="109" y="89.0" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">Life</text><text x="109" y="116.5" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">expectancy</text><rect x="219" y="12" width="202" height="130" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="48.4" font-size="24" font-weight="700" fill="#094953" text-anchor="middle">Education</text><text x="320" y="89.0" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">Years of</text><text x="320" y="116.5" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">schooling</text><rect x="430" y="12" width="202" height="130" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="531" y="48.4" font-size="24" font-weight="700" fill="#C24E00" text-anchor="middle">Income</text><text x="531" y="89.0" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">Income per</text><text x="531" y="116.5" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">person (GNI)</text><line x1="109" y1="142" x2="230" y2="214" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><line x1="320" y1="142" x2="320" y2="214" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><line x1="531" y1="142" x2="410" y2="214" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><rect x="90" y="220" width="460" height="104" rx="12" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="320" y="265.4" font-size="24" font-weight="700" fill="#1F2A28" text-anchor="middle">Human Development Index</text><text x="320" y="295.4" font-size="24" font-weight="700" fill="#1F2A28" text-anchor="middle">one number from 0 to 1</text><text x="320" y="369.7" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">Higher means longer, healthier,</text><text x="320" y="399.7" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">better-schooled lives and more income.</text><text x="320" y="429.7" font-size="22" font-weight="700" fill="#1F2A28" text-anchor="middle">It hides who gets the income.</text>
</svg>
