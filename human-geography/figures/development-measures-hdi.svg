<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="development-measures-hdi-t development-measures-hdi-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-measures-hdi-t">The three parts of the Human Development Index</title>
<desc id="development-measures-hdi-d">Three boxes feed one. Health is measured by life expectancy at birth, education by years of schooling, and income by income per person (GNI). Together they make the Human Development Index, one number from 0 to 1. Higher means longer, healthier, better-schooled lives and more income; it shows nothing about who gets the income.</desc>
<defs><marker id="development-measures-hdi-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="410" fill="#FFFFFF"/>
<rect x="16" y="20" width="192" height="120" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="112" y="48.3" font-size="18" font-weight="700" fill="#007A5A" text-anchor="middle">Health</text><text x="112" y="90.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Life expectancy</text><text x="112" y="111.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">at birth</text><rect x="224" y="20" width="192" height="120" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="48.3" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">Education</text><text x="320" y="90.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Years of</text><text x="320" y="111.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">schooling</text><rect x="432" y="20" width="192" height="120" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="528" y="48.3" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">Income</text><text x="528" y="90.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Income per</text><text x="528" y="111.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">person (GNI)</text><line x1="112" y1="140" x2="250" y2="222" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><line x1="320" y1="140" x2="320" y2="222" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><line x1="528" y1="140" x2="390" y2="222" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-measures-hdi-ar)"/><rect x="150" y="228" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="320" y="272.8" font-size="19" font-weight="700" fill="#1F2A28" text-anchor="middle">Human Development Index</text><text x="320" y="296.5" font-size="19" font-weight="700" fill="#1F2A28" text-anchor="middle">one number from 0 to 1</text><text x="320" y="367.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Higher means longer, healthier, better-schooled lives</text><text x="320" y="395.9" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">and more income. It shows nothing about who gets it.</text>
</svg>
