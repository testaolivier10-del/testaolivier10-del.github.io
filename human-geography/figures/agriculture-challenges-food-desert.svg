<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" width="480" height="556" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An invented town: where fresh food is sold</title>
<desc id="d">A drawn street grid of an invented town. One supermarket, marked S, is in the northeast, with a circle showing everything within 1 mile of it. Neighborhood N, in the southwest, is outside that circle; it has two corner stores, marked C, that sell snacks and little fresh food. A bus line runs east to west between the neighborhood and the supermarket.</desc>
