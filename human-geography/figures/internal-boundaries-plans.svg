<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="internal-boundaries-plans-t internal-boundaries-plans-d" font-family="Arial, Helvetica, sans-serif">
<title id="internal-boundaries-plans-t">Two districting plans for one county</title>
<desc id="internal-boundaries-plans-d">Two copies of the same invented county, each a 5 by 5 grid of 25 blocks of 100 voters. In both, the three left columns (15 blocks) vote mostly for Party X and the two right columns (10 blocks) vote mostly for Party Y. Plan 1 draws five districts as the five columns, so X wins 3 seats and Y wins 2. Plan 2 makes the two left columns into two all-X districts and draws the other three districts as bent shapes that each hold 3 or 4 Y blocks and only 1 or 2 X blocks, so X wins 2 seats and Y wins 3.</desc>
<rect width="480" height="360" fill="#FFFFFF"/>
