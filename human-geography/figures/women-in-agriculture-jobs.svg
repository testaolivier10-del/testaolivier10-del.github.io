<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" width="480" height="490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Share of working women and men employed in agrifood systems</title>
<desc id="d">A bar chart from FAO, The Status of Women in Agrifood Systems, 2023. Share of workers whose job is in agrifood systems: world, 36% of working women and 38% of working men; Sub-Saharan Africa, 66% of women and 60% of men; Southern Asia, 71% of women and 47% of men.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="490" fill="#FFFFFF"/>
<line x1="58" y1="380" x2="470" y2="380" stroke="#1F2A28" stroke-width="2"/><text x="50" y="386" font-size="16" fill="#1F2A28" text-anchor="end">0%</text><line x1="58" y1="317.5" x2="470" y2="317.5" stroke="#E3E8E7" stroke-width="1"/><text x="50" y="323.5" font-size="16" fill="#1F2A28" text-anchor="end">20%</text><line x1="58" y1="255" x2="470" y2="255" stroke="#E3E8E7" stroke-width="1"/><text x="50" y="261" font-size="16" fill="#1F2A28" text-anchor="end">40%</text><line x1="58" y1="192.5" x2="470" y2="192.5" stroke="#E3E8E7" stroke-width="1"/><text x="50" y="198.5" font-size="16" fill="#1F2A28" text-anchor="end">60%</text><line x1="58" y1="130" x2="470" y2="130" stroke="#E3E8E7" stroke-width="1"/><text x="50" y="136" font-size="16" fill="#1F2A28" text-anchor="end">80%</text><rect x="76" y="267.5" width="50" height="112.5" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="101" y="259.5" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">36%</text><rect x="130" y="261.3" width="50" height="118.8" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="155" y="253.3" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">38%</text><text x="128" y="406" font-size="17" fill="#1F2A28" text-anchor="middle">World</text><rect x="216" y="173.8" width="50" height="206.3" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="241" y="165.8" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">66%</text><rect x="270" y="192.5" width="50" height="187.5" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="295" y="184.5" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">60%</text><text x="268" y="406" font-size="17" fill="#1F2A28" text-anchor="middle">Sub-Saharan</text><text x="268" y="428.1" font-size="17" fill="#1F2A28" text-anchor="middle">Africa</text><rect x="356" y="158.1" width="50" height="221.9" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="381" y="150.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">71%</text><rect x="410" y="233.1" width="50" height="146.9" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="435" y="225.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">47%</text><text x="408" y="406" font-size="17" fill="#1F2A28" text-anchor="middle">Southern</text><text x="408" y="428.1" font-size="17" fill="#1F2A28" text-anchor="middle">Asia</text><text x="10" y="26" font-size="18" fill="#1F2A28" font-weight="700">Share of workers whose job</text><text x="10" y="49.4" font-size="18" fill="#1F2A28" font-weight="700">is in agrifood systems</text><rect x="10" y="74" width="22" height="18" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="40" y="90" font-size="17" fill="#1F2A28">Working women</text><rect x="220" y="74" width="22" height="18" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="250" y="90" font-size="17" fill="#1F2A28">Working men</text><text x="240" y="456" font-size="16" fill="#5F6B68" text-anchor="middle">Source: FAO, The Status of Women in</text><text x="240" y="476.8" font-size="16" fill="#5F6B68" text-anchor="middle">Agrifood Systems, 2023.</text>
</svg>
