<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Share of working women and men employed in agrifood systems</title>
<desc id="d">A bar chart from FAO, The Status of Women in Agrifood Systems, 2023. Share of workers whose job is in agrifood systems: world, 36% of working women and 38% of working men; Sub-Saharan Africa, 66% of women and 60% of men; Southern Asia, 71% of women and 47% of men.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="440" fill="#FFFFFF"/>
<line x1="70" y1="360" x2="700" y2="360" stroke="#1F2A28" stroke-width="2"/><text x="60" y="365" font-size="15" fill="#1F2A28" text-anchor="end">0%</text><line x1="70" y1="295" x2="700" y2="295" stroke="#E3E8E7" stroke-width="1"/><text x="60" y="300" font-size="15" fill="#1F2A28" text-anchor="end">20%</text><line x1="70" y1="230" x2="700" y2="230" stroke="#E3E8E7" stroke-width="1"/><text x="60" y="235" font-size="15" fill="#1F2A28" text-anchor="end">40%</text><line x1="70" y1="165" x2="700" y2="165" stroke="#E3E8E7" stroke-width="1"/><text x="60" y="170" font-size="15" fill="#1F2A28" text-anchor="end">60%</text><line x1="70" y1="100" x2="700" y2="100" stroke="#E3E8E7" stroke-width="1"/><text x="60" y="105" font-size="15" fill="#1F2A28" text-anchor="end">80%</text><rect x="110" y="243" width="60" height="117" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="140" y="235" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">36%</text><rect x="176" y="236.5" width="60" height="123.5" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="206" y="228.5" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">38%</text><text x="173" y="384" font-size="15" fill="#1F2A28" text-anchor="middle">World</text><rect x="320" y="145.5" width="60" height="214.5" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="350" y="137.5" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">66%</text><rect x="386" y="165" width="60" height="195" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="416" y="157" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">60%</text><text x="383" y="384" font-size="15" fill="#1F2A28" text-anchor="middle">Sub-Saharan</text><text x="383" y="403.5" font-size="15" fill="#1F2A28" text-anchor="middle">Africa</text><rect x="530" y="129.3" width="60" height="230.8" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="560" y="121.3" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">71%</text><rect x="596" y="207.3" width="60" height="152.8" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="626" y="199.3" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">47%</text><text x="593" y="384" font-size="15" fill="#1F2A28" text-anchor="middle">Southern Asia</text><rect x="470" y="14" width="22" height="18" rx="0" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="500" y="29" font-size="15" fill="#1F2A28">Working women</text><rect x="470" y="40" width="22" height="18" rx="0" fill="#094953" stroke="none" stroke-width="1.6"/><text x="500" y="55" font-size="15" fill="#1F2A28">Working men</text><text x="10" y="24" font-size="15" fill="#1F2A28" font-weight="700">Share of workers</text><text x="10" y="43.5" font-size="15" fill="#1F2A28" font-weight="700">whose job is in</text><text x="10" y="63" font-size="15" fill="#1F2A28" font-weight="700">agrifood systems</text><text x="360" y="426" font-size="15" fill="#5F6B68" text-anchor="middle">Source: FAO, The Status of Women in Agrifood Systems, 2023.</text>
