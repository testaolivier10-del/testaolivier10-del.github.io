<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The five stages of the demographic transition model</title>
<desc id="d">Graph of the demographic transition model in five stages. The birth rate stays high in stages 1 and 2, falls in stage 3 and is low in stages 4 and 5. The death rate is high in stage 1, falls in stage 2 and stays low, rising a little in stage 5, where it is above the birth rate. A dashed line shows total population rising slowly, then fast, then leveling and falling slightly.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">The demographic transition model</text><rect x="70" y="70" width="124" height="260" rx="0" fill="#F4F7F7" stroke="none" stroke-width="1.6"/><text x="132" y="58" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Stage 1</text><rect x="194" y="70" width="124" height="260" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="256" y="58" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Stage 2</text><rect x="318" y="70" width="124" height="260" rx="0" fill="#F4F7F7" stroke="none" stroke-width="1.6"/><text x="380" y="58" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Stage 3</text><rect x="442" y="70" width="124" height="260" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="504" y="58" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Stage 4</text><rect x="566" y="70" width="124" height="260" rx="0" fill="#F4F7F7" stroke="none" stroke-width="1.6"/><text x="628" y="58" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Stage 5</text><line x1="70" y1="330" x2="690" y2="330" stroke="#1F2A28" stroke-width="2"/><line x1="70" y1="330" x2="70" y2="70" stroke="#1F2A28" stroke-width="2"/><text x="58" y="200" font-size="15" fill="#1F2A28" text-anchor="end">Rate</text><path d="M70 98.9 L132 93.1 L194 98.9 L256 98.9 L318 110.4 L380 156.7 L442 214.4 L504 249.1 L566 260.7 L628 278 L690 283.8" fill="none" stroke="#009E73" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 110.4 L132 133.6 L194 122 L256 168.2 L318 226 L380 254.9 L442 266.4 L504 272.2 L566 272.2 L628 266.4 L690 260.7" fill="none" stroke="#C24E00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 306.9 L194 301.1 L318 278 L442 226 L566 185.6 L640.4 179.8 L690 185.6" fill="none" stroke="#094953" stroke-width="2.5" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/><rect x="80.6" y="68.1" width="90.5" height="20.3" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="125.8" y="83.1" font-size="15" fill="#009E73" text-anchor="middle" font-weight="700">Birth rate</text><rect x="217" y="179.2" width="90.5" height="20.3" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="262.2" y="194.2" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">Death rate</text><rect x="483.6" y="158.6" width="140" height="20.3" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="553.6" y="173.6" font-size="15" fill="#094953" text-anchor="middle" font-weight="700">Total population</text><text x="132" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">Both high</text><text x="256" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">Deaths fall</text><text x="380" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">Births fall</text><text x="504" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">Both low</text><text x="628" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">Births below</text><text x="628" y="375.5" font-size="15" fill="#1F2A28" text-anchor="middle">deaths</text><text x="380" y="406" font-size="15" fill="#5F6B68" text-anchor="middle">Growth is fastest where the gap between the lines is widest (late stage 2, early stage 3).</text>
</svg>
