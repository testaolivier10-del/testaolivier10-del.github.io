<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="women-development-cycle-t women-development-cycle-d" font-family="Arial, Helvetica, sans-serif">
<title id="women-development-cycle-t">The microlending cycle</title>
<desc id="women-development-cycle-d">A loop of four steps around the word microlending. A small loan goes, often, to a woman in a group. She starts or grows a small business. Its income pays for food, school fees and the repayment. A repaid loan lets her borrow more, and the loop starts again.</desc>
<defs><marker id="women-development-cycle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="430" fill="#FFFFFF"/>
<rect x="170" y="16" width="300" height="80" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="51.0" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">A small loan, often to</text><text x="320" y="73.5" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">a woman in a group</text><rect x="390" y="170" width="236" height="90" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="508" y="210.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">She starts or grows</text><text x="508" y="232.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">a small business</text><rect x="170" y="330" width="300" height="80" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="320" y="365.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Income pays for food,</text><text x="320" y="387.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">school fees and repayment</text><rect x="14" y="170" width="236" height="90" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="132" y="210.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">A repaid loan lets</text><text x="132" y="232.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">her borrow more</text><line x1="440" y1="96" x2="500" y2="166" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="500" y1="260" x2="440" y2="326" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="200" y1="330" x2="140" y2="264" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="140" y1="170" x2="200" y2="100" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><text x="320" y="222.3" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">Microlending</text>
</svg>
