<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="women-development-cycle-t women-development-cycle-d" font-family="Arial, Helvetica, sans-serif">
<title id="women-development-cycle-t">The microlending cycle</title>
<desc id="women-development-cycle-d">A loop of four steps around the word microlending. A small loan goes, often, to a woman in a group. She starts or grows a small business. Its income pays for food, school and the repayment. A repaid loan lets her borrow more, and the loop starts again.</desc>
<defs><marker id="women-development-cycle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="452" fill="#FFFFFF"/>
<rect x="150" y="10" width="340" height="92" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="50.0" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">A small loan, often to</text><text x="320" y="77.5" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">a woman in a group</text><rect x="372" y="176" width="260" height="100" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="502" y="219.9" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">She starts or grows</text><text x="502" y="247.4" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">a small business</text><rect x="150" y="350" width="340" height="92" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="320" y="389.9" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">Income pays for food,</text><text x="320" y="417.4" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">school and repayment</text><rect x="8" y="176" width="260" height="100" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="138" y="219.9" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">A repaid loan lets</text><text x="138" y="247.4" font-size="22" font-weight="400" fill="#1F2A28" text-anchor="middle">her borrow more</text><line x1="450" y1="102" x2="500" y2="170" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="500" y1="276" x2="450" y2="344" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="190" y1="350" x2="140" y2="282" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><line x1="140" y1="176" x2="190" y2="108" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#women-development-cycle-ar)"/><text x="320" y="219.4" font-size="24" font-weight="700" fill="#094953" text-anchor="middle">Micro-</text><text x="320" y="249.4" font-size="24" font-weight="700" fill="#094953" text-anchor="middle">lending</text>
</svg>
