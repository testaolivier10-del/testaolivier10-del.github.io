<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-labelledby="development-theories-rostow-t development-theories-rostow-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-theories-rostow-t">Rostow's five stages of economic growth</title>
<desc id="development-theories-rostow-d">A staircase of five steps rising from left to right: 1 traditional society, 2 preconditions for take-off, 3 take-off, 4 drive to maturity, 5 high mass consumption. An arrow labeled one path, step by step, climbs beside it.</desc>
<defs><marker id="development-theories-rostow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="450" fill="#FFFFFF"/>
<rect x="6" y="250" width="124" height="190" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="68" y="286.1" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">1</text><text x="68" y="312.4" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">Tradi-</text><text x="68" y="338.6" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">tional</text><rect x="132" y="200" width="124" height="240" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="194" y="236.1" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">2</text><text x="194" y="262.4" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">Pre-</text><text x="194" y="288.6" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">conditions</text><rect x="258" y="150" width="124" height="290" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="320" y="186.2" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">3</text><text x="320" y="212.5" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">Take-off</text><rect x="384" y="100" width="124" height="340" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="446" y="136.1" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">4</text><text x="446" y="162.3" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">Drive to</text><text x="446" y="188.6" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">maturity</text><rect x="510" y="50" width="124" height="390" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="572" y="86.0" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">5</text><text x="572" y="112.2" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">High mass</text><text x="572" y="138.5" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">consump-</text><text x="572" y="164.7" font-size="21" font-weight="700" fill="#094953" text-anchor="middle">tion</text><text x="160" y="38.4" font-size="24" font-weight="700" fill="#C24E00" text-anchor="middle">One path, step by step</text><line x1="20" y1="170" x2="290" y2="64" stroke="#C24E00" stroke-width="2.5" marker-end="url(#development-theories-rostow-ar)"/>
</svg>
