<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="development-theories-rostow-t development-theories-rostow-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-theories-rostow-t">Rostow's five stages of economic growth</title>
<desc id="development-theories-rostow-d">A staircase of five steps rising from left to right: 1 traditional society, 2 preconditions for take-off, 3 take-off, 4 drive to maturity, 5 high mass consumption. An arrow labeled one path, step by step, climbs beside it.</desc>
<defs><marker id="development-theories-rostow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="390" fill="#FFFFFF"/>
<rect x="10" y="290" width="122" height="90" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="71" y="320.5" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">1</text><text x="71" y="339.3" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">Traditional</text><text x="71" y="358.0" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">society</text><rect x="134" y="238" width="122" height="142" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="195" y="268.5" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">2</text><text x="195" y="287.3" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">Preconditions</text><text x="195" y="306.0" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">for take-off</text><rect x="258" y="186" width="122" height="194" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="319" y="215.9" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">3</text><text x="319" y="234.6" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">Take-off</text><rect x="382" y="134" width="122" height="246" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="443" y="164.5" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">4</text><text x="443" y="183.3" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">Drive to</text><text x="443" y="202.0" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">maturity</text><rect x="506" y="82" width="122" height="298" fill="#C9E6EB" stroke="#094953" stroke-width="2"/><text x="567" y="112.5" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">5</text><text x="567" y="131.3" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">High mass</text><text x="567" y="150.0" font-size="15" font-weight="700" fill="#094953" text-anchor="middle">consumption</text><text x="170" y="32.3" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">One path, step by step</text><line x1="30" y1="150" x2="300" y2="56" stroke="#C24E00" stroke-width="2.5" marker-end="url(#development-theories-rostow-ar)"/>
</svg>
