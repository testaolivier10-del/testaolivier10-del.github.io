<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How women’s schooling and work change births, deaths and migration</title>
<desc id="d">Diagram: a box, more schooling, paid work and health care for women, branches three ways. Later marriage and more family planning lead to fewer births. Mothers knowing more about health leads to fewer child deaths. More women moving for work leads to new migration patterns. Example: Bangladesh, where the total fertility rate fell from more than 6 in the early 1970s to 2.3 in 2022.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="392" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Women’s roles and population change</text><rect x="24" y="150" width="210" height="96" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="129" y="183" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">More schooling,</text><text x="129" y="203.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">paid work and</text><text x="129" y="224.6" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">health care for women</text><line x1="236" y1="198" x2="284" y2="92" stroke="#009E73" stroke-width="2.5" marker-end="url(#ar-green)"/><rect x="288" y="60" width="196" height="64" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="386" y="87.7" font-size="15" fill="#1F2A28" text-anchor="middle">Later marriage; more</text><text x="386" y="107.2" font-size="15" fill="#1F2A28" text-anchor="middle">use of family planning</text><line x1="486" y1="92" x2="518" y2="92" stroke="#009E73" stroke-width="2.5" marker-end="url(#ar-green)"/><rect x="522" y="60" width="176" height="64" rx="8" fill="#F4F7F7" stroke="#009E73" stroke-width="1.8"/><text x="610" y="87.7" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Fewer births</text><text x="610" y="107.2" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">(lower TFR)</text><line x1="236" y1="198" x2="284" y2="198" stroke="#A8508A" stroke-width="2.5" marker-end="url(#ar-purp)"/><rect x="288" y="166" width="196" height="64" rx="8" fill="#FFFFFF" stroke="#A8508A" stroke-width="1.8"/><text x="386" y="193.7" font-size="15" fill="#1F2A28" text-anchor="middle">Mothers know more</text><text x="386" y="213.2" font-size="15" fill="#1F2A28" text-anchor="middle">about health</text><line x1="486" y1="198" x2="518" y2="198" stroke="#A8508A" stroke-width="2.5" marker-end="url(#ar-purp)"/><rect x="522" y="166" width="176" height="64" rx="8" fill="#F4F7F7" stroke="#A8508A" stroke-width="1.8"/><text x="610" y="193.7" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Fewer child deaths</text><text x="610" y="213.2" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">(lower IMR)</text><line x1="236" y1="198" x2="284" y2="304" stroke="#C24E00" stroke-width="2.5" marker-end="url(#ar-verm)"/><rect x="288" y="272" width="196" height="64" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="1.8"/><text x="386" y="299.7" font-size="15" fill="#1F2A28" text-anchor="middle">More women move</text><text x="386" y="319.2" font-size="15" fill="#1F2A28" text-anchor="middle">for work themselves</text><line x1="486" y1="304" x2="518" y2="304" stroke="#C24E00" stroke-width="2.5" marker-end="url(#ar-verm)"/><rect x="522" y="272" width="176" height="64" rx="8" fill="#F4F7F7" stroke="#C24E00" stroke-width="1.8"/><text x="610" y="299.7" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">New migration</text><text x="610" y="319.2" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">patterns</text><text x="360" y="372" font-size="15" fill="#5F6B68" text-anchor="middle">Example: Bangladesh, TFR more than 6 (early 1970s) to 2.3 (2022, Bangladesh DHS).</text>
</svg>
