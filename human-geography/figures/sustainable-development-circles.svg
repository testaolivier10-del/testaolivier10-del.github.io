<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" width="640" height="426" role="img" aria-labelledby="sustainable-development-circles-t sustainable-development-circles-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainable-development-circles-t">The three parts of sustainable development</title>
<desc id="sustainable-development-circles-d">Three overlapping circles. Economy: jobs and income. Society: health, school and fair shares. Environment: clean air, water, forests and climate. The point where all three overlap is labeled sustainable development.</desc>
<defs><marker id="sustainable-development-circles-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="426" fill="#FFFFFF"/>
<circle cx="230" cy="150" r="125" fill="#FBE7DA" fill-opacity="0.85" stroke="#C24E00" stroke-width="2"/><circle cx="410" cy="150" r="125" fill="#E1F1F4" fill-opacity="0.85" stroke="#094953" stroke-width="2"/><circle cx="320" cy="290" r="125" fill="#DDF2EA" fill-opacity="0.85" stroke="#007A5A" stroke-width="2"/><text x="190" y="93.8" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">Economy:</text><text x="190" y="116.3" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">jobs and</text><text x="190" y="138.8" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">income</text><text x="450" y="93.8" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">Society:</text><text x="450" y="116.3" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">health, school,</text><text x="450" y="138.8" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">fair shares</text><text x="320" y="333.8" font-size="18" font-weight="700" fill="#007A5A" text-anchor="middle">Environment:</text><text x="320" y="356.3" font-size="18" font-weight="700" fill="#007A5A" text-anchor="middle">clean air, water,</text><text x="320" y="378.8" font-size="18" font-weight="700" fill="#007A5A" text-anchor="middle">forests, climate</text><circle cx="320" cy="200" r="7" fill="#1F2A28"/><line x1="320" y1="200" x2="560" y2="330" stroke="#1F2A28" stroke-width="2"/><rect x="468" y="330" width="160" height="84" rx="12" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="548" y="357.6" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle">All three:</text><text x="548" y="377.6" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle">sustainable</text><text x="548" y="397.6" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle">development</text>
</svg>
