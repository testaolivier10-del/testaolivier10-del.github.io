<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" role="img" aria-labelledby="sustainable-development-circles-t sustainable-development-circles-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainable-development-circles-t">The three parts of sustainable development</title>
<desc id="sustainable-development-circles-d">Three overlapping circles. Economy: jobs and income. Society: health and school. Environment: air, water and climate. The point where all three overlap is labeled sustainable development.</desc>
<defs><marker id="sustainable-development-circles-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="516" fill="#FFFFFF"/>
<circle cx="215" cy="160" r="140" fill="#FBE7DA" fill-opacity="0.85" stroke="#C24E00" stroke-width="2"/><circle cx="425" cy="160" r="140" fill="#E1F1F4" fill-opacity="0.85" stroke="#094953" stroke-width="2"/><circle cx="320" cy="320" r="140" fill="#DDF2EA" fill-opacity="0.85" stroke="#007A5A" stroke-width="2"/><text x="165" y="99.3" font-size="23" font-weight="700" fill="#C24E00" text-anchor="middle">Economy:</text><text x="165" y="128.1" font-size="23" font-weight="700" fill="#C24E00" text-anchor="middle">jobs,</text><text x="165" y="156.8" font-size="23" font-weight="700" fill="#C24E00" text-anchor="middle">income</text><text x="475" y="99.3" font-size="23" font-weight="700" fill="#094953" text-anchor="middle">Society:</text><text x="475" y="128.1" font-size="23" font-weight="700" fill="#094953" text-anchor="middle">health,</text><text x="475" y="156.8" font-size="23" font-weight="700" fill="#094953" text-anchor="middle">school</text><text x="320" y="369.3" font-size="23" font-weight="700" fill="#007A5A" text-anchor="middle">Environment:</text><text x="320" y="398.1" font-size="23" font-weight="700" fill="#007A5A" text-anchor="middle">air, water,</text><text x="320" y="426.8" font-size="23" font-weight="700" fill="#007A5A" text-anchor="middle">climate</text><circle cx="320" cy="212" r="8" fill="#1F2A28"/><line x1="320" y1="212" x2="520" y2="420" stroke="#1F2A28" stroke-width="2"/><rect x="440" y="420" width="196" height="90" rx="12" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="538" y="458.9" font-size="22" font-weight="700" fill="#1F2A28" text-anchor="middle">Sustainable</text><text x="538" y="486.4" font-size="22" font-weight="700" fill="#1F2A28" text-anchor="middle">development</text>
</svg>
