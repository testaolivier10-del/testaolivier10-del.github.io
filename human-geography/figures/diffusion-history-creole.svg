<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How a creole language forms</title>
<desc id="d">Flow diagram: speakers of two languages meet and make a pidgin, a simple mixed language for trade or work that no one speaks from birth. When children grow up speaking it, it becomes a creole, a full first language. Example: Haitian Creole grew from French and West African languages spoken by enslaved people brought to Haiti, and Haiti's 1987 constitution made it an official language beside French.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="600" fill="#FFFFFF"/>
<text x="320" y="32" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">From contact to a creole language</text><rect x="30" y="60" width="270" height="70" rx="10" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="165" y="90" font-size="18" fill="#1F2A28" text-anchor="middle">Speakers of</text><text x="165" y="113" font-size="18" fill="#1F2A28" text-anchor="middle">Language 1</text><rect x="340" y="60" width="270" height="70" rx="10" fill="#F3E4EE" stroke="#A8508A" stroke-width="2"/><text x="475" y="90" font-size="18" fill="#1F2A28" text-anchor="middle">Speakers of</text><text x="475" y="113" font-size="18" fill="#1F2A28" text-anchor="middle">Language 2</text><line x1="165" y1="132" x2="280" y2="182" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><line x1="475" y1="132" x2="360" y2="182" stroke="#A8508A" stroke-width="2.6" marker-end="url(#ar-purp)" stroke-linecap="round"/><rect x="140" y="188" width="360" height="92" rx="10" fill="#FBE6D9" stroke="#C24E00" stroke-width="2"/><text x="320" y="218.4" font-size="17" fill="#1F2A28" text-anchor="middle">Pidgin: a simple mixed</text><text x="320" y="240.1" font-size="17" fill="#1F2A28" text-anchor="middle">language for trade or work.</text><text x="320" y="261.9" font-size="17" fill="#1F2A28" text-anchor="middle">No one speaks it from birth.</text><line x1="320" y1="282" x2="320" y2="322" stroke="#C24E00" stroke-width="2.6" marker-end="url(#ar-verm)" stroke-linecap="round"/><text x="336" y="308" font-size="16" fill="#C24E00">children grow up speaking it</text><rect x="140" y="328" width="360" height="92" rx="10" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="320" y="358.4" font-size="17" fill="#1F2A28" text-anchor="middle">Creole: a full language that</text><text x="320" y="380.1" font-size="17" fill="#1F2A28" text-anchor="middle">children learn as their</text><text x="320" y="401.9" font-size="17" fill="#1F2A28" text-anchor="middle">first language.</text><rect x="30" y="448" width="580" height="124" rx="10" fill="#FFFFFF" stroke="#6B7370" stroke-width="2"/><text x="320" y="483.5" font-size="17" fill="#1F2A28" text-anchor="middle">Example: Haitian Creole (Kreyòl) grew from French</text><text x="320" y="505.2" font-size="17" fill="#1F2A28" text-anchor="middle">and West African languages spoken by enslaved</text><text x="320" y="527" font-size="17" fill="#1F2A28" text-anchor="middle">people brought to Haiti. Haiti's 1987 constitution</text><text x="320" y="548.8" font-size="17" fill="#1F2A28" text-anchor="middle">made it an official language beside French.</text>
</svg>
