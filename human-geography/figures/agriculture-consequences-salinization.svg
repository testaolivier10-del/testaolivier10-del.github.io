<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" width="480" height="530" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How irrigation can lead to salinization</title>
<desc id="d">Four boxes from top to bottom, joined by arrows: farmers irrigate dry land for years; the water evaporates in the hot sun; salts in the water stay in the soil; crops grow poorly and some fields are abandoned. Below: fixes include draining fields, flushing salts with extra water and drip irrigation that wets only the roots.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="530" fill="#FFFFFF"/>
<text x="240" y="30" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">How irrigation can lead to salinization</text><rect x="30" y="52" width="420" height="72" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="240" y="94.5" font-size="18" fill="#1F2A28" text-anchor="middle">Farmers irrigate dry land for years</text><line x1="240" y1="125" x2="240" y2="146" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><rect x="30" y="148" width="420" height="72" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="240" y="190.5" font-size="18" fill="#1F2A28" text-anchor="middle">Water evaporates in the hot sun</text><line x1="240" y1="221" x2="240" y2="242" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><rect x="30" y="244" width="420" height="72" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="240" y="286.5" font-size="18" fill="#1F2A28" text-anchor="middle">Salts in the water stay in the soil</text><line x1="240" y1="317" x2="240" y2="338" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><rect x="30" y="340" width="420" height="72" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="240" y="370.8" font-size="18" fill="#1F2A28" text-anchor="middle">Crops grow poorly; some fields</text><text x="240" y="394.2" font-size="18" fill="#1F2A28" text-anchor="middle">are abandoned</text><text x="240" y="456" font-size="17" fill="#5F6B68" text-anchor="middle">Fixes: drain fields, flush salts with extra</text><text x="240" y="478.1" font-size="17" fill="#5F6B68" text-anchor="middle">water, use drip irrigation that wets</text><text x="240" y="500.2" font-size="17" fill="#5F6B68" text-anchor="middle">only the roots.</text>
</svg>
