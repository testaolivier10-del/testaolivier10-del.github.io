<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How irrigation can lead to salinization</title>
<desc id="d">Four boxes joined by arrows: farmers irrigate dry land for years; the water evaporates in the hot sun; salts in the water are left behind in the soil; crops grow poorly and some fields are abandoned. Below: fixes include draining fields, flushing salts with extra water and drip irrigation that wets only the roots.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="272" fill="#FFFFFF"/>
<rect x="6" y="60" width="160" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="86" y="110" font-size="16" fill="#1F2A28" text-anchor="middle">Farmers irrigate</text><text x="86" y="130.8" font-size="16" fill="#1F2A28" text-anchor="middle">dry land for</text><text x="86" y="151.6" font-size="16" fill="#1F2A28" text-anchor="middle">years</text><line x1="168" y1="125" x2="184" y2="125" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="186" y="60" width="160" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="266" y="120.4" font-size="16" fill="#1F2A28" text-anchor="middle">Water evaporates</text><text x="266" y="141.2" font-size="16" fill="#1F2A28" text-anchor="middle">in the hot sun</text><line x1="348" y1="125" x2="364" y2="125" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="366" y="60" width="160" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="446" y="110" font-size="16" fill="#1F2A28" text-anchor="middle">Salts in the water</text><text x="446" y="130.8" font-size="16" fill="#1F2A28" text-anchor="middle">are left behind</text><text x="446" y="151.6" font-size="16" fill="#1F2A28" text-anchor="middle">in the soil</text><line x1="528" y1="125" x2="544" y2="125" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="546" y="60" width="160" height="130" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="626" y="110" font-size="16" fill="#1F2A28" text-anchor="middle">Crops grow poorly;</text><text x="626" y="130.8" font-size="16" fill="#1F2A28" text-anchor="middle">some fields are</text><text x="626" y="151.6" font-size="16" fill="#1F2A28" text-anchor="middle">abandoned</text><text x="360" y="34" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">How irrigation can lead to salinization</text><text x="360" y="230" font-size="15" fill="#5F6B68" text-anchor="middle">Fixes: drain fields, flush salts with extra water,</text><text x="360" y="249.5" font-size="15" fill="#5F6B68" text-anchor="middle">use drip irrigation that wets only the roots.</text>
</svg>
