<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="boundary-functions-zones-t boundary-functions-zones-d" font-family="Arial, Helvetica, sans-serif">
<title id="boundary-functions-zones-t">Sea zones under the law of the sea</title>
<desc id="boundary-functions-zones-d">A strip of sea running out from the coast in four bands. From 0 to 12 nautical miles: the territorial sea, ruled like land. From 12 to 24: the contiguous zone, where the state can enforce customs and police laws. From 12 out to 200: the exclusive economic zone, where fish, oil, gas and minerals belong to the coastal state (the contiguous zone sits inside it). Beyond 200: the high seas, open to all states. Not to scale.</desc>
<rect width="480" height="300" fill="#FFFFFF"/>
<rect x="0" y="40" width="50" height="200" fill="#EFE9DC" stroke="#1F2A28" stroke-width="2"/><text x="25" y="145.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Land</text><rect x="50" y="40" width="90" height="200" fill="#B9DCE6"/><line x1="140" y1="40" x2="140" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="140" y="40" width="80" height="200" fill="#CFE6EC"/><line x1="220" y1="40" x2="220" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="220" y="40" width="160" height="200" fill="#E2F0F3"/><line x1="380" y1="40" x2="380" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="380" y="40" width="90" height="200" fill="#F4FAFB"/><line x1="470" y1="40" x2="470" y2="240" stroke="#094953" stroke-width="2"/><line x1="50" y1="40" x2="50" y2="240" stroke="#1F2A28" stroke-width="3"/><text x="50" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">0</text><text x="140" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">12</text><text x="220" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">24</text><text x="380" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">200</text><text x="275" y="290.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">Nautical miles from the coast (not to scale)</text><text x="95" y="92.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">Territorial</text><text x="95" y="110.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">sea</text><text x="180" y="92.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">Contiguous</text><text x="180" y="110.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">zone</text><text x="300" y="92.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">Exclusive</text><text x="300" y="110.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">economic zone</text><text x="425" y="92.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">High seas</text><text x="95" y="150.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Ruled</text><text x="95" y="168.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">like land</text><text x="180" y="150.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Customs</text><text x="180" y="168.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">and police</text><text x="300" y="150.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Fish, oil, gas</text><text x="300" y="168.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">and minerals</text><text x="300" y="186.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">belong to the</text><text x="300" y="204.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">coastal state</text><text x="425" y="150.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Open to</text><text x="425" y="168.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">all states</text><line x1="142" y1="62" x2="378" y2="62" stroke="#094953" stroke-width="2"/><line x1="142" y1="56" x2="142" y2="68" stroke="#094953" stroke-width="2"/><line x1="378" y1="56" x2="378" y2="68" stroke="#094953" stroke-width="2"/><rect x="236" y="50" width="128" height="22" fill="#FFFFFF"/><text x="300" y="66.0" font-size="14" font-weight="700" fill="#094953" text-anchor="middle">EEZ: 12 to 200</text><text x="240" y="26.0" font-size="16" font-weight="700" fill="#094953" text-anchor="middle">Sea zones under the law of the sea (UNCLOS)</text>
</svg>
