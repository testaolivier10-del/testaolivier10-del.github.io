<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three farm landscapes</title>
<desc id="d">Three numbered drawn scenes. Scene 1, seen from the side: a steep hillside cut into seven flat steps, each with a strip of green crops held up by a stone wall. Scene 2, seen from above: four large green circles of crops on dry tan land, each with a long pipe arm turning around its center. Scene 3, seen from above: thick forest with one patch cleared and burned brown, smoke rising and a few charred logs on the ground.</desc>
