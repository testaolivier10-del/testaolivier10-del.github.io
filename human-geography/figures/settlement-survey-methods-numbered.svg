<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three ways of dividing farmland, seen from above</title>
<desc id="d">Three numbered panels drawn from above. Panel 1: odd-shaped fields whose edges follow a winding stream, a tree and a rock. Panel 2: a grid of equal squares with straight roads at right angles and a few farmhouses. Panel 3: narrow strips of land side by side, each running back from a river, with a house at the river end of each strip.</desc>
