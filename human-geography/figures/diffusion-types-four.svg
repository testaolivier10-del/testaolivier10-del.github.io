<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The kinds of diffusion</title>
<desc id="d">Four small grids of places. Relocation: a dashed arrow shows people carrying a trait from the hearth to a far place. Contagious: the trait fills the places nearest the hearth, like a ripple. Hierarchical: arrows run from a big city to smaller towns, skipping the places between. Stimulus: the idea reaches nearby places but changes form there, shown as circles turning into squares.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="690" fill="#FFFFFF"/>
<text x="320" y="32" font-size="22" fill="#1F2A28" text-anchor="middle" font-weight="700">Four ways a trait spreads</text><text x="20" y="66" font-size="19" fill="#094953" font-weight="700">Relocation</text><text x="20" y="298" font-size="16" fill="#1F2A28">People move and carry</text><text x="20" y="318.5" font-size="16" fill="#1F2A28">the trait to a new place.</text><text x="340" y="66" font-size="19" fill="#094953" font-weight="700">Contagious (expansion)</text><text x="340" y="298" font-size="16" fill="#1F2A28">Spreads to the nearest</text><text x="340" y="318.5" font-size="16" fill="#1F2A28">places, like a ripple.</text><text x="20" y="396" font-size="19" fill="#094953" font-weight="700">Hierarchical (expansion)</text><text x="20" y="652" font-size="16" fill="#1F2A28">Spreads from big places</text><text x="20" y="672.5" font-size="16" fill="#1F2A28">to smaller ones.</text><text x="340" y="396" font-size="19" fill="#094953" font-weight="700">Stimulus (expansion)</text><text x="340" y="652" font-size="16" fill="#1F2A28">The idea spreads, but people</text><text x="340" y="672.5" font-size="16" fill="#1F2A28">change it to fit their culture.</text><rect x="20" y="76" width="280" height="190" rx="8" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.2"/><circle cx="50" cy="106" r="9" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="94" cy="106" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="138" cy="106" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="182" cy="106" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="226" cy="106" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="270" cy="106" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="50" cy="150" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="94" cy="150" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circle cx="138" cy="150" r="6" fill="#C9D3D6" stroke="none" stroke-width="1.4"/><circ