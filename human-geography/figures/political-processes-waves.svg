<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 455" width="480" height="455" role="img" aria-labelledby="political-processes-waves-t political-processes-waves-d" font-family="Arial, Helvetica, sans-serif">
<title id="political-processes-waves-t">Waves of independence</title>
<desc id="political-processes-waves-d">A timeline running down the page with four dates. 1776 to 1830s: the United States and most of Latin America break away from European empires. 1945 to 1975: most colonies in Africa and Asia win independence. 1991: the Soviet Union breaks into 15 states. 1993 to 2011: more new states such as Eritrea, Timor-Leste and South Sudan.</desc>
<rect width="480" height="455" fill="#FFFFFF"/>
<defs><marker id="political-processes-waves-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker></defs><line x1="60" y1="30" x2="60" y2="410" stroke="#094953" stroke-width="4" marker-end="url(#political-processes-waves-k)"/><circle cx="60" cy="50" r="10" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="85" y="56.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">1776 to 1830s</text><text x="85" y="80.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">The United States and most of Latin America</text><text x="85" y="98.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">break away from European empires.</text><circle cx="60" cy="145" r="10" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="85" y="151.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">1945 to 1975</text><text x="85" y="175.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Most colonies in Africa and Asia win</text><text x="85" y="193.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">independence: the number of states grows fast.</text><circle cx="60" cy="240" r="10" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="85" y="246.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">1991</text><text x="85" y="270.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">The Soviet Union breaks into 15 independent</text><text x="85" y="288.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">states.</text><circle cx="60" cy="335" r="10" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="85" y="341.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">1993 to 2011</text><text x="85" y="365.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">More new states form, such as Eritrea (1993),</text><text x="85" y="383.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Timor-Leste (2002) and South Sudan (2011).</text><text x="85" y="440.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="start">Time runs down the line.</text>
</svg>
