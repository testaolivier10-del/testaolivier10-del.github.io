<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Universalizing and ethnic religions</title>
<desc id="d">Two panels. Universalizing religions: arrows go out in every direction from the hearth; they seek new followers anywhere and spread by expansion and relocation diffusion; examples Christianity, Islam, Buddhism and Sikhism. Ethnic religions: most followers stay in a ring near the hearth, and one dashed arrow shows relocation when followers migrate; examples Hinduism and Judaism.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="500" fill="#FFFFFF"/>
<text x="320" y="32" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">How the two kinds of religion spread</text><text x="160" y="70" font-size="20" fill="#094953" text-anchor="middle" font-weight="700">Universalizing</text><text x="480" y="70" font-size="20" fill="#A8508A" text-anchor="middle" font-weight="700">Ethnic</text><rect x="14" y="84" width="292" height="260" rx="10" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.2"/><rect x="334" y="84" width="292" height="260" rx="10" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.2"/><circle cx="160" cy="214" r="26" fill="#094953" stroke="none" stroke-width="1.4"/><text x="160" y="220" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">hearth</text><line x1="134.5" y1="191.1" x2="44" y2="110" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><circle cx="44" cy="110" r="8" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="184.2" y1="193.3" x2="270" y2="120" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><circle cx="270" cy="120" r="8" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="133.6" y1="237.3" x2="40" y2="320" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><circle cx="40" cy="320" r="8" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="186.4" y1="236.9" x2="280" y2="318" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><circle cx="280" cy="318" r="8" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="160" y1="190.2" x2="160" y2="106" stroke="#094953" stroke-width="2.6" marker-end="url(#ar-teal)" stroke-linecap="round"/><circle cx="160" cy="106" r="8" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="480" cy="214" r="26" fill="#A8508A" stroke="none" stroke-width="1.4"/><text x="480" y="220" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">hearth</text><circle cx="480" cy="214" r="62" fill="none" stroke="#A8508A" stroke-width="2"/><path d="M520,250 C560,290 580,300 596,318" fill="none" stroke="#A8508A" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#ar-purp)" stroke-linejoin="round" stroke-linecap="round"/><circle cx="600" cy="322" r="8" fill="#A8508A" stroke="none" stroke-width="1.4"/><text x="24" y="376" font-size="16" fill="#1F2A28">Seeks new followers anywhere.</text><text x="24" y="396.5" font-size="16" fill="#1F2A28">Spreads by expansion and</text><text x="24" y="417" font-size="16" fill="#1F2A28">relocation diffusion.</text><text x="24" y="437.4" font-size="16" fill="#1F2A28">Christianity, Islam,</text><text x="24" y="457.9" font-size="16" fill="#1F2A28">Buddhism, Sikhism.</text><text x="344" y="376" font-size="16" fill="#1F2A28">Tied to one group and place.</text><text x="344" y="396.5" font-size="16" fill="#1F2A28">Stays near its hearth, or</text><text x="344" y="417" font-size="16" fill="#1F2A28">spreads by relocation when</text><text x="344" y="437.4" font-size="16" fill="#1F2A28">followers migrate.</text><text x="344" y="457.9" font-size="16" fill="#1F2A28">Hinduism, Judaism.</text>
</svg>
