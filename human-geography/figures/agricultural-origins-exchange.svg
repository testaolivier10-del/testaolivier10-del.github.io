<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Columbian Exchange</title>
<desc id="d">Two boxes joined by arrows across the Atlantic, titled the Columbian Exchange, after 1492. From the Americas to Europe, Africa and Asia: maize (corn), potatoes, tomatoes, cacao, cassava and chili peppers. From Afro-Eurasia to the Americas: wheat and rice, sugarcane, coffee, cattle, pigs, horses and chickens, and diseases such as smallpox and measles. Plants, animals and diseases crossed the ocean in both directions.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="408" fill="#FFFFFF"/>
<rect x="10" y="60" width="260" height="300" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2.2"/><text x="140" y="92" font-size="19" fill="#00694D" text-anchor="middle" font-weight="700">From the Americas</text><text x="34" y="128" font-size="17" fill="#1F2A28">maize (corn)</text><text x="34" y="164" font-size="17" fill="#1F2A28">potatoes</text><text x="34" y="200" font-size="17" fill="#1F2A28">tomatoes</text><text x="34" y="236" font-size="17" fill="#1F2A28">cacao (chocolate)</text><text x="34" y="272" font-size="17" fill="#1F2A28">cassava</text><text x="34" y="308" font-size="17" fill="#1F2A28">chili peppers</text><rect x="450" y="60" width="260" height="300" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2.2"/><text x="580" y="92" font-size="19" fill="#094953" text-anchor="middle" font-weight="700">From Afro-Eurasia</text><text x="474" y="128" font-size="17" fill="#1F2A28">wheat and rice</text><text x="474" y="160" font-size="17" fill="#1F2A28">sugarcane</text><text x="474" y="192" font-size="17" fill="#1F2A28">coffee</text><text x="474" y="224" font-size="17" fill="#1F2A28">cattle, pigs, horses</text><text x="474" y="256" font-size="17" fill="#1F2A28">chickens</text><text x="474" y="288" font-size="17" fill="#C24E00" font-weight="700">diseases: smallpox,</text><text x="474" y="320" font-size="17" fill="#C24E00" font-weight="700">measles</text><path d="M276,160 C330,130 390,130 444,160" fill="none" stroke="#009E73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-green)"/><path d="M444,260 C390,290 330,290 276,260" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-teal)"/><text x="360" y="210" font-size="16" fill="#5F6B68" text-anchor="middle" font-style="italic">Atlantic</text><text x="360" y="30" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">The Columbian Exchange, after 1492</text><text x="360" y="392" font-size="15" fill="#5F6B68" text-anchor="middle">Plants, animals and diseases crossed the ocean in both directions.</text>
</svg>
