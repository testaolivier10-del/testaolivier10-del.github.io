<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Columbian Exchange</title>
<desc id="d">Two boxes, titled the Columbian Exchange, after 1492. From the Americas to Europe, Africa and Asia: maize (corn), potatoes, tomatoes, cacao, cassava and chili peppers. From Afro-Eurasia to the Americas: wheat and rice, sugarcane, coffee, cattle, pigs, horses and chickens, and diseases such as smallpox and measles. Plants, animals and diseases crossed the Atlantic in both directions.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="470" fill="#FFFFFF"/>
<text x="240" y="30" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">The Columbian Exchange, after 1492</text><rect x="6" y="50" width="228" height="350" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2.2"/><text x="120" y="80" font-size="18" fill="#00694D" text-anchor="middle" font-weight="700">From the Americas</text><line x1="40" y1="96" x2="200" y2="96" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)"/><text x="22" y="136" font-size="18" fill="#1F2A28">maize (corn)</text><text x="22" y="172" font-size="18" fill="#1F2A28">potatoes</text><text x="22" y="208" font-size="18" fill="#1F2A28">tomatoes</text><text x="22" y="244" font-size="18" fill="#1F2A28">cacao</text><text x="22" y="280" font-size="18" fill="#1F2A28">cassava</text><text x="22" y="316" font-size="18" fill="#1F2A28">chili peppers</text><rect x="246" y="50" width="228" height="350" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2.2"/><text x="360" y="80" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">From Afro-Eurasia</text><line x1="440" y1="96" x2="280" y2="96" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><text x="262" y="136" font-size="18" fill="#1F2A28">wheat, rice</text><text x="262" y="172" font-size="18" fill="#1F2A28">sugarcane</text><text x="262" y="208" font-size="18" fill="#1F2A28">coffee</text><text x="262" y="244" font-size="18" fill="#1F2A28">cattle, pigs</text><text x="262" y="280" font-size="18" fill="#1F2A28">horses, chickens</text><text x="262" y="316" font-size="18" fill="#C24E00" font-weight="700">smallpox,</text><text x="262" y="352" font-size="18" fill="#C24E00" font-weight="700">measles</text><text x="240" y="432" font-size="17" fill="#5F6B68" text-anchor="middle">Plants, animals and diseases crossed</text><text x="240" y="454.1" font-size="17" fill="#5F6B68" text-anchor="middle">the Atlantic in both directions.</text>
</svg>
