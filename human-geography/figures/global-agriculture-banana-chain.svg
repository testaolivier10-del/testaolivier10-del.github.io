<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A global supply chain for bananas</title>
<desc id="d">Seven steps from top to bottom, joined by arrows: a farm in Ecuador, a packing house where fruit is washed and boxed, the port of Guayaquil, a refrigerated ship kept at about 13 degrees Celsius, a port in the United States, a ripening center where gas ripens the fruit, and a store where a shopper buys it. The first three steps are marked as in the exporting country and the last three as in the importing country. Each step adds cost and value, and a delay at any step can spoil the fruit.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="600" fill="#FFFFFF"/>
<text x="240" y="28" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">A global supply chain for bananas</text><rect x="40" y="48" width="434" height="54" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="54" y="82" font-size="19" fill="#1F2A28" font-weight="700">Farm</text><text x="462" y="82" font-size="17" fill="#1F2A28" text-anchor="end">Ecuador</text><line x1="257" y1="103" x2="257" y2="116" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="118" width="434" height="54" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="54" y="152" font-size="19" fill="#1F2A28" font-weight="700">Packing house</text><text x="462" y="152" font-size="17" fill="#1F2A28" text-anchor="end">washed, boxed</text><line x1="257" y1="173" x2="257" y2="186" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="188" width="434" height="54" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="54" y="222" font-size="19" fill="#1F2A28" font-weight="700">Port</text><text x="462" y="222" font-size="17" fill="#1F2A28" text-anchor="end">Guayaquil, Ecuador</text><line x1="257" y1="243" x2="257" y2="256" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="258" width="434" height="54" rx="8" fill="#DCEEF6" stroke="#1F5F82" stroke-width="2"/><text x="54" y="292" font-size="19" fill="#1F2A28" font-weight="700">Cold ship</text><text x="462" y="292" font-size="17" fill="#1F2A28" text-anchor="end">kept at about 13 °C</text><line x1="257" y1="313" x2="257" y2="326" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="328" width="434" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="54" y="362" font-size="19" fill="#1F2A28" font-weight="700">Port</text><text x="462" y="362" font-size="17" fill="#1F2A28" text-anchor="end">United States</text><line x1="257" y1="383" x2="257" y2="396" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="398" width="434" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="54" y="432" font-size="19" fill="#1F2A28" font-weight="700">Ripening center</text><text x="462" y="432" font-size="17" fill="#1F2A28" text-anchor="end">gas ripens the fruit</text><line x1="257" y1="453" x2="257" y2="466" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><rect x="40" y="468" width="434" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="54" y="502" font-size="19" fill="#1F2A28" font-weight="700">Store</text><text x="462" y="502" font-size="17" fill="#1F2A28" text-anchor="end">a shopper buys it</text><path d="M30,52 L20,52 L20,238 L30,238" fill="none" stroke="#009E73" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30,332 L20,332 L20,518 L30,518" fill="none" stroke="#094953" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="14" y="145" font-size="16" fill="#00694D" font-weight="700" text-anchor="middle" transform="rotate(-90 14 145)">Exporting country</text><text x="14" y="425" font-size="16" fill="#094953" font-weight="700" text-anchor="middle" transform="rotate(-90 14 425)">Importing country</text><text x="240" y="560" font-size="17" fill="#5F6B68" text-anchor="middle">Each step adds cost and value; a delay</text><text x="240" y="582.1" font-size="17" fill="#5F6B68" text-anchor="middle">at any step can spoil the fruit.</text>
</svg>
