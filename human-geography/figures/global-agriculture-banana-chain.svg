<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A global supply chain for bananas</title>
<desc id="d">Seven boxes joined by arrows: a farm in Ecuador, a packing house where fruit is washed and boxed, the port of Guayaquil, a refrigerated ship kept at about 13 degrees Celsius, a port in the United States, a ripening center where gas ripens the fruit, and a store where a shopper buys it. The first three steps are in the exporting country and the last three in the importing country. Each step adds cost and value, and a delay at any step can spoil the fruit.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="330" fill="#FFFFFF"/>
<rect x="4" y="70" width="92" height="150" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="50" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Farm</text><text x="50" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">Ecuador</text><line x1="97" y1="145" x2="105" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="106" y="70" width="92" height="150" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="152" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Packing</text><text x="152" y="123.5" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">house</text><text x="152" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">washed,</text><text x="152" y="181.5" font-size="15" fill="#1F2A28" text-anchor="middle">boxed</text><line x1="199" y1="145" x2="207" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="208" y="70" width="92" height="150" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="254" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Port</text><text x="254" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">Guayaquil</text><line x1="301" y1="145" x2="309" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="310" y="70" width="92" height="150" rx="8" fill="#DCEEF6" stroke="#1F5F82" stroke-width="2"/><text x="356" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Cold ship</text><text x="356" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">kept at</text><text x="356" y="181.5" font-size="15" fill="#1F2A28" text-anchor="middle">about</text><text x="356" y="201" font-size="15" fill="#1F2A28" text-anchor="middle">13 °C</text><line x1="403" y1="145" x2="411" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="412" y="70" width="92" height="150" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="458" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Port</text><text x="458" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">United</text><text x="458" y="181.5" font-size="15" fill="#1F2A28" text-anchor="middle">States</text><line x1="505" y1="145" x2="513" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="514" y="70" width="92" height="150" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="560" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Ripening</text><text x="560" y="123.5" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">center</text><text x="560" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">gas</text><text x="560" y="181.5" font-size="15" fill="#1F2A28" text-anchor="middle">ripens</text><text x="560" y="201" font-size="15" fill="#1F2A28" text-anchor="middle">fruit</text><line x1="607" y1="145" x2="615" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="616" y="70" width="92" height="150" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="662" y="104" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Store</text><text x="662" y="162" font-size="15" fill="#1F2A28" text-anchor="middle">shopper</text><text x="662" y="181.5" font-size="15" fill="#1F2A28" text-anchor="middle">buys</text><text x="360" y="36" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">A global supply chain for bananas</text><path d="M8,240 L8,252 L298,252 L298,240" fill="none" stroke="#009E73" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="153" y="276" font-size="15" fill="#00694D" text-anchor="middle" font-weight="700">In the exporting country</text><path d="M412,240 L412,252 L712,252 L712,240" fill="none" stroke="#094953" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="562" y="276" font-size="15" fill="#094953" text-anchor="middle" font-weight="700">In the importing country</text><text x="360" y="314" font-size="15" fill="#5F6B68" text-anchor="middle">Each step adds cost and value; a delay at any step can spoil the fruit.</text>
</svg>
