<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Forced and voluntary migration</title>
<desc id="d">Two columns. Forced migration (no real choice): refugee, who crossed a border and was granted protection; asylum seeker, who crossed, asked for protection and is waiting; internally displaced person, who stayed in his or her own country; enslavement. Voluntary migration (by choice): internal migration (rural-to-urban, interregional, intraregional); step and chain migration; guest worker for a set time; transnational migration and transhumance.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="412" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Kinds of migration</text><rect x="30" y="56" width="300" height="50" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="87.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Forced: no real choice</text><rect x="390" y="56" width="300" height="50" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="540" y="87.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Voluntary: by choice</text><line x1="180" y1="106" x2="180" y2="330" stroke="#C24E00" stroke-width="1.6"/><line x1="540" y1="106" x2="540" y2="330" stroke="#009E73" stroke-width="1.6"/><rect x="52" y="120" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="144.7" font-size="15" fill="#1F2A28" text-anchor="middle">Refugee: crossed a border,</text><text x="180" y="164.2" font-size="15" fill="#1F2A28" text-anchor="middle">granted protection</text><rect x="52" y="190" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="214.7" font-size="15" fill="#1F2A28" text-anchor="middle">Asylum seeker: crossed,</text><text x="180" y="234.2" font-size="15" fill="#1F2A28" text-anchor="middle">asked, waiting</text><rect x="52" y="260" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="284.7" font-size="15" fill="#1F2A28" text-anchor="middle">Internally displaced person:</text><text x="180" y="304.2" font-size="15" fill="#1F2A28" text-anchor="middle">stayed in own country</text><rect x="52" y="330" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="354.7" font-size="15" fill="#1F2A28" text-anchor="middle">Enslavement: captured</text><text x="180" y="374.2" font-size="15" fill="#1F2A28" text-anchor="middle">and moved by force</text><rect x="412" y="120" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="540" y="144.7" font-size="15" fill="#1F2A28" text-anchor="middle">Internal (rural-to-urban,</text><text x="540" y="164.2" font-size="15" fill="#1F2A28" text-anchor="middle">interregional, intraregional)</text><rect x="412" y="190" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="540" y="224.4" font-size="15" fill="#1F2A28" text-anchor="middle">Step and chain migration</text><rect x="412" y="260" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="540" y="294.4" font-size="15" fill="#1F2A28" text-anchor="middle">Guest worker: set time</text><rect x="412" y="330" width="256" height="58" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="1.8"/><text x="540" y="354.7" font-size="15" fill="#1F2A28" text-anchor="middle">Transnational and</text><text x="540" y="374.2" font-size="15" fill="#1F2A28" text-anchor="middle">transhumance</text>
</svg>
