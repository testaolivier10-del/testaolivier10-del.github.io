<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="urbanization-origins-site-situation-t urbanization-origins-site-situation-d" font-family="Arial, Helvetica, sans-serif">
<title id="urbanization-origins-site-situation-t">Site and situation</title>
<desc id="urbanization-origins-site-situation-d">Two panels. Left, site: a town built on an island in a river bend, with a hill, fresh water and flat farmland beside it. Right, situation: the same town as a dot where a river route, a coast road and a mountain pass road meet, linked to a port, a mining town and farm villages.</desc>
<rect x="0" y="0" width="820" height="430" fill="#FFFFFF" /><text x="205" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#094953"><tspan x="205" dy="0">Site: the ground the city is on</tspan></text><text x="615" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#C24E00"><tspan x="615" dy="0">Situation: its place among other places</tspan></text><line x1="410" y1="45" x2="410" y2="410" stroke="#C9CCC8" stroke-width="2" /><rect x="20" y="50" width="370" height="330" fill="#E8F1D2" rx="8"/><path d="M60 50 C120 140 40 230 150 300 C230 350 260 330 330 380 L370 380 C300 320 270 330 200 290 C100 230 170 140 110 50 Z" fill="#CFE6F5" /><path d="M135 175 C160 150 215 160 222 190 C228 225 180 245 150 232 C125 220 118 195 135 175 Z" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1.5"/><rect x="150" y="190" width="12" height="10" fill="#094953" /><rect x="170" y="182" width="12" height="10" fill="#094953" /><rect x="190" y="196" width="12" height="10" fill="#094953" /><rect x="160" y="212" width="12" height="10" fill="#094953" /><rect x="182" y="216" width="12" height="10" fill="#094953" /><rect x="204" y="210" width="12" height="10" fill="#094953" /><path d="M270 120 L320 70 L370 120 Z" fill="#D9CFB8" stroke="#1F2A28" stroke-width="1.2"/><text x="150" y="270" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="150" dy="0">Island: easy to defend</tspan></text><text x="300" y="145" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="300" dy="0">Hill: a lookout</tspan></text><text x="60" y="355" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="60" dy="0">River: fresh water and fish</tspan></text><text x="260" y="210" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="260" dy="0">Flat, fertile</tspan><tspan x="260" dy="17.5">farmland</tspan></text><rect x="430" y="50" width="370" height="330" fill="#FBFBFA" rx="8"/><path d="M430 300 C520 290 560 330 650 320 C720 312 760 330 800 325 L800 380 L430 380 Z" fill="#CFE6F5" /><line x1="615" y1="210" x2="470" y2="320" stroke="#6B6F6C" stroke-width="4" stroke-dasharray="2 0"/><line x1="615" y1="210" x2="790" y2="315" stroke="#6B6F6C" stroke-width="4" /><line x1="615" y1="210" x2="720" y2="80" stroke="#6B6F6C" stroke-width="4" /><line x1="615" y1="210" x2="480" y2="90" stroke="#6B6F6C" stroke-width="4" /><circle cx="615" cy="210" r="18" fill="#C24E00" /><text x="615" y="250" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="615" dy="0">The town</tspan></text><circle cx="470" cy="320" r="9" fill="#094953" /><text x="470" y="350" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="470" dy="0">Sea port</tspan></text><circle cx="720" cy="80" r="9" fill="#094953" /><text x="720" y="68" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="720" dy="0">Mining town</tspan></text><circle cx="480" cy="90" r="9" fill="#094953" /><text x="480" y="78" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="480" dy="0">Farm villages</tspan></text><circle cx="790" cy="315" r="9" fill="#094953" /><text x="792" y="350" font-size="14" text-anchor="end" font-weight="normal" fill="#1F2A28"><tspan x="792" dy="0">Coast road</tspan></text><text x="410" y="405" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">Site is the place itself. Situation is its links to other places: routes meet at the town, so trade passes through.</tspan></text>
</svg>
