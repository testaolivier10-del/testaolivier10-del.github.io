<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="cities-globalization-hierarchy-t cities-globalization-hierarchy-d" font-family="Arial, Helvetica, sans-serif">
<title id="cities-globalization-hierarchy-t">The urban hierarchy</title>
<desc id="cities-globalization-hierarchy-d">A pyramid of five tiers. At the top, a few world cities such as London and New York that command global finance and media. Below, major cities that link large world regions. Then national capitals and large cities, then regional cities, and at the wide base many small towns. Arrows show money, decisions and information flowing down and across, and goods and people moving up.</desc>
<defs><marker id="chf-dn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="chf-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs>
<rect x="0" y="0" width="820" height="430" fill="#FFFFFF" /><path d="M196 106 L404 106 L350 40 L250 40 Z" fill="#094953" /><text x="300" y="68" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="300" dy="0">World cities</tspan></text><text x="300" y="90" font-size="13" text-anchor="middle" font-weight="normal" fill="#FFFFFF"><tspan x="300" dy="0">London, New York</tspan></text><path d="M138 176 L462 176 L408 110 L192 110 Z" fill="#3E7C86" /><text x="300" y="148" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="300" dy="0">Major cities linking world regions</tspan></text><path d="M80 246 L520 246 L466 180 L134 180 Z" fill="#7FB3BB" /><text x="300" y="218" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="300" dy="0">National capitals and large cities</tspan></text><path d="M22 316 L578 316 L524 250 L76 250 Z" fill="#B8D8DD" /><text x="300" y="288" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="300" dy="0">Regional cities</tspan></text><path d="M-36 386 L636 386 L582 320 L18 320 Z" fill="#D7ECEF" /><text x="300" y="358" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="300" dy="0">Small towns: many of them</tspan></text><line x1="612" y1="70" x2="612" y2="360" stroke="#C24E00" stroke-width="3" marker-end="url(#chf-dn)"/><text x="640" y="110" font-size="14" text-anchor="start" font-weight="normal" fill="#C24E00"><tspan x="640" dy="0">Down the hierarchy:</tspan><tspan x="640" dy="17.5">decisions, money,</tspan><tspan x="640" dy="17.5">new ideas, fashions</tspan></text><line x1="626" y1="360" x2="626" y2="70" stroke="#009E73" stroke-width="3" marker-end="url(#chf-up)"/><text x="640" y="260" font-size="14" text-anchor="start" font-weight="normal" fill="#05664B"><tspan x="640" dy="0">Up the hierarchy:</tspan><tspan x="640" dy="17.5">migrants, goods,</tspan><tspan x="640" dy="17.5">profits</tspan></text><text x="410" y="418" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">The higher the tier, the fewer the cities and the wider the area each one serves and controls.</tspan></text>
</svg>
