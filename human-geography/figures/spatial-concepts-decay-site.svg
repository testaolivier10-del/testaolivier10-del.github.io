<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Distance decay, and site against situation</title>
<desc id="d">Left: a graph of visits a week against distance from a store, a curve that falls steeply and then levels off: fewer visits come from far away. This is distance decay. Right: two boxes. Site is the place itself, such as high ground, a river bend, fresh water or flat land. Situation is its links to other places, such as being on a trade route, near a port or between two cities.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="340" fill="#FFFFFF"/>
<text x="190" y="30" font-size="19" fill="#094953" text-anchor="middle" font-weight="700">Distance decay</text><line x1="60" y1="290" x2="340" y2="290" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><line x1="60" y1="290" x2="60" y2="50" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><path d="M64,64 C110,180 170,240 330,276" fill="none" stroke="#094953" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="322" font-size="15" fill="#1F2A28" text-anchor="middle">Distance from the store</text><text x="30" y="170" font-size="15" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 30 170)">Visits a week</text><text x="240" y="120" font-size="15" fill="#5F6B68">Fewer visits</text><text x="240" y="139.5" font-size="15" fill="#5F6B68">from far away</text><line x1="380" y1="20" x2="380" y2="330" stroke="#C9D3D1" stroke-width="2"/><text x="545" y="30" font-size="19" fill="#C24E00" text-anchor="middle" font-weight="700">Site and situation</text><rect x="400" y="50" width="290" height="118" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="545" y="94.9" font-size="15" fill="#1F2A28" text-anchor="middle">Site: the place itself</text><text x="545" y="114.4" font-size="15" fill="#1F2A28" text-anchor="middle">high ground, a river bend,</text><text x="545" y="133.9" font-size="15" fill="#1F2A28" text-anchor="middle">fresh water, flat land</text><rect x="400" y="186" width="290" height="118" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="545" y="221.2" font-size="15" fill="#1F2A28" text-anchor="middle">Situation: its links to</text><text x="545" y="240.7" font-size="15" fill="#1F2A28" text-anchor="middle">other places</text><text x="545" y="260.2" font-size="15" fill="#1F2A28" text-anchor="middle">on a trade route, near a</text><text x="545" y="279.7" font-size="15" fill="#1F2A28" text-anchor="middle">port, between two cities</text>
</svg>
