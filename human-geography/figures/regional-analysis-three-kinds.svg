<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Formal, functional and perceptual regions</title>
<desc id="d">Three panels. A formal region shares one trait, drawn as one evenly shaded area, for example where most people speak French. A functional region is organized around a center, drawn as lines from a center to many points, for example a newspaper's delivery area. A perceptual region is what people believe, drawn as two overlapping dashed outlines that do not agree, for example &quot;the South&quot; in the United States.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="760" height="352" fill="#FFFFFF"/>
<rect x="12" y="10" width="236" height="330" rx="8" fill="#FFFFFF" stroke="#C9D3D1" stroke-width="1.6"/><text x="130" y="38" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Formal region</text><text x="130" y="62" font-size="15" fill="#5F6B68" text-anchor="middle">One shared trait</text><path d="M50,110 L200,98 L218,210 L110,240 L40,190 Z" fill="#6CB8C6" stroke="#094953" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="286" font-size="15" fill="#1F2A28" text-anchor="middle">e.g. where most people</text><text x="130" y="305.5" font-size="15" fill="#1F2A28" text-anchor="middle">speak French</text><rect x="260" y="10" width="236" height="330" rx="8" fill="#FFFFFF" stroke="#C9D3D1" stroke-width="1.6"/><text x="378" y="38" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Functional region</text><text x="378" y="62" font-size="15" fill="#5F6B68" text-anchor="middle">Organized around a center</text><line x1="378" y1="170" x2="298" y2="120" stroke="#094953" stroke-width="1.6"/><circle cx="298" cy="120" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="448" y2="100" stroke="#094953" stroke-width="1.6"/><circle cx="448" cy="100" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="468" y2="200" stroke="#094953" stroke-width="1.6"/><circle cx="468" cy="200" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="348" y2="240" stroke="#094953" stroke-width="1.6"/><circle cx="348" cy="240" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="288" y2="200" stroke="#094953" stroke-width="1.6"/><circle cx="288" cy="200" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="398" y2="90" stroke="#094953" stroke-width="1.6"/><circle cx="398" cy="90" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><line x1="378" y1="170" x2="438" y2="230" stroke="#094953" stroke-width="1.6"/><circle cx="438" cy="230" r="5" fill="#094953" stroke="none" stroke-width="1.4"/><circle cx="378" cy="170" r="13" fill="#C24E00" stroke="none" stroke-width="1.4"/><rect x="346" y="189" width="64" height="22" rx="4" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="378" y="205" font-size="14" fill="#C24E00" text-anchor="middle" font-weight="700">Center</text><text x="378" y="286" font-size="15" fill="#1F2A28" text-anchor="middle">e.g. a newspaper's</text><text x="378" y="305.5" font-size="15" fill="#1F2A28" text-anchor="middle">delivery area</text><rect x="508" y="10" width="236" height="330" rx="8" fill="#FFFFFF" stroke="#C9D3D1" stroke-width="1.6"/><text x="626" y="38" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Perceptual region</text><text x="626" y="62" font-size="15" fill="#5F6B68" text-anchor="middle">What people believe</text><path d="M526,140 C546,90 636,90 656,140 C676,190 626,240 576,230 C526,220 511,180 526,140 Z" fill="#A8508A" stroke="#A8508A" stroke-width="2" stroke-dasharray="7 5" fill-opacity="0.18" stroke-linejoin="round" stroke-linecap="round"/><path d="M596,120 C646,80 726,130 722,190 C716,240 646,250 606,220 C566,190 566,140 596,120 Z" fill="#A8508A" stroke="#A8508A" stroke-width="2" stroke-dasharray="3 5" fill-opacity="0.18" stroke-linejoin="round" stroke-linecap="round"/><text x="626" y="286" font-size="15" fill="#1F2A28" text-anchor="middle">e.g. &quot;the South&quot;</text><text x="626" y="305.5" font-size="15" fill="#1F2A28" text-anchor="middle">in the United States</text>
</svg>
