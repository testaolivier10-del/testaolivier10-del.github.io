<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" role="img" aria-labelledby="industrial-revolution-chain-t industrial-revolution-chain-d" font-family="Arial, Helvetica, sans-serif">
<title id="industrial-revolution-chain-t">How the Industrial Revolution changed places</title>
<desc id="industrial-revolution-chain-d">Flow diagram. New machines such as the steam engine, and coal and iron close at hand, lead to factories opening in towns. Factories lead to two effects: farmworkers move to factory towns, so cities grow fast and a working class forms; and mills need cotton, rubber and buyers, so colonies supply raw materials and markets.</desc>
<defs><marker id="industrial-revolution-chain-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="516" fill="#FFFFFF"/>
<rect x="16" y="16" width="296" height="96" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="164" y="57.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">New machines</text><text x="164" y="86.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">(steam engine)</text><rect x="328" y="16" width="296" height="96" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="476" y="57.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Coal and iron</text><text x="476" y="86.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">close at hand</text><line x1="164" y1="112" x2="280" y2="150" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="476" y1="112" x2="360" y2="150" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="120" y="156" width="400" height="70" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="320" y="199.1" font-size="23" font-weight="700" fill="#1F2A28" text-anchor="middle">Factories open in towns</text><line x1="230" y1="226" x2="164" y2="264" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="410" y1="226" x2="476" y2="264" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="16" y="270" width="296" height="96" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="164" y="311.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Farmworkers move</text><text x="164" y="340.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">to factory towns</text><rect x="328" y="270" width="296" height="96" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="476" y="311.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Mills need cotton,</text><text x="476" y="340.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">rubber and buyers</text><line x1="164" y1="366" x2="164" y2="398" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="476" y1="366" x2="476" y2="398" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="16" y="404" width="296" height="96" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="164" y="445.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Cities grow fast;</text><text x="164" y="474.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">a working class forms</text><rect x="328" y="404" width="296" height="96" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="476" y="445.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Colonies supply raw</text><text x="476" y="474.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">materials, markets</text>
</svg>
