<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="industrial-revolution-chain-t industrial-revolution-chain-d" font-family="Arial, Helvetica, sans-serif">
<title id="industrial-revolution-chain-t">How the Industrial Revolution changed places</title>
<desc id="industrial-revolution-chain-d">Flow diagram. New machines such as the steam engine, and coal and iron ore close at hand, lead to factories opening in towns. Factories lead to two effects: farm workers move to factory towns, so cities grow fast and a new working class forms; and factories need more cotton, rubber and buyers, so colonies supply raw materials and markets.</desc>
<defs><marker id="industrial-revolution-chain-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="480" fill="#FFFFFF"/>
<rect x="30" y="20" width="270" height="80" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="165" y="55.0" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">New machines</text><text x="165" y="77.5" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">(the steam engine)</text><rect x="340" y="20" width="270" height="80" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="475" y="55.0" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Coal and iron ore</text><text x="475" y="77.5" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">close at hand</text><line x1="165" y1="100" x2="290" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="475" y1="100" x2="350" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="170" y="145" width="300" height="70" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="320" y="186.3" font-size="18" font-weight="700" fill="#1F2A28" text-anchor="middle">Factories open in towns</text><line x1="250" y1="215" x2="165" y2="255" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="390" y1="215" x2="475" y2="255" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="30" y="260" width="270" height="80" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="165" y="295.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Farm workers move</text><text x="165" y="317.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">to factory towns</text><rect x="340" y="260" width="270" height="80" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="475" y="295.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Factories need more</text><text x="475" y="317.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">cotton, rubber and buyers</text><line x1="165" y1="340" x2="165" y2="375" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><line x1="475" y1="340" x2="475" y2="375" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#industrial-revolution-chain-ar)"/><rect x="30" y="380" width="270" height="80" rx="12" fill="#DDF2EA" stroke="#007A5A" stroke-width="2"/><text x="165" y="415.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Cities grow fast; a new</text><text x="165" y="437.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">working class forms</text><rect x="340" y="380" width="270" height="80" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="475" y="415.1" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Colonies supply raw</text><text x="475" y="437.6" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">materials and markets</text>
</svg>
