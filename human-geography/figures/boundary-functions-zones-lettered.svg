<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="boundary-functions-zones-lettered-t boundary-functions-zones-lettered-d" font-family="Arial, Helvetica, sans-serif">
<title id="boundary-functions-zones-lettered-t">Sea zones off one coast, lettered</title>
<desc id="boundary-functions-zones-lettered-d">A strip of sea running out from a coast in four bands lettered A to D. Band A runs from the coast to 12 nautical miles, band B from 12 to 24, band C from 24 to 200 and band D lies beyond 200 nautical miles. Not to scale.</desc>
<rect width="480" height="300" fill="#FFFFFF"/>
<rect x="0" y="40" width="50" height="200" fill="#EFE9DC" stroke="#1F2A28" stroke-width="2"/><text x="25" y="145.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Land</text><rect x="50" y="40" width="90" height="200" fill="#B9DCE6"/><line x1="140" y1="40" x2="140" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="140" y="40" width="80" height="200" fill="#CFE6EC"/><line x1="220" y1="40" x2="220" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="220" y="40" width="160" height="200" fill="#E2F0F3"/><line x1="380" y1="40" x2="380" y2="240" stroke="#094953" stroke-width="2" stroke-dasharray="6 4"/><rect x="380" y="40" width="90" height="200" fill="#F4FAFB"/><line x1="470" y1="40" x2="470" y2="240" stroke="#094953" stroke-width="2"/><line x1="50" y1="40" x2="50" y2="240" stroke="#1F2A28" stroke-width="3"/><text x="50" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">0</text><text x="140" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">12</text><text x="220" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">24</text><text x="380" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">200</text><text x="275" y="290.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">Nautical miles from the coast (not to scale)</text><circle cx="95" cy="140" r="16" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="95" y="146.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">A</text><circle cx="180" cy="140" r="16" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="180" y="146.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">B</text><circle cx="300" cy="140" r="16" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="300" y="146.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">C</text><circle cx="425" cy="140" r="16" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="425" y="146.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">D</text><text x="240" y="26.0" font-size="16" font-weight="700" fill="#094953" text-anchor="middle">Sea zones off one coast</text>
</svg>
