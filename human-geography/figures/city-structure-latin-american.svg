<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="city-structure-latin-american-t city-structure-latin-american-d" font-family="Arial, Helvetica, sans-serif">
<title id="city-structure-latin-american-t">The Latin American city model</title>
<desc id="city-structure-latin-american-d">A half-circle city around a central business district by a main plaza. A narrow wedge, the spine, runs from the center along a grand avenue: wealthy homes, offices and parks, ending at a mall and a wealthy suburb. Around the center lie rings: first older, solid homes; then homes being improved bit by bit; then on the outer edge self-built squatter settlements. Factories sit in another wedge along a rail line.</desc>
<rect x="0" y="0" width="820" height="440" fill="#FFFFFF" /><path d="M70 410 A230 230 0 0 1 530 410 Z" fill="#ECEDEB" stroke="#1F2A28" stroke-width="1.2"/><path d="M140 410 A160 160 0 0 1 460 410 Z" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1.2"/><path d="M205 410 A95 95 0 0 1 395 410 Z" fill="#D4F0E6" stroke="#1F2A28" stroke-width="1.2"/><path d="M300 410 L270 182 A230 230 0 0 1 330 182 Z" fill="#E4DBEF" stroke="#7A4F9E" stroke-width="2"/><path d="M300 410 L95 303 A230 230 0 0 1 120 266 Z" fill="#F1DDEA" stroke="#A8508A" stroke-width="2"/><path d="M300 410 L262 410 A38 38 0 0 1 338 410 Z" fill="#094953" /><circle cx="300" cy="392" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="300" y="397" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="300" dy="0">1</tspan></text><circle cx="300" cy="250" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="300" y="255" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="300" dy="0">2</tspan></text><circle cx="365" cy="370" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="365" y="375" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="365" dy="0">3</tspan></text><circle cx="410" cy="320" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="410" y="325" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="410" dy="0">4</tspan></text><circle cx="470" cy="280" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="470" y="285" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="470" dy="0">5</tspan></text><circle cx="128" cy="312" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="128" y="317" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="128" dy="0">6</tspan></text><rect x="560" y="20" width="250" height="240" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="575" y="46" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">1 CBD and main plaza</tspan></text><text x="575" y="67" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">2 Spine: wealthy homes and</tspan></text><text x="575" y="88" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">   offices along an avenue</tspan></text><text x="575" y="109" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">3 Zone of maturity: older,</tspan></text><text x="575" y="130" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">   solid homes</tspan></text><text x="575" y="151" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">4 Zone of in situ accretion:</tspan></text><text x="575" y="172" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">   homes improved bit by bit</tspan></text><text x="575" y="193" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">5 Zone of peripheral squatter</tspan></text><text x="575" y="214" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">   settlements: self-built homes</tspan></text><text x="575" y="235" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="575" dy="0">6 Industry along a rail line</tspan></text><text x="410" y="432" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">Wealth follows the spine out from the center; the newest, poorest homes are at the edge.</tspan></text>
</svg>
