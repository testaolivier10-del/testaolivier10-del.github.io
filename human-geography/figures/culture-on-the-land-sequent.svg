<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1070" width="640" height="1070" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sequent occupance on one riverbank</title>
<desc id="d">Three drawings of one invented riverbank. About 1850: a fishing camp of wooden lodges, a drying rack and a canoe. About 1920: a brick mill with a smokestack, a rail line and small workers' houses. About 2020: the same mill, now lofts and a cafe, keeps its smokestack beside a glass tower and a riverside path. Each period left marks that the next one built on.</desc>
