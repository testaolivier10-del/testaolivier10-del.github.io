70" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="304" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="398" y="329.8" font-size="16" fill="#1F2A28" text-anchor="middle">Polish</text><line x1="398" y1="348" x2="398" y2="368" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="368" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="398" y="393.8" font-size="16" fill="#1F2A28" text-anchor="middle">Ukrainian</text><line x1="398" y1="412" x2="398" y2="432" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="336" y="432" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="398" y="457.8" font-size="16" fill="#1F2A28" text-anchor="middle">Czech</text><line x1="320" y1="108" x2="554" y2="168" stroke="#094953" stroke-width="2.2" stroke-linecap="round"/><rect x="482" y="170" width="144" height="48" rx="10" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="554" y="200.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Indo-Iranian</text><line x1="554" y1="220" x2="554" y2="240" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="492" y="240" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="554" y="265.8" font-size="16" fill="#1F2A28" text-anchor="middle">Hindi</text><line x1="554" y1="284" x2="554" y2="304" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="492" y="304" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="554" y="329.8" font-size="16" fill="#1F2A28" text-anchor="middle">Bengali</text><line x1="554" y1="348" x2="554" y2="368" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="492" y="368" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="554" y="393.8" font-size="16" fill="#1F2A28" text-anchor="middle">Punjabi</text><line x1="554" y1="412" x2="554" y2="432" stroke="#6B7370" stroke-width="1.6" stroke-linecap="round"/><rect x="492" y="432" width="124" height="40" rx="6" fill="#F4F7F9" stroke="#6B7370" stroke-width="1.4"/><text x="554" y="457.8" font-size="16" fill="#1F2A28" text-anchor="middle">Persian</text><text x="28" y="520" font-size="15" fill="#6B7370">Family, then branch, then language. Dialects are versions of one language.</text><text x="28" y="542" font-size="15" fill="#6B7370">Only some branches and languages are shown.</text>
