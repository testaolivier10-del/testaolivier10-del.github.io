<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="cities-worldwide-metro-t cities-worldwide-metro-d" font-family="Arial, Helvetica, sans-serif">
<title id="cities-worldwide-metro-t">The parts of a large metro area</title>
<desc id="cities-worldwide-metro-d">A metro area seen from above. The old central city sits in the middle. Rings of suburbs spread around it, crossed by highways. Where two highways meet in the suburbs stands an edge city of office towers and malls. One fast-growing suburb has become a boomburb. Beyond the built-up edge, scattered houses on large lots among farms form the exurbs.</desc>
<rect x="0" y="0" width="820" height="470" fill="#FFFFFF" /><circle cx="330" cy="240" r="215" fill="#E8F1D2" /><circle cx="330" cy="240" r="165" fill="#F3EEDF" /><circle cx="330" cy="240" r="60" fill="#D7ECEF" stroke="#094953" stroke-width="2"/><line x1="60" y1="240" x2="600" y2="240" stroke="#6B6F6C" stroke-width="6" /><line x1="330" y1="20" x2="330" y2="460" stroke="#6B6F6C" stroke-width="6" /><line x1="150" y1="60" x2="520" y2="430" stroke="#6B6F6C" stroke-width="5" /><rect x="300" y="225" width="12" height="22" fill="#094953" /><rect x="318" y="250" width="12" height="22" fill="#094953" /><rect x="340" y="228" width="12" height="22" fill="#094953" /><rect x="352" y="252" width="12" height="22" fill="#094953" /><rect x="326" y="212" width="12" height="22" fill="#094953" /><rect x="282" y="306" width="96" height="22" fill="#FFFFFF" rx="4"/><text x="330" y="322" font-size="15" text-anchor="middle" font-weight="bold" fill="#094953"><tspan x="330" dy="0">Central city</tspan></text><rect x="455" y="148" width="14" height="30" fill="#C24E00" /><rect x="465" y="160" width="14" height="30" fill="#C24E00" /><rect x="478" y="150" width="14" height="30" fill="#C24E00" /><text x="468" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="#C24E00"><tspan x="468" dy="0">Edge city:</tspan><tspan x="468" dy="17.5">offices, malls, jobs</tspan></text><circle cx="200" cy="380" r="42" fill="#F1DDEA" stroke="#A8508A" stroke-width="2"/><text x="200" y="385" font-size="14" text-anchor="middle" font-weight="bold" fill="#A8508A"><tspan x="200" dy="0">Boomburb</tspan></text><rect x="144" y="120" width="162" height="21" fill="#FFFFFF" rx="4"/><text x="225" y="135" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="225" dy="0">Suburbs: mostly homes</tspan></text><rect x="90" y="120" width="10" height="8" fill="#009E73" /><rect x="110" y="410" width="10" height="8" fill="#009E73" /><rect x="560" y="95" width="10" height="8" fill="#009E73" /><rect x="585" y="380" width="10" height="8" fill="#009E73" /><rect x="70" y="300" width="10" height="8" fill="#009E73" /><text x="560" y="70" font-size="14" text-anchor="middle" font-weight="bold" fill="#009E73"><tspan x="560" dy="0">Exurbs: homes on big lots among farms</tspan></text><rect x="600" y="140" width="210" height="190" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="615" y="165" font-size="15" text-anchor="start" font-weight="bold" fill="#1F2A28"><tspan x="615" dy="0">Key</tspan></text><rect x="615" y="178" width="18" height="14" fill="#D7ECEF" /><text x="642" y="190" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="642" dy="0">Old central city</tspan></text><rect x="615" y="202" width="18" height="14" fill="#F3EEDF" /><text x="642" y="214" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="642" dy="0">Suburbs (built up)</tspan></text><rect x="615" y="226" width="18" height="14" fill="#E8F1D2" /><text x="642" y="238" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="642" dy="0">Exurbs and farmland</tspan></text><line x1="615" y1="258" x2="633" y2="258" stroke="#6B6F6C" stroke-width="5" /><text x="642" y="263" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="642" dy="0">Highway</tspan></text><rect x="615" y="276" width="18" height="14" fill="#C24E00" /><text x="642" y="288" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="642" dy="0">Edge city towers</tspan></text><text x="615" y="316" font-size="13" text-anchor="start" font-weight="normal" fill="#6B6F6C"><tspan x="615" dy="0">Not to scale</tspan></text>
</svg>
