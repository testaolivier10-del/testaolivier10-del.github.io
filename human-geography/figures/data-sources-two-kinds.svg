<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Quantitative and qualitative geographic data</title>
<desc id="d">Two columns. Quantitative data are numbers you can count or measure: a count of people in each town, satellite readings of crop cover, phone positions from satellite navigation, shares of homes with internet. Qualitative data are words, pictures and experiences: interviews with farmers, field notes and sketches, photos of a street, travel accounts and news stories. A note says a geographic information system, or GIS, stacks both kinds as layers on one map so you can ask how they line up.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<text x="190" y="34" font-size="19" fill="#094953" text-anchor="middle" font-weight="700">Quantitative data</text><text x="190" y="58" font-size="15" fill="#5F6B68" text-anchor="middle">numbers you can count or measure</text><text x="530" y="34" font-size="19" fill="#C24E00" text-anchor="middle" font-weight="700">Qualitative data</text><text x="530" y="58" font-size="15" fill="#5F6B68" text-anchor="middle">words, pictures and experiences</text><rect x="30" y="76" width="320" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="190" y="108.4" font-size="15" fill="#1F2A28" text-anchor="middle">A count of people in each town</text><rect x="30" y="140" width="320" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="190" y="172.4" font-size="15" fill="#1F2A28" text-anchor="middle">Satellite readings of crop cover</text><rect x="30" y="204" width="320" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="190" y="226.7" font-size="15" fill="#1F2A28" text-anchor="middle">Phone positions from satellite</text><text x="190" y="246.2" font-size="15" fill="#1F2A28" text-anchor="middle">navigation</text><rect x="30" y="268" width="320" height="54" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="190" y="300.4" font-size="15" fill="#1F2A28" text-anchor="middle">Shares of homes with internet</text><rect x="370" y="76" width="320" height="54" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="530" y="108.4" font-size="15" fill="#1F2A28" text-anchor="middle">Interviews with farmers</text><rect x="370" y="140" width="320" height="54" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="530" y="172.4" font-size="15" fill="#1F2A28" text-anchor="middle">Field notes and sketches</text><rect x="370" y="204" width="320" height="54" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="530" y="236.4" font-size="15" fill="#1F2A28" text-anchor="middle">Photos of a street</text><rect x="370" y="268" width="320" height="54" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="530" y="300.4" font-size="15" fill="#1F2A28" text-anchor="middle">Travel accounts and news stories</text><rect x="20" y="344" width="680" height="58" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="360" y="368" font-size="15" fill="#1F2A28" text-anchor="middle">A geographic information system (GIS) stacks both kinds as layers on one map,</text><text x="360" y="387.5" font-size="15" fill="#1F2A28" text-anchor="middle">so you can ask how they line up.</text>
</svg>
