<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="development-theories-world-system-t development-theories-world-system-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-theories-world-system-t">Wallerstein's world system</title>
<desc id="development-theories-world-system-d">Three stacked boxes. Core at the top: most high-wage, high-tech and decision work. Semiperiphery in the middle: a mix of factories, some research and some farming. Periphery at the bottom: mostly raw materials and low-wage work. An arrow on the left carries raw materials and cheap labor up toward the core; an arrow on the right carries factory goods, loans and profits down from the core.</desc>
<defs><marker id="development-theories-world-system-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="420" fill="#FFFFFF"/>
<rect x="170" y="16" width="300" height="90" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="44.3" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">Core</text><text x="320" y="71.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Most high-wage, high-tech</text><text x="320" y="92.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">and decision work</text><rect x="170" y="166" width="300" height="90" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="320" y="194.3" font-size="18" font-weight="700" fill="#7A4F9E" text-anchor="middle">Semiperiphery</text><text x="320" y="221.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">A mix: factories, some</text><text x="320" y="242.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">research, some farming</text><rect x="170" y="316" width="300" height="90" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="320" y="344.3" font-size="18" font-weight="700" fill="#C24E00" text-anchor="middle">Periphery</text><text x="320" y="371.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">Mostly raw materials</text><text x="320" y="392.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">and low-wage work</text><line x1="150" y1="316" x2="150" y2="110" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-theories-world-system-ar)"/><line x1="490" y1="110" x2="490" y2="316" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-theories-world-system-ar)"/><text x="76" y="175.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">Raw</text><text x="76" y="195.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">materials,</text><text x="76" y="215.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">cheap</text><text x="76" y="235.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">labor</text><text x="566" y="175.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">Factory</text><text x="566" y="195.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">goods,</text><text x="566" y="215.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">loans,</text><text x="566" y="235.6" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle">profits</text>
