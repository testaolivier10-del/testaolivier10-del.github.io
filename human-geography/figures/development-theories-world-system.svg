<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" width="640" height="464" role="img" aria-labelledby="development-theories-world-system-t development-theories-world-system-d" font-family="Arial, Helvetica, sans-serif">
<title id="development-theories-world-system-t">Wallerstein's world system</title>
<desc id="development-theories-world-system-d">Three stacked boxes. Core at the top: high-wage, high-tech and decision work. Semiperiphery in the middle: factories, some research and farming. Periphery at the bottom: raw materials and low-wage work. An arrow on the left carries raw goods and cheap labor up toward the core; an arrow on the right carries goods, loans and profits down from the core.</desc>
<defs><marker id="development-theories-world-system-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="464" fill="#FFFFFF"/>
<rect x="150" y="10" width="340" height="112" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="45.0" font-size="23" font-weight="700" fill="#094953" text-anchor="middle">Core</text><text x="320" y="77.7" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">High-wage, high-tech</text><text x="320" y="104.0" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">and decision work</text><rect x="150" y="176" width="340" height="112" rx="12" fill="#EEE6F5" stroke="#7A4F9E" stroke-width="2"/><text x="320" y="211.1" font-size="23" font-weight="700" fill="#7A4F9E" text-anchor="middle">Semiperiphery</text><text x="320" y="243.7" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">Factories, some</text><text x="320" y="270.0" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">research, farming</text><rect x="150" y="342" width="340" height="112" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="320" y="377.1" font-size="23" font-weight="700" fill="#C24E00" text-anchor="middle">Periphery</text><text x="320" y="409.7" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">Raw materials,</text><text x="320" y="436.0" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">low-wage work</text><line x1="128" y1="342" x2="128" y2="126" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-theories-world-system-ar)"/><line x1="512" y1="126" x2="512" y2="342" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#development-theories-world-system-ar)"/><text x="62" y="200.0" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">Raw</text><text x="62" y="226.2" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">goods,</text><text x="62" y="252.5" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">cheap</text><text x="62" y="278.7" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">labor</text><text x="578" y="213.1" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">Goods,</text><text x="578" y="239.3" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">loans,</text><text x="578" y="265.6" font-size="21" font-weight="400" fill="#1F2A28" text-anchor="middle">profits</text>
</svg>
