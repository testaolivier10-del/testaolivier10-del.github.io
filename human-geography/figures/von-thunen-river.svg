<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Land use around an invented market town with a river</title>
<desc id="d">A drawn map of an invented region. Zones of land use surround a market town in stretched ovals that are much longer east to west, along a river, than north to south. Zones are lettered from the town outward: W nearest the town, then X, Y and Z. Area V, in the far corner, lies outside all the zones. A small town in the southeast has its own small zone the same color as zone W around it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<rect x="4" y="4" width="712" height="412" rx="4" fill="#EFEBDD" stroke="#C9D3D1" stroke-width="1.6"/><ellipse cx="300" cy="210" rx="300" ry="150" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.4"/><ellipse cx="300" cy="210" rx="235" ry="112" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.4"/><ellipse cx="300" cy="210" rx="170" ry="78" fill="#5E9E6E" stroke="#1F2A28" stroke-width="1.4"/><ellipse cx="300" cy="210" rx="95" ry="44" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><path d="M4,210 L716,210" fill="none" stroke="#4A90B8" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><text x="660" y="198" font-size="15" fill="#1F5F82" text-anchor="middle" font-style="italic">River</text><circle cx="620" cy="330" r="44" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><circle cx="620" cy="330" r="12" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="620" y="392" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Small town</text><circle cx="300" cy="210" r="16" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><rect x="248" y="166" width="104" height="24" rx="4" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1"/><text x="300" y="184" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Market town</text><circle cx="322" cy="237" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="322" y="244" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">W</text><circle cx="322" cy="271" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="322" y="278" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">X</text><circle cx="322" cy="305" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="322" y="312" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Y</text><circle cx="322" cy="341" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="322" y="348" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Z</text><circle cx="70" cy="60" r="15" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="70" y="67" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">V</text>
