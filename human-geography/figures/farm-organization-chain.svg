<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A commodity chain from seed to plate</title>
<desc id="d">Six boxes joined by arrows in two rows: inputs (seed, fertilizer, machines), then farm (grows the crop), then processor (mills, packs, cooks), then distributor (ships and stores), then store (sells to shoppers), then consumer (buys and eats). A note says that vertical integration means one agribusiness owns or controls several of these steps.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="460" fill="#FFFFFF"/>
<text x="240" y="28" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">A commodity chain:</text><text x="240" y="54" font-size="18" fill="#1F2A28" text-anchor="middle">every step from seed to plate</text><rect x="6" y="76" width="148" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="80" y="108" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Inputs</text><text x="80" y="144" font-size="17" fill="#1F2A28" text-anchor="middle">seed, fertilizer,</text><text x="80" y="166.1" font-size="17" fill="#1F2A28" text-anchor="middle">machines</text><rect x="166" y="76" width="148" height="130" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="240" y="108" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Farm</text><text x="240" y="144" font-size="17" fill="#1F2A28" text-anchor="middle">grows the</text><text x="240" y="166.1" font-size="17" fill="#1F2A28" text-anchor="middle">crop</text><rect x="326" y="76" width="148" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="400" y="108" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Processor</text><text x="400" y="144" font-size="17" fill="#1F2A28" text-anchor="middle">mills, packs,</text><text x="400" y="166.1" font-size="17" fill="#1F2A28" text-anchor="middle">cooks</text><rect x="326" y="250" width="148" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="400" y="282" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Distributor</text><text x="400" y="318" font-size="17" fill="#1F2A28" text-anchor="middle">ships and</text><text x="400" y="340.1" font-size="17" fill="#1F2A28" text-anchor="middle">stores</text><rect x="166" y="250" width="148" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="240" y="282" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Store</text><text x="240" y="318" font-size="17" fill="#1F2A28" text-anchor="middle">sells to</text><text x="240" y="340.1" font-size="17" fill="#1F2A28" text-anchor="middle">shoppers</text><rect x="6" y="250" width="148" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="80" y="282" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Consumer</text><text x="80" y="318" font-size="17" fill="#1F2A28" text-anchor="middle">buys and</text><text x="80" y="340.1" font-size="17" fill="#1F2A28" text-anchor="middle">eats</text><line x1="155" y1="141" x2="164" y2="141" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><line x1="315" y1="141" x2="324" y2="141" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><line x1="400" y1="207" x2="400" y2="247" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><line x1="325" y1="315" x2="316" y2="315" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><line x1="165" y1="315" x2="156" y2="315" stroke="#1F2A28" stroke-width="2.6" marker-end="url(#ar-ink)"/><text x="240" y="416" font-size="17" fill="#C24E00" text-anchor="middle" font-weight="700">Vertical integration: one agribusiness</text><text x="240" y="438.1" font-size="17" fill="#C24E00" text-anchor="middle" font-weight="700">owns or controls several of these steps.</text>
</svg>
