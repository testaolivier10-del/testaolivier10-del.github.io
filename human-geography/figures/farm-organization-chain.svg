<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A commodity chain from seed to plate</title>
<desc id="d">Six boxes joined by arrows, left to right: inputs (seed, fertilizer, machines), farm (grows the crop), processor (mills, packs, cooks), distributor (ships and stores), store (sells to shoppers) and consumer (buys and eats). A bracket under the first four boxes says one agribusiness may own or control several steps, which is called vertical integration.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="330" fill="#FFFFFF"/>
<rect x="6" y="90" width="104" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="58" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Inputs</text><text x="58" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">seed,</text><text x="58" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">fertilizer,</text><text x="58" y="197" font-size="15" fill="#1F2A28" text-anchor="middle">machines</text><line x1="112" y1="155" x2="123" y2="155" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ar-ink)"/><rect x="125" y="90" width="104" height="130" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="177" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Farm</text><text x="177" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">grows the</text><text x="177" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">crop</text><line x1="231" y1="155" x2="242" y2="155" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ar-ink)"/><rect x="244" y="90" width="104" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="296" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Processor</text><text x="296" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">mills, packs,</text><text x="296" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">cooks</text><line x1="350" y1="155" x2="361" y2="155" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ar-ink)"/><rect x="363" y="90" width="104" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="415" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Distributor</text><text x="415" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">ships and</text><text x="415" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">stores</text><line x1="469" y1="155" x2="480" y2="155" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ar-ink)"/><rect x="482" y="90" width="104" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="534" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Store</text><text x="534" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">sells to</text><text x="534" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">shoppers</text><line x1="588" y1="155" x2="599" y2="155" stroke="#1F2A28" stroke-width="2.2" marker-end="url(#ar-ink)"/><rect x="601" y="90" width="104" height="130" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="653" y="122" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Consumer</text><text x="653" y="158" font-size="15" fill="#1F2A28" text-anchor="middle">buys and</text><text x="653" y="177.5" font-size="15" fill="#1F2A28" text-anchor="middle">eats</text><text x="360" y="34" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">A commodity chain: every step from seed to plate</text><path d="M10,250 L10,262 L470,262 L470,250" fill="none" stroke="#C24E00" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="290" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">One agribusiness may own or control</text><text x="240" y="309.5" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">several steps (vertical integration)</text>
</svg>
