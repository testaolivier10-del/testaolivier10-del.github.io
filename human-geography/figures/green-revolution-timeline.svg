<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Big changes in farming, in order</title>
<desc id="d">A timeline with four boxes from top to bottom. First Agricultural Revolution, from about 12,000 years ago: plants and animals domesticated. Second Agricultural Revolution, 1700s and 1800s: crop rotation, new tools and machines. Green Revolution, about the 1960s to the 1980s: high-yield seeds and fertilizer. Genetically modified crops, from the late 1990s: genes changed in a lab. The last box is a different color: it came after the Green Revolution and is not part of it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="610" fill="#FFFFFF"/>
<text x="240" y="30" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Big changes in farming, in order</text><line x1="30" y1="60" x2="30" y2="600" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar-ink)"/><circle cx="30" cy="112" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="54" y="56" width="418" height="116" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="70" y="88" font-size="19" fill="#1F2A28" font-weight="700">First Agricultural Revolution</text><text x="70" y="118" font-size="18" fill="#C24E00" font-weight="700">from about 12,000 years ago</text><text x="70" y="148" font-size="18" fill="#1F2A28">plants and animals domesticated</text><circle cx="30" cy="246" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="54" y="190" width="418" height="116" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="70" y="222" font-size="19" fill="#1F2A28" font-weight="700">Second Agricultural Revolution</text><text x="70" y="252" font-size="18" fill="#C24E00" font-weight="700">1700s and 1800s</text><text x="70" y="282" font-size="18" fill="#1F2A28">rotation, new tools, machines</text><circle cx="30" cy="380" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="54" y="324" width="418" height="116" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="70" y="356" font-size="19" fill="#1F2A28" font-weight="700">Green Revolution</text><text x="70" y="386" font-size="18" fill="#C24E00" font-weight="700">about 1960s to 1980s</text><text x="70" y="416" font-size="18" fill="#1F2A28">high-yield seeds, fertilizer</text><circle cx="30" cy="514" r="10" fill="#A8508A" stroke="none" stroke-width="1.4"/><rect x="54" y="458" width="418" height="116" rx="8" fill="#F4E6EF" stroke="#A8508A" stroke-width="1.8"/><text x="70" y="490" font-size="19" fill="#1F2A28" font-weight="700">Genetically modified crops</text><text x="70" y="520" font-size="18" fill="#C24E00" font-weight="700">from the late 1990s</text><text x="70" y="550" font-size="18" fill="#1F2A28">genes changed in a lab</text>
</svg>
