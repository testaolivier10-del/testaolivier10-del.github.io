<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Big changes in farming, in order</title>
<desc id="d">A timeline with four boxes. First Agricultural Revolution, from about 12,000 years ago: plants and animals domesticated. Second Agricultural Revolution, 1700s and 1800s: crop rotation, new tools and machines. Green Revolution, about the 1960s to the 1980s: high-yield seeds and fertilizer. Genetically modified crops, from the late 1990s: genes changed in a lab. The last box is a different color: it came after the Green Revolution and is not part of it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="330" fill="#FFFFFF"/>
<line x1="30" y1="70" x2="700" y2="70" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar-ink)"/><circle cx="100" cy="70" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="20" y="100" width="160" height="190" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="100" y="128" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">First</text><text x="100" y="148.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Agricultural</text><text x="100" y="169.6" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Revolution</text><text x="100" y="208" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">from about</text><text x="100" y="227.5" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">12,000 years ago</text><text x="100" y="258" font-size="15" fill="#1F2A28" text-anchor="middle">plants and animals</text><text x="100" y="277.5" font-size="15" fill="#1F2A28" text-anchor="middle">domesticated</text><circle cx="272" cy="70" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="192" y="100" width="160" height="190" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="272" y="128" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Second</text><text x="272" y="148.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Agricultural</text><text x="272" y="169.6" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Revolution</text><text x="272" y="208" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">1700s and 1800s</text><text x="272" y="258" font-size="15" fill="#1F2A28" text-anchor="middle">rotation, new</text><text x="272" y="277.5" font-size="15" fill="#1F2A28" text-anchor="middle">tools, machines</text><circle cx="444" cy="70" r="10" fill="#094953" stroke="none" stroke-width="1.4"/><rect x="364" y="100" width="160" height="190" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="444" y="128" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Green</text><text x="444" y="148.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Revolution</text><text x="444" y="208" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">about 1960s</text><text x="444" y="227.5" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">to 1980s</text><text x="444" y="258" font-size="15" fill="#1F2A28" text-anchor="middle">high-yield seeds,</text><text x="444" y="277.5" font-size="15" fill="#1F2A28" text-anchor="middle">fertilizer</text><circle cx="616" cy="70" r="10" fill="#A8508A" stroke="none" stroke-width="1.4"/><rect x="536" y="100" width="160" height="190" rx="8" fill="#F4E6EF" stroke="#A8508A" stroke-width="1.8"/><text x="616" y="128" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Genetically</text><text x="616" y="148.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">modified</text><text x="616" y="169.6" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">crops</text><text x="616" y="208" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">from the</text><text x="616" y="227.5" font-size="15" fill="#C24E00" text-anchor="middle" font-weight="700">late 1990s</text><text x="616" y="258" font-size="15" fill="#1F2A28" text-anchor="middle">genes changed</text><text x="616" y="277.5" font-size="15" fill="#1F2A28" text-anchor="middle">in a lab</text><text x="360" y="36" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Big changes in farming, in order</text>
