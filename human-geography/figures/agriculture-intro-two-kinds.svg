<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 614" width="480" height="614" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Extensive and intensive agriculture</title>
<desc id="d">Two stacked panels. Extensive agriculture uses few inputs per hectare over large areas: shifting cultivation in the Amazon basin of Brazil, nomadic herding on the grasslands of Mongolia and ranching on the Pampas of Argentina. Intensive agriculture uses many inputs per hectare on small areas: market gardening near Rotterdam in the Netherlands, plantation agriculture such as oil palm in Malaysia, and mixed crop and livestock farming in the Corn Belt of Iowa.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="614" fill="#FFFFFF"/>
<rect x="6" y="6" width="468" height="294" rx="8" fill="#FFFFFF" stroke="#C24E00" stroke-width="2.2"/><rect x="6" y="6" width="468" height="62" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="2.2"/><text x="240" y="34" font-size="22" fill="#C24E00" text-anchor="middle" font-weight="700">Extensive</text><text x="240" y="58" font-size="17" fill="#1F2A28" text-anchor="middle">Few inputs per hectare, large areas</text><rect x="20" y="80" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="106" font-size="19" fill="#1F2A28" font-weight="700">Shifting cultivation</text><text x="34" y="130" font-size="17" fill="#5F6B68">Amazon basin, Brazil</text><rect x="20" y="152" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="178" font-size="19" fill="#1F2A28" font-weight="700">Nomadic herding</text><text x="34" y="202" font-size="17" fill="#5F6B68">grasslands of Mongolia</text><rect x="20" y="224" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="250" font-size="19" fill="#1F2A28" font-weight="700">Ranching</text><text x="34" y="274" font-size="17" fill="#5F6B68">the Pampas, Argentina</text><rect x="6" y="314" width="468" height="294" rx="8" fill="#FFFFFF" stroke="#094953" stroke-width="2.2"/><rect x="6" y="314" width="468" height="62" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2.2"/><text x="240" y="342" font-size="22" fill="#094953" text-anchor="middle" font-weight="700">Intensive</text><text x="240" y="366" font-size="17" fill="#1F2A28" text-anchor="middle">Many inputs per hectare, small areas</text><rect x="20" y="388" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="414" font-size="19" fill="#1F2A28" font-weight="700">Market gardening</text><text x="34" y="438" font-size="17" fill="#5F6B68">near Rotterdam, Netherlands</text><rect x="20" y="460" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="486" font-size="19" fill="#1F2A28" font-weight="700">Plantation agriculture</text><text x="34" y="510" font-size="17" fill="#5F6B68">oil palm in Malaysia</text><rect x="20" y="532" width="440" height="62" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="34" y="558" font-size="19" fill="#1F2A28" font-weight="700">Mixed crop and livestock</text><text x="34" y="582" font-size="17" fill="#5F6B68">the Corn Belt, Iowa</text>
</svg>
