<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" width="720" height="486" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Extensive and intensive agriculture</title>
<desc id="d">Two columns. Extensive agriculture uses few inputs per hectare over large areas: shifting cultivation in the Amazon basin of Brazil, nomadic herding on the grasslands of Mongolia and ranching on the Pampas of Argentina. Intensive agriculture uses many inputs per hectare on small areas: market gardening near Rotterdam in the Netherlands, plantation agriculture such as oil palm in Malaysia, and mixed crop and livestock farming in the Corn Belt of Iowa. An arrow below points from extensive to intensive: more labor, money and machines per hectare.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="486" fill="#FFFFFF"/>
