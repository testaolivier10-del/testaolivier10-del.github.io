"90" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="402" y="230" font-size="18" fill="#1F2A28" font-weight="700">Plantation agriculture</text><text x="402" y="258" font-size="15" fill="#5F6B68">oil palm in Malaysia</text><rect x="386" y="300" width="308" height="90" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="402" y="334" font-size="18" fill="#1F2A28" font-weight="700">Mixed crop and livestock</text><text x="402" y="362" font-size="15" fill="#5F6B68">the Corn Belt, Iowa</text><line x1="60" y1="440" x2="660" y2="440" stroke="#1F2A28" stroke-width="2.4" marker-end="url(#ar-ink)"/><text x="360" y="470" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">More labor, money and machines per hectare</text>
