<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Births, deaths and migration change a population</title>
<desc id="d">Diagram: a population box with four arrows. Births and people moving in add to it; deaths and people moving out take away. A dashed box around births and deaths is labeled natural increase. The rate of natural increase in percent is the crude birth rate minus the crude death rate, divided by 10; total growth adds net migration.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="384" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Four flows change a population</text><rect x="36" y="56" width="226" height="250" rx="12" fill="none" stroke="#094953" stroke-width="2" stroke-dasharray="7 5"/><text x="149" y="80" font-size="16" fill="#094953" text-anchor="middle" font-weight="700">Natural increase</text><rect x="270" y="150" width="180" height="70" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="360" y="191.5" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Population</text><rect x="56" y="100" width="160" height="50" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="136" y="130.8" font-size="16" fill="#1F2A28" text-anchor="middle">Births (CBR)</text><rect x="56" y="226" width="160" height="50" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="136" y="256.8" font-size="16" fill="#1F2A28" text-anchor="middle">Deaths (CDR)</text><rect x="504" y="100" width="180" height="50" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="594" y="130.8" font-size="16" fill="#1F2A28" text-anchor="middle">People moving in</text><rect x="504" y="226" width="180" height="50" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="594" y="256.8" font-size="16" fill="#1F2A28" text-anchor="middle">People moving out</text><line x1="218" y1="125" x2="268" y2="165" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)"/><line x1="268" y1="207" x2="218" y2="245" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)"/><line x1="502" y1="125" x2="452" y2="165" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)"/><line x1="452" y1="207" x2="502" y2="245" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)"/><text x="360" y="336" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Rate of natural increase (%) = (CBR − CDR) ÷ 10: births and deaths only.</text><text x="360" y="362" font-size="15" fill="#5F6B68" text-anchor="middle">Total growth adds net migration (people moving in minus people moving out).</text>
</svg>
