<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" width="480" height="490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Bid-rent lines for three kinds of farming</title>
<desc id="d">A graph. The vertical axis is the rent a farmer can pay for a hectare of land; the horizontal axis is distance from the market. Three falling lines: market gardening starts highest and falls fastest, grain starts in the middle and falls more slowly, ranching starts lowest and falls slowest. A colored band under the axis shows which use can pay the most at each distance: market gardening nearest the market, then grain, then ranching farthest away.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="490" fill="#FFFFFF"/>
<line x1="64" y1="115" x2="232.4" y2="400" stroke="#C24E00" stroke-width="3.4"/><line x1="64" y1="220" x2="324" y2="400" stroke="#094953" stroke-width="3.4"/><line x1="64" y1="322" x2="454" y2="400" stroke="#009E73" stroke-width="3.4"/><line x1="64" y1="400" x2="64" y2="86" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><line x1="64" y1="400" x2="468" y2="400" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="12" y="24" font-size="18" fill="#1F2A28" font-weight="700">Rent a farmer can pay</text><text x="259" y="470" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Distance from the market</text><text x="64" y="424" font-size="17" fill="#1F2A28" text-anchor="middle">Market</text><rect x="64" y="434" width="105" height="14" rx="2" fill="#C24E00" stroke="none" stroke-width="1.6"/><rect x="169" y="434" width="102.2" height="14" rx="2" fill="#094953" stroke="none" stroke-width="1.6"/><rect x="271.2" y="434" width="182.8" height="14" rx="2" fill="#009E73" stroke="none" stroke-width="1.6"/><text x="103" y="124" font-size="18" fill="#C24E00" font-weight="700">Market gardening</text><text x="220" y="292" font-size="18" fill="#094953" font-weight="700">Grain</text><text x="337" y="360" font-size="18" fill="#009E73" font-weight="700">Ranching</text>
</svg>
