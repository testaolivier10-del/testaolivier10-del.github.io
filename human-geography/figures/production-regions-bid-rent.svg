<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Bid-rent lines for three kinds of farming</title>
<desc id="d">A graph. The vertical axis is the rent a farmer can pay for a hectare of land; the horizontal axis is distance from the market. Three falling lines: market gardening starts highest and falls fastest, grain starts in the middle and falls more slowly, ranching starts lowest and falls slowest. A colored band under the axis shows which use can pay the most at each distance: market gardening nearest the market, then grain, then ranching farthest away.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="456" fill="#FFFFFF"/>
<line x1="90" y1="76" x2="340.5" y2="380" stroke="#C24E00" stroke-width="3"/><line x1="90" y1="188" x2="476.7" y2="380" stroke="#094953" stroke-width="3"/><line x1="90" y1="296.8" x2="670" y2="380" stroke="#009E73" stroke-width="3"/><line x1="90" y1="380" x2="90" y2="50" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><line x1="90" y1="380" x2="680" y2="380" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="20" y="60" font-size="15" fill="#1F2A28" font-weight="700">Rent a</text><text x="20" y="79.5" font-size="15" fill="#1F2A28" font-weight="700">farmer</text><text x="20" y="99" font-size="15" fill="#1F2A28" font-weight="700">can pay</text><text x="380" y="440" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Distance from the market</text><text x="90" y="402" font-size="15" fill="#1F2A28" text-anchor="middle">Market</text><rect x="90" y="410" width="156.2" height="12" rx="2" fill="#C24E00" stroke="none" stroke-width="1.6"/><rect x="246.2" y="410" width="152" height="12" rx="2" fill="#094953" stroke="none" stroke-width="1.6"/><rect x="398.1" y="410" width="271.9" height="12" rx="2" fill="#009E73" stroke="none" stroke-width="1.6"/><text x="136.4" y="80" font-size="16" fill="#C24E00" font-weight="700">Market gardening</text><text x="298.8" y="264.8" font-size="16" fill="#094953" font-weight="700">Grain</text><text x="449.6" y="332.4" font-size="16" fill="#009E73" font-weight="700">Ranching</text>
</svg>
