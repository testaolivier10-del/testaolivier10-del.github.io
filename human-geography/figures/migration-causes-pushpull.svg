<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Push factors, pull factors and what lies between</title>
<desc id="d">Diagram: an origin box with push factors (low pay, drought, war) and a destination box with pull factors (jobs, safety, family), joined by an arrow. An obstacle sits on the arrow: intervening obstacles such as distance, cost, borders, seas and rough land. A dashed branch leaves the arrow and stops at an intervening opportunity, a job on the way.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="340" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Why people move</text><rect x="20" y="70" width="200" height="180" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="120" y="165.8" font-size="16" fill="#1F2A28" text-anchor="middle"></text><text x="120" y="98" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Origin</text><text x="120" y="128" font-size="15" fill="#1F2A28" text-anchor="middle">Push factors</text><text x="120" y="152" font-size="15" fill="#1F2A28" text-anchor="middle">low pay</text><text x="120" y="176" font-size="15" fill="#1F2A28" text-anchor="middle">drought</text><text x="120" y="200" font-size="15" fill="#1F2A28" text-anchor="middle">war</text><rect x="500" y="70" width="200" height="180" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="600" y="165.8" font-size="16" fill="#1F2A28" text-anchor="middle"></text><text x="600" y="98" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Destination</text><text x="600" y="128" font-size="15" fill="#1F2A28" text-anchor="middle">Pull factors</text><text x="600" y="152" font-size="15" fill="#1F2A28" text-anchor="middle">jobs</text><text x="600" y="176" font-size="15" fill="#1F2A28" text-anchor="middle">safety</text><text x="600" y="200" font-size="15" fill="#1F2A28" text-anchor="middle">family</text><line x1="222" y1="160" x2="496" y2="160" stroke="#094953" stroke-width="4" marker-end="url(#ar-teal)"/><rect x="296" y="140" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.8"/><text x="360" y="165.4" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Obstacle</text><text x="360" y="212" font-size="15" fill="#1F2A28" text-anchor="middle">Intervening obstacles: distance,</text><text x="360" y="231.5" font-size="15" fill="#1F2A28" text-anchor="middle">cost, borders, seas, rough land</text><path d="M246 160 Q246 290 318 300" fill="none" stroke="#A8508A" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-purp)"/><circle cx="324" cy="300" r="7" fill="#A8508A" stroke="none" stroke-width="1.4"/><text x="342" y="296" font-size="15" fill="#A8508A" font-weight="700">Intervening opportunity:</text><text x="342" y="315.5" font-size="15" fill="#A8508A" font-weight="700">a job on the way</text>
</svg>
