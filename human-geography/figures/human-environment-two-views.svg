<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Environmental determinism against possibilism</title>
<desc id="d">Left: environmental determinism, an idea of the late 1800s and early 1900s: an arrow says the physical environment, climate and land, decides how people live and behave. Right: possibilism, the view that replaced it: the physical environment sets limits and offers options, and a two-way arrow says people choose, as culture and technology shape how they use it. A note says determinism was used to claim that people in hot climates could not govern themselves, an argument for colonial rule, and that geographers rejected it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="356" fill="#FFFFFF"/>
<text x="180" y="30" font-size="18" fill="#C24E00" text-anchor="middle" font-weight="700">Environmental determinism</text><text x="180" y="52" font-size="14" fill="#5F6B68" text-anchor="middle">an idea of the late 1800s and early 1900s</text><rect x="40" y="76" width="280" height="56" rx="8" fill="#F3E7C9" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="99.7" font-size="15" fill="#1F2A28" text-anchor="middle">The physical environment</text><text x="180" y="119.2" font-size="15" fill="#1F2A28" text-anchor="middle">(climate, land)</text><line x1="180" y1="134" x2="180" y2="186" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)"/><text x="192" y="166" font-size="15" fill="#C24E00" font-weight="700">decides</text><rect x="40" y="190" width="280" height="56" rx="8" fill="#F4F7F7" stroke="#C24E00" stroke-width="1.8"/><text x="180" y="213.7" font-size="15" fill="#1F2A28" text-anchor="middle">How people live and</text><text x="180" y="233.2" font-size="15" fill="#1F2A28" text-anchor="middle">how they behave</text><line x1="360" y1="18" x2="360" y2="270" stroke="#C9D3D1" stroke-width="2"/><text x="540" y="30" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Possibilism</text><text x="540" y="52" font-size="14" fill="#5F6B68" text-anchor="middle">the view that replaced it</text><rect x="400" y="76" width="280" height="56" rx="8" fill="#F3E7C9" stroke="#094953" stroke-width="1.8"/><text x="540" y="99.7" font-size="15" fill="#1F2A28" text-anchor="middle">The physical environment</text><text x="540" y="119.2" font-size="15" fill="#1F2A28" text-anchor="middle">sets limits and offers options</text><line x1="540" y1="136" x2="540" y2="186" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)" marker-start="url(#ar-teal)"/><text x="552" y="166" font-size="15" fill="#094953" font-weight="700">people choose</text><rect x="400" y="190" width="280" height="56" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="540" y="213.7" font-size="15" fill="#1F2A28" text-anchor="middle">Culture and technology</text><text x="540" y="233.2" font-size="15" fill="#1F2A28" text-anchor="middle">shape how people use it</text><rect x="20" y="280" width="680" height="60" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.4"/><text x="360" y="304" font-size="15" fill="#1F2A28" text-anchor="middle">Determinism was used to claim that people in hot climates could not govern</text><text x="360" y="323.5" font-size="15" fill="#1F2A28" text-anchor="middle">themselves, an argument for colonial rule. Geographers rejected it.</text>
</svg>
