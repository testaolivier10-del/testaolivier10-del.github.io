<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="urban-sustainability-tod-t urban-sustainability-tod-d" font-family="Arial, Helvetica, sans-serif">
<title id="urban-sustainability-tod-t">Building around a station versus spreading out</title>
<desc id="urban-sustainability-tod-d">Two panels. Left: a rail station in the middle of a ten-minute walking circle, with shops below apartments, offices, a small park, bike lanes and sidewalks, all close together. Right: houses on cul-de-sacs far from a strip mall and an office park, joined only by wide roads, so every trip is by car.</desc>
<rect x="0" y="0" width="820" height="430" fill="#FFFFFF" /><text x="205" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#094953"><tspan x="205" dy="0">Built around a station</tspan></text><text x="615" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#C24E00"><tspan x="615" dy="0">Spread out, built for cars</tspan></text><line x1="410" y1="45" x2="410" y2="400" stroke="#C9CCC8" stroke-width="2" /><circle cx="205" cy="220" r="150" fill="#D7ECEF" /><circle cx="205" cy="220" r="150" fill="none" stroke="#094953" stroke-width="2" stroke-dasharray="8 6"/><line x1="40" y1="220" x2="370" y2="220" stroke="#1F2A28" stroke-width="5" /><rect x="190" y="208" width="30" height="24" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="205" y="254" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="205" dy="0">Station</tspan></text><rect x="130" y="150" width="34" height="40" fill="#3E7C86" /><rect x="130" y="180" width="34" height="10" fill="#C24E00" /><rect x="250" y="150" width="34" height="40" fill="#3E7C86" /><rect x="250" y="180" width="34" height="10" fill="#C24E00" /><rect x="130" y="270" width="34" height="40" fill="#3E7C86" /><rect x="130" y="300" width="34" height="10" fill="#C24E00" /><rect x="250" y="270" width="34" height="40" fill="#3E7C86" /><rect x="250" y="300" width="34" height="10" fill="#C24E00" /><circle cx="205" cy="130" r="18" fill="#D4F0E6" stroke="#009E73" stroke-width="2"/><text x="205" y="108" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="205" dy="0">Park</tspan></text><text x="205" y="395" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="205" dy="0">Shops below homes and offices,</tspan><tspan x="205" dy="17.5">all within a 10-minute walk</tspan></text><rect x="470" y="90" width="18" height="14" fill="#B8D8DD" /><rect x="500" y="120" width="18" height="14" fill="#B8D8DD" /><rect x="470" y="150" width="18" height="14" fill="#B8D8DD" /><rect x="740" y="300" width="18" height="14" fill="#B8D8DD" /><rect x="770" y="330" width="18" height="14" fill="#B8D8DD" /><rect x="740" y="360" width="18" height="14" fill="#B8D8DD" /><path d="M440 230 L800 230" fill="none" stroke="#6B6F6C" stroke-width="10"/><path d="M500 230 C500 180 490 140 480 110" fill="none" stroke="#6B6F6C" stroke-width="4"/><path d="M740 230 C740 270 750 300 755 330" fill="none" stroke="#6B6F6C" stroke-width="4"/><rect x="560" y="160" width="90" height="40" fill="#C24E00" /><text x="605" y="152" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="605" dy="0">Strip mall</tspan></text><rect x="600" y="270" width="90" height="40" fill="#7A4F9E" /><text x="645" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="645" dy="0">Office park</tspan></text><text x="615" y="395" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="615" dy="0">Homes, shops and jobs far apart:</tspan><tspan x="615" dy="17.5">almost every trip by car</tspan></text>
</svg>
