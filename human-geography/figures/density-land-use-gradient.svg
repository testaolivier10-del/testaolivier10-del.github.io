<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="density-land-use-gradient-t density-land-use-gradient-d" font-family="Arial, Helvetica, sans-serif">
<title id="density-land-use-gradient-t">Density falls with distance from downtown</title>
<desc id="density-land-use-gradient-d">A side view of a city from downtown on the left to the edge on the right. Tall towers stand downtown, then mid-rise apartment blocks, then row houses, then single-family houses on large lots, then farmland. One empty lot between the mid-rise blocks is being filled with a new apartment building, marked as infill.</desc>
<rect x="0" y="0" width="820" height="380" fill="#FFFFFF" /><line x1="20" y1="300" x2="800" y2="300" stroke="#1F2A28" stroke-width="2" /><rect x="30" y="80" width="34" height="220" fill="#094953" /><rect x="70" y="40" width="34" height="260" fill="#094953" /><rect x="110" y="100" width="34" height="200" fill="#094953" /><rect x="150" y="60" width="34" height="240" fill="#094953" /><rect x="210" y="190" width="32" height="110" fill="#3E7C86" /><rect x="250" y="180" width="32" height="120" fill="#3E7C86" /><rect x="330" y="195" width="32" height="105" fill="#3E7C86" /><rect x="370" y="185" width="32" height="115" fill="#3E7C86" /><rect x="290" y="200" width="32" height="100" fill="none" stroke="#C24E00" stroke-width="3" stroke-dasharray="6 4"/><text x="306" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#C24E00"><tspan x="306" dy="0">Infill:</tspan><tspan x="306" dy="17.5">new building</tspan><tspan x="306" dy="17.5">on an empty lot</tspan></text><rect x="430" y="250" width="20" height="50" fill="#7FB3BB" /><rect x="452" y="250" width="20" height="50" fill="#7FB3BB" /><rect x="474" y="250" width="20" height="50" fill="#7FB3BB" /><rect x="496" y="250" width="20" height="50" fill="#7FB3BB" /><rect x="560" y="268" width="34" height="32" fill="#B8D8DD" /><path d="M556 268 L577 252 L598 268 Z" fill="#B8D8DD" /><rect x="620" y="268" width="34" height="32" fill="#B8D8DD" /><path d="M616 268 L637 252 L658 268 Z" fill="#B8D8DD" /><rect x="680" y="268" width="34" height="32" fill="#B8D8DD" /><path d="M676 268 L697 252 L718 268 Z" fill="#B8D8DD" /><rect x="730" y="290" width="70" height="10" fill="#E8F1D2" /><text x="765" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="765" dy="0">Farms</tspan></text><text x="90" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="90" dy="0">Downtown towers</tspan></text><text x="300" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="300" dy="0">Mid-rise apartments</tspan></text><text x="463" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="463" dy="0">Row houses</tspan></text><text x="630" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="630" dy="0">Houses on big lots</tspan></text><text x="410" y="365" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">More people per square kilometer near the center; fewer toward the edge.</tspan></text>
</svg>
