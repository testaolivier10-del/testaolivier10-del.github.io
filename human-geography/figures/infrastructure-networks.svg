<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="infrastructure-networks-t infrastructure-networks-d" font-family="Arial, Helvetica, sans-serif">
<title id="infrastructure-networks-t">Where the pipes, wires and rails reach</title>
<desc id="infrastructure-networks-d">A plan of a city. The older center is crossed by a grid of water mains, power lines and a rail line with stations. New homes and factories cluster near the stations. On the far edge, a newer settlement on a hillside has no water mains or rail, only a dirt road and a water tank truck.</desc>
