<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Population grows geometrically, food arithmetically</title>
<desc id="d">Graph over four generations: population doubles each generation (1, 2, 4, 8, 16) while food grows by one step each generation (1, 2, 3, 4, 5), so the population line rises far above the food line. A box says population outruns food, followed by famine, disease and war.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="390" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Malthus’s idea (1798)</text><line x1="90" y1="320" x2="620" y2="320" stroke="#1F2A28" stroke-width="2"/><line x1="90" y1="320" x2="90" y2="70" stroke="#1F2A28" stroke-width="2"/><path d="M110 305 L230 290 L350 260 L470 200 L590 80" fill="none" stroke="#C24E00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 305 L230 290 L350 275 L470 260 L590 245" fill="none" stroke="#009E73" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="110" cy="305" r="5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="110" y="344" font-size="15" fill="#1F2A28" text-anchor="middle">0</text><circle cx="230" cy="290" r="5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="230" y="344" font-size="15" fill="#1F2A28" text-anchor="middle">1</text><circle cx="350" cy="260" r="5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="350" y="344" font-size="15" fill="#1F2A28" text-anchor="middle">2</text><circle cx="470" cy="200" r="5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="470" y="344" font-size="15" fill="#1F2A28" text-anchor="middle">3</text><circle cx="590" cy="80" r="5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="590" y="344" font-size="15" fill="#1F2A28" text-anchor="middle">4</text><circle cx="110" cy="305" r="5" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="230" cy="290" r="5" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="350" cy="275" r="5" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="470" cy="260" r="5" fill="#009E73" stroke="none" stroke-width="1.4"/><circle cx="590" cy="245" r="5" fill="#009E73" stroke="none" stroke-width="1.4"/><text x="355" y="368" font-size="15" fill="#1F2A28" text-anchor="middle">Generations (about 25 years each)</text><rect x="361.5" y="69" width="222.5" height="20.3" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="580" y="84" font-size="15" fill="#C24E00" text-anchor="end" font-weight="700">Population: 1, 2, 4, 8, 16</text><text x="80" y="196" font-size="15" fill="#1F2A28" text-anchor="end">Amount</text><rect x="429.3" y="291" width="164.8" height="20.3" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.6"/><text x="590" y="306" font-size="15" fill="#009E73" text-anchor="end" font-weight="700">Food: 1, 2, 3, 4, 5</text><rect x="120" y="84" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.8"/><text x="235" y="110.7" font-size="15" fill="#1F2A28" text-anchor="middle">Population outruns food:</text><text x="235" y="130.2" font-size="15" fill="#1F2A28" text-anchor="middle">famine, disease, war</text>
</svg>
