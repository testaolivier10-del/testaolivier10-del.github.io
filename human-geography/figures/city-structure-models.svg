<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="city-structure-models-t city-structure-models-d" font-family="Arial, Helvetica, sans-serif">
<title id="city-structure-models-t">Four models of the North American city</title>
<desc id="city-structure-models-d">Four small diagrams. Concentric zone: rings around one downtown center. Sector: wedges that run out from the center along transport lines. Multiple nuclei: several separate centers scattered in the city, such as a downtown, an airport area, a university and an industrial park. Galactic city: an old downtown plus edge cities spaced along a ring highway, with homes and farmland between.</desc>
<rect x="0" y="0" width="820" height="330" fill="#FFFFFF" /><rect x="10" y="10" width="190" height="250" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="105" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="105" dy="0">Concentric zone</tspan></text><circle cx="105" cy="145" r="85" fill="#E8F1D2" stroke="#1F2A28" stroke-width="1"/><circle cx="105" cy="145" r="65" fill="#D4F0E6" stroke="#1F2A28" stroke-width="1"/><circle cx="105" cy="145" r="47" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1"/><circle cx="105" cy="145" r="30" fill="#F8DCC8" stroke="#1F2A28" stroke-width="1"/><circle cx="105" cy="145" r="14" fill="#094953" stroke="#1F2A28" stroke-width="1"/><rect x="215" y="10" width="190" height="250" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="310" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="310" dy="0">Sector</tspan></text><path d="M310 145 L310.0 60.0 A85 85 0 0 1 383.6 102.5 Z" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1"/><path d="M310 145 L383.6 102.5 A85 85 0 0 1 393.7 159.8 Z" fill="#F8DCC8" stroke="#1F2A28" stroke-width="1"/><path d="M310 145 L393.7 159.8 A85 85 0 0 1 324.8 228.7 Z" fill="#D4F0E6" stroke="#1F2A28" stroke-width="1"/><path d="M310 145 L324.8 228.7 A85 85 0 0 1 244.9 199.6 Z" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1"/><path d="M310 145 L244.9 199.6 A85 85 0 0 1 236.4 102.5 Z" fill="#F1DDEA" stroke="#1F2A28" stroke-width="1"/><path d="M310 145 L236.4 102.5 A85 85 0 0 1 310.0 60.0 Z" fill="#D4F0E6" stroke="#1F2A28" stroke-width="1"/><circle cx="310" cy="145" r="14" fill="#094953" /><rect x="420" y="10" width="190" height="250" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="515" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="515" dy="0">Multiple nuclei</tspan></text><circle cx="515" cy="145" r="85" fill="#F3EEDF" stroke="#1F2A28" stroke-width="1"/><circle cx="500" cy="135" r="16" fill="#094953" /><circle cx="560" cy="105" r="14" fill="#F8DCC8" stroke="#C24E00" stroke-width="2"/><circle cx="465" cy="185" r="14" fill="#D4F0E6" stroke="#009E73" stroke-width="2"/><circle cx="550" cy="190" r="14" fill="#F1DDEA" stroke="#A8508A" stroke-width="2"/><rect x="625" y="10" width="190" height="250" fill="#FBFBFA" stroke="#C9CCC8" rx="8"/><text x="720" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="720" dy="0">Galactic city</tspan></text><circle cx="720" cy="145" r="85" fill="#E8F1D2" /><circle cx="720" cy="145" r="62" fill="none" stroke="#6B6F6C" stroke-width="5"/><circle cx="720" cy="145" r="13" fill="#094953" /><circle cx="782" cy="145" r="11" fill="#C24E00" /><circle cx="720" cy="207" r="11" fill="#C24E00" /><circle cx="658" cy="145" r="11" fill="#C24E00" /><circle cx="720" cy="83" r="11" fill="#C24E00" /><line x1="720" y1="60" x2="720" y2="230" stroke="#6B6F6C" stroke-width="3" /><line x1="635" y1="145" x2="805" y2="145" stroke="#6B6F6C" stroke-width="3" /><circle cx="30" cy="285" r="9" fill="#094953" /><text x="46" y="290" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="46" dy="0">Downtown (CBD)</tspan></text><circle cx="200" cy="285" r="9" fill="#C24E00" /><text x="216" y="290" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="216" dy="0">Other centers of jobs and shops</tspan></text><line x1="470" y1="285" x2="500" y2="285" stroke="#6B6F6C" stroke-width="5" /><text x="508" y="290" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="508" dy="0">Highway</tspan></text><text x="410" y="320" font-size="14" text-anchor="middle" font-weight="normal" fill="#6B6F6C"><tspan x="410" dy="0">Each is a simplified model built from mid-1900s North American cities.</tspan></text>
</svg>
