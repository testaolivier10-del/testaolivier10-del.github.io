<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Green Revolution package</title>
<desc id="d">Four inputs on the left: high-yield seeds, chemical fertilizer, irrigation water, and pesticides and machines. Arrows from all four lead to one box: more grain per hectare. From it, one arrow leads to benefits (more food grown, fewer famines, lower grain prices) and one to costs (heavy water use, chemical runoff, debt for small farms, fewer crop varieties). Caption: the Green Revolution package, about the 1960s to the 1980s.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="390" fill="#FFFFFF"/>
<rect x="10" y="20" width="220" height="60" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="55.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">High-yield seeds</text><line x1="232" y1="50" x2="290" y2="170" stroke="#094953" stroke-width="2" marker-end="url(#ar-teal)"/><rect x="10" y="98" width="220" height="60" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="133.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Chemical fertilizer</text><line x1="232" y1="128" x2="290" y2="170" stroke="#094953" stroke-width="2" marker-end="url(#ar-teal)"/><rect x="10" y="176" width="220" height="60" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="211.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Irrigation water</text><line x1="232" y1="206" x2="290" y2="170" stroke="#094953" stroke-width="2" marker-end="url(#ar-teal)"/><rect x="10" y="254" width="220" height="60" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="289.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Pesticides and machines</text><line x1="232" y1="284" x2="290" y2="170" stroke="#094953" stroke-width="2" marker-end="url(#ar-teal)"/><rect x="296" y="130" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.6"/><text x="376" y="166.8" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">More grain</text><text x="376" y="190.2" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">per hectare</text><line x1="458" y1="160" x2="498" y2="92" stroke="#009E73" stroke-width="2.4" marker-end="url(#ar-green)"/><line x1="458" y1="186" x2="498" y2="252" stroke="#C24E00" stroke-width="2.4" marker-end="url(#ar-verm)"/><rect x="500" y="20" width="210" height="140" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="605" y="48" font-size="18" fill="#00694D" text-anchor="middle" font-weight="700">Benefits</text><text x="516" y="78" font-size="15" fill="#1F2A28">more food grown</text><text x="516" y="97.5" font-size="15" fill="#1F2A28">fewer famines</text><text x="516" y="117" font-size="15" fill="#1F2A28">lower grain prices</text><rect x="500" y="182" width="210" height="150" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="605" y="210" font-size="18" fill="#C24E00" text-anchor="middle" font-weight="700">Costs</text><text x="516" y="240" font-size="15" fill="#1F2A28">heavy water use</text><text x="516" y="259.5" font-size="15" fill="#1F2A28">chemical runoff</text><text x="516" y="279" font-size="15" fill="#1F2A28">debt for small farms</text><text x="516" y="298.5" font-size="15" fill="#1F2A28">fewer crop varieties</text><text x="360" y="372" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">The Green Revolution package, about 1960s to 1980s</text>
