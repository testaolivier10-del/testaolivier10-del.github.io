<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 522" width="480" height="522" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Green Revolution package</title>
<desc id="d">Four inputs at the top: high-yield seeds, chemical fertilizer, irrigation water, and pesticides and machines. An arrow leads to one box: more grain per hectare. From it, one arrow leads to benefits (more food grown, fewer famines, lower grain prices) and one to costs (heavy water use, chemical runoff, debt for small farms, fewer crop varieties). Title: the Green Revolution package, about the 1960s to the 1980s.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="522" fill="#FFFFFF"/>
<text x="240" y="28" font-size="20" fill="#094953" text-anchor="middle" font-weight="700">The Green Revolution package</text><text x="240" y="52" font-size="17" fill="#5F6B68" text-anchor="middle">about the 1960s to the 1980s</text><rect x="10" y="70" width="224" height="64" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="122" y="97.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">High-yield</text><text x="122" y="119.2" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">seeds</text><rect x="246" y="70" width="224" height="64" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="358" y="97.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Chemical</text><text x="358" y="119.2" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">fertilizer</text><rect x="10" y="146" width="224" height="64" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="122" y="173.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Irrigation</text><text x="122" y="195.2" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">water</text><rect x="246" y="146" width="224" height="64" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="358" y="173.1" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Pesticides</text><text x="358" y="195.2" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">and machines</text><line x1="240" y1="220" x2="240" y2="246" stroke="#094953" stroke-width="3" marker-end="url(#ar-teal)"/><rect x="110" y="250" width="260" height="60" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.6"/><text x="240" y="286.8" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">More grain per hectare</text><line x1="180" y1="312" x2="120" y2="340" stroke="#009E73" stroke-width="2.6" marker-end="url(#ar-green)"/><line x1="300" y1="312" x2="360" y2="340" stroke="#C24E00" stroke-width="2.6" marker-end="url(#ar-verm)"/><rect x="6" y="344" width="228" height="170" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="120" y="374" font-size="19" fill="#00694D" text-anchor="middle" font-weight="700">Benefits</text><text x="20" y="406" font-size="17" fill="#1F2A28">more food grown</text><text x="20" y="428.1" font-size="17" fill="#1F2A28">fewer famines</text><text x="20" y="450.2" font-size="17" fill="#1F2A28">lower grain prices</text><rect x="246" y="344" width="228" height="170" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="360" y="374" font-size="19" fill="#C24E00" text-anchor="middle" font-weight="700">Costs</text><text x="260" y="406" font-size="17" fill="#1F2A28">heavy water use</text><text x="260" y="428.1" font-size="17" fill="#1F2A28">chemical runoff</text><text x="260" y="450.2" font-size="17" fill="#1F2A28">debt for small farms</text><text x="260" y="472.3" font-size="17" fill="#1F2A28">fewer crop varieties</text>
</svg>
