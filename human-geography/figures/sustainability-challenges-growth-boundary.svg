<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="sustainability-challenges-growth-boundary-t sustainability-challenges-growth-boundary-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainability-challenges-growth-boundary-t">A metro area with an urban growth boundary</title>
<desc id="sustainability-challenges-growth-boundary-d">An invented metro area. A river runs through the old downtown. The built-up area spreads around it, and a dashed line, the urban growth boundary, circles it with some empty land left inside. Outside the line are farms and forest. Letter W marks a rail station in a suburb. Letter X marks an empty lot inside the boundary. Letter Y marks farmland just outside the boundary. Letter Z marks an old factory site on the river near downtown.</desc>
