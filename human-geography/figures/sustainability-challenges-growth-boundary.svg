dy="0">Y</tspan></text><circle cx="450" cy="300" r="13" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="450" y="305" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2A28"><tspan x="450" dy="0">Z</tspan></text><rect x="14" y="352" width="230" height="118" fill="#FFFFFF" stroke="#C9CCC8" rx="8"/><path d="M28 376 L58 376" fill="none" stroke="#C24E00" stroke-width="3" stroke-dasharray="8 5"/><text x="68" y="381" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="68" dy="0">Urban growth boundary</tspan></text><rect x="28" y="392" width="30" height="14" fill="#F3EEDF" /><text x="68" y="404" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="68" dy="0">Built-up area</tspan></text><rect x="28" y="416" width="30" height="14" fill="#E8F1D2" stroke="#BFD9A8"/><text x="68" y="428" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="68" dy="0">Farms and forest</tspan></text><line x1="28" y1="447" x2="58" y2="447" stroke="#1F2A28" stroke-width="3" /><text x="68" y="452" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="68" dy="0">Rail line</tspan></text><text x="800" y="470" font-size="13" text-anchor="end" font-weight="normal" fill="#6B6F6C"><tspan x="800" dy="0">Invented metro area for practice. Not to scale.</tspan></text>
