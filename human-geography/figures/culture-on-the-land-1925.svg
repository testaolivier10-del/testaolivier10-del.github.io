<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Main Street, about 1925</title>
<desc id="d">Scene 1, Main Street of an invented river town in about 1925: a white wooden church with a steeple and cross, a general store with the sign &quot;Lindqvist &amp; Sons General Store&quot;, a brick flour mill with a smoking smokestack, and two small workers' houses. A horse pulls a cart on the dirt street and two people walk past. Every sign is in English.</desc>
