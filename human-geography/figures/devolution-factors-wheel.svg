<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 385" width="480" height="385" role="img" aria-labelledby="devolution-factors-wheel-t devolution-factors-wheel-d" font-family="Arial, Helvetica, sans-serif">
<title id="devolution-factors-wheel-t">Factors that push devolution</title>
<desc id="devolution-factors-wheel-d">A central oval reads: devolution, power moves from the national level to regions. Six boxes point arrows at it: physical division, ethnic separatism, ethnic cleansing, terrorism, economic and social problems, and irredentism.</desc>
<rect width="480" height="385" fill="#FFFFFF"/>
<defs><marker id="devolution-factors-wheel-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker></defs><ellipse cx="240" cy="200" rx="115" ry="52" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="240" y="190.0" font-size="18" font-weight="700" fill="#094953" text-anchor="middle">Devolution</text><text x="240" y="212.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">power moves from the</text><text x="240" y="230.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">national level to regions</text><rect x="11" y="28" width="148" height="52" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="85" y="48.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Physical</text><text x="85" y="66.8" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">division</text><line x1="85" y1="82" x2="170.25" y2="146" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/><rect x="166" y="28" width="148" height="52" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="240" y="48.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Ethnic</text><text x="240" y="66.8" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">separatism</text><line x1="240" y1="82" x2="240" y2="146" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/><rect x="321" y="28" width="148" height="33" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="395" y="48.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Ethnic cleansing</text><line x1="395" y1="63" x2="309.75" y2="146" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/><rect x="11" y="308" width="148" height="33" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="85" y="328.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Terrorism</text><line x1="85" y1="306" x2="170.25" y2="254" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/><rect x="166" y="308" width="148" height="52" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="240" y="328.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Economic and</text><text x="240" y="346.8" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">social problems</text><line x1="240" y1="306" x2="240" y2="254" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/><rect x="321" y="308" width="148" height="33" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="395" y="328.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">Irredentism</text><line x1="395" y1="306" x2="309.75" y2="254" stroke="#094953" stroke-width="2" marker-end="url(#devolution-factors-wheel-k)"/>
</svg>
