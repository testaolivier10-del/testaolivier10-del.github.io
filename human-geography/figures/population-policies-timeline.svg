<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">China, Singapore and Iran moved from lowering births to raising them</title>
<desc id="d">Timeline from 1970 to 2026. China: the one-child policy, antinatalist, from 1980 to 2015, then the limit eased to two children from 2016, and a three-child policy from 2021 aimed at raising births. Singapore: Stop at Two, antinatalist, from 1972, then from 1987 a pronatalist call for three or more children if families can afford them. Iran: a family planning program, antinatalist, from 1989, and a 2021 law to raise births.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="760" height="380" fill="#FFFFFF"/>
<text x="400" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Policies change as fertility falls</text><line x1="150" y1="60" x2="150" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="150" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">1970</text><line x1="246.4" y1="60" x2="246.4" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="246.4" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">1980</text><line x1="342.9" y1="60" x2="342.9" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="342.9" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">1990</text><line x1="439.3" y1="60" x2="439.3" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="439.3" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">2000</text><line x1="535.7" y1="60" x2="535.7" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="535.7" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">2010</text><line x1="632.1" y1="60" x2="632.1" y2="300" stroke="#C9D3D1" stroke-width="1"/><text x="632.1" y="322" font-size="15" fill="#5F6B68" text-anchor="middle">2020</text><text x="136" y="116" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="700">China</text><rect x="246.4" y="96" width="344.2" height="32" rx="4" fill="#C24E00" stroke="none" stroke-width="1.6"/><text x="419.5" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">One-child policy</text><rect x="593.6" y="96" width="46.2" height="32" rx="4" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="617.7" y="118" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Two</text><rect x="641.8" y="96" width="46.2" height="32" rx="4" fill="#094953" stroke="none" stroke-width="1.6"/><text x="645.8" y="148" font-size="15" fill="#094953" font-weight="700">Three</text><text x="136" y="196" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="700">Singapore</text><rect x="169.3" y="176" width="141.7" height="32" rx="4" fill="#C24E00" stroke="none" stroke-width="1.6"/><text x="241.1" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Stop at Two</text><rect x="313.9" y="176" width="374.1" height="32" rx="4" fill="#094953" stroke="none" stroke-width="1.6"/><text x="502" y="198" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Three or more, if you can afford it</text><text x="136" y="276" font-size="17" fill="#1F2A28" text-anchor="end" font-weight="700">Iran</text><rect x="333.2" y="256" width="218.8" height="32" rx="4" fill="#C24E00" stroke="none" stroke-width="1.6"/><text x="443.6" y="278" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Family planning program</text><rect x="641.8" y="256" width="46.2" height="32" rx="4" fill="#094953" stroke="none" stroke-width="1.6"/><text x="645.8" y="308" font-size="15" fill="#094953" font-weight="700">2021 law</text><rect x="150" y="346" width="18" height="18" rx="3" fill="#C24E00" stroke="none" stroke-width="1.6"/><text x="176" y="361" font-size="15" fill="#1F2A28">Antinatalist: lower births</text><rect x="380" y="346" width="18" height="18" rx="3" fill="#A8508A" stroke="none" stroke-width="1.6"/><text x="406" y="361" font-size="15" fill="#1F2A28">Limit eased</text><rect x="520" y="346" width="18" height="18" rx="3" fill="#094953" stroke="none" stroke-width="1.6"/><text x="546" y="361" font-size="15" fill="#1F2A28">Pronatalist: raise births</text>
</svg>
