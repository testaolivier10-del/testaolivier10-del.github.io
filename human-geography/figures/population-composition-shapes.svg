<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Expansive, stationary and constrictive pyramids</title>
<desc id="d">Three population pyramid outlines, males on the left and females on the right, youngest at the bottom. Expansive: a wide base that narrows quickly, a young, growing population. Stationary: nearly straight sides, births and deaths balanced for decades. Constrictive: a base narrower than the middle, births have fallen and the population is older.</desc>
