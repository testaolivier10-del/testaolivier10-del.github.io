<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 728" width="480" height="728" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Von Thünen model: rings of land use around one market</title>
<desc id="d">Concentric rings around a market town M on a flat plain. Ring 1, nearest the market: market gardening and dairy. Ring 2: forest, for fuel and lumber. Ring 3: grain and field crops. Ring 4: livestock ranching. Beyond ring 4 is wilderness.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="480" height="728" fill="#FFFFFF"/>
<rect x="4" y="4" width="472" height="446" rx="4" fill="#EFEBDD" stroke="#C9D3D1" stroke-width="1.6"/><circle cx="240" cy="226" r="214" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.4"/><circle cx="240" cy="226" r="150" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.4"/><circle cx="240" cy="226" r="92" fill="#5E9E6E" stroke="#1F2A28" stroke-width="1.4"/><circle cx="240" cy="226" r="46" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><circle cx="240" cy="226" r="18" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="240" y="233" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">M</text><circle cx="240" cy="157" r="17" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="240" y="164" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">1</text><circle cx="240" cy="105" r="17" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="240" y="112" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">2</text><circle cx="240" cy="44" r="17" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="240" y="51" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">3</text><circle cx="392" cy="366" r="17" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="392" y="373" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">4</text><rect x="14" y="466" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.4"/><text x="32" y="491" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">M</text><text x="64" y="491" font-size="18" fill="#1F2A28">Market town</text><rect x="14" y="512" width="36" height="36" rx="4" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><text x="32" y="537" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="64" y="537" font-size="18" fill="#1F2A28">Market gardening and dairy</text><rect x="14" y="558" width="36" height="36" rx="4" fill="#5E9E6E" stroke="#1F2A28" stroke-width="1.4"/><text x="32" y="583" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="64" y="583" font-size="18" fill="#1F2A28">Forest (fuel and lumber)</text><rect x="14" y="604" width="36" height="36" rx="4" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.4"/><text x="32" y="629" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">3</text><text x="64" y="629" font-size="18" fill="#1F2A28">Grain and field crops</text><rect x="14" y="650" width="36" height="36" rx="4" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.4"/><text x="32" y="675" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">4</text><text x="64" y="675" font-size="18" fill="#1F2A28">Livestock ranching</text><text x="14" y="714" font-size="17" fill="#5F6B68">Beyond ring 4: wilderness</text>
