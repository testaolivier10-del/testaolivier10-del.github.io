<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Von Thünen model: rings of land use around one market</title>
<desc id="d">Concentric rings around a market town M on a flat plain. Ring 1, nearest the market: market gardening and dairy. Ring 2: forest, for wood used as fuel and for building. Ring 3: grain and field crops. Ring 4: livestock ranching. Beyond ring 4 is wilderness.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="470" fill="#FFFFFF"/>
<rect x="4" y="4" width="452" height="452" rx="4" fill="#EFEBDD" stroke="#C9D3D1" stroke-width="1.6"/><circle cx="230" cy="230" r="210" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.4"/><circle cx="230" cy="230" r="150" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.4"/><circle cx="230" cy="230" r="95" fill="#5E9E6E" stroke="#1F2A28" stroke-width="1.4"/><circle cx="230" cy="230" r="50" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><circle cx="230" cy="230" r="16" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="230" y="236" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">M</text><circle cx="230" cy="158" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="230" y="164" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">1</text><circle cx="230" cy="108" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="230" y="114" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">2</text><circle cx="230" cy="50" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="230" y="56" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">3</text><circle cx="380" cy="380" r="14" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="380" y="386" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">4</text><rect x="476" y="26" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.4"/><text x="494" y="50" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">M</text><text x="524" y="40" font-size="15" fill="#1F2A28">Market town</text><rect x="476" y="110" width="36" height="36" rx="4" fill="#C24E00" stroke="#1F2A28" stroke-width="1.4"/><text x="494" y="134" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="524" y="124" font-size="15" fill="#1F2A28">Market gardening</text><text x="524" y="143.5" font-size="15" fill="#1F2A28">and dairy</text><rect x="476" y="194" width="36" height="36" rx="4" fill="#5E9E6E" stroke="#1F2A28" stroke-width="1.4"/><text x="494" y="218" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="524" y="208" font-size="15" fill="#1F2A28">Forest (wood</text><text x="524" y="227.5" font-size="15" fill="#1F2A28">for fuel, building)</text><rect x="476" y="278" width="36" height="36" rx="4" fill="#E6D79A" stroke="#1F2A28" stroke-width="1.4"/><text x="494" y="302" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">3</text><text x="524" y="292" font-size="15" fill="#1F2A28">Grain and</text><text x="524" y="311.5" font-size="15" fill="#1F2A28">field crops</text><rect x="476" y="362" width="36" height="36" rx="4" fill="#BFDDA8" stroke="#1F2A28" stroke-width="1.4"/><text x="494" y="386" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">4</text><text x="524" y="376" font-size="15" fill="#1F2A28">Livestock ranching</text><text x="476" y="446" font-size="15" fill="#5F6B68">Beyond ring 4:</text><text x="476" y="465.5" font-size="15" fill="#5F6B68">wilderness</text>
</svg>
