<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four steps for reading a map, table or chart</title>
<desc id="d">Four numbered cards. 1, Title: what does it show, where and when? 2, Legend and units: what do the shades and numbers mean? 3, Source line: who made the data, and in what year? 4, Pattern: where is it high, where low, and by how much, naming a real place and a value.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<text x="360" y="34" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Read any map, table or chart in four steps</text><rect x="20" y="56" width="330" height="164" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><circle cx="50" cy="86" r="18" fill="#094953" stroke="none" stroke-width="1.4"/><text x="50" y="93" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="80" y="93" font-size="19" fill="#094953" font-weight="700">Title</text><text x="40" y="132" font-size="16" fill="#1F2A28">What does it show,</text><text x="40" y="152.8" font-size="16" fill="#1F2A28">where and when?</text><text x="40" y="182" font-size="15" fill="#5F6B68" font-style="italic">Share of people in cities,</text><text x="40" y="201.5" font-size="15" fill="#5F6B68" font-style="italic">by country, 2020</text><rect x="370" y="56" width="330" height="164" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><circle cx="400" cy="86" r="18" fill="#094953" stroke="none" stroke-width="1.4"/><text x="400" y="93" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="430" y="93" font-size="19" fill="#094953" font-weight="700">Legend and units</text><text x="390" y="132" font-size="16" fill="#1F2A28">What do the shades</text><text x="390" y="152.8" font-size="16" fill="#1F2A28">and numbers mean?</text><text x="390" y="182" font-size="15" fill="#5F6B68" font-style="italic">Darker = higher;</text><text x="390" y="201.5" font-size="15" fill="#5F6B68" font-style="italic">units are percent</text><rect x="20" y="236" width="330" height="164" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><circle cx="50" cy="266" r="18" fill="#094953" stroke="none" stroke-width="1.4"/><text x="50" y="273" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="80" y="273" font-size="19" fill="#094953" font-weight="700">Source line</text><text x="40" y="312" font-size="16" fill="#1F2A28">Who made the data,</text><text x="40" y="332.8" font-size="16" fill="#1F2A28">and in what year?</text><text x="40" y="362" font-size="15" fill="#5F6B68" font-style="italic">A dated source,</text><text x="40" y="381.5" font-size="15" fill="#5F6B68" font-style="italic">or &quot;invented data&quot;</text><rect x="370" y="236" width="330" height="164" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><circle cx="400" cy="266" r="18" fill="#094953" stroke="none" stroke-width="1.4"/><text x="400" y="273" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="430" y="273" font-size="19" fill="#094953" font-weight="700">Pattern</text><text x="390" y="312" font-size="16" fill="#1F2A28">Where is it high, where</text><text x="390" y="332.8" font-size="16" fill="#1F2A28">low, and by how much?</text><text x="390" y="362" font-size="15" fill="#5F6B68" font-style="italic">Name a real place</text><text x="390" y="381.5" font-size="15" fill="#5F6B68" font-style="italic">and give a value</text>
</svg>
