<title id="t">Main Street, about 2025</title>
<desc id="d">Scene 2, the same Main Street in about 2025: the church still stands; the general store building is now &quot;Hilal Halal Market&quot; and a Somali restaurant; the flour mill keeps its smokestack but is now &quot;Mill Lofts and Coffee&quot;; the workers' houses are gone and a building holds a &quot;Global Burger&quot; chain restaurant and a &quot;Phones 5G&quot; store. Cars drive on a paved street and people walk past.</desc>
