<title id="world-economy-changes-poles-t">Agglomeration compared with a growth pole</title>
<desc id="world-economy-changes-poles-d">Two panels. Agglomeration: many small factories clustered together, labeled many firms cluster to share workers, suppliers and ideas. Growth pole: one large factory with arrows reaching out to four small towns, labeled one key project sparks growth in the towns and region around it.</desc>
