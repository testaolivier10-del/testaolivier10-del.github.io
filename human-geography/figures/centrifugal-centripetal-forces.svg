<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 355" width="480" height="355" role="img" aria-labelledby="centrifugal-centripetal-forces-t centrifugal-centripetal-forces-d" font-family="Arial, Helvetica, sans-serif">
<title id="centrifugal-centripetal-forces-t">Centripetal and centrifugal forces</title>
<desc id="centrifugal-centripetal-forces-d">A circle labeled the state. On the left, solid arrows point inward from three centripetal forces that pull the state together: shared language, national road and rail, fair shares of money. On the right, dashed arrows point outward to three centrifugal forces that pull it apart: unequal regions, distrust after conflict, rival identities.</desc>
<rect width="480" height="355" fill="#FFFFFF"/>
<defs><marker id="centrifugal-centripetal-forces-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="centrifugal-centripetal-forces-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker></defs><circle cx="240" cy="200" r="52" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="240" y="196.0" font-size="16" font-weight="700" fill="#094953" text-anchor="middle">The</text><text x="240" y="215.0" font-size="16" font-weight="700" fill="#094953" text-anchor="middle">state</text><text x="20" y="100.0" font-size="15" font-weight="700" fill="#094953" text-anchor="start">Shared language</text><line x1="150" y1="104" x2="186" y2="172" stroke="#094953" stroke-width="2.5" marker-end="url(#centrifugal-centripetal-forces-k)"/><text x="20" y="190.0" font-size="15" font-weight="700" fill="#094953" text-anchor="start">National roads</text><text x="20" y="208.8" font-size="15" font-weight="700" fill="#094953" text-anchor="start">and rail</text><line x1="150" y1="194" x2="186" y2="200" stroke="#094953" stroke-width="2.5" marker-end="url(#centrifugal-centripetal-forces-k)"/><text x="20" y="280.0" font-size="15" font-weight="700" fill="#094953" text-anchor="start">Fair shares of</text><text x="20" y="298.8" font-size="15" font-weight="700" fill="#094953" text-anchor="start">money</text><line x1="150" y1="284" x2="186" y2="228" stroke="#094953" stroke-width="2.5" marker-end="url(#centrifugal-centripetal-forces-k)"/><text x="460" y="100.0" font-size="15" font-weight="700" fill="#C24E00" text-anchor="end">Unequal regions</text><line x1="294" y1="172" x2="330" y2="104" stroke="#C24E00" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#centrifugal-centripetal-forces-v)"/><text x="460" y="190.0" font-size="15" font-weight="700" fill="#C24E00" text-anchor="end">Distrust after</text><text x="460" y="208.8" font-size="15" font-weight="700" fill="#C24E00" text-anchor="end">conflict</text><line x1="294" y1="200" x2="330" y2="194" stroke="#C24E00" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#centrifugal-centripetal-forces-v)"/><text x="460" y="280.0" font-size="15" font-weight="700" fill="#C24E00" text-anchor="end">Rival</text><text x="460" y="298.8" font-size="15" font-weight="700" fill="#C24E00" text-anchor="end">identities</text><line x1="294" y1="228" x2="330" y2="284" stroke="#C24E00" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#centrifugal-centripetal-forces-v)"/><text x="20" y="40.0" font-size="16" font-weight="700" fill="#094953" text-anchor="start">Centripetal: pull together</text><text x="460" y="40.0" font-size="16" font-weight="700" fill="#C24E00" text-anchor="end">Centrifugal: pull apart</text><text x="240" y="335.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">Solid arrows point in; dashed arrows point out.</text>
</svg>
