<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" width="480" height="350" role="img" aria-labelledby="power-territoriality-choke-t power-territoriality-choke-d" font-family="Arial, Helvetica, sans-serif">
<title id="power-territoriality-choke-t">A choke point</title>
<desc id="power-territoriality-choke-d">Two coasts almost meet, leaving a narrow strip of water between a state on the north shore and a state on the south shore. A dashed ship route has to pass through the narrow part. A note says a state that controls the narrow part can tax, slow or block the traffic.</desc>
<rect width="480" height="350" fill="#FFFFFF"/>
<defs><marker id="power-territoriality-choke-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker></defs><rect x="0" y="40" width="480" height="250" fill="#D6EAF0"/><path d="M0,40 L480,40 L480,130 C400,140 330,120 270,150 C250,160 230,160 210,150 C150,120 80,140 0,130 z" fill="#EFE9DC" stroke="#1F2A28" stroke-width="2"/><path d="M0,290 L480,290 L480,210 C400,200 330,215 270,185 C250,175 230,175 210,185 C150,215 80,200 0,210 z" fill="#EFE9DC" stroke="#1F2A28" stroke-width="2"/><text x="240" y="90.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">State on the north shore</text><text x="240" y="262.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">State on the south shore</text><path d="M20,170 C120,170 180,168 240,168 C300,168 360,170 460,170" fill="none" stroke="#C24E00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#power-territoriality-choke-s)"/><text x="20" y="160.0" font-size="14" font-weight="700" fill="#C24E00" text-anchor="start">Ship route</text><line x1="240" y1="156" x2="240" y2="180" stroke="#1F2A28" stroke-width="2"/><text x="240" y="30.0" font-size="16" font-weight="700" fill="#094953" text-anchor="middle">Choke point: a narrow passage many ships must use</text><text x="20" y="315.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">A state that controls the narrow part can tax, slow or</text><text x="20" y="333.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">block the traffic that passes through it.</text>
</svg>
