<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" role="img" aria-labelledby="sovereignty-challenges-updown-t sovereignty-challenges-updown-d" font-family="Arial, Helvetica, sans-serif">
<title id="sovereignty-challenges-updown-t">Sovereignty shared upward and downward</title>
<desc id="sovereignty-challenges-updown-d">The state, meaning the national government, sits in the middle. An arrow up shows power shared upward to supranational organizations such as the UN, the EU, NATO and ASEAN. An arrow down shows power shared downward, called devolution, to regions and autonomous areas such as Scotland, Catalonia and Quebec. A note says both moves can limit what the national government decides alone.</desc>
<rect width="480" height="390" fill="#FFFFFF"/>
<defs><marker id="sovereignty-challenges-updown-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="sovereignty-challenges-updown-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker></defs><rect x="90" y="20" width="300" height="70" rx="6" fill="#F6D9C4" stroke="#C24E00" stroke-width="2"/><text x="240" y="48.0" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle">Supranational organizations</text><text x="240" y="70.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">such as the UN, the EU, NATO, ASEAN</text><rect x="140" y="150" width="200" height="60" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="3"/><text x="240" y="177.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">The state</text><text x="240" y="198.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">(national government)</text><rect x="90" y="270" width="300" height="70" rx="6" fill="none" stroke="#1F2A28" stroke-width="1.5"/><text x="240" y="298.0" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle">Regions and autonomous areas</text><text x="240" y="320.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">such as Scotland, Catalonia, Quebec</text><line x1="240" y1="150" x2="240" y2="96" stroke="#C24E00" stroke-width="3" marker-end="url(#sovereignty-challenges-updown-v)"/><line x1="240" y1="210" x2="240" y2="264" stroke="#094953" stroke-width="3" marker-end="url(#sovereignty-challenges-updown-k)"/><text x="252" y="128.0" font-size="14" font-weight="700" fill="#C24E00" text-anchor="start">Power shared upward</text><text x="252" y="236.0" font-size="14" font-weight="700" fill="#094953" text-anchor="start">Power shared downward</text><text x="252" y="254.0" font-size="14" font-weight="700" fill="#094953" text-anchor="start">(devolution)</text><text x="240" y="370.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">Both moves can limit what the national government</text><text x="240" y="388.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">decides alone.</text>
</svg>
