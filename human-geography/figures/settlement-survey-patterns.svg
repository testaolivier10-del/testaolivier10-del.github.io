<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Clustered, dispersed and linear rural settlement</title>
<desc id="d">Three panels drawn from above. Clustered: about a dozen houses packed together in one village, with fields all around it. Dispersed: a grid of farm fields with one farmhouse standing alone on each field. Linear: houses lined up along both sides of one winding road, with fields behind them.</desc>
