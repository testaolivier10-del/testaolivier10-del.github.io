<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The four scales of analysis, nested</title>
<desc id="d">Four nested boxes, each inside the next: the global scale, the whole world; the regional scale, South Asia; the national scale, India; the local scale, the city of Mumbai. A note says a pattern can look different at each scale, so ask which scale a source shows.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="390" fill="#FFFFFF"/>
<text x="360" y="30" font-size="19" fill="#1F2A28" text-anchor="middle" font-weight="700">Four scales of analysis, one inside the next</text><rect x="20" y="50" width="680" height="320" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="2"/><text x="36" y="78" font-size="17" fill="#094953" font-weight="700">Global scale</text><text x="684" y="78" font-size="15" fill="#5F6B68" text-anchor="end">the whole world</text><rect x="50" y="96" width="620" height="258" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="66" y="124" font-size="17" fill="#094953" font-weight="700">Regional scale</text><text x="654" y="124" font-size="15" fill="#5F6B68" text-anchor="end">South Asia</text><rect x="80" y="142" width="560" height="196" rx="8" fill="#C6E4EA" stroke="#094953" stroke-width="2"/><text x="96" y="170" font-size="17" fill="#094953" font-weight="700">National scale</text><text x="624" y="170" font-size="15" fill="#5F6B68" text-anchor="end">India</text><rect x="110" y="188" width="500" height="134" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="126" y="216" font-size="17" fill="#C24E00" font-weight="700">Local scale</text><text x="594" y="216" font-size="15" fill="#5F6B68" text-anchor="end">the city of Mumbai</text><text x="360" y="262" font-size="16" fill="#1F2A28" text-anchor="middle">A pattern can look different at each scale:</text><text x="360" y="282.8" font-size="16" fill="#1F2A28" text-anchor="middle">ask which scale a source shows.</text>
</svg>
