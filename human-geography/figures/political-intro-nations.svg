<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" role="img" aria-labelledby="political-intro-nations-t political-intro-nations-d" font-family="Arial, Helvetica, sans-serif">
<title id="political-intro-nations-t">Nations and states: four ways they fit</title>
<desc id="political-intro-nations-d">Four small diagrams. A nation-state: one box (a state) filled with one kind of shape (one nation), close to it is Iceland. A multinational state: one box with three kinds of shapes, for example Nigeria. A multistate nation: one kind of shape spread over two boxes, for example Koreans in two states. A stateless nation: one kind of shape spread across three boxes with no box of its own, for example the Kurds.</desc>
<rect width="480" height="500" fill="#FFFFFF"/>
<text x="20" y="30.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="start">Each box is a state. Each shape and color is one nation.</text><rect x="20" y="50" width="140" height="80" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><circle cx="45" cy="75" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="80" cy="70" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="120" cy="78" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="60" cy="105" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="100" cy="108" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="135" cy="102" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><text x="180" y="68.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">Nation-state</text><text x="180" y="92.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">One nation fills one state.</text><text x="180" y="111.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="start">Close to one: Iceland</text><rect x="20" y="162" width="140" height="80" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><circle cx="45" cy="187" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><circle cx="70" cy="217" r="8" fill="#094953" stroke="#FFFFFF" stroke-width="1"/><path d="M95,179 L104,195.2 L86,195.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><path d="M115,209 L124,225.2 L106,225.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><rect x="130" y="180" width="16" height="16" fill="#009E73" stroke="#FFFFFF" stroke-width="1"/><rect x="132" y="210" width="16" height="16" fill="#009E73" stroke="#FFFFFF" stroke-width="1"/><text x="180" y="180.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">Multinational state</text><text x="180" y="204.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Several nations share one state.</text><text x="180" y="223.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="start">Example: Nigeria</text><rect x="20" y="274" width="64" height="80" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><rect x="96" y="274" width="64" height="80" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><path d="M40,290 L49,306.2 L31,306.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><path d="M64,320 L73,336.2 L55,336.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><path d="M116,290 L125,306.2 L107,306.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><path d="M140,320 L149,336.2 L131,336.2 z" fill="#C24E00" stroke="#FFFFFF" stroke-width="1"/><text x="180" y="292.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">Multistate nation</text><text x="180" y="316.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">One nation lives in two or more</text><text x="180" y="334.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">states.</text><text x="180" y="354.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="start">Example: Koreans</text><rect x="20" y="386" width="44" height="80" rx="6" fill="none" stroke="#6B7774" stroke-width="2"/><rect x="68" y="386" width="44" height="80" rx="6" fill="none" stroke="#6B7774" stroke-width="2"/><rect x="116" y="386" width="44" height="80" rx="6" fill="none" stroke="#6B7774" stroke-width="2"/><rect x="34" y="428" width="16" height="16" fill="#7A4F9E" stroke="#FFFFFF" stroke-width="1"/><rect x="82" y="428" width="16" height="16" fill="#7A4F9E" stroke="#FFFFFF" stroke-width="1"/><rect x="130" y="428" width="16" height="16" fill="#7A4F9E" stroke="#FFFFFF" stroke-width="1"/><circle cx="42" cy="406" r="7" fill="#6B7774" stroke="#FFFFFF" stroke-width="1"/><circle cx="90" cy="406" r="7" fill="#6B7774" stroke="#FFFFFF" stroke-width="1"/><circle cx="138" cy="406" r="7" fill="#6B7774" stroke="#FFFFFF" stroke-width="1"/><text x="180" y="404.0" font-size="17" font-weight="700" fill="#094953" text-anchor="start">Stateless nation</text><text x="180" y="428.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">A nation with no state of its own,</text><text x="180" y="446.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">spread across others.</text><text x="180" y="466.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="start">Example: Kurds</text>
</svg>
