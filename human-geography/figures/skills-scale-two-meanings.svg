<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Map scale and scale of analysis are different ideas</title>
<desc id="d">Two panels. Map scale: how much the map shrinks the ground, shown with a scale bar of 1:50,000; a large-scale map such as 1:10,000 shows a small area in detail, and a small-scale map such as 1:50,000,000 shows a large area with little detail. Scale of analysis: the size of the unit each number describes; one value for a whole country is the national scale, and one value for each of four provinces is the local, or subnational, scale. A note says: ask what unit each number describes; that is the scale of analysis.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<text x="180" y="34" font-size="20" fill="#094953" text-anchor="middle" font-weight="700">Map scale</text><text x="540" y="34" font-size="20" fill="#C24E00" text-anchor="middle" font-weight="700">Scale of analysis</text><line x1="360" y1="20" x2="360" y2="340" stroke="#C9D3D1" stroke-width="2"/><text x="180" y="62" font-size="16" fill="#1F2A28" text-anchor="middle">How much the map shrinks</text><text x="180" y="82.8" font-size="16" fill="#1F2A28" text-anchor="middle">the ground</text><rect x="40" y="110" width="70" height="12" rx="0" fill="#1F2A28" stroke="none" stroke-width="1.6"/><rect x="110" y="110" width="70" height="12" rx="0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.4"/><rect x="180" y="110" width="70" height="12" rx="0" fill="#1F2A28" stroke="none" stroke-width="1.6"/><text x="40" y="142" font-size="15" fill="#1F2A28" text-anchor="middle">0</text><text x="250" y="142" font-size="15" fill="#1F2A28" text-anchor="middle">3 km</text><text x="300" y="121" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">1:50,000</text><rect x="30" y="168" width="300" height="70" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="180" y="198.7" font-size="15" fill="#1F2A28" text-anchor="middle">Large-scale map (1:10,000)</text><text x="180" y="218.2" font-size="15" fill="#1F2A28" text-anchor="middle">small area, much detail</text><rect x="30" y="252" width="300" height="70" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="180" y="282.7" font-size="15" fill="#1F2A28" text-anchor="middle">Small-scale map (1:50,000,000)</text><text x="180" y="302.2" font-size="15" fill="#1F2A28" text-anchor="middle">large area, little detail</text><text x="540" y="62" font-size="16" fill="#1F2A28" text-anchor="middle">The size of the unit each</text><text x="540" y="82.8" font-size="16" fill="#1F2A28" text-anchor="middle">number describes</text><rect x="400" y="110" width="110" height="110" rx="4" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="455" y="172" font-size="24" fill="#1F2A28" text-anchor="middle" font-weight="700">40</text><text x="455" y="244" font-size="15" fill="#1F2A28" text-anchor="middle">One value for</text><text x="455" y="263.5" font-size="15" fill="#1F2A28" text-anchor="middle">the country:</text><text x="455" y="283" font-size="15" fill="#1F2A28" text-anchor="middle">national scale</text><rect x="570" y="110" width="55" height="55" rx="0" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="597.5" y="144" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">22</text><rect x="625" y="110" width="55" height="55" rx="0" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="652.5" y="144" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">61</text><rect x="570" y="165" width="55" height="55" rx="0" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="597.5" y="199" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">35</text><rect x="625" y="165" width="55" height="55" rx="0" fill="#FBE9DC" stroke="#C24E00" stroke-width="2"/><text x="652.5" y="199" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">48</text><text x="625" y="244" font-size="15" fill="#1F2A28" text-anchor="middle">One value per</text><text x="625" y="263.5" font-size="15" fill="#1F2A28" text-anchor="middle">province: local</text><text x="625" y="283" font-size="15" fill="#1F2A28" text-anchor="middle">(subnational) scale</text><rect x="20" y="352" width="680" height="50" rx="8" fill="#F4F7F7" stroke="#C9D3D1" stroke-width="1.6"/><text x="360" y="383" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Ask: what unit does each number describe? That is the scale of analysis.</text>
</svg>
