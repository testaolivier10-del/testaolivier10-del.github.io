<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cultural convergence and divergence</title>
<desc id="d">Diagram: globalization, the faster links of the internet, phones, flights, trade and streaming, leads two ways. Cultural convergence: places grow more alike, with the same chain stores, songs and apps in many countries and English used for business and online. Cultural divergence: places grow more different, as groups protect or revive their own language, food and customs, such as the revival of te reo Māori. Both can happen in the same place at the same time.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="540" fill="#FFFFFF"/>
<text x="320" y="32" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">Globalization pulls culture two ways</text><rect x="150" y="56" width="340" height="92" rx="10" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="86.4" font-size="17" fill="#1F2A28" text-anchor="middle">Globalization</text><text x="320" y="108.1" font-size="17" fill="#1F2A28" text-anchor="middle">faster links: internet, phones,</text><text x="320" y="129.9" font-size="17" fill="#1F2A28" text-anchor="middle">flights, trade, streaming</text><line x1="240" y1="150" x2="150" y2="214" stroke="#A8508A" stroke-width="2.6" marker-end="url(#ar-purp)" stroke-linecap="round"/><line x1="400" y1="150" x2="490" y2="214" stroke="#009E73" stroke-width="2.6" marker-end="url(#ar-green)" stroke-linecap="round"/><rect x="20" y="220" width="290" height="80" rx="10" fill="#F3E4EE" stroke="#A8508A" stroke-width="2"/><text x="165" y="255" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Cultural convergence:</text><text x="165" y="278" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">places grow more alike</text><rect x="330" y="220" width="290" height="80" rx="10" fill="#DDF2EA" stroke="#009E73" stroke-width="2"/><text x="475" y="255" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Cultural divergence:</text><text x="475" y="278" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">places grow more different</text><text x="30" y="340" font-size="17" fill="#1F2A28">The same chain stores,</text><text x="30" y="361.8" font-size="17" fill="#1F2A28">songs and apps in many</text><text x="30" y="383.5" font-size="17" fill="#1F2A28">countries; English used</text><text x="30" y="405.3" font-size="17" fill="#1F2A28">for business and online.</text><text x="340" y="340" font-size="17" fill="#1F2A28">Groups protect or revive</text><text x="340" y="361.8" font-size="17" fill="#1F2A28">their own language, food</text><text x="340" y="383.5" font-size="17" fill="#1F2A28">and customs, such as the</text><text x="340" y="405.3" font-size="17" fill="#1F2A28">revival of te reo Māori.</text><rect x="40" y="470" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="320" y="500.1" font-size="17" fill="#1F2A28" text-anchor="middle">Both can happen in the same place at the same time.</text>
</svg>
