<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Migration has effects at the origin and the destination</title>
<desc id="d">Diagram: workers, often young adults, flow from the origin to the destination, and remittances, money sent home, flow back. At the origin: money for schools and homes, skills lost (brain drain), an older population with fewer births. At the destination: jobs filled and new businesses, new foods, languages and religions, and debates over immigration policy.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="350" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">Migration changes both ends</text><rect x="20" y="60" width="230" height="270" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="135" y="200.8" font-size="16" fill="#1F2A28" text-anchor="middle"></text><rect x="470" y="60" width="230" height="270" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="585" y="200.8" font-size="16" fill="#1F2A28" text-anchor="middle"></text><text x="135" y="88" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Origin</text><text x="585" y="88" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Destination</text><text x="135" y="124" font-size="15" fill="#1F2A28" text-anchor="middle">Money from abroad</text><text x="135" y="150" font-size="15" fill="#1F2A28" text-anchor="middle">for schools, homes</text><text x="135" y="176" font-size="15" fill="#1F2A28" text-anchor="middle">Skills lost</text><text x="135" y="202" font-size="15" fill="#1F2A28" text-anchor="middle">(brain drain)</text><text x="135" y="228" font-size="15" fill="#1F2A28" text-anchor="middle">Older population,</text><text x="135" y="254" font-size="15" fill="#1F2A28" text-anchor="middle">fewer births</text><text x="585" y="124" font-size="15" fill="#1F2A28" text-anchor="middle">Jobs filled,</text><text x="585" y="150" font-size="15" fill="#1F2A28" text-anchor="middle">new businesses</text><text x="585" y="176" font-size="15" fill="#1F2A28" text-anchor="middle">New foods, languages,</text><text x="585" y="202" font-size="15" fill="#1F2A28" text-anchor="middle">religions</text><text x="585" y="228" font-size="15" fill="#1F2A28" text-anchor="middle">Debates over</text><text x="585" y="254" font-size="15" fill="#1F2A28" text-anchor="middle">immigration policy</text><line x1="254" y1="130" x2="466" y2="130" stroke="#094953" stroke-width="5" marker-end="url(#ar-teal)"/><text x="360" y="118" font-size="15" fill="#094953" text-anchor="middle" font-weight="700">Workers, often young adults</text><line x1="466" y1="250" x2="254" y2="250" stroke="#A8508A" stroke-width="5" marker-end="url(#ar-purp)"/><text x="360" y="238" font-size="15" fill="#A8508A" text-anchor="middle" font-weight="700">Remittances: money sent home</text>
</svg>
