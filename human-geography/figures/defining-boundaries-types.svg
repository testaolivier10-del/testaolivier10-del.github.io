<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 562" width="480" height="562" role="img" aria-labelledby="defining-boundaries-types-t defining-boundaries-types-d" font-family="Arial, Helvetica, sans-serif">
<title id="defining-boundaries-types-t">Six boundary types</title>
<desc id="defining-boundaries-types-d">Six small sketches, each with a red boundary line. Antecedent: the line is drawn before many settlers live there. Subsequent: a winding line drawn after settlement. Consequent: a line between two groups of houses of different colors, following a cultural line. Superimposed: a line drawn by outsiders through the middle of one group. Geometric: a straight line along 49 degrees north. Relict: a dashed gray line, a former boundary that no longer works. A note says one boundary can fit more than one type.</desc>
<rect width="480" height="562" fill="#FFFFFF"/>
<text x="20" y="28.0" font-size="16" font-weight="700" fill="#094953" text-anchor="start">Six boundary types (the red line is the boundary)</text><rect x="20" y="44" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><line x1="75" y1="48" x2="75" y2="104" stroke="#C24E00" stroke-width="3"/><path d="M38,74 L45,66 L52,74 L52,82 L38,82 z" fill="#6B7774"/><text x="148" y="64.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Antecedent</text><text x="148" y="86.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Drawn before many settlers lived there.</text><rect x="20" y="126" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><path d="M31,144 L38,136 L45,144 L45,152 L31,152 z" fill="#6B7774"/><path d="M48,166 L55,158 L62,166 L62,174 L48,174 z" fill="#6B7774"/><path d="M33,176 L40,168 L47,176 L47,184 L33,184 z" fill="#6B7774"/><path d="M93,142 L100,134 L107,142 L107,150 L93,150 z" fill="#6B7774"/><path d="M105,164 L112,156 L119,164 L119,172 L105,172 z" fill="#6B7774"/><path d="M88,176 L95,168 L102,176 L102,184 L88,184 z" fill="#6B7774"/><path d="M77,130 C70,150 84,166 76,186" fill="none" stroke="#C24E00" stroke-width="3"/><text x="148" y="146.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Subsequent</text><text x="148" y="168.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Drawn after people settled, as the</text><text x="148" y="186.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">cultural landscape took shape.</text><rect x="20" y="208" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><path d="M31,226 L38,218 L45,226 L45,234 L31,234 z" fill="#094953"/><path d="M48,248 L55,240 L62,248 L62,256 L48,256 z" fill="#094953"/><path d="M33,258 L40,250 L47,258 L47,266 L33,266 z" fill="#094953"/><path d="M93,224 L100,216 L107,224 L107,232 L93,232 z" fill="#7A4F9E"/><path d="M105,246 L112,238 L119,246 L119,254 L105,254 z" fill="#7A4F9E"/><path d="M88,258 L95,250 L102,258 L102,266 L88,266 z" fill="#7A4F9E"/><path d="M77,212 C70,232 84,248 76,268" fill="none" stroke="#C24E00" stroke-width="3"/><text x="148" y="228.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Consequent</text><text x="148" y="250.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Follows a cultural line, such as</text><text x="148" y="268.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">language or religion.</text><rect x="20" y="290" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><path d="M38,308 L45,300 L52,308 L52,316 L38,316 z" fill="#094953"/><path d="M58,334 L65,326 L72,334 L72,342 L58,342 z" fill="#094953"/><path d="M83,310 L90,302 L97,310 L97,318 L83,318 z" fill="#094953"/><path d="M101,336 L108,328 L115,336 L115,344 L101,344 z" fill="#094953"/><line x1="77" y1="294" x2="77" y2="350" stroke="#C24E00" stroke-width="3"/><text x="148" y="310.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Superimposed</text><text x="148" y="332.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">Forced on a place by outside powers,</text><text x="148" y="350.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">often cutting through one group.</text><rect x="20" y="372" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><line x1="24" y1="404" x2="126" y2="404" stroke="#C24E00" stroke-width="3"/><text x="75" y="398.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">49° N</text><text x="148" y="392.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Geometric</text><text x="148" y="414.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">A straight line, often a line of</text><text x="148" y="432.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">latitude or longitude.</text><rect x="20" y="454" width="110" height="64" rx="4" fill="#F7F5EF" stroke="#6B7774" stroke-width="1.5"/><line x1="75" y1="458" x2="75" y2="514" stroke="#6B7774" stroke-width="3" stroke-dasharray="5 5"/><path d="M43,484 L50,476 L57,484 L57,492 L43,492 z" fill="#6B7774"/><path d="M95,488 L102,480 L109,488 L109,496 L95,496 z" fill="#6B7774"/><text x="148" y="474.0" font-size="17" font-weight="700" fill="#1F2A28" text-anchor="start">Relict</text><text x="148" y="496.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">A former boundary that no longer works</text><text x="148" y="514.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="start">but still shows on the land.</text><text x="20" y="546.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="start">One boundary can fit more than one type.</text>
</svg>
