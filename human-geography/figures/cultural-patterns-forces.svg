<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Centripetal and centrifugal forces</title>
<desc id="d">Diagram: on the left, arrows point in toward a group, labeled centripetal force, which pulls people together, with examples a shared language, a national holiday and a shared religion. On the right, arrows point out from a group, labeled centrifugal force, which pushes people apart, with examples two languages in separate regions and religious differences. A note says the same trait can unite one region and divide the whole country.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="640" height="520" fill="#FFFFFF"/>
<text x="320" y="32" font-size="21" fill="#1F2A28" text-anchor="middle" font-weight="700">Forces that unite and forces that divide</text><text x="160" y="72" font-size="21" fill="#009E73" text-anchor="middle" font-weight="700">Centripetal force</text><text x="160" y="96" font-size="17" fill="#1F2A28" text-anchor="middle">pulls people together</text><text x="480" y="72" font-size="21" fill="#C24E00" text-anchor="middle" font-weight="700">Centrifugal force</text><text x="480" y="96" font-size="17" fill="#1F2A28" text-anchor="middle">pushes people apart</text><circle cx="160" cy="250" r="46" fill="#DDF2EA" stroke="#009E73" stroke-width="2.4"/><text x="160" y="256" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Group</text><circle cx="480" cy="250" r="46" fill="#FBE6D9" stroke="#C24E00" stroke-width="2.4"/><text x="480" y="256" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Group</text><line x1="270" y1="250" x2="216" y2="250" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)" stroke-linecap="round"/><line x1="536" y1="250" x2="590" y2="250" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)" stroke-linecap="round"/><line x1="160" y1="360" x2="160" y2="306" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)" stroke-linecap="round"/><line x1="480" y1="306" x2="480" y2="360" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)" stroke-linecap="round"/><line x1="50" y1="250" x2="104" y2="250" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)" stroke-linecap="round"/><line x1="424" y1="250" x2="370" y2="250" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)" stroke-linecap="round"/><line x1="160" y1="140" x2="160" y2="194" stroke="#009E73" stroke-width="3" marker-end="url(#ar-green)" stroke-linecap="round"/><line x1="480" y1="194" x2="480" y2="140" stroke="#C24E00" stroke-width="3" marker-end="url(#ar-verm)" stroke-linecap="round"/><text x="160" y="392" font-size="17" fill="#1F2A28" text-anchor="middle">A shared language</text><text x="160" y="413.8" font-size="17" fill="#1F2A28" text-anchor="middle">A national holiday</text><text x="160" y="435.5" font-size="17" fill="#1F2A28" text-anchor="middle">A shared religion</text><text x="480" y="392" font-size="17" fill="#1F2A28" text-anchor="middle">Two languages in</text><text x="480" y="413.8" font-size="17" fill="#1F2A28" text-anchor="middle">separate regions</text><text x="480" y="435.5" font-size="17" fill="#1F2A28" text-anchor="middle">Religious differences</text><rect x="40" y="462" width="560" height="44" rx="10" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="320" y="489.8" font-size="16" fill="#1F2A28" text-anchor="middle">The same trait can unite one region and divide the whole country.</text>
</svg>
