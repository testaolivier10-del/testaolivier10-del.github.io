<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Arithmetic, physiological and agricultural density</title>
<desc id="d">Three panels for one invented country of 40 million people and 400,000 square kilometers. Arithmetic density divides all people by all land: 100 per square kilometer. Physiological density divides all people by the 40,000 square kilometers of arable land: 1,000 per square kilometer. Agricultural density divides the 20 million farmers by arable land: 500 per square kilometer.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="390" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">One invented country, three densities</text><text x="120" y="70" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">Arithmetic density</text><text x="120" y="94" font-size="15" fill="#1F2A28" text-anchor="middle">All people ÷ all land</text><rect x="40" y="110" width="160" height="160" rx="4" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="120" y="196" font-size="15" fill="#1F2A28" text-anchor="middle">all land</text><text x="120" y="300" font-size="15" fill="#1F2A28" text-anchor="middle">40 million ÷ 400,000 km²</text><text x="120" y="324" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">= 100 per km²</text><text x="360" y="70" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">Physiological density</text><text x="360" y="94" font-size="15" fill="#1F2A28" text-anchor="middle">All people ÷ arable land</text><rect x="280" y="110" width="160" height="160" rx="4" fill="#F4F7F7" stroke="#094953" stroke-width="2"/><rect x="280" y="222" width="80" height="48" rx="2" fill="#BFE3D4" stroke="#009E73" stroke-width="2"/><text x="320" y="252" font-size="15" fill="#1F2A28" text-anchor="middle">arable</text><text x="360" y="170" font-size="15" fill="#5F6B68" text-anchor="middle">desert, ice,</text><text x="360" y="190" font-size="15" fill="#5F6B68" text-anchor="middle">hills, cities</text><text x="360" y="300" font-size="15" fill="#1F2A28" text-anchor="middle">40 million ÷ 40,000 km²</text><text x="360" y="324" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">= 1,000 per km²</text><text x="600" y="70" font-size="17" fill="#094953" text-anchor="middle" font-weight="700">Agricultural density</text><text x="600" y="94" font-size="15" fill="#1F2A28" text-anchor="middle">Farmers ÷ arable land</text><rect x="520" y="110" width="160" height="160" rx="4" fill="#F4F7F7" stroke="#094953" stroke-width="2"/><rect x="520" y="222" width="80" height="48" rx="2" fill="#BFE3D4" stroke="#009E73" stroke-width="2"/><text x="560" y="262" font-size="15" fill="#1F2A28" text-anchor="middle">arable</text><circle cx="532" cy="232" r="4.5" fill="#C24E00" stroke="none" stroke-width="1.4"/><circle cx="547" cy="232" r="4.5" fill="#C24E00" stroke="none" stroke-width="1.4"/><circle cx="562" cy="232" r="4.5" fill="#C24E00" stroke="none" stroke-width="1.4"/><circle cx="577" cy="232" r="4.5" fill="#C24E00" stroke="none" stroke-width="1.4"/><circle cx="592" cy="232" r="4.5" fill="#C24E00" stroke="none" stroke-width="1.4"/><text x="600" y="300" font-size="15" fill="#1F2A28" text-anchor="middle">20 million ÷ 40,000 km²</text><text x="600" y="324" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">= 500 per km²</text><text x="360" y="368" font-size="15" fill="#5F6B68" text-anchor="middle">Invented numbers for practice. Arable land is land that can grow crops.</text>
</svg>
