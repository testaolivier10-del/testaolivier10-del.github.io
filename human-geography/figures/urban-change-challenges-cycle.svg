<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="urban-change-challenges-cycle-t urban-change-challenges-cycle-d" font-family="Arial, Helvetica, sans-serif">
<title id="urban-change-challenges-cycle-t">How a neighborhood can change over decades</title>
<desc id="urban-change-challenges-cycle-d">A row of five boxes joined by arrows. One: lenders refuse loans or set worse terms in the neighborhood. Two: owners cannot repair or sell, so buildings decline and some are abandoned. Three: the city clears blocks for new projects, or investors buy cheap buildings. Four: new money arrives, rents and prices rise, and new shops open. Five: some long-time residents gain while others are priced out and move away. Below, policy responses: fair lending laws, inclusionary zoning, rent help and land trusts.</desc>
<defs><marker id="ucc-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect x="0" y="0" width="820" height="400" fill="#FFFFFF" /><rect x="15" y="40" width="145" height="200" fill="#FFFFFF" stroke="#094953" stroke-width="3" rx="10"/><rect x="15" y="40" width="145" height="38" fill="#094953" rx="10"/><text x="87" y="65" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="87" dy="0">Disinvestment</tspan></text><text x="87" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="87" dy="0">Lenders refuse</tspan><tspan x="87" dy="17.5">loans or set</tspan><tspan x="87" dy="17.5">worse terms here</tspan></text><line x1="160" y1="140" x2="175" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ucc-ar)"/><rect x="177" y="40" width="145" height="200" fill="#FFFFFF" stroke="#3E7C86" stroke-width="3" rx="10"/><rect x="177" y="40" width="145" height="38" fill="#3E7C86" rx="10"/><text x="249" y="65" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="249" dy="0">Decline</tspan></text><text x="249" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="249" dy="0">Repairs stop;</tspan><tspan x="249" dy="17.5">some buildings</tspan><tspan x="249" dy="17.5">are abandoned</tspan></text><line x1="322" y1="140" x2="337" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ucc-ar)"/><rect x="339" y="40" width="145" height="200" fill="#FFFFFF" stroke="#7A4F9E" stroke-width="3" rx="10"/><rect x="339" y="40" width="145" height="38" fill="#7A4F9E" rx="10"/><text x="411" y="65" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="411" dy="0">Reinvestment</tspan></text><text x="411" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="411" dy="0">The city clears</tspan><tspan x="411" dy="17.5">blocks, or buyers</tspan><tspan x="411" dy="17.5">pick up cheap</tspan><tspan x="411" dy="17.5">buildings</tspan></text><line x1="484" y1="140" x2="499" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ucc-ar)"/><rect x="501" y="40" width="145" height="200" fill="#FFFFFF" stroke="#A8508A" stroke-width="3" rx="10"/><rect x="501" y="40" width="145" height="38" fill="#A8508A" rx="10"/><text x="573" y="65" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="573" dy="0">Rising prices</tspan></text><text x="573" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="573" dy="0">New money, new</tspan><tspan x="573" dy="17.5">shops, higher</tspan><tspan x="573" dy="17.5">rents and taxes</tspan></text><line x1="646" y1="140" x2="661" y2="140" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ucc-ar)"/><rect x="663" y="40" width="145" height="200" fill="#FFFFFF" stroke="#C24E00" stroke-width="3" rx="10"/><rect x="663" y="40" width="145" height="38" fill="#C24E00" rx="10"/><text x="735" y="65" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF"><tspan x="735" dy="0">Gains and losses</tspan></text><text x="735" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="735" dy="0">Some owners gain;</tspan><tspan x="735" dy="17.5">many renters are</tspan><tspan x="735" dy="17.5">priced out</tspan></text><rect x="15" y="270" width="790" height="110" fill="#D4F0E6" rx="10"/><text x="30" y="298" font-size="15" text-anchor="start" font-weight="bold" fill="#05664B"><tspan x="30" dy="0">Responses cities and residents use</tspan></text><text x="30" y="325" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="30" dy="0">Fair lending and fair housing laws (the United States banned housing discrimination in 1968)</tspan></text><text x="30" y="348" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="30" dy="0">Inclusionary zoning: new buildings must include some homes at prices lower-income families can pay</tspan></text><text x="30" y="371" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28"><tspan x="30" dy="0">Community land trusts, rent help and local food projects</tspan></text>
</svg>
