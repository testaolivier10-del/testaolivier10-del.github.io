<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 335" width="480" height="335" role="img" aria-labelledby="forms-of-governance-power-t forms-of-governance-power-d" font-family="Arial, Helvetica, sans-serif">
<title id="forms-of-governance-power-t">Unitary and federal states</title>
<desc id="forms-of-governance-power-d">Two diagrams side by side. Unitary state (example France): the national government at the top sends arrows down to three regions, which carry out national decisions. Federal state (example Germany): a constitution divides the powers between the national government (army, money) and the state governments (schools, police), so each level has its own powers. A note says both have a national government; what differs is how power is shared across space.</desc>
<rect width="480" height="335" fill="#FFFFFF"/>
<defs><marker id="forms-of-governance-power-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="forms-of-governance-power-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker></defs><text x="120" y="28.0" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">Unitary state</text><rect x="40" y="44" width="160" height="50" rx="6" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="120" y="66.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">National</text><text x="120" y="84.0" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle">government</text><line x1="120" y1="94" x2="65" y2="160" stroke="#094953" stroke-width="2.5" marker-end="url(#forms-of-governance-power-k)"/><rect x="45" y="164" width="40" height="30" rx="4" fill="none" stroke="#6B7774" stroke-width="1.5"/><line x1="120" y1="94" x2="115" y2="160" stroke="#094953" stroke-width="2.5" marker-end="url(#forms-of-governance-power-k)"/><rect x="95" y="164" width="40" height="30" rx="4" fill="none" stroke="#6B7774" stroke-width="1.5"/><line x1="120" y1="94" x2="165" y2="160" stroke="#094953" stroke-width="2.5" marker-end="url(#forms-of-governance-power-k)"/><rect x="145" y="164" width="40" height="30" rx="4" fill="none" stroke="#6B7774" stroke-width="1.5"/><text x="120" y="216.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">Regions carry out</text><text x="120" y="235.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">national decisions.</text><text x="120" y="262.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">Example: France</text><text x="360" y="28.0" font-size="17" font-weight="700" fill="#C24E00" text-anchor="middle">Federal state</text><rect x="280" y="44" width="160" height="50" rx="6" fill="#F6D9C4" stroke="#C24E00" stroke-width="2"/><text x="360" y="66.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">Constitution divides</text><text x="360" y="84.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">the powers</text><line x1="330" y1="94" x2="300" y2="130" stroke="#C24E00" stroke-width="2.5" marker-end="url(#forms-of-governance-power-v)"/><line x1="390" y1="94" x2="420" y2="130" stroke="#C24E00" stroke-width="2.5" marker-end="url(#forms-of-governance-power-v)"/><rect x="250" y="134" width="100" height="44" rx="6" fill="none" stroke="#1F2A28" stroke-width="1.5"/><text x="300" y="153.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">National</text><text x="300" y="170.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">government</text><rect x="370" y="134" width="100" height="44" rx="6" fill="none" stroke="#1F2A28" stroke-width="1.5"/><text x="420" y="153.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">State</text><text x="420" y="170.0" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle">governments</text><text x="300" y="196.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Army, money</text><text x="420" y="196.0" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle">Schools, police</text><text x="360" y="222.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">Each level has its</text><text x="360" y="241.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">own powers.</text><text x="360" y="262.0" font-size="14" font-weight="400" fill="#6B7774" text-anchor="middle">Example: Germany</text><line x1="240" y1="20" x2="240" y2="270" stroke="#D4D9D7" stroke-width="1.5"/><text x="240" y="300.0" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">In both, the national government exists. What differs</text><text x="240" y="318.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle">is how power is shared across space.</text>
</svg>
