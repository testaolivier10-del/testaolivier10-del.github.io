<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="trade-world-economy-advantage-t trade-world-economy-advantage-d" font-family="Arial, Helvetica, sans-serif">
<title id="trade-world-economy-advantage-t">Comparative advantage in two invented countries</title>
<desc id="trade-world-economy-advantage-d">Two invented countries. In one day of work, Country A makes 6 tonnes of rice or 3 bikes; Country B makes 2 tonnes of rice or 2 bikes. So in A one bike costs 2 tonnes of rice and a tonne of rice costs half a bike; in B one bike costs 1 tonne of rice and a tonne of rice costs 1 bike. A gives up less to make rice, so A makes rice; B gives up less to make bikes, so B makes bikes.</desc>
<defs><marker id="trade-world-economy-advantage-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="420" fill="#FFFFFF"/>
<rect x="16" y="16" width="296" height="190" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="164" y="44.6" font-size="19" font-weight="700" fill="#094953" text-anchor="middle">Country A, one day</text><text x="164" y="109.8" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Rice: 6 tonnes</text><text x="164" y="132.3" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">or</text><text x="164" y="154.8" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Bikes: 3</text><rect x="328" y="16" width="296" height="190" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="476" y="44.6" font-size="19" font-weight="700" fill="#C24E00" text-anchor="middle">Country B, one day</text><text x="476" y="109.8" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Rice: 2 tonnes</text><text x="476" y="132.3" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">or</text><text x="476" y="154.8" font-size="18" font-weight="400" fill="#1F2A28" text-anchor="middle">Bikes: 2</text><rect x="16" y="230" width="296" height="110" rx="12" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="164" y="280.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">1 bike costs 2 t of rice</text><text x="164" y="301.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">1 t of rice costs 0.5 bike</text><rect x="328" y="230" width="296" height="110" rx="12" fill="#FFFFFF" stroke="#C24E00" stroke-width="2"/><text x="476" y="280.3" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">1 bike costs 1 t of rice</text><text x="476" y="301.6" font-size="17" font-weight="400" fill="#1F2A28" text-anchor="middle">1 t of rice costs 1 bike</text><text x="164" y="375.9" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">Gives up less for rice:</text><text x="164" y="401.9" font-size="17" font-weight="700" fill="#094953" text-anchor="middle">A makes rice</text><text x="476" y="375.9" font-size="17" font-weight="700" fill="#C24E00" text-anchor="middle">Gives up less for bikes:</text><text x="476" y="401.9" font-size="17" font-weight="700" fill="#C24E00" text-anchor="middle">B makes bikes</text>
</svg>
