<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="trade-world-economy-advantage-t trade-world-economy-advantage-d" font-family="Arial, Helvetica, sans-serif">
<title id="trade-world-economy-advantage-t">Comparative advantage in two invented countries</title>
<desc id="trade-world-economy-advantage-d">Two invented countries. In one day of work, Country A makes 6 tonnes of rice or 3 bikes; Country B makes 2 tonnes of rice or 2 bikes. So in A one bike costs 2 tonnes of rice and a tonne of rice costs half a bike; in B one bike costs 1 tonne of rice and a tonne of rice costs 1 bike. A gives up less to make rice, so A makes rice; B gives up less to make bikes, so B makes bikes.</desc>
<defs><marker id="trade-world-economy-advantage-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs>
<rect width="640" height="420" fill="#FFFFFF"/>
<rect x="8" y="10" width="304" height="170" rx="12" fill="#E1F1F4" stroke="#094953" stroke-width="2"/><text x="160" y="47.8" font-size="25" font-weight="700" fill="#094953" text-anchor="middle">Country A, 1 day</text><text x="160" y="107.2" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Rice: 6 tonnes</text><text x="160" y="135.9" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">or bikes: 3</text><rect x="328" y="10" width="304" height="170" rx="12" fill="#FBE7DA" stroke="#C24E00" stroke-width="2"/><text x="480" y="47.8" font-size="25" font-weight="700" fill="#C24E00" text-anchor="middle">Country B, 1 day</text><text x="480" y="107.2" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">Rice: 2 tonnes</text><text x="480" y="135.9" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">or bikes: 2</text><rect x="8" y="196" width="304" height="116" rx="12" fill="#FFFFFF" stroke="#094953" stroke-width="2"/><text x="160" y="247.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">1 bike = 2 t rice</text><text x="160" y="276.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">1 t rice = 0.5 bike</text><rect x="328" y="196" width="304" height="116" rx="12" fill="#FFFFFF" stroke="#C24E00" stroke-width="2"/><text x="480" y="247.7" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">1 bike = 1 t rice</text><text x="480" y="276.4" font-size="23" font-weight="400" fill="#1F2A28" text-anchor="middle">1 t rice = 1 bike</text><text x="160" y="344.2" font-size="22" font-weight="700" fill="#094953" text-anchor="middle">Gives up less</text><text x="160" y="371.7" font-size="22" font-weight="700" fill="#094953" text-anchor="middle">for rice:</text><text x="160" y="399.2" font-size="22" font-weight="700" fill="#094953" text-anchor="middle">A makes rice</text><text x="480" y="344.2" font-size="22" font-weight="700" fill="#C24E00" text-anchor="middle">Gives up less</text><text x="480" y="371.7" font-size="22" font-weight="700" fill="#C24E00" text-anchor="middle">for bikes:</text><text x="480" y="399.2" font-size="22" font-weight="700" fill="#C24E00" text-anchor="middle">B makes bikes</text>
</svg>
