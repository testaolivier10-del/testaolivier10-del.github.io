<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Physical and human factors of population distribution</title>
<desc id="d">Diagram: four physical factors (climate, water, landforms, soil) on the left and four human factors (jobs, transport, government, history) on the right, each with an arrow pointing to a center box, population distribution: where people live. A note says which factors matter most depends on the scale of analysis.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-purp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="strokeWidth" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8508A"/></marker></defs><rect width="720" height="380" fill="#FFFFFF"/>
<text x="360" y="34" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">What shapes where people live?</text><text x="130" y="72" font-size="17" fill="#009E73" text-anchor="middle" font-weight="700">Physical factors</text><text x="590" y="72" font-size="17" fill="#C24E00" text-anchor="middle" font-weight="700">Human factors</text><rect x="40" y="88" width="180" height="44" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="130" y="115.8" font-size="16" fill="#1F2A28" text-anchor="middle">Climate</text><line x1="222" y1="110" x2="262" y2="200" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><rect x="40" y="146" width="180" height="44" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="130" y="173.8" font-size="16" fill="#1F2A28" text-anchor="middle">Water</text><line x1="222" y1="168" x2="262" y2="200" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><rect x="40" y="204" width="180" height="44" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="130" y="231.8" font-size="16" fill="#1F2A28" text-anchor="middle">Landforms</text><line x1="222" y1="226" x2="262" y2="200" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><rect x="40" y="262" width="180" height="44" rx="8" fill="#DDF2EA" stroke="#009E73" stroke-width="1.8"/><text x="130" y="289.8" font-size="16" fill="#1F2A28" text-anchor="middle">Soil</text><line x1="222" y1="284" x2="262" y2="200" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><rect x="500" y="88" width="180" height="44" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="590" y="115.8" font-size="16" fill="#1F2A28" text-anchor="middle">Jobs</text><line x1="498" y1="110" x2="458" y2="200" stroke="#C24E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="500" y="146" width="180" height="44" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="590" y="173.8" font-size="16" fill="#1F2A28" text-anchor="middle">Transport</text><line x1="498" y1="168" x2="458" y2="200" stroke="#C24E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="500" y="204" width="180" height="44" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="590" y="231.8" font-size="16" fill="#1F2A28" text-anchor="middle">Government</text><line x1="498" y1="226" x2="458" y2="200" stroke="#C24E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="500" y="262" width="180" height="44" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="590" y="289.8" font-size="16" fill="#1F2A28" text-anchor="middle">History</text><line x1="498" y1="284" x2="458" y2="200" stroke="#C24E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="266" y="160" width="188" height="84" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="360" y="187" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Population</text><text x="360" y="207.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">distribution:</text><text x="360" y="228.6" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">where people live</text><text x="360" y="348" font-size="15" fill="#5F6B68" text-anchor="middle">Which factors matter most depends on the scale of analysis:</text><text x="360" y="367.5" font-size="15" fill="#5F6B68" text-anchor="middle">local, national, regional or global.</text>
</svg>
