<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="urban-sustainability-rail-limits-t urban-sustainability-rail-limits-d" font-family="Arial, Helvetica, sans-serif">
<title id="urban-sustainability-rail-limits-t">Rail lines and city limits in an invented metro area</title>
<desc id="urban-sustainability-rail-limits-d">An invented metro area. The central city has a solid outline, its city limits, and holds the downtown and an existing rail line with six stations. Around it, the built-up area extends far past the city limits into eight separate suburban cities, each outlined. A proposed rail extension, drawn dashed, would run from the end of the existing line through three suburban cities to an edge city of offices at a highway junction marked E. Letter H marks a large suburb where most homes are single-family houses on cul-de-sacs.</desc>
