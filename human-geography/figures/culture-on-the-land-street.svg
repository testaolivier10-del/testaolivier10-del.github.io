<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An ethnic neighborhood streetscape</title>
<desc id="d">A drawn street in a Vietnamese American neighborhood such as Little Saigon in Westminster, California. Signs in Vietnamese and English: a noodle house (Phở Saigon), an Asian market (Chợ), a Buddhist temple (Chùa) with a curved red tile roof, a tailor for áo dài (a long Vietnamese dress) and a bánh mì shop, and a community center. People walk on the sidewalk.</desc>
