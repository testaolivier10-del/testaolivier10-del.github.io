<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The six task verbs and what each demands</title>
<desc id="d">A staircase of six task verbs, each asking for more than the one above. Identify: name it, a word or a phrase is enough. Define: give its meaning in a full sentence. Describe: give its features, what, where and how much. Explain: say why or how, with because or so. Compare: say how two things differ or match, speaking of both sides. Explain the degree: state the degree first, then explain why.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="410" fill="#FFFFFF"/>
<text x="360" y="32" font-size="20" fill="#1F2A28" text-anchor="middle" font-weight="700">What each task verb asks you to write</text><rect x="36" y="52" width="196" height="46" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="134" y="80.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Identify</text><text x="248" y="81" font-size="16" fill="#1F2A28">Name it. A word or a phrase is enough.</text><rect x="50" y="110" width="196" height="46" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="148" y="138.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Define</text><text x="262" y="139" font-size="16" fill="#1F2A28">Give its meaning in a full sentence.</text><rect x="64" y="168" width="196" height="46" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="162" y="196.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Describe</text><text x="276" y="197" font-size="16" fill="#1F2A28">Give its features: what, where, how much.</text><rect x="78" y="226" width="196" height="46" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="176" y="254.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Explain</text><text x="290" y="255" font-size="16" fill="#1F2A28">Say why or how, with &quot;because&quot; or &quot;so&quot;.</text><rect x="92" y="284" width="196" height="46" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="190" y="312.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Compare</text><text x="304" y="313" font-size="16" fill="#1F2A28">Say how two things differ or match: both sides.</text><rect x="106" y="342" width="196" height="46" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="204" y="370.8" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Explain the degree</text><text x="318" y="371" font-size="16" fill="#1F2A28">State the degree first, then explain why.</text><line x1="24" y1="60" x2="24" y2="400" stroke="#5F6B68" stroke-width="2" marker-end="url(#ar-ink)"/><text x="14" y="230" font-size="15" fill="#5F6B68" text-anchor="middle" transform="rotate(-90 14 230)">More is asked</text>
</svg>
