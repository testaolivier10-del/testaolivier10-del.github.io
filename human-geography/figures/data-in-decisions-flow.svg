<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How geographic data lead to decisions at different scales</title>
<desc id="d">Three rows, each from data to who decides to the decision. A census count of children by district goes to a local school board, which decides where to build a new school. Satellite images of a flood go to a national government agency, which decides where to send boats and food. A census count of people by state feeds a formula in United States federal law, at the national scale, that sets the seats each state gets in the House.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#094953"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C24E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker></defs><rect width="720" height="356" fill="#FFFFFF"/>
<text x="120" y="30" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Data</text><text x="360" y="30" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Who decides (scale)</text><text x="600" y="30" font-size="18" fill="#094953" text-anchor="middle" font-weight="700">Decision</text><rect x="20" y="46" width="200" height="80" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="81.7" font-size="15" fill="#1F2A28" text-anchor="middle">Census: children</text><text x="120" y="101.2" font-size="15" fill="#1F2A28" text-anchor="middle">by district</text><rect x="260" y="46" width="200" height="80" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="360" y="81.7" font-size="15" fill="#1F2A28" text-anchor="middle">School board</text><text x="360" y="101.2" font-size="15" fill="#1F2A28" text-anchor="middle">(local)</text><rect x="500" y="46" width="200" height="80" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="600" y="81.7" font-size="15" fill="#1F2A28" text-anchor="middle">Where to build</text><text x="600" y="101.2" font-size="15" fill="#1F2A28" text-anchor="middle">a new school</text><line x1="222" y1="86" x2="256" y2="86" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/><line x1="462" y1="86" x2="496" y2="86" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/><rect x="20" y="146" width="200" height="80" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="181.7" font-size="15" fill="#1F2A28" text-anchor="middle">Satellite images</text><text x="120" y="201.2" font-size="15" fill="#1F2A28" text-anchor="middle">of a flood</text><rect x="260" y="146" width="200" height="80" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="360" y="181.7" font-size="15" fill="#1F2A28" text-anchor="middle">Government agency</text><text x="360" y="201.2" font-size="15" fill="#1F2A28" text-anchor="middle">(national)</text><rect x="500" y="146" width="200" height="80" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="600" y="181.7" font-size="15" fill="#1F2A28" text-anchor="middle">Where to send</text><text x="600" y="201.2" font-size="15" fill="#1F2A28" text-anchor="middle">boats and food</text><line x1="222" y1="186" x2="256" y2="186" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/><line x1="462" y1="186" x2="496" y2="186" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/><rect x="20" y="246" width="200" height="80" rx="8" fill="#E1F1F4" stroke="#094953" stroke-width="1.8"/><text x="120" y="281.7" font-size="15" fill="#1F2A28" text-anchor="middle">Census: people</text><text x="120" y="301.2" font-size="15" fill="#1F2A28" text-anchor="middle">by state</text><rect x="260" y="246" width="200" height="80" rx="8" fill="#F4F7F7" stroke="#094953" stroke-width="1.8"/><text x="360" y="281.7" font-size="15" fill="#1F2A28" text-anchor="middle">A formula in US</text><text x="360" y="301.2" font-size="15" fill="#1F2A28" text-anchor="middle">federal law (national)</text><rect x="500" y="246" width="200" height="80" rx="8" fill="#FBE9DC" stroke="#C24E00" stroke-width="1.8"/><text x="600" y="281.7" font-size="15" fill="#1F2A28" text-anchor="middle">Seats each state gets</text><text x="600" y="301.2" font-size="15" fill="#1F2A28" text-anchor="middle">in the House</text><line x1="222" y1="286" x2="256" y2="286" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/><line x1="462" y1="286" x2="496" y2="286" stroke="#094953" stroke-width="2.4" marker-end="url(#ar-teal)"/>
</svg>
