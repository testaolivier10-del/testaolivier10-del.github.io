<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-labelledby="urban-data-kinds-t urban-data-kinds-d" font-family="Arial, Helvetica, sans-serif">
<title id="urban-data-kinds-t">Two kinds of data about a city</title>
<desc id="urban-data-kinds-d">Two columns. Quantitative data: a census table of counts, a survey bar chart and a line of rising rents, which answer how many and how much. Qualitative data: speech bubbles from interviews, a field notebook and a map a resident drew, which answer how people feel and why.</desc>
<rect x="0" y="0" width="820" height="360" fill="#FFFFFF" /><rect x="20" y="20" width="380" height="320" fill="#D7ECEF" rx="10"/><rect x="420" y="20" width="380" height="320" fill="#F8DCC8" rx="10"/><text x="210" y="50" font-size="17" text-anchor="middle" font-weight="bold" fill="#094953"><tspan x="210" dy="0">Quantitative: numbers</tspan></text><text x="610" y="50" font-size="17" text-anchor="middle" font-weight="bold" fill="#C24E00"><tspan x="610" dy="0">Qualitative: words and meanings</tspan></text><rect x="45" y="75" width="150" height="100" fill="#FFFFFF" stroke="#1F2A28"/><line x1="45" y1="95" x2="195" y2="95" stroke="#C9CCC8" stroke-width="1" /><line x1="45" y1="115" x2="195" y2="115" stroke="#C9CCC8" stroke-width="1" /><line x1="45" y1="135" x2="195" y2="135" stroke="#C9CCC8" stroke-width="1" /><line x1="45" y1="155" x2="195" y2="155" stroke="#C9CCC8" stroke-width="1" /><line x1="120" y1="75" x2="120" y2="175" stroke="#C9CCC8" stroke-width="1" /><text x="120" y="195" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="120" dy="0">Census counts</tspan></text><rect x="230" y="140" width="22" height="30" fill="#094953" /><rect x="260" y="110" width="22" height="60" fill="#094953" /><rect x="290" y="125" width="22" height="45" fill="#094953" /><rect x="320" y="95" width="22" height="75" fill="#094953" /><line x1="225" y1="170" x2="350" y2="170" stroke="#1F2A28" stroke-width="1.5" /><text x="290" y="195" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="290" dy="0">Survey results</tspan></text><path d="M60 290 L120 275 L180 260 L240 235 L300 215 L360 210" fill="none" stroke="#C24E00" stroke-width="3"/><line x1="55" y1="300" x2="370" y2="300" stroke="#1F2A28" stroke-width="1.5" /><text x="210" y="325" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="210" dy="0">Rent over time</tspan></text><rect x="445" y="80" width="160" height="50" fill="#FFFFFF" stroke="#1F2A28" rx="14"/><text x="525" y="110" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="525" dy="0">&quot;I grew up here.&quot;</tspan></text><rect x="615" y="140" width="165" height="50" fill="#FFFFFF" stroke="#1F2A28" rx="14"/><text x="697" y="170" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="697" dy="0">&quot;The bakery closed.&quot;</tspan></text><rect x="445" y="215" width="140" height="90" fill="#FFFFFF" stroke="#1F2A28"/><line x1="455" y1="235" x2="575" y2="235" stroke="#C9CCC8" stroke-width="1" /><line x1="455" y1="252" x2="575" y2="252" stroke="#C9CCC8" stroke-width="1" /><line x1="455" y1="269" x2="575" y2="269" stroke="#C9CCC8" stroke-width="1" /><line x1="455" y1="286" x2="575" y2="286" stroke="#C9CCC8" stroke-width="1" /><text x="515" y="325" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="515" dy="0">Field notes</tspan></text><rect x="620" y="215" width="150" height="90" fill="#FFFFFF" stroke="#1F2A28"/><path d="M635 290 C660 250 700 280 720 235 C735 260 750 240 760 230" fill="none" stroke="#009E73" stroke-width="3"/><text x="695" y="325" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28"><tspan x="695" dy="0">A map a resident drew</tspan></text>
</svg>
