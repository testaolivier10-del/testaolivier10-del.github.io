<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" width="820" height="760" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Motion diagram and x-t, v-t and a-t graphs</title><desc id="d">A cart on a track with a motion diagram of dots every 0.5 s: the dots spread out while it speeds up, are evenly spaced while it coasts, and bunch together while it slows to a stop at 4.0 m. Below, three graphs share a time axis from 0 to 6 s. Position against time: a curve bending upward from 0 to 1.0 m (0 to 2 s), a straight line to 3.0 m (2 to 4 s), then a curve bending down and leveling off at 4.0 m at 6 s; a dashed tangent line shows the slope at 4 s. Velocity against time: a line rising from 0 to 1.0 m/s, flat at 1.0 m/s, then falling to 0; the shaded rectangle from 2 to 4 s has area 1.0 m/s times 2 s = 2.0 m, the displacement. Acceleration against time: +0.5 m/s squared, then 0, then −0.5 m/s squared; the shaded area from 0 to 2 s is the change in velocity, 1.0 m/s. A side column reads: the slope of x-t is velocity, the slope of v-t is acceleration, the area under v-t is displacement, the area under a-t is the change in velocity.</desc><rect width="820" height="760" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">One motion, four representations</text><text x="24" y="50" fill="#5A6268" font-size="13" text-anchor="start" font-weight="normal">A cart speeds up (0 to 2 s), coasts at a steady velocity (2 to 4 s), then slows to a stop (4 to 6 s).</text><rect x="80" y="108" width="610" height="7" rx="2" fill="#8A8F94" stroke="#1F2A28" stroke-width="1"/><rect x="74" y="94" width="8" height="21" rx="2" fill="#5F6468"/><rect x="688" y="94" width="8" height="21" rx="2" fill="#5F6468"/><circle cx="110.0" cy="102.0" r="5" fill="#1F2A28"/><circle cx="118.4" cy="102.0" r="5" fill="#1F2A28"/><circle cx="143.8" cy="102.0" r="5" fill="#1F2A28"/><circle cx="185.9" cy="102.0" r="5" fill="#1F2A28"/><circle cx="245.0" cy="102.0" r="5" fill="#1F2A28"/><circle cx="312.5" cy="102.0" r="5" fill="#1F2A28"/><circle cx="380.0" cy="102.0" r="5" fill="#1F2A28"/><circle cx="447.5" cy="102.0" r="5" fill="#1F2A28"/><circle cx="515.0" cy="102.0" r="5" fill="#1F2A28"/><circle cx="574.1" cy="102.0" r="5" fill="#1F2A28"/><circle cx="616.2" cy="102.0" r="5" fill="#1F2A28"/><circle cx="641.6" cy="102.0" r="5" fill="#1F2A28"/><circle cx="650.0" cy="102.0" r="5" fill="#1F2A28"/><text x="80" y="80" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="bold">Motion diagram: the cart's position every 0.5 s</text><line x1="542.0" y1="76.0" x2="639.0" y2="76.0" stroke="#1F2A28" stroke-width="1.6"/><polygon points="650.0,76.0 639.0,70.5 639.0,81.5" fill="#1F2A28"/><text x="535.25" y="80" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">motion</text><text x="170.75" y="140" fill="#734200" font-size="12" text-anchor="middle" font-weight="normal">spread out: speeding up</text><text x="380.0" y="140" fill="#734200" font-size="12" text-anchor="middle" font-weight="normal">equal gaps: steady v</text><text x="582.5" y="140" fill="#734200" font-size="12" text-anchor="middle" font-weight="normal">bunch up: slowing</text><line x1="110.0" y1="117" x2="110.0" y2="123" stroke="#1F2A28"/><line x1="245.0" y1="117" x2="245.0" y2="123" stroke="#1F2A28"/><line x1="380.0" y1="117" x2="380.0" y2="123" stroke="#1F2A28"/><line x1="515.0" y1="117" x2="515.0" y2="123" stroke="#1F2A28"/><line x1="650.0" y1="117" x2="650.0" y2="123" stroke="#1F2A28"/><rect x="470.0" y="180" width="180.0" height="140" fill="#FDEBE7"/><rect x="110.0" y="180" width="180.0" height="140" fill="#FFF4DE"/><line x1="110.0" y1="180" x2="110.0" y2="320" stroke="#E6E2D8" stroke-width="1"/><line x1="200.0" y1="180" x2="200.0" y2="320" stroke="#E6E2D8" stroke-width="1"/><line x1="290.0" y1="180" x2="290.0" y2="320" stroke="#E6E2D8" stroke-width="1"/><line x1="380.0" y1="180" x2="380.0" y2="320" stroke="#E