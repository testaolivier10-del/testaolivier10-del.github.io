<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A student on a rotating stool pulls two weights inward</title>
<desc id="d">Two side views of the same student seated on a stool that turns freely on a vertical axle with very little friction. Left: arms stretched out holding a weight in each hand; the student has a large rotational inertia and turns slowly, shown by a thin rotation arrow around the axis. Right: arms pulled in close to the body; the rotational inertia is smaller and the student turns faster, shown by a thicker arrow. The net external torque about the axle is close to zero, so the angular momentum L = Iω stays the same while I falls and ω rises.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
