<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three objects: two with zero net force and one without</title>
<desc id="d">Left: a lamp hanging at rest from a cord; its free-body diagram has F_T, cord on lamp, up and F_g, Earth on lamp, down, equal. Its velocity is zero and stays zero. Middle: a skydiver falling at a steady speed, with an outlined velocity arrow pointing down; the diagram has F_air, air on diver, up and F_g, Earth on diver, down, equal, so the velocity stays constant. Right: a sled pulled across snow and speeding up; its diagram has F_N up and F_g down equal, but F_T to the right is longer than F_f to the left, so the net force is to the right and the sled speeds up.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">Zero net force means constant velocity (rest counts)</text><rect x="20" y="46" width="230" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">At rest</text><rect x="60" y="86" width="150" height="10" fill="#EEF1EF"/><line x1="60" y1="96" x2="210" y2="96" stroke="#1F2A28" stroke-width="2.5"/><line x1="64" y1="95" x2="72" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="76" y1="95" x2="84" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="88" y1="95" x2="96" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="100" y1="95" x2="108" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="112" y1="95" x2="120" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="124" y1="95" x2="132" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="136" y1="95" x2="144" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="148" y1="95" x2="156" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="160" y1="95" x2="168" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="172" y1="95" x2="180" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="184" y1="95" x2="192" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="196" y1="95" x2="204" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="208" y1="95" x2="216" y2="86" stroke="#5A6268" stroke-width="1"/><line x1="110" y1="96" x2="110" y2="150" stroke="#1F2A28" stroke-width="2"/><path d="M80,150 L140,150 L130,182 L90,182 Z" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><line x1="135" y1="290" x2="135" y2="240" stroke="#7A4F9E" stroke-width="3.2"/><polygon points="135,228 141.5,240 128.5,240" fill="#7A4F9E"/><text x="143" y="240" font-size="12.5" fill="#1F2A28"><tspan fill="#7A4F9E" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">T</tspan></tspan><tspan fill="#1F2A28">, cord on lamp</tspan></text><line x1="135" y1="290" x2="135" y2="340" stroke="#0072B2" stroke-width="3.2"/><polygon points="135,352 128.5,340 141.5,340" fill="#0072B2"/><text x="143" y="346" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth on lamp</tspan></text><circle cx="135" cy="290" r="5.5" fill="#1F2A28"/><text x="135" y="380" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">v = 0, stays 0</text><rect x="265" y="46" width="230" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="279" y="70" font-size="15" fill="#734200" font-weight="bold">Constant velocity</text><ellipse cx="365" cy="110" rx="44" ry="11" fill="#5B7DA8" stroke="#1F2A28" stroke-width="1.6"/><circle cx="414" cy="108" r="10" fill="#E8C4A0" stroke="#1F2A28" stroke-width="1.6"/><line x1="338" y1="104" x2="318" y2="86" stroke="#1F2A28" stroke-width="5"/><line x1="392" y1="104" x2="404" y2="84" stroke="#1F2A28" stroke-width="5"/><line x1="326" y1="114" x2="300" y2="120" stroke="#1F2A28" stroke-width="5"/><line x1="334" y1="116" x2="310" y2="132" stroke="#1F2A28" stroke-width="5"/><polygon points="456.5,96 456.5,136 451,136 460,150 469,136 463.5,136 463.5,96" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="470" y="132" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><line x1="370" y1="270" x2="370" y2="212" stroke="#5A6268" stroke-width="3.2"/><polygon points="370,200 376.5,212 363.5,212" fill="#5A6268"/><text x="378" y="214" font-size="12.5" fill="#1F2A28"><tspan fill="#5A6268" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">air</tspan></tspan><tspan fill="#1F2A28">, air on diver</tspan></text><line x1="370" y1="270" x2="370" y2="328" stroke="#0072B2" stroke-width="3.2"/><polygon points="370,340 363.5,328 376.5,328" fill="#0072B2"/><text x="378" y="334" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth on diver</tspan></text><circle cx="370" cy="270" r="5.5" fill="#1F2A28"/><text x="380" y="380" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">v steady, downward</text><rect x="510" y="46" width="230" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="524" y="70" font-size="15" fill="#734200" font-weight="bold">Not zero: speeds up</text><rect x="530" y="160" width="190" height="10" fill="#EEF1EF"/><line x1="530" y1="160" x2="720" y2="160" stroke="#1F2A28" stroke-width="2.5"/><line x1="536" y1="161" x2="528" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="548" y1="161" x2="540" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="560" y1="161" x2="552" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="572" y1="161" x2="564" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="584" y1="161" x2="576" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="596" y1="161" x2="588" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="608" y1="161" x2="600" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="620" y1="161" x2="612" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="632" y1="161" x2="624" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="644" y1="161" x2="636" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="656" y1="161" x2="648" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="668" y1="161" x2="660" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="680" y1="161" x2="672" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="692" y1="161" x2="684" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="704" y1="161" x2="696" y2="170" stroke="#5A6268" stroke-width="1"/><line x1="716" y1="161" x2="708" y2="170" stroke="#5A6268" stroke-width="1"/><path d="M556,150 L630,150 Q640,150 640,140 L640,130 L556,130 Z" fill="#C46B4E" stroke="#1F2A28" stroke-width="2"/><line x1="550" y1="156" x2="650" y2="156" stroke="#1F2A28" stroke-width="3"/><line x1="640" y1="138" x2="712" y2="138" stroke="#1F2A28" stroke-width="2"/><polygon points="570,103.5 616,103.5 616,109 630,100 616,91 616,96.5 570,96.5" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="640" y="105" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><line x1="620" y1="270" x2="620" y2="222" stroke="#009E73" stroke-width="3.2"/><polygon points="620,210 626.5,222 613.5,222" fill="#009E73"/><text x="626" y="222" font-size="12.5" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, snow</tspan></text><line x1="620" y1="270" x2="620" y2="318" stroke="#0072B2" stroke-width="3.2"/><polygon points="620,330 613.5,318 626.5,318" fill="#0072B2"/><text x="626" y="326" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth</tspan></text><line x1="620" y1="270" x2="698" y2="270" stroke="#7A4F9E" stroke-width="3.2"/><polygon points="710,270 698,276.5 698,263.5" fill="#7A4F9E"/><text x="660" y="258" font-size="12.5" fill="#1F2A28"><tspan fill="#7A4F9E" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">T</tspan></tspan><tspan fill="#1F2A28">, rope</tspan></text><line x1="620" y1="270" x2="587" y2="270" stroke="#D55E00" stroke-width="3.2"/><polygon points="575,270 587,263.5 587,276.5" fill="#D55E00"/><text x="524" y="258" font-size="12.5" fill="#1F2A28" text-anchor="start"><tspan fill="#D55E00" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">f</tspan></tspan><tspan fill="#1F2A28">, snow</tspan></text><circle cx="620" cy="270" r="5.5" fill="#1F2A28"/><text x="625" y="362" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">T</tspan> longer than F<tspan baseline-shift="sub" font-size="9">f</tspan>:</text><text x="625" y="380" font-size="12.5" fill="#5A6268" text-anchor="middle">net force right, speeds up</text>
</svg>
