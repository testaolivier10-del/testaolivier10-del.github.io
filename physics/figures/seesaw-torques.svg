"60" y="266" font-size="14" fill="#1F2A28" font-weight="bold">Force diagram of the plank (each force drawn where it acts):</text><rect x="80" y="394" width="600" height="12" rx="2" fill="#E9D8B8" stroke="#1F2A28" stroke-width="2"/><line x1="140" y1="406" x2="140" y2="424.4" stroke="#009E73" stroke-width="3.5"/><polygon points="140,435.4 134,424.4 146,424.4" fill="#009E73"/><text x="148" y="439.4" font-size="13" fill="#009E73" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">N</tspan>, A on plank</text><line x1="560" y1="406" x2="560" y2="434.2" stroke="#009E73" stroke-width="3.5"/><polygon points="560,445.2 554,434.2 566,434.2" fill="#009E73"/><text x="568" y="449.2" font-size="13" fill="#009E73" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">N</tspan>, B on plank</text><line x1="384" y1="406" x2="384" y2="414.6" stroke="#0072B2" stroke-width="3.5"/><polygon points="384,425.6 378,414.6 390,414.6" fill="#0072B2"/><text x="392" y="431.6" font-size="13" fill="#0072B2" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on plank</text><line x1="376" y1="394" x2="376" y2="316.8" stroke="#009E73" stroke-width="3.5"/><polygon points="376,305.8 382,316.8 370,316.8" fill="#009E73"/><text x="386" y="319.8" font-size="13" fill="#009E73" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">N</tspan>, pivot on plank</text><text x="60" y="484" font-size="13" fill="#1F2A28">About the pivot: (294 N)(1.6 m) = 470 N·m counterclockwise and (392 N)(1.2 m) = 470 N·m clockwise.</text><text x="60" y="504" font-size="13" fill="#1F2A28">The pivot force and the plank’s weight act at the pivot, so their lever arms and torques are zero.</text>
