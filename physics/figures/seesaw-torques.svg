<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A balanced seesaw and the force diagram of its plank</title>
<desc id="d">A uniform plank rests on a pivot at its center. Child A, 30 kg, sits 1.6 m left of the pivot; child B, 40 kg, sits 1.2 m right of it, and the plank is balanced. Below, the force diagram of the plank shows each force where it acts: the normal force from A pushing down at A’s seat, the larger normal force from B pushing down at B’s seat, the plank’s weight (Earth on plank) down at the center, and the pivot’s normal force up at the center, the longest arrow, equal to the sum of the downward forces. About the pivot, A gives 294 N times 1.6 m counterclockwise and B gives 392 N times 1.2 m clockwise, both 470 N·m, so the net torque is zero; the pivot force and the plank’s weight act at the pivot and give no torque.</desc>
<rect width="760" height="520" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">A balanced seesaw: the torques about the pivot add to zero</text><rect x="60" y="228" width="640" height="10" fill="#EEF1EF"/><line x1="60" y1="228" x2="700" y2="228" stroke="#1F2A28" stroke-width="2.5"/><line x1="64" y1="228" x2="56" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="76" y1="228" x2="68" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="88" y1="228" x2="80" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="100" y1="228" x2="92" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="112" y1="228" x2="104" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="124" y1="228" x2="116" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="136" y1="228" x2="128" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="148" y1="228" x2="140" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="160" y1="228" x2="152" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="172" y1="228" x2="164" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="184" y1="228" x2="176" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="196" y1="228" x2="188" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="208" y1="228" x2="200" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="220" y1="228" x2="212" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="232" y1="228" x2="224" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="244" y1="228" x2="236" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="256" y1="228" x2="248" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="268" y1="228" x2="260" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="280" y1="228" x2="272" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="292" y1="228" x2="284" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="304" y1="228" x2="296" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="316" y1="228" x2="308" y2="237" stroke="#5A6268" stroke-width="1"/><line x1="328" y1=