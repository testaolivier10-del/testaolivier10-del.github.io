<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Two carts with the same momentum</title><desc id="d">Two carts move to the right on tracks. Cart 1 has mass 2.0 kg and velocity 1.0 m/s; cart 2 has mass 0.50 kg and velocity 4.0 m/s. Their velocity arrows differ by a factor of four, but their momentum arrows are the same length: both have momentum 2.0 kg·m/s to the right. Cart 1 has kinetic energy 1.0 J and cart 2 has 4.0 J.</desc><rect width="760" height="330" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Same momentum, different velocity and kinetic energy</text><rect x="30" y="130" width="530" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="40" y="137" width="8" height="14" fill="#8A8F8C"/><rect x="542" y="137" width="8" height="14" fill="#8A8F8C"/><rect x="60" y="74" width="120" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="80" cy="121" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="160" cy="121" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="80" cy="121" r="3" fill="#D7D2C8"/><circle cx="160" cy="121" r="3" fill="#D7D2C8"/><text x="120" y="89" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Cart 1</text><text x="120" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">2.0 kg</text><line x1="190" y1="82" x2="213.0" y2="82.0" stroke="#B07A00" stroke-width="3"/><polygon points="224.0,82.0 213.0,87.0 213.0,77.0" fill="#B07A00"/><text x="232.0" y="87.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v = 1.0 m/s</text><line x1="190" y1="108" x2="256.0" y2="108.0" stroke="#734200" stroke-width="5"/><polygon points="270.0,108.0 256.0,114.3 256.0,101.7" fill="#734200"/><text x="278.0" y="113.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">p = 2.0 kg·m/s</text><text x="600" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start">K = ½mv² = 1.0 J</text><rect x="30" y="260" width="530" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="40" y="267" width="8" height="14" fill="#8A8F8C"/><rect x="542" y="267" width="8" height="14" fill="#8A8F8C"/><rect x="60" y="204" width="80" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="80" cy="251" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="120" cy="251" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="80" cy="251" r="3" fill="#D7D2C8"/><circle cx="120" cy="251" r="3" fill="#D7D2C8"/><text x="100" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Cart 2</text><text x="100" y="236" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">0.50 kg</text><line x1="150" y1="212" x2="275.0" y2="212.0" stroke="#B07A00" stroke-width="3"/><polygon points="286.0,212.0 275.0,216.9 275.0,207.1" fill="#B07A00"/><text x="294.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v = 4.0 m/s</text><line x1="150" y1="238" x2="216.0" y2="238.0" stroke="#734200" stroke-width="5"/><polygon points="230.0,238.0 216.0,244.3 216.0,231.7" fill="#734200"/><text x="238.0" y="243.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">p = 2.0 kg·m/s</text><text x="600" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start">K = ½mv² = 4.0 J</text><text x="24" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="start">p = mv is a vector along the velocity. Equal momenta can carry very different kinetic energies (K = p²/2m).</text></svg>
