<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Continuity and Bernoulli in a pipe</title>
<desc id="d">A water-filled pipe whose wide lower section (area A₁, speed v₁, pressure P₁, height y₁) narrows and rises into a smaller upper section (area A₂, height y₂). Velocity arrows are longer in the narrow section. Continuity, A₁v₁ = A₂v₂, sets the speeds; Bernoulli’s equation, P₁ + ρgy₁ + ½ρv₁² = P₂ + ρgy₂ + ½ρv₂², then gives the pressure: in the narrow, higher section the pressure is lower.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="26" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Flow through a pipe that narrows and rises</text><path d="M40,200 L280,200 C340,200 360,120 420,120 L720,120 L720,160 L440,160 C380,160 360,300 280,300 L40,300 Z" fill="#D7EBF4" stroke="none"/><path d="M40,200 L280,200 C340,200 360,120 420,120 L720,120" fill="none" stroke="#1F2A28" stroke-width="3"/><path d="M40,300 L280,300 C360,300 380,160 440,160 L720,160" fill="none" stroke="#1F2A28" stroke-width="3"/><line x1="100" y1="225" x2="141" y2="225" stroke="#B07A00" stroke-width="2.8" stroke-linecap="butt"/><polygon points="150,225 141,230 141,220" fill="#B07A00"/><line x1="100" y1="250" x2="141" y2="250" stroke="#B07A00" stroke-width="2.8" stroke-linecap="butt"/><polygon points="150,250 141,255 141,245" fill="#B07A00"/><line x1="100" y1="275" x2="141" y2="275" stroke="#B07A00" stroke-width="2.8" stroke-linecap="butt"/><polygon points="150,275 141,280 141,270" fill="#B07A00"/><line x1="520" y1="133" x2="631" y2="133" stroke="#B07A00" stroke-width="2.8" stroke-linecap="butt"/><polygon points="640,133 631,138 631,128" fill="#B07A00"/><line x1="520" y1="147" x2="631" y2="147" stroke="#B07A00" stroke-width="2.8" stroke-linecap="butt"/><polygon points="640,147 631,152 631,142" fill="#B07A00"/><text x="125" y="330" font-size="14" fill="#1F2A28" text-anchor="middle">section 1: area A₁, speed v₁</text><text x="125" y="350" font-size="14" fill="#1F2A28" text-anchor="middle">pressure P₁, height y₁</text><text x="580" y="190" font-size="14" fill="#1F2A28" text-anchor="middle">section 2: area A₂ (smaller)</text><text x="580" y="210" font-size="14" fill="#1F2A28" text-anchor="middle">speed v₂ (larger), height y₂</text><line x1="30" y1="250" x2="30" y2="208" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="30,200 34,208 26,208" fill="#5A6268"/><line x1="30" y1="250" x2="30" y2="292" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="30,300 26,292 34,292" fill="#5A6268"/><text x="24" y="254" font-size="13" fill="#1F2A28" text-anchor="end" font-style="italic">A₁</text><line x1="735" y1="140" x2="735" y2="128" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="735,120 739,128 731,128" fill="#5A6268"/><line x1="735" y1="140" x2="735" y2="152" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="735,160 731,152 739,152" fill="#5A6268"/><text x="741" y="145" font-size="13" fill="#1F2A28" font-style="italic">A₂</text><line x1="40" y1="380" x2="720" y2="380" stroke="#5A6268" stroke-width="1.2" stroke-dasharray="6 5"/><text x="46" y="374" font-size="12" fill="#5A6268" text-anchor="start">y = 0</text><line x1="220" y1="315" x2="220" y2="372" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="220,380 216,372 224,372" fill="#5A6268"/><line x1="220" y1="315" x2="220" y2="258" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="220,250 224,258 216,258" fill="#5A6268"/><text x="228" y="320" font-size="13" fill="#1F2A28" text-anchor="start" font-style="italic">y₁</text><line x1="690" y1="260" x2="690" y2="372" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="690,380 686,372 694,372" fill="#5A6268"/><line x1="690" y1="260" x2="690" y2="148" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="690,140 694,148 686,148" fill="#5A6268"/><text x="682" y="300" font-size="13" fill="#1F2A28" text-anchor="end" font-style="italic">y₂</text><rect x="30" y="40" width="300" height="92" rx="8" fill="#FFFFFF" stroke="#C9CFCC"/><text x="46" y="64" font-size="15" fill="#734200" font-weight="bold">Continuity (mass): A₁v₁ = A₂v₂</text><text x="46" y="90" font-size="15" fill="#734200" font-weight="bold">Bernoulli (energy):</text><text x="46" y="116" font-size="15" fill="#734200" font-weight="bold">P₁ + ρgy₁ + ½ρv₁² = P₂ + ρgy₂ + ½ρv₂²</text>
</svg>
