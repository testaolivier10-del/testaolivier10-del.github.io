<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A wheel turned through one radian</title>
<desc id="d">A wheel turns about an axis through its center. A painted spoke has turned counterclockwise from a dashed reference line through an angle of 1 radian: the distance along the rim between the reference line and the spoke, highlighted, equals the radius r. A curved arrow outside the rim shows the angular velocity ω, counterclockwise, called positive. A side panel pairs each straight-line quantity with its rotational partner: position x with angle θ in radians, velocity v with angular velocity ω, acceleration a with angular acceleration α, and the three constant-acceleration equations with their rotational forms. One revolution is 2π rad, or 360 degrees.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Describing rotation with angles in radians</text><circle cx="200" cy="215" r="130" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2.5"/><circle cx="200" cy="215" r="106.6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="215" r="15.6" fill="#8E989E" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="215" r="3" fill="#1F2A28"/><line x1="200" y1="215" x2="370" y2="215" stroke="#5A6268" stroke-width="1.5" stroke-dasharray="6 5"/><text x="374" y="220" font-size="12" fill="#5A6268">reference</text><line x1="200" y1="215" x2="257.6" y2="125.3" stroke="#734200" stroke-width="5"/><path d="M330,215 A130 130 0 0 0 270.2,105.6" fill="none" stroke="#734200" stroke-width="7" stroke-linecap="round"/><text x="342" y="137" font-size="13" fill="#734200" font-weight="bold">rim distance</text><text x="342" y="154" font-size="13" fill="#734200" font-weight="bold">= r</text><line x1="265" y1="231" x2="208" y2="231" stroke="#5A6268" stroke-width="1.4"/><polygon points="200,231 208,227 208,235" fill="#5A6268"/><line x1="265" y1="231" x2="322" y2="231" stroke="#5A6268" stroke-width="1.4"/><polygon points="330,231 322,235 322,227" fill="#5A6268"/><text x="265" y="251" font-size="15" fill="#1F2A28" text-anchor="middle" font-style="italic">r</text><path d="M243.9,212.7 A44 44 0 0 0 231.2,184" fill="none" stroke="#1F2A28" stroke-width="1.8"/><polygon points="225.1,178.8 233.7,180.9 228.6,187" fill="#1F2A28"/><text x="248" y="193" font-size="14" fill="#1F2A28" font-weight="bold">θ = 1 rad</text><path d="M124,83.4 A152 152 0 0 0 54.1,257.5" fill="none" stroke="#B07A00" stroke-width="3"/><polygon points="57.2,267 48.8,259.2 59.3,255.8" fill="#B07A00"/><text x="24" y="58" font-size="13" fill="#B07A00" font-weight="bold">ω: counterclockwise, called positive</text><circle cx="200" cy="215" r="5" fill="#1F2A28"/><text x="192" y="241" font-size="12" fill="#5A6268" text-anchor="end">axis</text><rect x="440" y="58" width="300" height="316" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="456" y="86" font-size="14" fill="#1F2A28" font-weight="bold">Line</text><text x="610" y="86" font-size="14" fill="#734200" font-weight="bold">Rotation</text><text x="456" y="118" font-size="13" fill="#1F2A28">x (m)</text><text x="610" y="118" font-size="13" fill="#734200" font-weight="bold">θ (rad)</text><text x="456" y="154" font-size="13" fill="#1F2A28">v (m/s)</text><text x="610" y="154" font-size="13" fill="#734200" font-weight="bold">ω (rad/s)</text><text x="456" y="190" font-size="13" fill="#1F2A28">a (m/s²)</text><text x="610" y="190" font-size="13" fill="#734200" font-weight="bold">α (rad/s²)</text><line x1="452" y1="204" x2="738" y2="204" stroke="#C9CFCC" stroke-width="1"/><text x="456" y="226" font-size="13" fill="#1F2A28">v = v₀ + at</text><text x="610" y="226" font-size="13" fill="#734200" font-weight="bold">ω = ω₀ + αt</text><text x="456" y="262" font-size="13" fill="#1F2A28">x = x₀ + v₀t + ½at²</text><text x="610" y="262" font-size="13" fill="#734200" font-weight="bold">θ = θ₀ + ω₀t + ½αt²</text><text x="456" y="298" font-size="13" fill="#1F2A28">v² = v₀² + 2aΔx</text><text x="610" y="298" font-size="13" fill="#734200" font-weight="bold">ω² = ω₀² + 2αΔθ</text><text x="456" y="354" font-size="13" fill="#1F2A28" font-weight="bold">1 revolution = 2π rad = 360°</text>
</svg>
