<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A crank and a torque-angle graph</title>
<desc id="d">Left: a hand pushes up on the handle of a crank wheel, turning it counterclockwise through an angle Δθ; for a constant torque, the work is W = τΔθ, with the angle in radians and work in joules. Right: a graph of torque in N·m against angle in radians. The torque is 4.0 N·m from 0 to 10 rad, then falls in a straight line to zero at 20 rad and stays zero. The shaded area under the line is the work: a rectangle of 4.0 × 10 = 40 J plus a triangle of ½ × 4.0 × 10 = 20 J, 60 J in all.</desc>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Work done by a torque is the area under the torque-angle graph</text><circle cx="140" cy="200" r="80" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2.5"/><circle cx="140" cy="200" r="65.6" fill="#EEF1EF" stroke="#1F2A28" stroke-width="1.5"/><line x1="149.6" y1="200" x2="205.6" y2="200" stroke="#8E989E" stroke-width="3"/><line x1="143" y1="209.1" x2="160.3" y2="262.4" stroke="#8E989E" stroke-width="3"/><line x1="132.2" y1="205.6" x2="86.9" y2="238.6" stroke="#8E989E" stroke-width="3"/><line x1="132.2" y1="194.4" x2="86.9" y2="161.4" stroke="#8E989E" stroke-width="3"/><line x1="143" y1="190.9" x2="160.3" y2="137.6" stroke="#8E989E" stroke-width="3"/><circle cx="140" cy="200" r="9.6" fill="#8E989E" stroke="#1F2A28" stroke-width="1.5"/><circle cx="140" cy="200" r="3" fill="#1F2A28"/><line x1="140" y1="200" x2="220" y2="200" stroke="#1F2A28" stroke-width="5"/><circle cx="220" cy="200" r="8" fill="#E9D8B8" stroke="#1F2A28" stroke-width="2"/><line x1="220" y1="200" x2="220" y2="131" stroke="#5A6268" stroke-width="3.5"/><polygon points="220,120 226,131 214,131" fill="#5A6268"/><text x="230" y="136" font-size="13" fill="#5A6268" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">A</tspan>, hand</text><text x="230" y="152" font-size="13" fill="#5A6268" font-weight="bold">on handle</text><path d="M224.9,151 A98 98 0 0 0 60.6,142.6" fill="none" stroke="#734200" stroke-width="2.5"/><polygon points="55.1,151 55.9,139.6 65.2,145.6" fill="#734200"/><text x="140" y="90" font-size="15" fill="#734200" text-anchor="middle" font-weight="bold">Δθ</text><text x="140" y="330" font-size="16" fill="#734200" text-anchor="middle" font-weight="bold">W = τΔθ (constant τ)</text><text x="140" y="352" font-size="13" fill="#1F2A28" text-anchor="middle">Δθ in radians; W in joules</text><polygon points="340,330 340,138 498.33333333333337,138 656.6666666666667,330" fill="#FBEED5"/><line x1="403.3" y1="330" x2="403.3" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="403.3" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">4</text><line x1="466.7" y1="330" x2="466.7" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="466.7" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">8</text><line x1="530" y1="330" x2="530" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="530" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">12</text><line x1="593.3" y1="330" x2="593.3" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="593.3" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">16</text><line x1="656.7" y1="330" x2="656.7" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="656.7" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">20</text><line x1="720" y1="330" x2="720" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="720" y="348" font-size="12" fill="#1F2A28" text-anchor="middle">24</text><line x1="340" y1="282" x2="720" y2="282" stroke="#E3E7E5" stroke-width="1"/><text x="332" y="286" font-size="12" fill="#1F2A28" text-anchor="end">1</text><line x1="340" y1="234" x2="720" y2="234" stroke="#E3E7E5" stroke-width="1"/><text x="332" y="238" font-size="12" fill="#1F2A28" text-anchor="end">2</text><line x1="340" y1="186" x2="720" y2="186" stroke="#E3E7E5" stroke-width="1"/><text x="332" y="190" font-size="12" fill="#1F2A28" text-anchor="end">3</text><line x1="340" y1="138" x2="720" y2="138" stroke="#E3E7E5" stroke-width="1"/><text x="332" y="142" font-size="12" fill="#1F2A28" text-anchor="end">4</text><line x1="340" y1="90" x2="720" y2="90" stroke="#E3E7E5" stroke-width="1"/><text x="332" y="94" font-size="12" fill="#1F2A28" text-anchor="end">5</text><text x="332" y="334" font-size="12" fill="#1F2A28" text-anchor="end">0</text><line x1="340" y1="330" x2="720" y2="330" stroke="#1F2A28" stroke-width="2"/><line x1="340" y1="330" x2="340" y2="82" stroke="#1F2A28" stroke-width="2"/><path d="M340,138 L498.33333333333337,138 L656.6666666666667,330 L720,330" fill="none" stroke="#734200" stroke-width="3.5"/><text x="419.2" y="239" font-size="13" fill="#734200" text-anchor="middle" font-weight="bold">4.0 × 10 = 40 J</text><text x="550.6" y="277.4" font-size="12" fill="#734200" text-anchor="middle" font-weight="bold">½ × 4.0 × 10</text><text x="550.6" y="306.2" font-size="12" fill="#734200" text-anchor="middle" font-weight="bold">= 20 J</text><text x="530" y="370" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Angle turned, θ (rad)</text><text x="304" y="210" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 304 210)">Torque, τ (N·m)</text><text x="716" y="109.2" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="bold">total work = 60 J</text>
</svg>
