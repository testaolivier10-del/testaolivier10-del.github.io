<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Energy against position for a block on a spring</title>
<desc id="d">Left: a graph of energy against position from −A to +A. Spring potential energy U_s = ½kx² is a parabola that is zero at x = 0 and equals the total at ±A. Kinetic energy K is the upside-down parabola, largest at x = 0 and zero at ±A. The total energy ½kA² is a flat line. Right: energy bar charts at x = +A (all spring energy, K = 0), at x = +A/2 (U_s is a quarter of the total and K three quarters), and at x = 0 (all kinetic).</desc>
<rect width="760" height="470" fill="#FFFFFF"/>
