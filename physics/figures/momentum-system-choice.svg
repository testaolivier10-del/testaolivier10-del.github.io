<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d"><title id="t">Choosing the system for momentum</title><desc id="d">Cart A runs into cart B on a level track. Each cart pushes the other with forces of equal size in opposite directions, drawn from the contact point: B on A to the left, A on B to the right. Top: a dashed boundary around cart A alone; B's push crosses the boundary, so it is an external force and A's momentum changes. Bottom: a dashed boundary around both carts; the pushes are internal, the vertical forces balance, and the momentum of the two-cart system stays constant.</desc><rect width="760" height="430" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Cart A hits cart B on a level, low-friction track</text><rect x="30" y="190" width="370" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="40" y="197" width="8" height="14" fill="#8A8F8C"/><rect x="382" y="197" width="8" height="14" fill="#8A8F8C"/><rect x="70" y="134" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="90" cy="181" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="160" cy="181" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="90" cy="181" r="3" fill="#D7D2C8"/><circle cx="160" cy="181" r="3" fill="#D7D2C8"/><text x="125" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="180" y="134" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="200" cy="181" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="270" cy="181" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="181" r="3" fill="#D7D2C8"/><circle cx="270" cy="181" r="3" fill="#D7D2C8"/><text x="235" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="180" y1="164" x2="133.0" y2="164.0" stroke="#5A6268" stroke-width="3"/><polygon points="122.0,164.0 133.0,159.1 133.0,168.9" fill="#5A6268"/><line x1="180" y1="164" x2="227.0" y2="164.0" stroke="#5A6268" stroke-width="3"/><polygon points="238.0,164.0 227.0,168.9 227.0,159.1" fill="#5A6268"/><text x="188" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="start" font-weight="bold">A on B →</text><text x="172" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="end" font-weight="bold">← B on A</text><rect x="56" y="106" width="132" height="92" rx="14" fill="none" stroke="#734200" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">System: cart A alone</text><text x="430" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">B's push on A crosses the boundary:</text><text x="430" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">it is an external force.</text><text x="430" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#734200" text-anchor="start" font-weight="bold">A's momentum changes.</text><rect x="30" y="380" width="370" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="40" y="387" width="8" height="14" fill="#8A8F8C"/><rect x="382" y="387" width="8" height="14" fill="#8A8F8C"/><rect x="70" y="324" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="90" cy="371" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="160" cy="371" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="90" cy="371" r="3" fill="#D7D2C8"/><circle cx="160" cy="371" r="3" fill="#D7D2C8"/><text x="125" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="180" y="324" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="200" cy="371" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="270" cy="371" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="371" r="3" fill="#D7D2C8"/><circle cx="270" cy="371" r="3" fill="#D7D2C8"/><text x="235" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="180" y1="354" x2="133.0" y2="354.0" stroke="#5A6268" stroke-width="3"/><polygon points="122.0,354.0 133.0,349.1 133.0,358.9" fill="#5A6268"/><line x1="180" y1="354" x2="227.0" y2="354.0" stroke="#5A6268" stroke-width="3"/><polygon points="238.0,354.0 227.0,358.9 227.0,349.1" fill="#5A6268"/><text x="188" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="start" font-weight="bold">A on B →</text><text x="172" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="end" font-weight="bold">← B on A</text><rect x="56" y="296" width="260" height="92" rx="14" fill="none" stroke="#734200" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">System: carts A and B</text><text x="430" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">The pushes between A and B are internal;</text><text x="430" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">gravity and the normal forces balance.</text><text x="430" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#734200" text-anchor="start" font-weight="bold">The system's momentum stays constant.</text></svg>
