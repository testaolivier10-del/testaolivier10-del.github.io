chor="middle" font-weight="bold">launched at 3.0 m/s</text><path d="M170.0,110.0 L180.1,110.3 L190.2,111.1 L200.3,112.5 L210.4,114.4 L220.5,116.9 L230.6,120.0 L240.7,123.6 L250.8,127.8 L260.9,132.5 L271.0,137.8 L281.1,143.6 L291.2,150.0 L301.3,156.9 L311.4,164.4 L321.5,172.5 L331.6,181.1 L341.7,190.3 L351.8,200.0 L361.9,210.2 L372.0,221.1 L382.1,232.5 L392.2,244.4 L402.3,256.9 L412.4,270.0 L422.5,283.6 L432.6,297.7 L442.7,312.4 L452.8,327.7 L462.9,343.5 L473.0,359.9" fill="none" stroke="#734200" stroke-width="1.4" stroke-dasharray="3 4"/><line x1="170.0" y1="80" x2="230.0" y2="80" stroke="#734200" stroke-width="1.5"/><line x1="230.0" y1="75" x2="230.0" y2="85" stroke="#734200"/><line x1="230.0" y1="80" x2="290.0" y2="80" stroke="#734200" stroke-width="1.5"/><line x1="290.0" y1="75" x2="290.0" y2="85" stroke="#734200"/><line x1="170" y1="75" x2="170" y2="85" stroke="#734200"/><text x="170" y="70" fill="#734200" font-size="12" text-anchor="start" font-weight="bold">equal sideways steps: 0.30 m every 0.10 s</text><rect x="500" y="130" width="260" height="150" rx="8" fill="#FBEED5" stroke="#734200"/><text x="514" y="156" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">Horizontal: no acceleration,</text><text x="514" y="177" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">vₓ stays 3.0 m/s (same arrow).</text><text x="514" y="198" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">Vertical: a = 9.8 m/s² down,</text><text x="514" y="219" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">the same as the dropped ball,</text><text x="514" y="240" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">so both reach each height together</text><text x="514" y="261" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">and land at the same time (0.51 s).</text><line x1="514.0" y1="302.0" x2="533.0" y2="302.0" stroke="#B07A00" stroke-width="2.4"/><polygon points=