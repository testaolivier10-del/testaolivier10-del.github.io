<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">A horizontal launch beside a dropped ball</title><desc id="d">Two balls leave a 1.25 m high table at the same instant: one is dropped from rest at the edge, the other rolls off horizontally at 3.0 m/s. Snapshots every 0.10 s show both balls at the same height at each instant, with dashed lines joining equal heights. The launched ball moves 0.30 m sideways in every 0.10 s, and its horizontal velocity arrow stays 3.0 m/s, while its vertical velocity arrow grows like the dropped ball's. Both land together after about 0.51 s, the launched ball about 1.5 m from the table.</desc><rect width="800" height="420" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">Launched sideways and dropped together: they fall in step</text><rect x="20" y="118" width="150" height="12" fill="#A9784A" stroke="#1F2A28"/><rect x="40" y="130" width="12" height="238.0" fill="#8A5F38"/><rect x="140" y="130" width="12" height="238.0" fill="#8A5F38"/><rect x="0" y="368.0" width="800" height="14" fill="#D8D2C4"/><text x="20" y="104" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">table, 1.25 m high</text><line x1="182" y1="110.0" x2="760" y2="110.0" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="114.0" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.0 s</text><line x1="182" y1="119.8" x2="760" y2="119.8" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="123.8" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.1 s</text><line x1="182" y1="149.2" x2="760" y2="149.2" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="153.20000000000002" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.2 s</text><line x1="182" y1="198.2" x2="760" y2="198.2" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="202.20000000000005" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.3 s</text><line x1="182" y1="266.8" x2="760" y2="266.8" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="270.80000000000007" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.4 s</text><line x1="182" y1="355.0" x2="760" y2="355.0" stroke="#E2DED3" stroke-dasharray="4 4"/><text x="764" y="359.0" fill="#5A6268" font-size="11" text-anchor="start" font-weight="normal">0.5 s</text><circle cx="170.0" cy="110.0" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="107.2" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="119.8" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="117.0" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="149.2" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="146.4" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="198.2" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="195.4" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="266.8" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="264.0" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="355.0" r="8" fill="#9AA0A5" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="352.2" r="2.2" fill="#ffffff" opacity="0.5"/><circle cx="170.0" cy="110.0" r="8" fill="#E07B39" stroke="#1F2A28" stroke-width="1.3"/><circle cx="167.2" cy="107.2" r="2.2" fill="#ffffff" opacity="0.5"/><line x1="170.0" y1="110.0" x2="198.0" y2="110.0" stroke="#B07A00" stroke-width="2.4"/><polygon points="209.0,110.0 198.0,104.5 198.0,115.5" fill="#B07A00"/><circle cx="230.0" cy="119.8" r="8" fill="#E07B39" stroke="#1F2A28" stroke-width="1.3"/><circle cx="227.2" cy="117.0" r="2.2" fill="#ffffff" opacity="0.5"/><line x1="230.0" y1="119.8" x2="258.0" y2="119.8" str