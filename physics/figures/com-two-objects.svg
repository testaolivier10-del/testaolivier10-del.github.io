<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Center of mass of two objects, and choosing a system</title>
<desc id="d">Left: a light rod with a 3.0 kg ball at 0 m and a 1.0 kg ball at 0.80 m. The center of mass, marked with a quartered circle, is at 0.20 m, closer to the heavier ball, and the rod balances on a support placed there. The calculation shows x_cm = (3.0 kg × 0 + 1.0 kg × 0.80 m) / (3.0 kg + 1.0 kg) = 0.20 m. Right: two lab carts on a track inside a dashed boundary labelled system: cart 1 + cart 2, with the center-of-mass symbol between them. The track, Earth and air are the surroundings.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">Where is the center of mass?</text><rect x="20" y="46" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">Two balls on a light rod</text><line x1="70" y1="170" x2="370" y2="170" stroke="#9C7A44" stroke-width="5"/><circle cx="70" cy="170" r="26" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><text x="70" y="175" font-size="12" fill="#1F2A28" text-anchor="middle" font-weight="bold">3.0 kg</text><circle cx="370" cy="170" r="15" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><text x="370" y="146" font-size="12" fill="#1F2A28" text-anchor="middle" font-weight="bold">1.0 kg</text><path d="M145,174 L129,204 L161,204 Z" fill="#C9CFCC" stroke="#1F2A28" stroke-width="1.6"/><circle cx="145" cy="170" r="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><path d="M145,170 L153,170 A8,8 0 0,1 145,178 Z" fill="#1F2A28"/><path d="M145,170 L137,170 A8,8 0 0,1 145,162 Z" fill="#1F2A28"/><line x1="70" y1="250" x2="370" y2="250" stroke="#5A6268" stroke-width="1.5"/><line x1="70" y1="250" x2="70" y2="260" stroke="#5A6268" stroke-width="1.2"/><text x="70" y="274" font-size="12" fill="#5A6268" text-anchor="middle">0.0</text><line x1="107.5" y1="250" x2="107.5" y2="256" stroke="#5A6268" stroke-width="1.2"/><line x1="145" y1="250" x2="145" y2="260" stroke="#5A6268" stroke-width="1.2"/><text x="145" y="274" font-size="12" fill="#5A6268" text-anchor="middle">0.2</text><line x1="182.5" y1="250" x2="182.5" y2="256" stroke="#5A6268" stroke-width="1.2"/><line x1="220" y1="250" x2="220" y2="260" stroke="#5A6268" stroke-width="1.2"/><text x="220" y="274" font-size="12" fill="#5A6268" text-anchor="middle">0.4</text><line x1="257.5" y1="250" x2="257.5" y2="256" stroke="#5A6268" stroke-width="1.2"/><line x1="295" y1="250" x2="295" y2="260" stroke="#5A6268" stroke-width="1.2"/><text x="295" y="274" font-size="12" fill="#5A6268" text-anchor="middle">0.6</text><line x1="332.5" y1="250" x2="332.5" y2="256" stroke="#5A6268" stroke-width="1.2"/><line x1="370" y1="250" x2="370" y2="260" stroke="#5A6268" stroke-width="1.2"/><text x="370" y="274" font-size="12" fill="#5A6268" text-anchor="middle">0.8</text><text x="374" y="290" font-size="12" fill="#5A6268" text-anchor="end">x (m)</text><line x1="145" y1="206" x2="145" y2="250" stroke="#734200" stroke-width="1.5" stroke-dasharray="5 4"/><text x="48" y="318" font-size="14" fill="#1F2A28">x<tspan baseline-shift="sub" font-size="11">cm</tspan> = (3.0 kg)(0) + (1.0 kg)(0.80 m)</text><line x1="118" y1="324" x2="330" y2="324" stroke="#1F2A28" stroke-width="1.2"/><text x="222" y="342" font-size="14" fill="#1F2A28" text-anchor="middle">3.0 kg + 1.0 kg</text><text x="48" y="334" font-size="14" fill="#1F2A28"></text><text x="338" y="330" font-size="15" fill="#734200" font-weight="bold">= 0.20 m</text><text x="220" y="366" font-size="12.5" fill="#5A6268" text-anchor="middle">The rod balances on a support under its center of mass.</text><rect x="440" y="46" width="300" height="330" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="454" y="70" font-size="15" fill="#734200" font-weight="bold">A system and its surroundings</text><rect x="460" y="290" width="260" height="10" fill="#EEF1EF"/><line x1="460" y1="290" x2="720" y2="290" stroke="#1F2A28" stroke-width="2.5"/><line x1="466" y1="291" x2="458" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="478" y1="291" x2="470" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="490" y1="291" x2="482" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="502" y1="291" x2="494" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="514" y1="291" x2="506" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="526" y1="291" x2="518" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="538" y1="291" x2="530" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="550" y1="291" x2="542" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="562" y1="291" x2="554" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="574" y1="291" x2="566" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="586" y1="291" x2="578" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="598" y1="291" x2="590" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="610" y1="291" x2="602" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="622" y1="291" x2="614" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="634" y1="291" x2="626" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="646" y1="291" x2="638" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="658" y1="291" x2="650" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="670" y1="291" x2="662" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="682" y1="291" x2="674" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="694" y1="291" x2="686" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="706" y1="291" x2="698" y2="300" stroke="#5A6268" stroke-width="1"/><line x1="718" y1="291" x2="710" y2="300" stroke="#5A6268" stroke-width="1"/><rect x="490" y="246" width="90" height="30" rx="5" fill="#E6E0D2" stroke="#1F2A28" stroke-width="2"/><circle cx="506" cy="283" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><circle cx="564" cy="283" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><text x="535" y="266" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">cart 1</text><rect x="590" y="246" width="90" height="30" rx="5" fill="#E6E0D2" stroke="#1F2A28" stroke-width="2"/><circle cx="606" cy="283" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><circle cx="664" cy="283" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><text x="635" y="266" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">cart 2</text><rect x="478" y="214" width="214" height="70" rx="12" fill="none" stroke="#734200" stroke-width="2.2" stroke-dasharray="8 6"/><text x="585" y="206" font-size="13.5" fill="#734200" text-anchor="middle" font-weight="bold">system: cart 1 + cart 2</text><circle cx="585" cy="254" r="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><path d="M585,254 L593,254 A8,8 0 0,1 585,262 Z" fill="#1F2A28"/><path d="M585,254 L577,254 A8,8 0 0,1 585,246 Z" fill="#1F2A28"/><text x="585" y="326" font-size="13" fill="#5A6268" text-anchor="middle">surroundings: track, Earth, air</text><text x="590" y="352" font-size="12.5" fill="#5A6268" text-anchor="middle">The system moves as if it were one</text><text x="590" y="368" font-size="12.5" fill="#5A6268" text-anchor="middle">object at its center of mass.</text>
</svg>
