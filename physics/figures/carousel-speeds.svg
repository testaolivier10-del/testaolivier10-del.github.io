<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A merry-go-round seen from above</title>
<desc id="d">A merry-go-round seen from above turns counterclockwise about its center. Rider A sits near the rim and rider B halfway out on the same radius. Both turn through the same angle each second, so they share the same angular velocity ω. Their velocity arrows are perpendicular to the radius, and A’s arrow is twice as long as B’s, because A is twice as far from the axis: v = rω. A panel lists s = rθ, v = rω and a_T = rα, with angles in radians.</desc>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Every point shares ω; speed grows with distance from the axis</text><circle cx="210" cy="225" r="150" fill="#E9D8B8" stroke="#1F2A28" stroke-width="2.5"/><line x1="210" y1="225" x2="360" y2="225" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="316.1" y2="118.9" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="210" y2="75" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="103.9" y2="118.9" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="60" y2="225" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="103.9" y2="331.1" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="210" y2="375" stroke="#C9B48E" stroke-width="2"/><line x1="210" y1="225" x2="316.1" y2="331.1" stroke="#C9B48E" stroke-width="2"/><circle cx="210" cy="225" r="14" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><circle cx="210" cy="225" r="3" fill="#1F2A28"/><line x1="210" y1="225" x2="331.2" y2="155" stroke="#5A6268" stroke-width="1.5"/><circle cx="331.2" cy="155" r="13" fill="#9DB7C9" stroke="#1F2A28" stroke-width="2"/><text x="341.2" y="185" font-size="16" fill="#1F2A28" font-weight="bold">A</text><circle cx="270.6" cy="190" r="13" fill="#9DB7C9" stroke="#1F2A28" stroke-width="2"/><text x="280.6" y="220" font-size="16" fill="#1F2A28" font-weight="bold">B</text><line x1="331.2" y1="155" x2="281.7" y2="69.3" stroke="#B07A00" stroke-width="3.5"/><polygon points="276.2,59.7 286.9,66.3 276.5,72.3" fill="#B07A00"/><text x="270.2" y="51.7" font-size="14" fill="#B07A00" text-anchor="end" font-weight="bold"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="75%">A</tspan> = (2r)ω</text><line x1="270.6" y1="190" x2="248.6" y2="151.9" stroke="#B07A00" stroke-width="3.5"/><polygon points="243.1,142.4 253.8,148.9 243.4,154.9" fill="#B07A00"/><text x="235.1" y="138.4" font-size="14" fill="#B07A00" text-anchor="end" font-weight="bold"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="75%">B</tspan> = rω</text><path d="M45.8,269 A170 170 0 0 0 142.6,381.1" fill="none" stroke="#1F2A28" stroke-width="2.5"/><polygon points="151.9,384.7 140.5,386.2 144.6,375.9" fill="#1F2A28"/><text x="230" y="405" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">ω, counterclockwise (same for A and B)</text><rect x="450" y="70" width="290" height="300" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="466" y="100" font-size="14" fill="#1F2A28" font-weight="bold">A point at distance r</text><text x="466" y="120" font-size="14" fill="#1F2A28" font-weight="bold">from the axis</text><text x="466" y="162" font-size="18" fill="#734200" font-weight="bold">s = rθ</text><text x="466" y="182" font-size="13" fill="#5A6268">distance along its circle</text><text x="466" y="214" font-size="18" fill="#734200" font-weight="bold">v = rω</text><text x="466" y="234" font-size="13" fill="#5A6268">its speed</text><text x="466" y="266" font-size="18" fill="#734200" font-weight="bold"><tspan font-style="italic">a</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan> = rα</text><text x="466" y="286" font-size="13" fill="#5A6268">its tangential acceleration</text><text x="466" y="332" font-size="13" fill="#1F2A28">θ, ω and α must be in radians.</text><text x="466" y="352" font-size="13" fill="#1F2A28">A is twice as far out: twice the speed.</text>
</svg>
