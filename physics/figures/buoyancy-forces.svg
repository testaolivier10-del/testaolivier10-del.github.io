<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Why a submerged block feels a buoyant force</title>
<desc id="d">Left: a wooden block held under water by a string tied to the bottom of the tank. Short pressure arrows push down on its top face and longer ones push up on its bottom face, because the bottom is deeper; the side pushes cancel. Right: the block’s free-body diagram, drawn from a dot: the buoyant force (water on block) points up and is the longest; the gravitational force (Earth on block) and the tension (string on block) both point down and together balance it. The buoyant force equals ρ_fluid·V_displaced·g, the weight of the displaced water.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="26" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">The buoyant force: the water pushes up harder than down</text><rect x="40" y="80" width="320" height="290" fill="#D7EBF4"/><path d="M40,50 L40,370 L360,370 L360,50" fill="none" stroke="#1F2A28" stroke-width="3"/><line x1="40" y1="80" x2="360" y2="80" stroke="#7FB6CF" stroke-width="2"/><rect x="150" y="170" width="100" height="90" rx="3" fill="#E9D8B8" stroke="#1F2A28" stroke-width="2"/><line x1="172" y1="142" x2="172" y2="161" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="172,168 168,161 176,161" fill="#734200"/><line x1="172" y1="306" x2="172" y2="269" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="172,262 176,269 168,269" fill="#734200"/><line x1="198" y1="142" x2="198" y2="161" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="198,168 194,161 202,161" fill="#734200"/><line x1="198" y1="306" x2="198" y2="269" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="198,262 202,269 194,269" fill="#734200"/><line x1="224" y1="142" x2="224" y2="161" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="224,168 220,161 228,161" fill="#734200"/><line x1="224" y1="306" x2="224" y2="269" stroke="#734200" stroke-width="2.2" stroke-linecap="butt"/><polygon points="224,262 228,269 220,269" fill="#734200"/><line x1="130" y1="190" x2="142" y2="190" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="148,190 142,193.5 142,186.5" fill="#734200"/><line x1="270" y1="190" x2="258" y2="190" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="252,190 258,186.5 258,193.5" fill="#734200"/><line x1="123.8" y1="215" x2="142" y2="215" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="148,215 142,218.5 142,211.5" fill="#734200"/><line x1="276.3" y1="215" x2="258" y2="215" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="252,215 258,211.5 258,218.5" fill="#734200"/><line x1="117.5" y1="240" x2="142" y2="240" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="148,240 142,243.5 142,236.5" fill="#734200"/><line x1="282.5" y1="240" x2="258" y2="240" stroke="#734200" stroke-width="1.8" stroke-linecap="butt"/><polygon points="252,240 258,236.5 258,243.5" fill="#734200"/><text x="200" y="134" font-size="13" fill="#1F2A28" text-anchor="middle">smaller push on top</text><text x="142" y="286" font-size="13" fill="#1F2A28" text-anchor="end">larger push on</text><text x="142" y="302" font-size="13" fill="#1F2A28" text-anchor="end">the bottom (deeper)</text><text x="352" y="174" font-size="12" fill="#5A6268" text-anchor="end">side pushes</text><text x="352" y="190" font-size="12" fill="#5A6268" text-anchor="end">cancel</text><line x1="400" y1="60" x2="400" y2="400" stroke="#C9CFCC" stroke-width="1.5"/><text x="560" y="60" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="bold">Free-body diagram of the block</text><rect x="536" y="188" width="48" height="44" fill="#E9D8B8" stroke="#1F2A28" stroke-width="1.6"/><circle cx="560" cy="210" r="4.5" fill="#1F2A28"/><line x1="560" y1="210" x2="560" y2="106" stroke="#3E9BC8" stroke-width="3.5" stroke-linecap="butt"/><polygon points="560,95 566,106 554,106" fill="#3E9BC8"/><line x1="572" y1="210" x2="572" y2="279" stroke="#0072B2" stroke-width="3.5" stroke-linecap="butt"/><polygon points="572,290 566,279 578,279" fill="#0072B2"/><line x1="548" y1="210" x2="548" y2="234" stroke="#7A4F9E" stroke-width="3.5" stroke-linecap="butt"/><polygon points="548,245 542,234 554,234" fill="#7A4F9E"/><line x1="548" y1="210" x2="572" y2="210" stroke="#1F2A28" stroke-width="2"/><text x="574" y="118" font-size="13.5" fill="#3E9BC8" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">b</tspan>, water on block</text><text x="584" y="288" font-size="13.5" fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">g</tspan>, Earth on block</text><text x="538" y="256" font-size="13.5" fill="#7A4F9E" text-anchor="end" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">T</tspan>, string on block</text><rect x="440" y="320" width="300" height="62" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="590" y="345" font-size="19" fill="#734200" text-anchor="middle" font-weight="bold">F<tspan baseline-shift="sub" font-size="12">b</tspan> = ρ<tspan baseline-shift="sub" font-size="12">fluid</tspan> V<tspan baseline-shift="sub" font-size="12">disp</tspan> g</text><text x="590" y="370" font-size="13.5" fill="#1F2A28" text-anchor="middle">the weight of the displaced fluid</text><line x1="242" y1="260" x2="242" y2="370" stroke="#7A4F9E" stroke-width="1.8"/><text x="250" y="358" font-size="12" fill="#7A4F9E">string</text>
</svg>
