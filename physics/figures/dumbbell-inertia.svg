<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Two dumbbells with the same mass but different rotational inertia</title>
<desc id="d">Two light rods each carry two equal masses m and turn about a vertical axis through their centers. In the top rod the masses sit a distance r from the axis, giving I = 2mr². In the bottom rod they sit at 2r, giving I = 8mr², four times as much with the same total mass. A panel gives I = Σmr², notes that doubling the distance quadruples I, and lists rotational inertias the exam gives for shapes: hoop MR², solid disk ½MR², solid sphere two fifths MR², rod about its center one twelfth ML², rod about one end one third ML². Unit kg·m².</desc>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Same mass, different distribution, different rotational inertia</text><line x1="200" y1="90" x2="200" y2="190" stroke="#734200" stroke-width="2" stroke-dasharray="6 5"/><path d="M177.5,117 A26 26 0 0 0 216,124.5" fill="none" stroke="#734200" stroke-width="2"/><polygon points="222.5,117 220.1,128.1 211.8,120.9" fill="#734200"/><line x1="30" y1="140" x2="370" y2="140" stroke="#1F2A28" stroke-width="4"/><circle cx="140" cy="140" r="20" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><circle cx="260" cy="140" r="20" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><text x="140" y="145" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">m</text><text x="260" y="145" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">m</text><line x1="230" y1="174" x2="208" y2="174" stroke="#5A6268" stroke-width="1.4"/><polygon points="200,174 208,170 208,178" fill="#5A6268"/><line x1="230" y1="174" x2="252" y2="174" stroke="#5A6268" stroke-width="1.4"/><polygon points="260,174 252,178 252,170" fill="#5A6268"/><text x="230" y="194" font-size="14" fill="#1F2A28" text-anchor="middle" font-style="italic">r</text><text x="200" y="222" font-size="16" fill="#734200" text-anchor="middle" font-weight="bold">I = 2mr²</text><text x="30" y="76" font-size="14" fill="#1F2A28" font-weight="bold">Masses close to the axis</text><line x1="200" y1="280" x2="200" y2="380" stroke="#734200" stroke-width="2" stroke-dasharray="6 5"/><path d="M177.5,307 A26 26 0 0 0 216,314.5" fill="none" stroke="#734200" stroke-width="2"/><polygon points="222.5,307 220.1,318.1 211.8,310.9" fill="#734200"/><line x1="30" y1="330" x2="370" y2="330" stroke="#1F2A28" stroke-width="4"/><circle cx="80" cy="330" r="20" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><circle cx="320" cy="330" r="20" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><text x="80" y="335" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">m</text><text x="320" y="335" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">m</text><line x1="260" y1="364" x2="208" y2="364" stroke="#5A6268" stroke-width="1.4"/><polygon points="200,364 208,360 208,368" fill="#5A6268"/><line x1="260" y1="364" x2="312" y2="364" stroke="#5A6268" stroke-width="1.4"/><polygon points="320,364 312,368 312,360" fill="#5A6268"/><text x="260" y="384" font-size="14" fill="#1F2A28" text-anchor="middle" font-style="italic">2r</text><text x="200" y="412" font-size="16" fill="#734200" text-anchor="middle" font-weight="bold">I = 2m(2r)² = 8mr²</text><text x="30" y="266" font-size="14" fill="#1F2A28" font-weight="bold">Masses twice as far out</text><rect x="450" y="80" width="290" height="300" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="466" y="112" font-size="20" fill="#734200" font-weight="bold">I = Σ m r²</text><text x="466" y="138" font-size="13" fill="#1F2A28">r is each mass’s distance from</text><text x="466" y="156" font-size="13" fill="#1F2A28">the axis, and it is squared.</text><text x="466" y="190" font-size="14" fill="#1F2A28" font-weight="bold">Doubling r: 4 times the I.</text><text x="466" y="216" font-size="13" fill="#1F2A28" font-weight="bold">Shapes (given on the exam):</text><text x="466" y="242" font-size="13" fill="#1F2A28">hoop about its center</text><text x="720" y="242" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="bold">MR²</text><text x="466" y="266" font-size="13" fill="#1F2A28">solid disk or cylinder</text><text x="720" y="266" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="bold">½MR²</text><text x="466" y="290" font-size="13" fill="#1F2A28">solid sphere</text><text x="720" y="290" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="bold">⅖MR²</text><text x="466" y="314" font-size="13" fill="#1F2A28">rod about its center</text><text x="720" y="314" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="bold">¹⁄₁₂ML²</text><text x="466" y="338" font-size="13" fill="#1F2A28">rod about one end</text><text x="720" y="338" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="bold">⅓ML²</text><text x="466" y="370" font-size="13" fill="#1F2A28">Unit: kg·m²</text>
</svg>
