<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A book on a table: forces on the book and the third-law pairs</title>
<desc id="d">Left: the free-body diagram of a book at rest, a dot with F_N, table on book, up and F_g, Earth on book, down, of equal length. They act on the same object and cancel, so they are not a third-law pair. Right: the book, the table and Earth drawn pulled apart so each force sits on the object it acts on. One pair, marked with single ticks, is the contact (normal) interaction: table on book upward and book on table downward. The other pair, marked with double ticks, is the gravitational interaction: Earth on book downward and book on Earth upward. Each pair has the same size, opposite directions, acts on different objects and is the same type of force.</desc>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">Forces on one object, and third-law pairs</text><rect x="20" y="46" width="300" height="374" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">Forces on the book</text><line x1="170" y1="220" x2="170" y2="152" stroke="#009E73" stroke-width="3.2"/><polygon points="170,140 176.5,152 163.5,152" fill="#009E73"/><text x="180" y="154" font-size="14" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">N</tspan></tspan><tspan fill="#1F2A28">, table on book</tspan></text><line x1="170" y1="220" x2="170" y2="288" stroke="#0072B2" stroke-width="3.2"/><polygon points="170,300 163.5,288 176.5,288" fill="#0072B2"/><text x="180" y="294" font-size="14" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">g</tspan></tspan><tspan fill="#1F2A28">, Earth on book</tspan></text><circle cx="170" cy="220" r="5.5" fill="#1F2A28"/><text x="170" y="352" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Same object, equal sizes:</text><text x="170" y="370" font-size="12.5" fill="#5A6268" text-anchor="middle">they cancel because the book</text><text x="170" y="386" font-size="12.5" fill="#5A6268" text-anchor="middle">is at rest. They are NOT a</text><text x="170" y="402" font-size="12.5" fill="#5A6268" text-anchor="middle">third-law pair.</text><rect x="340" y="46" width="400" height="374" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="354" y="70" font-size="15" fill="#734200" font-weight="bold">Pulled apart: each pair</text><rect x="432" y="130" width="96" height="26" rx="2" fill="#B5533C" stroke="#1F2A28" stroke-width="2"/><text x="446" y="148" font-size="12" fill="#FFFFFF" font-weight="bold">book</text><line x1="468" y1="143" x2="468" y2="100" stroke="#009E73" stroke-width="3.2"/><polygon points="468,88 474.5,100 461.5,100" fill="#009E73"/><line x1="461" y1="110" x2="475" y2="110" stroke="#009E73" stroke-width="2"/><text x="458" y="98" font-size="13" fill="#1F2A28" text-anchor="end"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, table on book</tspan></text><line x1="506" y1="143" x2="506" y2="188" stroke="#0072B2" stroke-width="3.2"/><polygon points="506,200 499.5,188 512.5,188" fill="#0072B2"/><line x1="499" y1="172" x2="513" y2="172" stroke="#0072B2" stroke-width="2"/><line x1="499" y1="177" x2="513" y2="177" stroke="#0072B2" stroke-width="2"/><text x="516" y="196" font-size="13" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth on book</tspan></text><rect x="392" y="236" width="220" height="14" rx="3" fill="#E3C99A" stroke="#9C7A44" stroke-width="2"/><line x1="412" y1="250" x2="412" y2="340" stroke="#9C7A44" stroke-width="6"/><line x1="592" y1="250" x2="592" y2="340" stroke="#9C7A44" stroke-width="6"/><text x="560" y="268" font-size="12" fill="#5A6268" text-anchor="middle" font-weight="bold">table</text><line x1="468" y1="243" x2="468" y2="286" stroke="#009E73" stroke-width="3.2"/><polygon points="468,298 461.5,286 474.5,286" fill="#009E73"/><line x1="461" y1="268" x2="475" y2="268" stroke="#009E73" stroke-width="2"/><text x="478" y="300" font-size="13" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, book on table</tspan></text><path d="M344,416 Q540,350 736,416 Z" fill="#CFE3D3" stroke="#1F2A28" stroke-width="2"/><text x="470" y="404" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Earth</text><line x1="660" y1="382" x2="660" y2="338" stroke="#0072B2" stroke-width="3.2"/><polygon points="660,326 666.5,338 653.5,338" fill="#0072B2"/><line x1="653" y1="350" x2="667" y2="350" stroke="#0072B2" stroke-width="2"/><line x1="653" y1="355" x2="667" y2="355" stroke="#0072B2" stroke-width="2"/><text x="660" y="314" font-size="13" fill="#1F2A28" text-anchor="middle"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, book on Earth</tspan></text><line x1="605" y1="96" x2="619" y2="96" stroke="#1F2A28" stroke-width="2"/><text x="626" y="101" font-size="12.5" fill="#1F2A28">contact pair</text><line x1="605" y1="120" x2="619" y2="120" stroke="#1F2A28" stroke-width="2"/><line x1="605" y1="125" x2="619" y2="125" stroke="#1F2A28" stroke-width="2"/><text x="626" y="128" font-size="12.5" fill="#1F2A28">gravity pair</text><text x="540" y="222" font-size="12" fill="#5A6268" text-anchor="middle">Partners: same size, opposite, on different objects.</text>
</svg>
