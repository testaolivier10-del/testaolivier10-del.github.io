<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A pulley with mass, a hanging block and their force diagrams</title>
<desc id="d">A pulley of mass M and radius R turns on a fixed axle hung from the ceiling. A light string wrapped around its rim holds a block of mass m, which accelerates downward with acceleration a while the pulley gains angular acceleration α, with a = Rα. Middle: the force diagram of the pulley shows the string pulling down at the rim, Earth’s gravitational force down at the center and the axle’s force up at the center; only the string’s pull has a lever arm, so F_T R = Iα. Right: the free-body diagram of the block shows the string’s tension up, shorter than Earth’s gravitational force down, so mg − F_T = ma.</desc>
<rect width="760" height="460" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">A pulley with mass: rotation and translation together</text><rect x="60" y="44" width="200" height="10" fill="#EEF1EF"/><line x1="60" y1="54" x2="260" y2="54" stroke="#1F2A28" stroke-width="2.5"/><line x1="64" y1="54" x2="72" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="76" y1="54" x2="84" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="88" y1="54" x2="96" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="100" y1="54" x2="108" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="112" y1="54" x2="120" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="124" y1="54" x2="132" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="136" y1="54" x2="144" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="148" y1="54" x2="156" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="160" y1="54" x2="168" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="172" y1="54" x2="180" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="184" y1="54" x2="192" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="196" y1="54" x2="204" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="208" y1="54" x2="216" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="220" y1="54" x2="228" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="232" y1="54" x2="240" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="244" y1="54" x2="252" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="256" y1="54" x2="264" y2="45" stroke="#5A6268" stroke-width="1"/><line x1="150" y1="54" x2="150" y2="120" stroke="#1F2A28" stroke-width="5"/><circle cx="150" cy="120" r="50" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2.5"/><circle cx="150" cy="120" r="41" fill="#B9C2C7" stroke="#1F2A28" stroke-width="1.5"/><circle cx="150" cy="120" r="6" fill="#8E989E" stroke="#1F2A28" stroke-width="1.5"/><circle cx="150" cy="120" r="3" fill="#1F2A28"/><circle cx="150" cy="120" r="12.5" fill="#8E989E" stroke="#1F2A28" stroke-width="1.5"/><circle cx="150" cy="120" r="3" fill="#1F2A28"/><line x1="200" y1="120" x2="200" y2="300" stroke="#1F2A28" stroke-width="2"/><rect x="172" y="300" width="56" height="50" rx="3" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><text x="200" y="331" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">m</text><text x="92" y="124" font-size="14" fill="#1F2A28" text-anchor="end" font-style="italic">M, R</text><path d="M183,62.8 A66 66 0 0 1 206.4,154.3" fill="none" stroke="#734200" stroke-width="2.5"/><polygon points="200.6,162.4 201.9,151.1 210.9,157.5" fill="#734200"/><text x="230" y="74" font-size="16" fill="#734200" font-weight="bold" font-style="italic">α</text><line x1="244" y1="300" x2="244" y2="339" stroke="#A33B26" stroke-width="2.5"/><polygon points="244,350 238,339 250,339" fill="#A33B26"/><text x="252" y="330" font-size="15" fill="#A33B26" font-weight="bold" font-style="italic">a</text><text x="40" y="400" font-size="13" fill="#1F2A28">Light string, no slipping:</text><text x="40" y="420" font-size="15" fill="#734200" font-weight="bold">a = Rα</text><text x="410" y="66" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Pulley (force diagram)</text><circle cx="410" cy="200" r="50" fill="#EEF1EF" stroke="#1F2A28" stroke-width="2"/><circle cx="410" cy="200" r="4" fill="#1F2A28"/><line x1="460" y1="200" x2="460" y2="249" stroke="#7A4F9E" stroke-width="3.5"/><polygon points="460,260 454,249 466,249" fill="#7A4F9E"/><text x="466" y="274" font-size="13" fill="#7A4F9E" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan>, string on pulley</text><line x1="406" y1="200" x2="406" y2="239" stroke="#0072B2" stroke-width="3.5"/><polygon points="406,250 400,239 412,239" fill="#0072B2"/><text x="400" y="266" font-size="13" fill="#0072B2" text-anchor="end" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on pulley</text><line x1="414" y1="200" x2="414" y2="101" stroke="#009E73" stroke-width="3.5"/><polygon points="414,90 420,101 408,101" fill="#009E73"/><text x="422" y="104" font-size="13" fill="#009E73" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">axle</tspan>, axle on pulley</text><text x="410" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">Only the string’s pull has a lever arm (R):</text><text x="410" y="354" font-size="17" fill="#734200" text-anchor="middle" font-weight="bold">τ = <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan>R = Iα</text><text x="640" y="66" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Block (free-body diagram)</text><circle cx="680" cy="210" r="6" fill="#1F2A28"/><line x1="680" y1="210" x2="680" y2="151" stroke="#7A4F9E" stroke-width="3.5"/><polygon points="680,140 686,151 674,151" fill="#7A4F9E"/><text x="670" y="154" font-size="13" fill="#7A4F9E" text-anchor="end" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan>, string on block</text><line x1="680" y1="210" x2="680" y2="309" stroke="#0072B2" stroke-width="3.5"/><polygon points="680,320 674,309 686,309" fill="#0072B2"/><text x="670" y="310" font-size="13" fill="#0072B2" text-anchor="end" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on block</text><text x="640" y="354" font-size="17" fill="#734200" text-anchor="middle" font-weight="bold">mg − <tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan> = ma</text><text x="640" y="380" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">T</tspan> < mg: the block</text><text x="640" y="398" font-size="12.5" fill="#1F2A28" text-anchor="middle">speeds up downward</text>
</svg>
