<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A car on a flat curve: top view and free-body diagram</title>
<desc id="d">Left: a car on a curved road seen from above, a quarter circle around a marked center. An outlined velocity arrow points along the road, tangent to the circle; an outlined acceleration arrow points from the car toward the center. Right: the free-body diagram of the car seen from behind: F_N, road on car, up and F_g, Earth on car, down, equal, and F_f, road on tires, horizontal toward the center of the curve, shorter than the weight. Static friction is the only horizontal force, so it supplies the centripetal net force, F_f = mv²/r. There is no separate centripetal force arrow.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">A car rounding a flat curve at constant speed</text><rect x="20" y="46" width="360" height="334" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">Seen from above</text><path d="M300,300 A190,190 0 0,0 110,110" fill="none" stroke="#C9CFCC" stroke-width="30"/><path d="M300,300 A190,190 0 0,0 110,110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 8"/><circle cx="110" cy="300" r="4" fill="#1F2A28"/><text x="118" y="316" font-size="12.5" fill="#5A6268">center</text><g transform="translate(244.4 165.6) rotate(-45)"><rect x="-12" y="-22" width="24" height="44" rx="6" fill="#C0392B" stroke="#1F2A28" stroke-width="1.6"/><rect x="-9" y="-16" width="18" height="10" rx="2" fill="#DDE7EE"/></g><line x1="244.4" y1="165.6" x2="110" y2="300" stroke="#5A6268" stroke-width="1" stroke-dasharray="4 4"/><polygon points="220.8,137.2 176.7,93.1 180.6,89.2 164.4,85.6 167.9,101.9 171.8,98 215.9,142.1" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="152.4" y="83.6" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><polygon points="217.9,187.2 181.8,223.3 177.9,219.4 174.4,235.6 190.6,232.1 186.7,228.2 222.8,192.1" fill="#FFFFFF" stroke="#A33B26" stroke-width="2.2" stroke-linejoin="round"/><text x="144.4" y="257.6" font-size="13" fill="#A33B26" font-weight="bold">a toward center</text><text x="200" y="360" font-size="12.5" fill="#5A6268" text-anchor="middle">Velocity is tangent; acceleration points in.</text><rect x="396" y="46" width="344" height="334" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="410" y="70" font-size="15" fill="#734200" font-weight="bold">Free-body diagram (car seen from behind)</text><line x1="580" y1="210" x2="580" y2="138" stroke="#009E73" stroke-width="3.2"/><polygon points="580,126 586.5,138 573.5,138" fill="#009E73"/><text x="588" y="138" font-size="14" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">N</tspan></tspan><tspan fill="#1F2A28">, road on car</tspan></text><line x1="580" y1="210" x2="580" y2="282" stroke="#0072B2" stroke-width="3.2"/><polygon points="580,294 573.5,282 586.5,282" fill="#0072B2"/><text x="588" y="290" font-size="14" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">g</tspan></tspan><tspan fill="#1F2A28">, Earth on car</tspan></text><line x1="580" y1="210" x2="530" y2="210" stroke="#D55E00" stroke-width="3.2"/><polygon points="518,210 530,203.5 530,216.5" fill="#D55E00"/><text x="430" y="196" font-size="14" fill="#1F2A28" text-anchor="start"><tspan fill="#D55E00" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">f</tspan></tspan><tspan fill="#1F2A28">, road on tires</tspan></text><circle cx="580" cy="210" r="5.5" fill="#1F2A28"/><text x="518" y="240" font-size="12" fill="#5A6268" text-anchor="middle">(toward the center)</text><text x="568" y="340" font-size="12.5" fill="#5A6268" text-anchor="middle">Static friction is the only horizontal force,</text><text x="568" y="358" font-size="12.5" fill="#5A6268" text-anchor="middle">so it supplies the centripetal net force: F<tspan baseline-shift="sub" font-size="9">f</tspan> = mv²/r.</text>
</svg>
