<title id="t">Position, velocity and acceleration in SHM</title>
<desc id="d">Three graphs against time over one period T, lined up. Position starts at +A, crosses zero at T/4, reaches −A at T/2 and returns to +A at T. Velocity is zero at 0, T/2 and T (the turning points) and has its greatest size at T/4 and 3T/4, where x = 0. Acceleration is always opposite to the position: largest and negative at x = +A, zero at x = 0, largest and positive at x = −A.</desc>
