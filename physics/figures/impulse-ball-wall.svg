<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Impulse from a force-time graph</title><desc id="d">A 0.20 kg ball moves left at 4.0 m/s toward a wall, is squashed against it while the wall pushes it to the right, and leaves moving right at 2.0 m/s. A graph of the wall's force on the ball against time is a triangle rising from 0 to 600 N at 2 ms and back to 0 at 4 ms. The shaded area under it is the impulse, one half times 0.0040 s times 600 N, or 1.2 N·s to the right, equal to the ball's change in momentum.</desc><rect width="760" height="380" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">The wall's push on the ball: impulse is the area under F(t)</text><rect x="48" y="60" width="12" height="260" fill="#CFC9BD" stroke="#1F2A28" stroke-width="2"/><line x1="48" y1="68" x2="58" y2="76" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="82" x2="58" y2="90" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="96" x2="58" y2="104" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="110" x2="58" y2="118" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="124" x2="58" y2="132" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="138" x2="58" y2="146" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="152" x2="58" y2="160" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="166" x2="58" y2="174" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="180" x2="58" y2="188" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="194" x2="58" y2="202" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="208" x2="58" y2="216" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="222" x2="58" y2="230" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="236" x2="58" y2="244" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="250" x2="58" y2="258" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="264" x2="58" y2="272" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="278" x2="58" y2="286" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="292" x2="58" y2="300" stroke="#8A8F8C" stroke-width="1.2"/><line x1="48" y1="306" x2="58" y2="314" stroke="#8A8F8C" stroke-width="1.2"/><text x="80" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start" font-weight="bold">Before</text><circle cx="270" cy="110" r="18" fill="#E07B39" stroke="#1F2A28" stroke-width="2"/><circle cx="263.7" cy="103.7" r="4.5" fill="#fff" opacity="0.55"/><line x1="250" y1="110" x2="191.0" y2="110.0" stroke="#B07A00" stroke-width="3"/><polygon points="180.0,110.0 191.0,105.0 191.0,115.0" fill="#B07A00"/><text x="172.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="end" font-weight="bold">v<tspan baseline-shift="sub" font-size="75%">i</tspan> = 4.0 m/s</text><text x="80" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start" font-weight="bold">During contact</text><ellipse cx="74" cy="200" rx="14" ry="20" fill="#E07B39" stroke="#1F2A28" stroke-width="2"/><line x1="74" y1="200" x2="153.0" y2="200.0" stroke="#009E73" stroke-width="3"/><polygon points="164.0,200.0 153.0,204.9 153.0,195.1" fill="#009E73"/><text x="172.0" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#009E73" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">N</tspan>, wall on ball</text><circle cx="74" cy="200" r="3.5" fill="#1F2A28"/><text x="80" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start" font-weight="bold">After</text><circle cx="110" cy="290" r="18" fill="#E07B39" stroke="#1F2A28" stroke-width="2"/><circle cx="103.7" cy="283.7" r="4.5" fill="#fff" opacity="0.55"/><line x1="132" y1="290" x2="156.0" y2="290.0" stroke="#B07A00" stroke-width="3"/><polygon points="167.0,290.0 156.0,294.9 156.0,285.1" fill="#B07A00"/><text x="175.0" y="295.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v<tspan baseline-shift="sub" font-size="75%">f</tspan> = 2.0 m/s</text><line x1="390" y1="300" x2="720" y2="300" stroke="#1F2A28" stroke-width="2"/><line x1="390" y1="300" x2="390" y2="80" stroke="#1F2A28" stroke-width="2"/><text x="550" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">Time (ms)</text><text x="346" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 346 195)">Force of wall on ball (N)</text><line x1="390" y1="300" x2="390" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="390" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">0</text><line x1="460" y1="300" x2="460" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="460" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">1</text><line x1="530" y1="300" x2="530" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="530" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">2</text><line x1="600" y1="300" x2="600" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="600" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">3</text><line x1="670" y1="300" x2="670" y2="305" stroke="#1F2A28" stroke-width="1.5"/><text x="670" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">4</text><line x1="385" y1="300" x2="390" y2="300" stroke="#1F2A28" stroke-width="1.5"/><text x="381" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">0</text><line x1="385" y1="204" x2="390" y2="204" stroke="#1F2A28" stroke-width="1.5"/><text x="381" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">300</text><line x1="385" y1="108" x2="390" y2="108" stroke="#1F2A28" stroke-width="1.5"/><text x="381" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">600</text><path d="M390,300 L530,108 L670,300 Z" fill="#F3DDB0" stroke="#734200" stroke-width="2.5"/><text x="530" y="245.6" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#734200" text-anchor="middle" font-weight="bold">area = J</text><text x="530" y="264.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#734200" text-anchor="middle">= ½(0.0040 s)(600 N)</text><text x="530" y="282.4" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#734200" text-anchor="middle">= 1.2 N·s</text><text x="24" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="start">For a 0.20 kg ball: J = Δp = (0.20 kg)(+2.0 m/s) − (0.20 kg)(−4.0 m/s) = 1.2 kg·m/s, to the right.</text></svg>
