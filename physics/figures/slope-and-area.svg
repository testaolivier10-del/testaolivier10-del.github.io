<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Slope and area of a graph</title><desc id="d">Two graphs. Left: distance walked in meters against time in seconds, a straight line through the origin to 20 m at 10 s. A dashed triangle between the points (2 s, 4 m) and (8 s, 16 m) shows a run of 6 s and a rise of 12 m, so the slope is 12 m divided by 6 s = 2 m/s; the units of a slope are the y unit over the x unit. Right: speed in m/s against time, a horizontal line at 3 m/s. The rectangle under it from 2 s to 8 s is shaded: its area is 3 m/s times 6 s = 18 m, the distance covered; the units of an area are the y unit times the x unit.</desc><rect width="800" height="380" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">Slope reads a rate; area multiplies the two axes</text><line x1="90.0" y1="60" x2="90.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="144.0" y1="60" x2="144.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="198.0" y1="60" x2="198.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="252.0" y1="60" x2="252.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="306.0" y1="60" x2="306.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="360.0" y1="60" x2="360.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="290.0" x2="360" y2="290.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="244.0" x2="360" y2="244.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="198.0" x2="360" y2="198.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="152.0" x2="360" y2="152.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="106.0" x2="360" y2="106.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="60.0" x2="360" y2="60.0" stroke="#E6E2D8" stroke-width="1"/><line x1="90" y1="290.0" x2="360" y2="290.0" stroke="#1F2A28" stroke-width="1.6"/><line x1="90" y1="60" x2="90" y2="290" stroke="#1F2A28" stroke-width="1.6"/><text x="90.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">0</text><text x="144.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">2</text><text x="198.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">4</text><text x="252.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">6</text><text x="306.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">8</text><text x="360.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">10</text><text x="84" y="294.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">0</text><text x="84" y="248.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">5</text><text x="84" y="202.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">10</text><text x="84" y="156.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">15</text><text x="84" y="110.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">20</text><text x="84" y="64.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">25</text><text x="225.0" y="326" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">Time (s)</text><text transform="translate(50 175.0) rotate(-90)" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">Distance walked (m)</text><polyline points="90.0,290.0 360.0,106.0" fill="none" stroke="#734200" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="144.0,253.2 306.0,253.2 306.0,142.8" fill="none" stroke="#A33B26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><text x="225.0" y="269.2" fill="#A33B26" font-size="12" text-anchor="middle" font-weight="normal">run = 8 s − 2 s = 6 s</text><text x="312.0" y="194.0" fill="#A33B26" font-size="12" text-anchor="start" font-weight="normal">rise = 16 m − 4 m</text><text x="312.0" y="210.0" fill="#A33B26" font-size="12" text-anchor="start" font-weight="normal">= 12 m</text><circle cx="144.0" cy="253.2" r="4.5" fill="#1F2A28" stroke="#ffffff" stroke-width="1"/><circle cx="306.0" cy="142.8" r="4.5" fill="#1F2A28" stroke="#ffffff" stroke-width="1"/><text x="225" y="352" fill="#1F2A28" font-size="14" text-anchor="middle" font-weight="bold">slope = rise/run = 12 m ÷ 6 s = 2 m/s</text><text x="225" y="370" fill="#5A6268" font-size="12" text-anchor="middle" font-weight="normal">the units of a slope are (y unit)/(x unit)</text><line x1="500.0" y1="60" x2="500.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="554.0" y1="60" x2="554.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="608.0" y1="60" x2="608.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="662.0" y1="60" x2="662.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="716.0" y1="60" x2="716.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="770.0" y1="60" x2="770.0" y2="290" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="290.0" x2="770" y2="290.0" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="232.5" x2="770" y2="232.5" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="175.0" x2="770" y2="175.0" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="117.5" x2="770" y2="117.5" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="60.0" x2="770" y2="60.0" stroke="#E6E2D8" stroke-width="1"/><line x1="500" y1="290.0" x2="770" y2="290.0" stroke="#1F2A28" stroke-width="1.6"/><line x1="500" y1="60" x2="500" y2="290" stroke="#1F2A28" stroke-width="1.6"/><text x="500.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">0</text><text x="554.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">2</text><text x="608.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">4</text><text x="662.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">6</text><text x="716.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">8</text><text x="770.0" y="306.0" fill="#1F2A28" font-size="11" text-anchor="middle" font-weight="normal">10</text><text x="494" y="294.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">0</text><text x="494" y="236.5" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">1</text><text x="494" y="179.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">2</text><text x="494" y="121.5" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">3</text><text x="494" y="64.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">4</text><text x="635.0" y="326" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">Time (s)</text><text transform="translate(460 175.0) rotate(-90)" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">Speed (m/s)</text><polygon points="554.0,290.0 554.0,117.5 716.0,117.5 716.0,290.0" fill="#F6D776" opacity="0.7"/><polyline points="500.0,117.5 770.0,117.5" fill="none" stroke="#734200" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="635.0" y="203.8" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="bold">area = 3 m/s × 6 s</text><text x="635.0" y="221.8" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="bold">= 18 m</text><text x="635" y="352" fill="#1F2A28" font-size="14" text-anchor="middle" font-weight="bold">area = height × width = distance covered</text><text x="635" y="370" fill="#5A6268" font-size="12" text-anchor="middle" font-weight="normal">the units of an area are (y unit) × (x unit)</text></svg>