<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The gravitational force between two spheres</title>
<desc id="d">A large sphere of mass m1 and a smaller sphere of mass m2, a distance r apart measured center to center. Each pulls the other toward itself with forces of equal size: F_g, 2 on 1 points right toward m2 and F_g, 1 on 2 points left toward m1. A panel gives |F_g| = G m1 m2 / r² and the scaling: doubling r divides the force by 4, tripling r divides it by 9, doubling m1 doubles it, doubling both masses multiplies it by 4.</desc>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">Gravitational force between two objects</text><circle cx="150" cy="130" r="52" fill="#9DB8CC" stroke="#1F2A28" stroke-width="2"/><text x="150" y="116" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">m<tspan baseline-shift="sub" font-size="13">1</tspan></text><circle cx="520" cy="130" r="30" fill="#C9B79C" stroke="#1F2A28" stroke-width="2"/><text x="520" y="120" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">m<tspan baseline-shift="sub" font-size="12">2</tspan></text><circle cx="150" cy="130" r="3" fill="#1F2A28"/><circle cx="520" cy="130" r="3" fill="#1F2A28"/><line x1="204" y1="130" x2="278" y2="130" stroke="#0072B2" stroke-width="3.2"/><polygon points="290,130 278,136.5 278,123.5" fill="#0072B2"/><text x="210" y="114" font-size="13" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, 2 on 1</tspan></text><line x1="488" y1="130" x2="414" y2="130" stroke="#0072B2" stroke-width="3.2"/><polygon points="402,130 414,123.5 414,136.5" fill="#0072B2"/><text x="402" y="114" font-size="13" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, 1 on 2</tspan></text><line x1="150" y1="204" x2="520" y2="204" stroke="#5A6268" stroke-width="1.4"/><line x1="150" y1="194" x2="150" y2="214" stroke="#5A6268" stroke-width="1.4"/><line x1="520" y1="194" x2="520" y2="214" stroke="#5A6268" stroke-width="1.4"/><text x="335" y="226" font-size="13.5" fill="#1F2A28" text-anchor="middle">r, center to center</text><rect x="590" y="60" width="154" height="130" rx="8" fill="#EEF1EF" stroke="#C9CFCC" stroke-width="2"/><text x="667" y="88" font-size="15" fill="#734200" text-anchor="middle" font-weight="bold">|F<tspan baseline-shift="sub" font-size="11">g</tspan>| = G m₁m₂ / r²</text><text x="604" y="118" font-size="13.5" fill="#1F2A28">r × 2  →  F ÷ 4</text><text x="604" y="140" font-size="13.5" fill="#1F2A28">r × 3  →  F ÷ 9</text><text x="604" y="162" font-size="13.5" fill="#1F2A28">m<tspan baseline-shift="sub" font-size="10">1</tspan> × 2  →  F × 2</text><text x="604" y="182" font-size="13.5" fill="#1F2A28">both × 2  →  F × 4</text><text x="380" y="270" font-size="13" fill="#5A6268" text-anchor="middle">Equal sizes on both objects, attractive, along the line joining the centers.</text>
</svg>
