<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Acceleration and the change in velocity</title><desc id="d">Two rows of snapshots of a car on a road, taken 1 s apart, with a gold velocity arrow above each car. Top row, speeding up while moving right: the snapshots spread out and the velocity arrows grow. At the right, the initial and final velocity arrows are drawn from one point; the change in velocity, delta v, points right, so the acceleration points right, the same way as the velocity. Bottom row, slowing down while moving right: the snapshots bunch together and the arrows shrink; delta v points left, so the acceleration points left, opposite to the velocity, and the car slows.</desc><rect width="800" height="400" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">Acceleration points the way the velocity changes</text><text x="24" y="80" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="bold">Speeding up while moving right</text><rect x="20" y="150" width="570" height="10" fill="#6B7075"/><line x1="20" y1="155.0" x2="590" y2="155.0" stroke="#F2E6B8" stroke-width="1.5" stroke-dasharray="10 8"/><g opacity="1.0"><path d="M43.0,144.1 L43.0,137.9 Q43.0,136.0 47.3,136.0 L60.3,136.0 L65.7,128.2 L80.8,128.2 L88.4,136.0 L94.8,137.2 Q97.0,138.3 97.0,141.3 L97.0,144.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M67.3,134.8 L68.9,129.8 L79.2,129.8 L84.6,134.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="94.3" y="138.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="54.9" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="54.9" cy="144.1" r="2.4" fill="#C9CDD1"/><circle cx="85.1" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="85.1" cy="144.1" r="2.4" fill="#C9CDD1"/></g><line x1="70.0" y1="110.0" x2="89.0" y2="110.0" stroke="#B07A00" stroke-width="3"/><polygon points="100.0,110.0 89.0,104.5 89.0,115.5" fill="#B07A00"/><text x="70" y="176" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 0 s</text><g opacity="0.45"><path d="M138.0,144.1 L138.0,137.9 Q138.0,136.0 142.3,136.0 L155.3,136.0 L160.7,128.2 L175.8,128.2 L183.4,136.0 L189.8,137.2 Q192.0,138.3 192.0,141.3 L192.0,144.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M162.3,134.8 L163.9,129.8 L174.2,129.8 L179.6,134.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="189.3" y="138.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="149.9" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="149.9" cy="144.1" r="2.4" fill="#C9CDD1"/><circle cx="180.1" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="180.1" cy="144.1" r="2.4" fill="#C9CDD1"/></g><line x1="165.0" y1="110.0" x2="204.0" y2="110.0" stroke="#B07A00" stroke-width="3"/><polygon points="215.0,110.0 204.0,104.5 204.0,115.5" fill="#B07A00"/><text x="165" y="176" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 1 s</text><g opacity="0.45"><path d="M263.0,144.1 L263.0,137.9 Q263.0,136.0 267.3,136.0 L280.3,136.0 L285.7,128.2 L300.8,128.2 L308.4,136.0 L314.8,137.2 Q317.0,138.3 317.0,141.3 L317.0,144.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M287.3,134.8 L288.9,129.8 L299.2,129.8 L304.6,134.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="314.3" y="138.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="274.9" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="274.9" cy="144.1" r="2.4" fill="#C9CDD1"/><circle cx="305.1" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="305.1" cy="144.1" r="2.4" fill="#C9CDD1"/></g><line x1="290.0" y1="110.0" x2="349.0" y2="110.0" stroke="#B07A00" stroke-width="3"/><polygon points="360.0,110.0 349.0,104.5 349.0,115.5" fill="#B07A00"/><text x="290" y="176" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 2 s</text><g opacity="1.0"><path d="M423.0,144.1 L423.0,137.9 Q423.0,136.0 427.3,136.0 L440.3,136.0 L445.7,128.2 L460.8,128.2 L468.4,136.0 L474.8,137.2 Q477.0,138.3 477.0,141.3 L477.0,144.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M447.3,134.8 L448.9,129.8 L459.2,129.8 L464.6,134.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="474.3" y="138.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="434.9" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="434.9" cy="144.1" r="2.4" fill="#C9CDD1"/><circle cx="465.1" cy="144.1" r="5.9" fill="#2B2F33"/><circle cx="465.1" cy="144.1" r="2.4" fill="#C9CDD1"/></g><line x1="450.0" y1="110.0" x2="529.0" y2="110.0" stroke="#B07A00" stroke-width="3"/><polygon points="540.0,110.0 529.0,104.5 529.0,115.5" fill="#B07A00"/><text x="450" y="176" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 3 s</text><text x="36" y="114" fill="#B07A00" font-size="14" text-anchor="end" font-weight="bold" font-style="italic">v</text><text x="600" y="80" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">Δv = v(final) − v(initial)</text><line x1="600.0" y1="102.0" x2="619.0" y2="102.0" stroke="#B07A00" stroke-width="3"/><polygon points="630.0,102.0 619.0,96.5 619.0,107.5" fill="#B07A00"/><text x="698" y="106" fill="#B07A00" font-size="11" text-anchor="start" font-weight="normal">v(initial)</text><line x1="600.0" y1="122.0" x2="679.0" y2="122.0" stroke="#B07A00" stroke-width="3"/><polygon points="690.0,122.0 679.0,116.5 679.0,127.5" fill="#B07A00"/><text x="698" y="126" fill="#B07A00" font-size="11" text-anchor="start" font-weight="normal">v(final)</text><line x1="630.0" y1="144.0" x2="679.0" y2="144.0" stroke="#A33B26" stroke-width="3.5"/><polygon points="690.0,144.0 679.0,138.5 679.0,149.5" fill="#A33B26"/><text x="698" y="148" fill="#A33B26" font-size="11" text-anchor="start" font-weight="bold">Δv, and a</text><text x="24" y="198" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">v grows, so Δv points right. a = Δv/Δt points right, the same way as v.</text><text x="24" y="260" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="bold">Slowing down while moving right</text><rect x="20" y="330" width="570" height="10" fill="#6B7075"/><line x1="20" y1="335.0" x2="590" y2="335.0" stroke="#F2E6B8" stroke-width="1.5" stroke-dasharray="10 8"/><g opacity="1.0"><path d="M43.0,324.1 L43.0,317.9 Q43.0,316.0 47.3,316.0 L60.3,316.0 L65.7,308.2 L80.8,308.2 L88.4,316.0 L94.8,317.2 Q97.0,318.3 97.0,321.3 L97.0,324.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M67.3,314.8 L68.9,309.8 L79.2,309.8 L84.6,314.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="94.3" y="318.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="54.9" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="54.9" cy="324.1" r="2.4" fill="#C9CDD1"/><circle cx="85.1" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="85.1" cy="324.1" r="2.4" fill="#C9CDD1"/></g><line x1="70.0" y1="290.0" x2="149.0" y2="290.0" stroke="#B07A00" stroke-width="3"/><polygon points="160.0,290.0 149.0,284.5 149.0,295.5" fill="#B07A00"/><text x="70" y="356" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 0 s</text><g opacity="0.45"><path d="M203.0,324.1 L203.0,317.9 Q203.0,316.0 207.3,316.0 L220.3,316.0 L225.7,308.2 L240.8,308.2 L248.4,316.0 L254.8,317.2 Q257.0,318.3 257.0,321.3 L257.0,324.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M227.3,314.8 L228.9,309.8 L239.2,309.8 L244.6,314.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="254.3" y="318.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="214.9" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="214.9" cy="324.1" r="2.4" fill="#C9CDD1"/><circle cx="245.1" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="245.1" cy="324.1" r="2.4" fill="#C9CDD1"/></g><line x1="230.0" y1="290.0" x2="289.0" y2="290.0" stroke="#B07A00" stroke-width="3"/><polygon points="300.0,290.0 289.0,284.5 289.0,295.5" fill="#B07A00"/><text x="230" y="356" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 1 s</text><g opacity="0.45"><path d="M333.0,324.1 L333.0,317.9 Q333.0,316.0 337.3,316.0 L350.3,316.0 L355.7,308.2 L370.8,308.2 L378.4,316.0 L384.8,317.2 Q387.0,318.3 387.0,321.3 L387.0,324.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M357.3,314.8 L358.9,309.8 L369.2,309.8 L374.6,314.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="384.3" y="318.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="344.9" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="344.9" cy="324.1" r="2.4" fill="#C9CDD1"/><circle cx="375.1" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="375.1" cy="324.1" r="2.4" fill="#C9CDD1"/></g><line x1="360.0" y1="290.0" x2="399.0" y2="290.0" stroke="#B07A00" stroke-width="3"/><polygon points="410.0,290.0 399.0,284.5 399.0,295.5" fill="#B07A00"/><text x="360" y="356" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 2 s</text><g opacity="1.0"><path d="M423.0,324.1 L423.0,317.9 Q423.0,316.0 427.3,316.0 L440.3,316.0 L445.7,308.2 L460.8,308.2 L468.4,316.0 L474.8,317.2 Q477.0,318.3 477.0,321.3 L477.0,324.1 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M447.3,314.8 L448.9,309.8 L459.2,309.8 L464.6,314.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="474.3" y="318.3" width="2.2" height="2.3" fill="#F6D776"/><circle cx="434.9" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="434.9" cy="324.1" r="2.4" fill="#C9CDD1"/><circle cx="465.1" cy="324.1" r="5.9" fill="#2B2F33"/><circle cx="465.1" cy="324.1" r="2.4" fill="#C9CDD1"/></g><line x1="450.0" y1="290.0" x2="469.0" y2="290.0" stroke="#B07A00" stroke-width="3"/><polygon points="480.0,290.0 469.0,284.5 469.0,295.5" fill="#B07A00"/><text x="450" y="356" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">t = 3 s</text><text x="36" y="294" fill="#B07A00" font-size="14" text-anchor="end" font-weight="bold" font-style="italic">v</text><text x="600" y="260" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">Δv = v(final) − v(initial)</text><line x1="600.0" y1="282.0" x2="679.0" y2="282.0" stroke="#B07A00" stroke-width="3"/><polygon points="690.0,282.0 679.0,276.5 679.0,287.5" fill="#B07A00"/><text x="698" y="286" fill="#B07A00" font-size="11" text-anchor="start" font-weight="normal">v(initial)</text><line x1="600.0" y1="302.0" x2="619.0" y2="302.0" stroke="#B07A00" stroke-width="3"/><polygon points="630.0,302.0 619.0,296.5 619.0,307.5" fill="#B07A00"/><text x="698" y="306" fill="#B07A00" font-size="11" text-anchor="start" font-weight="normal">v(final)</text><line x1="690.0" y1="324.0" x2="641.0" y2="324.0" stroke="#A33B26" stroke-width="3.5"/><polygon points="630.0,324.0 641.0,329.5 641.0,318.5" fill="#A33B26"/><text x="698" y="328" fill="#A33B26" font-size="11" text-anchor="start" font-weight="bold">Δv, and a</text><text x="24" y="378" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">v shrinks, so Δv points left. a points left, opposite to v: the car slows.</text><line x1="20" y1="208" x2="780" y2="208" stroke="#E2DED3"/><text x="780" y="392" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">Faded cars: snapshots 1 s apart.</text></svg>