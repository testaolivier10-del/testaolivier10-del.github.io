<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="t d"><title id="t">Potential energy belongs to a system</title><desc id="d">Left: a ball held above a table, with Earth below. A dashed boundary around the ball and Earth marks the system; its gravitational potential energy is U_g = mgΔy measured from a chosen zero, here the table top. Right: a block pressed against a spring fixed to a wall, compressed by Δx from its relaxed length. A dashed boundary around the block and spring marks the system; its elastic potential energy is U_s = ½k(Δx)².</desc><rect width="760" height="410" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Potential energy belongs to a system of interacting objects</text><path d="M30,300 L350,300 L350,350 L30,350 Z" fill="#CDE3C3"/><line x1="30" y1="300" x2="350" y2="300" stroke="#1F2A28" stroke-width="2.5"/><text x="190" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Earth</text><line x1="40" y1="240" x2="340" y2="240" stroke="#734200" stroke-width="1.5" stroke-dasharray="7 5"/><text x="44" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#734200" text-anchor="start">chosen zero: U<tspan baseline-shift="sub" font-size="75%">g</tspan> = 0 (table top)</text><rect x="110" y="240" width="120" height="12" fill="#B08A5A" stroke="#1F2A28" stroke-width="1.5"/><rect x="118" y="252" width="10" height="48" fill="#B08A5A" stroke="#1F2A28" stroke-width="1.2"/><rect x="212" y="252" width="10" height="48" fill="#B08A5A" stroke="#1F2A28" stroke-width="1.2"/><circle cx="170" cy="110" r="16" fill="#E07B39" stroke="#1F2A28" stroke-width="2"/><circle cx="164.4" cy="104.4" r="4" fill="#fff" opacity="0.55"/><line x1="270" y1="110" x2="270" y2="240" stroke="#1F2A28" stroke-width="1.5"/><line x1="262" y1="110" x2="278" y2="110" stroke="#1F2A28" stroke-width="1.5"/><line x1="262" y1="240" x2="278" y2="240" stroke="#1F2A28" stroke-width="1.5"/><text x="280" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="start" font-weight="bold">Δy</text><rect x="36" y="76" width="320" height="290" rx="14" fill="none" stroke="#734200" stroke-width="2" stroke-dasharray="8 5"/><text x="46" y="69" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">System: ball + Earth</text><text x="52" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0072B2" text-anchor="start" font-weight="bold">U<tspan baseline-shift="sub" font-size="75%">g</tspan> = mgΔy</text><line x1="400" y1="230" x2="740" y2="230" stroke="#1F2A28" stroke-width="2.5"/><line x1="406" y1="231" x2="397" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="420" y1="231" x2="411" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="434" y1="231" x2="425" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="448" y1="231" x2="439" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="462" y1="231" x2="453" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="476" y1="231" x2="467" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="490" y1="231" x2="481" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="504" y1="231" x2="495" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="518" y1="231" x2="509" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="532" y1="231" x2="523" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="546" y1="231" x2="537" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="560" y1="231" x2="551" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="574" y1="231" x2="565" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="588" y1="231" x2="579" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="602" y1="231" x2="593" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="616" y1="231" x2="607" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="630" y1="231" x2="621" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="644" y1="231" x2="635" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="658" y1="231" x2="649" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="672" y1="231" x2="663" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="686" y1="231" x2="677" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="700" y1="231" x2="691" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="714" y1="231" x2="705" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><line x1="728" y1="231" x2="719" y2="240" stroke="#8A8F8C" stroke-width="1.3"/><rect x="400" y="140" width="12" height="90" fill="#CFC9BD" stroke="#1F2A28" stroke-width="2"/><line x1="400" y1="148" x2="410" y2="156" stroke="#8A8F8C" stroke-width="1.2"/><line x1="400" y1="162" x2="410" y2="170" stroke="#8A8F8C" stroke-width="1.2"/><line x1="400" y1="176" x2="410" y2="184" stroke="#8A8F8C" stroke-width="1.2"/><line x1="400" y1="190" x2="410" y2="198" stroke="#8A8F8C" stroke-width="1.2"/><line x1="400" y1="204" x2="410" y2="212" stroke="#8A8F8C" stroke-width="1.2"/><line x1="400" y1="218" x2="410" y2="226" stroke="#8A8F8C" stroke-width="1.2"/><path d="M412,200 L420,200 L423.7,189.0 L431.0,211.0 L438.3,189.0 L445.7,211.0 L453.0,189.0 L460.3,211.0 L467.7,189.0 L475.0,211.0 L482.3,189.0 L489.7,211.0 L497.0,189.0 L504.3,211.0 L511.7,189.0 L519.0,211.0 L526.3,189.0 L533.7,211.0 L541.0,189.0 L548.3,211.0 L552,200 L560,200" fill="none" stroke="#CC79A7" stroke-width="2.5" stroke-linejoin="round"/><rect x="560" y="170" width="70" height="60" fill="#9CC3E0" stroke="#1F2A28" stroke-width="2"/><text x="595" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">block</text><line x1="560" y1="264" x2="640" y2="264" stroke="#1F2A28" stroke-width="1.5"/><line x1="560" y1="258" x2="560" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="640" y1="258" x2="640" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="640" y1="160" x2="640" y2="270" stroke="#8A8F8C" stroke-width="1.2" stroke-dasharray="4 3"/><text x="636" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5A6268" text-anchor="end">end of relaxed spring</text><text x="600" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">Δx (compression)</text><rect x="392" y="108" width="352" height="186" rx="14" fill="none" stroke="#734200" stroke-width="2" stroke-dasharray="8 5"/><text x="402" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">System: block + spring</text><text x="420" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CC79A7" text-anchor="start" font-weight="bold">U<tspan baseline-shift="sub" font-size="75%">s</tspan> = ½k(Δx)²</text><text x="24" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="start">Lift the ball or squeeze the spring and the system stores energy. A single object alone has no potential energy.</text></svg>
