<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Work done by the forces on a pulled crate</title><desc id="d">A crate on a rough floor is pulled to the right by a rope at 30 degrees above the horizontal and moves 4.0 m to the right. Four forces act on it, drawn from its center: the rope's tension up and to the right, kinetic friction from the floor to the left, the normal force from the floor up, and the gravitational force from Earth down. A table gives the work each does: tension does positive work F_T d cos 30°, friction does negative work minus f_k d, and the normal and gravitational forces, at 90 degrees to the displacement, do zero work. The net work equals the change in kinetic energy.</desc><rect width="760" height="380" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Work done by each force on a crate pulled 4.0 m to the right</text><line x1="20" y1="250" x2="470" y2="250" stroke="#1F2A28" stroke-width="2.5"/><line x1="26" y1="251" x2="17" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="40" y1="251" x2="31" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="54" y1="251" x2="45" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="68" y1="251" x2="59" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="82" y1="251" x2="73" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="96" y1="251" x2="87" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="110" y1="251" x2="101" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="124" y1="251" x2="115" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="138" y1="251" x2="129" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="152" y1="251" x2="143" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="166" y1="251" x2="157" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="180" y1="251" x2="171" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="194" y1="251" x2="185" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="208" y1="251" x2="199" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="222" y1="251" x2="213" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="236" y1="251" x2="227" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="250" y1="251" x2="241" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="264" y1="251" x2="255" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="278" y1="251" x2="269" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="292" y1="251" x2="283" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="306" y1="251" x2="297" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="320" y1="251" x2="311" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="334" y1="251" x2="325" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="348" y1="251" x2="339" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="362" y1="251" x2="353" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="376" y1="251" x2="367" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="390" y1="251" x2="381" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="404" y1="251" x2="395" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="418" y1="251" x2="409" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="432" y1="251" x2="423" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="446" y1="251" x2="437" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><line x1="460" y1="251" x2="451" y2="260" stroke="#8A8F8C" stroke-width="1.3"/><rect x="200" y="170" width="110" height="80" fill="#D9B27C" stroke="#1F2A28" stroke-width="2"/><rect x="205" y="175" width="100" height="70" fill="none" stroke="#9C7440" stroke-width="2"/><line x1="205" y1="175" x2="305" y2="245" stroke="#9C7440" stroke-width="2"/><line x1="305" y1="175" x2="205" y2="245" stroke="#9C7440" stroke-width="2"/><line x1="255" y1="210" x2="428.20508075688775" y2="110.00000000000001" stroke="#8B6B3E" stroke-width="3"/><line x1="255" y1="210" x2="255.0" y2="291.0" stroke="#0072B2" stroke-width="3"/><polygon points="255.0,302.0 250.1,291.0 259.9,291.0" fill="#0072B2"/><text x="259.0" y="322.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on crate</text><line x1="255" y1="210" x2="255.0" y2="163.0" stroke="#009E73" stroke-width="3"/><polygon points="255.0,152.0 259.9,163.0 250.1,163.0" fill="#009E73"/><text x="249.0" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#009E73" text-anchor="end" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">N</tspan>, floor on crate</text><line x1="255" y1="210" x2="306.1" y2="180.5" stroke="#7A4F9E" stroke-width="3"/><polygon points="315.6,175.0 308.6,184.8 303.6,176.2" fill="#7A4F9E"/><text x="362.5" y="170.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A4F9E" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">T</tspan>, rope on crate</text><line x1="255" y1="210" x2="226.0" y2="210.0" stroke="#D55E00" stroke-width="3"/><polygon points="215.0,210.0 226.0,205.1 226.0,214.9" fill="#D55E00"/><text x="192" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D55E00" text-anchor="end" font-weight="bold">f<tspan baseline-shift="sub" font-size="75%">k</tspan>, floor on crate</text><line x1="194" y1="228" x2="225" y2="214" stroke="#D55E00" stroke-width="1"/><circle cx="255" cy="210" r="4.5" fill="#1F2A28"/><path d="M289,210 A34,34 0 0 0 284.4,193.0" fill="none" stroke="#1F2A28" stroke-width="1.5"/><line x1="255" y1="210" x2="345" y2="210" stroke="#8A8F8C" stroke-width="1.2" stroke-dasharray="4 3"/><text x="293" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="start">30°</text><line x1="200" y1="288" x2="369.0" y2="288.0" stroke="#1F2A28" stroke-width="3"/><polygon points="380.0,288.0 369.0,292.9 369.0,283.1" fill="#1F2A28"/><text x="388.0" y="293.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">displacement d = 4.0 m</text><rect x="468" y="48" width="276" height="174" fill="#FBF8F2" stroke="#1F2A28" stroke-width="1.2"/><text x="478" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">Force</text><text x="578" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">angle</text><text x="630" y="70" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">work on crate</text><line x1="474" y1="80" x2="738" y2="80" stroke="#1F2A28" stroke-width="1"/><text x="478" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A4F9E" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">T</tspan> (rope)</text><text x="578" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">30°</text><text x="630" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">+F<tspan baseline-shift="sub" font-size="75%">T</tspan> d cos 30°</text><text x="478" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D55E00" text-anchor="start" font-weight="bold">f<tspan baseline-shift="sub" font-size="75%">k</tspan> (floor)</text><text x="578" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">180°</text><text x="630" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">−f<tspan baseline-shift="sub" font-size="75%">k</tspan> d</text><text x="478" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#009E73" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">N</tspan> (floor)</text><text x="578" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">90°</text><text x="630" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">0</text><text x="478" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">g</tspan> (Earth)</text><text x="578" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">90°</text><text x="630" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">0</text><text x="478" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#734200" text-anchor="start" font-weight="bold">Net work = sum of the four = ΔK</text><text x="478" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start">W = F d cos θ (θ from the force to d)</text><text x="24" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="start">Forces at right angles to the displacement do no work; a force against the motion does negative work.</text></svg>
