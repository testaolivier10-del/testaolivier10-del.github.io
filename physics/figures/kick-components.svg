<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Vector components with right-triangle trigonometry</title><desc id="d">Left: a soccer ball kicked from the grass with velocity 15 m/s at 37 degrees above the horizontal. The velocity arrow is the hypotenuse of a right triangle; its horizontal component, v x = v cos theta = 15 cos 37 degrees = 12 m/s, runs along the ground, and its vertical component, v y = v sin theta = 15 sin 37 degrees = 9.0 m/s, runs straight up. Right: a right triangle with angle theta, labeled hypotenuse, adjacent and opposite sides, with sin = opposite over hypotenuse, cos = adjacent over hypotenuse, tan = opposite over adjacent, the Pythagorean theorem, and a reminder to set the calculator to degree mode.</desc><rect width="800" height="380" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">Splitting a velocity into components</text><rect x="20" y="308" width="380" height="14" fill="#7BAE5B"/><circle cx="76.0" cy="298.0" r="10" fill="#ffffff" stroke="#1F2A28" stroke-width="1.3"/><circle cx="72.5" cy="294.5" r="2.8" fill="#ffffff" opacity="0.5"/><line x1="90.0" y1="300.0" x2="246.7" y2="300.0" stroke="#8C6A1E" stroke-width="2.6" stroke-dasharray="7 4"/><polygon points="257.7,300.0 246.7,294.5 246.7,305.5" fill="#8C6A1E"/><line x1="257.7" y1="300.0" x2="257.7" y2="184.6" stroke="#8C6A1E" stroke-width="2.6" stroke-dasharray="7 4"/><polygon points="257.7,173.6 252.2,184.6 263.2,184.6" fill="#8C6A1E"/><line x1="90.0" y1="300.0" x2="248.9" y2="180.2" stroke="#B07A00" stroke-width="4"/><polygon points="257.7,173.6 245.6,175.8 252.2,184.6" fill="#B07A00"/><path d="M136,300 A46,46 0 0,0 126.7,272.3" fill="none" stroke="#1F2A28" stroke-width="1.3"/><text x="142" y="288" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">37°</text><rect x="245.7" y="288" width="12" height="12" fill="none" stroke="#1F2A28"/><text x="159.85672855496574" y="226.80942256903492" fill="#B07A00" font-size="14" text-anchor="end" font-weight="bold">v = 15 m/s</text><text x="173.85672855496574" y="340" fill="#8C6A1E" font-size="13" text-anchor="middle" font-weight="bold">vₓ = v cos θ = 15 cos 37° = 12 m/s</text><text x="267.7134571099315" y="230.80942256903492" fill="#8C6A1E" font-size="13" text-anchor="start" font-weight="bold">v<tspan font-size="10" dy="4">y</tspan><tspan dy="-4"> = v sin θ</tspan></text><text x="267.7134571099315" y="248.80942256903492" fill="#8C6A1E" font-size="13" text-anchor="start" font-weight="bold">= 15 sin 37° = 9.0 m/s</text><polygon points="460,290 680,290 680,120" fill="#FBEED5" stroke="#1F2A28" stroke-width="2"/><rect x="666" y="276" width="14" height="14" fill="none" stroke="#1F2A28"/><path d="M510,290 A50,50 0 0,0 499.6,259.4" fill="none" stroke="#1F2A28" stroke-width="1.3"/><text x="518" y="278" fill="#1F2A28" font-size="15" text-anchor="start" font-weight="bold">θ</text><text x="556.0" y="191.0" fill="#1F2A28" font-size="13" text-anchor="end" font-weight="bold">hypotenuse</text><text x="570.0" y="312" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="bold">adjacent to θ</text><text x="30" y="66" fill="#5A6268" font-size="12" text-anchor="start" font-weight="normal">Solid arrow: the velocity. Dashed arrows: its components.</text><text x="688" y="205.0" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="bold">opposite</text><text x="688" y="221.0" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="bold">θ</text><text x="520" y="64" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">sin θ = opposite / hypotenuse</text><text x="520" y="82" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">cos θ = adjacent / hypotenuse</text><text x="520" y="100" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">tan θ = opposite / adjacent</text><text x="520" y="342" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">hypotenuse² = adjacent² + opposite²</text><text x="520" y="360" fill="#A33B26" font-size="13" text-anchor="start" font-weight="bold">Calculator in DEGREE mode</text></svg>