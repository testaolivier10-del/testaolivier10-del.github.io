<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A rider on a scale in an elevator in three states of motion</title>
<desc id="d">Three panels show a 70 kg person standing on a bathroom scale in an elevator, with g = 9.8 m/s². Accelerating upward at 1.2 m/s²: the free-body diagram has F_N, scale on rider, longer than F_g, Earth on rider, and the scale reads 770 N. Constant velocity: the two forces are equal and the scale reads 686 N. Accelerating downward at 1.2 m/s²: F_N is shorter than F_g and the scale reads 602 N. The scale reads the normal force, the apparent weight; the gravitational force, 686 N, is the same in all three.</desc>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Apparent weight in an elevator (70 kg rider, g = 9.8 m/s²)</text><rect x="20" y="46" width="228" height="374" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">Accelerating up</text><rect x="40" y="100" width="92" height="210" rx="4" fill="#F7F7F4" stroke="#1F2A28" stroke-width="2.4"/><line x1="86" y1="86" x2="86" y2="100" stroke="#1F2A28" stroke-width="2"/><rect x="58" y="294" width="56" height="12" rx="2" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><circle cx="86" cy="187.2" r="13.2" fill="#E8C4A0" stroke="#1F2A28" stroke-width="1.6"/><rect x="70.4" y="198" width="31.2" height="40.8" rx="7.2" fill="#5B7DA8" stroke="#1F2A28" stroke-width="1.6"/><line x1="70.4" y1="204" x2="62" y2="240.8" stroke="#1F2A28" stroke-width="5"/><line x1="101.6" y1="204" x2="110" y2="240.8" stroke="#1F2A28" stroke-width="5"/><line x1="78.8" y1="238.8" x2="76.4" y2="294" stroke="#1F2A28" stroke-width="6"/><line x1="93.2" y1="238.8" x2="95.6" y2="294" stroke="#1F2A28" stroke-width="6"/><rect x="46" y="320" width="80" height="26" rx="5" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><text x="86" y="338" font-size="14" fill="#734200" text-anchor="middle" font-weight="bold">770 N</text><text x="86" y="362" font-size="12" fill="#5A6268" text-anchor="middle">scale reads</text><line x1="190" y1="190" x2="190" y2="112.2" stroke="#009E73" stroke-width="3.2"/><polygon points="190,100.2 196.5,112.2 183.5,112.2" fill="#009E73"/><text x="198" y="114.2" font-size="14" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">N</tspan></tspan></text><line x1="190" y1="190" x2="190" y2="258" stroke="#0072B2" stroke-width="3.2"/><polygon points="190,270 183.5,258 196.5,258" fill="#0072B2"/><text x="198" y="266" font-size="14" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan 