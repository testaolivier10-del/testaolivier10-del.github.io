<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A cart on a level track pulled by a block hanging over a pulley, with free-body diagrams</title>
<desc id="d">Left: a cart of mass M on a level table is tied to a light string that runs over a pulley at the table edge to a hanging block of mass m. Outlined acceleration arrows show the cart accelerating to the right and the block accelerating downward. Right: free-body diagrams. The cart has F_N, track on cart, up and F_g, Earth on cart, down, equal, and F_T, string on cart, to the right. The hanging block has F_T, string on block, up and a longer F_g, Earth on block, down. Each acceleration arrow is drawn beside its diagram, not on the dot, because acceleration is not a force.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">A cart pulled by a hanging block</text><rect x="20" y="46" width="340" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">The scene</text><rect x="40" y="170" width="260" height="16" rx="3" fill="#EEF1EF" stroke="#1F2A28" stroke-width="2"/><line x1="60" y1="186" x2="60" y2="360" stroke="#5A6268" stroke-width="5"/><line x1="280" y1="186" x2="280" y2="360" stroke="#5A6268" stroke-width="5"/><rect x="70" y="124" width="100" height="32" rx="5" fill="#E6E0D2" stroke="#1F2A28" stroke-width="2"/><circle cx="86" cy="163" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><circle cx="154" cy="163" r="7" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><text x="120" y="145" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">cart, M</text><line x1="286" y1="180" x2="306" y2="160" stroke="#5A6268" stroke-width="4"/><circle cx="306" cy="160" r="14" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><circle cx="306" cy="160" r="3" fill="#1F2A28"/><line x1="170" y1="140" x2="306" y2="146" stroke="#1F2A28" stroke-width="1.8"/><line x1="320" y1="160" x2="320" y2="250" stroke="#1F2A28" stroke-width="1.8"/><line x1="320" y1="250" x2="320" y2="260" stroke="#1F2A28" stroke-width="2"/><rect x="300" y="260" width="40" height="38" rx="4" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><line x1="300" y1="272.7" x2="340" y2="272.7" stroke="#5A6268" stroke-width="1"/><line x1="300" y1="285.3" x2="340" y2="285.3" stroke="#5A6268" stroke-width="1"/><text x="320" y="284" font-size="12" fill="#1F2A28" text-anchor="middle" font-weight="bold">m</text><polygon points="80,99.5 136,99.5 136,105 150,96 136,87 136,92.5 80,92.5" fill="#FFFFFF" stroke="#A33B26" stroke-width="2.2" stroke-linejoin="round"/><text x="160" y="101" font-size="15" fill="#A33B26" font-weight="bold" font-style="italic">a</text><polygon points="342.5,252 342.5,286 337,286 346,300 355,286 349.5,286 349.5,252" fill="#FFFFFF" stroke="#A33B26" stroke-width="2.2" stroke-linejoin="round"/><text x="338" y="318" font-size="15" fill="#A33B26" text-anchor="end" font-weight="bold" font-style="italic">a</text><text x="190" y="376" font-size="12.5" fill="#5A6268" text-anchor="middle">Light string, light frictionless pulley,</text><text x="190" y="392" font-size="12.5" fill="#5A6268" text-anchor="middle">no friction on the cart.</text><rect x="375" y="46" width="365" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="389" y="70" font-size="15" fill="#734200" font-weight="bold">Free-body diagrams</text><text x="470" y="84" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Cart</text><line x1="450" y1="180" x2="450" y2="120" stroke="#009E73" stroke-width="3.2"/><polygon points="450,108 456.5,120 443.5,120" fill="#009E73"/><text x="458" y="120" font-size="12.5" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, track on cart</tspan></text><line x1="450" y1="180" x2="450" y2="240" stroke="#0072B2" stroke-width="3.2"/><polygon points="450,252 443.5,240 456.5,240" fill="#0072B2"/><text x="458" y="248" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth on cart</tspan></text><line x1="450" y1="180" x2="492" y2="180" stroke="#7A4F9E" stroke-width="3.2"/><polygon points="504,180 492,186.5 492,173.5" fill="#7A4F9E"/><text x="464" y="168" font-size="12.5" fill="#1F2A28"><tspan fill="#7A4F9E" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">T</tspan></tspan><tspan fill="#1F2A28">, string</tspan></text><circle cx="450" cy="180" r="5.5" fill="#1F2A28"/><polygon points="420,303.5 466,303.5 466,309 480,300 466,291 466,296.5 420,296.5" fill="#FFFFFF" stroke="#A33B26" stroke-width="2.2" stroke-linejoin="round"/><text x="490" y="305" font-size="12.5" fill="#A33B26">a (not a force)</text><text x="640" y="84" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">Hanging block</text><line x1="615" y1="190" x2="615" y2="152" stroke="#7A4F9E" stroke-width="3.2"/><polygon points="615,140 621.5,152 608.5,152" fill="#7A4F9E"/><text x="623" y="148" font-size="12.5" fill="#1F2A28"><tspan fill="#7A4F9E" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">T</tspan></tspan><tspan fill="#1F2A28">, string on block</tspan></text><line x1="615" y1="190" x2="615" y2="258" stroke="#0072B2" stroke-width="3.2"/><polygon points="615,270 608.5,258 621.5,258" fill="#0072B2"/><text x="623" y="264" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth on block</tspan></text><circle cx="615" cy="190" r="5.5" fill="#1F2A28"/><polygon points="596.5,296 596.5,332 591,332 600,346 609,332 603.5,332 603.5,296" fill="#FFFFFF" stroke="#A33B26" stroke-width="2.2" stroke-linejoin="round"/><text x="612" y="330" font-size="12.5" fill="#A33B26">a (not a force)</text><text x="560" y="384" font-size="12.5" fill="#5A6268" text-anchor="middle">Block: F<tspan baseline-shift="sub" font-size="9">g</tspan> longer than F<tspan baseline-shift="sub" font-size="9">T</tspan>, so it speeds up downward.</text>
</svg>
