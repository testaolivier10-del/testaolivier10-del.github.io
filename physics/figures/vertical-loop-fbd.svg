<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Free-body diagrams of a cart at the top and bottom of a vertical loop</title>
<desc id="d">Left: a vertical circular loop with a cart on the inside of the track at the top, upside down, and at the bottom, with outlined velocity arrows tangent to the loop. Right: free-body diagrams. At the top, both forces point down toward the center: F_g, Earth, and F_N, track, so F_g + F_N = mv²/r. At the bottom, F_N, track, points up toward the center and is longer than F_g, Earth, pointing down, so F_N − F_g = mv²/r. No separate centripetal force arrow is drawn; the net force is the sum of the real forces.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">A cart on the inside of a vertical loop</text><rect x="20" y="46" width="330" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">The loop</text><circle cx="185" cy="236" r="120" fill="none" stroke="#5A6268" stroke-width="8"/><circle cx="185" cy="236" r="4" fill="#1F2A28"/><text x="193" y="240" font-size="12" fill="#5A6268">center</text><rect x="163" y="122" width="44" height="20" rx="4" fill="#E6E0D2" stroke="#1F2A28" stroke-width="2"/><text x="185" y="160" font-size="12.5" fill="#1F2A28" text-anchor="middle" font-weight="bold">top</text><rect x="163" y="330" width="44" height="20" rx="4" fill="#E6E0D2" stroke="#1F2A28" stroke-width="2"/><text x="185" y="322" font-size="12.5" fill="#1F2A28" text-anchor="middle" font-weight="bold">bottom</text><polygon points="155,100.5 109,100.5 109,95 95,104 109,113 109,107.5 155,107.5" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="85" y="108" font-size="14" fill="#B07A00" text-anchor="end" font-weight="bold" font-style="italic">v</text><polygon points="215,371.5 261,371.5 261,377 275,368 261,359 261,364.5 215,364.5" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="283" y="373" font-size="14" fill="#B07A00" font-weight="bold" font-style="italic">v</text><rect x="366" y="46" width="374" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="380" y="70" font-size="15" fill="#734200" font-weight="bold">Free-body diagrams</text><text x="470" y="104" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">At the top</text><line x1="462" y1="150" x2="462" y2="214" stroke="#0072B2" stroke-width="3.2"/><polygon points="462,226 455.5,214 468.5,214" fill="#0072B2"/><text x="472" y="222" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth</tspan></text><line x1="450" y1="150" x2="450" y2="180" stroke="#009E73" stroke-width="3.2"/><polygon points="450,192 443.5,180 456.5,180" fill="#009E73"/><text x="442" y="190" font-size="12.5" fill="#1F2A28" text-anchor="end"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, track</tspan></text><circle cx="456" cy="150" r="7" fill="#1F2A28"/><text x="460" y="270" font-size="12.5" fill="#5A6268" text-anchor="middle">Both point down, toward</text><text x="460" y="286" font-size="12.5" fill="#5A6268" text-anchor="middle">the center: F<tspan baseline-shift="sub" font-size="9">g</tspan> + F<tspan baseline-shift="sub" font-size="9">N</tspan> = mv²/r</text><text x="650" y="104" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">At the bottom</text><line x1="650" y1="236" x2="650" y2="138" stroke="#009E73" stroke-width="3.2"/><polygon points="650,126 656.5,138 643.5,138" fill="#009E73"/><text x="658" y="142" font-size="12.5" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan><tspan fill="#1F2A28">, track</tspan></text><line x1="650" y1="236" x2="650" y2="284" stroke="#0072B2" stroke-width="3.2"/><polygon points="650,296 643.5,284 656.5,284" fill="#0072B2"/><text x="658" y="292" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan><tspan fill="#1F2A28">, Earth</tspan></text><circle cx="650" cy="236" r="5.5" fill="#1F2A28"/><text x="650" y="332" font-size="12.5" fill="#5A6268" text-anchor="middle">F<tspan baseline-shift="sub" font-size="9">N</tspan> longer than F<tspan baseline-shift="sub" font-size="9">g</tspan>:</text><text x="650" y="348" font-size="12.5" fill="#5A6268" text-anchor="middle">F<tspan baseline-shift="sub" font-size="9">N</tspan> − F<tspan baseline-shift="sub" font-size="9">g</tspan> = mv²/r, up</text><text x="553" y="380" font-size="12.5" fill="#1F2A28" text-anchor="middle" font-weight="bold">No "centripetal force" arrow: the net force is the sum of these.</text>
</svg>
