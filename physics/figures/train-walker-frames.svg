<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Velocities add between reference frames</title><desc id="d">A train moves to the right at +20.0 m/s relative to the ground. Inside, a passenger walks toward the front at +1.5 m/s relative to the train. An observer stands on the platform. The walker's velocity relative to the ground is 1.5 m/s + 20.0 m/s = +21.5 m/s; walking toward the back at 1.5 m/s would give +18.5 m/s.</desc><rect width="780" height="400" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">The same walker, seen from two frames</text><rect x="0" y="292" width="780" height="10" fill="#8A8F94"/><rect x="0" y="302" width="780" height="40" fill="#D8D2C4"/><rect x="120" y="120" width="520" height="160" rx="14" fill="#DDE8EE" stroke="#1F2A28" stroke-width="1.6"/><rect x="120" y="266" width="520" height="14" fill="#5E7A8A"/><rect x="140" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="210" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="280" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="350" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="420" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="490" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><rect x="560" y="132" width="44" height="26" rx="4" fill="#ffffff" stroke="#1F2A28" stroke-width="0.8" opacity="0.8"/><circle cx="160" cy="286" r="10" fill="#2B2F33"/><circle cx="160" cy="286" r="4" fill="#C9CDD1"/><circle cx="210" cy="286" r="10" fill="#2B2F33"/><circle cx="210" cy="286" r="4" fill="#C9CDD1"/><circle cx="550" cy="286" r="10" fill="#2B2F33"/><circle cx="550" cy="286" r="4" fill="#C9CDD1"/><circle cx="600" cy="286" r="10" fill="#2B2F33"/><circle cx="600" cy="286" r="4" fill="#C9CDD1"/><polyline points="360.0,224.6 380.2,245.8 374.7,266.0" fill="none" stroke="#3B4A6B" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="360.0,224.6 352.6,247.6 334.2,255.0" fill="none" stroke="#3B4A6B" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="362.8,197.0 374.7,209.0 382.1,197.9" fill="none" stroke="#3B4A6B" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="362.8,197.0 349.0,210.8 341.6,221.8" fill="none" stroke="#3B4A6B" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="360.0" y1="224.6" x2="362.8" y2="197.0" stroke="#3B4A6B" stroke-width="11.7" stroke-linecap="round"/><circle cx="364.6" cy="182.1" r="12.0" fill="#3B4A6B"/><rect x="392" y="178" width="200" height="44" rx="6" fill="#ffffff" stroke="#B07A00" opacity="0.95"/><line x1="402.0" y1="210.0" x2="439.0" y2="210.0" stroke="#B07A00" stroke-width="3"/><polygon points="450.0,210.0 439.0,204.5 439.0,215.5" fill="#B07A00"/><text x="400" y="196" fill="#B07A00" font-size="12" text-anchor="start" font-weight="bold">walker relative to the train</text><text x="458" y="214" fill="#B07A00" font-size="13" text-anchor="start" font-weight="bold">+1.5 m/s</text><line x1="470.0" y1="94.0" x2="599.0" y2="94.0" stroke="#734200" stroke-width="4"/><polygon points="610.0,94.0 599.0,88.5 599.0,99.5" fill="#734200"/><text x="470" y="84" fill="#734200" font-size="13" text-anchor="start" font-weight="bold">train relative to the ground: +20.0 m/s</text><polyline points="60.0,260.5 63.5,276.6 64.2,292.0" fill="none" stroke="#5A4632" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/><polyline points="60.0,260.5 56.5,276.6 55.8,292.0" fill="none" stroke="#5A4632" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/><polyline points="62.1,239.5 67.0,251.4 67.7,261.2" fill="none" stroke="#5A4632" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/><polyline points="62.1,239.5 53.0,251.4 52.3,261.2" fill="none" stroke="#5A4632" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="60.0" y1="260.5" x2="62.1" y2="239.5" stroke="#5A4632" stroke-width="8.9" stroke-linecap="round"/><circle cx="63.5" cy="228.1" r="9.1" fill="#5A4632"/><text x="20" y="324" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">observer on the platform</text><line x1="40.0" y1="370.0" x2="89.0" y2="370.0" stroke="#1F2A28" stroke-width="1.6"/><polygon points="100.0,370.0 89.0,364.5 89.0,375.5" fill="#1F2A28"/><text x="108" y="374" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">positive direction</text><rect x="300" y="350" width="460" height="42" rx="8" fill="#FBEED5" stroke="#734200"/><text x="530" y="368" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="bold">walker relative to the ground = 1.5 m/s + 20.0 m/s</text><text x="530" y="385" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">= +21.5 m/s (walking toward the back would give +18.5 m/s)</text></svg>