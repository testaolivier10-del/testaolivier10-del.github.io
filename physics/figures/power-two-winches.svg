<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">Power: the same work in less time</title><desc id="d">Two winches each lift an identical crate 3.0 m at constant speed. On each crate the upward tension from the cable equals the downward gravitational force from Earth, so the forces are drawn equal. Winch X lifts its crate at 0.5 m/s and takes 6.0 s; winch Y lifts at 0.25 m/s and takes 12 s. Both do the same work, but X does it in half the time, so its power is twice as large: P = W/Δt = F_T v.</desc><rect width="760" height="400" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Two winches lift identical crates 3.0 m at constant speed</text><line x1="20" y1="350" x2="740" y2="350" stroke="#1F2A28" stroke-width="2.5"/><line x1="26" y1="351" x2="17" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="40" y1="351" x2="31" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="54" y1="351" x2="45" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="68" y1="351" x2="59" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="82" y1="351" x2="73" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="96" y1="351" x2="87" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="110" y1="351" x2="101" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="124" y1="351" x2="115" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="138" y1="351" x2="129" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="152" y1="351" x2="143" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="166" y1="351" x2="157" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="180" y1="351" x2="171" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="194" y1="351" x2="185" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="208" y1="351" x2="199" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="222" y1="351" x2="213" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="236" y1="351" x2="227" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="250" y1="351" x2="241" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="264" y1="351" x2="255" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="278" y1="351" x2="269" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="292" y1="351" x2="283" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="306" y1="351" x2="297" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="320" y1="351" x2="311" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="334" y1="351" x2="325" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="348" y1="351" x2="339" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="362" y1="351" x2="353" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="376" y1="351" x2="367" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="390" y1="351" x2="381" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="404" y1="351" x2="395" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="418" y1="351" x2="409" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="432" y1="351" x2="423" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="446" y1="351" x2="437" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="460" y1="351" x2="451" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="474" y1="351" x2="465" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="488" y1="351" x2="479" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="502" y1="351" x2="493" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="516" y1="351" x2="507" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="530" y1="351" x2="521" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="544" y1="351" x2="535" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="558" y1="351" x2="549" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="572" y1="351" x2="563" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="586" y1="351" x2="577" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="600" y1="351" x2="591" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="614" y1="351" x2="605" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="628" y1="351" x2="619" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="642" y1="351" x2="633" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="656" y1="351" x2="647" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="670" y1="351" x2="661" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="684" y1="351" x2="675" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="698" y1="351" x2="689" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="712" y1="351" x2="703" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><line x1="726" y1="351" x2="717" y2="360" stroke="#8A8F8C" stroke-width="1.3"/><rect x="60" y="70" width="12" height="280" fill="#8A8F8C" stroke="#1F2A28" stroke-width="1.5"/><rect x="60" y="62" width="150" height="12" fill="#8A8F8C" stroke="#1F2A28" stroke-width="1.5"/><circle cx="190" cy="76" r="14" fill="#C9C3B6" stroke="#1F2A28" stroke-width="2"/><text x="100" y="56" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold">Winch X</text><rect x="58" y="310" width="40" height="40" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><text x="78" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">M</text><line x1="98" y1="320" x2="190" y2="90" stroke="#8B6B3E" stroke-width="2"/><line x1="204" y1="76" x2="204" y2="180" stroke="#8B6B3E" stroke-width="2.5"/><rect x="174" y="180" width="60" height="60" fill="#D9B27C" stroke="#1F2A28" stroke-width="2"/><rect x="179" y="185" width="50" height="50" fill="none" stroke="#9C7440" stroke-width="2"/><line x1="179" y1="185" x2="229" y2="235" stroke="#9C7440" stroke-width="2"/><line x1="229" y1="185" x2="179" y2="235" stroke="#9C7440" stroke-width="2"/><line x1="204" y1="210" x2="204.0" y2="159.0" stroke="#7A4F9E" stroke-width="3"/><polygon points="204.0,148.0 208.9,159.0 199.1,159.0" fill="#7A4F9E"/><text x="212.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A4F9E" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">T</tspan>, cable on crate</text><line x1="204" y1="210" x2="204.0" y2="261.0" stroke="#0072B2" stroke-width="3"/><polygon points="204.0,272.0 199.1,261.0 208.9,261.0" fill="#0072B2"/><text x="212.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on crate</text><circle cx="204" cy="210" r="4" fill="#1F2A28"/><line x1="270" y1="240" x2="270.0" y2="181.0" stroke="#B07A00" stroke-width="3"/><polygon points="270.0,170.0 274.9,181.0 265.1,181.0" fill="#B07A00"/><text x="274.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v = 0.5 m/s</text><text x="174" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">time to lift 3.0 m: 6.0 s</text><rect x="420" y="70" width="12" height="280" fill="#8A8F8C" stroke="#1F2A28" stroke-width="1.5"/><rect x="420" y="62" width="150" height="12" fill="#8A8F8C" stroke="#1F2A28" stroke-width="1.5"/><circle cx="550" cy="76" r="14" fill="#C9C3B6" stroke="#1F2A28" stroke-width="2"/><text x="460" y="56" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold">Winch Y</text><rect x="418" y="310" width="40" height="40" fill="#5A6268" stroke="#1F2A28" stroke-width="1.5"/><text x="438" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">M</text><line x1="458" y1="320" x2="550" y2="90" stroke="#8B6B3E" stroke-width="2"/><line x1="564" y1="76" x2="564" y2="180" stroke="#8B6B3E" stroke-width="2.5"/><rect x="534" y="180" width="60" height="60" fill="#D9B27C" stroke="#1F2A28" stroke-width="2"/><rect x="539" y="185" width="50" height="50" fill="none" stroke="#9C7440" stroke-width="2"/><line x1="539" y1="185" x2="589" y2="235" stroke="#9C7440" stroke-width="2"/><line x1="589" y1="185" x2="539" y2="235" stroke="#9C7440" stroke-width="2"/><line x1="564" y1="210" x2="564.0" y2="159.0" stroke="#7A4F9E" stroke-width="3"/><polygon points="564.0,148.0 569.0,159.0 559.0,159.0" fill="#7A4F9E"/><text x="572.0" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7A4F9E" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">T</tspan>, cable on crate</text><line x1="564" y1="210" x2="564.0" y2="261.0" stroke="#0072B2" stroke-width="3"/><polygon points="564.0,272.0 559.0,261.0 569.0,261.0" fill="#0072B2"/><text x="572.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" text-anchor="start" font-weight="bold">F<tspan baseline-shift="sub" font-size="75%">g</tspan>, Earth on crate</text><circle cx="564" cy="210" r="4" fill="#1F2A28"/><line x1="630" y1="240" x2="630.0" y2="216.0" stroke="#B07A00" stroke-width="3"/><polygon points="630.0,205.0 635.0,216.0 625.0,216.0" fill="#B07A00"/><text x="634.0" y="207.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v = 0.25 m/s</text><text x="534" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="start" font-weight="bold">time to lift 3.0 m: 12 s</text><text x="24" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#734200" text-anchor="start" font-weight="bold">Equal forces, equal work (F<tspan baseline-shift="sub" font-size="75%">T</tspan> = F<tspan baseline-shift="sub" font-size="75%">g</tspan>). X does it in half the time, so X delivers twice the power: P = W/Δt = F<tspan baseline-shift="sub" font-size="75%">T</tspan> v.</text></svg>
