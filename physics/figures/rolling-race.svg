<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A solid sphere, a solid disk and a hoop race down a ramp</title>
<desc id="d">A ramp of height h with a solid sphere, a solid disk and a hoop at the top, released from rest to roll without slipping. A table gives each shape’s rotational inertia (sphere two fifths MR², disk ½MR², hoop MR²), its finishing place (sphere first, disk second, hoop third) and a bar showing how its kinetic energy at the bottom splits between moving along (translation) and spinning (rotation): sphere 71% and 29%, disk 67% and 33%, hoop 50% and 50%. Energy conservation Mgh = ½Mv² + ½Iω² with v = Rω gives v = √(2gh/(1 + I/MR²)); mass and radius cancel, so only the shape decides the order.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">The rolling race: less rotational inertia, faster at the bottom</text><polygon points="40,120 40,360 330,360" fill="#EEF1EF" stroke="#1F2A28" stroke-width="2.5"/><rect x="20" y="360" width="340" height="10" fill="#EEF1EF"/><line x1="20" y1="360" x2="360" y2="360" stroke="#1F2A28" stroke-width="2.5"/><line x1="24" y1="360" x2="16" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="36" y1="360" x2="28" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="48" y1="360" x2="40" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="60" y1="360" x2="52" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="72" y1="360" x2="64" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="84" y1="360" x2="76" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="96" y1="360" x2="88" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="108" y1="360" x2="100" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="120" y1="360" x2="112" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="132" y1="360" x2="124" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="144" y1="360" x2="136" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="156" y1="360" x2="148" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="168" y1="360" x2="160" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="180" y1="360" x2="172" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="192" y1="360" x2="184" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="204" y1="360" x2="196" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="216" y1="360" x2="208" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="228" y1="360" x2="220" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="240" y1="360" x2="232" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="252" y1="360" x2="244" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="264" y1="360" x2="256" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="276" y1="360" x2="268" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="288" y1="360" x2="280" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="300" y1="360" x2="292" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="312" y1="360" x2="304" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="324" y1="360" x2="316" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="336" y1="360" x2="328" y2="369" stroke="#5A6268" stroke-width="1"/><line x1="348" y1="360" x2="340" y2="369" stroke="#5A6268" stroke-width="1"/><circle cx="75.9" cy="123.7" r="20" fill="#C0D6E4" stroke="#1F2A28" stroke-width="2"/><ellipse cx="69.9" cy="117.7" rx="6" ry="4" fill="#FFFFFF" opacity="0.7"/><circle cx="115.9" cy="156.9" r="20" fill="#E9D8B8" stroke="#1F2A28" stroke-width="2"/><circle cx="115.9" cy="156.9" r="3" fill="#1F2A28"/><circle cx="156" cy="190" r="20" fill="none" stroke="#1F2A28" stroke-width="5"/><line x1="30" y1="240" x2="30" y2="128" stroke="#5A6268" stroke-width="1.4"/><polygon points="30,120 34,128 26,128" fill="#5A6268"/><line x1="30" y1="240" x2="30" y2="352" stroke="#5A6268" stroke-width="1.4"/><polygon points="30,360 26,352 34,352" fill="#5A6268"/><text x="50" y="270" font-size="15" fill="#1F2A28" font-style="italic">h</text><text x="170" y="108" font-size="13" fill="#1F2A28">Released from rest;</text><text x="170" y="125" font-size="13" fill="#1F2A28">roll without slipping</text><rect x="380" y="70" width="360" height="330" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="394" y="96" font-size="13" fill="#1F2A28" font-weight="bold">Shape</text><text x="490" y="96" font-size="13" fill="#1F2A28" font-weight="bold">I (given)</text><text x="570" y="96" font-size="13" fill="#1F2A28" font-weight="bold">Split of K at the bottom</text><text x="394" y="136" font-size="13" fill="#1F2A28" font-weight="bold">solid sphere</text><text x="394" y="154" font-size="12" fill="#734200" font-weight="bold">finishes 1st</text><text x="490" y="136" font-size="14" fill="#1F2A28">⅖MR²</text><rect x="570" y="122" width="107.1" height="22" fill="#B07A00"/><rect x="677.1" y="122" width="42.9" height="22" fill="#FBEED5" stroke="#734200" stroke-width="1"/><text x="570" y="160" font-size="11.5" fill="#1F2A28">71% moving</text><text x="720" y="160" font-size="11.5" fill="#1F2A28" text-anchor="end">29% spinning</text><text x="394" y="210" font-size="13" fill="#1F2A28" font-weight="bold">solid disk</text><text x="394" y="228" font-size="12" fill="#734200" font-weight="bold">finishes 2nd</text><text x="490" y="210" font-size="14" fill="#1F2A28">½MR²</text><rect x="570" y="196" width="100" height="22" fill="#B07A00"/><rect x="670" y="196" width="50" height="22" fill="#FBEED5" stroke="#734200" stroke-width="1"/><text x="570" y="234" font-size="11.5" fill="#1F2A28">67% moving</text><text x="720" y="234" font-size="11.5" fill="#1F2A28" text-anchor="end">33% spinning</text><text x="394" y="284" font-size="13" fill="#1F2A28" font-weight="bold">hoop</text><text x="394" y="302" font-size="12" fill="#734200" font-weight="bold">finishes 3rd</text><text x="490" y="284" font-size="14" fill="#1F2A28">MR²</text><rect x="570" y="270" width="75" height="22" fill="#B07A00"/><rect x="645" y="270" width="75" height="22" fill="#FBEED5" stroke="#734200" stroke-width="1"/><text x="570" y="308" font-size="11.5" fill="#1F2A28">50% moving</text><text x="720" y="308" font-size="11.5" fill="#1F2A28" text-anchor="end">50% spinning</text><text x="394" y="348" font-size="13" fill="#1F2A28">Mgh = ½Mv² + ½Iω², with v = Rω:</text><text x="394" y="374" font-size="15" fill="#734200" font-weight="bold">v = √(2gh / (1 + I/MR²))</text><text x="394" y="394" font-size="12" fill="#1F2A28">Mass and radius cancel; only the shape counts.</text>
</svg>
