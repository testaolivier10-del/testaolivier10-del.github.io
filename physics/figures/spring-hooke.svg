1="284" y1="99" x2="292" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="296" y1="99" x2="304" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="308" y1="99" x2="316" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="320" y1="99" x2="328" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="332" y1="99" x2="340" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="344" y1="99" x2="352" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="356" y1="99" x2="364" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="368" y1="99" x2="376" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="380" y1="99" x2="388" y2="90" stroke="#5A6268" stroke-width="1"/><line x1="392" y1="99" x2="400" y2="90" stroke="#5A6268" stroke-width="1"/><rect x="372" y="100" width="26" height="260" rx="2" fill="#FFF8E6" stroke="#9C7A44" stroke-width="1.4"/><line x1="372" y1="100" x2="386" y2="100" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="120" x2="380" y2="120" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="140" x2="380" y2="140" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="160" x2="380" y2="160" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="180" x2="380" y2="180" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="200" x2="386" y2="200" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="220" x2="380" y2="220" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="240" x2="380" y2="240" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="260" x2="380" y2="260" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="280" x2="380" y2="280" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="300" x2="386" y2="300" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="320" x2="380" y2="320" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="340" x2="380" y2="340" stroke="#9C7A44" stroke-width="1.2"/><line x1="372" y1="360" x2="380" y2="360" stroke="#9C7A44" stroke-width="1.2"/><polyline points="90,100 90,107.6 80,109.5 100,113.3 80,117.1 100,120.9 80,124.7 100,128.5 80,132.3 100,136.1 80,139.9 100,143.7 80,147.5 100,151.3 80,155.1 100,158.9 80,162.7 100,166.5 90,168.4 90,176" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-linejoin="round"/><line x1="82" y1="176" x2="98" y2="176" stroke="#1F2A28" stroke-width="2"/><polyline points="210,100 210,110 200,113.2 220,119.6 200,125.9 220,132.3 200,138.7 220,145.1 200,151.4 220,157.8 200,164.2 220,170.6 200,176.9 220,183.3 200,189.7 220,196.1 200,202.4 220,208.8 210,212 210,222" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-linejoin="round"/><line x1="210" y1="222" x2="210" y2="232" stroke="#1F2A28" stroke-width="2"/><rect x="189" y="232" width="42" height="34" rx="4" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><line x1="189" y1="243.3" x2="231" y2="243.3" stroke="#5A6268" stroke-width="1"/><line x1="189" y1="254.7" x2="231" y2="254.7" stroke="#5A6268" stroke-width="1"/><text x="210" y="254" font-size="12" fill="#1F2A28" text-anchor="middle" font-weight="bold">m</text><polyline points="330,100 330,110 320,114.6 340,123.9 320,133.1 340,142.4 320,151.6 340,160.9 320,170.1 340,179.4 320,188.6 340,197.9 320,207.1 340,216.4 320,225.6 340,234.9 320,244.1 340,253.4 330,258 330,268" fill="none" stroke="#1F2A28" stroke-width="2.2" stroke-linejoin="round"/><line x1="330" y1="268" x2="330" y2="278" stroke="#1F2A28" stroke-width="2"/><rect x="309" y="278" width="42" height="40" rx="4" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><line x1="309" y1="291.3" x2="351" y2="291.3" stroke="#5A6268" stroke-width="1"/><line x1="309" y1="304.7" x2="351" y2="304.7" stroke="#5A6268" stroke-width="1"/><text x="330" y="303" font-size="12" fill="#1F2A28" text-anchor="middle" font-weight="bold">2m</text><line x1="108" y1="176" x2="366" y2="176" stroke="#5A6268" stroke-width="1" stroke-dasharray="4 4"/><text x="46" y="198" font-size="11.5" fill="#5A6268">relaxed</text><line x1="238" y1="176" x2="238" y2="222" stroke="#734200" stroke-width="2"/><line x1="233" y1="176" x2="243" y2="176" stroke="#734200" stroke-width="2"/><line x1="233" y1="222" x2="243" y2="222" stroke="#734200" stroke-width="2"/><text x="246" y="204" font-size="13" fill="#734200" font-weight="bold">Δx</text><line x1="354" y1="176" x2="354" y2="268" stroke="#734200" stroke-width="2"/><line x1="349" y1="176" x2="359" y2="176" stroke="#734200" stroke-width="2"/><line x1="349" y1="268" x2="359" y2="268" stroke="#734200" stroke-width="2"/><text x="362" y="227" font-size="13" fill="#734200" font-weight="bold">2Δx</text><text x="220" y="384" font-size="12.5" fill="#5A6268" text-anchor="middle">Double the hanging weight, double the stretch.</text><rect x="436" y="46" width="304" height="354" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="450" y="70" font-size="15" fill="#734200" font-weight="bold">Force against stretch</text><line x1="492" y1="330" x2="713" y2="330" stroke="#1F2A28" stroke-width="1.6"/><polygon points="722,330 713,334.5 713,325.5" fill="#1F2A28"/><line x1="492" y1="330" x2="492" y2="109" stroke="#1F2A28" stroke-width="1.6"/><polygon points="492,100 496.5,109 487.5,109" fill="#1F2A28"/><text x="602" y="364" font-size="13" fill="#1F2A28" text-anchor="middle">stretch |Δx| (m)</text><text transform="translate(462 220) rotate(-90)" font-size="13" text-anchor="middle" fill="#1F2A28">force on spring (N)</text><line x1="492" y1="330" x2="702" y2="130" stroke="#CC79A7" stroke-width="3.2"/><circle cx="544.5" cy="280" r="5" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.8"/><circle cx="597" cy="230" r="5" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.8"/><circle cx="649.5" cy="180" r="5" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.8"/><line x1="597" y1="230" x2="649.5" y2="230" stroke="#5A6268" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="649.5" y1="230" x2="649.5" y2="180" stroke="#5A6268" stroke-width="1.2" stroke-dasharray="4 3"/><text x="660" y="218" font-size="15" fill="#734200" font-weight="bold">slope = k</text><text x="496" y="116" font-size="15" fill="#CC79A7" font-weight="bold">|F<tspan baseline-shift="sub" font-size="10">s</tspan>| = k|Δx|</text>
</svg>
