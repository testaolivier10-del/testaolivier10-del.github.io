<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A spring stretched by hanging blocks, and its force-stretch graph</title>
<desc id="d">Left: the same vertical spring hanging from a ceiling three times beside a ruler: relaxed with nothing on it; with one block of mass m, stretched by Δx; and with a block of mass 2m, stretched by 2Δx. Right: a graph of the force on the spring against its stretch is a straight line through the origin; its slope is the spring constant k, and |F_s| = k|Δx|.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
