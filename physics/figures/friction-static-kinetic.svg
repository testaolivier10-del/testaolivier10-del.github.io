<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Static and kinetic friction on a pushed crate</title>
<desc id="d">Left: a crate on a floor pushed to the right by a hand, with its free-body diagram: F_A, hand, to the right, F_f, floor, to the left and equal while the crate stays put, and F_N up and F_g down equal. Right: a graph of the friction force against the applied force. From 0 to 120 N the friction force equals the push (static friction, no sliding). At 120 N, the maximum static friction μs F_N, the crate starts to slide, and the friction force drops to a constant 80 N, the kinetic friction μk F_N, however hard the push.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">Push harder and harder on a resting crate</text><rect x="20" y="46" width="290" height="334" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">The crate</text><rect x="40" y="210" width="250" height="10" fill="#EEF1EF"/><line x1="40" y1="210" x2="290" y2="210" stroke="#1F2A28" stroke-width="2.5"/><line x1="46" y1="211" x2="38" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="58" y1="211" x2="50" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="70" y1="211" x2="62" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="82" y1="211" x2="74" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="94" y1="211" x2="86" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="106" y1="211" x2="98" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="118" y1="211" x2="110" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="130" y1="211" x2="122" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="142" y1="211" x2="134" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="154" y1="211" x2="146" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="166" y1="211" x2="158" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="178" y1="211" x2="170" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="190" y1="211" x2="182" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="202" y1="211" x2="194" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="214" y1="211" x2="206" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="226" y1="211" x2="218" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="238" y1="211" x2="230" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="250" y1="211" x2="242" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="262" y1="211" x2="254" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="274" y1="211" x2="266" y2="220" stroke="#5A6268" stroke-width="1"/><line x1="286" y1="211" x2="278" y2="220" stroke="#5A6268" stroke-width="1"/><rect x="110" y="130" width="90" height="80" rx="2" fill="#E3C99A" stroke="#9C7A44" stroke-width="2.5"/><rect x="115" y="135" width="80" height="70" rx="1" fill="none" stroke="#9C7A44" stroke-width="1.4"/><line x1="116" y1="204" x2="194" y2="136" stroke="#9C7A44" stroke-width="1.4"/><line x1="66" y1="170" x2="98" y2="170" stroke="#5A6268" stroke-width="3.2"/><polygon points="110,170 98,176.5 98,163.5" fill="#5A6268"/><text x="44" y="160" font-size="14" fill="#1F2A28"><tspan fill="#5A6268" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">A</tspan></tspan></text><line x1="165" y1="318" x2="193" y2="318" stroke="#5A6268" stroke-width="3.2"/><polygon points="205,318 193,324.5 193,311.5" fill="#5A6268"/><text x="195" y="308" font-size="12.5" fill="#1F2A28"><tspan fill="#5A6268" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">A</tspan></tspan><tspan fill="#1F2A28">, hand</tspan></text><line x1="165" y1="318" x2="137" y2="318" stroke="#D55E00" stroke-width="3.2"/><polygon points="125,318 137,311.5 137,324.5" fill="#D55E00"/><text x="65" y="308" font-size="12.5" fill="#1F2A28" text-anchor="start"><tspan fill="#D55E00" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">f</tspan></tspan><tspan fill="#1F2A28">, floor</tspan></text><line x1="165" y1="318" x2="165" y2="280" stroke="#009E73" stroke-width="3.2"/><polygon points="165,268 171.5,280 158.5,280" fill="#009E73"/><text x="171" y="280" font-size="12.5" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">N</tspan></tspan></text><line x1="165" y1="318" x2="165" y2="356" stroke="#0072B2" stroke-width="3.2"/><polygon points="165,368 158.5,356 171.5,356" fill="#0072B2"/><text x="171" y="366" font-size="12.5" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="9">g</tspan></tspan></text><circle cx="165" cy="318" r="5.5" fill="#1F2A28"/><text x="165" y="252" font-size="12.5" fill="#5A6268" text-anchor="middle">Before it slips, friction matches the push.</text><rect x="326" y="46" width="414" height="334" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="340" y="70" font-size="15" fill="#734200" font-weight="bold">Friction force against the push</text><line x1="390" y1="320" x2="713" y2="320" stroke="#1F2A28" stroke-width="1.6"/><polygon points="722,320 713,324.5 713,315.5" fill="#1F2A28"/><line x1="390" y1="320" x2="390" y2="97" stroke="#1F2A28" stroke-width="1.6"/><polygon points="390,88 394.5,97 385.5,97" fill="#1F2A28"/><text x="550" y="356" font-size="13" fill="#1F2A28" text-anchor="middle">applied force (N)</text><text transform="translate(350 210) rotate(-90)" font-size="13" text-anchor="middle" fill="#1F2A28">friction force (N)</text><line x1="390" y1="320" x2="390" y2="325" stroke="#1F2A28" stroke-width="1.2"/><text x="390" y="338" font-size="11.5" fill="#5A6268" text-anchor="middle">0</text><line x1="470" y1="320" x2="470" y2="325" stroke="#1F2A28" stroke-width="1.2"/><text x="470" y="338" font-size="11.5" fill="#5A6268" text-anchor="middle">50</text><line x1="550" y1="320" x2="550" y2="325" stroke="#1F2A28" stroke-width="1.2"/><text x="550" y="338" font-size="11.5" fill="#5A6268" text-anchor="middle">100</text><line x1="630" y1="320" x2="630" y2="325" stroke="#1F2A28" stroke-width="1.2"/><text x="630" y="338" font-size="11.5" fill="#5A6268" text-anchor="middle">150</text><line x1="710" y1="320" x2="710" y2="325" stroke="#1F2A28" stroke-width="1.2"/><text x="710" y="338" font-size="11.5" fill="#5A6268" text-anchor="middle">200</text><line x1="385" y1="320" x2="390" y2="320" stroke="#1F2A28" stroke-width="1.2"/><text x="381" y="324" font-size="11.5" fill="#5A6268" text-anchor="end">0</text><line x1="385" y1="265" x2="390" y2="265" stroke="#1F2A28" stroke-width="1.2"/><text x="381" y="269" font-size="11.5" fill="#5A6268" text-anchor="end">40</text><line x1="385" y1="210" x2="390" y2="210" stroke="#1F2A28" stroke-width="1.2"/><text x="381" y="214" font-size="11.5" fill="#5A6268" text-anchor="end">80</text><line x1="385" y1="155" x2="390" y2="155" stroke="#1F2A28" stroke-width="1.2"/><text x="381" y="159" font-size="11.5" fill="#5A6268" text-anchor="end">120</text><line x1="385" y1="100" x2="390" y2="100" stroke="#1F2A28" stroke-width="1.2"/><text x="381" y="104" font-size="11.5" fill="#5A6268" text-anchor="end">160</text><line x1="390" y1="320" x2="582" y2="155" stroke="#D55E00" stroke-width="3.2"/><line x1="582" y1="155" x2="582" y2="210" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="582" y1="210" x2="710" y2="210" stroke="#D55E00" stroke-width="3.2"/><line x1="390" y1="155" x2="582" y2="155" stroke="#5A6268" stroke-width="1" stroke-dasharray="4 4"/><line x1="390" y1="210" x2="582" y2="210" stroke="#5A6268" stroke-width="1" stroke-dasharray="4 4"/><text x="473.2" y="168.8" font-size="13" fill="#D55E00" text-anchor="middle" font-weight="bold">static: f = push</text><text x="473.2" y="186.6" font-size="12" fill="#5A6268" text-anchor="middle">no sliding</text><text x="585.2" y="138.5" font-size="13" fill="#1F2A28">maximum: μ<tspan baseline-shift="sub" font-size="9">s</tspan>F<tspan baseline-shift="sub" font-size="9">N</tspan> = 120 N</text><text x="646" y="229.3" font-size="13" fill="#D55E00" text-anchor="middle" font-weight="bold">kinetic: μ<tspan baseline-shift="sub" font-size="9">k</tspan>F<tspan baseline-shift="sub" font-size="9">N</tspan> = 80 N</text><text x="646" y="248.5" font-size="12" fill="#5A6268" text-anchor="middle">sliding</text>
</svg>
