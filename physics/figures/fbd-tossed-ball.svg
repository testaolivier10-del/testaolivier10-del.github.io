<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Free-body diagram of a ball tossed upward</title>
<desc id="d">Left: a ball moving straight up after leaving a hand, with an outlined velocity arrow pointing up. Middle, marked right: its free-body diagram is a dot with one arrow down, F_g, Earth on ball, because air resistance is negligible. Right, marked wrong: a diagram that adds dashed arrows labelled force of the throw, v and F_net. None of these is a force exerted on the ball by another object, so none belongs on a free-body diagram.</desc>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">A ball tossed straight up, on its way up</text><rect x="20" y="46" width="220" height="294" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">The scene</text><line x1="130" y1="270" x2="130" y2="130" stroke="#C9CFCC" stroke-width="2" stroke-dasharray="5 5"/><circle cx="130" cy="110" r="16" fill="#E9A23B" stroke="#1F2A28" stroke-width="2"/><polygon points="163.5,140 163.5,94 169,94 160,80 151,94 156.5,94 156.5,140" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="172" y="114" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><text x="130" y="290" font-size="12.5" fill="#5A6268" text-anchor="middle">The hand let go</text><text x="130" y="308" font-size="12.5" fill="#5A6268" text-anchor="middle">before this moment.</text><rect x="260" y="46" width="220" height="294" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="274" y="70" font-size="15" fill="#734200" font-weight="bold">Right</text><path d="M441,70 L448,78 L461,61" fill="none" stroke="#009E73" stroke-width="3.5"/><line x1="370" y1="160" x2="370" y2="238" stroke="#0072B2" stroke-width="3.2"/><polygon points="370,250 363.5,238 376.5,238" fill="#0072B2"/><text x="380" y="240" font-size="14" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">g</tspan></tspan><tspan fill="#1F2A28">, Earth on ball</tspan></text><circle cx="370" cy="160" r="5.5" fill="#1F2A28"/><text x="370" y="300" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">One force: gravity.</text><text x="370" y="318" font-size="12.5" fill="#5A6268" text-anchor="middle">Air resistance is negligible.</text><rect x="500" y="46" width="240" height="294" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="514" y="70" font-size="15" fill="#734200" font-weight="bold">Wrong</text><line x1="700" y1="58" x2="724" y2="82" stroke="#B3261E" stroke-width="3"/><line x1="700" y1="82" x2="724" y2="58" stroke="#B3261E" stroke-width="3"/><line x1="610" y1="170" x2="610" y2="102" stroke="#5A6268" stroke-width="3.2" stroke-dasharray="7 5"/><polygon points="610,90 616.5,102 603.5,102" fill="#5A6268"/><text x="618" y="100" font-size="12.5" fill="#B3261E">"force of the throw"</text><line x1="610" y1="170" x2="567.7" y2="119.2" stroke="#5A6268" stroke-width="3.2" stroke-dasharray="7 5"/><polygon points="560,110 572.7,115.1 562.7,123.4" fill="#5A6268"/><text x="534" y="104" font-size="12.5" fill="#B3261E">"v"</text><line x1="610" y1="170" x2="660" y2="203.3" stroke="#5A6268" stroke-width="3.2" stroke-dasharray="7 5"/><polygon points="670,210 656.4,208.8 663.6,197.9" fill="#5A6268"/><text x="636" y="234" font-size="12.5" fill="#B3261E">"F<tspan baseline-shift="sub" font-size="9">net</tspan>"</text><line x1="610" y1="170" x2="610" y2="238" stroke="#0072B2" stroke-width="3.2"/><polygon points="610,250 603.5,238 616.5,238" fill="#0072B2"/><circle cx="610" cy="170" r="5.5" fill="#1F2A28"/><text x="620" y="292" font-size="12.5" fill="#5A6268" text-anchor="middle">No agent pushes up once the ball</text><text x="620" y="308" font-size="12.5" fill="#5A6268" text-anchor="middle">leaves the hand. Velocity and net</text><text x="620" y="324" font-size="12.5" fill="#5A6268" text-anchor="middle">force are not forces on the object.</text>
</svg>
