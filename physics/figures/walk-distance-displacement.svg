<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Distance and displacement on a number line</title><desc id="d">A person starts at x = −1 m on a number line marked from −2 m to +6 m, walks 5 m in the positive direction to x = +4 m, turns around and walks 2 m back to end at x = +2 m. Dashed curved arrows show the two legs of the walk. A solid arrow from −1 m to +2 m is the displacement, +3 m. The distance traveled is 5 m + 2 m = 7 m, a scalar; the displacement is +3 m, a vector pointing in the positive direction.</desc><rect width="760" height="370" fill="#ffffff"/><text x="24" y="32" fill="#1F2A28" font-size="16" text-anchor="start" font-weight="bold">Distance counts every step; displacement only compares start and end</text><rect x="20" y="240" width="720" height="10" fill="#D8D2C4"/><line x1="60" y1="280" x2="684" y2="280" stroke="#1F2A28" stroke-width="1.5"/><polygon points="692,280 682,275 682,285" fill="#1F2A28"/><text x="696" y="284" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal"><tspan font-style="italic">x</tspan> (m)</text><line x1="70.0" y1="274" x2="70.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="70.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">−2</text><line x1="145.0" y1="274" x2="145.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="145.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">−1</text><line x1="220.0" y1="274" x2="220.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="220.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">0</text><line x1="295.0" y1="274" x2="295.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="295.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">1</text><line x1="370.0" y1="274" x2="370.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="370.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">2</text><line x1="445.0" y1="274" x2="445.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="445.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">3</text><line x1="520.0" y1="274" x2="520.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="520.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">4</text><line x1="595.0" y1="274" x2="595.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="595.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">5</text><line x1="670.0" y1="274" x2="670.0" y2="286" stroke="#1F2A28" stroke-width="1.3"/><text x="670.0" y="301" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">6</text><text x="220.0" y="318" fill="#5A6268" font-size="11" text-anchor="middle" font-weight="normal">(origin)</text><text x="690.0" y="318" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">positive direction →</text><g opacity="0.35"><polyline points="145.0,211.2 148.2,225.9 148.8,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="145.0,211.2 141.8,225.9 141.2,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="146.9,192.0 151.4,202.9 152.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="146.9,192.0 138.6,202.9 138.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="145.0" y1="211.2" x2="146.9" y2="192.0" stroke="#3B4A6B" stroke-width="8.2" stroke-linecap="round"/><circle cx="148.2" cy="181.6" r="8.3" fill="#3B4A6B"/></g><text x="145.0" y="142" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">start</text><text x="145.0" y="156" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">x = −1 m</text><g opacity="0.35"><polyline points="520.0,211.2 523.2,225.9 523.8,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="520.0,211.2 516.8,225.9 516.2,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="521.9,192.0 526.4,202.9 527.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="521.9,192.0 513.6,202.9 513.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="520.0" y1="211.2" x2="521.9" y2="192.0" stroke="#3B4A6B" stroke-width="8.2" stroke-linecap="round"/><circle cx="523.2" cy="181.6" r="8.3" fill="#3B4A6B"/></g><text x="520.0" y="142" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">turns around</text><text x="520.0" y="156" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">x = +4 m</text><polyline points="370.0,211.2 373.2,225.9 373.8,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370.0,211.2 366.8,225.9 366.2,240.0" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="368.1,192.0 376.4,202.9 377.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="368.1,192.0 363.6,202.9 363.0,211.8" fill="none" stroke="#3B4A6B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="370.0" y1="211.2" x2="368.1" y2="192.0" stroke="#3B4A6B" stroke-width="8.2" stroke-linecap="round"/><circle cx="366.8" cy="181.6" r="8.3" fill="#3B4A6B"/><text x="370.0" y="142" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="bold">end</text><text x="370.0" y="156" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">x = +2 m</text><line x1="145.0" y1="82.0" x2="509.0" y2="82.0" stroke="#734200" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="520.0,82.0 509.0,76.5 509.0,87.5" fill="#734200"/><text x="137.0" y="87" fill="#734200" font-size="13" text-anchor="end" font-weight="bold">leg 1: walks 5 m</text><line x1="520.0" y1="112.0" x2="381.0" y2="112.0" stroke="#734200" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="370.0,112.0 381.0,117.5 381.0,106.5" fill="#734200"/><text x="528.0" y="117" fill="#734200" font-size="13" text-anchor="start" font-weight="bold">leg 2: walks 2 m back</text><line x1="145.0" y1="262.0" x2="359.0" y2="262.0" stroke="#A33B26" stroke-width="3.5"/><polygon points="370.0,262.0 359.0,256.5 359.0,267.5" fill="#A33B26"/><text x="257.5" y="254" fill="#A33B26" font-size="13" text-anchor="middle" font-weight="bold">displacement +3 m</text><text x="24" y="362" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">Distance (a scalar): 5 m + 2 m = 7 m.      Displacement (a vector): +2 m − (−1 m) = +3 m, pointing in the + direction.</text></svg>