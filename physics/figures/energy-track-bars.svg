<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d"><title id="t">Energy bar charts for a cart on a curved track</title><desc id="d">A small block is released from rest at point A, 6.0 m above the lowest point B, on a frictionless curved track, then rises to point C, 2.0 m above B. The zero of gravitational potential energy is at B. Bar charts under each point show kinetic energy, gravitational potential energy and their total for the block, track and Earth system: at A, 6 units of U_g and no K; at B, 6 units of K and no U_g; at C, 4 units of K and 2 of U_g. The total is 6 units at every point.</desc><rect width="760" height="440" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="start" font-weight="bold">Block + track + Earth system, no friction: K + U<tspan baseline-shift="sub" font-size="75%">g</tspan> stays the same</text><path d="M30,100 L80,100 C170,100 210,250 330,250 C450,250 520,185 600,200 L730,200 L730,270 L30,270 Z" fill="#EFEADF" stroke="none"/><path d="M30,100 L80,100 C170,100 210,250 330,250 C450,250 520,185 600,200 L730,200" fill="none" stroke="#1F2A28" stroke-width="3"/><line x1="20" y1="250" x2="740" y2="250" stroke="#734200" stroke-width="1.4" stroke-dasharray="7 5"/><text x="60" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#734200" text-anchor="start">U<tspan baseline-shift="sub" font-size="75%">g</tspan> = 0 at B</text><rect x="47" y="80" width="26" height="20" fill="#9CC3E0" stroke="#1F2A28" stroke-width="2"/><text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="317" y="230" width="26" height="20" fill="#9CC3E0" stroke="#1F2A28" stroke-width="2"/><text x="330" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><rect x="637" y="180" width="26" height="20" fill="#9CC3E0" stroke="#1F2A28" stroke-width="2"/><text x="650" y="170" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">C</text><line x1="700" y1="200" x2="700" y2="250" stroke="#1F2A28" stroke-width="1.3"/><text x="706" y="229" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="start">2.0 m</text><line x1="18" y1="100" x2="18" y2="250" stroke="#1F2A28" stroke-width="1.3"/><text x="24" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="start">6.0 m</text><line x1="360" y1="228" x2="409.0" y2="228.0" stroke="#B07A00" stroke-width="3"/><polygon points="420.0,228.0 409.0,232.9 409.0,223.1" fill="#B07A00"/><text x="428.0" y="233.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">v</text><line x1="64" y1="405" x2="194" y2="405" stroke="#1F2A28" stroke-width="1.8"/><text x="85" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">K</text><rect x="114" y="327" width="30" height="78" fill="#0072B2" stroke="#1F2A28" stroke-width="1"/><text x="129" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">U<tspan baseline-shift="sub" font-size="75%">g</tspan></text><rect x="158" y="327" width="30" height="78" fill="#5A6268" stroke="#1F2A28" stroke-width="1"/><text x="173" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">Total</text><text x="129" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">At A</text><line x1="314" y1="405" x2="444" y2="405" stroke="#1F2A28" stroke-width="1.8"/><rect x="320" y="327" width="30" height="78" fill="#B07A00" stroke="#1F2A28" stroke-width="1"/><text x="335" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">K</text><text x="379" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">U<tspan baseline-shift="sub" font-size="75%">g</tspan></text><rect x="408" y="327" width="30" height="78" fill="#5A6268" stroke="#1F2A28" stroke-width="1"/><text x="423" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">Total</text><text x="379" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">At B</text><line x1="554" y1="405" x2="684" y2="405" stroke="#1F2A28" stroke-width="1.8"/><rect x="560" y="353" width="30" height="52" fill="#B07A00" stroke="#1F2A28" stroke-width="1"/><text x="575" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">K</text><rect x="604" y="379" width="30" height="26" fill="#0072B2" stroke="#1F2A28" stroke-width="1"/><text x="619" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">U<tspan baseline-shift="sub" font-size="75%">g</tspan></text><rect x="648" y="327" width="30" height="78" fill="#5A6268" stroke="#1F2A28" stroke-width="1"/><text x="663" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">Total</text><text x="619" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">At C</text></svg>
