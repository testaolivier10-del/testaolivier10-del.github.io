<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d"><title id="t">Elastic, inelastic and perfectly inelastic collisions</title><desc id="d">Three outcomes of the same collision: cart A, 1.0 kg at 4.0 m/s, hits cart B, 3.0 kg at rest; before, the total momentum is 4.0 kg·m/s and the kinetic energy 8.0 J. Elastic: A bounces back at 2.0 m/s and B moves off at 2.0 m/s; kinetic energy stays 8.0 J. Inelastic: A moves on at 0.25 m/s and B at 1.25 m/s; kinetic energy falls to about 2.4 J. Perfectly inelastic: the carts stick and move together at 1.0 m/s; kinetic energy falls to 2.0 J. The total momentum is 4.0 kg·m/s after every outcome.</desc><rect width="760" height="520" fill="#FFFFFF"/><text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold">Cart A (1.0 kg) at 4.0 m/s hits cart B (3.0 kg) at rest: three possible outcomes</text><text x="24" y="62" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold">Before</text><rect x="24" y="120" width="446" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="34" y="127" width="8" height="14" fill="#8A8F8C"/><rect x="452" y="127" width="8" height="14" fill="#8A8F8C"/><rect x="110" y="64" width="80" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="130" cy="111" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="170" cy="111" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="130" cy="111" r="3" fill="#D7D2C8"/><circle cx="170" cy="111" r="3" fill="#D7D2C8"/><text x="150" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="300" y="64" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="320" cy="111" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="390" cy="111" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="320" cy="111" r="3" fill="#D7D2C8"/><circle cx="390" cy="111" r="3" fill="#D7D2C8"/><text x="355" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="150" y1="50" x2="227.0" y2="50.0" stroke="#B07A00" stroke-width="3"/><polygon points="238.0,50.0 227.0,55.0 227.0,45.0" fill="#B07A00"/><text x="246.0" y="55.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">+4.0 m/s</text><text x="355" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="middle">at rest</text><text x="560" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="middle" font-weight="bold">Total p (kg·m/s)</text><text x="690" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="middle" font-weight="bold">Total K (J)</text><text x="560" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">4.0</text><text x="690" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">8.0</text><text x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#734200" text-anchor="start" font-weight="bold">After: Elastic</text><rect x="24" y="230" width="446" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="34" y="237" width="8" height="14" fill="#8A8F8C"/><rect x="452" y="237" width="8" height="14" fill="#8A8F8C"/><rect x="140" y="174" width="80" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="160" cy="221" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="221" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="160" cy="221" r="3" fill="#D7D2C8"/><circle cx="200" cy="221" r="3" fill="#D7D2C8"/><text x="180" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="300" y="174" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="320" cy="221" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="390" cy="221" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="320" cy="221" r="3" fill="#D7D2C8"/><circle cx="390" cy="221" r="3" fill="#D7D2C8"/><text x="355" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="180" y1="160" x2="147.0" y2="160.0" stroke="#B07A00" stroke-width="3"/><polygon points="136.0,160.0 147.0,155.1 147.0,164.9" fill="#B07A00"/><text x="128.0" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="end" font-weight="bold">−2.0 m/s</text><line x1="355" y1="160" x2="388.0" y2="160.0" stroke="#B07A00" stroke-width="3"/><polygon points="399.0,160.0 388.0,164.9 388.0,155.1" fill="#B07A00"/><text x="407.0" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">+2.0 m/s</text><text x="560" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">4.0</text><text x="560" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="middle">same</text><text x="690" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">8.0</text><text x="690" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="middle">same</text><text x="24" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#734200" text-anchor="start" font-weight="bold">After: Inelastic</text><rect x="24" y="350" width="446" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="34" y="357" width="8" height="14" fill="#8A8F8C"/><rect x="452" y="357" width="8" height="14" fill="#8A8F8C"/><rect x="140" y="294" width="80" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="160" cy="341" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="200" cy="341" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="160" cy="341" r="3" fill="#D7D2C8"/><circle cx="200" cy="341" r="3" fill="#D7D2C8"/><text x="180" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="300" y="294" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="320" cy="341" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="390" cy="341" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="320" cy="341" r="3" fill="#D7D2C8"/><circle cx="390" cy="341" r="3" fill="#D7D2C8"/><text x="355" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="180" y1="280" x2="174.5" y2="280.0" stroke="#B07A00" stroke-width="3"/><polygon points="185.5,280.0 174.5,284.9 174.5,275.1" fill="#B07A00"/><text x="180" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="middle" font-weight="bold">+0.25 m/s</text><line x1="355" y1="280" x2="371.5" y2="280.0" stroke="#B07A00" stroke-width="3"/><polygon points="382.5,280.0 371.5,284.9 371.5,275.1" fill="#B07A00"/><text x="390.5" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">+1.25 m/s</text><text x="560" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">4.0</text><text x="560" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="middle">same</text><text x="690" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">2.4</text><text x="690" y="338" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D55E00" text-anchor="middle">less</text><text x="24" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#734200" text-anchor="start" font-weight="bold">After: Perfectly inelastic (stick)</text><rect x="24" y="470" width="446" height="7" fill="#C9C3B6" stroke="#1F2A28" stroke-width="1.5"/><rect x="34" y="477" width="8" height="14" fill="#8A8F8C"/><rect x="452" y="477" width="8" height="14" fill="#8A8F8C"/><rect x="200" y="414" width="80" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="220" cy="461" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="260" cy="461" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="220" cy="461" r="3" fill="#D7D2C8"/><circle cx="260" cy="461" r="3" fill="#D7D2C8"/><text x="240" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">A</text><rect x="280" y="414" width="110" height="42" rx="6" fill="#F6E7C8" stroke="#1F2A28" stroke-width="2"/><circle cx="300" cy="461" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="370" cy="461" r="9" fill="#3B4442" stroke="#1F2A28" stroke-width="1.5"/><circle cx="300" cy="461" r="3" fill="#D7D2C8"/><circle cx="370" cy="461" r="3" fill="#D7D2C8"/><text x="335" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">B</text><line x1="280" y1="400" x2="291.0" y2="400.0" stroke="#B07A00" stroke-width="3"/><polygon points="302.0,400.0 291.0,404.9 291.0,395.1" fill="#B07A00"/><text x="310.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B07A00" text-anchor="start" font-weight="bold">+1.0 m/s together</text><text x="560" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">4.0</text><text x="560" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5A6268" text-anchor="middle">same</text><text x="690" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">2.0</text><text x="690" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D55E00" text-anchor="middle">less</text><line x1="500" y1="44" x2="500" y2="480" stroke="#E9E4DA" stroke-width="1.5"/><text x="24" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5A6268" text-anchor="start">Momentum is the same before and after every time. Kinetic energy stays the same only in the elastic collision.</text></svg>
