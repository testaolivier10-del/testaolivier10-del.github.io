<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Free fall: equal changes in velocity in equal times</title><desc id="d">A ball dropped from rest, shown at 0.10 s intervals beside a vertical ruler marked in meters downward from the release point. The images are farther apart each time: 0, 0.049, 0.196, 0.441, 0.784, 1.225 and 1.764 m. Gold velocity arrows grow longer, from 0 to 5.88 m/s, increasing by 0.98 m/s every 0.10 s, while red acceleration arrows stay the same length: 9.8 m/s squared downward at every instant.</desc><rect width="640" height="700" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">A dropped ball, photographed every 0.10 s</text><rect x="80" y="64" width="30" height="534.0" fill="#F6E7C8" stroke="#1F2A28"/><line x1="80" y1="70.0" x2="94" y2="70.0" stroke="#1F2A28"/><text x="72" y="74.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">0.0</text><line x1="80" y1="99.0" x2="88" y2="99.0" stroke="#1F2A28"/><line x1="80" y1="128.0" x2="88" y2="128.0" stroke="#1F2A28"/><line x1="80" y1="157.0" x2="88" y2="157.0" stroke="#1F2A28"/><line x1="80" y1="186.0" x2="88" y2="186.0" stroke="#1F2A28"/><line x1="80" y1="215.0" x2="94" y2="215.0" stroke="#1F2A28"/><text x="72" y="219.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">0.5</text><line x1="80" y1="244.0" x2="88" y2="244.0" stroke="#1F2A28"/><line x1="80" y1="273.0" x2="88" y2="273.0" stroke="#1F2A28"/><line x1="80" y1="302.0" x2="88" y2="302.0" stroke="#1F2A28"/><line x1="80" y1="331.0" x2="88" y2="331.0" stroke="#1F2A28"/><line x1="80" y1="360.0" x2="94" y2="360.0" stroke="#1F2A28"/><text x="72" y="364.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">1.0</text><line x1="80" y1="389.0" x2="88" y2="389.0" stroke="#1F2A28"/><line x1="80" y1="418.0" x2="88" y2="418.0" stroke="#1F2A28"/><line x1="80" y1="447.0" x2="88" y2="447.0" stroke="#1F2A28"/><line x1="80" y1="476.0" x2="88" y2="476.0" stroke="#1F2A28"/><line x1="80" y1="505.0" x2="94" y2="505.0" stroke="#1F2A28"/><text x="72" y="509.0" fill="#1F2A28" font-size="11" text-anchor="end" font-weight="normal">1.5</text><line x1="80" y1="534.0" x2="88" y2="534.0" stroke="#1F2A28"/><line x1="80" y1="563.0" x2="88" y2="563.0" stroke="#1F2A28"/><line x1="80" y1="592.0" x2="88" y2="592.0" stroke="#1F2A28"/><text x="95" y="54" fill="#1F2A28" font-size="12" text-anchor="middle" font-weight="normal">y (m), down from release</text><circle cx="200.0" cy="70.0" r="7" fill="#E07B39" stroke="#1F2A28" stroke-width="1.3"/><circle cx="197.6" cy="67.5" r="2.0" fill="#ffffff" opacity="0.5"/><text x="178" y="71.0" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">t = 0.0 s</text><text x="270" y="72.0" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">v = 0 (released from rest)</text><circle cx="200.0" cy="84.2" r="7" fill="#F0A774" stroke="#1F2A28" stroke-width="1.3"/><circle cx="197.6" cy="81.8" r="2.0" fill="#ffffff" opacity="0.5"/><text x="178" y="94.21000000000001" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">t = 0.1 s</text><line x1="218.0" y1="84.2" x2="218.0" y2="86.0" stroke="#B07A00" stroke-width="2.6"/><polygon points="218.0,97.0 223.5,86.0 212.5,86.0" fill="#B07A00"/><line x1="244.0" y1="84.2" x2="244.0" y2="104.6" stroke="#A33B26" stroke-width="2.6"/><polygon points="244.0,115.6 249.5,104.6 238.5,104.6" fill="#A33B26"/><text x="270" y="95.21000000000001" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">v = 0.98 m/s</text><circle cx="200.0" cy="126.8" r="7" fill="#F0A774" stroke="#1F2A28" stroke-width="1.3"/><circle cx="197.6" cy="124.4" r="2.0" fill="#ffffff" opacity="0.5"/><text x="178" y="130.84" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">t = 0.2 s</text><line x1="218.