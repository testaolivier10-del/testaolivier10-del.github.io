="429.25" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">t = 0.5 s</text><line x1="218.0" y1="425.2" x2="218.0" y2="477.9" stroke="#B07A00" stroke-width="2.6"/><polygon points="218.0,488.9 223.5,477.9 212.5,477.9" fill="#B07A00"/><line x1="244.0" y1="425.2" x2="244.0" y2="445.6" stroke="#A33B26" stroke-width="2.6"/><polygon points="244.0,456.6 249.5,445.6 238.5,445.6" fill="#A33B26"/><text x="270" y="430.25" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">v = 4.90 m/s</text><circle cx="200.0" cy="581.6" r="7" fill="#E07B39" stroke="#1F2A28" stroke-width="1.3"/><circle cx="197.6" cy="579.1" r="2.0" fill="#ffffff" opacity="0.5"/><text x="178" y="585.5600000000002" fill="#5A6268" font-size="11" text-anchor="end" font-weight="normal">t = 0.6 s</text><line x1="218.0" y1="581.6" x2="218.0" y2="647.0" stroke="#B07A00" stroke-width="2.6"/><polygon points="218.0,658.0 223.5,647.0 212.5,647.0" fill="#B07A00"/><line x1="244.0" y1="581.6" x2="244.0" y2="601.9" stroke="#A33B26" stroke-width="2.6"/><polygon points="244.0,612.9 249.5,601.9 238.5,601.9" fill="#A33B26"/><text x="270" y="586.5600000000002" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">v = 5.88 m/s</text><rect x="400" y="80" width="220" height="186" rx="8" fill="#FBEED5" stroke="#734200"/><text x="412" y="104" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">The gaps grow each 0.10 s:</text><text x="412" y="125" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">the ball speeds up.</text><text x="412" y="146" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">v grows by 0.98 m/s each 0.10 s,</text><text x="412" y="167" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">so a = 9.8 m/s² downward,</text><text x="412" y="188" fill="#1F2A28" font-size="13" text-anchor="start" font-weight="normal">the same at every instant.</text><line x1="414.0" y1="218.0" x2="433.0" y2="218.0" stroke="#B07A00" stroke-width="2.6"/><polygon points="444.0,218.0 433.0,212.5 433.0,223.5" fill="#B07A00"/><text x="452" y="222" fill="#B07A00" font-size="12" text-anchor="start" font-weight="bold">velocity</text><line x1="414.0" y1="238.0" x2="433.0" y2="238.0" stroke="#A33B26" stroke-width="2.6"/><polygon points="444.0,238.0 433.0,232.5 433.0,243.5" fill="#A33B26"/><text x="452" y="242" fill="#A33B26" font-size="12" text-anchor="start" font-weight="bold">acceleration</text></svg>