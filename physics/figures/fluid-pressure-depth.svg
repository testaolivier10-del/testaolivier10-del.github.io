<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Pressure at three points in a tank of water</title>
<desc id="d">An open tank of water with air pressing down on the surface at P₀. Points A and B are at the same depth h₁; point C is deeper, at h₂. Arrows of equal length push in from all four sides of each point, longer at C than at A and B, showing that pressure acts equally in every direction at a point and grows with depth. A panel gives absolute pressure P = P₀ + ρgh and gauge pressure P_gauge = ρgh.</desc>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="26" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Pressure in a liquid depends on depth</text><rect x="60" y="90" width="300" height="270" fill="#D7EBF4"/><path d="M60,60 L60,360 L360,360 L360,60" fill="none" stroke="#1F2A28" stroke-width="3"/><line x1="60" y1="90" x2="360" y2="90" stroke="#7FB6CF" stroke-width="2"/><text x="370" y="86" font-size="13" fill="#5A6268">P₀ (air pushes on the surface)</text><line x1="100" y1="56" x2="100" y2="78" stroke="#5A6268" stroke-width="2" stroke-linecap="butt"/><polygon points="100,86 96,78 104,78" fill="#5A6268"/><line x1="170" y1="56" x2="170" y2="78" stroke="#5A6268" stroke-width="2" stroke-linecap="butt"/><polygon points="170,86 166,78 174,78" fill="#5A6268"/><line x1="240" y1="56" x2="240" y2="78" stroke="#5A6268" stroke-width="2" stroke-linecap="butt"/><polygon points="240,86 236,78 244,78" fill="#5A6268"/><line x1="310" y1="56" x2="310" y2="78" stroke="#5A6268" stroke-width="2" stroke-linecap="butt"/><polygon points="310,86 306,78 314,78" fill="#5A6268"/><line x1="99.3" y1="160" x2="116" y2="160" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="124,160 116,164.5 116,155.5" fill="#734200"/><line x1="160.7" y1="160" x2="144" y2="160" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="136,160 144,155.5 144,164.5" fill="#734200"/><line x1="130" y1="129.3" x2="130" y2="146" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="130,154 125.5,146 134.5,146" fill="#734200"/><line x1="130" y1="190.7" x2="130" y2="174" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="130,166 134.5,174 125.5,174" fill="#734200"/><circle cx="130" cy="160" r="4" fill="#1F2A28"/><text x="140" y="150" font-size="15" fill="#1F2A28" font-weight="bold">A</text><line x1="239.3" y1="160" x2="256" y2="160" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="264,160 256,164.5 256,155.5" fill="#734200"/><line x1="300.7" y1="160" x2="284" y2="160" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="276,160 284,155.5 284,164.5" fill="#734200"/><line x1="270" y1="129.3" x2="270" y2="146" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="270,154 265.5,146 274.5,146" fill="#734200"/><line x1="270" y1="190.7" x2="270" y2="174" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="270,166 274.5,174 265.5,174" fill="#734200"/><circle cx="270" cy="160" r="4" fill="#1F2A28"/><text x="280" y="150" font-size="15" fill="#1F2A28" font-weight="bold">B</text><line x1="152" y1="300" x2="186" y2="300" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="194,300 186,304.5 186,295.5" fill="#734200"/><line x1="248" y1="300" x2="214" y2="300" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="206,300 214,295.5 214,304.5" fill="#734200"/><line x1="200" y1="252" x2="200" y2="286" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="200,294 195.5,286 204.5,286" fill="#734200"/><line x1="200" y1="348" x2="200" y2="314" stroke="#734200" stroke-width="2.4" stroke-linecap="butt"/><polygon points="200,306 204.5,314 195.5,314" fill="#734200"/><circle cx="200" cy="300" r="4" fill="#1F2A28"/><text x="210" y="290" font-size="15" fill="#1F2A28" font-weight="bold">C</text><line x1="38" y1="125" x2="38" y2="98" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="38,90 42,98 34,98" fill="#5A6268"/><line x1="38" y1="125" x2="38" y2="152" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="38,160 34,152 42,152" fill="#5A6268"/><text x="30" y="130" font-size="13" fill="#1F2A28" text-anchor="end" font-style="italic">h₁</text><line x1="382" y1="195" x2="382" y2="98" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="382,90 386,98 378,98" fill="#5A6268"/><line x1="382" y1="195" x2="382" y2="292" stroke="#5A6268" stroke-width="1.4" stroke-linecap="butt"/><polygon points="382,300 378,292 386,292" fill="#5A6268"/><text x="390" y="200" font-size="13" fill="#1F2A28" text-anchor="start" font-style="italic">h₂</text><line x1="60" y1="160" x2="360" y2="160" stroke="#C9CFCC" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="60" y1="300" x2="360" y2="300" stroke="#C9CFCC" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="430" y="100" width="300" height="250" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="448" y="134" font-size="15" fill="#1F2A28" font-weight="bold">Absolute pressure</text><text x="448" y="162" font-size="19" fill="#734200" font-weight="bold">P = P₀ + ρgh</text><text x="448" y="202" font-size="15" fill="#1F2A28" font-weight="bold">Gauge pressure (what a tire</text><text x="448" y="222" font-size="15" fill="#1F2A28" font-weight="bold">gauge reads)</text><text x="448" y="250" font-size="19" fill="#734200" font-weight="bold">P<tspan baseline-shift="sub" font-size="12">gauge</tspan> = P − P₀ = ρgh</text><text x="448" y="286" font-size="13.5" fill="#1F2A28">A and B: same depth, same pressure.</text><text x="448" y="308" font-size="13.5" fill="#1F2A28">C is deeper, so its pressure is larger.</text><text x="448" y="330" font-size="13.5" fill="#1F2A28">At a point, the push is the same</text><text x="448" y="348" font-size="13.5" fill="#1F2A28">in every direction.</text>
</svg>
