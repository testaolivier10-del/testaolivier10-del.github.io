<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A satellite on an elliptical orbit and its energy bars</title>
<desc id="d">A satellite moves counterclockwise on a dashed elliptical orbit around a planet of mass M, which sits off-center. At the near point A the satellite is closest to the planet and its velocity arrow is long; at the far point B it is farthest and its velocity arrow is short. At both points the gravitational force from the planet points toward the planet’s center, perpendicular to the velocity, and is larger at A. A bar chart compares A and B: kinetic energy K is positive and larger at A; gravitational potential energy U is negative, more negative at A; the total energy E = K + U is negative and the same at both points.</desc>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">An elliptical orbit: E and L constant, K and U trade</text><ellipse cx="250" cy="232" rx="190" ry="165" fill="none" stroke="#5A6268" stroke-width="1.8" stroke-dasharray="7 5"/><circle cx="155.8" cy="232" r="30" fill="#6FA3C7" stroke="#1F2A28" stroke-width="2"/><text x="155.8" y="237" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold" font-style="italic">M</text><circle cx="60" cy="232" r="9" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><text x="46" y="237" font-size="16" fill="#1F2A28" text-anchor="end" font-weight="bold">A</text><circle cx="440" cy="232" r="9" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><text x="454" y="237" font-size="16" fill="#1F2A28" font-weight="bold">B</text><line x1="60" y1="242" x2="60" y2="341" stroke="#B07A00" stroke-width="3.5"/><polygon points="60,352 54,341 66,341" fill="#B07A00"/><text x="68" y="346" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><line x1="440" y1="222" x2="440" y2="195.9" stroke="#B07A00" stroke-width="3.5"/><polygon points="440,184.9 446,195.9 434,195.9" fill="#B07A00"/><text x="448" y="196.9" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><line x1="70" y1="232" x2="97" y2="232" stroke="#0072B2" stroke-width="3"/><polygon points="108,232 97,238 97,226" fill="#0072B2"/><line x1="430" y1="232" x2="426.7" y2="232" stroke="#0072B2" stroke-width="3"/><polygon points="415.7,232 426.7,226 426.7,238" fill="#0072B2"/><text x="74" y="220" font-size="13" fill="#0072B2" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">g</tspan></text><text x="406" y="220" font-size="13" fill="#0072B2" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">g</tspan></text><text x="100" y="328" font-size="13" fill="#1F2A28">near point: fast</text><text x="430" y="172" font-size="13" fill="#1F2A28" text-anchor="end">far point: slow</text><rect x="520" y="70" width="220" height="340" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="581" y="96" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">at A</text><rect x="540" y="111" width="22" height="89" fill="#B07A00"/><text x="551" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">K</text><rect x="570" y="200" width="22" height="119" fill="#0072B2"/><text x="581" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">U</text><rect x="600" y="200" width="22" height="30" fill="#734200"/><text x="611" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">E</text><text x="681" y="96" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">at B</text><rect x="640" y="189.9" width="22" height="10.1" fill="#B07A00"/><text x="651" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">K</text><rect x="670" y="200" width="22" height="40.1" fill="#0072B2"/><text x="681" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">U</text><rect x="700" y="200" width="22" height="30" fill="#734200"/><text x="711" y="396" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold" font-style="italic">E</text><line x1="530" y1="200" x2="730" y2="200" stroke="#1F2A28" stroke-width="1.8"/><text x="726" y="195" font-size="12" fill="#1F2A28" text-anchor="end">0</text><text x="630" y="358" font-size="12" fill="#1F2A28" text-anchor="middle">E is negative and the same</text><text x="630" y="373" font-size="12" fill="#1F2A28" text-anchor="middle">at A and B</text>
</svg>
