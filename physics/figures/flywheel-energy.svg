<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A spinning flywheel with its center at rest</title>
<desc id="d">A flywheel spins counterclockwise on a fixed stand. Its center of mass does not move (v_cm = 0), yet every piece of the rim moves: velocity arrows at the top, bottom, left and right of the rim point in different, opposite directions, tangent to the rim. The wheel therefore has kinetic energy of rotation. A panel derives K_rot = ½Iω² from adding ½m(rω)² for every piece, notes it is a scalar measured in joules, that doubling ω quadruples it, and that moving mass outward at the same ω increases it.</desc>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">A spinning wheel has kinetic energy while its center stays put</text><rect x="40" y="372" width="340" height="10" fill="#EEF1EF"/><line x1="40" y1="372" x2="380" y2="372" stroke="#1F2A28" stroke-width="2.5"/><line x1="44" y1="372" x2="36" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="56" y1="372" x2="48" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="68" y1="372" x2="60" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="80" y1="372" x2="72" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="92" y1="372" x2="84" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="104" y1="372" x2="96" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="116" y1="372" x2="108" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="128" y1="372" x2="120" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="140" y1="372" x2="132" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="152" y1="372" x2="144" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="164" y1="372" x2="156" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="176" y1="372" x2="168" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="188" y1="372" x2="180" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="200" y1="372" x2="192" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="212" y1="372" x2="204" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="224" y1="372" x2="216" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="236" y1="372" x2="228" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="248" y1="372" x2="240" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="260" y1="372" x2="252" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="272" y1="372" x2="264" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="284" y1="372" x2="276" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="296" y1="372" x2="288" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="308" y1="372" x2="300" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="320" y1="372" x2="312" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="332" y1="372" x2="324" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="344" y1="372" x2="336" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="356" y1="372" x2="348" y2="381" stroke="#5A6268" stroke-width="1"/><line x1="368" y1="372" x2="360" y2="381" stroke="#5A6268" stroke-width="1"/><polygon points="192,210 150,372 170,372 210,240" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><polygon points="228,210 270,372 250,372 210,240" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><circle cx="210" cy="210" r="130" fill="#8E989E" stroke="#1F2A28" stroke-width="2.5"/><circle cx="210" cy="210" r="106.6" fill="#EEF1EF" stroke="#1F2A28" stroke-width="1.5"/><line x1="224.9" y1="214.6" x2="311.8" y2="241.5" stroke="#8E989E" stroke-width="3"/><line x1="213.5" y1="225.2" x2="233.6" y2="313.9" stroke="#8E989E" stroke-width="3"/><line x1="198.6" y1="220.6" x2="131.8" y2="282.4" stroke="#8E989E" stroke-width="3"/><line x1="195.1" y1="205.4" x2="108.2" y2="178.5" stroke="#8E989E" stroke-width="3"/><line x1="206.5" y1="194.8" x2="186.4" y2="106.1" stroke="#8E989E" stroke-width="3"/><line x1="221.4" y1="199.4" x2="288.2" y2="137.6" stroke="#8E989E" stroke-width="3"/><circle cx="210" cy="210" r="15.6" fill="#8E989E" stroke="#1F2A28" stroke-width="1.5"/><circle cx="210" cy="210" r="3" fill="#1F2A28"/><circle cx="210" cy="91.7" r="5" fill="#B07A00"/><line x1="210" y1="91.7" x2="159" y2="91.7" stroke="#B07A00" stroke-width="3"/><polygon points="148,91.7 159,85.7 159,97.7" fill="#B07A00"/><circle cx="210" cy="328.3" r="5" fill="#B07A00"/><line x1="210" y1="328.3" x2="261" y2="328.3" stroke="#B07A00" stroke-width="3"/><polygon points="272,328.3 261,334.3 261,322.3" fill="#B07A00"/><circle cx="328.3" cy="210" r="5" fill="#B07A00"/><line x1="328.3" y1="210" x2="328.3" y2="159" stroke="#B07A00" stroke-width="3"/><polygon points="328.3,148 334.3,159 322.3,159" fill="#B07A00"/><circle cx="91.7" cy="210" r="5" fill="#B07A00"/><line x1="91.7" y1="210" x2="91.7" y2="261" stroke="#B07A00" stroke-width="3"/><polygon points="91.7,272 85.7,261 97.7,261" fill="#B07A00"/><text x="24" y="56" font-size="13" fill="#B07A00" font-weight="bold">pieces of the rim move in</text><text x="24" y="72" font-size="13" fill="#B07A00" font-weight="bold">opposite directions</text><text x="222" y="234" font-size="14" fill="#1F2A28" font-weight="bold"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="75%">cm</tspan> = 0</text><rect x="450" y="70" width="290" height="290" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="466" y="104" font-size="22" fill="#734200" font-weight="bold"><tspan font-style="italic">K</tspan><tspan baseline-shift="sub" font-size="75%">rot</tspan> = ½Iω²</text><text x="466" y="140" font-size="13" fill="#1F2A28">Each piece of mass m at distance r</text><text x="466" y="162" font-size="13" fill="#1F2A28">moves at v = rω, so its kinetic</text><text x="466" y="184" font-size="13" fill="#1F2A28">energy is ½m(rω)². Adding them up</text><text x="466" y="206" font-size="13" fill="#1F2A28">gives ½(Σmr²)ω² = ½Iω².</text><text x="466" y="228" font-size="13" fill="#1F2A28"></text><text x="466" y="250" font-size="13" fill="#1F2A28">A scalar: no direction. Joules.</text><text x="466" y="272" font-size="13" fill="#1F2A28" font-weight="bold">Twice the ω: four times the energy.</text><text x="466" y="294" font-size="13" fill="#1F2A28">Same ω, mass moved outward:</text><text x="466" y="316" font-size="13" fill="#1F2A28">more energy (larger I).</text>
</svg>
