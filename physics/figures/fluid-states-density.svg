<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Particles in a solid, a liquid and a gas</title>
<desc id="d">Three boxes of particles. In the solid the particles sit in a fixed grid. In the liquid they are close together but disordered and fill the bottom of the container, with a flat surface. In the gas they are far apart and move in all directions, filling the box. Liquids and gases are fluids: they flow and take the shape of their container. Below, the definition of density: ρ = m/V in kg/m³; water is about 1000 kg/m³.</desc>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="26" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Solids keep their shape; fluids flow</text><rect x="40" y="50" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.5"/><text x="140" y="278" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">Solid</text><text x="140" y="300" font-size="13" fill="#5A6268" text-anchor="middle">particles locked in place</text><rect x="280" y="50" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.5"/><text x="380" y="278" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">Liquid</text><text x="380" y="300" font-size="13" fill="#5A6268" text-anchor="middle">close together, slide past</text><rect x="520" y="50" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2.5"/><text x="620" y="278" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="bold">Gas</text><text x="620" y="300" font-size="13" fill="#5A6268" text-anchor="middle">far apart, move freely</text><circle cx="64" cy="74" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="99.5" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="125" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="150.5" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="176" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="201.5" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="64" cy="227" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="89.5" cy="74" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="89.5" cy="99.5" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="89.5" cy="125" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><circle cx="89.5" cy="150.5" r="9" fill="#3E9BC8" stroke="#1F2A28" stroke-width="1.2"/><