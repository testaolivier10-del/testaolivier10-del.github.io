<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">What sets the period of a spring and of a pendulum</title>
<desc id="d">Left: a block of mass m hangs from a spring of constant k; its period is T = 2π√(m/k), set by m and k, not by the amplitude or by g. Right: a simple pendulum of length ℓ swinging through a small angle θ; its period is T = 2π√(ℓ/g), set by ℓ and g, not by the mass of the bob or the amplitude.</desc>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="190" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Block on a spring</text><rect x="110" y="50" width="160" height="10" fill="#EEF1EF"/><line x1="110" y1="60" x2="270" y2="60" stroke="#1F2A28" stroke-width="2.5"/><line x1="114" y1="60" x2="122" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="126" y1="60" x2="134" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="138" y1="60" x2="146" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="150" y1="60" x2="158" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="162" y1="60" x2="170" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="174" y1="60" x2="182" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="186" y1="60" x2="194" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="198" y1="60" x2="206" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="210" y1="60" x2="218" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="222" y1="60" x2="230" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="234" y1="60" x2="242" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="246" y1="60" x2="254" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="258" y1="60" x2="266" y2="51" stroke="#5A6268" stroke-width="1"/><polyline points="190,60 190,70 179,73 201,79 179,85 201,91 179,97 201,103 179,109 201,115 179,121 201,127 179,133 201,139 179,145 201,151 179,157 201,163 179,169 201,175 179,181 201,187 190,190 190,200" fill="none" stroke="#CC79A7" stroke-width="2.4" stroke-linejoin="round"/><rect x="160" y="200" width="60" height="50" rx="3" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><text x="190" y="230" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">m</text><text x="212" y="130" font-size="18" fill="#1F2A28" font-weight="bold" font-style="italic">k</text><rect x="70" y="285" width="240" height="62" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="190" y="324" font-size="20" fill="#734200" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="12">s</tspan> = 2π √(m / k)</text><text x="190" y="378" font-size="14" fill="#1F2A28" text-anchor="middle">Depends on: mass m, spring constant k</text><text x="190" y="400" font-size="14" fill="#5A6268" text-anchor="middle">Not on: amplitude, g (hang it or lay it flat)</text><text x="560" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Simple pendulum (small angles)</text><rect x="470" y="50" width="180" height="10" fill="#EEF1EF"/><line x1="470" y1="60" x2="650" y2="60" stroke="#1F2A28" stroke-width="2.5"/><line x1="474" y1="60" x2="482" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="486" y1="60" x2="494" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="498" y1="60" x2="506" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="510" y1="60" x2="518" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="522" y1="60" x2="530" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="534" y1="60" x2="542" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="546" y1="60" x2="554" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="558" y1="60" x2="566" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="570" y1="60" x2="578" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="582" y1="60" x2="590" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="594" y1="60" x2="602" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="606" y1="60" x2="614" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="618" y1="60" x2="626" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="630" y1="60" x2="638" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="642" y1="60" x2="650" y2="51" stroke="#5A6268" stroke-width="1"/><line x1="560" y1="60" x2="560" y2="270" stroke="#5A6268" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="560" y1="60" x2="606" y2="244.4" stroke="#1F2A28" stroke-width="1.8"/><circle cx="606" cy="244.4" r="17" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><text x="606" y="249.4" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="bold">m</text><path d="M560,120 A60,60 0 0,0 574.5,118.2" fill="none" stroke="#5A6268" stroke-width="1.4"/><text x="569" y="142" font-size="15" fill="#1F2A28" font-style="italic">θ</text><text x="595" y="155" font-size="20" fill="#1F2A28" font-weight="bold" font-style="italic">ℓ</text><rect x="440" y="285" width="240" height="62" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="560" y="324" font-size="20" fill="#734200" text-anchor="middle" font-weight="bold">T<tspan baseline-shift="sub" font-size="12">p</tspan> = 2π √(ℓ / g)</text><text x="560" y="378" font-size="14" fill="#1F2A28" text-anchor="middle">Depends on: length ℓ, field strength g</text><text x="560" y="400" font-size="14" fill="#5A6268" text-anchor="middle">Not on: mass of the bob, amplitude</text><line x1="380" y1="50" x2="380" y2="410" stroke="#C9CFCC" stroke-width="1.5"/>
</svg>
