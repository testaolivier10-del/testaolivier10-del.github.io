<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A crate pulled across a floor and its free-body diagram</title>
<desc id="d">Left: a 40 kg wooden crate on a floor is pulled to the right by a horizontal rope held in a hand; an outlined velocity arrow above it reads v constant, to the right. Right: the free-body diagram of the crate, a dot with four arrows starting on it: F_N, floor on crate, up; F_g, Earth on crate, down, the same length; F_T, rope on crate, to the right; and F_f, floor on crate, to the left, the same length as the tension. The velocity is not drawn on the free-body diagram.</desc>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="bold">From the scene to the free-body diagram</text><rect x="20" y="46" width="380" height="314" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="34" y="70" font-size="15" fill="#734200" font-weight="bold">The scene</text><rect x="40" y="270" width="340" height="10" fill="#EEF1EF"/><line x1="40" y1="270" x2="380" y2="270" stroke="#1F2A28" stroke-width="2.5"/><line x1="46" y1="271" x2="38" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="58" y1="271" x2="50" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="70" y1="271" x2="62" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="82" y1="271" x2="74" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="94" y1="271" x2="86" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="106" y1="271" x2="98" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="118" y1="271" x2="110" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="130" y1="271" x2="122" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="142" y1="271" x2="134" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="154" y1="271" x2="146" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="166" y1="271" x2="158" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="178" y1="271" x2="170" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="190" y1="271" x2="182" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="202" y1="271" x2="194" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="214" y1="271" x2="206" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="226" y1="271" x2="218" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="238" y1="271" x2="230" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="250" y1="271" x2="242" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="262" y1="271" x2="254" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="274" y1="271" x2="266" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="286" y1="271" x2="278" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="298" y1="271" x2="290" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="310" y1="271" x2="302" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="322" y1="271" x2="314" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="334" y1="271" x2="326" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="346" y1="271" x2="338" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="358" y1="271" x2="350" y2="280" stroke="#5A6268" stroke-width="1"/><line x1="370" y1="271" x2="362" y2="280" stroke="#5A6268" stroke-width="1"/><rect x="110" y="170" width="110" height="100" rx="2" fill="#E3C99A" stroke="#9C7A44" stroke-width="2.5"/><rect x="115" y="175" width="100" height="90" rx="1" fill="none" stroke="#9C7A44" stroke-width="1.4"/><line x1="116" y1="264" x2="214" y2="176" stroke="#9C7A44" stroke-width="1.4"/><rect x="143" y="209" width="44" height="22" rx="3" fill="#FFFFFF" stroke="#9C7A44" stroke-width="1"/><text x="165" y="225" font-size="13" fill="#1F2A28" text-anchor="middle" font-weight="bold">40 kg</text><line x1="220" y1="220" x2="360" y2="220" stroke="#9C7A44" stroke-width="3"/><rect x="352" y="208" width="22" height="24" rx="8" fill="#E8C4A0" stroke="#1F2A28" stroke-width="1.6"/><text x="300" y="208" font-size="13" fill="#5A6268" text-anchor="middle">rope</text><polygon points="120,143.5 196,143.5 196,149 210,140 196,131 196,136.5 120,136.5" fill="#FFFFFF" stroke="#B07A00" stroke-width="2.2" stroke-linejoin="round"/><text x="222" y="145" font-size="13" fill="#B07A00" font-weight="bold">v constant, to the right</text><text x="210" y="330" font-size="12.5" fill="#5A6268" text-anchor="middle">Rope pulls right; floor rubs; Earth pulls down;</text><text x="210" y="348" font-size="12.5" fill="#5A6268" text-anchor="middle">floor pushes up. Velocity belongs on the scene only.</text><rect x="420" y="46" width="320" height="314" rx="10" fill="#FFFFFF" stroke="#C9CFCC" stroke-width="1.5"/><text x="434" y="70" font-size="15" fill="#734200" font-weight="bold">Free-body diagram of the crate</text><line x1="580" y1="200" x2="580" y2="122" stroke="#009E73" stroke-width="3.2"/><polygon points="580,110 586.5,122 573.5,122" fill="#009E73"/><text x="590" y="122" font-size="14" fill="#1F2A28"><tspan fill="#009E73" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">N</tspan></tspan><tspan fill="#1F2A28">, floor on crate</tspan></text><line x1="580" y1="200" x2="580" y2="278" stroke="#0072B2" stroke-width="3.2"/><polygon points="580,290 573.5,278 586.5,278" fill="#0072B2"/><text x="590" y="286" font-size="14" fill="#1F2A28"><tspan fill="#0072B2" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">g</tspan></tspan><tspan fill="#1F2A28">, Earth on crate</tspan></text><line x1="580" y1="200" x2="646" y2="200" stroke="#7A4F9E" stroke-width="3.2"/><polygon points="658,200 646,206.5 646,193.5" fill="#7A4F9E"/><text x="648" y="170" font-size="14" fill="#1F2A28"><tspan fill="#7A4F9E" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">T</tspan></tspan><tspan fill="#1F2A28">,</tspan></text><line x1="580" y1="200" x2="514" y2="200" stroke="#D55E00" stroke-width="3.2"/><polygon points="502,200 514,193.5 514,206.5" fill="#D55E00"/><text x="506" y="170" font-size="14" fill="#1F2A28" text-anchor="start"><tspan fill="#D55E00" font-weight="bold">F<tspan baseline-shift="sub" font-size="10">f</tspan></tspan><tspan fill="#1F2A28">,</tspan></text><circle cx="580" cy="200" r="5.5" fill="#1F2A28"/><text x="652" y="186" font-size="13" fill="#1F2A28">rope on crate</text><text x="492" y="186" font-size="13" fill="#1F2A28">floor on crate</text><text x="580" y="338" font-size="12.5" fill="#5A6268" text-anchor="middle">Equal lengths: the forces cancel in each direction.</text>
</svg>
