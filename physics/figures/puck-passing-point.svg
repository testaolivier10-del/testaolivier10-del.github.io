<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A puck sliding past a point has constant angular momentum about it</title>
<desc id="d">Top view of a level, frictionless table. A puck of mass m slides at constant velocity v along a straight dashed line. A point P lies off the line, a perpendicular distance d from it. The puck is shown at three positions; grey lines from P reach the first and third positions, and at the first one the angle θ between r and v is marked. The amber perpendicular from P to the line has length r⊥ = d. A panel gives L = rmv sin θ = mvd: r changes as the puck moves, but r sin θ always equals d, so the angular momentum about P is constant. About any point on the puck’s own line, L is zero.</desc>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Angular momentum of an object moving in a straight line</text><rect x="40" y="60" width="520" height="320" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="52" y="82" font-size="12" fill="#5A6268">top view of a level, frictionless table</text><line x1="60" y1="160" x2="540" y2="160" stroke="#C9CFCC" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="300" cy="320" r="6" fill="#1F2A28"/><text x="310" y="342" font-size="14" fill="#1F2A28" font-weight="bold">point P</text><line x1="300" y1="320" x2="110" y2="160" stroke="#5A6268" stroke-width="1.6"/><circle cx="110" cy="160" r="14" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><line x1="126" y1="160" x2="179" y2="160" stroke="#B07A00" stroke-width="3.5"/><polygon points="190,160 179,166 179,154" fill="#B07A00"/><line x1="300" y1="320" x2="300" y2="160" stroke="#5A6268" stroke-width="0"/><circle cx="300" cy="160" r="14" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><line x1="316" y1="160" x2="369" y2="160" stroke="#B07A00" stroke-width="3.5"/><polygon points="380,160 369,166 369,154" fill="#B07A00"/><line x1="300" y1="320" x2="470" y2="160" stroke="#5A6268" stroke-width="1.6"/><circle cx="470" cy="160" r="14" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><line x1="486" y1="160" x2="539" y2="160" stroke="#B07A00" stroke-width="3.5"/><polygon points="550,160 539,166 539,154" fill="#B07A00"/><text x="176" y="182" font-size="15" fill="#B07A00" font-weight="bold" font-style="italic">v</text><text x="176" y="250" font-size="15" fill="#5A6268" font-style="italic">r</text><line x1="110" y1="160" x2="56.5" y2="114.9" stroke="#5A6268" stroke-width="1.3" stroke-dasharray="6 5"/><path d="M140,160 A30 30 0 0 0 87.1,140.7" fill="none" stroke="#1F2A28" stroke-width="1.4"/><text x="124.4" y="125.5" font-size="15" fill="#1F2A28" text-anchor="middle" font-style="italic">θ</text><line x1="300" y1="320" x2="300" y2="160" stroke="#734200" stroke-width="4"/><text x="310" y="245" font-size="15" fill="#734200" font-weight="bold"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="75%">⊥</tspan> = d</text><polyline points="300,172 312,172 312,160" fill="none" stroke="#734200" stroke-width="1.6"/><rect x="580" y="60" width="160" height="320" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="592" y="92" font-size="16" fill="#734200" font-weight="bold">L = rmv sin θ</text><text x="592" y="113" font-size="16" fill="#734200" font-weight="bold">= m v d</text><text x="592" y="134" font-size="13" fill="#1F2A28"></text><text x="592" y="155" font-size="13" fill="#1F2A28">r grows as the</text><text x="592" y="176" font-size="13" fill="#1F2A28">puck moves off,</text><text x="592" y="197" font-size="13" fill="#1F2A28">but r sin θ = d</text><text x="592" y="218" font-size="13" fill="#1F2A28">stays the same.</text><text x="592" y="239" font-size="13" fill="#1F2A28"></text><text x="592" y="260" font-size="13" fill="#1F2A28" font-weight="bold">So L about P</text><text x="592" y="281" font-size="13" fill="#1F2A28" font-weight="bold">is constant.</text><text x="592" y="302" font-size="13" fill="#1F2A28"></text><text x="592" y="323" font-size="13" fill="#1F2A28">About a point on</text><text x="592" y="344" font-size="13" fill="#1F2A28">the dashed line:</text><text x="592" y="365" font-size="13" fill="#1F2A28">L = 0.</text>
</svg>
