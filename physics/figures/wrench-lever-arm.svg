<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A wrench, its line of action and its lever arm</title>
<desc id="d">A wrench grips a bolt, which is the axis of rotation. A hand pushes on the far end of the handle, a distance r from the axis, with a force F_A at angle θ = 60° to the handle, turning the wrench counterclockwise. A dashed line extends the force’s line of action. The lever arm, r⊥ = r sin θ, is the perpendicular distance from the axis to that line, drawn in amber with a right-angle mark. The panel gives τ = r⊥F = rF sin θ in N·m, notes that a counterclockwise torque is positive, and that a force whose line passes through the axis gives zero torque.</desc>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold">Torque: force times lever arm</text><rect x="140" y="238" width="334" height="24" rx="12" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><circle cx="140" cy="250" r="38" fill="#B9C2C7" stroke="#1F2A28" stroke-width="2"/><polygon points="162.5,237 140,224 117.5,237 117.5,263 140,276 162.5,263" fill="#8E989E" stroke="#1F2A28" stroke-width="2"/><circle cx="140" cy="250" r="4" fill="#1F2A28"/><line x1="300" y1="204" x2="148" y2="204" stroke="#5A6268" stroke-width="1.4"/><polygon points="140,204 148,200 148,208" fill="#5A6268"/><line x1="300" y1="204" x2="452" y2="204" stroke="#5A6268" stroke-width="1.4"/><polygon points="460,204 452,208 452,200" fill="#5A6268"/><text x="300" y="194" font-size="13" fill="#1F2A28" text-anchor="middle">r (axis to where the force acts)</text><line x1="460" y1="250" x2="528.5" y2="131.4" stroke="#5A6268" stroke-width="4"/><polygon points="535,120.1 534.6,134.9 522.4,127.9" fill="#5A6268"/><text x="545" y="124.1" font-size="14" fill="#5A6268" font-weight="bold"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="75%">A</tspan>, hand on wrench</text><path d="M494,248.8 A34 34 0 0 0 483.5,225.5" fill="none" stroke="#1F2A28" stroke-width="1.5"/><polygon points="478,221.2 485.7,222.7 481.4,228.2" fill="#1F2A28"/><text x="496" y="238" font-size="15" fill="#1F2A28" font-style="italic">θ</text><line x1="460" y1="250" x2="530" y2="250" stroke="#C9CFCC" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="460" y1="250" x2="365" y2="414.5" stroke="#5A6268" stroke-width="1.6" stroke-dasharray="6 5"/><text x="373" y="418.5" font-size="13" fill="#5A6268">line of action</text><line x1="140" y1="250" x2="380" y2="388.6" stroke="#734200" stroke-width="4"/><polyline points="369.6,382.6 363.6,393 374,399" fill="none" stroke="#734200" stroke-width="1.6"/><text x="251" y="334.9" font-size="14" font-weight="bold" fill="#734200" text-anchor="middle" transform="rotate(30 251 334.9)">lever arm <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="75%">⊥</tspan> = r sin θ</text><rect x="470" y="300" width="270" height="150" rx="8" fill="#EEF1EF" stroke="#C9CFCC"/><text x="486" y="332" font-size="18" fill="#734200" font-weight="bold">τ = <tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="75%">⊥</tspan>F = rF sin θ</text><text x="486" y="362" font-size="13" fill="#1F2A28">Unit: N·m</text><text x="486" y="386" font-size="13" fill="#1F2A28">This force turns the wrench</text><text x="486" y="404" font-size="13" fill="#1F2A28">counterclockwise: positive torque.</text><text x="486" y="428" font-size="13" fill="#1F2A28">A force through the axis: τ = 0.</text>
</svg>
