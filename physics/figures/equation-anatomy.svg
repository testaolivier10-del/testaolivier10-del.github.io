<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Reading and rearranging an equation</title><desc id="d">The equation x = x-zero plus v t, with callouts: x is the position at time t in meters; x-zero, with subscript 0, is the starting position at t = 0; v is the velocity in meters per second; t is the time since the start in seconds. Below, a two-column rearrangement solves for t: x = x0 + vt; subtract x0 from both sides to get x − x0 = vt; divide both sides by v to get (x − x0)/v = t; write x − x0 as delta x, so t = delta x over v.</desc><rect width="760" height="360" fill="#ffffff"/><text x="24" y="32" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">Reading and rearranging x = x₀ + vt</text><text x="250" y="110" font-size="40" fill="#1F2A28" font-family="Georgia,Times New Roman,serif"><tspan font-style="italic">x</tspan> = <tspan font-style="italic">x</tspan><tspan font-size="24" dy="8">0</tspan><tspan dy="-8"> + </tspan><tspan font-style="italic">v t</tspan></text><line x1="262" y1="76" x2="200" y2="60" stroke="#734200" stroke-width="1.4"/><text x="194" y="64" fill="#734200" font-size="13" text-anchor="end" font-weight="normal">position at time t (m)</text><line x1="318" y1="120" x2="250" y2="150" stroke="#734200" stroke-width="1.4"/><text x="244" y="154" fill="#734200" font-size="13" text-anchor="end" font-weight="normal">starting position (m)</text><text x="244" y="168" fill="#734200" font-size="12" text-anchor="end" font-weight="normal">subscript 0 means "at t = 0"</text><line x1="397" y1="76" x2="470" y2="56" stroke="#734200" stroke-width="1.4"/><text x="476" y="60" fill="#734200" font-size="13" text-anchor="start" font-weight="normal">velocity (m/s)</text><line x1="420" y1="120" x2="480" y2="150" stroke="#734200" stroke-width="1.4"/><text x="486" y="154" fill="#734200" font-size="13" text-anchor="start" font-weight="normal">time since the start (s)</text><rect x="24" y="196" width="712" height="146" rx="8" fill="#FBEED5" stroke="#734200"/><text x="40" y="220" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="bold">Solve for t: do the same thing to both sides, one step at a time</text><text x="60" y="248" font-size="17" fill="#1F2A28" font-family="Georgia,Times New Roman,serif" font-style="italic">x = x₀ + vt</text><text x="330" y="248" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="normal">start from the equation</text><text x="60" y="274" font-size="17" fill="#1F2A28" font-family="Georgia,Times New Roman,serif" font-style="italic">x − x₀ = vt</text><text x="330" y="274" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="normal">subtract x₀ from both sides</text><text x="60" y="300" font-size="17" fill="#1F2A28" font-family="Georgia,Times New Roman,serif" font-style="italic">(x − x₀) / v = t</text><text x="330" y="300" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="normal">divide both sides by v</text><text x="60" y="326" font-size="17" fill="#1F2A28" font-family="Georgia,Times New Roman,serif" font-style="italic">t = Δx / v</text><text x="330" y="326" fill="#1F2A28" font-size="14" text-anchor="start" font-weight="normal">write x − x₀ as Δx (final minus initial)</text><line x1="315" y1="232" x2="315" y2="332" stroke="#734200" stroke-width="1"/></svg>