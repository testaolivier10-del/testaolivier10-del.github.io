<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t d" font-family="Arial,Helvetica,sans-serif"><title id="t">Proportional, inverse and square relationships</title><desc id="d">Three panels. Directly proportional, d = v t at steady speed: a car covers distance d in time t and 2d in time 2t, so doubling t doubles d. Inversely proportional, t = d over v for a fixed trip: a car at speed v needs time t, and at speed 2v needs time t over 2, so doubling v halves the time. Square relationship, A = s squared: a square of side s has area A; a square of side 2s holds four copies of the small square, so doubling s multiplies the area by 4.</desc><rect width="780" height="380" fill="#ffffff"/><text x="24" y="30" fill="#1F2A28" font-size="17" text-anchor="start" font-weight="bold">What happens when one quantity doubles?</text><rect x="18" y="46" width="245" height="316" rx="10" fill="#FBF7EE" stroke="#E2D6BC"/><text x="140.5" y="72" fill="#734200" font-size="15" text-anchor="middle" font-weight="bold">Directly proportional</text><text x="140.5" y="92" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic">d = vt, steady v</text><text x="140.5" y="350" fill="#1F2A28" font-size="14" text-anchor="middle" font-weight="bold">double t → double d</text><rect x="275" y="46" width="245" height="316" rx="10" fill="#FBF7EE" stroke="#E2D6BC"/><text x="397.5" y="72" fill="#734200" font-size="15" text-anchor="middle" font-weight="bold">Inversely proportional</text><text x="397.5" y="92" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic">t = d/v, fixed trip d</text><text x="397.5" y="350" fill="#1F2A28" font-size="14" text-anchor="middle" font-weight="bold">double v → half the time</text><rect x="532" y="46" width="245" height="316" rx="10" fill="#FBF7EE" stroke="#E2D6BC"/><text x="654.5" y="72" fill="#734200" font-size="15" text-anchor="middle" font-weight="bold">Square relationship</text><text x="654.5" y="92" fill="#1F2A28" font-size="13" text-anchor="middle" font-weight="normal" font-style="italic">A = s²</text><text x="654.5" y="350" fill="#1F2A28" font-size="14" text-anchor="middle" font-weight="bold">double s → 4 × the area</text><rect x="32" y="160" width="217" height="9" fill="#6B7075"/><line x1="32" y1="164.5" x2="249" y2="164.5" stroke="#F2E6B8" stroke-width="1.5" stroke-dasharray="10 8"/><g opacity="0.35"><path d="M38.0,155.6 L38.0,151.1 Q38.0,149.6 41.2,149.6 L50.8,149.6 L54.8,143.9 L66.0,143.9 L71.6,149.6 L76.4,150.5 Q78.0,151.4 78.0,153.5 L78.0,155.6 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M56.0,148.8 L57.2,145.0 L64.8,145.0 L68.8,148.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="76.0" y="151.4" width="1.6" height="1.7" fill="#F6D776"/><circle cx="46.8" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="46.8" cy="155.6" r="1.8" fill="#C9CDD1"/><circle cx="69.2" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="69.2" cy="155.6" r="1.8" fill="#C9CDD1"/></g><g opacity="1"><path d="M116.0,155.6 L116.0,151.1 Q116.0,149.6 119.2,149.6 L128.8,149.6 L132.8,143.9 L144.0,143.9 L149.6,149.6 L154.4,150.5 Q156.0,151.4 156.0,153.5 L156.0,155.6 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M134.0,148.8 L135.2,145.0 L142.8,145.0 L146.8,148.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="154.0" y="151.4" width="1.6" height="1.7" fill="#F6D776"/><circle cx="124.8" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="124.8" cy="155.6" r="1.8" fill="#C9CDD1"/><circle cx="147.2" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="147.2" cy="155.6" r="1.8" fill="#C9CDD1"/></g><line x1="58.0" y1="184.0" x2="125.0" y2="184.0" stroke="#A33B26" stroke-width="2.5"/><polygon points="136.0,184.0 125.0,178.5 125.0,189.5" fill="#A33B26"/><text x="97.0" y="202" fill="#A33B26" font-size="13" text-anchor="middle" font-weight=