fill="#6B7075"/><line x1="289" y1="164.5" x2="506" y2="164.5" stroke="#F2E6B8" stroke-width="1.5" stroke-dasharray="10 8"/><rect x="490" y="126" width="4" height="34" fill="#1F2A28"/><path d="M494,126 h18 l-5,6 l5,6 h-18 Z" fill="#734200"/><g opacity="1"><path d="M295.0,155.6 L295.0,151.1 Q295.0,149.6 298.2,149.6 L307.8,149.6 L311.8,143.9 L323.0,143.9 L328.6,149.6 L333.4,150.5 Q335.0,151.4 335.0,153.5 L335.0,155.6 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M313.0,148.8 L314.2,145.0 L321.8,145.0 L325.8,148.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x="333.0" y="151.4" width="1.6" height="1.7" fill="#F6D776"/><circle cx="303.8" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="303.8" cy="155.6" r="1.8" fill="#C9CDD1"/><circle cx="326.2" cy="155.6" r="4.4" fill="#2B2F33"/><circle cx="326.2" cy="155.6" r="1.8" fill="#C9CDD1"/></g><line x1="339.0" y1="130.0" x2="368.0" y2="130.0" stroke="#B07A00" stroke-width="3"/><polygon points="379.0,130.0 368.0,124.5 368.0,135.5" fill="#B07A00"/><text x="295" y="114" fill="#B07A00" font-size="12" text-anchor="start" font-weight="bold">speed v</text><rect x="305" y="182" width="150" height="10" rx="3" fill="#C9CDD1"/><text x="461" y="191" fill="#1F2A28" font-size="12" text-anchor="start" font-weight="normal">time t</text><rect x="289" y="255" width="217" height="9" fill="#6B7075"/><line x1="289" y1="259.5" x2="506" y2="259.5" stroke="#F2E6B8" stroke-width="1.5" stroke-dasharray="10 8"/><rect x="490" y="221" width="4" height="34" fill="#1F2A28"/><path d="M494,221 h18 l-5,6 l5,6 h-18 Z" fill="#734200"/><g opacity="1"><path d="M295.0,250.6 L295.0,246.1 Q295.0,244.6 298.2,244.6 L307.8,244.6 L311.8,238.9 L323.0,238.9 L328.6,244.6 L333.4,245.5 Q335.0,246.4 335.0,248.5 L335.0,250.6 Z" fill="#3E7CB1" stroke="#1F2A28" stroke-width="1.3" stroke-linejoin="round"/><path d="M313.0,243.8 L314.2,240.0 L321.8,240.0 L325.8,243.8 Z" fill="#DCEBF5" stroke="#1F2A28" stroke-width="0.8"/><rect x