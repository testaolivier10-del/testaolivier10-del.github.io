<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="particles-to-k-t particles-to-k-d">
<title id="particles-to-k-t">From a particle diagram to K</title>
<desc id="particles-to-k-d">A container at equilibrium with 4 W atoms and 4 W2 molecules in 2.0 liters, each particle standing for 0.10 mol. Step 1, count: 4 W and 4 W2. Step 2, convert: 0.40 mol divided by 2.0 L is 0.20 M for each. Step 3, substitute: Kc = [W2] over [W] squared = 0.20 over 0.20 squared = 5.0. A note warns that putting counts straight into K would give 0.25, which is wrong because the volume does not cancel when gas moles differ on the two sides.</desc>
<rect width="760" height="250" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<g transform="translate(10,20)"><text x="123" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif">At equilibrium (2.0 L)</text><rect x="18" y="40" width="210" height="140" rx="6" fill="#FFFFFF" stroke="#444" stroke-width="2"/><circle cx="47.8" cy="89.0" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="206.7" cy="96.4" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="141.3" cy="81.0" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="155.3" cy="81.0" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="95.6" cy="135.2" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="109.6" cy="135.2" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="204.1" cy="126.5" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="143.3" cy="132.8" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="157.3" cy="132.8" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="92.6" cy="81.6" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="106.6" cy="81.6" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="54.8" cy="132.6" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/></g>
<circle cx="44" cy="232" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><text x="58" y="237" font-size="13">W</text><circle cx="100" cy="232" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><circle cx="114" cy="232" r="8" fill="#009E73" stroke="#00513B" stroke-width="1.5"/><text x="128" y="237" font-size="13">W₂</text>
<text x="270" y="60" font-size="14" font-weight="700">1. Count</text><text x="270" y="80" font-size="13">4 W, 4 W₂ (each particle = 0.10 mol)</text>
<text x="270" y="112" font-size="14" font-weight="700">2. Moles, then mol/L</text><text x="270" y="132" font-size="13">0.40 mol / 2.0 L = 0.20 M for each</text>
<text x="270" y="164" font-size="14" font-weight="700">3. Substitute</text><text x="270" y="184" font-size="13">K<tspan font-size="10" dy="3">c</tspan><tspan dy="-3"> = [W₂] / [W]² = 0.20 / (0.20)² = 5.0</tspan></text>
<text x="270" y="216" font-size="12">Counts straight into K would give 4/4² = 0.25: wrong, because the volume does not cancel</text><text x="270" y="232" font-size="12">when the gas moles differ on the two sides.</text>
</g>
</svg>
