<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" aria-labelledby="t d">
<title id="t">A logarithm is an exponent</title>
<desc id="d">A number line with evenly spaced marks labeled 0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000 and 10,000. Under each is its base-10 log: minus 4, minus 3, minus 2, minus 1, 0, 1, 2, 3, 4. Arrows note that each step to the right multiplies the number by 10 and adds 1 to the log.</desc>
<rect width="680" height="200" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1B2440" text-anchor="middle">
  <line x1="30" y1="90" x2="650" y2="90" stroke="#1B2440" stroke-width="2"/>
  <g stroke="#1B2440" stroke-width="2">
    <line x1="60" y1="80" x2="60" y2="100"/><line x1="130" y1="80" x2="130" y2="100"/><line x1="200" y1="80" x2="200" y2="100"/>
    <line x1="270" y1="80" x2="270" y2="100"/><line x1="340" y1="80" x2="340" y2="100"/><line x1="410" y1="80" x2="410" y2="100"/>
    <line x1="480" y1="80" x2="480" y2="100"/><line x1="550" y1="80" x2="550" y2="100"/><line x1="620" y1="80" x2="620" y2="100"/>
  </g>
  <g font-size="15">
    <text x="60" y="70">0.0001</text><text x="130" y="70">0.001</text><text x="200" y="70">0.01</text><text x="270" y="70">0.1</text>
    <text x="340" y="70">1</text><text x="410" y="70">10</text><text x="480" y="70">100</text><text x="550" y="70">1000</text><text x="620" y="70">10,000</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#1D44A6">
    <text x="60" y="124">−4</text><text x="130" y="124">−3</text><text x="200" y="124">−2</text><text x="270" y="124">−1</text>
    <text x="340" y="124">0</text><text x="410" y="124">1</text><text x="480" y="124">2</text><text x="550" y="124">3</text><text x="620" y="124">4</text>
  </g>
  <text x="20" y="70" font-size="13" text-anchor="start" fill="#3A4560"> </text>
  <text x="340" y="30" font-size="15">number</text>
  <text x="340" y="150" font-size="15" fill="#1D44A6">log of the number</text>
  <path d="M415 168 h120" stroke="#C2410C" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/></marker></defs>
  <text x="475" y="190" font-size="14" fill="#C2410C">× 10 in the number = + 1 in the log</text>
  <text x="165" y="190" font-size="14" fill="#3A4560">numbers below 1 have negative logs</text>
</g>
</svg>
