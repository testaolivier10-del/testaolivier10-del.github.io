<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="pka-ladder-t pka-ladder-d">
<title id="pka-ladder-t">Which form predominates: compare pH with pKa</title>
<desc id="pka-ladder-d">A horizontal pH axis from 0 to 14 for an acid with pKa 4.7. Left of pKa the protonated form HA predominates; right of pKa the deprotonated form A minus predominates; at pH equal to pKa they are equal. Bars show the ratio of A minus to HA as 1 to 10 at pKa minus 1, 1 to 1 at pKa, 10 to 1 at pKa plus 1. Below, an indicator HIn with pKa 9.3 changes color between about pH 8.3 and 10.3.</desc>
<defs><linearGradient id="g"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E7298A"/></linearGradient><marker id="pka-ladder-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><line x1="50" y1="120" x2="710" y2="120" stroke="#333" stroke-width="2"/><line x1="50" y1="115" x2="50" y2="125" stroke="#333"/><text x="50" y="142" font-size="12" text-anchor="middle" >0</text><line x1="97.14285714285714" y1="115" x2="97.14285714285714" y2="125" stroke="#333"/><text x="97.14285714285714" y="142" font-size="12" text-anchor="middle" >1</text><line x1="144.28571428571428" y1="115" x2="144.28571428571428" y2="125" stroke="#333"/><text x="144.28571428571428" y="142" font-size="12" text-anchor="middle" >2</text><line x1="191.42857142857142" y1="115" x2="191.42857142857142" y2="125" stroke="#333"/><text x="191.42857142857142" y="142" font-size="12" text-anchor="middle" >3</text><line x1="238.57142857142856" y1="115" x2="238.57142857142856" y2="125" stroke="#333"/><text x="238.57142857142856" y="142" font-size="12" text-anchor="middle" >4</text><line x1="285.7142857142857" y1="115" x2="285.7142857142857" y2="125" stroke="#333"/><text x="285.7142857142857" y="142" font-size="12" text-anchor="middle" >5</text><line x1="332.85714285714283" y1="115" x2="332.85714285714283" y2="125" stroke="#333"/><text x="332.85714285714283" y="142" font-size="12" text-anchor="middle" >6</text><line x1="380" y1="115" x2="380" y2="125" stroke="#333"/><text x="380" y="142" font-size="12" text-anchor="middle" >7</text><line x1="427.1428571428571" y1="115" x2="427.1428571428571" y2="125" stroke="#333"/><text x="427.1428571428571" y="142" font-size="12" text-anchor="middle" >8</text><line x1="474.28571428571433" y1="115" x2="474.28571428571433" y2="125" stroke="#333"/><text x="474.28571428571433" y="142" font-size="12" text-anchor="middle" >9</text><line x1="521.4285714285714" y1="115" x2="521.4285714285714" y2="125" stroke="#333"/><text x="521.4285714285714" y="142" font-size="12" text-anchor="middle" >10</text><line x1="568.5714285714286" y1="115" x2="568.5714285714286" y2="125" stroke="#333"/><text x="568.5714285714286" y="142" font-size="12" text-anchor="middle" >11</text><line x1="615.7142857142857" y1="115" x2="615.7142857142857" y2="125" stroke="#333"/><text x="615.7142857142857" y="142" font-size="12" text-anchor="middle" >12</text><line x1="662.8571428571429" y1="115" x2="662.8571428571429" y2="125" stroke="#333"/><text x="662.8571428571429" y="142" font-size="12" text-anchor="middle" >13</text><line x1="710" y1="115" x2="710" y2="125" stroke="#333"/><text x="710" y="142" font-size="12" text-anchor="middle" >14</text><line x1="271.57142857142856" y1="60" x2="271.57142857142856" y2="125" stroke="#D55E00" stroke-width="2.5"/><text x="271.57142857142856" y="52" font-size="13" text-anchor="middle" font-weight="700">pKa = 4.7</text><rect x="50" y="80" width="221.57142857142856" height="28" fill="#E69F00" opacity="0.6"/><text x="160.78571428571428" y="99" font-size="13" text-anchor="middle" font-weight="700">pH &lt; pKa: HA predominates</text><rect x="271.57142857142856" y="80" width="438.42857142857144" height="28" fill="#56B4E9" opacity="0.6"/><text x="488.4285714285715" y="99" font-size="13" text-anchor="middle" font-weight="700">pH &gt; pKa: A⁻ predominates</text><text x="224.42857142857144" y="168" font-size="12" text-anchor="middle" >pH 3.7: [A⁻] : [HA] = 1 : 10</text><text x="271.57142857142856" y="168" font-size="12" text-anchor="middle" >pH 4.7: [A⁻] : [HA] = 1 : 1</text><text x="318.7142857142857" y="168" font-size="12" text-anchor="middle" >pH 5.7: [A⁻] : [HA] = 10 : 1</text><rect x="441.2857142857143" y="200" width="94.28571428571439" height="30" fill="url(#g)" stroke="#333"/><line x1="50" y1="215" x2="441.2857142857143" y2="215" stroke="#bbb" stroke-width="6"/><line x1="535.5714285714287" y1="215" x2="710" y2="215" stroke="#E7298A" stroke-width="6"/><text x="488.4285714285715" y="250" font-size="13" text-anchor="middle" font-weight="700">indicator HIn, pKa 9.3: color changes from about pH 8.3 to 10.3</text><text x="380" y="280" font-size="13" text-anchor="middle" >An indicator changes color over about pKa ± 1. Choose one whose range contains the equivalence-point pH.</text><text x="380" y="306" font-size="13" text-anchor="middle" >Each pH unit away from pKa changes the ratio of the two forms tenfold.</text></g></svg>
