<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">How the sign of ΔG° sets the size of K</title>
<desc id="d">Two matched scales. The top scale runs from large negative ΔG° on the left, through zero in the middle, to large positive ΔG° on the right. The bottom scale shows K at 298 K: K is much greater than 1 on the left, exactly 1 under ΔG° equal to zero, and much less than 1 on the right. Sample pairs: ΔG° of minus 20 kilojoules per mole gives K about 3 thousand; ΔG° of plus 20 kilojoules per mole gives K about 3 times 10 to the minus 4. Left side: products favored at equilibrium. Right side: reactants favored.</desc>
<defs><marker id="dk-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="60" y="40" width="320" height="200" fill="#D9F2E6"/><rect x="380" y="40" width="320" height="200" fill="#F8D9CC"/>
<line x1="60" y1="100" x2="700" y2="100" stroke="#1F2A28" stroke-width="3" marker-start="url(#dk-a)" marker-end="url(#dk-a)"/>
<line x1="60" y1="185" x2="700" y2="185" stroke="#1F2A28" stroke-width="3" marker-start="url(#dk-a)" marker-end="url(#dk-a)"/>
<line x1="380" y1="40" x2="380" y2="240" stroke="#1F2A28" stroke-width="2" stroke-dasharray="6 4"/>
<g font-size="16" font-weight="700" text-anchor="middle"><text x="380" y="30">ΔG° = 0, K = 1</text></g>
<g font-size="15" text-anchor="middle">
<text x="220" y="85">ΔG° &lt; 0</text><text x="540" y="85">ΔG° &gt; 0</text>
<text x="220" y="170">K &gt; 1</text><text x="540" y="170">K &lt; 1</text>
</g>
<g stroke="#1F2A28" stroke-width="2"><line x1="160" y1="92" x2="160" y2="108"/><line x1="600" y1="92" x2="600" y2="108"/><line x1="160" y1="177" x2="160" y2="193"/><line x1="600" y1="177" x2="600" y2="193"/></g>
<g font-size="13" text-anchor="middle"><text x="160" y="125">−20 kJ/mol</text><text x="600" y="125">+20 kJ/mol</text><text x="160" y="210">K ≈ 3 × 10³</text><text x="600" y="210">K ≈ 3 × 10⁻⁴</text></g>
<g font-size="15" font-weight="700" text-anchor="middle"><text x="220" y="268">products favored</text><text x="540" y="268">reactants favored</text></g>
<text x="380" y="292" font-size="13" text-anchor="middle" fill="#3D4A66">values at 298 K, from ΔG° = −RT ln K</text>
</g></svg>
