<title id="buffer-limits-curves-t">Buffer capacity: a concentrated and a dilute buffer</title>
<desc id="buffer-limits-curves-d">pH against moles of sodium hydroxide added to two 1.00 L buffers with pKa 4.74. Both start at pH 4.74. The dilute buffer, 0.0200 mol each of HA and A minus, holds its pH only until about 0.02 mol of base is added, then the pH shoots up. The concentrated buffer, 0.100 mol of each, holds its pH until about 0.10 mol, five times as much.</desc>
