<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="pm-t pm-d"><title id="pm-t">A liquid and its vapor in a closed flask</title><desc id="pm-d">Two closed flasks of the same liquid at the same temperature. Left, just after the liquid is added: three orange arrows show molecules escaping the surface, one green arrow shows a molecule returning, and only a few molecules are in the gas above. Right, later, at dynamic equilibrium: three arrows up and three arrows down, so escape and return happen at equal rates, and more molecules are in the gas. The pressure of the gas at equilibrium is the vapor pressure.</desc><defs><marker id="pm-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D55E00"/></marker><marker id="pm-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#009E73"/></marker></defs><rect width="640" height="300" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><text x="150" y="26" font-size="14" font-weight="700" text-anchor="middle">1. Just sealed</text><rect x="40" y="40" width="220" height="200" rx="8" fill="#ffffff" stroke="#5D6B79" stroke-width="2"/><rect x="41" y="170" width="218" height="69" fill="#D7E6F7"/><circle cx="57" cy="186" r="7" fill="#0072B2"/><circle cx="80" cy="186" r="7" fill="#0072B2"/><circle cx="103" cy="186" r="7" fill="#0072B2"/><circle cx="126" cy="186" r="7" fill="#0072B2"/><circle cx="149" cy="186" r="7" fill="#0072B2"/><circle cx="172" cy="186" r="7" fill="#0072B2"/><circle cx="195" cy="186" r="7" fill="#0072B2"/><circle cx="218" cy="186" r="7" fill="#0072B2"/><circle cx="241" cy="186" r="7" fill="#0072B2"/><circle cx="65" cy="212" r="7" fill="#0072B2"/><circle cx="88" cy="212" r="7" fill="#0072B2"/><circle cx="111" cy="212" r="7" fill="#0072B2"/><circle cx="134" cy="212" r="7" fill="#0072B2"/><circle cx="157" cy="212" r="7" fill="#0072B2"/><circle cx="180" cy="212" r="7" fill="#0072B2"/><circle cx="203" cy="212" r="7" fill="#0072B2"/><circle cx="226" cy="212" r="7" fill="#0072B2"/><circle cx="249" cy="212" r="7" fill="#0072B2"/><circle cx="60" cy="58" r="7" fill="#0072B2"/><circle cx="113" cy="95" r="7" fill="#0072B2"/><circle cx="166" cy="60" r="7" fill="#0072B2"/><line x1="70" y1="166" x2="70" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="110" y1="166" x2="110" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="150" y1="166" x2="150" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="230" y1="140" x2="230" y2="166" stroke="#009E73" stroke-width="2.5" marker-end="url(#pm-b)"/><text x="150" y="262" font-size="12" text-anchor="middle">escape faster than return; gas pressure rising</text><text x="470" y="26" font-size="14" font-weight="700" text-anchor="middle">2. Later: dynamic equilibrium</text><rect x="360" y="40" width="220" height="200" rx="8" fill="#ffffff" stroke="#5D6B79" stroke-width="2"/><rect x="361" y="170" width="218" height="69" fill="#D7E6F7"/><circle cx="377" cy="186" r="7" fill="#0072B2"/><circle cx="400" cy="186" r="7" fill="#0072B2"/><circle cx="423" cy="186" r="7" fill="#0072B2"/><circle cx="446" cy="186" r="7" fill="#0072B2"/><circle cx="469" cy="186" r="7" fill="#0072B2"/><circle cx="492" cy="186" r="7" fill="#0072B2"/><circle cx="515" cy="186" r="7" fill="#0072B2"/><circle cx="538" cy="186" r="7" fill="#0072B2"/><circle cx="561" cy="186" r="7" fill="#0072B2"/><circle cx="385" cy="212" r="7" fill="#0072B2"/><circle cx="408" cy="212" r="7" fill="#0072B2"/><circle cx="431" cy="212" r="7" fill="#0072B2"/><circle cx="454" cy="212" r="7" fill="#0072B2"/><circle cx="477" cy="212" r="7" fill="#0072B2"/><circle cx="500" cy="212" r="7" fill="#0072B2"/><circle cx="523" cy="212" r="7" fill="#0072B2"/><circle cx="546" cy="212" r="7" fill="#0072B2"/><circle cx="569" cy="212" r="7" fill="#0072B2"/><circle cx="380" cy="58" r="7" fill="#0072B2"/><circle cx="433" cy="95" r="7" fill="#0072B2"/><circle cx="486" cy="60" r="7" fill="#0072B2"/><circle cx="539" cy="97" r="7" fill="#0072B2"/><circle cx="402" cy="62" r="7" fill="#0072B2"/><circle cx="455" cy="99" r="7" fill="#0072B2"/><circle cx="508" cy="64" r="7" fill="#0072B2"/><circle cx="561" cy="101" r="7" fill="#0072B2"/><circle cx="424" cy="66" r="7" fill="#0072B2"/><line x1="390" y1="166" x2="390" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="430" y1="166" x2="430" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="470" y1="166" x2="470" y2="140" stroke="#D55E00" stroke-width="2.5" marker-end="url(#pm-a)"/><line x1="550" y1="140" x2="550" y2="166" stroke="#009E73" stroke-width="2.5" marker-end="url(#pm-b)"/><line x1="510" y1="140" x2="510" y2="166" stroke="#009E73" stroke-width="2.5" marker-end="url(#pm-b)"/><line x1="470" y1="140" x2="470" y2="166" stroke="#009E73" stroke-width="2.5" marker-end="url(#pm-b)"/><text x="470" y="262" font-size="12" text-anchor="middle">escape rate = return rate; pressure = vapor pressure</text><text x="320" y="290" font-size="12" text-anchor="middle">Key: blue circle, a molecule; orange arrow, evaporation; green arrow, condensation.</text></g></svg>