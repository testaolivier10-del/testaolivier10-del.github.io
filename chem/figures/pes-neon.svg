<svg viewBox="0 0 640 220" width="640" height="220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Photoelectron spectrum of neon</title><desc id="d">Binding energy in MJ/mol on a stretched scale, decreasing to the right. Three peaks: 1s at 84.0 MJ/mol with relative height 2, 2s at 4.68 MJ/mol with height 2, and 2p at 2.08 MJ/mol with height 6.</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><line x1="50" y1="160" x2="620" y2="160" stroke="#1B2440" stroke-width="2"/><text x="50" y="55" font-size="16" font-weight="bold" fill="#1B2440">Neon, 1s² 2s² 2p⁶</text><rect x="138.3" y="126.7" width="10" height="33.3" fill="#1D44A6"/><text x="143.3" y="120.7" text-anchor="middle" font-size="13" fill="#1B2440">1s: 84.0</text><rect x="449.0" y="126.7" width="10" height="33.3" fill="#1D44A6"/><text x="454.0" y="120.7" text-anchor="middle" font-size="13" fill="#1B2440">2s: 4.68</text><rect x="536.2" y="60.0" width="10" height="100.0" fill="#1D44A6"/><text x="541.2" y="54.0" text-anchor="middle" font-size="13" fill="#1B2440">2p: 2.08</text><line x1="124.6" y1="160" x2="124.6" y2="166" stroke="#1B2440"/><text x="124.6" y="180" text-anchor="middle" font-size="12" fill="#3A4560">100</text><line x1="254.1" y1="160" x2="254.1" y2="166" stroke="#1B2440"/><text x="254.1" y="180" text-anchor="middle" font-size="12" fill="#3A4560">30</text><line x1="372.3" y1="160" x2="372.3" y2="166" stroke="#1B2440"/><text x="372.3" y="180" text-anchor="middle" font-size="12" fill="#3A4560">10</text><line x1="501.8" y1="160" x2="501.8" y2="166" stroke="#1B2440"/><text x="501.8" y="180" text-anchor="middle" font-size="12" fill="#3A4560">3</text><line x1="620.0" y1="160" x2="620.0" y2="166" stroke="#1B2440"/><text x="620.0" y="180" text-anchor="middle" font-size="12" fill="#3A4560">1</text><text x="335" y="212" text-anchor="middle" font-size="14" fill="#1B2440">Binding energy (MJ/mol), stretched scale, decreasing to the ri