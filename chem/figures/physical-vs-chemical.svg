<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 340" width="810" height="340" role="img" aria-labelledby="physical-vs-chemical-t physical-vs-chemical-d">
<title id="physical-vs-chemical-t">Physical and chemical change at the particle level</title>
<desc id="physical-vs-chemical-d">Left, physical change: a box of eight closely packed water molecules becomes a box of the same eight water molecules far apart, still H₂O; attractions between molecules are overcome, about 41 kJ per mole. Right, chemical change: four water molecules become four hydrogen molecules and two oxygen molecules; O–H bonds inside the molecules break and new bonds form. The question to ask is whether the particles after are the same as the particles before.</desc>
