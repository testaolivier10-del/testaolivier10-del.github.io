<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="strong-ionization-t strong-ionization-d">
<title id="strong-ionization-t">Strong acids ionize completely; mixing finds the leftover</title>
<desc id="strong-ionization-d">Left: a box labelled before shows four HCl molecules; an arrow leads to a box labelled in water showing four hydronium ions and four chloride ions and no HCl molecules. Right: a mixing calculation. 0.0050 mol of hydronium from the acid meets 0.0030 mol of hydroxide from sodium hydroxide; they react one to one, leaving 0.0020 mol of hydronium in 0.0500 L of solution, so the hydronium concentration is 0.040 M and the pH is 1.40.</desc>
<defs><marker id="strong-ionization-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="20" y="40" width="150" height="150" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="95" y="30" font-size="12" text-anchor="middle" font-weight="700">HCl before mixing with water</text><circle cx="51" cy="80" r="10" fill="#fff" stroke="#333"/><circle cx="69" cy="80" r="14" fill="#CC79A7" stroke="#333"/><text x="51" y="84" font-size="10" text-anchor="middle" font-weight="700">H</text><text x="69" y="84" font-size="10" text-anchor="middle" font-weight="700">Cl</text><circle cx="121" cy="90" r="10" fill="#fff" stroke="#333"/><circle cx="139" cy="90" r="14" fill="#CC79A7" stroke="#333"/><text x="121" y="94" font-size="10" text-anchor="middle" font-weight="700">H</text><text x="139" y="94" font-size="10" text-anchor="middle" font-weight="700">Cl</text><circle cx="61" cy="150" r="10" fill="#fff" stroke="#333"/><circle cx="79" cy="150" r="14" fill="#CC79A7" stroke="#333"/><text x="61" y="154" font-size="10" text-anchor="middle" font-weight="700">H</text><text x="79" y="154" font-size="10" text-anchor="middle" font-weight="700">Cl</text><circle cx="126" cy="160" r="10" fill="#fff" stroke="#333"/><circle cx="144" cy="160" r="14" fill="#CC79A7" stroke="#333"/><text x="126" y="164" font-size="10" text-anchor="middle" font-weight="700">H</text><text x="144" y="164" font-size="10" text-anchor="middle" font-weight="700">Cl</text><line x1="180" y1="115" x2="230" y2="115" stroke="#1F2A28" stroke-width="2" marker-end="url(#strong-ionization-a)"/><rect x="240" y="40" width="190" height="150" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="335" y="30" font-size="12" text-anchor="middle" font-weight="700">In water: 100% ionized</text><circle cx="270" cy="75" r="18" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="270" y="79" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="340" cy="70" r="18" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="340" y="74" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="400" cy="90" r="18" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="400" y="94" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="290" cy="140" r="18" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="290" y="144" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="310" cy="105" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="310" y="109" font-size="11" font-weight="700" text-anchor="middle">Cl⁻</text><circle cx="390" cy="130" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="390" y="134" font-size="11" font-weight="700" text-anchor="middle">Cl⁻</text><circle cx="270" cy="175" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="270" y="179" font-size="11" font-weight="700" text-anchor="middle">Cl⁻</text><circle cx="410" cy="170" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="410" y="174" font-size="11" font-weight="700" text-anchor="middle">Cl⁻</text><text x="225" y="220" font-size="13" text-anchor="middle" >No HCl molecules remain, so [H₃O⁺] equals the acid concentration.</text><rect x="460" y="40" width="280" height="250" rx="10" fill="#F3F6FC" stroke="#1D44A6" stroke-width="1.5"/><text x="474" y="70" font-size="14" font-weight="700">Mixing a strong acid and a strong base</text><text x="474" y="98" font-size="13" >50.0 mL total: 0.0050 mol H₃O⁺</text><text x="474" y="126" font-size="13" >and 0.0030 mol OH⁻</text><text x="474" y="154" font-size="13" >H₃O⁺ + OH⁻ → 2 H₂O (goes to completion)</text><text x="474" y="182" font-size="13" >Left over: 0.0020 mol H₃O⁺</text><text x="474" y="210" font-size="13" >[H₃O⁺] = 0.0020 mol / 0.0500 L</text><text x="474" y="238" font-size="13" >            = 0.040 M</text><text x="474" y="266" font-size="13" font-weight="700">pH = −log(0.040) = 1.40</text><text x="225" y="260" font-size="12" text-anchor="middle" >Key: H₃O⁺ hydronium; Cl⁻ chloride; H–Cl a whole molecule.</text><text x="225" y="290" font-size="12" text-anchor="middle" >Water molecules are not drawn.</text></g></svg>
