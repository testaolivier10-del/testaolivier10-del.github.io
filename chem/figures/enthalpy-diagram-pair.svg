<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Energy diagrams for an exothermic and an endothermic reaction</title>
<desc id="d">Two energy diagrams with enthalpy on the vertical axis and progress of the reaction on the horizontal axis. Left: the products sit lower than the reactants, so the arrow for delta H points down and delta H is negative. Right: the products sit higher, the arrow points up and delta H is positive. In both, the hump above the reactants is the activation energy, Ea.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1D44A6"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<line x1="50" y1="320" x2="340" y2="320" stroke="#1F2A28" stroke-width="2"/><line x1="50" y1="320" x2="50" y2="50" stroke="#1F2A28" stroke-width="2"/>
<text x="195" y="345" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Progress of the reaction →</text>
<text transform="translate(30,185) rotate(-90)" font-size="14" text-anchor="middle">Enthalpy, H →</text>
<path d="M60,210 L110,210 C150,210 170,90 195,90 C220,90 240,280 280,280 L330,280" fill="none" stroke="#1F2A28" stroke-width="3"/>
<text x="85" y="200" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Reactants</text>
<text x="290" y="302" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Products</text>
<line x1="110" y1="210" x2="345" y2="210" stroke="#5D6B69" stroke-dasharray="5 5"/><line x1="315" y1="210" x2="315" y2="283" stroke="#C2410C" stroke-width="3" marker-end="url(#ah)"/>
<text x="322" y="250.0" font-size="15" text-anchor="start" font-weight="bold" fill="#C2410C">ΔH &lt; 0</text>
<line x1="120" y1="90" x2="195" y2="90" stroke="#5D6B69" stroke-dasharray="4 4"/><line x1="125" y1="210" x2="125" y2="94" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/>
<text x="132" y="150.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Ea</text>
<text x="195" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#1F2A28">Exothermic: products lower</text>
<line x1="430" y1="320" x2="720" y2="320" stroke="#1F2A28" stroke-width="2"/><line x1="430" y1="320" x2="430" y2="50" stroke="#1F2A28" stroke-width="2"/>
<text x="575" y="345" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Progress of the reaction →</text>
<text transform="translate(410,185) rotate(-90)" font-size="14" text-anchor="middle">Enthalpy, H →</text>
<path d="M440,270 L490,270 C530,270 550,90 575,90 C600,90 620,170 660,170 L710,170" fill="none" stroke="#1F2A28" stroke-width="3"/>
<text x="465" y="260" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">Reactants</text>
<text x="725" y="160" font-size="14" text-anchor="end" font-weight="normal" fill="#1F2A28">Products</text>
<line x1="490" y1="270" x2="725" y2="270" stroke="#5D6B69" stroke-dasharray="5 5"/><line x1="695" y1="270" x2="695" y2="167" stroke="#1D44A6" stroke-width="3" marker-end="url(#ac)"/>
<text x="688" y="235.0" font-size="15" text-anchor="end" font-weight="bold" fill="#1D44A6">ΔH &gt; 0</text>
<line x1="500" y1="90" x2="575" y2="90" stroke="#5D6B69" stroke-dasharray="4 4"/><line x1="505" y1="270" x2="505" y2="94" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/>
<text x="512" y="180.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">Ea</text>
<text x="575" y="30" font-size="17" text-anchor="middle" font-weight="bold" fill="#1F2A28">Endothermic: products higher</text>
</g>
</svg>
