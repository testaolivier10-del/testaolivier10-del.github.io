"432" cy="99" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="300" cy="145" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="288" cy="154" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="312" cy="154" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="370" cy="140" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="358" cy="149" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="382" cy="149" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="430" cy="160" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="418" cy="169" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="442" cy="169" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><text x="355" y="272" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#1B2440">Compound</text><rect x="475" y="40" width="220" height="210" rx="8" fill="#ffffff" stroke="#555" stroke-width="2"/><circle cx="506" cy="80" r="11" fill="#0072B2" stroke="#003f63" stroke-width="1.5"/><circle cx="524" cy="80" r="11" fill="#0072B2" stroke="#003f63" stroke-width="1.5"/><circle cx="576" cy="75" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="594" cy="75" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="650" cy="90" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="638" cy="99" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="662" cy="99" r="6" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/><circle cx="521" cy="145" r="11" fill="#0072B2" stroke="#003f63" stroke-width="1.5"/><circle cx="539" cy="145" r="11" fill="#0072B2" stroke="#003f63" stroke-width="1.5"/><circle cx="600" cy="140" r="12" fill="#CC79A7" stroke="#7a3f63" stroke-width="1.5"/><circle cx="651" cy="160" r="11" fill="#D55E00" stroke="#7a3300" stroke-width="1.5"/><circle cx="669" cy="160" r="11" fill="#D