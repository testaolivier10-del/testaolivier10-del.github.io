<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 335" width="710" height="335" role="img" aria-labelledby="t d">
<title id="t">Element, compound and mixture at the particle level</title>
<desc id="d">Three boxes. The first holds six identical molecules each made of two nitrogen atoms: an element. The second holds six identical water molecules, each one oxygen atom and two hydrogen atoms: a compound. The third holds nitrogen molecules, oxygen molecules, a water molecule and an argon atom: a mixture. A key gives blue for nitrogen, orange for oxygen, white for hydrogen and pink for argon.</desc>
<rect width="710" height="335" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1B2440"><text x="355" y="24" text-anchor="middle" font-size="16" font-weight="bold">Pure substances (left two) and a mixture (right)</text></g>
