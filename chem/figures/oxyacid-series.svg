<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="oxyacid-series-t oxyacid-series-d">
<title id="oxyacid-series-t">Acid strength rises as the conjugate base gets more stable</title>
<desc id="oxyacid-series-d">Four chlorine oxyacids in a row: HOCl, HOClO, HOClO2 and HOClO3, with Ka values 3.0 times ten to the minus 8, 1.1 times ten to the minus 2, greater than 1, and much greater than 1 (both strong). Each extra oxygen atom pulls electron density away from the O–H bond and spreads the negative charge of the conjugate base over more oxygen atoms by resonance, so the conjugate base is more stable and the acid is stronger. Below, a second comparison: HOI, HOBr and HOCl, where a more electronegative central atom gives a stronger acid.</desc>
<defs><marker id="oxyacid-series-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="30" y="40" width="160" height="150" rx="10" fill="#FFF4E0" stroke="#B26B00"/><text x="110" y="70" font-size="17" text-anchor="middle" font-weight="700">HOCl</text><text x="110" y="100" font-size="13" text-anchor="middle" >H–O–Cl</text><text x="110" y="132" font-size="13" text-anchor="middle" >Ka = 3.0 × 10⁻⁸</text><text x="110" y="162" font-size="12" text-anchor="middle" >anion: charge on 1 O</text><rect x="210" y="40" width="160" height="150" rx="10" fill="#FDE7C8" stroke="#B26B00"/><text x="290" y="70" font-size="17" text-anchor="middle" font-weight="700">HOClO</text><text x="290" y="100" font-size="13" text-anchor="middle" >H–O–Cl=O</text><text x="290" y="132" font-size="13" text-anchor="middle" >Ka = 1.1 × 10⁻²</text><text x="290" y="162" font-size="12" text-anchor="middle" >anion: spread over 2 O</text><rect x="390" y="40" width="160" height="150" rx="10" fill="#F9D3A7" stroke="#B26B00"/><text x="470" y="70" font-size="17" text-anchor="middle" font-weight="700">HOClO₂</text><text x="470" y="100" font-size="13" text-anchor="middle" >H–O–ClO₂</text><text x="470" y="132" font-size="13" text-anchor="middle" >Ka = &gt; 1 (strong)</text><text x="470" y="162" font-size="12" text-anchor="middle" >anion: spread over 3 O</text><rect x="570" y="40" width="160" height="150" rx="10" fill="#F4BC85" stroke="#B26B00"/><text x="650" y="70" font-size="17" text-anchor="middle" font-weight="700">HOClO₃</text><text x="650" y="100" font-size="13" text-anchor="middle" >H–O–ClO₃</text><text x="650" y="132" font-size="13" text-anchor="middle" >Ka = ≫ 1 (strong)</text><text x="650" y="162" font-size="12" text-anchor="middle" >anion: spread over 4 O</text><line x1="60" y1="215" x2="700" y2="215" stroke="#1F2A28" stroke-width="2" marker-end="url(#oxyacid-series-a)"/><text x="380" y="240" font-size="13" text-anchor="middle" font-weight="700">more O atoms → more electron density pulled from O–H → conjugate base more stable → stronger acid</text><rect x="110" y="265" width="170" height="70" rx="10" fill="#E8F1FA" stroke="#0072B2"/><text x="195" y="290" font-size="13" text-anchor="middle" font-weight="700">HOI  (I: EN 2.7)</text><text x="195" y="318" font-size="13" text-anchor="middle" >Ka = 2.3 × 10⁻¹¹</text><rect x="300" y="265" width="170" height="70" rx="10" fill="#E8F1FA" stroke="#0072B2"/><text x="385" y="290" font-size="13" text-anchor="middle" font-weight="700">HOBr  (Br: EN 3.0)</text><text x="385" y="318" font-size="13" text-anchor="middle" >Ka = 2.0 × 10⁻⁹</text><rect x="490" y="265" width="170" height="70" rx="10" fill="#E8F1FA" stroke="#0072B2"/><text x="575" y="290" font-size="13" text-anchor="middle" font-weight="700">HOCl  (Cl: EN 3.2)</text><text x="575" y="318" font-size="13" text-anchor="middle" >Ka = 3.0 × 10⁻⁸</text><text x="20" y="350" font-size="12" >Same structure, more electronegative central atom → stronger acid. EN = electronegativity (Pauling).</text></g></svg>
