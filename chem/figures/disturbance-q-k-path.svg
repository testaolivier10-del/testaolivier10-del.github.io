<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="disturbance-q-k-path-t disturbance-q-k-path-d">
<title id="disturbance-q-k-path-t">Disturbance to new equilibrium</title>
<desc id="disturbance-q-k-path-d">Four boxes in a row joined by arrows. At equilibrium, Q equals K. A disturbance makes Q not equal to K. Compare Q with K: if Q is less than K the net reaction goes forward, if greater it goes in reverse. New equilibrium: Q equals K again with new amounts. A note says a concentration or volume change moves Q while K stays fixed, and a temperature change moves K while Q stays fixed. A model justification reads: adding H2 makes Q less than K, so the net reaction proceeds forward until Q equals K.</desc>
<rect width="760" height="260" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="26" font-size="15" font-weight="700" text-anchor="middle">From a disturbance back to equilibrium</text>
<text x="380" y="50" font-size="13" text-anchor="middle">concentration or volume change: Q moves, K stays · temperature change: K moves, Q stays</text>
<rect x="10" y="70" width="160" height="96" rx="10" fill="#E7F4EE" stroke="#1D44A6" stroke-width="2"/><text x="90" y="102" font-size="14" font-weight="700" text-anchor="middle">At equilibrium</text><text x="90" y="120" font-size="14" font-weight="700" text-anchor="middle"></text><text x="90" y="144" font-size="12" text-anchor="middle">Q = K</text><text x="90" y="160" font-size="12" text-anchor="middle"></text><line x1="172" y1="118" x2="196" y2="118" stroke="#333" stroke-width="3"/><path d="M196,110 l12,8 l-12,8 z" fill="#333"/>
<rect x="206" y="70" width="160" height="96" rx="10" fill="#FFF4D6" stroke="#1D44A6" stroke-width="2"/><text x="286" y="102" font-size="14" font-weight="700" text-anchor="middle">Disturbance</text><text x="286" y="120" font-size="14" font-weight="700" text-anchor="middle"></text><text x="286" y="144" font-size="12" text-anchor="middle">Q ≠ K</text><text x="286" y="160" font-size="12" text-anchor="middle"></text><line x1="368" y1="118" x2="392" y2="118" stroke="#333" stroke-width="3"/><path d="M392,110 l12,8 l-12,8 z" fill="#333"/>
<rect x="402" y="70" width="160" height="96" rx="10" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="482" y="102" font-size="14" font-weight="700" text-anchor="middle">Compare</text><text x="482" y="120" font-size="14" font-weight="700" text-anchor="middle">Q with K</text><text x="482" y="144" font-size="12" text-anchor="middle">Q < K: forward</text><text x="482" y="160" font-size="12" text-anchor="middle">Q > K: reverse</text><line x1="564" y1="118" x2="588" y2="118" stroke="#333" stroke-width="3"/><path d="M588,110 l12,8 l-12,8 z" fill="#333"/>
<rect x="598" y="70" width="160" height="96" rx="10" fill="#E7F4EE" stroke="#1D44A6" stroke-width="2"/><text x="678" y="102" font-size="14" font-weight="700" text-anchor="middle">New equilibrium</text><text x="678" y="120" font-size="14" font-weight="700" text-anchor="middle"></text><text x="678" y="144" font-size="12" text-anchor="middle">Q = K again</text><text x="678" y="160" font-size="12" text-anchor="middle">(new amounts)</text>
<text x="380" y="210" font-size="13" text-anchor="middle">Justify with the comparison: "Adding H₂ makes Q &lt; K, so the net reaction proceeds forward until Q = K."</text>
<text x="380" y="232" font-size="13" text-anchor="middle">Never: "K changes because H₂ was added", and not rate language alone.</text>
</g>
</svg>
