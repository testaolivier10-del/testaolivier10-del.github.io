<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="q-vs-k-line-t q-vs-k-line-d">
<title id="q-vs-k-line-t">Q compared with K</title>
<desc id="q-vs-k-line-d">A number line for Q starting at Q = 0 (no products) on the left and increasing to the right. K is marked in the middle. To the left of K, Q is less than K and an arrow points right toward K: the net reaction goes forward, products form and Q rises. To the right of K, Q is greater than K and an arrow points left toward K: the net reaction goes in reverse, reactants form and Q falls. At K, Q equals K and there is no net change.</desc>
<rect width="760" height="250" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="26" font-size="15" font-weight="700" text-anchor="middle">Compare Q with K to find the direction of the net reaction</text>
<line x1="60" y1="120" x2="700" y2="120" stroke="#333" stroke-width="3"/>
<path d="M700,112 l14,8 l-14,8 z" fill="#333"/>
<text x="60" y="146" font-size="13" text-anchor="middle">Q = 0</text>
<text x="60" y="162" font-size="12" text-anchor="middle">(no products)</text>
<text x="700" y="146" font-size="13" text-anchor="end">larger Q: more products</text>
<line x1="380" y1="92" x2="380" y2="148" stroke="#1F2A28" stroke-width="4"/>
<text x="380" y="80" font-size="16" font-weight="700" text-anchor="middle">K</text>
<text x="380" y="170" font-size="13" text-anchor="middle">Q = K: at equilibrium,</text><text x="380" y="186" font-size="13" text-anchor="middle">no net change</text>
<rect x="110" y="196" width="230" height="40" rx="8" fill="#E3EAFA" stroke="#1D44A6"/>
<text x="225" y="214" font-size="13" font-weight="700" text-anchor="middle" fill="#1D44A6">Q &lt; K: net forward</text>
<text x="225" y="230" font-size="12" text-anchor="middle">products form, Q rises toward K</text>
<line x1="170" y1="100" x2="350" y2="100" stroke="#1D44A6" stroke-width="5"/><path d="M350,92 l14,8 l-14,8 z" fill="#1D44A6"/>
<rect x="420" y="196" width="230" height="40" rx="8" fill="#FBE9DD" stroke="#B5541B"/>
<text x="535" y="214" font-size="13" font-weight="700" text-anchor="middle" fill="#8A3C10">Q &gt; K: net reverse</text>
<text x="535" y="230" font-size="12" text-anchor="middle">reactants form, Q falls toward K</text>
<line x1="590" y1="100" x2="410" y2="100" stroke="#B5541B" stroke-width="5"/><path d="M410,92 l-14,8 l14,8 z" fill="#B5541B"/>
</g>
</svg>
