<title id="t">How the rate depends on concentration for each order</title>
<desc id="d">Three small graphs of rate against the concentration of a reactant A. Zero order: a flat line, so doubling [A] leaves the rate the same. First order: a straight line through the origin, so doubling [A] doubles the rate. Second order: an upward curve, so doubling [A] multiplies the rate by four. Dashed lines mark one concentration and twice that concentration on each graph.</desc>
