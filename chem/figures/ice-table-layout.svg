<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ice-table-layout-t ice-table-layout-d">
<title id="ice-table-layout-t">An ICE table</title>
<desc id="ice-table-layout-d">An ICE table for 2 NOCl forming 2 NO and Cl2. Columns are NOCl, NO and Cl2; rows are Initial, Change and Equilibrium. Initial: 0.250, 0, 0. Change: minus 2x, plus 2x, plus x, following the coefficients 2, 2 and 1. Equilibrium: 0.250 minus 2x, 2x, and x, where x equals the measured 0.0200 M Cl2. This gives NO = 0.0400 M and NOCl = 0.210 M, and Kc = 7.26 times 10 to the minus 4.</desc>
<rect width="760" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="26" font-size="15" font-weight="700" text-anchor="middle">ICE table: 2 NOCl(g) ⇌ 2 NO(g) + Cl₂(g), 0.250 M NOCl to start</text><rect x="60" y="46" width="160" height="40" fill="#E3EAFA" stroke="#5D6B69" stroke-width="1.5"/><text x="140" y="71" font-size="14" text-anchor="middle" font-weight="700"></text><rect x="220" y="46" width="160" height="40" fill="#E3EAFA" stroke="#5D6B69" stroke-width="1.5"/><text x="300" y="71" font-size="14" text-anchor="middle" font-weight="700">[NOCl] (M)</text><rect x="380" y="46" width="160" height="40" fill="#E3EAFA" stroke="#5D6B69" stroke-width="1.5"/><text x="460" y="71" font-size="14" text-anchor="middle" font-weight="700">[NO] (M)</text><rect x="540" y="46" width="160" height="40" fill="#E3EAFA" stroke="#5D6B69" stroke-width="1.5"/><text x="620" y="71" font-size="14" text-anchor="middle" font-weight="700">[Cl₂] (M)</text><rect x="60" y="86" width="160" height="40" fill="#F4F7FD" stroke="#5D6B69" stroke-width="1.5"/><text x="140" y="111" font-size="14" text-anchor="middle" font-weight="700">Initial</text><rect x="220" y="86" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="300" y="111" font-size="14" text-anchor="middle">0.250</text><rect x="380" y="86" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="460" y="111" font-size="14" text-anchor="middle">0</text><rect x="540" y="86" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="620" y="111" font-size="14" text-anchor="middle">0</text><rect x="60" y="126" width="160" height="40" fill="#F4F7FD" stroke="#5D6B69" stroke-width="1.5"/><text x="140" y="151" font-size="14" text-anchor="middle" font-weight="700">Change</text><rect x="220" y="126" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="300" y="151" font-size="14" text-anchor="middle">−2x</text><rect x="380" y="126" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="460" y="151" font-size="14" text-anchor="middle">+2x</text><rect x="540" y="126" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="620" y="151" font-size="14" text-anchor="middle">+x</text><rect x="60" y="166" width="160" height="40" fill="#F4F7FD" stroke="#5D6B69" stroke-width="1.5"/><text x="140" y="191" font-size="14" text-anchor="middle" font-weight="700">Equilibrium</text><rect x="220" y="166" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="300" y="191" font-size="14" text-anchor="middle">0.250 − 2x</text><rect x="380" y="166" width="160" height="40" fill="#fff" stroke="#5D6B69" stroke-width="1.5"/><text x="460" y="191" font-size="14" text-anchor="middle">2x</text><rect x="540" y="166" width="160" height="40" fill="#FFF4D6" stroke="#5D6B69" stroke-width="1.5"/><text x="620" y="191" font-size="14" text-anchor="middle">x = 0.0200</text><text x="60" y="240" font-size="13">The change row follows the coefficients (2 : 2 : 1). One measured value, [Cl₂] = 0.0200 M, fixes x,</text>
<text x="60" y="258" font-size="13">so [NO] = 0.0400 M and [NOCl] = 0.210 M. Then K<tspan font-size="10" dy="3">c</tspan><tspan dy="-3"> = (0.0400)²(0.0200) / (0.210)² = 7.26 × 10⁻⁴.</tspan></text>
</g>
</svg>
