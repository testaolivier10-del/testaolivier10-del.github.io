" stroke-width="2"/><path d="M289.0,232.6 L280,237 L289.0,241.3 Z" fill="#1F2A28"/><text x="430" y="240" font-size="13" text-anchor="start" fill="#1F2A28">Stopcock: controls the flow, dropwise near the end</text><line x1="420" y1="312" x2="316" y2="312" stroke="#1F2A28" stroke-width="2"/><path d="M325.0,307.7 L316,312 L325.0,316.3 Z" fill="#1F2A28"/><text x="430" y="316" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A28">Erlenmeyer flask: measured volume of analyte</text><text x="430" y="336" font-size="12" text-anchor="start" fill="#1F2A28">plus a few drops of indicator; swirl while adding</text><rect x="20" y="60" width="120" height="140" rx="10" fill="#FFFFFF" stroke="#1D44A6" stroke-width="2"/><rect x="55" y="80" width="50" height="104" fill="#EEF4FB" stroke="#555" stroke-width="1.5"/><path d="M56,120 Q80,136 104,120 L104,183 L56,183 Z" fill="#9CC3E6"/><line x1="40" y1="128" x2="120" y2="128" stroke="#D55E00" stroke-width="2" stroke-dasharray="5 3"/><text x="80" y="216" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2A28">Read the bottom</text><text x="80" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2A28">of the meniscus</text><text x="80" y="248" font-size="12" text-anchor="middle" fill="#1F2A28">at eye level</text><line x1="140" y1="110" x2="246" y2="82" stroke="#1D44A6" stroke-width="2"/><path d="M238.4,88.5 L246,82 L236.2,80.1 Z" fill="#1D44A6"/>
