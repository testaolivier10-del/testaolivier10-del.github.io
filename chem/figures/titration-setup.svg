<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="titration-setup-t titration-setup-d">
<title id="titration-setup-t">A titration setup</title>
<desc id="titration-setup-d">A buret clamped on a stand above an Erlenmeyer flask. The buret holds the titrant of known molarity and has been rinsed with titrant; a stopcock at its bottom controls the flow, dropwise near the end. The flask holds a measured volume of analyte plus a few drops of indicator and is swirled while titrant is added. An inset shows the curved liquid surface in the buret with a dashed line at its lowest point: read the bottom of the meniscus at eye level.</desc>
<rect width="800" height="350" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
