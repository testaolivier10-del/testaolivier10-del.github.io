<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-labelledby="t d">
<title id="t">The straight-line plot for each order</title>
<desc id="d">Three graphs, each a straight line through data points. For a zero-order reaction, concentration of A against time is a straight line with slope equal to minus k. For a first-order reaction, the natural log of the concentration of A against time is a straight line with slope minus k. For a second-order reaction, one over the concentration of A against time is a straight line that rises, with slope plus k.</desc>
