<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Energy profile of a one-step reaction</title>
<desc id="d">Potential energy on the vertical axis, reaction progress on the horizontal axis. The curve starts at the reactant level, rises to a peak labelled transition state, and falls to a product level lower than the reactants. A double arrow from the reactant level to the peak is the activation energy. A double arrow from the reactant level down to the product level is the energy change of the reaction; here energy is released because the products are lower.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
