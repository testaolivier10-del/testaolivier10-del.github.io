<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Energy profile of a two-step reaction</title>
<desc id="d">Potential energy against reaction progress for a reaction in two elementary steps. The curve rises from the reactants over a tall first peak, the first transition state, drops into a valley where the intermediate sits, rises over a smaller second peak, the second transition state, and falls to products lower than the reactants. A double arrow from the reactants to the first peak is the activation energy of step 1; a shorter double arrow from the valley to the second peak is the activation energy of step 2. Step 1 has the larger activation energy, so it is the slow step.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
