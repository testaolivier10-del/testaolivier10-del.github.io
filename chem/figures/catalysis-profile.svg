<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Energy profile with and without a catalyst</title>
<desc id="d">Potential energy against reaction progress. Without a catalyst the curve climbs one tall hump. With a catalyst the reaction follows a different path with two smaller humps and a valley between them, where an intermediate sits. Both paths start at the same reactant level and end at the same product level, so the energy change of the reaction is unchanged; only the highest barrier is lower.</desc>
