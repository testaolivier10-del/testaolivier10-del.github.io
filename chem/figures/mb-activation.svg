<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Distribution of molecular energies at two temperatures</title>
<desc id="d">Number of molecules on the vertical axis, kinetic energy on the horizontal axis. Two curves: the lower temperature curve has a tall, narrow peak at low energy; the higher temperature curve is lower, broader and shifted to higher energy. A dashed vertical line marks the activation energy. The area under each curve to the right of that line is shaded: it is the fraction of molecules with enough energy to react, and it is much larger at the higher temperature. The activation energy itself is the same at both temperatures.</desc>
