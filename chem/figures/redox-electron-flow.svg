<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-labelledby="redox-electron-flow-t redox-electron-flow-d">
<title id="redox-electron-flow-t">Electron transfer from zinc to copper ions</title>
<desc id="redox-electron-flow-d">A zinc atom passes two electrons to a Cu²⁺ ion, giving a Zn²⁺ ion and a copper atom. Oxidation numbers: Zn 0, Cu²⁺ +2, Zn²⁺ +2, Cu 0. Zinc goes from 0 to +2 and loses two electrons: it is oxidized and is the reducing agent. Copper goes from +2 to 0 and gains two electrons: it is reduced, and Cu²⁺ is the oxidizing agent. Half-reactions: Zn(s) → Zn²⁺(aq) + 2e⁻ and Cu²⁺(aq) + 2e⁻ → Cu(s). Electrons lost equal electrons gained.</desc>
<rect width="800" height="356" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="400" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A28">Electrons move from zinc to copper ions</text><g transform="translate(110,110) scale(1.8) translate(-110,-110)"><circle cx="110" cy="110" r="11" fill="#8FA3B8" stroke="#333" stroke-width="1.3"/><text x="110" y="113.24" font-size="9" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">Zn</text></g><g transform="translate(250,110) scale(1.8) translate(-250,-110)"><circle cx="250" cy="110" r="11" fill="#B5651D" stroke="#333" stroke-width="1.3"/><text x="250" y="113.24" font-size="9" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">Cu</text><text x="261.25" y="103.75" font-size="12" font-weight="700" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif">2+</text></g><line x1="320" y1="110" x2="432" y2="110" stroke="#1F2A28" stroke-width="2.5"/><path d="M430,104 L440,110 L430,116 Z" fill="#1F2A28"/><g transform="translate(530,110) scale(1.8) translate(-530,-110)"><circle cx="530" cy="110" r="11" fill="#8FA3B8" stroke="#333" stroke-width="1.3"/><text x="530" y="113.24" font-size="9" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">Zn</text><text x="541.25" y="103.75" font-size="12" font-weight="700" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif">2+</text></g><g transform="translate(680,110) scale(1.8) translate(-680,-110)"><circle cx="680" cy="110" r="11" fill="#B5651D" stroke="#333" stroke-width="1.3"/><text x="680" y="113.24" font-size="9" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">Cu</text></g><path d="M130,88 Q180,40 230,88" fill="none" stroke="#D55E00" stroke-width="2.5"/><path d="M222,82 L232,91 L219,92 Z" fill="#D55E00"/><text x="180" y="54" font-size="15" font-weight="700" text-anchor="middle" fill="#D55E00">2e⁻</text><text x="110" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">Zn(s)</text><text x="250" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">Cu²⁺(aq)</text><text x="530" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">Zn²⁺(aq)</text><text x="680" y="158" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">Cu(s)</text><text x="110" y="182" font-size="14" text-anchor="middle" fill="#1F2A28">0</text><text x="250" y="182" font-size="14" text-anchor="middle" fill="#1F2A28">+2</text><text x="530" y="182" font-size="14" text-anchor="middle" fill="#1F2A28">+2</text><text x="680" y="182" font-size="14" text-anchor="middle" fill="#1F2A28">0</text><text x="30" y="182" font-size="12" text-anchor="start" fill="#1F2A28">ox. no.</text><path d="M110,194 L110,206 L530,206 L530,194" fill="none" stroke="#D55E00" stroke-width="2"/><text x="320" y="226" font-size="14" font-weight="700" text-anchor="middle" fill="#D55E00">Zn: 0 → +2, loses 2e⁻: oxidized (zinc is the reducing agent)</text><path d="M250,194 L250,197 M250,234 L250,240 L680,240 L680,194" fill="none" stroke="#1D44A6" stroke-width="2"/><text x="465" y="262" font-size="14" font-weight="700" text-anchor="middle" fill="#1D44A6">Cu: +2 → 0, gains 2e⁻: reduced (Cu²⁺ is the oxidizing agent)</text><text x="220" y="300" font-size="15" text-anchor="middle" fill="#1F2A28">Oxidation: Zn(s) → Zn²⁺(aq) + 2e⁻</text><text x="590" y="300" font-size="15" text-anchor="middle" fill="#1F2A28">Reduction: Cu²⁺(aq) + 2e⁻ → Cu(s)</text><text x="400" y="334" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Electrons lost = electrons gained</text>
</g>
</svg>
