<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Cell potential falls as Q rises</title>
<desc id="d">A graph of cell potential E on the vertical axis against Q on a logarithmic horizontal axis. A straight line slopes down from left to right. Where Q is less than 1, E is greater than E°. At Q equal to 1, E equals E°. Where Q is greater than 1, E is less than E°. The line reaches E equal to zero where Q equals K: the cell is at equilibrium and the battery is dead.</desc>
<defs><marker id="nq-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<line x1="80" y1="290" x2="720" y2="290" stroke="#1F2A28" stroke-width="2" marker-end="url(#nq-a)"/>
<line x1="80" y1="320" x2="80" y2="25" stroke="#1F2A28" stroke-width="2" marker-end="url(#nq-a)"/>
<text x="400" y="345" font-size="14" text-anchor="middle">Q (log scale): more products, fewer reactants →</text>
<text transform="translate(38 160) rotate(-90)" font-size="14" text-anchor="middle">cell potential E (V)</text>
<line x1="100" y1="60" x2="660" y2="290" stroke="#0072B2" stroke-width="4"/>
<line x1="80" y1="150" x2="320" y2="150" stroke="#1F2A28" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="319" y1="150" x2="319" y2="290" stroke="#1F2A28" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="319" cy="150" r="6" fill="#1D44A6"/><circle cx="660" cy="290" r="6" fill="#D55E00"/>
<g font-size="14"><text x="70" y="155" text-anchor="end">E°</text><text x="70" y="295" text-anchor="end">0</text><text x="319" y="310" text-anchor="middle">Q = 1</text><text x="660" y="310" text-anchor="middle">Q = K</text></g>
<g font-size="13"><text x="120" y="210">Q &lt; 1: E &gt; E°</text><text x="420" y="175">Q &gt; 1: E &lt; E°</text><text x="470" y="262">E = 0 at equilibrium</text></g>
</g></svg>
