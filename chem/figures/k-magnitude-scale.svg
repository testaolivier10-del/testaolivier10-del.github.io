<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="k-magnitude-scale-t k-magnitude-scale-d">
<title id="k-magnitude-scale-t">The size of K</title>
<desc id="k-magnitude-scale-d">A logarithmic scale of K from 10 to the minus 12 on the left to 10 to the 12 on the right. Far left, K much less than 1: reactant-favored, mostly reactants at equilibrium with a little product. A shaded band around K = 1, roughly 10 to the minus 3 to 10 to the 3: appreciable amounts of both. Far right, K much greater than 1: product-favored, mostly products with a little reactant. A note says K tells where equilibrium lies, not how fast it is reached.</desc>
<rect width="760" height="230" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="26" font-size="15" font-weight="700" text-anchor="middle">What the size of K says about the equilibrium mixture</text>
<line x1="60" y1="110" x2="700" y2="110" stroke="#333" stroke-width="3"/><line x1="60" y1="104" x2="60" y2="116" stroke="#333" stroke-width="2"/><text x="60" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">−12</tspan></text><line x1="166.66666666666666" y1="104" x2="166.66666666666666" y2="116" stroke="#333" stroke-width="2"/><text x="166.66666666666666" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">−8</tspan></text><line x1="273.3333333333333" y1="104" x2="273.3333333333333" y2="116" stroke="#333" stroke-width="2"/><text x="273.3333333333333" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">−4</tspan></text><line x1="380" y1="104" x2="380" y2="116" stroke="#333" stroke-width="2"/><text x="380" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">0</tspan></text><line x1="486.66666666666663" y1="104" x2="486.66666666666663" y2="116" stroke="#333" stroke-width="2"/><text x="486.66666666666663" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">4</tspan></text><line x1="593.3333333333334" y1="104" x2="593.3333333333334" y2="116" stroke="#333" stroke-width="2"/><text x="593.3333333333334" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">8</tspan></text><line x1="700" y1="104" x2="700" y2="116" stroke="#333" stroke-width="2"/><text x="700" y="134" font-size="12" text-anchor="middle">10<tspan dy="-6" font-size="10">12</tspan></text><rect x="300" y="92" width="160" height="36" fill="#1D44A6" fill-opacity="0.12" stroke="#1D44A6" stroke-dasharray="4 3"/>
<text x="380" y="84" font-size="13" text-anchor="middle" font-weight="700">K near 1</text>
<text x="166.66666666666666" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#8A3C10">K ≪ 1: reactant-favored</text>
<text x="593.3333333333334" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#1D44A6">K ≫ 1: product-favored</text>
<text x="166.66666666666666" y="164" font-size="12" text-anchor="middle">mostly reactants at equilibrium,</text><text x="166.66666666666666" y="180" font-size="12" text-anchor="middle">a little product</text>
<text x="380" y="164" font-size="12" text-anchor="middle">appreciable amounts</text><text x="380" y="180" font-size="12" text-anchor="middle">of both</text>
<text x="593.3333333333334" y="164" font-size="12" text-anchor="middle">mostly products at equilibrium,</text><text x="593.3333333333334" y="180" font-size="12" text-anchor="middle">a little reactant</text>
<text x="380" y="214" font-size="13" text-anchor="middle">K says where equilibrium lies, not how fast it is reached.</text>
</g>
</svg>
