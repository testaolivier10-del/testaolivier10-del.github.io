<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="ph-t ph-d"><title id="ph-t">Wavelength, frequency and photon energy</title><desc id="ph-d">Two waves travelling at the same speed. The top wave, red light at 700 nm, has long crests spaced far apart, so fewer pass each second: lower frequency and less energy per photon. The bottom wave, violet light at 400 nm, has crests closer together: higher frequency and more energy per photon. On the right, an energy-level diagram shows a photon absorbed only when its energy equals the gap between two levels.</desc><defs><marker id="ph-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="640" height="260" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><polyline points="30.0,70.0 32.0,68.0 34.0,66.1 36.0,64.1 38.0,62.3 40.0,60.5 42.0,58.7 44.0,57.1 46.0,55.5 48.0,54.1 50.0,52.8 52.0,51.6 54.0,50.6 56.0,49.8 58.0,49.1 60.0,48.6 62.0,48.2 64.0,48.0 66.0,48.0 68.0,48.2 70.0,48.6 72.0,49.1 74.0,49.8 76.0,50.6 78.0,51.6 80.0,52.8 82.0,54.1 84.0,55.5 86.0,57.1 88.0,58.7 90.0,60.5 92.0,62.3 94.0,64.1 96.0,66.1 98.0,68.0 100.0,70.0 102.0,72.0 104.0,73.9 106.0,75.9 108.0,77.7 110.0,79.5 112.0,81.3 114.0,82.9 116.0,84.5 118.0,85.9 120.0,87.2 122.0,88.4 124.0,89.4 126.0,90.2 128.0,90.9 130.0,91.4 132.0,91.8 134.0,92.0 136.0,92.0 138.0,91.8 140.0,91.4 142.0,90.9 144.0,90.2 146.0,89.4 148.0,88.4 150.0,87.2 152.0,85.9 154.0,84.5 156.0,82.9 158.0,81.3 160.0,79.5 162.0,77.7 164.0,75.9 166.0,73.9 168.0,72.0 170.0,70.0 172.0,68.0 174.0,66.1 176.0,64.1 178.0,62.3 180.0,60.5 182.0,58.7 184.0,57.1 186.0,55.5 188.0,54.1 190.0,52.8 192.0,51.6 194.0,50.6 196.0,49.8 198.0,49.1 200.0,48.6 202.0,48.2 204.0,48.0 206.0,48.0 208.0,48.2 210.0,48.6 212.0,49.1 214.0,49.8 216.0,50.6 218.0,51.6 220.0,52.8 222.0,54.1 224.0,55.5 226.0,57.1 228.0,58.7 230