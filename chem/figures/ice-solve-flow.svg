<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ice-solve-flow-t ice-solve-flow-d">
<title id="ice-solve-flow-t">Solving for equilibrium concentrations</title>
<desc id="ice-solve-flow-d">A flow chart. Step 1, compare Q with K to find the direction. Step 2, write an ICE table with each change equal to plus or minus x times the coefficient. Step 3, substitute the equilibrium row into the K expression. Then choose a way to solve: if both sides are perfect squares, take the square root; if K is small compared with the starting concentration, drop x from the initial minus x terms; otherwise use the quadratic formula. Step 4, check: x should be under 5% of the starting concentration if the approximation was used, and the answers should give Q = K.</desc>
<rect width="760" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="380" y="22" font-size="15" font-weight="700" text-anchor="middle">From K and starting amounts to equilibrium concentrations</text>
<rect x="20" y="40" width="200" height="52" rx="9" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="120" y="62" font-size="13" font-weight="700" text-anchor="middle">1. Compare Q with K</text><text x="120" y="80" font-size="12" text-anchor="middle">gives the direction</text>
<rect x="280" y="40" width="200" height="52" rx="9" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="380" y="62" font-size="13" font-weight="700" text-anchor="middle">2. ICE table</text><text x="380" y="80" font-size="12" text-anchor="middle">change = ±x × coefficient</text>
<rect x="540" y="40" width="200" height="52" rx="9" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="640" y="62" font-size="13" font-weight="700" text-anchor="middle">3. Substitute into K</text><text x="640" y="80" font-size="12" text-anchor="middle">Equilibrium row</text>
<line x1="220" y1="66" x2="278" y2="66" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="480" y1="66" x2="538" y2="66" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="150" width="220" height="56" rx="9" fill="#FFF4D6" stroke="#1D44A6" stroke-width="2"/><text x="130" y="172" font-size="13" font-weight="700" text-anchor="middle">Perfect square?</text><text x="130" y="190" font-size="12" text-anchor="middle">take √ of both sides</text>
<rect x="270" y="150" width="220" height="56" rx="9" fill="#FFF4D6" stroke="#1D44A6" stroke-width="2"/><text x="380" y="172" font-size="13" font-weight="700" text-anchor="middle">K small next to [ ]₀?</text><text x="380" y="190" font-size="12" text-anchor="middle">drop x from (initial − x)</text>
<rect x="520" y="150" width="220" height="56" rx="9" fill="#FFF4D6" stroke="#1D44A6" stroke-width="2"/><text x="630" y="172" font-size="13" font-weight="700" text-anchor="middle">Neither?</text><text x="630" y="190" font-size="12" text-anchor="middle">quadratic formula</text>
<line x1="640" y1="92" x2="130" y2="148" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="640" y1="92" x2="380" y2="148" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="640" y1="92" x2="630" y2="148" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="250" width="220" height="56" rx="9" fill="#E7F4EE" stroke="#1D44A6" stroke-width="2"/><text x="380" y="272" font-size="13" font-weight="700" text-anchor="middle">4. Check</text><text x="380" y="290" font-size="12" text-anchor="middle">x under 5% of [ ]₀? Q = K?</text>
<line x1="130" y1="206" x2="300" y2="248" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="380" y1="206" x2="380" y2="248" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="630" y1="206" x2="460" y2="248" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
</g>
</svg>
