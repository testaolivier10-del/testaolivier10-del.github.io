<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
<title id="t">Molecularity of an elementary reaction</title>
<desc id="d">Three particle pictures. Unimolecular: a single molecule of two atoms falls apart into two atoms; its rate law is rate equals k times the concentration of A. Bimolecular: two particles collide and rearrange; rate equals k times the concentration of A times the concentration of B. Termolecular: three particles must meet at the same moment, which is rare; rate equals k times the concentration of A squared times the concentration of B.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="680" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="115" y="40" font-size="15" text-anchor="middle" font-weight="700">Unimolecular</text><text x="115" y="60" font-size="13" text-anchor="middle">one particle changes</text><circle cx="104" cy="120" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="126" cy="120" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><line x1="115" y1="150" x2="115" y2="190" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><circle cx="85" cy="225" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="145" cy="225" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><text x="115" y="275" font-size="15" text-anchor="middle">rate = k[A]</text><text x="340" y="40" font-size="15" text-anchor="middle" font-weight="700">Bimolecular</text><text x="340" y="60" font-size="13" text-anchor="middle">two particles collide</text><circle cx="279" cy="120" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="301" cy="120" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="395" cy="120" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><line x1="318" y1="120" x2="372" y2="120" stroke="#5D6B69" stroke-width="2" marker-end="url(#ar)"/><line x1="340" y1="150" x2="340" y2="190" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><circle cx="299" cy="225" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="321" cy="225" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><circle cx="380" cy="225" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><text x="340" y="275" font-size="15" text-anchor="middle">rate = k[A][B]</text><text x="565" y="40" font-size="15" text-anchor="middle" font-weight="700">Termolecular</text><text x="565" y="60" font-size="13" text-anchor="middle">three at once: rare</text><circle cx="520" cy="105" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><circle cx="610" cy="105" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><circle cx="565" cy="150" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><line x1="532" y1="112" x2="552" y2="135" stroke="#5D6B69" stroke-width="2" marker-end="url(#ar)"/><line x1="598" y1="112" x2="578" y2="135" stroke="#5D6B69" stroke-width="2" marker-end="url(#ar)"/><line x1="565" y1="175" x2="565" y2="195" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><circle cx="553" cy="225" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><circle cx="577" cy="225" r="13" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><circle cx="601" cy="225" r="13" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><text x="565" y="275" font-size="15" text-anchor="middle">rate = k[A]²[B]</text>
</g>
</svg>
