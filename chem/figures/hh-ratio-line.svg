<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="hh-ratio-line-t hh-ratio-line-d">
<title id="hh-ratio-line-t">The Henderson-Hasselbalch equation as a straight line</title>
<desc id="hh-ratio-line-d">pH plotted against the base-10 log of the ratio of conjugate base to weak acid for an acid with pKa 4.74. It is a straight line of slope 1 that crosses pH 4.74 where the log of the ratio is zero, that is where the ratio is 1. At a ratio of 10 the pH is 5.74, at a ratio of 0.1 it is 3.74. The useful buffer range, ratios from 0.1 to 10, is shaded.</desc>
<defs><marker id="hh-ratio-line-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="380" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="182.5" y="24" width="225" height="296" fill="#EAF2E3"/><line x1="70" y1="320" x2="520" y2="320" stroke="#333" stroke-width="1.5"/><line x1="70" y1="24" x2="70" y2="320" stroke="#333" stroke-width="1.5"/><line x1="70" y1="320.0" x2="520" y2="320.0" stroke="#E5E5E5"/><text x="62" y="324.0" font-size="12" text-anchor="end">2</text><line x1="70" y1="270.7" x2="520" y2="270.7" stroke="#E5E5E5"/><text x="62" y="274.7" font-size="12" text-anchor="end">3</text><line x1="70" y1="221.3" x2="520" y2="221.3" stroke="#E5E5E5"/><text x="62" y="225.3" font-size="12" text-anchor="end">4</text><line x1="70" y1="172.0" x2="520" y2="172.0" stroke="#E5E5E5"/><text x="62" y="176.0" font-size="12" text-anchor="end">5</text><line x1="70" y1="122.7" x2="520" y2="122.7" stroke="#E5E5E5"/><text x="62" y="126.7" font-size="12" text-anchor="end">6</text><line x1="70" y1="73.3" x2="520" y2="73.3" stroke="#E5E5E5"/><text x="62" y="77.3" font-size="12" text-anchor="end">7</text><line x1="70" y1="24.0" x2="520" y2="24.0" stroke="#E5E5E5"/><text x="62" y="28.0" font-size="12" text-anchor="end">8</text><text x="70.0" y="338" font-size="12" text-anchor="middle" >-2</text><text x="126.3" y="338" font-size="12" text-anchor="middle" >-1.5</text><text x="182.5" y="338" font-size="12" text-anchor="middle" >-1</text><text x="238.8" y="338" font-size="12" text-anchor="middle" >-0.5</text><text x="295.0" y="338" font-size="12" text-anchor="middle" >0</text><text x="351.3" y="338" font-size="12" text-anchor="middle" >0.5</text><text x="407.5" y="338" font-size="12" text-anchor="middle" >1</text><text x="463.8" y="338" font-size="12" text-anchor="middle" >1.5</text><text x="520.0" y="338" font-size="12" text-anchor="middle" >2</text><text x="295" y="366" font-size="13" text-anchor="middle" >log([A⁻]/[HA])</text><text transform="translate(18 172) rotate(-90)" font-size="13" text-anchor="middle">pH</text><polyline fill="none" stroke="#0072B2" stroke-width="3"  points="70.0,283.5 520.0,86.2"/><circle cx="182.5" cy="234.16" r="5.5" fill="#E69F00" stroke="#333"/><text x="192.5" y="252.16" font-size="12" >(-1, 3.74)</text><circle cx="295" cy="184.82666666666665" r="5.5" fill="#E69F00" stroke="#333"/><text x="305" y="202.82666666666665" font-size="12" >(0, 4.74)</text><circle cx="407.5" cy="135.4933333333333" r="5.5" fill="#E69F00" stroke="#333"/><text x="417.5" y="153.4933333333333" font-size="12" >(1, 5.74)</text><text x="295" y="42" font-size="12" text-anchor="middle" font-weight="700">ratio 0.1 to 10</text><text x="540" y="60" font-size="13" font-weight="700">pH = pKa + log([A⁻]/[HA])</text><text x="540" y="86" font-size="13" ></text><text x="540" y="112" font-size="13" >ratio 10 : 1 → pH = pKa + 1</text><text x="540" y="138" font-size="13" >ratio 1 : 1 → pH = pKa</text><text x="540" y="164" font-size="13" >ratio 1 : 10 → pH = pKa − 1</text><text x="540" y="190" font-size="13" ></text><text x="540" y="216" font-size="13" font-weight="700">base-10 log, not ln:</text><text x="540" y="242" font-size="13" >ln 10 = 2.303 would give</text><text x="540" y="268" font-size="13" >pKa + 2.30 instead of pKa + 1</text></g></svg>
