<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="reaction-type-map-t reaction-type-map-d">
<title id="reaction-type-map-t">Four kinds of reaction</title>
<desc id="reaction-type-map-d">Four cards. Precipitation: ions from two solutions form a solid, for example Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Acid-base: an H⁺ moves from one particle to another, for example H⁺(aq) + OH⁻(aq) → H₂O(l). Electron transfer: electrons move, look for a free element, for example Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s). Combustion: a fuel combines with O₂, for example CH₄ + 2O₂ → CO₂ + 2H₂O. A note says every combustion is also an electron transfer, because O₂ goes from a free element to compounds.</desc>
<rect width="800" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="400" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A28">Sort a reaction by what changes</text><rect x="20" y="50" width="370" height="120" rx="10" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="205" y="80" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A28">Precipitation</text><text x="205" y="108" font-size="14" text-anchor="middle" fill="#1F2A28">Ions from two solutions form a solid</text><text x="205" y="142" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</text><rect x="410" y="50" width="370" height="120" rx="10" fill="#FCE9DC" stroke="#D55E00" stroke-width="2"/><text x="595" y="80" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A28">Acid-base</text><text x="595" y="108" font-size="14" text-anchor="middle" fill="#1F2A28">An H⁺ moves from one particle to another</text><text x="595" y="142" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">H⁺(aq) + OH⁻(aq) → H₂O(l)</text><rect x="20" y="190" width="370" height="120" rx="10" fill="#E5F4EE" stroke="#009E73" stroke-width="2"/><text x="205" y="220" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A28">Electron transfer</text><text x="205" y="248" font-size="14" text-anchor="middle" fill="#1F2A28">Electrons move; look for a free element</text><text x="205" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)</text><rect x="410" y="190" width="370" height="120" rx="10" fill="#FDF6D8" stroke="#B38F00" stroke-width="2"/><text x="595" y="220" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A28">Combustion</text><text x="595" y="248" font-size="14" text-anchor="middle" fill="#1F2A28">A fuel combines with O₂</text><text x="595" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">CH₄ + 2O₂ → CO₂ + 2H₂O</text><text x="400" y="340" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2A28">Every combustion is also an electron transfer: O₂ goes from free element to compounds.</text>
</g>
</svg>
