<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="imf-t imf-d"><title id="imf-t">Four kinds of intermolecular force</title><desc id="imf-d">Four panels. 1, London dispersion: two nonpolar molecules; a momentary uneven spread of electrons in one (delta minus on one side, delta plus on the other) induces the opposite charges in its neighbour, so they attract. 2, dipole-dipole: two polar H-Cl molecules line up so the partially positive H of one faces the partially negative Cl of the next. 3, hydrogen bond: the H of one water molecule, bonded to O, is attracted to a lone pair on the O of another water molecule; the hydrogen bond is the dashed line between molecules, not the O-H bond inside a molecule. 4, ion-dipole: a sodium ion surrounded by water molecules with their partially negative oxygen ends toward it.</desc><rect width="760" height="270" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="10" y="10" width="176" height="210" rx="10" fill="#EEF2F7" stroke="#5D6B79" stroke-width="1.5"/><text x="100" y="34" font-size="14" font-weight="700" text-anchor="middle">1. London dispersion</text><ellipse cx="65" cy="110" rx="34" ry="26" fill="#DCE6F5" stroke="#333"/><ellipse cx="145" cy="110" rx="34" ry="26" fill="#DCE6F5" stroke="#333"/><text x="45" y="115" font-size="13" text-anchor="middle">δ−</text><text x="85" y="115" font-size="13" text-anchor="middle">δ+</text><text x="125" y="115" font-size="13" text-anchor="middle">δ−</text><text x="165" y="115" font-size="13" text-anchor="middle">δ+</text><line x1="95" y1="110" x2="115" y2="110" stroke="#0072B2" stroke-width="2" stroke-dasharray="4 3"/><text x="100" y="165" font-size="13" text-anchor="middle">a momentary dipole</text><text x="100" y="182" font-size="13" text-anchor="middle">induces one next door</text><text x="100" y="205" font-size="13" text-anchor="middle">in every substance</text><rect x="199" y="10" width="176" height="210" rx="10" fill="#EEF2F7" stroke="#5D6B79" stroke-width="1.5"/><text x="289" y="34" font-size="14" font-weight="700" text-anchor="middle">2. Dipole-dipole</text><circle cx="225" cy="110" r="10" fill="#fff" stroke="#333"/><text x="225" y="115" font-size="12" text-anchor="middle">H</text><circle cx="252" cy="110" r="17" fill="#009E73" stroke="#333"/><text x="252" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Cl</text><text x="225" y="88" font-size="13" text-anchor="middle">δ+</text><text x="252" y="84" font-size="13" text-anchor="middle">δ−</text><circle cx="300" cy="110" r="10" fill="#fff" stroke="#333"/><text x="300" y="115" font-size="12" text-anchor="middle">H</text><circle cx="327" cy="110" r="17" fill="#009E73" stroke="#333"/><text x="327" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Cl</text><text x="300" y="88" font-size="13" text-anchor="middle">δ+</text><text x="327" y="84" font-size="13" text-anchor="middle">δ−</text><line x1="270" y1="110" x2="289" y2="110" stroke="#0072B2" stroke-width="2" stroke-dasharray="4 3"/><text x="290" y="165" font-size="13" text-anchor="middle">δ+ end of one faces</text><text x="290" y="182" font-size="13" text-anchor="middle">δ− end of the next</text><text x="290" y="205" font-size="13" text-anchor="middle">polar molecules</text><rect x="388" y="10" width="176" height="210" rx="10" fill="#EEF2F7" stroke="#5D6B79" stroke-width="1.5"/><text x="478" y="34" font-size="14" font-weight="700" text-anchor="middle">3. Hydrogen bond</text><circle cx="439.9" cy="97.4" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="439.9" cy="122.6" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="430.0" cy="110.0" r="12" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="539.9" cy="107.4" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="539.9" cy="132.6" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="530.0" cy="120.0" r="12" fill="#D55E00" stroke="#333" stroke-width="1.2"/><line x1="440" y1="122.6" x2="517" y2="120" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="5 3"/><text x="478" y="145" font-size="13" text-anchor="middle">H…O</text><text x="480" y="182" font-size="13" text-anchor="middle">H on N, O or F, to a lone</text><text x="480" y="199" font-size="13" text-anchor="middle">pair on N, O or F of</text><text x="480" y="216" font-size="13" text-anchor="middle">another molecule</text><rect x="574" y="10" width="176" height="210" rx="10" fill="#EEF2F7" stroke="#5D6B79" stroke-width="1.5"/><text x="664" y="34" font-size="14" font-weight="700" text-anchor="middle">4. Ion-dipole</text><circle cx="697.8" cy="114.6" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="694.3" cy="127.6" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="691.0" cy="119.8" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="677.6" cy="144.3" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="664.6" cy="147.8" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="669.8" cy="141.0" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="641.8" cy="141.6" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="632.4" cy="132.2" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="640.8" cy="133.2" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="626.2" cy="109.4" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="629.7" cy="96.4" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="633.0" cy="104.2" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="646.4" cy="79.7" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="659.4" cy="76.2" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="654.2" cy="83.0" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="682.2" cy="82.4" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="691.6" cy="91.8" r="4.5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/><circle cx="683.2" cy="90.8" r="7" fill="#D55E00" stroke="#333" stroke-width="1.2"/><circle cx="662.0" cy="112.0" r="13" fill="#0072B2" stroke="#333" stroke-width="1.2"/><text x="662.0" y="117.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">+</text><text x="662" y="180" font-size="13" text-anchor="middle">water O (δ−) ends</text><text x="662" y="197" font-size="13" text-anchor="middle">point toward a cation</text><text x="662" y="214" font-size="13" text-anchor="middle">ions with polar molecules</text><text x="380" y="252" font-size="13" text-anchor="middle">Key: orange circle, oxygen; white circle, hydrogen; dashed blue line, the attraction between particles.</text></g></svg>