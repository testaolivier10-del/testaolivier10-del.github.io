<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="740" height="290" role="img" aria-labelledby="sol-t sol-d"><title id="sol-t">Four kinds of crystalline solid</title><desc id="sol-d">Four panels. Ionic: a grid of alternating positive and negative ions held by ionic bonds. Molecular: separate small two-atom molecules, each held together by a covalent bond, packed side by side with only weak attractions between molecules. Covalent network: atoms joined to every neighbour by covalent bonds in one continuous web. Metallic: a grid of positive metal ions in a sea of moving electrons.</desc><rect width="740" height="290" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="8" y="10" width="176" height="232" rx="10" fill="#EEF2F7" stroke="#5D6B79" stroke-width="1.5"/><text x="96" y="32" font-size="14" font-weight="700" text-anchor="middle">Ionic</text><circle cx="40.0" cy="60.0" r="11" fill="#0072B2" stroke="#333" stroke-width="1.2"/><text x="40.0" y="65.0" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">+</text><circle cx="40.0" cy="97.0" r="15" fill="#009E73" stroke="#333" stroke-width="1.2"/><text x="40.0" y="102.0" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">−</text><circle cx="40.0" cy="134.0" r="11" fill="#0072B2" stroke="#333" stroke-width="1.2"/><text x="40.0" y="139.0" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">+</text><circle cx="40.0" cy="171.0" r="15" fill="#009E73" stroke="#333" stroke-width="1.2"/><text x="40.0" y="176.0" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">−</text><circle cx="77.0" cy="60.0" r="15" fill="#009E73" stroke="#333" stroke-width="1.2"/><text x="77.0" y="65.0" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">−</text><circle cx="77.0" cy="97.0" r="11" fill="#0072B2" stroke="#333" stroke-width="1.2"/><text x="77.0" y="102.0" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">+</t