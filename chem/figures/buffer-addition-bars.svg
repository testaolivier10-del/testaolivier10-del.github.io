<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="buffer-addition-bars-t buffer-addition-bars-d">
<title id="buffer-addition-bars-t">Adding 0.010 mol of hydroxide to a buffer and to water</title>
<desc id="buffer-addition-bars-d">Left: bar graph of moles of HA and A minus in a 1.00 L buffer before and after adding 0.010 mol of sodium hydroxide. Before: 0.100 mol each, pH 4.74. After: 0.090 mol HA and 0.110 mol A minus, pH 4.83, a change of 0.09. Right: the same hydroxide in 1.00 L of pure water raises the pH from 7.00 to 12.00, a change of 5.00.</desc>
<defs><marker id="buffer-addition-bars-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="340" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><line x1="30" y1="260" x2="430" y2="260" stroke="#333" stroke-width="1.5"/><rect x="50" y="110" width="44" height="150" fill="#E69F00" stroke="#333"/><text x="72" y="104" font-size="12" text-anchor="middle" >0.100</text><text x="72" y="278" font-size="12" text-anchor="middle" >HA</text><rect x="100" y="110" width="44" height="150" fill="#56B4E9" stroke="#333"/><text x="122" y="104" font-size="12" text-anchor="middle" >0.100</text><text x="122" y="278" font-size="12" text-anchor="middle" >A⁻</text><rect x="250" y="125" width="44" height="135" fill="#E69F00" stroke="#333"/><text x="272" y="119" font-size="12" text-anchor="middle" >0.090</text><text x="272" y="278" font-size="12" text-anchor="middle" >HA</text><rect x="300" y="95" width="44" height="165" fill="#56B4E9" stroke="#333"/><text x="322" y="89" font-size="12" text-anchor="middle" >0.110</text><text x="322" y="278" font-size="12" text-anchor="middle" >A⁻</text><text x="100" y="300" font-size="13" text-anchor="middle" font-weight="700">Before: pH 4.74</text><text x="300" y="300" font-size="13" text-anchor="middle" font-weight="700">After 0.010 mol OH⁻: pH 4.83</text><line x1="160" y1="180" x2="235" y2="180" stroke="#1F2A28" stroke-width="2" marker-end="url(#buffer-addition-bars-a)"/><text x="197" y="170" font-size="11" text-anchor="middle" >OH⁻ + HA → A⁻ + H₂O</text><text x="230" y="36" font-size="14" text-anchor="middle" font-weight="700">1.00 L buffer, pKa 4.74 (moles shown)</text><rect x="470" y="60" width="270" height="200" rx="10" fill="#F3F6FC" stroke="#1D44A6"/><text x="605" y="90" font-size="14" text-anchor="middle" font-weight="700">Same 0.010 mol OH⁻</text><text x="605" y="112" font-size="14" text-anchor="middle" font-weight="700">in 1.00 L of pure water</text><text x="605" y="150" font-size="13" text-anchor="middle" >[OH⁻] = 0.010 M, pOH = 2.00</text><text x="605" y="178" font-size="15" text-anchor="middle" font-weight="700">pH 7.00 → 12.00</text><text x="605" y="214" font-size="13" text-anchor="middle" >change: 5.00 pH units</text><text x="605" y="236" font-size="13" text-anchor="middle" >buffer change: 0.09 pH units</text><text x="380" y="330" font-size="12" text-anchor="middle" >Key: HA weak acid, A⁻ conjugate base. The ratio [A⁻]/[HA] moved from 1.00 to 1.22.</text></g></svg>
