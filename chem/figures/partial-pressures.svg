<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" role="img" aria-labelledby="dal-t dal-d"><title id="dal-t">Partial pressures add up</title><desc id="dal-d">Three identical containers at the same temperature. The first holds 6 molecules of gas A and has a pressure of 0.60 atm. The second holds 3 molecules of gas B and has a pressure of 0.30 atm. The third holds both, 6 A and 3 B, and its total pressure is 0.90 atm, the sum. Gas A makes up 6 of 9 molecules, a mole fraction of 0.67, and supplies two thirds of the pressure.</desc><rect width="560" height="262" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><text x="85" y="24" font-size="13" font-weight="700" text-anchor="middle">Gas A alone</text><rect x="10" y="34" width="150" height="150" rx="8" fill="#fff" stroke="#5D6B79" stroke-width="2"/><circle cx="30" cy="52" r="7" fill="#0072B2"/><circle cx="77" cy="83" r="7" fill="#0072B2"/><circle cx="124" cy="114" r="7" fill="#0072B2"/><circle cx="51" cy="145" r="7" fill="#0072B2"/><circle cx="98" cy="58" r="7" fill="#0072B2"/><circle cx="145" cy="89" r="7" fill="#0072B2"/><text x="85" y="204" font-size="13" text-anchor="middle">P = 0.60 atm</text><text x="180" y="115" font-size="28" text-anchor="middle">+</text><text x="275" y="24" font-size="13" font-weight="700" text-anchor="middle">Gas B alone</text><rect x="200" y="34" width="150" height="150" rx="8" fill="#fff" stroke="#5D6B79" stroke-width="2"/><rect x="214" y="46" width="13" height="13" fill="#E69F00" stroke="#333"/><rect x="261" y="77" width="13" height="13" fill="#E69F00" stroke="#333"/><rect x="308" y="108" width="13" height="13" fill="#E69F00" stroke="#333"/><text x="275" y="204" font-size="13" text-anchor="middle">P = 0.30 atm</text><text x="370" y="115" font-size="28" text-anchor="middle">=</text><text x="465" y="24" font-size="13" font-weight="700" text-anchor="middle">Mixture</text><rect x="390" y="34" width="150" height="150" rx="8" fill="#fff" stroke="#5D6B79" stroke-width="2"/><circle cx="410" cy="52" r="7" fill="#0072B2"/><circle cx="457" cy="83" r="7" fill="#0072B2"/><circle cx="504" cy="114" r="7" fill="#0072B2"/><circle cx="431" cy="145" r="7" fill="#0072B2"/><circle cx="478" cy="58" r="7" fill="#0072B2"/><circle cx="525" cy="89" r="7" fill="#0072B2"/><rect x="446" y="114" width="13" height="13" fill="#E69F00" stroke="#333"/><rect x="493" y="145" width="13" height="13" fill="#E69F00" stroke="#333"/><rect x="420" y="58" width="13" height="13" fill="#E69F00" stroke="#333"/><text x="465" y="204" font-size="13" text-anchor="middle">P(total) = 0.90 atm</text><text x="280" y="232" font-size="12" text-anchor="middle">Key: blue circle, gas A; orange square, gas B. Same volume and temperature in every box.</text><text x="280" y="250" font-size="12" text-anchor="middle">X(A) = 6/9 = 0.67, so P(A) = 0.67 × 0.90 atm = 0.60 atm.</text></g></svg>