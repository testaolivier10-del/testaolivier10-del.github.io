<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="k-manipulation-rules-t k-manipulation-rules-d">
<title id="k-manipulation-rules-t">Rules for combining K</title>
<desc id="k-manipulation-rules-d">Three boxes. Reverse it: A + B forming C has K; C forming A + B has 1 over K. Multiply by n: doubling to 2A + 2B forming 2C gives K to the n, here K squared. Add reactions: A forming B with K1 and B forming C with K2 add to A forming C with K1 times K2. A note: coefficients are exponents in K, so scaling raises K to a power and adding multiplies K values; for one equation, only temperature changes K.</desc>
<rect width="760" height="270" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="24" font-size="15" font-weight="700" text-anchor="middle">Change the equation, change K</text>
<rect x="15" y="40" width="235" height="135" rx="10" fill="#F4F7FD" stroke="#1D44A6" stroke-width="2"/>
<text x="132.5" y="64" font-size="15" font-weight="700" text-anchor="middle" fill="#1D44A6">Reverse it</text>
<text x="132.5" y="96" font-size="13" text-anchor="middle">A + B ⇌ C : K</text>
<text x="132.5" y="116" font-size="13" text-anchor="middle">C ⇌ A + B : ?</text>
<text x="132.5" y="152" font-size="16" font-weight="700" text-anchor="middle">new K = 1/K</text>
<rect x="262" y="40" width="235" height="135" rx="10" fill="#F4F7FD" stroke="#B5541B" stroke-width="2"/>
<text x="379.5" y="64" font-size="15" font-weight="700" text-anchor="middle" fill="#B5541B">Multiply by n</text>
<text x="379.5" y="96" font-size="13" text-anchor="middle">A + B ⇌ C : K</text>
<text x="379.5" y="116" font-size="13" text-anchor="middle">2A + 2B ⇌ 2C : ?</text>
<text x="379.5" y="152" font-size="16" font-weight="700" text-anchor="middle">new K = Kⁿ</text>
<rect x="509" y="40" width="235" height="135" rx="10" fill="#F4F7FD" stroke="#00513B" stroke-width="2"/>
<text x="626.5" y="64" font-size="15" font-weight="700" text-anchor="middle" fill="#00513B">Add reactions</text>
<text x="626.5" y="96" font-size="13" text-anchor="middle">A ⇌ B : K₁ ;  B ⇌ C : K₂</text>
<text x="626.5" y="116" font-size="13" text-anchor="middle">A ⇌ C : ?</text>
<text x="626.5" y="152" font-size="16" font-weight="700" text-anchor="middle">new K = K₁ × K₂</text>
<text x="380" y="210" font-size="13" text-anchor="middle">Coefficients are exponents in K, so scaling an equation raises K to a power, and adding equations multiplies K values.</text>
<text x="380" y="232" font-size="13" text-anchor="middle">For one equation, only a change of temperature changes K.</text>
</g>
</svg>
