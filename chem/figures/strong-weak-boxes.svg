<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="strong-weak-boxes-t strong-weak-boxes-d">
<title id="strong-weak-boxes-t">A strong acid and a weak acid at the same concentration</title>
<desc id="strong-weak-boxes-d">Two boxes with the same amount of acid. In the strong acid box, all six acid particles have become six hydronium ions and six anions. In the weak acid box, five of the six HA molecules are still whole and only one has ionized into one hydronium ion and one A minus ion. A note says the weak acid has fewer hydronium ions, so a higher pH, and that in a real weak acid solution usually far fewer than one in six molecules ionize.</desc>
<defs><marker id="strong-weak-boxes-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="320" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="30" y="50" width="320" height="200" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="190" y="38" font-size="14" text-anchor="middle" font-weight="700">Strong acid, HX: ionizes completely</text><circle cx="70" cy="90" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="70" y="94" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="110" cy="120" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="110" y="124" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><circle cx="170" cy="90" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="170" y="94" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="210" cy="120" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="210" y="124" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><circle cx="270" cy="90" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="270" y="94" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="310" cy="120" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="310" y="124" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><circle cx="70" cy="180" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="70" y="184" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="110" cy="210" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="110" y="214" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><circle cx="170" cy="180" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="170" y="184" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="210" cy="210" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="210" y="214" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><circle cx="270" cy="180" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="270" y="184" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="310" cy="210" r="15" fill="#CC79A7" stroke="#333" stroke-width="1.2"/><text x="310" y="214" font-size="11" font-weight="700" text-anchor="middle">X⁻</text><rect x="410" y="50" width="320" height="200" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="570" y="38" font-size="14" text-anchor="middle" font-weight="700">Weak acid, HA: mostly un-ionized</text><circle cx="455" cy="95" r="19" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="455" y="99" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="555" cy="95" r="19" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="555" y="99" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="655" cy="95" r="19" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="655" y="99" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="455" cy="190" r="19" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="455" y="194" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="555" cy="190" r="19" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="555" y="194" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="655" cy="185" r="19" fill="#F4A582" stroke="#333" stroke-width="1.2"/><text x="655" y="189" font-size="11" font-weight="700" text-anchor="middle">H₃O⁺</text><circle cx="700" cy="220" r="15" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="700" y="224" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><text x="190" y="280" font-size="14" text-anchor="middle" >HX + H₂O → H₃O⁺ + X⁻</text><text x="570" y="280" font-size="14" text-anchor="middle" >HA + H₂O ⇌ H₃O⁺ + A⁻   (Ka &lt; 1)</text><text x="380" y="308" font-size="12" text-anchor="middle" >Same acid concentration: the weak acid makes far fewer H₃O⁺ ions, so its pH is higher. Water is not drawn.</text></g></svg>
