<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Copper plating by electrolysis, and the Faraday chain</title>
<desc id="d">A beaker of copper(II) sulfate solution with two electrodes connected to an external power supply. The power supply pulls electrons from the copper anode and pushes them into the key, the cathode, where copper(II) ions are reduced and copper metal plates onto it. At the copper anode, copper atoms are oxidized to copper(II) ions. Below, the calculation chain: current times time gives charge in coulombs; charge divided by F gives moles of electrons; the half-reaction ratio, two moles of electrons per mole of copper, gives moles of copper; molar mass gives grams of copper.</desc>
<defs><marker id="ep-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D55E00"/></marker>
<marker id="ep-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="300" y="20" width="160" height="50" rx="6" fill="#F4F6F6" stroke="#1F2A28" stroke-width="3"/><text x="380" y="51" font-size="15" text-anchor="middle" font-weight="700">power supply</text>
<path d="M300,45 L200,45 L200,120 M460,45 L560,45 L560,120" fill="none" stroke="#1F2A28" stroke-width="3"/>
<line x1="500" y1="30" x2="545" y2="30" stroke="#D55E00" stroke-width="3" marker-end="url(#ep-a)"/><text x="522" y="22" font-size="14" fill="#D55E00" font-weight="700" text-anchor="middle">e⁻</text>
<line x1="215" y1="30" x2="260" y2="30" stroke="#D55E00" stroke-width="3" marker-end="url(#ep-a)"/><text x="237" y="22" font-size="14" fill="#D55E00" font-weight="700" text-anchor="middle">e⁻</text>
<path d="M130,110 L130,270 Q130,285 145,285 L615,285 Q630,285 630,270 L630,110" fill="none" stroke="#5D6B69" stroke-width="3"/>
<rect x="132" y="150" width="496" height="133" fill="#C9E1F4"/>
<rect x="185" y="120" width="30" height="140" fill="#C8783C" stroke="#7A421A" stroke-width="2"/>
<rect x="540" y="120" width="40" height="140" rx="4" fill="#B9BEC2" stroke="#4A5257" stroke-width="2"/>
<rect x="536" y="150" width="48" height="114" rx="4" fill="none" stroke="#C8783C" stroke-width="4"/>
<text x="380" y="215" font-size="14" text-anchor="middle">CuSO₄(aq)</text>
<g font-size="13" text-anchor="middle"><text x="200" y="305" font-weight="700">anode (copper)</text><text x="200" y="322">Cu → Cu²⁺ + 2e⁻</text>
<text x="560" y="305" font-weight="700">cathode (a key)</text><text x="560" y="322">Cu²⁺ + 2e⁻ → Cu (plates on)</text></g>
<g font-size="14" text-anchor="middle">
<rect x="20" y="350" width="150" height="44" rx="6" fill="#E3EAFA" stroke="#1D44A6"/><text x="95" y="377">current × time</text>
<rect x="210" y="350" width="140" height="44" rx="6" fill="#E3EAFA" stroke="#1D44A6"/><text x="280" y="377">charge (C)</text>
<rect x="390" y="350" width="140" height="44" rx="6" fill="#E3EAFA" stroke="#1D44A6"/><text x="460" y="377">mol e⁻</text>
<rect x="570" y="350" width="80" height="44" rx="6" fill="#E3EAFA" stroke="#1D44A6"/><text x="610" y="377">mol Cu</text>
<rect x="680" y="350" width="70" height="44" rx="6" fill="#E3EAFA" stroke="#1D44A6"/><text x="715" y="377">g Cu</text>
</g>
<g stroke="#1F2A28" stroke-width="2"><line x1="172" y1="372" x2="206" y2="372" marker-end="url(#ep-b)"/><line x1="352" y1="372" x2="386" y2="372" marker-end="url(#ep-b)"/><line x1="532" y1="372" x2="566" y2="372" marker-end="url(#ep-b)"/><line x1="652" y1="372" x2="676" y2="372" marker-end="url(#ep-b)"/></g>
<g font-size="12" text-anchor="middle" fill="#3D4A66"><text x="370" y="412">÷ F</text><text x="550" y="412">÷ 2 (half-reaction)</text><text x="680" y="412">× 63.55</text></g>
</g></svg>
