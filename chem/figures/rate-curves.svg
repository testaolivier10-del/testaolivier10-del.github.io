<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Concentration of a reactant and a product against time</title>
<desc id="d">Concentration on the vertical axis, time on the horizontal axis. The reactant curve starts high and falls, steeply at first and then more and more slowly. The product curve starts at zero and rises the same way, levelling off. A dashed straight line touches the reactant curve at time zero: its slope is the initial rate. A second straight line joins two points on the reactant curve: its slope is the average rate over that interval. The curve gets flatter with time, so the rate falls as the reactant is used up.</desc>
