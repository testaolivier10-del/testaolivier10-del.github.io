<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="proton-transfer-t proton-transfer-d">
<title id="proton-transfer-t">A proton transfer from HF to water</title>
<desc id="proton-transfer-d">An HF molecule passes an H⁺ (curved arrow) to a water molecule. HF is the acid, the proton donor; water is the base, the proton acceptor. The products are F⁻, the conjugate base, and H₃O⁺, the conjugate acid. Brackets join HF with F⁻ and H₂O with H₃O⁺ as conjugate pairs, each differing by one H⁺. Equation: HF(aq) + H₂O(l) ⇌ F⁻(aq) + H₃O⁺(aq).</desc>
<rect width="800" height="310" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="400" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A28">A proton moves from acid to base</text><circle cx="115" cy="110" r="13" fill="#9AD0A8" stroke="#333" stroke-width="1.3"/><text x="115" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2A28">F</text><circle cx="140" cy="110" r="8" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="140" y="113" font-size="8" font-weight="700" text-anchor="middle" fill="#1F2A28">H</text><g transform="translate(250,100) scale(1.25) translate(-250,-108)"><circle cx="250" cy="108" r="11" fill="#D55E00" stroke="#333" stroke-width="1.3"/><text x="250" y="111.6" font-size="10" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">O</text><circle cx="239" cy="116" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="239" y="118.52" font-size="7" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">H</text><circle cx="261" cy="116" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="261" y="118.52" font-size="7" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">H</text></g><path d="M148,96 Q195,52 240,96" fill="none" stroke="#D55E00" stroke-width="2.5"/><path d="M232,90 L242,99 L229,100 Z" fill="#D55E00"/><text x="195" y="58" font-size="14" font-weight="700" text-anchor="middle" fill="#D55E00">H⁺</text><text x="115" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">HF</text><text x="115" y="170" font-size="13" text-anchor="middle" fill="#1F2A28">acid (donor)</text><text x="250" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">H₂O</text><text x="250" y="170" font-size="13" text-anchor="middle" fill="#1F2A28">base (acceptor)</text><line x1="330" y1="110" x2="422" y2="110" stroke="#1F2A28" stroke-width="2.5"/><path d="M420,104 L430,110 L420,116 Z" fill="#1F2A28"/><circle cx="510" cy="110" r="13" fill="#9AD0A8" stroke="#333" stroke-width="1.3"/><text x="510" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2A28">F</text><text x="527" y="100" font-size="15" font-weight="700" fill="#1F2A28">−</text><g transform="translate(650,100) scale(1.25) translate(-650,-112)"><circle cx="650" cy="112" r="11" fill="#D55E00" stroke="#333" stroke-width="1.3"/><text x="650" y="115.6" font-size="10" text-anchor="middle" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700">O</text><circle cx="639" cy="120" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="639" y="122.52" font-size="7" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">H</text><circle cx="661" cy="120" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="661" y="122.52" font-size="7" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">H</text><circle cx="650" cy="99" r="7" fill="#FFFFFF" stroke="#333" stroke-width="1.3"/><text x="650" y="101.52" font-size="7" text-anchor="middle" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif" font-weight="700">H</text><text x="668.4511028815516" y="98.54889711844842" font-size="12" font-weight="700" fill="#1F2A28" font-family="Arial,Helvetica,sans-serif">+</text></g><text x="510" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">F⁻</text><text x="510" y="170" font-size="13" text-anchor="middle" fill="#1F2A28">conjugate base</text><text x="650" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2A28">H₃O⁺</text><text x="650" y="170" font-size="13" text-anchor="middle" fill="#1F2A28">conjugate acid</text><path d="M115,184 L115,236 L510,236 L510,184" fill="none" stroke="#1D44A6" stroke-width="2"/><text x="312" y="256" font-size="13" font-weight="700" text-anchor="middle" fill="#1D44A6">conjugate pair: HF / F⁻ (differ by one H⁺)</text><path d="M250,184 L250,206 L650,206 L650,184" fill="none" stroke="#009E73" stroke-width="2"/><text x="560" y="224" font-size="13" font-weight="700" text-anchor="middle" fill="#009E73">conjugate pair: H₃O⁺ / H₂O</text><text x="400" y="296" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2A28">HF(aq) + H₂O(l) ⇌ F⁻(aq) + H₃O⁺(aq)</text>
</g>
</svg>
