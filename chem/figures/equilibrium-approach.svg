<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="205" y="28" font-size="15" font-weight="700" text-anchor="middle">A. Concentrations level off</text>
<text x="585" y="28" font-size="15" font-weight="700" text-anchor="middle">B. The two rates become equal</text>
