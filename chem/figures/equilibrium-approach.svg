<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img" aria-labelledby="equilibrium-approach-t equilibrium-approach-d">
<title id="equilibrium-approach-t">Approaching equilibrium: concentrations and rates</title>
<desc id="equilibrium-approach-d">Two graphs for N2O4 forming NO2 in a sealed flask, starting from 0.0500 M N2O4. Graph A, concentration against time: N2O4 falls from 0.0500 M and levels off at 0.0300 M; NO2 rises from zero, twice as fast, and levels off at 0.0400 M. Graph B, rate against time: the forward rate starts high and falls, the reverse rate starts at zero and rises, and they meet and stay equal from about 50 s, the same time the concentrations level off.</desc>
