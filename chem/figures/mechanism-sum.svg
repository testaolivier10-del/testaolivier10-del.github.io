<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
<title id="t">Adding the steps of a mechanism</title>
<desc id="d">Two elementary steps stacked and added. Step 1: two nitrogen dioxide molecules form NO3 and NO. Step 2: NO3 and carbon monoxide form nitrogen dioxide and carbon dioxide. NO3 is formed in step 1 and used in step 2, so it cancels: it is an intermediate. One NO2 on each side also cancels. The sum is the overall equation, NO2 plus CO gives NO plus CO2.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="680" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="60" y="30" width="560" height="54" rx="8" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="2"/><text x="80" y="63" font-size="15" text-anchor="start" font-weight="700">Step 1</text><text x="380" y="63" font-size="18" text-anchor="middle">NO₂ + NO₂ → <tspan fill="#8E3B2E" text-decoration="line-through">NO₃</tspan> + NO</text><rect x="60" y="100" width="560" height="54" rx="8" fill="#D55E00" fill-opacity="0.12" stroke="#D55E00" stroke-width="2"/><text x="80" y="133" font-size="15" text-anchor="start" font-weight="700">Step 2</text><text x="380" y="133" font-size="18" text-anchor="middle"><tspan fill="#8E3B2E" text-decoration="line-through">NO₃</tspan> + CO → NO₂ + CO₂</text><line x1="60" y1="172" x2="620" y2="172" stroke="#1F2A28" stroke-width="2"/><rect x="60" y="190" width="560" height="54" rx="8" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="2"/><text x="80" y="223" font-size="15" text-anchor="start" font-weight="700">Overall</text><text x="380" y="223" font-size="18" text-anchor="middle">NO₂ + CO → NO + CO₂</text><text x="340" y="280" font-size="14" text-anchor="middle">NO₃ is made in step 1 and used in step 2: an intermediate. It cancels.</text>
</g>
</svg>
