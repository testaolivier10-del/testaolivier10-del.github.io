<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="stoich-roadmap-t stoich-roadmap-d">
<title id="stoich-roadmap-t">The stoichiometry road map</title>
<desc id="stoich-roadmap-d">A flow diagram. Grams of A (divide by molar mass) or volume of a solution of A (multiply by molarity) lead to moles of A. Moles of A times the mole ratio, moles of B over moles of A, gives moles of B. Moles of B lead to grams of B (multiply by molar mass) or to a volume of a solution of B (divide by molarity). The mole ratio comes from the coefficients of the balanced equation.</desc>
<rect width="800" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="400" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A28">Every route goes through moles</text><rect x="30" y="60" width="170" height="60" rx="10" fill="#F3F5F4" stroke="#888" stroke-width="2"/><text x="115" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Grams of A</text><text x="115" y="106" font-size="12" text-anchor="middle" fill="#1F2A28">from a balance</text><rect x="30" y="220" width="170" height="60" rx="10" fill="#F3F5F4" stroke="#888" stroke-width="2"/><text x="115" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Volume of A (L)</text><text x="115" y="266" font-size="12" text-anchor="middle" fill="#1F2A28">solution of known M</text><rect x="300" y="140" width="170" height="60" rx="10" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="385" y="166" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Moles of A</text><text x="385" y="186" font-size="12" text-anchor="middle" fill="#1F2A28"></text><rect x="570" y="140" width="170" height="60" rx="10" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="655" y="166" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Moles of B</text><text x="655" y="186" font-size="12" text-anchor="middle" fill="#1F2A28"></text><rect x="600" y="40" width="170" height="60" rx="10" fill="#F3F5F4" stroke="#888" stroke-width="2"/><text x="685" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Grams of B</text><text x="685" y="86" font-size="12" text-anchor="middle" fill="#1F2A28">× molar mass of B</text><rect x="600" y="250" width="170" height="60" rx="10" fill="#F3F5F4" stroke="#888" stroke-width="2"/><text x="685" y="276" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">Volume of B (L)</text><text x="685" y="296" font-size="12" text-anchor="middle" fill="#1F2A28">÷ molarity of B</text><line x1="200" y1="95" x2="300" y2="155" stroke="#1F2A28" stroke-width="2"/><path d="M290.0,154.1 L300,155 L294.5,146.6 Z" fill="#1F2A28"/><text x="270" y="108" font-size="12" text-anchor="middle" fill="#1F2A28">÷ molar mass of A</text><line x1="200" y1="245" x2="300" y2="185" stroke="#1F2A28" stroke-width="2"/><path d="M294.5,193.4 L300,185 L290.0,185.9 Z" fill="#1F2A28"/><text x="270" y="240" font-size="12" text-anchor="middle" fill="#1F2A28">× molarity of A</text><line x1="470" y1="170" x2="570" y2="170" stroke="#1F2A28" stroke-width="2"/><path d="M561.0,174.3 L570,170 L561.0,165.7 Z" fill="#1F2A28"/><text x="520" y="158" font-size="13" font-weight="700" text-anchor="middle" fill="#D55E00">× mol B</text><text x="520" y="196" font-size="13" font-weight="700" text-anchor="middle" fill="#D55E00">mol A</text><line x1="492" y1="176" x2="548" y2="176" stroke="#D55E00" stroke-width="1.5"/><line x1="655" y1="140" x2="670" y2="102" stroke="#1F2A28" stroke-width="2"/><path d="M670.7,112.0 L670,102 L662.6,108.8 Z" fill="#1F2A28"/><line x1="655" y1="200" x2="670" y2="248" stroke="#1F2A28" stroke-width="2"/><path d="M663.2,240.7 L670,248 L671.5,238.1 Z" fill="#1F2A28"/><text x="400" y="340" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2A28">The mole ratio (orange) comes from the coefficients of the balanced equation.</text>
</g>
</svg>
