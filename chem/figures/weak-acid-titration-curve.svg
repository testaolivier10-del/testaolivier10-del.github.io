<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="weak-acid-titration-curve-t weak-acid-titration-curve-d">
<title id="weak-acid-titration-curve-t">Titration curve of a weak acid with a strong base</title>
<desc id="weak-acid-titration-curve-d">pH against volume of 0.100 molar sodium hydroxide added to 25.00 mL of 0.100 molar weak acid HA with Ka 1.8 times ten to the minus 5. The pH starts at 2.88, rises slowly through the buffer region, passes pH 4.74 at 12.50 mL, the half-equivalence point where pH equals pKa, then rises steeply to the equivalence point at 25.00 mL, pH 8.72, which is above 7. After that the curve levels off near pH 12.5 as excess hydroxide builds up.</desc>
<defs><marker id="weak-acid-titration-curve-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
