<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="chr-t chr-d"><title id="chr-t">Reading a paper chromatogram</title><desc id="chr-d">A strip of paper standing in a shallow layer of solvent. A pencil start line is drawn 1.0 cm above the bottom; the ink sample was spotted on it. The solvent has risen to a front 9.0 cm above the start line. The ink has separated into two spots: a blue spot that traveled 6.3 cm (Rf 0.70) and a red spot that traveled 2.7 cm (Rf 0.30). Rf equals the distance the spot moved divided by the distance the solvent moved.</desc><defs><marker id="chr-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="560" height="300" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="80" y="10" width="110" height="280" fill="#FAFAF7" stroke="#333"/><rect x="60" y="276" width="150" height="16" fill="#9CC3E6" opacity="0.8"/><line x1="80" y1="262" x2="190" y2="262" stroke="#555" stroke-dasharray="4 3"/><line x1="80" y1="46.0" x2="190" y2="46.0" stroke="#0072B2" stroke-width="2"/><ellipse cx="135" cy="110.80000000000001" rx="13" ry="9" fill="#0072B2"/><ellipse cx="135" cy="197.2" rx="13" ry="9" fill="#D55E00"/><circle cx="135" cy="262" r="4" fill="#555"/><line x1="215" y1="262" x2="215" y2="46.0" stroke="#1F2A28" stroke-width="1.5" marker-start="url(#chr-a)" marker-end="url(#chr-a)"/><text x="223" y="158.0" font-size="12">solvent: 9.0 cm</text><line x1="320" y1="262" x2="320" y2="110.80000000000001" stroke="#1F2A28" stroke-width="1.5" marker-start="url(#chr-a)" marker-end="url(#chr-a)"/><text x="328" y="190.4" font-size="12">blue: 6.3 cm</text><line x1="425" y1="262" x2="425" y2="197.2" stroke="#1F2A28" stroke-width="1.5" marker-start="url(#chr-a)" marker-end="url(#chr-a)"/><text x="433" y="233.6" font-size="12">red: 2.7 cm</text><text x="200" y="40.0" font-size="12" fill="#0072B2">solvent front</text><text x="200" y="266" font-size="12">start line</text><text x="400" y="40" font-size="13" text-anchor="middle">Rf = spot distance ÷ solvent distance</text><text x="400" y="60" font-size="13" text-anchor="middle">blue: 6.3 ÷ 9.0 = 0.70; red: 2.7 ÷ 9.0 = 0.30</text></g></svg>