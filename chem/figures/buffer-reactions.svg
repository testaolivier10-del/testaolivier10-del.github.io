<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="buffer-reactions-t buffer-reactions-d">
<title id="buffer-reactions-t">How a buffer handles added acid and added base</title>
<desc id="buffer-reactions-d">Center: a box with equal numbers of weak acid molecules HA and conjugate base ions A minus. Left arrow: added hydronium reacts with A minus to form HA and water, so the hydronium is used up. Right arrow: added hydroxide reacts with HA to form A minus and water, so the hydroxide is used up. Each reaction goes essentially to completion.</desc>
<defs><marker id="buffer-reactions-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="270" y="60" width="220" height="170" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="380" y="48" font-size="14" text-anchor="middle" font-weight="700">Buffer: HA and A⁻ together</text><circle cx="305" cy="100" r="18" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="305" y="104" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="375" cy="95" r="18" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="375" y="99" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="445" cy="105" r="18" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="445" y="109" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="320" cy="190" r="18" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="320" y="194" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="400" cy="195" r="18" fill="#E69F00" stroke="#333" stroke-width="1.2"/><text x="400" y="199" font-size="11" font-weight="700" text-anchor="middle">HA</text><circle cx="340" cy="145" r="16" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="340" y="149" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><circle cx="420" cy="150" r="16" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="420" y="154" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><circle cx="460" cy="190" r="16" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="460" y="194" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><circle cx="295" cy="150" r="16" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="295" y="154" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><circle cx="450" cy="145" r="16" fill="#56B4E9" stroke="#333" stroke-width="1.2"/><text x="450" y="149" font-size="11" font-weight="700" text-anchor="middle">A⁻</text><rect x="20" y="70" width="210" height="150" rx="10" fill="#FDF0E6" stroke="#D55E00"/><text x="125" y="95" font-size="14" text-anchor="middle" font-weight="700">Add strong acid</text><text x="125" y="125" font-size="13" text-anchor="middle" >H₃O⁺ + A⁻ → HA + H₂O</text><text x="125" y="155" font-size="12" text-anchor="middle" >A⁻ is used up a little;</text><text x="125" y="175" font-size="12" text-anchor="middle" >HA goes up a little.</text><text x="125" y="200" font-size="12" text-anchor="middle" >Few free H₃O⁺ remain.</text><rect x="530" y="70" width="210" height="150" rx="10" fill="#E8F1FA" stroke="#0072B2"/><text x="635" y="95" font-size="14" text-anchor="middle" font-weight="700">Add strong base</text><text x="635" y="125" font-size="13" text-anchor="middle" >OH⁻ + HA → A⁻ + H₂O</text><text x="635" y="155" font-size="12" text-anchor="middle" >HA is used up a little;</text><text x="635" y="175" font-size="12" text-anchor="middle" >A⁻ goes up a little.</text><text x="635" y="200" font-size="12" text-anchor="middle" >Few free OH⁻ remain.</text><line x1="262" y1="145" x2="236" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#buffer-reactions-a)"/><line x1="498" y1="145" x2="524" y2="145" stroke="#1F2A28" stroke-width="2" marker-end="url(#buffer-reactions-a)"/><text x="380" y="270" font-size="14" text-anchor="middle" >The ratio [A⁻]/[HA] changes only slightly, so the pH changes only slightly.</text><text x="380" y="298" font-size="12" text-anchor="middle" >Key: HA weak acid; A⁻ its conjugate base. Water and spectator ions are not drawn.</text></g></svg>
