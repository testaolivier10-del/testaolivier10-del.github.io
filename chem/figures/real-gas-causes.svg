<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="rg-t rg-d"><title id="rg-t">Why real gases deviate from ideal behavior</title><desc id="rg-d">Two panels. Left, attractions: a particle about to hit the wall is pulled back by attractions to its neighbours, so it hits the wall less hard and the measured pressure is lower than ideal. Right, particle volume: at high pressure the particles fill a noticeable share of the container, so the space they can move in is smaller than the container volume and the real volume is larger than the ideal prediction.</desc><defs><marker id="rg-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="640" height="250" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><text x="160" y="24" font-size="14" font-weight="700" text-anchor="middle">1. Attractions lower the pressure</text><rect x="30" y="38" width="250" height="160" rx="6" fill="#fff" stroke="#5D6B79" stroke-width="2"/><rect x="274" y="38" width="6" height="160" fill="#5D6B79"/><circle cx="245" cy="118" r="11" fill="#009E73"/><circle cx="190" cy="90" r="11" fill="#009E73"/><line x1="199" y1="96" x2="235" y2="111" stroke="#0072B2" stroke-width="2" stroke-dasharray="4 3"/><circle cx="195" cy="150" r="11" fill="#009E73"/><line x1="204" y1="144" x2="235" y2="126" stroke="#0072B2" stroke-width="2" stroke-dasharray="4 3"/><circle cx="170" cy="118" r="11" fill="#009E73"/><line x1="179" y1="118" x2="235" y2="118" stroke="#0072B2" stroke-width="2" stroke-dasharray="4 3"/><line x1="245" y1="134" x2="268" y2="134" stroke="#1F2A28" stroke-width="2" marker-end="url(#rg-a)"/><text x="155" y="218" font-size="12" text-anchor="middle">neighbours tug back, so the wall is hit</text><text x="155" y="234" font-size="12" text-anchor="middle">less hard: P(real) &lt; P(ideal)</text><text x="480" y="24" font-size="14" font-weight="700" text-anchor="middle">2. Particle volume matters</text><rect x="370" y="38" width="220" height="160" rx="6" fill="#fff" stroke="#5D6B79" stroke-width="2"/><circle cx="392" cy="60" r="13" fill="#0072B2"/><circle cx="392" cy="118" r="13" fill="#0072B2"/><circle cx="392" cy="176" r="13" fill="#0072B2"/><circle cx="421" cy="89" r="13" fill="#0072B2"/><circle cx="421" cy="147" r="13" fill="#0072B2"/><circle cx="450" cy="60" r="13" fill="#0072B2"/><circle cx="450" cy="118" r="13" fill="#0072B2"/><circle cx="450" cy="176" r="13" fill="#0072B2"/><circle cx="479" cy="89" r="13" fill="#0072B2"/><circle cx="479" cy="147" r="13" fill="#0072B2"/><circle cx="508" cy="60" r="13" fill="#0072B2"/><circle cx="508" cy="118" r="13" fill="#0072B2"/><circle cx="508" cy="176" r="13" fill="#0072B2"/><circle cx="537" cy="89" r="13" fill="#0072B2"/><circle cx="537" cy="147" r="13" fill="#0072B2"/><circle cx="566" cy="60" r="13" fill="#0072B2"/><circle cx="566" cy="118" r="13" fill="#0072B2"/><circle cx="566" cy="176" r="13" fill="#0072B2"/><text x="480" y="218" font-size="12" text-anchor="middle">at high pressure the particles fill part of</text><text x="480" y="234" font-size="12" text-anchor="middle">the space: V(real) &gt; V(ideal)</text></g></svg>