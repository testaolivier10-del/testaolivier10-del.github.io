" font-weight="700">2</text><line x1="191.42857142857142" y1="150" x2="191.42857142857142" y2="158" stroke="#333"/><text x="191.42857142857142" y="172" font-size="13" text-anchor="middle" font-weight="700">3</text><line x1="238.57142857142856" y1="150" x2="238.57142857142856" y2="158" stroke="#333"/><text x="238.57142857142856" y="172" font-size="13" text-anchor="middle" font-weight="700">4</text><line x1="285.7142857142857" y1="150" x2="285.7142857142857" y2="158" stroke="#333"/><text x="285.7142857142857" y="172" font-size="13" text-anchor="middle" font-weight="700">5</text><line x1="332.85714285714283" y1="150" x2="332.85714285714283" y2="158" stroke="#333"/><text x="332.85714285714283" y="172" font-size="13" text-anchor="middle" font-weight="700">6</text><line x1="380" y1="150" x2="380" y2="158" stroke="#333"/><text x="380" y="172" font-size="13" text-anchor="middle" font-weight="700">7</text><line x1="427.1428571428571" y1="150" x2="427.1428571428571" y2="158" stroke="#333"/><text x="427.1428571428571" y="172" font-size="13" text-anchor="middle" font-weight="700">8</text><line x1="474.28571428571433" y1="150" x2="474.28571428571433" y2="158" stroke="#333"/><text x="474.28571428571433" y="172" font-size="13" text-anchor="middle" font-weight="700">9</text><line x1="521.4285714285714" y1="150" x2="521.4285714285714" y2="158" stroke="#333"/><text x="521.4285714285714" y="172" font-size="13" text-anchor="middle" font-weight="700">10</text><line x1="568.5714285714286" y1="150" x2="568.5714285714286" y2="158" stroke="#333"/><text x="568.5714285714286" y="172" font-size="13" text-anchor="middle" font-weight="700">11</text><line x1="615.7142857142857" y1="150" x2="615.7142857142857" y2="158" stroke="#333"/><text x="615.7142857142857" y="172" font-size="13" text-anchor="middle" font-weight="700">12</text><line x1="662.8571428571429" y1="150" x2="662.8571428571429" y2="158" stroke="#333"/><text x="662.8571428571429" y="172" font-size="13" text-anchor="middle" font-weight="700">13</text><line x1="710" y1="150" x2="710" y2="158" stroke="#333"/><text x="710" y="172" font-size="13" text-anchor="middle" font-weight="700">14</text><text x="50" y="196" font-size="12" text-anchor="middle" >1</text><text x="50" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−14</tspan></text><text x="144.28571428571428" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−2</tspan></text><text x="144.28571428571428" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−12</tspan></text><text x="238.57142857142856" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−4</tspan></text><text x="238.57142857142856" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−10</tspan></text><text x="380" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−7</tspan></text><text x="380" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−7</tspan></text><text x="521.4285714285714" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−10</tspan></text><text x="521.4285714285714" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−4</tspan></text><text x="615.7142857142857" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−12</tspan></text><text x="615.7142857142857" y="96" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−2</tspan></text><text x="710" y="196" font-size="12" text-anchor="middle" >10<tspan dy="-6" font-size="10">−14</tspan></text><text x="710" y="96" font-size="12" text-anchor="middle" >1</text><text x="4" y="218" font-size="12" >[H₃O⁺]</text><text x="4" y="74" font-size="12" >[OH⁻]</text><text x="726" y="200" font-size="12" >M</text><text x="726" y="92" font-size="12" >M</text><text x="215" y="135" font-size="15" text-anchor="middle" font-weight="700">acidic</text><text x="380" y="135" font-size="13" text-anchor="middle" font-weight="700">neutral</text><text x="545" y="135" font-size="15" text-anchor="middle" font-weight="700">basic</text><text x="380" y="40" font-size="15" text-anchor="middle" font-weight="700">pH = −log[H₃O⁺]     pOH = −log[OH⁻]     pH + pOH = 14.00 at 25 °C</text><text x="380" y="240" font-size="14" text-anchor="middle" >One pH unit lower = ten times more H₃O⁺.  pH 3 has 100 times the H₃O⁺ of pH 5.</text><text x="380" y="268" font-size="14" text-anchor="middle" >[H₃O⁺][OH⁻] = Kw = 1.0 × 10⁻¹⁴ at 25 °C, so when one goes up the other goes down.</text></g></svg>
