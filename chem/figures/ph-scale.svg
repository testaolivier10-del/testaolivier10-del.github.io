<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ph-scale-t ph-scale-d">
<title id="ph-scale-t">The pH scale at 25 °C</title>
<desc id="ph-scale-d">A bar from pH 0 to 14. Below it, the hydronium ion concentration from 1 molar at pH 0 to 1 times ten to the minus 14 molar at pH 14; above it, the hydroxide concentration running the opposite way. The left part is shaded as acidic, pH 7 is marked neutral, and the right part is basic. A note says each step of one pH unit is a factor of ten in hydronium concentration, and pH plus pOH equals 14.00.</desc>
<defs><marker id="ph-scale-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="300" fill="#ffffff"/>
