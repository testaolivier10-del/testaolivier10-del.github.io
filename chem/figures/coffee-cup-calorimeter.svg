<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="t d">
<title id="t">A coffee-cup calorimeter</title>
<desc id="d">Two nested foam cups with a lid hold a solution. A thermometer and a stirrer pass through the lid into the solution. Labels: the lid and the foam cups slow energy exchange with the room; the reaction is the system; the solution is the surroundings that is measured. Beside the cup: q of the solution equals m c delta T, and q of the reaction equals minus q of the solution.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1D44A6"/></marker></defs>
<rect width="700" height="380" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<path d="M120,120 L150,330 L290,330 L320,120 Z" fill="#F4F1EA" stroke="#1F2A28" stroke-width="2"/>
<path d="M135,128 L162,320 L278,320 L305,128 Z" fill="#F9F8F4" stroke="#1F2A28" stroke-width="1.5"/>
<path d="M150,190 L170,316 L270,316 L290,190 Z" fill="#CFE0F7" stroke="none"/>
<rect x="108" y="104" width="224" height="16" rx="4" fill="#E6E1D6" stroke="#1F2A28" stroke-width="2"/>
<rect x="186" y="40" width="12" height="250" rx="6" fill="#fff" stroke="#1F2A28" stroke-width="2"/><circle cx="192" cy="292" r="10" fill="#C2410C" stroke="#1F2A28" stroke-width="2"/><rect x="189" y="170" width="6" height="115" fill="#C2410C"/>
<line x1="250" y1="50" x2="250" y2="300" stroke="#1F2A28" stroke-width="3"/><ellipse cx="250" cy="300" rx="22" ry="5" fill="none" stroke="#1F2A28" stroke-width="3"/>
<circle cx="175" cy="230" r="4" fill="#1D44A6"/><circle cx="215" cy="250" r="4" fill="#1D44A6"/><circle cx="240" cy="220" r="4" fill="#1D44A6"/><circle cx="205" cy="290" r="4" fill="#1D44A6"/><circle cx="260" cy="275" r="4" fill="#1D44A6"/><circle cx="180" cy="270" r="4" fill="#1D44A6"/>
<text x="192" y="32" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">thermometer</text>
<text x="250" y="42" font-size="14" text-anchor="start" font-weight="normal" fill="#1F2A28">stirrer</text>
<line x1="400" y1="112" x2="335" y2="112" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/>
<text x="405" y="117" font-size="15" text-anchor="start" font-weight="normal" fill="#1F2A28">lid</text>
<line x1="400" y1="160" x2="318" y2="160" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/>
<text x="405" y="165" font-size="15" text-anchor="start" font-weight="normal" fill="#1F2A28">two nested foam cups</text>
<text x="405" y="185" font-size="13" text-anchor="start" font-weight="normal" fill="#1F2A28">slow energy exchange with the room</text>
<line x1="400" y1="250" x2="282" y2="250" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/>
<text x="405" y="245" font-size="15" text-anchor="start" font-weight="normal" fill="#1F2A28">solution: the measured</text>
<text x="405" y="265" font-size="15" text-anchor="start" font-weight="normal" fill="#1F2A28">surroundings (mass m)</text>
<rect x="395" y="290" width="290" height="70" rx="8" fill="#EEF3FC" stroke="#1D44A6"/><text x="540" y="318" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F2A28">q(solution) = m × c × ΔT</text>
<text x="540" y="345" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F2A28">q(reaction) = − q(solution)</text>
</g>
</svg>
