<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d">
<title id="t">A fast reversible step before a slow step</title>
<desc id="d">Step 1 is drawn with a pair of arrows: A plus B forms the intermediate I at rate k1 times [A] times [B], and I falls back to A plus B at rate k-1 times [I]. Both are fast and equal. Step 2, slow: I plus C forms products at rate k2 times [I] times [C]. Below, setting the two step 1 rates equal gives [I] equal to k1 over k-1 times [A][B]; substituting into the slow step gives rate equals k2 k1 over k-1 times [A][B][C].</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="680" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="160" y="70" font-size="20" text-anchor="middle">A + B</text><line x1="210" y1="58" x2="330" y2="58" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><line x1="330" y1="78" x2="210" y2="78" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><text x="370" y="70" font-size="20" text-anchor="middle" font-style="italic">I</text><text x="270" y="48" font-size="14" text-anchor="middle">k₁[A][B]</text><text x="270" y="100" font-size="14" text-anchor="middle">k₋₁[I]</text><text x="560" y="64" font-size="14" text-anchor="middle" font-weight="700" fill="#8E3B2E">Step 1: fast,</text><text x="560" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#8E3B2E">both directions</text><text x="330" y="150" font-size="20" text-anchor="middle">I + C  →  products</text><text x="560" y="146" font-size="14" text-anchor="middle" font-weight="700" fill="#005A8C">Step 2: slow</text><text x="330" y="172" font-size="14" text-anchor="middle">rate = k₂[I][C]</text><rect x="90" y="200" width="500" height="110" rx="8" fill="#009E73" fill-opacity="0.1" stroke="#009E73" stroke-width="2"/><text x="340" y="228" font-size="16" text-anchor="middle">Step 1 rates equal:  k₁[A][B] = k₋₁[I]</text><text x="340" y="256" font-size="16" text-anchor="middle">so  [I] = (k₁/k₋₁)[A][B]</text><text x="340" y="290" font-size="17" text-anchor="middle" font-weight="700">rate = k₂(k₁/k₋₁)[A][B][C]</text>
</g>
</svg>
