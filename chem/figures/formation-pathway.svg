<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
<title id="t">Path through the elements for burning methane</title>
<desc id="d">Enthalpy ladder for methane burning. A dashed reference line in the middle marks the elements in their most stable forms, carbon as graphite, hydrogen gas and oxygen gas, with enthalpy zero. The reactants, methane plus 2 oxygen, sit 74.8 kilojoules below it. The products, carbon dioxide plus 2 liquid water, sit 965.1 kilojoules below it. Step 1, an upward arrow, takes the reactants apart into elements: plus 74.8. Step 2, a long downward arrow, builds the products from elements: minus 965.1. Overall delta H is minus 890.3 kilojoules.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1D44A6"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<line x1="60" y1="400" x2="60" y2="30" stroke="#1F2A28" stroke-width="2" marker-end="url(#ak)"/><text transform="translate(40,220) rotate(-90)" font-size="15" text-anchor="middle">Enthalpy</text>
<line x1="80" y1="90" x2="720" y2="90" stroke="#5D6B69" stroke-width="2" stroke-dasharray="8 6"/><text x="400" y="76" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F2A28">Elements in their standard states: C(graphite), 2 H₂(g), 2 O₂(g): ΔH°f = 0</text>
<line x1="100" y1="125" x2="300" y2="125" stroke="#1F2A28" stroke-width="4"/><text x="200" y="149" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F2A28">CH₄(g) + 2 O₂(g)</text>
<text x="200" y="169" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">−74.8 kJ</text>
<line x1="480" y1="370" x2="700" y2="370" stroke="#1F2A28" stroke-width="4"/><text x="590" y="394" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F2A28">CO₂(g) + 2 H₂O(l)</text>
<text x="590" y="414" font-size="14" text-anchor="middle" font-weight="normal" fill="#1F2A28">−393.5 + 2(−285.8) = −965.1 kJ</text>
<line x1="280" y1="122" x2="280" y2="94" stroke="#1D44A6" stroke-width="3" marker-end="url(#ac)"/>
<text x="290" y="112" font-size="14" text-anchor="start" font-weight="bold" fill="#1D44A6">step 1: +74.8</text>
<line x1="500" y1="93" x2="500" y2="365" stroke="#C2410C" stroke-width="4" marker-end="url(#ah)"/>
<text x="510" y="230" font-size="14" text-anchor="start" font-weight="bold" fill="#C2410C">step 2: −965.1</text>
<line x1="150" y1="177" x2="150" y2="370" stroke="#1F2A28" stroke-width="3" marker-end="url(#ak)"/>
<line x1="150" y1="370" x2="470" y2="370" stroke="#5D6B69" stroke-dasharray="5 5"/><text x="160" y="290" font-size="16" text-anchor="start" font-weight="bold" fill="#1F2A28">overall:</text>
<text x="160" y="312" font-size="16" text-anchor="start" font-weight="bold" fill="#1F2A28">ΔH° = −890.3 kJ</text>
</g>
</svg>
