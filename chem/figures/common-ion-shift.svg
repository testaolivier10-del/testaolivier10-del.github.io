<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="common-ion-shift-t common-ion-shift-d">
<title id="common-ion-shift-t">The common-ion effect</title>
<desc id="common-ion-shift-d">A bar chart of the molar solubility of PbCl2 at 25 °C: 1.6 × 10−2 M in pure water, falling to 1.3 × 10−2 M in 0.010 M NaCl, 4.8 × 10−3 M in 0.050 M NaCl and 2.7 × 10−4 M in 0.25 M NaCl. A side panel explains: Q = [Pb2+][Cl−] squared; added chloride raises Q above Ksp, so solid forms until Q = Ksp; Ksp is unchanged but the solubility is lower.</desc>
<rect width="760" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="24" font-size="15" font-weight="700" text-anchor="middle">PbCl₂ dissolves less when Cl⁻ is already present</text>
<line x1="60" y1="240" x2="440" y2="240" stroke="#333" stroke-width="2"/>
<rect x="80" y="60" width="70" height="180" fill="#1D44A6" stroke="#333"/><text x="115" y="258" font-size="13" text-anchor="middle">water</text><text x="115" y="54" font-size="12" text-anchor="middle">1.6 × 10<tspan dy="-5" font-size="9">−2</tspan><tspan dy="5"> </tspan></text><rect x="170" y="95.00664910107088" width="70" height="144.99335089892912" fill="#B5541B" stroke="#333"/><text x="205" y="258" font-size="13" text-anchor="middle">0.010 M NaCl</text><text x="205" y="89.00664910107088" font-size="12" text-anchor="middle">1.3 × 10<tspan dy="-5" font-size="9">−2</tspan><tspan dy="5"> </tspan></text><rect x="260" y="186.7795227844295" width="70" height="53.22047721557049" fill="#B5541B" stroke="#333"/><text x="295" y="258" font-size="13" text-anchor="middle">0.050 M NaCl</text><text x="295" y="180.7795227844295" font-size="12" text-anchor="middle">4.8 × 10<tspan dy="-5" font-size="9">−3</tspan><tspan dy="5"> </tspan></text><rect x="350" y="236.99047065741007" width="70" height="3.0095293425899277" fill="#B5541B" stroke="#333"/><text x="385" y="258" font-size="13" text-anchor="middle">0.25 M NaCl</text><text x="385" y="230.99047065741007" font-size="12" text-anchor="middle">2.7 × 10<tspan dy="-5" font-size="9">−4</tspan><tspan dy="5"> </tspan></text>
<text x="250" y="280" font-size="13" text-anchor="middle">Molar solubility of PbCl₂ (M) at 25 °C</text>
<rect x="470" y="50" width="275" height="190" rx="10" fill="#F4F7FD" stroke="#1D44A6" stroke-width="2"/>
<text x="607" y="76" font-size="14" font-weight="700" text-anchor="middle">Why, with Q and K<tspan font-size="9" dy="3">sp</tspan><tspan dy="-3"></tspan></text>
<text x="482" y="104" font-size="13">PbCl₂(s) ⇌ Pb²⁺ + 2 Cl⁻</text>
<text x="482" y="130" font-size="13">Q = [Pb²⁺][Cl⁻]²</text>
<text x="482" y="156" font-size="13">Added Cl⁻ raises Q above K<tspan font-size="9" dy="3">sp</tspan><tspan dy="-3"></tspan>,</text>
<text x="482" y="176" font-size="13">so solid forms until Q = K<tspan font-size="9" dy="3">sp</tspan><tspan dy="-3"></tspan>.</text>
<text x="482" y="202" font-size="13">K<tspan font-size="9" dy="3">sp</tspan><tspan dy="-3"></tspan> is unchanged;</text>
<text x="482" y="222" font-size="13">the solubility is lower.</text>
</g>
</svg>
