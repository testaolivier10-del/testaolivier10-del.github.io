<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img" aria-labelledby="le-chatelier-stresses-t le-chatelier-stresses-d">
<title id="le-chatelier-stresses-t">Stresses and shifts</title>
<desc id="le-chatelier-stresses-d">A table of changes made to a system at equilibrium, the direction of shift, and whether K changes. Add a reactant or remove a product: shift toward products, K unchanged. Add a product or remove a reactant: toward reactants, K unchanged. Decrease the volume of a gas mixture: toward fewer gas moles, K unchanged. Add an inert gas at constant volume: no shift. Add a catalyst: no shift. Raise the temperature of an endothermic reaction: toward products, and K rises. Raise the temperature of an exothermic reaction: toward reactants, and K falls.</desc>
<rect width="760" height="345" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="380" y="24" font-size="15" font-weight="700" text-anchor="middle">Stresses and shifts</text><rect x="20" y="38" width="380" height="32" fill="#E3EAFA" stroke="#5D6B69"/><text x="30" y="59" font-size="13" font-weight="700">Change made to a system at equilibrium</text><rect x="400" y="38" width="200" height="32" fill="#E3EAFA" stroke="#5D6B69"/><text x="410" y="59" font-size="13" font-weight="700">Shift</text><rect x="600" y="38" width="140" height="32" fill="#E3EAFA" stroke="#5D6B69"/><text x="610" y="59" font-size="13" font-weight="700">K changes?</text><rect x="20" y="70" width="380" height="34" fill="#fff" stroke="#5D6B69"/><text x="30" y="92" font-size="13">Add a reactant (or remove a product)</text><rect x="400" y="70" width="200" height="34" fill="#fff" stroke="#5D6B69"/><text x="410" y="92" font-size="13">toward products</text><rect x="600" y="70" width="140" height="34" fill="#fff" stroke="#5D6B69"/><text x="610" y="92" font-size="13">no</text><rect x="20" y="104" width="380" height="34" fill="#fff" stroke="#5D6B69"/><text x="30" y="126" font-size="13">Add a product (or remove a reactant)</text><rect x="400" y="104" width="200" height="34" fill="#fff" stroke="#5D6B69"/><text x="410" y="126" font-size="13">toward reactants</text><rect x="600" y="104" width="140" height="34" fill="#fff" stroke="#5D6B69"/><text x="610" y="126" font-size="13">no</text><rect x="20" y="138" width="380" height="34" fill="#fff" stroke="#5D6B69"/><text x="30" y="160" font-size="13">Decrease the volume (gases)</text><rect x="400" y="138" width="200" height="34" fill="#fff" stroke="#5D6B69"/><text x="410" y="160" font-size="13">toward fewer gas moles</text><rect x="600" y="138" width="140" height="34" fill="#fff" stroke="#5D6B69"/><text x="610" y="160" font-size="13">no</text><rect x="20" y="172" width="380" height="34" fill="#fff" stroke="#5D6B69"/><text x="30" y="194" font-size="13">Add an inert gas at constant volume</text><rect x="400" y="172" width="200" height="34" fill="#fff" stroke="#5D6B69"/><text x="410" y="194" font-size="13">no shift</text><rect x="600" y="172" width="140" height="34" fill="#fff" stroke="#5D6B69"/><text x="610" y="194" font-size="13">no</text><rect x="20" y="206" width="380" height="34" fill="#fff" stroke="#5D6B69"/><text x="30" y="228" font-size="13">Add a catalyst</text><rect x="400" y="206" width="200" height="34" fill="#fff" stroke="#5D6B69"/><text x="410" y="228" font-size="13">no shift</text><rect x="600" y="206" width="140" height="34" fill="#fff" stroke="#5D6B69"/><text x="610" y="228" font-size="13">no</text><rect x="20" y="240" width="380" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="30" y="262" font-size="13">Raise T, endothermic (ΔH > 0)</text><rect x="400" y="240" width="200" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="410" y="262" font-size="13">toward products</text><rect x="600" y="240" width="140" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="610" y="262" font-size="13">yes: K rises</text><rect x="20" y="274" width="380" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="30" y="296" font-size="13">Raise T, exothermic (ΔH < 0)</text><rect x="400" y="274" width="200" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="410" y="296" font-size="13">toward reactants</text><rect x="600" y="274" width="140" height="34" fill="#FFF4D6" stroke="#5D6B69"/><text x="610" y="296" font-size="13">yes: K falls</text><text x="380" y="334" font-size="13" text-anchor="middle">Only a temperature change alters K. Every other change alters the mixture, and the system shifts back toward the same K.</text>
</g>
</svg>
