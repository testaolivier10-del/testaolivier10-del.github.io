<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="vf-t vf-d"><title id="vf-t">Preparing a solution of known molarity</title><desc id="vf-d">Four steps. 1, weigh the solid on an analytical balance. 2, transfer it to a volumetric flask and add deionized water to about half full, then swirl until the solid has dissolved. 3, add water until the bottom of the curved liquid surface sits on the line etched on the neck of the flask. 4, stopper and invert the flask several times to mix.</desc><rect width="720" height="260" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="20" y="150" width="120" height="40" rx="4" fill="#DDE3EA" stroke="#333"/><rect x="45" y="138" width="70" height="12" fill="#BFC8D2" stroke="#333"/><path d="M65,138 Q80,118 95,138 Z" fill="#fff" stroke="#333"/><text x="80" y="176" font-size="13" text-anchor="middle">2.922 g</text><text x="80" y="232" font-size="12" text-anchor="middle">1. Weigh the solid</text><text x="80" y="248" font-size="12" text-anchor="middle">(analytical balance)</text><polygon points="209.7,168.0 210.4,171.1 211.3,174.2 212.4,177.2 213.7,180.2 215.2,183.0 216.9,185.7 218.8,188.3 220.8,190.8 223.1,193.1 225.4,195.2 228.0,197.2 230.6,199.0 233.4,200.6 236.3,202.0 239.3,203.2 242.3,204.2 245.4,205.0 248.6,205.6 251.8,205.9 255.0,206.0 258.2,205.9 261.4,205.6 264.6,205.0 267.7,204.2 270.7,203.2 273.7,202.0 276.6,200.6 279.4,199.0 282.0,197.2 284.6,195.2 286.9,193.1 289.2,190.8 291.2,188.3 293.1,185.7 294.8,183.0 296.3,180.2 297.6,177.2 298.7,174.2 299.6,171.1 300.3,168.0" fill="#9CC3E6"/><polygon points="246.0,40.0 246.0,114.9 241.6,116.0 237.4,117.5 233.3,119.4 229.4,121.8 225.8,124.5 222.5,127.5 219.4,130.8 216.7,134.5 214.4,138.3 212.5,142.4 211.0,146.7 209.9,151.0 209.2,155.5 209.0,160.0 209.2,164.5 209.9,169.0 211.0,173.4 212.5,177.6 214.4,181.7 216.8,185.6 219.4,189.2 222.5,192.5 225.8,195.6 229.4,198.3 233.3,200.6 237.4,202.5 241.6,2