<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="em-t em-d"><title id="em-t">The electromagnetic spectrum and what each region does to molecules</title><desc id="em-d">A horizontal band of six regions from long wavelength, low energy on the left to short wavelength, high energy on the right: radio (longer than 1 m); microwave (1 mm to 1 m), which makes molecules rotate faster; infrared (700 nm to 1 mm), which makes bonds vibrate more; visible (400 to 700 nm) and ultraviolet (10 to 400 nm), which move valence electrons to higher energy levels; and X-rays (0.01 to 10 nm), which can remove inner electrons. An arrow shows energy per photon rising to the right and wavelength getting shorter.</desc><defs><linearGradient id="em-vis" x1="0" x2="1"><stop offset="0" stop-color="#D7301F"/><stop offset="0.3" stop-color="#FDAE61"/><stop offset="0.5" stop-color="#FFFFBF"/><stop offset="0.7" stop-color="#66BD63"/><stop offset="1" stop-color="#5E3C99"/></linearGradient><marker id="em-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="760" height="230" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="20" y="60" width="120" height="50" fill="#BBBBBB" stroke="#333"/><text x="80.0" y="90" font-size="14" font-weight="700" text-anchor="middle">Radio</text><text x="80.0" y="132" font-size="12" text-anchor="middle">> 1 m</text><rect x="142" y="60" width="120" height="50" fill="#9ECAE1" stroke="#333"/><text x="202.0" y="90" font-size="14" font-weight="700" text-anchor="middle">Microwave</text><text x="202.0" y="132" font-size="12" text-anchor="middle">1 mm–1 m</text><text x="202.0" y="156" font-size="12" text-anchor="middle">molecules</text><text x="202.0" y="171" font-size="12" text-anchor="middle">rotate</text><rect x="264" y="60" width="120" height="50" fill="#F4A582" stroke="#333"/><text x="324.0" y="90" font-size="14" font-weight="700" text-anchor="middle">Infrared</text><text x="324.0" y="132" font-size="12" text-anchor="middle">700 nm–1 mm</text><text x="324.0" y="156" font-size="12" text-anchor="middle">bonds</text><text x="324.0" y="171" font-size="12" text-anchor="middle">vibrate</text><rect x="386" y="60" width="120" height="50" fill="url(#em-vis)" stroke="#333"/><text x="446.0" y="90" font-size="14" font-weight="700" text-anchor="middle">Visible</text><text x="446.0" y="132" font-size="12" text-anchor="middle">400–700 nm</text><text x="446.0" y="156" font-size="12" text-anchor="middle">valence electrons</text><text x="446.0" y="171" font-size="12" text-anchor="middle">jump</text><rect x="508" y="60" width="120" height="50" fill="#B39DDB" stroke="#333"/><text x="568.0" y="90" font-size="14" font-weight="700" text-anchor="middle">Ultraviolet</text><text x="568.0" y="132" font-size="12" text-anchor="middle">10–400 nm</text><text x="568.0" y="156" font-size="12" text-anchor="middle">valence electrons</text><text x="568.0" y="171" font-size="12" text-anchor="middle">jump</text><rect x="630" y="60" width="120" height="50" fill="#888888" stroke="#333"/><text x="690.0" y="90" font-size="14" font-weight="700" text-anchor="middle">X-ray</text><text x="690.0" y="132" font-size="12" text-anchor="middle">0.01–10 nm</text><text x="690.0" y="156" font-size="12" text-anchor="middle">inner electrons</text><text x="690.0" y="171" font-size="12" text-anchor="middle">removed</text><line x1="40" y1="36" x2="720" y2="36" stroke="#1F2A28" stroke-width="2" marker-end="url(#em-a)"/><text x="380" y="26" font-size="13" text-anchor="middle">higher energy per photon, shorter wavelength, higher frequency</text><text x="380" y="200" font-size="12" text-anchor="middle">Effect of absorbing a photon from each region (wavelengths approximate)</text></g></svg>