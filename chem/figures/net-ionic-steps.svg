<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="net-ionic-steps-t net-ionic-steps-d">
<title id="net-ionic-steps-t">From molecular to net ionic equation</title>
<desc id="net-ionic-steps-d">Three stacked boxes. Molecular equation: Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq). Complete ionic equation: Pb²⁺(aq) + 2NO₃⁻(aq) + 2K⁺(aq) + 2I⁻(aq) → PbI₂(s) + 2K⁺(aq) + 2NO₃⁻(aq), with the potassium and nitrate ions crossed out on both sides as spectators. Net ionic equation: Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s). Atoms and charge balance.</desc>
<rect width="800" height="380" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="400" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2A28">Three ways to write the same reaction</text><rect x="20" y="56" width="760" height="66" rx="10" fill="#F3F5F4" stroke="#888" stroke-width="2"/><text x="36" y="82" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A28">Molecular</text><text x="36" y="108" font-size="16" fill="#1F2A28">Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)</text><line x1="400" y1="126" x2="400" y2="152" stroke="#1F2A28" stroke-width="2"/><path d="M395.7,143.0 L400,152 L404.3,143.0 Z" fill="#1F2A28"/><rect x="20" y="156" width="760" height="66" rx="10" fill="#FCE9DC" stroke="#888" stroke-width="2"/><text x="36" y="182" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A28">Complete ionic</text><text x="36" y="208" font-size="13" fill="#1F2A28">Pb²⁺(aq) + <tspan text-decoration="line-through" fill="#B03030">2NO₃⁻(aq)</tspan> + <tspan text-decoration="line-through" fill="#B03030">2K⁺(aq)</tspan> + 2I⁻(aq) → PbI₂(s) + <tspan text-decoration="line-through" fill="#B03030">2K⁺(aq)</tspan> + <tspan text-decoration="line-through" fill="#B03030">2NO₃⁻(aq)</tspan></text><line x1="400" y1="226" x2="400" y2="252" stroke="#1F2A28" stroke-width="2"/><path d="M395.7,243.0 L400,252 L404.3,243.0 Z" fill="#1F2A28"/><rect x="20" y="256" width="760" height="66" rx="10" fill="#E3EAFA" stroke="#1D44A6" stroke-width="2"/><text x="36" y="282" font-size="14" font-weight="700" text-anchor="start" fill="#1F2A28">Net ionic</text><text x="36" y="308" font-size="16" fill="#1F2A28">Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s)</text><text x="560" y="152" font-size="12" text-anchor="middle" fill="#1F2A28">split dissolved ionic compounds; keep the solid whole</text><text x="560" y="252" font-size="12" text-anchor="middle" fill="#1F2A28">cross out the spectators (same on both sides)</text><text x="400" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#1D44A6">Check: atoms (1 Pb, 2 I) and charge (+2 − 2 = 0 on each side) balance.</text>
</g>
</svg>
