<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220" role="img" aria-labelledby="sp-t sp-d"><title id="sp-t">How a spectrophotometer measures absorbance</title><desc id="sp-d">Light from a lamp passes through a slit and a prism that selects one wavelength, then through a cuvette of path length b holding the sample at concentration c. Less light reaches the detector than entered the sample. The instrument reports the absorbance, A = εbc.</desc><defs><marker id="sp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="700" height="220" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><circle cx="50" cy="100" r="22" fill="#FFE08A" stroke="#333" stroke-width="2"/><text x="50" y="150" font-size="12" text-anchor="middle">lamp</text><line x1="74" y1="100" x2="150" y2="100" stroke="#C9A400" stroke-width="6"/><polygon points="160,130 200,60 240,130" fill="#DCE9F5" stroke="#333" stroke-width="2"/><text x="200" y="150" font-size="12" text-anchor="middle">wavelength selector</text><line x1="240" y1="100" x2="330" y2="100" stroke="#2E7D32" stroke-width="6"/><text x="285" y="88" font-size="12" text-anchor="middle">one λ (λmax)</text><rect x="335" y="60" width="60" height="80" fill="#9CC3E6" stroke="#333" stroke-width="2"/><text x="365" y="160" font-size="12" text-anchor="middle">cuvette</text><line x1="335" y1="176" x2="395" y2="176" stroke="#1F2A28" stroke-width="1.5" marker-start="url(#sp-a)" marker-end="url(#sp-a)"/><text x="365" y="195" font-size="12" text-anchor="middle">path length b</text><text x="365" y="104" font-size="12" text-anchor="middle">conc. c</text><line x1="395" y1="100" x2="500" y2="100" stroke="#2E7D32" stroke-width="2.5"/><text x="448" y="88" font-size="12" text-anchor="middle">less light</text><rect x="505" y="72" width="40" height="56" fill="#555" stroke="#333"/><text x="525" y="150" font-size="12" text-anchor="middle">detector</text><rect x="575" y="70" width="110" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="630" y="98" font-size="14" text-anchor="middle" font-weight="700">A = 0.452</text><text x="630" y="118" font-size="12" text-anchor="middle">A = εbc</text></g></svg>