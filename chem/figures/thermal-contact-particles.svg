<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d">
<title id="t">Two blocks reaching the same temperature</title>
<desc id="d">Left panel, before: a hot block whose particles have long motion arrows touches a cold block whose particles have short arrows; a red arrow at the boundary shows energy passing from the hot block to the cold block. Right panel, later: the particles in both blocks have arrows of similar average length and both blocks show the same temperature.</desc>
