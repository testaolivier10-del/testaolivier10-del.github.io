<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
  const PAGES = [
    { file: 'study-notes.html', title: 'Study notes' },
    { file: 'glossary.html', title: 'Glossary' },
    { file: 'mnemonics.html', title: 'Mnemonics' },
    { file: 'flowcharts.html', title: 'Flow diagrams' },
    { file: 'skillsheets.html', title: 'Skills guide' },
    { file: 'scenario-sim.html', title: 'Scenarios' },
    { file: 'exam-day.html', title: 'Exam day' },
  ];

  function extractChunks(doc, page){
    const chunks = [];
    let heading = page.title;
    const nodes = doc.body.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,td,summary');
    nodes.forEach(el => {
      const tag = el.tagName.toLowerCase();
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if(!text) return;
      if(/^h[1-4]$/.test(tag)){
        heading = text;
        return;
      }
      if(text.length < 12) return;
      chunks.push({ page: page.title, file: page.file, heading, text, fragment: 1 });
    });
    return chunks;
  }

  // The practice question bank lives in its own JSON files (see practice.html),
  // rather than being buried in that page's inline script — which is what makes
  // indexing it here possible at all.
  //
  // Both halves, and both in parallel: searching questions without their
  // explanations would lose most of what there is to match on — the
  // explanations are the longest prose in the bank. practice.html defers the
  // second file because it can show a question without it; this page cannot
  // index one without it, so it waits for both. They arrive together rather
  // than one after the other.
  async function fetchQuestionChunks(){
    const [core, explanations] = await Promise.all([
      fetch('assets/questions-core.json').then(r => r.json()),
      // An explanation is a nice-to-have here where the question is not, so a
      // failure on this half degrades to indexing the stems alone rather than
      // dropping the whole bank out of the index.
      fetch('assets/explanations.json').then(r => r.json()).catch(() => []),
    ]);
    const questions = core.map((q, i) => ({ ...q, explain: explanations[i] || '' }));
    return questions.map((q, i) => ({
      page: 'Practice questions',
      meta: 'Practice question',
      // Deep link straight to the one question, which practice.html opens on its
      // own in review mode. Without the index a question result could only land
      // the reader on the exam start screen with no way back to what they found.
      file: 'practice.html?q=' + (typeof q.id === 'number' ? q.id : i),
      heading: q.domain + (q.topic ? ' — ' + q.topic : ''),
      text: q.q + ' ' + (q.explain || ''),
      isQuestion: true,
    }));
  }

  // Every source is allowed to fail on its own: offline, a reader gets
  // whatever is cached, and the status line says what is missing.
  function pageChunks(page){
    return fetch(page.file).then(res => { if(!res.ok) throw 0; return res.text(); }).then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script,style').forEach(n => n.remove());
      return extractChunks(doc, page);
    }).catch(() => []);
  }
  // Matching, ranking and snippet highlighting live in /assets/site-search.js
  // and the page itself (box, filters, results, keyboard) in
  // /assets/course/hub.js, both shared with every course.
  const sr = window.LevlHub.search({
    mount: document.getElementById('app'), prefix: 'nremt-sr', label: 'Search this course',
    placeholder: 'Search the course… (e.g. “OPQRST”, “tension pneumothorax”)',
    kinds: ['Practice questions', 'Study notes', 'Glossary', 'Mnemonics', 'Flow diagrams', 'Skills guide', 'Scenarios', 'Exam day'],
    engine: window.LevlSearch, allHref: '../search.html',
  });
  sr.add(Promise.all(PAGES.map(pageChunks)).then(all => all.reduce((a, b) => a.concat(b), [])), 'the notes and reference pages');
  sr.add(fetchQuestionChunks(), 'the practice question bank');
});
</script>
