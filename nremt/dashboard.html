<script>
// Runs after the deferred scripts above it: every external script on this
// page is deferred so the page can paint before they arrive, and deferred
// scripts execute, in order, just before DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function(){
  // Every card below is the shared dashboard component (assets/course/hub.js);
  // the numbers are NREMT's own records, written by practice-engine.js.
  const H = window.LevlHub;
  if(!H) return;
  const esc = H.esc, plural = H.plural;
  // Topic areas: the body-system labels the bank carries, which the
  // cross-mode accuracy record (nremt_domain_stats_all) has always been kept by.
  const DOMAINS = ["Assessment","Airway & Respiratory","Cardiac & Medical","Trauma","OB/Peds & Special Populations","EMS Operations"];
  // The 2025 exam domains and their bands (EMT examination specifications);
  // the same list as DOMAIN_TARGETS in practice-engine.js.
  const EXAM_DOMAINS = [
    { d: 'Scene Size-Up & Safety',        band: '15–19%' },
    { d: 'Primary Assessment',            band: '39–43%' },
    { d: 'Secondary Assessment',          band: '5–9%' },
    { d: 'Patient Treatment & Transport', band: '20–24%' },
    { d: 'Operations',                    band: '10–14%' },
  ];
  const EXAM_DOMAIN_STATS_KEY = 'nremt_exam_domain_stats';

  const HISTORY_KEY = 'nremt_exam100_history';
  const MASTERY_KEY = 'nremt_mastery';
  const DOMAIN_STATS_KEY = 'nremt_domain_stats_all';
  const STREAK_KEY = 'nremt_streak';
  const MISSED_KEY = 'nremt_exam100_missed';

  function readJSON(key, fallback){
    try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  function set(id, html){ const el = document.getElementById(id); if(el) el.innerHTML = html; }

  const history = readJSON(HISTORY_KEY, []);
  const mastery = readJSON(MASTERY_KEY, {});
  const domainStats = readJSON(DOMAIN_STATS_KEY, {});
  const examDomainStats = readJSON(EXAM_DOMAIN_STATS_KEY, {});
  const streak = readJSON(STREAK_KEY, {currentStreak:0, longestStreak:0, lastActiveDate:null, dailyCounts:{}, dailyGoal:15});
  const missed = readJSON(MISSED_KEY, []);

  function dayKey(offset){
    const d = new Date();
    if(offset) d.setDate(d.getDate()+offset);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  // The streak is site-wide now (assets/hub-progress.js): a day spent on any
  // LevlPrep subject keeps it alive. hubStreak() is the single source the
  // tiles, the calendar and the badges all read, with the old NREMT-only
  // record as a fallback if the shared module didn't load.
  function hubStreak(){
    if(window.HubProgress) return window.HubProgress.streak();
    const today = dayKey(0), yesterday = dayKey(-1);
    const broken = streak.lastActiveDate !== null && streak.lastActiveDate !== today && streak.lastActiveDate !== yesterday;
    const counts = streak.dailyCounts || {};
    return {
      current: broken ? 0 : (streak.currentStreak || 0),
      longest: streak.longestStreak || 0,
      todayCount: counts[today] || 0,
      goal: streak.dailyGoal || 15,
      metToday: (counts[today] || 0) >= (streak.dailyGoal || 15),
      days: Object.keys(counts).reduce((a, k) => (a[k] = { nremt: counts[k] }, a), {}),
    };
  }
  const st = hubStreak();

  // Overall accuracy across every mode. NREMT has no mastery model, so the
  // first tile is accuracy, in the same tile design as the other courses.
  let allTotal = 0, allCorrect = 0;
  DOMAINS.forEach(d => {
    const s = domainStats[d];
    if(s && s.total){ allTotal += s.total; allCorrect += s.correct; }
  });
  const overallPct = allTotal ? Math.round(allCorrect / allTotal * 100) : null;
  const topicsStarted = DOMAINS.filter(d => domainStats[d] && domainStats[d].total > 0).length;

  // Due for review: the same rule as the Review queue (practice-engine.js
  // loadDueForReview): a question below level 5 after decay.
  const levels = [0,0,0,0,0,0];
  let dueCount = 0;
  Object.values(mastery).forEach(rec => {
    const daysSince = (Date.now() - (rec.lastSeen||0)) / 86400000;
    const effective = Math.max(0, (rec.level||0) - Math.floor(daysSince/4));
    levels[Math.min(5, Math.max(0, effective))]++;
    if(effective < 5) dueCount++;
  });
  const totalTracked = Object.keys(mastery).length;
  const missedCount = Array.isArray(missed) ? missed.length : 0;

  set('statCards', H.stats([
    { value: overallPct === null ? '—' : overallPct + '%', label: 'Overall accuracy', sub: allTotal ? plural(allTotal, 'question') + ' answered' : 'across every mode' },
    { value: topicsStarted + '<small> / ' + DOMAINS.length + '</small>', label: 'Topics started', sub: plural(history.length, 'full exam') + ' taken' },
    { value: dueCount, label: 'Due for review', sub: plural(dueCount, 'question') + ' &middot; ' + missedCount + ' missed' },
    { value: st.current, label: 'Day streak', sub: st.metToday ? 'Today’s goal met' : st.todayCount + ' of ' + st.goal + ' today' },
  ]));

  // ---- Next up ----
  function weakestTopic(){
    return DOMAINS.map(d => ({ d, s: domainStats[d] })).filter(x => x.s && x.s.total >= 5)
      .sort((a, b) => a.s.correct / a.s.total - b.s.correct / b.s.total)[0];
  }
  if(!allTotal && !history.length){
    set('nextBox', H.next({
      intro: 'Every question you answer, in any mode, updates your accuracy by topic area and by exam domain. Nothing here yet, so here is where to start.',
      steps: [
        '<a href="practice.html">Start a 20-question domain drill</a>, each answer checked as you go.',
        'Or read the <a href="study-notes.html">study notes</a>, chapter by chapter.',
        'Warm up with <a href="flashcards.html">flashcards</a> or try a <a href="tools.html">tool</a>.',
      ]
    }));
  } else {
    const cards = [];
    if(dueCount) cards.push({ href: 'review.html', title: 'Review ' + plural(dueCount, 'question'), sub: 'Missed and shaky questions come back before you forget them.' });
    const w = weakestTopic();
    if(w && w.s.correct / w.s.total < 0.75) cards.push({ href: 'practice.html?system=' + encodeURIComponent(w.d), title: 'Shore up ' + esc(w.d), sub: 'Your weakest topic area, at ' + Math.round(w.s.correct / w.s.total * 100) + '%.' });
    if(!history.length) cards.push({ href: 'exams.html', title: 'Take a full timed exam', sub: 'Scored by domain, and the readiness estimate starts from it.' });
    else cards.push({ href: 'practice.html', title: 'Continue practicing', sub: 'A drill, a domain or weak-spot practice.' });
    set('nextBox', H.next({ cards: cards.slice(0, 4) }));
  }

  // One row per topic area / exam domain: accuracy, a status chip and a
  // Practice link.
  function accRow(d, s, sub, param){
    const v = s && s.total ? s.correct / s.total : 0;
    return H.row({ label: d, value: v, text: s && s.total ? Math.round(v * 100) + '%' : null,
      tier: H.tier(v, s && s.total), note: (s && s.total ? s.correct + ' of ' + s.total + ' right' + (sub ? ' &middot; ' : '') : '') + (sub || ''),
      action: { href: 'practice.html?' + param + '=' + encodeURIComponent(d), label: 'Practice' } });
  }

  // ---- Weak topics: free, always. The premium dialog lists "weak topics"
  // among the free features, so this panel never carries a gate.
  (function renderTopicBox(){
    const rows = DOMAINS.map(d => ({ d, st: domainStats[d] }))
      .sort((a, b) => {
        const pa = a.st && a.st.total ? a.st.correct / a.st.total : 2;
        const pb = b.st && b.st.total ? b.st.correct / b.st.total : 2;
        return pa - pb;
      });
    set('topicBox', H.panel({ id: 'nr-topics', title: 'Accuracy by topic area', hint: 'Every mode counts, weakest first. Always free.',
      body: rows.map(r => accRow(r.d, r.st, '', 'system')).join('') }));
  })();

  // Premium (assets/premium-gates.js): the readiness score and the domain
  // breakdown. Before launch, or with the gate files missing, both render as
  // they always have, with a badge; the stats behind them are never touched.
  const G = window.NremtGates || { canUse: () => true, gate: () => '', badge: () => '', onChange(fn){ fn(); } };
  function renderDomainBox(){
    // One upsell per screen: when locked, the Premium card sits in the side
    // column (premiumBox) and this panel says what it holds.
    if(!G.canUse('readiness')){
      set('domainBox', H.panel({ id: 'nr-domains', title: 'Exam domains ' + G.badge(), body: '<p class="cx-emptynote">Your accuracy in each of the five 2025 exam domains, with each one&rsquo;s share of the exam, comes with Premium along with the readiness estimate.</p>' }));
      set('premiumBox', G.gate('readiness', 'dashboard-domains'));
      return;
    }
    set('premiumBox', '');
    const attempted = EXAM_DOMAINS.filter(x => examDomainStats[x.d] && examDomainStats[x.d].total > 0);
    set('domainBox', H.panel({ id: 'nr-domains', title: 'Exam domains ' + G.badge(),
      hint: 'The five domains of the National Registry&rsquo;s EMT exam launched 7 April 2025, with each one&rsquo;s share of the exam. Practice exams here draw questions in the same proportions.',
      body: (attempted.length ? '' : '<p class="cx-emptynote">Answer questions in any mode to see your accuracy by exam domain.</p>') +
        EXAM_DOMAINS.map(({d, band}) => accRow(d, examDomainStats[d], band + ' of the exam', 'domain')).join('') }));
  }

  // ---- Mastery distribution + review queue ----
  if(totalTracked){
    const maxLevel = Math.max(1, ...levels);
    set('masteryBox', H.panel({ id: 'nr-mastery', title: 'Mastery and review queue',
      hint: 'Each question you have seen, by its level (0 to 5). A level drops by one for every four days it goes unseen.',
      body: '<div class="progress-stats"><span>Questions tracked: <b>' + totalTracked + '</b></span><span>Due for review: <b>' + dueCount + '</b></span><span>Missed queue: <b>' + missedCount + '</b></span></div>' +
        '<div class="mastery-bars">' + levels.map((count, lvl) => '<div class="mastery-bar" style="height:' + Math.max(2, count / maxLevel * 70) + 'px"><span>L' + lvl + '</span></div>').join('') + '</div>' +
        '<div class="cx-actions"><a class="btn-press sm" href="review.html">Start review</a><a class="btn-outline" href="practice.html" style="padding:11px 20px;font-size:13.5px">Weak-spot practice</a></div>' }));
  }

  // ---- Recent activity and score over time: the full exams ----
  if(history.length){
    const fmt = ts => {
      const d = new Date(ts), now = new Date();
      const days = Math.floor((now.setHours(0,0,0,0) - new Date(ts).setHours(0,0,0,0)) / 86400000);
      if(days === 0) return 'Today';
      if(days === 1) return 'Yesterday';
      if(days < 7) return days + ' days ago';
      return d.toLocaleDateString();
    };
    set('activityBox', H.panel({ id: 'nr-activity', title: 'Recent exams', body: history.slice(-6).reverse().map(h2 => {
      const v = h2.score / h2.total;
      return H.row({ label: h2.total + '-question exam', value: v, text: Math.round(v * 100) + '%', note: fmt(h2.date) + ' &middot; ' + h2.score + '/' + h2.total + ' correct' });
    }).join('') }));
    const pcts = history.map(h2 => Math.round(h2.score/h2.total*100));
    const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    const best = Math.max(...pcts);
    const w=600,h=100,pad=6;
    const stepX = pcts.length > 1 ? (w-pad*2)/(pcts.length-1) : 0;
    const pts = pcts.map((p,i) => [pad + i*stepX, h - pad - (p/100)*(h-pad*2)]);
    const line = pts.length > 1
      ? pts.map((p,i) => (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')
      : `M${pts[0][0]},${pts[0][1]} L${pts[0][0]+0.01},${pts[0][1]}`;
    set('historyBox', H.panel({ id: 'nr-history', title: 'Score over time', body:
      `<div class="progress-stats"><span>Average: <b>${avg}%</b></span><span>Best: <b>${best}%</b></span><span>Attempts: <b>${history.length}</b></span></div>
      <svg class="progress-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Score trend across recent attempts">
        <path d="${line}" fill="none" stroke="var(--cink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--ink)"/>`).join('')}
      </svg>` }));
  }

  // ---- Level & XP ----
  // The level is shared across every LevlPrep subject (assets/hub-progress.js);
  // the rank NAME stays EMS-flavored.
  const DOMAIN_TIER_LABELS = ['', 'Proficient', 'Advanced', 'Mastered'];
  function levelInfo(){
    if(window.HubProgress) return window.HubProgress.levelInfo('nremt');
    const total = (readJSON('nremt_xp', {total:0}).total) || 0;
    const f = n => 100 * (n - 1) * (n - 1);
    let lv = 1; while(f(lv + 1) <= total) lv++;
    return { level: lv, title: 'First Responder', total: total, into: total - f(lv), span: Math.max(1, f(lv + 1) - f(lv)), toNext: f(lv + 1) - total, subjects: { nremt: total } };
  }
  function domainTiers(){
    if(window.HubProgress) return window.HubProgress.badges('nremt').domainTiers || {};
    return readJSON('nremt_xp', { domainTiers: {} }).domainTiers || {};
  }
  const info = levelInfo();
  const mine = (info.subjects || {}).nremt || 0;
  const chips = Object.entries(domainTiers()).filter(([, t]) => t > 0).map(([d, t]) => d + ' · ' + DOMAIN_TIER_LABELS[Math.min(t, 3)]);
  set('levelBox', H.level(info, {
    xpLine: mine.toLocaleString() + ' XP earned in NREMT &middot; ' + Number(info.total).toLocaleString() + ' site-wide',
    sub: [H.streakLine(window.HubProgress ? st : { current: st.current, longest: st.longest, todayCount: st.todayCount, goal: st.goal })].concat(chips.length ? [] : ['Answer 20+ questions in a topic area at 70% accuracy to earn your first topic badge.']),
    chips: chips,
  }));

  // ---- Streak calendar: the last 14 days, across every subject ----
  (function renderCalendar(){
    const counts = Object.keys(st.days || {}).reduce((acc, k) => {
      const day = st.days[k] || {};
      acc[k] = Object.keys(day).reduce((n, subj) => n + (day[subj] || 0), 0);
      return acc;
    }, {});
    const todayKey = dayKey(0);
    const DOW = ['S','M','T','W','T','F','S'];
    let html = '', studiedDays = 0;
    for(let i = 13; i >= 0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const done = (counts[k] || 0) > 0;
      if(done) studiedDays++;
      html += `<div class="cal-day${done ? ' done' : ''}${k === todayKey ? ' today' : ''}" title="${k}${done ? ' — ' + counts[k] + ' questions studied' : ''}">${DOW[d.getDay()]}</div>`;
    }
    set('streakBox', H.panel({ id: 'nr-cal', title: st.current ? st.current + '-day streak' : 'Study streak',
      body: '<div class="cal-grid">' + html + '</div><p class="cx-hint" style="margin:12px 0 0">' + studiedDays + ' of 14 days studied &middot; today ' + (counts[todayKey] || 0) + ' of ' + st.goal + '</p>' }));
  })();

  // ---- Badges: earned from the same records the rest of the page reads ----
  (function renderBadges(){
    const lvl = window.HubProgress ? window.HubProgress.level() : info.level;
    const best = history.length ? Math.max(...history.map(h2 => Math.round(h2.score/h2.total*100))) : 0;
    const defs = [
      { icon: '🎖️', label: '7-day streak',  have: st.longest, need: 7, unit: 'days' },
      { icon: '🔥', label: '30-day streak', have: st.longest, need: 30, unit: 'days' },
      { icon: '🚑', label: 'First exam',    have: history.length, need: 1, unit: 'exam' },
      { icon: '💯', label: '90%+ exam',     have: best, need: 90, unit: '% best' },
      { icon: '📚', label: '500 questions', have: allTotal, need: 500, unit: 'answered' },
      { icon: '🏅', label: 'Level 10',      have: lvl, need: 10, unit: 'level' },
    ];
    set('badgeGrid', H.badges(defs.map(b => {
      const earned = b.have >= b.need, shown = Math.min(b.have, b.need);
      return { icon: b.icon, label: b.label, earned, prog: earned ? 'Earned' : shown + '/' + b.need,
        aria: b.label + ': ' + (earned ? 'earned' : 'not yet, ' + shown + ' of ' + b.need + ' ' + b.unit) };
    })));
  })();

  // ---- Readiness (mirrors the estimate on the practice-exam page) ----
  function computeReadiness(){
    const h = history.filter(x => x.total > 0);
    if(h.length === 0) return {available:false};
    const n = h.length;
    const pcts = h.map(x => x.score / x.total * 100);
    let weightedSum = 0, weightTotal = 0;
    pcts.forEach((p,i) => { const w = i+1; weightedSum += p*w; weightTotal += w; });
    const weightedAvg = weightedSum / weightTotal;

    const domainEntries = Object.entries(domainStats).filter(([,s]) => s.total >= 5);
    let adjusted = weightedAvg, weakestDomain = null, weakestPct = null;
    if(domainEntries.length > 0){
      const withPct = domainEntries.map(([d,s]) => [d, s.correct/s.total*100]);
      withPct.sort((a,b) => a[1]-b[1]);
      weakestDomain = withPct[0][0]; weakestPct = withPct[0][1];
      const totalCorrect = domainEntries.reduce((a,[,s]) => a+s.correct, 0);
      const totalQs = domainEntries.reduce((a,[,s]) => a+s.total, 0);
      const overall = totalCorrect/totalQs*100;
      const gap = overall - weakestPct;
      if(gap > 15) adjusted -= (gap-15)*0.5;
    }
    adjusted = Math.max(0, Math.min(100, adjusted));
    const rawProb = 1/(1+Math.exp(-0.13*(adjusted-72)));
    const confidence = Math.min(1, n/5);
    const blended = rawProb*confidence + 0.5*(1-confidence);
    const probabilityPct = Math.max(2, Math.min(98, Math.round(blended*100)));
    let label, lvl;
    if(probabilityPct >= 80){ label='On track'; lvl = 4; }
    else if(probabilityPct >= 55){ label='Within reach'; lvl = 2; }
    else { label='Needs more practice'; lvl = 1; }
    return {
      available:true, probabilityPct, label, lvl, attempts:n,
      weightedAvg: Math.round(weightedAvg),
      weakestDomain, weakestPct: weakestPct !== null ? Math.round(weakestPct) : null,
      lowConfidence: n < 3,
    };
  }
  function renderReadinessBox(){
    if(!G.canUse('readiness')){ set('readinessBox', ''); return; }
    const r = computeReadiness();
    if(!r.available){
      set('readinessBox', H.panel({ id: 'nr-ready', title: 'Readiness estimate ' + G.badge(), body: '<p class="cx-emptynote">Take a full <a href="exams.html">timed exam</a> to see your readiness estimate.</p>' }));
      return;
    }
    const subParts = [`Recent average ${r.weightedAvg}% across ${r.attempts} full exam${r.attempts===1?'':'s'}`];
    if(r.weakestDomain) subParts.push(`weakest area: ${r.weakestDomain} (${r.weakestPct}%)`);
    // Same wording as practice-engine.js: a readiness scale, not odds.
    const note = (r.lowConfidence ? 'Based on very few attempts — take a few more full exams for a steadier number. ' : '') +
      'A 0–100 readiness scale from your own practice scores. It is not calibrated against real NREMT results and is not a chance of passing.';
    set('readinessBox', H.panel({ id: 'nr-ready', title: 'Readiness estimate ' + G.badge(),
      body: H.row({ label: subParts.join(' · '), value: r.probabilityPct / 100, text: r.probabilityPct + '/100', tier: { label: r.label, lvl: r.lvl } }) +
        '<p class="cx-hint" style="margin:8px 0 0">' + note + '</p>' }));
  }
  G.onChange(function(){ renderReadinessBox(); renderDomainBox(); });

  // ---- Exam date (assets/exam-date.js): the countdown that replaced the
  // Study Plan page. The per-day number is the part of the bank not yet
  // answered, spread over the days left. practice-engine.js records the bank's
  // size, so this page does not download 1 MB of questions to count them.
  if(window.LevlExamDate){
    window.LevlExamDate.mount(document.getElementById('examDateCard'), {
      subject: 'nremt',
      links: { review: 'review.html', exams: 'exams.html' },
      target: function(days){
        let bank = 0;
        try{ bank = parseInt(localStorage.getItem('nremt_bank_size'), 10) || 0; }catch(e){}
        const left = Math.max(0, bank - Object.keys(mastery).length);
        if(!bank) return { n: hubStreak().goal || 15, unit: 'questions', why: 'is your daily goal' };
        if(!left) return { done: 'You have answered every question in the bank. Days from here are for Review and timed exams.' };
        return { n: Math.ceil(left / days), unit: 'new questions', why: 'covers the ' + left.toLocaleString() + ' you have not answered yet, plus whatever Review has due' };
      }
    });
  }
});
</script>
