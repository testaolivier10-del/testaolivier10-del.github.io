  .consequence-banner{
    border:2px solid var(--amber);background:var(--tint-amber);border-radius:14px;box-shadow:none;

  .choice-option:active{transform:translateY(4px);box-shadow:0 0 0 var(--line);}

  .ending-badge{
    display:inline-block;font:900 11px var(--font-ui);text-transform:uppercase;
    letter-spacing:0.05em;padding:6px 13px;border-radius:var(--radius-pill);margin-bottom:14px;

let currentScenario = null;
let currentNodeId = null;
let pathLog = [];

function renderPicker(){
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = SCENARIOS.map(s => `
    <button type="button" class="scenario-card" data-scenario="${s.id}">
      <div class="scenario-domain">${s.domain}</div>
      <h3>${s.title}</h3>
      <p>${s.blurb}</p>
    </button>
  `).join('');
  grid.querySelectorAll('[data-scenario]').forEach(btn => {
    btn.addEventListener('click', () => startScenario(btn.dataset.scenario));
  });
}

function startScenario(id){
  currentScenario = SCENARIOS.find(s => s.id === id);
  currentNodeId = currentScenario.startNode;
  pathLog = [];
  document.getElementById('pickerScreen').style.display = 'none';
  document.getElementById('simBox').classList.add('active');
  renderNode();
}

function backToPicker(){
  currentScenario = null;
  document.getElementById('simBox').classList.remove('active');
  document.getElementById('pickerScreen').style.display = 'block';
  if(window.LevlMotion) window.LevlMotion.scrollToY(0);
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Stand at a fork again.

   Restarting was the only way back, which means the price of exploring the
   other branch of a decision three steps in was replaying the two before it.
   That is a tax on curiosity in a tool whose entire value is showing you what
   the other choice would have cost — and the eight scenarios are long enough
   that people pay it once and then stop.

   Everything after the chosen decision is dropped, because it did not happen
   any more. */
function rewindTo(i){
  const entry = pathLog[i];
  if(!entry) return;
  pathLog = pathLog.slice(0, i);
  currentNodeId = entry.fromNode;
  renderNode();
  if(window.LevlAnnounce){
    window.LevlAnnounce.say('Back at an earlier decision. ' +
      (pathLog.length ? pathLog.length + ' earlier choices kept.' : 'Back at the start of the call.'));
  }
}

function renderNode(consequenceText){
  const node = currentScenario.nodes[currentNodeId];
  const box = document.getElementById('simBox');

  /* Choosing an action replaces this whole panel, which a screen reader is
     told nothing about — and unlike the quizzes there is no right/wrong chime
     standing in either. What a choice cost or bought is the whole point of the
     exercise, so the consequence (or, at the end, how the call went) goes to
     the live region. The node text itself is not announced: it is long, and it
     is still there to be read at the user's own pace. */
  if(window.LevlAnnounce){
    if(node.ending){
      const verdict = node.ending === 'good' ? 'Good outcome.'
                    : node.ending === 'bad'  ? 'Poor outcome.'
                    : 'Mixed outcome.';
      window.LevlAnnounce.say(verdict + ' ' + (consequenceText || ''));
    } else if(consequenceText){
      window.LevlAnnounce.say('What happened: ' + consequenceText);
    }
  }

  if (node.ending) {
    box.innerHTML = `
      <div class="sim-header">
        <span class="sim-domain">${currentScenario.domain}</span>
        <button type="button" class="back-link" id="backBtn">&larr; All scenarios</button>
      </div>
      <span class="ending-badge ${node.ending}">${node.ending === 'good' ? 'Good outcome' : node.ending === 'bad' ? 'Poor outcome' : 'Mixed outcome'}</span>
      <p class="node-text">${node.text}</p>
      <div class="sim-actions">
        <button type="button" class="btn-primary" id="retryBtn">Try This Scenario Again</button>
        <button type="button" class="btn-secondary" id="anotherBtn">Choose Another Scenario</button>
      </div>
      <div class="path-log">
        <div class="path-log-title">Your path through this call</div>
        <ol>
          ${pathLog.map((p, i) => `
            <li>
              <div class="path-choice">${p.text}</div>
              ${p.consequence ? `<div class="path-conseq">${p.consequence}</div>` : ''}
              ${p.alternatives.length ? `
                <details class="path-alts">
                  <summary>${p.alternatives.length} other option${p.alternatives.length === 1 ? '' : 's'} at this point</summary>
                  <ul>${p.alternatives.map(a => `<li>${a}</li>`).join('')}</ul>
                </details>` : ''}
              ${p.alternatives.length ? `<button type="button" class="rewind-btn" data-rewind="${i}">Go back to this decision</button>` : ''}
            </li>
          `).join('')}
        </ol>
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', backToPicker);
    document.getElementById('retryBtn').addEventListener('click', () => startScenario(currentScenario.id));
    document.getElementById('anotherBtn').addEventListener('click', backToPicker);
    box.querySelectorAll('[data-rewind]').forEach(btn => {
      btn.addEventListener('click', () => rewindTo(parseInt(btn.dataset.rewind, 10)));
    });
    if(window.LevlMotion) window.LevlMotion.scrollToY(box.offsetTop - 20);
    else window.scrollTo({ top: box.offsetTop - 20, behavior: 'smooth' });
    return;
  }

  box.innerHTML = `
    <div class="sim-header">
      <span class="sim-domain">${currentScenario.domain}</span>
      <button type="button" class="back-link" id="backBtn">&larr; All scenarios</button>
    </div>
    ${node.vitals ? `<div class="vitals-bar">${node.vitals}</div>` : ''}
    ${consequenceText ? `<div class="consequence-banner"><strong>What happened</strong>${consequenceText}</div>` : ''}
    <p class="node-text">${node.text}</p>
    <div class="choice-list">
      ${node.choices.map((c, i) => `<button type="button" class="choice-option" data-choice="${i}">${c.text}</button>`).join('')}
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', backToPicker);
  box.querySelectorAll('[data-choice]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.choice, 10);
      const choice = node.choices[idx];
      /* The log records the FORK, not just the decision — which node it was
         taken from, and what else was on offer. That is what makes going back
         to a decision possible, and it is the thing the old flat list of
         strings could not support: you could read that you got it wrong and
         had no way to stand at that moment again. */
      pathLog.push({
        fromNode: currentNodeId,
        index: idx,
        text: choice.text,
        consequence: choice.consequence || '',
        alternatives: node.choices.filter((c, i) => i !== idx).map(c => c.text)
      });
      currentNodeId = choice.next;
      renderNode(choice.consequence);
    });
  });
  if(window.LevlMotion) window.LevlMotion.scrollToY(box.offsetTop - 20);
  else window.scrollTo({ top: box.offsetTop - 20, behavior: 'smooth' });
}

renderPicker();
});
