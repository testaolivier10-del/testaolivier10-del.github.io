<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d">
<title id="t">Endosymbiosis in four steps</title>
<desc id="d">Four panels from left to right. 1: a large host cell with a nucleus wraps its membrane around a small bacterium that uses oxygen. 2: the bacterium now lives inside the host, wrapped in two membranes, its own inner one and an outer one from the host's engulfing membrane; it keeps its own circular DNA. 3: after many generations the bacterium has become a mitochondrion, which still has a double membrane and circular DNA and divides by splitting in two inside the cell. 4: in one line of these cells, a photosynthetic bacterium was taken in the same way and became the chloroplast, so plant and algal cells have both organelles.</desc>
<rect width="820" height="400" fill="#ffffff"/>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
</defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28" text-anchor="middle">
  <!-- step badges -->
  <g font-size="16" font-weight="bold">
    <circle cx="30" cy="30" r="15"/><text x="30" y="36" fill="#fff">1</text>
    <circle cx="235" cy="30" r="15"/><text x="235" y="36" fill="#fff">2</text>
    <circle cx="440" cy="30" r="15"/><text x="440" y="36" fill="#fff">3</text>
    <circle cx="645" cy="30" r="15"/><text x="645" y="36" fill="#fff">4</text>
  </g>
  <g font-size="15" font-weight="bold">
    <text x="115" y="36">Host engulfs</text>
    <text x="320" y="36">Lives inside</text>
    <text x="525" y="36">Mitochondrion</text>
    <text x="732" y="36">Chloroplast</text>
  </g>
  <!-- arrows -->
  <g stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)">
    <line x1="196" y1="190" x2="222" y2="190"/><line x1="402" y1="190" x2="428" y2="190"/><line x1="608" y1="190" x2="634" y2="190"/>
  </g>

  <!-- PANEL 1 -->
  <path d="M30 120 Q100 70 170 110 Q190 190 150 270 Q90 300 40 260 Q10 190 30 120 z" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="3"/>
  <circle cx="80" cy="190" r="30" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2.5"/>
  <text x="80" y="195" font-size="12">nucleus</text>
  <path d="M150 150 q30 -10 36 26 q4 30 -26 34" fill="none" stroke="#6B5E3C" stroke-width="3"/>
  <ellipse cx="172" cy="190" rx="22" ry="13" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  <text x="110" y="320" font-size="13">host cell takes in</text>
  <text x="110" y="336" font-size="13">a bacterium that</text>
  <text x="110" y="352" font-size="13">uses oxygen</text>

  <!-- PANEL 2 -->
  <path d="M235 120 Q305 70 375 110 Q395 190 355 270 Q295 300 245 260 Q215 190 235 120 z" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="3"/>
  <circle cx="280" cy="200" r="28" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2.5"/>
  <ellipse cx="330" cy="160" rx="32" ry="20" fill="#ffffff" stroke="#6B5E3C" stroke-width="2.5"/>
  <ellipse cx="330" cy="160" rx="26" ry="15" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  <circle cx="330" cy="160" r="6" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
  <text x="320" y="320" font-size="13">two membranes:</text>
  <text x="320" y="336" font-size="13">its own + one</text>
  <text x="320" y="352" font-size="13">from the host</text>

  <!-- PANEL 3 -->
  <path d="M440 120 Q510 70 580 110 Q600 190 560 270 Q500 300 450 260 Q420 190 440 120 z" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="3"/>
  <circle cx="485" cy="205" r="28" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2.5"/>
  <g>
    <ellipse cx="535" cy="150" rx="30" ry="16" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
    <path d="M512 150 l6 -9 l6 18 l6 -18 l6 18 l6 -18 l6 18 l6 -9" fill="none" stroke="#D55E00" stroke-width="1.8"/>
    <ellipse cx="540" cy="240" rx="24" ry="13" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
    <ellipse cx="560" cy="200" rx="14" ry="11" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  </g>
  <text x="525" y="320" font-size="13">keeps circular DNA,</text>
  <text x="525" y="336" font-size="13">own ribosomes; divides</text>
  <text x="525" y="352" font-size="13">by splitting in two</text>

  <!-- PANEL 4 -->
  <path d="M645 120 Q715 70 785 110 Q805 190 765 270 Q705 300 655 260 Q625 190 645 120 z" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="3"/>
  <circle cx="690" cy="205" r="26" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2.5"/>
  <ellipse cx="742" cy="145" rx="24" ry="13" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  <ellipse cx="748" cy="230" rx="34" ry="20" fill="#C4E8DC" stroke="#009E73" stroke-width="2.5"/>
  <g stroke="#009E73" stroke-width="2"><line x1="726" y1="224" x2="770" y2="224"/><line x1="726" y1="232" x2="770" y2="232"/><line x1="730" y1="240" x2="766" y2="240"/></g>
  <text x="732" y="320" font-size="13">a photosynthetic</text>
  <text x="732" y="336" font-size="13">bacterium taken in</text>
  <text x="732" y="352" font-size="13">later, in one line</text>
  <text x="410" y="388" font-size="13" fill="#5D6B69">Orange: oxygen-using bacterium and the mitochondria it became. Green: the chloroplast. Not to scale.</text>
</g>
</svg>
