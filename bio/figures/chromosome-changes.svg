<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="chm-t chm-d">
<title id="chm-t">Changes in chromosome structure</title>
<desc id="chm-d">Four changes in chromosome structure, each shown as a normal chromosome with segments A to G and the result. Deletion: segment C is lost, giving A B D E F G. Duplication: segment C D is repeated, giving A B C D C D E F G. Inversion: segment C D E is flipped, giving A B E D C F G. Translocation: segment F G moves to a different, nonhomologous chromosome, and a piece of that chromosome may move in exchange.</desc>
