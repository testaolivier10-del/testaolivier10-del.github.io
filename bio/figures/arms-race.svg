<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="arr-t arr-d"><title id="arr-t">Coevolution of a toxic newt and a snake that eats it</title><desc id="arr-d">A cycle of four boxes. 1: Newts carry a nerve toxin; snakes that eat newts and are not resistant die. 2: Snakes with resistant sodium channels survive and leave more offspring. 3: Resistance becomes common in the snake population, and low-toxin newts get eaten. 4: Newts with more toxin survive attacks and leave more offspring, which returns to step 1 with more toxic newts. In the middle: each side is the other side’s selective pressure.</desc><defs><marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="760" height="360" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="250" y="14" width="260" height="82" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><text x="380" y="38" font-size="14" text-anchor="middle" font-weight="700">1. Newts carry a nerve toxin</text><text x="380" y="57" font-size="14" text-anchor="middle">Snakes without resistance that</text><text x="380" y="76" font-size="14" text-anchor="middle">eat one are paralyzed or die</text><rect x="486" y="136" width="260" height="82" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="616" y="160" font-size="14" text-anchor="middle" font-weight="700">2. Snakes with resistant</text><text x="616" y="179" font-size="14" text-anchor="middle">sodium channels survive and</text><text x="616" y="198" font-size="14" text-anchor="middle">leave more offspring</text><rect x="250" y="262" width="260" height="82" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="380" y="286" font-size="14" text-anchor="middle" font-weight="700">3. Resistance becomes common</text><text x="380" y="305" font-size="14" text-anchor="middle">in the snake population;</text><text x="380" y="324" font-size="14" text-anchor="middle">low-toxin newts get eaten</text><rect x="14" y="136" width="260" height="82" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><text x="144" y="160" font-size="14" text-anchor="middle" font-weight="700">4. Newts with more toxin</text><text x="144" y="179" font-size="14" text-anchor="middle">survive attacks and leave</text><text x="144" y="198" font-size="14" text-anchor="middle">more offspring</text><line x1="512" y1="70" x2="590" y2="132" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar-a)"/><line x1="590" y1="222" x2="512" y2="290" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar-a)"/><line x1="248" y1="290" x2="170" y2="222" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar-a)"/><line x1="170" y1="132" x2="248" y2="70" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar-a)"/><text x="380" y="170" font-size="15" text-anchor="middle" font-weight="700">Each side is</text><text x="380" y="190" font-size="15" text-anchor="middle" font-weight="700">the other side’s</text><text x="380" y="210" font-size="15" text-anchor="middle" font-weight="700">selective pressure</text></g></svg>
