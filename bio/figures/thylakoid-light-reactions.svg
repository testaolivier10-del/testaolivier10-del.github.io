<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-labelledby="t d">
<title id="t">The light reactions in the thylakoid membrane</title>
<desc id="d">A strip of thylakoid membrane with the stroma above and the thylakoid space below. Light strikes photosystem II, which splits water into oxygen, hydrogen ions and electrons. Electrons pass along an electron transport chain through the cytochrome complex, which pumps hydrogen ions from the stroma into the thylakoid space, to photosystem I, which is energized by light again and passes electrons on to make NADPH in the stroma. Hydrogen ions pile up in the thylakoid space and flow back to the stroma through ATP synthase, which makes ATP.</desc>
<defs>
  <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker>
  <marker id="a6b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0072B2"/></marker>
  <marker id="a6r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E3B2E"/></marker>
</defs>
<rect width="780" height="430" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <rect x="0" y="0" width="780" height="160" fill="#EAF6EF"/>
  <rect x="0" y="160" width="780" height="50" fill="#F3EBD3"/>
  <line x1="0" y1="160" x2="780" y2="160" stroke="#6B5E3C" stroke-width="3"/>
  <line x1="0" y1="210" x2="780" y2="210" stroke="#6B5E3C" stroke-width="3"/>
  <rect x="0" y="210" width="780" height="220" fill="#F7E6E2"/>
  <text x="150" y="24" font-size="15" font-weight="700">STROMA</text>
  <text x="150" y="42" font-size="13">low H+ (about pH 8)</text>
  <text x="10" y="410" font-size="15" font-weight="700">THYLAKOID SPACE</text>
  <text x="10" y="426" font-size="13">high H+ (about pH 5)</text>
  <text x="655" y="190" font-size="12" text-anchor="end" fill="#6B5E3C">thylakoid membrane</text>
  <!-- complexes -->
  <rect x="70" y="135" width="100" height="100" rx="18" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <text x="120" y="190" font-size="16" font-weight="700" text-anchor="middle">PSII</text>
  <rect x="250" y="140" width="76" height="90" rx="14" fill="#D2EAF8" stroke="#0072B2" stroke-width="3"/>
  <text x="288" y="182" font-size="12" font-weight="700" text-anchor="middle">cytochrome</text>
  <text x="288" y="197" font-size="12" font-weight="700" text-anchor="middle">complex</text>
  <rect x="400" y="135" width="100" height="100" rx="18" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <text x="450" y="190" font-size="16" font-weight="700" text-anchor="middle">PSI</text>
  <rect x="530" y="110" width="70" height="50" rx="12" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/>
  <text x="565" y="131" font-size="11" text-anchor="middle">NADP+</text>
  <text x="565" y="146" font-size="11" text-anchor="middle">reductase</text>
  <!-- ATP synthase -->
  <rect x="672" y="150" width="36" height="70" rx="6" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
  <circle cx="690" cy="118" r="30" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
  <text x="690" y="114" font-size="12" font-weight="700" text-anchor="middle">ATP</text>
  <text x="690" y="128" font-size="12" font-weight="700" text-anchor="middle">synthase</text>
  <!-- light -->
  <g stroke="#E69F00" stroke-width="4" marker-end="url(#a6)">
    <line x1="60" y1="60" x2="95" y2="128"/><line x1="390" y1="60" x2="425" y2="128"/>
  </g>
  <text x="55" y="52" font-size="15" font-weight="700" fill="#8A5A00">light</text>
  <text x="385" y="52" font-size="15" font-weight="700" fill="#8A5A00">light</text>
  <!-- electron path -->
  <g stroke="#0072B2" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#a6b)">
    <path d="M172,200 L246,200"/><path d="M328,200 L396,200"/><path d="M500,160 C510,140 515,135 526,135"/>
  </g>
  <g font-size="14" font-weight="700" fill="#005A8C"><text x="209" y="194" text-anchor="middle">e−</text><text x="362" y="194" text-anchor="middle">e−</text><text x="506" y="128">e−</text></g>
  <!-- water splitting -->
  <path d="M120,300 L120,242" stroke="#0072B2" stroke-width="3" marker-end="url(#a6b)"/>
  <text x="120" y="322" font-size="15" text-anchor="middle">2 H<tspan font-size="11" baseline-shift="sub">2</tspan>O → 4 H+ + O<tspan font-size="11" baseline-shift="sub">2</tspan> + 4 e−</text>
  <text x="120" y="342" font-size="13" text-anchor="middle">water splitting</text>
  <!-- NADPH -->
  <path d="M565,106 L565,74" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#a6)"/>
  <text x="565" y="64" font-size="15" text-anchor="middle">NADP+ + H+ → NADPH</text>
  <!-- proton pumping -->
  <path d="M288,80 L288,300" stroke="#8E3B2E" stroke-width="3" marker-end="url(#a6r)"/>
  <text x="288" y="72" font-size="15" font-weight="700" text-anchor="middle" fill="#8E3B2E">H+</text>
  <text x="288" y="322" font-size="15" font-weight="700" text-anchor="middle" fill="#8E3B2E">H+ pumped in</text>
  <!-- ATP synthase flow -->
  <path d="M690,320 L690,154" stroke="#8E3B2E" stroke-width="3" marker-end="url(#a6r)"/>
  <text x="690" y="340" font-size="15" font-weight="700" text-anchor="middle" fill="#8E3B2E">H+ flows out</text>
  <text x="690" y="40" font-size="15" text-anchor="middle">ADP + Pi → ATP</text>
  <g font-size="16" font-weight="700" fill="#8E3B2E" opacity="0.75">
    <text x="200" y="270">H+</text><text x="380" y="300">H+</text><text x="460" y="265">H+</text><text x="560" y="310">H+</text><text x="610" y="260">H+</text><text x="210" y="380">H+</text><text x="470" y="370">H+</text>
  </g>
</g>
</svg>
