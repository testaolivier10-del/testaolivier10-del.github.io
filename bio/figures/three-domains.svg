<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="tdm-t tdm-d"><title id="tdm-t">The three domains and the features each branch gained</title><desc id="tdm-d">A branching diagram rooted at LUCA, the last universal common ancestor, which already had DNA, the genetic code, ribosomes, ATP and a membrane. The first split separates Bacteria from a branch that later splits into Archaea and Eukarya. A mark on the branch shared by Archaea and Eukarya reads histones and a complex RNA polymerase. A mark on the Eukarya branch reads nucleus, organelles and linear chromosomes. Bacteria: no nucleus, most have peptidoglycan walls. Archaea: no nucleus, unusual membrane lipids. Eukarya: animals, plants, fungi and protists.</desc><rect width="760" height="320" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="330" y1="150" x2="330" y2="240"/><line x1="330" y1="150" x2="480" y2="150"/><line x1="330" y1="240" x2="480" y2="240"/><line x1="180" y1="60" x2="180" y2="195"/><line x1="180" y1="60" x2="480" y2="60"/><line x1="180" y1="195" x2="330" y2="195"/><line x1="140" y1="127.5" x2="180" y2="127.5"/></g><text x="488" y="65" font-size="18">Bacteria</text><text x="488" y="155" font-size="18">Archaea</text><text x="488" y="245" font-size="18">Eukarya</text><circle cx="140" cy="127.5" r="7" fill="#1F2A28"/><text x="128" y="113.5" font-size="14" text-anchor="end" font-weight="700">LUCA</text><text x="128" y="131.5" font-size="12" text-anchor="end">DNA, code,</text><text x="128" y="146.5" font-size="12" text-anchor="end">ribosomes, ATP,</text><text x="128" y="161.5" font-size="12" text-anchor="end">membrane</text><rect x="251" y="186" width="8" height="18" fill="#D55E00"/><text x="255" y="223" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">histones,</text><text x="255" y="238" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">complex RNA</text><text x="255" y="253" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">polymerase</text><rect x="401" y="231" width="8" height="18" fill="#D55E00"/><text x="405" y="266" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">nucleus, organelles,</text><text x="405" y="281" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">linear chromosomes</text><text x="488" y="84" font-size="12">no nucleus; most have peptidoglycan walls</text><text x="488" y="174" font-size="12">no nucleus; unusual membrane lipids</text><text x="488" y="264" font-size="12">animals, plants, fungi, protists</text></g></svg>
