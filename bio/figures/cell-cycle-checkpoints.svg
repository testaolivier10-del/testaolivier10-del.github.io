<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Cell cycle checkpoints, and cyclin and CDK through one cycle</title>
<desc id="d">Left: the cell cycle ring (G1, S, G2, M) with three stop signs. The G1 checkpoint at the end of G1 checks cell size, growth signals and DNA damage. The G2 checkpoint between G2 and M checks that all DNA is copied and undamaged. The M checkpoint in metaphase checks that every chromosome is attached to spindle fibers from both poles. Right: a sketch graph through one cycle. The amount of CDK stays level. Mitotic cyclin is low in G1, builds through S and G2, peaks in M, then drops sharply. Cyclin-CDK activity (MPF) stays near zero until late G2, spikes in M when cyclin is highest, and falls when cyclin is destroyed.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <path d="M165.0,90.0 A125,125 0 0 1 238.5,316.1 L208.5,274.9 A74,74 0 0 0 165.0,141.0 Z" fill="#C3DDF0" stroke="#ffffff" stroke-width="3"/><path d="M238.5,316.1 A125,125 0 0 1 46.1,253.6 L94.6,237.9 A74,74 0 0 0 208.5,274.9 Z" fill="#F8E3B8" stroke="#ffffff" stroke-width="3"/><path d="M46.1,253.6 A125,125 0 0 1 79.4,123.9 L114.3,161.1 A74,74 0 0 0 94.6,237.9 Z" fill="#C4E8DC" stroke="#ffffff" stroke-width="3"/><path d="M79.4,123.9 A125,125 0 0 1 165.0,90.0 L165.0,141.0 A74,74 0 0 0 114.3,161.1 Z" fill="#F6D2BD" stroke="#ffffff" stroke-width="3"/><text x="260" y="190" font-size="17" font-weight="700" text-anchor="middle">G1</text><text x="134" y="316" font-size="17" font-weight="700" text-anchor="middle">S</text><text x="69" y="196" font-size="17" font-weight="700" text-anchor="middle">G2</text><text x="128" y="128" font-size="17" font-weight="700" text-anchor="middle">M</text>
  <polygon points="237.3,301.2 229.2,309.4 217.7,309.4 209.6,301.2 209.6,289.8 217.7,281.6 229.2,281.6 237.3,289.8" fill="#8E3B2E" stroke="#ffffff" stroke-width="2"/><text x="223.5" y="300.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">G1</text><polygon points="110.7,148.2 102.6,156.3 91.1,156.3 83.0,148.2 83.0,136.7 91.1,128.6 102.6,128.6 110.7,136.7" fill="#8E3B2E" stroke="#ffffff" stroke-width="2"/><text x="96.9" y="147.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">G2</text><polygon points="144.8,127.2 136.7,135.4 125.2,135.4 117.1,127.2 117.1,115.8 125.2,107.6 136.7,107.6 144.8,115.8" fill="#8E3B2E" stroke="#ffffff" stroke-width="2"/><text x="131.0" y="126.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">M</text>
  <rect x="318" y="30" width="200" height="74" rx="8" fill="#EEF2F1" stroke="#8E3B2E" stroke-width="1.5"/><text x="328" y="49" font-size="12.5" font-weight="700">M checkpoint (metaphase)</text><text x="328" y="66" font-size="12">Every chromosome attached</text><text x="328" y="82" font-size="12">to spindle fibers from</text><text x="328" y="98" font-size="12">both poles?</text><line x1="147" y1="122" x2="316" y2="50" stroke="#8E3B2E" stroke-width="1.5"/><rect x="318" y="150" width="200" height="58" rx="8" fill="#EEF2F1" stroke="#8E3B2E" stroke-width="1.5"/><text x="328" y="169" font-size="12.5" font-weight="700">G2 checkpoint (G2 to M)</text><text x="328" y="186" font-size="12">All the DNA copied?</text><text x="328" y="202" font-size="12">Any DNA damage?</text><line x1="113" y1="142" x2="316" y2="170" stroke="#8E3B2E" stroke-width="1.5"/><rect x="318" y="262" width="200" height="74" rx="8" fill="#EEF2F1" stroke="#8E3B2E" stroke-width="1.5"/><text x="328" y="281" font-size="12.5" font-weight="700">G1 checkpoint (end of G1)</text><text x="328" y="298" font-size="12">Big enough? Growth</text><text x="328" y="314" font-size="12">signals present? Any</text><text x="328" y="330" font-size="12">DNA damage?</text><line x1="239" y1="295" x2="316" y2="282" stroke="#8E3B2E" stroke-width="1.5"/>
  <text x="512" y="126" font-size="14" font-weight="700">Through one cycle</text>
