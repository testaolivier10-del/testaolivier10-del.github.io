<line x1="520" y1="384" x2="544" y2="384" stroke="#E69F00" stroke-width="3.5"/><text x="550" y="388">mitotic cyclin</text>
<line x1="520" y1="402" x2="544" y2="402" stroke="#8E3B2E" stroke-width="3" stroke-dasharray="7 4"/><text x="550" y="406">cyclin-CDK activity (MPF)</text></g>
</g>
</svg>