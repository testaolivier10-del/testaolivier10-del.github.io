<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="ppw-t ppw-d">
<title id="ppw-t">Why each base pair is one purine and one pyrimidine</title>
<desc id="ppw-d">Left: five base pairs between two sugar-phosphate backbones. The left strand runs 5-prime at the top to 3-prime at the bottom; the right strand runs the other way. Purines (A and G, two rings) are drawn as long orange blocks and pyrimidines (T and C, one ring) as short blue blocks. Each rung joins one purine to one pyrimidine: A to T with two dashed hydrogen bonds, G to C with three. Every rung therefore has the same total length, so the two backbones stay the same distance apart, about 2 nanometers. Right: three test rungs. Purine plus purine is too long to fit between the backbones; pyrimidine plus pyrimidine leaves a gap too wide to bond across; purine plus pyrimidine fits exactly.</desc>
