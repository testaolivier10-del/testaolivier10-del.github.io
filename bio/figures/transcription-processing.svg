<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="txp-t txp-d">
<title id="txp-t">Transcription and RNA processing in a eukaryotic cell</title>
<desc id="txp-d">Top: a eukaryotic gene in the nucleus. The promoter, with its TATA box, sits just before the transcription start site, marked by a bent arrow. The gene has three exons (colored) separated by two introns (gray), followed by the signal that ends transcription. RNA polymerase II has bound at the promoter and moves along the template strand, reading it 3-prime to 5-prime and building RNA 5-prime to 3-prime; the coding strand has the same sequence as the RNA, with T in place of U. Middle: the primary transcript, pre-mRNA, contains all exons and introns. Processing adds a 5-prime cap and a poly-A tail, and spliceosomes cut out the introns and join the exons. Bottom: the mature mRNA, with cap, three joined exons and tail, leaves the nucleus through a nuclear pore to the cytoplasm, where ribosomes will use it.</desc>
