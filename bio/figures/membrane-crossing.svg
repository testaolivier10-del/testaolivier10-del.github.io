<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d">
<title id="t">What can cross a phospholipid bilayer</title>
<desc id="d">A phospholipid bilayer seen edge on, with the outside of the cell above and the cytoplasm below. Oxygen and carbon dioxide, small nonpolar molecules, pass straight through the bilayer. A few water molecules slip through the bilayer, but many more pass through an aquaporin. Sodium and chloride ions bounce off the bilayer. Glucose, a larger polar molecule, crosses only through a transport protein. A large protein does not cross.</desc>
