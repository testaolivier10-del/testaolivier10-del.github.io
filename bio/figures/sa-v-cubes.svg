<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Surface area-to-volume ratio of three cubes</title>
<desc id="d">Three cubes with sides of 1, 2 and 3 centimeters. The 1 cm cube has a surface area of 6 square centimeters and a volume of 1 cubic centimeter, a ratio of 6 to 1. The 2 cm cube has 24 square centimeters and 8 cubic centimeters, a ratio of 3 to 1. The 3 cm cube has 54 square centimeters and 27 cubic centimeters, a ratio of 2 to 1. As the cube gets bigger, volume grows faster than surface area, so the ratio falls.</desc>
<rect width="680" height="400" fill="#ffffff"/>
<defs>
  <g id="cube">
    <path d="M0 0 h40 v40 h-40 z" fill="#C4E8DC" stroke="#009E73" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <path d="M0 0 l14 -14 h40 l-14 14 z" fill="#E5F4EE" stroke="#009E73" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <path d="M40 0 l14 -14 v40 l-14 14 z" fill="#9FD6C3" stroke="#009E73" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </g>
</defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <!-- 1 cm cube: scale 1 -->
  <use href="#cube" x="153" y="200"/>
  <!-- 2 cm cube -->
  <g transform="translate(276 160) scale(2)"><use href="#cube"/></g>
  <!-- 3 cm cube -->
  <g transform="translate(429 120) scale(3)"><use href="#cube"/></g>
  <g font-size="16" text-anchor="middle" font-weight="700">
    <text x="173" y="262">1 cm</text><text x="316" y="262">2 cm</text><text x="489" y="262">3 cm</text>
  </g>
  <!-- table -->
  <g font-size="15">
    <line x1="20" y1="282" x2="660" y2="282" stroke="#5D6B69"/>
    <text x="20" y="302" font-weight="700">Surface area</text>
    <text x="180" y="302" text-anchor="middle">6 cm²</text>
    <text x="330" y="302" text-anchor="middle">24 cm²</text>
    <text x="500" y="302" text-anchor="middle">54 cm²</text>
    <text x="20" y="330" font-weight="700">Volume</text>
    <text x="180" y="330" text-anchor="middle">1 cm³</text>
    <text x="330" y="330" text-anchor="middle">8 cm³</text>
    <text x="500" y="330" text-anchor="middle">27 cm³</text>
    <line x1="20" y1="342" x2="660" y2="342" stroke="#5D6B69"/>
    <text x="20" y="366" font-weight="700" fill="#8E3B2E">Surface area ÷ volume</text>
    <text x="180" y="390" text-anchor="middle" font-weight="700" fill="#8E3B2E" font-size="18">6 : 1</text>
    <text x="330" y="390" text-anchor="middle" font-weight="700" fill="#8E3B2E" font-size="18">3 : 1</text>
    <text x="500" y="390" text-anchor="middle" font-weight="700" fill="#8E3B2E" font-size="18">2 : 1</text>
  </g>
  <text x="20" y="40" font-size="16">Each side length grows by 1 cm. Surface area grows with the square of the side;</text>
  <text x="20" y="62" font-size="16">volume grows with the cube of the side, so the ratio falls.</text>
</g>
</svg>
