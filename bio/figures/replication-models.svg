<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="msm-t msm-d">
<title id="msm-t">Three models of DNA copying and the bands they predict</title>
<desc id="msm-d">Three models of DNA copying, followed for two rounds starting from a molecule whose two strands are both heavy (dark). New strands are light (pale). Semiconservative: after round 1, each molecule has one heavy and one light strand (hybrid); after round 2, half the molecules are hybrid and half are fully light. Conservative: after round 1, one molecule is fully heavy and one fully light; after round 2, one heavy and three light. Dispersive: every strand is a patchwork of old and new pieces, so after round 1 all molecules are half heavy, and after round 2 all are one quarter heavy. Beside each model, the predicted band positions in a density gradient tube, heavy at the bottom.</desc>
