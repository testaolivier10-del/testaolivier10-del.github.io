<text x="160.0" y="281.0" font-size="13" text-anchor="middle">white allele p is recessive (hidden in F1)</text>
<line x1="160.0" y1="292.0" x2="160.0" y2="324.0" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#mono-a)"/>
