<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="mono-t mono-d">
<title id="mono-t">A monohybrid cross: purple and white pea flowers through three generations</title>
<desc id="mono-d">Left: the P generation, a true-breeding purple-flowered plant (PP) crossed with a true-breeding white-flowered plant (pp). Every F1 plant has purple flowers and the genotype Pp. The F1 plants are self-pollinated. Right: a Punnett square for the F1 cross Pp times Pp. Each parent makes gametes P and p in equal numbers, written along the top and side. The four boxes are PP (purple), Pp (purple), Pp (purple) and pp (white). The F2 phenotype ratio is 3 purple to 1 white; the genotype ratio is 1 PP to 2 Pp to 1 pp.</desc>
