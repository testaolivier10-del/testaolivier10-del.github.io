<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="t d">
<title id="t">Competitive and noncompetitive inhibition</title>
<desc id="d">Left: a competitive inhibitor has a shape similar to the substrate and sits in the active site, so the substrate cannot bind while it is there. Right: a noncompetitive inhibitor binds a different site on the enzyme, the allosteric site, and changes the enzyme's shape so the active site no longer fits the substrate.</desc>
<rect width="680" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="170" y="28" font-size="17" font-weight="700" text-anchor="middle">Competitive inhibitor</text>
  <text x="510" y="28" font-size="17" font-weight="700" text-anchor="middle">Noncompetitive inhibitor</text>
  <!-- left -->
  <g transform="translate(50,0)">
    <path d="M10,290 L10,175 Q10,135 50,135 L95,135 L95,168 Q120,192 145,168 L145,135 L190,135 Q230,135 230,175 L230,290 Z" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
    <path d="M98,138 L142,138 L142,163 Q120,182 98,163 Z" fill="#F1DAE7" stroke="#CC79A7" stroke-width="3"/>
    <path d="M30,60 L74,60 L74,87 Q52,108 30,87 Z" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
    <path d="M80,92 L100,112" stroke="#8E3B2E" stroke-width="3"/><path d="M100,92 L80,112" stroke="#8E3B2E" stroke-width="3"/>
    <text x="52" y="50" font-size="14" text-anchor="middle">substrate</text>
    <text x="175" y="105" font-size="14" text-anchor="middle">inhibitor in</text>
    <text x="175" y="121" font-size="14" text-anchor="middle">the active site</text>
    <text x="120" y="240" font-size="16" font-weight="700" text-anchor="middle">enzyme</text>
    <text x="120" y="316" font-size="14" text-anchor="middle" fill="#3D4A66">More substrate can outcompete it</text>
  </g>
  <!-- right -->
  <g transform="translate(390,0)">
    <path d="M10,290 L10,175 Q10,135 50,135 L88,128 L108,160 Q120,170 132,160 L152,128 L190,135 Q230,135 230,175 L230,255 L150,255 L150,290 Z" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
    <path d="M160,262 L222,262 L222,300 L160,300 Z" fill="#F1DAE7" stroke="#CC79A7" stroke-width="3"/>
    <path d="M98,60 L142,60 L142,87 Q120,108 98,87 Z" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
    <path d="M110,100 L130,120" stroke="#8E3B2E" stroke-width="3"/><path d="M130,100 L110,120" stroke="#8E3B2E" stroke-width="3"/>
    <text x="175" y="70" font-size="14" text-anchor="start">substrate no</text>
    <text x="175" y="86" font-size="14" text-anchor="start">longer fits</text>
    <text x="80" y="215" font-size="14" text-anchor="middle">active site</text>
    <text x="80" y="231" font-size="14" text-anchor="middle">changed shape</text>
    <text x="191" y="320" font-size="14" text-anchor="middle">allosteric site</text>
    <text x="191" y="286" font-size="13" text-anchor="middle">inhibitor</text>
  </g>
</g>
</svg>
