<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ols-t ols-d"><title id="ols-t">From simple molecules to the first cells: a hypothesis</title><desc id="ols-d">Six steps. 1, simple molecules: water, methane, ammonia, hydrogen, carbon dioxide and nitrogen, with energy from lightning, UV light or heat at vents. 2, monomers such as amino acids, sugars, nucleotide parts and fatty acids form without life. 3, monomers join on clay or mineral surfaces into polymers: RNA chains and peptides. 4, protocells: fatty acids form vesicles around RNA, which grow and divide. 5, the RNA world: RNA both stores information and catalyzes reactions as ribozymes, and copying with errors lets natural selection act on molecules. 6, DNA and proteins take over: DNA as a more stable store of information, proteins as faster and more varied catalysts, and RNA as the go-between. Each step has lab evidence, but how and where it all happened is still debated.</desc><defs><marker id="ola" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="760" height="330" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="16" y="20" width="170" height="116" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/><text x="101" y="42" font-size="14" text-anchor="middle" font-weight="700">1. Simple molecules</text><text x="101" y="60" font-size="12.5" text-anchor="middle">H₂O, CH₄, NH₃, H₂,</text><text x="101" y="78" font-size="12.5" text-anchor="middle">CO₂, N₂; energy from</text><text x="101" y="96" font-size="12.5" text-anchor="middle">lightning, UV light,</text><text x="101" y="114" font-size="12.5" text-anchor="middle">heat at vents</text><rect x="212" y="20" width="170" height="116" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><text x="297" y="42" font-size="14" text-anchor="middle" font-weight="700">2. Monomers</text><text x="297" y="60" font-size="12.5" text-anchor="middle">amino acids, sugars,</text><text x="297" y="78" font-size="12.5" text-anchor="middle">nucleotide parts,</text><text x="297" y="96" font-size="12.5" text-anchor="middle">fatty acids form</text><text x="297" y="114" font-size="12.5" text-anchor="middle">without life</text><rect x="408" y="20" width="170" height="116" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><text x="493" y="42" font-size="14" text-anchor="middle" font-weight="700">3. Polymers</text><text x="493" y="60" font-size="12.5" text-anchor="middle">monomers join on</text><text x="493" y="78" font-size="12.5" text-anchor="middle">clay or mineral</text><text x="493" y="96" font-size="12.5" text-anchor="middle">surfaces into RNA</text><text x="493" y="114" font-size="12.5" text-anchor="middle">chains and peptides</text><rect x="604" y="20" width="140" height="116" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="674" y="42" font-size="14" text-anchor="middle" font-weight="700">4. Protocells</text><text x="674" y="60" font-size="12.5" text-anchor="middle">fatty acids form</text><text x="674" y="78" font-size="12.5" text-anchor="middle">vesicles around</text><text x="674" y="96" font-size="12.5" text-anchor="middle">RNA; they grow</text><text x="674" y="114" font-size="12.5" text-anchor="middle">and divide</text><line x1="188" y1="78" x2="208" y2="78" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ola)"/><line x1="384" y1="78" x2="404" y2="78" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ola)"/><line x1="580" y1="78" x2="600" y2="78" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ola)"/><rect x="408" y="186" width="336" height="100" rx="10" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="576" y="208" font-size="14" text-anchor="middle" font-weight="700">5. RNA world</text><text x="576" y="226" font-size="12.5" text-anchor="middle">RNA stores information AND catalyzes</text><text x="576" y="244" font-size="12.5" text-anchor="middle">reactions (ribozymes); copying with errors</text><text x="576" y="262" font-size="12.5" text-anchor="middle">lets natural selection act on molecules</text><rect x="16" y="186" width="366" height="100" rx="10" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="199" y="208" font-size="14" text-anchor="middle" font-weight="700">6. DNA and proteins take over</text><text x="199" y="226" font-size="12.5" text-anchor="middle">DNA: a more stable store of information</text><text x="199" y="244" font-size="12.5" text-anchor="middle">proteins: faster, more varied catalysts</text><text x="199" y="262" font-size="12.5" text-anchor="middle">RNA: the go-between (mRNA, tRNA, rRNA)</text><path d="M 674 138 V 182" stroke="#1F2A28" stroke-width="2.5" fill="none" marker-end="url(#ola)"/><line x1="406" y1="236" x2="386" y2="236" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ola)"/><text x="380" y="314" font-size="13" text-anchor="middle">Each step has lab evidence, but how and where it all happened is still debated.</text></g></svg>
