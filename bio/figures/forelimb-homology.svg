<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="fl-t fl-d">
<title id="fl-t">Homologous forelimbs of four mammals</title>
<desc id="fl-d">Simplified forelimb skeletons of a human arm, a cat's front leg, a whale's flipper and a bat's wing, drawn side by side with matching bones in matching colors. Each has one upper-arm bone (humerus, blue), two forearm bones (radius and ulna, orange), a group of wrist bones (carpals, green) and five sets of hand and finger bones (metacarpals and phalanges, pink). The bones differ in length and shape: the whale's are short and flat inside a paddle, with extra finger bones, and the bat's finger bones are very long and hold up the skin of the wing. The same set of bones, used for grasping, walking, swimming and flying, points to a common ancestor.</desc>
<rect width="760" height="430" fill="#ffffff"/>
