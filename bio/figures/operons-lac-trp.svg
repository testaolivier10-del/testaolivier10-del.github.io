<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="opn-t opn-d">
<title id="opn-t">Inducible lac operon and repressible trp operon</title>
<desc id="opn-d">Four panels. Top two: the lac operon, an inducible operon. A separate regulatory gene, lacI, makes the lac repressor all the time. The operon is a promoter, an operator and three structural genes, lacZ, lacY and lacA, copied into one mRNA. Top left, no lactose: the repressor binds the operator, blocking RNA polymerase, so the genes are off. Top right, lactose present: allolactose, the inducer, binds the repressor and changes its shape, the repressor falls off the operator, and RNA polymerase makes one mRNA for all three genes. When glucose is low, cAMP-CAP also binds next to the promoter and boosts transcription. Bottom two: the trp operon, a repressible operon. Bottom left, little tryptophan: the trp repressor is inactive and cannot bind the operator, so RNA polymerase copies the five genes for making tryptophan. Bottom right, plenty of tryptophan: tryptophan, the corepressor, binds the repressor, activating it; the active repressor binds the operator and the genes are switched off.</desc>
