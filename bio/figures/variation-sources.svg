<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="var-t var-d">
<title id="var-t">Two sources of new allele combinations in meiosis I: crossing over and independent assortment</title>
<desc id="var-d">Left, crossing over: a pair of homologous chromosomes, one blue and one orange, each made of two sister chromatids. The blue homolog carries alleles A and B, the orange one a and b. In prophase I, one blue and one orange chromatid break and swap matching pieces at a chiasma between the two genes. The four chromatids that result carry A B and a b (parental combinations, as in the parent's chromosomes) and A b and a B (recombinant combinations, new mixes). Right, independent assortment: a cell with two homologous pairs, a long pair and a short pair, at metaphase I. Each pair lines up independently, so two arrangements are equally likely. In one, both blue chromosomes face the same pole, giving gametes with blue long plus blue short or orange long plus orange short. In the other, the short pair is flipped, giving blue long plus orange short or orange long plus blue short. With n pairs there are 2 to the power n combinations; for humans, 2 to the 23rd, about 8.4 million.</desc>
