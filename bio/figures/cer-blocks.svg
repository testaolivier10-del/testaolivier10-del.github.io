<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">Claim, evidence and reasoning</title>
<desc id="d">Three stacked blocks. Claim: catalase works fastest near pH 7. Evidence: 4.8 mL O₂ per minute at pH 7, compared with 2.1 at pH 5 and 3.0 at pH 9, with non-overlapping error bars. Reasoning: pH changes the charges on R groups in the active site, changing its shape and how well it binds substrate. Arrows show evidence supporting the claim and reasoning linking them.</desc>
<rect width="640" height="340" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2A28"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1F2A28">
  <rect x="20" y="20" width="460" height="70" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  <text x="36" y="46" font-weight="700" fill="#8E3B2E">CLAIM: answers the question</text>
  <text x="36" y="72">Catalase works fastest near pH 7.</text>
  <rect x="20" y="130" width="460" height="80" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/>
  <text x="36" y="156" font-weight="700" fill="#0072B2">EVIDENCE: data, units, comparison</text>
  <text x="36" y="180">4.8 mL O₂/min at pH 7 vs 2.1 (pH 5) and 3.0 (pH 9);</text>
  <text x="36" y="200">95% CI error bars do not overlap.</text>
  <rect x="20" y="250" width="460" height="80" rx="10" fill="#C4E8DC" stroke="#009E73" stroke-width="2.5"/>
  <text x="36" y="276" font-weight="700" fill="#00684C">REASONING: biology that explains why</text>
  <text x="36" y="300">pH changes R-group charges in the active site,</text>
  <text x="36" y="320">altering its shape and substrate binding.</text>
  <line x1="250" y1="128" x2="250" y2="94" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="262" y="116" font-size="13">supports</text>
  <path d="M482 290 C580 290 580 55 484 55" fill="none" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="586" y="170" font-size="13" text-anchor="middle">explains</text>
  <text x="586" y="186" font-size="13" text-anchor="middle">why the</text>
  <text x="586" y="202" font-size="13" text-anchor="middle">evidence</text>
  <text x="586" y="218" font-size="13" text-anchor="middle">supports</text>
  <text x="586" y="234" font-size="13" text-anchor="middle">the claim</text>
</g>
</svg>
