<circle cx="400" cy="80" r="20" fill="#FFFFFF" stroke="#5D6B69" stroke-width="2"/>
<text x="400.0" y="118.0" font-size="12" text-anchor="middle">pp</text>
<line x1="440.0" y1="80.0" x2="545.0" y2="80.0" stroke="#1F2A28" stroke-width="2" marker-end="url(#dom-a)"/>
<circle cx="600" cy="80" r="20" fill="#6A3D9A"/>
<text x="600.0" y="118.0" font-size="12" text-anchor="middle" font-weight="700">Pp: looks like PP</text>
<line x1="20.0" y1="132.0" x2="740.0" y2="132.0" stroke="#5D6B69" stroke-width="1" stroke-dasharray="3 5"/>
<text x="20.0" y="166.0" font-size="14" text-anchor="start" font-weight="700">Incomplete dominance</text>
<text x="20.0" y="184.0" font-size="12" text-anchor="start">snapdragon</text>
