<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="dom-t dom-d">
<title id="dom-t">Complete dominance, incomplete dominance and codominance compared</title>
<desc id="dom-d">Three rows, each showing two homozygous parents and their heterozygous offspring. Complete dominance, pea flowers: purple PP and white pp parents give purple Pp offspring, indistinguishable from PP. Incomplete dominance, snapdragon flowers: red and white parents give pink offspring, an in-between phenotype. Codominance, cattle coat: a red-haired and a white-haired parent give a roan calf whose coat has both red hairs and white hairs mixed, each allele's product fully shown.</desc>
<defs><marker id="dom-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
