<text x="400.0" y="26.0" font-size="14" text-anchor="middle" font-weight="700">Parent 2</text>
<text x="600.0" y="26.0" font-size="14" text-anchor="middle" font-weight="700">Heterozygous offspring</text>
<text x="20.0" y="76.0" font-size="14" text-anchor="start" font-weight="700">Complete dominance</text>
<text x="20.0" y="94.0" font-size="12" text-anchor="start">pea flower</text>
<circle cx="250" cy="80" r="20" fill="#6A3D9A"/>
<text x="250.0" y="118.0" font-size="12" text-anchor="middle">PP</text>
