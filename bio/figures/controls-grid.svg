<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d">
<title id="t">Negative and positive controls in a grease-spot test</title>
<desc id="d">Brown paper with six spots after drying. Water, the negative control, leaves no spot; vegetable oil, the positive control, leaves a see-through spot. A chip and a peanut leave see-through spots; an apple leaves none. Labels say the negative control rules out "the procedure makes spots by itself" and the positive control rules out "the test could not detect fat today".</desc>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1F2A28">
  <rect x="20" y="20" width="600" height="170" rx="8" fill="#D9B98C" stroke="#6B5E3C" stroke-width="2"/>
  <text x="320" y="44" font-weight="700">Brown paper after 30 minutes</text>
  <circle cx="75" cy="105" r="34" fill="none" stroke="#6B5E3C" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="175" cy="105" r="38" fill="#F7EBD5" stroke="#6B5E3C" stroke-width="1.5"/>
  <circle cx="320" cy="105" r="28" fill="#F1E1C4" stroke="#6B5E3C" stroke-width="1.5"/>
  <circle cx="420" cy="105" r="30" fill="none" stroke="#6B5E3C" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="530" cy="105" r="38" fill="#F7EBD5" stroke="#6B5E3C" stroke-width="1.5"/>
  <text x="75" y="166">water</text><text x="175" y="166">oil</text><text x="320" y="166">chip</text><text x="420" y="166">apple</text><text x="530" y="166">peanut</text>
  <text x="75" y="110" font-size="13" fill="#5B6B8C">no spot</text><text x="420" y="110" font-size="13" fill="#5B6B8C">no spot</text>
  <rect x="20" y="205" width="290" height="110" rx="8" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2"/>
  <text x="165" y="230" font-weight="700" fill="#3D4A66">Negative control: water</text>
  <text x="165" y="254">known: no lipid → expect no spot</text>
  <text x="165" y="278">Rules out: the paper or handling</text>
  <text x="165" y="298">makes a spot by itself</text>
  <rect x="330" y="205" width="290" height="110" rx="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
  <text x="475" y="230" font-weight="700" fill="#8E3B2E">Positive control: oil</text>
  <text x="475" y="254">known: lipid → expect a spot</text>
  <text x="475" y="278">Rules out: the test could not</text>
  <text x="475" y="298">detect fat today</text>
  <line x1="75" y1="175" x2="120" y2="205" stroke="#5B6B8C" stroke-width="2"/>
  <line x1="175" y1="175" x2="420" y2="205" stroke="#D55E00" stroke-width="2"/>
</g>
</svg>
