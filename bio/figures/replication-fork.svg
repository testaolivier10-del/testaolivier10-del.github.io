<text x="665.0" y="140.0" font-size="12" text-anchor="middle">topoisomerase</text>
<text x="665.0" y="154.0" font-size="12" text-anchor="middle">relieves twisting</text>
<text x="700.0" y="60.0" font-size="13" text-anchor="middle" font-weight="700">fork moves</text>
