<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="rfk-t rfk-d">
<title id="rfk-t">Events at a replication fork</title>
<desc id="rfk-d">A replication fork moving to the right. On the right, the unopened parental double helix; topoisomerase sits on it ahead of the fork, relieving the twisting. Helicase, a ring at the fork, breaks the hydrogen bonds between the parental strands. Single-strand binding proteins coat the separated template strands. Top: the template strand runs 3-prime on the left to 5-prime at the fork, so DNA polymerase III builds the leading strand continuously from one RNA primer, 5-prime to 3-prime, toward the fork. Bottom: the template runs 5-prime on the left to 3-prime at the fork, so the lagging strand is built away from the fork in short Okazaki fragments. Near the fork, primase lays down a new RNA primer and DNA polymerase III extends it leftward. Farther back, DNA polymerase I removes an older fragment&#x27;s RNA primer and replaces it with DNA, and DNA ligase seals the remaining nick, joining the fragments into one strand.</desc>
