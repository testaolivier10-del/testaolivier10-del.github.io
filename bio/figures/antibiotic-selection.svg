<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ab-t ab-d">
<title id="ab-t">How an antibiotic selects for resistant bacteria</title>
<desc id="ab-d">Three panels of rod-shaped bacteria. 1, before treatment: 23 susceptible cells (blue) and 1 resistant cell (orange), which became resistant through a random mutation or a gene received from another cell. 2, antibiotic given: the susceptible cells die (dashed gray outlines) except 2; the resistant cell survives, and the drug did not create it. 3, after treatment: the survivors multiply, so 22 of 24 cells are resistant and the drug no longer works.</desc>
