<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="env-t env-d">
<title id="env-t">One genotype, different phenotypes: hydrangea color and turtle sex</title>
<desc id="env-d">Left: three hydrangea plants grown from cuttings of one plant, so with the same genotype, in soils of pH 5, 6 and 7. In acidic soil (pH 5) aluminum dissolves, the roots take it up, and it binds the flower pigment, giving blue flowers; at pH 6 the flowers are purple; in neutral soil (pH 7) aluminum stays locked in the soil and the flowers are pink. Right: a graph of the percentage of turtle hatchlings that are female against the temperature at which the eggs were incubated, from 26 to 32 degrees Celsius. Below about 27 degrees almost all hatch as males; above about 31 degrees almost all hatch as females; the switch is steep around 29 degrees. Each curve shows a norm of reaction: the range of phenotypes one genotype produces across environments.</desc>
