<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-labelledby="t d">
<title id="t">Electron transport and ATP synthase in the inner mitochondrial membrane</title>
<desc id="d">A strip of inner mitochondrial membrane with the intermembrane space above and the matrix below. NADH and FADH2 hand electrons to proteins of the electron transport chain. As electrons pass along, three of the proteins pump hydrogen ions from the matrix into the intermembrane space. At the end, oxygen accepts the electrons and hydrogen ions and becomes water. Hydrogen ions flow back into the matrix through ATP synthase, which makes ATP from ADP and phosphate.</desc>
<defs>
  <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker>
  <marker id="a8b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0072B2"/></marker>
  <marker id="a8r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E3B2E"/></marker>
</defs>
<rect width="780" height="430" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <rect x="0" y="0" width="780" height="160" fill="#F7E6E2"/>
  <rect x="0" y="160" width="780" height="50" fill="#F3EBD3"/>
  <line x1="0" y1="160" x2="780" y2="160" stroke="#6B5E3C" stroke-width="3"/>
  <line x1="0" y1="210" x2="780" y2="210" stroke="#6B5E3C" stroke-width="3"/>
  <rect x="0" y="210" width="780" height="220" fill="#FCF3EE"/>
  <text x="10" y="24" font-size="15" font-weight="700">INTERMEMBRANE SPACE</text>
  <text x="10" y="42" font-size="13">high H+</text>
  <text x="10" y="410" font-size="15" font-weight="700">MATRIX</text>
  <text x="10" y="426" font-size="13">low H+</text>
  <text x="772" y="190" font-size="12" text-anchor="end" fill="#6B5E3C">inner membrane</text>
  <!-- complexes -->
  <g fill="#D2EAF8" stroke="#0072B2" stroke-width="3">
    <rect x="70" y="135" width="80" height="100" rx="14"/>
    <rect x="190" y="175" width="60" height="50" rx="12"/>
    <rect x="290" y="135" width="80" height="100" rx="14"/>
    <rect x="430" y="135" width="80" height="100" rx="14"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle"><text x="110" y="191">I</text><text x="220" y="206">II</text><text x="330" y="191">III</text><text x="470" y="191">IV</text></g>
  <!-- ATP synthase -->
  <rect x="632" y="150" width="36" height="70" rx="6" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
  <circle cx="650" cy="252" r="30" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
  <text x="650" y="248" font-size="12" font-weight="700" text-anchor="middle">ATP</text>
  <text x="650" y="262" font-size="12" font-weight="700" text-anchor="middle">synthase</text>
  <!-- electron donors -->
  <text x="110" y="300" font-size="14" text-anchor="middle">NADH → NAD+</text>
  <path d="M110,282 L110,242" stroke="#0072B2" stroke-width="3" marker-end="url(#a8b)"/>
  <text x="220" y="300" font-size="14" text-anchor="middle">FADH<tspan font-size="10" baseline-shift="sub">2</tspan> → FAD</text>
  <path d="M220,282 L220,230" stroke="#0072B2" stroke-width="3" marker-end="url(#a8b)"/>
  <!-- electron path -->
  <g stroke="#0072B2" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#a8b)">
    <path d="M152,170 L286,170"/><path d="M252,195 L286,185"/><path d="M372,190 L426,190"/>
  </g>
  <text x="200" y="164" font-size="14" font-weight="700" fill="#005A8C">e−</text>
  <text x="398" y="182" font-size="14" font-weight="700" fill="#005A8C">e−</text>
  <!-- oxygen -->
  <path d="M470,242 L470,286" stroke="#0072B2" stroke-width="3" marker-end="url(#a8b)"/>
  <text x="470" y="306" font-size="15" text-anchor="middle">½ O<tspan font-size="11" baseline-shift="sub">2</tspan> + 2 H+ + 2 e− → H<tspan font-size="11" baseline-shift="sub">2</tspan>O</text>
  <text x="470" y="326" font-size="13" text-anchor="middle">oxygen: the final electron acceptor</text>
  <!-- pumping -->
  <g stroke="#8E3B2E" stroke-width="3" marker-end="url(#a8r)">
    <line x1="88" y1="244" x2="88" y2="70"/><line x1="312" y1="244" x2="312" y2="70"/><line x1="500" y1="244" x2="500" y2="70"/>
  </g>
  <g font-size="15" font-weight="700" fill="#8E3B2E" text-anchor="middle">
    <text x="88" y="62">H+</text><text x="312" y="62">H+</text><text x="500" y="62">H+</text>
    <text x="88" y="262">H+</text><text x="312" y="262">H+</text><text x="508" y="262">H+</text>
  </g>
  <!-- synthase flow -->
  <path d="M650,70 L650,216" stroke="#8E3B2E" stroke-width="3" marker-end="url(#a8r)"/>
  <text x="650" y="62" font-size="15" font-weight="700" text-anchor="middle" fill="#8E3B2E">H+ flows back</text>
  <text x="650" y="306" font-size="15" text-anchor="middle">ADP + Pi → ATP</text>
  <g font-size="16" font-weight="700" fill="#8E3B2E" opacity="0.75">
    <text x="170" y="100">H+</text><text x="390" y="110">H+</text><text x="560" y="90">H+</text><text x="230" y="60">H+</text><text x="560" y="130">H+</text>
  </g>
</g>
</svg>
