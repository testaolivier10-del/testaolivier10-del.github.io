<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">The fluid mosaic model of the plasma membrane</title>
<desc id="d">A slice through a plasma membrane. Two layers of phospholipids face each other: water-loving heads on the outside and cytoplasm faces, water-avoiding tails in the middle. A transmembrane protein spans the whole bilayer. A glycoprotein, a protein with a branched carbohydrate chain, also spans it and faces outward. A receptor protein has a signaling molecule bound to its outer end. A peripheral protein sits on the cytoplasm side. Cholesterol molecules sit among the tails, and a glycolipid carries a carbohydrate chain on the outer face.</desc>
