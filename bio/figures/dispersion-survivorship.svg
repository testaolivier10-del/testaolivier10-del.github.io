<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="dsv-t dsv-d">
<title id="dsv-t">Dispersion patterns and survivorship curves</title>
<desc id="dsv-d">Left: three square plots seen from above, each with 16 individuals. Clumped: the individuals sit in three tight groups. Uniform: they sit in an even grid. Random: they are scattered with no pattern. Right: survivorship curves, the number of survivors out of 1,000 born on a log scale against age as a percent of the maximum life span. Type I stays near 1,000 until late in life and then drops steeply. Type II is a straight line from 1,000 to 1, so the same fraction dies at every age. Type III drops steeply at the youngest ages, to about 15 by 20% of the life span, then declines slowly.</desc>
<rect width="760" height="380" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="185" y="30" font-size="16" font-weight="700" text-anchor="middle">A. Dispersion patterns</text>
  <text x="580" y="30" font-size="16" font-weight="700" text-anchor="middle">B. Survivorship curves</text>

  <rect x="30" y="80" width="90" height="90" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <rect x="140" y="80" width="90" height="90" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <rect x="250" y="80" width="90" height="90" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <g fill="#009E73">
    <circle cx="52" cy="100" r="4"/><circle cx="58" cy="104" r="4"/><circle cx="50" cy="109" r="4"/><circle cx="57" cy="111" r="4"/><circle cx="62" cy="98" r="4"/>
    <circle cx="92" cy="114" r="4"/><circle cx="98" cy="110" r="4"/><circle cx="96" cy="120" r="4"/><circle cx="102" cy="117" r="4"/><circle cx="90" cy="121" r="4"/>
    <circle cx="66" cy="146" r="4"/><circle cx="72" cy="150" r="4"/><circle cx="68" cy="156" r="4"/><circle cx="75" cy="144" r="4"/><circle cx="62" cy="153" r="4"/><circle cx="71" cy="140" r="4"/>
    <circle cx="152" cy="92" r="4"/><circle cx="152" cy="114" r="4"/><circle cx="152" cy="136" r="4"/><circle cx="152" cy="158" r="4"/>
    <circle cx="174" cy="92" r="4"/><circle cx="174" cy="114" r="4"/><circle cx="174" cy="136" r="4"/><circle cx="174" cy="158" r="4"/>
    <circle cx="196" cy="92" r="4"/><circle cx="196" cy="114" r="4"/><circle cx="196" cy="136" r="4"/><circle cx="196" cy="158" r="4"/>
    <circle cx="218" cy="92" r="4"/><circle cx="218" cy="114" r="4"/><circle cx="218" cy="136" r="4"/><circle cx="218" cy="158" r="4"/>
    <circle cx="282" cy="99" r="4"/><circle cx="306" cy="93" r="4"/><circle cx="296" cy="115" r="4"/><circle cx="262" cy="126" r="4"/>
    <circle cx="259" cy="146" r="4"/><circle cx="263" cy="93" r="4"/><circle cx="289" cy="149" r="4"/><circle cx="272" cy="110" r="4"/>
    <circle cx="314" cy="160" r="4"/><circle cx="318" cy="128" r="4"/><circle cx="330" cy="91" r="4"/><circle cx="326" cy="109" r="4"/>
    <circle cx="276" cy="162" r="4"/><circle cx="300" cy="136" r="4"/><circle cx="280" cy="131" r="4"/><circle cx="332" cy="146" r="4"/>
  </g>
  <text x="75" y="194" font-size="14" font-weight="700" text-anchor="middle">Clumped</text>
  <text x="75" y="212" font-size="12" text-anchor="middle">patchy food,</text>
  <text x="75" y="227" font-size="12" text-anchor="middle">living in groups</text>
  <text x="185" y="194" font-size="14" font-weight="700" text-anchor="middle">Uniform</text>
  <text x="185" y="212" font-size="12" text-anchor="middle">territories,</text>
  <text x="185" y="227" font-size="12" text-anchor="middle">keeping apart</text>
  <text x="295" y="194" font-size="14" font-weight="700" text-anchor="middle">Random</text>
  <text x="295" y="212" font-size="12" text-anchor="middle">no strong pull</text>
  <text x="295" y="227" font-size="12" text-anchor="middle">or push</text>
  <text x="30" y="256" font-size="13" font-style="italic">Each square is the same area with 16 individuals:</text>
  <text x="30" y="272" font-size="13" font-style="italic">the same population density, spread differently.</text>

  <!-- survivorship axes -->
  <line x1="430" y1="300" x2="740" y2="300" stroke="#1F2A28" stroke-width="1.5"/>
  <line x1="430" y1="56" x2="430" y2="300" stroke="#1F2A28" stroke-width="1.5"/>
  <g stroke="#D5DEDC" stroke-width="1"><line x1="430" y1="60" x2="740" y2="60"/><line x1="430" y1="140" x2="740" y2="140"/><line x1="430" y1="220" x2="740" y2="220"/></g>
  <g font-size="12" text-anchor="end"><text x="424" y="64">1,000</text><text x="424" y="144">100</text><text x="424" y="224">10</text><text x="424" y="304">1</text></g>
  <g font-size="12" text-anchor="middle"><text x="430" y="318">0</text><text x="580" y="318">50</text><text x="730" y="318">100</text></g>
  <text x="585" y="340" font-size="13" text-anchor="middle">Age (% of maximum life span)</text>
  <text x="372" y="180" font-size="13" text-anchor="middle" transform="rotate(-90 372 180)">Survivors per 1,000 born (log scale)</text>
  <polyline points="430.0,60.0 490.0,60.7 550.0,61.8 610.0,63.7 640.0,65.6 670.0,72.4 700.0,101.8 715.0,157.7 730.0,300.0" fill="none" stroke="#0072B2" stroke-width="3.5"/>
  <polyline points="430.0,60.0 730.0,300.0" fill="none" stroke="#E69F00" stroke-width="3.5" stroke-dasharray="10 5"/>
  <polyline points="430.0,60.0 445.0,140.0 460.0,181.8 490.0,205.9 535.0,220.0 580.0,227.8 625.0,237.7 670.0,251.8 700.0,268.2 730.0,300.0" fill="none" stroke="#D55E00" stroke-width="3.5" stroke-dasharray="3 4"/>
  <text x="686" y="112" font-size="14" font-weight="700" fill="#005A8C" text-anchor="end">I</text>
  <text x="530" y="124" font-size="14" font-weight="700" fill="#8A5A00">II</text>
  <text x="482" y="226" font-size="14" font-weight="700" fill="#A04500">III</text>
  <line x1="430" y1="362" x2="458" y2="362" stroke="#0072B2" stroke-width="3.5"/><text x="464" y="367" font-size="12">Type I</text>
  <line x1="530" y1="362" x2="558" y2="362" stroke="#E69F00" stroke-width="3.5" stroke-dasharray="10 5"/><text x="564" y="367" font-size="12">Type II</text>
  <line x1="630" y1="362" x2="658" y2="362" stroke="#D55E00" stroke-width="3.5" stroke-dasharray="3 4"/><text x="664" y="367" font-size="12">Type III</text>
  <g font-size="12">
    <text x="30" y="300"><tspan font-weight="700">Type I:</tspan> most live to old age</text>
    <text x="30" y="315">(humans, elephants)</text>
    <text x="30" y="333"><tspan font-weight="700">Type II:</tspan> the same fraction dies at every age</text>
    <text x="30" y="348">(many songbirds, lizards)</text>
    <text x="30" y="366"><tspan font-weight="700">Type III:</tspan> most die young</text>
    <text x="186" y="366">(oysters, most fish, many plants)</text>
  </g>
</g>
</svg>
