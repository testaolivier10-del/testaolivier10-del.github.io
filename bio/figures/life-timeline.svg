<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="ltl-t ltl-d"><title id="ltl-t">A timeline of early life on Earth</title><desc id="ltl-d">A to-scale timeline from 4.6 billion years ago to now. Earth forms 4.6 billion years ago. About 4.4 billion years ago, the oldest crystals hint at liquid water. About 3.5 billion years ago come the oldest widely accepted fossils, stromatolites; from then to now the bar is shaded green, about three quarters of Earth’s history. About 2.4 billion years ago oxygen builds up in the air, from cyanobacteria. About 1.8 billion years ago come the first eukaryote fossils, and about 0.54 billion years ago many animal groups appear in the fossil record.</desc><rect width="760" height="250" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><text x="16" y="26" font-size="15" font-weight="700">Earth’s history, in billions of years ago (to scale)</text><rect x="40" y="112" width="680" height="16" rx="4" fill="#EEF2F1" stroke="#5D6B69"/><rect x="202.60869565217388" y="112" width="517.3913043478261" height="16" rx="4" fill="#C4E8DC" stroke="#009E73"/><line x1="40" y1="128" x2="40" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="40" y="152" font-size="12" text-anchor="middle">4.6</text><line x1="128.695652173913" y1="128" x2="128.695652173913" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="128.695652173913" y="152" font-size="12" text-anchor="middle">4</text><line x1="276.52173913043475" y1="128" x2="276.52173913043475" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="276.52173913043475" y="152" font-size="12" text-anchor="middle">3</text><line x1="424.3478260869565" y1="128" x2="424.3478260869565" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="424.3478260869565" y="152" font-size="12" text-anchor="middle">2</text><line x1="572.1739130434783" y1="128" x2="572.1739130434783" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="572.1739130434783" y="152" font-size="12" text-anchor="middle">1</text><line x1="720" y1="128" x2="720" y2="136" stroke="#1F2A28" stroke-width="1.5"/><text x="720" y="152" font-size="12" text-anchor="middle">now</text><line x1="40" y1="108" x2="40" y2="72" stroke="#D55E00" stroke-width="2"/><circle cx="40" cy="112" r="4" fill="#D55E00"/><text x="36" y="48" font-size="12.5" text-anchor="start" font-weight="700">Earth forms</text><line x1="69.56521739130424" y1="132" x2="69.56521739130424" y2="172" stroke="#D55E00" stroke-width="2"/><circle cx="69.56521739130424" cy="128" r="4" fill="#D55E00"/><text x="65.56521739130424" y="188" font-size="12.5" text-anchor="start" font-weight="700">oldest crystals hint</text><text x="65.56521739130424" y="204" font-size="12" text-anchor="start">at liquid water</text><line x1="202.60869565217388" y1="108" x2="202.60869565217388" y2="72" stroke="#D55E00" stroke-width="2"/><circle cx="202.60869565217388" cy="112" r="4" fill="#D55E00"/><text x="202.60869565217388" y="48" font-size="12.5" text-anchor="middle" font-weight="700">oldest widely accepted</text><text x="202.60869565217388" y="64" font-size="12" text-anchor="middle">fossils: stromatolites</text><line x1="365.2173913043478" y1="132" x2="365.2173913043478" y2="172" stroke="#D55E00" stroke-width="2"/><circle cx="365.2173913043478" cy="128" r="4" fill="#D55E00"/><text x="365.2173913043478" y="188" font-size="12.5" text-anchor="middle" font-weight="700">oxygen builds up in air</text><text x="365.2173913043478" y="204" font-size="12" text-anchor="middle">(from cyanobacteria)</text><line x1="453.9130434782609" y1="108" x2="453.9130434782609" y2="72" stroke="#D55E00" stroke-width="2"/><circle cx="453.9130434782609" cy="112" r="4" fill="#D55E00"/><text x="453.9130434782609" y="48" font-size="12.5" text-anchor="middle" font-weight="700">first eukaryote fossils</text><line x1="640.1739130434783" y1="132" x2="640.1739130434783" y2="172" stroke="#D55E00" stroke-width="2"/><circle cx="640.1739130434783" cy="128" r="4" fill="#D55E00"/><text x="644.1739130434783" y="188" font-size="12.5" text-anchor="end" font-weight="700">many animal groups</text><text x="644.1739130434783" y="204" font-size="12" text-anchor="end">appear in fossils</text><text x="206.60869565217388" y="236" font-size="12.5">green: time with fossil evidence of life (about three quarters of Earth’s history)</text></g></svg>
