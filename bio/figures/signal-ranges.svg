<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Four ranges of cell communication</title>
<desc id="d">Four panels. Direct contact: two touching cells joined by gap junction channels that small molecules pass through. Local signaling: one cell releases a local regulator that reaches only nearby cells with receptors. Synaptic signaling: a neuron releases neurotransmitter across a narrow synaptic cleft onto one target cell. Endocrine signaling: a gland cell releases a hormone into a blood vessel, which carries it to a distant target cell with receptors; a cell without the receptor does not respond.</desc>
<defs>
  <marker id="sr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker>
</defs>
<rect width="760" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <g stroke="#5D6B69" stroke-width="1" stroke-dasharray="4 4"><line x1="190" y1="12" x2="190" y2="348"/><line x1="380" y1="12" x2="380" y2="348"/><line x1="570" y1="12" x2="570" y2="348"/></g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="95" y="30">Direct contact</text><text x="285" y="30">Local</text><text x="475" y="30">Synaptic</text><text x="665" y="30">Endocrine</text>
  </g>
  <!-- A: gap junctions -->
  <rect x="15" y="70" width="80" height="150" rx="28" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <rect x="95" y="70" width="80" height="150" rx="28" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <g fill="#F8E3B8" stroke="#E69F00" stroke-width="2">
    <rect x="86" y="100" width="18" height="14" rx="3"/><rect x="86" y="138" width="18" height="14" rx="3"/><rect x="86" y="176" width="18" height="14" rx="3"/>
  </g>
  <g fill="#E69F00"><circle cx="70" cy="145" r="4"/><circle cx="118" cy="107" r="4"/><circle cx="125" cy="183" r="4"/><circle cx="60" cy="110" r="4"/></g>
  <text x="95" y="246" font-size="14" text-anchor="middle" font-weight="700">gap junctions</text>
  <g font-size="13" text-anchor="middle"><text x="95" y="266">ions and small</text><text x="95" y="282">molecules pass</text><text x="95" y="298">straight across</text></g>
  <g font-size="12" text-anchor="middle" fill="#3D4A66"><text x="95" y="324">also: surface molecules</text><text x="95" y="339">touching (immune cells)</text></g>
  <!-- B: local -->
  <circle cx="240" cy="150" r="38" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <text x="240" y="148" font-size="12" text-anchor="middle">signaling</text><text x="240" y="163" font-size="12" text-anchor="middle">cell</text>
  <circle cx="335" cy="100" r="28" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <circle cx="335" cy="205" r="28" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <g fill="#CC79A7"><rect x="299" y="95" width="10" height="10" rx="2"/><rect x="299" y="192" width="10" height="10" rx="2"/></g>
  <g fill="#CC79A7"><circle cx="285" cy="130" r="4"/><circle cx="292" cy="160" r="4"/><circle cx="280" cy="185" r="4"/><circle cx="300" cy="113" r="4"/><circle cx="296" cy="197" r="4"/><circle cx="270" cy="105" r="4"/><circle cx="262" cy="200" r="4"/></g>
  <text x="285" y="262" font-size="14" text-anchor="middle" font-weight="700">local regulator</text>
  <g font-size="13" text-anchor="middle"><text x="285" y="282">spreads to cells</text><text x="285" y="298">close by</text></g>
  <g font-size="12" text-anchor="middle" fill="#3D4A66"><text x="285" y="324">e.g. growth factors</text><text x="285" y="339">near a wound</text></g>
  <!-- C: synaptic -->
  <path d="M470,46 L470,96" stroke="#0072B2" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="470" cy="125" rx="46" ry="32" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <g fill="#F1DAE7" stroke="#CC79A7" stroke-width="2"><circle cx="452" cy="120" r="8"/><circle cx="476" cy="114" r="8"/><circle cx="492" cy="131" r="7"/></g>
  <text x="405" y="80" font-size="13">neuron</text>
  <rect x="410" y="178" width="120" height="60" rx="12" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <g fill="none" stroke="#CC79A7" stroke-width="3"><path d="M448,178 a5,5 0 0 1 10,0"/><path d="M470,178 a5,5 0 0 1 10,0"/><path d="M492,178 a5,5 0 0 1 10,0"/></g>
  <g fill="#CC79A7"><circle cx="455" cy="166" r="3.5"/><circle cx="470" cy="164" r="3.5"/><circle cx="488" cy="167" r="3.5"/><circle cx="500" cy="163" r="3.5"/></g>
  <text x="470" y="214" font-size="12" text-anchor="middle">target cell</text>
  <text x="475" y="262" font-size="14" text-anchor="middle" font-weight="700">neurotransmitter</text>
  <g font-size="13" text-anchor="middle"><text x="475" y="282">crosses a tiny gap,</text><text x="475" y="298">the synaptic cleft</text></g>
  <g font-size="12" text-anchor="middle" fill="#3D4A66"><text x="475" y="324">one target cell,</text><text x="475" y="339">within a millisecond</text></g>
  <!-- D: endocrine -->
  <circle cx="615" cy="88" r="30" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <text x="615" y="92" font-size="12" text-anchor="middle">gland</text>
  <rect x="580" y="140" width="170" height="34" rx="17" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/>
  <text x="665" y="196" font-size="12" text-anchor="middle" fill="#3D4A66">blood vessel</text>
  <g fill="#CC79A7"><circle cx="615" cy="128" r="4"/><circle cx="640" cy="157" r="4"/><circle cx="680" cy="153" r="4"/><circle cx="715" cy="160" r="4"/></g>
  <path d="M705,178 L713,212" stroke="#1F2A28" stroke-width="2" marker-end="url(#sr-a)"/>
  <circle cx="720" cy="234" r="22" fill="#C3DDF0" stroke="#0072B2" stroke-width="3"/>
  <path d="M713,212 a5,5 0 0 1 10,0" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="612" cy="234" r="22" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <g font-size="11" text-anchor="middle"><text x="720" y="270">target cell</text><text x="612" y="270">no receptor</text></g>
  <text x="665" y="294" font-size="14" text-anchor="middle" font-weight="700">hormone</text>
  <g font-size="13" text-anchor="middle"><text x="665" y="312">blood carries it</text><text x="665" y="328">through the body</text></g>
  <text x="665" y="345" font-size="12" text-anchor="middle" fill="#3D4A66">e.g. insulin</text>
</g>
</svg>
