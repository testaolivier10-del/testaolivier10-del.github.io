<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" role="img" aria-labelledby="t d">
<title id="t">Compartments in a eukaryotic cell and regions in a prokaryote</title>
<desc id="d">Left: an animal cell divided by internal membranes. The nucleus holds the DNA behind a double membrane. A lysosome is a small sac whose inside is acidic, about pH 5, while the surrounding cytosol is about pH 7.2. A mitochondrion has a smooth outer membrane and a deeply folded inner membrane; the folds give far more membrane area than a smooth surface would. The endoplasmic reticulum and Golgi are stacks of membrane sacs. Right, drawn larger than its true size: a prokaryotic cell with no membrane-bound organelles; its DNA sits in an unenclosed region called the nucleoid, and ribosomes are scattered through the cytoplasm.</desc>
<rect width="780" height="460" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="270" y="28" font-size="17" font-weight="bold" text-anchor="middle">Eukaryotic cell: membrane-bound compartments</text>
  <ellipse cx="270" cy="240" rx="250" ry="185" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="4"/>
  <text x="100" y="336" font-size="14">cytosol, pH ≈ 7.2</text>
  <!-- nucleus -->
  <circle cx="230" cy="220" r="66" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="3"/>
  <circle cx="230" cy="220" r="60" fill="none" stroke="#5B6B8C" stroke-width="2"/>
  <path d="M200 200 q15 -20 30 0 t30 0 M196 236 q15 -18 30 0 t30 0" fill="none" stroke="#5B6B8C" stroke-width="2"/>
  <text x="230" y="276" font-size="15" text-anchor="middle" font-weight="bold">nucleus</text>
  <text x="230" y="300" font-size="13" text-anchor="middle">(DNA inside)</text>
  <!-- ER -->
  <g fill="none" stroke="#6B5E3C" stroke-width="3">
    <path d="M110 160 q20 -24 40 0 q20 24 40 0"/><path d="M104 182 q20 -24 40 0 q20 24 40 0"/><path d="M100 204 q12 -14 24 0"/>
  </g>
  <text x="96" y="140" font-size="14">ER</text>
  <!-- golgi -->
  <g fill="none" stroke="#E69F00" stroke-width="4" stroke-linecap="round">
    <path d="M330 110 q30 -14 60 0"/><path d="M326 124 q34 -14 68 0"/><path d="M330 138 q30 -14 60 0"/>
  </g>
  <text x="404" y="112" font-size="14">Golgi</text>
  <!-- lysosome -->
  <circle cx="380" cy="200" r="30" fill="#EFD5CF" stroke="#8E3B2E" stroke-width="3"/>
  <text x="380" y="198" font-size="13" text-anchor="middle" font-weight="bold">pH ≈ 5</text>
  <text x="380" y="214" font-size="11" text-anchor="middle">acidic</text>
  <text x="416" y="196" font-size="14">lysosome</text>
  <!-- mitochondrion -->
  <ellipse cx="350" cy="296" rx="78" ry="38" fill="#F6D2BD" stroke="#D55E00" stroke-width="3"/>
  <path d="M284 296 l10 -22 l10 40 l12 -42 l12 44 l12 -44 l12 44 l12 -44 l12 44 l12 -42 l10 38 l10 -18" fill="none" stroke="#D55E00" stroke-width="2.5"/>
  <text x="350" y="356" font-size="14" text-anchor="middle">mitochondrion</text>
  <text x="350" y="372" font-size="12" text-anchor="middle">folded inner membrane</text>

  <!-- prokaryote -->
  <text x="650" y="120" font-size="17" font-weight="bold" text-anchor="middle">Prokaryotic cell</text>
  <text x="650" y="140" font-size="13" text-anchor="middle">(drawn much larger than scale)</text>
  <rect x="560" y="170" width="180" height="120" rx="60" fill="#C4E8DC" stroke="#009E73" stroke-width="6"/>
  <rect x="568" y="178" width="164" height="104" rx="52" fill="#EEF2F1" stroke="#6B5E3C" stroke-width="2.5"/>
  <path d="M620 220 q14 -22 28 0 t28 0 q-6 22 -28 14 t-30 6 q-10 -10 2 -20" fill="none" stroke="#5B6B8C" stroke-width="2.5"/>
  <g fill="#1F2A28"><circle cx="596" cy="206" r="3"/><circle cx="604" cy="256" r="3"/><circle cx="700" cy="204" r="3"/><circle cx="710" cy="252" r="3"/><circle cx="660" cy="266" r="3"/><circle cx="640" cy="196" r="3"/></g>
  <line x1="650" y1="230" x2="650" y2="318" stroke="#5B6B8C" stroke-width="1.5"/>
  <text x="650" y="334" font-size="14" text-anchor="middle">nucleoid: DNA region,</text>
  <text x="650" y="352" font-size="14" text-anchor="middle">no membrane around it</text>
  <text x="650" y="380" font-size="13" text-anchor="middle">dots: ribosomes</text>
  <text x="650" y="410" font-size="13" text-anchor="middle">no membrane-bound organelles</text>
</g>
</svg>
