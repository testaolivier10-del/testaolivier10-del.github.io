<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Channel, carrier and pump in a membrane</title>
<desc id="d">A plasma membrane runs across the middle, with the outside of the cell above and the cytoplasm below. Left: a channel protein forms an open tube, and ions pass through it from the side where they are crowded to the side where they are scarce. Middle: a carrier protein binds a glucose molecule on the crowded side, changes shape, and releases it on the scarce side. Right: a pump uses ATP to move ions from the side where they are scarce to the side where they are crowded. The first two are passive; the pump is active.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
</defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="16" y="34" font-size="17" font-weight="bold">Outside the cell</text>
  <text x="16" y="292" font-size="17" font-weight="bold">Cytoplasm</text>
  <!-- membrane: two leaflets of heads -->
  <rect x="0" y="178" width="760" height="64" fill="#F3EEE0"/>
  <g fill="#6B5E3C">
    <rect x="0" y="174" width="760" height="10" rx="5"/>
    <rect x="0" y="236" width="760" height="10" rx="5"/>
  </g>
  <text x="742" y="214" font-size="14" text-anchor="end" fill="#6B5E3C">membrane</text>

  <!-- CHANNEL -->
  <g>
    <rect x="70" y="160" width="34" height="100" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
    <rect x="136" y="160" width="34" height="100" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
    <!-- crowded ions above -->
    <g fill="#EFD5CF" stroke="#8E3B2E" stroke-width="2">
      <circle cx="80" cy="70" r="9"/><circle cx="112" cy="60" r="9"/><circle cx="148" cy="74" r="9"/><circle cx="96" cy="100" r="9"/><circle cx="134" cy="108" r="9"/><circle cx="168" cy="96" r="9"/><circle cx="120" cy="134" r="9"/><circle cx="64" cy="118" r="9"/>
      <circle cx="120" cy="200" r="9"/>
      <circle cx="104" cy="320" r="9"/><circle cx="150" cy="336" r="9"/>
    </g>
    <line x1="120" y1="140" x2="120" y2="300" stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)"/>
    <text x="120" y="378" font-size="18" font-weight="bold" text-anchor="middle">Channel</text>
    <text x="120" y="396" font-size="14" text-anchor="middle">open tube, passive</text>
  </g>

  <!-- CARRIER -->
  <g>
    <!-- open-to-outside shape -->
    <path d="M300 160 L300 260 L380 260 L380 160 L355 160 L340 200 L325 160 Z" fill="#D2EAF8" stroke="#0072B2" stroke-width="3"/>
    <polygon points="340,184 350,196 340,208 330,196" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
    <g fill="#F8E3B8" stroke="#E69F00" stroke-width="2">
      <polygon points="300,70 311,82 300,94 289,82"/><polygon points="350,60 361,72 350,84 339,72"/><polygon points="392,88 403,100 392,112 381,100"/><polygon points="330,120 341,132 330,144 319,132"/>
      <polygon points="372,330 383,342 372,354 361,342"/>
    </g>
    <text x="440" y="190" font-size="14">binds,</text>
    <text x="440" y="208" font-size="14">changes</text>
    <text x="440" y="226" font-size="14">shape</text>
    <line x1="340" y1="262" x2="340" y2="312" stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)"/>
    <text x="340" y="378" font-size="18" font-weight="bold" text-anchor="middle">Carrier</text>
    <text x="340" y="396" font-size="14" text-anchor="middle">binds and flips, passive</text>
  </g>

  <!-- PUMP -->
  <g>
    <rect x="560" y="156" width="96" height="108" rx="16" fill="#EEF2F1" stroke="#5D6B69" stroke-width="3"/>
    <rect x="596" y="166" width="24" height="88" rx="6" fill="#ffffff" stroke="#5D6B69" stroke-width="2"/>
    <!-- scarce below, crowded above -->
    <g fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2">
      <circle cx="584" cy="324" r="9"/>
      <circle cx="608" cy="204" r="9"/>
    </g>
    <g fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2">
      <circle cx="560" cy="66" r="9"/><circle cx="592" cy="52" r="9"/><circle cx="628" cy="68" r="9"/><circle cx="660" cy="56" r="9"/><circle cx="576" cy="100" r="9"/><circle cx="644" cy="98" r="9"/><circle cx="610" cy="120" r="9"/><circle cx="676" cy="118" r="9"/>
    </g>
    <line x1="608" y1="300" x2="608" y2="146" stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)"/>
    <ellipse cx="690" cy="300" rx="34" ry="18" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2.5"/>
    <text x="690" y="306" font-size="15" font-weight="bold" text-anchor="middle">ATP</text>
    <line x1="664" y1="290" x2="652" y2="270" stroke="#CC79A7" stroke-width="3" marker-end="url(#ah)"/>
    <text x="608" y="378" font-size="18" font-weight="bold" text-anchor="middle">Pump</text>
    <text x="608" y="396" font-size="14" text-anchor="middle">uses ATP, active</text>
  </g>
  <text x="196" y="96" font-size="13" fill="#8E3B2E">crowded</text>
  <text x="196" y="340" font-size="13" fill="#5B6B8C">scarce</text>
  <text x="510" y="340" font-size="13" fill="#5B6B8C">scarce</text>
  <text x="694" y="80" font-size="13" fill="#5B6B8C">crowded</text>
</g>
</svg>
