<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img" aria-labelledby="clt-t clt-d"><title id="clt-t">A cladogram built from shared derived characters</title><desc id="clt-d">A cladogram of six animals. The lancelet branches off first, then the lamprey, then the trout, then the newt, and the crocodile and rabbit are sister taxa. Marks on the branches show where each shared derived character appeared: skull on the branch leading to every animal except the lancelet; hinged jaws on the branch to trout, newt, crocodile and rabbit; four limbs on the branch to newt, crocodile and rabbit; amniotic egg on the branch to crocodile and rabbit; hair on the branch to the rabbit alone. Each character appears once, so every group it marks is a clade.</desc><rect width="760" height="345" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="418" y1="240" x2="418" y2="290"/><line x1="418" y1="240" x2="510" y2="240"/><line x1="418" y1="290" x2="510" y2="290"/><line x1="326" y1="190" x2="326" y2="265"/><line x1="326" y1="190" x2="510" y2="190"/><line x1="326" y1="265" x2="418" y2="265"/><line x1="234" y1="140" x2="234" y2="227.5"/><line x1="234" y1="140" x2="510" y2="140"/><line x1="234" y1="227.5" x2="326" y2="227.5"/><line x1="142" y1="90" x2="142" y2="183.75"/><line x1="142" y1="90" x2="510" y2="90"/><line x1="142" y1="183.75" x2="234" y2="183.75"/><line x1="50" y1="40" x2="50" y2="136.875"/><line x1="50" y1="40" x2="510" y2="40"/><line x1="50" y1="136.875" x2="142" y2="136.875"/><line x1="30" y1="88.4375" x2="50" y2="88.4375"/></g><rect x="92" y="127.875" width="8" height="18" fill="#D55E00"/><rect x="184" y="174.75" width="8" height="18" fill="#D55E00"/><rect x="276" y="218.5" width="8" height="18" fill="#D55E00"/><rect x="368" y="256" width="8" height="18" fill="#D55E00"/><rect x="460" y="281" width="8" height="18" fill="#D55E00"/><text x="518" y="45" font-size="17">lancelet</text><text x="518" y="95" font-size="17">lamprey</text><text x="518" y="145" font-size="17">trout</text><text x="518" y="195" font-size="17">newt</text><text x="518" y="245" font-size="17">crocodile</text><text x="518" y="295" font-size="17">rabbit</text><text x="96" y="122.875" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">skull</text><text x="188" y="169.75" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">hinged jaws</text><text x="280" y="213.5" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">four limbs</text><text x="372" y="251" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">amniotic egg</text><text x="464" y="276" font-size="12" text-anchor="middle" fill="#D55E00" font-weight="700">hair</text><text x="30" y="330" font-size="13">Orange marks: a shared derived character appears here and is inherited by everything to its right.</text></g></svg>
