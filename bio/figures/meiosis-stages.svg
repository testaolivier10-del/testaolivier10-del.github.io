<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="mei-t mei-d">
<title id="mei-t">Meiosis: one diploid cell becomes four haploid cells</title>
<desc id="mei-d">Six numbered panels following a cell with four chromosomes (2n = 4): one long and one short chromosome from each parent, drawn blue for one parent and orange for the other. Panel 1: before meiosis the DNA has been copied, so each of the four chromosomes is two sister chromatids joined at a centromere. Panel 2, meiosis I: homologous chromosomes pair up (long with long, short with short) and the pairs line up across the middle of the cell, one partner facing each pole. Panel 3, end of meiosis I: the partners of each pair have gone to opposite poles and the cell has split into two cells, each with two chromosomes (one long, one short), still made of two sister chromatids; n = 2. Panel 4, meiosis II: in each cell the chromosomes line up singly across the middle. Panel 5: the sister chromatids separate and move to opposite poles. Panel 6: four haploid cells, each with one long and one short chromosome. No DNA is copied between meiosis I and meiosis II.</desc>
<defs><marker id="mei-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
