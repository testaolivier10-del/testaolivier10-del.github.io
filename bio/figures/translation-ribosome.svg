<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="tlr-t tlr-d">
<title id="tlr-t">A ribosome reading mRNA codons</title>
<desc id="tlr-d">A ribosome during elongation. An mRNA runs left to right from its 5-prime end to its 3-prime end through the ribosome, between the small subunit below and the large subunit above. The codons shown are AUG, GCU, UGG, AAA, CAC and UAG. Three sites in the ribosome hold tRNAs: the E site over AUG holds an empty tRNA that is leaving; the P site over GCU holds the tRNA for alanine, carrying the growing chain Met-Ala; the A site over UGG has just received a tRNA whose anticodon, 3-prime ACC 5-prime, pairs with UGG and which carries tryptophan. Next, the chain will be joined to tryptophan by a peptide bond, and the ribosome will move one codon toward the 3-prime end. Inset: an aminoacyl-tRNA synthetase attaches tryptophan to its tRNA, using energy from ATP. The stop codon UAG near the 3-prime end has no tRNA; a release factor will bind there and free the chain.</desc>
<defs><marker id="tlr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="430" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="150.0" y="90.0" width="330.0" height="150.0" rx="40" fill="#DCE6E4" stroke="#5D6B69" stroke-width="2"/>
<rect x="150.0" y="262.0" width="330.0" height="70.0" rx="28" fill="#DCE6E4" stroke="#5D6B69" stroke-width="2"/>
<text x="488.0" y="170.0" font-size="12" text-anchor="start" font-weight="700" fill="#5D6B69">large subunit</text>
<text x="488.0" y="300.0" font-size="12" text-anchor="start" font-weight="700" fill="#5D6B69">small subunit</text>
<line x1="80.0" y1="250.0" x2="720.0" y2="250.0" stroke="#D55E00" stroke-width="3"/>
<text x="70.0" y="255.0" font-size="13" text-anchor="end" font-weight="700">5′</text>
<text x="728.0" y="255.0" font-size="13" text-anchor="start" font-weight="700">3′</text>
<rect x="180.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="222.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">AUG</text>
<rect x="270.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="312.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">GCU</text>
<rect x="360.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="402.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">UGG</text>
<rect x="450.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="492.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">AAA</text>
<rect x="540.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="582.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">CAC</text>
<rect x="630.0" y="248.0" width="84.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/>
<text x="672.0" y="263.0" font-size="13" text-anchor="middle" font-weight="700">UAG</text>
<text x="672.0" y="286.0" font-size="11" text-anchor="middle" fill="#D55E00">stop codon</text>
<text x="90.0" y="272.0" font-size="12" text-anchor="start" font-weight="700" fill="#D55E00">mRNA</text>
<rect x="184.0" y="140.0" width="76.0" height="104.0" rx="6" fill="none" stroke="#5D6B69" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="222.0" y="134.0" font-size="12" text-anchor="middle" font-weight="700">E site</text>
<rect x="274.0" y="140.0" width="76.0" height="104.0" rx="6" fill="none" stroke="#5D6B69" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="312.0" y="134.0" font-size="12" text-anchor="middle" font-weight="700">P site</text>
<rect x="364.0" y="140.0" width="76.0" height="104.0" rx="6" fill="none" stroke="#5D6B69" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="402.0" y="134.0" font-size="12" text-anchor="middle" font-weight="700">A site</text>
<rect x="202.0" y="158.0" width="40.0" height="50.0" rx="8" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
<rect x="192.0" y="206.0" width="60.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#5D6B69" stroke-width="1.6"/>
<text x="222.0" y="221.0" font-size="12" text-anchor="middle" font-weight="700">UAC</text>
<line x1="210.0" y1="160.0" x2="160.0" y2="84.0" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#tlr-a)"/>
<text x="156.0" y="74.0" font-size="11" text-anchor="middle">empty tRNA leaves</text>
<rect x="292.0" y="168.0" width="40.0" height="50.0" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/>
<rect x="282.0" y="216.0" width="60.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#009E73" stroke-width="1.6"/>
<text x="312.0" y="231.0" font-size="12" text-anchor="middle" font-weight="700">CGA</text>
<circle cx="312.0" cy="156.0" r="13.0" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/>
<text x="312.0" y="160.0" font-size="10" text-anchor="middle" font-weight="700">Ala</text>
<rect x="382.0" y="168.0" width="40.0" height="50.0" rx="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<rect x="372.0" y="216.0" width="60.0" height="20.0" rx="3" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.6"/>
<text x="402.0" y="231.0" font-size="12" text-anchor="middle" font-weight="700">ACC</text>
<circle cx="402.0" cy="156.0" r="13.0" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="402.0" y="160.0" font-size="10" text-anchor="middle" font-weight="700">Trp</text>
<circle cx="312.0" cy="98.0" r="13.0" fill="#E4D9F0" stroke="#6A3D9A" stroke-width="2"/>
<text x="312.0" y="102.0" font-size="10" text-anchor="middle" font-weight="700">Met</text>
<line x1="312.0" y1="111.0" x2="312.0" y2="143.0" stroke="#1F2A28" stroke-width="2"/>
<text x="312.0" y="52.0" font-size="11" text-anchor="middle">growing polypeptide</text>
<text x="312.0" y="65.0" font-size="11" text-anchor="middle">(Met-Ala)</text>
<text x="420.0" y="62.0" font-size="11" text-anchor="middle">new tRNA pairs:</text>
<text x="420.0" y="76.0" font-size="11" text-anchor="middle">anticodon 3′-ACC-5′ with UGG</text>
<text x="402.0" y="134.0" font-size="11" text-anchor="start"></text>
<line x1="400.0" y1="372.0" x2="500.0" y2="372.0" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#tlr-a)"/>
<text x="390.0" y="377.0" font-size="12" text-anchor="end">ribosome moves one codon at a time, 5′ → 3′</text>
<rect x="560.0" y="40.0" width="190.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#5D6B69" stroke-width="1.5"/>
<text x="655.0" y="60.0" font-size="12" text-anchor="middle" font-weight="700">Charging a tRNA</text>
<ellipse cx="620.0" cy="120.0" rx="40.0" ry="32.0" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
<text x="620.0" y="116.0" font-size="10" text-anchor="middle" font-weight="700">aminoacyl-tRNA</text>
<text x="620.0" y="128.0" font-size="10" text-anchor="middle" font-weight="700">synthetase</text>
<rect x="680.0" y="100.0" width="26.0" height="36.0" rx="6" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<circle cx="693.0" cy="88.0" r="10.0" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="693.0" y="92.0" font-size="9" text-anchor="middle" font-weight="700">Trp</text>
<text x="655.0" y="172.0" font-size="11" text-anchor="middle">ATP → AMP + 2 Pᵢ</text>
<text x="380.0" y="404.0" font-size="12" text-anchor="middle">A stop codon has no matching tRNA: a release factor</text>
<text x="380.0" y="419.0" font-size="12" text-anchor="middle">binds the A site and the finished chain is released.</text>
</g>
</svg>
