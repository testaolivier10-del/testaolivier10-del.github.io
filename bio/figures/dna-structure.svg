<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
<title id="t">A nucleotide and a short stretch of double-stranded DNA</title>
<desc id="d">Left: a nucleotide: a phosphate joined to the 5-prime carbon of a five-carbon sugar, with a nitrogenous base on the 1-prime carbon and an OH on the 3-prime carbon. Right: four base pairs, A-T, G-C, C-G and T-A, between two sugar-phosphate backbones. The left strand runs 5-prime at the top to 3-prime at the bottom; the right strand runs 3-prime at the top to 5-prime at the bottom. A-T pairs are joined by two dashed hydrogen bonds, G-C pairs by three.</desc>
<defs>
  <g id="sug"><polygon points="0,-18 18,-5 11,16 -11,16 -18,-5" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/></g>
  <g id="pho"><circle r="13" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2.5"/><text y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2A28">P</text></g>
</defs>
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <!-- nucleotide -->
  <text x="110" y="32" font-size="16" font-weight="700" text-anchor="middle">One nucleotide</text>
  <line x1="60" y1="118" x2="92" y2="138" stroke="#1F2A28" stroke-width="2.5"/>
  <use href="#pho" x="52" y="112"/>
  <use href="#sug" x="114" y="160"/>
  <line x1="136" y1="158" x2="168" y2="158" stroke="#1F2A28" stroke-width="2.5"/>
  <rect x="168" y="140" width="54" height="36" rx="6" fill="#C3DDF0" stroke="#0072B2" stroke-width="2.5"/>
  <text x="195" y="163" font-size="13" font-weight="700" text-anchor="middle">base</text>
  <line x1="106" y1="184" x2="96" y2="206" stroke="#1F2A28" stroke-width="2.5"/><text x="92" y="222" font-size="13" font-weight="700" fill="#D55E00">OH</text>
  <g font-size="12" fill="#3D4A66"><text x="80" y="142">5′</text><text x="140" y="148">1′</text><text x="114" y="196">3′</text></g>
  <g font-size="13"><text x="20" y="260">phosphate</text><text x="20" y="278">+ five-carbon sugar</text><text x="20" y="296">+ nitrogenous base</text></g>
  <text x="20" y="330" font-size="12" fill="#3D4A66">DNA: deoxyribose; A, T, G, C</text>
  <text x="20" y="348" font-size="12" fill="#3D4A66">RNA: ribose; A, U, G, C</text>
  <line x1="250" y1="30" x2="250" y2="380" stroke="#C9D2D0" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- double strand -->
  <text x="445" y="32" font-size="16" font-weight="700" text-anchor="middle">Two antiparallel strands</text>
  <g stroke="#1F2A28" stroke-width="2.5"><line x1="300" y1="62" x2="300" y2="362"/><line x1="590" y1="62" x2="590" y2="368"/></g>
  <text x="300" y="56" font-size="15" font-weight="700" text-anchor="middle">5′</text><text x="300" y="396" font-size="15" font-weight="700" text-anchor="middle">3′</text>
  <text x="590" y="56" font-size="15" font-weight="700" text-anchor="middle">3′</text><text x="590" y="396" font-size="15" font-weight="700" text-anchor="middle">5′</text>
  <use href="#pho" x="300" y="72"/><use href="#pho" x="300" y="150"/><use href="#pho" x="300" y="230"/><use href="#pho" x="300" y="305"/>
  <use href="#pho" x="590" y="150"/><use href="#pho" x="590" y="230"/><use href="#pho" x="590" y="305"/><use href="#pho" x="590" y="368"/>
  <use href="#sug" x="300" y="110"/><use href="#sug" x="300" y="190"/><use href="#sug" x="300" y="270"/><use href="#sug" x="300" y="340"/>
  <use href="#sug" x="590" y="110"/><use href="#sug" x="590" y="190"/><use href="#sug" x="590" y="270"/><use href="#sug" x="590" y="340"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2A28">
  <!-- pairs: y 110, 190, 270, 340 -->
  <rect x="320" y="96" width="96" height="28" rx="5" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="368" y="115">A</text>
  <rect x="474" y="96" width="96" height="28" rx="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="522" y="115">T</text>
  <rect x="320" y="176" width="96" height="28" rx="5" fill="#C3DDF0" stroke="#0072B2" stroke-width="2"/><text x="368" y="195">G</text>
  <rect x="474" y="176" width="96" height="28" rx="5" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/><text x="522" y="195">C</text>
  <rect x="320" y="256" width="96" height="28" rx="5" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/><text x="368" y="275">C</text>
  <rect x="474" y="256" width="96" height="28" rx="5" fill="#C3DDF0" stroke="#0072B2" stroke-width="2"/><text x="522" y="275">G</text>
  <rect x="320" y="326" width="96" height="28" rx="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="368" y="345">T</text>
  <rect x="474" y="326" width="96" height="28" rx="5" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="522" y="345">A</text>
</g>
<g stroke="#0072B2" stroke-width="2.5" stroke-dasharray="4 3">
  <line x1="418" y1="105" x2="472" y2="105"/><line x1="418" y1="115" x2="472" y2="115"/>
  <line x1="418" y1="182" x2="472" y2="182"/><line x1="418" y1="190" x2="472" y2="190"/><line x1="418" y1="198" x2="472" y2="198"/>
  <line x1="418" y1="262" x2="472" y2="262"/><line x1="418" y1="270" x2="472" y2="270"/><line x1="418" y1="278" x2="472" y2="278"/>
  <line x1="418" y1="335" x2="472" y2="335"/><line x1="418" y1="345" x2="472" y2="345"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0072B2" text-anchor="middle"><text x="445" y="92">2 H bonds</text><text x="445" y="172">3 H bonds</text></g>
</svg>
