<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Reception, transduction and response, at a surface receptor and at an intracellular receptor</title>
<desc id="d">Left: a polar ligand cannot cross the membrane, so it binds a receptor protein in the membrane (reception). The receptor activates a relay protein, which activates kinase 1, which adds a phosphate to kinase 2 (transduction); kinase 2 switches on an enzyme (response). Right: a nonpolar steroid ligand crosses the membrane, binds a receptor protein in the cytoplasm, and the ligand-receptor complex enters the nucleus, binds DNA and switches a gene on.</desc>
<defs>
  <marker id="rt-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker>
</defs>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="740" y="28" font-size="13" text-anchor="end" fill="#3D4A66">outside the cell</text>
  <text x="740" y="122" font-size="13" text-anchor="end" fill="#3D4A66">cytoplasm</text>
  <rect x="0" y="82" width="760" height="16" fill="#F8E3B8"/>
  <g stroke="#E69F00" stroke-width="2"><line x1="0" y1="82" x2="760" y2="82"/><line x1="0" y1="98" x2="760" y2="98"/></g>
  <text x="235" y="94" font-size="11" fill="#6B5E3C">plasma membrane</text>
  <!-- stage labels -->
  <g font-size="15" font-weight="700" fill="#3D4A66">
    <text x="12" y="60">1 Reception</text>
    <text x="12" y="235">2 Transduction</text>
    <text x="12" y="335">3 Response</text>
  </g>
  <!-- left: surface receptor -->
  <rect x="165" y="56" width="30" height="62" rx="6" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <circle cx="180" cy="44" r="14" fill="#F1DAE7" stroke="#CC79A7" stroke-width="3"/>
  <text x="202" y="40" font-size="13">polar ligand</text>
  <text x="202" y="62" font-size="13">surface receptor</text>
  <g stroke="#1F2A28" stroke-width="2.5" marker-end="url(#rt-a)">
    <line x1="180" y1="120" x2="180" y2="148"/><line x1="180" y1="182" x2="180" y2="208"/><line x1="180" y1="242" x2="180" y2="268"/><line x1="180" y1="302" x2="180" y2="326"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="130" y="150" width="100" height="30" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="180" y="170">relay protein</text>
    <rect x="130" y="210" width="100" height="30" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="172" y="230">kinase 1</text>
    <rect x="130" y="270" width="100" height="30" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><text x="172" y="290">kinase 2</text>
    <rect x="115" y="328" width="130" height="34" rx="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="180" y="350">enzyme switched on</text>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="216" cy="225" r="9" fill="#D55E00"/><text x="216" y="229">P</text>
    <circle cx="216" cy="285" r="9" fill="#D55E00"/><text x="216" y="289">P</text>
  </g>
  <g font-size="12" fill="#3D4A66">
    <text x="245" y="222">a kinase adds a</text><text x="245" y="237">phosphate (P),</text><text x="245" y="252">switching the next</text><text x="245" y="267">protein on</text>
  </g>
  <text x="180" y="392" font-size="13" text-anchor="middle" fill="#3D4A66">response in the cytoplasm,</text>
  <text x="180" y="408" font-size="13" text-anchor="middle" fill="#3D4A66">within seconds</text>
  <!-- right: intracellular receptor -->
  <polygon points="457,40 463.5,29 476.5,29 483,40 476.5,51 463.5,51" fill="#F8E3B8" stroke="#E69F00" stroke-width="3"/>
  <text x="492" y="38" font-size="13">nonpolar ligand</text>
  <text x="492" y="54" font-size="13">(a steroid)</text>
  <line x1="470" y1="54" x2="470" y2="140" stroke="#1F2A28" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rt-a)"/>
  <text x="482" y="118" font-size="12" fill="#3D4A66">crosses the</text>
  <text x="482" y="132" font-size="12" fill="#3D4A66">membrane</text>
  <rect x="440" y="146" width="70" height="34" rx="8" fill="#C3DDF0" stroke="#0072B2" stroke-width="2.5"/>
  <polygon points="498,152 503,144 513,144 518,152 513,160 503,160" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <text x="475" y="168" font-size="12" text-anchor="middle">receptor</text>
  <text x="528" y="168" font-size="13">intracellular receptor</text>
  <text x="528" y="184" font-size="12" fill="#3D4A66">binds it in the cytoplasm</text>
  <line x1="485" y1="184" x2="560" y2="252" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#rt-a)"/>
  <ellipse cx="600" cy="320" rx="140" ry="70" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2.5"/>
  <text x="540" y="282" font-size="13" text-anchor="middle" fill="#3D4A66">nucleus</text>
  <path d="M480,322 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#3D4A66" stroke-width="3"/>
  <text x="510" y="348" font-size="12" fill="#3D4A66">DNA</text>
  <rect x="566" y="290" width="62" height="28" rx="7" fill="#C3DDF0" stroke="#0072B2" stroke-width="2.5"/>
  <polygon points="616,293 620,286 628,286 632,293 628,300 620,300" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <text x="600" y="368" font-size="13" text-anchor="middle" font-weight="700">gene switched on</text>
  <text x="600" y="408" font-size="13" text-anchor="middle" fill="#3D4A66">response: new proteins, over hours</text>
</g>
</svg>
