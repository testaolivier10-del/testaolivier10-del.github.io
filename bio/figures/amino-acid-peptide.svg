<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
<title id="t">An amino acid and a peptide bond</title>
<desc id="d">Left: an amino acid: a central carbon bonded to an amino group (H2N), a carboxyl group (COOH), a hydrogen and an R group. Right: two amino acids joined by a peptide bond between the C of the first one's carboxyl group and the N of the second one's amino group; a water molecule is released.</desc>
<rect width="640" height="260" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28" font-size="18" font-weight="700" text-anchor="middle">
<text x="40" y="128" fill="#0072B2">H₂N</text><line x1="62" y1="122" x2="92" y2="122" stroke="#1F2A28" stroke-width="2.5"/>
<text x="104" y="128">C</text>
<line x1="116" y1="122" x2="146" y2="122" stroke="#1F2A28" stroke-width="2.5"/><text x="178" y="128" fill="#D55E00">COOH</text>
<line x1="104" y1="108" x2="104" y2="84" stroke="#1F2A28" stroke-width="2.5"/><text x="104" y="76">H</text>
<line x1="104" y1="134" x2="104" y2="160" stroke="#1F2A28" stroke-width="2.5"/>
<rect x="84" y="162" width="40" height="30" rx="8" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/><text x="104" y="183">R</text>
<g font-size="12" font-weight="400"><text x="40" y="150">amino group</text><text x="178" y="150">carboxyl group</text><text x="104" y="212">R group (side chain):</text><text x="104" y="228">differs among the 20</text></g>
<line x1="250" y1="30" x2="250" y2="240" stroke="#C9D2D0" stroke-width="2" stroke-dasharray="6 6"/>
<text x="290" y="128" fill="#0072B2">H₂N</text><line x1="312" y1="122" x2="332" y2="122" stroke="#1F2A28" stroke-width="2.5"/><text x="342" y="128">C</text>
<line x1="342" y1="134" x2="342" y2="156" stroke="#1F2A28" stroke-width="2.5"/><rect x="326" y="158" width="32" height="26" rx="7" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/><text x="342" y="177" font-size="15">R₁</text>
<line x1="352" y1="122" x2="372" y2="122" stroke="#1F2A28" stroke-width="2.5"/><text x="382" y="128">C</text>
<line x1="378" y1="110" x2="378" y2="88" stroke="#1F2A28" stroke-width="2.5"/><line x1="386" y1="110" x2="386" y2="88" stroke="#1F2A28" stroke-width="2.5"/><text x="382" y="80">O</text>
<line x1="392" y1="122" x2="420" y2="122" stroke="#CC79A7" stroke-width="5"/>
<text x="432" y="128">N</text><line x1="432" y1="134" x2="432" y2="152" stroke="#1F2A28" stroke-width="2.5"/><text x="432" y="170" font-size="15">H</text>
<line x1="444" y1="122" x2="464" y2="122" stroke="#1F2A28" stroke-width="2.5"/><text x="474" y="128">C</text>
<line x1="474" y1="134" x2="474" y2="156" stroke="#1F2A28" stroke-width="2.5"/><rect x="458" y="158" width="32" height="26" rx="7" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/><text x="474" y="177" font-size="15">R₂</text>
<line x1="486" y1="122" x2="506" y2="122" stroke="#1F2A28" stroke-width="2.5"/><text x="538" y="128" fill="#D55E00">COOH</text>
<text x="600" y="128" font-size="16">+ H₂O</text>
<g font-size="12" font-weight="400"><text x="396" y="100" fill="#7A3B63" text-anchor="start">peptide bond</text><text x="300" y="150">amino end</text><text x="545" y="150">carboxyl end</text>
<text x="445" y="222">The –OH of one carboxyl group and an –H of the next amino group</text><text x="445" y="238">leave as water (dehydration synthesis).</text></g>
</g>
</svg>
