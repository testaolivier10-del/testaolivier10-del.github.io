<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="tan-t tan-d"><title id="tan-t">Parts of a phylogenetic tree</title><desc id="tan-d">A tree with five tips, A to E, and time running from the root on the left to the present on the right. A branches off first and is labeled the outgroup. Then B, then C, and finally D and E, which are labeled sister taxa. The point where D and E join is labeled a node, the common ancestor of D and E. C, D and E are shaded together as a clade: an ancestor and all of its descendants. The leftmost point is the root, the ancestor of every taxon on the tree. Each tip is a taxon living today; the lines are branches.</desc><defs><marker id="tan-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5D6B69"/></marker></defs><rect width="760" height="390" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="358" y="137" width="382" height="162" rx="8" fill="#C4E8DC" stroke="#009E73" stroke-width="1.5"/><text x="734" y="152" font-size="12" text-anchor="end" fill="#009E73" font-weight="700">a clade: C, D and E</text><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="465" y1="218" x2="465" y2="274"/><line x1="465" y1="218" x2="560" y2="218"/><line x1="465" y1="274" x2="560" y2="274"/><line x1="370" y1="162" x2="370" y2="246"/><line x1="370" y1="162" x2="560" y2="162"/><line x1="370" y1="246" x2="465" y2="246"/><line x1="275" y1="106" x2="275" y2="204"/><line x1="275" y1="106" x2="560" y2="106"/><line x1="275" y1="204" x2="370" y2="204"/><line x1="180" y1="50" x2="180" y2="155"/><line x1="180" y1="50" x2="560" y2="50"/><line x1="180" y1="155" x2="275" y2="155"/><line x1="150" y1="102.5" x2="180" y2="102.5"/></g><text x="568" y="55" font-size="18">A</text><text x="568" y="111" font-size="18">B</text><text x="568" y="167" font-size="18">C</text><text x="568" y="223" font-size="18">D</text><text x="568" y="279" font-size="18">E</text><circle cx="465" cy="246" r="7" fill="#0072B2"/><text x="381" y="294" font-size="13" text-anchor="start" fill="#0072B2" font-weight="700">node: the common ancestor of D and E</text><text x="142" y="94.5" font-size="13" font-weight="700" text-anchor="end">root</text><text x="142" y="114.5" font-size="12" text-anchor="end">(ancestor of all</text><text x="142" y="129.5" font-size="12" text-anchor="end">taxa on the tree)</text><path d="M 600 212 q 14 0 14 14 v 28 q 0 14 -14 14" fill="none" stroke="#D55E00" stroke-width="2"/><text x="622" y="251" font-size="13" fill="#D55E00" font-weight="700">sister taxa</text><text x="590" y="55" font-size="13" font-weight="700">← outgroup</text><text x="590" y="111" font-size="13">← tip (a taxon living today)</text><text x="465" y="154" font-size="13" text-anchor="middle">branch</text><line x1="150" y1="362" x2="560" y2="362" stroke="#5D6B69" stroke-width="2" marker-end="url(#tan-a)"/><text x="160" y="382" font-size="12" fill="#5D6B69">time: from the past (left) to the present (right)</text></g></svg>
