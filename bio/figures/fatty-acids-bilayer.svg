<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
<title id="t">Fatty acids, a phospholipid and a lipid bilayer</title>
<desc id="d">Left: a saturated fatty acid, a straight zigzag chain under a COOH group, and an unsaturated fatty acid whose chain bends at a cis double bond. Middle: a phospholipid with a round polar head and two nonpolar tails, one bent. Right: a phospholipid bilayer: a top row and a bottom row of heads facing water, with their tails meeting in the middle.</desc>
