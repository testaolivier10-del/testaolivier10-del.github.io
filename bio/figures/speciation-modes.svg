<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="spm-t spm-d"><title id="spm-t">Allopatric and sympatric speciation</title><desc id="spm-d">Top row, allopatric speciation in four panels: 1, one population shares genes freely; 2, a river changes course and splits it in two; 3, with no gene flow, each side evolves separately, shown by one side changing color; 4, when the barrier is gone, the two populations live together but no longer interbreed. Bottom row, sympatric speciation by polyploidy: a diploid plant with 2n = 14 and gametes of 7 chromosomes has a meiosis failure that gives unreduced gametes with 14; self-fertilization joins two of them, 14 + 14, giving a tetraploid with 4n = 28 whose gametes carry 14. A cross between the tetraploid and a diploid gives 14 + 7 = 21 chromosomes, a triploid with three copies of each chromosome that cannot pair evenly in meiosis, so it is sterile: a reproductive barrier formed in one generation.</desc><defs><marker id="spa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="760" height="450" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><text x="16" y="28" font-size="16" font-weight="700">Allopatric speciation: a geographic barrier splits one population</text><rect x="16" y="40" width="170" height="150" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="101" y="172" font-size="12.5" text-anchor="middle" font-weight="700">1. One population</text><text x="101" y="186" font-size="12" text-anchor="middle">shares genes freely</text><circle cx="73.6" cy="74.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="130.8" cy="97.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="78.8" cy="113.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="134.2" cy="98.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="125.0" cy="104.8" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="142.2" cy="76.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="84.7" cy="110.0" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="124.9" cy="92.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="52.0" cy="95.9" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="119.7" cy="100.6" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="84.4" cy="83.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="144.8" cy="82.9" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="55.8" cy="80.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="91.7" cy="80.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="157.8" cy="99.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="130.8" cy="122.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><line x1="188" y1="110" x2="200" y2="110" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><rect x="202" y="40" width="170" height="150" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="287" y="172" font-size="12.5" text-anchor="middle" font-weight="700">2. A river changes course</text><text x="287" y="186" font-size="12" text-anchor="middle">and splits it in two</text><path d="M 282 45 C 302 80, 272 110, 294 158" stroke="#56B4E9" stroke-width="12" fill="none"/><circle cx="245.4" cy="95.6" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="237.6" cy="72.9" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="234.5" cy="83.8" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="242.8" cy="70.9" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="236.7" cy="79.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="234.4" cy="89.5" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="232.6" cy="97.3" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="248.4" cy="75.8" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="358.1" cy="92.0" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="355.9" cy="104.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="344.0" cy="96.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="337.3" cy="108.6" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="347.8" cy="77.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="341.5" cy="84.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="328.2" cy="87.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="315.0" cy="88.3" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><line x1="374" y1="110" x2="386" y2="110" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><rect x="388" y="40" width="170" height="150" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="473" y="172" font-size="12.5" text-anchor="middle" font-weight="700">3. No gene flow; each side</text><text x="473" y="186" font-size="12" text-anchor="middle">evolves separately</text><path d="M 468 45 C 488 80, 458 110, 480 158" stroke="#56B4E9" stroke-width="12" fill="none"/><circle cx="435.4" cy="69.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="425.6" cy="101.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="442.6" cy="78.8" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="434.5" cy="75.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="441.5" cy="94.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="438.5" cy="76.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="420.9" cy="123.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="406.6" cy="94.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="530.1" cy="125.4" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="526.4" cy="107.9" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="510.8" cy="75.0" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="507.9" cy="99.6" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="533.4" cy="110.4" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="503.8" cy="108.5" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="536.8" cy="89.2" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="509.9" cy="111.4" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><line x1="560" y1="110" x2="572" y2="110" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><rect x="574" y="40" width="170" height="150" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="659" y="172" font-size="12.5" text-anchor="middle" font-weight="700">4. Barrier gone: they no</text><text x="659" y="186" font-size="12" text-anchor="middle">longer interbreed</text><circle cx="708.7" cy="87.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="624.5" cy="88.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="709.3" cy="99.2" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="639.7" cy="103.7" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="689.5" cy="83.1" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="688.3" cy="89.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="619.8" cy="81.4" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="676.2" cy="121.8" r="5" fill="#D2EAF8" stroke="#0072B2" stroke-width="1.5"/><circle cx="677.9" cy="68.7" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="658.7" cy="99.1" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="656.7" cy="72.5" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="652.1" cy="71.0" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="680.1" cy="96.6" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="667.0" cy="95.5" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="692.4" cy="85.1" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><circle cx="632.8" cy="98.0" r="5" fill="#F6D2BD" stroke="#D55E00" stroke-width="1.5"/><text x="16" y="232" font-size="16" font-weight="700">Sympatric speciation by polyploidy: no barrier, one generation</text><rect x="16" y="250" width="170" height="76" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><text x="101" y="274" font-size="14" text-anchor="middle" font-weight="700">Diploid plant</text><text x="101" y="294" font-size="13" text-anchor="middle">2n = 14</text><text x="101" y="312" font-size="13" text-anchor="middle">gametes: n = 7</text><rect x="214" y="250" width="170" height="76" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/><text x="299" y="274" font-size="14" text-anchor="middle" font-weight="700">Meiosis fails</text><text x="299" y="294" font-size="13" text-anchor="middle">unreduced gametes</text><text x="299" y="312" font-size="13" text-anchor="middle">2n = 14</text><rect x="412" y="250" width="170" height="76" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/><text x="497" y="274" font-size="14" text-anchor="middle" font-weight="700">Self-fertilization</text><text x="497" y="294" font-size="13" text-anchor="middle">14 + 14</text><rect x="610" y="250" width="134" height="76" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/><text x="677" y="274" font-size="14" text-anchor="middle" font-weight="700">Tetraploid</text><text x="677" y="294" font-size="13" text-anchor="middle">4n = 28</text><text x="677" y="312" font-size="13" text-anchor="middle">gametes: 14</text><line x1="188" y1="288" x2="210" y2="288" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><line x1="386" y1="288" x2="408" y2="288" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><line x1="584" y1="288" x2="606" y2="288" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#spa)"/><rect x="214" y="352" width="370" height="80" rx="10" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2"/><text x="399" y="376" font-size="14" text-anchor="middle" font-weight="700">Tetraploid × diploid: 14 + 7 = 21 (triploid)</text><text x="399" y="396" font-size="13" text-anchor="middle">three copies of each chromosome cannot pair evenly in</text><text x="399" y="414" font-size="13" text-anchor="middle">meiosis, so the triploid is sterile: a reproductive barrier</text><path d="M 677 328 V 392 H 588" stroke="#1F2A28" stroke-width="2" fill="none" marker-end="url(#spa)"/><path d="M 101 328 V 392 H 210" stroke="#1F2A28" stroke-width="2" fill="none" marker-end="url(#spa)"/></g></svg>
