<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
<title id="t">The stages of mitosis in an animal cell</title>
<desc id="d">Five panels of a cell with four chromosomes, two long and two short. Late interphase: the DNA has been copied but is loose inside the nucleus, and the centrosomes have been copied. Prophase: the chromosomes condense into compact X shapes, each made of two sister chromatids joined at a centromere; the nuclear envelope breaks down and the spindle forms between centrosomes moving to opposite poles. Metaphase: spindle fibers from both poles attach at each centromere and the chromosomes line up across the middle of the cell. Anaphase: the sister chromatids of every chromosome separate and are pulled to opposite poles, so each pole gets one copy of each chromosome. Telophase and cytokinesis: a nucleus forms around each set, the chromosomes loosen, and a furrow pinches the cell into two daughter cells with four chromosomes each.</desc>
<rect width="760" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="76" y="22" font-size="15" font-weight="700" text-anchor="middle">Late interphase</text><text x="228" y="22" font-size="15" font-weight="700" text-anchor="middle">Prophase</text><text x="380" y="22" font-size="15" font-weight="700" text-anchor="middle">Metaphase</text><text x="532" y="22" font-size="15" font-weight="700" text-anchor="middle">Anaphase</text><text x="684" y="22" font-size="15" font-weight="700" text-anchor="middle">Telophase and</text><text x="76" y="212" font-size="12" text-anchor="middle">DNA already copied</text><text x="76" y="227" font-size="12" text-anchor="middle">(G2)</text><text x="228" y="212" font-size="12" text-anchor="middle">chromosomes condense;</text><text x="228" y="227" font-size="12" text-anchor="middle">spindle forms</text><text x="380" y="212" font-size="12" text-anchor="middle">chromosomes line up</text><text x="380" y="227" font-size="12" text-anchor="middle">at the cell's middle</text><text x="532" y="212" font-size="12" text-anchor="middle">sister chromatids</text><text x="532" y="227" font-size="12" text-anchor="middle">pulled to opposite poles</text><text x="684" y="38" font-size="15" font-weight="700" text-anchor="middle">cytokinesis</text><text x="684" y="212" font-size="12" text-anchor="middle">two nuclei form;</text><text x="684" y="227" font-size="12" text-anchor="middle">a furrow splits the cell</text>
