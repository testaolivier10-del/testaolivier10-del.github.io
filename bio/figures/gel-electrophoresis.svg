<rect x="413.0" y="96.7" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
<text x="435.0" y="42.0" font-size="10" text-anchor="start"></text>
<text x="134.0" y="64.0" font-size="10" text-anchor="end">10,000</text>
<text x="134.0" y="117.8" font-size="10" text-anchor="end">5,000</text>
<text x="134.0" y="157.5" font-size="10" text-anchor="end">3,000</text>
