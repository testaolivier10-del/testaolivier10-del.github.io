<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="gel-t gel-d">
<title id="gel-t">Gel electrophoresis separates DNA fragments by size</title>
<desc id="gel-d">A slab of agarose gel in a tank of buffer, seen from above. Wells along the top edge, near the negative electrode, hold DNA samples; the positive electrode is at the bottom. DNA&#x27;s phosphate groups make it negatively charged, so every fragment moves toward the positive electrode. The gel&#x27;s mesh slows large fragments more than small ones, so small fragments travel farthest. Lane 1 is a DNA ladder of fragments of known size, 10,000, 5,000, 3,000, 2,000, 1,000 and 500 base pairs; the other lanes show sample bands whose sizes can be read by comparison with the ladder.</desc>
<defs><marker id="gel-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="140.0" y="30.0" width="360.0" height="300.0" rx="6" fill="#EEF4F8" stroke="#0072B2" stroke-width="2"/>
<text x="320.0" y="22.0" font-size="12" text-anchor="middle" font-weight="700">− negative electrode (wells here)</text>
<text x="320.0" y="350.0" font-size="12" text-anchor="middle" font-weight="700">+ positive electrode</text>
<rect x="170.0" y="40.0" width="50.0" height="8.0" rx="0" fill="#FFFFFF" stroke="#5D6B69" stroke-width="1.2"/>
<text x="195.0" y="36.0" font-size="10" text-anchor="start"></text>
