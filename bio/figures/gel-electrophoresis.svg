<text x="275.0" y="36.0" font-size="10" text-anchor="start"></text>
<rect x="330.0" y="40.0" width="50.0" height="8.0" rx="0" fill="#FFFFFF" stroke="#5D6B69" stroke-width="1.2"/>
<text x="355.0" y="36.0" font-size="10" text-anchor="start"></text>
<rect x="410.0" y="40.0" width="50.0" height="8.0" rx="0" fill="#FFFFFF" stroke="#5D6B69" stroke-width="1.2"/>
<text x="435.0" y="36.0" font-size="10" text-anchor="start"></text>
<rect x="173.0" y="57.0" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="173.0" y="110.8" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="173.0" y="150.5" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="173.0" y="182.0" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="173.0" y="235.8" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="173.0" y="289.7" width="44.0" height="6.0" rx="1" fill="#5D6B69" stroke="#1F2A28" stroke-width="0.5"/>
<text x="195.0" y="42.0" font-size="10" text-anchor="start"></text>
<rect x="253.0" y="119.0" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="253.0" y="204.3" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
<text x="275.0" y="42.0" font-size="10" text-anchor="start"></text>
<rect x="333.0" y="138.5" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="333.0" y="204.3" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
<rect x="333.0" y="235.8" width="44.0" height="6.0" rx="1" fill="#1F2A28" stroke="#1F2A28" stroke-width="0.5"/>
