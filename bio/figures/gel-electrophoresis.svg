<line x1="540.0" y1="70.0" x2="540.0" y2="290.0" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#gel-a)"/>
<text x="556.0" y="76.0" font-size="12" text-anchor="start">DNA is negative,</text>
<text x="556.0" y="91.0" font-size="12" text-anchor="start">so it moves toward</text>
<text x="556.0" y="106.0" font-size="12" text-anchor="start">the + electrode</text>
<text x="556.0" y="200.0" font-size="12" text-anchor="start">Small fragments</text>
<text x="556.0" y="215.0" font-size="12" text-anchor="start">slip through the gel</text>
<text x="556.0" y="230.0" font-size="12" text-anchor="start">faster and travel</text>
<text x="556.0" y="245.0" font-size="12" text-anchor="start">farthest</text>
</g>
</svg>
