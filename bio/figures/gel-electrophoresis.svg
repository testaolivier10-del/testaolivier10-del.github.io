<text x="110.0" y="46.0" font-size="11" text-anchor="middle" font-weight="700">bp</text>
<text x="195.0" y="322.0" font-size="10" text-anchor="middle">ladder</text>
<text x="275.0" y="322.0" font-size="10" text-anchor="middle">sample 1</text>
<text x="355.0" y="322.0" font-size="10" text-anchor="middle">sample 2</text>
