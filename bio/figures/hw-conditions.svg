<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="hc-t hc-d">
<title id="hc-t">Hardy-Weinberg equilibrium and its five conditions</title>
<desc id="hc-d">A central box: with allele frequencies p for A and q for a, random union of gametes gives genotype frequencies p squared AA, 2pq Aa and q squared aa, which add to 1, and the offspring make gametes in the same proportions p and q, so allele frequencies stay the same from generation to generation. Around it, five conditions, each ruling out one cause of evolution: a very large population (no genetic drift), no gene flow (no alleles moving in or out), no net mutation (no new alleles added), random mating (genotypes form by chance), and no natural selection (every genotype equally fit). A note says that if any condition fails, the population can depart from these frequencies: it may be evolving.</desc>
<defs><marker id="hc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<rect x="20" y="20" width="200" height="100" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="120" y="62" font-size="16" font-weight="700" text-anchor="middle">Very large population</text>
<text x="120" y="86" font-size="13" text-anchor="middle">rules out genetic drift</text>
<line x1="220" y1="70" x2="248" y2="110" stroke="#5B6B8C" stroke-width="2" marker-end="url(#hc-a)"/>
<rect x="20" y="150" width="200" height="100" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="120" y="192" font-size="16" font-weight="700" text-anchor="middle">No gene flow</text>
<text x="120" y="216" font-size="13" text-anchor="middle">no alleles moving in or out</text>
<line x1="220" y1="200" x2="248" y2="200" stroke="#5B6B8C" stroke-width="2" marker-end="url(#hc-a)"/>
<rect x="20" y="280" width="200" height="100" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="120" y="322" font-size="16" font-weight="700" text-anchor="middle">No net mutation</text>
<text x="120" y="346" font-size="13" text-anchor="middle">no new alleles added</text>
<line x1="220" y1="330" x2="248" y2="300" stroke="#5B6B8C" stroke-width="2" marker-end="url(#hc-a)"/>
<rect x="540" y="20" width="200" height="100" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="640" y="62" font-size="16" font-weight="700" text-anchor="middle">Random mating</text>
<text x="640" y="86" font-size="13" text-anchor="middle">genotypes form by chance</text>
<line x1="540" y1="70" x2="512" y2="110" stroke="#5B6B8C" stroke-width="2" marker-end="url(#hc-a)"/>
<rect x="540" y="150" width="200" height="100" rx="10" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="640" y="192" font-size="16" font-weight="700" text-anchor="middle">No natural selection</text>
<text x="640" y="216" font-size="13" text-anchor="middle">every genotype equally fit</text>
<line x1="540" y1="200" x2="512" y2="200" stroke="#5B6B8C" stroke-width="2" marker-end="url(#hc-a)"/>
<rect x="250" y="60" width="260" height="270" rx="12" fill="#EEF2F1" stroke="#1F2A28" stroke-width="2"/>
<text x="380" y="90" font-size="16" font-weight="700" text-anchor="middle">Gametes: A = p, a = q</text>
<text x="380" y="112" font-size="13" text-anchor="middle">p + q = 1</text>
<line x1="380" y1="122" x2="380" y2="148" stroke="#1F2A28" stroke-width="2" marker-end="url(#hc-a)"/>
<text x="380" y="140" font-size="12" text-anchor="start" dx="8">random union</text>
<text x="380" y="172" font-size="16" font-weight="700" text-anchor="middle">Offspring genotypes</text>
<text x="305" y="196" font-size="15" text-anchor="middle">AA: p²</text><text x="380" y="196" font-size="15" text-anchor="middle">Aa: 2pq</text><text x="455" y="196" font-size="15" text-anchor="middle">aa: q²</text>
<text x="380" y="218" font-size="13" text-anchor="middle">p² + 2pq + q² = 1</text>
<line x1="380" y1="228" x2="380" y2="254" stroke="#1F2A28" stroke-width="2" marker-end="url(#hc-a)"/>
<text x="380" y="276" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">Next generation's gametes:</text>
<text x="380" y="298" font-size="15" font-weight="700" text-anchor="middle" fill="#0072B2">still p and q</text>
<text x="380" y="318" font-size="12" text-anchor="middle">No change: the population is not evolving</text>
<rect x="250" y="350" width="490" height="56" rx="10" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
<text x="495" y="374" font-size="14" font-weight="700" text-anchor="middle">If any condition fails, allele or genotype frequencies</text>
<text x="495" y="394" font-size="14" font-weight="700" text-anchor="middle">can depart from these values: a sign of evolution.</text>
</g></svg>
