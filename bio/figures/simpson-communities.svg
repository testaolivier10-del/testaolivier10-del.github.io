<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">Evenness and Simpson's diversity index</title>
<desc id="d">Two plots of 20 plants each, with the same four species. In plot A the species are evenly mixed, 5 of each, and Simpson's index is 0.75. In plot B one species makes up 17 of the 20 plants and each other species has 1, and Simpson's index is 0.27.</desc>
<rect width="640" height="340" fill="#ffffff"/>
<defs>
  <g id="s1"><circle r="11" fill="#C4E8DC" stroke="#009E73" stroke-width="2.5"/></g>
  <g id="s2"><rect x="-10" y="-10" width="20" height="20" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/></g>
  <g id="s3"><path d="M0 -12 L11 9 L-11 9 Z" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2.5"/></g>
  <g id="s4"><path d="M0 -12 L12 0 L0 12 L-12 0 Z" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/></g>
</defs>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1F2A28">
  <rect x="20" y="40" width="280" height="200" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <rect x="340" y="40" width="280" height="200" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="160" y="28" font-weight="700">Plot A: 5 + 5 + 5 + 5</text>
  <text x="480" y="28" font-weight="700">Plot B: 17 + 1 + 1 + 1</text>
  <use href="#s1" x="60" y="80"/><use href="#s2" x="110" y="80"/><use href="#s3" x="160" y="80"/><use href="#s4" x="210" y="80"/><use href="#s1" x="260" y="80"/>
  <use href="#s2" x="60" y="125"/><use href="#s3" x="110" y="125"/><use href="#s4" x="160" y="125"/><use href="#s1" x="210" y="125"/><use href="#s2" x="260" y="125"/>
  <use href="#s3" x="60" y="170"/><use href="#s4" x="110" y="170"/><use href="#s1" x="160" y="170"/><use href="#s2" x="210" y="170"/><use href="#s3" x="260" y="170"/>
  <use href="#s4" x="60" y="215"/><use href="#s1" x="110" y="215"/><use href="#s2" x="160" y="215"/><use href="#s3" x="210" y="215"/><use href="#s4" x="260" y="215"/>
  <use href="#s1" x="380" y="80"/><use href="#s1" x="430" y="80"/><use href="#s1" x="480" y="80"/><use href="#s1" x="530" y="80"/><use href="#s1" x="580" y="80"/>
  <use href="#s1" x="380" y="125"/><use href="#s2" x="430" y="125"/><use href="#s1" x="480" y="125"/><use href="#s1" x="530" y="125"/><use href="#s1" x="580" y="125"/>
  <use href="#s1" x="380" y="170"/><use href="#s1" x="430" y="170"/><use href="#s1" x="480" y="170"/><use href="#s3" x="530" y="170"/><use href="#s1" x="580" y="170"/>
  <use href="#s1" x="380" y="215"/><use href="#s1" x="430" y="215"/><use href="#s4" x="480" y="215"/><use href="#s1" x="530" y="215"/><use href="#s1" x="580" y="215"/>
  <text x="160" y="272">Σ(n/N)² = 4 × 0.25² = 0.25</text>
  <text x="160" y="300" font-weight="700" fill="#00684C">D = 1 − 0.25 = 0.75</text>
  <text x="480" y="272">Σ = 0.85² + 3 × 0.05² = 0.73</text>
  <text x="480" y="300" font-weight="700" fill="#8E3B2E">D = 1 − 0.73 = 0.27</text>
  <text x="320" y="330" font-size="13" fill="#5D6B69">Same four species and 20 plants in each plot; only evenness differs</text>
</g>
</svg>
