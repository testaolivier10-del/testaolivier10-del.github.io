<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">The matter cycle: photosynthesis and cellular respiration</title>
<desc id="d">Carbon dioxide and water go into photosynthesis, which uses light energy to make sugar and release oxygen. Sugar and oxygen go into cellular respiration, which returns carbon dioxide and water and captures energy as ATP. Heat leaves the cycle.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
  <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker>
</defs>
<rect width="640" height="340" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1F2A28">
  <!-- process boxes -->
  <rect x="220" y="30" width="200" height="64" rx="12" fill="#C4E8DC" stroke="#009E73" stroke-width="3"/>
  <text x="320" y="58" font-size="18" font-weight="700">Photosynthesis</text>
  <text x="320" y="80" font-size="14">plants, algae, some bacteria</text>
  <rect x="220" y="246" width="200" height="64" rx="12" fill="#F6D2BD" stroke="#D55E00" stroke-width="3"/>
  <text x="320" y="274" font-size="18" font-weight="700">Cellular respiration</text>
  <text x="320" y="296" font-size="14">nearly every cell</text>
  <!-- matter pools -->
  <rect x="20" y="138" width="170" height="64" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="105" y="166" font-size="16" font-weight="700">carbon dioxide</text>
  <text x="105" y="188" font-size="16" font-weight="700">+ water</text>
  <rect x="450" y="138" width="170" height="64" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="535" y="166" font-size="16" font-weight="700">sugar</text>
  <text x="535" y="188" font-size="16" font-weight="700">+ oxygen</text>
  <!-- cycle arrows -->
  <path d="M105,136 C105,80 150,62 216,62" fill="none" stroke="#1F2A28" stroke-width="3" marker-end="url(#a)"/>
  <path d="M424,62 C490,62 535,80 535,134" fill="none" stroke="#1F2A28" stroke-width="3" marker-end="url(#a)"/>
  <path d="M535,206 C535,260 490,278 424,278" fill="none" stroke="#1F2A28" stroke-width="3" marker-end="url(#a)"/>
  <path d="M216,278 C150,278 105,260 105,206" fill="none" stroke="#1F2A28" stroke-width="3" marker-end="url(#a)"/>
  <text x="320" y="178" font-size="15" font-style="italic">atoms go round and round</text>
  <!-- energy -->
  <path d="M320,4 L320,26" stroke="#E69F00" stroke-width="4" marker-end="url(#ae)"/>
  <text x="380" y="18" font-size="14" font-weight="700" fill="#8A5A00">light in</text>
  <path d="M320,312 L320,336" stroke="#E69F00" stroke-width="4" marker-end="url(#ae)"/>
  <text x="200" y="330" font-size="14" font-weight="700" fill="#8A5A00">energy captured as ATP;</text>
  <text x="440" y="330" font-size="14" font-weight="700" fill="#8A5A00">heat out</text>
</g>
</svg>
