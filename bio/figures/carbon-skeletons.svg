<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
<title id="t">Four kinds of carbon skeleton</title>
<desc id="d">A straight chain of four carbons; a branched chain where a fourth carbon hangs off the middle of a three-carbon chain; a four-carbon chain with a double bond between the second and third carbons; and a ring of six carbons.</desc>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <g stroke="#1F2A28" stroke-width="4">
    <!-- straight chain -->
    <line x1="30" y1="150" x2="62" y2="125"/><line x1="62" y1="125" x2="98" y2="150"/><line x1="98" y1="150" x2="130" y2="125"/>
    <!-- branched -->
    <line x1="190" y1="160" x2="228" y2="135"/><line x1="228" y1="135" x2="266" y2="160"/><line x1="228" y1="135" x2="228" y2="90"/>
    <!-- double bond -->
    <line x1="330" y1="150" x2="362" y2="125"/><line x1="430" y1="125" x2="462" y2="150"/>
    <line x1="362" y1="119" x2="430" y2="119"/><line x1="362" y1="131" x2="430" y2="131"/>
    <!-- ring -->
    <polygon points="560,85 604,110 604,160 560,185 516,160 516,110" fill="none"/>
  </g>
  <g fill="#EEF2F1" stroke="#5D6B69" stroke-width="2.5">
    <circle cx="30" cy="150" r="15"/><circle cx="62" cy="125" r="15"/><circle cx="98" cy="150" r="15"/><circle cx="130" cy="125" r="15"/>
    <circle cx="190" cy="160" r="15"/><circle cx="228" cy="135" r="15"/><circle cx="266" cy="160" r="15"/><circle cx="228" cy="90" r="15"/>
    <circle cx="330" cy="150" r="15"/><circle cx="362" cy="125" r="15"/><circle cx="430" cy="125" r="15"/><circle cx="462" cy="150" r="15"/>
    <circle cx="560" cy="85" r="15"/><circle cx="604" cy="110" r="15"/><circle cx="604" cy="160" r="15"/><circle cx="560" cy="185" r="15"/><circle cx="516" cy="160" r="15"/><circle cx="516" cy="110" r="15"/>
  </g>
  <g font-size="15" font-weight="700" fill="#1F2A28">
    <text x="30" y="155">C</text><text x="62" y="130">C</text><text x="98" y="155">C</text><text x="130" y="130">C</text>
    <text x="190" y="165">C</text><text x="228" y="140">C</text><text x="266" y="165">C</text><text x="228" y="95">C</text>
    <text x="330" y="155">C</text><text x="362" y="130">C</text><text x="430" y="130">C</text><text x="462" y="155">C</text>
    <text x="560" y="90">C</text><text x="604" y="115">C</text><text x="604" y="165">C</text><text x="560" y="190">C</text><text x="516" y="165">C</text><text x="516" y="115">C</text>
  </g>
  <g font-size="16" font-weight="700" fill="#1F2A28">
    <text x="80" y="230">Straight chain</text>
    <text x="228" y="230">Branched chain</text>
    <text x="396" y="230">Double bond</text>
    <text x="560" y="230">Ring</text>
  </g>
  <g font-size="13" fill="#3D4A66">
    <text x="80" y="252">carbons in a row</text>
    <text x="228" y="252">a side chain of carbon</text>
    <text x="396" y="252">two shared pairs: C=C</text>
    <text x="560" y="252">the chain closes up</text>
  </g>
  <text x="320" y="288" font-size="14" fill="#1F2A28">Every carbon makes four bonds; the spare bonds (not drawn) go to hydrogen or other atoms.</text>
</g>
</svg>
