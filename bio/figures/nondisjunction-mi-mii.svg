<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="ndj-t ndj-d">
<title id="ndj-t">Nondisjunction in meiosis I compared with meiosis II</title>
<desc id="ndj-d">Two columns follow one homologous pair (one blue and one orange chromosome) through meiosis; the other chromosomes are left out. Left column, nondisjunction in meiosis I: the two homologs fail to separate and both go to the same cell, so one cell after meiosis I has two copies of the chromosome and the other has none. After a normal meiosis II, the four gametes carry 2, 2, 0 and 0 copies: all four are abnormal (n + 1, n + 1, n − 1, n − 1). Right column, nondisjunction in meiosis II: meiosis I is normal and each cell gets one homolog, but in one cell the sister chromatids fail to separate. The four gametes carry 2, 0, 1 and 1 copies: two abnormal (n + 1 and n − 1) and two normal. The n + 1 gamete from meiosis I carries one blue and one orange copy; the n + 1 gamete from meiosis II carries two identical copies. Bottom: fertilization by a normal gamete with one copy gives a zygote with three copies (trisomy) from an n + 1 gamete, or one copy (monosomy) from an n − 1 gamete.</desc>
