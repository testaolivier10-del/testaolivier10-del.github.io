<text x="130.0" y="139.6" font-size="12" text-anchor="middle">chromosome</text>
<text x="20.0" y="238.0" font-size="12" text-anchor="start">No nucleus: the chromosome lies in</text>
<text x="20.0" y="253.6" font-size="12" text-anchor="start">the nucleoid. Plasmids (orange) are small</text>
<text x="20.0" y="269.2" font-size="12" text-anchor="start">extra circles of DNA.</text>
<text x="500.0" y="28.0" font-size="14" text-anchor="middle" font-weight="700">Eukaryote: packing a linear chromosome</text>
