<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="gpk-t gpk-d">
<title id="gpk-t">How prokaryotes and eukaryotes organize their DNA</title>
<desc id="gpk-d">Left: a bacterial cell with no nucleus. Its main DNA is one large circular chromosome in a region of the cytoplasm called the nucleoid, and the cell also holds two small circles of DNA, plasmids, which can carry a few extra genes. Right: a eukaryotic cell&#x27;s DNA packing, in four levels from left to right: the 2-nanometer double helix; the helix wrapped around clusters of histone proteins, forming nucleosomes like beads on a string; the string of nucleosomes coiled into a thicker fiber and folded into loops; and, during mitosis, a fully condensed linear chromosome of two sister chromatids. Below, a stretch of a chromosome in a cell that is not dividing: loosely packed euchromatin, where the proteins that read genes can reach the DNA, next to tightly packed heterochromatin, where they mostly cannot.</desc>
<defs><marker id="gpk-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
