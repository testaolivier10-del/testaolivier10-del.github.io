<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="df-t df-d">
<title id="df-t">The bottleneck effect and the founder effect</title>
<desc id="df-d">Two rows of circles, each color an allele. Top row, bottleneck effect: a large population with 12 blue, 8 orange and 4 green alleles; a disaster kills most individuals at random, leaving 5 alleles, 4 blue and 1 orange; the population grows back to its old size but is now 20 blue and 4 orange, with green lost. Bottom row, founder effect: a large mainland population with 12 blue, 8 orange and 4 green; 3 individuals carrying 6 alleles, 3 green, 2 orange and 1 blue, reach an island; the island population grows to 24 alleles, 12 green, 8 orange and 4 blue, so green, rare on the mainland, is common on the island. In both, chance in a small sample changes allele frequencies and lowers genetic variation.</desc>
<defs><marker id="df-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
<rect width="760" height="430" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
<text x="20" y="28" font-size="17" font-weight="700">Bottleneck effect</text>
<rect x="20" y="45" width="150" height="110" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="95" y="173" font-size="13" text-anchor="middle">Large population:</text>
<text x="95" y="190" font-size="13" text-anchor="middle">12 blue, 8 orange, 4 green</text>
<circle cx="37" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="60" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="81" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="103" cy="60" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="125" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="147" cy="60" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="81" cy="82" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="103" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="125" cy="82" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="147" cy="82" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="104" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="81" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="103" cy="104" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="125" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="147" cy="104" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="81" cy="126" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="103" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="125" cy="126" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="147" cy="126" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/>
<line x1="178" y1="100" x2="268" y2="100" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#df-a)"/>
<text x="223" y="90" font-size="12" text-anchor="middle">disaster kills</text>
<text x="223" y="122" font-size="12" text-anchor="middle">most, at random</text>
<rect x="275" y="65" width="100" height="70" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="325" y="153" font-size="13" text-anchor="middle">Survivors:</text>
<text x="325" y="170" font-size="13" text-anchor="middle">4 blue, 1 orange</text>
<circle cx="297" cy="88" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="319" cy="88" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="341" cy="88" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="363" cy="88" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<circle cx="297" cy="110" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<line x1="383" y1="100" x2="463" y2="100" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#df-a)"/>
