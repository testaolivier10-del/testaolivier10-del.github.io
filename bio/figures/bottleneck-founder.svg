<rect x="470" y="45" width="150" height="110" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="545" y="173" font-size="13" text-anchor="middle">Recovered population:</text>
<text x="545" y="190" font-size="13" text-anchor="middle">20 blue, 4 orange, no green</text>
<circle cx="487" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="509" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="531" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="553" cy="60" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="575" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="597" cy="60" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="487" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="509" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="531" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="553" cy="82" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="575" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="597" cy="82" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="487" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="509" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="531" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="553" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="575" cy="104" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="597" cy="104" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="487" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="509" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="531" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="553" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="575" cy="126" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="597" cy="126" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<text x="640" y="90" font-size="13">Fewer kinds</text><text x="640" y="107" font-size="13">of alleles than</text><text x="640" y="124" font-size="13">before</text>
<text x="20" y="218" font-size="17" font-weight="700">Founder effect</text>
<rect x="20" y="230" width="150" height="110" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="95" y="358" font-size="13" text-anchor="middle">Mainland population:</text>
<text x="95" y="375" font-size="13" text-anchor="middle">12 blue, 8 orange, 4 green</text>
<circle cx="37" cy="245" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="245" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="81" cy="245" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="103" cy="245" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="125" cy="245" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="147" cy="245" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="267" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="267" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="81" cy="267" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="103" cy="267" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="125" cy="267" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="147" cy="267" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="289" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="289" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="81" cy="289" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="103" cy="289" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="125" cy="289" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="147" cy="289" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="37" cy="311" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="59" cy="311" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="81" cy="311" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="103" cy="311" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="125" cy="311" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="147" cy="311" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/>
<line x1="178" y1="285" x2="268" y2="285" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#df-a)"/>
<text x="223" y="275" font-size="12" text-anchor="middle">3 individuals</text>
<text x="223" y="307" font-size="12" text-anchor="middle">reach an island</text>
<rect x="275" y="250" width="100" height="70" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="325" y="338" font-size="13" text-anchor="middle">Founders:</text>
<text x="325" y="355" font-size="13" text-anchor="middle">3 green, 2 orange, 1 blue</text>
<circle cx="297" cy="273" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="319" cy="273" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="341" cy="273" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/>
<circle cx="297" cy="295" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="319" cy="295" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="341" cy="295" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/>
<line x1="383" y1="285" x2="463" y2="285" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#df-a)"/>
<text x="423" y="275" font-size="12" text-anchor="middle">island</text>
<text x="423" y="307" font-size="12" text-anchor="middle">population grows</text>
<rect x="470" y="230" width="150" height="110" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/>
<text x="545" y="358" font-size="13" text-anchor="middle">Island population:</text>
<text x="545" y="375" font-size="13" text-anchor="middle">12 green, 8 orange, 4 blue</text>
<circle cx="487" cy="245" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="509" cy="245" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="531" cy="245" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="553" cy="245" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="575" cy="245" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="597" cy="245" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="487" cy="267" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="509" cy="267" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="531" cy="267" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="553" cy="267" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="575" cy="267" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="597" cy="267" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="487" cy="289" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="509" cy="289" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="531" cy="289" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="553" cy="289" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="575" cy="289" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="597" cy="289" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="487" cy="311" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="509" cy="311" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="531" cy="311" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/><circle cx="553" cy="311" r="9" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/><circle cx="575" cy="311" r="9" fill="#D2EAF8" stroke="#0072B2" stroke-width="2"/><circle cx="597" cy="311" r="9" fill="#F8E3B8" stroke="#D55E00" stroke-width="2"/>
<text x="640" y="275" font-size="13">A rare allele</text><text x="640" y="292" font-size="13">on the mainland</text><text x="640" y="309" font-size="13">is common here</text>
<text x="380" y="422" font-size="13" text-anchor="middle" fill="#5D6B69">Each circle is one allele copy. Chance, not fitness, decided which alleles came through.</text>
</g></svg>
