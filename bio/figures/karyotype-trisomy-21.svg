<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="kar-t kar-d">
<title id="kar-t">Karyotype of a child with 47 chromosomes</title>
<desc id="kar-d">Chromosomes from one dividing cell, arranged in numbered homologous pairs from largest (1) to smallest, with the sex chromosomes last. Each chromosome is condensed and made of two sister chromatids. Every autosome from 1 to 22 is present as a pair except chromosome 21, which is present three times (highlighted). The sex chromosomes are one X and one Y. Total: 47 chromosomes.</desc>
