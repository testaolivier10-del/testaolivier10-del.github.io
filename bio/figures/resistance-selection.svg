<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="rsel-t rsel-d"><title id="rsel-t">Insecticide selects for resistance that already exists</title><desc id="rsel-d">Four panels of 16 insects each. Generation 0, before spraying: 1 of 16 carries a resistance allele. Spraying: most susceptible insects are killed; 2 of 16 survive, the resistant one and one susceptible one. Generation 1, offspring of the survivors: 7 of 16 are resistant. Generation 6, after years of spraying: 15 of 16 are resistant. The resistance allele was present before spraying; the insecticide did not create it.</desc><defs><marker id="ce-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs><rect width="760" height="330" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><rect x="20" y="20" width="160" height="230" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="100" y="44" font-size="15" font-weight="700" text-anchor="middle">Generation 0</text><text x="100" y="62" font-size="12" text-anchor="middle">before spraying</text><ellipse cx="48" cy="92" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="83" cy="92" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="118" cy="92" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="153" cy="92" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="48" cy="132" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="83" cy="132" rx="11" ry="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/><ellipse cx="118" cy="132" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="153" cy="132" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="48" cy="172" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="83" cy="172" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="118" cy="172" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="153" cy="172" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="48" cy="212" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="83" cy="212" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="118" cy="212" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><ellipse cx="153" cy="212" rx="11" ry="8" fill="#D2EAF8" stroke="#0072B2" stroke-width="2.5"/><text x="100" y="270" font-size="13" text-anchor="middle" font-weight="700">resistant: 1 of 16</text><line x1="183" y1="135" x2="202" y2="135" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ce-a)"/><rect x="205" y="20" width="160" height="230" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="1.5"/><text x="285" y="44" font-size="15" font-weight="700" text-anchor="middle">Spraying</text><text x="285" y="62" font-size="12" text-anchor="middle">most susceptible die</text><g stroke="#5D6B69" stroke-width="2.5"><line x1="224" y1="83" x2="242" y2="101"/><line x1="242" y1="83" x2="224" y2="101"/></g><g stroke="#5D6B69" stroke-width="2.5"><line x1="259" y1="83" x2="277" y2="101"/><line x1="277" y1="83" x2="259" y2="101"/></g><g stroke="#5D6B69" stroke-width="2.5"><line x1="294" y1="83" x2="312" y2="101"/><line x1="312" y1="83" x2="294" y2="101"/></g><g stroke="#5D6B69" stroke-width="2.5"><line x1="329" y1="83" x2="347" y2="101"/><line x1="347" y1="83" x2="329" y2="101"/></g><g stroke="#5D6B69" stroke-width="2.5"><line x1="224" y1="123" x2="242" y2="141"/><line x1="242" y1="123" x2="224" y2="141"/></g><ellipse cx="268" cy="132" rx="11" ry="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2.5"/><g stroke="#5D6B69" stroke-width="2.5"><line x1="294" y1="123" x2="31