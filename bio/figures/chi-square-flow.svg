<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
<title id="t">A chi-square test step by step</title>
<desc id="d">A worked chi-square test as a table and flowchart. Forty pill bugs in a two-sided chamber: observed 29 moist and 11 dry, expected 20 and 20. Each (o − e)² ÷ e is 4.05; χ² = 8.1. Degrees of freedom = 2 − 1 = 1; the critical value at p = 0.05 is 3.84. Since 8.1 is greater than 3.84, reject the null hypothesis.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2A28"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1F2A28">
  <rect x="20" y="20" width="600" height="38" rx="6" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2"/>
  <text x="320" y="45">H₀: no preference, so 40 pill bugs split 20 : 20</text>
  <g stroke="#5D6B69" stroke-width="1.5">
    <rect x="20" y="80" width="600" height="34" fill="#EEF2F1"/><rect x="20" y="114" width="600" height="34" fill="#ffffff"/><rect x="20" y="148" width="600" height="34" fill="#ffffff"/>
    <line x1="160" y1="80" x2="160" y2="182"/><line x1="280" y1="80" x2="280" y2="182"/><line x1="400" y1="80" x2="400" y2="182"/>
  </g>
  <g font-weight="700"><text x="90" y="103">Side</text><text x="220" y="103">observed o</text><text x="340" y="103">expected e</text><text x="510" y="103">(o − e)² ÷ e</text></g>
  <text x="90" y="137">Moist</text><text x="220" y="137">29</text><text x="340" y="137">20</text><text x="510" y="137">81 ÷ 20 = 4.05</text>
  <text x="90" y="171">Dry</text><text x="220" y="171">11</text><text x="340" y="171">20</text><text x="510" y="171">81 ÷ 20 = 4.05</text>
  <rect x="20" y="200" width="180" height="60" rx="8" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <text x="110" y="225" font-weight="700">χ² = 8.1</text><text x="110" y="248" font-size="13">sum of the terms</text>
  <line x1="202" y1="230" x2="228" y2="230" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="200" width="180" height="60" rx="8" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="320" y="225" font-weight="700">df = 2 − 1 = 1</text><text x="320" y="248" font-size="13">critical value 3.84 (p = 0.05)</text>
  <line x1="412" y1="230" x2="438" y2="230" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <rect x="440" y="200" width="180" height="60" rx="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
  <text x="530" y="225" font-weight="700" fill="#8E3B2E">8.1 &gt; 3.84</text><text x="530" y="248" font-size="13">reject H₀ (p &lt; 0.05)</text>
  <text x="320" y="296" font-size="14" fill="#5D6B69">χ² greater than the critical value: deviation too large for chance → reject H₀</text>
  <text x="320" y="320" font-size="14" fill="#5D6B69">χ² at or below the critical value → fail to reject H₀</text>
</g>
</svg>
