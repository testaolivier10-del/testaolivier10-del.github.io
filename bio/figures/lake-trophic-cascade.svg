<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="ltc-t ltc-d">
<title id="ltc-t">A trophic cascade in a lake</title>
<desc id="ltc-d">Two lakes, each with four feeding levels: bass eat minnows, minnows eat zooplankton, zooplankton eat phytoplankton. Bar length compares each level between the two lakes. In the lake with bass: bass present, few minnows, many zooplankton, few phytoplankton, so the water is clear. In the lake with the bass removed: no bass, many minnows, few zooplankton, many phytoplankton, so the water is green and cloudy. Removing the top predator changes every level below it, alternating up and down.</desc>
<defs>
  <marker id="ltc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
</defs>
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28">
  <text x="250" y="30" font-size="16" font-weight="700" text-anchor="middle">Lake with bass</text>
  <text x="590" y="30" font-size="16" font-weight="700" text-anchor="middle">Bass removed</text>
  <g font-size="14" font-weight="700" text-anchor="end">
    <text x="130" y="82">Bass</text>
    <text x="130" y="172">Minnows</text>
    <text x="130" y="262">Zooplankton</text>
    <text x="130" y="352">Phytoplankton</text>
  </g>
  <g font-size="11" text-anchor="end" fill="#5D6B69">
    <text x="130" y="97">eat minnows</text>
    <text x="130" y="187">eat zooplankton</text>
    <text x="130" y="277">eat phytoplankton</text>
    <text x="130" y="367">algae (producers)</text>
  </g>
  <!-- with bass -->
  <rect x="150" y="62" width="200" height="40" rx="6" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2"/>
  <rect x="150" y="152" width="60" height="40" rx="6" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <rect x="150" y="242" width="200" height="40" rx="6" fill="#D2EAF8" stroke="#56B4E9" stroke-width="2"/>
  <rect x="150" y="332" width="60" height="40" rx="6" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/>
  <g font-size="13" font-weight="700">
    <text x="360" y="88">present</text><text x="220" y="178">few</text><text x="360" y="268">many</text><text x="220" y="358">few</text>
  </g>
  <!-- bass removed -->
  <rect x="490" y="62" width="4" height="40" fill="#CC79A7"/>
  <rect x="490" y="152" width="200" height="40" rx="6" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <rect x="490" y="242" width="60" height="40" rx="6" fill="#D2EAF8" stroke="#56B4E9" stroke-width="2"/>
  <rect x="490" y="332" width="200" height="40" rx="6" fill="#C4E8DC" stroke="#009E73" stroke-width="2"/>
  <g font-size="13" font-weight="700">
    <text x="502" y="88">none</text><text x="700" y="178">many</text><text x="560" y="268">few</text><text x="700" y="358">many</text>
  </g>
  <!-- eats arrows (food to eater, energy direction) in the middle column -->
  <g stroke="#1F2A28" stroke-width="2.2">
    <line x1="430" y1="150" x2="430" y2="106" marker-end="url(#ltc-a)"/>
    <line x1="430" y1="240" x2="430" y2="196" marker-end="url(#ltc-a)"/>
    <line x1="430" y1="330" x2="430" y2="286" marker-end="url(#ltc-a)"/>
  </g>
  <text x="430" y="54" font-size="11" text-anchor="middle">arrows: food → eater</text>
  <text x="250" y="402" font-size="14" font-weight="700" text-anchor="middle" fill="#00704F">clear water</text>
  <text x="590" y="402" font-size="14" font-weight="700" text-anchor="middle" fill="#00704F">green, cloudy water</text>
</g>
</svg>
