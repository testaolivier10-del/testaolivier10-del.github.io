<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
<title id="t">Hydrogen bonds between water molecules</title>
<desc id="d">Three water molecules. Each oxygen carries a partial negative charge and each hydrogen a partial positive charge. Dashed lines join a hydrogen of one molecule to the oxygen of a neighbor: these are hydrogen bonds. Solid lines inside each molecule are covalent bonds.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle">
  <g stroke="#1F2A28" stroke-width="5">
    <line x1="170" y1="160" x2="115" y2="215"/><line x1="170" y1="160" x2="235" y2="190"/>
    <line x1="350" y1="230" x2="300" y2="285"/><line x1="350" y1="230" x2="415" y2="250"/>
    <line x1="480" y1="120" x2="487" y2="57"/><line x1="480" y1="120" x2="545" y2="145"/>
  </g>
  <g stroke="#0072B2" stroke-width="3.5" stroke-dasharray="9 7" fill="none">
    <line x1="252" y1="197" x2="328" y2="222"/>
    <line x1="428" y1="240" x2="468" y2="140"/>
  </g>
  <g fill="#F6D2BD" stroke="#D55E00" stroke-width="3"><circle cx="170" cy="160" r="34"/><circle cx="350" cy="230" r="34"/><circle cx="480" cy="120" r="34"/></g>
  <g fill="#E1E6F0" stroke="#5B6B8C" stroke-width="3"><circle cx="115" cy="215" r="20"/><circle cx="235" cy="190" r="20"/><circle cx="300" cy="285" r="20"/><circle cx="415" cy="250" r="20"/><circle cx="487" cy="57" r="20"/><circle cx="545" cy="145" r="20"/></g>
  <g fill="#1F2A28" font-weight="700"><text x="170" y="166">O</text><text x="350" y="236">O</text><text x="480" y="126">O</text>
  <text x="115" y="221">H</text><text x="235" y="196">H</text><text x="300" y="291">H</text><text x="415" y="256">H</text><text x="487" y="63">H</text><text x="545" y="151">H</text></g>
  <g fill="#8E3B2E" font-size="17"><text x="150" y="112">δ−</text><text x="388" y="214">δ−</text><text x="512" y="94">δ−</text></g>
  <g fill="#3D4A66" font-size="17"><text x="88" y="248">δ+</text><text x="250" y="230">δ+</text><text x="440" y="285">δ+</text></g>
  <g fill="#0072B2" font-size="16" font-weight="700"><text x="290" y="158">hydrogen bond</text></g>
  <g fill="#1F2A28" font-size="16"><text x="95" y="128" text-anchor="end">covalent</text><text x="95" y="146" text-anchor="end">bond</text></g>
  <line x1="100" y1="140" x2="135" y2="185" stroke="#1F2A28" stroke-width="1.5"/>
</g>
</svg>
