<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="dfx-t dfx-d">
<title id="dfx-t">Same genes, different activators, different cells</title>
<desc id="dfx-d">Three cells from one body, each with the same four genes in its DNA. Each gene has an enhancer made of control elements, shown as colored squares; a gene is transcribed only when the cell contains activator proteins matching every one of its control elements. Albumin needs red and blue activators, crystallin green and purple, myosin orange and blue, and a glycolysis enzyme a gray activator that every cell has. The liver cell has red, blue and gray activators, so it transcribes albumin and the glycolysis enzyme. The lens cell has green, purple and gray, so it transcribes crystallin and the glycolysis enzyme. The muscle cell has orange, blue and gray, so it transcribes myosin and the glycolysis enzyme. Same genes, different activators, different genes on.</desc>
