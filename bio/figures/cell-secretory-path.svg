<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img" aria-labelledby="t d">
<title id="t">Parts of an animal cell and the secretory pathway</title>
<desc id="d">A simplified animal cell. The nucleus, with its nucleolus and nuclear pores, sits at the left. Rough ER studded with ribosomes wraps beside it, then the stacked Golgi complex, then vesicles moving to the cell membrane. Numbered arrows trace a secreted protein: 1, built by ribosomes on the rough ER; 2, carried in a vesicle to the Golgi; 3, modified and packaged by the Golgi; 4, released at the cell membrane. A lysosome, a mitochondrion with folded inner membrane, smooth ER and free ribosomes are also labeled.</desc>
<rect width="680" height="450" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1F2A28">
  <!-- cell membrane -->
  <rect x="20" y="40" width="600" height="350" rx="70" fill="#FBF8F0" stroke="#6B5E3C" stroke-width="5"/>
  <!-- nucleus -->
  <ellipse cx="135" cy="215" rx="78" ry="92" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="4"/>
  <ellipse cx="135" cy="215" rx="70" ry="84" fill="none" stroke="#5B6B8C" stroke-width="1.5"/>
  <circle cx="120" cy="225" r="22" fill="#AEBBD6"/>
  <g fill="#ffffff" stroke="#5B6B8C" stroke-width="1.5"><rect x="207" y="190" width="8" height="12"/><rect x="207" y="236" width="8" height="12"/><rect x="128" y="125" width="12" height="8"/></g>
  <!-- rough ER -->
  <g fill="none" stroke="#0072B2" stroke-width="4">
    <path d="M238 120 q30 10 0 30 q-30 20 0 40 q30 20 0 40 q-30 20 0 40 q30 20 0 40"/>
    <path d="M262 120 q30 10 0 30 q-30 20 0 40 q30 20 0 40 q-30 20 0 40 q30 20 0 40"/>
  </g>
  <g fill="#0072B2"><circle cx="270" cy="128" r="3.5"/><circle cx="283" cy="150" r="3.5"/><circle cx="262" cy="168" r="3.5"/><circle cx="252" cy="190" r="3.5"/><circle cx="283" cy="228" r="3.5"/><circle cx="264" cy="250" r="3.5"/><circle cx="250" cy="270" r="3.5"/><circle cx="283" cy="308" r="3.5"/><circle cx="230" cy="153" r="3.5"/><circle cx="228" cy="232" r="3.5"/></g>
  <!-- smooth ER -->
  <path d="M215 330 q20 -14 40 0 q20 14 40 0 q20 -14 40 0" fill="none" stroke="#009E73" stroke-width="5"/>
  <!-- Golgi -->
  <g fill="#F8E3B8" stroke="#E69F00" stroke-width="3">
    <path d="M380 150 q22 70 0 140 h12 q22 -70 0 -140 z"/>
    <path d="M400 160 q20 60 0 120 h12 q20 -60 0 -120 z"/>
    <path d="M420 170 q18 50 0 100 h12 q18 -50 0 -100 z"/>
  </g>
  <!-- vesicles -->
  <g fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"><circle cx="335" cy="205" r="9"/><circle cx="480" cy="190" r="10"/><circle cx="530" cy="155" r="10"/></g>
  <!-- releasing vesicle at membrane -->
  <path d="M580 112 a14 14 0 0 1 28 0" fill="#F8E3B8" stroke="#E69F00" stroke-width="2.5"/>
  <!-- lysosome -->
  <circle cx="515" cy="318" r="20" fill="#EFD5CF" stroke="#8E3B2E" stroke-width="3"/>
  <!-- mitochondrion -->
  <ellipse cx="420" cy="345" rx="52" ry="22" fill="#F6D2BD" stroke="#D55E00" stroke-width="3"/>
  <path d="M380 345 l10 -14 l10 28 l10 -28 l10 28 l10 -28 l10 28 l10 -28 l10 14" fill="none" stroke="#D55E00" stroke-width="2"/>
  <!-- free ribosomes -->
  <g fill="#0072B2"><circle cx="560" cy="250" r="3.5"/><circle cx="570" cy="258" r="3.5"/><circle cx="552" cy="262" r="3.5"/></g>
  <!-- pathway arrows -->
  <g stroke="#CC79A7" stroke-width="3" fill="none" marker-end="url(#ah)">
    <path d="M292 200 L322 204"/>
    <path d="M346 204 L374 210"/>
    <path d="M446 210 L470 196"/>
    <path d="M490 184 L520 162"/>
    <path d="M540 146 L578 118"/>
  </g>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CC79A7"/></marker></defs>
  <g font-weight="700" fill="#ffffff">
    <circle cx="300" cy="182" r="12" fill="#CC79A7"/><text x="300" y="187" text-anchor="middle">1</text>
    <circle cx="358" cy="185" r="12" fill="#CC79A7"/><text x="358" y="190" text-anchor="middle">2</text>
    <circle cx="455" cy="232" r="12" fill="#CC79A7"/><text x="455" y="237" text-anchor="middle">3</text>
    <circle cx="560" cy="110" r="12" fill="#CC79A7"/><text x="560" y="115" text-anchor="middle">4</text>
  </g>
  <!-- labels -->
  <g font-size="15">
    <text x="135" y="30" text-anchor="middle">cell membrane</text><line x1="135" y1="34" x2="135" y2="42" stroke="#1F2A28"/>
    <text x="120" y="275" text-anchor="middle">nucleolus</text>
    <text x="70" y="330">nucleus</text>
    <text x="180" y="112" text-anchor="middle">nuclear pore</text><line x1="160" y1="116" x2="136" y2="125" stroke="#1F2A28"/>
    <text x="262" y="105" text-anchor="middle">rough ER</text>
    <text x="275" y="360" text-anchor="middle">smooth ER</text>
    <text x="410" y="140" text-anchor="middle">Golgi complex</text>
    <text x="500" y="215">vesicle</text>
    <text x="515" y="358" text-anchor="middle">lysosome</text>
    <text x="420" y="382" text-anchor="middle">mitochondrion</text>
    <text x="582" y="288" text-anchor="middle">free</text><text x="582" y="304" text-anchor="middle">ribosomes</text>
  </g>
  </g>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1F2A28">
  <text x="20" y="418">1 Ribosomes on the rough ER build the protein.   2 A vesicle carries it to the Golgi.</text>
  <text x="20" y="438">3 The Golgi modifies, sorts and packages it.   4 A vesicle fuses with the cell membrane and releases it.</text>
</g>
</svg>
