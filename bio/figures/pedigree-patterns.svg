<line x1="480.0" y1="203.0" x2="560.0" y2="203.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="480.0" y1="203.0" x2="480.0" y2="227.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="560.0" y1="203.0" x2="560.0" y2="227.0" stroke="#1F2A28" stroke-width="2"/>
<rect x="467.0" y="227.0" width="26" height="26" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/>
<circle cx="560" cy="240" r="13.0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/>
<circle cx="560" cy="240" r="4.5" fill="#1F2A28"/>
<rect x="637.0" y="227.0" width="26" height="26" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/>
<line x1="573.0" y1="240.0" x2="637.0" y2="240.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="605.0" y1="240.0" x2="605.0" y2="273.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="575.0" y1="273.0" x2="695.0" y2="273.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="575.0" y1="273.0" x2="575.0" y2="297.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="635.0" y1="273.0" x2="635.0" y2="297.0" stroke="#1F2A28" stroke-width="2"/>
<line x1="695.0" y1="273.0" x2="695.0" y2="297.0" stroke="#1F2A28" stroke-width="2"/>
<rect x="562.0" y="297.0" width="26" height="26" fill="#1F2A28" stroke="#1F2A28" stroke-width="2"/>
<circle cx="635" cy="310" r="13.0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/>
<rect x="682.0" y="297.0" width="26" height="26" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/>
<text x="570.0" y="360.0" font-size="13" text-anchor="middle">Mostly males affected; an affected man</text>
<text x="570.0" y="376.0" font-size="13" text-anchor="middle">passes the allele to all his daughters,</text>
<text x="570.0" y="392.0" font-size="13" text-anchor="middle">who may pass it to their sons.</text>
</g>
</svg>
