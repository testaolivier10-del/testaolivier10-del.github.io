<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="sm-t sm-d">
<title id="sm-t">Directional, stabilizing and disruptive selection</title>
<desc id="sm-d">Three graphs of number of individuals against the value of a heritable trait. In each, a dashed gray bell curve shows the population before selection and a solid blue curve shows the population after many generations; shaded red zones mark the trait values that leave fewer offspring. Directional selection: individuals at the low end are selected against, and the curve shifts to the right; the mean changes. Example: in a drought, birds with deeper beaks survive. Stabilizing selection: both extremes are selected against, and the curve becomes narrower and taller around the same mean; variation shrinks. Example: very small and very large newborns survive less often. Disruptive selection: the middle is selected against, and the curve splits into two peaks; variation grows. Example: small and large beaks each suit one kind of seed.</desc>
