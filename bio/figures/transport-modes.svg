<text x="18" y="60" font-size="12" font-style="italic">outside</text><text x="18" y="362" font-size="12" font-style="italic">cytoplasm</text>
<rect x="185" y="40" width="160" height="330" rx="10" fill="none" stroke="#B7C4C1"/>
<text x="265" y="30" text-anchor="middle" font-weight="700" font-size="15">Active transport</text>
<text x="193" y="60" font-size="12" font-style="italic">outside</text><text x="193" y="362" font-size="12" font-style="italic">cytoplasm</text>
<rect x="360" y="40" width="160" height="330" rx="10" fill="none" stroke="#B7C4C1"/>
<text x="440" y="30" text-anchor="middle" font-weight="700" font-size="15">Endocytosis</text>
<text x="368" y="60" font-size="12" font-style="italic">outside</text><text x="368" y="362" font-size="12" font-style="italic">cytoplasm</text>
