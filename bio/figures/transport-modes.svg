<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="t d">
<title id="t">Passive transport, active transport and bulk transport</title>
<desc id="d">Four panels, each with the outside of the cell above a membrane and the cytoplasm below. Passive transport: particles are crowded outside and sparse inside, and they move down their gradient into the cell with no ATP. Active transport: particles are sparse outside and crowded inside, and a transport protein uses energy from ATP to move more of them in, against the gradient. Endocytosis: the membrane folds inward around a large particle and pinches off as a vesicle. Exocytosis: a vesicle inside the cell fuses with the membrane and releases its contents outside.</desc>
<rect width="700" height="430" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2A28"/></marker></defs>
