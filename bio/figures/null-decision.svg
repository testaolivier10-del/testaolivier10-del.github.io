<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">Deciding about the null hypothesis</title>
<desc id="d">A flowchart. Before the experiment: null hypothesis, temperature has no effect on leakage; alternative, it does. Collect data. Is the difference between groups much larger than the spread within groups? Yes: reject the null, the data support the alternative. No: fail to reject the null, the data do not show an effect. Neither branch proves a hypothesis.</desc>
<rect width="640" height="340" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2A28"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#1F2A28">
  <rect x="20" y="16" width="290" height="70" rx="8" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2"/>
  <text x="165" y="40" font-weight="700">H₀ (null)</text><text x="165" y="62">temperature has no effect</text><text x="165" y="78">on leakage</text>
  <rect x="330" y="16" width="290" height="70" rx="8" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <text x="475" y="40" font-weight="700">H₁ (alternative)</text><text x="475" y="62">temperature affects</text><text x="475" y="78">leakage</text>
  <line x1="320" y1="90" x2="320" y2="112" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="114" width="240" height="34" rx="8" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="320" y="136">collect data (repeated trials)</text>
  <line x1="320" y1="150" x2="320" y2="170" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <path d="M320 172 L470 207 L320 242 L170 207 Z" fill="#ffffff" stroke="#1F2A28" stroke-width="2"/>
  <text x="320" y="202">gap between groups much</text><text x="320" y="220">larger than spread within?</text>
  <line x1="170" y1="207" x2="110" y2="207" stroke="#1F2A28" stroke-width="2"/><line x1="110" y1="207" x2="110" y2="256" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="207" x2="530" y2="207" stroke="#1F2A28" stroke-width="2"/><line x1="530" y1="207" x2="530" y2="256" stroke="#1F2A28" stroke-width="2" marker-end="url(#a)"/>
  <text x="140" y="198" font-weight="700">yes</text><text x="500" y="198" font-weight="700">no</text>
  <rect x="20" y="258" width="250" height="62" rx="8" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
  <text x="145" y="282" font-weight="700" fill="#8E3B2E">reject H₀</text><text x="145" y="304">data support H₁</text>
  <rect x="370" y="258" width="250" height="62" rx="8" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="2"/>
  <text x="495" y="282" font-weight="700" fill="#3D4A66">fail to reject H₀</text><text x="495" y="304">data do not show an effect</text>
  <text x="320" y="336" font-size="13" fill="#5D6B69">Never "accept H₀" or "prove H₁"</text>
</g>
</svg>
