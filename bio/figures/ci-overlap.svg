<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">Reading 95% confidence interval error bars</title>
<desc id="d">Two panels of means with 95% confidence interval error bars. Left: bars for groups A and B do not overlap; label "likely a real difference: reject the null". Right: bars for groups C and D overlap; label "data do not show a difference: fail to reject the null".</desc>
<rect width="640" height="340" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#1F2A28">
  <line x1="40" y1="260" x2="300" y2="260" stroke="#1F2A28" stroke-width="2"/><line x1="40" y1="40" x2="40" y2="260" stroke="#1F2A28" stroke-width="2"/>
  <line x1="340" y1="260" x2="600" y2="260" stroke="#1F2A28" stroke-width="2"/><line x1="340" y1="40" x2="340" y2="260" stroke="#1F2A28" stroke-width="2"/>
  <rect x="80" y="180" width="60" height="80" fill="#C3DDF0" stroke="#0072B2" stroke-width="2"/>
  <rect x="190" y="100" width="60" height="160" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
  <rect x="380" y="150" width="60" height="110" fill="#C3DDF0" stroke="#0072B2" stroke-width="2"/>
  <rect x="490" y="120" width="60" height="140" fill="#F6D2BD" stroke="#D55E00" stroke-width="2"/>
  <g stroke="#1F2A28" stroke-width="2.5" fill="none">
    <path d="M110 155V205M100 155h20M100 205h20"/>
    <path d="M220 75V125M210 75h20M210 125h20"/>
    <path d="M410 105V195M400 105h20M400 195h20"/>
    <path d="M520 80V160M510 80h20M510 160h20"/>
  </g>
  <line x1="40" y1="155" x2="300" y2="155" stroke="#5D6B69" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="40" y1="125" x2="300" y2="125" stroke="#5D6B69" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="340" y="105" width="260" height="55" fill="#E69F00" opacity="0.18"/>
  <text x="110" y="280">A</text><text x="220" y="280">B</text><text x="410" y="280">C</text><text x="520" y="280">D</text>
  <text x="170" y="304" font-weight="700" fill="#8E3B2E">no overlap</text>
  <text x="170" y="324">likely a real difference: reject H₀</text>
  <text x="470" y="304" font-weight="700" fill="#3D4A66">overlap (shaded)</text>
  <text x="470" y="324">difference not shown: fail to reject H₀</text>
  <text x="320" y="24" font-size="13" fill="#5D6B69">Error bars = 95% confidence interval (mean ± 2SE)</text>
</g>
</svg>
