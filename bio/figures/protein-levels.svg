<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d">
<title id="t">Four levels of protein structure</title>
<desc id="d">Primary: a chain of colored beads, each an amino acid. Secondary: a coiled alpha helix and a zigzag beta pleated sheet whose strands are joined by dashed hydrogen bonds. Tertiary: one chain folded into a compact shape, with nonpolar side chains clustered inside, an ionic bond and a disulfide bridge labeled. Quaternary: four folded chains packed together.</desc>
