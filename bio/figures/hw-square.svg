<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d">
<title id="t">Hardy-Weinberg genotype frequencies as areas</title>
<desc id="d">A square divided by allele frequencies p = 0.7 and q = 0.3 along each side. The areas show genotype frequencies: AA is p² = 0.49, each Aa rectangle is pq = 0.21 for a total 2pq = 0.42, and aa is q² = 0.09. A note says to start from the aa corner: q² is the only genotype you can read from phenotypes.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle" fill="#1F2A28">
  <rect x="80" y="50" width="196" height="196" fill="#F1DAE7" stroke="#CC79A7" stroke-width="2"/>
  <rect x="276" y="50" width="84" height="196" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <rect x="80" y="246" width="196" height="84" fill="#F8E3B8" stroke="#E69F00" stroke-width="2"/>
  <rect x="276" y="246" width="84" height="84" fill="#E1E6F0" stroke="#5B6B8C" stroke-width="3"/>
  <text x="178" y="140" font-weight="700">AA</text><text x="178" y="164">p² = 0.49</text>
  <text x="318" y="140" font-weight="700">Aa</text><text x="318" y="164">pq = 0.21</text>
  <text x="178" y="282" font-weight="700">Aa</text><text x="178" y="306">pq = 0.21</text>
  <text x="318" y="282" font-weight="700">aa</text><text x="318" y="306">0.09</text>
  <text x="178" y="38">A: p = 0.7</text><text x="318" y="38">a: q = 0.3</text>
  <text x="56" y="152" transform="rotate(-90 56 152)">A: p = 0.7</text><text x="56" y="290" transform="rotate(-90 56 290)">a: q = 0.3</text>
  <rect x="390" y="50" width="235" height="280" rx="10" fill="#EEF2F1" stroke="#5D6B69" stroke-width="2"/>
  <text x="507" y="78" font-weight="700">Genotype frequencies</text>
  <text x="507" y="106">AA: p² = 0.49</text>
  <text x="507" y="130">Aa: 2pq = 0.42</text>
  <text x="507" y="154">aa: q² = 0.09</text>
  <text x="507" y="178" font-size="13" fill="#5D6B69">sum = 1</text>
  <line x1="405" y1="194" x2="610" y2="194" stroke="#5D6B69"/>
  <text x="507" y="222" font-weight="700" fill="#3D4A66">Start at aa:</text>
  <text x="507" y="246">recessive phenotype = q²</text>
  <text x="507" y="270">q = √0.09 = 0.3</text>
  <text x="507" y="294">p = 1 − q = 0.7</text>
</g>
</svg>
