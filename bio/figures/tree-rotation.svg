<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="rot-t rot-d"><title id="rot-t">One tree, three drawings</title><desc id="rot-d">Three drawings of the same tree of five animals. In every drawing the crocodile and sparrow are sister taxa, the lizard is their closest relative, the mouse joins next, and the frog branches off first. Drawing 1 lists the tips frog, mouse, lizard, crocodile, sparrow; drawing 2 lists frog, lizard, sparrow, crocodile, mouse; drawing 3 lists crocodile, sparrow, lizard, mouse, frog. Only the order of the tips differs, because branches were rotated around their nodes; the relationships are identical.</desc><rect width="760" height="250" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif" fill="#1F2A28"><g transform="translate(0,0)"><rect x="4" y="6" width="240" height="214" rx="8" fill="#EEF2F1" stroke="#5D6B69"/><text x="124" y="28" font-size="14" font-weight="700" text-anchor="middle">Drawing 1</text><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="112" y1="142" x2="112" y2="176"/><line x1="112" y1="142" x2="142" y2="142"/><line x1="112" y1="176" x2="142" y2="176"/><line x1="82" y1="108" x2="82" y2="159"/><line x1="82" y1="108" x2="142" y2="108"/><line x1="82" y1="159" x2="112" y2="159"/><line x1="52" y1="74" x2="52" y2="133.5"/><line x1="52" y1="74" x2="142" y2="74"/><line x1="52" y1="133.5" x2="82" y2="133.5"/><line x1="22" y1="40" x2="22" y2="103.75"/><line x1="22" y1="40" x2="142" y2="40"/><line x1="22" y1="103.75" x2="52" y2="103.75"/><line x1="10" y1="71.875" x2="22" y2="71.875"/></g><text x="150" y="45" font-size="15">frog</text><text x="150" y="79" font-size="15">mouse</text><text x="150" y="113" font-size="15">lizard</text><text x="150" y="147" font-size="15">crocodile</text><text x="150" y="181" font-size="15">sparrow</text></g><g transform="translate(252,0)"><rect x="4" y="6" width="240" height="214" rx="8" fill="#EEF2F1" stroke="#5D6B69"/><text x="124" y="28" font-size="14" font-weight="700" text-anchor="middle">Drawing 2</text><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="112" y1="108" x2="112" y2="142"/><line x1="112" y1="108" x2="142" y2="108"/><line x1="112" y1="142" x2="142" y2="142"/><line x1="82" y1="74" x2="82" y2="125"/><line x1="82" y1="74" x2="142" y2="74"/><line x1="82" y1="125" x2="112" y2="125"/><line x1="52" y1="99.5" x2="52" y2="176"/><line x1="52" y1="99.5" x2="82" y2="99.5"/><line x1="52" y1="176" x2="142" y2="176"/><line x1="22" y1="40" x2="22" y2="137.75"/><line x1="22" y1="40" x2="142" y2="40"/><line x1="22" y1="137.75" x2="52" y2="137.75"/><line x1="10" y1="88.875" x2="22" y2="88.875"/></g><text x="150" y="45" font-size="15">frog</text><text x="150" y="79" font-size="15">lizard</text><text x="150" y="113" font-size="15">sparrow</text><text x="150" y="147" font-size="15">crocodile</text><text x="150" y="181" font-size="15">mouse</text></g><g transform="translate(504,0)"><rect x="4" y="6" width="240" height="214" rx="8" fill="#EEF2F1" stroke="#5D6B69"/><text x="124" y="28" font-size="14" font-weight="700" text-anchor="middle">Drawing 3</text><g stroke="#1F2A28" stroke-width="2.5" stroke-linecap="square"><line x1="112" y1="40" x2="112" y2="74"/><line x1="112" y1="40" x2="142" y2="40"/><line x1="112" y1="74" x2="142" y2="74"/><line x1="82" y1="57" x2="82" y2="108"/><line x1="82" y1="57" x2="112" y2="57"/><line x1="82" y1="108" x2="142" y2="108"/><line x1="52" y1="82.5" x2="52" y2="142"/><line x1="52" y1="82.5" x2="82" y2="82.5"/><line x1="52" y1="142" x2="142" y2="142"/><line x1="22" y1="112.25" x2="22" y2="176"/><line x1="22" y1="112.25" x2="52" y2="112.25"/><line x1="22" y1="176" x2="142" y2="176"/><line x1="10" y1="144.125" x2="22" y2="144.125"/></g><text x="150" y="45" font-size="15">crocodile</text><text x="150" y="79" font-size="15">sparrow</text><text x="150" y="113" font-size="15">lizard</text><text x="150" y="147" font-size="15">mouse</text><text x="150" y="181" font-size="15">frog</text></g><text x="380" y="242" font-size="13" text-anchor="middle">Same branching, three drawings: spinning branches around a node changes nothing.</text></g></svg>
