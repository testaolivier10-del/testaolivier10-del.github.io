<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="ctt-t ctt-d">
<title id="ctt-t">Transcription and translation in bacteria and in eukaryotes</title>
<desc id="ctt-d">Left, a bacterium: the DNA lies in the cytoplasm. An RNA polymerase moves along a gene making mRNA, and while the mRNA is still being made, several ribosomes have attached to its free 5-prime end and are already building polypeptides, the ribosomes farther along carrying longer chains. A string of ribosomes on one mRNA is a polyribosome. Right, a eukaryotic cell: transcription and processing happen in the nucleus; only finished mRNA leaves through a nuclear pore, and a polyribosome forms on it in the cytoplasm. The two steps are separated in space and time.</desc>
<defs><marker id="ctt-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
