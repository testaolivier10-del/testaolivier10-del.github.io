<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="mut-t mut-d">
<title id="mut-t">Kinds of point mutation and their effects on the protein</title>
<desc id="mut-d">Six versions of the same short mRNA, each split into codons with the amino acid below each codon. Normal: AUG GCA UGG GAA CUA AAU GGC UAA codes for Met-Ala-Trp-Glu-Leu-Asn-Gly, then stop. Silent: GAA becomes GAG, still glutamic acid, so the chain is unchanged. Missense: GAA becomes GUA, so valine replaces glutamic acid. Nonsense: UGG becomes UGA, a stop codon, so the chain is Met-Ala only. Frameshift: deleting the U at position 7 regroups every later base, giving Met-Ala-Gly-Asn and then an early stop. In-frame insertion: adding AAG after position 12 adds one lysine and leaves the later codons unchanged.</desc>
<defs><marker id="mut-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F2A28"/></marker></defs>
