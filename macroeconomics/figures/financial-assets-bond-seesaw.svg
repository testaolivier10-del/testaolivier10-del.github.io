<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Interest rates and bond prices move in opposite directions</title>
<desc id="d">Two panels. Left: when market interest rates rise, the price of an existing bond falls, because new bonds pay more than the old one. Right: when market interest rates fall, the price of an existing bond rises, because the old bond pays more than new ones.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<rect x="20" y="20" width="340" height="290" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="190" y="52" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Market interest rates rise</text><text x="120" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">Interest rates</text><text x="260" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">Price of an</text><text x="260" y="110" font-size="15" fill="#1F2A28" text-anchor="middle">existing bond</text><line x1="120" y1="220" x2="120" y2="130" stroke="#355A0A" stroke-width="6" marker-end="url(#arrG)"/><line x1="260" y1="130" x2="260" y2="220" stroke="#D55E00" stroke-width="6" marker-end="url(#arrV)"/><text x="190" y="258" font-size="14" fill="#5B6662" text-anchor="middle">New bonds pay more than the old one,</text><text x="190" y="276.9" font-size="14" fill="#5B6662" text-anchor="middle">so buyers pay less for the old bond.</text><rect x="400" y="20" width="340" height="290" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="570" y="52" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Market interest rates fall</text><text x="500" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">Interest rates</text><text x="640" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">Price of an</text><text x="640" y="110" font-size="15" fill="#1F2A28" text-anchor="middle">existing bond</text><line x1="500" y1="130" x2="500" y2="220" stroke="#355A0A" stroke-width="6" marker-end="url(#arrG)"/><line x1="640" y1="220" x2="640" y2="130" stroke="#D55E00" stroke-width="6" marker-end="url(#arrV)"/><text x="570" y="258" font-size="14" fill="#5B6662" text-anchor="middle">The old bond pays more than new ones,</text><text x="570" y="276.9" font-size="14" fill="#5B6662" text-anchor="middle">so buyers pay more for the old bond.</text>
</svg>
