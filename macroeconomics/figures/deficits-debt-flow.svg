<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="deficits-debt-flow-t deficits-debt-flow-d" font-family="Arial, Helvetica, sans-serif">
<title id="deficits-debt-flow-t">Budget deficits and the national debt over four years</title>
<desc id="deficits-debt-flow-d">A bar chart of an invented national debt that starts at 1,000 billion dollars. A deficit of 100 in Year 1 raises it to 1,100; a deficit of 70 in Year 2 raises it to 1,170; a surplus of 20 in Year 3 lowers it to 1,150; a deficit of 140 in Year 4 raises it to 1,290.</desc>
<defs><marker id="deficits-debt-flow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="deficits-debt-flow-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="deficits-debt-flow-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="deficits-debt-flow-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="30" font-size="17" font-weight="bold" fill="#1F2A28" text-anchor="middle">Each year’s deficit adds to the debt; a surplus subtracts (invented numbers)</text><path d="M90 70V350H690" fill="none" stroke="#1F2A28" stroke-width="2"/><text transform="translate(38 210) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="middle">Billions of dollars</text><text x="82" y="354" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="90" y1="350" x2="690" y2="350" stroke="#DDE2E0" stroke-width="1"/><text x="82" y="274" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">400</text><line x1="90" y1="270" x2="690" y2="270" stroke="#DDE2E0" stroke-width="1"/><text x="82" y="194" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">800</text><line x1="90" y1="190" x2="690" y2="190" stroke="#DDE2E0" stroke-width="1"/><text x="82" y="114" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">1200</text><line x1="90" y1="110" x2="690" y2="110" stroke="#DDE2E0" stroke-width="1"/><text x="100" y="144" font-size="12" font-weight="normal" fill="#6B7672" text-anchor="start">Debt at the start: 1,000</text><line x1="90" y1="150" x2="170" y2="150" stroke="#6B7672" stroke-width="2" stroke-dasharray="5 4"/><rect x="239" y="130" width="52" height="220" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="265" y="122" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">1,100</text><text x="265" y="370" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Year 1</text><text x="265" y="388" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">deficit 100</text><rect x="364" y="116" width="52" height="234" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="390" y="108" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">1,170</text><text x="390" y="370" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Year 2</text><text x="390" y="388" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">deficit 70</text><rect x="489" y="120" width="52" height="230" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="515" y="112" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">1,150</text><text x="515" y="370" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Year 3</text><text x="515" y="388" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="middle">surplus 20</text><rect x="614" y="92" width="52" height="258" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="640" y="84" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">1,290</text><text x="640" y="370" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Year 4</text><text x="640" y="388" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">deficit 140</text>
</svg>
