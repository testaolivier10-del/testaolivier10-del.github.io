<line x1="105" y1="159.2" x2="110" y2="159.2" stroke="#1F2A28" stroke-width="2"/>
<text x="101" y="164.2" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="101" dy="0">$200</tspan></text>
