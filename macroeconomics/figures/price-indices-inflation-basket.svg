<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="price-indices-inflation-basket-t price-indices-inflation-basket-d" font-family="Arial, Helvetica, sans-serif">
<title id="price-indices-inflation-basket-t">A market basket and the consumer price index</title>
<desc id="price-indices-inflation-basket-d">A bar chart of invented data: the cost of the same market basket was $200, $220, $242 in 2024 (base), 2025, 2026. Divided by the base-year cost and multiplied by 100, the consumer price index is 100, 110, 121. The inflation rate from 2024 to 2025 is 10 percent and from 2025 to 2026 is also 10 percent, even though the index rose 10 points and then 11 points.</desc>
<defs><marker id="price-indices-inflation-basket-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="price-indices-inflation-basket-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="price-indices-inflation-basket-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="price-indices-inflation-basket-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="820" height="460" fill="#FFFFFF"/>
<text x="410" y="30" font-size="17" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="410" dy="0">Same basket, three years: the CPI compares each cost with the base year</tspan></text>
<line x1="110" y1="390" x2="760" y2="390" stroke="#1F2A28" stroke-width="2"/>
