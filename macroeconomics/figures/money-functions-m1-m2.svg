<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">M1 and M2: what counts as money</title>
<desc id="d">Nested boxes. M1, inside M2, holds currency held by the public, checkable deposits and savings deposits, which the Federal Reserve has counted in M1 since May 2020. M2 adds small time deposits under 100,000 dollars and retail money market funds. A separate box lists what is not money: credit cards, stocks and bonds, and houses, cars and gold.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<rect x="20" y="20" width="470" height="320" rx="8" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="40" y="52" font-size="22" fill="#355A0A" font-weight="700">M2</text><rect x="45" y="70" width="250" height="190" rx="8" fill="#FFFFFF" stroke="#355A0A" stroke-width="2"/><text x="65" y="102" font-size="22" fill="#355A0A" font-weight="700">M1</text><text x="65" y="134" font-size="14" fill="#1F2A28">Currency held by the public</text><text x="65" y="152.9" font-size="14" fill="#1F2A28">Checkable deposits</text><text x="65" y="171.8" font-size="14" fill="#1F2A28">Savings deposits (counted in</text><text x="65" y="190.7" font-size="14" fill="#1F2A28">M1 since May 2020)</text><text x="312" y="100" font-size="14" fill="#1F2A28">Plus:</text><text x="312" y="118.9" font-size="14" fill="#1F2A28">Small time deposits</text><text x="312" y="137.8" font-size="14" fill="#1F2A28">(certificates of deposit</text><text x="312" y="156.7" font-size="14" fill="#1F2A28">under $100,000)</text><text x="312" y="175.6" font-size="14" fill="#1F2A28">Retail money market</text><text x="312" y="194.5" font-size="14" fill="#1F2A28">funds</text><text x="45" y="300" font-size="14" fill="#5B6662">M2 is M1 plus less liquid near-monies.</text><rect x="515" y="20" width="225" height="320" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="627" y="52" font-size="18" fill="#1F2A28" text-anchor="middle" font-weight="700">Not money</text><text x="535" y="90" font-size="14" fill="#1F2A28">Credit cards (a way to</text><text x="535" y="108.9" font-size="14" fill="#1F2A28">borrow money)</text><text x="535" y="127.8" font-size="14" fill="#1F2A28"></text><text x="535" y="146.7" font-size="14" fill="#1F2A28">Stocks and bonds</text><text x="535" y="165.6" font-size="14" fill="#1F2A28">(financial assets you</text><text x="535" y="184.5" font-size="14" fill="#1F2A28">sell for money first)</text><text x="535" y="203.4" font-size="14" fill="#1F2A28"></text><text x="535" y="222.3" font-size="14" fill="#1F2A28">Houses, cars, gold</text>
</svg>
