<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="axes-points-plane-t axes-points-plane-d" font-family="Arial, Helvetica, sans-serif">
<title id="axes-points-plane-t">Reading points on a labeled graph</title>
<desc id="axes-points-plane-d">A graph with Hours studied on the horizontal axis and Test score on the vertical axis. Three points with dashed lines to both axes: Q at 2 hours and a score of 60, R at 5 hours and 75, T at 8 hours and 85. The points rise to the right: a direct relationship. Invented data for practice.</desc>
<defs><marker id="axes-points-plane-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="axes-points-plane-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="axes-points-plane-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="axes-points-plane-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="640" height="410" fill="#FFFFFF"/>
<line x1="90" y1="24" x2="90" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="90" y1="330" x2="556" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="550" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Hours studied</text>
<text x="56" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 56 30)">Test score</text>
<text x="90" y="348" font-size="12" fill="#6B7370" text-anchor="middle">0</text>
<text x="182" y="348" font-size="12" fill="#6B7370" text-anchor="middle">2</text>
<text x="274" y="348" font-size="12" fill="#6B7370" text-anchor="middle">4</text>
<text x="366" y="348" font-size="12" fill="#6B7370" text-anchor="middle">6</text>
<text x="458" y="348" font-size="12" fill="#6B7370" text-anchor="middle">8</text>
<text x="550" y="348" font-size="12" fill="#6B7370" text-anchor="middle">10</text>
<text x="82" y="334" font-size="12" fill="#6B7370" text-anchor="end">40</text>
<text x="82" y="214" font-size="12" fill="#6B7370" text-anchor="end">60</text>
<text x="82" y="124" font-size="12" fill="#6B7370" text-anchor="end">75</text>
<text x="82" y="64" font-size="12" fill="#6B7370" text-anchor="end">85</text>
<line x1="90" y1="210" x2="182" y2="210" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="182" y1="210" x2="182" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="182" cy="210" r="5" fill="#355A0A"/>
<text x="192" y="202" font-size="14" fill="#355A0A" font-weight="700">Q (2, 60)</text>
<line x1="90" y1="120" x2="320" y2="120" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="320" y1="120" x2="320" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="320" cy="120" r="5" fill="#355A0A"/>
<text x="330" y="112" font-size="14" fill="#355A0A" font-weight="700">R (5, 75)</text>
<line x1="90" y1="60" x2="458" y2="60" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="458" y1="60" x2="458" y2="330" stroke="#6B7370" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="458" cy="60" r="5" fill="#355A0A"/>
<text x="468" y="52" font-size="14" fill="#355A0A" font-weight="700">T (8, 85)</text>
<text x="330" y="400" font-size="13" fill="#6B7370" text-anchor="middle">Each point is one pair of values: read across to the horizontal axis, up to the vertical axis.</text>
</svg>
