<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="foreign-exchange-market-mirror-t foreign-exchange-market-mirror-d" font-family="Arial, Helvetica, sans-serif">
<title id="foreign-exchange-market-mirror-t">The market for euros and the market for dollars</title>
<desc id="foreign-exchange-market-mirror-d">Two foreign exchange graphs side by side. Left: the market for euros, with Quantity of euros on the horizontal axis and Price of the euro (dollars per euro) on the vertical axis, a downward demand curve and an upward supply curve crossing at E1, with exchange rate XR1 and quantity Q1. Right: the market for dollars, with Quantity of dollars and Price of the dollar (euros per dollar). Notes: demand for euros comes from people buying European goods, services and assets; supply of euros from Europeans buying American ones; more demand for euros is the same trades as more supply of dollars.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="860" height="470" fill="#FFFFFF"/>
<text x="215" y="44" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">The market for euros</text><path d="M90 60V280H340" fill="none" stroke="#1F2A28" stroke-width="1.8"/><text x="340" y="316" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Quantity of euros</text><text transform="translate(56 60) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price of the euro (dollars per euro)</text><path d="M110 77.6L320 262.4" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/><text x="325" y="274.4" font-size="13" font-weight="bold" fill="#355A0A">D<tspan font-size="10" dy="3">€</tspan></text><path d="M110 262.4L320 77.6" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/><text x="325" y="77.6" font-size="13" font-weight="bold" fill="#1F5C8A">S<tspan font-size="10" dy="3">€</tspan></text><path d="M90 170H215V280" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="215" cy="170" r="4.5" fill="#1F2A28"/><text x="223" y="163" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">E1</text><text x="84" y="174" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">XR1</text><text x="215" y="296" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Q1</text><text x="655" y="44" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">The market for dollars</text><path d="M530 60V280H780" fill="none" stroke="#1F2A28" stroke-width="1.8"/><text x="780" y="316" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Quantity of dollars</text><text transform="translate(496 60) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price of the dollar (euros per dollar)</text><path d="M550 77.6L760 262.4" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/><text x="765" y="274.4" font-size="13" font-weight="bold" fill="#355A0A">D<tspan font-size="10" dy="3">$</tspan></text><path d="M550 262.4L760 77.6" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/><text x="765" y="77.6" font-size="13" font-weight="bold" fill="#1F5C8A">S<tspan font-size="10" dy="3">$</tspan></text><path d="M530 170H655V280" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="655" cy="170" r="4.5" fill="#1F2A28"/><text x="663" y="163" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">E1</text><text x="524" y="174" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">XR1</text><text x="655" y="296" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Q1</text><rect x="40" y="340" width="380" height="108" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="230" y="365.4" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">Who is on each side of the euro market</text><text x="230" y="381.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Demand for euros: Americans (and others) buying</text><text x="230" y="398.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">European goods, services and assets.</text><text x="230" y="414.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Supply of euros: Europeans buying American goods,</text><text x="230" y="431.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">services and assets with their euros.</text><rect x="480" y="340" width="360" height="108" rx="10" fill="#E5EEF6" stroke="#1F5C8A" stroke-width="1.6"/><text x="660" y="365.4" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">The same trades, seen as dollars</text><text x="660" y="381.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Americans buying euros supply dollars.</text><text x="660" y="398.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Europeans selling euros demand dollars.</text><text x="660" y="414.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">So more demand for euros is more supply</text><text x="660" y="431.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">of dollars: one change, two mirror graphs.</text>
</svg>
