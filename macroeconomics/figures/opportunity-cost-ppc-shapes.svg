<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360" role="img" aria-labelledby="opportunity-cost-ppc-shapes-t opportunity-cost-ppc-shapes-d" font-family="Arial, Helvetica, sans-serif">
<title id="opportunity-cost-ppc-shapes-t">Straight and bowed-out production possibilities curves</title>
<desc id="opportunity-cost-ppc-shapes-d">Left: a straight-line PPC between bread and cake, constant opportunity cost, each extra loaf costs the same amount of cake. Right: a bowed-out PPC, increasing opportunity cost, each extra loaf costs more cake than the one before, because resources are not equally good at making both.</desc>
<defs><marker id="opportunity-cost-ppc-shapes-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="opportunity-cost-ppc-shapes-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="opportunity-cost-ppc-shapes-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="opportunity-cost-ppc-shapes-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="740" height="360" fill="#FFFFFF"/>
<text x="195" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Constant opportunity cost</text>
<line x1="70" y1="44" x2="70" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="70" y1="270" x2="326" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="320" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Bread</text>
<text x="36" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 36 50)">Cake</text>
<line x1="70" y1="94" x2="270" y2="270" stroke="#355A0A" stroke-width="3"/><text x="276" y="262" font-size="15" fill="#355A0A" font-weight="700">PPC</text>
<text x="195" y="330" font-size="12" fill="#6B7370" text-anchor="middle">A straight line: each extra loaf costs</text>
<text x="195" y="346" font-size="12" fill="#6B7370" text-anchor="middle">the same amount of cake.</text>
<text x="555" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Increasing opportunity cost</text>
<line x1="430" y1="44" x2="430" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="430" y1="270" x2="686" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="680" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Bread</text>
<text x="396" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 396 50)">Cake</text>
<path d="M430 94L433.5 94L437 94.1L440.5 94.2L444 94.4L447.4 94.7L450.9 95L454.4 95.3L457.8 95.7L461.3 96.2L464.7 96.7L468.2 97.2L471.6 97.8L475 98.5L478.4 99.2L481.8 100L485.1 100.8L488.5 101.7L491.8 102.6L495.1 103.6L498.4 104.6L501.7 105.7L504.9 106.8L508.1 108L511.3 109.2L514.5 110.5L517.7 111.8L520.8 113.2L523.9 114.6L527 116.1L530 117.6L533 119.1L536 120.7L538.9 122.4L541.8 124.1L544.7 125.8L547.6 127.6L550.4 129.4L553.1 131.3L555.9 133.2L558.6 135.2L561.2 137.2L563.8 139.2L566.4 141.3L568.9 143.4L571.4 145.5L573.9 147.7L576.3 150L578.6 152.2L580.9 154.5L583.2 156.9L585.4 159.2L587.6 161.6L589.7 164.1L591.8 166.5L593.8 169.1L595.8 171.6L597.7 174.1L599.6 176.7L601.4 179.4L603.2 182L604.9 184.7L606.6 187.4L608.2 190.1L609.8 192.8L611.3 195.6L612.7 198.4L614.1 201.2L615.4 204.1L616.7 206.9L617.9 209.8L619.1 212.7L620.2 215.6L621.3 218.5L622.3 221.5L623.2 224.4L624.1 227.4L624.9 230.4L625.6 233.4L626.3 236.4L627 239.4L627.5 242.5L628.1 245.5L628.5 248.6L628.9 251.6L629.2 254.7L629.5 257.7L629.7 260.8L629.9 263.9L630 266.9L630 270" fill="none" stroke="#355A0A" stroke-width="3"/>
<text x="585" y="142.4" font-size="14" fill="#355A0A" font-weight="700">PPC</text>
<text x="555" y="330" font-size="12" fill="#6B7370" text-anchor="middle">Bowed out: each extra loaf costs</text>
<text x="555" y="346" font-size="12" fill="#6B7370" text-anchor="middle">more cake than the one before.</text>
</svg>
