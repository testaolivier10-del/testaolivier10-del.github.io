<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-labelledby="supply-curve-shift-t supply-curve-shift-d" font-family="Arial, Helvetica, sans-serif">
<title id="supply-curve-shift-t">A change in quantity supplied versus a change in supply</title>
<desc id="supply-curve-shift-d">A supply curve S1 for bicycles, with an arrow along it from J to K: a higher price raises the quantity supplied. A second curve S2 to the left, with an arrow from S1: a decrease in supply, caused by higher input costs, a new tax, fewer sellers or a change in expectations.</desc>
<defs><marker id="supply-curve-shift-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="supply-curve-shift-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="supply-curve-shift-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="supply-curve-shift-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="800" height="370" fill="#FFFFFF"/>
<line x1="90" y1="24" x2="90" y2="330" stroke="#1F2A28" stroke-width="2"/>
<line x1="90" y1="330" x2="516" y2="330" stroke="#1F2A28" stroke-width="2"/>
<text x="510" y="368" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity of bicycles</text>
<text x="56" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 56 30)">Price</text>
<line x1="174" y1="300" x2="489" y2="75" stroke="#6B7370" stroke-width="2.5" stroke-dasharray="7 5"/><text x="495" y="79" font-size="15" fill="#6B7370" font-weight="700">S<tspan font-size="11" dy="4">1</tspan></text>
<line x1="111" y1="255" x2="405" y2="45" stroke="#355A0A" stroke-width="3"/><text x="411" y="59" font-size="15" fill="#355A0A" font-weight="700">S<tspan font-size="11" dy="4">2</tspan></text>
<circle cx="258" cy="240" r="5" fill="#D55E00"/>
<text x="267" y="254" font-size="14" fill="#D55E00" font-weight="700">J</text>
<circle cx="384" cy="150" r="5" fill="#D55E00"/>
<text x="393" y="164" font-size="14" fill="#D55E00" font-weight="700">K</text>
<line x1="274.8" y1="228" x2="367.2" y2="162" stroke="#D55E00" stroke-width="2" marker-end="url(#supply-curve-shift-arV)"/>
<line x1="350.4" y1="234" x2="283.2" y2="234" stroke="#355A0A" stroke-width="2.4" marker-end="url(#supply-curve-shift-arA)"/>
<text x="540" y="70" font-size="13" fill="#D55E00">J to K: the price rises, so the</text>
<text x="540" y="88" font-size="13" fill="#D55E00">quantity supplied rises</text>
<text x="540" y="106" font-size="13" fill="#D55E00">(a movement along S1)</text>
<text x="540" y="150" font-size="13" fill="#355A0A" font-weight="700">S1 to S2: supply decreases</text>
<text x="540" y="168" font-size="13" fill="#355A0A">(a shift left): input costs rose,</text>
<text x="540" y="186" font-size="13" fill="#355A0A">a new tax, fewer sellers, or</text>
<text x="540" y="204" font-size="13" fill="#355A0A">expectations changed</text>
</svg>
