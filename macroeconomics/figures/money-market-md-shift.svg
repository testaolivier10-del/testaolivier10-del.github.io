<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The money market: a rise in money demand raises the nominal interest rate</title>
<desc id="d">A money market graph. The vertical axis is the nominal interest rate and the horizontal axis is the quantity of money. The money supply curve MS is vertical. Money demand shifts right from MD1 to MD2, so the equilibrium nominal interest rate rises from i1 to i2 while the quantity of money stays the same.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="520" height="400" fill="#FFFFFF"/>
<line x1="90" y1="330" x2="90" y2="24" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><line x1="90" y1="330" x2="456" y2="330" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="374" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity of money</text><text x="40" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 40 30)">Nominal interest rate (i)</text><line x1="270" y1="42" x2="270" y2="330" stroke="#1F2A28" stroke-width="2.5"/><text x="278" y="51" font-size="15" fill="#1F2A28" font-weight="700">MS</text><path d="M126 90L414 282" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="418" y="286" font-size="15" fill="#1F2A28" font-weight="700">MD<tspan font-size="11" dy="4">1</tspan></text><path d="M176.4 60L450 242.4" fill="none" stroke="#0072B2" stroke-width="2.5"/><text x="435.6" y="220" font-size="15" fill="#0072B2" font-weight="700">MD<tspan font-size="11" dy="4">2</tspan></text><line x1="327.6" y1="144" x2="370.8" y2="114" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrV)"/><line x1="90" y1="186" x2="270" y2="186" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="270" y1="186" x2="270" y2="330" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><text x="82" y="191" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">i<tspan font-size="10" dy="4">1</tspan></text><line x1="90" y1="122.4" x2="270" y2="122.4" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="270" y1="122.4" x2="270" y2="330" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><text x="82" y="127.4" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">i<tspan font-size="10" dy="4">2</tspan></text><circle cx="270" cy="186" r="5" fill="#1F2A28"/><circle cx="270" cy="122.4" r="5" fill="#0072B2"/><text x="270" y="348" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">M</tspan></text>
</svg>
