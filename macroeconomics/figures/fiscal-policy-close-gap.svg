<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-labelledby="fiscal-policy-close-gap-t fiscal-policy-close-gap-d" font-family="Arial, Helvetica, sans-serif">
<title id="fiscal-policy-close-gap-t">Expansionary fiscal policy closes a recessionary gap</title>
<desc id="fiscal-policy-close-gap-d">An AD-AS graph with a vertical LRAS at YF. AD1 crosses SRAS at Y1, below YF, at PL1. Higher government spending or lower taxes shift AD1 right to AD2, which crosses SRAS on LRAS at YF and a higher price level PL2.</desc>
<defs><marker id="fiscal-policy-close-gap-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker></defs>
<rect width="420" height="360" fill="#FFFFFF"/>
<text x="220" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A28">Spending up or taxes down: AD shifts right</text>
<path d="M80 40V280H360" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="360" y="314" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Real GDP</text>
<text transform="translate(50 40) rotate(-90)" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Price level</text>
<path d="M220 49.6V280" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/>
<text x="225" y="61.6" text-anchor="start" font-size="13" font-weight="700" fill="#1F5C8A">LRAS</text>
<path d="M102.4 260.8L337.6 59.2" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/>
<text x="341.6" y="57.2" text-anchor="start" font-size="13" font-weight="700" fill="#355A0A">SRAS</text>
<path d="M88.4 95.2L281.6 260.8" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="285.6" y="272.8" text-anchor="start" font-size="13" font-weight="700" fill="#6B7472">AD<tspan font-size="10" dy="3">1</tspan></text>
<path d="M102.4 59.2L337.6 260.8" fill="none" stroke="#9A4A00" stroke-width="2.8" stroke-linecap="round"/>
<text x="341.6" y="272.8" text-anchor="start" font-size="13" font-weight="700" fill="#9A4A00">AD<tspan font-size="10" dy="3">2</tspan></text>
<path d="M80 184H192V280" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="192" cy="184" r="4.5" fill="#6B7472"/>
<text x="75" y="188" text-anchor="end" font-size="12" font-weight="700" fill="#6B7472">PL1</text>
<text x="192" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7472">Y1</text>
<path d="M80 160H220V280" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="220" cy="160" r="4.5" fill="#1F2A28"/>
<text x="75" y="164" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A28">PL2</text>
<text x="220" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">YF</text>
<path d="M113.6 107.2L164 107.2" stroke="#9A4A00" stroke-width="2.2" marker-end="url(#fiscal-policy-close-gap-ar)"/>
</svg>
