<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img" aria-labelledby="fx-net-exports-chain-t fx-net-exports-chain-d" font-family="Arial, Helvetica, sans-serif">
<title id="fx-net-exports-chain-t">From an appreciating dollar to net exports and AD</title>
<desc id="fx-net-exports-chain-d">A flow chart. The dollar appreciates, so each dollar buys more foreign currency. Two branches: US goods cost more abroad (a 20-dollar shirt costs 16 euros at 0.80 euro per dollar and 18 euros at 0.90), so US exports fall; foreign goods cost less in the US (a 45-euro jacket costs 56.25 dollars at 0.80 euro per dollar and 50 dollars at 0.90), so US imports rise. Both lower net exports, X minus M, so aggregate demand shifts left and real GDP and the price level fall in the short run. Made-up rates.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="820" height="450" fill="#FFFFFF"/>
<text x="410" y="34" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">When the dollar appreciates (ceteris paribus)</text><rect x="260" y="54" width="300" height="52" rx="10" fill="#FBEFE3" stroke="#9A4A00" stroke-width="1.6"/><text x="410" y="76" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">The dollar appreciates</text><text x="410" y="93.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">each dollar buys more foreign currency</text><line x1="360" y1="108" x2="210" y2="140" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><line x1="460" y1="108" x2="610" y2="140" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="40" y="142" width="340" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="210" y="164.9" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">US goods cost more abroad</text><text x="210" y="181.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">a 20-dollar shirt: 16 euros at 0.80 euro per</text><text x="210" y="197.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">dollar, 18 euros at 0.90 euro per dollar</text><rect x="440" y="142" width="340" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="610" y="164.9" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">Foreign goods cost less in the US</text><text x="610" y="181.4" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">a 45-euro jacket: 56.25 dollars at 0.80 euro</text><text x="610" y="197.9" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">per dollar, 50 dollars at 0.90 euro per dollar</text><line x1="210" y1="214" x2="210" y2="240" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><line x1="610" y1="214" x2="610" y2="240" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="40" y="242" width="340" height="48" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="210" y="270.9" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">US exports (X) fall</text><rect x="440" y="242" width="340" height="48" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="610" y="270.9" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">US imports (M) rise</text><line x1="210" y1="292" x2="360" y2="318" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><line x1="610" y1="292" x2="460" y2="318" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="240" y="320" width="340" height="48" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="410" y="348.9" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Net exports (X - M) fall</text><line x1="410" y1="370" x2="410" y2="392" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="140" y="394" width="540" height="44" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="410" y="420.7" font-size="13.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">AD shifts left: real GDP and the price level fall in the short run</text>
</svg>
