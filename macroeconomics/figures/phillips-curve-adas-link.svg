<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="phillips-curve-adas-link-t phillips-curve-adas-link-d" font-family="Arial, Helvetica, sans-serif">
<title id="phillips-curve-adas-link-t">AD-AS and the Phillips curves side by side</title>
<desc id="phillips-curve-adas-link-d">Left: an AD-AS graph with LRAS at full-employment output YF; AD shifts right from AD1 to AD2, so equilibrium moves from A at PL1 and YF to B at a higher price level PL2 and higher real GDP Y2. Right: a Phillips curve graph with inflation rate on the vertical axis and unemployment rate on the horizontal axis, a downward-sloping SRPC and a vertical LRPC at the natural rate un; the economy moves along the SRPC from A at 2 percent inflation and the natural rate to B with lower unemployment and 4 percent inflation.</desc>
<defs><marker id="phillips-curve-adas-link-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="phillips-curve-adas-link-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="phillips-curve-adas-link-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="phillips-curve-adas-link-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="860" height="400" fill="#FFFFFF"/>
<text x="430" y="30" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">A rise in AD moves the economy along the short-run Phillips curve</text><text x="230" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">AD-AS</text>
<path d="M80 80V330H380" fill="none" stroke="#1F2A28" stroke-width="2"/>
<text x="380" y="366" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Real GDP</text>
<text transform="translate(66 80) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Price level</text>
<line x1="230" y1="322.5" x2="230" y2="90" stroke="#6B7672" stroke-width="2"/>
<text x="233" y="87.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">LRAS</text>
<line x1="110" y1="305" x2="350" y2="105" stroke="#1F2A28" stroke-width="2.6"/>
<text x="353" y="102.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">SRAS</text>
<line x1="110" y1="105" x2="350" y2="305" stroke="#6B7672" stroke-width="2" stroke-dasharray="6 5"/>
<text x="353" y="297.5" font-size="13" font-weight="bold" fill="#6B7672" text-anchor="start">AD<tspan font-size="10" dy="4">1</tspan></text>
<line x1="155" y1="105" x2="380" y2="292.5" stroke="#0072B2" stroke-width="2.6"/>
<text x="377" y="265" font-size="13" font-weight="bold" fill="#0072B2" text-anchor="start">AD<tspan font-size="10" dy="4">2</tspan></text>
<line x1="248" y1="250" x2="293" y2="250" stroke="#0072B2" stroke-width="2.2" marker-end="url(#phillips-curve-adas-link-arB)"/>
<path d="M80 205H230V330" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="230" cy="205" r="5" fill="#1F2A28"/>
<text x="230" y="346" font-size="12" fill="#1F2A28" text-anchor="middle">Y<tspan font-size="10" dy="4">F</tspan></text>
<text x="76" y="209" font-size="12" fill="#1F2A28" text-anchor="end">PL<tspan font-size="10" dy="4">1</tspan></text>
<text x="238" y="223" font-size="13" font-weight="bold" fill="#1F2A28">A</text>
<path d="M80 186.3H252.5V330" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="252.5" cy="186.3" r="5" fill="#0072B2"/>
<text x="252.5" y="346" font-size="12" fill="#1F2A28" text-anchor="middle">Y<tspan font-size="10" dy="4">2</tspan></text>
<text x="76" y="190.3" font-size="12" fill="#1F2A28" text-anchor="end">PL<tspan font-size="10" dy="4">2</tspan></text>
<text x="260.5" y="178.3" font-size="13" font-weight="bold" fill="#0072B2">B</text><text x="670" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Phillips curves</text>
<path d="M520 80V330H820" fill="none" stroke="#1F2A28" stroke-width="2"/>
<text x="820" y="366" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Unemployment rate</text>
<text transform="translate(506 80) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Inflation rate</text>
<line x1="670" y1="322.5" x2="670" y2="90" stroke="#6B7672" stroke-width="2"/>
<text x="673" y="87.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">LRPC</text>
<line x1="550" y1="105" x2="790" y2="305" stroke="#1F2A28" stroke-width="2.6"/>
<text x="793" y="297.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">SRPC</text>
<path d="M520 205H670V330" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="670" cy="205" r="5" fill="#1F2A28"/>
<text x="670" y="346" font-size="12" fill="#1F2A28" text-anchor="middle">u<tspan font-size="10" dy="4">n</tspan></text>
<text x="516" y="209" font-size="12" fill="#1F2A28" text-anchor="end">2%</text>
<text x="678" y="197" font-size="13" font-weight="bold" fill="#1F2A28">A</text>
<path d="M520 170H628V330" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="628" cy="170" r="5" fill="#0072B2"/>
<text x="516" y="174" font-size="12" fill="#1F2A28" text-anchor="end">4%</text>
<text x="606" y="162" font-size="13" font-weight="bold" fill="#0072B2">B</text>
<line x1="661" y1="187.5" x2="638.5" y2="168.8" stroke="#0072B2" stroke-width="2.2" marker-end="url(#phillips-curve-adas-link-arB)"/><text x="430" y="384" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">Higher output means lower unemployment, and the faster rise in the price level is higher inflation: point A to point B on the same SRPC.</text>
</svg>
