<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Expansionary monetary policy with limited reserves and with ample reserves</title>
<desc id="d">Two graphs. Left, limited reserves: a money market graph with nominal interest rate on the vertical axis and quantity of money on the horizontal axis; buying bonds shifts the vertical money supply right from MS1 to MS2, and the nominal interest rate falls from i1 to i2. Right, ample reserves: a reserve market graph with the policy rate, the federal funds rate, on the vertical axis and the quantity of reserves on the horizontal axis; reserve demand slopes down and then turns flat at the interest on reserve balances; the vertical reserve supply crosses it in the flat part; lowering the administered rates shifts the flat part down from DR1 to DR2, and the federal funds rate falls from FFR1 to FFR2 while the quantity of reserves is unchanged.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="900" height="445" fill="#FFFFFF"/>
<text x="225" y="30" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Limited reserves: buy bonds</text><text x="675" y="30" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Ample reserves: lower interest on reserves</text><line x1="80" y1="340" x2="80" y2="54" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><line x1="80" y1="340" x2="406" y2="340" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="384" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity of money</text><text x="30" y="60" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 30 60)">Nominal interest rate (i)</text><path d="M112 88L384 326" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="380" y="312" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">MD</text><line x1="208" y1="71.2" x2="208" y2="340" stroke="#1F2A28" stroke-width="2.5"/><text x="202" y="79.6" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">MS<tspan font-size="11" dy="4">1</tspan></text><line x1="272" y1="71.2" x2="272" y2="340" stroke="#0072B2" stroke-width="2.5"/><text x="278" y="79.6" font-size="15" fill="#0072B2" font-weight="700">MS<tspan font-size="11" dy="4">2</tspan></text><line x1="217.6" y1="110.4" x2="262.4" y2="110.4" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrV)"/><line x1="80" y1="172" x2="208" y2="172" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="208" y1="172" x2="208" y2="340" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><text x="72" y="177" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">i<tspan font-size="10" dy="4">1</tspan></text><text x="208" y="358" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">1</tspan></text><line x1="80" y1="228" x2="272" y2="228" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="272" y1="228" x2="272" y2="340" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><text x="72" y="233" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">i<tspan font-size="10" dy="4">2</tspan></text><text x="272" y="358" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">2</tspan></text><circle cx="208" cy="172" r="5" fill="#1F2A28"/><circle cx="272" cy="228" r="5" fill="#0072B2"/><line x1="530" y1="340" x2="530" y2="54" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><line x1="530" y1="340" x2="856" y2="340" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><text x="850" y="384" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity of reserves</text><text x="480" y="60" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 480 60)">Policy rate</text><path d="M562 74L658 200L850 200" fill="none" stroke="#1F2A28" stroke-width="2.5"/><path d="M562 130L658 256L850 256" fill="none" stroke="#0072B2" stroke-width="2.5"/><text x="843.6" y="192" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">D<tspan font-size="11" dy="4">R1</tspan></text><text x="843.6" y="248" font-size="15" fill="#0072B2" text-anchor="end" font-weight="700">D<tspan font-size="11" dy="4">R2</tspan></text><line x1="754" y1="71.2" x2="754" y2="340" stroke="#1F2A28" stroke-width="2.5"/><text x="760" y="79.6" font-size="15" fill="#1F2A28" font-weight="700">S<tspan font-size="11" dy="4">R</tspan></text><line x1="798.8" y1="205.6" x2="798.8" y2="247.6" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrV)"/><line x1="530" y1="200" x2="754" y2="200" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="754" y1="200" x2="754" y2="340" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><text x="522" y="205" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">FFR<tspan font-size="10" dy="4">1</tspan></text><line x1="530" y1="256" x2="754" y2="256" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="754" y1="256" x2="754" y2="340" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><text x="522" y="261" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">FFR<tspan font-size="10" dy="4">2</tspan></text><circle cx="754" cy="200" r="5" fill="#1F2A28"/><circle cx="754" cy="256" r="5" fill="#0072B2"/><text x="696.4" y="188" font-size="13" fill="#5B6662" text-anchor="middle">IORB</text><text x="754" y="358" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">R</tspan></text><text x="450" y="402" font-size="14" fill="#5B6662" text-anchor="middle">Limited: more reserves shift MS right and the rate falls.  Ample: reserve supply sits in the flat part,</text><text x="450" y="420.9" font-size="14" fill="#5B6662" text-anchor="middle">so the rate falls because the administered rates (the flat part) are lowered.</text>
</svg>
