<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="opportunity-cost-ppc-points-t opportunity-cost-ppc-points-d" font-family="Arial, Helvetica, sans-serif">
<title id="opportunity-cost-ppc-points-t">A production possibilities curve: points on, inside and outside, and growth</title>
<desc id="opportunity-cost-ppc-points-d">A bowed-out PPC1 for pizzas (horizontal) and robots (vertical). F and G sit on the curve and are efficient; U sits inside, with idle resources; Z sits outside and cannot be produced now. A dashed PPC2 farther out, with an arrow from PPC1, shows growth from more resources or better technology.</desc>
