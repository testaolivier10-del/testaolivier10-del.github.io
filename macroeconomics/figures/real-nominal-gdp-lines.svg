<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="real-nominal-gdp-lines-t real-nominal-gdp-lines-d" font-family="Arial, Helvetica, sans-serif">
<title id="real-nominal-gdp-lines-t">Nominal and real GDP cross in the base year</title>
<desc id="real-nominal-gdp-lines-d">A line chart of invented data over five years, with Year 3 as the base year. Real GDP is 900, 950, 1000, 1040, 1100 billion dollars; the GDP deflator is 90, 95, 100, 106, 110; so nominal GDP (real times the deflator divided by 100) is 810, 902.5, 1000, 1102.4, 1210. Nominal GDP is below real GDP before the base year, equal to it in the base year, and above it after.</desc>
<defs><marker id="real-nominal-gdp-lines-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="real-nominal-gdp-lines-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="real-nominal-gdp-lines-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="real-nominal-gdp-lines-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="820" height="470" fill="#FFFFFF"/>
<text x="410" y="30" font-size="18" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="410" dy="0">Nominal and real GDP are equal in the base year</tspan></text>
<line x1="120" y1="390" x2="700" y2="390" stroke="#1F2A28" stroke-width="2"/>
<line x1="120" y1="390" x2="120" y2="70" stroke="#1F2A28" stroke-width="2"/>
<line x1="115" y1="359" x2="120" y2="359" stroke="#1F2A28" stroke-width="2"/>
<text x="111" y="364" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="111" dy="0">800</tspan></text>
<line x1="120" y1="359" x2="680" y2="359" stroke="#DDE2E0" stroke-width="1"/>
<line x1="115" y1="297" x2="120" y2="297" stroke="#1F2A28" stroke-width="2"/>
<text x="111" y="302" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="111" dy="0">900</tspan></text>
<line x1="120" y1="297" x2="680" y2="297" stroke="#DDE2E0" stroke-width="1"/>
<line x1="115" y1="235" x2="120" y2="235" stroke="#1F2A28" stroke-width="2"/>
<text x="111" y="240" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="111" dy="0">1000</tspan></text>
<line x1="120" y1="235" x2="680" y2="235" stroke="#DDE2E0" stroke-width="1"/>
<line x1="115" y1="173" x2="120" y2="173" stroke="#1F2A28" stroke-width="2"/>
<text x="111" y="178" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="111" dy="0">1100</tspan></text>
<line x1="120" y1="173" x2="680" y2="173" stroke="#DDE2E0" stroke-width="1"/>
<line x1="115" y1="111" x2="120" y2="111" stroke="#1F2A28" stroke-width="2"/>
<text x="111" y="116" font-size="12" text-anchor="end" fill="#5B6664"><tspan x="111" dy="0">1200</tspan></text>
<line x1="120" y1="111" x2="680" y2="111" stroke="#DDE2E0" stroke-width="1"/>
<line x1="120" y1="390" x2="120" y2="395" stroke="#1F2A28" stroke-width="2"/>
<text x="120" y="412" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan x="120" dy="0">Year 1</tspan></text>
<line x1="260" y1="390" x2="260" y2="395" stroke="#1F2A28" stroke-width="2"/>
<text x="260" y="412" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan x="260" dy="0">Year 2</tspan></text>
<line x1="400" y1="390" x2="400" y2="395" stroke="#1F2A28" stroke-width="2"/>
<text x="400" y="412" font-size="13" text-anchor="middle" fill="#1F2A28" font-weight="bold"><tspan x="400" dy="0">Year 3 (base)</tspan></text>
<line x1="540" y1="390" x2="540" y2="395" stroke="#1F2A28" stroke-width="2"/>
<text x="540" y="412" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan x="540" dy="0">Year 4</tspan></text>
<line x1="680" y1="390" x2="680" y2="395" stroke="#1F2A28" stroke-width="2"/>
<text x="680" y="412" font-size="13" text-anchor="middle" fill="#1F2A28"><tspan x="680" dy="0">Year 5</tspan></text>
<text x="40" y="235" font-size="14" text-anchor="middle" fill="#1F2A28" transform="rotate(-90 40 235)">GDP (billions of dollars)</text>
<text x="400" y="440" font-size="14" text-anchor="middle" fill="#1F2A28"><tspan x="400" dy="0">Year (invented data)</tspan></text>
<line x1="400" y1="390" x2="400" y2="80" stroke="#5B6664" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M120 297 L260 266 L400 235 L540 210.2 L680 173" fill="none" stroke="#084F78" stroke-width="3" stroke-linejoin="round"/>
<path d="M120 352.8 L260 295.5 L400 235 L540 171.5 L680 104.8" fill="none" stroke="#355A0A" stroke-width="3" stroke-dasharray="9 5" stroke-linejoin="round"/>
<circle cx="120" cy="297" r="4.5" fill="#084F78"/><circle cx="120" cy="352.8" r="4.5" fill="#355A0A"/>
<circle cx="260" cy="266" r="4.5" fill="#084F78"/><circle cx="260" cy="295.5" r="4.5" fill="#355A0A"/>
<circle cx="400" cy="235" r="4.5" fill="#084F78"/><circle cx="400" cy="235" r="4.5" fill="#355A0A"/>
<circle cx="540" cy="210.2" r="4.5" fill="#084F78"/><circle cx="540" cy="171.5" r="4.5" fill="#355A0A"/>
<circle cx="680" cy="173" r="4.5" fill="#084F78"/><circle cx="680" cy="104.8" r="4.5" fill="#355A0A"/>
<text x="692" y="109.8" font-size="14" text-anchor="start" fill="#355A0A" font-weight="bold"><tspan x="692" dy="0">Nominal GDP</tspan></text>
<text x="692" y="178" font-size="14" text-anchor="start" fill="#084F78" font-weight="bold"><tspan x="692" dy="0">Real GDP</tspan></text>
<text x="130" y="98" font-size="12" text-anchor="start" fill="#5B6664"><tspan x="130" dy="0">Before the base year,</tspan><tspan x="130" dy="15">prices were lower: nominal &lt; real</tspan></text>
<text x="410" y="98" font-size="12" text-anchor="start" fill="#5B6664"><tspan x="410" dy="0">After the base year,</tspan><tspan x="410" dy="15">prices are higher: nominal &gt; real</tspan></text>
</svg>
