<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="policy-short-run-chains-t policy-short-run-chains-d" font-family="Arial, Helvetica, sans-serif">
<title id="policy-short-run-chains-t">The monetary and fiscal policy chains</title>
<desc id="policy-short-run-chains-d">Two rows of linked boxes. Monetary, ample reserves: the central bank lowers the interest rate on reserve balances, the policy rate falls, loan rates fall, investment and interest-sensitive consumption rise, AD shifts right so real GDP and the price level rise and unemployment falls. Fiscal: a tax cut raises disposable income, consumption rises with the multiplier, total spending rises, AD shifts right with the same results. A note says the limited-reserves tool is buying bonds, which shifts the money supply right on the money market graph.</desc>
<defs><marker id="policy-short-run-chains-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="policy-short-run-chains-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="policy-short-run-chains-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="policy-short-run-chains-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="860" height="430" fill="#FFFFFF"/>
<text x="430" y="32" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Expansionary policy in the short run: every link of the chain</text><text x="24" y="66" font-size="15" font-weight="bold" fill="#0072B2" text-anchor="start">Monetary policy (ample-reserves framework)</text><rect x="24" y="78" width="150" height="92" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="99" y="104" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Central bank</text><text x="99" y="120.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">lowers the interest</text><text x="99" y="137.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rate on reserve</text><text x="99" y="154.7" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">balances</text><line x1="176" y1="124" x2="190" y2="124" stroke="#0072B2" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arB)"/><rect x="192" y="78" width="150" height="92" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="267" y="104" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Policy rate</text><text x="267" y="120.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">(federal funds</text><text x="267" y="137.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rate) falls</text><line x1="344" y1="124" x2="358" y2="124" stroke="#0072B2" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arB)"/><rect x="360" y="78" width="150" height="92" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="435" y="104" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Loan rates and</text><text x="435" y="120.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">other interest</text><text x="435" y="137.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rates fall</text><line x1="512" y1="124" x2="526" y2="124" stroke="#0072B2" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arB)"/><rect x="528" y="78" width="150" height="92" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="603" y="104" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Investment and</text><text x="603" y="120.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">interest-sensitive</text><text x="603" y="137.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">consumption rise</text><line x1="680" y1="124" x2="694" y2="124" stroke="#0072B2" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arB)"/><rect x="696" y="78" width="150" height="92" rx="8" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="771" y="104" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">AD shifts right:</text><text x="771" y="120.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">real GDP and the</text><text x="771" y="137.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">price level rise,</text><text x="771" y="154.7" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">unemployment falls</text><text x="24" y="238" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="start">Fiscal policy</text><rect x="24" y="250" width="150" height="92" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="99" y="276" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Government</text><text x="99" y="292.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">cuts taxes</text><line x1="176" y1="296" x2="190" y2="296" stroke="#D55E00" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arV)"/><rect x="192" y="250" width="150" height="92" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="267" y="276" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Disposable</text><text x="267" y="292.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">income rises</text><line x1="344" y1="296" x2="358" y2="296" stroke="#D55E00" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arV)"/><rect x="360" y="250" width="150" height="92" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="435" y="276" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Consumption</text><text x="435" y="292.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rises (times the</text><text x="435" y="309.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">multiplier)</text><line x1="512" y1="296" x2="526" y2="296" stroke="#D55E00" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arV)"/><rect x="528" y="250" width="150" height="92" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="603" y="276" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Total spending</text><text x="603" y="292.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rises at every</text><text x="603" y="309.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">price level</text><line x1="680" y1="296" x2="694" y2="296" stroke="#D55E00" stroke-width="2.2" marker-end="url(#policy-short-run-chains-arV)"/><rect x="696" y="250" width="150" height="92" rx="8" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="771" y="276" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">AD shifts right:</text><text x="771" y="292.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">real GDP and the</text><text x="771" y="309.8" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">price level rise,</text><text x="771" y="326.7" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">unemployment falls</text><text x="430" y="384" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">Limited-reserves framework: the central bank buys bonds, the money supply shifts right on the money market graph,</text><text x="430" y="400.9" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">and the nominal interest rate falls; the chain then continues the same way. Contractionary policy reverses every arrow.</text>
</svg>
