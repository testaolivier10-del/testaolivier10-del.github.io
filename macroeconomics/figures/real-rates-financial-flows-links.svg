<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="real-rates-financial-flows-links-t real-rates-financial-flows-links-d" font-family="Arial, Helvetica, sans-serif">
<title id="real-rates-financial-flows-links-t">Higher US real interest rates, through two markets</title>
<desc id="real-rates-financial-flows-links-d">Two linked graphs. Left: the US loanable funds market, with Quantity of loanable funds and Real interest rate on the axes; demand for loanable funds shifts right from DLF1 to DLF2 along supply SLF, and the real interest rate rises from r1 to r2. An arrow says the real rate rises above Europe's and financial capital flows into the US. Right: the market for dollars, with Quantity of dollars and Price of the dollar (euros per dollar); demand shifts right from D1 to D2 and the exchange rate rises from XR1 to XR2. Below, the chain: government borrowing rises, the real interest rate rises, capital flows in as foreigners buy US assets, demand for dollars rises, the dollar appreciates, net exports fall. The inflow is a larger capital and financial account surplus, matched by a smaller current account balance.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="190" y="44" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">US loanable funds market</text><path d="M80 60V260H300" fill="none" stroke="#1F2A28" stroke-width="1.8"/><text x="300" y="296" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Quantity of loanable funds</text><text transform="translate(46 60) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Real interest rate</text><path d="M88.8 88L260.4 244" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><text x="265.4" y="256" font-size="13" font-weight="bold" fill="#6B7472">D<tspan font-size="10" dy="3">LF1</tspan></text><path d="M119.6 76L293.4 234" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/><text x="298.4" y="246" font-size="13" font-weight="bold" fill="#355A0A">D<tspan font-size="10" dy="3">LF2</tspan></text><path d="M88.8 232L260.4 76" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/><text x="265.4" y="76" font-size="13" font-weight="bold" fill="#1F5C8A">S<tspan font-size="10" dy="3">LF</tspan></text><path d="M80 160H168V260" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="168" cy="160" r="4.5" fill="#6B7472"/><text x="74" y="164" font-size="12" font-weight="bold" fill="#6B7472" text-anchor="end">r1</text><path d="M80 140H190V260" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="190" cy="140" r="4.5" fill="#1F2A28"/><text x="74" y="144" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">r2</text><line x1="130.6" y1="120" x2="161.4" y2="120" stroke="#9A4A00" stroke-width="2" marker-end="url(#ar-c2)"/><text x="670" y="44" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Market for dollars</text><path d="M560 60V260H780" fill="none" stroke="#1F2A28" stroke-width="1.8"/><text x="780" y="296" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Quantity of dollars</text><text transform="translate(526 60) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price of the dollar (euros per dollar)</text><path d="M568.8 88L740.4 244" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><text x="745.4" y="256" font-size="13" font-weight="bold" fill="#6B7472">D<tspan font-size="10" dy="3">1</tspan></text><path d="M599.6 76L773.4 234" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/><text x="778.4" y="246" font-size="13" font-weight="bold" fill="#355A0A">D<tspan font-size="10" dy="3">2</tspan></text><path d="M568.8 232L740.4 76" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/><text x="745.4" y="76" font-size="13" font-weight="bold" fill="#1F5C8A">S</text><path d="M560 160H648V260" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="648" cy="160" r="4.5" fill="#6B7472"/><text x="554" y="164" font-size="12" font-weight="bold" fill="#6B7472" text-anchor="end">XR1</text><path d="M560 140H670V260" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="670" cy="140" r="4.5" fill="#1F2A28"/><text x="554" y="144" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">XR2</text><line x1="610.6" y1="120" x2="641.4" y2="120" stroke="#9A4A00" stroke-width="2" marker-end="url(#ar-c2)"/><line x1="360" y1="160" x2="470" y2="160" stroke="#9A4A00" stroke-width="2.4" marker-end="url(#ar-c2)"/><text x="415" y="120" font-size="12.5" font-weight="bold" fill="#9A4A00" text-anchor="middle">r rises above</text><text x="415" y="136.5" font-size="12.5" font-weight="bold" fill="#9A4A00" text-anchor="middle">Europe's</text><text x="415" y="186" font-size="12.5" font-weight="bold" fill="#9A4A00" text-anchor="middle">financial capital</text><text x="415" y="202.5" font-size="12.5" font-weight="bold" fill="#9A4A00" text-anchor="middle">flows into the US</text><rect x="24" y="350" width="132" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="90" y="381.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Government</text><text x="90" y="397.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">borrowing rises</text><line x1="157" y1="385" x2="167" y2="385" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="168" y="350" width="132" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="234" y="381.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Real interest</text><text x="234" y="397.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">rate rises</text><line x1="301" y1="385" x2="311" y2="385" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="312" y="350" width="132" height="70" rx="10" fill="#FBEFE3" stroke="#9A4A00" stroke-width="1.6"/><text x="378" y="373.4" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Capital inflow:</text><text x="378" y="389.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">foreigners buy</text><text x="378" y="405" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">US assets</text><line x1="445" y1="385" x2="455" y2="385" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="456" y="350" width="132" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="522" y="381.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Demand for</text><text x="522" y="397.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">dollars rises</text><line x1="589" y1="385" x2="599" y2="385" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="600" y="350" width="132" height="70" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="666" y="381.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">The dollar</text><text x="666" y="397.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">appreciates</text><line x1="733" y1="385" x2="743" y2="385" stroke="#1F2A28" stroke-width="1.6" marker-end="url(#ar-ink)"/><rect x="744" y="350" width="132" height="70" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="810" y="381.3" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Net exports</text><text x="810" y="397.1" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">fall</text><text x="450" y="450" font-size="12.5" font-weight="normal" fill="#6B7472" text-anchor="middle">The inflow also shows up as a larger surplus on the US capital and financial account, matched by a smaller current account balance.</text>
</svg>
