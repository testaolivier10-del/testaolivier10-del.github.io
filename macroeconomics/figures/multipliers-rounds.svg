<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="multipliers-rounds-t multipliers-rounds-d" font-family="Arial, Helvetica, sans-serif">
<title id="multipliers-rounds-t">Rounds of spending behind the multiplier</title>
<desc id="multipliers-rounds-d">A bar chart of new spending in each round when the MPC is 0.8 and the first round is 100 million dollars: 100, then 80, 64, 51.2, 41 and 32.8, each round 0.8 times the one before. All rounds together add up to 500, five times the first.</desc>
<defs><marker id="multipliers-rounds-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker></defs>
<rect width="640" height="360" fill="#FFFFFF"/>
<text x="330" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A28">New spending in each round (MPC = 0.8, first round 100)</text>
<path d="M70 40V270H590" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="64" y="274" text-anchor="end" font-size="12" fill="#1F2A28">0</text><path d="M70 270H590" stroke="#D9DEDC" stroke-width="1"/>
<text x="64" y="216.5" text-anchor="end" font-size="12" fill="#1F2A28">25</text><path d="M70 212.5H590" stroke="#D9DEDC" stroke-width="1"/>
<text x="64" y="159" text-anchor="end" font-size="12" fill="#1F2A28">50</text><path d="M70 155H590" stroke="#D9DEDC" stroke-width="1"/>
<text x="64" y="101.5" text-anchor="end" font-size="12" fill="#1F2A28">75</text><path d="M70 97.5H590" stroke="#D9DEDC" stroke-width="1"/>
<text x="64" y="44" text-anchor="end" font-size="12" fill="#1F2A28">100</text><path d="M70 40H590" stroke="#D9DEDC" stroke-width="1"/>
<rect x="88" y="40" width="58" height="230" fill="#9A4A00"/>
<text x="117" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">100</text>
<text x="117" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">1</text>
<rect x="168" y="86" width="58" height="184" fill="#355A0A"/>
<text x="197" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">80</text>
<text x="197" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">2</text>
<rect x="248" y="122.8" width="58" height="147.2" fill="#355A0A"/>
<text x="277" y="116.8" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">64</text>
<text x="277" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">3</text>
<rect x="328" y="152.2" width="58" height="117.8" fill="#355A0A"/>
<text x="357" y="146.2" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">51.2</text>
<text x="357" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">4</text>
<rect x="408" y="175.7" width="58" height="94.3" fill="#355A0A"/>
<text x="437" y="169.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">41</text>
<text x="437" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">5</text>
<rect x="488" y="194.6" width="58" height="75.4" fill="#355A0A"/>
<text x="517" y="188.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">32.8</text>
<text x="517" y="286" text-anchor="middle" font-size="12" fill="#1F2A28">6</text>
<text x="590" y="306" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Round of spending</text>
<text transform="translate(30 40) rotate(-90)" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">New spending (millions of dollars)</text>
<text x="590" y="62" text-anchor="end" font-size="13" font-weight="700" fill="#1F5C8A">All rounds add up to 100 × 5 = 500</text>
</svg>
