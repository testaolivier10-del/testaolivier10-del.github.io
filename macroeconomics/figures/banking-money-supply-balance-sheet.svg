<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A bank balance sheet with required and excess reserves</title>
<desc id="d">A T-account for an invented bank with a required reserve ratio of 0.1. Assets: reserves of 300 dollars, of which 100 dollars are required and 200 dollars are excess, and loans of 700 dollars. Liabilities: checkable deposits of 1,000 dollars. Below: required reserves are 1,000 times 0.1, or 100 dollars; excess reserves are 300 minus 100, or 200 dollars; the bank can lend at most 200 dollars; the money supply can grow by at most 200 times 10, or 2,000 dollars.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="36" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Quentar Savings Bank (invented), required reserve ratio 0.1</text><line x1="120" y1="60" x2="640" y2="60" stroke="#1F2A28" stroke-width="2.5"/><line x1="380" y1="60" x2="380" y2="230" stroke="#1F2A28" stroke-width="2.5"/><text x="250" y="84" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Assets</text><text x="510" y="84" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Liabilities</text><text x="140" y="120" font-size="15" fill="#1F2A28">Reserves</text><text x="360" y="120" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">$300</text><text x="160" y="146" font-size="14" fill="#5B6662">required: $100</text><text x="160" y="170" font-size="14" fill="#355A0A" font-weight="700">excess: $200</text><text x="140" y="204" font-size="15" fill="#1F2A28">Loans</text><text x="360" y="204" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">$700</text><text x="400" y="120" font-size="15" fill="#1F2A28">Checkable deposits</text><text x="620" y="120" font-size="15" fill="#1F2A28" text-anchor="end" font-weight="700">$1,000</text><rect x="60" y="252" width="640" height="90" rx="8" fill="#F4F7F9" stroke="#D6DEE3" stroke-width="1.5"/><text x="80" y="280" font-size="14" fill="#1F2A28">Required reserves = $1,000 x 0.1 = $100.  Excess reserves = $300 - $100 = $200.</text><text x="80" y="298.9" font-size="14" fill="#1F2A28">Most this bank can lend now: its excess reserves, $200.</text><text x="80" y="317.8" font-size="14" fill="#1F2A28">Most the money supply can grow: $200 x (1 / 0.1) = $2,000.</text>
</svg>
