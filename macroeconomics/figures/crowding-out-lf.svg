<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="crowding-out-lf-t crowding-out-lf-d" font-family="Arial, Helvetica, sans-serif">
<title id="crowding-out-lf-t">Crowding out in the loanable funds market</title>
<desc id="crowding-out-lf-d">Left: a loanable funds graph with the real interest rate on the vertical axis and the quantity of loanable funds on the horizontal axis. Government borrowing shifts the demand for loanable funds right from DLF1 to DLF2, so the equilibrium moves from A at r1 and Q1 to B at a higher real interest rate r2 and a larger quantity Q2. Right: a chain of boxes: the government borrows, demand for loanable funds rises, the real interest rate rises, private investment falls, the capital stock grows more slowly.</desc>
<defs><marker id="crowding-out-lf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="crowding-out-lf-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="crowding-out-lf-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="crowding-out-lf-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="860" height="430" fill="#FFFFFF"/>
<text x="430" y="30" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Crowding out: government borrowing raises the real interest rate</text><text x="255" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Loanable funds market</text>
<path d="M90 80V340H420" fill="none" stroke="#1F2A28" stroke-width="2"/>
<text x="420" y="376" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Quantity of loanable funds</text>
<text transform="translate(76 80) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Real interest rate</text>
<line x1="123" y1="314" x2="387" y2="106" stroke="#1F2A28" stroke-width="2.6"/>
<text x="390.3" y="103.4" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">S<tspan font-size="10" dy="4">LF</tspan></text>
<line x1="123" y1="106" x2="387" y2="314" stroke="#6B7672" stroke-width="2" stroke-dasharray="6 5"/>
<text x="390.3" y="306.2" font-size="13" font-weight="bold" fill="#6B7672" text-anchor="start">D<tspan font-size="10" dy="4">LF1</tspan></text>
<line x1="172.5" y1="106" x2="420" y2="301" stroke="#D55E00" stroke-width="2.6"/>
<text x="418.4" y="272.4" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="start">D<tspan font-size="10" dy="4">LF2</tspan></text>
<line x1="274.8" y1="254.2" x2="324.3" y2="254.2" stroke="#D55E00" stroke-width="2.2" marker-end="url(#crowding-out-lf-arV)"/>
<path d="M90 210H255V340" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="255" cy="210" r="5" fill="#1F2A28"/>
<text x="255" y="356" font-size="12" fill="#1F2A28" text-anchor="middle">Q<tspan font-size="10" dy="4">1</tspan></text>
<text x="86" y="214" font-size="12" fill="#1F2A28" text-anchor="end">r<tspan font-size="10" dy="4">1</tspan></text>
<text x="233" y="202" font-size="13" font-weight="bold" fill="#1F2A28">A</text>
<path d="M90 190.5H279.8V340" fill="none" stroke="#6B7672" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="279.8" cy="190.5" r="5" fill="#D55E00"/>
<text x="279.8" y="356" font-size="12" fill="#1F2A28" text-anchor="middle">Q<tspan font-size="10" dy="4">2</tspan></text>
<text x="86" y="194.5" font-size="12" fill="#1F2A28" text-anchor="end">r<tspan font-size="10" dy="4">2</tspan></text>
<text x="287.8" y="182.5" font-size="13" font-weight="bold" fill="#D55E00">B</text><rect x="520" y="74" width="290" height="48" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="665" y="94" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Government borrows</text><text x="665" y="110.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">to pay for a deficit</text><line x1="665" y1="124" x2="665" y2="136" stroke="#D55E00" stroke-width="2.2" marker-end="url(#crowding-out-lf-arV)"/><rect x="520" y="138" width="290" height="48" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="665" y="158" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Demand for loanable</text><text x="665" y="174.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">funds shifts right</text><line x1="665" y1="188" x2="665" y2="200" stroke="#D55E00" stroke-width="2.2" marker-end="url(#crowding-out-lf-arV)"/><rect x="520" y="202" width="290" height="48" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="665" y="222" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Real interest</text><text x="665" y="238.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rate rises</text><line x1="665" y1="252" x2="665" y2="264" stroke="#D55E00" stroke-width="2.2" marker-end="url(#crowding-out-lf-arV)"/><rect x="520" y="266" width="290" height="48" rx="8" fill="#FBEADF" stroke="#D55E00" stroke-width="2"/><text x="665" y="286" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Private investment</text><text x="665" y="302.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">falls</text><line x1="665" y1="316" x2="665" y2="328" stroke="#D55E00" stroke-width="2.2" marker-end="url(#crowding-out-lf-arV)"/><rect x="520" y="330" width="290" height="48" rx="8" fill="#EEF4E0" stroke="#355A0A" stroke-width="2"/><text x="665" y="350" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Capital stock grows</text><text x="665" y="366.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">more slowly</text><text x="430" y="414" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">The government takes a larger share of the funds; at the higher real rate, private borrowers want less.</text>
</svg>
