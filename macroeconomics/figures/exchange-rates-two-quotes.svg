<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="exchange-rates-two-quotes-t exchange-rates-two-quotes-d" font-family="Arial, Helvetica, sans-serif">
<title id="exchange-rates-two-quotes-t">An exchange rate written two ways, and appreciation</title>
<desc id="exchange-rates-two-quotes-d">Suppose 1 euro equals 1.25 dollars; flipped, 1 dollar equals 0.80 euro, because 1 divided by 1.25 is 0.80. When the rate changes to 1 euro equals 1.50 dollars, the euro appreciates (it buys more dollars, and a 40-euro ticket costs 60 dollars instead of 50) and the dollar depreciates (it buys about 0.67 euro instead of 0.80). Made-up rates for practice.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="820" height="400" fill="#FFFFFF"/>
<text x="410" y="34" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">One exchange rate, written two ways (suppose these rates)</text><rect x="40" y="60" width="330" height="84" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="205" y="97.7" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">1 euro = 1.25 dollars</text><text x="205" y="116.1" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">the price of the euro: 1.25 dollars per euro</text><rect x="450" y="60" width="330" height="84" rx="10" fill="#E5EEF6" stroke="#1F5C8A" stroke-width="1.6"/><text x="615" y="97.7" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">1 dollar = 0.80 euro</text><text x="615" y="116.1" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">the price of the dollar: 0.80 euro per dollar</text><line x1="372" y1="92" x2="446" y2="92" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><line x1="446" y1="116" x2="372" y2="116" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><text x="409" y="84" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">1 / 1.25</text><text x="409" y="136" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">1 / 0.80</text><text x="410" y="186" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Then the rate changes to 1 euro = 1.50 dollars</text><rect x="40" y="206" width="330" height="110" rx="10" fill="#FBEFE3" stroke="#9A4A00" stroke-width="1.6"/><text x="205" y="239.8" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">The euro appreciates</text><text x="205" y="257" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">One euro now buys 1.50 dollars,</text><text x="205" y="274.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">not 1.25: it buys more dollars.</text><text x="205" y="291.3" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">A 40-euro ticket: 50 dollars before, 60 after.</text><rect x="450" y="206" width="330" height="110" rx="10" fill="#E5EEF6" stroke="#1F5C8A" stroke-width="1.6"/><text x="615" y="239.8" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">The dollar depreciates</text><text x="615" y="257" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">One dollar now buys 0.67 euro,</text><text x="615" y="274.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">not 0.80: it buys fewer euros.</text><text x="615" y="291.3" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">The two moves are one change, seen from each side.</text><text x="410" y="352" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Read the units: "dollars per euro" is the price of one euro. Flip the ratio and you get the price of one dollar.</text><text x="410" y="376" font-size="12" font-weight="normal" fill="#6B7472" text-anchor="middle">Rates are made up for practice.</text>
</svg>
