<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="fx-policy-changes-demand-shift-t fx-policy-changes-demand-shift-d" font-family="Arial, Helvetica, sans-serif">
<title id="fx-policy-changes-demand-shift-t">Higher US real interest rates shift demand for the dollar right</title>
<desc id="fx-policy-changes-demand-shift-d">A graph of the market for dollars, with Quantity of dollars on the horizontal axis and Price of the dollar (euros per dollar) on the vertical axis. Demand shifts right from D1 to D2 along an unchanged supply curve S1; the equilibrium moves from E1 to E2, the exchange rate rises from XR1 to XR2 and the quantity from Q1 to Q2. Beside it, the chain: US real interest rates rise relative to Europe, European savers demand more dollars to buy US bonds, demand shifts right, the dollar appreciates; in the market for euros the supply of euros rises and the euro depreciates.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="820" height="420" fill="#FFFFFF"/>
<text x="250" y="44" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">The market for dollars</text><path d="M100 60V310H400" fill="none" stroke="#1F2A28" stroke-width="1.8"/><text x="400" y="346" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Quantity of dollars</text><text transform="translate(66 60) rotate(-90)" text-anchor="end" font-size="13" font-weight="bold" fill="#1F2A28">Price of the dollar (euros per dollar)</text><path d="M112 95L346 290" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><text x="351" y="302" font-size="13" font-weight="bold" fill="#6B7472">D<tspan font-size="10" dy="3">1</tspan></text><path d="M154 80L391 277.5" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/><text x="396" y="289.5" font-size="13" font-weight="bold" fill="#355A0A">D<tspan font-size="10" dy="3">2</tspan></text><path d="M112 275L346 80" fill="none" stroke="#1F5C8A" stroke-width="2.8" stroke-linecap="round"/><text x="351" y="80" font-size="13" font-weight="bold" fill="#1F5C8A">S<tspan font-size="10" dy="3">1</tspan></text><path d="M100 185H220V310" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="220" cy="185" r="4.5" fill="#6B7472"/><text x="194" y="177" font-size="12" font-weight="bold" fill="#6B7472" text-anchor="start">E1</text><text x="94" y="189" font-size="12" font-weight="bold" fill="#6B7472" text-anchor="end">XR1</text><text x="220" y="326" font-size="12" font-weight="bold" fill="#6B7472" text-anchor="middle">Q1</text><path d="M100 160H250V310" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/><circle cx="250" cy="160" r="4.5" fill="#1F2A28"/><text x="258" y="153" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">E2</text><text x="94" y="164" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">XR2</text><text x="250" y="326" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Q2</text><line x1="169" y1="135" x2="211" y2="135" stroke="#9A4A00" stroke-width="2" marker-end="url(#ar-c2)"/><rect x="470" y="70" width="320" height="64" rx="10" fill="#FBEFE3" stroke="#9A4A00" stroke-width="1.6"/><text x="630" y="98" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Cause: US real interest rates rise</text><text x="630" y="115.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">relative to those in Europe</text><line x1="630" y1="136" x2="630" y2="160" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="470" y="162" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.6"/><text x="630" y="190" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">European savers want US bonds,</text><text x="630" y="207.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">so they demand more dollars: D shifts right</text><line x1="630" y1="228" x2="630" y2="252" stroke="#1F2A28" stroke-width="1.8" marker-end="url(#ar-ink)"/><rect x="470" y="254" width="320" height="64" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="630" y="282" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">The price of the dollar rises from XR1</text><text x="630" y="299.1" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">to XR2: the dollar appreciates</text><text x="470" y="346" font-size="12.5" font-weight="normal" fill="#6B7472" text-anchor="start">In the market for euros, the mirror change: the supply of</text><text x="470" y="362.5" font-size="12.5" font-weight="normal" fill="#6B7472" text-anchor="start">euros rises, so the euro depreciates.</text>
</svg>
