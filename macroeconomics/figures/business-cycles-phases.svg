<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="business-cycles-phases-t business-cycles-phases-d" font-family="Arial, Helvetica, sans-serif">
<title id="business-cycles-phases-t">The business cycle around potential output</title>
<desc id="business-cycles-phases-d">A graph with time on the horizontal axis and real GDP on the vertical axis. A straight dashed line rising to the right is potential output, the economy's full-employment output. Actual real GDP is a wavy line around it: it rises in an expansion to a peak, falls in a contraction to a trough, then rises in the next expansion. Where actual output is above potential the gap is shaded and labeled a positive (inflationary) output gap; where it is below potential the gap is labeled a negative (recessionary) output gap.</desc>
<defs><marker id="business-cycles-phases-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="business-cycles-phases-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="business-cycles-phases-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker><marker id="business-cycles-phases-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
