<text x="152" y="215" font-size="13" font-weight="bold" fill="#6B7672" text-anchor="start">PPC<tspan font-size="10" dy="4">1</tspan></text>
<path d="M320 330L319.7 319.5L318.7 309.1L317 298.7L314.8 288.4L311.8 278.2L308.3 268.2L304.1 258.3L299.3 248.7L293.8 239.2L287.8 230L281.3 221.1L274.2 212.4L266.5 204.1L258.4 196.2L249.7 188.6L240.6 181.4L231 174.6L221.1 168.2L210.7 162.3L200 156.8L189 151.8L177.6 147.3L166 143.3L154.2 139.8L142.1 136.8L129.9 134.4L117.5 132.5L105.1 131.1L92.6 130.3L80 130" fill="none" stroke="#355A0A" stroke-width="2.6"/>
<text x="260" y="180" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="start">PPC<tspan font-size="10" dy="4">2</tspan></text>
<line x1="200" y1="230" x2="239" y2="197.5" stroke="#355A0A" stroke-width="2.2" marker-end="url(#economic-growth-ppc-lras-arA)"/>
<circle cx="146" cy="280" r="5" fill="#1F2A28"/><text x="154" y="284" font-size="13" font-weight="bold" fill="#1F2A28">X</text>
<text x="146" y="305" font-size="12" font-weight="normal" fill="#6B7672" text-anchor="start">inside: idle resources</text><text x="670" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">AD-AS</text>
<path d="M520 80V330H820" fill="none" stroke="#1F2A28" stroke-width="2"/>
<text x="820" y="366" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Real GDP</text>
<text transform="translate(506 80) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Price level</text>
<line x1="640" y1="322.5" x2="640" y2="90" stroke="#6B7672" stroke-width="2" stroke-dasharray="6 5"/>
<text x="643" y="87.5" font-size="13" font-weight="bold" fill="#6B7672" text-anchor="start">LRAS<tspan font-size="10" dy="4">1</tspan></text>
<line x1="700" y1="322.5" x2="700" y2="90" stroke="#355A0A" stroke-width="2.6"/>
<text x="703" y="87.5" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="start">LRAS<tspan font-size="10" dy="4">2</tspan></text>
<line x1="649" y1="122.5" x2="691" y2="122.5" stroke="#355A0A" stroke-width="2.2" marker-end="url(#economic-growth-ppc-lras-arA)"/>
<text x="640" y="347.5" font-size="12" font-weight="bold" fill="#6B7672" text-anchor="middle">Y<tspan font-size="10" dy="4">F1</tspan></text>
<text x="700" y="347.5" font-size="12" font-weight="bold" fill="#355A0A" text-anchor="middle">Y<tspan font-size="10" dy="4">F2</tspan></text><text x="430" y="384" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">More physical and human capital, better technology or more resources: the PPC shifts out and LRAS shifts right.</text>
</svg>
