<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="economic-growth-ppc-lras-t economic-growth-ppc-lras-d" font-family="Arial, Helvetica, sans-serif">
<title id="economic-growth-ppc-lras-t">Economic growth on the PPC and the AD-AS graph</title>
<desc id="economic-growth-ppc-lras-d">Left: a production possibilities curve for capital goods and consumer goods shifts out from PPC1 to PPC2; a point X inside the curve marks idle resources. Right: an AD-AS graph where the vertical long-run aggregate supply curve shifts right from LRAS1 at YF1 to LRAS2 at YF2.</desc>
<defs><marker id="economic-growth-ppc-lras-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="economic-growth-ppc-lras-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="economic-growth-ppc-lras-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="economic-growth-ppc-lras-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="860" height="400" fill="#FFFFFF"/>
<text x="430" y="30" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">Economic growth on two graphs</text><text x="230" y="66" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Production possibilities curve</text>
