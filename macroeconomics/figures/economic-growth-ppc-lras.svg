<text x="380" y="366" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="end">Consumer goods</text>
<text transform="translate(66 80) rotate(-90)" font-size="13" fill="#1F2A28" text-anchor="end">Capital goods</text>
