<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="shifts-movements-two-ways-t shifts-movements-two-ways-d" font-family="Arial, Helvetica, sans-serif">
<title id="shifts-movements-two-ways-t">A movement along a curve versus a shift of the curve</title>
<desc id="shifts-movements-two-ways-d">Left: one downward-sloping curve labeled D, with an arrow from point J down to point K along it: a lower price, a larger quantity, the same curve. Right: the curve D1 dashed and a new curve D2 to its right, with an arrow pointing right: something other than the price changed, so a larger quantity is bought at every price.</desc>
<defs><marker id="shifts-movements-two-ways-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="shifts-movements-two-ways-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="shifts-movements-two-ways-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="shifts-movements-two-ways-arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#084F78"/></marker></defs><rect width="720" height="360" fill="#FFFFFF"/>
<text x="190" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">A movement along the curve</text>
<line x1="70" y1="44" x2="70" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="70" y1="270" x2="316" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="310" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity</text>
<text x="36" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 36 50)">Price</text>
<line x1="94" y1="72" x2="286" y2="248" stroke="#355A0A" stroke-width="3"/><text x="292" y="252" font-size="15" fill="#355A0A" font-weight="700">D</text>
<circle cx="142" cy="116" r="5" fill="#D55E00"/>
<text x="150" y="108" font-size="14" fill="#D55E00" font-weight="700">J</text>
<circle cx="214" cy="182" r="5" fill="#D55E00"/>
<text x="222" y="174" font-size="14" fill="#D55E00" font-weight="700">K</text>
<line x1="151.6" y1="133.6" x2="204.4" y2="182" stroke="#D55E00" stroke-width="2" marker-end="url(#shifts-movements-two-ways-arV)"/>
<text x="190" y="330" font-size="12" fill="#6B7370" text-anchor="middle">The price falls: same curve,</text>
<text x="190" y="346" font-size="12" fill="#6B7370" text-anchor="middle">a larger quantity (J to K).</text>
<text x="540" y="28" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">A shift of the curve</text>
<line x1="420" y1="44" x2="420" y2="270" stroke="#1F2A28" stroke-width="2"/>
<line x1="420" y1="270" x2="666" y2="270" stroke="#1F2A28" stroke-width="2"/>
<text x="660" y="308" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity</text>
<text x="386" y="50" font-size="13" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 386 50)">Price</text>
<line x1="432" y1="83" x2="600" y2="237" stroke="#6B7370" stroke-width="2.5" stroke-dasharray="7 5"/><text x="606" y="241" font-size="15" fill="#6B7370" font-weight="700">D<tspan font-size="11" dy="4">1</tspan></text>
<line x1="480" y1="83" x2="648" y2="237" stroke="#355A0A" stroke-width="3"/><text x="654" y="241" font-size="15" fill="#355A0A" font-weight="700">D<tspan font-size="11" dy="4">2</tspan></text>
<line x1="520.8" y1="160" x2="559.2" y2="160" stroke="#355A0A" stroke-width="2.2" marker-end="url(#shifts-movements-two-ways-arA)"/>
<text x="540" y="330" font-size="12" fill="#6B7370" text-anchor="middle">Something other than price changes:</text>
<text x="540" y="346" font-size="12" fill="#6B7370" text-anchor="middle">more is bought at every price.</text>
</svg>
