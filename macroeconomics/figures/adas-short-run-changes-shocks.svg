<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-labelledby="adas-short-run-changes-shocks-t adas-short-run-changes-shocks-d" font-family="Arial, Helvetica, sans-serif">
<title id="adas-short-run-changes-shocks-t">Demand-pull and cost-push inflation</title>
<desc id="adas-short-run-changes-shocks-d">Two AD-AS graphs. Left: AD1 shifts right to AD2; the price level rises from PL1 to PL2 and real GDP rises from Y1 to Y2 (demand-pull inflation). Right: SRAS1 shifts left to SRAS2; the price level rises from PL1 to PL2 while real GDP falls from Y1 to Y2 (cost-push inflation).</desc>
<defs><marker id="adas-short-run-changes-shocks-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker></defs>
<rect width="660" height="340" fill="#FFFFFF"/>
<text x="185" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A28">Demand-pull: AD shifts right</text>
<path d="M60 40V270H310" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="310" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Real GDP</text>
<text transform="translate(30 40) rotate(-90)" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Price level</text>
<path d="M80 251.6L290 58.4" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/>
<text x="294" y="56.4" text-anchor="start" font-size="13" font-weight="700" fill="#355A0A">SRAS</text>
<path d="M80 58.4L290 251.6" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="294" y="263.6" text-anchor="start" font-size="13" font-weight="700" fill="#6B7472">AD<tspan font-size="10" dy="3">1</tspan></text>
<path d="M130 58.4L305 219.4" fill="none" stroke="#9A4A00" stroke-width="2.8" stroke-linecap="round"/>
<text x="305" y="235.4" text-anchor="middle" font-size="13" font-weight="700" fill="#9A4A00">AD<tspan font-size="10" dy="3">2</tspan></text>
<path d="M60 155H185V270" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="185" cy="155" r="4.5" fill="#6B7472"/>
<text x="55" y="159" text-anchor="end" font-size="12" font-weight="700" fill="#6B7472">PL1</text>
<text x="185" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7472">Y1</text>
<path d="M60 132H210V270" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="210" cy="132" r="4.5" fill="#1F2A28"/>
<text x="55" y="136" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A28">PL2</text>
<text x="210" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">Y2</text>
<path d="M117.5 83.7L162.5 83.7" stroke="#9A4A00" stroke-width="2.2" marker-end="url(#adas-short-run-changes-shocks-ar)"/>
<text x="505" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2A28">Cost-push: SRAS shifts left</text>
<path d="M380 40V270H630" fill="none" stroke="#1F2A28" stroke-width="1.8"/>
<text x="630" y="304" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Real GDP</text>
<text transform="translate(350 40) rotate(-90)" text-anchor="end" font-size="13" font-weight="700" fill="#1F2A28">Price level</text>
<path d="M400 58.4L610 251.6" fill="none" stroke="#9A4A00" stroke-width="2.8" stroke-linecap="round"/>
<text x="614" y="263.6" text-anchor="start" font-size="13" font-weight="700" fill="#9A4A00">AD</text>
<path d="M400 251.6L610 58.4" fill="none" stroke="#6B7472" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="614" y="56.4" text-anchor="start" font-size="13" font-weight="700" fill="#6B7472">SRAS<tspan font-size="10" dy="3">1</tspan></text>
<path d="M387.5 217.1L560 58.4" fill="none" stroke="#355A0A" stroke-width="2.8" stroke-linecap="round"/>
<text x="564" y="56.4" text-anchor="start" font-size="13" font-weight="700" fill="#355A0A">SRAS<tspan font-size="10" dy="3">2</tspan></text>
<path d="M380 155H505V270" fill="none" stroke="#6B7472" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="505" cy="155" r="4.5" fill="#6B7472"/>
<text x="375" y="159" text-anchor="end" font-size="12" font-weight="700" fill="#6B7472">PL1</text>
<text x="505" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7472">Y1</text>
<path d="M380 132H480V270" fill="none" stroke="#1F2A28" stroke-width="1.1" stroke-dasharray="3 4"/>
<circle cx="480" cy="132" r="4.5" fill="#1F2A28"/>
<text x="375" y="136" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A28">PL2</text>
<text x="480" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">Y2</text>
<path d="M570 196.4L525 196.4" stroke="#9A4A00" stroke-width="2.2" marker-end="url(#adas-short-run-changes-shocks-ar)"/>
</svg>
