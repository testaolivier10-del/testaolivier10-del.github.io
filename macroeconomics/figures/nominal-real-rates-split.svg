<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The nominal interest rate is the real rate plus the expected inflation rate</title>
<desc id="d">A bar for a 7 percent nominal interest rate split into two parts: a 4 percent real interest rate, the gain in buying power, and a 3 percent expected inflation rate. The real rate equals the nominal rate minus the expected inflation rate.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="760" height="250" fill="#FFFFFF"/>
<text x="380" y="40" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">A loan at a 7% nominal interest rate when lenders expect 3% inflation</text><rect x="70" y="80" width="352" height="60" rx="4" fill="#355A0A" stroke="none" stroke-width="1.5"/><text x="246" y="116" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">Real interest rate: 4%</text><rect x="422" y="80" width="264" height="60" rx="4" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.5"/><text x="554" y="116" font-size="16" fill="#1F2A28" text-anchor="middle" font-weight="700">Expected inflation rate: 3%</text><line x1="70" y1="160" x2="686" y2="160" stroke="#1F2A28" stroke-width="1.5"/><line x1="70" y1="152" x2="70" y2="168" stroke="#1F2A28" stroke-width="1.5"/><line x1="686" y1="152" x2="686" y2="168" stroke="#1F2A28" stroke-width="1.5"/><text x="378" y="188" font-size="15" fill="#1F2A28" text-anchor="middle" font-weight="700">Nominal interest rate: 7% (the rate written on the loan)</text><text x="380" y="228" font-size="15" fill="#5B6662" text-anchor="middle">Real rate = nominal rate - expected inflation rate = 7% - 3% = 4%</text>
</svg>
