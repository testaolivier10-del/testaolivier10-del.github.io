<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="growth-policy-channels-t growth-policy-channels-d" font-family="Arial, Helvetica, sans-serif">
<title id="growth-policy-channels-t">From growth policies to higher potential output</title>
<desc id="growth-policy-channels-d">Four rows: investment incentives and smaller deficits lead to more physical capital; education, training and public health to more human capital; research funding and patents to better technology; roads, ports, power and communications to better infrastructure. All four arrows point to one box: productivity rises, potential output grows, LRAS shifts right and the PPC shifts out. A note says the spending also raises AD in the short run.</desc>
<defs><marker id="growth-policy-channels-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="growth-policy-channels-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="growth-policy-channels-arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="growth-policy-channels-arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker></defs>
<rect width="860" height="440" fill="#FFFFFF"/>
<text x="430" y="30" font-size="19" font-weight="bold" fill="#1F2A28" text-anchor="middle">How public policy can raise long-run growth</text><rect x="24" y="64" width="260" height="64" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="154" y="92" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Tax incentives for investment;</text><text x="154" y="108.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">smaller deficits (lower real rates)</text><line x1="288" y1="96" x2="330" y2="96" stroke="#0072B2" stroke-width="2.2" marker-end="url(#growth-policy-channels-arB)"/><rect x="334" y="64" width="220" height="64" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="444" y="92" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">More physical capital</text><text x="444" y="108.9" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">(machines, factories)</text><line x1="558" y1="96" x2="604" y2="225" stroke="#6B7672" stroke-width="1.8" marker-end="url(#growth-policy-channels-ar)"/><rect x="24" y="150" width="260" height="64" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="154" y="178" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Education, job training,</text><text x="154" y="194.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">public health</text><line x1="288" y1="182" x2="330" y2="182" stroke="#0072B2" stroke-width="2.2" marker-end="url(#growth-policy-channels-arB)"/><rect x="334" y="150" width="220" height="64" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="444" y="178" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">More human capital</text><text x="444" y="194.9" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">(skills, knowledge)</text><line x1="558" y1="182" x2="604" y2="225" stroke="#6B7672" stroke-width="1.8" marker-end="url(#growth-policy-channels-ar)"/><rect x="24" y="236" width="260" height="64" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="154" y="264" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Research funding,</text><text x="154" y="280.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">patent protection</text><line x1="288" y1="268" x2="330" y2="268" stroke="#0072B2" stroke-width="2.2" marker-end="url(#growth-policy-channels-arB)"/><rect x="334" y="236" width="220" height="64" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="444" y="264" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Better technology</text><text x="444" y="280.9" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">(new ideas, methods)</text><line x1="558" y1="268" x2="604" y2="225" stroke="#6B7672" stroke-width="1.8" marker-end="url(#growth-policy-channels-ar)"/><rect x="24" y="322" width="260" height="64" rx="8" fill="#E3EEF8" stroke="#0072B2" stroke-width="2"/><text x="154" y="350" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Roads, ports, power,</text><text x="154" y="366.9" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">communications networks</text><line x1="288" y1="354" x2="330" y2="354" stroke="#0072B2" stroke-width="2.2" marker-end="url(#growth-policy-channels-arB)"/><rect x="334" y="322" width="220" height="64" rx="8" fill="#F2F4F3" stroke="#1F2A28" stroke-width="2"/><text x="444" y="350" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Better infrastructure</text><text x="444" y="366.9" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">(public capital)</text><line x1="558" y1="354" x2="604" y2="225" stroke="#6B7672" stroke-width="1.8" marker-end="url(#growth-policy-channels-ar)"/><rect x="608" y="150" width="228" height="120" rx="8" fill="#EEF4E0" stroke="#355A0A" stroke-width="3"/><text x="722" y="180" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">Productivity rises:</text><text x="722" y="196.9" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">potential output grows,</text><text x="722" y="213.8" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">LRAS shifts right,</text><text x="722" y="230.7" font-size="13" font-weight="bold" fill="#355A0A" text-anchor="middle">the PPC shifts out</text><text x="430" y="420" font-size="13" font-weight="normal" fill="#6B7672" text-anchor="middle">Spending on these programs also raises AD in the short run; the growth effect comes later, through LRAS.</text>
</svg>
