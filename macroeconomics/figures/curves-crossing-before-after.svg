<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" role="img" aria-labelledby="curves-crossing-before-after-t curves-crossing-before-after-d" font-family="Arial, Helvetica, sans-serif">
<title id="curves-crossing-before-after-t">Where two curves cross, before and after a shift</title>
<desc id="curves-crossing-before-after-d">A downward curve D and an upward curve S1 cross at E1, with dashed lines to P1 on the vertical axis and Q1 on the horizontal axis. S shifts left to S2, and the new crossing E2 sits higher and to the left, at P2 above P1 and Q2 below Q1.</desc>
