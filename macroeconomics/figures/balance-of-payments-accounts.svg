<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="balance-of-payments-accounts-t balance-of-payments-accounts-d" font-family="Arial, Helvetica, sans-serif">
<title id="balance-of-payments-accounts-t">The two accounts of the balance of payments</title>
<desc id="balance-of-payments-accounts-d">Two panels for the invented country Arland, in billions of dollars. Current account: exports of goods and services plus 400, imports minus 520, net income from abroad plus 30, net transfers minus 10, for a current account balance of minus 100, a deficit. Capital and financial account: foreigners buy Arland assets plus 250, Arlanders buy foreign assets minus 150, for a balance of plus 100, a surplus. The two balances sum to zero.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A4A00"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5C8A"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7472"/></marker></defs>
<rect width="820" height="430" fill="#FFFFFF"/>
<text x="410" y="34" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="middle">The balance of payments of Arland (invented numbers, billions of dollars)</text><rect x="30" y="60" width="360" height="270" rx="10" fill="#FBEFE3" stroke="#9A4A00" stroke-width="1.6"/><text x="210" y="88" font-size="15" font-weight="bold" fill="#9A4A00" text-anchor="middle">Current account</text><text x="210" y="106" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">trade in goods and services, income, transfers</text><text x="50" y="140" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Exports of goods and services</text><text x="370" y="140" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">+400</text><text x="50" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Imports of goods and services</text><text x="370" y="170" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">-520</text><text x="50" y="200" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Net income from abroad</text><text x="370" y="200" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">+30</text><text x="50" y="230" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Net transfers</text><text x="370" y="230" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">-10</text><line x1="50" y1="262" x2="370" y2="262" stroke="#9A4A00" stroke-width="1.4"/><text x="50" y="290" font-size="14" font-weight="bold" fill="#9A4A00" text-anchor="start">Current account balance</text><text x="370" y="290" font-size="15" font-weight="bold" fill="#9A4A00" text-anchor="end">-100</text><text x="210" y="316" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a deficit: more spent abroad than earned</text><rect x="430" y="60" width="360" height="270" rx="10" fill="#E5EEF6" stroke="#1F5C8A" stroke-width="1.6"/><text x="610" y="88" font-size="15" font-weight="bold" fill="#1F5C8A" text-anchor="middle">Capital and financial account</text><text x="610" y="106" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">purchases and sales of assets</text><text x="450" y="140" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Foreigners buy Arland assets</text><text x="770" y="140" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">+250</text><text x="450" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Arlanders buy foreign assets</text><text x="770" y="170" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">-150</text><text x="450" y="222" font-size="12" font-weight="normal" fill="#6B7472" text-anchor="start">Money flows in (+) when a foreigner pays for</text><text x="450" y="237.8" font-size="12" font-weight="normal" fill="#6B7472" text-anchor="start">an Arland asset; it flows out (-) when an</text><text x="450" y="253.7" font-size="12" font-weight="normal" fill="#6B7472" text-anchor="start">Arlander pays for a foreign one.</text><line x1="450" y1="262" x2="770" y2="262" stroke="#1F5C8A" stroke-width="1.4"/><text x="450" y="290" font-size="14" font-weight="bold" fill="#1F5C8A" text-anchor="start">Capital and financial account balance</text><text x="770" y="290" font-size="15" font-weight="bold" fill="#1F5C8A" text-anchor="end">+100</text><text x="610" y="316" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">a surplus: assets sold abroad pay for it</text><rect x="210" y="352" width="400" height="56" rx="10" fill="#EEF4E0" stroke="#355A0A" stroke-width="1.6"/><text x="410" y="375.7" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Sum: -100 + (+100) = 0</text><text x="410" y="394.1" font-size="14" font-weight="normal" fill="#1F2A28" text-anchor="middle">Every purchase from abroad is paid for somehow.</text>
</svg>
