<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Loanable funds: more government borrowing raises the real interest rate</title>
<desc id="d">A loanable funds graph. The vertical axis is the real interest rate and the horizontal axis is the quantity of loanable funds. Supply SLF slopes up and demand DLF1 slopes down. More government borrowing shifts demand right to DLF2, so the real interest rate rises from r1 to r2 and the quantity of loanable funds rises from Q1 to Q2.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#355A0A"/></marker></defs>
<rect width="520" height="400" fill="#FFFFFF"/>
<line x1="90" y1="330" x2="90" y2="24" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><line x1="90" y1="330" x2="456" y2="330" stroke="#1F2A28" stroke-width="2" marker-end="url(#arr)"/><text x="450" y="374" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">Quantity of loanable funds</text><text x="40" y="30" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700" transform="rotate(-90 40 30)">Real interest rate (r)</text><path d="M126 300L414 60" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="418" y="64" font-size="15" fill="#1F2A28" font-weight="700">S<tspan font-size="11" dy="4">LF</tspan></text><path d="M126 60L414 300" fill="none" stroke="#1F2A28" stroke-width="2.5"/><text x="418" y="304" font-size="15" fill="#1F2A28" font-weight="700">D<tspan font-size="11" dy="4">LF1</tspan></text><path d="M183.6 48L450 270" fill="none" stroke="#0072B2" stroke-width="2.5"/><text x="454" y="274" font-size="15" fill="#0072B2" font-weight="700">D<tspan font-size="11" dy="4">LF2</tspan></text><line x1="198" y1="120" x2="241.2" y2="102" stroke="#D55E00" stroke-width="2.5" marker-end="url(#arrV)"/><line x1="90" y1="180" x2="270" y2="180" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="270" y1="180" x2="270" y2="330" stroke="#5B6662" stroke-width="1.3" stroke-dasharray="5 4"/><text x="82" y="185" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">r<tspan font-size="10" dy="4">1</tspan></text><text x="270" y="348" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">1</tspan></text><line x1="90" y1="150" x2="306" y2="150" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="306" y1="150" x2="306" y2="330" stroke="#0072B2" stroke-width="1.3" stroke-dasharray="5 4"/><text x="82" y="155" font-size="14" fill="#1F2A28" text-anchor="end" font-weight="700">r<tspan font-size="10" dy="4">2</tspan></text><text x="306" y="348" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Q<tspan font-size="10" dy="4">2</tspan></text><circle cx="270" cy="180" r="5" fill="#1F2A28"/><circle cx="306" cy="150" r="5" fill="#0072B2"/>
</svg>
