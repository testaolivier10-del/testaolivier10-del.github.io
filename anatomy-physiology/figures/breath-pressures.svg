<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-label="Two stacked graphs over one quiet breath lasting 4 seconds: 2 seconds breathing in, then 2 seconds breathing out. Top: the change in lung volume rises smoothly from 0 to about 0.5 liters at 2 seconds and falls back to 0 at 4 seconds. Bottom: pressures in mm Hg relative to atmospheric pressure, which is the flat line at 0. Alveolar pressure dips to about minus 1 at 1 second, returns to 0 at 2 seconds, rises to about plus 1 at 3 seconds and returns to 0 at 4 seconds. Intrapleural pressure starts at about minus 4, falls to about minus 6 during breathing in, and rises back to about minus 4 during breathing out. The gap between the alveolar and intrapleural curves is the transpulmonary pressure; it rises and falls with lung volume, from 4 mm Hg at rest to about 6 at the end of breathing in.">
