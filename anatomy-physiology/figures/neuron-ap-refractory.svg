<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-label="A graph of a neuron membrane potential in millivolts against time in milliseconds, from 0 to 6 ms, with six numbered phases. 1: the membrane rests at minus 70. 2: after a stimulus at 0.5 ms it depolarizes to the threshold line at minus 55, reached at about 0.9 ms. 3: the rising phase shoots up to a peak of about plus 30 at 1.4 ms. 4: the falling phase drops back to minus 70 by about 2.2 ms. 5: the afterhyperpolarization dips to about minus 80 near 2.8 ms. 6: the membrane returns to rest at minus 70 by about 5 ms. A shaded band from about 0.9 to 2.1 ms marks the absolute refractory period, and a second band from about 2.1 to 4.8 ms marks the relative refractory period.">
