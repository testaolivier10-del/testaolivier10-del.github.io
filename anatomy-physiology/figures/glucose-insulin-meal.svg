<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" aria-label="Two stacked graphs over the 3 hours after a carbohydrate meal eaten at time 0. Top: blood glucose in mg/dL, with a shaded normal fasting range of 70 to 99. In a healthy person, glucose starts at about 88, peaks at about 135 at 45 minutes, is back below 100 by 2 hours and is at about 86 by 2.5 hours. In a person with type 2 diabetes, shown as a dashed line, glucose starts at about 140, rises to a peak of about 240 at 90 minutes, and is still about 190 at 3 hours. Bottom: plasma insulin in a healthy person in microunits per mL. It starts at about 6, jumps within 5 to 10 minutes, peaks at about 58 at 45 minutes, and falls back to about 7 by 3 hours, rising and falling with glucose.">
