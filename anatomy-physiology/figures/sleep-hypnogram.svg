<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="A graph of sleep stages across an 8-hour night. The vertical axis lists, from top to bottom, awake, REM, N1, N2 and N3 (deep); the horizontal axis shows hours 0 to 8 after lights out. The line drops from awake through N1 and N2 to N3 within the first hour, then cycles up and down about every 90 minutes. Long periods of N3 occur in the first two cycles, a short one in the third, and none after about 4 hours. REM periods, highlighted in color, are short early in the night (about 10 minutes at 1.4 hours) and get longer toward morning (about 40 minutes near 7 hours). Brief awakenings occur late in the night.">
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
<rect x="0" y="0" width="700" height="320" fill="#FFFFFF"/>
<line x1="110" y1="60" x2="670" y2="60" stroke="#EEF2F1" stroke-width="1.5"/>
<text x="100" y="65" font-size="13.5" font-weight="700" text-anchor="end">Awake</text>
<line x1="110" y1="105" x2="670" y2="105" stroke="#EEF2F1" stroke-width="1.5"/>
<text x="100" y="110" font-size="13.5" font-weight="700" text-anchor="end">REM</text>
<line x1="110" y1="150" x2="670" y2="150" stroke="#EEF2F1" stroke-width="1.5"/>
<text x="100" y="155" font-size="13.5" font-weight="700" text-anchor="end">N1</text>
<line x1="110" y1="195" x2="670" y2="195" stroke="#EEF2F1" stroke-width="1.5"/>
<text x="100" y="200" font-size="13.5" font-weight="700" text-anchor="end">N2</text>
<line x1="110" y1="240" x2="670" y2="240" stroke="#EEF2F1" stroke-width="1.5"/>
<text x="100" y="245" font-size="13.5" font-weight="700" text-anchor="end">N3 (deep)</text>
<polyline fill="none" stroke="#1F2A28" stroke-width="2.5" points="110.0,60 124.0,60 124.0,150 131.0,150 131.0,195 152.0,195 152.0,240 194.0,240 194.0,195 208.0,195 208.0,105 222.0,105 222.0,195 250.0,195 250.0,240 292.0,240 292.0,195 313.0,195 313.0,105 337.5,105 337.5,195 383.0,195 383.0,240 397.0,240 397.0,195 418.0,195 418.0,105 453.0,105 453.0,150 460.0,150 460.0,195 523.0,195 523.0,105 572.0,105 572.0,60 577.6,60 577.6,195 614.0,195 614.0,105 663.0,105 663.0,60 670.0,60"/>
<line x1="208.0" y1="105" x2="222.0" y2="105" stroke="#A33B26" stroke-width="9" stroke-linecap="butt"/>
<line x1="313.0" y1="105" x2="337.5" y2="105" stroke="#A33B26" stroke-width="9" stroke-linecap="butt"/>
<line x1="418.0" y1="105" x2="453.0" y2="105" stroke="#A33B26" stroke-width="9" stroke-linecap="butt"/>
<line x1="523.0" y1="105" x2="572.0" y2="105" stroke="#A33B26" stroke-width="9" stroke-linecap="butt"/>
<line x1="614.0" y1="105" x2="663.0" y2="105" stroke="#A33B26" stroke-width="9" stroke-linecap="butt"/>
<line x1="110" y1="265" x2="670" y2="265" stroke="#5D6B69" stroke-width="2"/>
<line x1="110.0" y1="265" x2="110.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="110.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">0</text>
<line x1="180.0" y1="265" x2="180.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="180.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
<line x1="250.0" y1="265" x2="250.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="250.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
<line x1="320.0" y1="265" x2="320.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="320.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
<line x1="390.0" y1="265" x2="390.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="390.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
<line x1="460.0" y1="265" x2="460.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="460.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
<line x1="530.0" y1="265" x2="530.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="530.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">6</text>
<line x1="600.0" y1="265" x2="600.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="600.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">7</text>
<line x1="670.0" y1="265" x2="670.0" y2="271" stroke="#5D6B69" stroke-width="2"/>
<text x="670.0" y="287" font-size="12.5" font-weight="700" text-anchor="middle">8</text>
<text x="390.0" y="310" font-size="13" font-weight="700" text-anchor="middle">Hours after lights out</text>
<text x="110" y="28" font-size="14" font-weight="800">Sleep stages across one night</text>
</g>
</svg>
