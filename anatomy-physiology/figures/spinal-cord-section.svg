<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-label="A cross section of the spinal cord with the back (dorsal) side at the top. A butterfly-shaped core of gray matter surrounds a tiny central canal. Its two narrow dorsal horns reach toward the back, two broad ventral horns reach toward the front, and small lateral horns stick out at the sides. The white matter around it is divided on each side into posterior, lateral and anterior columns, with a shallow posterior median sulcus at the back and a deep anterior median fissure at the front. On the left, an orange dorsal root with a swollen dorsal root ganglion enters the back of the cord, and a blue ventral root leaves the front; the two join into one nerve.">
