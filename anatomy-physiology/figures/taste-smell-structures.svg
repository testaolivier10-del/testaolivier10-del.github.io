<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Two panels. Left, a taste bud: a pale, onion-shaped cluster of long, thin gustatory receptor cells set into the lining epithelium of the tongue. Their tips carry microvilli that poke into a small taste pore opening at the surface. Small basal cells sit at the base of the bud, and orange sensory nerve fibers enter the base and wrap around the receptor cells. Right, the olfactory epithelium in the roof of the nose, drawn with the bone above and the airway below. Orange olfactory sensory neurons have their cell bodies in the epithelium between tall supporting cells, with basal stem cells along the deep side. Each neuron sends a dendrite down to the surface, where hair-like cilia spread out in a layer of mucus that odorant molecules dissolve into, and an axon up through a hole in the cribriform plate of the ethmoid bone to synapse in the olfactory bulb, which continues backward as the olfactory tract.">
