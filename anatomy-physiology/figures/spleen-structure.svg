<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-label="Left, the spleen seen from behind: a fist-sized, dark red organ with a notch on its inner side, the hilum, where the splenic artery enters and the splenic vein leaves. Right, a magnified slice of its tissue under a thin capsule, with a trabecula running inward. Most of the slice is red pulp, dotted with oval venous sinuses. Scattered through it are three pale round islands of white pulp, each wrapped around a small central artery.">
