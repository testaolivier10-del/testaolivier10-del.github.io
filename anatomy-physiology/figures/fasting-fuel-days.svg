<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="Two stacked graphs over 28 days without food, with water. Top: where the brain gets its energy, in percent. Glucose supplies 100 percent for the first day, then its share falls to about 75 percent by day 3, 50 percent by day 7 and about a third by day 28. Ketone bodies supply the rest, rising from almost nothing to about two thirds. A dashed line at day 1 marks the point where liver glycogen is nearly gone. Bottom: muscle protein broken down per day, in grams. It is about 75 grams a day in the first days, then falls to about 50 by day 7, 30 by day 14 and about 20 by day 28, as the brain relies more on ketone bodies and needs less new glucose.">
<rect x="0" y="0" width="640" height="560" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
<line x1="108.2" y1="40" x2="108.2" y2="490" stroke="#5D6B69" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="114.2" y="36" font-size="12.5" font-weight="700">liver glycogen nearly gone (about day 1)</text>
<line x1="90" y1="250" x2="600" y2="250" stroke="#5D6B69" stroke-width="2"/>
<line x1="90" y1="250" x2="90" y2="46" stroke="#5D6B69" stroke-width="2"/>
<line x1="86" y1="250" x2="90" y2="250" stroke="#5D6B69" stroke-width="2"/><text x="82" y="254" font-size="12.5" font-weight="700" text-anchor="end">0</text>
<line x1="86" y1="200" x2="90" y2="200" stroke="#5D6B69" stroke-width="2"/><text x="82" y="204" font-size="12.5" font-weight="700" text-anchor="end">25</text>
<line x1="86" y1="150" x2="90" y2="150" stroke="#5D6B69" stroke-width="2"/><text x="82" y="154" font-size="12.5" font-weight="700" text-anchor="end">50</text>
<line x1="86" y1="100" x2="90" y2="100" stroke="#5D6B69" stroke-width="2"/><text x="82" y="104" font-size="12.5" font-weight="700" text-anchor="end">75</text>
<line x1="86" y1="50" x2="90" y2="50" stroke="#5D6B69" stroke-width="2"/><text x="82" y="54" font-size="12.5" font-weight="700" text-anchor="end">100</text>
<text x="330" y="90" font-size="12.5" font-weight="700">Share of the brain's energy (%)</text>
<polyline fill="none" stroke="#0072B2" stroke-width="3" points="90.0,50.0 108.2,50.0 126.4,70.0 144.6,100.0 181.1,130.0 217.5,150.0 272.1,160.0 345.0,170.0 472.5,180.0 600.0,184.0"/>
<polyline fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="9 5" points="90.0,250.0 108.2,250.0 126.4,230.0 144.6,200.0 181.1,170.0 217.5,150.0 272.1,140.0 345.0,130.0 472.5,120.0 600.0,116.0"/>
<text x="454.3" y="202.0" font-size="15" font-weight="800" fill="#0072B2">glucose</text>
<text x="399.6" y="110.0" font-size="15" font-weight="800" fill="#B07800">ketone bodies</text>
<line x1="90" y1="490" x2="600" y2="490" stroke="#5D6B69" stroke-width="2"/>
<line x1="90" y1="490" x2="90" y2="330" stroke="#5D6B69" stroke-width="2"/>
<line x1="86" y1="490.0" x2="90" y2="490.0" stroke="#5D6B69" stroke-width="2"/><text x="82" y="494.0" font-size="12.5" font-weight="700" text-anchor="end">0</text>
<line x1="86" y1="452.5" x2="90" y2="452.5" stroke="#5D6B69" stroke-width="2"/><text x="82" y="456.5" font-size="12.5" font-weight="700" text-anchor="end">20</text>
<line x1="86" y1="415.0" x2="90" y2="415.0" stroke="#5D6B69" stroke-width="2"/><text x="82" y="419.0" font-size="12.5" font-weight="700" text-anchor="end">40</text>
<line x1="86" y1="377.5" x2="90" y2="377.5" stroke="#5D6B69" stroke-width="2"/><text x="82" y="381.5" font-size="12.5" font-weight="700" text-anchor="end">60</text>
<line x1="86" y1="340.0" x2="90" y2="340.0" stroke="#5D6B69" stroke-width="2"/><text x="82" y="344.0" font-size="12.5" font-weight="700" text-anchor="end">80</text>
<text x="96" y="326" font-size="12.5" font-weight="700">Muscle protein broken down (g per day)</text>
<polyline fill="none" stroke="#CC79A7" stroke-width="3" points="99.1,349.4 126.4,349.4 144.6,358.8 181.1,377.5 217.5,396.2 272.1,415.0 345.0,433.8 472.5,448.8 600.0,452.5"/>
<text x="363.2" y="421.8" font-size="15" font-weight="800" fill="#A04F80">protein</text>
<line x1="90.0" y1="490" x2="90.0" y2="494" stroke="#5D6B69" stroke-width="2"/><text x="90.0" y="510" font-size="12.5" font-weight="700" text-anchor="middle">0</text>
<line x1="217.5" y1="490" x2="217.5" y2="494" stroke="#5D6B69" stroke-width="2"/><text x="217.5" y="510" font-size="12.5" font-weight="700" text-anchor="middle">7</text>
<line x1="345.0" y1="490" x2="345.0" y2="494" stroke="#5D6B69" stroke-width="2"/><text x="345.0" y="510" font-size="12.5" font-weight="700" text-anchor="middle">14</text>
<line x1="472.5" y1="490" x2="472.5" y2="494" stroke="#5D6B69" stroke-width="2"/><text x="472.5" y="510" font-size="12.5" font-weight="700" text-anchor="middle">21</text>
<line x1="600.0" y1="490" x2="600.0" y2="494" stroke="#5D6B69" stroke-width="2"/><text x="600.0" y="510" font-size="12.5" font-weight="700" text-anchor="middle">28</text>
<text x="345" y="536" font-size="15" font-weight="800" text-anchor="middle">Days without food (water available)</text>
</g></svg>
