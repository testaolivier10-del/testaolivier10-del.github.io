<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" aria-label="Four small graphs of membrane potential at a neuron trigger zone against time, 0 to 40 milliseconds, each with dashed lines at rest, minus 70, and threshold, minus 55. A, one EPSP: excitatory input E1 fires once, and the membrane rises about 6 millivolts, then fades back to rest without reaching threshold. B, temporal summation: E1 fires three times, 3 milliseconds apart; each small depolarization starts before the last has faded, so they stack up to threshold and an action potential fires. C, spatial summation: inputs E1, E2 and E3 fire at the same moment; their depolarizations add into one large one that reaches threshold, and an action potential fires. D, EPSP plus IPSP: E1 and inhibitory input I1 fire together; the depolarization and hyperpolarization nearly cancel, and the membrane barely moves from rest.">
