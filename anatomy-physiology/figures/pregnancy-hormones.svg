<line x1="76" y1="270.0" x2="80" y2="270.0" stroke="#5D6B69" stroke-width="2"/><text x="72" y="274.0" font-size="12.5" font-weight="700" text-anchor="end">25</text>
<line x1="76" y1="200.0" x2="80" y2="200.0" stroke="#5D6B69" stroke-width="2"/><text x="72" y="204.0" font-size="12.5" font-weight="700" text-anchor="end">50</text>
<line x1="76" y1="130.0" x2="80" y2="130.0" stroke="#5D6B69" stroke-width="2"/><text x="72" y="134.0" font-size="12.5" font-weight="700" text-anchor="end">75</text>
<line x1="76" y1="60.0" x2="80" y2="60.0" stroke="#5D6B69" stroke-width="2"/><text x="72" y="64.0" font-size="12.5" font-weight="700" text-anchor="end">100</text>
<line x1="80.0" y1="340" x2="80.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="80.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">0</text>
<line x1="184.0" y1="340" x2="184.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="184.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">8</text>
<line x1="288.0" y1="340" x2="288.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="288.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">16</text>
<line x1="392.0" y1="340" x2="392.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="392.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">24</text>
<line x1="496.0" y1="340" x2="496.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="496.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">32</text>
<line x1="600.0" y1="340" x2="600.0" y2="344" stroke="#5D6B69" stroke-width="2"/><text x="600.0" y="360" font-size="12.5" font-weight="700" text-anchor="middle">40</text>
<text x="340.0" y="384" font-size="15" font-weight="800" text-anchor="middle">Weeks of pregnancy (counted from the last menstrual period)</text>
<text x="22" y="200.0" font-size="15" font-weight="800" text-anchor="middle" transform="rotate(-90 22 200.0)">Level (% of that hormone's own peak)</text>
