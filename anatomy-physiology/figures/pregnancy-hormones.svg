<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="A line graph of four hormones across pregnancy, each drawn as a percent of its own highest level, against weeks of pregnancy from 0 to 40 counted from the last menstrual period. hCG rises steeply from about week 4, peaks at week 10, falls to about 20 percent by week 18 and stays low to the end. Progesterone starts at about 10 percent, stays nearly flat until about week 10, then climbs steadily to its peak at week 40. Estrogens start near zero and climb slowly, then more and more steeply, to their peak at week 40. hPL starts near zero at week 8 and rises steadily to a plateau from about week 36. A shaded band from week 7 to week 9 marks where the main source of progesterone shifts from the corpus luteum to the placenta.">
<rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
<rect x="171.0" y="60" width="26.0" height="280" fill="#EEF2F1"/>
<text x="167.0" y="38" font-size="12.5" font-weight="700">progesterone source shifts</text>
<text x="167.0" y="52" font-size="12.5" font-weight="700">from corpus luteum to placenta</text>
<line x1="80" y1="340" x2="600" y2="340" stroke="#5D6B69" stroke-width="2"/>
<line x1="80" y1="340" x2="80" y2="54" stroke="#5D6B69" stroke-width="2"/>
