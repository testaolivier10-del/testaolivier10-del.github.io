<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-label="The same spinal cord cross section, back side at the top, with nine numbered pointers on the right and three on the left instead of names. On the right, from top to bottom: 1, the shallow midline groove at the back; 2, the white matter between that groove and the dorsal horn; 3, the narrow gray horn reaching toward the back; 4, the small gray bump at the side; 5, the white matter at the side; 6, the tiny hole in the center; 7, the broad gray horn reaching toward the front; 8, the white matter at the front beside the midline; 9, the deep midline groove at the front. On the left: 10, the orange root entering the back of the cord; 11, the swelling on that root; 12, the blue root leaving the front.">
