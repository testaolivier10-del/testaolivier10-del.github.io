<circle cx="593.3" cy="351.0" r="4.5" fill="#5B6B8C"/><circle cx="690.0" cy="357.3" r="4.5" fill="#5B6B8C"/>
<text x="311.3" y="69.4" font-size="12.5" font-weight="700" text-anchor="start">1,200</text>
<text x="410.0" y="362.6" font-size="12.5" font-weight="700" text-anchor="start">100</text>
<text x="650.0" y="90.8" font-size="12.5" font-weight="700" text-anchor="end" fill="#B34A00">high ADH: 1,200</text>
<text x="684.0" y="345.3" font-size="12.5" font-weight="700" text-anchor="end" fill="#5B6B8C">no ADH: 50</text>
</g>
