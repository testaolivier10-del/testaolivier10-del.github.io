<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" role="img" aria-label="A graph of the osmolarity of the fluid inside the tubule, from 0 to 1,300 mOsm/L, at six points along the nephron from left to right: start of the proximal tubule, end of the proximal tubule, tip of the nephron loop, start of the distal tubule, end of the distal tubule, and end of the collecting duct. A shaded band marks the points that lie in the renal medulla. The fluid is 300 at the start and still 300 at the end of the proximal tubule. It climbs to 1,200 at the tip of the loop, deep in the medulla, then falls to about 100 by the start of the distal tubule and stays about 100 through it. There the line splits. With high ADH, it rises to 300 by the end of the cortical collecting duct and to 1,200 at the end of the collecting duct. With no ADH, shown dashed, it falls to about 50. A dotted line at 300 marks the osmolarity of plasma.">
<rect x="0" y="0" width="740" height="470" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
<rect x="250.2" y="40" width="106.3" height="330" fill="#EFD5CF" stroke="none"/>
<text x="303.3" y="362.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8E3B2E">renal medulla</text>
<rect x="641.7" y="40" width="78.3" height="330" fill="#EFD5CF" stroke="none"/>
<text x="680.8" y="56.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8E3B2E">renal medulla</text>
<line x1="80" y1="370" x2="720" y2="370" stroke="#5D6B69" stroke-width="2"/>
<line x1="80" y1="370" x2="80" y2="40" stroke="#5D6B69" stroke-width="2"/>
<line x1="76" y1="370.0" x2="80" y2="370.0" stroke="#5D6B69" stroke-width="2"/>
<text x="72.0" y="374.0" font-size="12.5" font-weight="700" text-anchor="end">0</text>
<line x1="76" y1="293.8" x2="80" y2="293.8" stroke="#5D6B69" stroke-width="2"/>
<text x="72.0" y="297.8" font-size="12.5" font-weight="700" text-anchor="end">300</text>
<line x1="76" y1="217.7" x2="80" y2="217.7" stroke="#5D6B69" stroke-width="2"/>
<text x="72.0" y="221.7" font-size="12.5" font-weight="700" text-anchor="end">600</text>
<line x1="76" y1="141.5" x2="80" y2="141.5" stroke="#5D6B69" stroke-width="2"/>
<text x="72.0" y="145.5" font-size="12.5" font-weight="700" text-anchor="end">900</text>
<line x1="76" y1="65.4" x2="80" y2="65.4" stroke="#5D6B69" stroke-width="2"/>
<text x="72.0" y="69.4" font-size="12.5" font-weight="700" text-anchor="end">1,200</text>
<line x1="80" y1="293.8" x2="720" y2="293.8" stroke="#5D6B69" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="410.0" y="287.8" font-size="11.5" font-weight="700" text-anchor="start" fill="#5D6B69">plasma ≈ 300</text>
<text x="110.0" y="388.0" font-size="11" font-weight="700" text-anchor="middle">start of</text>
<text x="110.0" y="402.0" font-size="11" font-weight="700" text-anchor="middle">proximal tubule</text>
<text x="206.7" y="388.0" font-size="11" font-weight="700" text-anchor="middle">end of</text>
<text x="206.7" y="402.0" font-size="11" font-weight="700" text-anchor="middle">proximal tubule</text>
<text x="303.3" y="388.0" font-size="11" font-weight="700" text-anchor="middle">tip of</text>
<text x="303.3" y="402.0" font-size="11" font-weight="700" text-anchor="middle">nephron loop</text>
<text x="400.0" y="388.0" font-size="11" font-weight="700" text-anchor="middle">start of</text>
<text x="400.0" y="402.0" font-size="11" font-weight="700" text-anchor="middle">distal tubule</text>
<text x="496.7" y="388.0" font-size="11" font-weight="700" text-anchor="middle">end of</text>
<text x="496.7" y="402.0" font-size="11" font-weight="700" text-anchor="middle">distal tubule</text>
<text x="593.3" y="388.0" font-size="11" font-weight="700" text-anchor="middle">end of cortical</text>
<text x="593.3" y="402.0" font-size="11" font-weight="700" text-anchor="middle">collecting duct</text>
<text x="690.0" y="388.0" font-size="11" font-weight="700" text-anchor="middle">end of</text>
<text x="690.0" y="402.0" font-size="11" font-weight="700" text-anchor="middle">collecting duct</text>
<text x="86.0" y="26.0" font-size="13.5" font-weight="700" text-anchor="start">Osmolarity of tubular fluid (mOsm/L)</text>
<text x="400.0" y="432.0" font-size="13.5" font-weight="700" text-anchor="middle">Position along the nephron</text>
