<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="A lymph node cut in half, drawn as a bean with its indented side, the hilum, on the right. A tough capsule surrounds it, with a narrow space, the subcapsular sinus, just inside. Four afferent lymphatic vessels enter through the capsule on the curved outer surface. Partitions called trabeculae run inward from the capsule. The outer cortex holds round lymphoid nodules, each with a pale germinal center. Deeper, a shaded band, the paracortex, surrounds the medulla, where cords of cells and sinuses run toward the hilum. At the hilum a single efferent lymphatic vessel leaves, beside an artery and a vein. A dashed line traces lymph from an afferent vessel inward toward the medulla.">
