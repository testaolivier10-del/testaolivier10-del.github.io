<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" role="img" aria-label="Left: a kidney with the adrenal gland sitting on its upper end like a cap; a box marks the slice enlarged on the right. Right: a slice through the adrenal gland from its surface (top) to its center (bottom). A thin connective tissue capsule covers the surface. Under it, the cortex has three layers: a thin zona glomerulosa of cells in rounded clusters, which makes aldosterone; a thick zona fasciculata of cells in straight columns, which makes cortisol; and a zona reticularis of cells in a branching network, which makes adrenal androgens such as DHEA. At the center is the medulla, with larger chromaffin cells around a blood vessel, which makes epinephrine and norepinephrine.">
