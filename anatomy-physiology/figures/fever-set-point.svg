<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Graph of temperature in degrees Celsius, from 36 to 40, against time in hours, from 0 to 14. A dashed line shows the hypothalamic set point: flat at about 36.6 until hour 2, when pyrogens arrive, then a sudden step up to 39, flat until hour 10, when pyrogens are cleared, then a sudden step back down to 36.6. A solid line shows core body temperature. It stays at 36.6 until hour 2, then climbs over about an hour and a half to just under 39, lagging below the dashed line; it holds there until hour 10, then falls back to 36.6 over about an hour and a half, lagging above the dashed line. Three marked times: A at about hour 3, while body temperature is still below the raised set point; B at hour 6, on the plateau where the two lines meet; C at about hour 11, while body temperature is still above the lowered set point.">
