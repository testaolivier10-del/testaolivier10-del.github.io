<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Graph of membrane potential at the motor end plate, in millivolts from minus 100 to plus 40, against time in milliseconds from 0 to 12. A dashed horizontal line marks threshold at about minus 55 millivolts. Both traces start at rest, about minus 90. Trace A, a normal junction: at 1 millisecond the membrane depolarizes quickly past threshold and fires an action potential that peaks near plus 30, then returns to rest by about 4 milliseconds. Trace B, the same junction after a drug has blocked most of its acetylcholine receptor proteins: the membrane depolarizes only to about minus 75, stays well below threshold, and fades back to rest over several milliseconds with no action potential.">
