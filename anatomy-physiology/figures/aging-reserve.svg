<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Graph of functional capacity, as a percentage of peak, from 0 to 100, against age in years, from 20 to 90. A solid curve of maximal capacity stays at 100 until age 30, then falls slowly and then faster, to about 70 at age 65, 55 at age 80 and 44 at age 90. A dashed horizontal line at 25 is labeled needed at rest; the curve stays above it across the whole graph. A dashed horizontal line at 60 is labeled needed during a major stress, such as pneumonia; the curve crosses below it at about age 75. Point A marks age 30, where capacity is far above both lines. Point B marks age 80, where capacity is above the resting line but below the stress line.">
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
<line x1="90" y1="360" x2="720" y2="360" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="365" font-size="13" font-weight="700" text-anchor="end">0</text>
<line x1="90" y1="300" x2="720" y2="300" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="305" font-size="13" font-weight="700" text-anchor="end">20</text>
<line x1="90" y1="240" x2="720" y2="240" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="245" font-size="13" font-weight="700" text-anchor="end">40</text>
<line x1="90" y1="180" x2="720" y2="180" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="185" font-size="13" font-weight="700" text-anchor="end">60</text>
<line x1="90" y1="120" x2="720" y2="120" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="125" font-size="13" font-weight="700" text-anchor="end">80</text>
<line x1="90" y1="60" x2="720" y2="60" stroke="#E4E9E8" stroke-width="1"/>
<text x="80" y="65" font-size="13" font-weight="700" text-anchor="end">100</text>
<text x="90" y="380" font-size="13" font-weight="700" text-anchor="middle">20</text>
<text x="180" y="380" font-size="13" font-weight="700" text-anchor="middle">30</text>
<text x="270" y="380" font-size="13" font-weight="700" text-anchor="middle">40</text>
<text x="360" y="380" font-size="13" font-weight="700" text-anchor="middle">50</text>
<text x="450" y="380" font-size="13" font-weight="700" text-anchor="middle">60</text>
<text x="540" y="380" font-size="13" font-weight="700" text-anchor="middle">70</text>
<text x="630" y="380" font-size="13" font-weight="700" text-anchor="middle">80</text>
<text x="720" y="380" font-size="13" font-weight="700" text-anchor="middle">90</text>
<line x1="90" y1="360" x2="720" y2="360" stroke="#5D6B69" stroke-width="2"/>
<line x1="90" y1="360" x2="90" y2="50" stroke="#5D6B69" stroke-width="2"/>
<text x="405" y="410" font-size="14" font-weight="700" text-anchor="middle">Age (years)</text>
<text x="30" y="205" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 30 205)">Functional capacity (% of peak)</text>
<line x1="90" y1="180" x2="720" y2="180" stroke="#8E3B2E" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="100" y="172" font-size="13" fill="#8E3B2E" font-weight="700">needed during a major stress (for example, pneumonia)</text>
<line x1="90" y1="285" x2="720" y2="285" stroke="#009E73" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="100" y="277" font-size="13" fill="#007A59" font-weight="700">needed at rest</text>
<polyline points="90.0,60.0 99.0,60.0 108.0,60.0 117.0,60.0 126.0,60.0 135.0,60.0 144.0,60.0 153.0,60.0 162.0,60.0 171.0,60.0 180.0,60.0 189.0,62.1 198.0,64.2 207.0,66.4 216.0,68.6 225.0,70.8 234.0,73.0 243.0,75.3 252.0,77.6 261.0,79.9 270.0,82.2 279.0,84.6 288.0,86.9 297.0,89.3 306.0,91.8 315.0,94.2 324.0,96.7 333.0,99.2 342.0,101.7 351.0,104.2 360.0,106.8 369.0,109.4 378.0,112.0 387.0,114.6 396.0,117.3 405.0,120.0 414.0,122.7 423.0,125.4 432.0,128.2 441.0,131.0 450.0,133.8 459.0,136.6 468.0,139.5 477.0,142.4 486.0,145.3 495.0,148.2 504.0,151.2 513.0,154.1 522.0,157.1 531.0,160.2 540.0,163.2 549.0,166.3 558.0,169.4 567.0,172.5 576.0,175.6 585.0,178.8 594.0,182.0 603.0,185.2 612.0,188.4 621.0,191.7 630.0,195.0 639.0,198.3 648.0,201.6 657.0,205.0 666.0,208.4 675.0,211.8 684.0,215.2 693.0,218.7 702.0,222.2 711.0,225.7 720.0,229.2" fill="none" stroke="#0072B2" stroke-width="3.5"/>
<text x="270" y="68.20000000000005" font-size="13" fill="#0072B2" font-weight="700">maximal capacity</text>
<circle cx="180" cy="60.0" r="6" fill="#1F2A28"/>
