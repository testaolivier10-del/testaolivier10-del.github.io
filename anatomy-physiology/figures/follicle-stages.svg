<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Eight numbered drawings of one follicle's life, left to right in two rows. 1: a primordial follicle, a small oocyte in a single layer of flat cells. 2: a primary follicle, a larger oocyte in one layer of cube-shaped granulosa cells. 3: a secondary follicle, with several layers of granulosa cells and a new outer layer of theca cells. 4: a tertiary follicle, larger, with a fluid-filled space, the antrum, forming among the granulosa cells. 5: a vesicular (Graafian) follicle, about 2 cm, with a large antrum and the oocyte on a mound of granulosa cells at one side. 6: ovulation, the follicle wall open and the oocyte leaving with a ring of granulosa cells. 7: the corpus luteum, a folded yellow body that lasts about two weeks. 8: the corpus albicans, a small pale scar.">
