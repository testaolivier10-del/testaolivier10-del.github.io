<line x1="433" y1="168" x2="468" y2="126" stroke="#E69F00" stroke-width="16" stroke-linecap="round"/>
<line x1="308" y1="262" x2="332" y2="262" stroke="#1F2A28" stroke-width="3"/>
<line x1="308" y1="274" x2="332" y2="274" stroke="#1F2A28" stroke-width="3"/>
<line x1="262" y1="200" x2="252" y2="210" stroke="#1F2A28" stroke-width="3"/>
<line x1="378" y1="200" x2="388" y2="210" stroke="#1F2A28" stroke-width="3"/>
<polygon points="170,86 182,100 170,114 158,100" fill="#CC79A7" stroke="#1F2A28" stroke-width="1.5" transform="rotate(0)"/>
<polygon points="470,86 482,100 470,114 458,100" fill="#CC79A7" stroke="#1F2A28" stroke-width="1.5" transform="rotate(0)"/>
<text x="40" y="52" font-size="15" font-weight="800" text-anchor="start" fill="#1F2A28">antigen</text>
