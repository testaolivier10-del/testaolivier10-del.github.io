<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="A Y-shaped antibody made of four protein chains. Two long heavy chains run from the tips of the arms down through the stem. Two short light chains lie along the outer side of each arm. Disulfide bonds join the chains. The tip of each arm, made of the ends of one heavy and one light chain, is shaded as the variable region and forms an antigen-binding site holding a small antigen. The rest of the chains is the constant region. The stem, made of the two heavy chains only, is labeled the Fc region; the hinge sits where the arms meet the stem.">
<rect x="0" y="0" width="640" height="460" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#1F2A28">
