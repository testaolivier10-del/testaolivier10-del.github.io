<style>
  /* Profile (assets/profile.js, docs/progress-profile.md): one column, the light channel look of account.html. */
  .pf{max-width:980px;margin:28px auto 56px;display:grid;gap:18px;}
  .pf-card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:24px 26px;box-shadow:0 18px 40px -34px rgba(11,26,51,.45);}
  .pf-card h2{font:900 21px var(--font-display,var(--font-ui));letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);}
  .pf-mut{color:var(--muted);font:600 14.5px/1.5 var(--font-ui);margin:0;}
  .pf-mut a{color:var(--accent-text,var(--accent));font-weight:800;}
  .pf-who{display:flex;align-items:center;gap:16px;}
  .pf-av{width:64px;height:64px;border-radius:50%;background:#0B1A33;color:#2EE6D6;display:grid;place-items:center;font:900 26px var(--font-ui);flex:none;}
  .pf-who h1{font:900 clamp(30px,4vw,40px)/1 var(--font-display,var(--font-ui));letter-spacing:-.04em;margin:0 0 6px;color:var(--ink);}
  .pf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px;}
  .pf-st{background:var(--surface2);border-radius:14px;padding:12px 14px;}
  .pf-st b{display:block;font:900 20px var(--font-ui);color:var(--ink);}
  .pf-st span{display:block;font:700 12.5px var(--font-ui);color:var(--muted);margin-top:2px;}
  .pf-xp{display:block;height:6px;border-radius:99px;background:var(--track,var(--line));margin-top:8px;overflow:hidden;}
  .pf-xp i{display:block;height:100%;border-radius:99px;background:var(--accent);}
  .pf-cv{width:56px;height:56px;border-radius:12px;object-fit:cover;object-position:right center;flex:none;background:var(--panel,#0B1A33);}
  .pf-cal{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px;padding-bottom:2px;}
  .pf-d{aspect-ratio:1;border-radius:4px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);}
  .pf-d.off{visibility:hidden;}
  .pf-d.a{background:#9FE3D6;box-shadow:none;}.pf-d.b{background:#2BB3A0;box-shadow:none;}.pf-d.c{background:#0B6B62;box-shadow:none;}
  .pf-d.t{outline:2px solid var(--ink);outline-offset:1px;}
  .pf-cal-k{margin-top:10px;font-size:13.5px;}
  .pf-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
  .pf-row:first-of-type{margin-top:14px;}
  .pf-row>div{flex:1;min-width:0;}
  .pf-row b{display:block;font:800 15px var(--font-ui);color:var(--ink);}
  .pf-row span{display:block;font:600 13.5px/1.45 var(--font-ui);color:var(--muted);margin-top:2px;}
  .pf-row .pf-inl{display:flex;align-items:center;gap:10px;margin:0;flex:none;}
  .pf-row select{font:700 14px var(--font-ui);padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink);}
  .pf .pf-link{font:800 14px var(--font-ui);color:var(--accent-text,var(--accent));text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;}
  .pf-btn{font:800 14px var(--font-ui);padding:10px 14px;border-radius:12px;border:0;background:#0B1A33;color:#fff;cursor:pointer;min-height:42px;}
  .pf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .pf-oc h2,.pf-oc h3{font-size:15px !important;margin-top:4px;}
  .pf-oc>div:not(:empty){margin-top:16px;}
  .pf-all{margin-top:0;}
  /* Profile v2 (owner 2026-11-23): courses fold open, drawn badges, locked ones with a note on hover or tap. */
  .pf-cxs{display:grid;gap:12px}
  .pf-cx{border:1px solid var(--line);border-radius:16px;background:var(--white)}
  .pf-cx>summary{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;list-style:none;border-radius:16px}
  .pf-cx>summary::-webkit-details-marker{display:none}
  .pf-cx>summary:hover{background:var(--surface2)}
  .pf-cx-t{flex:1;min-width:0}
  .pf-cx-t b{display:block;font:900 16px var(--font-ui);color:var(--ink)}
  .pf-cx-t small{display:block;font:700 12.5px var(--font-ui);color:var(--muted);margin-top:2px}
  .pf-cx-n{font:800 13px var(--font-ui);color:var(--muted);white-space:nowrap}
  .pf-cx-v{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 8px 4px 4px;transition:transform .15s}
  .pf-cx[open] .pf-cx-v{transform:rotate(-135deg);margin-bottom:-4px}
  .pf-cx-b{padding:4px 16px 16px;border-top:1px solid var(--line)}
  .pf-cx-s{font:700 13.5px var(--font-ui);color:var(--muted);margin:12px 0 14px}
  .bds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .bd{text-align:center;padding:14px 8px 12px;border-radius:16px;background:var(--surface2)}
  .bd-art{display:block;margin:0 auto 8px;filter:drop-shadow(0 4px 6px rgba(11,26,51,.18))}
  .bd b{display:block;font:800 13.5px var(--font-ui);color:var(--ink)}
  .bd small{display:block;font:700 11.5px var(--font-ui);color:var(--muted);margin-top:1px}
  .bd-cert{display:inline-block;margin-top:6px;font:800 12px var(--font-ui);color:var(--accent-text,var(--accent))}
  .bd-more{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .bds.is-row{display:flex;flex-wrap:wrap;gap:8px}
  .bd.is-locked{padding:0;background:none;position:relative}
  .bd-lock{all:unset;display:block;cursor:pointer;border-radius:10px;position:relative}
  .bd-lock:focus-visible{outline:3px solid var(--gold,#F2B01E);outline-offset:2px}
  .bd-tip{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:190px;background:#0B1A33;color:#fff;font:600 12.5px/1.4 var(--font-ui);padding:9px 11px;border-radius:10px;text-align:left;z-index:5;box-shadow:0 8px 20px rgba(11,26,51,.3)}
  .bd-tip b{display:block;font-weight:900;font-size:13px;margin-bottom:2px;color:#fff}
  .bd-tip::after{content:"";position:absolute;left:calc(50% + var(--ax,0px));top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#0B1A33}
  .bd-lock:hover .bd-tip,.bd-lock:focus-visible .bd-tip,.bd-lock.is-on .bd-tip{display:block}
  .bd.is-locked .bd-art{width:40px;height:40px;margin:0;filter:none}
  .pf-cx-go{margin:14px 0 0}
  @media (max-width:640px){.pf-cx-n{display:none}.bds{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}
  @media (max-width:640px){.pf-card{padding:18px;}.pf-row{flex-wrap:wrap;}.pf-cal{gap:3px;}}
</style>
