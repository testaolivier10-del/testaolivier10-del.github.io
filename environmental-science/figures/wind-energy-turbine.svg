<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="wind-energy-turbine-t wind-energy-turbine-d"><title id="wind-energy-turbine-t">How a wind turbine makes electricity</title><desc id="wind-energy-turbine-d">Moving air pushes on the blades and spins the rotor. In the nacelle on top of the tower, a shaft and gearbox turn a generator that makes electricity, which runs down the tower to power lines. Taller towers reach faster, steadier wind. Land between turbines can still be farmed or grazed; spinning blades can kill birds and bats; output rises and falls with the wind.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/><text x="380" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Kinetic energy of wind → spinning blades → generator → electricity</text><polygon points="246,400 254,185 266,185 274,400" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><rect x="220" y="157" width="130" height="40" rx="10" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><circle cx="220" cy="177" r="10" fill="#1F2A28" stroke="#1F2A28" stroke-width="1.5"/><line x1="220" y1="177" x2="220.0" y2="67.0" stroke="#1F2A28" stroke-width="7" stroke-linecap="round"/><line x1="220" y1="177" x2="315.3" y2="232.0" stroke="#1F2A28" stroke-width="7" stroke-linecap="round"/><line x1="220" y1="177" x2="124.7" y2="232.0" stroke="#1F2A28" stroke-width="7" stroke-linecap="round"/><line x1="20" y1="130" x2="90" y2="130" stroke="#009E73" stroke-width="2.5" marker-end="url(#ah-green)"/><line x1="20" y1="170" x2="90" y2="170" stroke="#009E73" stroke-width="2.5" marker-end="url(#ah-green)"/><line x1="20" y1="210" x2="90" y2="210" stroke="#009E73" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="55" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#009E73" font-weight="700" text-anchor="middle">wind</text><rect x="420" y="70" width="320" height="150" rx="8" fill="#fff" stroke="#474A10" stroke-width="1.5"/><text x="580" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Inside the nacelle</text><rect x="440" y="120" width="70" height="45" rx="8" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><text x="475" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">shaft</text><line x1="510" y1="142" x2="530" y2="142" stroke="#1F2A28" stroke-width="4"/><rect x="530" y="120" width="80" height="45" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="570" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">gearbox</text><line x1="610" y1="142" x2="630" y2="142" stroke="#1F2A28" stroke-width="4"/><rect x="630" y="120" width="95" height="45" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="677" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">generator</text><text x="580" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">faster rotation → generator → electricity</text><line x1="350" y1="177" x2="418" y2="150" stroke="#6B6F6E" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="274" y1="380" x2="360" y2="380" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><text x="366" y="384" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#474A10" font-weight="700">electricity to power lines</text><text x="420" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28">+ no fuel and no emissions while running</text><text x="420" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28">+ land below can still be farmed or grazed</text><text x="420" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28">− output varies with the wind (intermittent)</text><text x="420" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28">− blades can kill birds and bats</text><path d="M0 400 L760 400" fill="none" stroke="#1F2A28" stroke-width="2"/></svg>
