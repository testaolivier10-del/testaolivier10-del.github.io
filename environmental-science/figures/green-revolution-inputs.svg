<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="green-revolution-inputs-t green-revolution-inputs-d" font-family="Arial, Helvetica, sans-serif">
<title id="green-revolution-inputs-t">Green Revolution inputs, results and costs</title>
<desc id="green-revolution-inputs-d">Five inputs on the left (high-yield seeds, synthetic fertilizer, irrigation, pesticides and machines) all point to one result: more grain per hectare of farmland. That result has benefits (fewer famines, more food from the same land, less new land cleared) and costs (monocultures with low genetic diversity, fertilizer runoff, heavy water use, and fossil fuels burned for machines and used to make fertilizer).</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<rect x="20" y="40" width="190" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="115" y="65" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">High-yield seeds</text><line x1="212" y1="60" x2="268" y2="180" stroke="#8A9290" stroke-width="1.4"/><rect x="20" y="98" width="190" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="115" y="123" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Synthetic fertilizer</text><line x1="212" y1="118" x2="268" y2="180" stroke="#8A9290" stroke-width="1.4"/><rect x="20" y="156" width="190" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="115" y="181" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Irrigation</text><line x1="212" y1="176" x2="268" y2="180" stroke="#8A9290" stroke-width="1.4"/><rect x="20" y="214" width="190" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="115" y="239" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Pesticides</text><line x1="212" y1="234" x2="268" y2="180" stroke="#8A9290" stroke-width="1.4"/><rect x="20" y="272" width="190" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="115" y="297" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Machines</text><line x1="212" y1="292" x2="268" y2="180" stroke="#8A9290" stroke-width="1.4"/><rect x="270" y="135" width="170" height="90" rx="10" fill="#EFF0DA" stroke="#474A10" stroke-width="1.6"/><text x="355" y="157" font-size="16" font-weight="bold" fill="#474A10" text-anchor="middle">More grain</text><text x="355" y="177" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">per hectare</text><text x="355" y="193.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">of farmland</text><line x1="442" y1="165" x2="480" y2="110" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><line x1="442" y1="200" x2="480" y2="255" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><rect x="485" y="30" width="220" height="120" rx="10" fill="#E6F5EF" stroke="#009E73" stroke-width="1.6"/><text x="595" y="52" font-size="14" font-weight="bold" fill="#00704F" text-anchor="middle">Benefits</text><text x="595" y="72" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Fewer famines</text><text x="595" y="88.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">More food from the same land</text><text x="595" y="104.5" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Less new land cleared</text><rect x="485" y="190" width="220" height="150" rx="10" fill="#FBEDE4" stroke="#D55E00" stroke-width="1.6"/><text x="595" y="212" font-size="14" font-weight="bold" fill="#A8470A" text-anchor="middle">Costs</text><text x="595" y="232" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Monocultures: low</text><text x="595" y="248.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">genetic diversity</text><text x="595" y="264.5" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Fertilizer runoff</text><text x="595" y="280.75" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Heavy water use</text><text x="595" y="297" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Fossil fuels for fuel</text><text x="595" y="313.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">and fertilizer</text>
</svg>
