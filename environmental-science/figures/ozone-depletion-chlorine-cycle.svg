<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="ozone-depletion-chlorine-cycle-t ozone-depletion-chlorine-cycle-d" font-family="Arial, Helvetica, sans-serif">
<title id="ozone-depletion-chlorine-cycle-t">How chlorine from CFCs destroys stratospheric ozone</title>
<desc id="ozone-depletion-chlorine-cycle-d">A three-step cycle in the stratosphere, about 15 to 35 km up. Step 1: ultraviolet light breaks a CFC molecule and frees a chlorine atom. Step 2: chlorine reacts with ozone: Cl + O3 gives ClO + O2, destroying one ozone molecule. Step 3: ClO reacts with a single oxygen atom: ClO + O gives Cl + O2, and the chlorine atom is free again, so the cycle repeats. One chlorine atom can destroy many thousands of ozone molecules. Result at the surface: less ozone lets more UV through, raising skin cancer and cataracts.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<rect x="0" y="0" width="720" height="30" rx="0" fill="#EFF0DA" stroke="none" stroke-width="1.5"/><text x="360" y="20" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">In the stratosphere, about 15 to 35 km up</text><rect x="20" y="60" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="120" y="82" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">1. UV breaks a CFC</text><text x="120" y="101" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Ultraviolet light splits</text><text x="120" y="117" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">a CFC molecule and</text><text x="120" y="133" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">frees a chlorine atom (Cl).</text><rect x="300" y="60" width="220" height="92" rx="10" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="410" y="82" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">2. Cl attacks ozone</text><text x="410" y="101" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Cl + O₃ → ClO + O₂</text><text x="410" y="117" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">One ozone molecule</text><text x="410" y="133" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">is destroyed.</text><rect x="300" y="230" width="220" height="92" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/><text x="410" y="252" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="middle">3. Cl is set free again</text><text x="410" y="271" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">ClO + O → Cl + O₂</text><text x="410" y="287" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">The chlorine atom</text><text x="410" y="303" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">is released unchanged.</text><line x1="222" y1="106" x2="294" y2="106" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><path d="M 470 154 Q 520 192 470 226" fill="none" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><path d="M 350 228 Q 300 192 350 156" fill="none" stroke="#474A10" stroke-width="2.5" marker-end="url(#ar-olive)"/><text x="262" y="196" font-size="12.5" font-weight="bold" fill="#474A10" text-anchor="middle">repeats</text><rect x="550" y="130" width="160" height="120" rx="10" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="630" y="152" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">One Cl atom</text><text x="630" y="171" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">can destroy many</text><text x="630" y="187" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">thousands of ozone</text><text x="630" y="203" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">molecules before it</text><text x="630" y="219" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">leaves the cycle.</text><rect x="20" y="230" width="240" height="92" rx="10" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="140" y="252" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Result at the surface</text><text x="140" y="271" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Less ozone lets more UV</text><text x="140" y="287" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">through: more skin cancer</text><text x="140" y="303" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">and cataracts.</text><text x="360" y="360" font-size="12.5" font-weight="normal" fill="#8A9290" text-anchor="middle">O₃ is ozone, O₂ is ordinary oxygen, O is a single oxygen atom.</text>
</svg>
