<title id="t">Exponential and logistic growth</title>
<desc id="d">Two growth curves from the same start of 20 individuals. The exponential J-curve rises faster and faster and leaves the graph above 1,400 at about year 17. The logistic S-curve grows fastest at half the carrying capacity, 500, and levels off at the carrying capacity of 1,000 (dashed line).</desc>
