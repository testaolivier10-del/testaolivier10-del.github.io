-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="710" dy="0">160</tspan></text><line x1="475.6" y1="14" x2="475.6" y2="418" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="210" y="29.9" width="93.8" height="29.8" rx="0" fill="#474A10"/><text x="200" y="44.9" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Whispering</tspan></text><rect x="306.8" y="35.9" width="24" height="18" rx="0" fill="#FFFFFF"/><text x="309.8" y="44.9" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="309.8" dy="0">30</tspan></text><rect x="210" y="79.7" width="125" height="29.8" rx="0" fill="#474A10"/><text x="200" y="94.6" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Refrigerator</tspan></text><rect x="338" y="85.6" width="24" height="18" rx="0" fill="#FFFFFF"/><text x="341" y="94.6" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="341" dy="0">40</tspan></text><rect x="210" y="129.4" width="203.1" height="29.8" rx="0" fill="#474A10"/><rect x="413.1" y="129.4" width="46.9" height="29.8" rx="0" fill="#D3D27F" stroke="#474A10" stroke-width="1.5"/><text x="200" y="144.3" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Normal conversation</tspan></text><rect x="463" y="135.3" width="64" height="18" rx="0" fill="#FFFFFF"/><text x="466" y="144.3" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="466" dy="0">65 to 80</tspan></text><rect x="210" y="179.1" width="250" height="29.8" rx="0" fill="#D55E00"/><rect x="460" y="179.1" width="62.5" height="29.8" rx="0" fill="#F0B48A" stroke="#D55E00" stroke-width="1.5"/><text x="200" y="194" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Lawn mower</tspan></text><rect x="525.5" y="185" width="64" height="18" rx="0" fill="#FFFFFF"/><text x="528.5" y="194" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="528.5" dy="0">80 to 100</tspan></text><rect x="210" y="228.8" width="293.8" height="29.8" rx="0" fill="#D55E00"/><rect x="503.8" y="228.8" width="50" height="29.8" rx="0" fill="#F0B48A" stroke="#D55E00" stroke-width="1.5"/><text x="200" y="243.7" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Sports event</tspan></text><rect x="556.8" y="234.7" width="64" height="18" rx="0" fill="#FFFFFF"/><text x="559.8" y="243.7" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="559.8" dy="0">94 to 110</tspan></text><rect x="210" y="278.5" width="343.8" height="29.8" rx="0" fill="#D55E00"/><rect x="553.8" y="278.5" width="59.4" height="29.8" rx="0" fill="#F0B48A" stroke="#D55E00" stroke-width="1.5"/><text x="200" y="293.4" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Siren</tspan></text><rect x="616.1" y="284.4" width="64" height="18" rx="0" fill="#FFFFFF"/><text x="619.1" y="293.4" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="619.1" dy="0">110 to 129</tspan></text><rect x="210" y="328.2" width="437.5" height="29.8" rx="0" fill="#D55E00"/><rect x="647.5" y="328.2" width="62.5" height="29.8" rx="0" fill="#F0B48A" stroke="#D55E00" stroke-width="1.5"/><text x="200" y="343.1" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="200" dy="0">Fireworks</tspan></text><rect x="713" y="334.1" width="64" height="18" rx="0" fill="#FFFFFF"/><text x="716" y="343.1" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="716" dy="0">140 to 160</tspan></text><text x="483.6" y="432" font-size="13" font-weight="700" fill="#D55E00" text-anchor="start" dominant-baseline="middle"><tspan x="483.6" dy="0">85 dB: hearing damage over time</tspan></text><line x1="210" y1="20" x2="210" y2="368" stroke="#1F2A28" stroke-width="2"/><line x1="210" y1="368" x2="710" y2="368" stroke="#1F2A28" stroke-width="2"/><text x="340" y="412" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="340" dy="0">Sound level (decibels, dB)</tspan></text><text x="400" y="464" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="400" dy="0">Values from the CDC. The light part of a bar is the range. Each 10 dB is 10 times the intensity.</tspan></text>
