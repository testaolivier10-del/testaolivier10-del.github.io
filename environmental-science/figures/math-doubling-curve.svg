</text><line x1="75" y1="244.44" x2="80" y2="244.44" stroke="#1F2A28" stroke-width="1.5"/><text x="71" y="248.44" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">1</text><line x1="75" y1="188.89" x2="80" y2="188.89" stroke="#1F2A28" stroke-width="1.5"/><text x="71" y="192.89" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">2</text><line x1="75" y1="133.33" x2="80" y2="133.33" stroke="#1F2A28" stroke-width="1.5"/><text x="71" y="137.33" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">3</text><line x1="75" y1="77.78" x2="80" y2="77.78" stroke="#1F2A28" stroke-width="1.5"/><text x="71" y="81.78" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">4</text><path d="M 80 244.44 L 88.57 243.33 L 97.14 242.2 L 105.71 241.04 L 114.29 239.86 L 122.86 238.66 L 131.43 237.44 L 140 236.18 L 148.57 234.91 L 157.14 233.61 L 165.71 232.28 L 174.29 230.92 L 182.86 229.54 L 191.43 228.13 L 200 226.7 L 208.57 225.23 L 217.14 223.73 L 225.71 222.21 L 234.29 220.65 L 242.86 219.07 L 251.43 217.45 L 260 215.8 L 268.57 214.11 L 277.14 212.39 L 285.71 210.64 L 294.29 208.86 L 302.86 207.03 L 311.43 205.17 L 320 203.28 L 328.57 201.34 L 337.14 199.37 L 345.71 197.36 L 354.29 195.3 L 362.86 193.21 L 371.43 191.07 L 380 188.9 L 388.57 186.67 L 397.14 184.41 L 405.71 182.09 L 414.29 179.74 L 422.86 177.33 L 431.43 174.88 L 440 172.38 L 448.57 169.82 L 457.14 167.22 L 465.71 164.56 L 474.29 161.85 L 482.86 159.09 L 491.43 156.27 L 500 153.4 L 508.57 150.47 L 517.14 147.48 L 525.71 144.43 L 534.29 141.31 L 542.86 138.14 L 551.43 134.9 L 560 131.6 L 568.57 128.23 L 577.14 124.8 L 585.71 121.29 L 594.29 117.72 L 602.86 114.07 L 611.43 110.36 L 620 106.56 L 628.57 102.69 L 637.14 98.75 L 645.71 94.72 L 654.29 90.62 L 662.86 86.43 L 671.43 82.16 L 680 77.8" fill="none" stroke="#474A10" stroke-width="3"/><line x1="380" y1="300" x2="380" y2="188.9" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="80" y1="188.9" x2="380" y2="188.9" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="380" cy="188.9" r="5" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="372" y="178.9" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="end">2035: about 2 million</text><line x1="680" y1="300" x2="680" y2="77.8" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="80" y1="77.8" x2="680" y2="77.8" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="680" cy="77.8" r="5" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="672" y="67.8" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="end">2070: about 4 million</text><text x="380" y="344" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Year</text><text transform="translate(26 175) rotate(-90)" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Population (millions)</text><text x="90" y="60" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Rule of 70: 70 / 2 = 35 years. Start: 1 million in 2000. Invented data.</text>
</svg>
