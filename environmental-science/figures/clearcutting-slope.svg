-width="1.5"/><circle cx="205" cy="185.2" r="15.400000000000002" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M205,219.2 l-8,14 M205,219.2 l8,14 M205,219.2 l0,18" fill="none" stroke="#6B4E32" stroke-width="1.4"/><rect x="234.7" y="215.56" width="6.6" height="19.8" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><circle cx="238" cy="202.36" r="15.400000000000002" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M238,236.36 l-8,14 M238,236.36 l8,14 M238,236.36 l0,18" fill="none" stroke="#6B4E32" stroke-width="1.4"/><rect x="360" y="40" width="340" height="260" rx="0" fill="#EAF4FB" stroke="none" stroke-width="1.5"/><path d="M360,120 L610,250 L700,262 L700,300 L360,300 Z" fill="#B8916A" stroke="none" stroke-width="1.5"/><path d="M610,250 L700,262 L700,280 L605,268 Z" fill="#A9B6A0" stroke="none" stroke-width="1.5"/><rect x="376" y="126.4" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="409" y="143.56" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="442" y="160.72" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="475" y="177.88" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="508" y="195.04" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="541" y="212.2" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><rect x="574" y="229.36" width="8" height="6" rx="0" fill="#7A5A3A" stroke="none" stroke-width="1.5"/><text x="190" y="28" font-size="15" font-weight="bold" fill="#474A10" text-anchor="middle">Forest</text><text x="530" y="28" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">After clearcutting</text><text x="200" y="70" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Canopy shades the stream:</text><text x="200" y="86.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">water stays cool</text><text x="40" y="230" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Roots hold soil;</text><text x="40" y="246.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">leaf litter slows runoff</text><text x="270" y="318" font-size="12" font-weight="bold" fill="#0B4F7A" text-anchor="middle">Clear, cool stream</text><line x1="400" y1="150" x2="560" y2="228" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ar-blue)"/><text x="470" y="150" font-size="12.5" font-weight="normal" fill="#0B4F7A" text-anchor="start">More runoff</text><text x="470" y="166.25" font-size="12.5" font-weight="normal" fill="#0B4F7A" text-anchor="start">carries soil</text><text x="535" y="70" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Full sun warms</text><text x="535" y="86.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">soil and stream</text><text x="380" y="250" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Bare soil erodes;</text><text x="380" y="266.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">nutrients leach</text><text x="610" y="318" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">Muddy, warmer stream</text>
</svg>
