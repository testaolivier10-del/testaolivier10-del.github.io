<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" aria-labelledby="math-sci-notation-prefixes-t math-sci-notation-prefixes-d" font-family="Arial, Helvetica, sans-serif">
<title id="math-sci-notation-prefixes-t">Metric prefixes with powers of ten</title>
<desc id="math-sci-notation-prefixes-d">A table of metric prefixes. Giga, G, is 10 to the 9th, a billion. Mega, M, is 10 to the 6th, a million. Kilo, k, is 10 to the 3rd, a thousand. The base unit is 10 to the 0, one. Centi, c, is 10 to the minus 2, a hundredth. Milli, m, is 10 to the minus 3, a thousandth. Micro is 10 to the minus 6, a millionth. Example: 1 kilogram is 1,000 grams, so 2.5 kilograms is 2,500 grams.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="368" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Metric prefixes and powers of ten</text><text x="24" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Prefix</text><text x="150" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Symbol</text><text x="280" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Power of ten</text><text x="400" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Scale word</text><text x="540" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Written out</text><line x1="20" y1="76" x2="700" y2="76" stroke="#1F2A28" stroke-width="1.5"/><text x="24" y="102" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">giga</text><text x="150" y="102" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">G</text><text x="280" y="102" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">9</tspan><tspan dy="6"> </tspan></text><text x="400" y="102" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">billion</text><text x="540" y="102" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">1,000,000,000</text><text x="24" y="136" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">mega</text><text x="150" y="136" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">M</text><text x="280" y="136" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">6</tspan><tspan dy="6"> </tspan></text><text x="400" y="136" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">million</text><text x="540" y="136" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">1,000,000</text><text x="24" y="170" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">kilo</text><text x="150" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">k</text><text x="280" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">3</tspan><tspan dy="6"> </tspan></text><text x="400" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">thousand</text><text x="540" y="170" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">1,000</text><rect x="20" y="182" width="680" height="34" rx="0" fill="#EFF0DA" stroke="none" stroke-width="1.5"/><text x="24" y="204" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">(base unit)</text><text x="150" y="204" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">g, m, L, W</text><text x="280" y="204" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">0</tspan><tspan dy="6"> </tspan></text><text x="400" y="204" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">one</text><text x="540" y="204" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">1</text><text x="24" y="238" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">centi</text><text x="150" y="238" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">c</text><text x="280" y="238" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">−2</tspan><tspan dy="6"> </tspan></text><text x="400" y="238" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">hundredth</text><text x="540" y="238" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">0.01</text><text x="24" y="272" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">milli</text><text x="150" y="272" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">m</text><text x="280" y="272" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">−3</tspan><tspan dy="6"> </tspan></text><text x="400" y="272" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">thousandth</text><text x="540" y="272" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">0.001</text><text x="24" y="306" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">micro</text><text x="150" y="306" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">µ</text><text x="280" y="306" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">10<tspan font-size="70%" dy="-6">−6</tspan><tspan dy="6"> </tspan></text><text x="400" y="306" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">millionth</text><text x="540" y="306" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">0.000001</text><text x="24" y="352" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Each step up the table is a larger unit: 1 kg = 1,000 g, so 2.5 kg = 2,500 g.</text>
</svg>
