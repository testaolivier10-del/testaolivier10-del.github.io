<text x="20" y="522" font-size="15" font-weight="bold" fill="#0072B2" text-anchor="start">La Niña</text>
<text x="110" y="522" font-size="11.5" font-weight="normal" fill="#6B7370" text-anchor="start">Trade winds strengthen; warm water is pushed farther west; stronger upwelling cools the east.</text>
