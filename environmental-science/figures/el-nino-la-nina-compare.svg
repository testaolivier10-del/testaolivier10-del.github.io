<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" width="760" height="750" role="img" aria-labelledby="el-nino-la-nina-compare-t el-nino-la-nina-compare-d" font-family="Arial, Helvetica, sans-serif">
<title id="el-nino-la-nina-compare-t">Normal, El Niño and La Niña conditions in the equatorial Pacific</title>
<desc id="el-nino-la-nina-compare-d">Three cross-sections of the equatorial Pacific Ocean, with Australia and Indonesia on the left (west) and South America on the right (east). Normal year: moderate trade winds blow from east to west, warm surface water piles up in the west, and upwelling off Peru brings cold, nutrient-rich water to the surface; rain clouds sit over the western Pacific. El Niño: the trade winds weaken, warm water spreads east toward South America, upwelling off Peru weakens, and the rain moves east into the central and eastern Pacific. La Niña: the trade winds strengthen, warm water is pushed farther west, upwelling off South America strengthens, the eastern Pacific is colder than normal, and heavy rain falls over the far western Pacific.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="760" height="750" fill="#FFFFFF"/>
<rect x="10" y="10" width="740" height="222" rx="0" fill="#FFFFFF" stroke="#E9ECEB" stroke-width="1"/>
<text x="20" y="30" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">Normal year</text>
<text x="110" y="30" font-size="11.5" font-weight="normal" fill="#6B7370" text-anchor="start">Trade winds push warm water west; upwelling off Peru brings up cold, nutrient-rich water.</text>
<rect x="10" y="128" width="70" height="96" rx="0" fill="#D9C7A8" stroke="none" stroke-width="1.5"/>
<text x="45" y="194" font-size="10.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Australia,</text><text x="45" y="207.13" font-size="10.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Indonesia</text>
