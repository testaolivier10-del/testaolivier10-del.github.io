/><ellipse cx="530" cy="190" rx="9" ry="4.5" fill="#474A10"/><path d="M522,190 L516,185 L516,195 Z" fill="#474A10" stroke="none" stroke-width="1.5"/><ellipse cx="580" cy="190" rx="9" ry="4.5" fill="#474A10"/><path d="M572,190 L566,185 L566,195 Z" fill="#474A10" stroke="none" stroke-width="1.5"/><rect x="640" y="130" width="60" height="70" rx="6" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="670" y="170" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Filter</text><path d="M620,120 C640,110 660,115 670,128" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><path d="M670,202 C660,225 640,230 622,220" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="570" y="275" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Water is cleaned and reused;</text><text x="570" y="290.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">waste is captured. Costs more</text><text x="570" y="306.2" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">in electricity and money.</text>
