<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Total fertility rate in two countries</title>
<desc id="d">Line graph of total fertility rate from 1960 to 2020 for two invented countries, with a dashed line at replacement level, about 2.1. Country A falls from 6.8 in 1960 to 2.8 in 2020, still above replacement. Country B falls from 3.6 in 1960 to 2.2 in 1980 and to 1.5 in 2020, below replacement since about 1985.</desc>
