<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The waste hierarchy</title>
<desc id="d">An inverted pyramid of five bands, most preferred at the top: reduce (less packaging, durable goods), reuse (refillable bottles, cloth bags, repair), recycle and compost (aluminum cans, paper, food and yard scraps), recover energy (waste-to-energy plants, landfill gas), and dispose (sanitary landfill) at the bottom.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="420" fill="#FFFFFF"/>
<path d="M70,30 L530,30 L485,94 L115,94 z" fill="#009E73" stroke="none" stroke-width="0"/><text x="300" y="62" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="300" dy="0">Reduce</tspan></text><text x="560" y="52.9" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">less packaging, durable</tspan><tspan x="560" dy="18.2">goods, buy what you need</tspan></text><path d="M106,104 L494,104 L449,168 L151,168 z" fill="#4FA06A" stroke="none" stroke-width="0"/><text x="300" y="136" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="300" dy="0">Reuse</tspan></text><text x="560" y="126.9" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">refillable bottles, cloth</tspan><tspan x="560" dy="18.2">bags, repair, donate</tspan></text><path d="M142,178 L458,178 L413,242 L187,242 z" fill="#9A8A2A" stroke="none" stroke-width="0"/><text x="300" y="210" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="300" dy="0">Recycle and compost</tspan></text><text x="560" y="200.9" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">aluminum cans, paper;</tspan><tspan x="560" dy="18.2">food and yard scraps</tspan></text><path d="M178,252 L422,252 L377,316 L223,316 z" fill="#C9762A" stroke="none" stroke-width="0"/><text x="300" y="284" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="300" dy="0">Recover energy</tspan></text><text x="560" y="274.9" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">waste-to-energy plants,</tspan><tspan x="560" dy="18.2">landfill gas to power</tspan></text><path d="M214,326 L386,326 L341,390 L259,390 z" fill="#D55E00" stroke="none" stroke-width="0"/><text x="300" y="358" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="300" dy="0">Dispose</tspan></text><text x="560" y="358" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">sanitary landfill</tspan></text><line x1="14" y1="40" x2="14" y2="380" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><text x="34" y="210" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 34 210)">most preferred to least preferred</text>
</svg>
