<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The waste hierarchy</title>
<desc id="d">An inverted pyramid of five bands, most preferred at the top: reduce (less packaging, durable goods), reuse (refillable bottles, cloth bags, repair), recycle and compost (aluminum cans, paper, food and yard scraps), recover energy (waste-to-energy plants, landfill gas), and dispose (sanitary landfill) at the bottom.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="420" fill="#FFFFFF"/>
<path d="M40,30 L600,30 L555,94 L85,94 z" fill="#009E73" stroke="none" stroke-width="0"/><text x="320" y="62" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">Reduce</tspan></text><text x="620" y="62" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="620" dy="0">less packaging, durable goods, buy only what you need</tspan></text><path d="M85,104 L555,104 L510,168 L130,168 z" fill="#4FA06A" stroke="none" stroke-width="0"/><text x="320" y="136" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">Reuse</tspan></text><text x="620" y="136" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="620" dy="0">refillable bottles, cloth bags, repair, donate</tspan></text><path d="M130,178 L510,178 L465,242 L175,242 z" fill="#B5A23A" stroke="none" stroke-width="0"/><text x="320" y="210" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">Recycle and compost</tspan></text><text x="620" y="210" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="620" dy="0">aluminum cans, paper; food and yard scraps to compost</tspan></text><path d="M175,252 L465,252 L420,316 L220,316 z" fill="#D98A3A" stroke="none" stroke-width="0"/><text x="320" y="284" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">Recover energy</tspan></text><text x="620" y="284" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="620" dy="0">waste-to-energy plants, landfill gas to electricity</tspan></text><path d="M220,326 L420,326 L375,390 L265,390 z" fill="#D55E00" stroke="none" stroke-width="0"/><text x="320" y="358" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">Dispose</tspan></text><text x="620" y="358" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="620" dy="0">sanitary landfill</tspan></text><line x1="14" y1="40" x2="14" y2="380" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><text x="34" y="210" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 34 210)">most preferred to least preferred</text>
</svg>
