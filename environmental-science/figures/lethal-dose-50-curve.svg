<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="lethal-dose-50-curve-t lethal-dose-50-curve-d" font-family="Arial, Helvetica, sans-serif">
<title id="lethal-dose-50-curve-t">Percent of test rats killed at each dose of a pesticide</title>
<desc id="lethal-dose-50-curve-d">A graph of the percent of test rats killed against the dose of a pesticide in milligrams per kilogram of body mass (invented data). Deaths are 0% at 0, 2% at 10, 9% at 20, 26% at 30, 50% at 40, 72% at 50, 86% at 60, 96% at 80 and 99% at 100 mg/kg, an S-shaped rise. A dashed line across from 50% meets the curve at 40 mg/kg and drops to the dose axis: the LD50 is 40 mg/kg.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="640" height="380" fill="#FFFFFF"/>
<line x1="80" y1="310" x2="600" y2="310" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="314" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="80" y1="240" x2="600" y2="240" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="244" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">25</text><line x1="80" y1="170" x2="600" y2="170" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="174" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">50</text><line x1="80" y1="100" x2="600" y2="100" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="104" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">75</text><line x1="80" y1="30" x2="600" y2="30" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="34" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">100</text><line x1="80" y1="310" x2="80" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="80" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="132" y1="310" x2="132" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="132" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">10</text><line x1="184" y1="310" x2="184" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="184" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">20</text><line x1="236" y1="310" x2="236" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="236" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">30</text><line x1="288" y1="310" x2="288" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="288" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">40</text><line x1="340" y1="310" x2="340" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="340" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">50</text><line x1="392" y1="310" x2="392" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="392" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">60</text><line x1="444" y1="310" x2="444" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="444" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">70</text><line x1="496" y1="310" x2="496" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="496" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">80</text><line x1="548" y1="310" x2="548" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="548" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">90</text><line x1="600" y1="310" x2="600" y2="315" stroke="#1F2A28" stroke-width="1.5"/><text x="600" y="329" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">100</text><line x1="80" y1="310" x2="600" y2="310" stroke="#1F2A28" stroke-width="1.5"/><line x1="80" y1="310" x2="80" y2="30" stroke="#1F2A28" stroke-width="1.5"/><text x="340" y="352" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Dose of the pesticide (mg per kg of body mass)</text><text x="32" y="170" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 32 170)">Test rats killed (%)</text><line x1="80" y1="170" x2="288" y2="170" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 5"/><line x1="288" y1="170" x2="288" y2="310" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 5"/><polyline points="80,310 132,304.4 184,284.8 236,237.2 288,170 340,108.4 392,69.2 496,41.2 600,32.8" fill="none" stroke="#474A10" stroke-width="2.5"/><circle cx="80" cy="310" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="132" cy="304.4" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="184" cy="284.8" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="236" cy="237.2" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="288" cy="170" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="340" cy="108.4" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="392" cy="69.2" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="496" cy="41.2" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="600" cy="32.8" r="4.5" fill="#474A10" stroke="#FFFFFF" stroke-width="1"/><circle cx="288" cy="170" r="6" fill="#D55E00" stroke="#FFFFFF" stroke-width="1.5"/><rect x="300" y="180" width="168" height="46" rx="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="384" y="199" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="middle">LD50 = 40 mg/kg</text><text x="384" y="217" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">half of the rats die</text><text x="90.4" y="163" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="start">50%</text><text x="92" y="46" font-size="11.5" font-weight="normal" fill="#8A9290" text-anchor="start" font-style="italic">Invented data for practice</text>
</svg>
