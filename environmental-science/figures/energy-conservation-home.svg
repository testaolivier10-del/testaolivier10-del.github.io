<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="energy-conservation-home-t energy-conservation-home-d"><title id="energy-conservation-home-t">Ways to conserve energy in a home</title><desc id="energy-conservation-home-d">A house with labeled measures: attic insulation and weather stripping keep heat in; a programmable thermostat lowers heating and cooling when no one needs it; LED bulbs use at least 75 percent less electricity than incandescent bulbs for the same light; efficient appliances and low-flow fixtures cut electricity and hot water use; a shade tree on the sunny side and a windbreak (conservation landscaping) cut cooling and heating needs. Larger-scale measures include better vehicle fuel economy, public transportation and green building design.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Use less energy for the same comfort and light</text><path d="M250 360 L250 200 L400 110 L550 200 L550 360 Z" fill="#EFF0DA" stroke="#1F2A28" stroke-width="2"/><rect x="290" y="175" width="220" height="18" fill="#F4D35E" fill-opacity="0.8"/><text x="400" y="188" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">attic insulation</text><rect x="285" y="240" width="50" height="50" rx="2" fill="#BFE0F2" stroke="#1F2A28" stroke-width="1.5"/><rect x="465" y="240" width="50" height="50" rx="2" fill="#BFE0F2" stroke="#1F2A28" stroke-width="1.5"/><rect x="380" y="290" width="40" height="70" rx="2" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><circle cx="400" cy="230" r="9" fill="#FFF7C2" stroke="#1F2A28" stroke-width="1.5"/><rect x="355" y="300" width="18" height="26" rx="3" fill="#fff" stroke="#1F2A28" stroke-width="1.5"/><circle cx="640" cy="300" r="52" fill="#009E73" stroke="#1F2A28" stroke-width="1.5"/><rect x="634" y="340" width="12" height="25" fill="#8C6A43"/><path d="M0 365 L800 365" fill="none" stroke="#1F2A28" stroke-width="2"/><line x1="300" y1="184" x2="190" y2="120" stroke="#6B6F6E" stroke-width="1.2"/><text x="186" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="end"><tspan x="186" dy="0">insulation and weather</tspan><tspan x="186" dy="15">stripping keep heat in</tspan></text><line x1="400" y1="230" x2="540" y2="80" stroke="#6B6F6E" stroke-width="1.2"/><text x="544" y="84" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="start"><tspan x="544" dy="0">LED bulbs: at least 75% less</tspan><tspan x="544" dy="15">electricity than incandescent bulbs</tspan></text><line x1="364" y1="312" x2="190" y2="290" stroke="#6B6F6E" stroke-width="1.2"/><text x="186" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="end"><tspan x="186" dy="0">programmable thermostat:</tspan><tspan x="186" dy="15">lower heat or cooling when</tspan><tspan x="186" dy="15">no one needs it</tspan></text><line x1="310" y1="268" x2="190" y2="215" stroke="#6B6F6E" stroke-width="1.2"/><text x="186" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="end"><tspan x="186" dy="0">efficient appliances,</tspan><tspan x="186" dy="15">low-flow fixtures</tspan></text><line x1="655" y1="252" x2="600" y2="132" stroke="#6B6F6E" stroke-width="1.2"/><text x="604" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="start"><tspan x="604" dy="0">shade tree, windbreak</tspan><tspan x="604" dy="15">(conservation landscaping)</tspan></text><rect x="20" y="380" width="760" height="34" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="400" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" font-weight="700" text-anchor="middle">Large scale: vehicle fuel economy, hybrids and electric vehicles, public transportation, green building design</text></svg>
