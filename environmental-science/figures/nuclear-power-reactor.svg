<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="nuclear-power-reactor-t nuclear-power-reactor-d"><title id="nuclear-power-reactor-t">How a nuclear power plant makes electricity</title><desc id="nuclear-power-reactor-d">In the reactor core, uranium-235 in fuel rods splits when struck by neutrons (nuclear fission), releasing heat and more neutrons. Control rods absorb neutrons to slow or stop the chain reaction. Water carries the heat to a steam generator; the steam spins a turbine that turns a generator. A condenser cools the used steam with water from a cooling tower or river. The plant releases no carbon dioxide while running, but produces radioactive spent fuel and warm water.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="410" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">The fuel is uranium; the steam only carries the heat</text><rect x="40" y="60" width="220" height="260" rx="30" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><text x="150" y="84" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Reactor</text><rect x="70" y="150" width="14" height="140" rx="3" fill="#009E73" fill-opacity="0.75"/><rect x="104" y="150" width="14" height="140" rx="3" fill="#009E73" fill-opacity="0.75"/><rect x="138" y="150" width="14" height="140" rx="3" fill="#009E73" fill-opacity="0.75"/><rect x="172" y="150" width="14" height="140" rx="3" fill="#009E73" fill-opacity="0.75"/><rect x="206" y="150" width="14" height="140" rx="3" fill="#009E73" fill-opacity="0.75"/><rect x="88" y="100" width="10" height="110" fill="#1F2A28"/><rect x="122" y="100" width="10" height="110" fill="#1F2A28"/><rect x="156" y="100" width="10" height="110" fill="#1F2A28"/><rect x="190" y="100" width="10" height="110" fill="#1F2A28"/><text x="150" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#009E73" font-weight="700" text-anchor="middle">fuel rods: uranium-235</text><text x="40" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28">Control rods (dark) absorb neutrons to slow or stop the chain reaction.</text><path d="M260 160 L310 160 L310 120 L380 120" fill="none" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="265" y="178" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#D55E00">hot water</text><rect x="385" y="95" width="130" height="70" rx="8" fill="#FBE7DA" stroke="#D55E00" stroke-width="1.5"/><text x="450" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Steam</text><text x="450" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle">generator</text><path d="M380 145 L345 145 L345 250 L260 250" fill="none" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="272" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0072B2">cooler water returns</text><line x1="515" y1="120" x2="560" y2="120" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="537" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#D55E00" text-anchor="middle">steam</text><rect x="565" y="90" width="100" height="65" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="615" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Turbine</text><line x1="665" y1="122" x2="690" y2="122" stroke="#1F2A28" stroke-width="4"/><rect x="690" y="90" width="100" height="65" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="740" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Generator</text><line x1="740" y1="155" x2="740" y2="200" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><text x="740" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#474A10" font-weight="700" text-anchor="middle">electricity</text><path d="M615 155 L615 240" fill="none" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ah-verm)"/><rect x="555" y="245" width="120" height="55" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="615" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Condenser</text><path d="M555 285 L470 285 L470 168" fill="none" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ah-blue)"/><path d="M690 330 Q700 280 690 245 L770 245 Q760 280 770 330 Z" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><text x="730" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">cooling tower</text><line x1="690" y1="272" x2="678" y2="272" stroke="#0072B2" stroke-width="2"/><rect x="40" y="362" width="600" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="340" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Fission: a neutron splits U-235, releasing heat and 2 or 3 more neutrons</text></svg>
