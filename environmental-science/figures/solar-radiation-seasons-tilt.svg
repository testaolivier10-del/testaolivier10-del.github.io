<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="solar-radiation-seasons-tilt-t solar-radiation-seasons-tilt-d" font-family="Arial, Helvetica, sans-serif">
<title id="solar-radiation-seasons-tilt-t">Insolation by latitude and the cause of the seasons</title>
<desc id="solar-radiation-seasons-tilt-d">Two panels. Left: two equal beams of sunlight reach Earth. At the equator the beam strikes head-on and lights a small area, so its energy is concentrated. At 60 degrees north the same beam strikes at a low angle and spreads over a larger area, so each square meter gets less energy. Right: Earth orbits the Sun with its axis tilted 23.5 degrees, always pointing the same way in space. In June the North Pole is tilted toward the Sun, so the Northern Hemisphere has summer: higher Sun, longer days. In December the North Pole is tilted away, so the Northern Hemisphere has winter. Earth is actually a little closer to the Sun in early January, during northern winter, so distance does not cause the seasons.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="800" height="410" fill="#FFFFFF"/>
<text x="180" y="28" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Why the equator gets more energy</text>
<path d="M250 80 A150 150 0 0 0 250 380" fill="#DDEBD8" stroke="#1F2A28" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="100" y1="230" x2="250" y2="230" stroke="#474A10" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="106" y="224" font-size="11" font-weight="bold" fill="#474A10" text-anchor="start">Equator</text>
<line x1="20" y1="210" x2="97" y2="210" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="220" x2="97" y2="220" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="230" x2="97" y2="230" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="240" x2="97" y2="240" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="250" x2="97" y2="250" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="100" y1="210" x2="100" y2="250" stroke="#D55E00" stroke-width="5"/>
<text x="110" y="264" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="start">small area:</text><text x="110" y="277.75" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="start">concentrated</text>
<line x1="20" y1="80.1" x2="241.63" y2="80.1" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="90.1" x2="192.9" y2="90.1" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="100.1" x2="172" y2="100.1" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="110.1" x2="156.87" y2="110.1" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<line x1="20" y1="120.1" x2="144.92" y2="120.1" stroke="#E69F00" stroke-width="2" marker-end="url(#ar-verm)"/>
<path d="M244.63 80.1 A150 150 0 0 0 147.92 120.1" fill="none" stroke="#D55E00" stroke-width="5" stroke-linejoin="round"/>
<text x="205" y="104.1" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">same beam, larger</text><text x="205" y="117.85" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">area: spread out</text>
<text x="20" y="370" font-size="11.5" font-weight="normal" fill="#6B7370" text-anchor="start" font-style="italic">Same sunlight, different area hit</text>
<text x="560" y="28" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Why there are seasons</text>
<ellipse cx="560" cy="210" rx="150" ry="60" fill="none" stroke="#6B7370" stroke-width="1.2"/>
<circle cx="560" cy="210" r="26" fill="#F2C14E" stroke="#C99500" stroke-width="1.5"/>
<text x="560" y="214" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Sun</text>
<circle cx="410" cy="210" r="32" fill="#9CC3E0" stroke="#1F2A28" stroke-width="1.3"/>
<path d="M410 178 A32 32 0 0 0 410 242 Z" fill="#2B3A55" stroke="none" stroke-width="1.5" opacity="0.45" stroke-linejoin="round"/>
<line x1="391.66" y1="252.18" x2="428.34" y2="167.82" stroke="#1F2A28" stroke-width="2"/>
<text x="432.34" y="165.82" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">N</text>
<line x1="380.65" y1="197.24" x2="439.35" y2="222.76" stroke="#474A10" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="410" y="292" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">June</text>
<text x="410" y="307" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">North Pole tilted toward</text><text x="410" y="320.75" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">the Sun: northern summer</text>
<circle cx="710" cy="210" r="32" fill="#9CC3E0" stroke="#1F2A28" stroke-width="1.3"/>
<path d="M710 178 A32 32 0 0 1 710 242 Z" fill="#2B3A55" stroke="none" stroke-width="1.5" opacity="0.45" stroke-linejoin="round"/>
<line x1="691.66" y1="252.18" x2="728.34" y2="167.82" stroke="#1F2A28" stroke-width="2"/>
<text x="732.34" y="165.82" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">N</text>
<line x1="680.65" y1="197.24" x2="739.35" y2="222.76" stroke="#474A10" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="710" y="292" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">December</text>
<text x="710" y="307" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">North Pole tilted away</text><text x="710" y="320.75" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">from the Sun: northern winter</text>
<text x="560" y="120" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">The axis tilts 23.5° and keeps pointing the same way all year</text>
<text x="560" y="380" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle" font-style="italic">Earth is a little closer to the Sun in early January,</text>
<text x="560" y="394" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle" font-style="italic">during northern winter: distance does not cause seasons.</text>
</svg>
