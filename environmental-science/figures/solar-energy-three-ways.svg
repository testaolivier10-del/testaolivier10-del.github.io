<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="solar-energy-three-ways-t solar-energy-three-ways-d"><title id="solar-energy-three-ways-t">Three ways to use solar energy</title><desc id="solar-energy-three-ways-d">Photovoltaic cells turn sunlight directly into electricity with no moving parts; an inverter changes it for home use. An active solar system heats a fluid in a roof collector and uses a pump and a tank to move and store the heat. A passive solar building uses south-facing windows (in the Northern Hemisphere), a roof overhang and thick floors or walls to absorb and hold the sun's heat without pumps or fans.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Sunlight to electricity, or sunlight to heat</text><rect x="20" y="50" width="245" height="300" rx="8" fill="#fff" stroke="#474A10" stroke-width="1.5"/><text x="142" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Photovoltaic (PV)</text><circle cx="50" cy="105" r="18" fill="#F4D35E" stroke="#C79A00" stroke-width="1.5"/><polygon points="70,190 200,150 230,180 100,220" fill="#0072B2" fill-opacity="0.8" stroke="#1F2A28"/><line x1="64" y1="118" x2="140" y2="175" stroke="#C79A00" stroke-width="2" marker-end="url(#ah-olive)"/><line x1="165" y1="200" x2="165" y2="250" stroke="#474A10" stroke-width="2.5" marker-end="url(#ah-olive)"/><rect x="115" y="255" width="100" height="34" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="165" y="277" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle">inverter</text><text x="142" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" font-weight="700" text-anchor="middle">light to electricity</text><text x="142" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">no moving parts</text><rect x="278" y="50" width="245" height="300" rx="8" fill="#fff" stroke="#474A10" stroke-width="1.5"/><text x="400" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Active solar heating</text><circle cx="310" cy="105" r="18" fill="#F4D35E" stroke="#C79A00" stroke-width="1.5"/><polygon points="330,180 450,140 470,165 350,205" fill="#D55E00" fill-opacity="0.6" stroke="#1F2A28"/><line x1="324" y1="118" x2="390" y2="160" stroke="#C79A00" stroke-width="2" marker-end="url(#ah-olive)"/><rect x="420" y="230" width="60" height="80" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="450" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">tank</text><path d="M460 165 L460 230" fill="none" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ah-verm)"/><path d="M420 290 L340 290 L340 205" fill="none" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ah-blue)"/><circle cx="370" cy="290" r="10" fill="#fff" stroke="#1F2A28" stroke-width="1.5"/><text x="372" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">pump</text><text x="400" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">pumps or fans move the heat</text><rect x="536" y="50" width="245" height="300" rx="8" fill="#fff" stroke="#474A10" stroke-width="1.5"/><text x="658" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Passive solar design</text><circle cx="565" cy="105" r="18" fill="#F4D35E" stroke="#C79A00" stroke-width="1.5"/><path d="M600 300 L600 200 L700 160 L760 200 L760 300 Z" fill="#EFF0DA" stroke="#1F2A28" stroke-width="1.5"/><path d="M585 205 L700 158" fill="none" stroke="#1F2A28" stroke-width="3"/><rect x="606" y="215" width="30" height="60" rx="2" fill="#BFE0F2" stroke="#1F2A28" stroke-width="1.5"/><rect x="606" y="285" width="140" height="15" fill="#6B6F6E"/><line x1="578" y1="118" x2="625" y2="245" stroke="#C79A00" stroke-width="2" marker-end="url(#ah-olive)"/><text x="690" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle">thick floor stores heat</text><text x="560" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28">south-facing windows</text><text x="560" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28">no pumps or fans</text><text x="712" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28">overhang</text><text x="400" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="middle" font-style="italic">Windows face south in the Northern Hemisphere (north in the Southern Hemisphere).</text></svg>
