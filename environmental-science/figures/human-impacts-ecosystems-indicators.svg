<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Stream insects as indicator species</title>
<desc id="d">Three groups of stream invertebrates along a scale from clean to polluted water. Pollution-sensitive: mayfly, stonefly and caddisfly larvae. Somewhat tolerant: dragonfly larvae, crayfish and scuds. Pollution-tolerant: midge larvae, aquatic worms and leeches. Many sensitive species mean a healthy stream; only tolerant species mean a polluted one.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<rect x="20" y="40" width="240" height="270" rx="8" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/><text x="140" y="66" font-size="17" font-weight="700" fill="#009E73" text-anchor="middle" dominant-baseline="middle"><tspan x="140" dy="0">Pollution-sensitive</tspan></text><circle cx="60" cy="115" r="11" fill="#009E73"/><text x="84" y="115" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="84" dy="0">mayfly larvae</tspan></text><circle cx="60" cy="185" r="11" fill="#009E73"/><text x="84" y="185" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="84" dy="0">stonefly larvae</tspan></text><circle cx="60" cy="255" r="11" fill="#009E73"/><text x="84" y="255" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="84" dy="0">caddisfly larvae</tspan></text><rect x="280" y="40" width="240" height="270" rx="8" fill="#FFFFFF" stroke="#B58D3D" stroke-width="2.5"/><text x="400" y="66" font-size="17" font-weight="700" fill="#B58D3D" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">Somewhat tolerant</tspan></text><circle cx="320" cy="115" r="11" fill="#B58D3D"/><text x="344" y="115" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="344" dy="0">dragonfly larvae</tspan></text><circle cx="320" cy="185" r="11" fill="#B58D3D"/><text x="344" y="185" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="344" dy="0">crayfish</tspan></text><circle cx="320" cy="255" r="11" fill="#B58D3D"/><text x="344" y="255" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="344" dy="0">scuds</tspan></text><rect x="540" y="40" width="240" height="270" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/><text x="660" y="66" font-size="17" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="660" dy="0">Pollution-tolerant</tspan></text><circle cx="580" cy="115" r="11" fill="#D55E00"/><text x="604" y="115" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="604" dy="0">midge larvae</tspan></text><circle cx="580" cy="185" r="11" fill="#D55E00"/><text x="604" y="185" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="604" dy="0">aquatic worms</tspan></text><circle cx="580" cy="255" r="11" fill="#D55E00"/><text x="604" y="255" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="604" dy="0">leeches</tspan></text><defs><linearGradient id="gq" x1="0" x2="1"><stop offset="0" stop-color="#009E73"/><stop offset="0.5" stop-color="#E0C35A"/><stop offset="1" stop-color="#D55E00"/></linearGradient></defs><rect x="20" y="330" width="760" height="16" rx="8" fill="url(#gq)"/><text x="20" y="368" font-size="14" font-weight="700" fill="#009E73" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Clean, oxygen-rich water</tspan></text><text x="780" y="368" font-size="14" font-weight="700" fill="#D55E00" text-anchor="end" dominant-baseline="middle"><tspan x="780" dy="0">Polluted, low-oxygen water</tspan></text><text x="400" y="390" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="400" dy="0">Many sensitive species = healthy stream; only tolerant species = polluted stream</tspan></text>
</svg>
