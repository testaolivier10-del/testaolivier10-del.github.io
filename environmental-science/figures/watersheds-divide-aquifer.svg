<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="watersheds-divide-aquifer-t watersheds-divide-aquifer-d" font-family="Arial, Helvetica, sans-serif">
<title id="watersheds-divide-aquifer-t">A watershed, its divide, and an aquifer below</title>
<desc id="watersheds-divide-aquifer-d">Two panels. Seen from above: watershed A is outlined by a dashed line along its divide, the high ground that separates it from watershed B next door. Rain that falls inside the divide runs downhill as runoff into small tributaries, which join a main river that leaves the watershed at its outlet into a lake. Water falling on the far side of the divide drains to watershed B and flows somewhere else. A cut-away side view: rain falls on hills; runoff flows over the land surface into a stream; some water soaks in by infiltration down to the water table. Below the water table is an aquifer, water held underground in the pores of sand, gravel or rock, above a layer of rock that water does not pass through. The watershed is the land surface that drains to the stream; the aquifer is water stored below the ground.</desc>
