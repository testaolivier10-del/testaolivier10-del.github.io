<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Island size, distance and species richness</title>
<desc id="d">Map-style diagram: a mainland on the left and four islands. Large island 40 km away: 48 species. Small island 40 km away: 22 species. Large island 300 km away: 26 species. Small island 300 km away: 9 species. Solid arrows show many species arriving at near islands; dashed arrows show few arriving at far islands. Invented data.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<path d="M0,0 L150,0 C175,90 135,170 160,240 C180,310 140,370 150,420 L0,420 Z" fill="#009E73" fill-opacity="0.22" stroke="#009E73" stroke-width="2"/>
<text x="70" y="200" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="700">Mainland</text>
<text x="70" y="222" font-size="13" fill="#1F2A28" text-anchor="middle">(source of</text>
<text x="70" y="238" font-size="13" fill="#1F2A28" text-anchor="middle">new species)</text>
<ellipse cx="330" cy="120" rx="77.5" ry="62" fill="#474A10" fill-opacity="0.18" stroke="#474A10" stroke-width="2"/>
<text x="330" y="116" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Large, near</text>
<text x="330" y="134" font-size="14" fill="#1F2A28" text-anchor="middle">48 species</text>
<ellipse cx="330" cy="300" rx="37.5" ry="30" fill="#474A10" fill-opacity="0.18" stroke="#474A10" stroke-width="2"/>
<text x="330" y="348" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Small, near</text>
<text x="330" y="366" font-size="14" fill="#1F2A28" text-anchor="middle">22 species</text>
<ellipse cx="590" cy="120" rx="77.5" ry="62" fill="#474A10" fill-opacity="0.18" stroke="#474A10" stroke-width="2"/>
<text x="590" y="116" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Large, far</text>
<text x="590" y="134" font-size="14" fill="#1F2A28" text-anchor="middle">26 species</text>
<ellipse cx="590" cy="300" rx="37.5" ry="30" fill="#474A10" fill-opacity="0.18" stroke="#474A10" stroke-width="2"/>
<text x="590" y="348" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Small, far</text>
<text x="590" y="366" font-size="14" fill="#1F2A28" text-anchor="middle">9 species</text>
<line x1="165" y1="120" x2="245" y2="120" stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)"/>
<line x1="165" y1="300" x2="270" y2="300" stroke="#1F2A28" stroke-width="3" marker-end="url(#ah)"/>
<line x1="165" y1="200" x2="520" y2="160" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<line x1="165" y1="240" x2="548" y2="290" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="210" y="108" font-size="12" fill="#1F2A28" text-anchor="middle">many arrive</text>
<text x="440" y="236" font-size="12" fill="#1F2A28" text-anchor="middle">few arrive (far)</text>
<text x="330" y="20" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">40 km from mainland</text>
<text x="590" y="20" font-size="13" fill="#1F2A28" text-anchor="middle" font-style="italic">300 km from mainland</text>
<text x="708" y="410" font-size="11" fill="#5B625A" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
