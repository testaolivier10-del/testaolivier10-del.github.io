<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" aria-labelledby="intro-ecosystems-interactions-t intro-ecosystems-interactions-d" font-family="Arial, Helvetica, sans-serif">
<title id="intro-ecosystems-interactions-t">Species interactions and their effects</title>
<desc id="intro-ecosystems-interactions-d">A table of five interactions between two species, with + for helped, minus for harmed and 0 for not affected. Mutualism: + and +, bees and flowers. Commensalism: + and 0, barnacles on a whale. Parasitism: + and minus, a tick on a deer. Predation: + and minus, an owl eating a mouse. Competition: minus and minus, two plant species shading each other. Mutualism, commensalism and parasitism are the three kinds of symbiosis.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="368" fill="#FFFFFF"/>
<text x="24" y="34" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">How two species affect each other</text><text x="24" y="70" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Interaction</text><text x="205" y="70" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Species 1</text><text x="290" y="70" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Species 2</text><text x="345" y="70" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Example</text><line x1="20" y1="80" x2="700" y2="80" stroke="#1F2A28" stroke-width="1.5"/><rect x="20" y="86" width="680" height="46" rx="0" fill="#F6F7F2" stroke="none" stroke-width="1.5"/><text x="24" y="114" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">Mutualism</text><circle cx="205" cy="109" r="14" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="205" y="115" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text><circle cx="290" cy="109" r="14" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="290" y="115" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text><text x="345" y="114" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Bees get nectar; flowers get pollinated</text><text x="24" y="160" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">Commensalism</text><circle cx="205" cy="155" r="14" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="205" y="161" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text><circle cx="290" cy="155" r="14" fill="#6B7370" stroke="none" stroke-width="1.5"/><text x="290" y="161" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text><text x="345" y="160" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Barnacles ride on a whale; the whale is unaffected</text><rect x="20" y="178" width="680" height="46" rx="0" fill="#F6F7F2" stroke="none" stroke-width="1.5"/><text x="24" y="206" font-size="13" font-weight="bold" fill="#474A10" text-anchor="start">Parasitism</text><circle cx="205" cy="201" r="14" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="205" y="207" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text><circle cx="290" cy="201" r="14" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="290" y="207" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text><text x="345" y="206" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">A tick feeds on a deer and weakens it</text><text x="24" y="252" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Predation</text><circle cx="205" cy="247" r="14" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="205" y="253" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text><circle cx="290" cy="247" r="14" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="290" y="253" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text><text x="345" y="252" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">An owl catches and eats a mouse</text><rect x="20" y="270" width="680" height="46" rx="0" fill="#F6F7F2" stroke="none" stroke-width="1.5"/><text x="24" y="298" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Competition</text><circle cx="205" cy="293" r="14" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="205" y="299" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text><circle cx="290" cy="293" r="14" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="290" y="299" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">−</text><text x="345" y="298" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Two plant species shade each other for light</text><text x="24" y="352" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">+ helped    − harmed    0 not affected. Mutualism, commensalism and parasitism are the three kinds of symbiosis.</text>
</svg>
