<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="tragedy-of-commons-pasture-t tragedy-of-commons-pasture-d" font-family="Arial, Helvetica, sans-serif">
<title id="tragedy-of-commons-pasture-t">Why a shared pasture is overused</title>
<desc id="tragedy-of-commons-pasture-d">Left: a bar chart for one herder who adds one cow to a pasture shared by 10 herders. The gain bar is 100% of one cow's value, because the herder keeps the whole cow. The cost bar is 10%, because the grass the cow eats is lost to all 10 herders, so each pays one tenth. Right: a loop. Each herder adds cows, grass is eaten faster than it regrows, bare soil erodes, and there is less grass for every herd, which pushes each herder to add still more cows.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<line x1="90" y1="280" x2="330" y2="280" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="284" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0%</text><line x1="90" y1="241.67" x2="330" y2="241.67" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="245.67" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">20%</text><line x1="90" y1="203.33" x2="330" y2="203.33" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="207.33" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40%</text><line x1="90" y1="165" x2="330" y2="165" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="169" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">60%</text><line x1="90" y1="126.67" x2="330" y2="126.67" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="130.67" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">80%</text><line x1="90" y1="88.33" x2="330" y2="88.33" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="92.33" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">100%</text><line x1="90" y1="50" x2="330" y2="50" stroke="#E9ECEB" stroke-width="1"/><text x="82" y="54" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">120%</text><line x1="90" y1="280" x2="330" y2="280" stroke="#1F2A28" stroke-width="1.5"/><line x1="90" y1="50" x2="90" y2="280" stroke="#1F2A28" stroke-width="1.5"/><text x="38" y="165" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 38 165)">Share of one cow’s value</text><rect x="115" y="88.33" width="70" height="191.67" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="150" y="80.33" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">+100%</text><rect x="235" y="260.83" width="70" height="19.17" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="270" y="252.83" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">−10%</text><text x="150" y="300" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Gain: the herder</text><text x="150" y="315.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">keeps the whole cow</text><text x="270" y="300" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Cost: lost grass is</text><text x="270" y="315.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">shared by 10 herders</text><text x="210" y="30" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">One herder adds one more cow</text><rect x="468" y="58" width="144" height="44" rx="9" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="540" y="76" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Each herder</text><text x="540" y="91.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">adds cows</text><rect x="573" y="163" width="144" height="44" rx="9" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="645" y="181" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Grass is eaten</text><text x="645" y="196.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">faster than it regrows</text><rect x="468" y="268" width="144" height="44" rx="9" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="540" y="286" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Bare soil</text><text x="540" y="301.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">erodes</text><rect x="363" y="163" width="144" height="44" rx="9" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="435" y="181" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Less grass</text><text x="435" y="196.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">for every herd</text><path d="M575,124.38 A70,70 0 0 1 600.62,150" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M600.62,220 A70,70 0 0 1 575,245.62" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M505,245.62 A70,70 0 0 1 479.38,220" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M479.38,150 A70,70 0 0 1 505,124.38" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><text x="540" y="30" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">The shared resource runs down</text>
</svg>
