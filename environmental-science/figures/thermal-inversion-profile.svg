<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Normal conditions and a thermal inversion</title>
<desc id="d">Left: under normal conditions air near the valley floor is warmest and cools with height, so warm air rises and smoke from the town rises and spreads out. Right: in a thermal inversion a warm layer sits above cool, dense air in the valley; the smoke rises only to the warm layer and spreads out beneath it, trapped like under a lid.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="200" y="30" font-size="18" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="200" dy="0">Normal: air cools with height</tspan></text><defs><linearGradient id="g20" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FBE3D2"/><stop offset="1" stop-color="#DCEBF6"/></linearGradient></defs><rect x="20" y="70" width="360" height="310" rx="0" fill="url(#g20)"/><path d="M20,190 L90,380 L20,380 z" fill="#8C9A6A" stroke="none" stroke-width="0"/><path d="M380,210 L320,380 L380,380 z" fill="#8C9A6A" stroke="none" stroke-width="0"/><rect x="20" y="380" width="360" height="14" rx="0" fill="#6F7D4E"/><rect x="124" y="346" width="32" height="34" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><rect x="146" y="330" width="8" height="16" rx="0" fill="#8D8F86"/><rect x="179" y="346" width="32" height="34" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><rect x="201" y="330" width="8" height="16" rx="0" fill="#8D8F86"/><path d="M150,328 C140,240 180,160 160,100" fill="none" stroke="#6B7370" stroke-width="6"/><path d="M205,328 C195,240 235,160 215,100" fill="none" stroke="#6B7370" stroke-width="6"/><line x1="105" y1="310" x2="105" y2="140" stroke="#D55E00" stroke-width="3" marker-end="url(#arR)"/><text x="285" y="100" font-size="15" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="285" dy="0">cooler air</tspan></text><text x="285" y="285" font-size="15" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="285" dy="0">warm air</tspan></text><text x="285" y="305" font-size="14" font-weight="400" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="285" dy="0">near the ground</tspan></text><text x="105" y="122" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="105" dy="0">warm air rises</tspan></text><text x="200" y="416" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="200" dy="0">Smoke rises, spreads and thins</tspan></text><text x="600" y="30" font-size="18" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="600" dy="0">Thermal inversion</tspan></text><rect x="420" y="70" width="360" height="90" rx="0" fill="#EEF5FB"/><rect x="420" y="160" width="360" height="70" rx="0" fill="#FBE3D2"/><rect x="420" y="230" width="360" height="150" rx="0" fill="#DCEBF6"/><path d="M420,190 L490,380 L420,380 z" fill="#8C9A6A" stroke="none" stroke-width="0"/><path d="M780,210 L720,380 L780,380 z" fill="#8C9A6A" stroke="none" stroke-width="0"/><rect x="420" y="380" width="360" height="14" rx="0" fill="#6F7D4E"/><rect x="504" y="346" width="32" height="34" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><rect x="526" y="330" width="8" height="16" rx="0" fill="#8D8F86"/><rect x="559" y="346" width="32" height="34" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><rect x="581" y="330" width="8" height="16" rx="0" fill="#8D8F86"/><path d="M530,328 C524,290 538,250 530,238" fill="none" stroke="#6B7370" stroke-width="6"/><path d="M585,328 C579,290 593,250 585,238" fill="none" stroke="#6B7370" stroke-width="6"/><ellipse cx="570" cy="240" rx="110" ry="11" fill="#8D8F86" opacity="0.8"/><line x1="424" y1="230" x2="776" y2="230" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="7 5"/><text x="600" y="100" font-size="14" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="600" dy="0">cooler air above</tspan></text><text x="600" y="182" font-size="15" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="600" dy="0">warm layer (the lid)</tspan></text><text x="710" y="285" font-size="15" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="710" dy="0">cool, dense air</tspan></text><text x="710" y="307" font-size="14" font-weight="400" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="710" dy="0">cannot rise</tspan></text><text x="600" y="416" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="600" dy="0">Smoke stops under the warm layer</tspan></text>
</svg>
