d lifts</tspan><tspan x="600" dy="16.8">particles</tspan></text><rect x="690" y="270" width="110" height="30" rx="0" fill="#0072B2"/><path d="M690,272 C705,258 720,286 735,270 C750,256 765,286 780,270 C790,262 800,268 800,268" fill="none" stroke="#FFFFFF" stroke-width="3"/><circle cx="715" cy="240" r="3.5" fill="#5C9CC8"/><circle cx="740" cy="220" r="3.5" fill="#5C9CC8"/><circle cx="765" cy="235" r="3.5" fill="#5C9CC8"/><circle cx="750" cy="200" r="3.5" fill="#5C9CC8"/><text x="745" y="30" font-size="16" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="745" dy="0">Sea spray</tspan></text><text x="745" y="51.6" font-size="14" font-weight="400" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="745" dy="0">salt</tspan><tspan x="745" dy="16.8">particles</tspan></text><text x="400" y="365" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">Natural sources add CO2 and particles. Human sources (fuel burning, construction, plowing) add far more CO2.</tspan></text>
