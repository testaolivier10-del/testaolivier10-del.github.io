<title id="t">Population pyramids of Countries X, Y and Z</title>
<desc id="d">Population pyramids of three invented countries in millions of people. Country X: 4.2 million males and 4.0 million females aged 0 to 9, shrinking steadily to 0.1 million aged 80 and over. Country Y: about 2 million in each sex in every group from 0 to 59, then fewer. Country Z: 1.0 million of each sex aged 0 to 9, rising to 2.1 million in each sex aged 50 to 59, then falling.</desc>
