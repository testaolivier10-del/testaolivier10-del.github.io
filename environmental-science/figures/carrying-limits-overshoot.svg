<text x="380" y="354" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700">Years after deer reached the island</text>
<text x="42" y="170" font-size="14" fill="#1F2A28" text-anchor="middle" font-weight="700" transform="rotate(-90 42 170)">Number of deer</text>
