<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Overshoot and dieback</title>
<desc id="d">Line graph of an invented deer herd on an island over 30 years. It grows from 50 to a peak of 1,700 in year 16, well above the carrying capacity of 1,000 (dashed line), then dies back to 380 by year 22 and recovers only to about 750, below the old carrying capacity, because heavy grazing damaged the plants.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs><rect width="720" height="420" fill="#FFFFFF"/>
<line x1="100" y1="310" x2="660" y2="310" stroke="#D9DCD3" stroke-width="1"/>
<line x1="100" y1="240" x2="660" y2="240" stroke="#D9DCD3" stroke-width="1"/>
<line x1="100" y1="170" x2="660" y2="170" stroke="#D9DCD3" stroke-width="1"/>
<line x1="100" y1="100" x2="660" y2="100" stroke="#D9DCD3" stroke-width="1"/>
<line x1="100" y1="30" x2="660" y2="30" stroke="#D9DCD3" stroke-width="1"/>
<line x1="100" y1="310" x2="660" y2="310" stroke="#1F2A28" stroke-width="1.5"/>
