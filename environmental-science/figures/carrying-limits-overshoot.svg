<text x="193.3" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">5</text>
<line x1="286.7" y1="310" x2="286.7" y2="315" stroke="#1F2A28" stroke-width="1.5"/>
<text x="286.7" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">10</text>
<line x1="380" y1="310" x2="380" y2="315" stroke="#1F2A28" stroke-width="1.5"/>
<text x="380" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">15</text>
<line x1="473.3" y1="310" x2="473.3" y2="315" stroke="#1F2A28" stroke-width="1.5"/>
<text x="473.3" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">20</text>
<line x1="566.7" y1="310" x2="566.7" y2="315" stroke="#1F2A28" stroke-width="1.5"/>
<text x="566.7" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">25</text>
<line x1="660" y1="310" x2="660" y2="315" stroke="#1F2A28" stroke-width="1.5"/>
<text x="660" y="330" font-size="13" fill="#1F2A28" text-anchor="middle">30</text>
<line x1="95" y1="310" x2="100" y2="310" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="314.5" font-size="13" fill="#1F2A28" text-anchor="end">0</text>
<line x1="95" y1="240" x2="100" y2="240" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="244.5" font-size="13" fill="#1F2A28" text-anchor="end">500</text>
