<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="fuel-types-coal-ranks-t fuel-types-coal-ranks-d"><title id="fuel-types-coal-ranks-t">From peat to anthracite: how coal forms and ranks</title><desc id="fuel-types-coal-ranks-d">Plant material buried in a swamp becomes peat, then, with more heat, pressure, depth of burial and time, lignite, then bituminous coal, then anthracite. Along the series the carbon content and the energy per kilogram rise and the moisture falls; peat and lignite are the lowest-energy fuels, anthracite the highest.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/><text x="380" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Coal forms from buried plants: more heat and pressure, higher rank</text><rect x="30" y="60" width="150" height="122" rx="8" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.2"/><rect x="80" y="72" width="50" height="34" rx="6" fill="#C9B48F"/><text x="105" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Peat</text><text x="105" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle"><tspan x="105" dy="0">partly decayed</tspan><tspan x="105" dy="13">plant material</tspan></text><line x1="182" y1="121" x2="208" y2="121" stroke="#474A10" stroke-width="2.5" marker-end="url(#ah-olive)"/><rect x="212" y="60" width="150" height="122" rx="8" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.2"/><rect x="262" y="72" width="50" height="34" rx="6" fill="#8C6A43"/><text x="287" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Lignite</text><text x="287" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle"><tspan x="287" dy="0">soft, brown,</tspan><tspan x="287" dy="13">moist coal</tspan></text><line x1="364" y1="121" x2="390" y2="121" stroke="#474A10" stroke-width="2.5" marker-end="url(#ah-olive)"/><rect x="394" y="60" width="150" height="122" rx="8" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.2"/><rect x="444" y="72" width="50" height="34" rx="6" fill="#4A4038"/><text x="469" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Bituminous</text><text x="469" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle"><tspan x="469" dy="0">hard black coal,</tspan><tspan x="469" dy="13">widely burned</tspan><tspan x="469" dy="13">for electricity</tspan></text><line x1="546" y1="121" x2="572" y2="121" stroke="#474A10" stroke-width="2.5" marker-end="url(#ah-olive)"/><rect x="576" y="60" width="150" height="122" rx="8" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.2"/><rect x="626" y="72" width="50" height="34" rx="6" fill="#1F1F1F"/><text x="651" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Anthracite</text><text x="651" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle"><tspan x="651" dy="0">hardest, shiny,</tspan><tspan x="651" dy="13">highest carbon</tspan></text><line x1="40" y1="200" x2="720" y2="200" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="380" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D55E00" font-weight="700" text-anchor="middle">more heat, pressure, depth of burial and time</text><text x="30" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700">Carbon content</text><rect x="190" y="254" width="25" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="308" y="254" width="50" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="426" y="254" width="75" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="544" y="254" width="100" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><text x="740" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="end">low to high</text><text x="30" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700">Energy per kilogram</text><rect x="190" y="294" width="25" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="308" y="294" width="50" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="426" y="294" width="75" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><rect x="544" y="294" width="100" height="16" rx="3" fill="#474A10" fill-opacity="0.8"/><text x="740" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="end">low to high</text><text x="30" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700">Moisture</text><rect x="190" y="334" width="100" height="16" rx="3" fill="#0072B2" fill-opacity="0.8"/><rect x="308" y="334" width="75" height="16" rx="3" fill="#0072B2" fill-opacity="0.8"/><rect x="426" y="334" width="50" height="16" rx="3" fill="#0072B2" fill-opacity="0.8"/><rect x="544" y="334" width="25" height="16" rx="3" fill="#0072B2" fill-opacity="0.8"/><text x="740" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="end">high to low</text><text x="380" y="372" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6F6E" text-anchor="middle" font-style="italic">Bars show the trend only (relative, not measured values).</text></svg>
