<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="invasive-species-takeover-t invasive-species-takeover-d" font-family="Arial, Helvetica, sans-serif">
<title id="invasive-species-takeover-t">An invasive mussel and a native mussel in one lake over ten years</title>
<desc id="invasive-species-takeover-d">A graph with two y axes (invented data). The invasive mussel (left axis, per square meter) goes 0, 2, 8, 30, 110, 350, 800, 1200, 1350, 1400, 1420 in years 0 to 10: slow at first, then explosive growth, then leveling off. The native mussel (right axis, per square meter) goes 40, 40, 39, 37, 33, 26, 17, 9, 5, 3, 2: steady at first, then falling as the invader takes over.</desc>
