<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="ocean-warming-effects-t ocean-warming-effects-d" font-family="Arial, Helvetica, sans-serif">
<title id="ocean-warming-effects-t">Effects of ocean warming</title>
<desc id="ocean-warming-effects-d">A central box: the ocean absorbs heat; it has taken up about 90% of the extra heat trapped since 1970. Arrows lead to five effects: water expands, so sea level rises; warm water holds less dissolved oxygen, so fish and shellfish struggle; heat-stressed corals expel their algae and can starve (coral bleaching); fish shift toward the poles or into deeper, cooler water; and a warm surface layer floats on top, so fewer nutrients rise to it.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="400" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><rect x="250" y="150" width="260" height="90" rx="10" fill="#E3EEF6" stroke="#0072B2" stroke-width="2.5"/><text x="380" y="172" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="middle">The ocean absorbs heat</text><text x="380" y="191" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">It has taken up about 90% of the</text><text x="380" y="207" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">extra heat trapped since 1970.</text><rect x="20" y="20" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="120" y="42" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Water expands</text><text x="120" y="61" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Warmer water takes more</text><text x="120" y="76" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">space: sea level rises.</text><line x1="330" y1="150" x2="124.2" y2="100" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="540" y="20" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="640" y="42" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Less dissolved oxygen</text><text x="640" y="61" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Warm water holds less O₂;</text><text x="640" y="76" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">fish and shellfish struggle.</text><line x1="430" y1="150" x2="635.8" y2="100" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="20" y="300" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="120" y="322" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Coral bleaching</text><text x="120" y="341" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Heat-stressed corals expel</text><text x="120" y="356" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">their algae and can starve.</text><line x1="300" y1="240" x2="123.6" y2="294" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="540" y="300" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="640" y="322" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Species move</text><text x="640" y="341" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Fish shift toward the poles</text><text x="640" y="356" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">or into deeper, cooler water.</text><line x1="460" y1="240" x2="636.4" y2="294" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><rect x="280" y="320" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="380" y="342" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="middle">Less mixing</text><text x="380" y="361" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">A warm surface layer floats on top,</text><text x="380" y="376" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">so fewer nutrients rise to it.</text><line x1="380" y1="240" x2="380" y2="314" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/>
</svg>
