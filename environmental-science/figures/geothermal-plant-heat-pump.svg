<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="geothermal-plant-heat-pump-t geothermal-plant-heat-pump-d"><title id="geothermal-plant-heat-pump-t">Geothermal power plant and ground source heat pump</title><desc id="geothermal-plant-heat-pump-d">Left: at a geothermal power plant, a production well brings hot water and steam up from hot rock heated by Earth's interior; the steam spins a turbine and generator, and the cooled water is pumped back down an injection well. Right: a ground source heat pump circulates fluid through pipes buried a few meters down, where the ground stays about the same temperature all year; it moves heat from the ground into a house in winter and from the house into the ground in summer.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="410" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" font-weight="700" text-anchor="middle">Earth's internal heat: power plants where it is shallow, heat pumps almost anywhere</text><path d="M0 150 L480 150" fill="none" stroke="#1F2A28" stroke-width="2"/><path d="M0 150 L480 150 L480 410 L0 410 Z" fill="#EDE6D6" stroke="none" stroke-width="2"/><rect x="0" y="330" width="480" height="80" fill="#D55E00" fill-opacity="0.35"/><text x="240" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle"><tspan x="240" dy="0">hot rock: heat from Earth's interior</tspan><tspan x="240" dy="14.375">(radioactive decay and heat left from Earth's formation)</tspan></text><line x1="120" y1="330" x2="120" y2="160" stroke="#D55E00" stroke-width="6" marker-end="url(#ah-verm)"/><text x="112" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#D55E00" text-anchor="end"><tspan x="112" dy="0">production</tspan><tspan x="112" dy="13">well: steam</tspan><tspan x="112" dy="13">and hot water</tspan></text><line x1="360" y1="160" x2="360" y2="330" stroke="#0072B2" stroke-width="6" marker-end="url(#ah-blue)"/><text x="368" y="250" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0072B2"><tspan x="368" dy="0">injection well:</tspan><tspan x="368" dy="13">cooled water</tspan><tspan x="368" dy="13">returned</tspan></text><rect x="150" y="70" width="90" height="55" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="195" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">turbine</text><rect x="260" y="70" width="90" height="55" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="305" y="102" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">generator</text><line x1="240" y1="97" x2="260" y2="97" stroke="#1F2A28" stroke-width="4"/><path d="M120 160 L120 97 L148 97" fill="none" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><path d="M195 125 L195 140 L360 140 L360 158" fill="none" stroke="#0072B2" stroke-width="3"/><line x1="350" y1="85" x2="420" y2="60" stroke="#474A10" stroke-width="2.5" marker-end="url(#ah-olive)"/><text x="425" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#474A10" font-weight="700">electricity</text><line x1="500" y1="50" x2="500" y2="400" stroke="#D9DCDA" stroke-width="1.5"/><path d="M560 230 L560 150 L650 100 L740 150 L740 230 Z" fill="#EFF0DA" stroke="#1F2A28" stroke-width="1.5"/><text x="650" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">house</text><path d="M520 230 L790 230" fill="none" stroke="#1F2A28" stroke-width="2"/><path d="M520 230 L790 230 L790 410 L520 410 Z" fill="#EDE6D6" stroke="none" stroke-width="2"/><path d="M620 230 L620 330 Q650 360 680 330 L680 230" fill="none" stroke="#009E73" stroke-width="4"/><rect x="605" y="205" width="90" height="22" rx="4" fill="#fff" stroke="#009E73" stroke-width="1.5"/><text x="650" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">heat pump</text><text x="655" y="386" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">pipes a few meters down: the ground</text><text x="655" y="401" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">stays about the same temperature all year</text><text x="560" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#D55E00" text-anchor="end"><tspan x="560" dy="0">winter: heat</tspan><tspan x="560" dy="13">from ground</tspan><tspan x="560" dy="13">to house</tspan></text><text x="690" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0072B2"><tspan x="690" dy="0">summer: heat</tspan><tspan x="690" dy="13">from house</tspan><tspan x="690" dy="13">to ground</tspan></text></svg>
