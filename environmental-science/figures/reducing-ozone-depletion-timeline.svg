could destroy</text><text x="75" y="76" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">stratospheric ozone</text><circle cx="149" cy="165" r="6" fill="#1F2A28" stroke="none" stroke-width="1.5"/><path d="M 149 172 L 149 186 L 95 208" fill="none" stroke="#8A9290" stroke-width="1"/><text x="95" y="226" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">1985</text><text x="95" y="244" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Ozone hole over</text><text x="95" y="258" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Antarctica reported</text><circle cx="162.2" cy="165" r="6" fill="#474A10" stroke="none" stroke-width="1.5"/><path d="M 162.2 158 L 162.2 138 L 215 104" fill="none" stroke="#8A9290" stroke-width="1"/><text x="215" y="30" font-size="13" font-weight="bold" fill="#474A10" text-anchor="middle">1987</text><text x="215" y="48" font-size="11.5" font-weight="normal" fill="#474A10" text-anchor="middle">Montreal Protocol</text><text x="215" y="62" font-size="11.5" font-weight="normal" fill="#474A10" text-anchor="middle">signed</text><circle cx="221.6" cy="165" r="6" fill="#1F2A28" stroke="none" stroke-width="1.5"/><path d="M 221.6 172 L 221.6 186 L 245 208" fill="none" stroke="#8A9290" stroke-width="1"/><text x="245" y="226" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">1996</text><text x="245" y="244" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">CFC production ends</text><text x="245" y="258" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">in developed countries</text><circle cx="314" cy="165" r="6" fill="#1F2A28" stroke="none" stroke-width="1.5"/><path d="M 314 158 L 314 138 L 355 104" fill="none" stroke="#8A9290" stroke-width="1"/><text x="355" y="30" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">2010</text><text x="355" y="48" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">CFC production ends</text><text x="355" y="62" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">worldwide</text><circle cx="353.6" cy="165" r="6" fill="#1F2A28" stroke="none" stroke-width="1.5"/><path d="M 353.6 172 L 353.6 186 L 395 208" fill="none" stroke="#8A9290" stroke-width="1"/><text x="395" y="226" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">2016</text><text x="395" y="244" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Kigali Amendment:</text><text x="395" y="258" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">HFCs phased down</text><circle cx="683.6" cy="165" r="6" fill="#009E73" stroke="none" stroke-width="1.5"/><path d="M 683.6 158 L 683.6 138 L 660 104" fill="none" stroke="#8A9290" stroke-width="1"/><text x="660" y="30" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">2066</text><text x="660" y="48" font-size="11.5" font-weight="normal" fill="#009E73" text-anchor="middle">Antarctic ozone expected</text><text x="660" y="62" font-size="11.5" font-weight="normal" fill="#009E73" text-anchor="middle">back to 1980 levels</text><text x="380" y="318" font-size="11.5" font-weight="normal" fill="#8A9290" text-anchor="middle">Dates from the UN Environment Programme and WMO ozone assessments.</text>
