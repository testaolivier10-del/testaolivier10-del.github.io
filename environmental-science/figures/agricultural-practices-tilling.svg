ter breaks down faster</text><line x1="20" y1="202" x2="350" y2="202" stroke="#3A2816" stroke-width="5" stroke-dasharray="12 4"/><text x="185" y="232" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Packed layer forms under</text><text x="185" y="250" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">the plow depth</text><rect x="370" y="40" width="330" height="90" rx="0" fill="#EAF4FB" stroke="none" stroke-width="1.5"/><rect x="370" y="130" width="330" height="70" rx="0" fill="#7C5A3C" stroke="none" stroke-width="1.5"/><rect x="370" y="200" width="330" height="90" rx="0" fill="#8C6A48" stroke="none" stroke-width="1.5"/><line x1="378" y1="129" x2="388" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="394" y1="129" x2="404" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="410" y1="129" x2="420" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="426" y1="129" x2="436" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="442" y1="129" x2="452" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="458" y1="129" x2="468" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="474" y1="129" x2="484" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="490" y1="129" x2="500" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="506" y1="129" x2="516" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="522" y1="129" x2="532" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="538" y1="129" x2="548" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="554" y1="129" x2="564" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="570" y1="129" x2="580" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="586" y1="129" x2="596" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="602" y1="129" x2="612" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="618" y1="129" x2="628" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="634" y1="129" x2="644" y2="123" stroke="#C2A75A" stroke-width="3"/><line x1="650