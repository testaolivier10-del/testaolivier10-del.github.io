<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="sustainable-agriculture-hillside-t sustainable-agriculture-hillside-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainable-agriculture-hillside-t">Contour plowing, strip cropping and terracing on hillsides</title>
<desc id="sustainable-agriculture-hillside-d">Two hillsides. Left: plowed rows follow the contour of the hill instead of running up and down it, and strips of different crops alternate, so each row and strip slows the water running downhill. Right: terraces, flat steps cut into a steep slope, each planted with a crop; water pools on each step and soaks in instead of running down the whole slope.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<rect x="0" y="0" width="720" height="380" rx="0" fill="#EAF4FB" stroke="none" stroke-width="1.5"/><text x="180" y="26" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">Contour plowing and strip cropping</text><clipPath id="hill-clip"><path d="M20,320 Q180,-20 340,320 Z"/></clipPath><path d="M20,320 Q180,-20 340,320 Z" fill="#C9B27C" stroke="none" stroke-width="1.5"/><g clip-path="url(#hill-clip)"><path d="M10,312 Q180,286 350,312" fill="none" stroke="#8C6A48" stroke-width="11"/><path d="M10,290 Q180,264 350,290" fill="none" stroke="#009E73" stroke-width="11"/><path d="M10,268 Q180,242 350,268" fill="none" stroke="#8C6A48" stroke-width="11"/><path d="M10,246 Q180,220 350,246" fill="none" stroke="#009E73" stroke-width="11"/><path d="M10,224 Q180,198 350,224" fill="none" stroke="#8C6A48" stroke-width="11"/><path d="M10,202 Q180,176 350,202" fill="none" stroke="#009E73" stroke-width="11"/><path d="M10,180 Q180,154 350,180" fill="none" stroke="#8C6A48" stroke-width="11"/></g><line x1="300" y1="60" x2="300" y2="120" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="250" y="50" font-size="12" font-weight="normal" fill="#0B4F7A" text-anchor="start">Rain</text><text x="180" y="345" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Rows follow the land’s contour; strips of different</text><text x="180" y="360.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">crops alternate. Each row and strip slows runoff.</text><text x="540" y="26" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">Terracing</text><path d="M380,320 L380,300 L440,300 L440,250 L500,250 L500,200 L560,200 L560,150 L620,150 L620,100 L680,100 L700,100 L700,320 Z" fill="#C9B27C" stroke="#8C6A48" stroke-width="2"/><line x1="384" y1="296" x2="436" y2="296" stroke="#009E73" stroke-width="6"/><line x1="444" y1="246" x2="496" y2="246" stroke="#009E73" stroke-width="6"/><line x1="504" y1="196" x2="556" y2="196" stroke="#009E73" stroke-width="6"/><line x1="564" y1="146" x2="616" y2="146" stroke="#009E73" stroke-width="6"/><line x1="624" y1="96" x2="676" y2="96" stroke="#009E73" stroke-width="6"/><line x1="470" y1="222" x2="470" y2="246" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="478" y="236" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">Water pools and soaks in</text><text x="540" y="345" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Flat steps cut into a steep slope</text><text x="540" y="360.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">shorten each run of water.</text>
</svg>
