e="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="725" dy="0">Asbestos fibers</tspan><tspan x="725" dy="16.3">old pipe wrap</tspan></text><line x1="660" y1="278" x2="512" y2="349" stroke="#474A10" stroke-width="1.5"/><rect x="200" y="196" width="26" height="30" rx="0" fill="#7AA6C8" stroke="#1F2A28" stroke-width="1"/><rect x="20" y="160" width="130" height="56" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="85" y="179.9" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="85" dy="0">VOCs</tspan><tspan x="85" dy="16.3">paint, cleaners</tspan></text><line x1="150" y1="188" x2="198" y2="206" stroke="#474A10" stroke-width="1.5"/><text x="400" y="20" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">Tight walls keep outdoor air out, so indoor pollutants build up</tspan></text>
</svg>
