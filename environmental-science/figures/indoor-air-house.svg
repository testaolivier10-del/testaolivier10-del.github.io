<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Indoor air pollutants in a home</title>
<desc id="d">Cutaway house. Radon seeps up from uranium-bearing rock through a crack in the basement floor. New kitchen cabinets give off formaldehyde. A furnace and gas stove can release carbon monoxide. A wood stove releases smoke particles. Old pipe insulation in the basement can release asbestos fibers. Paints and cleaners release VOCs.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="460" fill="#FFFFFF"/>
<rect x="0" y="330" width="800" height="130" rx="0" fill="#C9B48E"/><rect x="0" y="400" width="800" height="60" rx="0" fill="#A39787"/><text x="110" y="430" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="110" dy="0">uranium-bearing rock (granite)</tspan></text><path d="M150,140 L400,40 L650,140 z" fill="#D9CBB8" stroke="#1F2A28" stroke-width="2"/><rect x="160" y="140" width="480" height="190" rx="0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="2"/><line x1="160" y1="235" x2="640" y2="235" stroke="#1F2A28" stroke-width="2"/><rect x="160" y="330" width="480" height="60" rx="0" fill="#EFEDE6" stroke="#1F2A28" stroke-width="2"/><text x="220" y="375" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="220" dy="0">basement</tspan></text><line x1="330" y1="390" x2="340" y2="380" stroke="#1F2A28" stroke-width="2"/><line x1="340" y1="380" x2="334" y2="372" stroke="#1F2A28" stroke-width="2"/><line x1="300" y1="445" x2="306" y2="340" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arR)"/><line x1="340" y1="445" x2="346" y2="340" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arR)"/><line x1="380" y1="445" x2="386" y2="340" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arR)"/><rect x="20" y="300" width="130" height="56" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2"/><text x="85" y="319.3" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="85" dy="0">Radon</tspan><tspan x="85" dy="17.5">seeps up</tspan></text><line x1="150" y1="328" x2="296" y2="380" stroke="#D55E00" stroke-width="1.5"/><rect x="520" y="340" width="50" height="46" rx="0" fill="#9A9C95" stroke="#1F2A28" stroke-width="1.5"/><rect x="536" y="330" width="14" height="10" rx="0" fill="#9A9C95"/><rect x="660" y="330" width="130" height="56" rx="8" fill="#F4F