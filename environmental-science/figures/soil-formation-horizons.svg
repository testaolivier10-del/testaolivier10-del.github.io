<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" role="img" aria-labelledby="soil-formation-horizons-t soil-formation-horizons-d" font-family="Arial, Helvetica, sans-serif">
<title id="soil-formation-horizons-t">Soil horizons in a soil profile</title>
<desc id="soil-formation-horizons-d">A soil profile cut straight down. At the top, plants grow and drop leaves. The O horizon is a thin dark layer of fallen leaves and organic matter decaying into humus. The A horizon, or topsoil, is dark: humus mixed with minerals, where most roots and soil organisms live. The B horizon, or subsoil, is lighter brown and collects clay, iron and other minerals leached down from above. The C horizon holds chunks of partly weathered parent material. At the bottom is bedrock, the parent material the soil slowly forms from. An arrow shows weathering breaking rock into smaller pieces from below, while organic matter is added from above. Soil forms slowly, often taking centuries for a few centimeters.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="560" height="460" fill="#FFFFFF"/>
