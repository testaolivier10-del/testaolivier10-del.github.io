<text x="16" y="345" font-size="11" font-weight="normal" fill="#474A10" text-anchor="middle" transform="rotate(-90 16 345)">Weathering of rock</text>
<text x="140" y="30" font-size="12" font-weight="bold" fill="#009E73" text-anchor="middle">Organic matter added from above</text>
<text x="40" y="446" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start" font-style="italic">Soil forms slowly: often centuries for a few centimeters</text>
</svg>
