<text x="272" y="93" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">fallen leaves and other organic</text><text x="272" y="108" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">matter, decaying into humus</text>
<rect x="40" y="100" width="200" height="75" rx="0" fill="#5B4128" stroke="none" stroke-width="1.5"/>
<text x="140" y="143.5" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
<line x1="244" y1="137.5" x2="266" y2="137.5" stroke="#6B7370" stroke-width="1"/>
<text x="272" y="129.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">A horizon (topsoil)</text>
<text x="272" y="145.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">humus mixed with minerals;</text><text x="272" y="160.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">most roots and soil organisms</text>
<rect x="40" y="175" width="200" height="90" rx="0" fill="#9A6B3F" stroke="none" stroke-width="1.5"/>
<text x="140" y="226" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
<line x1="244" y1="220" x2="266" y2="220" stroke="#6B7370" stroke-width="1"/>
<text x="272" y="212" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">B horizon (subsoil)</text>
<text x="272" y="228" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">clay, iron and other minerals</text><text x="272" y="243" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">leached down from above collect here</text>
<rect x="40" y="265" width="200" height="80" rx="0" fill="#C7A87F" stroke="none" stroke-width="1.5"/>
<text x="140" y="311" font-size="18" font-weight="bold" fill="#1F2A28" text-anchor="middle">C</text>
<line x1="244" y1="305" x2="266" y2="305" stroke="#6B7370" stroke-width="1"/>
<text x="272" y="297" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">C horizon</text>
<text x="272" y="313" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">chunks of partly weathered</text><text x="272" y="328" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">parent material</text>
<rect x="40" y="345" width="200" height="75" rx="0" fill="#9AA09D" stroke="none" stroke-width="1.5"/>
<text x="140" y="388.5" font-size="18" font-weight="bold" fill="#1F2A28" text-anchor="middle">R</text>
<line x1="244" y1="382.5" x2="266" y2="382.5" stroke="#6B7370" stroke-width="1"/>
<text x="272" y="374.5" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Bedrock (parent material)</text>
<text x="272" y="390.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">the solid rock the soil</text><text x="272" y="405.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">slowly forms from</text>
