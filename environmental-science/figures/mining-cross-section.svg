<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="mining-cross-section-t mining-cross-section-d" font-family="Arial, Helvetica, sans-serif">
<title id="mining-cross-section-t">Surface mining and subsurface mining in cross-section</title>
<desc id="mining-cross-section-d">Cross-section of the ground. Left, surface mining: an open pit is dug to reach ore near the surface, the soil and rock removed (overburden) are piled beside it, waste rock called tailings sits nearby, and acid drainage carries metals from the waste into water. Right, subsurface mining: a headframe sits over a vertical shaft with tunnels to deep ore; it disturbs less land but carries more risk to miners.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<rect x="0" y="0" width="720" height="90" rx="0" fill="#EAF4FB" stroke="none" stroke-width="1.5"/><rect x="0" y="90" width="720" height="270" rx="0" fill="#B8916A" stroke="none" stroke-width="1.5"/><rect x="0" y="150" width="720" height="210" rx="0" fill="#A27E5C" stroke="none" stroke-width="1.5"/><path d="M60,90 L300,90 L260,180 L100,180 Z" fill="#EDE6DA" stroke="none" stroke-width="1.5"/><rect x="110" y="180" width="140" height="22" rx="0" fill="#5C5C5C" stroke="none" stroke-width="1.5"/><text x="180" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ore near the surface</text><path d="M300,90 L330,55 L380,55 L410,90 Z" fill="#9B8B76" stroke="#1F2A28" stroke-width="1"/><text x="355" y="48" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Overburden pile</text><line x1="240" y1="120" x2="320" y2="75" stroke="#1F2A28" stroke-width="1.5" marker-end="url(#ar-ink)"/><text x="180" y="125" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Open pit</text><path d="M0,90 L55,90 L40,80 L0,80 Z" fill="#C4B9A0" stroke="#1F2A28" stroke-width="1"/><text x="8" y="72" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Tailings</text><path d="M30,92 C35,130 25,170 40,215" fill="none" stroke="#D55E00" stroke-width="3" marker-end="url(#ar-verm)"/><rect x="44" y="216" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="52" y="234" font-size="12" font-weight="bold" fill="#A8470A" text-anchor="start">Acid drainage</text><text x="52" y="249.6" font-size="12" font-weight="bold" fill="#A8470A" text-anchor="start">carries metals</text><text x="52" y="265.2" font-size="12" font-weight="bold" fill="#A8470A" text-anchor="start">into water</text><rect x="520" y="20" width="50" height="70" rx="0" fill="#7D7D7D" stroke="#1F2A28" stroke-width="1.5"/><text x="545" y="14" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Headframe</text><rect x="538" y="90" width="14" height="230" rx="0" fill="#3F3F3F" stroke="none" stroke-width="1.5"/><rect x="552" y="250" width="140" height="14" rx="0" fill="#3F3F3F" stroke="none" stroke-width="1.5"/><rect x="420" y="300" width="118" height="14" rx="0" fill="#3F3F3F" stroke="none" stroke-width="1.5"/><rect x="600" y="230" width="90" height="22" rx="0" fill="#5C5C5C" stroke="none" stroke-width="1.5"/><rect x="430" y="316" width="90" height="22" rx="0" fill="#5C5C5C" stroke="none" stroke-width="1.5"/><text x="645" y="222" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Deep ore</text><text x="470" y="140" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="start">Shaft and tunnels:</text><text x="470" y="156.25" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="start">less land disturbed,</text><text x="470" y="172.5" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="start">more risk to miners</text><text x="180" y="345" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Surface mining</text><text x="555" y="345" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Subsurface mining</text>
</svg>
