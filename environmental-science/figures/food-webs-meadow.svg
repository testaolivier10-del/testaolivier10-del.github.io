height="38" rx="8" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="290" y="283.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Rabbit</text><rect x="400" y="260" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="460" y="283.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Mouse</text><rect x="40" y="150" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/><text x="100" y="173.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Frog</text><rect x="240" y="150" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/><text x="300" y="173.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Snake</text><rect x="560" y="150" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/><text x="620" y="173.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fox</text><rect x="420" y="50" width="120" height="38" rx="8" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="480" y="73.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Hawk</text><rect x="560" y="300" width="180" height="120" rx="8" fill="#F3ECDD" stroke="#8C6D46" stroke-width="1.5"/><text x="650" y="341.7" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Decomposers and</text><text x="650" y="356.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">detritivores</text><text x="650" y="371.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">fungi, bacteria,</text><text x="650" y="386.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">earthworms</text><text x="560" y="440" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="start">They break down dead matter</text><text x="560" y="454" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="start">from every level.</text><text x="24" y="24" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="start">A meadow food web: arrows point from the food to the eater</text><text x="24" y="462" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="start">Producers green, primary consumers olive, higher consumers blue, top predator vermillion.</text>
