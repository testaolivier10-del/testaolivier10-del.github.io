<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="hydroelectric-dam-t hydroelectric-dam-d"><title id="hydroelectric-dam-t">How a hydroelectric dam makes electricity</title><desc id="hydroelectric-dam-d">A dam holds water in a reservoir. Water enters an intake, falls through a large pipe called a penstock and spins a turbine, which turns a generator. The water leaves into the river below. The reservoir floods land upstream and traps sediment behind the dam; the dam blocks fish migration and changes the temperature and flow of the river downstream.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Falling water turns a turbine; the dam changes the river</text><path d="M0 140 L330 140 L330 330 L0 330 Z" fill="#BFE0F2" stroke="none" stroke-width="2"/><text x="140" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0072B2" font-weight="700" text-anchor="middle">Reservoir</text><text x="140" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">floods valley land upstream</text><path d="M0 300 Q160 285 330 300 L330 330 L0 330 Z" fill="#C9B48F" stroke="none" stroke-width="2"/><text x="165" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">sediment trapped behind the dam</text><path d="M330 90 L400 90 L470 330 L330 330 Z" fill="#F1F2F1" stroke="#1F2A28" stroke-width="2"/><text x="375" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Dam</text><path d="M330 200 L430 280 L480 300" fill="none" stroke="#0072B2" stroke-width="8"/><text x="395" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28">penstock</text><text x="310" y="216" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="end">intake</text><rect x="480" y="280" width="80" height="50" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="520" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">turbine</text><line x1="520" y1="280" x2="520" y2="230" stroke="#1F2A28" stroke-width="4"/><rect x="475" y="185" width="90" height="45" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="520" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">generator</text><line x1="565" y1="205" x2="640" y2="160" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><text x="650" y="156" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#474A10" font-weight="700"><tspan x="650" dy="0">electricity to</tspan><tspan x="650" dy="14">power lines</tspan></text><path d="M560 320 L800 320 L800 345 L560 345 Z" fill="#BFE0F2" stroke="none" stroke-width="2"/><text x="680" y="368" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle"><tspan x="680" dy="0">river below: less sediment,</tspan><tspan x="680" dy="14">altered flow and temperature</tspan></text><path d="M770 330 Q720 312 680 332" fill="none" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ah-verm)"/><text x="760" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D55E00" text-anchor="middle"><tspan x="760" dy="0">migrating fish</tspan><tspan x="760" dy="14">blocked</tspan></text></svg>
