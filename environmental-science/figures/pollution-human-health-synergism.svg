<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="pollution-human-health-synergism-t pollution-human-health-synergism-d" font-family="Arial, Helvetica, sans-serif">
<title id="pollution-human-health-synergism-t">Lung damage in lab mice from two air pollutants, alone and together</title>
<desc id="pollution-human-health-synergism-d">A bar chart of the percent of lab mice with lung damage after 30 days (invented data): 2% with no pollutant, 10% with pollutant A alone, 8% with pollutant B alone and 40% with A and B together. A dashed line at 18% marks what the two separate effects would add to; the bar for both together is far above it, which is synergism.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="640" height="380" fill="#FFFFFF"/>
<line x1="80" y1="300" x2="610" y2="300" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="304" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="80" y1="246" x2="610" y2="246" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="250" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">10</text><line x1="80" y1="192" x2="610" y2="192" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="196" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">20</text><line x1="80" y1="138" x2="610" y2="138" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="142" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">30</text><line x1="80" y1="84" x2="610" y2="84" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="88" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40</text><line x1="80" y1="30" x2="610" y2="30" stroke="#E9ECEB" stroke-width="1"/><text x="72" y="34" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">50</text><line x1="80" y1="300" x2="610" y2="300" stroke="#1F2A28" stroke-width="1.5"/><line x1="80" y1="300" x2="80" y2="30" stroke="#1F2A28" stroke-width="1.5"/><text x="32" y="165" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 32 165)">Mice with lung damage (%)</text><rect x="106.5" y="289.2" width="79.5" height="10.8" rx="0" fill="#8A9290" stroke="none" stroke-width="1.5"/><text x="146.25" y="282.2" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">2%</text><text x="146.25" y="320" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">No pollutant</text><rect x="239" y="246" width="79.5" height="54" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="278.75" y="239" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">10%</text><text x="278.75" y="320" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Pollutant A alone</text><rect x="371.5" y="256.8" width="79.5" height="43.2" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="411.25" y="249.8" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">8%</text><text x="411.25" y="320" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Pollutant B alone</text><rect x="504" y="84" width="79.5" height="216" rx="0" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="543.75" y="77" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">40%</text><text x="543.75" y="320" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">A and B together</text><line x1="490.75" y1="202.8" x2="596.75" y2="202.8" stroke="#1F2A28" stroke-width="2" stroke-dasharray="6 4"/><text x="477.5" y="206.8" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">A + B added: 18%</text><text x="345" y="340" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Lab mice breathing air for 30 days</text><text x="606" y="46" font-size="11.5" font-weight="normal" fill="#8A9290" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
