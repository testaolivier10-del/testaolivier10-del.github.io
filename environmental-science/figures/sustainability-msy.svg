<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="sustainability-msy-t sustainability-msy-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainability-msy-t">How fast a fish population adds new fish at each size</title>
<desc id="sustainability-msy-d">A hump-shaped curve for a fish population with logistic growth and a carrying capacity (K) of 1,000 fish. The number of new fish added each year is near zero when the population is small (few parents), rises to a peak of 100 fish a year at 500 fish (half of K), and falls back to zero at 1,000 fish, where crowding stops growth. Harvesting the peak, 100 fish a year, while the population is held at 500, is the maximum sustainable yield.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<line x1="110" y1="270" x2="600" y2="270" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="274" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="110" y1="231.67" x2="600" y2="231.67" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="235.67" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">20</text><line x1="110" y1="193.33" x2="600" y2="193.33" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="197.33" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40</text><line x1="110" y1="155" x2="600" y2="155" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="159" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">60</text><line x1="110" y1="116.67" x2="600" y2="116.67" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="120.67" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">80</text><line x1="110" y1="78.33" x2="600" y2="78.33" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="82.33" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">100</text><line x1="110" y1="40" x2="600" y2="40" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="44" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">120</text><line x1="110" y1="270" x2="110" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="110" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="208" y1="270" x2="208" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="208" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">200</text><line x1="306" y1="270" x2="306" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="306" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">400</text><line x1="404" y1="270" x2="404" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="404" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">600</text><line x1="502" y1="270" x2="502" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="502" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">800</text><line x1="600" y1="270" x2="600" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="600" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1,000</text><line x1="110" y1="270" x2="600" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="110" y1="40" x2="110" y2="270" stroke="#1F2A28" stroke-width="1.5"/><text x="355" y="312" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Population size (fish)</text><text x="58" y="155" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 58 155)">New fish per year</text><path d="M110,270 L122.25,251.31 L134.5,233.58 L146.75,216.81 L159,201 L171.25,186.15 L183.5,172.25 L195.75,159.31 L208,147.33 L220.25,136.31 L232.5,126.25 L244.75,117.15 L257,109 L269.25,101.81 L281.5,95.58 L293.75,90.31 L306,86 L318.25,82.65 L330.5,80.25 L342.75,78.81 L355,78.33 L367.25,78.81 L379.5,80.25 L391.75,82.65 L404,86 L416.25,90.31 L428.5,95.58 L440.75,101.81 L453,109 L465.25,117.15 L477.5,126.25 L489.75,136.31 L502,147.33 L514.25,159.31 L526.5,172.25 L538.75,186.15 L551,201 L563.25,216.81 L575.5,233.58 L587.75,251.31 L600,270" fill="none" stroke="#474A10" stroke-width="3"/><line x1="355" y1="270" x2="355" y2="78.33" stroke="#0072B2" stroke-width="2" stroke-dasharray="5 4"/><line x1="110" y1="78.33" x2="355" y2="78.33" stroke="#0072B2" stroke-width="2" stroke-dasharray="5 4"/><circle cx="355" cy="78.33" r="6" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="367" y="62.33" font-size="12.5" font-weight="bold" fill="#0B4F7A" text-anchor="start">Maximum sustainable yield:</text><text x="367" y="78.58" font-size="12.5" font-weight="bold" fill="#0B4F7A" text-anchor="start">100 fish a year at 500 fish (half of K)</text><text x="168.8" y="247" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">Few fish:</text><text x="168.8" y="262.6" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">few births</text><text x="531.4" y="116.67" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">Near K = 1,000:</text><text x="531.4" y="132.27" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">crowding slows</text><text x="531.4" y="147.87" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">growth</text>
</svg>
