<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="pest-control-resistance-t pest-control-resistance-d" font-family="Arial, Helvetica, sans-serif">
<title id="pest-control-resistance-t">Share of a pest population resistant to a pesticide over time</title>
<desc id="pest-control-resistance-d">Line graph, invented data for practice. The percent of pests resistant to a pesticide, after each two generations of regular spraying: 1%, 2%, 5%, 12%, 27%, 50%, 73%, 88%, 95% at generations 0, 2, 4, 6, 8, 10, 12, 14, 16. The share starts near 1%, rises slowly, then quickly, and levels off near 95%, an S-shaped rise caused by natural selection.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<line x1="100" y1="270" x2="620" y2="270" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="274" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="100" y1="224" x2="620" y2="224" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="228" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">20</text><line x1="100" y1="178" x2="620" y2="178" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="182" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40</text><line x1="100" y1="132" x2="620" y2="132" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="136" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">60</text><line x1="100" y1="86" x2="620" y2="86" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="90" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">80</text><line x1="100" y1="40" x2="620" y2="40" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="44" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">100</text><line x1="100" y1="270" x2="100" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="100" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="165" y1="270" x2="165" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="165" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2</text><line x1="230" y1="270" x2="230" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="230" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text><line x1="295" y1="270" x2="295" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="295" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">6</text><line x1="360" y1="270" x2="360" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="360" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8</text><line x1="425" y1="270" x2="425" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="425" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">10</text><line x1="490" y1="270" x2="490" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="490" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">12</text><line x1="555" y1="270" x2="555" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="555" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">14</text><line x1="620" y1="270" x2="620" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="620" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">16</text><line x1="100" y1="270" x2="620" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="100" y1="40" x2="100" y2="270" stroke="#1F2A28" stroke-width="1.5"/><text x="360" y="312" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Generations of pests since spraying began</text><text x="48" y="155" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 48 155)">Pests resistant (%)</text><path d="M100,267.7 L165,265.4 L230,258.5 L295,242.4 L360,207.9 L425,155 L490,102.1 L555,67.6 L620,51.5" fill="none" stroke="#D55E00" stroke-width="3"/><circle cx="100" cy="267.7" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="165" cy="265.4" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="230" cy="258.5" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="295" cy="242.4" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="360" cy="207.9" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="425" cy="155" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="490" cy="102.1" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="555" cy="67.6" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><circle cx="620" cy="51.5" r="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="116.25" y="76.8" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Each spraying kills most of the pests that</text><text x="116.25" y="93.05" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">can be killed. The few with resistance</text><text x="116.25" y="109.3" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">survive and breed, so their share grows.</text><text x="708" y="330" font-size="11" font-weight="normal" fill="#5A6260" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
