<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="phosphorus-cycle-steps-t phosphorus-cycle-steps-d" font-family="Arial, Helvetica, sans-serif">
<title id="phosphorus-cycle-steps-t">The phosphorus cycle</title>
<desc id="phosphorus-cycle-steps-d">The phosphorus cycle has no gas phase. Weathering releases phosphate from rocks into soil. Plants take up phosphate and animals get it by eating plants; wastes, remains and decomposers return it to the soil. Rain washes phosphate from soil into lakes, rivers and oceans, where it settles as sediment. Over millions of years, uplift turns sediments back into rock on land. People add phosphate as fertilizer to farm soil, and water from farms and wastewater carries extra phosphate into lakes, where algae then grow out of control. Because phosphorus does not cycle through the air, it moves slowly and is often a limiting nutrient.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<rect x="30" y="40" width="176" height="58" rx="8" fill="#EDE7DC" stroke="#6B7370" stroke-width="1.5"/><text x="118" y="73.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Rocks with phosphate</text><rect x="290" y="40" width="200" height="58" rx="8" fill="#F3ECDD" stroke="#8C6D46" stroke-width="1.5"/><text x="390" y="73.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Phosphate in soil</text><rect x="560" y="40" width="170" height="58" rx="8" fill="#E4F2E9" stroke="#009E73" stroke-width="1.5"/><text x="645" y="65.42" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Plants, then</text><text x="645" y="81.67" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">animals</text><rect x="290" y="250" width="200" height="58" rx="8" fill="#D7E9F5" stroke="#0072B2" stroke-width="1.5"/><text x="390" y="275.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Phosphate in lakes,</text><text x="390" y="291.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">rivers and oceans</text><rect x="30" y="380" width="220" height="58" rx="8" fill="#EDE7DC" stroke="#6B7370" stroke-width="1.5"/><text x="140" y="413.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Ocean sediments</text><rect x="560" y="250" width="170" height="58" rx="8" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.5"/><text x="645" y="275.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">People: fertilizer,</text><text x="645" y="291.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">mined phosphate</text><line x1="206" y1="69" x2="290" y2="69" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><text x="248" y="59" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">Weathering</text><line x1="490" y1="60" x2="560" y2="60" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><text x="525" y="50" font-size="12" font-weight="normal" fill="#009E73" text-anchor="middle">Taken up</text><line x1="560" y1="84" x2="490" y2="84" stroke="#6B7370" stroke-width="2" marker-end="url(#ar-grey)"/><text x="531" y="108" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">Wastes, remains,</text><text x="531" y="121.75" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">decomposers</text><line x1="390" y1="98" x2="390" y2="250" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="344" y="174" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="middle">Washed off</text><text x="344" y="189" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="middle">by rain</text><line x1="330" y1="308" x2="200" y2="380" stroke="#6B7370" stroke-width="2" marker-end="url(#ar-grey)"/><text x="353" y="366" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">Sedimentation</text><text x="353" y="381" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">(settles to the bottom)</text><line x1="100" y1="380" x2="100" y2="98" stroke="#6B7370" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-grey)"/><text x="48" y="269" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">Uplift over</text><text x="48" y="282.75" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">millions of years</text><line x1="560" y1="279" x2="490" y2="279" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><line x1="645" y1="250" x2="645" y2="98" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="689" y="174" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">Added to</text><text x="689" y="189" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">farm soil</text><text x="500" y="334" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">Farm water and wastewater carry</text><text x="500" y="349" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">extra phosphate into lakes;</text><text x="500" y="364" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">algae then grow out of control.</text><rect x="300" y="400" width="430" height="50" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="515" y="421.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">No gas phase: phosphorus does not cycle through the air,</text><text x="515" y="436.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">so it moves slowly and is often a limiting nutrient.</text>
</svg>
