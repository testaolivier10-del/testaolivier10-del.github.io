<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="sustainable-forestry-practices-t sustainable-forestry-practices-d" font-family="Arial, Helvetica, sans-serif">
<title id="sustainable-forestry-practices-t">Three sustainable forestry practices</title>
<desc id="sustainable-forestry-practices-d">Three panels. Selective cutting: a few mature trees are cut and most of the forest stands. Reforestation: rows of seedlings are planted where trees were cut. Prescribed burn: a planned, low fire burns dead wood and brush on the forest floor while the large trees survive. Each keeps forest cover, soil and habitat while still producing wood or lowering the risk of a large wildfire.</desc>
