<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="energy-resources-distribution-landscape-t energy-resources-distribution-landscape-d"><title id="energy-resources-distribution-landscape-t">Where natural energy resources are found</title><desc id="energy-resources-distribution-landscape-d">A landscape cross-section. Oil, natural gas and coal lie in layers of sedimentary rock in basins that were once seas or swamps. Strong steady winds blow over coasts, open plains and mountain passes. Sunlight is strongest and most reliable in dry regions near 15 to 35 degrees latitude with few clouds. Rivers falling from mountains can turn turbines at dams. Earth's internal heat is close to the surface near plate boundaries and volcanoes. Each country has a different mix because each region has a different geologic history and climate.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="780" height="400" fill="#FFFFFF"/><text x="390" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Each region's geology and climate decide which resources it has</text><path d="M0 230 L120 230 L200 120 L260 170 L330 90 L410 230 L780 230" fill="none" stroke="#1F2A28" stroke-width="2" stroke-linejoin="round"/><path d="M0 230 L120 230 L200 120 L260 170 L330 90 L410 230 L780 230 L780 400 L0 400 Z" fill="#EDE6D6" stroke="none" stroke-width="2"/><path d="M430 260 Q600 300 770 260" fill="none" stroke="#0072B2" stroke-width="8"/><path d="M430 290 Q600 330 770 290" fill="none" stroke="#4A4038" stroke-width="12"/><path d="M440 320 Q600 360 770 320" fill="none" stroke="#8C6A43" stroke-width="10"/><text x="424" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="end">natural gas</text><text x="424" y="298" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="end">coal</text><text x="434" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="end">oil</text><text x="600" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" font-weight="700" text-anchor="middle">Sedimentary rock layers: coal, oil and natural gas</text><path d="M330 90 L330 230" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="6 4"/><ellipse cx="300" cy="330" rx="90" ry="40" fill="#D55E00" fill-opacity="0.35" stroke="#D55E00"/><text x="300" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">hot rock near a plate boundary</text><text x="300" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">(Earth's internal heat)</text><path d="M200 130 Q230 200 250 228" fill="none" stroke="#0072B2" stroke-width="4"/><rect x="240" y="200" width="12" height="30" rx="1" fill="#6B6F6E" stroke="#1F2A28" stroke-width="1.5"/><text x="150" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0072B2" text-anchor="middle"><tspan x="150" dy="0">river falling</tspan><tspan x="150" dy="14">from mountains</tspan><tspan x="150" dy="14">(dams)</tspan></text><circle cx="640" cy="80" r="26" fill="#F4D35E" stroke="#C79A00" stroke-width="1.5"/><text x="640" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle"><tspan x="640" dy="0">dry, sunny, few clouds,</tspan><tspan x="640" dy="14">lower latitudes: strong sunlight</tspan></text><line x1="30" y1="160" x2="100" y2="160" stroke="#009E73" stroke-width="2" marker-end="url(#ah-green)"/><line x1="30" y1="178" x2="100" y2="178" stroke="#009E73" stroke-width="2" marker-end="url(#ah-green)"/><line x1="30" y1="196" x2="100" y2="196" stroke="#009E73" stroke-width="2" marker-end="url(#ah-green)"/><text x="65" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#009E73" text-anchor="middle"><tspan x="65" dy="0">coasts, plains,</tspan><tspan x="65" dy="14">passes: wind</tspan></text><text x="10" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6F6E">coast</text><text x="480" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B6F6E">open plain</text></svg>
