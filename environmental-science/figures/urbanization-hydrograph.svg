<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="urbanization-hydrograph-t urbanization-hydrograph-d" font-family="Arial, Helvetica, sans-serif">
<title id="urbanization-hydrograph-t">Stream flow after the same storm, before and after a watershed is built up</title>
<desc id="urbanization-hydrograph-d">Line graph, invented data for practice. Stream flow in cubic meters per second after the same storm. Before development (fields and forest) the flow rises slowly to a peak of 14 at 10 hours and stays high for many hours. After the watershed is paved and built up, the flow rises fast to a peak of 34 at 3 hours, then drops quickly. Paved surfaces send rain to the stream at once instead of letting it soak in.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<line x1="100" y1="270" x2="600" y2="270" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="274" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="100" y1="212.5" x2="600" y2="212.5" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="216.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">10</text><line x1="100" y1="155" x2="600" y2="155" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="159" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">20</text><line x1="100" y1="97.5" x2="600" y2="97.5" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="101.5" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">30</text><line x1="100" y1="40" x2="600" y2="40" stroke="#E9ECEB" stroke-width="1"/><text x="92" y="44" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">40</text><line x1="100" y1="270" x2="100" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="100" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">0</text><line x1="183.33" y1="270" x2="183.33" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="183.33" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">4</text><line x1="266.67" y1="270" x2="266.67" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="266.67" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8</text><line x1="350" y1="270" x2="350" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="350" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">12</text><line x1="433.33" y1="270" x2="433.33" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="433.33" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">16</text><line x1="516.67" y1="270" x2="516.67" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="516.67" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">20</text><line x1="600" y1="270" x2="600" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="600" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">24</text><line x1="100" y1="270" x2="600" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="100" y1="40" x2="100" y2="270" stroke="#1F2A28" stroke-width="1.5"/><text x="350" y="312" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Hours after the storm began</text><text x="48" y="155" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 48 155)">Stream flow (m³ per second)</text><path d="M100,258.5 L141.67,252.75 L183.33,235.5 L225,212.5 L266.67,195.25 L308.33,189.5 L350,195.25 L391.67,206.75 L433.33,218.25 L475,229.75 L516.67,241.25 L600,252.75" fill="none" stroke="#009E73" stroke-width="3"/><path d="M100,258.5 L120.83,224 L141.67,143.5 L162.5,74.5 L183.33,97.5 L225,166.5 L266.67,212.5 L308.33,235.5 L350,247 L433.33,252.75 L516.67,258.5 L600,258.5" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5"/><line x1="470" y1="70" x2="496" y2="70" stroke="#009E73" stroke-width="3"/><text x="502" y="74" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Before: fields and forest</text><line x1="470" y1="90" x2="496" y2="90" stroke="#D55E00" stroke-width="3" stroke-dasharray="8 5"/><text x="502" y="94" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">After: paved and built</text><text x="187.5" y="63" font-size="12.5" font-weight="bold" fill="#A8470A" text-anchor="start">Higher, sooner peak</text><text x="708" y="330" font-size="11" font-weight="normal" fill="#5A6260" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
