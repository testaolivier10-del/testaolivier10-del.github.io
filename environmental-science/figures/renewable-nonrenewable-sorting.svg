<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="renewable-nonrenewable-sorting-t renewable-nonrenewable-sorting-d"><title id="renewable-nonrenewable-sorting-t">Renewable and nonrenewable energy sources</title><desc id="renewable-nonrenewable-sorting-d">Nonrenewable sources (coal, oil, natural gas, nuclear fuel) exist in a fixed amount and form over millions of years. Renewable sources are replenished at or near the rate we use them: sunlight, wind, moving water and Earth's internal heat are not used up, while wood and other biomass are depletable and stay renewable only if they regrow as fast as they are used.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/><text x="380" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A28" font-weight="700" text-anchor="middle">Where does the energy come from, and does it come back?</text><rect x="20" y="50" width="330" height="300" rx="8" fill="#FBE7DA" stroke="#D55E00" stroke-width="1.5"/><text x="185" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Nonrenewable</text><text x="185" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="185" dy="0">A fixed amount in Earth's crust.</tspan><tspan x="185" dy="16">Forms over millions of years,</tspan><tspan x="185" dy="16">far slower than we use it.</tspan></text><rect x="50" y="150" width="270" height="36" rx="8" fill="#fff" stroke="#D55E00" stroke-width="1.2"/><text x="185" y="173" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Coal</text><rect x="50" y="196" width="270" height="36" rx="8" fill="#fff" stroke="#D55E00" stroke-width="1.2"/><text x="185" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Oil</text><rect x="50" y="242" width="270" height="36" rx="8" fill="#fff" stroke="#D55E00" stroke-width="1.2"/><text x="185" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Natural gas</text><rect x="50" y="288" width="270" height="36" rx="8" fill="#fff" stroke="#D55E00" stroke-width="1.2"/><text x="185" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Nuclear fuel (mined ore)</text><rect x="410" y="50" width="330" height="300" rx="8" fill="#DFF3EC" stroke="#009E73" stroke-width="1.5"/><text x="575" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Renewable</text><text x="575" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="575" dy="0">Replenished naturally at or</tspan><tspan x="575" dy="16">near the rate we use it.</tspan></text><rect x="430" y="130" width="290" height="120" rx="8" fill="#fff" stroke="#009E73" stroke-width="1.2"/><text x="575" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Nondepletable: use does not</text><text x="575" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">reduce the supply</text><text x="575" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Sunlight, wind</text><text x="575" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Moving water</text><text x="575" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Earth's internal heat</text><rect x="430" y="262" width="290" height="76" rx="8" fill="#fff" stroke="#474A10" stroke-width="1.2" stroke-dasharray="5 4"/><text x="575" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Depletable: renewable only if</text><text x="575" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">it regrows as fast as it is used</text><text x="575" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" text-anchor="middle">Wood, crops and other biomass</text><line x1="60" y1="378" x2="700" y2="378" stroke="#6B6F6E" stroke-width="1.5" marker-end="url(#ah-gray)"/><text x="60" y="372" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E">Time to replenish:</text><text x="700" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="end">millions of years (nonrenewable)</text><text x="60" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E">continuous, days or a few decades (renewable)</text></svg>
