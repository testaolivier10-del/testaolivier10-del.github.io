<title id="t">Periodic, episodic and random disruptions</title>
<desc id="d">Timeline of 30 years with three rows of events. Periodic: a river floods every spring, a mark every year. Episodic: droughts in years 3, 4, 11, 17, 18 and 26, recurring at irregular intervals. Random: one volcanic eruption in year 21. Invented example.</desc>
