<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="nitrogen-cycle-steps-t nitrogen-cycle-steps-d" font-family="Arial, Helvetica, sans-serif">
<title id="nitrogen-cycle-steps-t">The nitrogen cycle in five steps</title>
<desc id="nitrogen-cycle-steps-d">The nitrogen cycle. Nitrogen gas, N2, makes up 78 percent of the atmosphere. Step 1, nitrogen fixation: bacteria in soil and in legume roots turn N2 into ammonium. Step 2, nitrification: bacteria turn ammonium into nitrite and then nitrate. Step 3, assimilation: plant roots take up nitrate and ammonium, and animals get nitrogen by eating plants. Wastes and remains go to decomposers. Step 4, ammonification: decomposers release ammonium. Step 5, denitrification: bacteria in soil with little oxygen turn nitrate back into N2 gas. Lightning also fixes a little nitrogen, and fertilizer adds ammonium and nitrate directly.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<rect x="270" y="20" width="220" height="54" rx="8" fill="#E6F1F8" stroke="#0072B2" stroke-width="1.5"/><text x="380" y="43.42" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Atmosphere</text><text x="380" y="59.67" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">N2 gas (78% of air)</text><rect x="60" y="250" width="190" height="54" rx="8" fill="#F3ECDD" stroke="#8C6D46" stroke-width="1.5"/><text x="155" y="273.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Ammonium (NH4+)</text><text x="155" y="289.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">in soil</text><rect x="500" y="250" width="190" height="54" rx="8" fill="#F3ECDD" stroke="#8C6D46" stroke-width="1.5"/><text x="595" y="273.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Nitrate (NO3−)</text><text x="595" y="289.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">in soil</text><rect x="500" y="380" width="190" height="54" rx="8" fill="#E4F2E9" stroke="#009E73" stroke-width="1.5"/><text x="595" y="403.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Plants, then the</text><text x="595" y="419.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">animals that eat them</text><rect x="60" y="380" width="190" height="54" rx="8" fill="#EDE7DC" stroke="#6B7370" stroke-width="1.5"/><text x="155" y="403.7" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">Wastes and dead matter,</text><text x="155" y="418.7" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">broken down by decomposers</text><line x1="300" y1="74" x2="160" y2="250" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><text x="164" y="136" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">1. Nitrogen fixation</text><text x="164" y="151" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">bacteria (in soil and</text><text x="164" y="166" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">legume roots) turn</text><text x="164" y="181" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">N2 into ammonium</text><line x1="250" y1="277" x2="500" y2="277" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><text x="375" y="237" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">2. Nitrification</text><text x="375" y="252" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">bacteria turn ammonium</text><text x="375" y="267" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">into nitrite, then nitrate</text><line x1="595" y1="304" x2="595" y2="380" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><text x="667" y="330" font-size="12" font-weight="bold" fill="#009E73" text-anchor="middle">3. Assimilation</text><text x="667" y="345" font-size="12" font-weight="bold" fill="#009E73" text-anchor="middle">roots take up nitrate</text><text x="667" y="360" font-size="12" font-weight="bold" fill="#009E73" text-anchor="middle">(and ammonium)</text><line x1="500" y1="407" x2="250" y2="407" stroke="#6B7370" stroke-width="2" marker-end="url(#ar-grey)"/><text x="375" y="399" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">Wastes and remains</text><line x1="155" y1="380" x2="155" y2="304" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><text x="71" y="334" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">4. Ammonification</text><text x="71" y="349" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">decomposers release</text><text x="71" y="364" font-size="12" font-weight="bold" fill="#474A10" text-anchor="middle">ammonium</text><line x1="630" y1="250" x2="470" y2="74" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="658" y="136" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">5. Denitrification</text><text x="658" y="151" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">bacteria in soil with little</text><text x="658" y="166" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">oxygen turn nitrate</text><text x="658" y="181" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">back into N2 gas</text><text x="24" y="460" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Lightning also fixes a little nitrogen. Fertilizer adds ammonium and nitrate directly.</text>
</svg>
