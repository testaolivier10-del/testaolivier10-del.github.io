<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The eutrophication chain</title>
<desc id="d">Six linked boxes in a loop. 1: nitrate and phosphate from fertilizer, manure and sewage enter the water. 2: algae multiply into a bloom and turn the water green. 3: the bloom blocks light and algae and plants die. 4: dead matter sinks and decomposers break it down. 5: decomposers use dissolved oxygen, so oxygen falls (hypoxia). 6: fish die or leave, making a dead zone.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<rect x="20" y="30" width="230" height="150" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2.5"/><text x="135" y="58" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="135" dy="0">1. Nutrients enter</tspan></text><text x="135" y="100.5" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="135" dy="0">nitrate and phosphate</tspan><tspan x="135" dy="19.5">from fertilizer, manure,</tspan><tspan x="135" dy="19.5">sewage</tspan></text><line x1="254" y1="105" x2="281" y2="105" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="285" y="30" width="230" height="150" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2.5"/><text x="400" y="58" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">2. Algal bloom</tspan></text><text x="400" y="110.3" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">algae multiply and</tspan><tspan x="400" dy="19.5">turn the water green</tspan></text><line x1="519" y1="105" x2="546" y2="105" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="550" y="30" width="230" height="150" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2.5"/><text x="665" y="58" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="665" dy="0">3. Die-off</tspan></text><text x="665" y="110.3" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="665" dy="0">bloom blocks light;</tspan><tspan x="665" dy="19.5">algae and plants die</tspan></text><line x1="665" y1="184" x2="665" y2="236" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="550" y="240" width="230" height="150" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2.5"/><text x="665" y="268" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="665" dy="0">4. Decomposition</tspan></text><text x="665" y="310.5" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="665" dy="0">dead matter sinks;</tspan><tspan x="665" dy="19.5">decomposers break</tspan><tspan x="665" dy="19.5">it down</tspan></text><line x1="546" y1="315" x2="519" y2="315" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="285" y="240" width="230" height="150" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2.5"/><text x="400" y="268" font-size="17" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">5. Oxygen falls</tspan></text><text x="400" y="310.5" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">decomposers use</tspan><tspan x="400" dy="19.5">dissolved oxygen</tspan><tspan x="400" dy="19.5">(hypoxia)</tspan></text><line x1="281" y1="315" x2="254" y2="315" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="240" width="230" height="150" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2.5"/><text x="135" y="268" font-size="17" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="135" dy="0">6. Fish kill</tspan></text><text x="135" y="320.3" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="135" dy="0">fish die or leave;</tspan><tspan x="135" dy="19.5">a dead zone</tspan></text><text x="400" y="428" font-size="14" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="400" dy="0">The step most often left out: decomposition of the dead algae uses up the oxygen.</tspan></text>
</svg>
