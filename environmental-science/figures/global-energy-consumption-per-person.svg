<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="global-energy-consumption-per-person-t global-energy-consumption-per-person-d"><title id="global-energy-consumption-per-person-t">Energy use per person in four invented countries</title><desc id="global-energy-consumption-per-person-d">Invented data for practice. Stacked bars of energy use per person in gigajoules for four invented countries from least to most developed: country A 15 (10 biomass, 5 fossil fuels), country B 40 (8 biomass, 30 fossil fuels, 2 other), country C 110 (4 biomass, 92 fossil fuels, 14 other), country D 230 (5 biomass, 185 fossil fuels, 40 other). Energy use per person rises with development, and fossil fuels supply most of it in the more developed countries.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/><text x="380" y="28" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A28" font-weight="700" text-anchor="middle">Energy use per person, four invented countries</text><text x="380" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="middle" font-style="italic">Invented data for practice</text><line x1="104" y1="350" x2="640" y2="350" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">0</text><line x1="104" y1="300" x2="640" y2="300" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">50</text><line x1="104" y1="250" x2="640" y2="250" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">100</text><line x1="104" y1="200" x2="640" y2="200" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">150</text><line x1="104" y1="150" x2="640" y2="150" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">200</text><line x1="104" y1="100" x2="640" y2="100" stroke="#D9DCDA" stroke-width="1"/><text x="100" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="end">250</text><line x1="110" y1="350" x2="640" y2="350" stroke="#1F2A28" stroke-width="1.5"/><line x1="110" y1="350" x2="110" y2="50" stroke="#1F2A28" stroke-width="1.5"/><text transform="translate(40 210) rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="middle">Energy per person (GJ per year)</text><rect x="140" y="340" width="90" height="10" fill="#009E73" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="140" y="335" width="90" height="5" fill="#474A10" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><text x="185" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">15</text><text x="185" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Country A</text><rect x="290" y="342" width="90" height="8" fill="#009E73" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="290" y="312" width="90" height="30" fill="#474A10" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="290" y="310" width="90" height="2" fill="#0072B2" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><text x="335" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">40</text><text x="335" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Country B</text><rect x="440" y="346" width="90" height="4" fill="#009E73" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="440" y="254" width="90" height="92" fill="#474A10" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="440" y="240" width="90" height="14" fill="#0072B2" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><text x="485" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">110</text><text x="485" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Country C</text><rect x="590" y="345" width="90" height="5" fill="#009E73" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="590" y="160" width="90" height="185" fill="#474A10" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><rect x="590" y="120" width="90" height="40" fill="#0072B2" fill-opacity="0.85" stroke="#fff" stroke-width="1"/><text x="635" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">230</text><text x="635" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Country D</text><text x="185" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="middle">less developed</text><text x="635" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B6F6E" text-anchor="middle">more developed</text><line x1="250" y1="386" x2="560" y2="386" stroke="#6B6F6E" stroke-width="1.3" marker-end="url(#ah-gray)"/><rect x="130" y="62" width="14" height="14" fill="#009E73" fill-opacity="0.85"/><text x="150" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28">Wood and other biomass</text><rect x="320" y="62" width="14" height="14" fill="#474A10" fill-opacity="0.85"/><text x="340" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28">Fossil fuels</text><rect x="510" y="62" width="14" height="14" fill="#0072B2" fill-opacity="0.85"/><text x="530" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28">Other sources</text></svg>
