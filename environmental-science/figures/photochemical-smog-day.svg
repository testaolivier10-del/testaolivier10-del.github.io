<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">NO, NO2 and ozone through a sunny day</title>
<desc id="d">Line graph, invented data. Nitric oxide rises with morning traffic to 95 ppb at 8 a.m.; nitrogen dioxide peaks at 85 ppb at 9 a.m.; ozone climbs through the morning to 120 ppb at 2 p.m., while NO2 falls, then drops after sunset to about 20 ppb at midnight.</desc>
