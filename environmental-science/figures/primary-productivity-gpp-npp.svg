<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="primary-productivity-gpp-npp-t primary-productivity-gpp-npp-d" font-family="Arial, Helvetica, sans-serif">
<title id="primary-productivity-gpp-npp-t">Gross primary productivity split into respiration and NPP</title>
<desc id="primary-productivity-gpp-npp-d">Invented data for a grassland in kilocalories per square meter per year. Gross primary productivity, GPP, is 12,000. Of that, 7,000 is used by the plants in respiration to stay alive. The rest, net primary productivity, NPP, is 12,000 minus 7,000 = 5,000, stored as new plant matter and available to the animals that eat plants.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Where the energy plants capture goes</text><text x="24" y="54" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">A grassland, in kcal per square meter per year. Invented data for practice.</text><rect x="40" y="80" width="640" height="44" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="50" y="108" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">Gross primary productivity (GPP): 12,000</text><rect x="40" y="150" width="373.33" height="44" rx="0" fill="#6B7370" stroke="none" stroke-width="1.5"/><text x="50" y="178" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">Respiration (R): 7,000</text><rect x="413.33" y="150" width="266.67" height="44" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="423.33" y="178" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">NPP: 5,000</text><text x="40" y="222" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">used by the plants themselves to stay alive</text><text x="40" y="237" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">(released as heat)</text><text x="417.33" y="222" font-size="12" font-weight="normal" fill="#009E73" text-anchor="start">stored as new plant matter, the energy</text><text x="417.33" y="237" font-size="12" font-weight="normal" fill="#009E73" text-anchor="start">available to the animals that eat plants</text><text x="40" y="282" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">NPP = GPP − R = 12,000 − 7,000 = 5,000 kcal/m²/yr</text>
</svg>
