<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="ocean-acidification-carbonate-t ocean-acidification-carbonate-d" font-family="Arial, Helvetica, sans-serif">
<title id="ocean-acidification-carbonate-t">How carbon dioxide lowers ocean pH</title>
<desc id="ocean-acidification-carbonate-d">Carbon dioxide from the air dissolves in the surface ocean. CO2 + H2O forms H2CO3, carbonic acid, which releases a hydrogen ion and a bicarbonate ion (H+ + HCO3-): more hydrogen ions, so pH falls. Hydrogen ions also combine with carbonate ions (H+ + CO3 2- gives HCO3-), so fewer carbonate ions are left for corals and shellfish to build calcium carbonate. A pH scale below shows average surface ocean pH of about 8.2 around 1750, about 8.1 today and about 7.8 by 2100 if emissions stay high.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<rect x="0" y="0" width="760" height="70" rx="0" fill="#F4F5F4" stroke="none" stroke-width="1.5"/><text x="20" y="26" font-size="13" font-weight="bold" fill="#8A9290" text-anchor="start">Air</text><rect x="0" y="70" width="760" height="250" rx="0" fill="#E3EEF6" stroke="none" stroke-width="1.5"/><text x="740" y="94" font-size="13" font-weight="bold" fill="#0072B2" text-anchor="end">Surface ocean</text><rect x="40" y="18" width="120" height="40" rx="10" fill="#FFFFFF" stroke="#8A9290" stroke-width="1.5"/><text x="100" y="43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">CO₂ in the air</text><line x1="100" y1="60" x2="100" y2="112" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="110" y="92" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">dissolves</text><rect x="30" y="116" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="105" y="147" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">CO₂ + H₂O</text><line x1="184" y1="142" x2="238" y2="142" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="242" y="116" width="170" height="52" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="327" y="147" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">H₂CO₃</text><text x="327" y="186" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">carbonic acid</text><line x1="416" y1="142" x2="470" y2="142" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="474" y="116" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="564" y="147" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">H⁺ + HCO₃⁻</text><text x="564" y="186" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">more hydrogen ions:</text><text x="564" y="201" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">pH falls</text><rect x="160" y="222" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="310" y="253" font-size="15" font-weight="bold" fill="#474A10" text-anchor="middle">H⁺ + CO₃²⁻ → HCO₃⁻</text><path d="M 560 220 Q 520 246 466 248" fill="none" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="310" y="292" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Hydrogen ions take up carbonate ions, so fewer are left</text><text x="310" y="308" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">for corals and shellfish to build calcium carbonate (CaCO₃).</text><text x="380" y="346" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Average surface ocean pH (lower is more acidic)</text><line x1="120" y1="370" x2="640" y2="370" stroke="#1F2A28" stroke-width="2"/><line x1="120" y1="365" x2="120" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="120" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8.3</text><line x1="194.29" y1="365" x2="194.29" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="194.29" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8.2</text><line x1="268.57" y1="365" x2="268.57" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="268.57" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8.1</text><line x1="342.86" y1="365" x2="342.86" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="342.86" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">8.0</text><line x1="417.14" y1="365" x2="417.14" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="417.14" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7.9</text><line x1="491.43" y1="365" x2="491.43" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="491.43" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7.8</text><line x1="565.71" y1="365" x2="565.71" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="565.71" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7.7</text><line x1="640" y1="365" x2="640" y2="375" stroke="#1F2A28" stroke-width="1.5"/><text x="640" y="392" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">7.6</text><circle cx="194.29" cy="370" r="6" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="194.29" y="412" font-size="11.5" font-weight="bold" fill="#009E73" text-anchor="middle">about 1750</text><circle cx="268.57" cy="370" r="6" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="268.57" y="412" font-size="11.5" font-weight="bold" fill="#474A10" text-anchor="middle">today</text><circle cx="491.43" cy="370" r="6" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="491.43" y="412" font-size="11.5" font-weight="bold" fill="#D55E00" text-anchor="middle">2100 if emissions stay high</text>
</svg>
