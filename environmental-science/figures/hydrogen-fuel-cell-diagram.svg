<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="hydrogen-fuel-cell-diagram-t hydrogen-fuel-cell-diagram-d"><title id="hydrogen-fuel-cell-diagram-t">How a hydrogen fuel cell works</title><desc id="hydrogen-fuel-cell-diagram-d">Hydrogen gas enters at the anode, where a catalyst splits each molecule into hydrogen ions and electrons. The ions pass through a membrane to the cathode; the electrons cannot, so they travel through an outside circuit, powering a motor. At the cathode, oxygen from the air combines with the ions and electrons to form water, the only exhaust. No combustion happens and no carbon dioxide leaves the cell, but making the hydrogen takes energy.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="780" height="400" fill="#FFFFFF"/><text x="390" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Hydrogen + oxygen  →  electricity + water (no burning)</text><rect x="170" y="120" width="120" height="200" rx="4" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="230" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Anode (−)</text><rect x="330" y="120" width="120" height="200" rx="4" fill="#F1F2F1" stroke="#6B6F6E" stroke-width="1.5"/><text x="390" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Membrane</text><rect x="490" y="120" width="120" height="200" rx="4" fill="#FBE7DA" stroke="#D55E00" stroke-width="1.5"/><text x="550" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Cathode (+)</text><line x1="40" y1="200" x2="165" y2="200" stroke="#0072B2" stroke-width="3" marker-end="url(#ah-blue)"/><text x="40" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" font-weight="700">hydrogen (H₂) in</text><line x1="740" y1="180" x2="615" y2="180" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="740" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D55E00" font-weight="700" text-anchor="end">oxygen (O₂) from air</text><line x1="615" y1="270" x2="740" y2="270" stroke="#0072B2" stroke-width="3" marker-end="url(#ah-blue)"/><text x="740" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0072B2" font-weight="700" text-anchor="end">water (H₂O) out</text><line x1="290" y1="230" x2="485" y2="230" stroke="#009E73" stroke-width="3" marker-end="url(#ah-green)"/><text x="390" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#009E73" font-weight="700" text-anchor="middle">H⁺ ions</text><path d="M230 120 L230 70 L550 70 L550 115" fill="none" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><circle cx="390" cy="70" r="22" fill="#fff" stroke="#474A10" stroke-width="2"/><text x="390" y="75" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28" text-anchor="middle">motor</text><text x="390" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#474A10" text-anchor="middle">electrons (e⁻) flow through the outside circuit</text><text x="230" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">H₂ → 2H⁺ + 2e⁻</text><text x="550" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">O₂ + 4H⁺ + 4e⁻</text><text x="550" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">→ 2H₂O</text><rect x="40" y="345" width="700" height="42" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="390" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A28" font-weight="700" text-anchor="middle">Hydrogen is an energy carrier: it must first be made, often from natural gas or by splitting water.</text></svg>
