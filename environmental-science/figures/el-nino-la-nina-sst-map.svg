<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="el-nino-la-nina-sst-map-t el-nino-la-nina-sst-map-d" font-family="Arial, Helvetica, sans-serif">
<title id="el-nino-la-nina-sst-map-t">Pacific sea surface temperatures in El Niño and La Niña</title>
<desc id="el-nino-la-nina-sst-map-d">Two schematic maps of the tropical Pacific Ocean from Indonesia and Australia in the west to Peru in the east, with the equator and the 180 degree line marked. Colors show sea surface temperature compared with the long-term average. Top, El Niño: a long band of warmer than average water lies along the equator from the central Pacific east to the coast of Peru, warmest near South America; the far western Pacific is slightly cooler than average. Bottom, La Niña: a tongue of cooler than average water stretches west along the equator from near South America into the central Pacific; the far western Pacific is slightly warmer than average. Invented pattern for practice, not a real year.</desc>
