<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="math-percents-change-t math-percents-change-d" font-family="Arial, Helvetica, sans-serif">
<title id="math-percents-change-t">Percent change from an old value to a new value</title>
<desc id="math-percents-change-d">Two bars from invented data: 120 frogs in 2020, the old value, and 150 frogs in 2024, the new value. The change is 30. Percent change is (150 minus 120) divided by 120, times 100, which is 25 percent: subtract in brackets first, divide by the old value, then multiply by 100.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Percent change: the change compared with where you started</text><rect x="60" y="70" width="420" height="40" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="68" y="96" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">2020: 120 frogs (old value)</text><rect x="60" y="124" width="525" height="40" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="68" y="150" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="start">2024: 150 frogs (new value)</text><line x1="480" y1="66" x2="480" y2="176" stroke="#6B7370" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M 480 178 v 8 h 105 v -8" fill="none" stroke="#D55E00" stroke-width="2"/><text x="532.5" y="204" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="middle">change = 30</text><text x="60" y="248" font-size="20" font-weight="bold" fill="#1F2A28" text-anchor="start">(150 − 120) / 120 × 100 = 25%</text><text x="60" y="278" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Brackets first, divide by the OLD value, then × 100. Invented data for practice.</text>
</svg>
