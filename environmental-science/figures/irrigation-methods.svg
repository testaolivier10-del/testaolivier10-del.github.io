<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="irrigation-methods-t irrigation-methods-d" font-family="Arial, Helvetica, sans-serif">
<title id="irrigation-methods-t">Water applied and water used by four irrigation methods</title>
<desc id="irrigation-methods-d">Paired bar chart, invented data for practice. For one season on one hectare of the same crop, water applied to the field and water taken up by the crop, in cubic meters per hectare: flood 10,000 applied and 4,800 used; furrow 7,500 and 4,800; spray 6,000 and 4,800; drip 5,000 and 4,600. The crop uses about the same water each time, but flood and furrow apply far more, so more is lost to evaporation, runoff and deep seepage.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="360" fill="#FFFFFF"/>
<line x1="110" y1="290" x2="560" y2="290" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="294" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="110" y1="242" x2="560" y2="242" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="246" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">2,000</text><line x1="110" y1="194" x2="560" y2="194" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="198" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">4,000</text><line x1="110" y1="146" x2="560" y2="146" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="150" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">6,000</text><line x1="110" y1="98" x2="560" y2="98" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="102" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">8,000</text><line x1="110" y1="50" x2="560" y2="50" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="54" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">10,000</text><line x1="110" y1="290" x2="560" y2="290" stroke="#1F2A28" stroke-width="1.5"/><line x1="110" y1="50" x2="110" y2="290" stroke="#1F2A28" stroke-width="1.5"/><text x="58" y="170" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 58 170)">Water (m³ per hectare per season)</text><rect x="129.25" y="50" width="34" height="240" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><rect x="169.25" y="174.8" width="34" height="115.2" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="146.25" y="44" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">10,000</text><text x="186.25" y="168.8" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">4,800</text><text x="166.25" y="310" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Flood</text><rect x="241.75" y="110" width="34" height="180" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><rect x="281.75" y="174.8" width="34" height="115.2" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="258.75" y="104" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">7,500</text><text x="298.75" y="168.8" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">4,800</text><text x="278.75" y="310" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Furrow</text><rect x="354.25" y="146" width="34" height="144" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><rect x="394.25" y="174.8" width="34" height="115.2" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="371.25" y="140" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">6,000</text><text x="411.25" y="168.8" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">4,800</text><text x="391.25" y="310" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Spray</text><rect x="466.75" y="170" width="34" height="120" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><rect x="506.75" y="179.6" width="34" height="110.4" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="483.75" y="164" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">5,000</text><text x="523.75" y="173.6" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">4,600</text><text x="503.75" y="310" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Drip</text><rect x="585" y="90" width="14" height="14" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="605" y="101" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Water applied</text><text x="605" y="117.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">to the field</text><rect x="585" y="140" width="14" height="14" rx="0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="605" y="151" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Water taken up</text><text x="605" y="167.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">by the crop</text><text x="335" y="30" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">Same crop, same field size, one season</text><text x="708" y="350" font-size="11" font-weight="normal" fill="#5A6260" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
