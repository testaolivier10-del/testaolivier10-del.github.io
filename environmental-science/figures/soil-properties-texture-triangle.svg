<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 530" width="620" height="530" role="img" aria-labelledby="soil-properties-texture-triangle-t soil-properties-texture-triangle-d" font-family="Arial, Helvetica, sans-serif">
<title id="soil-properties-texture-triangle-t">The soil texture triangle</title>
<desc id="soil-properties-texture-triangle-d">The USDA soil texture triangle. Each side is a percent scale from 0 to 100: clay on the left side, silt on the right side, sand along the bottom. Lines of equal clay run across the triangle; lines of equal silt slope down to the left; lines of equal sand slope down to the right. The triangle is divided into twelve texture classes: clay at the top; silty clay, sandy clay, silty clay loam, clay loam and sandy clay loam below it; loam in the middle, shaded; silt loam and silt toward the bottom right; sandy loam, loamy sand and sand toward the bottom left. Loam is a balanced mix of sand, silt and clay, roughly 40% sand, 40% silt and 20% clay.</desc>
