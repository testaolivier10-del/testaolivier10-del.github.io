<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="fossil-fuels-power-plant-t fossil-fuels-power-plant-d"><title id="fossil-fuels-power-plant-t">How a coal-fired power plant makes electricity</title><desc id="fossil-fuels-power-plant-d">Coal burns in a boiler and heats water into high-pressure steam. The steam spins a turbine, which turns a generator that makes electricity for the transmission lines. Used steam is cooled back to water in a condenser by cooling water from a river or cooling tower and returns to the boiler. Smoke and carbon dioxide leave through the stack. Only about one third of the fuel's chemical energy leaves as electricity; most is lost as waste heat.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/><text x="400" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Fuel to outlet: chemical energy, heat, motion, electricity</text><rect x="40" y="120" width="120" height="70" rx="8" fill="#4A4038" stroke="#1F2A28" stroke-width="1.5"/><text x="100" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Coal</text><line x1="160" y1="155" x2="205" y2="155" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><rect x="210" y="90" width="140" height="130" rx="8" fill="#FBE7DA" stroke="#D55E00" stroke-width="1.5"/><text x="280" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Boiler</text><text x="280" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="280" dy="0">burning fuel</tspan><tspan x="280" dy="16">heats water</tspan><tspan x="280" dy="16">into steam</tspan></text><rect x="240" y="40" width="30" height="50" rx="2" fill="#F1F2F1" stroke="#1F2A28" stroke-width="1.5"/><text x="285" y="58" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28"><tspan x="285" dy="0">stack: smoke,</tspan><tspan x="285" dy="13">carbon dioxide</tspan></text><line x1="350" y1="120" x2="405" y2="120" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="378" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D55E00" text-anchor="middle">steam</text><rect x="410" y="90" width="120" height="80" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="470" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Turbine</text><text x="470" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="470" dy="0">steam spins</tspan><tspan x="470" dy="16">the blades</tspan></text><line x1="530" y1="130" x2="570" y2="130" stroke="#1F2A28" stroke-width="4"/><text x="550" y="120" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F2A28" text-anchor="middle">shaft</text><rect x="575" y="90" width="120" height="80" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="635" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Generator</text><text x="635" y="132" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="635" dy="0">magnets and</tspan><tspan x="635" dy="16">coils</tspan></text><line x1="695" y1="130" x2="760" y2="130" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><text x="728" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#474A10" font-weight="700" text-anchor="middle">electricity</text><path d="M470 170 L470 250" fill="none" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ah-verm)"/><text x="478" y="214" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#D55E00">used steam</text><rect x="400" y="255" width="140" height="70" rx="8" fill="#E3F1FA" stroke="#0072B2" stroke-width="1.5"/><text x="470" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Condenser</text><text x="470" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="470" dy="0">steam cools</tspan><tspan x="470" dy="16">back to water</tspan></text><path d="M400 290 L280 290 L280 222" fill="none" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="395" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#0072B2" text-anchor="end">water returns to boiler</text><line x1="660" y1="290" x2="545" y2="290" stroke="#0072B2" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="665" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A28"><tspan x="665" dy="0">cooling water from a</tspan><tspan x="665" dy="13">river or cooling tower</tspan></text><line x1="545" y1="312" x2="660" y2="312" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ah-verm)"/><text x="665" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#D55E00"><tspan x="665" dy="0">returns warmer:</tspan><tspan x="665" dy="13">waste heat</tspan></text><rect x="40" y="345" width="720" height="42" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="400" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" font-weight="700" text-anchor="middle">About one third of the fuel's energy leaves as electricity; about two thirds is lost as heat.</text></svg>
