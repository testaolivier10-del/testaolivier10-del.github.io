<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="endangered-species-categories-t endangered-species-categories-d" font-family="Arial, Helvetica, sans-serif">
<title id="endangered-species-categories-t">Traits that raise extinction risk, and the protections for endangered species</title>
<desc id="endangered-species-categories-d">Left, traits that raise extinction risk: specialist with a narrow diet or habitat; slow reproduction (K-selected); small or isolated population; needs a large territory; low genetic diversity; hunted or traded for parts. An arrow points right to what protects species: the Endangered Species Act, a US law that lists species, bans harming them and protects habitat they need; CITES, an international treaty that controls trade in protected species and their parts; protected areas and captive breeding. Footer: threatened means likely to become endangered soon; endangered means in danger of extinction in all or much of its range.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="190" y="30" font-size="15" font-weight="bold" fill="#D55E00" text-anchor="middle">Traits that raise extinction risk</text><rect x="30" y="48" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="73" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Specialist: narrow diet or habitat</text><rect x="30" y="98" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="123" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Slow reproduction (K-selected)</text><rect x="30" y="148" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="173" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Small or isolated population</text><rect x="30" y="198" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="223" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Needs a large territory</text><rect x="30" y="248" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="273" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Low genetic diversity</text><rect x="30" y="298" width="320" height="40" rx="8" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.2"/><text x="46" y="323" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="start">Hunted or traded for parts</text><line x1="360" y1="190" x2="400" y2="190" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar-ink)"/><text x="570" y="30" font-size="15" font-weight="bold" fill="#009E73" text-anchor="middle">What protects species</text><rect x="410" y="48" width="320" height="86" rx="10" fill="#E8F5F0" stroke="#009E73" stroke-width="1.5"/><text x="570" y="70" font-size="13.5" font-weight="bold" fill="#009E73" text-anchor="middle">Endangered Species Act (US law)</text><text x="570" y="89" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">lists species, bans harming them,</text><text x="570" y="105" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">protects habitat they need</text><rect x="410" y="148" width="320" height="86" rx="10" fill="#E8F5F0" stroke="#009E73" stroke-width="1.5"/><text x="570" y="170" font-size="13.5" font-weight="bold" fill="#009E73" text-anchor="middle">CITES (international treaty)</text><text x="570" y="189" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">controls trade in protected</text><text x="570" y="205" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">species and their parts</text><rect x="410" y="248" width="320" height="86" rx="10" fill="#E8F5F0" stroke="#009E73" stroke-width="1.5"/><text x="570" y="270" font-size="13.5" font-weight="bold" fill="#009E73" text-anchor="middle">Protected areas and captive breeding</text><text x="570" y="289" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">refuges, parks, breeding and</text><text x="570" y="305" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">release programs</text><text x="380" y="362" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Threatened: likely to become endangered soon.  Endangered: in danger of</text><text x="380" y="378" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">extinction in all or much of its range (definitions from the Endangered Species Act).</text>
</svg>
