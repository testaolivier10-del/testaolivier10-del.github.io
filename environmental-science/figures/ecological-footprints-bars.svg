 font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 58 155)">Footprint (gha per person)</text><rect x="136.25" y="65.56" width="60" height="204.44" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="166.25" y="59.56" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">8.0</text><text x="166.25" y="290" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Country A</text><rect x="248.75" y="147.33" width="60" height="122.67" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="278.75" y="141.33" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">4.8</text><text x="278.75" y="290" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Country B</text><rect x="361.25" y="208.67" width="60" height="61.33" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="391.25" y="202.67" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">2.4</text><text x="391.25" y="290" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Country C</text><rect x="473.75" y="244.44" width="60" height="25.56" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="503.75" y="219.11" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle">1.0</text><text x="503.75" y="290" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Country D</text><line x1="110" y1="229.11" x2="560" y2="229.11" stroke="#009E73" stroke-width="2.5" stroke-dasharray="8 5"/><text x="575" y="221.11" font-size="12.5" font-weight="bold" fill="#00704F" text-anchor="start">Earth's biocapacity:</text><text x="575" y="237.36" font-size="12.5" font-weight="bold" fill="#00704F" text-anchor="start">about 1.6 gha</text><text x="575" y="253.61" font-size="12.5" font-weight="bold" fill="#00704F" text-anchor="start">per person</text><text x="708" y="330" font-size="11" font-weight="normal" fill="#5A6260" text-anchor="end" font-style="italic">Invented data for practice; gha = global hectares</text>
</svg>
