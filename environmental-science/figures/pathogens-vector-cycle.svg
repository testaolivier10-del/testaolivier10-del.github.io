<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="pathogens-vector-cycle-t pathogens-vector-cycle-d" font-family="Arial, Helvetica, sans-serif">
<title id="pathogens-vector-cycle-t">How a mosquito spreads a pathogen, and how a warmer climate widens its range</title>
<desc id="pathogens-vector-cycle-d">Left: a cycle of three boxes. 1: a mosquito bites an infected person and picks up the pathogen. 2: the mosquito carries it. 3: it bites a healthy person, who gets sick and can infect the next mosquito. Malaria, West Nile virus and Zika virus spread this way. Right: climate bands from the equator outward. The mosquito range today covers the tropics; a dashed outline shows it stretching into subtropical and temperate bands as winters get milder.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="400" fill="#FFFFFF"/>
<text x="220" y="30" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">How a vector spreads a pathogen</text><rect x="140" y="50" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="1.5"/><text x="220" y="72" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">Infected person</text><text x="220" y="91" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">pathogen in the blood</text><rect x="20" y="250" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#474A10" stroke-width="1.5"/><text x="105" y="272" font-size="14" font-weight="bold" fill="#474A10" text-anchor="middle">Mosquito (vector)</text><text x="105" y="291" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">picks up the pathogen</text><text x="105" y="306" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">when it bites</text><rect x="250" y="250" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="1.5"/><text x="335" y="272" font-size="14" font-weight="bold" fill="#0072B2" text-anchor="middle">Healthy person</text><text x="335" y="291" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">pathogen enters</text><text x="335" y="306" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">with the next bite</text><path d="M 160 116 Q 90 170 100 246" fill="none" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="70" y="180" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">1 bite</text><path d="M 192 290 L 246 290" fill="none" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="219" y="280" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">2</text><path d="M 340 246 Q 360 170 285 118" fill="none" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="372" y="180" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">3 sick</text><text x="220" y="346" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Malaria, West Nile virus and Zika virus</text><text x="220" y="362" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">all spread this way, through mosquito bites.</text><text x="585" y="30" font-size="15" font-weight="bold" fill="#1F2A28" text-anchor="middle">Warmer climate, wider range</text><rect x="470" y="50" width="230" height="60" rx="0" fill="#F4F5F4" stroke="#E9ECEB" stroke-width="1"/><text x="478" y="68" font-size="12" font-weight="normal" fill="#8A9290" text-anchor="start">Temperate</text><rect x="470" y="110" width="230" height="60" rx="0" fill="#FBF4E6" stroke="#E9ECEB" stroke-width="1"/><text x="478" y="128" font-size="12" font-weight="normal" fill="#8A9290" text-anchor="start">Subtropical</text><rect x="470" y="170" width="230" height="60" rx="0" fill="#FBE9DE" stroke="#E9ECEB" stroke-width="1"/><text x="478" y="188" font-size="12" font-weight="normal" fill="#8A9290" text-anchor="start">Tropical</text><rect x="470" y="230" width="230" height="60" rx="0" fill="#FBF4E6" stroke="#E9ECEB" stroke-width="1"/><text x="478" y="248" font-size="12" font-weight="normal" fill="#8A9290" text-anchor="start">Subtropical</text><rect x="470" y="290" width="230" height="60" rx="0" fill="#F4F5F4" stroke="#E9ECEB" stroke-width="1"/><text x="478" y="308" font-size="12" font-weight="normal" fill="#8A9290" text-anchor="start">Temperate</text><line x1="470" y1="230" x2="700" y2="230" stroke="#8A9290" stroke-width="1" stroke-dasharray="3 4"/><text x="478" y="226" font-size="11.5" font-weight="normal" fill="#8A9290" text-anchor="start">Equator</text><rect x="590" y="170" width="100" height="120" rx="8" fill="none" stroke="#D55E00" stroke-width="2.5"/><text x="640" y="252" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">range today</text><rect x="590" y="110" width="100" height="240" rx="8" fill="none" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 4"/><line x1="640" y1="168" x2="640" y2="116" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><line x1="640" y1="292" x2="640" y2="344" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="585" y="376" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Milder winters let the vector</text><text x="585" y="392" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">survive farther from the equator.</text>
</svg>
