<text x="632" y="457" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="end">weather; cools with height</text>
<text x="632" y="292.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Stratosphere</text>
<text x="632" y="306.55" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="end">holds the ozone layer;</text><text x="632" y="319.55" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="end">temperature rises with height</text>
<text x="632" y="155.73" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Mesosphere</text>
<text x="632" y="169.73" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="end">temperature falls</text><text x="632" y="182.73" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="end">with height again</text>
<text x="632" y="58" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="end">Thermosphere</text>
