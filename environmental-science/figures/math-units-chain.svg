<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="math-units-chain-t math-units-chain-d" font-family="Arial, Helvetica, sans-serif">
<title id="math-units-chain-t">A dimensional analysis chain with units that cancel</title>
<desc id="math-units-chain-d">A pump runs 6 hours a day for 30 days and draws 2 kilowatts. The chain is 30 days over 1, times 6 hours over 1 day, times 2 kilowatts. Days cancel, and hours times kilowatts gives kilowatt-hours: 360 kWh. Then 360 kWh times $0.15 per kWh, with kWh cancelling, is $54.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Dimensional analysis: units cancel like numbers</text><text x="24" y="56" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">A water pump runs 6 hours a day for 30 days and draws 2 kW. Electricity costs $0.15 per kWh.</text><text x="80" y="120" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">30 <tspan fill="#D55E00" text-decoration="line-through">days</tspan></text><line x1="34" y1="132" x2="126" y2="132" stroke="#1F2A28" stroke-width="1.8"/><text x="80" y="158" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text><text x="140" y="140" font-size="20" font-weight="normal" fill="#1F2A28" text-anchor="middle">×</text><text x="200" y="120" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">6 h</text><line x1="154" y1="132" x2="246" y2="132" stroke="#1F2A28" stroke-width="1.8"/><text x="200" y="158" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">1 <tspan fill="#D55E00" text-decoration="line-through">day</tspan></text><text x="260" y="140" font-size="20" font-weight="normal" fill="#1F2A28" text-anchor="middle">×</text><text x="320" y="120" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">2 kW</text><line x1="274" y1="132" x2="366" y2="132" stroke="#1F2A28" stroke-width="1.8"/><text x="320" y="158" font-size="18" font-weight="normal" fill="#1F2A28" text-anchor="middle">1</text><text x="385" y="140" font-size="20" font-weight="normal" fill="#1F2A28" text-anchor="middle">=</text><text x="400" y="145" font-size="20" font-weight="bold" fill="#474A10" text-anchor="start">360 kWh</text><text x="80" y="208" font-size="14" font-weight="bold" fill="#1F2A28" text-anchor="start">Then the cost:</text><text x="200" y="208" font-size="16" font-weight="normal" fill="#1F2A28" text-anchor="start">360 <tspan fill="#D55E00" text-decoration="line-through">kWh</tspan> × $0.15 / 1 <tspan fill="#D55E00" text-decoration="line-through">kWh</tspan> = $54</text><text x="24" y="262" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">Write each factor as a fraction, with the unit you want to remove on the opposite side.</text><text x="24" y="284" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">Units with a line through them cancel; h × kW is left, which is kWh.</text>
</svg>
