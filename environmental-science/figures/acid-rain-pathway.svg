l="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="730" dy="0">limestone</tspan></text><text x="590" y="386.9" font-size="13" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="590" dy="0">pH about 4.8:</tspan><tspan x="590" dy="16.3">few fish</tspan></text><text x="730" y="386.9" font-size="13" font-weight="700" fill="#009E73" text-anchor="middle" dominant-baseline="middle"><tspan x="730" dy="0">buffered, pH about 7:</tspan><tspan x="730" dy="16.3">many fish</tspan></text>
</svg>
