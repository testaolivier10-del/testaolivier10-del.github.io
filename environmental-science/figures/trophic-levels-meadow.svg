<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="trophic-levels-meadow-t trophic-levels-meadow-d" font-family="Arial, Helvetica, sans-serif">
<title id="trophic-levels-meadow-t">Trophic levels in a meadow</title>
<desc id="trophic-levels-meadow-d">Five feeding levels in a meadow, bottom to top, with arrows pointing from food to eater. Trophic level 1, producers: grass, which makes its own food by photosynthesis. Level 2, primary consumers: a grasshopper, a herbivore that eats producers. Level 3, secondary consumers: a frog that eats primary consumers. Level 4, tertiary consumers: a snake. At the top, an apex predator: a hawk that eats snakes and that nothing hunts.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="400" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Trophic levels in a meadow</text><rect x="24" y="56" width="300" height="46" rx="8" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="36" y="84" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Hawk</text><text x="340" y="76" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Top: apex predator</text><text x="340" y="94" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">eats snakes; nothing hunts it</text><line x1="260" y1="158" x2="260" y2="106" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="24" y="118" width="300" height="46" rx="8" fill="#5A4A8A" stroke="none" stroke-width="1.5"/><text x="36" y="146" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Snake</text><text x="340" y="138" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Trophic level 4: tertiary consumers</text><text x="340" y="156" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">eat secondary consumers</text><line x1="260" y1="220" x2="260" y2="168" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="24" y="180" width="300" height="46" rx="8" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="36" y="208" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Frog</text><text x="340" y="200" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Trophic level 3: secondary consumers</text><text x="340" y="218" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">eat primary consumers</text><line x1="260" y1="282" x2="260" y2="230" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="24" y="242" width="300" height="46" rx="8" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="36" y="270" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Grasshopper</text><text x="340" y="262" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Trophic level 2: primary consumers</text><text x="340" y="280" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">herbivores: eat producers</text><line x1="260" y1="344" x2="260" y2="292" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><rect x="24" y="304" width="300" height="46" rx="8" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="36" y="332" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Grass</text><text x="340" y="324" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="start">Trophic level 1: producers</text><text x="340" y="342" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">make their own food by photosynthesis</text><text x="270" y="390" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">Arrows point from the food to the eater: the way energy moves.</text>
</svg>
