<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Primary and secondary air pollutants</title>
<desc id="d">A car and a coal power plant release primary pollutants directly: carbon monoxide, nitrogen oxides, sulfur dioxide, particulates, VOCs, lead and mercury. In the air, with sunlight, water vapor and oxygen, some react to form secondary pollutants: ozone near the ground, sulfuric acid from SO2 and nitric acid from NO2.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="420" fill="#FFFFFF"/>
<rect x="40" y="300" width="150" height="48" rx="10" fill="#0072B2"/><rect x="70" y="270" width="86" height="36" rx="10" fill="#0072B2"/><circle cx="75" cy="350" r="15" fill="#1F2A28"/><circle cx="158" cy="350" r="15" fill="#1F2A28"/><rect x="26" y="330" width="18" height="8" rx="0" fill="#6B7370"/><text x="115" y="392" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="115" dy="0">Cars and trucks</tspan></text><rect x="230" y="250" width="130" height="100" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><rect x="330" y="205" width="26" height="45" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><rect x="250" y="280" width="26" height="26" rx="0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1"/><rect x="292" y="280" width="26" height="26" rx="0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1"/><text x="295" y="392" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="295" dy="0">Coal power plant</tspan></text><rect x="30" y="30" width="330" height="155" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="195" y="56" font-size="18" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="195" dy="0">Primary pollutants</tspan></text><text x="195" y="82" font-size="14" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="195" dy="0">released directly by a source</tspan></text><text x="195" y="111.8" font-size="16" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="195" dy="0">CO, NO, NO2, SO2</tspan><tspan x="195" dy="23.2">particulates (PM10, PM2.5)</tspan><tspan x="195" dy="23.2">VOCs, lead, mercury</tspan></text><line x1="115" y1="262" x2="140" y2="192" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><line x1="343" y1="202" x2="343" y2="192" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><circle cx="470" cy="70" r="26" fill="#F2C14E"/><line x1="502" y1="70" x2="514" y2="70" stroke="#C99A1E" stroke-width="3"/><line x1="492.6" y1="92.6" x2="501.1" y2="101.1" stroke="#C99A1E" stroke-width="3"/><line x1="470" y1="102" x2="470" y2="114" stroke="#C99A1E" stroke-width="3"/><line x1="447.4" y1="92.6" x2="438.9" y2="101.1" stroke="#C99A1E" stroke-width="3"/><line x1="438" y1="70" x2="426" y2="70" stroke="#C99A1E" stroke-width="3"/><line x1="447.4" y1="47.4" x2="438.9" y2="38.9" stroke="#C99A1E" stroke-width="3"/><line x1="470" y1="38" x2="470" y2="26" stroke="#C99A1E" stroke-width="3"/><line x1="492.6" y1="47.4" x2="501.1" y2="38.9" stroke="#C99A1E" stroke-width="3"/><text x="470" y="121.1" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="470" dy="0">sunlight</tspan><tspan x="470" dy="18.9">water vapor</tspan><tspan x="470" dy="18.9">oxygen</tspan></text><line x1="368" y1="228" x2="560" y2="228" stroke="#474A10" stroke-width="3.5" marker-end="url(#arO)"/><text x="464" y="254" font-size="15" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="464" dy="0">react in the air</tspan></text><rect x="570" y="40" width="210" height="340" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2"/><text x="675" y="66" font-size="18" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="675" dy="0">Secondary</tspan></text><text x="675" y="90" font-size="18" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="675" dy="0">pollutants</tspan></text><text x="675" y="116" font-size="14" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="675" dy="0">formed in the air</tspan></text><text x="675" y="161.8" font-size="15" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="675" dy="0">ozone (O3)</tspan><tspan x="675" dy="19.5">near the ground</tspan><tspan x="675" dy="19.5"> </tspan><tspan x="675" dy="19.5">sulfuric acid</tspan><tspan x="675" dy="19.5">(from SO2)</tspan><tspan x="675" dy="19.5"> </tspan><tspan x="675" dy="19.5">nitric acid</tspan><tspan x="675" dy="19.5">(from NO2)</tspan></text>
</svg>
