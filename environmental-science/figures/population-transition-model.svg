<line x1="95" y1="330" x2="100" y2="330" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="334.5" font-size="13" fill="#1F2A28" text-anchor="end">0</text>
<line x1="95" y1="276" x2="100" y2="276" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="280.5" font-size="13" fill="#1F2A28" text-anchor="end">10</text>
<line x1="95" y1="222" x2="100" y2="222" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="226.5" font-size="13" fill="#1F2A28" text-anchor="end">20</text>
<line x1="95" y1="168" x2="100" y2="168" stroke="#1F2A28" stroke-width="1.5"/>
