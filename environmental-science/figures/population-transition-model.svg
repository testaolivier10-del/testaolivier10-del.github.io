<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The demographic transition model</title>
<desc id="d">Demographic transition model in four stages. Stage 1 preindustrial: crude birth and death rates both near 40 per 1,000, little growth. Stage 2 transitional: the death rate falls to about 12 while the birth rate stays near 40, so the gap (natural increase, shaded) is widest. Stage 3 industrial: the birth rate falls from about 32 to 12 and the gap narrows. Stage 4 postindustrial: both rates low, about 11 and 10, little growth.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs><rect width="760" height="440" fill="#FFFFFF"/>
<rect x="100" y="60" width="120" height="270" fill="#F5F6F0"/>
<rect x="220" y="60" width="180" height="270" fill="#FFFFFF"/>
