<line x1="95" y1="114" x2="100" y2="114" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="118.5" font-size="13" fill="#1F2A28" text-anchor="end">40</text>
<line x1="95" y1="60" x2="100" y2="60" stroke="#1F2A28" stroke-width="1.5"/>
<text x="91" y="64.5" font-size="13" fill="#1F2A28" text-anchor="end">50</text>
