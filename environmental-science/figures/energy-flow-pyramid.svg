<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="energy-flow-pyramid-t energy-flow-pyramid-d" font-family="Arial, Helvetica, sans-serif">
<title id="energy-flow-pyramid-t">An energy pyramid with the 10% rule</title>
<desc id="energy-flow-pyramid-d">An energy pyramid from invented data in kilocalories per square meter per year. Producers 10,000; primary consumers 1,000; secondary consumers 100; tertiary consumers 10. Each level holds about 10 percent of the level below; about 90 percent is used for life processes and lost as heat, as the second law of thermodynamics predicts. Widths are not to scale.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="380" fill="#FFFFFF"/>
<text x="24" y="30" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">An energy pyramid: about 10% passes up each level</text><rect x="30" y="296" width="520" height="52" rx="4" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="290" y="318" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Producers</text><text x="290" y="337" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">10,000 kcal/m²/yr</text><rect x="100" y="234" width="380" height="52" rx="4" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="290" y="256" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Primary consumers</text><text x="290" y="275" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">1,000 kcal/m²/yr</text><text x="564" y="286" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">× 0.10</text><rect x="170" y="172" width="240" height="52" rx="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="290" y="194" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Secondary consumers</text><text x="290" y="213" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">100 kcal/m²/yr</text><text x="494" y="224" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">× 0.10</text><rect x="230" y="110" width="120" height="52" rx="4" fill="#D55E00" stroke="none" stroke-width="1.5"/><text x="290" y="132" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Tertiary consumers</text><text x="290" y="151" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">10 kcal/m²/yr</text><text x="424" y="162" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">× 0.10</text><text x="560" y="120" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">At each step about</text><text x="560" y="135" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">90% is used for life</text><text x="560" y="150" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">processes and lost</text><text x="560" y="165" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">as heat (second law</text><text x="560" y="180" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="start">of thermodynamics).</text><text x="24" y="368" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Widths not to scale. Invented data for practice.</text>
</svg>
