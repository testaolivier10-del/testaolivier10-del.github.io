<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Persistent organic pollutants travel toward the poles</title>
<desc id="d">From warm regions on the left, where POPs are used on fields and released by industry, the chemicals evaporate, travel on the wind, condense where it is cooler and evaporate again, hopping toward the cold Arctic on the right. There they settle and are stored in the fat of seals and polar bears.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<defs><linearGradient id="popsky" x1="0" x2="1"><stop offset="0" stop-color="#FBE3D2"/><stop offset="1" stop-color="#DCEBF6"/></linearGradient></defs><rect x="0" y="0" width="800" height="300" rx="0" fill="url(#popsky)"/><rect x="0" y="300" width="560" height="100" rx="0" fill="#D7CFA8"/><rect x="560" y="300" width="240" height="100" rx="0" fill="#E9F1F7"/><text x="110" y="30" font-size="16" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="110" dy="0">Warm regions</tspan></text><text x="700" y="30" font-size="16" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="700" dy="0">Cold Arctic</tspan></text><rect x="30" y="278" width="30" height="22" rx="0" fill="#B9C27A"/><rect x="64" y="278" width="30" height="22" rx="0" fill="#B9C27A"/><rect x="98" y="278" width="30" height="22" rx="0" fill="#B9C27A"/><rect x="132" y="278" width="30" height="22" rx="0" fill="#B9C27A"/><rect x="170" y="250" width="60" height="50" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><rect x="210" y="220" width="12" height="30" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1"/><text x="130" y="325" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="130" dy="0">used on fields, released by industry</tspan></text><line x1="120" y1="270" x2="250" y2="140" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arR)"/><line x1="250" y1="140" x2="330" y2="270" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arB)"/><line x1="330" y1="270" x2="430" y2="140" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arR)"/><line x1="430" y1="140" x2="500" y2="270" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arB)"/><line x1="500" y1="270" x2="600" y2="150" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arR)"/><line x1="600" y1="150" x2="660" y2="290" stroke="#0072B2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arB)"/><text x="250" y="122" font-size="13" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="250" dy="0">evaporates where warm</tspan></text><text x="430" y="122" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="430" dy="0">travels on the wind</tspan></text><text x="520" y="292" font-size="13" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="520" dy="0">condenses where cool</tspan></text><rect x="600" y="300" width="200" height="18" rx="0" fill="#FFFFFF" stroke="#B9C0C6" stroke-width="1"/><ellipse cx="660" cy="292" rx="26" ry="10" fill="#7E807A"/><circle cx="686" cy="286" r="7" fill="#7E807A"/><ellipse cx="745" cy="280" rx="34" ry="18" fill="#F2F2EC" stroke="#B9C0C6"/><circle cx="778" cy="268" r="11" fill="#F2F2EC" stroke="#B9C0C6" stroke-width="1"/><text x="700" y="336.9" font-size="13" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="700" dy="0">stored in the fat of</tspan><tspan x="700" dy="16.3">seals and polar bears</tspan></text><text x="400" y="385" font-size="14" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="400" dy="0">POPs collect in cold regions far from where they were used.</tspan></text>
</svg>
