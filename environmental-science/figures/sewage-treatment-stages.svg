<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Stages of sewage treatment</title>
<desc id="d">Flow diagram from left to right: raw sewage enters screens and a grit chamber that remove debris and sand; a primary settling tank where solids sink as sludge; a secondary aeration tank where microbes eat organic matter; tertiary filters that remove nitrogen and phosphorus; and disinfection with chlorine or UV that kills germs, after which clean water goes to the river. Sludge from the primary and secondary tanks goes to a digester that makes methane for energy; the solids are landfilled, burned or used as fertilizer.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<text x="30" y="52.2" font-size="13" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="30" dy="0">raw</tspan><tspan x="30" dy="15.6">sewage</tspan></text><line x1="10" y1="150" x2="22" y2="150" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="24" y="90" width="130" height="120" rx="8" fill="#E2E0D8" stroke="#1F2A28" stroke-width="2.5"/><text x="89" y="116" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="89" dy="0">Screens and</tspan></text><text x="89" y="136" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="89" dy="0">grit chamber</tspan></text><text x="89" y="167.9" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="89" dy="0">remove debris</tspan><tspan x="89" dy="16.3">and sand</tspan></text><line x1="156" y1="150" x2="176" y2="150" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="178" y="90" width="130" height="120" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2.5"/><text x="243" y="116" font-size="15" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="243" dy="0">Primary</tspan></text><text x="243" y="136" font-size="14" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="243" dy="0">settling tank</tspan></text><text x="243" y="167.9" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="243" dy="0">solids sink</tspan><tspan x="243" dy="16.3">as sludge</tspan></text><line x1="310" y1="150" x2="330" y2="150" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="332" y="90" width="130" height="120" rx="8" fill="#E5F1E8" stroke="#009E73" stroke-width="2.5"/><text x="397" y="116" font-size="15" font-weight="700" fill="#009E73" text-anchor="middle" dominant-baseline="middle"><tspan x="397" dy="0">Secondary</tspan></text><text x="397" y="136" font-size="14" font-weight="700" fill="#009E73" text-anchor="middle" dominant-baseline="middle"><tspan x="397" dy="0">aeration tank</tspan></text><text x="397" y="167.9" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="397" dy="0">microbes eat</tspan><tspan x="397" dy="16.3">organic matter</tspan></text><line x1="464" y1="150" x2="484" y2="150" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="486" y="90" width="130" height="120" rx="8" fill="#E8F2F9" stroke="#0072B2" stroke-width="2.5"/><text x="551" y="116" font-size="15" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="551" dy="0">Tertiary</tspan></text><text x="551" y="136" font-size="14" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="551" dy="0">filters</tspan></text><text x="551" y="176" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="551" dy="0">remove N and P</tspan></text><line x1="618" y1="150" x2="638" y2="150" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar)"/><rect x="640" y="90" width="130" height="120" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2.5"/><text x="705" y="116" font-size="15" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="705" dy="0">Disinfection</tspan></text><text x="705" y="136" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="705" dy="0">chlorine or UV</tspan></text><text x="705" y="176" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="705" dy="0">kills germs</tspan></text><line x1="705" y1="214" x2="705" y2="256" stroke="#0072B2" stroke-width="3" marker-end="url(#arB)"/><text x="705" y="268.2" font-size="13" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="705" dy="0">clean water</tspan><tspan x="705" dy="15.6">to the river</tspan></text><line x1="243" y1="210" x2="243" y2="290" stroke="#8C7A5A" stroke-width="3" stroke-dasharray="6 4"/><line x1="397" y1="210" x2="397" y2="290" stroke="#8C7A5A" stroke-width="3" stroke-dasharray="6 4"/><line x1="243" y1="290" x2="397" y2="290" stroke="#8C7A5A" stroke-width="3" stroke-dasharray="6 4"/><line x1="320" y1="290" x2="320" y2="312" stroke="#8C7A5A" stroke-width="3" marker-end="url(#ar)"/><rect x="140" y="314" width="260" height="64" rx="8" fill="#F3EDE2" stroke="#8C7A5A" stroke-width="2"/><text x="270" y="329.8" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="270" dy="0">Sludge digester: methane for energy;</tspan><tspan x="270" dy="16.3">solids landfilled, burned or used</tspan><tspan x="270" dy="16.3">as fertilizer</tspan></text><text x="160" y="30" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="160" dy="0">physical</tspan></text><text x="330" y="30" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="330" dy="0">biological</tspan></text><text x="560" y="30" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" font-style="italic" dominant-baseline="middle"><tspan x="560" dy="0">nutrients and germs</tspan></text>
</svg>
