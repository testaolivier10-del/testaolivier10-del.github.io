nt-weight="bold" fill="#0072B2" text-anchor="start">Precipitation</text><path d="M 280 214 Q 380 250 460 284" fill="none" stroke="#0072B2" stroke-width="2.2" marker-end="url(#ar-blue)"/><text x="330" y="228" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start">Runoff</text><line x1="110" y1="230" x2="110" y2="392" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="154" y="341" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="middle">Infiltration</text><line x1="300" y1="410" x2="470" y2="410" stroke="#0B4F7A" stroke-width="2" marker-end="url(#ar-blue)"/><text x="385" y="404" font-size="11" font-weight="normal" fill="#0B4F7A" text-anchor="middle">Groundwater flows slowly</text><text x="610" y="336" font-size="13" font-weight="bold" fill="#0B4F7A" text-anchor="middle">Ocean</text><text x="24" y="460" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="start">The sun drives evaporation; gravity pulls water down as precipitation, runoff and infiltration.</text>
</svg>
