<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">r-selected and K-selected traits</title>
<desc id="d">Table comparing r-selected and K-selected species. r-selected: many small offspring, little or no parental care, early first reproduction, short life span, population swings up and down, rebounds fast after a disruption; examples insects, mice, weeds. K-selected: few large offspring, a lot of parental care, late first reproduction, long life span, fairly steady population, recovers slowly after a disruption; examples elephants, whales, oaks.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker></defs><rect width="720" height="430" fill="#FFFFFF"/>
<rect x="330" y="18" width="190" height="40" fill="#474A10" rx="6" fill-opacity="0.16"/>
<rect x="530" y="18" width="170" height="40" fill="#0072B2" rx="6" fill-opacity="0.14"/>
<text x="26" y="44" font-size="16" fill="#1F2A28" font-weight="700">Trait</text>
<text x="425" y="44" font-size="17" fill="#474A10" text-anchor="middle" font-weight="700">r-selected</text>
<text x="615" y="44" font-size="17" fill="#0072B2" text-anchor="middle" font-weight="700">K-selected</text>
<rect x="14" y="64" width="692" height="44" fill="#F5F6F0"/>
<text x="26" y="92" font-size="15" fill="#1F2A28" font-weight="700">Offspring per reproduction</text>
<text x="425" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">many</text>
<text x="615" y="92" font-size="15" fill="#1F2A28" text-anchor="middle">few</text>
<text x="26" y="136" font-size="15" fill="#1F2A28" font-weight="700">Size of each offspring</text>
<text x="425" y="136" font-size="15" fill="#1F2A28" text-anchor="middle">small</text>
<text x="615" y="136" font-size="15" fill="#1F2A28" text-anchor="middle">large</text>
<rect x="14" y="152" width="692" height="44" fill="#F5F6F0"/>
<text x="26" y="180" font-size="15" fill="#1F2A28" font-weight="700">Parental care</text>
<text x="425" y="180" font-size="15" fill="#1F2A28" text-anchor="middle">little or none</text>
<text x="615" y="180" font-size="15" fill="#1F2A28" text-anchor="middle">a lot</text>
<text x="26" y="224" font-size="15" fill="#1F2A28" font-weight="700">Age at first reproduction</text>
<text x="425" y="224" font-size="15" fill="#1F2A28" text-anchor="middle">early</text>
<text x="615" y="224" font-size="15" fill="#1F2A28" text-anchor="middle">late</text>
<rect x="14" y="240" width="692" height="44" fill="#F5F6F0"/>
<text x="26" y="268" font-size="15" fill="#1F2A28" font-weight="700">Life span</text>
<text x="425" y="268" font-size="15" fill="#1F2A28" text-anchor="middle">short</text>
<text x="615" y="268" font-size="15" fill="#1F2A28" text-anchor="middle">long</text>
<text x="26" y="312" font-size="15" fill="#1F2A28" font-weight="700">Population size over time</text>
<text x="425" y="312" font-size="15" fill="#1F2A28" text-anchor="middle">swings up and down</text>
<text x="615" y="312" font-size="15" fill="#1F2A28" text-anchor="middle">fairly steady</text>
<rect x="14" y="328" width="692" height="44" fill="#F5F6F0"/>
<text x="26" y="356" font-size="15" fill="#1F2A28" font-weight="700">After a disruption</text>
<text x="425" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">rebounds fast</text>
<text x="615" y="356" font-size="15" fill="#1F2A28" text-anchor="middle">recovers slowly</text>
<text x="26" y="400" font-size="15" fill="#1F2A28" font-weight="700">Examples</text>
<text x="425" y="400" font-size="15" fill="#1F2A28" text-anchor="middle">insects, mice, weeds</text>
<text x="615" y="400" font-size="15" fill="#1F2A28" text-anchor="middle">elephants, whales, oaks</text>
</svg>
