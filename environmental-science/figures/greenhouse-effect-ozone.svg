0" stroke-width="2"/><circle cx="276" cy="192" r="7" fill="#FFFFFF" stroke="#D55E00" stroke-width="2"/><text x="140" y="262" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Greenhouse gases</text><text x="140" y="277" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">absorb infrared and send</text><text x="140" y="292" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">part of it back down.</text><text x="250" y="172" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">CO₂, CH₄, N₂O, H₂O, CFCs</text><text x="190" y="355" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">surface gives off infrared (IR)</text><text x="190" y="382" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">Result: the lower atmosphere warms</text><rect x="390" y="40" width="360" height="380" rx="10" fill="#FFFFFF" stroke="#E9ECEB" stroke-width="1.5"/><text x="570" y="30" font-size="15" font-weight="bold" fill="#0072B2" text-anchor="middle">The ozone layer</text><rect x="391" y="330" width="358" height="89" rx="0" fill="#E7EFE2" stroke="none" stroke-width="1.5"/><text x="570" y="408" font-size="13" font-weight="bold" fill="#009E73" text-anchor="middle">Earth’s surface</text><rect x="391" y="130" width="358" height="70" rx="0" fill="#E3EEF6" stroke="none" stroke-width="1.5"/><text x="404" y="148" font-size="12.5" font-weight="bold" fill="#0072B2" text-anchor="start">Stratosphere: ozone layer (O₃)</text><text x="404" y="166" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="start">about 15 to 35 km up</text><circle cx="430" cy="80" r="22" fill="#F3C64A" stroke="none" stroke-width="1.5"/><text x="430" y="120" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Sun</text><line x1="596" y1="64" x2="626" y2="184" stroke="#7A3FA0" stroke-width="2.5" marker-end="url(#ar-ink)"/><line x1="632" y1="64" x2="662" y2="184" stroke="#7A3FA0" stroke-width="2.5" marker-end="url(#ar-ink)"/><line x1="668" y1="64" x2="698" y2="184" stroke="#7A3FA0" stroke-width="2.5" marker-end="url(#ar-ink)"/><line x1="704" y1="64" x2="734" y2="184" stroke="#7A3FA0" stroke-width="2.5" marker-end="url(#ar-ink)"/><line x1="690" y1="64" x2="730" y2="324" stroke="#7A3FA0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar-ink)"/><text x="660" y="56" font-size="12" font-weight="normal" fill="#7A3FA0" text-anchor="middle">ultraviolet (UV)</text><text x="550" y="228" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">Ozone absorbs most UV</text><text x="550" y="243" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">before it reaches the ground.</text><text x="550" y="270" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">CFCs release chlorine that destroys</text><text x="550" y="285" font-size="12" font-weight="normal" fill="#D55E00" text-anchor="middle">ozone, so more UV gets through.</text><text x="570" y="382" font-size="12.5" font-weight="bold" fill="#1F2A28" text-anchor="middle">Result: more skin cancer and cataracts</text><text x="380" y="450" font-size="12.5" font-weight="normal" fill="#8A9290" text-anchor="middle">Different gases, different radiation, different layers of the atmosphere.</text>
</svg>
