<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Bioaccumulation and biomagnification</title>
<desc id="d">Left: a food chain from lake water to phytoplankton, zooplankton, small fish, large fish and an osprey; the pesticide concentration rises from 0.00005 ppm in water to 0.04, 0.3, 2, 12 and 50 ppm in the osprey (invented values), shown by more dots at each level. Right: one species of fish at ages 2, 6 and 10 years, with mercury rising from 0.08 to 0.31 to 0.62 ppm as it ages.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="250" y="22" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="250" dy="0">Biomagnification: up the food chain</tspan></text><rect x="140" y="358" width="260" height="44" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="128" y="380" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="128" dy="0">Lake water</tspan></text><text x="412" y="380" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="412" dy="0">0.00005 ppm</tspan></text><circle cx="150" cy="368" r="3.2" fill="#D55E00"/><line x1="270" y1="356" x2="270" y2="348" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><rect x="149" y="300" width="242" height="44" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="137" y="322" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="137" dy="0">Phytoplankton</tspan></text><text x="403" y="322" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="403" dy="0">0.04 ppm</tspan></text><circle cx="159" cy="310" r="3.2" fill="#D55E00"/><circle cx="171" cy="310" r="3.2" fill="#D55E00"/><circle cx="183" cy="310" r="3.2" fill="#D55E00"/><line x1="270" y1="298" x2="270" y2="290" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><rect x="158" y="242" width="224" height="44" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="146" y="264" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="146" dy="0">Zooplankton</tspan></text><text x="394" y="264" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="394" dy="0">0.3 ppm</tspan></text><circle cx="168" cy="252" r="3.2" fill="#D55E00"/><circle cx="180" cy="252" r="3.2" fill="#D55E00"/><circle cx="192" cy="252" r="3.2" fill="#D55E00"/><circle cx="204" cy="252" r="3.2" fill="#D55E00"/><circle cx="216" cy="252" r="3.2" fill="#D55E00"/><circle cx="228" cy="252" r="3.2" fill="#D55E00"/><line x1="270" y1="240" x2="270" y2="232" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><rect x="167" y="184" width="206" height="44" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="155" y="206" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="155" dy="0">Small fish</tspan></text><text x="385" y="206" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="385" dy="0">2 ppm</tspan></text><circle cx="177" cy="194" r="3.2" fill="#D55E00"/><circle cx="189" cy="194" r="3.2" fill="#D55E00"/><circle cx="201" cy="194" r="3.2" fill="#D55E00"/><circle cx="213" cy="194" r="3.2" fill="#D55E00"/><circle cx="225" cy="194" r="3.2" fill="#D55E00"/><circle cx="237" cy="194" r="3.2" fill="#D55E00"/><circle cx="249" cy="194" r="3.2" fill="#D55E00"/><circle cx="261" cy="194" r="3.2" fill="#D55E00"/><circle cx="273" cy="194" r="3.2" fill="#D55E00"/><circle cx="285" cy="194" r="3.2" fill="#D55E00"/><circle cx="297" cy="194" r="3.2" fill="#D55E00"/><line x1="270" y1="182" x2="270" y2="174" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><rect x="176" y="126" width="188" height="44" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="164" y="148" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="164" dy="0">Large fish</tspan></text><text x="376" y="148" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="376" dy="0">12 ppm</tspan></text><circle cx="186" cy="136" r="3.2" fill="#D55E00"/><circle cx="198" cy="136" r="3.2" fill="#D55E00"/><circle cx="210" cy="136" r="3.2" fill="#D55E00"/><circle cx="222" cy="136" r="3.2" fill="#D55E00"/><circle cx="234" cy="136" r="3.2" fill="#D55E00"/><circle cx="246" cy="136" r="3.2" fill="#D55E00"/><circle cx="258" cy="136" r="3.2" fill="#D55E00"/><circle cx="270" cy="136" r="3.2" fill="#D55E00"/><circle cx="282" cy="136" r="3.2" fill="#D55E00"/><circle cx="294" cy="136" r="3.2" fill="#D55E00"/><circle cx="306" cy="136" r="3.2" fill="#D55E00"/><circle cx="318" cy="136" r="3.2" fill="#D55E00"/><circle cx="330" cy="136" r="3.2" fill="#D55E00"/><circle cx="342" cy="136" r="3.2" fill="#D55E00"/><circle cx="186" cy="146" r="3.2" fill="#D55E00"/><circle cx="198" cy="146" r="3.2" fill="#D55E00"/><circle cx="210" cy="146" r="3.2" fill="#D55E00"/><circle cx="222" cy="146" r="3.2" fill="#D55E00"/><line x1="270" y1="124" x2="270" y2="116" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar)"/><rect x="185" y="68" width="170" height="44" rx="8" fill="#FCEFE6" stroke="#D55E00" stroke-width="2"/><text x="173" y="90" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="end" dominant-baseline="middle"><tspan x="173" dy="0">Osprey</tspan></text><text x="367" y="90" font-size="14" font-weight="700" fill="#D55E00" text-anchor="start" dominant-baseline="middle"><tspan x="367" dy="0">50 ppm</tspan></text><circle cx="195" cy="78" r="3.2" fill="#D55E00"/><circle cx="207" cy="78" r="3.2" fill="#D55E00"/><circle cx="219" cy="78" r="3.2" fill="#D55E00"/><circle cx="231" cy="78" r="3.2" fill="#D55E00"/><circle cx="243" cy="78" r="3.2" fill="#D55E00"/><circle cx="255" cy="78" r="3.2" fill="#D55E00"/><circle cx="267" cy="78" r="3.2" fill="#D55E00"/><circle cx="279" cy="78" r="3.2" fill="#D55E00"/><circle cx="291" cy="78" r="3.2" fill="#D55E00"/><circle cx="303" cy="78" r="3.2" fill="#D55E00"/><circle cx="315" cy="78" r="3.2" fill="#D55E00"/><circle cx="327" cy="78" r="3.2" fill="#D55E00"/><circle cx="195" cy="88" r="3.2" fill="#D55E00"/><circle cx="207" cy="88" r="3.2" fill="#D55E00"/><circle cx="219" cy="88" r="3.2" fill="#D55E00"/><circle cx="231" cy="88" r="3.2" fill="#D55E00"/><circle cx="243" cy="88" r="