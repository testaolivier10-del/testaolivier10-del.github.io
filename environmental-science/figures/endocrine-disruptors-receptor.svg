<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How endocrine disruptors act at a receptor</title>
<desc id="d">Three panels with a receptor on a target cell. Left: the natural hormone fits the receptor and turns on the normal signal. Middle: a mimic chemical with a similar shape fits and turns on a false signal. Right: a blocker sits in the receptor so the natural hormone cannot bind, and no signal is sent.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="360" fill="#FFFFFF"/>
<text x="140" y="28" font-size="18" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="140" dy="0">Natural hormone</tspan></text><text x="140" y="53.3" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="140" dy="0">fits the receptor and</tspan><tspan x="140" dy="17.5">sends the normal signal</tspan></text><rect x="30" y="250" width="220" height="56" rx="0" fill="#F4F5EC" stroke="#474A10" stroke-width="1.5"/><text x="140" y="288" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="140" dy="0">target cell</tspan></text><path d="M90,250 L90,180 L118,180 L140,212 L162,180 L190,180 L190,250 z" fill="#DCE6C8" stroke="#474A10" stroke-width="2.5"/><text x="62" y="196" font-size="12" font-weight="400" fill="#474A10" text-anchor="end" dominant-baseline="middle"><tspan x="62" dy="0">receptor</tspan></text><line x1="64" y1="196" x2="88" y2="200" stroke="#474A10" stroke-width="1"/><path d="M118,178 L162,178 L162,180 L140,212 L118,180 z" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><line x1="140" y1="310" x2="140" y2="336" stroke="#009E73" stroke-width="3" marker-end="url(#arO)"/><text x="140" y="350" font-size="14" font-weight="700" fill="#009E73" text-anchor="middle" dominant-baseline="middle"><tspan x="140" dy="0">signal ON</tspan></text><text x="400" y="28" font-size="18" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">Mimic</tspan></text><text x="400" y="53.3" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">a look-alike chemical fits</tspan><tspan x="400" dy="17.5">and sends a false signal</tspan></text><rect x="290" y="250" width="220" height="56" rx="0" fill="#F4F5EC" stroke="#474A10" stroke-width="1.5"/><text x="400" y="288" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">target cell</tspan></text><path d="M350,250 L350,180 L378,180 L400,212 L422,180 L450,180 L450,250 z" fill="#DCE6C8" stroke="#474A10" stroke-width="2.5"/><text x="322" y="196" font-size="12" font-weight="400" fill="#474A10" text-anchor="end" dominant-baseline="middle"><tspan x="322" dy="0">receptor</tspan></text><line x1="324" y1="196" x2="348" y2="200" stroke="#474A10" stroke-width="1"/><path d="M378,178 L422,178 L422,180 L400,212 L378,180 z" fill="#D55E00" stroke="#1F2A28" stroke-width="1.5"/><line x1="400" y1="310" x2="400" y2="336" stroke="#D55E00" stroke-width="3" marker-end="url(#arO)"/><text x="400" y="350" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="400" dy="0">false signal ON</tspan></text><text x="660" y="28" font-size="18" font-weight="700" fill="#7A4F9E" text-anchor="middle" dominant-baseline="middle"><tspan x="660" dy="0">Blocker</tspan></text><text x="660" y="53.3" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="660" dy="0">sits in the receptor;</tspan><tspan x="660" dy="17.5">the hormone cannot bind</tspan></text><rect x="550" y="250" width="220" height="56" rx="0" fill="#F4F5EC" stroke="#474A10" stroke-width="1.5"/><text x="660" y="288" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="660" dy="0">target cell</tspan></text><path d="M610,250 L610,180 L638,180 L660,212 L682,180 L710,180 L710,250 z" fill="#DCE6C8" stroke="#474A10" stroke-width="2.5"/><text x="582" y="196" font-size="12" font-weight="400" fill="#474A10" text-anchor="end" dominant-baseline="middle"><tspan x="582" dy="0">receptor</tspan></text><line x1="584" y1="196" x2="608" y2="200" stroke="#474A10" stroke-width="1"/><path d="M636,152 L684,152 L684,182 L660,212 L636,182 z" fill="#7A4F9E" stroke="#1F2A28" stroke-width="1.5"/><path d="M714,106 L758,106 L758,108 L736,140 L714,108 z" fill="#0072B2" stroke="#1F2A28" stroke-width="1.5"/><text x="736" y="92" font-size="12" font-weight="400" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="736" dy="0">hormone</tspan></text><line x1="718" y1="112" x2="754" y2="142" stroke="#D55E00" stroke-width="3"/><line x1="754" y1="112" x2="718" y2="142" stroke="#D55E00" stroke-width="3"/><line x1="660" y1="310" x2="660" y2="336" stroke="#6B7370" stroke-width="3" marker-end="url(#ar)"/><text x="660" y="350" font-size="14" font-weight="700" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="660" dy="0">no signal</tspan></text>
</svg>
