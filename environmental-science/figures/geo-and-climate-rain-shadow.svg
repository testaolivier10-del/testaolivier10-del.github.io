<text x="250" y="205" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Heavy rain</text>
<path d="M420 70 C480 120 540 200 640 250" fill="none" stroke="#D55E00" stroke-width="3" marker-end="url(#ar-verm)" stroke-linejoin="round"/>
<text x="520" y="120" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Dry air sinks and warms</text>
<text x="230" y="385" font-size="12.5" font-weight="bold" fill="#009E73" text-anchor="middle">Windward side: wet, forested</text>
<text x="620" y="385" font-size="12.5" font-weight="bold" fill="#D55E00" text-anchor="middle">Leeward side: rain shadow, dry</text>
<text x="470" y="150" font-size="11.5" font-weight="normal" fill="#1F2A28" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Mountain range</text>
</svg>
