<path d="M215 290 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M240 280 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M275 262 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M300 228 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M325 192 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M350 158 l-8 0 l8 -22 l8 22 z" fill="#009E73" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M600 285 l0 -14 m0 6 l-5 -4 m5 6 l5 -5" fill="none" stroke="#474A10" stroke-width="2" stroke-linejoin="round"/>
<path d="M690 293 l0 -14 m0 6 l-5 -4 m5 6 l5 -5" fill="none" stroke="#474A10" stroke-width="2" stroke-linejoin="round"/>
<line x1="30" y1="250" x2="150" y2="250" stroke="#1F2A28" stroke-width="3" marker-end="url(#ar-ink)"/>
<text x="30" y="232" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="start">Moist air from the ocean</text>
<path d="M170 245 C240 228 300 180 360 100 L388 66" fill="none" stroke="#0072B2" stroke-width="3" marker-end="url(#ar-blue)" stroke-linejoin="round"/>
<text x="60" y="150" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Air is pushed up the slope</text><text x="60" y="165" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">and cools; water vapor</text><text x="60" y="180" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">condenses into clouds</text>
<path d="M250 130 a22 22 0 0 1 40 -16 a26 26 0 0 1 48 6 a20 20 0 0 1 10 36 h-92 a18 18 0 0 1 -6 -26 z" fill="#E3E6E5" stroke="#6B7370" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="262" y1="164" x2="256" y2="190" stroke="#0072B2" stroke-width="1.6"/>
<line x1="282" y1="164" x2="276" y2="190" stroke="#0072B2" stroke-width="1.6"/>
