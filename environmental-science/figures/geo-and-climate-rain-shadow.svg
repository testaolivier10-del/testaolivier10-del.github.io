<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="geo-and-climate-rain-shadow-t geo-and-climate-rain-shadow-d" font-family="Arial, Helvetica, sans-serif">
<title id="geo-and-climate-rain-shadow-t">The rain shadow effect</title>
<desc id="geo-and-climate-rain-shadow-d">Moist air from the ocean blows toward a mountain range. On the windward side the air is pushed up the slope, so it cools; its water vapor condenses into clouds and falls as heavy rain, and the windward slope is green and forested. The air that crosses the peak has lost most of its water. On the leeward side it sinks and warms, so it is dry, and the land there is a rain shadow: a dry region, often a desert, with sparse plants.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs><rect width="760" height="400" fill="#FFFFFF"/>
<rect x="20" y="290" width="170" height="70" rx="0" fill="#CFE3F1" stroke="none" stroke-width="1.5"/>
<text x="105" y="330" font-size="13" font-weight="bold" fill="#0072B2" text-anchor="middle">Ocean</text>
