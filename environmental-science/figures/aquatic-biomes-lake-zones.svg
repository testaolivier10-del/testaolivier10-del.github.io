middle">open, sunlit water</text><rect x="310" y="234" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="385" y="252.97" font-size="11" font-weight="bold" fill="#1F2A28" text-anchor="middle">Profundal zone</text><text x="385" y="266.73" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">deep, too dark for plants</text><rect x="470" y="340" width="210" height="44" rx="8" fill="#FFFFFF" stroke="#8C6D46" stroke-width="1.5"/><text x="575" y="358.98" font-size="11" font-weight="bold" fill="#1F2A28" text-anchor="middle">Benthic zone</text><text x="575" y="372.73" font-size="11" font-weight="normal" fill="#1F2A28" text-anchor="middle">the bottom and its mud</text><line x1="470" y1="350" x2="440" y2="330" stroke="#8C6D46" stroke-width="1.5"/><text x="24" y="30" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Zones of a lake</text><text x="24" y="52" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Light and depth decide where plants and algae can grow.</text>
