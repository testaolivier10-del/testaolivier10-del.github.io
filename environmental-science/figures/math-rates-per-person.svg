<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-labelledby="math-rates-per-person-t math-rates-per-person-d" font-family="Arial, Helvetica, sans-serif">
<title id="math-rates-per-person-t">Total water use compared with use per person</title>
<desc id="math-rates-per-person-d">Two bar charts from invented data. Total use: Town A uses 4.5 million liters a day and Town B 2 million liters a day, so Town A uses more in total. Use per person: Town A has 30,000 people, so 4,500,000 divided by 30,000 is 150 liters per person per day; Town B has 8,000 people, so 2,000,000 divided by 8,000 is 250 liters per person per day. Town B uses more per person.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="720" height="384" fill="#FFFFFF"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1F2A28" text-anchor="start">Total water use vs water use per person</text><text x="170" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Total use</text><line x1="40" y1="300" x2="300" y2="300" stroke="#1F2A28" stroke-width="1.5"/><rect x="80" y="111" width="70" height="189" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="115" y="103" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">4.5 million L</text><text x="115" y="320" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Town A</text><rect x="200" y="216" width="70" height="84" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="235" y="208" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">2 million L</text><text x="235" y="320" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Town B</text><text x="170" y="342" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">liters per day</text><text x="530" y="66" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Use per person</text><line x1="400" y1="300" x2="660" y2="300" stroke="#1F2A28" stroke-width="1.5"/><rect x="440" y="195" width="70" height="105" rx="0" fill="#474A10" stroke="none" stroke-width="1.5"/><text x="475" y="187" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">150 L</text><text x="475" y="320" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Town A</text><rect x="560" y="125" width="70" height="175" rx="0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="595" y="117" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">250 L</text><text x="595" y="320" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Town B</text><text x="530" y="342" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="middle">liters per person per day</text><text x="24" y="376" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Town A: 30,000 people. Town B: 8,000 people. Invented data for practice.</text>
</svg>
