<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="climate-change-feedback-t climate-change-feedback-d" font-family="Arial, Helvetica, sans-serif">
<title id="climate-change-feedback-t">Two positive feedback loops that amplify warming</title>
<desc id="climate-change-feedback-d">Two loops, each marked with a plus sign. Left, ice and albedo: Earth warms, snow and sea ice melt, darker water and land are exposed so albedo falls, more sunlight is absorbed, and Earth warms more. Right, thawing permafrost: Earth warms, permafrost thaws, microbes decompose the frozen remains, methane and carbon dioxide are released, and Earth warms more. Caption: a positive feedback loop makes the first change stronger; melting sea ice is part of the loop but does not raise sea level.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="190" y="30" font-size="15" font-weight="bold" fill="#474A10" text-anchor="middle">Ice and albedo</text><rect x="98" y="40" width="184" height="60" rx="10" fill="#EFF0DA" stroke="#474A10" stroke-width="2.5"/><text x="190" y="62" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Earth warms</text><rect x="215" y="160" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="290" y="182" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Snow and sea ice</text><text x="290" y="197" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">melt</text><rect x="98" y="280" width="184" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="190" y="302" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Darker water and land</text><text x="190" y="317" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">are exposed (lower albedo)</text><rect x="15" y="160" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="90" y="182" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">More sunlight</text><text x="90" y="197" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">is absorbed</text><path d="M 284 70 Q 308 90 302 156" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 302 222 Q 302 262 284 296" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 96 312 Q 72 292 78 224" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 78 158 Q 72 92 94 74" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><circle cx="190" cy="190" r="20" fill="#FFFFFF" stroke="#474A10" stroke-width="2"/><text x="190" y="198" font-size="22" font-weight="bold" fill="#474A10" text-anchor="middle">+</text><text x="570" y="30" font-size="15" font-weight="bold" fill="#474A10" text-anchor="middle">Thawing permafrost</text><rect x="478" y="40" width="184" height="60" rx="10" fill="#EFF0DA" stroke="#474A10" stroke-width="2.5"/><text x="570" y="62" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Earth warms</text><rect x="595" y="160" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="670" y="182" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Permafrost</text><text x="670" y="197" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">thaws</text><rect x="478" y="280" width="184" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="570" y="302" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Microbes decompose</text><text x="570" y="317" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">the frozen remains</text><rect x="395" y="160" width="150" height="60" rx="10" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1.5"/><text x="470" y="182" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">Methane and CO₂</text><text x="470" y="197" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="middle">are released</text><path d="M 664 70 Q 688 90 682 156" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 682 222 Q 682 262 664 296" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 476 312 Q 452 292 458 224" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><path d="M 458 158 Q 452 92 474 74" fill="none" stroke="#474A10" stroke-width="2" marker-end="url(#ar-olive)"/><circle cx="570" cy="190" r="20" fill="#FFFFFF" stroke="#474A10" stroke-width="2"/><text x="570" y="198" font-size="22" font-weight="bold" fill="#474A10" text-anchor="middle">+</text><text x="380" y="370" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">A positive feedback loop: each change makes the first one stronger.</text><text x="380" y="388" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">Melting sea ice is part of this loop, but it does not raise sea level.</text>
</svg>
