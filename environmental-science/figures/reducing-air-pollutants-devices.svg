<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Air pollution control devices</title>
<desc id="d">Top: at a coal power plant, exhaust from the boiler passes an electrostatic precipitator or baghouse that removes particles, then a scrubber with limestone spray that removes sulfur dioxide, then the stack; CO2 is not removed. Bottom left: a car catalytic converter changes CO to CO2, NOx to nitrogen gas, and hydrocarbons to CO2 and water. Bottom right: a vapor recovery nozzle at a gas pump captures gasoline vapor, not exhaust.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="440" fill="#FFFFFF"/>
<text x="240" y="24" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="240" dy="0">Coal power plant</tspan></text><rect x="20" y="60" width="110" height="120" rx="8" fill="#E2E0D8" stroke="#1F2A28" stroke-width="2"/><text x="75" y="111.3" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="75" dy="0">Boiler</tspan><tspan x="75" dy="17.5">burns coal</tspan></text><line x1="130" y1="120" x2="160" y2="120" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><rect x="160" y="60" width="140" height="120" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="230" y="102.5" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="230" dy="0">Electrostatic</tspan><tspan x="230" dy="17.5">precipitator</tspan><tspan x="230" dy="17.5">or baghouse</tspan></text><text x="230" y="200" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="230" dy="0">removes particles</tspan></text><line x1="300" y1="120" x2="330" y2="120" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><rect x="330" y="60" width="120" height="120" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="390" y="102.5" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="390" dy="0">Scrubber</tspan><tspan x="390" dy="17.5">limestone</tspan><tspan x="390" dy="17.5">spray</tspan></text><text x="390" y="200" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="390" dy="0">removes SO2</tspan></text><line x1="450" y1="120" x2="470" y2="120" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><rect x="470" y="40" width="30" height="140" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><text x="485" y="30" font-size="13" font-weight="400" fill="#6B7370" text-anchor="middle" dominant-baseline="middle"><tspan x="485" dy="0">stack</tspan></text><text x="620" y="70" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="620" dy="0">Leaves the stack:</tspan></text><text x="620" y="99.1" font-size="14" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="620" dy="0">CO2 (not removed)</tspan><tspan x="620" dy="18.9">some NOx</tspan><tspan x="620" dy="18.9">water vapor</tspan></text><line x1="20" y1="228" x2="780" y2="228" stroke="#DADDD4" stroke-width="1.5"/><text x="200" y="254" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="200" dy="0">Car</tspan></text><rect x="40" y="300" width="140" height="46" rx="10" fill="#0072B2"/><rect x="68" y="272" width="80" height="34" rx="10" fill="#0072B2"/><circle cx="72" cy="348" r="14" fill="#1F2A28"/><circle cx="150" cy="348" r="14" fill="#1F2A28"/><line x1="180" y1="336" x2="220" y2="336" stroke="#6B7370" stroke-width="6"/><rect x="220" y="306" width="150" height="60" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="295" y="327.3" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="295" dy="0">Catalytic</tspan><tspan x="295" dy="17.5">converter</tspan></text><line x1="370" y1="336" x2="400" y2="336" stroke="#1F2A28" stroke-width="2.5" marker-end="url(#ar)"/><text x="295" y="385.9" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="295" dy="0">CO to CO2;  NOx to N2;</tspan><tspan x="295" dy="18.2">hydrocarbons to CO2 and water</tspan></text><text x="620" y="254" font-size="17" font-weight="700" fill="#474A10" text-anchor="middle" dominant-baseline="middle"><tspan x="620" dy="0">Gas pump</tspan></text><rect x="520" y="280" width="60" height="90" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><rect x="530" y="292" width="40" height="26" rx="0" fill="#FFFFFF" stroke="#1F2A28" stroke-width="1"/><path d="M580,330 C610,330 615,300 640,300 L660,300" fill="none" stroke="#1F2A28" stroke-width="4"/><rect x="640" y="320" width="140" height="50" rx="8" fill="#F4F5EC" stroke="#474A10" stroke-width="2"/><text x="710" y="336.3" font-size="14" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="710" dy="0">Vapor recovery</tspan><tspan x="710" dy="17.5">nozzle</tspan></text><text x="650" y="390.9" font-size="14" font-weight="700" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="650" dy="0">captures gasoline vapor (VOCs),</tspan><tspan x="650" dy="18.2">not exhaust</tspan></text>
</svg>
