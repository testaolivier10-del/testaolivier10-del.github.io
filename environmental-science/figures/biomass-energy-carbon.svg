<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="biomass-energy-carbon-t biomass-energy-carbon-d"><title id="biomass-energy-carbon-t">Biomass energy and carbon</title><desc id="biomass-energy-carbon-d">Growing plants take in carbon dioxide by photosynthesis and store the carbon in wood, crops and waste. Harvested biomass is burned for heat or electricity, or made into ethanol or biodiesel, and burning releases the carbon as carbon dioxide along with smoke and soot. If new plants regrow at the same rate, they take the carbon back up over years or decades. If forest is cleared and not regrown, the carbon stays in the air and the land loses its habitat and soil.</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ah-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ah-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6F6E"/></marker></defs><rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/><text x="380" y="26" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A28" font-weight="700" text-anchor="middle">Biomass is renewable only when it regrows as fast as it is burned</text><rect x="40" y="70" width="210" height="90" rx="8" fill="#DFF3EC" stroke="#009E73" stroke-width="1.5"/><text x="145" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Growing plants</text><text x="145" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="145" dy="0">photosynthesis stores</tspan><tspan x="145" dy="16">carbon in wood and crops</tspan></text><rect x="500" y="70" width="220" height="90" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="610" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Harvest</text><text x="610" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="610" dy="0">wood, crop waste, manure,</tspan><tspan x="610" dy="16">corn or sugarcane</tspan></text><rect x="500" y="230" width="220" height="100" rx="8" fill="#FBE7DA" stroke="#D55E00" stroke-width="1.5"/><text x="610" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Burn or convert</text><text x="610" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="610" dy="0">heat, electricity, or</tspan><tspan x="610" dy="16">liquid fuels (ethanol,</tspan><tspan x="610" dy="16">biodiesel)</tspan></text><rect x="40" y="230" width="210" height="100" rx="8" fill="#F1F2F1" stroke="#6B6F6E" stroke-width="1.5"/><text x="145" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F2A28" font-weight="700" text-anchor="middle">Carbon dioxide</text><text x="145" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2A28" text-anchor="middle"><tspan x="145" dy="0">in the air, with smoke</tspan><tspan x="145" dy="16">and soot from burning</tspan></text><line x1="255" y1="115" x2="495" y2="115" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><text x="375" y="105" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">years to decades</text><line x1="610" y1="160" x2="610" y2="225" stroke="#474A10" stroke-width="3" marker-end="url(#ah-olive)"/><line x1="495" y1="280" x2="255" y2="280" stroke="#D55E00" stroke-width="3" marker-end="url(#ah-verm)"/><text x="375" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D55E00" text-anchor="middle">released in hours</text><line x1="145" y1="225" x2="145" y2="165" stroke="#009E73" stroke-width="3" marker-end="url(#ah-green)"/><text x="155" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#009E73"><tspan x="155" dy="0">taken back up</tspan><tspan x="155" dy="14">only if plants regrow</tspan></text><rect x="40" y="350" width="680" height="40" rx="8" fill="#EFF0DA" stroke="#474A10" stroke-width="1.5"/><text x="380" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" font-weight="700" text-anchor="middle">Cleared and not regrown: the carbon stays in the air and habitat is lost.</text></svg>
