<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Thermal pollution from a power plant</title>
<desc id="d">A power plant pumps in cool river water to condense its steam and returns it warmer through an outlet; a warm plume with less dissolved oxygen spreads downstream. Alternatively, the warm water goes to a cooling tower, which releases the heat and some water vapor to the air.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="800" height="400" fill="#FFFFFF"/>
<rect x="0" y="0" width="800" height="400" rx="0" fill="#F4F6EC"/><rect x="0" y="290" width="800" height="110" rx="0" fill="#7FB3D9"/><defs><linearGradient id="plume" x1="0" x2="1"><stop offset="0" stop-color="#E8885A"/><stop offset="1" stop-color="#7FB3D9"/></linearGradient></defs><path d="M330,292 C420,300 560,330 800,340 L800,372 C560,368 420,336 330,320 z" fill="url(#plume)" stroke="none" stroke-width="0"/><text x="80" y="360" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="80" dy="0">cool river water</tspan></text><text x="620" y="392" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="620" dy="0">warm plume: less dissolved oxygen</tspan></text><line x1="30" y1="320" x2="140" y2="320" stroke="#FFFFFF" stroke-width="3" marker-end="url(#ar)"/><rect x="140" y="150" width="180" height="110" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><rect x="285" y="70" width="22" height="80" rx="0" fill="#C9CCC2" stroke="#1F2A28" stroke-width="1.5"/><text x="230" y="180" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="230" dy="0">Power plant</tspan></text><text x="230" y="197.9" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="230" dy="0">steam is cooled</tspan><tspan x="230" dy="16.3">back to water</tspan></text><path d="M170,262 L170,300" fill="none" stroke="#0072B2" stroke-width="7"/><text x="120" y="278" font-size="13" font-weight="700" fill="#0072B2" text-anchor="middle" dominant-baseline="middle"><tspan x="120" dy="0">intake</tspan></text><path d="M300,262 L300,296 L330,300" fill="none" stroke="#D55E00" stroke-width="7"/><text x="352" y="270" font-size="13" font-weight="700" fill="#D55E00" text-anchor="start" dominant-baseline="middle"><tspan x="352" dy="0">warm outlet</tspan></text><path d="M560,250 C575,190 575,150 555,90 L665,90 C645,150 645,190 660,250 z" fill="#E2E0D8" stroke="#1F2A28" stroke-width="1.5"/><circle cx="590" cy="70" r="18" fill="#FFFFFF" stroke="#B9C0C6" stroke-width="1"/><circle cx="615" cy="55" r="22" fill="#FFFFFF" stroke="#B9C0C6" stroke-width="1"/><circle cx="640" cy="72" r="18" fill="#FFFFFF" stroke="#B9C0C6" stroke-width="1"/><circle cx="612" cy="36" r="16" fill="#FFFFFF" stroke="#B9C0C6" stroke-width="1"/><text x="700" y="32.2" font-size="13" font-weight="400" fill="#1F2A28" text-anchor="start" dominant-baseline="middle"><tspan x="700" dy="0">heat and water</tspan><tspan x="700" dy="15.6">vapor to the air</tspan></text><text x="610" y="275" font-size="15" font-weight="700" fill="#1F2A28" text-anchor="middle" dominant-baseline="middle"><tspan x="610" dy="0">Cooling tower</tspan></text><path d="M320,210 L555,210" fill="none" stroke="#D55E00" stroke-width="3"/><line x1="470" y1="210" x2="556" y2="210" stroke="#D55E00" stroke-width="3" marker-end="url(#arR)"/><text x="440" y="195" font-size="13" font-weight="400" fill="#D55E00" text-anchor="middle" dominant-baseline="middle"><tspan x="440" dy="0">or: send warm water here</tspan></text>
</svg>
