<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three shapes of age structure diagram</title>
<desc id="d">Three population pyramids, percent of the population in each 10-year age group, male on the left and female on the right. Rapid growth: a wide base (13.5% of the population is male and 13% female aged 0 to 9) narrowing quickly with age. Slow or no growth: bars of almost equal length up to age 60 (a column). Decline: a base narrower than the middle, with the widest bars at ages 40 to 59. Invented data.</desc>
