<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="carbon-cycle-reservoirs-t carbon-cycle-reservoirs-d" font-family="Arial, Helvetica, sans-serif">
<title id="carbon-cycle-reservoirs-t">The carbon cycle: reservoirs and fluxes</title>
<desc id="carbon-cycle-reservoirs-d">Six carbon reservoirs: the atmosphere, plants and animals, soil and dead matter, the ocean, ocean sediments and sedimentary rock, and fossil fuels. Photosynthesis moves carbon from the atmosphere into living things; respiration returns it. Wastes and dead matter move carbon into the soil, and decomposition returns it to the atmosphere. Combustion of fossil fuels moves carbon to the atmosphere. CO2 dissolves into the ocean and is also released from it. Slow processes, shown dashed: sedimentation moves carbon from the ocean into sediments and rock, and buried dead matter becomes fossil fuels over millions of years.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7370"/></marker></defs>
<rect width="760" height="480" fill="#FFFFFF"/>
<rect x="280" y="24" width="200" height="54" rx="8" fill="#E6F1F8" stroke="#0072B2" stroke-width="1.5"/><text x="380" y="47.42" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Atmosphere</text><text x="380" y="63.67" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">CO2 and methane</text><rect x="40" y="170" width="180" height="58" rx="8" fill="#E4F2E9" stroke="#009E73" stroke-width="1.5"/><text x="130" y="195.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Plants and animals</text><text x="130" y="211.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">(living things)</text><rect x="40" y="360" width="180" height="58" rx="8" fill="#F3ECDD" stroke="#8C6D46" stroke-width="1.5"/><text x="130" y="393.55" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Soil and dead matter</text><rect x="540" y="170" width="190" height="58" rx="8" fill="#D7E9F5" stroke="#0072B2" stroke-width="1.5"/><text x="635" y="195.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Ocean</text><text x="635" y="211.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">dissolved CO2, sea life</text><rect x="540" y="360" width="190" height="58" rx="8" fill="#EDE7DC" stroke="#6B7370" stroke-width="1.5"/><text x="635" y="385.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Ocean sediments and</text><text x="635" y="401.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">sedimentary rock</text><rect x="290" y="360" width="180" height="58" rx="8" fill="#E9E6DA" stroke="#1F2A28" stroke-width="1.5"/><text x="380" y="385.43" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Fossil fuels</text><text x="380" y="401.68" font-size="13" font-weight="normal" fill="#1F2A28" text-anchor="middle">coal, oil, natural gas</text><line x1="300" y1="78" x2="160" y2="170" stroke="#009E73" stroke-width="2" marker-end="url(#ar-green)"/><text x="246" y="140" font-size="12" font-weight="bold" fill="#009E73" text-anchor="start">Photosynthesis</text><line x1="120" y1="170" x2="280" y2="66" stroke="#1F2A28" stroke-width="2" marker-end="url(#ar-ink)"/><text x="184" y="108" font-size="12" font-weight="bold" fill="#1F2A28" text-anchor="end">Respiration</text><line x1="110" y1="228" x2="110" y2="360" stroke="#8C6D46" stroke-width="2" marker-end="url(#ar-ink)"/><text x="70" y="288" font-size="12" font-weight="normal" fill="#8C6D46" text-anchor="middle">Wastes and</text><text x="70" y="303" font-size="12" font-weight="normal" fill="#8C6D46" text-anchor="middle">dead matter</text><line x1="200" y1="360" x2="330" y2="78" stroke="#8C6D46" stroke-width="2" marker-end="url(#ar-ink)"/><text x="317" y="283" font-size="12" font-weight="bold" fill="#8C6D46" text-anchor="middle">Decomposition</text><line x1="390" y1="360" x2="390" y2="78" stroke="#D55E00" stroke-width="2" marker-end="url(#ar-verm)"/><text x="434" y="279" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">Combustion</text><text x="434" y="294" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">(burning</text><text x="434" y="309" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="middle">fossil fuels)</text><line x1="480" y1="50" x2="620" y2="170" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="612" y="90" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="middle">CO2 dissolves</text><line x1="580" y1="170" x2="480" y2="72" stroke="#0072B2" stroke-width="2" marker-end="url(#ar-blue)"/><text x="524" y="155" font-size="12" font-weight="normal" fill="#0072B2" text-anchor="middle">CO2 released</text><line x1="635" y1="228" x2="635" y2="360" stroke="#6B7370" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-grey)"/><text x="625" y="270" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="end">Sedimentation</text><text x="625" y="285" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="end">(shells and remains</text><text x="625" y="300" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="end">settle and harden)</text><line x1="220" y1="400" x2="290" y2="400" stroke="#6B7370" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-grey)"/><text x="255" y="440" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">buried for millions</text><text x="255" y="453.75" font-size="11" font-weight="normal" fill="#6B7370" text-anchor="middle">of years</text><text x="24" y="470" font-size="12" font-weight="normal" fill="#6B7370" text-anchor="start">Solid arrows: fast exchanges (days to centuries). Dashed arrows: slow ones (thousands to millions of years).</text>
</svg>
