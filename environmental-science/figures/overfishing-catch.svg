<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="overfishing-catch-t overfishing-catch-d" font-family="Arial, Helvetica, sans-serif">
<title id="overfishing-catch-t">Yearly catch in a fishery that is fished faster than it can recover</title>
<desc id="overfishing-catch-d">Line graph, invented data for practice. Yearly catch in thousand metric tons: 1960 210, 1965 260, 1970 340, 1975 420, 1980 450, 1985 400, 1990 250, 1995 60, 2000 20, 2005 15, 2010 25, 2015 30. The catch rises to a peak of 450 in 1980, then falls to 20 by 2000 although boats fish harder, and recovers only slightly by 2015.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A28"/></marker><marker id="ar-olive" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#474A10"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="ar-verm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9290"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<line x1="110" y1="270" x2="640" y2="270" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="274" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">0</text><line x1="110" y1="224" x2="640" y2="224" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="228" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">100</text><line x1="110" y1="178" x2="640" y2="178" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="182" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">200</text><line x1="110" y1="132" x2="640" y2="132" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="136" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">300</text><line x1="110" y1="86" x2="640" y2="86" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="90" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">400</text><line x1="110" y1="40" x2="640" y2="40" stroke="#E9ECEB" stroke-width="1"/><text x="102" y="44" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="end">500</text><line x1="110" y1="270" x2="110" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="110" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1960</text><line x1="158.18" y1="270" x2="158.18" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="158.18" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1965</text><line x1="206.36" y1="270" x2="206.36" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="206.36" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1970</text><line x1="254.55" y1="270" x2="254.55" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="254.55" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1975</text><line x1="302.73" y1="270" x2="302.73" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="302.73" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1980</text><line x1="350.91" y1="270" x2="350.91" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="350.91" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1985</text><line x1="399.09" y1="270" x2="399.09" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="399.09" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1990</text><line x1="447.27" y1="270" x2="447.27" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="447.27" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">1995</text><line x1="495.45" y1="270" x2="495.45" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="495.45" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2000</text><line x1="543.64" y1="270" x2="543.64" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="543.64" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2005</text><line x1="591.82" y1="270" x2="591.82" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="591.82" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2010</text><line x1="640" y1="270" x2="640" y2="275" stroke="#1F2A28" stroke-width="1.5"/><text x="640" y="289" font-size="12" font-weight="normal" fill="#1F2A28" text-anchor="middle">2015</text><line x1="110" y1="270" x2="640" y2="270" stroke="#1F2A28" stroke-width="1.5"/><line x1="110" y1="40" x2="110" y2="270" stroke="#1F2A28" stroke-width="1.5"/><text x="375" y="312" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle">Year</text><text x="58" y="155" font-size="13" font-weight="bold" fill="#1F2A28" text-anchor="middle" transform="rotate(-90 58 155)">Catch (thousand metric tons)</text><path d="M110,173.4 L158.18,150.4 L206.36,113.6 L254.55,76.8 L302.73,63 L350.91,86 L399.09,155 L447.27,242.4 L495.45,260.8 L543.64,263.1 L591.82,258.5 L640,256.2" fill="none" stroke="#0072B2" stroke-width="3"/><circle cx="110" cy="173.4" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="158.18" cy="150.4" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="206.36" cy="113.6" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="254.55" cy="76.8" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="302.73" cy="63" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="350.91" cy="86" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="399.09" cy="155" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="447.27" cy="242.4" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="495.45" cy="260.8" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="543.64" cy="263.1" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="591.82" cy="258.5" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><circle cx="640" cy="256.2" r="4" fill="#0072B2" stroke="none" stroke-width="1.5"/><line x1="302.73" y1="57" x2="302.73" y2="44" stroke="#8A9290" stroke-width="1.5" stroke-dasharray="4 3"/><text x="308.73" y="44.6" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Peak catch</text><text x="466.55" y="132" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">Catch falls even</text><text x="466.55" y="148.25" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">though boats fish harder:</text><text x="466.55" y="164.5" font-size="12.5" font-weight="normal" fill="#1F2A28" text-anchor="start">the stock is depleted</text><text x="708" y="330" font-size="11" font-weight="normal" fill="#5A6260" text-anchor="end" font-style="italic">Invented data for practice</text>
</svg>
