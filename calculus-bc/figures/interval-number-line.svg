<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="interval-number-line-t interval-number-line-d">
<title id="interval-number-line-t">An interval of convergence on a number line</title>
<desc id="interval-number-line-d">A number line from -5 to 7. The power series sum of (x - 1) to the n over n times 4 to the n is centered at 1 with radius 4, marked by arrows to -3 and 5. A thick bar runs from -3 to 5, with a filled dot at -3, where the series becomes the alternating harmonic series and converges, and an open dot at 5, where it becomes the harmonic series and diverges. Outside the bar the series diverges. The interval of convergence is [-3, 5).</desc>
<rect width="760" height="270" fill="#fff"/>
<line x1="50" y1="162" x2="710" y2="162" stroke="#1F2A28" stroke-width="1.6" stroke-linecap="round"/>
<line x1="50" y1="166.8" x2="50" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="50" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >−5</tspan></text>
<line x1="105" y1="166.8" x2="105" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="105" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >−4</tspan></text>
<line x1="160" y1="166.8" x2="160" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="160" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >−3</tspan></text>
<line x1="215" y1="166.8" x2="215" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="215" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >−2</tspan></text>
<line x1="270" y1="166.8" x2="270" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="270" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >−1</tspan></text>
<line x1="325" y1="166.8" x2="325" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="325" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >0</tspan></text>
<line x1="380" y1="166.8" x2="380" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="380" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >1</tspan></text>
<line x1="435" y1="166.8" x2="435" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="435" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >2</tspan></text>
<line x1="490" y1="166.8" x2="490" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="490" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >3</tspan></text>
<line x1="545" y1="166.8" x2="545" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="545" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >4</tspan></text>
<line x1="600" y1="166.8" x2="600" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="600" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >5</tspan></text>
<line x1="655" y1="166.8" x2="655" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="655" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >6</tspan></text>
<line x1="710" y1="166.8" x2="710" y2="157.2" stroke="#1F2A28" stroke-width="1.2" stroke-linecap="round"/>
<text x="710" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >7</tspan></text>
<line x1="160" y1="162" x2="600" y2="162" stroke="#5A1E96" stroke-width="7" stroke-linecap="butt"/>
<circle cx="160" cy="162" r="7" fill="#5A1E96" stroke="#5A1E96" stroke-width="2"/>
<circle cx="600" cy="162" r="7" fill="#fff" stroke="#5A1E96" stroke-width="2"/>
<circle cx="380" cy="162" r="4" fill="#1F2A28" stroke="#1F2A28" stroke-width="2"/>
<g stroke="#5B6664" stroke-width="1.4" fill="none"><line x1="380" y1="128" x2="596" y2="128"/><line x1="380" y1="128" x2="164" y2="128"/></g>
<text x="490" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >R = 4</tspan></text>
<text x="270" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >R = 4</tspan></text>
<text x="380" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >center 1</tspan></text>
<text x="160" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5A1E96" text-anchor="middle" font-weight="bold"><tspan >x = −3: Σ (−1)ⁿ/n converges</tspan></text>
<text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="middle" font-weight="bold"><tspan >x = 5: Σ 1/n diverges</tspan></text>
<text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >diverges</tspan></text>
<text x="677" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >diverges</tspan></text>
<text x="50" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >Σ (x − 1)ⁿ/(n·4ⁿ): the ratio test gives |x − 1| &lt; 4; each endpoint is tested on its own</tspan></text>
<text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >Interval of convergence [−3, 5): filled dot = included, open dot = left out.</tspan></text>
</svg>
