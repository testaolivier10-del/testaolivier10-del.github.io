<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="eulers-method-steps-t eulers-method-steps-d">
<title id="eulers-method-steps-t">Two Euler steps beside the true solution curve</title>
<desc id="eulers-method-steps-d">The slope field of dy/dx = y for x from −0.25 to 1.25, with short gray segments that get steeper as y increases. The solution through (0, 1), y = e to the x, is drawn in blue. Two green Euler steps of size 0.5 start at (0, 1): the first follows slope 1 to (0.5, 1.5); the second follows slope 1.5 to (1, 2.25). The true value at x = 1 is e, about 2.718, marked in blue above the last green point. Because the solution is concave up, each straight step falls below the curve, so the Euler estimate 2.25 is an underestimate.</desc>
<rect width="760" height="470" fill="#fff"/>
