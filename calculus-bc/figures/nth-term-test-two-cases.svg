<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="nth-term-test-two-cases-t nth-term-test-two-cases-d">
<title id="nth-term-test-two-cases-t">What the nth term test can and cannot tell you</title>
<desc id="nth-term-test-two-cases-d">Two plots for n = 1 to 15, with blue bars for the terms and vermillion dots for the partial sums. Left: a sub n = n/(2n + 1); the bars level off near 1/2, not 0, and the partial sums climb by about 1/2 each step, past 7 by n = 15: the series diverges by the nth term test. Right: a sub n = 1/n; the bars shrink toward 0, yet the partial sums keep growing, past 3.3 by n = 15; terms approaching 0 do not settle the question, so the nth term test says nothing.</desc>
