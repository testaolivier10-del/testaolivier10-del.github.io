<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="parametric-arc-length-cycloid-t parametric-arc-length-cycloid-d">
<title id="parametric-arc-length-cycloid-t">One arch of the path x = t minus sin t, y = 1 minus cos t</title>
<desc id="parametric-arc-length-cycloid-d">One arch of the path x = t minus sin t, y = 1 minus cos t for t from 0 to 2 pi: it starts at the origin, rises to a highest point of height 2 above x = pi, and comes back down to (2 pi, 0), with arrows showing it is traced left to right. A dashed wheel of radius 1 is drawn at t = 2 with the traced point on its rim marked.</desc>
