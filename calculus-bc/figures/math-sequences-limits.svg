<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="math-sequences-limits-t math-sequences-limits-d">
<title id="math-sequences-limits-t">A sequence that converges and one that diverges</title>
<desc id="math-sequences-limits-d">Two plots of terms against n for n = 1 to 12, one dot per term. Left: a sub n = 1 + (−1) to the n over n; the dots alternate above and below the dashed line at height 1 and close in on it, so the sequence converges to 1. Right: b sub n = (−1) to the n times n over (n + 1); the dots jump between values near 1 and near −1 and never settle, so the sequence diverges.</desc>
