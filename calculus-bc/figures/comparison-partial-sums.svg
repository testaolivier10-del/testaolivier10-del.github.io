<circle cx="392" cy="295" r="4.5" fill="#5A1E96" stroke="#5A1E96" stroke-width="2"/><text x="412" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >partial sums of Σ 1/n²</tspan></text><circle cx="392" cy="317" r="4.5" fill="#fff" stroke="#0072B2" stroke-width="2"/><text x="412" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >partial sums of Σ 1/(n² + 1)</tspan></text>
<text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >Smaller positive terms, smaller partial sums: both stay under the same ceiling.</tspan></text>
<text x="70" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >Each term 1/(n² + 1) is below 1/n², so every partial sum of the lower series is below π²/6. It converges.</tspan></text>
