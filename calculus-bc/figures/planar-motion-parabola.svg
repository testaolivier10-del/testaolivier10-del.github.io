<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="planar-motion-parabola-t planar-motion-parabola-d">
<title id="planar-motion-parabola-t">Position, velocity, displacement and distance for r(t) = ⟨2t, 4t − t²⟩</title>
<desc id="planar-motion-parabola-d">The path r(t) = 2t, 4t minus t squared for t from 0 to 4, an arch from (0, 0) up to (4, 4) and down to (8, 0), traced left to right. A dashed gray position vector goes from the origin to (2, 3), the point at t = 1. From that point a blue velocity vector 2, 2 is drawn; its length, the speed, is 2 root 2. A vermillion displacement vector 8, 0 runs from the start to the end, length 8, while the distance along the path, the integral of speed, is about 11.83.</desc>
