<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="arc-length-chords-t arc-length-chords-d">
<title id="arc-length-chords-t">Chords approximating the length of a curve</title>
<desc id="arc-length-chords-d">The curve y = (2/3)x to the 3/2 from x = 0 to x = 3, drawn in violet, rising from (0, 0) to (3, 2√3), about (3, 3.464). Three blue dashed chords join the points at x = 0, 1, 2 and 3, each with a dotted right triangle showing its run and rise. The chord lengths are 1.202, 1.577 and 1.869, a total of 4.647, a little less than the curve's length 14/3, about 4.667. Each chord is the hypotenuse √((Δx)² + (Δy)²); with more chords the total becomes the integral of √(1 + (dy/dx)²) dx, which here is the integral from 0 to 3 of √(1 + x) dx = 14/3.</desc>
