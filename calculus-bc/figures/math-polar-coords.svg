<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="math-polar-coords-t math-polar-coords-d">
<title id="math-polar-coords-t">A point in polar coordinates and its x and y</title>
<desc id="math-polar-coords-d">A polar grid with circles of radius 1 to 4 and rays every π/6. Point P has r = 3 and θ = π/3: a segment of length 3 leaves the pole at angle π/3. Its horizontal leg is x = r cos θ = 1.5 and its vertical leg is y = r sin θ = 3√3/2, about 2.598. Point Q has r = −2 and θ = π/4: it lies 2 units from the pole on the ray opposite to θ = π/4, at x = −√2, y = −√2. A side panel lists x = r cos θ, y = r sin θ and r² = x² + y².</desc>
<rect width="760" height="470" fill="#fff"/>
<g stroke="#E3E6E5" stroke-width="1"><circle cx="250" cy="245" r="48" fill="none"/><circle cx="250" cy="245" r="96" fill="none"/><circle cx="250" cy="245" r="144" fill="none"/><circle cx="250" cy="245" r="192" fill="none"/><line x1="250" y1="245" x2="454" y2="245"/><line x1="250" y1="245" x2="426.67" y2="143"/><line x1="250" y1="245" x2="352" y2="68.33"/><line x1="250" y1="245" x2="250" y2="41"/><line x1="250" y1="245" x2="148" y2="68.33"/><line x1="250" y1="245" x2="73.33" y2="143"/><line x1="250" y1="245" x2="46" y2="245"/><line x1="250" y1="245" x2="73.33" y2="347"/><line x1="250" y1="245" x2="148" y2="421.67"/><line x1="250" y1="245" x2="250" y2="449"/><line x1="250" y1="245" x2="352" y2="421.67"/><line x1="250" y1="245" x2="426.67" y2="347"/></g>
<g stroke="#1F2A28" stroke-width="1.4"><line x1="38.8" y1="245" x2="461.2" y2="245"/><line x1="250" y1="456.2" x2="250" y2="33.8"/></g><text x="298" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >1</tspan></text><text x="346" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >2</tspan></text><text x="394" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >3</tspan></text><text x="442" y="261" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >4</tspan></text><text x="442.05" y="139.12" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >π/6</tspan></text><text x="360.88" y="57.95" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >π/3</tspan></text><text x="250" y="28.24" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >π/2</tspan></text><text x="139.12" y="57.95" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >2π/3</tspan></text><text x="57.95" y="139.12" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >5π/6</tspan></text><text x="57.95" y="360.88" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >7π/6</tspan></text><text x="250" y="471.76" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >3π/2</tspan></text><text x="442.05" y="360.88" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >11π/6</tspan></text>
<line x1="250" y1="245" x2="322" y2="120.29" stroke="#5A1E96" stroke-width="3" stroke-linecap="round"/>
<line x1="322" y1="245" x2="322" y2="120.29" stroke="#0072B2" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
<line x1="250" y1="245" x2="322" y2="245" stroke="#0072B2" stroke-width="3.2" stroke-linecap="round"/>
<path d="M284 245 A34 34 0 0 0 267 215.56" fill="none" stroke="#5A1E96" stroke-width="1.6"/>
<text x="296" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A1E96" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >θ = π/3</tspan></text>
<circle cx="322" cy="120.29" r="5" fill="#5A1E96" stroke="#5A1E96" stroke-width="2"/>
<text x="332" y="112.29" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#5A1E96" text-anchor="start" font-weight="bold" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >P (r = 3, θ = π/3)</tspan></text>
<text x="270" y="176.65" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A1E96" text-anchor="end" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >r = 3</tspan></text>
<text x="286" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#0072B2" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >x = r cos θ = 1.5</tspan></text>
<text x="330" y="204.65" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#0072B2" text-anchor="start" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >y = r sin θ ≈ 2.598</tspan></text>
<line x1="250" y1="245" x2="392.55" y2="102.45" stroke="#D55E00" stroke-width="1.6" stroke-dasharray="3 5" stroke-linecap="round"/>
<line x1="250" y1="245" x2="182.12" y2="312.88" stroke="#D55E00" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="182.12" cy="312.88" r="5" fill="#D55E00" stroke="#D55E00" stroke-width="2"/>
<text x="174.12" y="334.88" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >Q (r = −2, θ = π/4)</tspan></text>
<text x="520" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >From polar to rectangular</tspan></text>
<text x="520" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0072B2" text-anchor="start" font-weight="normal"><tspan >x = r cos θ,  y = r sin θ</tspan></text>
<text x="520" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0072B2" text-anchor="start" font-weight="normal"><tspan >r² = x² + y²</tspan></text>
<text x="520" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan ></tspan></text>
<text x="520" y="166" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#5A1E96" text-anchor="start" font-weight="bold"><tspan >Point P</tspan></text>
<text x="520" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >go 3 units along the ray θ = π/3</tspan></text>
<text x="520" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >x = 3 cos(π/3) = 1.5</tspan></text>
<text x="520" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >y = 3 sin(π/3) = 3√3/2</tspan></text>
<text x="520" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan ></tspan></text>
<text x="520" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >Point Q: r is negative</tspan></text>
<text x="520" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >face the ray θ = π/4, then walk</tspan></text>
<text x="520" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >2 units backward, through the pole</tspan></text>
<text x="520" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >x = −2 cos(π/4) = −√2</tspan></text>
<text x="520" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >y = −2 sin(π/4) = −√2</tspan></text>
</svg>
