<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="polar-derivatives-tangents-t polar-derivatives-tangents-d">
<title id="polar-derivatives-tangents-t">Tangent lines to the cardioid r = 2 + 2 cos θ</title>
<desc id="polar-derivatives-tangents-d">The cardioid r = 2 + 2 cos θ on a polar grid. At θ = π/2 the point is (0, 2) and the tangent line, drawn in blue, has slope 1: there r = 2, dr/dθ = −2, dx/dθ = −2 and dy/dθ = −2, so dy/dx = 1; since dr/dθ is negative while r is positive, the point is moving toward the pole. At θ = π/3 the point is (3/2, 3√3/2), the top of the upper half, where the tangent, drawn in vermillion, is horizontal: dy/dθ = 0 and dx/dθ is not 0.</desc>
