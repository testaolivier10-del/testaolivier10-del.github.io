<text x="470" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >dx/dθ = −2,  dy/dθ = −2</tspan></text>
<text x="470" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >dy/dx = 1, at the point (0, 2)</tspan></text>
<text x="470" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >dr/dθ &lt; 0 with r &gt; 0: the point</tspan></text>
<text x="470" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >is moving toward the pole</tspan></text>
<text x="470" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan ></tspan></text>
<text x="470" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >At θ = π/3:  r = 3,  dr/dθ = −√3</tspan></text>
<text x="470" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >dy/dθ = 0 and dx/dθ ≠ 0</tspan></text>
<text x="470" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >a horizontal tangent, the top</tspan></text>
