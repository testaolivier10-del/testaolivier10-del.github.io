<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" aria-labelledby="parametric-derivatives-path-t parametric-derivatives-path-d">
<title id="parametric-derivatives-path-t">The path x(t) = t cubed minus 3t, y(t) = 4 minus t squared</title>
<desc id="parametric-derivatives-path-d">The path of x(t) = t cubed minus 3t, y(t) = 4 minus t squared for t from -2 to 2. It starts at (-2, 0) when t = -2, rises to the right, turns back to the left near (2, 3), passes over the top at (0, 4), turns again near (-2, 3) and comes down to (2, 0) when t = 2, crossing its own earlier path on the way. Arrows show the direction of increasing t. The point where t = -1, (2, 3), is marked in blue and the point where t = 2, (2, 0), in vermillion.</desc>
