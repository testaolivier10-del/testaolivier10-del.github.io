<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" role="img" aria-labelledby="integration-flowchart-t integration-flowchart-d">
<title id="integration-flowchart-t">A decision path for choosing an antidifferentiation technique, with the two BC questions</title>
<desc id="integration-flowchart-d">A flowchart of six questions asked in order, each with a yes arrow to a technique. 1: Is it a basic form, or a sum of basic forms after rewriting powers? Yes: basic rules (power, ln absolute x, e to the x, sine, cosine, secant squared, 1 over 1 + x squared). No: 2: Is there an inside function u whose derivative is also a factor? Yes: substitution, with du and new limits. No: 3: Is it rational with the top degree at least the bottom degree? Yes: long division first. No: 4: Is there a quadratic on the bottom with no real zeros? Yes: complete the square, then arctan. No: 5 (BC only): Is it a product with a factor that gets simpler when differentiated? Yes: integration by parts, with that factor as u; a logarithm or inverse tangent goes in u. No: 6 (BC only): Does the bottom factor into distinct linear factors? Yes: linear partial fractions, A over x minus a plus B over x minus b, then logarithms. If none fits, rewrite the integrand and start again.</desc>
<rect width="760" height="780" fill="#fff"/>
<text x="380" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A28" text-anchor="middle" font-weight="bold"><tspan >Choosing a technique: ask the questions in order</tspan></text>
<rect x="40" y="60" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="91.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >1. Is it a basic form, or a sum of</tspan></text><text x="205" y="110.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >basic forms after rewriting powers?</tspan></text>
<rect x="450" y="60" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="91.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Basic rules: power, ln|x|, eˣ,</tspan></text><text x="590" y="110.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >sin, cos, sec², 1/(1 + x²)</tspan></text>
<line x1="370" y1="96" x2="441" y2="96" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,96 441,100.5 441,91.5" fill="#1F2A28"/><text x="410" y="89" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="132" x2="205" y2="161" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,170 200.5,161 209.5,161" fill="#1F2A28"/><text x="213" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="170" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="201.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >2. Is there an inside function u</tspan></text><text x="205" y="220.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >whose derivative is also a factor?</tspan></text>
<rect x="450" y="170" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="201.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Substitution: let u = inside,</tspan></text><text x="590" y="220.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >du = u′ dx; change the limits</tspan></text>
<line x1="370" y1="206" x2="441" y2="206" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,206 441,210.5 441,201.5" fill="#1F2A28"/><text x="410" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="242" x2="205" y2="271" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,280 200.5,271 209.5,271" fill="#1F2A28"/><text x="213" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="280" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="311.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >3. Rational, and the top has degree</tspan></text><text x="205" y="330.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >≥ the bottom’s degree?</tspan></text>
<rect x="450" y="280" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="311.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Long division first, then</tspan></text><text x="590" y="330.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >basic rules or substitution</tspan></text>
<line x1="370" y1="316" x2="441" y2="316" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,316 441,320.5 441,311.5" fill="#1F2A28"/><text x="410" y="309" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="352" x2="205" y2="381" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,390 200.5,381 209.5,381" fill="#1F2A28"/><text x="213" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="390" width="330" height="72" rx="6" fill="#FCE8EE" stroke="#8C1036" stroke-width="1.6"/><text x="205" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >4. A quadratic on the bottom</tspan></text><text x="205" y="440.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >with no real zeros?</tspan></text>
<rect x="450" y="390" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="421.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Complete the square, then</tspan></text><text x="590" y="440.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >arctan (with substitution)</tspan></text>
<line x1="370" y1="426" x2="441" y2="426" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,426 441,430.5 441,421.5" fill="#1F2A28"/><text x="410" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="462" x2="205" y2="491" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,500 200.5,491 209.5,491" fill="#1F2A28"/><text x="213" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="40" y="500" width="330" height="72" rx="6" fill="#F1E7FA" stroke="#5A1E96" stroke-width="1.6"/><text x="205" y="531.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >5. A product with a factor that gets</tspan></text><text x="205" y="550.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >simpler when differentiated?</tspan></text>
<rect x="450" y="500" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="531.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Integration by parts: u = that</tspan></text><text x="590" y="550.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >factor (ln or arctan goes in u)</tspan></text>
<line x1="370" y1="536" x2="441" y2="536" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,536 441,540.5 441,531.5" fill="#1F2A28"/><text x="410" y="529" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<line x1="205" y1="572" x2="205" y2="601" stroke="#1F2A28" stroke-width="1.6"/><polygon points="205,610 200.5,601 209.5,601" fill="#1F2A28"/><text x="213" y="596" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="bold"><tspan >no</tspan></text>
<rect x="10" y="524" width="26" height="24" rx="4" fill="#5A1E96"/><text x="23" y="541" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold"><tspan >BC</tspan></text>
<rect x="40" y="610" width="330" height="72" rx="6" fill="#F1E7FA" stroke="#5A1E96" stroke-width="1.6"/><text x="205" y="641.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >6. Does the bottom factor into</tspan></text><text x="205" y="660.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >distinct linear factors?</tspan></text>
<rect x="450" y="610" width="280" height="72" rx="12" fill="#fff" stroke="#009E73" stroke-width="1.8"/><text x="590" y="641.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >Linear partial fractions:</tspan></text><text x="590" y="660.5" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#1F2A28" text-anchor="middle" font-weight="normal"><tspan >A/(x − a) + B/(x − b), then ln</tspan></text>
<line x1="370" y1="646" x2="441" y2="646" stroke="#1F2A28" stroke-width="1.6"/><polygon points="450,646 441,650.5 441,641.5" fill="#1F2A28"/><text x="410" y="639" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold"><tspan >yes</tspan></text>
<rect x="10" y="634" width="26" height="24" rx="4" fill="#5A1E96"/><text x="23" y="651" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold"><tspan >BC</tspan></text>
<text x="40" y="722" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >If none fits, rewrite the integrand (expand, split a fraction, use an identity) and start again.</tspan></text>
<text x="40" y="744" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5A1E96" text-anchor="start" font-weight="bold"><tspan >Questions 5 and 6 are on the BC exam only.</tspan></text>
</svg>
