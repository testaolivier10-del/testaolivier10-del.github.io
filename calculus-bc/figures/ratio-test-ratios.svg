<g stroke="#1F2A28" stroke-width="1.6"><line x1="70" y1="350" x2="638" y2="350"/><line x1="70" y1="350" x2="70" y2="62"/></g><polygon fill="#1F2A28" points="644,350 635,346 635,354"/><polygon fill="#1F2A28" points="70,56 66,65 74,65"/><line x1="105" y1="346" x2="105" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="105" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >1</tspan></text><line x1="140" y1="346" x2="140" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="140" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >2</tspan></text><line x1="175" y1="346" x2="175" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="175" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >3</tspan></text><line x1="210" y1="346" x2="210" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="210" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >4</tspan></text><line x1="245" y1="346" x2="245" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="245" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >5</tspan></text><line x1="280" y1="346" x2="280" y2="354" stroke="#1F2A28" stroke-width="1.2"/><text x="280" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor