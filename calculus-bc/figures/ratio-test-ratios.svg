<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="ratio-test-ratios-t ratio-test-ratios-d">
<title id="ratio-test-ratios-t">Ratios of consecutive terms approach a limit below 1</title>
<desc id="ratio-test-ratios-d">Dots at height (n + 1) squared over 3 n squared for n = 1 to 15, the ratio of consecutive terms of the series of n squared over 3 to the n. The first dot is at 4/3, above a solid line at 1; the rest fall below it and approach a dashed line at 1/3.</desc>
