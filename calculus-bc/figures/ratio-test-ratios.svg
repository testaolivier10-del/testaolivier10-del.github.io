width="1.2"/><text x="62" y="74.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6664" text-anchor="end" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >1.5</tspan></text><text x="646" y="355" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan font-style="italic">n</tspan></text><text x="78" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan font-style="italic">a</tspan><tspan dy="4.8" font-size="10.2" font-style="italic">n+1</tspan><tspan dy="-4.8" font-size="15"> </tspan><tspan > / </tspan><tspan font-style="italic">a</tspan><tspan dy="4.8" font-size="10.2" font-style="italic">n</tspan><tspan dy="-4.8" font-size="15"> </tspan></text>
