<text x="630" y="307.78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="end" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >limit 1/3</tspan></text>
<text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >Ratios of consecutive terms of Σ n²/3ⁿ approach 1/3</tspan></text>
<text x="70" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >The first ratio, 4/3, is above 1; only the limit matters. The limit 1/3 is below 1, so the series converges.</tspan></text>
</svg>
