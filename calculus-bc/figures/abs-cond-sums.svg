<text x="70" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >After 20 terms Σ 1/n has reached 3.60 and is still growing; the alternating series stays near 0.693.</tspan></text>
