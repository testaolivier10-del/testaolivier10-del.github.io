<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="abs-cond-sums-t abs-cond-sums-d">
<title id="abs-cond-sums-t">A conditionally convergent series and the series of its absolute values</title>
<desc id="abs-cond-sums-d">Partial sums for N = 1 to 20. Open dots: the harmonic series, the sum of 1 over n, climbing steadily to 3.60 with no ceiling. Filled dots: the alternating harmonic series, zigzagging around a dashed line at about 0.693. The alternating series converges but the series of absolute values diverges: conditional convergence.</desc>
