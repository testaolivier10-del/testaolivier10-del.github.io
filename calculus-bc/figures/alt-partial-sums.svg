<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="alt-partial-sums-t alt-partial-sums-d">
<title id="alt-partial-sums-t">Partial sums of an alternating series zigzag toward its sum</title>
<desc id="alt-partial-sums-d">Partial sums S sub N of the series 1 minus 1/2 plus 1/3 minus 1/4 and so on, for N = 1 to 14, joined by a zigzag line. Odd partial sums lie above a dashed line at about 0.693 and even ones below it; the swings shrink as N grows, so the partial sums close in on the sum.</desc>
