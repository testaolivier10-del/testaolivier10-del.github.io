<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="parametric-derivatives-tangents-t parametric-derivatives-tangents-d">
<title id="parametric-derivatives-tangents-t">Slopes on a parametric curve depend on t, not only on the point</title>
<desc id="parametric-derivatives-tangents-d">The curve x = t squared, y = t cubed minus 3t for t from about -2 to 2, a loop that crosses itself at (3, 0), with arrows showing the direction of increasing t. At (3, 0) two dashed tangent lines are drawn: slope square root of 3 when t = square root of 3, and slope minus square root of 3 when t = minus square root of 3. Short horizontal tangent segments mark (1, 2) at t = -1 and (1, -2) at t = 1, and a vertical tangent marks the origin at t = 0.</desc>
