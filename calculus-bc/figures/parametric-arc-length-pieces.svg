<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="parametric-arc-length-pieces-t parametric-arc-length-pieces-d">
<title id="parametric-arc-length-pieces-t">Arc length from many short straight pieces</title>
<desc id="parametric-arc-length-pieces-d">A curved path is replaced by five dashed straight segments joining points on it. On one segment a right triangle is drawn with a horizontal leg delta x, a vertical leg delta y and the segment delta s as hypotenuse. Beside it: delta s is about the square root of delta x squared plus delta y squared; delta x is about x prime of t times delta t and delta y about y prime of t times delta t, so delta s is about the square root of x prime squared plus y prime squared, times delta t. Adding the pieces and shrinking delta t gives L as the integral of the square root of x prime of t squared plus y prime of t squared, dt.</desc>
