<text xml:space="preserve" x="520" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >One piece:</tspan></text>
<text xml:space="preserve" x="520" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >Δs ≈ √((Δx)² + (Δy)²)</tspan></text>
<text xml:space="preserve" x="520" y="175" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >Δx ≈ x′(t) Δt,  Δy ≈ y′(t) Δt</tspan></text>
<text xml:space="preserve" x="520" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >Δs ≈ √((x′(t))² + (y′(t))²) Δt</tspan></text>
<text xml:space="preserve" x="520" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A1E96" text-anchor="start" font-weight="bold"><tspan >Add the pieces, shrink Δt:</tspan></text>
<text xml:space="preserve" x="520" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5A1E96" text-anchor="start" font-weight="bold"><tspan >L = ∫ √((x′(t))² + (y′(t))²) dt</tspan></text>
<text xml:space="preserve" x="380" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >The dashed segments hug the curve; their total length approaches the length of the curve.</tspan></text>
</svg>
