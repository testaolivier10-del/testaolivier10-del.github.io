<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="p-series-partial-sums-t p-series-partial-sums-d">
<title id="p-series-partial-sums-t">Partial sums of three p-series</title>
<desc id="p-series-partial-sums-d">Partial sums of the sum of 1 over n to the p, for n = 1 to 40 and three values of p, one dot per partial sum. p = 1/2, vermillion: the sums climb steeply, 11.27 by n = 40, and grow without bound. p = 1, the harmonic series, blue: the sums climb slowly, 4.28 by n = 40, but still grow without bound. p = 2, emerald: the sums level off under the dashed line at π²/6, about 1.645. The series converges exactly when p is greater than 1.</desc>
