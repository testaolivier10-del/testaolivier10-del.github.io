<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="vector-derivatives-ellipse-t vector-derivatives-ellipse-d">
<title id="vector-derivatives-ellipse-t">Velocity vectors along the path r(t) = ⟨3 cos t, 2 sin t⟩</title>
<desc id="vector-derivatives-ellipse-d">The ellipse r(t) = 3 cos t, 2 sin t, traced counterclockwise. Blue velocity vectors, drawn at half size, start at the points where t = 0, pi/4, pi/2, pi and 3 pi/2; each is tangent to the ellipse and points counterclockwise: straight up at t = 0, straight left at t = pi/2. At t = pi/4 a vermillion acceleration vector, also half size, points from the point toward the center. The formulas are r(t) = 3 cos t, 2 sin t; v(t) = -3 sin t, 2 cos t; a(t) = -3 cos t, -2 sin t.</desc>
