<text xml:space="preserve" x="620" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan >r(t) = ⟨3 cos t, 2 sin t⟩</tspan></text>
<text xml:space="preserve" x="620" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#0072B2" text-anchor="start" font-weight="normal"><tspan >v(t) = ⟨−3 sin t, 2 cos t⟩</tspan></text>
<text xml:space="preserve" x="620" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#D55E00" text-anchor="start" font-weight="normal"><tspan >a(t) = ⟨−3 cos t, −2 sin t⟩</tspan></text>
<text xml:space="preserve" x="440" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="middle" font-weight="normal"><tspan >Each velocity vector is tangent to the path and points the way the point moves (counterclockwise).</tspan></text>
</svg>
