<text x="630" y="106.25" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="end" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >dashed line: the sum π²/12 ≈ 0.822</tspan></text>
<text x="328.89" y="292.63" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2A28" text-anchor="start" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >S₄ = 115/144 ≈ 0.7986</tspan></text>
<text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="bold"><tspan >The sum lies between S₄ and S₄ + a₅: the error is at most the first term left out.</tspan></text>
<text x="70" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5B6664" text-anchor="start" font-weight="normal"><tspan >Here |S − S₄| ≈ 0.0239, which is less than a₅ = 0.04.</tspan></text>
