<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="alt-error-band-t alt-error-band-d">
<title id="alt-error-band-t">The alternating series error bound as a band</title>
<desc id="alt-error-band-d">Partial sums of 1 minus 1/4 plus 1/9 minus 1/16 and so on, for N = 1 to 8, zigzagging around a dashed line at pi squared over 12, about 0.822. A shaded band runs from S sub 4 = 115/144, about 0.7986, up to S sub 4 plus the next term, 1/25. The sum lies inside the band: the error of S sub 4 is about 0.0239, less than 1/25.</desc>
