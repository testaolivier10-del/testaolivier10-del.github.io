"normal" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"><tspan >1</tspan></text><text x="646" y="365" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan font-style="italic">N</tspan></text><text x="78" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A28" text-anchor="start" font-weight="normal"><tspan font-style="italic">S</tspan><tspan dy="4.8" font-size="10.2" font-style="italic">N</tspan><tspan dy="-4.8" font-size="15"> </tspan></text>
