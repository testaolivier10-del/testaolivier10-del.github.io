<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-labelledby="planar-motion-loop-t planar-motion-loop-d">
<title id="planar-motion-loop-t">A closed path with the velocity vector drawn at t = 1</title>
<desc id="planar-motion-loop-d">The path x(t) = 4 minus t squared, y(t) = t cubed minus 4t for t from -2 to 2. It starts at the origin at t = -2, swings up and right through (3, 3), reaches (4, 0) at t = 0, swings down through (3, -3) at t = 1 and returns to the origin at t = 2, a closed loop traced clockwise. Arrows show the direction of increasing t. At the point where t = 1, (3, -3), a blue velocity vector is drawn pointing 2 units left and 1 unit down.</desc>
<rect width="600" height="680" fill="#fff"/>
