<style>
  /* The certificate itself. Themed on screen like everything else; printed
     and saved as an image, it is always paper. */
  .cert-tools{background:var(--white);border-radius:var(--radius);box-shadow:var(--lift-sm);padding:18px 20px;margin:6px 0 22px;}
  .cert-eyebrow{font:900 11px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--cink);margin:0 0 10px;}
  .cert-label{display:block;font:800 14px var(--font-ui);color:var(--ink);margin-bottom:6px;}
  .cert-input{width:100%;max-width:420px;font:600 16px var(--font-ui);padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);box-sizing:border-box;}
  .cert-hint{font:700 13px var(--font-ui);color:var(--muted);margin:6px 0 14px;}
  .cert-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .cert-actions .levl-share-row{margin:0;}
  .cert-actions .btn-outline{font-size:13.5px;padding:11px 20px;border-radius:13px;}
  .cert{background:var(--white);border-radius:var(--radius);box-shadow:var(--lift);padding:18px;margin:0 0 30px;}
  .cert__frame{border:6px solid var(--navy);outline:1px solid var(--accent);outline-offset:-14px;border-radius:6px;
    padding:clamp(28px,6vw,64px) clamp(18px,5vw,56px);text-align:center;color:var(--ink);}
  .cert__brand{font:900 17px var(--font-ui);color:var(--ink);margin:0 0 18px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .cert__brand .brand-mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;font-weight:900;}
  .cert__title{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:0 0 18px;max-width:none;}
  .cert__lead{font-weight:700;color:var(--muted);margin:0 0 6px;}
  .cert__name{font-size:clamp(26px,5vw,44px);font-weight:900;margin:0 auto 14px;padding:0 0 6px;border-bottom:2px solid var(--line);max-width:28ch;min-height:1.2em;overflow-wrap:anywhere;}
  .cert__name.is-empty{color:var(--muted);font-weight:700;}
  .cert__what{font-size:clamp(16px,2.4vw,20px);font-weight:700;margin:0 auto 14px;max-width:48ch;line-height:1.45;}
  .cert__date{font:800 15px var(--font-ui);color:var(--accent-text);margin:0 0 26px;}
  .cert__foot{font:700 12px var(--font-ui);color:var(--muted);max-width:70ch;margin:0 auto;line-height:1.5;}
  .cert-course,.cert-elsewhere{background:var(--white);border-radius:var(--radius);box-shadow:var(--lift-sm);padding:20px 22px;margin:0 0 16px;}
  .cert-course h2,.cert-elsewhere h2{font-size:19px;font-weight:900;margin:0 0 6px;}
  .cert-course p,.cert-elsewhere p{font-weight:600;color:var(--muted);line-height:1.6;max-width:66ch;margin:0 0 12px;}
  .cert-elsewhere p:last-child{margin-bottom:0;}

  /* One landscape page: the certificate and nothing else, always light. */
  @page{size:landscape;margin:12mm;}
  @media print{
    :root,:root[data-theme="dark"]{--white:#fff;--paper:#fff;--ink:#1B2A26;--muted:#526C66;--navy:#1F4A42;--accent:#127264;--accent-text:#0F5F53;--line:#D5E0DB;}
    html,body{background:#fff !important;}
    #site-header,.skip-link,.cert-tools,footer,.levl-toast,#levlAnnouncer{display:none !important;}
    .xshell{padding:0 !important;max-width:none !important;}
    .cert{box-shadow:none;padding:0;margin:0;break-inside:avoid;}
    /* Fills the page: 180mm fits inside both US Letter and A4 landscape. */
    .cert__frame{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:44px 56px;min-height:180mm;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;}
    .cert__name.is-empty{color:transparent;}
  }
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var t = document.getElementById('themeToggle');
  if(!t) return;
  t.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    try{ localStorage.setItem('nremt_theme', dark ? 'light' : 'dark'); }catch(e){}
    if(dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme','dark');
  });
});
</script>
</body>
